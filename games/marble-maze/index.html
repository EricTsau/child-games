<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>3D 迷宮滾珠</title>
<link rel="stylesheet" href="../../assets/common.css">
<style>
  html, body { height: 100%; overflow: hidden; background: #3b2a1e; }
  #gl { position: fixed; left: 0; top: 0; width: 100vw; height: 100vh; height: 100dvh; display: block; touch-action: none; }
  #msg { position: fixed; inset: 0; display: grid; place-items: center; padding: 24px; text-align: center; color: #fff4e0; font-size: 20px; font-weight: 800; z-index: 1; }
  .ol { text-shadow: 2px 2px 0 #3a2414, -2px 2px 0 #3a2414, 2px -2px 0 #3a2414, -2px -2px 0 #3a2414, 0 3px 0 #3a2414, 0 5px 8px rgba(0,0,0,.35); }

  /* ---------- 遊戲中介面 ---------- */
  #hud { position: fixed; left: 0; right: 0; top: 0; pointer-events: none; z-index: 40; display: none; }
  #hud.on { display: block; }
  #hudBar { position: absolute; left: 50%; top: 10px; transform: translateX(-50%); display: flex; align-items: center; gap: 8px; padding: 5px 14px 5px 6px;
    background: rgba(255, 248, 236, .93); border: 3px solid #fff; border-radius: 999px; box-shadow: 0 4px 0 rgba(60, 35, 15, .25); color: #5a3a22; font-weight: 900; white-space: nowrap; max-width: calc(100vw - 128px); }
  #hLv { background: var(--wc, #c9773a); color: #fff; border-radius: 999px; padding: 3px 10px; font-size: 15px; }
  #hTime { font-variant-numeric: tabular-nums; font-size: 17px; min-width: 3.6em; text-align: right; }
  #hTime.over { color: #b98a6a; }
  #hCoin { display: flex; align-items: center; gap: 4px; font-size: 17px; }
  .coin { display: inline-block; width: 17px; height: 17px; border-radius: 50%; background: radial-gradient(circle at 35% 35%, #fff6b0, #ffc21a 55%, #d88a00); border: 2px solid #9a5a00; flex: none; }
  #hCoin.all { color: #d48a00; }
  #hBalls { display: none; align-items: center; gap: 3px; font-size: 15px; }
  #hBalls.on { display: flex; }
  #hBalls i { width: 13px; height: 13px; border-radius: 50%; background: radial-gradient(circle at 35% 35%, #fff, #6cc4ff 60%, #2a6ab0); display: inline-block; }
  #hBalls i.in { background: radial-gradient(circle at 35% 35%, #fff, #7bd88f 60%, #2f8a48); }
  #hName { position: absolute; left: 50%; top: 52px; transform: translateX(-50%); color: #fff; font-weight: 900; font-size: 14px; white-space: nowrap; opacity: .92; }

  #pauseBtn { position: fixed; right: 12px; top: 64px; width: 44px; height: 44px; border-radius: 50%; border: 3px solid #fff; background: rgba(90, 58, 34, .7); z-index: 60; display: none; place-items: center; cursor: pointer; box-shadow: 0 4px 0 rgba(0,0,0,.25); padding: 0; }
  #pauseBtn.on { display: grid; }
  #pauseBtn i { display: block; width: 14px; height: 16px; border-left: 5px solid #fff; border-right: 5px solid #fff; }
  #restartBtn { position: fixed; right: 12px; top: 116px; width: 44px; height: 44px; border-radius: 50%; border: 3px solid #fff; background: rgba(90, 58, 34, .7); z-index: 60; display: none; place-items: center; cursor: pointer; box-shadow: 0 4px 0 rgba(0,0,0,.25); padding: 0; }
  #restartBtn.on { display: grid; }
  #restartBtn svg { width: 24px; height: 24px; }

  #joy { position: fixed; z-index: 30; width: 132px; height: 132px; margin: -66px 0 0 -66px; border-radius: 50%; border: 3px solid rgba(255,255,255,.75); background: radial-gradient(circle, rgba(255,255,255,.08), rgba(255,255,255,.22)); pointer-events: none; display: none; box-shadow: 0 0 0 2px rgba(60,35,15,.25); }
  #joy.on { display: block; }
  #joy::before, #joy::after { content: ''; position: absolute; left: 50%; top: 50%; background: rgba(255,255,255,.35); }
  #joy::before { width: 2px; height: 100%; top: 0; margin-left: -1px; }
  #joy::after { height: 2px; width: 100%; left: 0; margin-top: -1px; }
  #knob { position: absolute; left: 50%; top: 50%; width: 52px; height: 52px; margin: -26px 0 0 -26px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #fff, #ffe3b8 60%, #e8a860); border: 3px solid #fff; box-shadow: 0 4px 10px rgba(0,0,0,.3); }

  #banner { position: fixed; left: 0; right: 0; top: 26%; z-index: 50; text-align: center; color: #fff; font-weight: 900; font-size: 36px; pointer-events: none; opacity: 0; transform: scale(.7); transition: opacity .25s, transform .3s cubic-bezier(.2,1.6,.4,1); padding: 0 16px; }
  #banner.on { opacity: 1; transform: scale(1); }
  #banner small { display: block; font-size: 18px; margin-top: 6px; }
  #tip { position: fixed; left: 50%; bottom: calc(14px + env(safe-area-inset-bottom)); transform: translateX(-50%) translateY(20px); z-index: 50; width: max-content; max-width: min(520px, calc(100vw - 32px));
    background: rgba(255, 248, 236, .95); color: #5a3a22; border: 3px solid #fff; border-radius: 18px; padding: 8px 14px; font-weight: 800; font-size: 16px; line-height: 1.4; text-align: center;
    box-shadow: 0 4px 0 rgba(60,35,15,.25); opacity: 0; pointer-events: none; transition: opacity .3s, transform .3s; }
  #tip.on { opacity: 1; transform: translateX(-50%) translateY(0); }
  #pop { position: fixed; left: 0; top: 0; z-index: 45; pointer-events: none; color: #fff; font-weight: 900; font-size: 20px; opacity: 0; white-space: nowrap; transform: translate(-50%, -50%); }
  #pop.on { animation: popUp .9s ease-out forwards; }
  @keyframes popUp { 0% { opacity: 0; transform: translate(-50%, -30%) scale(.6); } 20% { opacity: 1; transform: translate(-50%, -60%) scale(1.1); } 70% { opacity: 1; } 100% { opacity: 0; transform: translate(-50%, -140%) scale(1); } }

  /* ---------- 選單 ---------- */
  #menu { position: fixed; inset: 0; z-index: 9000; display: none; overflow: hidden; }
  #menu.on { display: block; }
  #menu.dim { background: rgba(40, 22, 10, .45); }
  .scr { display: none; position: absolute; inset: 0; padding: 66px 14px calc(14px + env(safe-area-inset-bottom)); flex-direction: column; align-items: center; justify-content: center; gap: 12px; }
  .scr.on { display: flex; }
  .panel { background: linear-gradient(180deg, #fffaf0, #fff0dc); border: 4px solid #fff; border-radius: 26px; box-shadow: 0 14px 40px rgba(40, 20, 5, .45); padding: 14px 16px 16px; width: min(520px, 100%); color: #5a3a22;
    display: flex; flex-direction: column; max-height: 100%; min-height: 0; }
  .ptitle { font-size: 26px; font-weight: 900; text-align: center; margin: 0 0 8px; }
  .psub { text-align: center; font-size: 15px; margin: -4px 0 8px; color: #9a7a5a; font-weight: 700; }
  .pbody { overflow-y: auto; overflow-x: hidden; min-height: 0; flex: 1 1 auto; -webkit-overflow-scrolling: touch; padding: 2px 2px 14px; }
  .prow { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-top: 12px; flex: none; }
  .kg-btn.sm { font-size: 17px; padding: 10px 18px; }
  .kg-btn.brown { background: linear-gradient(180deg, #e8b07a 0%, #b8743e 100%); box-shadow: 0 5px 0 #7a4a22, 0 10px 18px rgba(122, 74, 34, .35); }
  .kg-btn[disabled] { opacity: .5; pointer-events: none; }

  .logo { text-align: center; line-height: 1; filter: drop-shadow(0 6px 0 rgba(58, 36, 20, .55)); }
  .logo1 { font-size: clamp(44px, 12.5vw, 80px); font-weight: 900; letter-spacing: 2px; color: #ffe08a; text-shadow: 3px 3px 0 #b8622a, -3px 3px 0 #b8622a, 3px -3px 0 #b8622a, -3px -3px 0 #b8622a, 0 7px 0 #6a3414; }
  .logo1 b { color: #9ee3ff; }
  .logo2 { margin-top: 10px; font-size: clamp(16px, 4.6vw, 22px); font-weight: 900; letter-spacing: 4px; display: inline-block; background: #5a3a22; color: #fff; padding: 6px 14px 6px 18px; border-radius: 999px; border: 3px solid #fff; }
  #sTitle { justify-content: space-between; }
  .tbot { display: flex; flex-direction: column; align-items: center; gap: 10px; width: min(380px, 100%); }
  .tbtns { display: flex; gap: 10px; width: 100%; }
  .tbtns .kg-btn { flex: 1; }
  .mbtn { display: flex; flex-direction: column; align-items: center; gap: 1px; padding: 10px 14px 11px; }
  .mbtn b { font-size: 23px; } .mbtn small { font-size: 13px; font-weight: 700; opacity: .92; }
  .chip { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; justify-content: center; }
  .tog { font-family: var(--kg-font); font-weight: 800; font-size: 15px; border: 3px solid #fff; border-radius: 999px; padding: 7px 13px; background: rgba(90, 58, 34, .78); color: #fff; cursor: pointer; }
  .panel .tog { background: #8a6040; }
  .tog i { font-style: normal; color: #9dffa8; margin-left: 4px; }
  .tog.off i { color: #ffb0a0; }
  .stars { display: inline-flex; align-items: center; gap: 4px; background: rgba(90, 58, 34, .78); color: #fff; border: 3px solid #fff; border-radius: 999px; padding: 4px 12px 4px 8px; font-weight: 900; }
  .st { display: inline-block; width: 18px; height: 18px; background: #ffd23a; clip-path: polygon(50% 0, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%); flex: none; }
  .st.off { background: rgba(120, 90, 60, .35); }
  .hint { color: #fff; font-size: 13px; font-weight: 700; text-align: center; text-shadow: 0 1px 3px rgba(0,0,0,.7); }

  /* 選關 */
  .wtabs { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-bottom: 8px; flex: none; }
  .wtab { font-family: var(--kg-font); border: 3px solid #f1dcc0; background: #fff; border-radius: 16px; padding: 6px 2px 5px; cursor: pointer; color: #6a4a2a; font-weight: 900; font-size: 14px; display: flex; flex-direction: column; align-items: center; gap: 3px; position: relative; }
  .wtab .wi { width: 34px; height: 34px; border-radius: 10px; border: 2px solid rgba(0,0,0,.12); }
  .wtab small { font-size: 11px; color: #a88a6a; display: flex; align-items: center; gap: 2px; }
  .wtab small .st { width: 11px; height: 11px; }
  .wtab.sel { border-color: var(--wc); background: #fff7ea; box-shadow: 0 4px 0 var(--wc); transform: translateY(-2px); }
  .wtab.lock { opacity: .5; }
  .wdesc { text-align: center; font-weight: 800; font-size: 14px; color: #9a7a5a; margin: 2px 0 8px; flex: none; }
  .lgrid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; }
  .lv { font-family: var(--kg-font); border: 3px solid #f1dcc0; background: #fff; border-radius: 16px; padding: 6px 2px 5px; cursor: pointer; color: #5a3a22; display: flex; flex-direction: column; align-items: center; gap: 3px; min-height: 64px; justify-content: center; }
  .lv b { font-size: 22px; line-height: 1; }
  .lv .ss { display: flex; gap: 1px; } .lv .st { width: 13px; height: 13px; }
  .lv.lock { background: #efe4d6; color: #b8a08a; cursor: default; }
  .lv.cur { border-color: var(--wc); box-shadow: 0 4px 0 var(--wc); }
  .lock-i { width: 16px; height: 18px; position: relative; display: inline-block; }
  .lock-i::before { content: ''; position: absolute; left: 3px; top: 0; width: 10px; height: 10px; border: 3px solid #b8a08a; border-bottom: 0; border-radius: 6px 6px 0 0; box-sizing: border-box; }
  .lock-i::after { content: ''; position: absolute; left: 0; bottom: 0; width: 16px; height: 10px; background: #b8a08a; border-radius: 3px; }
  .lname { text-align: center; font-weight: 800; font-size: 13px; color: #9a7a5a; margin-top: 8px; min-height: 18px; flex: none; }

  /* 結算 */
  .wstars { display: flex; justify-content: center; gap: 10px; margin: 2px 0 8px; flex: none; }
  .wstars .st { width: 58px; height: 58px; transform: scale(0); }
  .wstars .st.show { animation: starIn .45s cubic-bezier(.2,1.7,.4,1) forwards; }
  @keyframes starIn { 0% { transform: scale(0) rotate(-60deg); } 100% { transform: scale(1) rotate(0); } }
  .wlist { display: grid; gap: 6px; font-weight: 800; font-size: 15px; }
  .wrow { display: flex; align-items: center; gap: 8px; background: #fff; border-radius: 12px; padding: 6px 10px; border: 2px solid #f3e2cc; }
  .wrow .st { width: 18px; height: 18px; }
  .wrow span { flex: 1; } .wrow em { font-style: normal; color: #b07840; font-variant-numeric: tabular-nums; }
  .wrec { text-align: center; color: #e8457a; font-weight: 900; margin-top: 6px; }
  .wrec:empty { display: none; }
  .ptog { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; margin-top: 4px; }
  .pbtns { display: flex; flex-direction: column; gap: 10px; align-items: stretch; width: min(300px, 100%); margin: 0 auto; }

  @media (max-height: 560px) {
    .scr { padding-top: 10px; padding-bottom: 10px; gap: 8px; }
    .panel { padding: 10px 12px 12px; border-radius: 20px; }
    .ptitle { font-size: 21px; margin-bottom: 4px; }
    .logo1 { font-size: 46px; } .logo2 { font-size: 15px; margin-top: 6px; }
    .mbtn b { font-size: 19px; } .mbtn small { font-size: 11px; } .mbtn { padding: 6px 12px 8px; }
    .tbot { gap: 7px; }
    .lgrid { grid-template-columns: repeat(10, 1fr); gap: 5px; }
    .lv { min-height: 52px; } .lv b { font-size: 18px; } .lv .st { width: 9px; height: 9px; }
    .wtab { flex-direction: row; justify-content: center; padding: 4px; } .wtab .wi { width: 24px; height: 24px; }
    .wstars .st { width: 40px; height: 40px; }
    .wrow { padding: 3px 10px; }
    .prow { margin-top: 8px; }
    #banner { font-size: 28px; top: 20%; }
    #tip { font-size: 14px; padding: 6px 12px; bottom: calc(8px + env(safe-area-inset-bottom)); max-width: min(560px, calc(100vw - 140px)); }
    #hName { display: none; }
  }
  @media (min-aspect-ratio: 4/3) and (max-height: 560px) {
    #sTitle { flex-direction: row; align-items: flex-end; justify-content: space-between; padding: 60px 16px 14px; }
    #sTitle .logo { align-self: flex-start; text-align: left; margin-left: 50px; }
    #sTitle .tbot { width: min(340px, 46vw); }
    #sWin .panel, #sPause .panel { width: min(560px, 100%); }
    #sWin .wbody { display: grid; grid-template-columns: auto 1fr; gap: 6px 14px; align-items: center; }
    #sWin .wstars { flex-direction: column; gap: 2px; margin: 0; }
    #sWin .wstars .st { width: 34px; height: 34px; }
    #sPause .pbtns { width: 100%; flex-direction: row; flex-wrap: wrap; justify-content: center; }
    #sPause .pbtns .kg-btn { flex: 1 1 140px; }
  }
</style>

{ "imports": { "three": "../../assets/vendor/three/three.module.min.js", "three/addons/": "../../assets/vendor/three/addons/" } }

<body>
<div id="msg">3D 迷宮滾珠 載入中…</div>
<canvas id="gl" aria-label="3D 迷宮滾珠遊戲畫面"></canvas>

<div id="hud">
  <div id="hudBar"><span id="hLv">1-1</span><span id="hCoin"><i class="coin"></i><span id="hCoinN">0/3</span></span><span id="hBalls"></span><span id="hTime">0.0</span></div>
  <div id="hName" class="ol"></div>
</div>
<button id="pauseBtn" aria-label="暫停"><i></i></button>
<button id="restartBtn" aria-label="重新開始"><svg viewBox="0 0 24 24"><path d="M12 5a7 7 0 1 1-6.7 5" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round"/><path d="M2.5 6.5 5.6 11 9.6 7.6" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
<div id="joy"><div id="knob"></div></div>
<div id="banner" class="ol"></div>
<div id="tip"></div>
<div id="pop" class="ol"></div>

<div id="menu" class="on">
  <section id="sTitle" class="scr on">
    <div class="logo"><div class="logo1">3D 迷宮<b>滾珠</b></div><div class="logo2">傾斜木板 · 滾進終點洞</div></div>
    <div class="tbot">
      <div class="chip"><span class="stars"><i class="st"></i><span id="tStars">0 / 120</span></span></div>
      <div class="tbtns">
        <button class="kg-btn green mbtn" id="bPlay"><b>開始玩</b><small id="bPlaySub">第 1-1 關</small></button>
        <button class="kg-btn yellow mbtn" id="bLevels"><b>選關卡</b><small>4 個世界 40 關</small></button>
      </div>
      <div class="chip" id="tTogs"></div>
      <div class="hint">拖曳畫面或用方向鍵傾斜木板</div>
    </div>
  </section>

  <section id="sLevels" class="scr">
    <div class="panel">
      <div class="ptitle">選關卡</div>
      <div class="wtabs" id="wtabs"></div>
      <div class="wdesc" id="wdesc"></div>
      <div class="pbody"><div class="lgrid" id="lgrid"></div><div class="lname" id="lname"></div></div>
      <div class="prow"><button class="kg-btn brown sm" id="bLvBack">回標題</button></div>
    </div>
  </section>

  <section id="sPause" class="scr">
    <div class="panel">
      <div class="ptitle">暫停</div>
      <div class="psub" id="pSub"></div>
      <div class="pbody">
        <div class="pbtns">
          <button class="kg-btn green" id="bResume">繼續</button>
          <button class="kg-btn yellow" id="bRestart">重新開始</button>
          <button class="kg-btn brown" id="bPLevels">選關卡</button>
        </div>
      </div>
      <div class="ptog" id="pTogs"></div>
    </div>
  </section>

  <section id="sWin" class="scr">
    <div class="panel">
      <div class="ptitle" id="wTitle">過關！</div>
      <div class="pbody wbody">
        <div class="wstars"><i class="st off"></i><i class="st off"></i><i class="st off"></i></div>
        <div>
          <div class="wlist">
            <div class="wrow" id="wr1"><i class="st"></i><span>滾進終點</span><em id="wTime"></em></div>
            <div class="wrow" id="wr2"><i class="st"></i><span>金幣全拿</span><em id="wCoins"></em></div>
            <div class="wrow" id="wr3"><i class="st"></i><span id="wParT">時間內完成</span><em id="wPar"></em></div>
          </div>
          <div class="wrec" id="wRec"></div>
        </div>
      </div>
      <div class="prow">
        <button class="kg-btn brown sm" id="bWLevels">選關卡</button>
        <button class="kg-btn yellow sm" id="bWAgain">再玩一次</button>
        <button class="kg-btn green sm" id="bWNext">下一關</button>
      </div>
    </div>
  </section>
</div>

<script src="../../assets/common.js"></script>
<script src="../../assets/kg-music.js"></script>
<script type="module">
import * as THREE from 'three';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';

/*SIM-START*/
/* =====================================================================
 * 關卡、物理、自動駕駛（純資料與計算，不碰畫面，可以在 node 裡驗證）
 *
 * 地圖符號（外圍自動是木框牆）：
 *   .  地板      #  牆        O  洞      _  深谷（太空、冰水）   G  終點洞
 *   S  起點球    c  金幣      C  檢查點  i  冰面   ~  泥巴／焦糖
 *   B  彈跳柱    > < ^ v  單向門（只能往箭頭方向通過）
 *   1 2 3  按鈕（踩到後打開同組的門）   D E F  門（1→D、2→E、3→F）
 * plat：移動平台 { a:[格x,格y], b:[格x,格y], speed, wait }（兩端都要在深谷格上、旁邊是地板）
 * ===================================================================== */
const WORLDS = [
  { key: 'wood', name: '木頭小屋', sub: '學會傾斜木板、閃過洞洞' },
  { key: 'candy', name: '糖果工廠', sub: '彈跳軟糖、黏黏焦糖、按鈕開門' },
  { key: 'ice', name: '冰雪城堡', sub: '滑溜溜的冰面和浮冰' },
  { key: 'space', name: '夜光太空', sub: '漂浮平台和好幾顆球' }
];

const LEVELS = [
  /* ---------------- 木頭小屋 ---------------- */
  { n: '第一次滾動', tip: '按住畫面往任何方向拖曳，木板就會傾斜，球會滾過去！', map: [
    'S...#......',
    '....#..c...',
    '.c..#......',
    '....#...#..',
    '........#..',
    '..#.....#..',
    '..#..c..#.G',
    '..#.....#..'] },
  { n: '之字小路', map: [
    'S.....c....',
    '#########..',
    '...........',
    '.c.........',
    '..#########',
    '...........',
    '.........c.',
    '#########..',
    '...........',
    'G..........',
    '...........'] },
  { n: '小心洞洞', tip: '黑色的洞會把球吞掉，球會回到起點。', map: [
    'S..........',
    '...........',
    '..O..c..O..',
    '...........',
    '.....#.....',
    '.O..###..O.',
    '.....#.....',
    '...........',
    '..O..c..O..',
    '.c.......c.',
    '.........G.'] },
  { n: '小小迷宮', map: [
    'S..#c...#..',
    '##.#.##.#.#',
    '.....#.....',
    '.#####.###.',
    '.#c....#...',
    '.#.#####.##',
    '...#.......',
    '##.#.#####.',
    'c....#..c#.',

// 第三顆星的時間（秒）：用自動駕駛跑出來的時間 × 1.5 再加 5 秒，取到 5 的倍數
const PARS = [25,30,35,40,45,50,40,35,50,50,35,45,35,45,35,45,45,40,80,60,35,40,35,30,50,35,65,40,30,45,35,40,60,30,40,40,45,30,85,40];
LEVELS.forEach((L, i) => { if (!L.par) L.par = PARS[i]; });

const SIM = (function () {
  const G = 30, MAXT = 12 * Math.PI / 180, R = 0.3, STEP = 1 / 120, VMAX = 9;
  const SURF = [{ lin: 0.85, coul: 0.6, e: 0.42 }, { lin: 0.05, coul: 0.03, e: 0.5 }, { lin: 4.2, coul: 1.6, e: 0.2 }];
  const FLOOR = 0, WALL = 1, HOLE = 2, PIT = 3, DOOR = 4;
  const GATE_DIR = { '>': [1, 0], '<': [-1, 0], '^': [0, -1], v: [0, 1] };
  const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
  const ease = x => x * x * (3 - 2 * x);

  function create(L) {
    const rows = L.map, H = rows.length, W = Math.max.apply(null, rows.map(r => r.length));
    const N = W * H;
    const s = {
      L, W, H, kind: new Uint8Array(N), surf: new Uint8Array(N), doorAt: new Int16Array(N).fill(-1), gateAt: new Int16Array(N).fill(-1),
      t: 0, tilt: { x: 0, y: 0 }, tgt: { x: 0, y: 0 }, balls: [], coins: [], sws: [], doors: [], gates: [], bumps: [], holes: [], goals: [], checks: [], plats: [],
      ev: [], falls: 0, got: 0, done: false, doneT: 0, starts: []
    };
    for (let j = 0; j < H; j++) for (let i = 0; i < W; i++) {
      const ch = rows[j][i] || '#', c = j * W + i, x = i + 0.5, y = j + 0.5;
      if (ch === '#') s.kind[c] = WALL;
      else if (ch === 'O') { s.kind[c] = HOLE; s.holes.push({ x, y, i, j }); }
      else if (ch === '_') s.kind[c] = PIT;
      else if (ch === 'G') s.goals.push({ x, y, i, j, used: null });
      else if (ch === 'S') s.starts.push({ x, y });
      else if (ch === 'c') s.coins.push({ x, y, got: false, t: 0 });
      else if (ch === 'C') s.checks.push({ x, y, i, j, on: false });
      else if (ch === 'i') s.surf[c] = 1;
      else if (ch === '~') s.surf[c] = 2;
      else if (ch === 'B') s.bumps.push({ x, y, r: 0.27, hit: 0 });
      else if (ch >= '1' && ch <= '3') s.sws.push({ x, y, i, j, id: +ch - 1, on: false, k: 0 });
      else if (ch === 'D' || ch === 'E' || ch === 'F') { s.kind[c] = DOOR; s.doorAt[c] = s.doors.length; s.doors.push({ i, j, id: 'DEF'.indexOf(ch), open: false, k: 0 }); }
      else if (GATE_DIR[ch]) {
        const d = GATE_DIR[ch];
        s.gateAt[c] = s.gates.length;
        s.gates.push({ i, j, x, y, nx: d[0], ny: d[1], ch, open: 0, cnt: 0 });
      }
    }
    (L.plat || []).forEach((p, k) => {
      const ax = p.a[0] + 0.5, ay = p.a[1] + 0.5, bx = p.b[0] + 0.5, by = p.b[1] + 0.5;
      const P = { ax, ay, bx, by, w: p.w || 1, h: p.h || 1, speed: p.speed || 1.2, wait: p.wait || 1.5, off: p.off || 0, x: ax, y: ay, dx: 0, dy: 0, vx: 0, vy: 0, ai: p.a, bi: p.b, idx: k };
      P.len = Math.hypot(bx - ax, by - ay); P.T = P.len / P.speed; P.cyc = 2 * (P.T + P.wait);
      s.plats.push(P);
    });
    s.starts.forEach((p, k) => s.balls.push({ id: k, x: p.x, y: p.y, vx: 0, vy: 0, st: 'spawn', k: 0.55, rx: p.x, ry: p.y, plat: null, pass: new Uint8Array(s.gates.length), surf: 0, z: 0, fx: 0, fy: 0, hitT: 0 }));
    s.par = L.par || 60;
    return s;
  }

  function cellKind(s, i, j) { return (i < 0 || j < 0 || i >= s.W || j >= s.H) ? WALL : s.kind[j * s.W + i]; }
  function solid(s, i, j) {
    if (i < 0 || j < 0 || i >= s.W || j >= s.H) return true;
    const c = j * s.W + i, k = s.kind[c];
    if (k === WALL) return true;
    if (k === DOOR) { const d = s.doors[s.doorAt[c]]; return !(d.open && d.k > 0.45); }
    return false;
  }

  function platPos(p, t) {
    let u = (t + p.off) % p.cyc, f, phase;
    if (u < p.wait) { f = 0; phase = 0; }
    else if (u < p.wait + p.T) { f = ease((u - p.wait) / p.T); phase = 1; }
    else if (u < 2 * p.wait + p.T) { f = 1; phase = 2; }
    else { f = 1 - ease((u - 2 * p.wait - p.T) / p.T); phase = 3; }
    return { x: p.ax + (p.bx - p.ax) * f, y: p.ay + (p.by - p.ay) * f, phase, left: phase === 0 ? p.wait - u : phase === 2 ? 2 * p.wait + p.T - u : 0 };
  }

  function emit(s, e) { if (s.ev.length < 64) s.ev.push(e); }

  function onPlat(s, b) {
    for (let k = 0; k < s.plats.length; k++) {
      const p = s.plats[k];
      if (Math.abs(b.x - p.x) <= p.w / 2 + 0.02 && Math.abs(b.y - p.y) <= p.h / 2 + 0.02) return p;
    }
    return null;
  }

  function collideWalls(s, b) {
    let maxImp = 0, kindHit = 'wall';
    const i0 = Math.floor(b.x - R), i1 = Math.floor(b.x + R), j0 = Math.floor(b.y - R), j1 = Math.floor(b.y + R);
    const e = SURF[b.surf].e;
    for (let j = j0; j <= j1; j++) for (let i = i0; i <= i1; i++) {
      if (!solid(s, i, j)) continue;
      const cx = clamp(b.x, i, i + 1), cy = clamp(b.y, j, j + 1);
      let dx = b.x - cx, dy = b.y - cy, d2 = dx * dx + dy * dy;
      if (d2 >= R * R) continue;
      let d = Math.sqrt(d2), nx, ny;
      if (d < 1e-6) { // 中心跑進牆裡（不太會發生）：往最近的面推出去
        const l = b.x - i, r = i + 1 - b.x, t = b.y - j, bo = j + 1 - b.y, m = Math.min(l, r, t, bo);
        nx = m === l ? -1 : m === r ? 1 : 0; ny = m === t ? -1 : m === bo ? 1 : 0; d = -m;
      } else { nx = dx / d; ny = dy / d; }
      const pen = R - d;
      b.x += nx * pen; b.y += ny * pen;
      const vn = b.vx * nx + b.vy * ny;
      if (vn < 0) {
        b.vx -= (1 + e) * vn * nx; b.vy -= (1 + e) * vn * ny;
        // 撞牆時沿著牆的速度也損失一點
        const tx = -ny, ty = nx, vt = b.vx * tx + b.vy * ty;
        b.vx -= vt * 0.06 * tx; b.vy -= vt * 0.06 * ty;
        if (-vn > maxImp) { maxImp = -vn; kindHit = (i < 0 || j < 0 || i >= s.W || j >= s.H) ? 'rim' : s.kind[j * s.W + i] === DOOR ? 'door' : 'wall'; }
      }
    }
    return [maxImp, kindHit];
  }

  function collideGates(s, b) {
    let imp = 0;
    for (let g = 0; g < s.gates.length; g++) {
      const G_ = s.gates[g];
      const rx = b.x - G_.x, ry = b.y - G_.y;
      const d = rx * G_.nx + ry * G_.ny;           // 沿著可通行方向的距離（負的＝在門前）
      const lat = rx * -G_.ny + ry * G_.nx;         // 沿著門板的位置（門板半長 0.5）
      if (Math.abs(lat) > 0.5 + R || Math.abs(d) > R + 0.12) { if (b.pass[g]) b.pass[g] = 0; continue; }
      if (!b.pass[g] && d < 0 && d > -R - 0.1) { b.pass[g] = 1; G_.cnt++; emit(s, { t: 'gate', g, b: b.id }); }
      if (b.pass[g]) {
        if (d > R || d < -R - 0.11) b.pass[g] = 0;
        G_.open = Math.max(G_.open, clamp(1 - Math.abs(d) / (R + 0.1), 0, 1));
        continue;
      }
      if (d < 0) continue;
      // 從後面撞到門板（線段）
      const l = clamp(lat, -0.5, 0.5);
      const px = G_.x + -G_.ny * l, py = G_.y + G_.nx * l;
      let dx = b.x - px, dy = b.y - py, dd = Math.hypot(dx, dy);
      if (dd >= R) continue;
      let nx, ny;
      if (dd < 1e-6) { nx = G_.nx; ny = G_.ny; } else { nx = dx / dd; ny = dy / dd; }
      b.x += nx * (R - dd); b.y += ny * (R - dd);
      const vn = b.vx * nx + b.vy * ny;
      if (vn < 0) { b.vx -= 1.4 * vn * nx; b.vy -= 1.4 * vn * ny; imp = Math.max(imp, -vn); }
    }
    return imp;
  }

  function step(s, h) {
    h = h || STEP;
    s.t += h;
    const rate = 1.5 * h;
    s.tilt.x += clamp(s.tgt.x - s.tilt.x, -rate, rate);

    const x = clamp(sp / 9, 0, 1), on = best && sp > 0.08;
    const surf = best ? best.surf : 0, theme = curTheme;
    if (!on) { loops.w.set(0, 0); loops.i.set(0, 0); loops.m.set(0, 0); return; }

    let x, y;
    if (ang === 90) { x = e.beta; y = -e.gamma; } else if (ang === -90 || ang === 270) { x = -e.beta; y = e.gamma; } else { x = e.gamma; y = e.beta; }
    if (!gyro.base) gyro.base = { x, y };
    gyro.x = clamp((x - gyro.base.x) / 18, -1, 1); gyro.y = clamp((y - gyro.base.y) / 18, -1, 1);
    gyro.last = performance.now();
  }
  function gyroStop(silent) {
    gyroOn = false; gyro.x = gyro.y = 0; gyro.base = null;
    window.removeEventListener('deviceorientation', onOrient);
    if (!silent) buildToggles();
  }
  function gyroStart() {
    gyroOn = true; gyro.base = null; gyro.last = 0;
    window.addEventListener('deviceorientation', onOrient);
    buildToggles();
    // 一秒半內沒有收到感應器資料：安靜地關掉
    setTimeout(() => { if (gyroOn && !gyro.last) gyroStop(); }, 1500);
  }
  function toggleGyro() {
    sfx('ui');
    if (gyroOn) { gyroStop(); return; }
    const DOE = window.DeviceOrientationEvent;
    if (DOE && typeof DOE.requestPermission === 'function') {
      DOE.requestPermission().then(r => { if (r === 'granted') gyroStart(); else gyroStop(); }).catch(() => gyroStop());
    } else gyroStart();
  }

  function inputTilt(dt) {
    // 方向鍵：慢慢加大，點一下只會小小傾斜
    const kx = keys.r - keys.l, ky = keys.d - keys.u;
    const rate = 4.5 * dt;
    keyV.x += clamp(kx - keyV.x, -rate, rate); keyV.y += clamp(ky - keyV.y, -rate, rate);
    let x = 0, y = 0;
    if (joy.id != null) { x = joy.x; y = joy.y; }
    else if (kx || ky || Math.abs(keyV.x) > 0.01 || Math.abs(keyV.y) > 0.01) { x = keyV.x; y = keyV.y; }
    else if (gyroOn) { x = gyro.x; y = gyro.y; }
    const m = Math.hypot(x, y);
    if (m > 1) { x /= m; y /= m; }
    // 小幅度比較好微調
    const curve = m > 0 ? Math.pow(Math.min(1, m), 1.25) / Math.min(1, m) : 0;
    x *= curve * SIM.MAXT; y *= curve * SIM.MAXT;
    // 螢幕方向 → 木板方向（鏡頭轉 90 度時要跟著轉）
    const c = Math.cos(camAz), sn = Math.sin(camAz);
    return { x: x * c + y * sn, y: -x * sn + y * c };
  }

  /* ---------------- 事件 → 聲音、特效 ---------------- */
  function handleEvents() {
    if (!sim) return;
    const s = sim, play = phase === 'play';
    for (const e of s.ev) {
      if (!play && phase !== 'win') continue;
      const pan = e.x != null ? panOf(e.x, e.y) : 0;
      switch (e.t) {
        case 'hit': {
          const v = clamp(e.v / 6, 0, 1);
          sfx(CLACK[curTheme], { vol: 0.25 + v * 0.85, pitch: 0.92 + Math.random() * 0.1 + v * 0.08, pan });
          if (e.v > 2.5) burst(e.x + V.ox, e.y + V.oz, 0.1, Math.round(3 + v * 5), curTheme === 'space' ? 0x7ff3ff : curTheme === 'ice' ? 0xffffff : 0xffe0b0, 1.2 + v, 4, 0.35);
          if (e.v > 4.5) { shake = Math.max(shake, v * 0.8); KG.vibrate(12); }
          break;
        }
        case 'bump':
          sfx('bumper', { pan, pitch: 0.95 + Math.random() * 0.1 });
          burst(e.x + V.ox, e.y + V.oz, 0.4, 8, THEMES[curTheme].bump[1], 2.2, 3, 0.45);
          KG.vibrate(15); shake = Math.max(shake, 0.4);
          break;
        case 'clink': sfx('clink', { vol: 0.4 + clamp(e.v / 5, 0, 1) * 0.6, pan }); break;
        case 'coin': {
          coinCombo = s.t - lastCoinT < 3 ? coinCombo + 1 : 0; lastCoinT = s.t;
          sfx('coinChime', { pitch: Math.pow(2, Math.min(coinCombo, 7) * 2 / 12) * (1 + (Math.random() - 0.5) * 0.02), pan }, 30);
          burst(e.x + V.ox, e.y + V.oz, 0.35, 12, 0xffd23a, 2.4, 2, 0.6);
          if (s.got >= s.coins.length) { setTimeout(() => sfx('allCoins'), 160); popText('金幣全拿！', e.x, e.y, '#ffe27a'); }
          else popText('+1', e.x, e.y, '#ffe27a');
          KG.vibrate(8);
          break;
        }
        case 'fall':
          sfx(e.pit ? (curTheme === 'ice' ? 'waterFall' : 'voidFall') : 'holeDrop', { pan });
          setTimeout(() => { if (phase === 'play') J.fall(); }, 280);
          if (e.pit && curTheme === 'ice') burst(e.x + V.ox, e.y + V.oz, 0.05, 14, 0xbfe8ff, 2.2, 6, 0.6);
          KG.vibrate(60);
          popText(s.checks.some(c => c.on) ? '哎呀！回到旗子' : '哎呀！再試一次', e.x, e.y, '#ffd0c0');
          break;
        case 'respawn': sfx('spawnPop', { pan }); break;
        case 'land': sfx('land', { vol: 0.5, pan }); burst(e.x + V.ox, e.y + V.oz, 0.05, 6, 0xffffff, 1.2, 3, 0.35); break;
        case 'goal': {
          sfx('goalSink', { pan });
          burst(e.x + V.ox, e.y + V.oz, 0.3, 26, 0xffd23a, 3, 3, 0.9);
          KG.vibrate(30);
          if (e.left > 0) { popText('還有 ' + e.left + ' 顆！', e.x, e.y, '#c8ffd0'); setTimeout(() => J.ball(), 200); }
          break;
        }
        case 'switch':
          sfx('switchClick', { pan }); KG.vibrate(15);
          burst(e.x + V.ox, e.y + V.oz, 0.15, 10, SW_COLORS[e.id], 1.8, 3, 0.5);
          break;
        case 'door':
          setTimeout(() => sfx('doorSlide', { pan }, 200), 90);
          popText('門打開了！', e.x, e.y, '#ffffff');
          break;
        case 'check':
          sfx('checkFlag', { pan }); popText('檢查點！', e.x, e.y, '#b8ffc8');
          burst(e.x + V.ox, e.y + V.oz, 0.5, 12, 0x3ccf6a, 2, 2, 0.6);
          break;
        case 'gate': sfx('gateFlap', { pan }, 120); break;
        case 'dock': {
          const b = s.balls.find(z => z.st === 'roll');
          if (b && Math.hypot(b.x - e.x, b.y - e.y) < 3.5) sfx('platDock', { vol: 0.6, pan }, 300);
          break;
        }
      }
    }
    s.ev.length = 0;
    // 換地面的聲音
    if (play && V) s.balls.forEach((b, k) => {
      const vb = V.balls[k]; if (!vb || b.st !== 'roll') return;
      const sp = Math.hypot(b.vx, b.vy);
      if (vb.lastSurf !== b.surf) {
        if (vb.lastSurf >= 0 && sp > 0.6) { if (b.surf === 2) sfx('mudSquish', { pan: panOf(b.x, b.y) }, 300); else if (b.surf === 1) sfx('iceSlide', { pan: panOf(b.x, b.y) }, 300); }
        vb.lastSurf = b.surf;
      }
    });
  }

  /* ---------------- 主迴圈 ---------------- */
  function update(dt) {
    clock += dt;
    if (bannerT > 0) { bannerT -= dt; if (bannerT <= 0) $('banner').classList.remove('on'); }
    if (tipT > 0) { tipT -= dt; if (tipT <= 0) hideTip(); }
    if (phase === 'play' || phase === 'win') {
      if (phase === 'play') {
        const t = pilot ? null : inputTilt(dt);
        acc += dt;
        let n = 0;
        while (acc >= SIM.STEP && n < 12) {
          if (pilot) pilot.update(SIM.STEP); else { sim.tgt.x = t.x; sim.tgt.y = t.y; }
          SIM.step(sim, SIM.STEP); acc -= SIM.STEP; n++;
        }
        if (n >= 12) acc = 0;
        handleEvents();
        updateHud();
        if (sim.done) { winWait += dt; if (winWait > 0.35) finishLevel(); }
        // 音樂：快到終點時加樂器、快超過時間時加快
        if (KG.music) {
          const near = sim.balls.some(b => b.st === 'roll' && sim.goals.some(g => !g.used && Math.hypot(g.x - b.x, g.y - b.y) < 2.8));
          if (near !== focusOn) { focusOn = near; KG.music.setLayer('focus', near); }
          const t = sim.t - T0, hurry = t > sim.par * 0.75 && t < sim.par;
          if (hurry !== tempoUp) { tempoUp = hurry; KG.music.setTempo(hurry ? 1.06 : 1); }
        }
      } else {
        // 結算時讓木板慢慢回正
        sim.tgt.x = 0; sim.tgt.y = 0;
        acc += dt; while (acc >= SIM.STEP) { SIM.step(sim, SIM.STEP); acc -= SIM.STEP; }
        sim.ev.length = 0;
      }
    } else if ((phase === 'title' || phase === 'levels') && sim && pilot) {
      acc += dt;
      let n = 0;
      while (acc >= SIM.STEP && n < 6) { pilot.update(SIM.STEP); // 展示時傾斜小一點，看起來比較穩
        SIM.step(sim, SIM.STEP); acc -= SIM.STEP; n++; }
      if (n >= 6) acc = 0;
      sim.ev.length = 0;
      if (sim.done || sim.t > 70) { demoWait += dt; if (demoWait > 1.2) { demoIdx++; startDemo(); } }
    }
    updateParts(dt);
    updateLoops(dt);
  }

  /* ---------------- 畫面大小 ---------------- */
  function resize() {
    const vv = window.visualViewport;
    W = Math.round(vv ? vv.width : innerWidth); H = Math.round(vv ? vv.height : innerHeight);
    const r = cv.getBoundingClientRect();
    if (r.width > 0 && r.height > 0) { W = Math.round(r.width); H = Math.round(r.height); }
    renderer.setSize(W, H, false);
    fitCamera();
  }
  window.addEventListener('resize', resize);
  if (window.visualViewport) window.visualViewport.addEventListener('resize', resize);
  window.addEventListener('orientationchange', () => setTimeout(resize, 150));
  document.addEventListener('visibilitychange', () => { if (document.hidden) { if (phase === 'play') pauseGame(); resetInput(); } });

  /* ---------------- 自動畫質：太卡就一步步降低（解析度 → 影子），並記住 ---------------- */
  const QKEY = 'quality:' + SLUG;
  const baseRatio = Math.min(window.devicePixelRatio || 1, small ? 1.75 : 2);
  const QLEVELS = [
    { ratio: baseRatio, shadow: true },
    { ratio: Math.min(baseRatio, 1.5), shadow: true },
    { ratio: Math.min(baseRatio, 1.2), shadow: true },
    { ratio: 1, shadow: true },
    { ratio: 1, shadow: false },
    { ratio: 0.8, shadow: false }
  ];
  let qLevel = clamp(KG.store.get(QKEY, KG.lowEnd ? 2 : 0) | 0, 0, QLEVELS.length - 1);
  const perf = { last: 0, n: 0, sum: 0, cool: 2.5 };
  function applyQuality() {
    const q = QLEVELS[qLevel];
    renderer.setPixelRatio(q.ratio);
    renderer.setSize(W, H, false);
    if (renderer.shadowMap.enabled !== q.shadow) {
      renderer.shadowMap.enabled = q.shadow;
      scene.traverse(o => { if (o.material) [].concat(o.material).forEach(m => { m.needsUpdate = true; }); });
    }
  }
  function renderFrame() {
    renderer.render(scene, camera);
    const now = performance.now(), dt = perf.last ? Math.min(0.5, (now - perf.last) / 1000) : 0;
    perf.last = now;
    if (document.hidden || qLevel >= QLEVELS.length - 1 || window.__mmNoGov) return;
    perf.cool -= dt;
    if (perf.cool > 0) return;
    perf.sum += dt; perf.n++;
    if (perf.n >= 60) {
      if (perf.sum / perf.n > 1 / 45) { qLevel++; KG.store.set(QKEY, qLevel); applyQuality(); perf.cool = 1.5; }
      perf.n = 0; perf.sum = 0;
    }
  }

  let last = performance.now(), first = true;
  function frame(now) {
    const dt = Math.max(0, Math.min(0.05, (now - last) / 1000));
    last = now;
    update(dt);
    sync3D(dt);
    updateCamera(dt);
    renderFrame();
    if (first) { first = false; const m = $('msg'); if (m) m.remove(); }
    requestAnimationFrame(frame);
  }
  resize();
  applyQuality();
  showTitle();
  requestAnimationFrame(frame);

  /* ---------------- 測試掛鉤 ---------------- */
  window.__mm = {
    state: () => ({ phase, lv: curLv, t: sim ? +sim.t.toFixed(2) : 0, done: sim ? sim.done : false, got: sim ? sim.got : 0, coins: sim ? sim.coins.length : 0, falls: sim ? sim.falls : 0,
      balls: sim ? sim.balls.map(b => [b.st, +b.x.toFixed(2), +b.y.toFixed(2)]) : [], tilt: sim ? [+sim.tilt.x.toFixed(3), +sim.tilt.y.toFixed(3)] : [], q: qLevel,
      music: KG.music ? KG.music.isPlaying() : null, song: curSong, sfx: sfxOn, joy: [+joy.x.toFixed(2), +joy.y.toFixed(2)] }),
    start: i => startLevel(i | 0),
    auto: on => { autoOn = !!on; if (sim && phase === 'play') pilot = autoOn ? SIM.makePilot(sim) : null; },
    tick: sec => { if (!sim) return; const p = pilot || SIM.makePilot(sim); for (let k = 0; k < sec / SIM.STEP && !sim.done; k++) { p.update(SIM.STEP); SIM.step(sim, SIM.STEP); } },
    solveAll: () => LEVELS.map((L, i) => Object.assign({ i }, SIM.solve(L, 240))),
    win: () => { if (!sim) return; sim.coins.forEach(c => { if (!c.got) { c.got = true; c.t = sim.t; sim.got++; } }); sim.balls.forEach(b => { b.st = 'done'; }); sim.done = true; sim.doneT = sim.t; },
    unlockAll: () => { for (let i = 0; i < LEVELS.length; i++) if (!prog.stars[i]) prog.stars[i] = 1; saveProg(); },
    reset: () => { prog.stars = []; prog.best = []; saveProg(); },
    quality: q => { qLevel = clamp(q, 0, QLEVELS.length - 1); applyQuality(); },
    pause: pauseGame, resume: resumeGame, title: showTitle, levels: showLevels, _scene: scene, _renderer: renderer, _camera: camera, _update: update, _sync: sync3D,
    fps: ms => new Promise(res => { let n = 0; const t0 = performance.now(); (function f() { n++; if (performance.now() - t0 < ms) requestAnimationFrame(f); else res(+(n * 1000 / (performance.now() - t0)).toFixed(1)); })(); }),
    proj: (x, y) => { if (!V) return null; _v.set(x + V.ox, 0.3, y + V.oz); board.localToWorld(_v); _v.project(camera); return [(_v.x * 0.5 + 0.5) * W, (-_v.y * 0.5 + 0.5) * H]; }
  };
}
</script>
