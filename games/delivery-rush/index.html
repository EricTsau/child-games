'use strict';
/* =====================================================================
 * 小小外送員：騎著機車在台灣小鎮送餐！
 * 到店家取餐、送到客人家；易灑的豆花、湯要小心騎，熱食有時間限制。
 * 一天 3 分鐘，賺小費升級機車；紅燈要停、禮讓行人，安全帽一定戴好。
 * ===================================================================== */
(function () {
const SLUG = 'delivery-rush';
const cv = document.getElementById('game');
const ctx = cv.getContext('2d');
const FONT = '"PingFang TC","Noto Sans TC","Microsoft JhengHei","Heiti TC",system-ui,sans-serif';
const TAU = Math.PI * 2;
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const lerp = (a, b, t) => a + (b - a) * t;
const rand = (a, b) => a + Math.random() * (b - a);
const randi = (a, b) => Math.floor(a + Math.random() * (b - a + 1));
const pick = a => a[Math.floor(Math.random() * a.length)];
const dist = (ax, ay, bx, by) => Math.hypot(ax - bx, ay - by);
function angDiff(a, b) { let d = (b - a) % TAU; if (d > Math.PI) d -= TAU; if (d < -Math.PI) d += TAU; return d; }
function rng(seed) {
  let s = (seed | 0) || 7;
  return () => { s ^= s << 13; s ^= s >>> 17; s ^= s << 5; return (s >>> 0) / 4294967296; };
}
const easeOutBack = t => { const c = 1.70158, c3 = c + 1; return 1 + c3 * Math.pow(t - 1, 3) + c * Math.pow(t - 1, 2); };
const easeOutCubic = t => 1 - Math.pow(1 - t, 3);

let W = 390, H = 844, dpr = 1, U = 1, time = 0;

/* ---------- 存檔 ---------- */
const Save = { get: (k, d) => KG.store.get(SLUG + ':' + k, d), set: (k, v) => KG.store.set(SLUG + ':' + k, v) };
const UP0 = { box: 0, speed: 0, bag: 0, phone: 0 };
const prog = Object.assign({ unlocked: 1, stars: [], wallet: 0, next: 1, ctrl: 'stick', seenHelp: false }, Save.get('prog', {}));
prog.up = Object.assign({}, UP0, prog.up || {});
if (!Array.isArray(prog.stars)) prog.stars = [];
function saveProg() { Save.set('prog', prog); }

/* =====================================================================
 * 聲音：音效＋原創配樂（E♭ 大調城市放克）
 * ===================================================================== */
const S = KG.sfx, M = KG.music;
let sfxOn = Save.get('sfx', true) !== false;
const sfxLast = Object.create(null);
/** 播放音效：同一種 40ms 內只播一次、音高隨機 ±5% */
function sfx(name, o) {
  if (!sfxOn || !S) return;
  const now = performance.now();
  if (now - (sfxLast[name] || 0) < 40) return;
  sfxLast[name] = now;
  o = o || {};
  const pitch = (o.pitch || 1) * (o.exact ? 1 : 0.95 + Math.random() * 0.1);
  S.play(name, { vol: o.vol, pitch, pan: o.pan });
}
function panX(sx) { return clamp((sx / Math.max(1, W)) * 2 - 1, -1, 1) * 0.6; }

if (S) {
  // 機車喇叭：嗶嗶
  S.define('dr_horn', (p, s) => {
    [0, 0.15].forEach(d => {
      s.tone(440 * p, 0.11, { type: 'square', vol: 0.035, delay: d });
      s.tone(554 * p, 0.11, { type: 'square', vol: 0.03, delay: d });

  // 汽車喇叭（比較低）
  S.define('dr_carhorn', (p, s) => {

    s.tone(311 * p, 0.3, { type: 'triangle', vol: 0.09 });
  });
  // 煞車：短短的吱
  S.define('dr_brake', (p, s) => {

    s.tone(3150 * p, 0.2, { vol: 0.012, slide: 2700 * p, attack: 0.03 });
    s.noise(0.22, { vol: 0.05, freq: 4200 * p, q: 3, attack: 0.02 });

  // 新訂單：手機叮咚
  S.define('dr_order', (p, s) => {

  // 取餐：塑膠袋窸窣＋放進外送箱
  S.define('dr_bag', (p, s) => {

    for (let i = 0; i < 6; i++) { s.noise(0.03, { vol: 0.14, freq: (2600 + Math.random() * 2600) * p, q: 2, delay: d }); d += 0.022 + Math.random() * 0.022; }
    s.tone(180 * p, 0.09, { vol: 0.2, slide: 110 * p, delay: d });
    s.noise(0.05, { vol: 0.08, freq: 700 * p, type: 'lowpass', delay: d });

  // 門鈴：叮～咚
  S.define('dr_doorbell', (p, s) => {

    s.tone(622 * p, 0.7, { vol: 0.13, delay: 0.27 }); s.tone(1244 * p, 0.22, { vol: 0.025, delay: 0.27 });

  // 謝謝！小鈴聲
  S.define('dr_thanks', (p, s) => {

    s.tone(1865 * p, 0.4, { vol: 0.05, delay: 0.21 });

  // 收到小費
  S.define('dr_coin', (p, s) => { s.tone(1319 * p, 0.06, { type: 'square', vol: 0.045 }); s.tone(1760 * p, 0.18, { type: 'square', vol: 0.045, delay: 0.06 }); s.tone(3520 * p, 0.1, { vol: 0.02, delay: 0.06 }); });
  // 撞到：軟軟的咚
  S.define('dr_bump', (p, s) => { s.tone(130 * p, 0.16, { vol: 0.34, slide: 62 }); s.noise(0.09, { vol: 0.16, freq: 520 * p, type: 'lowpass' }); s.tone(300 * p, 0.08, { type: 'triangle', vol: 0.06, slide: 180 * p }); });
  // 湯灑出來
  S.define('dr_spill', (p, s) => {

    [0.04, 0.1, 0.17].forEach((d, i) => s.tone((520 + i * 140) * p, 0.07, { vol: 0.07, slide: (900 + i * 200) * p, delay: d }));
  });
  // 闖紅燈警告：嗶嗶嗶（柔和）
  S.define('dr_red', (p, s) => {
    for (let i = 0; i < 3; i++) { s.tone(740 * p, 0.09, { type: 'triangle', vol: 0.16, delay: i * 0.13 }); s.tone(740 * p, 0.09, { type: 'square', vol: 0.025, delay: i * 0.13 }); }
  });
  // 等紅燈好棒
  S.define('dr_good', (p, s) => { s.tone(1047 * p, 0.12, { type: 'triangle', vol: 0.12 }); s.tone(1397 * p, 0.22, { type: 'triangle', vol: 0.11, delay: 0.08 }); });
  // 快冷掉了
  S.define('dr_hurry', (p, s) => { s.tone(988 * p, 0.08, { type: 'triangle', vol: 0.12 }); s.tone(988 * p, 0.08, { type: 'triangle', vol: 0.12, delay: 0.12 }); });
  // 冷掉了
  S.define('dr_cold', (p, s) => { s.tone(660 * p, 0.2, { type: 'triangle', vol: 0.11, slide: 520 * p }); s.tone(494 * p, 0.3, { type: 'triangle', vol: 0.1, delay: 0.16, slide: 440 * p }); });
  // 行人嚇一跳
  S.define('dr_ped', (p, s) => { s.tone(620 * p, 0.12, { vol: 0.12, slide: 1100 * p }); s.tone(900 * p, 0.1, { vol: 0.06, delay: 0.1, slide: 760 * p }); });
  // 戴安全帽：喀
  S.define('dr_buckle', (p, s) => { s.noise(0.025, { vol: 0.28, freq: 3200 * p, q: 3 }); s.tone(1900 * p, 0.03, { vol: 0.06 }); s.noise(0.02, { vol: 0.2, freq: 2400 * p, q: 3, delay: 0.07 }); });
  // 星星
  S.define('dr_star', (p, s) => { s.tone(1568 * p, 0.1, { vol: 0.08 }); s.tone(2093 * p, 0.2, { vol: 0.06, delay: 0.05 }); });
  // 卡片滑進來
  S.define('dr_slide', (p, s) => { s.noise(0.12, { vol: 0.07, freq: 1500 * p, sweep: 3500 * p, q: 1.2 }); });
  // 倒數
  S.define('dr_tick', (p, s) => { s.tone(1180 * p, 0.04, { type: 'triangle', vol: 0.08 }); });

  S.define('dr_crowd', (p, s) => { for (let i = 0; i < 3; i++) s.tone((500 + Math.random() * 400) * p, 0.06, { type: 'triangle', vol: 0.025, delay: i * 0.07, slide: (600 + Math.random() * 500) * p }); });

/* ---------- 自製樂器：電鋼琴、Slap 貝斯 ---------- */
if (M && M.INST) {
  M.INST.epiano = function (f, t, d, v, out) {
    const A = out.context, g = A.createGain(), end = t + Math.max(0.08, d);
    const pk = v * 0.1;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(pk, t + 0.006);
    g.gain.setTargetAtTime(pk * 0.3, t + 0.006, 0.3);
    g.gain.setTargetAtTime(0.0001, end, 0.09);
    if (A.createStereoPanner) { const pn = A.createStereoPanner(); pn.pan.value = -0.12; g.connect(pn); pn.connect(out); } else g.connect(out);
    const o1 = A.createOscillator(); o1.type = 'sine'; o1.frequency.value = f; o1.connect(g);
    const m = A.createOscillator(); m.frequency.value = f;
    const mg = A.createGain(); mg.gain.setValueAtTime(f * 1.1, t); mg.gain.setTargetAtTime(f * 0.12, t, 0.12);
    m.connect(mg); mg.connect(o1.frequency);
    const g2 = A.createGain(); g2.gain.setValueAtTime(0.32, t); g2.gain.setTargetAtTime(0.0001, t, 0.06); g2.connect(g);
    const o2 = A.createOscillator(); o2.type = 'sine'; o2.frequency.value = f * 4; o2.connect(g2);
    const stop = end + 0.6;
    [o1, m, o2].forEach(o => { o.start(t); o.stop(stop); });
  };
  M.INST.slap = function (f, t, d, v, out) {
    const A = out.context, g = A.createGain(), end = t + Math.max(0.06, d);
    const pk = v * 0.3;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(pk, t + 0.004);
    g.gain.setTargetAtTime(pk * 0.45, t + 0.004, 0.08);
    g.gain.setTargetAtTime(0.0001, end, 0.04);
    g.connect(out);
    const lp = A.createBiquadFilter(); lp.type = 'lowpass'; lp.Q.value = 5;
    lp.frequency.setValueAtTime(Math.min(5000, f * 16), t); lp.frequency.exponentialRampToValueAtTime(Math.max(120, f * 3), t + 0.14);
    lp.connect(g);
    const o1 = A.createOscillator(); o1.type = 'sawtooth'; o1.frequency.value = f; o1.connect(lp);
    const bg = A.createGain(); bg.gain.value = 0.7; bg.connect(g);
    const o2 = A.createOscillator(); o2.type = 'sine'; o2.frequency.value = f; o2.connect(bg);
    const cg = A.createGain(); cg.gain.setValueAtTime(v * 0.05, t); cg.gain.exponentialRampToValueAtTime(0.0001, t + 0.015); cg.connect(out);
    const o3 = A.createOscillator(); o3.type = 'square'; o3.frequency.value = 1700; o3.connect(cg);
    const stop = end + 0.3;
    o1.start(t); o1.stop(stop); o2.start(t); o2.stop(stop); o3.start(t); o3.stop(t + 0.03);
  };
}

/* ---------- 原創配樂 ---------- */
const E16 = '................';
const NN = ['C', 'Db', 'D', 'Eb', 'E', 'F', 'Gb', 'G', 'Ab', 'A', 'Bb', 'B'];
const CH_IV = { maj7: [0, 4, 7, 11], m7: [0, 3, 7, 10], '7': [0, 4, 7, 10], sus4: [0, 5, 7], '': [0, 4, 7], m: [0, 3, 7] };
function chordNotes(name, oct) {
  const m = /^([A-G])(b?)(.*)$/.exec(name);
  const root = NN.indexOf(m[1]) + (m[2] ? -1 : 0);
  const iv = CH_IV[m[3]] || CH_IV[''];
  return iv.map(i => { const n = root + i + 12 * (oct + 1); return NN[((n % 12) + 12) % 12] + Math.floor(n / 12 - 1); });
}
// 遊戲中：116 bpm，電鋼琴切分和弦＋Slap 貝斯＋拍手，長笛和鐘琴唱主旋律

// 標題：100 bpm，比較輕鬆的城市流行

const MEL_TITLE = [

// 車庫：84 bpm，安靜的卡林巴琴
const GARAGE_CH = ['Ebmaj7', 'Abmaj7', 'Fm7', 'Bbsus4', 'Gm7', 'Cm7', 'Abmaj7', 'Bb7'];
const MEL_GARAGE = [

let curSong = null;
function playSong(s) {

function jingle(def) { if (M && sfxOn) M.jingle(def); }
const J = {
  start: () => { jingle({ bpm: 170, inst: 'bell', vol: 0.3, notes: [['Bb4', 1], ['Eb5', 1], ['G5', 1], ['Bb5', 3]] }); jingle({ bpm: 170, inst: 'epiano', vol: 0.5, notes: [['Eb4+G4+Bb4', 3], ['Eb4+G4+Bb4+D5', 3]], bass: [['Eb3', 6, 0]], bassVol: 0.3 }); },

  },

};

/* ---------- 引擎聲 ---------- */
let engine = null;
function engineOn() {
  if (engine || !S || !sfxOn || KG.isMuted()) return;
  if (!M || !M._nodes()) return; // 還沒點過畫面
  try { engine = S.loop('engine'); } catch (e) { engine = null; }
}
function engineOff() { if (engine) { try { engine.stop(); } catch (e) { /* 忽略 */ } engine = null; } }

/* =====================================================================
 * 小鎮地圖：6×6 個街區，道路寬 96（雙向各一線，靠右行駛）
 * ===================================================================== */
const N = 6, BS = 400, RW = 96, BLK = BS - RW, SWK = 14, WORLD = N * BS + RW;

function getChunk(cx, cy, force) {

  if (P2 !== chunkP) { chunkP = P2; chunks.clear(); }
  sc = chunkP / BS; zoom = sc / dpr;
  chunkMax = Math.max(12, (Math.ceil(W / zoom / BS) + 1) * (Math.ceil(H / zoom / BS) + 1) + 4);
  layout();
}
window.addEventListener('resize', resize);
window.addEventListener('orientationchange', () => setTimeout(resize, 120));
if (window.visualViewport) window.visualViewport.addEventListener('resize', resize);

let last = performance.now();
const perf = { n: 0, sum: 0, max: 0 };
function frame(now) {
  const dt = Math.min(0.05, Math.max(0, (now - last) / 1000));
  last = now;
  const t0 = performance.now();
  try { step(dt); render(); } catch (err) { console.error(err); }
  const ft = performance.now() - t0;
  perf.n++; perf.sum += ft; if (ft > perf.max) perf.max = ft;
  requestAnimationFrame(frame);
}
resize();
playSong(SONG_TITLE);
requestAnimationFrame(t => { last = t; frame(t); });

/* ---------- 測試用 ---------- */
window.__dr = {
  state: () => ({
    scene, sub: G.sub, paused, day: G.day, endless: G.endless, clock: +G.clock.toFixed(2), money: G.money,
    orders: G.orders.map(o => ({ id: o.id, state: o.state, shop: o.shop.name, dest: o.dest.name, hot: o.hot, fr: o.fr, tLeft: +o.tLeft.toFixed(1), hits: o.hits, tx: Math.round(targetOf(o).x), ty: Math.round(targetOf(o).y) })),
    p: { x: Math.round(P.x), y: Math.round(P.y), spd: Math.round(P.spd), ang: +P.ang.toFixed(2) }, stats: G.stats,
    music: M ? M.isPlaying() : null, rush: rushOn, labels: labels.map(l => ({ text: l.text, slot: l.slot })), vehicles: vehicles.filter(v => v.on).length,
    peds: peds.filter(p => p.on).length, wallet: prog.wallet, up: prog.up, chunks: chunks.size, engine: !!engine, result: G.result ? { money: G.result.money, stars: G.result.stars, pass: G.result.pass } : null
  }),
  start: (d, endless, skip) => { startDay(d || 1, !!endless); if (skip !== false) { G.sub = 'run'; playSong(SONG_PLAY); } },
  tick: (sec) => { const n = Math.round(sec * 60); for (let i = 0; i < n; i++) step(1 / 60); },
  tp: (x, y, ang) => { P.x = x; P.y = y; if (ang != null) P.ang = ang; P.spd = 0; updateCam(0, true); },
  goTarget: () => { const o = focusOrder(); if (!o) return false; const z = targetOf(o); P.x = z.x; P.y = z.y; P.spd = 0; P.kx = P.ky = 0; updateCam(0, true); return true; },
  setClock: s => { G.clock = s; },
  btns: () => btns.map(b => ({ id: b.id, x: Math.round(b.x + b.w / 2), y: Math.round(b.y + b.h / 2), w: Math.round(b.w), h: Math.round(b.h) })),
  perf: reset => { const r = { avg: perf.n ? +(perf.sum / perf.n).toFixed(2) : 0, max: +perf.max.toFixed(1), n: perf.n }; if (reset) { perf.n = 0; perf.sum = 0; perf.max = 0; } return r; },
  go: s => { if (s === 'title') goTitle(); else if (s === 'days') goDays(); else if (s === 'garage') goGarage(); },
  give: m => { prog.wallet += m; saveProg(); },
  unlock: () => { prog.unlocked = DAYS + 1; saveProg(); },
  screen: (x, y) => worldToScreen(x, y),
  lights: () => lights.map(L => ({ i: L.i, j: L.j, ew: lightState(L, 0), ns: lightState(L, 1) })),
  layout: () => JSON.parse(JSON.stringify(LAY)),
  pause: p => setPaused(p),
  bumpTest: () => { P.spd = 0; bump(1, 0, 120, 'wall'); },
  chunkTime: () => { const t0 = performance.now(); chunks.clear(); for (let i = 0; i < 6; i++) getChunk(i, 2, true); return (performance.now() - t0) / 6; },
  route: () => { const o = focusOrder(); if (!o) return null; const z = targetOf(o); return fullRoute(P.x, P.y, z.x, z.y).map(q => [Math.round(q[0]), Math.round(q[1])]); },
  setUp: u => { Object.assign(prog.up, u); saveProg(); },
  veh: () => vehicles.filter(v => v.on).map(v => ({ x: Math.round(v.x), y: Math.round(v.y), dir: v.dir, spd: Math.round(v.spd), block: +v.block.toFixed(1), type: v.type }))
};
})();
</script>
