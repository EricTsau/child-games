<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>接水果</title>
<link rel="stylesheet" href="../../assets/common.css">
<style>
  html, body { height: 100%; overflow: hidden; background: #bfe8ff; }
  #game {
    position: fixed; inset: 0; width: 100vw; height: 100vh; height: 100dvh;
    display: block; touch-action: none;
  }
  #hudHearts { letter-spacing: 1px; }
  #hudHearts.hurt { animation: kg-shake .4s ease; }
  @media (max-width: 440px) {
    .kg-hud { gap: 6px; }
    .kg-pill { font-size: 15px; padding: 5px 10px; }
  }
</style>
</head>
<body>
<canvas id="game"></canvas>
<div class="kg-hud">
  <div class="kg-pill" id="hudScore">🧺 0</div>
  <div class="kg-pill" id="hudHearts">❤️❤️❤️</div>
</div>

<script src="../../assets/common.js"></script>
<script>
'use strict';
(function () {
  const cv = document.getElementById('game');
  const ctx = cv.getContext('2d');
  const hudScore = document.getElementById('hudScore');
  const hudHearts = document.getElementById('hudHearts');
  const FONT = getComputedStyle(document.body).fontFamily;

  // 水果：emoji + 果汁顏色
  const FRUITS = [
    ['🍎', '#ff4d5e'], ['🍊', '#ff9f1c'], ['🍌', '#ffe066'], ['🍇', '#9b5de5'], ['🍓', '#ff3d6e'],
    ['🍑', '#ffa07a'], ['🍐', '#c5e063'], ['🍉', '#ff5c7a'], ['🍒', '#e0244a'], ['🥝', '#8bc34a'], ['🍋', '#fff05a']
  ];
  const MAX_HEARTS = 3;

  let W = 0, H = 0, dpr = 1, groundY = 0, S = 50;
  let basket = { x: 0, tx: 0, w: 120, h: 66, shake: 0, squash: 0, pile: [] };
  let items = [], parts = [], texts = [], clouds = [], trees = [], tufts = [];
  let state = 'idle', score = 0, hearts = MAX_HEARTS, elapsed = 0, spawnT = 0, clock = 0, hurtT = 0;
  const keys = {};
  const spriteCache = new Map();

  /* ---------- emoji 貼圖快取（含柔和陰影） ---------- */
  function sprite(emoji, size) {
    const key = emoji + '|' + size + '|' + dpr;
    let c = spriteCache.get(key);
    if (c) return c;
    c = document.createElement('canvas');
    const pad = size * 0.35;
    c.width = c.height = Math.ceil((size + pad * 2) * dpr);
    const g = c.getContext('2d');
    g.scale(dpr, dpr);
    g.font = size + 'px sans-serif';
    g.textAlign = 'center'; g.textBaseline = 'middle';
    g.shadowColor = 'rgba(60,40,20,.3)'; g.shadowBlur = size * 0.12; g.shadowOffsetY = size * 0.08;
    g.fillText(emoji, size / 2 + pad, size / 2 + pad + size * 0.05);
    c._half = (size + pad * 2) / 2;
    spriteCache.set(key, c);
    return c;
  }

  /* ---------- 版面 ---------- */
  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 3);
    W = window.innerWidth; H = window.innerHeight;
    cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    groundY = H - Math.max(60, H * 0.1);
    S = Math.round(Math.max(42, Math.min(66, W * 0.1)));
    basket.w = Math.max(100, Math.min(180, W * 0.26));
    basket.h = basket.w * 0.55;
    if (!basket.x) basket.x = basket.tx = W / 2;
    basket.x = Math.min(Math.max(basket.x, basket.w / 2), W - basket.w / 2);
    basket.tx = basket.x;
    spriteCache.clear();
    // 果樹與草
    trees = [];
    const nt = Math.max(3, Math.round(W / 170));
    for (let i = 0; i < nt; i++) {
      const fruits = [];
      for (let k = 0; k < 6; k++) fruits.push({ a: Math.random() * 6.28, d: Math.random() * 0.7, c: KG.pick(['#ff5a5a', '#ffb02e', '#ff7aa2']) });
      trees.push({ x: (i + 0.5) * W / nt + KG.rand(-20, 20), s: KG.rand(0.8, 1.15) * Math.min(1.3, Math.max(0.75, H / 750)) * Math.min(1, W / 520), fruits });
    }
    tufts = [];
    for (let i = 0; i < W / 14; i++) tufts.push({ x: Math.random() * W, y: KG.rand(groundY + 6, H), s: KG.rand(0.7, 1.3) });
    if (!clouds.length) for (let i = 0; i < 5; i++) clouds.push({ x: Math.random() * W, y: KG.rand(0.08, 0.4), s: KG.rand(0.6, 1.2), v: KG.rand(8, 22) });
  }

  /* ---------- 背景 ---------- */
  function drawBackground() {
    const horizon = groundY - Math.min(160, H * 0.2);
    let g = ctx.createLinearGradient(0, 0, 0, groundY);
    g.addColorStop(0, '#7ccbff'); g.addColorStop(0.7, '#d6f1ff'); g.addColorStop(1, '#fff6d8');
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, groundY + 5);
    // 太陽
    const sx = W * 0.16, sy = H * 0.16, sr = Math.min(40, W * 0.07);
    g = ctx.createRadialGradient(sx, sy, sr * 0.3, sx, sy, sr * 2.2);
    g.addColorStop(0, 'rgba(255,240,150,.8)'); g.addColorStop(1, 'rgba(255,240,150,0)');
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(sx, sy, sr * 2.2, 0, 7); ctx.fill();
    g = ctx.createRadialGradient(sx - sr * 0.3, sy - sr * 0.3, 2, sx, sy, sr);
    g.addColorStop(0, '#fffbd0'); g.addColorStop(1, '#ffcf3f');
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(sx, sy, sr, 0, 7); ctx.fill();
    // 雲（視差）
    clouds.forEach((c) => {
      const cx = c.x, cy = c.y * H, s = c.s * Math.max(0.7, Math.min(1.3, W / 700));
      ctx.fillStyle = 'rgba(255,255,255,.95)';
      ctx.beginPath();
      ctx.arc(cx, cy, 18 * s, 0, 7); ctx.arc(cx + 22 * s, cy - 10 * s, 24 * s, 0, 7);
      ctx.arc(cx + 48 * s, cy, 17 * s, 0, 7); ctx.ellipse(cx + 24 * s, cy + 7 * s, 36 * s, 11 * s, 0, 0, 7);
      ctx.fill();
      ctx.fillStyle = 'rgba(180,215,240,.35)';
      ctx.beginPath(); ctx.ellipse(cx + 24 * s, cy + 12 * s, 34 * s, 6 * s, 0, 0, 7); ctx.fill();
    });
    // 遠山兩層
    ctx.fillStyle = '#b6e3a0';
    ctx.beginPath(); ctx.moveTo(0, groundY);
    for (let x = 0; x <= W + 20; x += 20) ctx.lineTo(x, horizon - 30 - Math.sin(x / 140 + 1) * 28);
    ctx.lineTo(W, groundY); ctx.fill();
    ctx.fillStyle = '#95d47c';
    ctx.beginPath(); ctx.moveTo(0, groundY);
    for (let x = 0; x <= W + 20; x += 20) ctx.lineTo(x, horizon + 10 - Math.sin(x / 90) * 16);
    ctx.lineTo(W, groundY); ctx.fill();
    // 果樹
    trees.forEach((t) => drawTree(t.x, horizon + 30, t.s, t.fruits));
    // 草地
    g = ctx.createLinearGradient(0, groundY - 10, 0, H);
    g.addColorStop(0, '#8fd86a'); g.addColorStop(1, '#5cb847');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.moveTo(0, H);
    for (let x = 0; x <= W + 20; x += 20) ctx.lineTo(x, groundY + Math.sin(x / 60) * 4);
    ctx.lineTo(W, H); ctx.fill();
    ctx.strokeStyle = '#4aa83a'; ctx.lineWidth = 2; ctx.lineCap = 'round';
    ctx.beginPath();
    tufts.forEach((t) => {
      const s = t.s * 6;
      ctx.moveTo(t.x, t.y); ctx.lineTo(t.x - s * 0.6, t.y - s * 1.2);
      ctx.moveTo(t.x, t.y); ctx.lineTo(t.x + s * 0.1, t.y - s * 1.6);
      ctx.moveTo(t.x, t.y); ctx.lineTo(t.x + s * 0.7, t.y - s * 1.1);
    });
    ctx.stroke();
  }
  function drawTree(x, y, s, fruits) {
    // 樹幹
    ctx.fillStyle = '#9b6a3c';
    ctx.beginPath(); ctx.moveTo(x - 9 * s, y); ctx.lineTo(x - 6 * s, y - 60 * s); ctx.lineTo(x + 6 * s, y - 60 * s); ctx.lineTo(x + 9 * s, y); ctx.fill();
    // 樹冠
    const cy = y - 85 * s;
    const g = ctx.createRadialGradient(x - 15 * s, cy - 20 * s, 5 * s, x, cy, 55 * s);
    g.addColorStop(0, '#8ee07a'); g.addColorStop(1, '#3f9e45');
    ctx.fillStyle = g;
    ctx.beginPath();
    [[-26, 8, 28], [26, 8, 28], [0, -14, 34], [0, 14, 30]].forEach(([dx, dy, r]) => {
      ctx.moveTo(x + dx * s + r * s, cy + dy * s);
      ctx.arc(x + dx * s, cy + dy * s, r * s, 0, Math.PI * 2);
    });
    ctx.fill();
    // 樹冠亮面
    ctx.fillStyle = 'rgba(255,255,255,.16)';
    ctx.beginPath(); ctx.ellipse(x - 12 * s, cy - 26 * s, 16 * s, 9 * s, -0.4, 0, Math.PI * 2); ctx.fill();
    // 樹上的小果子
    fruits.forEach((f) => {
      const fx = x + Math.cos(f.a) * f.d * 40 * s, fy = cy + Math.sin(f.a) * f.d * 26 * s;
      ctx.fillStyle = f.c; ctx.beginPath(); ctx.arc(fx, fy, 5 * s, 0, 7); ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,.6)'; ctx.beginPath(); ctx.arc(fx - 1.5 * s, fy - 1.5 * s, 1.6 * s, 0, 7); ctx.fill();
    });
  }

  /* ---------- 籃子 ---------- */
  function basketTop() { return groundY + 8 - basket.h; }
  function drawBasket() {
    const w = basket.w, h = basket.h;
    const x = basket.x + Math.sin(basket.shake * 40) * basket.shake * 14;
    const bottom = groundY + 8;
    const sq = basket.squash;
    ctx.save();
    ctx.translate(x, bottom);
    ctx.scale(1 + sq * 0.08, 1 - sq * 0.1);
    // 影子
    ctx.fillStyle = 'rgba(40,80,20,.25)';
    ctx.beginPath(); ctx.ellipse(0, 4, w * 0.5, h * 0.12, 0, 0, 7); ctx.fill();
    // 提把（在後面）
    ctx.strokeStyle = '#a5642c'; ctx.lineWidth = w * 0.07; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.ellipse(0, -h * 0.92, w * 0.38, h * 0.72, 0, Math.PI, 0); ctx.stroke();
    ctx.strokeStyle = '#d99b5a'; ctx.lineWidth = w * 0.03;
    ctx.beginPath(); ctx.ellipse(0, -h * 0.92, w * 0.38, h * 0.72, 0, Math.PI + 0.1, -0.1); ctx.stroke();
    // 裝在裡面的水果（露出一點點）
    basket.pile.forEach((p, i) => {
      const sp = sprite(p.e, S * 0.8);
      const px = (i - (basket.pile.length - 1) / 2) * w * 0.17;
      ctx.drawImage(sp, px - sp._half, -h * 0.98 - sp._half + (i % 2) * 6, sp._half * 2, sp._half * 2);
    });
    // 籃身（梯形）
    const top = -h * 0.9, tw = w * 0.5, bw = w * 0.38;
    ctx.save();
    ctx.beginPath();
    ctx.moveTo(-tw, top); ctx.lineTo(tw, top);
    ctx.lineTo(bw, -h * 0.08); ctx.quadraticCurveTo(bw, 0, bw - 10, 0);
    ctx.lineTo(-bw + 10, 0); ctx.quadraticCurveTo(-bw, 0, -bw, -h * 0.08);
    ctx.closePath();
    let g = ctx.createLinearGradient(-tw, 0, tw, 0);
    g.addColorStop(0, '#c98845'); g.addColorStop(0.5, '#e8b26c'); g.addColorStop(1, '#b67533');
    ctx.fillStyle = g; ctx.fill();
    ctx.clip();
    // 編織紋路：一排排交錯的小橢圓
    const rows = 4, rh = (h * 0.9) / rows;
    for (let r = 0; r < rows; r++) {
      const y = top + rh * (r + 0.5);
      for (let k = -8; k <= 8; k++) {
        const cx = k * w * 0.09 + (r % 2 ? w * 0.045 : 0);
        ctx.fillStyle = 'rgba(255,230,180,.45)';
        ctx.beginPath(); ctx.ellipse(cx, y, w * 0.038, rh * 0.36, 0, 0, 7); ctx.fill();
        ctx.fillStyle = 'rgba(120,70,20,.25)';
        ctx.beginPath(); ctx.ellipse(cx + w * 0.045, y, w * 0.01, rh * 0.4, 0, 0, 7); ctx.fill();
      }
      ctx.fillStyle = 'rgba(110,60,20,.3)';
      ctx.fillRect(-tw, top + rh * (r + 1) - 1.5, tw * 2, 3);
    }
    ctx.restore();
    // 籃口邊框
    g = ctx.createLinearGradient(0, top - h * 0.12, 0, top + h * 0.12);
    g.addColorStop(0, '#f2c27e'); g.addColorStop(1, '#a8682c');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.ellipse(0, top, tw + 4, h * 0.11, 0, 0, 7); ctx.fill();
    ctx.strokeStyle = 'rgba(120,70,20,.4)'; ctx.lineWidth = 1.5;
    for (let k = -6; k <= 6; k++) {
      ctx.beginPath(); ctx.moveTo(k * tw / 6 - 4, top - h * 0.09); ctx.lineTo(k * tw / 6 + 4, top + h * 0.09); ctx.stroke();
    }
    // 小蝴蝶結
    ctx.fillStyle = '#ff7aa2';
    ctx.beginPath(); ctx.ellipse(-tw * 0.62 - 8, top + h * 0.25, 9, 6, -0.5, 0, 7); ctx.ellipse(-tw * 0.62 + 8, top + h * 0.25, 9, 6, 0.5, 0, 7); ctx.fill();
    ctx.fillStyle = '#ff4d85'; ctx.beginPath(); ctx.arc(-tw * 0.62, top + h * 0.25, 4, 0, 7); ctx.fill();
    ctx.restore();
  }

  /* ---------- 石頭（自己畫） ---------- */
  function drawRock(r) {
    const g = ctx.createRadialGradient(-r * 0.3, -r * 0.35, r * 0.1, 0, 0, r);
    g.addColorStop(0, '#c9ccd6'); g.addColorStop(1, '#7c8090');
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.moveTo(-r * 0.9, r * 0.2);
    ctx.quadraticCurveTo(-r, -r * 0.6, -r * 0.2, -r * 0.75);
    ctx.quadraticCurveTo(r * 0.7, -r * 0.9, r * 0.9, -r * 0.1);
    ctx.quadraticCurveTo(r, r * 0.7, 0, r * 0.7);
    ctx.quadraticCurveTo(-r * 0.8, r * 0.75, -r * 0.9, r * 0.2);
    ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,.4)';
    ctx.beginPath(); ctx.ellipse(-r * 0.35, -r * 0.4, r * 0.2, r * 0.1, -0.5, 0, 7); ctx.fill();
    ctx.fillStyle = 'rgba(80,80,100,.35)';
    ctx.beginPath(); ctx.arc(r * 0.3, r * 0.2, r * 0.1, 0, 7); ctx.arc(-r * 0.2, r * 0.3, r * 0.07, 0, 7); ctx.fill();
  }

  /* ---------- 物件 ---------- */
  function speedFactor() { return (1 + Math.min(1.1, elapsed / 80)) * Math.max(0.8, H / 800); }

  function spawn() {
    const d = elapsed;
    const roll = Math.random();
    let it;
    if (d > 8 && roll < 0.12) {
      it = { kind: 'bad', e: Math.random() < 0.5 ? '🐛' : 'rock' };
    } else if (hearts < MAX_HEARTS && roll > 0.975) {
      it = { kind: 'heart', e: '💖' };
    } else {
      const f = KG.pick(FRUITS);
      it = { kind: 'fruit', e: f[0], c: f[1] };
    }
    it.x = KG.rand(S * 0.7, W - S * 0.7);
    it.y = -S;
    it.v = KG.rand(110, 150) * speedFactor() * (it.kind === 'bad' ? 0.8 : 1);
    it.rot = KG.rand(-0.5, 0.5); it.vr = KG.rand(-1.5, 1.5);
    it.t = 0;
    items.push(it);
  }

  function splash(x, y, color, n) {
    for (let i = 0; i < n; i++) {
      const a = -Math.PI / 2 + KG.rand(-1.3, 1.3), sp = KG.rand(120, 320);
      parts.push({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, r: KG.rand(3, 7), life: 1, c: color });
    }
  }
  function floatText(x, y, text, color) { texts.push({ x, y, text, color, life: 1 }); }

  function catchItem(it) {
    const y = basketTop();
    basket.squash = 1;
    if (it.kind === 'fruit') {
      score++;
      KG.note(KG.rand(600, 760), 0.1, 'triangle', 0.22, 0, 1100);
      KG.note(1300, 0.08, 'sine', 0.1, 0.06);
      splash(it.x, y, it.c, 14);
      splash(it.x, y, '#ffffff', 4);
      floatText(it.x, y - 30, '+1', '#ff5d8f');
      basket.pile.push({ e: it.e });
      if (basket.pile.length > 5) basket.pile.shift();
      if (score % 10 === 0) { KG.toast(KG.pick(['好棒！', '好多水果！', '太厲害了！'])); KG.sound('sparkle'); }
    } else if (it.kind === 'heart') {
      hearts = Math.min(MAX_HEARTS, hearts + 1);
      KG.sound('coin');
      splash(it.x, y, '#ff7aa2', 16);
      KG.toast('多一顆愛心！');
    } else {
      if (hurtT > 0) return;
      hearts--;
      hurtT = 1.2;
      basket.shake = 0.5;
      KG.sound('boing');
      KG.vibrate(60);
      hudHearts.classList.remove('hurt'); void hudHearts.offsetWidth; hudHearts.classList.add('hurt');
      splash(it.x, y, it.e === 'rock' ? '#9aa0ad' : '#9be15d', 10);
      if (hearts > 0) KG.toast(it.e === 'rock' ? '哎呀，是石頭！' : '哎呀，是毛毛蟲！');
      if (hearts <= 0) endGame();
    }
    updateHud();
  }

  function updateHud() {
    hudScore.textContent = '🧺 ' + score;
    hudHearts.textContent = '❤️'.repeat(Math.max(0, hearts)) + '🤍'.repeat(MAX_HEARTS - Math.max(0, hearts));
  }

  function startGame() {
    items = []; parts = []; texts = []; basket.pile = [];
    score = 0; hearts = MAX_HEARTS; elapsed = 0; spawnT = 0.5; hurtT = 0;
    basket.x = basket.tx = W / 2;
    state = 'play';
    updateHud();
  }

  function endGame() {
    state = 'over';
    const best = KG.best('fruit-catch', score);
    const stars = score >= 40 ? 3 : score >= 15 ? 2 : 1;
    setTimeout(() => {
      KG.say('你接到了 ' + score + ' 個水果！');
      KG.showWin({
        icon: '🧺', title: '好棒！接了好多水果！', stars,
        message: '接到 ' + score + ' 個水果（最高 ' + best + ' 個）',
        onReplay: startGame
      });
    }, 700);
  }

  /* ---------- 主迴圈 ---------- */
  let last = performance.now();
  function frame(now) {
    const dt = Math.min(0.05, (now - last) / 1000);
    last = now;
    clock += dt;
    clouds.forEach((c) => { c.x += c.v * dt; if (c.x > W + 30) c.x = -110; });

    // 籃子移動
    const kdir = (keys.ArrowRight || keys.d ? 1 : 0) - (keys.ArrowLeft || keys.a ? 1 : 0);
    if (kdir) basket.tx += kdir * Math.max(420, W * 0.9) * dt;
    basket.tx = Math.min(Math.max(basket.tx, basket.w / 2), W - basket.w / 2);
    basket.x += (basket.tx - basket.x) * Math.min(1, dt * 16);
    basket.shake = Math.max(0, basket.shake - dt);
    basket.squash = Math.max(0, basket.squash - dt * 5);
    hurtT = Math.max(0, hurtT - dt);

    if (state === 'play') {
      elapsed += dt;
      spawnT -= dt;
      if (spawnT <= 0) { spawn(); spawnT = Math.max(0.55, 1.15 - elapsed / 120) * KG.rand(0.8, 1.2); }
      const top = basketTop();
      for (let i = items.length - 1; i >= 0; i--) {
        const it = items[i];
        if (it.landed) continue;
        const prevY = it.y;
        it.t += dt;
        it.y += it.v * dt;
        it.rot += it.vr * dt;
        // 進籃子：穿過籃口高度，而且 x 在籃子範圍內
        if (prevY < top && it.y >= top && Math.abs(it.x - basket.x) < basket.w * 0.5 + S * 0.25) {
          items.splice(i, 1);
          catchItem(it);
          if (state !== 'play') break;
          continue;
        }
        // 掉到草地上：彈一下後消失（不扣分）
        if (it.y > groundY + 4) {
          it.landed = true; it.life = 0.6;
          if (it.kind === 'fruit') { splash(it.x, groundY, it.c, 6); KG.note(220, 0.08, 'sine', 0.1, 0, 140); }
        }
      }
    }
    items.forEach((it) => { if (it.landed) it.life -= dt; });
    items = items.filter((it) => !it.landed || it.life > 0);
    parts.forEach((p) => { p.vy += 700 * dt; p.x += p.vx * dt; p.y += p.vy * dt; p.life -= dt * 1.5; });
    parts = parts.filter((p) => p.life > 0 && p.y < H + 20);
    texts.forEach((t) => { t.y -= 60 * dt; t.life -= dt * 1.2; });
    texts = texts.filter((t) => t.life > 0);

    // 繪圖
    drawBackground();
    drawBasket();
    items.forEach((it) => {
      ctx.save();
      ctx.translate(it.x, it.y);
      if (it.landed) { ctx.globalAlpha = Math.max(0, it.life / 0.6); ctx.scale(1.1, 0.85); }
      ctx.rotate(it.rot);
      if (it.e === 'rock') drawRock(S * 0.42);
      else {
        let s = S;
        if (it.e === '🐛') ctx.rotate(Math.sin(it.t * 10) * 0.25); // 毛毛蟲扭來扭去
        if (it.kind === 'heart') s = S * (1 + Math.sin(clock * 8) * 0.08);
        const sp = sprite(it.e, Math.round(s));
        ctx.drawImage(sp, -sp._half, -sp._half, sp._half * 2, sp._half * 2);
      }
      ctx.restore();
    });
    parts.forEach((p) => {
      ctx.globalAlpha = Math.max(0, p.life);
      ctx.fillStyle = p.c;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r * (0.5 + p.life * 0.5), 0, 7); ctx.fill();
    });
    ctx.globalAlpha = 1;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    texts.forEach((t) => {
      ctx.globalAlpha = Math.max(0, Math.min(1, t.life * 2));
      ctx.font = '800 28px ' + FONT;
      ctx.lineWidth = 6; ctx.strokeStyle = '#fff'; ctx.strokeText(t.text, t.x, t.y);
      ctx.fillStyle = t.color; ctx.fillText(t.text, t.x, t.y);
    });
    ctx.globalAlpha = 1;
    requestAnimationFrame(frame);
  }

  /* ---------- 輸入 ---------- */
  let dragging = false;
  cv.addEventListener('pointerdown', (e) => {
    e.preventDefault();
    dragging = true;
    try { cv.setPointerCapture(e.pointerId); } catch (err) { /* 忽略 */ }
    basket.tx = e.clientX;
  });
  cv.addEventListener('pointermove', (e) => {
    // 滑鼠直接跟著移動；觸控需按住拖曳
    if (dragging || e.pointerType === 'mouse') basket.tx = e.clientX;
  });
  const stop = () => { dragging = false; };
  cv.addEventListener('pointerup', stop);
  cv.addEventListener('pointercancel', stop);
  window.addEventListener('keydown', (e) => {
    const k = e.key.length === 1 ? e.key.toLowerCase() : e.key;
    if (k === 'ArrowLeft' || k === 'ArrowRight' || k === 'a' || k === 'd') { keys[k] = true; e.preventDefault(); }
  });
  window.addEventListener('keyup', (e) => { const k = e.key.length === 1 ? e.key.toLowerCase() : e.key; keys[k] = false; });
  window.addEventListener('blur', () => { for (const k in keys) keys[k] = false; });
  window.addEventListener('resize', resize);
  document.addEventListener('gesturestart', (e) => e.preventDefault());

  resize();
  updateHud();
  requestAnimationFrame(frame);
  KG.showStart({
    icon: '🧺', title: '接水果',
    message: '左右移動籃子接水果！小心毛毛蟲和石頭喔～',
    button: '開始玩！',
    onStart: startGame
  });
})();
</script>
</body>
</html>
