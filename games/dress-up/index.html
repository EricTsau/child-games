<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>小熊換裝</title>
<link rel="stylesheet" href="../../assets/common.css">
<style>
  html, body { height: 100%; overflow: hidden; }
  body {
    height: 100vh; height: 100dvh;
    background:
      radial-gradient(circle, rgba(255,255,255,.55) 2px, transparent 3px) 0 0 / 26px 26px,
      linear-gradient(180deg, #ffe7d6 0%, #ffd9e6 100%);
  }
  #wrap {
    position: absolute; inset: 0;
    display: grid; grid-template-rows: 1fr auto;
    padding: 66px 10px max(8px, env(safe-area-inset-bottom));
    gap: 8px;
  }
  #stage { position: relative; min-height: 0; display: grid; place-items: center; touch-action: none; }
  #frame {
    position: relative; height: 100%; max-height: 100%; aspect-ratio: 4 / 5; max-width: 100%;
    border-radius: 26px; overflow: hidden; border: 6px solid #fff;
    box-shadow: 0 10px 0 rgba(180,110,90,.18), 0 16px 34px rgba(160,90,90,.3);
    background: #fff;
  }
  @supports not (aspect-ratio: 4 / 5) { #frame { width: 100%; } }
  #scene { display: block; width: 100%; height: 100%; touch-action: none; }
  #bear { transform-origin: 200px 472px; animation: sway 3.2s ease-in-out infinite alternate; cursor: pointer; }
  #bear.jump { animation: jump .55s cubic-bezier(.3,1.6,.5,1); }
  @keyframes sway { from { transform: rotate(-2.2deg); } to { transform: rotate(2.2deg); } }
  @keyframes jump { 0% { transform: translateY(0) scale(1,1); } 30% { transform: translateY(6px) scale(1.06,.93); } 60% { transform: translateY(-26px) scale(.96,1.05); } 100% { transform: translateY(0); } }
  .eye { transform-box: fill-box; transform-origin: center; animation: blink 4.6s infinite; }
  @keyframes blink { 0%, 93%, 100% { transform: scaleY(1); } 96% { transform: scaleY(.08); } }
  .pop { transform-box: fill-box; transform-origin: center; animation: itemPop .45s cubic-bezier(.2,1.7,.4,1); }
  @keyframes itemPop { from { transform: scale(.6); opacity: .2; } to { transform: scale(1); opacity: 1; } }
  .spk { transform-box: fill-box; transform-origin: center; animation: spk .9s ease-out forwards; }
  @keyframes spk { 0% { transform: scale(0) rotate(0); opacity: 1; } 60% { transform: scale(1.2) rotate(90deg); opacity: 1; } 100% { transform: scale(.4) rotate(180deg); opacity: 0; } }
  .balloon { transform-box: fill-box; transform-origin: 50% 100%; animation: bob 2.4s ease-in-out infinite alternate; }
  @keyframes bob { from { transform: rotate(-4deg); } to { transform: rotate(4deg); } }
  .twinkle { animation: tw 1.8s ease-in-out infinite alternate; }
  @keyframes tw { from { opacity: .3; } to { opacity: 1; } }

  .fab { position: absolute; z-index: 5; width: 64px; height: 64px; border-radius: 50%; border: 4px solid #fff; font-size: 30px; display: grid; place-items: center; cursor: pointer; box-shadow: var(--kg-shadow); }
  .fab:active { transform: scale(.9); }
  #bRand { left: 6px; bottom: 6px; background: linear-gradient(180deg, #ffe58a, #f5b82e); }
  #bPhoto { right: 6px; bottom: 6px; background: linear-gradient(180deg, #9ad8ff, #3a9ee8); }
  #flash { position: fixed; inset: 0; background: #fff; opacity: 0; pointer-events: none; z-index: 9200; }
  #flash.on { animation: flash .6s ease-out; }
  @keyframes flash { 0% { opacity: .95; } 100% { opacity: 0; } }

  #panel { background: rgba(255,255,255,.75); border: 4px solid #fff; border-radius: 26px; box-shadow: var(--kg-shadow); padding: 8px; display: flex; flex-direction: column; gap: 8px; min-width: 0; }
  #tabs { display: grid; grid-template-columns: repeat(6, 1fr); gap: 5px; }
  .tab { min-height: 58px; border: none; border-radius: 16px; background: #fff3e9; font-family: var(--kg-font); color: var(--kg-ink); font-size: 13px; font-weight: 800; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; cursor: pointer; padding: 2px; box-shadow: inset 0 -3px 0 rgba(200,140,100,.2); }
  .tab b { font-size: 24px; line-height: 1.1; }
  .tab.on { background: linear-gradient(180deg, #ffb4cb, #ff8fb1); color: #fff; box-shadow: inset 0 -3px 0 rgba(180,60,100,.3); transform: translateY(-2px); }
  #items { display: flex; gap: 8px; overflow-x: auto; overflow-y: hidden; padding: 4px 2px 6px; touch-action: pan-x; scrollbar-width: thin; }
  .item { flex: none; width: 78px; height: 78px; border-radius: 20px; border: 4px solid #fff; background: radial-gradient(circle at 40% 30%, #fff, #ffeef3); box-shadow: 0 4px 0 rgba(200,120,150,.25); cursor: pointer; padding: 3px; display: grid; place-items: center; }
  .item svg { width: 100%; height: 100%; }
  .item.on { border-color: #ff8fb1; background: radial-gradient(circle at 40% 30%, #fff, #ffd6e4); transform: translateY(-2px); }
  .item.none { font-size: 30px; color: #c9a; }

  #photoCard img { width: 100%; max-height: 52vh; object-fit: contain; border-radius: 16px; box-shadow: 0 6px 16px rgba(0,0,0,.2); margin-bottom: 14px; }

  @media (orientation: landscape) and (max-height: 600px), (min-aspect-ratio: 5/4) {
    #wrap { grid-template-rows: 1fr; grid-template-columns: 1fr minmax(280px, 42%); padding: 66px 12px 10px; }
    #panel { overflow: hidden; }
    #items { flex-wrap: wrap; overflow-y: auto; overflow-x: hidden; touch-action: pan-y; align-content: flex-start; }
    #panel { max-height: 100%; }
    .item { width: 72px; height: 72px; }
  }
</style>
</head>

    let s = '';
    for (let i = 0; i < 5; i++) { const a = i / 5 * Math.PI * 2; s += `<circle cx="${x + Math.cos(a) * r}" cy="${y + Math.sin(a) * r}" r="${r * .8}" fill="${col}"/>`; }
    return s + `<circle cx="${x}" cy="${y}" r="${r * .6}" fill="#ffd65c"/>`;
  };
  const star = (x, y, r, fill, extra) => {
    let p = '';
    for (let i = 0; i < 10; i++) { const rr = i % 2 ? r * .45 : r, a = i / 10 * Math.PI * 2 - Math.PI / 2; p += (i ? 'L' : 'M') + (x + Math.cos(a) * rr).toFixed(1) + ' ' + (y + Math.sin(a) * rr).toFixed(1); }
    return `<path d="${p}Z" fill="${fill}" ${extra || ''}/>`;
  };

        <path d="M116 364 Q200 380 284 364 L304 410 Q282 424 260 412 Q238 428 216 414 Q194 428 172 414 Q150 426 128 412 Q108 422 96 410 Z" fill="url(#pinkG)"/>

        <rect y="400" width="400" height="100" fill="url(#planks)"/>

      { n: '花園', svg: `<rect width="400" height="500" fill="#bde8ff"/><rect width="400" height="300" fill="url(#skyG)"/>
        <circle cx="330" cy="70" r="36" fill="#ffd65c"/><circle cx="330" cy="70" r="48" fill="#ffd65c" opacity=".25"/>
        <g fill="#fff"><circle cx="80" cy="80" r="22"/><circle cx="106" cy="72" r="28"/><circle cx="134" cy="84" r="20"/><rect x="80" y="84" width="54" height="20" rx="10"/></g>
        <path d="M0 330 Q100 270 200 320 Q300 270 400 320 L400 500 L0 500 Z" fill="#8fd47a"/>
        <path d="M0 380 Q200 330 400 380 L400 500 L0 500 Z" fill="#6cc25e"/>
        ${[30, 70, 330, 370].map(x => `<rect x="${x - 8}" y="300" width="16" height="90" rx="8" fill="#fff" stroke="#e6d6c6" stroke-width="2"/>`).join('')}

      { n: '海邊', svg: `<rect width="400" height="500" fill="url(#skyG)"/>
        <circle cx="80" cy="80" r="34" fill="#ffd65c"/>
        <rect y="250" width="400" height="120" fill="#38b6e8"/><path d="M0 252 Q50 240 100 252 T200 252 T300 252 T400 252 L400 262 L0 262 Z" fill="#8fe3ff"/>
        <path d="M0 300 Q40 292 80 300 M160 320 Q200 312 240 320 M300 290 Q340 282 380 290" stroke="#fff" stroke-width="4" fill="none" opacity=".7" stroke-linecap="round"/>
        <path d="M0 360 Q200 330 400 360 L400 500 L0 500 Z" fill="#ffe2a0"/><path d="M0 360 Q200 330 400 360" stroke="#fff" stroke-width="6" fill="none" opacity=".8"/>
        <path d="M350 400 Q340 300 360 200" stroke="#a8743c" stroke-width="16" fill="none" stroke-linecap="round"/>
        <g fill="#4fb86a"><path d="M360 200 Q320 170 290 200 Q330 190 360 205Z"/><path d="M360 200 Q400 170 420 210 Q390 195 360 205Z"/><path d="M360 200 Q350 150 310 150 Q345 170 358 205Z"/><path d="M360 200 Q380 150 410 160 Q375 175 362 205Z"/></g>
        <circle cx="352" cy="210" r="8" fill="#8a5a3c"/><circle cx="366" cy="212" r="8" fill="#8a5a3c"/>
        ${star(60, 450, 16, '#ff8a6b')}<path d="M100 470 Q110 450 120 470 Z" fill="#ffb3c4"/>` },
      { n: '星空', svg: `<rect width="400" height="500" fill="url(#nightG)"/>
        ${Array.from({ length: 30 }, (_, i) => `<circle class="twinkle" cx="${(i * 137) % 400}" cy="${(i * 71) % 300}" r="${1 + (i % 3)}" fill="#fff" style="animation-delay:${-(i % 7) * .3}s"/>`).join('')}
        <circle cx="320" cy="80" r="36" fill="#fff6c8"/><circle cx="336" cy="70" r="32" fill="#2a2f6b"/>
        ${star(80, 90, 12, '#ffd65c', 'class="twinkle"')}${star(200, 50, 9, '#ffd65c', 'class="twinkle" style="animation-delay:-.9s"')}

      { n: '糖果屋', svg: `<rect width="400" height="500" fill="url(#candy)"/>
        <rect y="400" width="400" height="100" fill="#ffb4cb"/><rect y="400" width="400" height="10" fill="#fff" opacity=".7"/>
        ${[[50, 300, '#ff8fb1'], [350, 280, '#6cc4ff']].map(([x, y, c]) => `<rect x="${x - 4}" y="${y}" width="8" height="110" fill="#fff"/><circle cx="${x}" cy="${y}" r="34" fill="${c}"/><path d="M${x} ${y} m-24 0 a24 24 0 1 1 24 24 a16 16 0 1 1 -16 -16 a8 8 0 1 1 8 8" stroke="#fff" stroke-width="5" fill="none"/>`).join('')}
        <path d="M30 110 L370 110" stroke="#c98b4e" stroke-width="8" stroke-linecap="round"/>
        ${[[80, '#ff8fb1'], [160, '#ffd65c'], [240, '#7bd88f'], [320, '#b49cff']].map(([x, c]) => `<path d="M${x - 18} 106 L${x - 14} 80 L${x + 14} 80 L${x + 18} 106 Z" fill="#e8b07a"/><path d="M${x - 18} 82 Q${x} 50 ${x + 18} 82 Z" fill="${c}"/><circle cx="${x}" cy="60" r="5" fill="#e2434f"/>`).join('')}` },
    ] },
  ];

  // 背景用的漸層（加在 defs）
  $('scene').querySelector('defs').insertAdjacentHTML('beforeend',
    '<linearGradient id="skyG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7cc8ff"/><stop offset="1" stop-color="#d8f1ff"/></linearGradient>' +
    '<linearGradient id="nightG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1c1f4a"/><stop offset="1" stop-color="#5a4a9a"/></linearGradient>');

  const LAYER = { hat: $('L-hat'), top: $('L-top'), pants: $('L-pants'), shoes: $('L-shoes'), acc: $('L-acc'), bg: $('L-bg') };
  const sel = { hat: -1, top: -1, pants: -1, shoes: -1, acc: -1, bg: 0 };
  let curCat = 0;

  function render(key, animate) {
    const cat = CATS.find(c => c.key === key), it = cat.items[sel[key]];
    LAYER[key].innerHTML = it ? it.svg : '';
    if (key === 'top') $('L-sleeves').innerHTML = it ? (it.sl || '') : '';
    if (animate && it && key !== 'bg') {
      LAYER[key].classList.remove('pop'); void LAYER[key].getBBox(); LAYER[key].classList.add('pop');
      sparkle(LAYER[key]);
    }
  }

  // 閃亮亮
  function sparkle(layer) {
    let b;
    try { b = layer.getBBox(); } catch (e) { return; }
    if (!b.width) return;
    const g = $('L-spk');
    for (let i = 0; i < 7; i++) {
      const x = b.x + Math.random() * b.width, y = b.y + Math.random() * b.height;
      const el = document.createElementNS(NS, 'g');
      el.innerHTML = star(x, y, KG.rand(7, 14), KG.pick(['#fff6a8', '#fff', '#ffd6e4']));
      el.firstChild.setAttribute('class', 'spk');
      el.firstChild.style.animationDelay = (i * 0.06) + 's';
      g.appendChild(el);
      setTimeout(() => el.remove(), 1300);
    }
  }

  // ---------- 面板 ----------
  const tabsEl = $('tabs'), itemsEl = $('items');
  CATS.forEach((c, i) => {
    const b = document.createElement('button');
    b.className = 'tab';
    b.innerHTML = `<b>${c.icon}</b>${c.name}`;
    b.addEventListener('click', () => { KG.sound('click'); curCat = i; buildItems(); });
    tabsEl.appendChild(b);
  });

  function buildItems() {
    [...tabsEl.children].forEach((t, i) => t.classList.toggle('on', i === curCat));
    const cat = CATS[curCat];
    itemsEl.innerHTML = '';
    if (!cat.noNone) {
      const b = document.createElement('button');
      b.className = 'item none' + (sel[cat.key] === -1 ? ' on' : '');
      b.setAttribute('aria-label', '不要');
      b.textContent = '🚫';
      b.addEventListener('click', () => choose(cat.key, -1));
      itemsEl.appendChild(b);
    }
    cat.items.forEach((it, i) => {
      const b = document.createElement('button');
      b.className = 'item' + (sel[cat.key] === i ? ' on' : '');
      b.title = it.n; b.setAttribute('aria-label', it.n);
      b.innerHTML = `<svg viewBox="${it.vb || cat.vb}" preserveAspectRatio="xMidYMid meet">${it.svg}${cat.key === 'top' ? it.sl || '' : ''}</svg>`;
      b.addEventListener('click', () => choose(cat.key, i));
      itemsEl.appendChild(b);
    });
    itemsEl.scrollLeft = 0;
  }

  const PRAISE = ['好可愛！', '好漂亮！', '好帥喔！', '好棒！', '真好看！'];
  function choose(key, i) {
    if (sel[key] === i && key !== 'bg') i = -1;   // 再點一次就脫下
    sel[key] = i;
    render(key, true);
    buildItems();
    if (i >= 0) { KG.sound('sparkle'); if (Math.random() < 0.35) KG.say(KG.pick(PRAISE)); }
    else KG.sound('pop');
    jump();
  }

  function jump() {
    const bear = $('bear');
    bear.classList.remove('jump'); void bear.getBBox(); bear.classList.add('jump');
    clearTimeout(jump.t); jump.t = setTimeout(() => bear.classList.remove('jump'), 600);
  }

  $('bear').addEventListener('pointerdown', () => { jump(); KG.sound('boing'); });

  $('bRand').addEventListener('click', () => {
    KG.sound('whoosh');
    CATS.forEach(c => {
      sel[c.key] = c.noNone ? KG.randInt(0, c.items.length - 1) : (Math.random() < (c.key === 'acc' ? .3 : .12) ? -1 : KG.randInt(0, c.items.length - 1));
      render(c.key, true);
    });
    buildItems(); jump();
    setTimeout(() => KG.sound('sparkle'), 150);
  });

  // ---------- 拍照 ----------
  $('bPhoto').addEventListener('click', takePhoto);
  function takePhoto() {
    if (document.querySelector('.kg-overlay')) return;
    const fl = $('flash');
    fl.classList.remove('on'); void fl.offsetWidth; fl.classList.add('on');
    KG.note(1800, 0.05, 'square', 0.12); KG.note(900, 0.08, 'square', 0.1, 0.06);
    const clone = $('scene').cloneNode(true);
    clone.querySelector('#L-spk').innerHTML = '';
    clone.setAttribute('width', '800'); clone.setAttribute('height', '1000');
    clone.removeAttribute('style');
    const data = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(new XMLSerializer().serializeToString(clone));
    const img = new Image();
    img.onload = () => {
      const c = document.createElement('canvas');
      c.width = 880; c.height = 1140;
      const x = c.getContext('2d');
      x.fillStyle = '#fff'; x.fillRect(0, 0, c.width, c.height);
      x.save(); x.beginPath(); x.roundRect ? x.roundRect(40, 40, 800, 1000, 24) : x.rect(40, 40, 800, 1000); x.clip();
      x.drawImage(img, 40, 40, 800, 1000); x.restore();
      x.fillStyle = '#e8648d'; x.textAlign = 'center';
      x.font = '800 52px ' + getComputedStyle(document.body).fontFamily;
      x.fillText('🧸 我的小熊 💕', 440, 1105);
      showPhoto(c.toDataURL('image/png'));
    };
    img.onerror = () => KG.toast('拍照失敗了');
    img.src = data;
  }

  function showPhoto(url) {
    const ov = document.createElement('div');
    ov.className = 'kg-overlay';
    ov.innerHTML = `<div class="kg-card" id="photoCard"><h2>📸 拍好了！</h2><img alt="小熊照片"><div class="kg-actions">
      <a class="kg-btn green" download="my-bear.png" style="text-decoration:none">💾 儲存</a><button class="kg-btn blue">繼續玩</button></div></div>`;
    ov.querySelector('img').src = url;
    ov.querySelector('a').href = url;
    ov.querySelector('a').addEventListener('click', () => { KG.sound('coin'); KG.toast('存好了！'); });
    ov.querySelector('button').addEventListener('click', () => { KG.sound('click'); ov.remove(); });
    document.body.appendChild(ov);
    KG.sound('win'); KG.confetti(innerWidth / 2, innerHeight / 3, 80);
    KG.say('好可愛的照片！');
  }

  $('stage').addEventListener('touchmove', e => e.preventDefault(), { passive: false });
  document.addEventListener('gesturestart', e => e.preventDefault());

  Object.keys(sel).forEach(k => render(k, false));
  buildItems();
  KG.showStart({
    icon: '🧸', title: '小熊換裝',
    message: '選帽子、衣服和鞋子，幫小熊打扮，再拍張照吧！',
    onStart: () => { KG.sound('pop'); jump(); }
  });
})();
