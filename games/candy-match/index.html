  function drawBG() {
    bg.width = cv.width; bg.height = cv.height;
    const c = bg.getContext('2d');
    c.setTransform(view.DPR, 0, 0, view.DPR, 0, 0);
    const g = c.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, theme.sky[0]); g.addColorStop(1, theme.sky[1]);
    c.fillStyle = g; c.fillRect(0, 0, W, H);
    if (theme.night) {
      for (let i = 0; i < 70; i++) { c.fillStyle = 'rgba(255,255,255,' + KG.rand(0.3, 0.9) + ')'; c.beginPath(); c.arc(Math.random() * W, Math.random() * H * 0.7, KG.rand(0.7, 2), 0, TAU); c.fill(); }
    }
    if (theme.rainbow) {
      const cx = W / 2, cy = H * 0.85, R = Math.max(W, H) * 0.6;
      ['#ff8fb1', '#ffb36b', '#ffe066', '#9be8aa', '#7fd1ff', '#c4a2ff'].forEach((col, i) => {
        c.strokeStyle = col; c.globalAlpha = 0.35; c.lineWidth = R * 0.05;
        c.beginPath(); c.arc(cx, cy, R - i * R * 0.05, Math.PI, 0); c.stroke();
      });
      c.globalAlpha = 1;
    }
    // 遠山（糖果山）
    const hills = (yBase, amp, cols, seed) => {
      const hg = c.createLinearGradient(0, yBase - amp, 0, H);
      hg.addColorStop(0, cols[0]); hg.addColorStop(1, cols[1]);
      c.fillStyle = hg;
      c.beginPath(); c.moveTo(0, H);
      for (let x = 0; x <= W + 10; x += 10) c.lineTo(x, yBase - Math.abs(Math.sin(x / (120 + seed * 30) + seed)) * amp);
      c.lineTo(W, H); c.fill();
      // 糖霜
      c.strokeStyle = 'rgba(255,255,255,.6)'; c.lineWidth = 5; c.lineCap = 'round';
      c.beginPath();
      for (let x = 0; x <= W + 10; x += 10) c.lineTo(x, yBase + 6 - Math.abs(Math.sin(x / (120 + seed * 30) + seed)) * amp);
      c.stroke();
    };
    hills(H * 0.62, H * 0.12, theme.hill2, 1);
    // 棒棒糖樹
    for (let i = 0; i < 6; i++) {
      const x = (i + 0.5) * W / 6 + Math.sin(i * 7) * 30, y = H * 0.66, r = 22 + (i % 3) * 8;
      c.strokeStyle = '#fff'; c.lineWidth = 6; c.beginPath(); c.moveTo(x, y); c.lineTo(x, y - 60 - r); c.stroke();
      const lg = c.createRadialGradient(x - r * 0.3, y - 60 - r * 1.3, 2, x, y - 60 - r, r);
      const col = CANDY[i % 6].pal;
      lg.addColorStop(0, col[0]); lg.addColorStop(1, col[1]);
      c.fillStyle = lg; c.beginPath(); c.arc(x, y - 60 - r, r, 0, TAU); c.fill();
      c.strokeStyle = 'rgba(255,255,255,.75)'; c.lineWidth = 3;
      c.beginPath(); for (let a = 0; a < TAU * 2.2; a += 0.2) { const rr = r * 0.9 * a / (TAU * 2.2); c.lineTo(x + Math.cos(a) * rr, y - 60 - r + Math.sin(a) * rr); } c.stroke();
    }
    hills(H * 0.78, H * 0.1, theme.hill, 2);
    // 糖粒
    for (let i = 0; i < 60; i++) {
      c.save(); c.translate(Math.random() * W, H * 0.7 + Math.random() * H * 0.3); c.rotate(Math.random() * TAU);
      c.fillStyle = KG.pick(['#fff', '#ffe066', '#7fd1ff', '#9be8aa', '#ff8fb1']);
      Draw.rr(c, -5, -1.6, 10, 3.2, 1.6); c.fill(); c.restore();
    }
    if (!grid.length) return;
    // 棋盤底座
    const pad = Math.max(8, cs * 0.16);
    c.save();
    c.shadowColor = 'rgba(120,30,80,.35)'; c.shadowBlur = 24; c.shadowOffsetY = 10;
    Draw.rr(c, bx - pad, by - pad, board + pad * 2, board + pad * 2, pad + 14);
    c.fillStyle = theme.frame[0]; c.fill();
    c.restore();
    // 糖果條紋外框
    c.save();
    Draw.rr(c, bx - pad, by - pad, board + pad * 2, board + pad * 2, pad + 14); c.clip();
    c.strokeStyle = theme.frame[1]; c.lineWidth = pad * 0.55; c.globalAlpha = 0.85;
    for (let k = -H; k < W + H; k += pad * 1.6) { c.beginPath(); c.moveTo(k, -10); c.lineTo(k + H + 20, H + 10); c.stroke(); }
    c.restore();
    c.strokeStyle = 'rgba(255,255,255,.9)'; c.lineWidth = 3;
    Draw.rr(c, bx - pad + 2, by - pad + 2, board + pad * 2 - 4, board + pad * 2 - 4, pad + 12); c.stroke();
    // 格子
    Draw.rr(c, bx - 2, by - 2, board + 4, board + 4, 12);
    c.fillStyle = theme.night ? 'rgba(40,20,80,.85)' : 'rgba(255,250,253,.92)'; c.fill();
    for (let r = 0; r < N; r++) for (let cc = 0; cc < N; cc++) {
      c.fillStyle = theme.tile[(r + cc) % 2];
      Draw.rr(c, bx + cc * cs + 2, by + r * cs + 2, cs - 4, cs - 4, cs * 0.18); c.fill();
    }
  }

  /* ---------- 糖果繪製 ---------- */
  function shapePath(c, shape, s) {
    const r = s / 2;
    c.beginPath();
    if (shape === 'heart') { Draw.heartPath(c, 0, r * 0.08, s * 1.02); return; }
    if (shape === 'star') { Draw.starPath(c, 0, r * 0.06, r * 1.02, 0.56); return; }
    if (shape === 'round') { c.arc(0, 0, r * 0.88, 0, TAU); return; }
    if (shape === 'drop') {
      c.moveTo(0, -r * 0.98);
      c.bezierCurveTo(r * 0.3, -r * 0.55, r * 0.86, -r * 0.05, r * 0.82, r * 0.32);
      c.bezierCurveTo(r * 0.78, r * 0.8, r * 0.38, r * 0.95, 0, r * 0.95);
      c.bezierCurveTo(-r * 0.38, r * 0.95, -r * 0.78, r * 0.8, -r * 0.82, r * 0.32);
      c.bezierCurveTo(-r * 0.86, -r * 0.05, -r * 0.3, -r * 0.55, 0, -r * 0.98);
      c.closePath(); return;
    }
    if (shape === 'square') { c.roundRect(-r * 0.8, -r * 0.8, r * 1.6, r * 1.6, r * 0.42); return; }
    if (shape === 'wrapped') { c.ellipse(0, 0, r * 0.62, r * 0.52, 0, 0, TAU); }
  }

  function paintCandy(c, color, special, s) {
    const r = s / 2;
    c.lineJoin = 'round'; c.lineCap = 'round';
    if (special === 'bomb') {
      // 彩虹巧克力球
      Draw.shadow(c, 0, r * 0.82, r * 0.8, r * 0.2, 0.35);
      const g = c.createRadialGradient(-r * 0.3, -r * 0.35, r * 0.05, 0, 0, r * 0.9);
      g.addColorStop(0, '#a9775a'); g.addColorStop(0.6, '#6b3e26'); g.addColorStop(1, '#3d2014');
      c.fillStyle = g; c.beginPath(); c.arc(0, 0, r * 0.84, 0, TAU); c.fill();
      c.strokeStyle = '#2a140a'; c.lineWidth = Math.max(2, s * 0.04); c.stroke();
      const cols = ['#ff4d6d', '#ffd23f', '#4fd27a', '#46a8ff', '#a774ff', '#ff9a3c', '#fff'];
      for (let i = 0; i < 16; i++) {
        const a = i * 2.39996, d = r * 0.68 * Math.sqrt((i + 0.5) / 16);
        c.save(); c.translate(Math.cos(a) * d, Math.sin(a) * d); c.rotate(a * 3);
        c.fillStyle = cols[i % cols.length]; Draw.rr(c, -r * 0.1, -r * 0.035, r * 0.2, r * 0.07, r * 0.035); c.fill(); c.restore();
      }
      c.fillStyle = 'rgba(255,255,255,.55)'; c.beginPath(); c.ellipse(-r * 0.3, -r * 0.42, r * 0.28, r * 0.13, -0.5, 0, TAU); c.fill();
      return;
    }
    const C = CANDY[color], pal = C.pal;
    Draw.shadow(c, 0, r * 0.82, r * 0.75, r * 0.18, 0.3);
    if (special === 'wrap') {
      // 包裝紙光暈
      c.fillStyle = pal[0]; c.strokeStyle = pal[3]; c.lineWidth = Math.max(2, s * 0.035);
      [-1, 1].forEach(d => {
        c.beginPath(); c.moveTo(d * r * 0.45, 0); c.lineTo(d * r * 0.98, -r * 0.42); c.quadraticCurveTo(d * r * 0.8, 0, d * r * 0.98, r * 0.42); c.closePath(); c.fill(); c.stroke();
      });
      c.save(); c.globalAlpha = 0.55; c.fillStyle = '#fff';
      Draw.rr(c, -r * 0.62, -r * 0.62, r * 1.24, r * 1.24, r * 0.3); c.fill(); c.restore();
      c.strokeStyle = pal[2]; c.setLineDash([s * 0.06, s * 0.05]); c.lineWidth = Math.max(2, s * 0.03);
      Draw.rr(c, -r * 0.62, -r * 0.62, r * 1.24, r * 1.24, r * 0.3); c.stroke(); c.setLineDash([]);
      c.save(); c.scale(0.78, 0.78);
    }
    if (C.shape === 'wrapped') {
      // 包裝紙兩端
      c.fillStyle = pal[1]; c.strokeStyle = pal[3]; c.lineWidth = Math.max(2, s * 0.04);
      [-1, 1].forEach(d => {
        c.beginPath(); c.moveTo(d * r * 0.5, 0); c.lineTo(d * r * 0.98, -r * 0.4); c.quadraticCurveTo(d * r * 0.82, 0, d * r * 0.98, r * 0.4); c.closePath(); c.fill(); c.stroke();
        c.strokeStyle = pal[0]; c.lineWidth = Math.max(1, s * 0.02);
        c.beginPath(); c.moveTo(d * r * 0.62, -r * 0.1); c.lineTo(d * r * 0.88, -r * 0.25); c.moveTo(d * r * 0.62, r * 0.1); c.lineTo(d * r * 0.88, r * 0.25); c.stroke();
        c.strokeStyle = pal[3]; c.lineWidth = Math.max(2, s * 0.04);
      });
    }
    shapePath(c, C.shape, s);
    const g = c.createRadialGradient(-r * 0.3, -r * 0.38, r * 0.05, 0, 0, r * 1.05);
    g.addColorStop(0, pal[0]); g.addColorStop(0.45, pal[1]); g.addColorStop(1, pal[2]);
    c.fillStyle = g; c.fill();
    c.strokeStyle = pal[3]; c.lineWidth = Math.max(2, s * 0.045); c.stroke();
    // 細節
    c.save(); shapePath(c, C.shape, s); c.clip();
    if (C.shape === 'round') {
      c.strokeStyle = 'rgba(255,255,255,.6)'; c.lineWidth = s * 0.07;
      c.beginPath(); for (let a = 0; a < TAU * 1.7; a += 0.15) { const rr = r * 0.7 * a / (TAU * 1.7); c.lineTo(Math.cos(a) * rr, Math.sin(a) * rr); } c.stroke();
    } else if (C.shape === 'wrapped') {
      c.strokeStyle = 'rgba(255,255,255,.5)'; c.lineWidth = s * 0.06;
      for (let k = -2; k <= 2; k++) { c.beginPath(); c.moveTo(k * r * 0.3 - r * 0.2, -r); c.lineTo(k * r * 0.3 + r * 0.2, r); c.stroke(); }
    } else if (C.shape === 'square') {
      c.fillStyle = 'rgba(255,255,255,.18)'; Draw.rr(c, -r * 0.55, -r * 0.55, r * 1.1, r * 1.1, r * 0.3); c.fill();
    }
    // 條紋
    if (special === 'h' || special === 'v') {
      c.fillStyle = 'rgba(255,255,255,.85)';
      for (let k = -2; k <= 2; k++) {
        if (special === 'h') c.fillRect(-r, k * r * 0.42 - r * 0.08, s, r * 0.16);
        else c.fillRect(k * r * 0.42 - r * 0.08, -r, r * 0.16, s);
      }
    }
    // 下方陰影面
    c.fillStyle = 'rgba(0,0,0,.12)'; c.beginPath(); c.ellipse(r * 0.1, r * 0.7, r, r * 0.45, 0, 0, TAU); c.fill();
    c.restore();
    // 高光
    c.fillStyle = 'rgba(255,255,255,.75)';
    c.beginPath(); c.ellipse(-r * 0.28, -r * 0.4, r * 0.22, r * 0.11, -0.6, 0, TAU); c.fill();
    c.beginPath(); c.arc(-r * 0.02, -r * 0.5, r * 0.05, 0, TAU); c.fill();
    if (special === 'wrap') c.restore();
  }

  function sprite(color, special, s) {
    const key = color + '|' + special + '|' + Math.round(s);
    let sp = sprites.get(key);
    if (sp) return sp;
    const size = Math.ceil(s * 1.25);
    const cnv = document.createElement('canvas');
    cnv.width = cnv.height = Math.ceil(size * view.DPR);
    const c = cnv.getContext('2d');
    c.scale(view.DPR, view.DPR); c.translate(size / 2, size / 2);
    paintCandy(c, color, special, s);
    sp = { c: cnv, size };
    sprites.set(key, sp);
    return sp;
  }

  /* ---------- 小熊 ---------- */
  function drawBear(c, x, y, s, t, mood) {
    const jump = mood === 'happy' ? Math.abs(Math.sin(t * 8)) * 14 * s : 0;
    const breathe = 1 + Math.sin(t * 2.4) * 0.025;
    const sq = mood === 'happy' ? 1 + Math.sin(t * 16) * 0.04 : 1;
    Draw.shadow(c, x, y + 4 * s, 34 * s * (1 - jump / (80 * s)), 8 * s, 0.3);
    c.save(); c.translate(x, y - jump); c.scale(breathe / sq, sq * breathe);
    const body = ['#ffc2d6', '#ff7aa8', '#e04a85'];
    const gum = (fn) => {
      fn();
      const g = c.createRadialGradient(-10 * s, -60 * s, 4, 0, -40 * s, 70 * s);
      g.addColorStop(0, body[0]); g.addColorStop(0.6, body[1]); g.addColorStop(1, body[2]);
      c.fillStyle = g; c.fill(); c.strokeStyle = '#a8285f'; c.lineWidth = 2.6 * s; c.stroke();
    };
    c.lineJoin = 'round';
    // 腳
    [-1, 1].forEach(d => gum(() => { c.beginPath(); c.ellipse(d * 14 * s, -6 * s, 12 * s, 9 * s, 0, 0, TAU); }));
    // 身體
    gum(() => { c.beginPath(); c.ellipse(0, -30 * s, 26 * s, 26 * s, 0, 0, TAU); });
    c.fillStyle = 'rgba(255,255,255,.35)'; c.beginPath(); c.ellipse(0, -26 * s, 14 * s, 15 * s, 0, 0, TAU); c.fill();
    // 手
    const wave = mood === 'happy' ? Math.sin(t * 12) * 0.6 - 0.8 : Math.sin(t * 2) * 0.1;
    [-1, 1].forEach(d => {
      c.save(); c.translate(d * 22 * s, -40 * s); c.rotate(d * (0.6 + (d > 0 ? wave : 0)));
      gum(() => { c.beginPath(); c.ellipse(0, 10 * s, 8 * s, 13 * s, 0, 0, TAU); });
      c.restore();
    });
    // 頭
    const hy = -72 * s;
    [-1, 1].forEach(d => gum(() => { c.beginPath(); c.arc(d * 20 * s, hy - 18 * s, 10 * s, 0, TAU); }));
    gum(() => { c.beginPath(); c.ellipse(0, hy, 28 * s, 25 * s, 0, 0, TAU); });
    c.fillStyle = 'rgba(255,255,255,.5)'; c.beginPath(); c.ellipse(-12 * s, hy - 12 * s, 9 * s, 4.5 * s, -0.5, 0, TAU); c.fill();
    c.fillStyle = '#ffe0ea'; c.beginPath(); c.ellipse(0, hy + 9 * s, 11 * s, 8 * s, 0, 0, TAU); c.fill();
    const blink = (t % 3.7) > 3.55;
    const em = mood === 'happy' ? 'happy' : mood === 'sad' ? 'sad' : blink ? 'closed' : 'open';
    Draw.eye(c, -10 * s, hy - 2 * s, 5 * s, em, 0.2, 0.3);
    Draw.eye(c, 10 * s, hy - 2 * s, 5 * s, em, 0.2, 0.3);
    Draw.blush(c, -18 * s, hy + 7 * s, 5 * s, 0.55); Draw.blush(c, 18 * s, hy + 7 * s, 5 * s, 0.55);
    c.fillStyle = '#7a2350'; c.beginPath(); c.ellipse(0, hy + 5 * s, 3.5 * s, 2.5 * s, 0, 0, TAU); c.fill();
    c.strokeStyle = '#7a2350'; c.lineWidth = 2 * s; c.lineCap = 'round';
    if (mood === 'happy') { c.fillStyle = '#c2416c'; c.beginPath(); c.arc(0, hy + 10 * s, 5.5 * s, 0, Math.PI); c.fill(); }
    else if (mood === 'sad') { c.beginPath(); c.arc(0, hy + 15 * s, 4 * s, Math.PI * 1.2, Math.PI * 1.8); c.stroke(); }
    else { c.beginPath(); c.arc(-3 * s, hy + 9 * s, 3 * s, 0.2, Math.PI - 0.2); c.arc(3 * s, hy + 9 * s, 3 * s, 0.2, Math.PI - 0.2); c.stroke(); }
    // 頭上的蝴蝶結
    c.fillStyle = '#ffd23f'; c.strokeStyle = '#c48a12'; c.lineWidth = 2 * s;
    [-1, 1].forEach(d => { c.beginPath(); c.moveTo(8 * s, hy - 22 * s); c.lineTo(8 * s + d * 12 * s, hy - 30 * s); c.lineTo(8 * s + d * 12 * s, hy - 14 * s); c.closePath(); c.fill(); c.stroke(); });
    c.beginPath(); c.arc(8 * s, hy - 22 * s, 4 * s, 0, TAU); c.fill(); c.stroke();
    c.restore();
  }

  function drawMascot(c, w, h, t) {
    const s = Math.min(w / 220, h / 190);
    // 周圍跳動的糖果
    for (let i = 0; i < 6; i++) {
      const a = t * 0.8 + i * TAU / 6;
      const x = w / 2 + Math.cos(a) * w * 0.38, y = h * 0.5 + Math.sin(a) * h * 0.28 - Math.abs(Math.sin(t * 3 + i)) * 8;
      const sp = sprite(i, i === 2 ? 'h' : null, 34 * s);
      if (Math.sin(a) < 0) c.drawImage(sp.c, x - sp.size / 2, y - sp.size / 2, sp.size, sp.size);
    }
    drawBear(c, w / 2, h * 0.92, s * 1.05, t, (t % 4) < 1.2 ? 'happy' : 'idle');
    for (let i = 0; i < 6; i++) {
      const a = t * 0.8 + i * TAU / 6;
      const x = w / 2 + Math.cos(a) * w * 0.38, y = h * 0.5 + Math.sin(a) * h * 0.28 - Math.abs(Math.sin(t * 3 + i)) * 8;
      const sp = sprite(i, i === 2 ? 'h' : null, 34 * s);
      if (Math.sin(a) >= 0) c.drawImage(sp.c, x - sp.size / 2, y - sp.size / 2, sp.size, sp.size);
    }
  }

  function drawItem(c, i, w, h) {
    const T = THEMES[i];
    const g = c.createLinearGradient(0, 0, 0, h);
    g.addColorStop(0, T.sky[0]); g.addColorStop(1, T.sky[1]);
    c.fillStyle = g; Draw.rr(c, 0, 0, w, h, 12); c.fill();
    c.fillStyle = T.hill[1];
    c.beginPath(); c.moveTo(0, h); c.quadraticCurveTo(w * 0.25, h * 0.45, w * 0.5, h * 0.75); c.quadraticCurveTo(w * 0.75, h * 0.4, w, h * 0.7); c.lineTo(w, h); c.fill();
    c.fillStyle = T.frame[0]; Draw.rr(c, w * 0.3, h * 0.2, w * 0.4, h * 0.4, 6); c.fill();
    c.fillStyle = T.tile[0]; Draw.rr(c, w * 0.34, h * 0.26, w * 0.32, h * 0.28, 4); c.fill();
    const sp = sprite(i % 6, null, h * 0.22);
    c.drawImage(sp.c, w * 0.5 - sp.size / 2, h * 0.4 - sp.size / 2, sp.size, sp.size);
  }

  /* ---------- 棋盤邏輯 ---------- */
  const inB = (r, c) => r >= 0 && r < N && c >= 0 && c < N;
  function newCandy(color, special, r, c) { return { id: uid++, color, special: special || null, x: c, y: r, sc: 1, rot: 0, land: 0, born: 0 }; }
  const randColor = () => KG.randInt(0, level.nc - 1);

  function fillBoard() {
    for (let tries = 0; tries < 50; tries++) {
      grid = [];
      for (let r = 0; r < N; r++) {
        grid.push([]);
        for (let c = 0; c < N; c++) {
          let col;
          do { col = randColor(); } while (
            (c >= 2 && grid[r][c - 1].color === col && grid[r][c - 2].color === col) ||
            (r >= 2 && grid[r - 1][c].color === col && grid[r - 2][c].color === col));
          grid[r].push(newCandy(col, null, r, c));
        }
      }
      if (findMove()) return;
    }
  }

  /** 找出所有 3 個以上的連線 */
  function findRuns() {
    const runs = [];
    const col = (r, c) => { const k = grid[r][c]; return k && k.special !== 'bomb' ? k.color : -9; };
    for (let r = 0; r < N; r++) {
      let s = 0;
      for (let c = 1; c <= N; c++) {
        if (c < N && col(r, c) === col(r, s) && col(r, s) >= 0) continue;
        if (c - s >= 3 && col(r, s) >= 0) runs.push({ dir: 'h', cells: Array.from({ length: c - s }, (_, k) => [r, s + k]), color: col(r, s) });
        s = c;
      }
    }
    for (let c = 0; c < N; c++) {
      let s = 0;
      for (let r = 1; r <= N; r++) {
        if (r < N && col(r, c) === col(s, c) && col(s, c) >= 0) continue;
        if (r - s >= 3 && col(s, c) >= 0) runs.push({ dir: 'v', cells: Array.from({ length: r - s }, (_, k) => [s + k, c]), color: col(s, c) });
        s = r;
      }
    }
    return runs;
  }

  function swapCells(a, b) { const t = grid[a[0]][a[1]]; grid[a[0]][a[1]] = grid[b[0]][b[1]]; grid[b[0]][b[1]] = t; }

  /** 找一個可以換的位置（提示、洗牌用） */
  function findMove() {
    for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) {
      for (const [dr, dc] of [[0, 1], [1, 0]]) {
        const r2 = r + dr, c2 = c + dc;
        if (!inB(r2, c2) || !grid[r][c] || !grid[r2][c2]) continue;
        if (grid[r][c].special === 'bomb' || grid[r2][c2].special === 'bomb') return [[r, c], [r2, c2]];
        if (grid[r][c].special && grid[r2][c2].special) return [[r, c], [r2, c2]];
        swapCells([r, c], [r2, c2]);
        const ok = findRuns().length > 0;
        swapCells([r, c], [r2, c2]);
        if (ok) return [[r, c], [r2, c2]];
      }
    }
    return null;
  }

  const sleep = s => new Promise(res => setTimeout(res, s * 1000));
  const cellX = c => bx + (c + 0.5) * cs;
  const cellY = r => by + (r + 0.5) * cs;

  /** 嘗試交換 */
  async function trySwap(a, b) {
    if (busy || !playing || !inB(b[0], b[1])) return;
    const A = grid[a[0]][a[1]], B = grid[b[0]][b[1]];
    if (!A || !B) return;
    busy = true; sel = null; hint = null; idleT = 0;
    const token = runToken;
    KG.sound('whoosh');
    Tween.to(A, { x: b[1], y: b[0] }, 0.18, 'inOutSine');
    Tween.to(B, { x: a[1], y: a[0] }, 0.18, 'inOutSine');
    await sleep(0.2); if (token !== runToken) return;
    swapCells(a, b);
    // 特殊糖果交換
    const sa = A.special, sb = B.special;
    if (sa === 'bomb' || sb === 'bomb' || (sa && sb)) {
      useMove();
      await resolve(null, [b, a], comboSet(a, b, A, B), token);
      return;
    }
    const runs = findRuns();
    if (!runs.length) {
      KG.sound('boing');
      setBear('sad', 0.8);
      Tween.to(A, { x: a[1], y: a[0] }, 0.22, 'outBack');
      Tween.to(B, { x: b[1], y: b[0] }, 0.22, 'outBack');
      swapCells(a, b);
      await sleep(0.24); if (token !== runToken) return;
      busy = false;
      return;
    }
    useMove();
    await resolve(runs, [b, a], null, token);
  }

  function useMove() {
    moves--;
    mvEl.textContent = moves;
    if (moves <= 5) { movesEl.classList.remove('low'); void movesEl.offsetWidth; movesEl.classList.add('low'); }
  }

  /** 兩個特殊糖果交換的組合效果 */
  function comboSet(a, b, A, B) {
    const set = new Map();
    const add = (r, c) => { if (inB(r, c) && grid[r][c]) set.set(r * N + c, [r, c]); };
    const sa = A.special, sb = B.special;
    const [r, c] = b; // A 移到 b
    add(a[0], a[1]); add(b[0], b[1]);
    A.triggered = B.triggered = true;
    if (sa === 'bomb' && sb === 'bomb') {
      for (let i = 0; i < N; i++) for (let j = 0; j < N; j++) add(i, j);
      effects.push({ type: 'flash', life: 1 });
      FX.shake(16, 0.6);
    } else if (sa === 'bomb' || sb === 'bomb') {
      const other = sa === 'bomb' ? B : A, bomb = sa === 'bomb' ? A : B;
      const bp = sa === 'bomb' ? b : a;
      const color = other.color;
      for (let i = 0; i < N; i++) for (let j = 0; j < N; j++) {
        const k = grid[i][j];
        if (k && k.color === color && k.special !== 'bomb') {
          if (other.special && !k.special) k.special = other.special === 'wrap' ? 'wrap' : (Math.random() < 0.5 ? 'h' : 'v');
          add(i, j);
          effects.push({ type: 'zap', x1: cellX(bp[1]), y1: cellY(bp[0]), x2: cellX(j), y2: cellY(i), life: 1 });
        }
      }
      if (other.special) other.triggered = false;
      bomb.triggered = true;
      FX.shake(10, 0.4);
    } else if ((sa === 'h' || sa === 'v') && (sb === 'h' || sb === 'v')) {
      for (let i = 0; i < N; i++) { add(r, i); add(i, c); }
      effects.push({ type: 'row', r, life: 1 }, { type: 'col', c, life: 1 });
      FX.shake(9, 0.35);
    } else if (sa === 'wrap' && sb === 'wrap') {
      for (let i = -2; i <= 2; i++) for (let j = -2; j <= 2; j++) add(r + i, c + j);
      effects.push({ type: 'blast', x: cellX(c), y: cellY(r), size: cs * 3, life: 1 });
      FX.shake(14, 0.5);
    } else {
      for (let k = -1; k <= 1; k++) for (let i = 0; i < N; i++) { add(r + k, i); add(i, c + k); }
      effects.push({ type: 'row', r, w: 3, life: 1 }, { type: 'col', c, w: 3, life: 1 });
      FX.shake(12, 0.45);
    }
    KG.sound('hit'); KG.vibrate(50);
    return set;
  }

  /** 消除、掉落、連鎖 */
  async function resolve(runs, swapPos, preset, token) {
    let cascade = 0;
    for (;;) {
      cascade++;
      const clear = preset || new Map();
      const creates = [];
      if (runs) {
        // 計算 L/T 交叉與長度，決定要產生的特殊糖果
        const used = new Set();
        const hRuns = runs.filter(x => x.dir === 'h'), vRuns = runs.filter(x => x.dir === 'v');
        runs.forEach(run => run.cells.forEach(([r, c]) => clear.set(r * N + c, [r, c])));
        const pickPos = run => {
          if (swapPos) for (const p of swapPos) if (run.cells.some(([r, c]) => r === p[0] && c === p[1])) return p;
          return run.cells[Math.floor(run.cells.length / 2)];
        };
        runs.filter(x => x.cells.length >= 5).forEach(run => { const p = pickPos(run); creates.push({ r: p[0], c: p[1], color: run.color, special: 'bomb' }); used.add(run); });
        hRuns.forEach(h => vRuns.forEach(v => {
          if (used.has(h) || used.has(v)) return;
          const hit = h.cells.find(([r, c]) => v.cells.some(([r2, c2]) => r === r2 && c === c2));
          if (hit) { creates.push({ r: hit[0], c: hit[1], color: h.color, special: 'wrap' }); used.add(h); used.add(v); }
        }));
        runs.filter(x => x.cells.length === 4 && !used.has(x)).forEach(run => { const p = pickPos(run); creates.push({ r: p[0], c: p[1], color: run.color, special: run.dir === 'h' ? 'h' : 'v' }); });
        // 每段連線的分數文字
        runs.forEach(run => {
          const [r, c] = run.cells[Math.floor(run.cells.length / 2)];
          const pts = run.cells.length * 20 * cascade;
          FX.text('+' + pts, cellX(c), cellY(r), { size: Math.max(20, cs * 0.42), color: '#fff', stroke: CANDY[run.color].pal[3], vy: -50, dur: 0.9 });
        });
      }
      // 連鎖觸發特殊糖果
      const queue = [...clear.values()];
      while (queue.length) {
        const [r, c] = queue.shift();
        const k = grid[r][c];
        if (!k || !k.special || k.triggered) continue;
        k.triggered = true;
        const add = (rr, cc) => { if (inB(rr, cc) && grid[rr][cc] && !clear.has(rr * N + cc)) { clear.set(rr * N + cc, [rr, cc]); queue.push([rr, cc]); } };
        if (k.special === 'h') { for (let i = 0; i < N; i++) add(r, i); effects.push({ type: 'row', r, life: 1 }); KG.sound('whoosh'); FX.shake(5, 0.2); }
        else if (k.special === 'v') { for (let i = 0; i < N; i++) add(i, c); effects.push({ type: 'col', c, life: 1 }); KG.sound('whoosh'); FX.shake(5, 0.2); }
        else if (k.special === 'wrap') { for (let i = -1; i <= 1; i++) for (let j = -1; j <= 1; j++) add(r + i, c + j); effects.push({ type: 'blast', x: cellX(c), y: cellY(r), size: cs * 1.8, life: 1 }); KG.sound('hit'); FX.shake(8, 0.3); }
        else if (k.special === 'bomb') {
          const color = randColor();
          for (let i = 0; i < N; i++) for (let j = 0; j < N; j++) if (grid[i][j] && grid[i][j].color === color) { add(i, j); effects.push({ type: 'zap', x1: cellX(c), y1: cellY(r), x2: cellX(j), y2: cellY(i), life: 1 }); }
          KG.sound('sparkle'); FX.shake(8, 0.3);
        }
      }
      // 消除
      let n = 0;
      clear.forEach(([r, c]) => {
        const k = grid[r][c];
        if (!k) return;
        const keep = creates.find(cr => cr.r === r && cr.c === c);
        n++;
        if (k.color >= 0 && k.special !== 'bomb') { collected[k.color] = (collected[k.color] || 0) + 1; }
        if (jelly[r][c]) { jelly[r][c] = 0; jellyLeft--; FX.burst(cellX(c), cellY(r), { n: 6, shape: 'circle', colors: ['#ff9fc6', '#ffd0e4', '#fff'], size: cs * 0.08, speed: 160 }); }
        const pal = k.special === 'bomb' ? ['#fff', '#ffd23f', '#ff8fb1'] : CANDY[k.color].pal;
        FX.burst(cellX(c), cellY(r), { n: 7, shape: Math.random() < 0.5 ? 'star' : 'circle', colors: [pal[0], pal[1], '#fff'], size: cs * 0.07, speed: 240, life: 0.7 });
        // 消失動畫
        const dead = k;
        dead.dying = true;
        popping.push({ k: dead, r, c, t: 0 });
        grid[r][c] = null;
        if (keep) {
          const nk = newCandy(keep.color, keep.special, r, c);
          nk.sc = 0;
          grid[r][c] = nk;
          Tween.to(nk, { sc: 1 }, 0.45, 'outElastic', 0.12);
          FX.ring(cellX(c), cellY(r), '#fff', cs * 0.9);
        }
      });
      score += n * 20 * cascade;
      updateGoal();
      KG.note(Music.midi(72 + Math.min(cascade, 8) * 2), 0.14, 'triangle', 0.2);
      KG.note(Music.midi(79 + Math.min(cascade, 8) * 2), 0.18, 'sine', 0.14, 0.05);
      if (creates.length) { KG.sound('sparkle'); setBear('happy', 1.2); FX.text(creates.some(x => x.special === 'bomb') ? '彩虹球！' : creates.some(x => x.special === 'wrap') ? '包裝炸彈！' : '條紋糖果！', W / 2, by + board * 0.5, { size: Math.max(30, cs * 0.6), color: '#fff', stroke: '#d8407f', tag: 'special', dur: 1.2 }); }
      if (cascade >= 2) {
        const words = ['好甜！', '超好吃！', '甜蜜蜜！', '太厲害了！', '糖果大師！'];
        FX.text(words[Math.min(words.length - 1, cascade - 2)], W / 2, by + board * 0.35, { size: Math.max(36, cs * 0.75), color: '#ffe14d', stroke: '#c22a6a', tag: 'combo', dur: 1.3 });
        Jingle.combo(cascade);
        setBear('happy', 1.2);
      }
      await sleep(0.26); if (token !== runToken) return;
      const fallT = gravity();
      await sleep(fallT + 0.04); if (token !== runToken) return;
      runs = findRuns(); preset = null; swapPos = null;
      if (!runs.length) break;
    }
    await endTurn(token);
  }

  let popping = [];

  /** 讓糖果往下掉並補新的 */
  function gravity() {
    let maxT = 0;
    for (let c = 0; c < N; c++) {
      let write = N - 1;
      for (let r = N - 1; r >= 0; r--) {
        const k = grid[r][c];
        if (!k) continue;
        if (write !== r) {
          grid[write][c] = k; grid[r][c] = null;
          const d = write - k.y, t = 0.18 + Math.sqrt(Math.max(0, d)) * 0.09;
          Tween.kill(k, 'y');
          Tween.to(k, { y: write }, t, 'outBounce');
          maxT = Math.max(maxT, t);
        }
        write--;
      }
      const missing = write + 1;
      for (let r = write, i = 0; r >= 0; r--, i++) {
        const k = newCandy(randColor(), null, r, c);
        k.y = -1 - i - 0.3;
        grid[r][c] = k;
        const d = r - k.y, t = 0.2 + Math.sqrt(d) * 0.09;
        Tween.to(k, { y: r }, t, 'outBounce', 0.02 * c);
        maxT = Math.max(maxT, t + 0.02 * c);
      }
      void missing;
    }
    if (maxT > 0) setTimeout(() => KG.note(420, 0.06, 'sine', 0.08), maxT * 600);
    return maxT;
  }

  async function endTurn(token) {
    if (token !== runToken) return;
    // 檢查目標
    if (!ended && goalDone()) {
      ended = true;
      movesAtGoal = moves;
      await sugarCrush(token);
      return;
    }
    if (moves <= 0) { busy = true; offerMore(); return; }
    if (!findMove()) {
      UI.banner('沒有可以換的了', '洗牌囉！', 1.3);
      KG.sound('whoosh');
      await sleep(0.6); if (token !== runToken) return;
      shuffle();
      await sleep(0.7); if (token !== runToken) return;
      const r = findRuns();
      if (r.length) { await resolve(r, null, null, token); return; }
    }
    busy = false; idleT = 0;
  }

  function shuffle() {
    const all = [];
    for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) if (grid[r][c]) all.push(grid[r][c]);
    for (let tries = 0; tries < 80; tries++) {
      const s = KG.shuffle(all);
      let i = 0;
      for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) grid[r][c] = s[i++];
      if (findMove() && !findRuns().length) break;
      if (tries > 60) { all.forEach(k => { if (!k.special) k.color = randColor(); }); }
    }
    for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) { const k = grid[r][c]; Tween.kill(k, 'x'); Tween.kill(k, 'y'); Tween.to(k, { x: c, y: r }, 0.55, 'outBack', Math.random() * 0.1); }
  }

  /** 過關後剩下的步數變成條紋糖果放煙火 */
  async function sugarCrush(token) {
    playing = false;
    setBear('happy', 3);
    UI.banner('過關了！', moves > 0 ? '剩下的步數變成甜蜜煙火！' : '', 1.6);
    KG.sound('win');
    await sleep(1.0); if (token !== runToken) return;
    const n = Math.min(moves, 10);
    const set = new Map();
    for (let i = 0; i < n; i++) {
      const cands = [];
      for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) if (grid[r][c] && !grid[r][c].special) cands.push([r, c]);
      if (!cands.length) break;
      const [r, c] = KG.pick(cands);
      grid[r][c].special = Math.random() < 0.5 ? 'h' : 'v';
      Tween.to(grid[r][c], { sc: 1.35 }, 0.12, 'outQuad', 0, () => Tween.to(grid[r][c] || {}, { sc: 1 }, 0.2, 'outBack'));
      set.set(r * N + c, [r, c]);
      moves--; mvEl.textContent = moves; score += 100;
      FX.burst(cellX(c), cellY(r), { n: 10, colors: ['#fff', '#ffe14d'], size: cs * 0.08 });
      Jingle.step(i);
      await sleep(0.14); if (token !== runToken) return;
    }
    if (set.size) { await resolveFinal(set, token); if (token !== runToken) return; }
    await sleep(0.5); if (token !== runToken) return;
    finish(true);
  }

  async function resolveFinal(set, token) {
    // 用一般流程消除（不再檢查目標）
    const saveEnded = ended;
    ended = true;
    await resolveNoEnd(set, token);
    ended = saveEnded;
  }
  async function resolveNoEnd(set, token) {
    let runs = null, preset = set;
    for (let i = 0; i < 6; i++) {
      // 借用 resolve 的單步：用小技巧，把 endTurn 換成空的
      const clear = preset;
      const queue = [...clear.values()];
      while (queue.length) {
        const [r, c] = queue.shift();
        const k = grid[r][c];
        if (!k || !k.special || k.triggered) continue;
        k.triggered = true;
        const add = (rr, cc) => { if (inB(rr, cc) && grid[rr][cc] && !clear.has(rr * N + cc)) { clear.set(rr * N + cc, [rr, cc]); queue.push([rr, cc]); } };
        if (k.special === 'h') { for (let j = 0; j < N; j++) add(r, j); effects.push({ type: 'row', r, life: 1 }); }
        else if (k.special === 'v') { for (let j = 0; j < N; j++) add(j, c); effects.push({ type: 'col', c, life: 1 }); }
        else if (k.special === 'wrap') { for (let a = -1; a <= 1; a++) for (let b = -1; b <= 1; b++) add(r + a, c + b); effects.push({ type: 'blast', x: cellX(c), y: cellY(r), size: cs * 1.8, life: 1 }); }
      }
      KG.sound('whoosh'); FX.shake(6, 0.25);
      let n = 0;
      clear.forEach(([r, c]) => {
        const k = grid[r][c]; if (!k) return;
        n++;
        if (jelly[r][c]) { jelly[r][c] = 0; jellyLeft--; }
        FX.burst(cellX(c), cellY(r), { n: 5, colors: [CANDY[Math.max(0, k.color)].pal[1], '#fff'], size: cs * 0.07, speed: 220, life: 0.6 });
        popping.push({ k, r, c, t: 0 });
        grid[r][c] = null;
      });
      score += n * 30;
      updateGoal();
      await sleep(0.26); if (token !== runToken) return;
      const ft = gravity();
      await sleep(ft + 0.04); if (token !== runToken) return;
      runs = findRuns();
      if (!runs.length) break;
      preset = new Map();
      runs.forEach(run => run.cells.forEach(([r, c]) => preset.set(r * N + c, [r, c])));
      score += 0;
    }
  }

  function goalDone() {
    const g = level.goal;
    if (g.type === 'score') return score >= g.n;
    if (g.type === 'collect') return g.items.every(([col, n]) => (collected[col] || 0) >= n);
    if (g.type === 'jelly') return jellyLeft <= 0;
    return false;
  }

  /* ---------- 目標面板 ---------- */
  function buildGoal() {
    const g = level.goal;
    goalEl.innerHTML = '';
    if (g.type === 'score') {
      goalEl.innerHTML = '<div class="gscore"><div class="row"><span>分數</span><b id="gsc">0</b></div><div class="sbar"><i id="gbar"></i></div><div class="row"><span>目標</span><span>' + g.n + '</span></div></div>';
    } else if (g.type === 'collect') {
      g.items.forEach(([col]) => {
        const d = document.createElement('div');
        d.className = 'gchip'; d.dataset.col = col;
        d.innerHTML = '<canvas></canvas><span></span>';
        goalEl.appendChild(d);
        const h = hiDPI(d.querySelector('canvas')); h.fit(34, 34);
        const sp = sprite(col, null, 28);
        h.ctx.drawImage(sp.c, 17 - sp.size / 2, 17 - sp.size / 2, sp.size, sp.size);
      });
      goalEl.insertAdjacentHTML('beforeend', '<div class="smallscore">分數 <b id="gsc">0</b></div>');
    } else {
      const d = document.createElement('div');
      d.className = 'gchip'; d.id = 'gjelly';
      d.innerHTML = '<canvas></canvas><span></span>';
      goalEl.appendChild(d);
      const h = hiDPI(d.querySelector('canvas')); h.fit(34, 34);
      drawJellyTile(h.ctx, 3, 3, 28);
      goalEl.insertAdjacentHTML('beforeend', '<div class="smallscore">分數 <b id="gsc">0</b></div>');
    }
    updateGoal();
  }

  function updateGoal() {
    const g = level.goal;
    const sc = document.getElementById('gsc');
    if (sc) sc.textContent = score;
    if (g.type === 'score') { const b = document.getElementById('gbar'); if (b) b.style.width = Math.min(100, score / g.n * 100) + '%'; }
    else if (g.type === 'collect') {
      goalEl.querySelectorAll('.gchip').forEach(d => {
        const col = +d.dataset.col, need = g.items.find(x => x[0] === col)[1];
        const left = Math.max(0, need - (collected[col] || 0));
        d.querySelector('span').textContent = left ? '×' + left : '✔';
        d.classList.toggle('done', !left);
      });
    } else {
      const d = document.getElementById('gjelly');
      if (d) { d.querySelector('span').textContent = jellyLeft ? '×' + jellyLeft : '✔'; d.classList.toggle('done', !jellyLeft); }
    }
  }

  function drawJellyTile(c, x, y, s) {
    const g = c.createLinearGradient(0, y, 0, y + s);
    g.addColorStop(0, 'rgba(255,170,210,.9)'); g.addColorStop(1, 'rgba(255,100,170,.85)');
    c.fillStyle = g; Draw.rr(c, x, y, s, s, s * 0.22); c.fill();
    c.strokeStyle = 'rgba(200,40,110,.6)'; c.lineWidth = 2; c.stroke();
    c.fillStyle = 'rgba(255,255,255,.55)'; Draw.rr(c, x + s * 0.12, y + s * 0.1, s * 0.5, s * 0.16, s * 0.08); c.fill();
  }

  /* ---------- 小熊心情 ---------- */
  function setBear(m, t) { bear.mood = m; bear.moodT = t; }

  /* ---------- 輸入 ---------- */
  function cellAt(x, y) {
    const c = Math.floor((x - bx) / cs), r = Math.floor((y - by) / cs);
    return inB(r, c) ? [r, c] : null;
  }
  cv.addEventListener('pointerdown', e => {
    if (!playing || busy) return;
    const p = cellAt(e.clientX, e.clientY);
    if (!p) { sel = null; return; }
    try { cv.setPointerCapture(e.pointerId); } catch (err) { /* 忽略 */ }
    drag = { p, x: e.clientX, y: e.clientY, moved: false };
    cursor = null;
  });
  cv.addEventListener('pointermove', e => {
    if (!drag || drag.moved) return;
    const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
    if (Math.hypot(dx, dy) > cs * 0.35) {
      drag.moved = true;
      const [r, c] = drag.p;
      const t = Math.abs(dx) > Math.abs(dy) ? [r, c + Math.sign(dx)] : [r + Math.sign(dy), c];
      trySwap(drag.p, t);
    }
  });
  cv.addEventListener('pointerup', e => {
    if (!drag) return;
    const d = drag; drag = null;
    if (d.moved || busy || !playing) return;
    const p = d.p;
    if (sel && Math.abs(sel[0] - p[0]) + Math.abs(sel[1] - p[1]) === 1) { trySwap(sel, p); return; }
    if (sel && sel[0] === p[0] && sel[1] === p[1]) { sel = null; return; }
    sel = p; KG.sound('tick');
    const k = grid[p[0]][p[1]];
    if (k) { Tween.kill(k, 'sc'); k.sc = 1; Tween.to(k, { sc: 1.18 }, 0.1, 'outQuad', 0, () => Tween.to(k, { sc: 1 }, 0.3, 'outElastic')); }
  });
  cv.addEventListener('pointercancel', () => { drag = null; });
  window.addEventListener('keydown', e => {
    if (!playing) return;
    const dirs = { ArrowUp: [-1, 0], ArrowDown: [1, 0], ArrowLeft: [0, -1], ArrowRight: [0, 1] };
    if (dirs[e.key]) {
      e.preventDefault();
      const [dr, dc] = dirs[e.key];
      if (sel) { trySwap(sel, [sel[0] + dr, sel[1] + dc]); return; }
      cursor = cursor || [3, 3];
      cursor = [clamp(cursor[0] + dr, 0, N - 1), clamp(cursor[1] + dc, 0, N - 1)];
      KG.sound('tick');
    } else if ((e.key === ' ' || e.key === 'Enter') && cursor && !busy) {
      e.preventDefault();
      sel = sel ? null : cursor.slice(); KG.sound('tick');
    }
  });

  /* ---------- 繪製 ---------- */
  function render(dt) {
    const [sx, sy] = FX.offset();
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.drawImage(bg, 0, 0);
    ctx.setTransform(view.DPR, 0, 0, view.DPR, sx * view.DPR, sy * view.DPR);
    // 果凍
    for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) if (jelly[r] && jelly[r][c]) drawJellyTile(ctx, bx + c * cs + 3, by + r * cs + 3, cs - 6);
    // 選取框 / 鍵盤游標
    const box = (p, col) => {
      ctx.strokeStyle = col; ctx.lineWidth = 4;
      Draw.rr(ctx, bx + p[1] * cs + 3, by + p[0] * cs + 3, cs - 6, cs - 6, cs * 0.2); ctx.stroke();
    };
    if (cursor && playing) box(cursor, 'rgba(70,168,255,.9)');
    if (sel) {
      ctx.fillStyle = 'rgba(255,255,255,' + (0.45 + Math.sin(time * 8) * 0.2) + ')';
      Draw.rr(ctx, bx + sel[1] * cs + 3, by + sel[0] * cs + 3, cs - 6, cs - 6, cs * 0.2); ctx.fill();
      box(sel, '#ffcf3d');
    }
    // 糖果（裁切在棋盤內，掉落時從上方進來）
    ctx.save();
    ctx.beginPath(); ctx.rect(bx - 4, by - 4, board + 8, board + 8); ctx.clip();
    const s = cs * 0.86;
    for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) {
      const k = grid[r] && grid[r][c];
      if (!k) continue;
      let rot = 0, scl = k.sc;
      if (hint && ((hint[0][0] === r && hint[0][1] === c) || (hint[1][0] === r && hint[1][1] === c))) { rot = Math.sin(time * 14) * 0.18; scl *= 1 + Math.sin(time * 7) * 0.06; }
      if (sel && sel[0] === r && sel[1] === c) scl *= 1 + Math.sin(time * 6) * 0.05;
      const sp = sprite(k.color, k.special, s);
      const x = bx + (k.x + 0.5) * cs, y = by + (k.y + 0.5) * cs + Math.sin(time * 2 + k.id) * cs * 0.01;
      ctx.save(); ctx.translate(x, y); ctx.rotate(rot); ctx.scale(scl, scl);
      ctx.drawImage(sp.c, -sp.size / 2, -sp.size / 2, sp.size, sp.size);
      if (k.special === 'bomb') { ctx.globalAlpha = 0.5 + Math.sin(time * 5) * 0.3; Draw.star(ctx, s * 0.3, -s * 0.3, s * 0.12); ctx.globalAlpha = 1; }
      ctx.restore();
    }
    // 消失中的糖果
    popping.forEach(p => {
      p.t += dt;
      const k = p.k, a = Math.min(1, p.t / 0.22);
      const sc = a < 0.35 ? 1 + a * 0.8 : (1 - a) * 1.6;
      if (sc <= 0) return;
      const sp = sprite(k.color, k.special, s);
      ctx.save(); ctx.globalAlpha = 1 - a * 0.5; ctx.translate(bx + (k.x + 0.5) * cs, by + (k.y + 0.5) * cs); ctx.scale(sc, sc);
      ctx.drawImage(sp.c, -sp.size / 2, -sp.size / 2, sp.size, sp.size); ctx.restore();
    });
    popping = popping.filter(p => p.t < 0.22);
    ctx.restore();
    // 特效：條紋光束、爆炸、閃電
    effects.forEach(e => {
      e.life -= dt * 2.2;
      const a = Math.max(0, e.life);
      ctx.globalAlpha = a;
      if (e.type === 'row' || e.type === 'col') {
        const w = cs * (e.w || 1) * (0.5 + a * 0.5);
        const g = e.type === 'row' ? ctx.createLinearGradient(0, cellY(e.r) - w / 2, 0, cellY(e.r) + w / 2) : ctx.createLinearGradient(cellX(e.c) - w / 2, 0, cellX(e.c) + w / 2, 0);
        g.addColorStop(0, 'rgba(255,255,255,0)'); g.addColorStop(0.5, 'rgba(255,255,230,1)'); g.addColorStop(1, 'rgba(255,255,255,0)');
        ctx.fillStyle = g;
        if (e.type === 'row') ctx.fillRect(bx - 10, cellY(e.r) - w / 2, board + 20, w);
        else ctx.fillRect(cellX(e.c) - w / 2, by - 10, w, board + 20);
      } else if (e.type === 'blast') {
        const R = e.size * (1.2 - a * 0.6);
        const g = ctx.createRadialGradient(e.x, e.y, 0, e.x, e.y, R);
        g.addColorStop(0, 'rgba(255,255,220,.95)'); g.addColorStop(0.6, 'rgba(255,200,120,.6)'); g.addColorStop(1, 'rgba(255,150,200,0)');
        ctx.fillStyle = g; ctx.beginPath(); ctx.arc(e.x, e.y, R, 0, TAU); ctx.fill();
      } else if (e.type === 'zap') {
        ctx.strokeStyle = '#fffbd0'; ctx.lineWidth = 3 * a + 1; ctx.shadowColor = '#ff8fd0'; ctx.shadowBlur = 10;
        ctx.beginPath(); ctx.moveTo(e.x1, e.y1);
        for (let k = 1; k < 5; k++) ctx.lineTo(lerp(e.x1, e.x2, k / 5) + KG.rand(-6, 6), lerp(e.y1, e.y2, k / 5) + KG.rand(-6, 6));
        ctx.lineTo(e.x2, e.y2); ctx.stroke(); ctx.shadowBlur = 0;
      } else if (e.type === 'flash') {
        ctx.fillStyle = 'rgba(255,255,255,' + a * 0.8 + ')'; ctx.fillRect(0, 0, W, H);
      }
      ctx.globalAlpha = 1;
    });
    effects = effects.filter(e => e.life > 0);
    // 小熊
    if (playing || ended) {
      if (side) drawBear(ctx, Math.min(W - 70, bx + board + (W - bx - board) / 2), by + board - 10, clamp(cs / 60, 0.8, 1.3), time, bear.mood);
      else if (H - (by + board) > 100) drawBear(ctx, W / 2, H - 14 - Math.max(0, (H - by - board - 120) * 0.3), clamp((H - by - board) / 130, 0.7, 1.1), time, bear.mood);
    }
    FX.draw(ctx, FONT);
  }

  let last = performance.now();
  function frame(now) {
    const dt = Math.max(0, Math.min(0.05, (now - last) / 1000));
    last = now; time += dt;
    Tween.update(dt);
    FX.update(dt);
    bear.moodT -= dt; if (bear.moodT <= 0) bear.mood = 'idle';
    if (playing && !busy) {
      idleT += dt;
      if (idleT > 5 && !hint) hint = findMove();
    }
    render(dt);
    requestAnimationFrame(frame);
  }

  /* ---------- 流程 ---------- */
  function startLevel(i) {
    runToken++;
    li = i; level = LEVELS[i];
    theme = THEMES[UI.item()];
    Tween.clear(); FX.clear(); effects = []; popping = [];
    moves = level.moves; score = 0; collected = []; continued = false; ended = false;
    sel = null; drag = null; hint = null; idleT = 0; cursor = null;
    jelly = []; jellyLeft = 0;
    for (let r = 0; r < N; r++) { jelly.push([]); for (let c = 0; c < N; c++) { const j = level.goal.type === 'jelly' && level.goal.mask(r, c) ? 1 : 0; jelly[r].push(j); jellyLeft += j; } }
    fillBoard();
    // 糖果從天而降
    for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) { const k = grid[r][c]; k.y = r - N - 1; Tween.to(k, { y: r }, 0.5 + r * 0.03, 'outBounce', c * 0.04 + (N - r) * 0.02); }
    mvEl.textContent = moves;
    hud.classList.add('show');
    buildGoal();
    layout();
    busy = true; playing = true;
    const token = runToken;
    UI.banner('第 ' + (i + 1) + ' 關', goalText() + '　' + level.tip, 2.2);
    KG.say(goalText());
    setTimeout(() => { if (token === runToken) busy = false; }, 1100);
  }

  function goalText() {
    const g = level.goal;
    if (g.type === 'score') return '得到 ' + g.n + ' 分';
    if (g.type === 'collect') return '收集 ' + g.items.map(([c, n]) => n + ' 個' + CANDY[c].name).join('、');
    return '消除全部果凍';
  }

  /** 步數用完：不會失敗，送你 5 步 */
  function offerMore() {
    playing = false;
    setBear('sad', 2);
    const ov = document.createElement('div');
    ov.className = 'scr res-scr show';
    ov.innerHTML = '<div class="res-card"><div class="res-ribbon">差一點點！</div><canvas style="width:160px;height:150px"></canvas><div class="res-msg">小熊再送你 5 步！</div><div class="res-btns"></div></div>';
    document.body.appendChild(ov);
    const h = hiDPI(ov.querySelector('canvas')); h.fit(160, 150);
    let t = 0, raf = 0;
    const loop = () => { t += 0.016; h.ctx.setTransform(h.DPR, 0, 0, h.DPR, 0, 0); h.ctx.clearRect(0, 0, 160, 150); drawBear(h.ctx, 80, 140, 1.15, t, 'idle'); raf = requestAnimationFrame(loop); };
    loop();
    const btns = ov.querySelector('.res-btns');
    const add = (txt, cls, fn) => { const b = document.createElement('button'); b.className = 'scr-btn ' + cls; b.textContent = txt; b.addEventListener('click', () => { KG.sound('click'); cancelAnimationFrame(raf); ov.remove(); fn(); }); btns.appendChild(b); };
    add('繼續 +5 步', 'go', () => {
      continued = true; moves += 5; mvEl.textContent = moves; playing = true; busy = false; idleT = 0;
      KG.sound('coin'); setBear('happy', 1.2);
      FX.text('+5 步！', W / 2, by + board / 2, { size: 44, color: '#fff', stroke: '#2a8746' });
    });
    add('重新開始', 'warm', () => UI.play(li));
  }

  function finish() {
    playing = false;
    hud.classList.remove('show');
    const frac = movesAtGoal / level.moves;
    const stars = continued ? 1 : frac >= 0.25 ? 3 : frac >= 0.1 ? 2 : 1;
    const best = KG.best('candy-match-' + li, score);
    UI.result({ stars, msg: '得到 <b>' + score + '</b> 分（最高 ' + best + '）<br>' + '只用了 ' + (level.moves - movesAtGoal + (continued ? 5 : 0)) + ' 步就完成！' });
  }

  function toMenu() {
    runToken++;
    playing = false; busy = false; ended = false;
    hud.classList.remove('show');
    theme = THEMES[UI.item()];
    level = LEVELS[0];
    jelly = [];
    grid = [];
    layout();
  }

  window.addEventListener('resize', () => { layout(); });
  // 測試用（網址加 #debug）
  if (location.hash === '#debug') window.__dbg = { st: () => ({ moves, score, playing, busy, ended }), move: () => { const m = findMove(); return m && m.map(([r, c]) => [cellX(c), cellY(r)]); } };

  UI.init({
    slug: 'candy-match', title: '糖果三消', subtitle: '三個一樣排一排，甜甜消除！',
    levels: LEVELS, items: THEMES, itemsTitle: '糖果王國場景', itemWord: '場景',
    drawMascot, drawItem, music: SONG,
    onPlay: startLevel, onMenu: toMenu, onItem: i => { theme = THEMES[i]; drawBG(); }
  });
  layout();
  requestAnimationFrame(t => { last = t; frame(t); });
  UI.showTitle();
})();
</script>
</body>
</html>
