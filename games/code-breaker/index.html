<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>色彩密碼</title>
<meta name="theme-color" content="#0f2230">
<link rel="stylesheet" href="../../assets/common.css">
<style>
  :root {
    --bg: #0f2230; --bg2: #183a4e; --panel: #1c3e53; --panel2: #25526c; --edge: #0a1820;
    --brass: #e7b552; --brass2: #a97526; --brass3: #fff0c4;
    --ink: #f7eed8; --muted: #a8c2cf; --good: #5fd08a; --bad: #ff7272;
    --S: 44px; --P: 15px; --PG: 52px;
  }
  html, body { height: 100%; overflow: hidden; background: var(--bg); color: var(--ink); overscroll-behavior: none; }
  body { position: fixed; inset: 0; }
  #app {
    position: absolute; left: 0; top: 0; width: 100%; height: 100%;
    background:
      radial-gradient(120% 70% at 50% -10%, rgba(231, 181, 82, 0.16), transparent 60%),
      radial-gradient(90% 60% at 50% 115%, rgba(46, 196, 214, 0.12), transparent 70%),
      linear-gradient(180deg, #13293a 0%, #0d1d29 100%);
    overflow: hidden;
  }
  #app::before {
    content: ''; position: absolute; inset: 0; pointer-events: none; opacity: 0.5;
    background-image:
      linear-gradient(rgba(255, 255, 255, 0.025) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255, 255, 255, 0.025) 1px, transparent 1px);
    background-size: 36px 36px;
  }
  button { font-family: var(--kg-font); color: inherit; }
  .screen { position: absolute; inset: 0; display: none; }
  .screen.on { display: flex; }

  /* ---------- 共用按鈕 ---------- */
  .btn {
    border: 0; border-radius: 16px; cursor: pointer; font-weight: 800; font-size: 17px;
    padding: 10px 14px; min-height: 44px; display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    background: linear-gradient(180deg, #2d6380, #1f4860); color: var(--ink);
    box-shadow: 0 4px 0 #0b2130, inset 0 1px 0 rgba(255, 255, 255, 0.18);
    transition: transform 0.08s ease, box-shadow 0.08s ease, filter 0.15s;
    touch-action: manipulation;
  }
  .btn:active { transform: translateY(3px); box-shadow: 0 1px 0 #0b2130, inset 0 1px 0 rgba(255, 255, 255, 0.18); }
  .btn.gold { background: linear-gradient(180deg, #ffd77e, #d99a2f); color: #3b2405; box-shadow: 0 4px 0 #8a5a14, inset 0 1px 0 rgba(255, 255, 255, 0.5); }
  .btn.gold:active { box-shadow: 0 1px 0 #8a5a14; }
  .btn.green { background: linear-gradient(180deg, #78e0a0, #2fa865); color: #08311a; box-shadow: 0 4px 0 #1b6d3e, inset 0 1px 0 rgba(255, 255, 255, 0.5); }
  .btn.ghost { background: rgba(255, 255, 255, 0.07); box-shadow: inset 0 0 0 2px rgba(231, 181, 82, 0.35); }
  .btn.on { background: linear-gradient(180deg, #ffe39b, #e0a83f); color: #3b2405; box-shadow: 0 4px 0 #8a5a14; }
  .btn[disabled] { filter: grayscale(0.8) brightness(0.7); pointer-events: none; }
  .btn svg { width: 20px; height: 20px; flex: none; }
  .focus { outline: 3px solid #fff3c4; outline-offset: 2px; }

  /* ---------- 標題 ---------- */
  #title { flex-direction: column; align-items: center; padding: 60px 16px calc(12px + env(safe-area-inset-bottom)); gap: 8px; }
  .t-left, .t-right { display: flex; flex-direction: column; align-items: center; width: 100%; max-width: 460px; gap: 8px; min-height: 0; }
  .t-left { flex: 1 1 auto; justify-content: center; }
  #hero { width: 100%; flex: 1 1 auto; min-height: 120px; max-height: 380px; display: block; }
  .logo {
    margin: 0; font-size: clamp(36px, 10vw, 58px); line-height: 1.05; letter-spacing: 6px; font-weight: 900;
    background: linear-gradient(180deg, #fff6d6 0%, #ffd36b 45%, #c8831f 100%); -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 3px 0 #4a2a06) drop-shadow(0 6px 14px rgba(0, 0, 0, 0.5));
  }
  .tag { margin: -2px 0 2px; color: var(--muted); font-size: 15px; font-weight: 700; letter-spacing: 1px; text-align: center; }
  .seg { display: flex; width: 100%; background: rgba(0, 0, 0, 0.25); border-radius: 16px; padding: 4px; gap: 4px; box-shadow: inset 0 0 0 2px rgba(231, 181, 82, 0.25); }
  .seg button { flex: 1; border: 0; border-radius: 12px; background: transparent; font-weight: 800; font-size: 15px; padding: 6px 2px; min-height: 44px; cursor: pointer; line-height: 1.15; }
  .seg button small { display: block; font-size: 11px; font-weight: 700; opacity: 0.75; }
  .seg button.sel { background: linear-gradient(180deg, #ffe39b, #e0a83f); color: #3b2405; box-shadow: 0 3px 0 #8a5a14; }
  .modes { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; width: 100%; }
  .modes .btn { flex-direction: column; gap: 0; padding: 8px 6px; min-height: 62px; font-size: 18px; border-radius: 18px; }
  .modes .btn small { font-size: 12px; font-weight: 700; opacity: 0.8; }
  .modes .btn.gold small { opacity: 0.85; }
  .minor { display: flex; gap: 8px; width: 100%; }
  .minor .btn { flex: 1; font-size: 15px; padding: 6px 4px; }
  .minor .btn svg { width: 18px; height: 18px; }

  /* ---------- 遊戲畫面 ---------- */
  #play { flex-direction: column; }
  .hud { height: 56px; margin: 4px 64px 0; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; flex: none; }
  .hud b { font-size: 18px; letter-spacing: 1px; color: var(--brass3); white-space: nowrap; }
  .hud span { font-size: 14px; color: var(--muted); font-weight: 700; white-space: nowrap; }
  .hud span em { font-style: normal; color: #9ff0ff; }
  .main { flex: 1 1 auto; display: flex; flex-direction: column; min-height: 0; width: 100%; max-width: 1060px; margin: 0 auto; }
  .boardWrap { flex: 1 1 auto; overflow-y: auto; overflow-x: hidden; min-height: 0; padding: 4px 10px 8px; touch-action: pan-y; -webkit-overflow-scrolling: touch; scrollbar-width: thin; }
  .board {
    margin: 0 auto; padding: 8px 8px 10px; border-radius: 20px; width: max-content; max-width: 100%;
    background: linear-gradient(180deg, #2a5670, #1b3d52); box-shadow: 0 0 0 3px #0b1c27, 0 0 0 5px rgba(231, 181, 82, 0.55), 0 12px 30px rgba(0, 0, 0, 0.45), inset 0 2px 0 rgba(255, 255, 255, 0.12);
    position: relative;
  }
  .row { display: flex; align-items: center; gap: 8px; padding: 4px 6px; border-radius: 14px; position: relative; }
  .row + .row { margin-top: 3px; }
  .row .rn { width: 22px; text-align: center; font-size: 13px; font-weight: 800; color: rgba(247, 238, 216, 0.45); flex: none; }
  .row .slots { display: flex; gap: 6px; }
  .slot {
    width: var(--S); height: var(--S); border-radius: 50%; flex: none; position: relative;
    background: radial-gradient(circle at 50% 40%, #0b1a24 0%, #132c3b 70%, #20465c 100%);
    box-shadow: inset 0 3px 6px rgba(0, 0, 0, 0.6), 0 1px 0 rgba(255, 255, 255, 0.12);
  }
  .gem { position: absolute; inset: -6%; background-size: contain; background-repeat: no-repeat; background-position: center; pointer-events: none; }
  .gem:not([class*=" g"]) { display: none; }
  .row.active { background: rgba(255, 220, 140, 0.13); box-shadow: inset 0 0 0 2px rgba(231, 181, 82, 0.7); }
  .row.active .rn { color: var(--brass3); }
  .row.active .slot { cursor: pointer; }
  .row.active .slot.cur { box-shadow: inset 0 3px 6px rgba(0, 0, 0, 0.6), 0 0 0 3px #ffe39b; }
  .row.active .slot.cur::after { content: ''; position: absolute; left: 50%; bottom: -7px; width: 8px; height: 8px; margin-left: -4px; border-radius: 50%; background: #ffe39b; animation: blink 1s ease-in-out infinite; }
  .row.future { opacity: 0.42; }
  .row.future .slot { transform: scale(0.82); }
  .pegs { display: grid; gap: 3px; flex: none; align-content: center; }
  .peg {
    width: var(--P); height: var(--P); border-radius: 50%; display: block; background-size: contain; background-repeat: no-repeat;
    background: radial-gradient(circle at 50% 50%, rgba(3, 10, 14, 0.75) 0 26%, rgba(255, 255, 255, 0.1) 29% 36%, transparent 39%);
  }
  .peg.pB, .peg.pW { background-size: contain; animation: pegIn 0.32s cubic-bezier(0.2, 1.8, 0.4, 1) both; }
  .row.secret { margin-bottom: 6px; padding-bottom: 8px; border-bottom: 2px dashed rgba(231, 181, 82, 0.35); border-radius: 14px 14px 4px 4px; }
  .row.secret .rn svg { width: 20px; height: 20px; }
  .row.secret .slot { background: radial-gradient(circle at 50% 40%, #3a2a10, #1d150a); }
  .cover { position: absolute; inset: 0; border-radius: 50%; display: grid; place-items: center; font-weight: 900; color: #3b2405; font-size: calc(var(--S) * 0.45);
    background: radial-gradient(circle at 35% 30%, #fff3c4, #e7b552 45%, #8a5a14 100%); box-shadow: inset 0 -3px 4px rgba(0, 0, 0, 0.35); transition: transform 0.35s ease, opacity 0.35s ease; }
  .cover.off { transform: scale(0.2) rotate(140deg); opacity: 0; }
  .secret .lbl { font-size: 13px; font-weight: 800; color: var(--brass); min-width: 40px; text-align: center; line-height: 1.2; }
  .gem.drop { animation: gemDrop 0.28s cubic-bezier(0.3, 1.6, 0.5, 1) both; }
  .row.shake { animation: kg-shake 0.35s ease; }
  .row.solved { background: rgba(95, 208, 138, 0.2); box-shadow: inset 0 0 0 2px rgba(95, 208, 138, 0.8); }
  .setupNote { text-align: center; color: var(--muted); font-weight: 700; font-size: 15px; line-height: 1.6; padding: 14px 10px 4px; max-width: 340px; margin: 0 auto; }
  .setupNote b { color: var(--brass3); }

  .side { flex: none; padding: 6px 12px calc(10px + env(safe-area-inset-bottom)); display: flex; flex-direction: column; gap: 8px; width: 100%; max-width: 560px; margin: 0 auto; }
  .foxline { display: flex; align-items: center; gap: 8px; min-height: 52px; }
  #foxMini { width: 50px; height: 50px; flex: none; }
  .bubble {
    flex: 1; position: relative; background: #fff8e6; color: #3a2a18; border-radius: 14px; padding: 6px 12px; font-size: 15px; font-weight: 700; line-height: 1.35;
    min-height: 44px; display: flex; align-items: center; box-shadow: 0 3px 0 rgba(0, 0, 0, 0.3);
  }
  .bubble::before { content: ''; position: absolute; left: -7px; top: 50%; margin-top: -7px; border: 7px solid transparent; border-right-color: #fff8e6; border-left: 0; }
  .bubble.pop { animation: bubblePop 0.3s cubic-bezier(0.2, 1.6, 0.4, 1); }
  .tools { display: flex; gap: 6px; }
  .tools .btn { flex: 1; font-size: 15px; padding: 6px 4px; min-height: 42px; border-radius: 14px; }
  .palette { display: flex; justify-content: center; gap: 4px; touch-action: none; }
  .pg {
    position: relative; flex: 0 1 var(--PG); width: var(--PG); max-width: var(--PG); aspect-ratio: 1 / 1.08; border: 0; padding: 0; background: rgba(0, 0, 0, 0.22); border-radius: 14px; cursor: pointer;
    box-shadow: inset 0 0 0 2px rgba(255, 255, 255, 0.07); touch-action: none; display: flex; flex-direction: column; align-items: center; justify-content: center;
  }
  .pg .gem { position: relative; inset: auto; display: block; width: 90%; height: 0; padding-bottom: 90%; }
  .pg .k { position: absolute; right: 3px; top: 2px; font-size: 11px; font-weight: 800; color: rgba(255, 255, 255, 0.45); }
  .pg .nm { font-size: 12px; font-weight: 800; color: var(--ink); margin-top: -2px; line-height: 1.1; }
  .pg:active { transform: scale(0.92); }
  .pg.noted .gem { opacity: 0.28; filter: grayscale(0.7); }
  .pg.noted::after {
    content: ''; position: absolute; left: 14%; right: 14%; top: 46%; height: 4px; border-radius: 4px; background: var(--bad); transform: rotate(-38deg); box-shadow: 0 0 0 1.5px #3a0b0b;
  }
  .pg.used { box-shadow: inset 0 0 0 2px rgba(255, 227, 155, 0.6); }
  .palette.notes .pg { box-shadow: inset 0 0 0 2px rgba(255, 114, 114, 0.55); }
  .actions { display: flex; gap: 8px; }
  .actions .btn { flex: 1; min-height: 52px; font-size: 18px; }
  #bSubmit { flex: 1.6; }
  #bSubmit svg { width: 28px; height: 28px; }
  #bSubmit .lever { transform-origin: 8px 22px; transition: transform 0.12s ease; }
  #bSubmit.pull .lever { transform: rotate(70deg); }
  .fbPanel { display: none; flex-direction: column; gap: 8px; }
  .fbPanel.on { display: flex; }
  .fbRow { display: flex; gap: 8px; }
  .stepper { flex: 1; display: flex; align-items: center; gap: 6px; background: rgba(0, 0, 0, 0.25); border-radius: 16px; padding: 6px; }
  .stepper .pegBig { width: 30px; height: 30px; background-size: contain; flex: none; }
  .stepper .v { flex: 1; text-align: center; font-size: 26px; font-weight: 900; }
  .stepper .btn { width: 44px; padding: 0; font-size: 24px; }
  .fbHelp { font-size: 13px; color: var(--muted); text-align: center; font-weight: 700; }

  #pauseBtn {
    position: fixed; right: 10px; top: 62px; width: 48px; height: 48px; border-radius: 50%; z-index: 9200; display: none; border: 3px solid #f4d48a;
    background: linear-gradient(180deg, #2d6380, #1a3b4f); box-shadow: 0 4px 0 #071620; cursor: pointer; padding: 0; place-items: center;
  }
  #pauseBtn svg { width: 22px; height: 22px; }
  body.inplay #pauseBtn { display: grid; }
  body.ovopen #pauseBtn { display: none; }
  .board.tight .secret .lbl { visibility: hidden; }

  /* ---------- 遮罩 ---------- */
  .ov { position: fixed; inset: 0; z-index: 9000; display: none; align-items: center; justify-content: center; padding: 64px 14px calc(14px + env(safe-area-inset-bottom)); background: rgba(4, 12, 18, 0.74); }
  .ov.on { display: flex; animation: kg-fade 0.2s ease; }
  .card {
    width: min(430px, 100%); max-height: 100%; overflow-y: auto; border-radius: 24px; padding: 18px 18px 16px; text-align: center;
    background: linear-gradient(180deg, #24506a, #173547); box-shadow: 0 0 0 3px #0a1820, 0 0 0 5px rgba(231, 181, 82, 0.6), 0 20px 50px rgba(0, 0, 0, 0.55);
    animation: kg-pop 0.3s cubic-bezier(0.2, 1.5, 0.4, 1);
  }
  .card h2 { margin: 2px 0 8px; font-size: 26px; color: var(--brass3); letter-spacing: 1px; }
  .card p { margin: 6px 0; font-size: 16px; line-height: 1.55; color: var(--ink); }
  .card .acts { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-top: 12px; }
  .card .acts .btn { flex: 1 1 40%; }
  .card .col { display: flex; flex-direction: column; gap: 8px; margin-top: 10px; }
  .toggles { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px; margin-top: 10px; }
  .toggles .btn { font-size: 14px; padding: 6px 2px; flex-direction: column; gap: 0; }
  .toggles .btn small { font-size: 12px; }
  .help { text-align: left; }
  .help p { font-size: 15px; }
  .help .pegI { display: inline-block; width: 18px; height: 18px; vertical-align: -3px; background-size: contain; }
  .help .gemI { display: inline-block; width: 26px; height: 26px; vertical-align: -7px; background-size: contain; }
  .stats table { width: 100%; border-collapse: collapse; font-size: 14px; margin-top: 6px; }
  .stats th, .stats td { padding: 6px 2px; border-bottom: 1px solid rgba(255, 255, 255, 0.1); }
  .stats th { color: var(--brass); font-size: 13px; }
  .stats td:first-child { text-align: left; font-weight: 800; }
  .bigNum { display: flex; gap: 8px; justify-content: center; margin: 8px 0; }
  .bigNum div { flex: 1; background: rgba(0, 0, 0, 0.22); border-radius: 14px; padding: 8px 4px; }
  .bigNum b { display: block; font-size: 26px; color: var(--brass3); }
  .bigNum small { font-size: 12px; color: var(--muted); font-weight: 700; }

  #result { padding: 0; background: rgba(4, 10, 15, 0.86); }
  #vault { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  #result .card { position: absolute; left: 50%; bottom: calc(12px + env(safe-area-inset-bottom)); transform: translateX(-50%); width: min(420px, calc(100% - 24px)); max-height: 56%;
    opacity: 0; pointer-events: none; animation: none; transition: opacity 0.35s ease, transform 0.35s cubic-bezier(0.2, 1.4, 0.4, 1); }
  #result .card.show { opacity: 1; pointer-events: auto; transform: translateX(-50%) translateY(0); }
  #result .card:not(.show) { transform: translateX(-50%) translateY(30px); }
  .stars { display: flex; gap: 6px; justify-content: center; margin: 2px 0 4px; }
  .stars i { width: 34px; height: 34px; display: block; }
  .codeShow { display: flex; gap: 6px; justify-content: center; margin: 6px 0; }
  .codeShow i { width: 40px; height: 40px; background-size: contain; display: block; }
  #handoff .card svg.lockBig { width: 90px; height: 90px; display: block; margin: 0 auto 4px; }
  .flash {
    position: fixed; left: 50%; top: 40%; z-index: 8500; pointer-events: none; transform: translate(-50%, -50%); font-size: 28px; font-weight: 900; color: #fff3c4;
    text-shadow: 0 3px 0 #5a3508, 0 0 18px rgba(0, 0, 0, 0.6); opacity: 0; white-space: nowrap;
  }
  .flash.go { animation: flash 1s ease forwards; }
  #drag { position: fixed; left: 0; top: 0; width: 60px; height: 60px; z-index: 8800; pointer-events: none; display: none; background-size: contain; background-repeat: no-repeat; }

  @keyframes blink { 50% { opacity: 0.25; } }
  @keyframes pegIn { from { transform: scale(0) rotate(-90deg); } to { transform: scale(1); } }
  @keyframes gemDrop { from { transform: translateY(-40%) scale(1.25); opacity: 0.2; } to { transform: none; opacity: 1; } }
  @keyframes bubblePop { from { transform: scale(0.94); } to { transform: none; } }
  @keyframes flash { 0% { opacity: 0; transform: translate(-50%, -30%) scale(0.6); } 20% { opacity: 1; transform: translate(-50%, -50%) scale(1.08); } 75% { opacity: 1; transform: translate(-50%, -55%) scale(1); } 100% { opacity: 0; transform: translate(-50%, -70%) scale(1); } }

  /* ---------- 橫式 ---------- */
  body.land.short #title { flex-direction: row; align-items: stretch; justify-content: center; padding: 58px 20px calc(10px + env(safe-area-inset-bottom)); gap: 18px; }
  body.land.short .t-left { justify-content: center; max-width: 440px; }
  body.land.short .t-right { justify-content: center; max-width: 440px; }
  body.land .main { flex-direction: row; gap: 4px; }
  body.land .hud { height: 50px; margin-top: 2px; }
  body.land .boardWrap { flex: 1 1 54%; }
  body.land .side { flex: 1 1 46%; max-width: 470px; overflow-y: auto; justify-content: center; padding-top: 0; }
  body.land.short .side { justify-content: flex-start; }
  body.land .foxline { padding-right: 58px; min-height: 64px; }
  body.land #result .card { left: auto; right: 16px; bottom: auto; top: 50%; transform: translateY(-50%); width: min(400px, 48%); max-height: calc(100% - 24px); }
  body.land #result .card:not(.show) { transform: translateY(-46%); }
  body.land #result .card.show { transform: translateY(-50%); }
  body.short .ov { padding-top: 12px; }
  body.short .card { padding: 12px 16px; }
  body.short .card h2 { font-size: 22px; margin-bottom: 4px; }
  body.short .card p { margin: 4px 0; font-size: 15px; }
  body.short .card .col { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-top: 6px; }
  body.short:not(.land) .foxline { min-height: 44px; }
  body.short #foxMini { width: 40px; height: 40px; }
  body.short .bubble { font-size: 14px; min-height: 40px; padding: 4px 10px; }
  body.short .actions .btn { min-height: 46px; }
  body.short .tools .btn { min-height: 40px; }
  body.short .modes .btn { min-height: 52px; font-size: 16px; }
  body.short .logo { font-size: 40px; }
  body.short .tag { font-size: 13px; }
  @media (prefers-reduced-motion: reduce) { .gem.drop, .peg.pB, .peg.pW { animation: none; } }
</style>
</head>
<body>
<div id="app">
  <section id="title" class="screen on" aria-label="標題">
    <div class="t-left">
      <canvas id="hero" aria-hidden="true"></canvas>
      <h1 class="logo">色彩密碼</h1>
      <div class="tag">跟狐狸偵探一起，猜出寶庫的寶石密碼！</div>
    </div>
    <div class="t-right">
      <div class="seg" id="diffSeg"></div>
      <div class="modes">
        <button class="btn gold" id="mSingle">單人破解<small>猜出電腦藏的密碼</small></button>
        <button class="btn" id="mDuo">雙人對戰<small>一人出題、一人猜</small></button>
        <button class="btn" id="mDaily">每日密碼<small id="dailyTag">今天的挑戰</small></button>
        <button class="btn" id="mReverse">電腦來猜<small>考考小狐狸</small></button>
      </div>
      <div class="minor">
        <button class="btn ghost" id="bStats"><svg viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2" stroke="currentColor" stroke-width="2.6" fill="none" stroke-linecap="round"/></svg>戰績</button>
        <button class="btn ghost" id="bHelp"><svg viewBox="0 0 24 24"><circle cx="10" cy="10" r="6.5" stroke="currentColor" stroke-width="2.6" fill="none"/><path d="M15 15l6 6" stroke="currentColor" stroke-width="3" stroke-linecap="round"/></svg>玩法</button>
        <button class="btn ghost" id="bSet"><svg viewBox="0 0 24 24"><path d="M12 8.5a3.5 3.5 0 1 0 0 7 3.5 3.5 0 0 0 0-7zM12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1" stroke="currentColor" stroke-width="2.4" fill="none" stroke-linecap="round"/></svg>設定</button>
      </div>
    </div>
  </section>

/* 標題：比較輕快的 F 大調搖擺（104 bpm），馬林巴主旋律、顫音琴回應 */

/* =====================================================================

 * ===================================================================== */
function hexRgb(h) { const n = parseInt(h.slice(1), 16); return [n >> 16 & 255, n >> 8 & 255, n & 255]; }
function mix(h, t, amt) { const a = hexRgb(h), b = t === 'w' ? [255, 255, 255] : [0, 0, 0]; return 'rgb(' + a.map((v, i) => Math.round(v + (b[i] - v) * amt)).join(',') + ')'; }
function shapePts(kind) {
  const P = [];
  if (kind === 'heart') {
    for (let i = 0; i < 20; i++) {
      const t = i / 20 * Math.PI * 2;
      P.push([16 * Math.pow(Math.sin(t), 3) / 17 * 0.98, -(13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t)) / 17 * 0.98 - 0.14]);
    }
  } else if (kind === 'drop') {
    P.push([0, -1]);
    for (let i = 0; i <= 12; i++) { const a = (-38 + i * (256 / 12)) * Math.PI / 180; P.push([0.64 * Math.cos(a), 0.34 + 0.64 * Math.sin(a)]); }
  } else if (kind === 'oct') {
    const w = 0.74, h = 0.94, c = 0.3;
    P.push([-w + c, -h], [w - c, -h], [w, -h + c], [w, h - c], [w - c, h], [-w + c, h], [-w, h - c], [-w, -h + c]);
  } else if (kind === 'star') {
    for (let i = 0; i < 10; i++) { const a = -Math.PI / 2 + i * Math.PI / 5, r = i % 2 ? 0.5 : 1.02; P.push([r * Math.cos(a), r * Math.sin(a) + 0.07]); }
  } else if (kind === 'diamond') {
    P.push([0, -1], [0.42, -0.5], [0.84, 0], [0.42, 0.5], [0, 1], [-0.42, 0.5], [-0.84, 0], [-0.42, -0.5]);
  } else if (kind === 'tri') {
    const V = [[0, -0.98], [1.0, 0.72], [-1.0, 0.72]];
    for (let i = 0; i < 3; i++) { const a = V[i], b = V[(i + 1) % 3]; P.push([a[0], a[1] - 0.15]); P.push([(a[0] + b[0]) / 2, (a[1] + b[1]) / 2 - 0.15]); }
  } else if (kind === 'hex') {

    if (win) { d.won++; d.sum += guesses; d.streak = d.last === yesterdayStr() || d.last === today ? d.streak + (d.last === today ? 0 : 1) : 1; d.last = today; d.best = Math.max(d.best, d.streak); }

function sizeBoard() {
  const cfg = G.cfg, n = cfg.slots, cols = Math.ceil(n / 2);
  const bw = el.boardWrap.clientWidth - 20 - 16 - 12;

  let P = 15, S = 44;

    const pegW = setup ? 48 : cols * (P + 3) + 2;

  // 能塞得下全部的列就塞（但不要小於 38）

  if (!setup && fitS < S) S = Math.max(fitS, cfg.key === 'kid' ? 44 : 38, Math.min(S, 38));
  if (setup) S = Math.min(cfg.key === 'kid' ? 84 : 66, Math.floor((bw - 60 - (land ? 0 : 64)) / n) - 8);

/* ---------- 提交猜測 ---------- */
function submit() {

  const guess = G.cur.slice(), fb = feedback(guess, G.secret), r = G.rows.length;
  G.rows.push({ guess, b: fb.b, w: fb.w });

}
function revealPegs(r, fb, done) {
  const row = rowEl(r), pegs = row ? row.querySelectorAll('.peg') : [], pan = gemPan(row && row.querySelector('.pegs'));
  const marks = []; for (let i = 0; i < fb.b; i++) marks.push('B'); for (let i = 0; i < fb.w; i++) marks.push('W');

}

  if (fb.b === n) { const row = rowEl(r); if (row) row.classList.add('solved'); endGame(true); return; }
  if (G.rows.length >= cfg.tries) { endGame(false); return; }
  // 小小孩：全錯的顏色自動幫忙做筆記

}

/* ---------- 出題（雙人、電腦來猜） ---------- */

/* ---------- 電腦來猜 ---------- */
function codeNames(arr) { return arr.map((c) => GEMS[c].name).join(''); }
function cpuTurn() {

  G.busy = true;
  say(r === 0 ? '嗯……讓我想想第一步。' : '嗯……還有 ' + st.S.length + ' 種可能，我在比較哪一組最好……', 'think');
  sfx('think');
  later(700, () => sfx('think'));
  later(1300, () => {
    let pick, reason;
    if (r === 0) {
      const n = G.cfg.slots, g = [];
      if (G.dup) for (let k = 0; k < n; k++) g.push(Math.floor(k / 2));
      else for (let k = 0; k < n; k++) g.push(k);

      const worst = worstCase(st.T, gid, st.S);
      pick = { gid, worst, inS: true };
      reason = G.dup
        ? '開局先猜「' + codeNames(g) + '」：一次測好幾種顏色，不管你怎麼回答，最多只會剩 ' + worst + ' 種可能。'

    } else {
      pick = cpuPick(st);
      if (st.S.length === 1) reason = '線索只剩一種可能了，答案一定是「' + codeNames(idCode(st.T, pick.gid)) + '」！';
      else if (st.S.length === 2) reason = '只剩 2 種可能，我猜其中一種：猜錯也一定知道答案。';
      else {
        reason = '你的提示讓可能的密碼從 ' + st.prevS + ' 種變成 ' + st.S.length + ' 種。這次猜這組，最糟也只會剩' + (pick.approx ? '大約 ' : ' ') + pick.worst + ' 種。';
        if (!pick.inS) reason += '（它不一定是答案，但最能縮小範圍！）';
      }
    }
    st.last = pick;
    const guess = idCode(st.T, pick.gid);
    G.rows.push({ guess, b: -1, w: -1 });
    const row = rowEl(r);
    refreshRows();
    if (row) { row.classList.add('active'); row.classList.remove('future'); }
    scrollToActive(true);
    guess.forEach((c, k) => later(k * 170, () => {
      if (!row) return;
      const s = row.querySelectorAll('.slot')[k];
      setGem(s, c, true);
      sfx('gemDrop', { pitch: gemPitch(c) * vary(0.02), pan: gemPan(s) });
    }));
    later(guess.length * 170 + 250, () => {
      sfx('lever', { vol: 0.8 });
      say(reason, 'normal');
      G.busy = false;
      G.phase = 'feedback';
      G.fbB = 0; G.fbW = 0;
      $('#fbHelp').textContent = '跟你的密碼比一比：幾顆位置和顏色都對（黑）？幾顆只有顏色對（白）？';
      updateUI(); updateMusic();
      if (autoFb) later(900, () => { if (G.phase === 'feedback') { const fb = feedback(guess, G.secret); G.fbB = fb.b; G.fbW = fb.w; updateUI(); sfx('stepUp'); later(500, answerCpu); } });
    });
  });
}
function stepFb(which, d) {
  if (G.phase !== 'feedback') return;
  const n = G.cfg.slots;
  if (which === 'b') G.fbB = clamp(G.fbB + d, 0, n); else G.fbW = clamp(G.fbW + d, 0, n);
  if (G.fbB + G.fbW > n) { if (which === 'b') G.fbW = n - G.fbB; else G.fbB = n - G.fbW; }
  sfx(d > 0 ? 'stepUp' : 'stepDown', { pitch: 1 + (which === 'b' ? G.fbB : G.fbW) * 0.06 });

function answerCpu() {

    msg = '咦？小狐狸幫你再對一次：應該是 ' + real.b + ' 黑 ' + real.w + ' 白喔！';

/* ---------- 結束：寶庫門 ---------- */
const V = { on: false, t: 0, win: false, n: 4, lit: 0, unlock: 0, open: 0, card: 0, events: [], sparks: [], last: null, fail: 0 };

  let s = null;

  } else if (G.mode === 'duo') {

    text = win ? '用了 ' + used + ' 次猜出密碼。' : '沒猜到，算 ' + (cfg.tries + 1) + ' 次。';
    text += '<br>玩家1 共 ' + sum(t0) + ' 次（' + t0.length + ' 局）．玩家2 共 ' + sum(t1) + ' 次（' + t1.length + ' 局）';
    if (t0.length === t1.length && t0.length > 0) {
      const a = sum(t0), b = sum(t1);
      text += '<br><b>' + (a === b ? '目前平手！' : '目前 玩家' + (a < b ? 1 : 2) + ' 領先（次數少的贏）') + '</b>';
    }
    acts = [['交換角色', 'gold', () => { G.duo.setter = 1 - G.duo.setter; startGame('duo', { keepDuo: true }); }], ['回標題', '', goTitle]];
  } else {
    if (win) { title = '小狐狸猜到了！'; text = '電腦用了 ' + used + ' 次猜出你的密碼。<br>它每次都挑「最糟情況剩最少」的猜法。電腦平均 ' + (s.cpu.sum / s.cpu.played).toFixed(1) + ' 次。'; stars = 0; }
    else { title = '你的密碼太厲害了！'; text = '小狐狸沒猜到，你贏了！'; }

  const ra = $('#resActs'); ra.innerHTML = '';
  acts.forEach(([t, cls, fn]) => { const b = document.createElement('button'); b.className = 'btn ' + cls; b.textContent = t; b.addEventListener('click', () => { sfx('ui'); closeResult(); fn(); }); ra.appendChild(b); });
  // 打開保險箱動畫前先把寶庫列翻開

  if (sec) sec.querySelectorAll('.slot').forEach((sl, k) => later(k * 120, () => { setGem(sl, G.secret[k], false); const cv = sl.querySelector('.cover'); if (cv) cv.classList.add('off'); sfx('tumbler', { pitch: 0.9 + k * 0.08 }); }));
  const lastB = G.rows.length ? Math.max.apply(null, G.rows.map((r) => r.b)) : 0;
  later(cfg.slots * 120 + 500, () => startVault(win, cfg.slots, win ? cfg.slots : lastB));
  if (win) say(G.mode === 'reverse' ? '哈哈，我猜到了！' : '太厲害了，寶庫打開了！', 'happy');
  else say(G.mode === 'reverse' ? '哇，你的密碼難倒我了！' : '可惜……寶庫還鎖著。', 'sad');
}
function starSvg(on) {

}

  }
  vaultEvent('music', tU + 4.2, () => { if ($('#result').classList.contains('on')) musicTitle(); });
  // 閃光粒子

    V.sparks.push({ x: (Math.random() - 0.5) * 0.9, y: 0.2 + Math.random() * 0.4, vy: -0.12 - Math.random() * 0.2, life: 1, s: 0.5 + Math.random() });
  }

function drawVault() {
  const c = vaultCv.getContext('2d'), r0 = vRect || { x: 0, y: 0, w: VW, h: VH };
  c.clearRect(0, 0, VW, VH);
  const cx = r0.x + r0.w / 2, cy = r0.y + r0.h / 2, R = Math.max(40, Math.min(r0.w, r0.h) * 0.38);
  const t = V.t, tU = V.tU || 9;
  const open = V.win ? clamp((t - tU - 0.35) / 1.1, 0, 1) : 0;
  const ease = 1 - Math.pow(1 - open, 3);
  // 光暈
  const bg = c.createRadialGradient(cx, cy, R * 0.2, cx, cy, R * 2.2);
  bg.addColorStop(0, V.win && open > 0 ? 'rgba(255,200,90,' + (0.35 * ease) + ')' : 'rgba(80,140,170,0.18)'); bg.addColorStop(1, 'rgba(0,0,0,0)');
  c.fillStyle = bg; c.fillRect(0, 0, VW, VH);
  // 牆框
  c.beginPath(); c.arc(cx, cy, R * 1.16, 0, Math.PI * 2);
  const fr = c.createLinearGradient(cx - R, cy - R, cx + R, cy + R); fr.addColorStop(0, '#5d6f7a'); fr.addColorStop(1, '#1f2a31');
  c.fillStyle = fr; c.fill(); c.lineWidth = 4; c.strokeStyle = '#0b1217'; c.stroke();
  for (let i = 0; i < 16; i++) { const a = i * Math.PI / 8; c.beginPath(); c.arc(cx + Math.cos(a) * R * 1.08, cy + Math.sin(a) * R * 1.08, R * 0.035, 0, Math.PI * 2); c.fillStyle = '#9fb0ba'; c.fill(); }
  // 裡面（寶藏）
  c.beginPath(); c.arc(cx, cy, R, 0, Math.PI * 2);
  const inG = c.createRadialGradient(cx, cy + R * 0.3, R * 0.1, cx, cy, R);
  inG.addColorStop(0, V.win ? '#ffe9a8' : '#2a2a2a'); inG.addColorStop(0.5, V.win ? '#c58a2b' : '#151515'); inG.addColorStop(1, '#2a1a08');
  c.fillStyle = inG; c.fill();
  if (V.win && open > 0) {
    c.save(); c.beginPath(); c.arc(cx, cy, R * 0.98, 0, Math.PI * 2); c.clip();
    // 金幣堆
    c.fillStyle = '#e6b23f';
    c.beginPath(); c.ellipse(cx, cy + R * 0.75, R * 0.85, R * 0.45, 0, Math.PI, 0); c.fill();
    for (let i = 0; i < 18; i++) {
      const a = (i * 2.3) % 1, gx = cx + (a - 0.5) * R * 1.3, gy = cy + R * 0.45 + ((i * 7) % 5) * R * 0.06;
      c.beginPath(); c.ellipse(gx, gy, R * 0.09, R * 0.04, 0, 0, Math.PI * 2); c.fillStyle = i % 2 ? '#ffd76a' : '#d49a26'; c.fill();
    }
    const gs = R * 0.36;
    G.secret.forEach((ci, k) => {
      const nn = G.secret.length, gx = cx + (k - (nn - 1) / 2) * gs * 0.78, bob = Math.sin(t * 2.4 + k) * R * 0.03;
      const im = gemImgs[ci]; if (im.complete) c.drawImage(im, gx - gs / 2, cy - gs * 0.2 + bob - (1 - ease) * R * 0.2, gs, gs);
    });
    c.restore();
  }
  // 門
  const ang = ease * Math.PI * 0.46, sx = Math.cos(ang);
  c.save();
  c.translate(cx - R + R * sx + (1 - sx) * -R * 0.12, cy);
  if (!V.win) c.translate(Math.sin(t * 40) * Math.max(0, 1 - Math.abs(t - tU - 0.2) * 3) * 6, 0);
  // 門的厚度
  if (open > 0) { c.save(); c.scale(sx, 1); c.beginPath(); c.arc(R * 0.12 / Math.max(0.2, sx), 0, R * 0.98, 0, Math.PI * 2); c.fillStyle = '#2b363d'; c.fill(); c.restore(); }
  c.scale(sx, 1);
  c.beginPath(); c.arc(0, 0, R * 0.98, 0, Math.PI * 2);
  const dg = c.createRadialGradient(-R * 0.35, -R * 0.4, R * 0.1, 0, 0, R);
  dg.addColorStop(0, '#c9d6dd'); dg.addColorStop(0.55, '#7e919c'); dg.addColorStop(1, '#3d4a52');
  c.fillStyle = dg; c.fill(); c.lineWidth = 5; c.strokeStyle = '#26323a'; c.stroke();
  c.beginPath(); c.arc(0, 0, R * 0.8, 0, Math.PI * 2); c.lineWidth = 3; c.strokeStyle = 'rgba(30,40,46,0.55)'; c.stroke();
  // 鎖點燈（每顆寶石一個）
  for (let i = 0; i < V.n; i++) {
    const a = -Math.PI / 2 + (i - (V.n - 1) / 2) * 0.32, lx = Math.cos(a) * R * 0.68, ly = Math.sin(a) * R * 0.68;
    const on = i < V.lit && t > 0.25 + i * 0.2;
    const failRed = !V.win && t > tU;
    c.beginPath(); c.arc(lx, ly, R * 0.065, 0, Math.PI * 2);
    c.fillStyle = on ? '#5fe08f' : failRed ? '#ff5a5a' : '#2a3338'; c.fill(); c.lineWidth = 2; c.strokeStyle = '#141b20'; c.stroke();
  }
  // 轉盤把手
  const rot = V.win ? Math.min(t, tU) * 3.2 + clamp((t - tU) / 0.3, 0, 1) * Math.PI / 2 : Math.min(t, tU) * 3.2 + (t > tU ? Math.sin((t - tU) * 30) * 0.05 * Math.max(0, 1 - (t - tU)) : 0);
  c.save(); c.rotate(rot);
  c.lineCap = 'round'; c.strokeStyle = '#e7b552'; c.lineWidth = R * 0.07;
  for (let i = 0; i < 3; i++) { const a = i * Math.PI * 2 / 3; c.beginPath(); c.moveTo(0, 0); c.lineTo(Math.cos(a) * R * 0.42, Math.sin(a) * R * 0.42); c.stroke(); c.beginPath(); c.arc(Math.cos(a) * R * 0.44, Math.sin(a) * R * 0.44, R * 0.06, 0, Math.PI * 2); c.fillStyle = '#ffd77e'; c.fill(); }
  c.beginPath(); c.arc(0, 0, R * 0.14, 0, Math.PI * 2); c.fillStyle = '#c48a2a'; c.fill(); c.lineWidth = 3; c.strokeStyle = '#6b4210'; c.stroke();
  c.restore();
  // 狐狸徽章
  c.save(); c.translate(0, R * 0.5); c.beginPath(); c.arc(0, 0, R * 0.16, 0, Math.PI * 2); c.fillStyle = '#25333b'; c.fill(); drawFox(c, 0, R * 0.02, R * 0.09, V.win && t > tU ? 'happy' : !V.win && t > tU ? 'sad' : 'think', t, {}); c.restore();
  c.restore();
  // 閃光
  V.sparks.forEach((p) => {
    const x = cx + p.x * R * 2, y = cy + (p.y - 0.4) * R * 2.2, s = R * 0.05 * p.s;
    c.globalAlpha = Math.max(0, p.life);
    c.fillStyle = '#fff6c8';
    c.beginPath(); c.moveTo(x, y - s * 2); c.lineTo(x + s * 0.5, y); c.lineTo(x, y + s * 2); c.lineTo(x - s * 0.5, y); c.closePath(); c.fill();
    c.beginPath(); c.moveTo(x - s * 2, y); c.lineTo(x, y + s * 0.5); c.lineTo(x + s * 2, y); c.lineTo(x, y - s * 0.5); c.closePath(); c.fill();
  });
  c.globalAlpha = 1;
}

/* ---------- 標題畫面動畫 ---------- */
const hero = $('#hero');
let heroW = 0, heroH = 0, heroT = 0;
const heroGems = [];
for (let i = 0; i < 9; i++) heroGems.push({ c: i % 8, a: i / 9 * Math.PI * 2, r: 0.8 + (i % 3) * 0.16, s: 0.22 + (i % 2) * 0.06 });
function sizeHero() {
  const r = hero.getBoundingClientRect();
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  heroW = Math.max(1, Math.round(r.width)); heroH = Math.max(1, Math.round(r.height));
  hero.width = Math.round(heroW * dpr); hero.height = Math.round(heroH * dpr);
  hero.getContext('2d').setTransform(dpr, 0, 0, dpr, 0, 0);
}
function drawHero(dt) {
  heroT += dt;
  const c = hero.getContext('2d'), w = heroW, h = heroH, t = heroT;
  c.clearRect(0, 0, w, h);
  const s = Math.min(h / 3.9, w * 0.19), cx = w / 2, cy = (h - 3.65 * s) / 2 + 1.3 * s;
  // 聚光燈
  const sp = c.createRadialGradient(cx, cy + s * 0.4, s * 0.3, cx, cy + s * 0.4, Math.min(w / 2, h * 0.6));
  sp.addColorStop(0, 'rgba(255,226,150,0.28)'); sp.addColorStop(1, 'rgba(255,226,150,0)');
  c.fillStyle = sp; c.fillRect(0, 0, w, h);
  // 背後的保險箱門
  c.save(); c.globalAlpha = 0.5;
  c.beginPath(); c.arc(cx, cy + s * 0.25, s * 1.85, 0, Math.PI * 2); c.fillStyle = '#20404f'; c.fill(); c.lineWidth = 3; c.strokeStyle = 'rgba(231,181,82,0.55)'; c.stroke();
  c.beginPath(); c.arc(cx, cy + s * 0.25, s * 1.55, 0, Math.PI * 2); c.strokeStyle = 'rgba(231,181,82,0.3)'; c.stroke();
  for (let i = 0; i < 24; i++) { const a = i * Math.PI / 12 + t * 0.05; c.beginPath(); c.moveTo(cx + Math.cos(a) * s * 1.7, cy + s * 0.25 + Math.sin(a) * s * 1.7); c.lineTo(cx + Math.cos(a) * s * 1.82, cy + s * 0.25 + Math.sin(a) * s * 1.82); c.stroke(); }
  c.restore();
  // 繞著轉的寶石（後半圈）
  const drawRing = (front) => heroGems.forEach((g) => {
    const a = g.a + t * 0.35, z = Math.sin(a);
    if ((z > 0) !== front) return;
    const x = cx + Math.cos(a) * s * 2.1 * g.r, y = cy + s * 0.3 + z * s * 0.5, sz = s * g.s * 2 * (0.8 + 0.25 * (z + 1));
    const im = gemImgs[g.c]; c.globalAlpha = front ? 1 : 0.55;
    if (im.complete) c.drawImage(im, x - sz / 2, y - sz / 2 + Math.sin(t * 2 + g.a * 3) * 3, sz, sz);
  });
  drawRing(false); c.globalAlpha = 1;
  const bl = (t % 4) > 3.85;

  drawRing(true); c.globalAlpha = 1;
}

let lastT = performance.now(), miniBlinkT = 3;
function frame(now) {
  const dt = Math.min(0.05, (now - lastT) / 1000); lastT = now;
  if (!G.paused && !document.hidden) {
    clock += dt;
    for (let i = 0; i < queue.length; i++) {
      if (queue[i].t <= clock) { const q = queue.splice(i, 1)[0]; i--; try { q.fn(); } catch (e) { console.error(e); } }
    }
  }
  if (G.screen === 'title' && !anyOv()) drawHero(dt);
  if (V.on) { updateVault(dt); drawVault(); }
  if (G.screen === 'play') {
    miniBlinkT -= dt;
    if (miniBlinkT < 0) { drawFoxMini(true); miniBlinkT = 2.5 + Math.random() * 2.5; setTimeout(() => drawFoxMini(false), 140); }
  }
  requestAnimationFrame(frame);
}

});
window.addEventListener('pointermove', (e) => {
  if (!drag || e.pointerId !== drag.id) return;
  const d = Math.hypot(e.clientX - drag.x0, e.clientY - drag.y0);
  if (!drag.moved && d > 10 && !G.notesMode) {
    drag.moved = true; clearTimeout(drag.timer);
    el.drag.className = 'g' + drag.c; el.drag.id = 'drag'; el.drag.style.display = 'block';
  }
  if (drag.moved) {
    const sz = Math.max(46, parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--S')) * 1.2);
    el.drag.style.width = el.drag.style.height = sz + 'px';
    el.drag.style.transform = 'translate(' + (e.clientX - sz / 2) + 'px,' + (e.clientY - sz * 0.9) + 'px)';
  }
});
function endDrag() { if (drag) clearTimeout(drag.timer); drag = null; el.drag.style.display = 'none'; }
window.addEventListener('pointerup', (e) => {
  if (!drag || e.pointerId !== drag.id) return;
  const d = drag; endDrag();
  if (d.long) return;
  if (d.moved) {
    const row = editRowEl(); if (!row) return;
    let best = -1, bd = 1e9;
    row.querySelectorAll('.slot').forEach((s, k) => { const r = s.getBoundingClientRect(); const dd = Math.hypot(e.clientX - (r.left + r.width / 2), e.clientY - 20 - (r.top + r.height / 2)); if (dd < bd) { bd = dd; best = k; } });
    const S = row.querySelector('.slot').getBoundingClientRect().width;
    if (best >= 0 && bd < S * 1.6) placeGem(d.c, best, true); else sfx('back', { vol: 0.6 });
    return;
  }
  if (G.notesMode) toggleNote(d.c); else placeGem(d.c);
});
window.addEventListener('pointercancel', endDrag);

// 鍵盤
window.addEventListener('keydown', (e) => {
  if (e.repeat) return;
  if (G.screen !== 'play') return;
  if (e.key === 'Escape' || e.key === 'p' || e.key === 'P') {
    if ($('#help').classList.contains('on')) { closeOv('help'); return; }
    if (G.paused) resumeGame(); else pauseGame();
    e.preventDefault(); return;
  }
  if (anyOv()) { if (e.key === 'Enter' && $('#handoff').classList.contains('on')) $('#hoGo').click(); return; }
  if (G.phase === 'feedback') {
    if (e.key === 'Enter') { answerCpu(); e.preventDefault(); }
    if (e.key === 'b' || e.key === 'B') stepFb('b', e.shiftKey ? -1 : 1);
    if (e.key === 'w' || e.key === 'W') stepFb('w', e.shiftKey ? -1 : 1);
    return;
  }
  const n = parseInt(e.key, 10);
  if (n >= 1 && n <= G.cfg.colors) { if (G.notesMode) toggleNote(n - 1); else { const b = el.palette.children[n - 1]; sfx('gemPick', { pitch: gemPitch(n - 1), pan: gemPan(b) }); placeGem(n - 1); } e.preventDefault(); return; }
  if (e.key === 'Backspace' || e.key === 'Delete') { backspace(); e.preventDefault(); }
  else if (e.key === 'Enter' || e.key === ' ') { submit(); e.preventDefault(); }
  else if (e.key === 'ArrowLeft') { G.cursor = (G.cursor + G.cfg.slots - 1) % G.cfg.slots; sfx('click', { vol: 0.5 }); refreshRows(); }
  else if (e.key === 'ArrowRight') { G.cursor = (G.cursor + 1) % G.cfg.slots; sfx('click', { vol: 0.5 }); refreshRows(); }
  else if (e.key === 'n' || e.key === 'N') toggleNotesMode();
  else if (e.key === 'h' || e.key === 'H') toggleHint();
});

document.addEventListener('visibilitychange', () => { if (document.hidden && G.screen === 'play' && G.phase !== 'done' && !anyOv()) pauseGame(); });
window.addEventListener('resize', layout);
if (window.visualViewport) window.visualViewport.addEventListener('resize', layout);
window.addEventListener('orientationchange', () => setTimeout(layout, 120));

/* ---------- 測試掛鉤 ---------- */
window.__cb = {
  G, V, DIFFS, feedback, cpuPick, universe, getTable, codeId, idCode, filterCands,
  state: () => ({ screen: G.screen, mode: G.mode, phase: G.phase, rows: G.rows.map((r) => [r.guess.join(''), r.b, r.w]), cur: G.cur.slice(), secret: G.secret.slice(), cands: G.cands ? G.cands.length : null, music: KG.music ? KG.music.isPlaying() : null, paused: G.paused, busy: G.busy, bubble: el.bubble.textContent, vault: V.on }),
  setSecret: (a) => { G.secret = a.slice(); },
  ff: (sec) => { clock += sec; },
  simulateCpu: (cfgKey, dup, secret) => { // 不碰畫面：模擬電腦需要幾次
    const cfg = DIFFS[cfgKey], T = getTable(cfg.colors, cfg.slots), U = universe(cfg, dup);
    const st = { T, U, S: U }; let n = 0;
    const sid = codeId(secret, cfg.colors);
    while (n < 20) {
      let gid;
      if (n === 0) { const g = []; for (let k = 0; k < cfg.slots; k++) g.push(dup ? Math.floor(k / 2) : k); gid = codeId(g, cfg.colors); }
      else gid = cpuPick(st).gid;
      n++;
      const key = fbIds(T, gid, sid);
      if (key === cfg.slots * 10) return n;
      st.S = filterCands(T, st.S, gid, key);
    }
    return n;
  }
};

/* ---------- 開始 ---------- */
refreshTitle();
layout();
drawFoxMini(false);
musicTitle();
requestAnimationFrame(frame);
</script>
</body>
