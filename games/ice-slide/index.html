<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>企鵝溜冰迷宮</title>
<link rel="stylesheet" href="../../assets/common.css">
<style>
  html, body { height: 100%; overflow: hidden; background: #bfe6fb; overscroll-behavior: none; }
  #cv { position: fixed; inset: 0; display: block; width: 100vw; height: 100vh; height: 100dvh; touch-action: none; outline: none; z-index: 1; }
  .scr { position: fixed; inset: 0; display: none; pointer-events: none; z-index: 10; }
  .scr.on { display: block; }
  .scr button, .scr .pe { pointer-events: auto; }
  button { font-family: var(--kg-font); }
  .btn {
    border: 0; border-radius: 999px; padding: 12px 22px; font-size: 18px; font-weight: 800; color: #1f5f99;
    background: linear-gradient(#ffffff, #e3f4ff); box-shadow: 0 4px 0 #9fcbe9, 0 8px 18px rgba(20, 70, 120, .22);
    cursor: pointer; transition: transform .08s; white-space: nowrap;
  }
  .btn:active { transform: translateY(3px); box-shadow: 0 1px 0 #9fcbe9, 0 4px 10px rgba(20, 70, 120, .2); }
  .btn.blue { color: #fff; background: linear-gradient(#5fc0ff, #2b8fe6); box-shadow: 0 4px 0 #1c6cb5, 0 8px 18px rgba(20, 70, 120, .3); }
  .btn.green { color: #fff; background: linear-gradient(#6fdc8c, #37b35c); box-shadow: 0 4px 0 #24894a, 0 8px 18px rgba(20, 90, 50, .28); }
  .btn.big { font-size: 24px; padding: 14px 40px; }
  .btn.sm { font-size: 15px; padding: 9px 16px; }
  .btn.off { color: #8aa3b8; }
  .btn:focus-visible, .tb:focus-visible, .lvb:focus-visible, .wcard:focus-visible { outline: 3px solid #ffd65c; outline-offset: 2px; }

  /* 標題 */
  #scr-title { display: none; flex-direction: column; align-items: center; justify-content: center; gap: 10px; padding: 64px 16px 18vh; }
  #scr-title.on { display: flex; }
  .logo { text-align: center; line-height: 1; filter: drop-shadow(0 6px 0 rgba(16, 60, 110, .25)); }
  .logo .l1, .logo .l2 { font-weight: 900; letter-spacing: 4px; color: #fff; -webkit-text-stroke: 2px #1f6fb8; paint-order: stroke fill; }
  .logo .l1 { font-size: clamp(30px, 8vw, 54px); color: #ffe27a; }
  .logo .l2 { font-size: clamp(40px, 11vw, 76px); margin-top: 4px; background: linear-gradient(#ffffff 30%, #bfe9ff); -webkit-background-clip: text; background-clip: text; color: transparent; -webkit-text-stroke: 0; filter: drop-shadow(0 0 1px #1f6fb8) drop-shadow(0 2px 0 #1f6fb8) drop-shadow(0 -2px 0 #1f6fb8) drop-shadow(2px 0 0 #1f6fb8) drop-shadow(-2px 0 0 #1f6fb8); }
  .tagline { color: #fff; font-weight: 800; font-size: 17px; text-shadow: 0 2px 4px rgba(10, 40, 90, .5); margin-bottom: 8px; text-align: center; }
  .tbtns { display: flex; flex-direction: column; align-items: center; gap: 14px; }
  .tbtns .row { display: flex; gap: 10px; }
  .tstars { color: #fff; font-weight: 800; text-shadow: 0 2px 4px rgba(10, 40, 90, .6); font-size: 16px; }
  body.land #scr-title { padding: 60px 16px 70px; gap: 6px; }
  body.land .logo { display: flex; gap: 14px; align-items: baseline; }
  body.land .logo .l1 { font-size: clamp(28px, 5vh, 48px); }
  body.land .logo .l2 { font-size: clamp(36px, 11vh, 72px); }
  body.land .tbtns { flex-direction: row; flex-wrap: wrap; justify-content: center; }
  @media (max-height: 420px) { .btn.big { font-size: 20px; padding: 11px 30px; } .tagline { margin-bottom: 2px; font-size: 15px; } }

  /* 共用標頭、底部 */
  .hdr { position: absolute; top: 10px; left: 64px; right: 64px; height: 48px; display: flex; align-items: center; justify-content: center; gap: 10px;
    color: #fff; font-weight: 900; font-size: 22px; text-shadow: 0 2px 4px rgba(10, 40, 90, .55); white-space: nowrap; overflow: hidden; }
  .hdr small { font-size: 15px; font-weight: 800; opacity: .95; }
  .foot { position: absolute; left: 0; right: 0; bottom: 0; padding: 10px 16px calc(12px + env(safe-area-inset-bottom)); display: flex; justify-content: center; gap: 12px; }

  /* 世界地圖 */
  .mlist { position: absolute; top: 66px; left: 0; right: 0; bottom: 76px; overflow-y: auto; padding: 6px 16px 16px; display: grid; grid-template-columns: 1fr; gap: 12px; align-content: start;
    pointer-events: auto; -webkit-overflow-scrolling: touch; touch-action: pan-y; }
  body.land .mlist { grid-template-columns: repeat(3, 1fr); }
  @media (min-width: 620px) and (orientation: portrait) { .mlist { grid-template-columns: repeat(2, 1fr); } }
  .wcard { position: relative; border: 0; border-radius: 22px; padding: 12px 14px 12px 86px; text-align: left; color: #fff; min-height: 92px; cursor: pointer;
    box-shadow: 0 5px 0 rgba(0, 0, 0, .18), 0 10px 20px rgba(10, 30, 70, .25); font-family: var(--kg-font); overflow: hidden; }
  .wcard canvas { position: absolute; left: 8px; top: 50%; transform: translateY(-50%); width: 70px; height: 70px; }
  .wcard .wn { font-size: 13px; font-weight: 800; opacity: .9; }
  .wcard .wt { font-size: 21px; font-weight: 900; text-shadow: 0 2px 3px rgba(0, 0, 0, .25); }
  .wcard .ws { font-size: 13px; font-weight: 700; opacity: .95; }
  .wcard .wp { font-size: 14px; font-weight: 800; margin-top: 3px; }
  .wcard.lock { filter: grayscale(.7) brightness(.85); }
  .wcard.lock .wp { color: #ffe9a8; }
  body.land .wcard { min-height: 0; padding: 10px 10px 10px 74px; }
  body.land .wcard canvas { width: 58px; height: 58px; }
  body.land .wcard .wt { font-size: 18px; }

  /* 選關 */
  .lgrid { position: absolute; top: 66px; left: 0; right: 0; bottom: 76px; overflow-y: auto; padding: 8px 16px; display: grid; gap: 10px;
    grid-template-columns: repeat(4, minmax(0, 72px)); justify-content: center; align-content: start; pointer-events: auto; touch-action: pan-y; }
  body.land .lgrid { grid-template-columns: repeat(10, minmax(0, 66px)); gap: 8px; }
  @media (min-width: 520px) and (orientation: portrait) { .lgrid { grid-template-columns: repeat(5, 76px); } }
  .lvb { position: relative; aspect-ratio: 1; border: 0; border-radius: 18px; background: linear-gradient(#ffffff, #d6efff); color: #1f5f99; font-size: 24px; font-weight: 900;
    box-shadow: 0 4px 0 #8fc0e2, 0 8px 14px rgba(10, 40, 90, .2); cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 0; }
  .lvb .st { font-size: 12px; letter-spacing: -1px; color: #c9d6e2; line-height: 1; margin-top: 2px; }
  .lvb .st b { color: #ffb400; font-weight: 900; }
  .lvb.lock { background: linear-gradient(#c7d6e3, #a9bccd); color: #6f8597; box-shadow: 0 4px 0 #8296a8; }
  .lvb.done { background: linear-gradient(#fffbe9, #ffe9a3); box-shadow: 0 4px 0 #e0b84a, 0 8px 14px rgba(10, 40, 90, .2); }
  .lvb.next { animation: pulse 1.2s ease-in-out infinite; }
  @keyframes pulse { 50% { transform: scale(1.07); } }
  body.land .lvb { font-size: 20px; border-radius: 14px; }

  /* 遊戲中 */
  #hud { position: absolute; top: 8px; left: 64px; right: 64px; text-align: center; color: #fff; text-shadow: 0 2px 3px rgba(10, 40, 90, .6); font-weight: 900; }
  #hud .h1 { font-size: 19px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #hud .h1 .nm { font-size: 14px; font-weight: 800; margin-left: 6px; opacity: .95; }
  #hud .h2 { margin-top: 4px; display: inline-flex; align-items: center; gap: 6px; font-size: 15px; background: rgba(15, 55, 105, .35); border-radius: 999px; padding: 4px 12px; white-space: nowrap; }
  #hud .h2 b { font-size: 19px; color: #fff3b0; }
  #hud .h2 b.over { color: #ffb0a0; }
  #hFish { display: inline-flex; gap: 2px; margin-left: 4px; }
  #hFish svg { width: 22px; height: 16px; }
  body.land #hud { top: 66px; left: 8px; right: auto; width: var(--lw, 160px); text-align: left; }
  body.land #hud .h1 { white-space: normal; font-size: 20px; }
  body.land #hud .h1 .nm { display: block; margin: 2px 0 0; }
  body.land #hud .h2 { display: flex; flex-wrap: wrap; border-radius: 14px; padding: 6px 10px; }
  .fab2 { position: absolute; top: 66px; right: 10px; width: 48px; height: 48px; border-radius: 50%; border: 0; background: rgba(255, 255, 255, .92); color: #1f5f99;
    box-shadow: 0 3px 0 #8fc0e2, 0 6px 12px rgba(10, 40, 90, .25); display: flex; align-items: center; justify-content: center; cursor: pointer; padding: 0; }
  .fab2 svg { width: 22px; height: 22px; }
  #bar { position: absolute; left: 0; right: 0; bottom: 0; display: flex; justify-content: center; gap: 10px; padding: 8px 10px calc(10px + env(safe-area-inset-bottom)); }
  .tb { flex: 0 1 84px; min-width: 64px; height: 66px; border: 0; border-radius: 18px; background: linear-gradient(#ffffff, #e0f2ff); color: #1f5f99; font-weight: 900; font-size: 14px;
    box-shadow: 0 4px 0 #8fc0e2, 0 8px 14px rgba(10, 40, 90, .2); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; cursor: pointer; padding: 0; }
  .tb svg { width: 28px; height: 28px; }
  .tb:active { transform: translateY(3px); box-shadow: 0 1px 0 #8fc0e2; }
  .tb.dim { opacity: .45; }
  .tb.glow { animation: glow 0.9s ease-in-out infinite; }
  @keyframes glow { 50% { box-shadow: 0 4px 0 #e0a800, 0 0 0 6px rgba(255, 214, 92, .75); transform: scale(1.06); } }
  .tb .cnt { font-size: 11px; opacity: .8; }
  body.land #bar { left: auto; right: 6px; top: 122px; bottom: auto; flex-direction: column; padding: 0; gap: 6px; }
  body.land .tb { width: 76px; height: 54px; flex: none; font-size: 13px; }
  body.land .tb svg { width: 24px; height: 24px; }
  @media (max-height: 360px) { body.land .tb { height: 46px; } body.land .tb svg { width: 20px; height: 20px; } }

  /* 回饋訊息（同一時間只有一則） */
  #msg { position: fixed; z-index: 60; left: 50%; top: 104px; transform: translate(-50%, 0); max-width: min(calc(100vw - 136px), 460px); width: max-content; padding: 8px 16px; border-radius: 16px; background: rgba(255, 255, 255, .95);
    color: #1f5f99; font-weight: 900; font-size: 16px; text-align: center; box-shadow: 0 4px 14px rgba(10, 40, 90, .25); pointer-events: none; opacity: 0; transition: opacity .25s, transform .25s; }
  #msg.on { opacity: 1; transform: translate(-50%, 4px); }
  #msg.bad { color: #c2410c; }
  #msg.good { color: #15803d; }
  body.land #msg { top: auto; bottom: 12px; left: 8px; transform: none; width: auto; max-width: calc(var(--lw, 160px) - 12px); font-size: 14px; padding: 7px 10px; }
  body.land #msg.on { transform: translate(0, 4px); }
  body.land.ed #msg { top: auto; bottom: 10px; left: 50%; transform: translate(-50%, 0); max-width: 50vw; }

  /* 編輯器 */
  #edTop { position: absolute; top: 62px; left: 8px; right: 8px; display: flex; justify-content: center; align-items: center; gap: 8px; flex-wrap: wrap; color: #1f5f99; font-weight: 900; }
  .stp { display: inline-flex; align-items: center; gap: 4px; background: rgba(255, 255, 255, .9); border-radius: 999px; padding: 3px 6px; box-shadow: 0 2px 6px rgba(10, 40, 90, .2); pointer-events: auto; }
  .stp button { width: 32px; height: 32px; border-radius: 50%; border: 0; background: #2b8fe6; color: #fff; font-size: 20px; font-weight: 900; line-height: 1; cursor: pointer; padding: 0; }
  .stp b { min-width: 18px; text-align: center; }
  #edInfo { position: absolute; top: 12px; left: 64px; right: 64px; text-align: center; color: #fff; font-weight: 900; font-size: 18px; text-shadow: 0 2px 3px rgba(10, 40, 90, .6); }
  #edInfo small { display: block; font-size: 13px; font-weight: 800; }
  #edPal { position: absolute; left: 0; right: 0; bottom: 64px; display: grid; grid-auto-flow: column; grid-template-rows: repeat(3, 42px); gap: 4px; padding: 6px 10px; overflow-x: auto;
    justify-content: start; pointer-events: auto; touch-action: pan-x; }
  @media (min-width: 330px) { #edPal { justify-content: center; } }
  .tool { width: 42px; height: 42px; border-radius: 12px; border: 2px solid transparent; background: rgba(255, 255, 255, .9); padding: 2px; cursor: pointer; box-shadow: 0 2px 5px rgba(10, 40, 90, .2); }
  .tool canvas { width: 34px; height: 34px; display: block; }
  .tool.on { border-color: #ff9f1a; background: #fff5d6; transform: scale(1.06); }
  #edAct { position: absolute; left: 0; right: 0; bottom: 0; display: flex; justify-content: center; gap: 6px; padding: 6px 8px calc(10px + env(safe-area-inset-bottom)); flex-wrap: nowrap; }
  #edAct .btn { padding: 9px 10px; font-size: 14px; }
  body.land #edTop { top: 66px; left: 8px; right: auto; width: 150px; flex-direction: column; align-items: stretch; }
  body.land #edInfo { left: 8px; right: auto; width: 156px; top: 152px; text-align: left; font-size: 14px; }
  body.land #edInfo small { font-size: 12px; }
  body.land #edPal { left: auto; right: 6px; top: 66px; bottom: 8px; grid-auto-flow: row; grid-template-rows: none; grid-template-columns: repeat(3, 38px); gap: 4px; align-content: start; padding: 0 4px; overflow-y: auto; overflow-x: hidden; touch-action: pan-y; }
  body.land .tool { width: 38px; height: 38px; }
  body.land .tool canvas { width: 30px; height: 30px; }
  body.land #edAct { right: auto; width: 166px; bottom: 0; flex-wrap: wrap; justify-content: flex-start; }
  body.land #edAct .btn { flex: 1 1 64px; padding: 7px 6px; font-size: 13px; }

  /* 遮罩卡片 */
  .ov { position: fixed; inset: 0; z-index: 200; display: flex; align-items: center; justify-content: center; padding: 64px 14px 14px; background: rgba(8, 28, 60, .5); }
  .ov.hidden { display: none; }
  .card { width: min(380px, 100%); max-height: 100%; overflow-y: auto; background: linear-gradient(#ffffff, #eaf7ff); border-radius: 26px; padding: 18px 18px 16px; text-align: center; color: #1f4f80;
    box-shadow: 0 8px 0 #9cc7e6, 0 18px 40px rgba(0, 20, 50, .35); animation: pop .35s cubic-bezier(.3, 1.6, .5, 1); }
  @keyframes pop { from { transform: scale(.6); opacity: 0; } }
  .card h2 { margin: 2px 0 8px; font-size: 26px; font-weight: 900; color: #1f6fb8; }
  .card p { margin: 6px 0; font-size: 16px; font-weight: 700; line-height: 1.5; }
  .card .acts { display: flex; flex-direction: column; gap: 10px; margin-top: 12px; align-items: stretch; }
  .card .acts .row { display: flex; gap: 10px; }
  .card .acts .row .btn { flex: 1; }
  .card canvas.mini { width: 100%; max-width: 300px; height: auto; display: block; margin: 4px auto; }
  .stars { display: flex; justify-content: center; gap: 6px; margin: 4px 0 6px; }
  .stars svg { width: 54px; height: 54px; transform: scale(0); }
  .stars svg.in { animation: starIn .45s cubic-bezier(.3, 1.8, .5, 1) forwards; }
  @keyframes starIn { to { transform: scale(1); } }
  .card .lines { font-size: 16px; font-weight: 800; color: #2a5d8f; }
  .card .lines div { margin: 3px 0; }
  .card .new { color: #d97706; font-weight: 900; }
  .card textarea { width: 100%; height: 76px; border-radius: 12px; border: 2px solid #9cc7e6; padding: 8px; font-size: 14px; font-family: monospace; resize: none; user-select: text; -webkit-user-select: text; }
  body.land .card { width: min(560px, 100%); padding: 12px 18px; }
  body.land .ov { padding: 10px 70px; }
  body.land .card h2 { font-size: 22px; margin-bottom: 4px; }
  body.land .card .acts { flex-direction: row; flex-wrap: wrap; justify-content: center; }
  body.land .card .acts > .btn { flex: 1 1 120px; }
  body.land .card .acts .row { flex: 1 1 100%; }
  body.land .stars svg { width: 44px; height: 44px; }
  body.land .card.intro { display: grid; grid-template-columns: 1fr 1fr; gap: 0 14px; align-items: center; text-align: left; }
  body.land .card.intro h2, body.land .card.intro .acts { grid-column: 1 / -1; text-align: center; }
</style>
</head>
<body>
<canvas id="cv" tabindex="0" aria-label="企鵝溜冰迷宮：滑動企鵝回到冰屋的益智遊戲"></canvas>

<div id="scr-title" class="scr">
  <div class="logo"><div class="l1">企鵝</div><div class="l2">溜冰迷宮</div></div>
  <div class="tagline">滑呀滑～撞到東西才會停，帶小企鵝回到冰屋！</div>
  <div class="tbtns">
    <button id="bPlay" class="btn big blue">開始冒險</button>
    <button id="bEdit" class="btn">關卡編輯器</button>
    <div class="row"><button id="tMusic" class="btn sm"></button><button id="tSfx" class="btn sm"></button></div>
  </div>
  <div class="tstars" id="tStars"></div>
</div>

<div id="scr-map" class="scr">
  <div class="hdr">世界地圖 <small id="mStars"></small></div>
  <div class="mlist" id="mList"></div>
  <div class="foot"><button id="bMapBack" class="btn">返回標題</button></div>
</div>

<div id="scr-levels" class="scr">
  <div class="hdr" id="lvHdr"></div>
  <div class="lgrid" id="lvGrid"></div>
  <div class="foot"><button id="bLvBack" class="btn">世界地圖</button></div>
</div>

<div id="scr-play" class="scr">
  <div id="hud"><div class="h1"><span id="hLv"></span><span class="nm" id="hName"></span></div>
    <div class="h2">步數 <b id="hMoves">0</b> / 目標 <b id="hPar">0</b><span id="hFish"></span></div></div>
  <button id="bPause" class="fab2" aria-label="暫停"><svg viewBox="0 0 24 24"><rect x="5" y="4" width="5" height="16" rx="2" fill="currentColor"/><rect x="14" y="4" width="5" height="16" rx="2" fill="currentColor"/></svg></button>
  <div id="bar">
    <button id="bUndo" class="tb"><svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><path d="M11 6 5 12l6 6"/><path d="M5 12h13a7 7 0 0 1 0 14h-4"/></svg><span>復原</span></button>
    <button id="bRestart" class="tb"><svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><path d="M25 16a9 9 0 1 1-3-6.7"/><path d="M23 4v6h-6"/></svg><span>重來</span></button>
    <button id="bHint" class="tb"><svg viewBox="0 0 32 32"><path d="M16 3a9 9 0 0 0-5 16.5V23h10v-3.5A9 9 0 0 0 16 3z" fill="#ffd65c" stroke="currentColor" stroke-width="2.6"/><rect x="11.5" y="25" width="9" height="3.4" rx="1.7" fill="currentColor"/></svg><span>提示</span></button>
    <button id="bSwitch" class="tb"><svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 11h18l-5-5"/><path d="M26 21H8l5 5"/></svg><span>換企鵝</span></button>
  </div>
</div>

<div id="scr-edit" class="scr">
  <div id="edInfo"></div>
  <div id="edTop">
    <span class="stp">寬<button id="eWm" aria-label="寬減一">−</button><b id="eWv">7</b><button id="eWp" aria-label="寬加一">+</button></span>
    <span class="stp">高<button id="eHm" aria-label="高減一">−</button><b id="eHv">7</b><button id="eHp" aria-label="高加一">+</button></span>
  </div>
  <div id="edPal"></div>
  <div id="edAct">
    <button id="eTry" class="btn green">試玩</button>
    <button id="eCheck" class="btn">檢查</button>
    <button id="eShare" class="btn">分享碼</button>
    <button id="eLoad" class="btn">讀取</button>
    <button id="eClear" class="btn">清空</button>
    <button id="eBack" class="btn">返回</button>
  </div>
</div>

<div id="msg" role="status" aria-live="polite"></div>
<div id="ov" class="ov hidden"><div class="card" id="ovCard"></div></div>

<script src="../../assets/common.js"></script>
<script src="../../assets/kg-music.js"></script>
<script id="core-src">
/*CORE-BEGIN*/
/* 規則核心：解析關卡、模擬一步、BFS 解題（遊戲、提示、編輯器、建置時驗證都用同一份） */
const Core = (function () {
  const DX = [0, 1, 0, -1], DY = [-1, 0, 1, 0]; // 0 上 1 右 2 下 3 左
  const ICE = 0, ROCK = 1, SNOW = 2, THIN = 3, WATER = 4, AU = 5, AL = 8, WARP = 9, GATE = 10, IGLOO = 11;
  const CH = { '.': ICE, '#': ROCK, '*': SNOW, 't': THIN, '~': WATER, '^': 5, '>': 6, 'v': 7, '<': 8, 'w': WARP, 'W': WARP, 'g': GATE, 'G': GATE, 'H': IGLOO };
  const VALID = '.#*t~^>v<wWgGHkKfPB';

  /** 關卡字串（每列用 / 分開）→ 關卡物件；格式錯誤時回傳 { error }。loose = 編輯中，數量不對也先畫出來 */
  function parse(code, loose) {
    const rows = String(code || '').trim().split('/');
    const h = rows.length, w = rows[0] ? rows[0].length : 0;
    if (w < (loose ? 1 : 3) || h < (loose ? 1 : 3) || w > 12 || h > 12) return { error: 'size' };
    const n = w * h;
    const L = { code: rows.join('/'), w, h, n, ter: new Int8Array(n), col: new Int8Array(n).fill(-1), partner: new Int16Array(n).fill(-1),
      mutIdx: new Int16Array(n).fill(-1), mut: [], fish: [], fishIdx: new Int16Array(n).fill(-1), keys: [-1, -1], peng: [], blocks: [], igloos: [] };

            return { dist: path.length, path, n: st.length };
          }
        }
      }
      if (st.length > max) return { big: true, n: st.length };
    }

  }

const Save = {
  get(k, d) { return KG.store.get(SLUG + ':' + k, d); },
  set(k, v) { KG.store.set(SLUG + ':' + k, v); }
};
let starsArr = Save.get('stars', []);
let bestArr = Save.get('best', []);
let seenFeat = Save.get('seen', {});
function cleared(i) { return (starsArr[i] || 0) > 0; }
function worldCleared(w) { let c = 0; for (let i = 0; i < PER; i++) if (cleared(w * PER + i)) c++; return c; }
function worldStars(w) { let s = 0; for (let i = 0; i < PER; i++) s += starsArr[w * PER + i] || 0; return s; }
function totalStars() { let s = 0; for (let i = 0; i < LEVELS.length; i++) s += starsArr[i] || 0; return s; }
const UNLOCK_NEED = 12;
function worldUnlocked(w) { return w === 0 || (worldUnlocked(w - 1) && worldCleared(w - 1) >= UNLOCK_NEED); }
function levelUnlocked(i) {
  const w = i / PER | 0, l = i % PER;
  if (!worldUnlocked(w)) return false;
  return l === 0 || cleared(i) || cleared(i - 1) || (l >= 2 && cleared(i - 2));
}

/* =====================================================================
 * 解題器（背景執行緒，算不完也不會卡畫面）
 * ===================================================================== */
let worker = null, solveSeq = 0;
const solveWait = new Map();
try {
  const src = $('#core-src').textContent + '\nself.onmessage=function(e){var d=e.data,r=null;try{var L=Core.parse(d.code);r=L.error?null:Core.solve(L,d.S,{fish:d.fish,max:d.max});}catch(x){r=null;}' +
    'self.postMessage({id:d.id,r:r?{dist:r.dist,path:r.path,big:!!r.big}:null});};';
  worker = new Worker(URL.createObjectURL(new Blob([src], { type: 'text/javascript' })));
  worker.onmessage = (e) => { const f = solveWait.get(e.data.id); if (f) { solveWait.delete(e.data.id); f(e.data.r); } };
  worker.onerror = (e) => { e.preventDefault(); worker = null; solveWait.forEach((f) => f(undefined)); solveWait.clear(); };
} catch (e) { worker = null; }
function solveAsync(code, S, fish, max) {
  const plain = { p: S.p.slice(), b: S.b.slice(), m: S.m.slice(), k: S.k, f: S.f };
  return new Promise((res) => {
    const syncRun = () => setTimeout(() => {
      const L = Core.parse(code);
      const r = L.error ? null : Core.solve(L, plain, { fish, max: max || 80000 });
      res(r ? { dist: r.dist, path: r.path, big: !!r.big } : null);
    }, 0);
    if (!worker) return syncRun();
    const id = ++solveSeq;
    solveWait.set(id, (r) => { if (r === undefined) syncRun(); else res(r); });
    worker.postMessage({ id, code, S: plain, fish, max: max || 80000 });
  });
}

 * ===================================================================== */
const cv = $('#cv'), ctx = cv.getContext('2d');
let W = 1, H = 1, dpr = 1, time = 0;
const THEMES = [
  { sky: ['#7fcbff', '#c9ecff', '#f2fbff'], mtn: ['#b4d9f1', '#93c2e4'], ice: ['#e6f7ff', '#bfe6fb'], aur: 0, stars: 0, sun: 1 },
  { sky: ['#6fb6e6', '#b9e1f7', '#ecf8ff'], mtn: ['#9fc9e6', '#7fb1d6'], ice: ['#ddf3ff', '#b0dbf5'], aur: 0, stars: 0, sun: 0.6 },
  { sky: ['#132a52', '#24508a', '#4f8fc4'], mtn: ['#1b3a66', '#28507f'], ice: ['#d5efff', '#9ccdf0'], aur: 0, stars: 0, cave: 1 },
  { sky: ['#283777', '#6c62b0', '#efb3cc'], mtn: ['#565a9a', '#7570b2'], ice: ['#e0f4ff', '#b5dcf5'], aur: 0.55, stars: 0.5 },
  { sky: ['#0b1a40', '#1b3870', '#3d68a1'], mtn: ['#18305e', '#22406f'], ice: ['#d6f1ff', '#a2d2f1'], aur: 1, stars: 1 },
  { sky: ['#070c2a', '#17265c', '#3a4e8e'], mtn: ['#121c48', '#1c2b5c'], ice: ['#daf3ff', '#a9d6f3'], aur: 1, stars: 1, pink: 1 }
];
function mkCanvas(w, h) { const c = document.createElement('canvas'); c.width = Math.max(1, Math.ceil(w)); c.height = Math.max(1, Math.ceil(h)); return c; }

/* ---------- 背景（快取） ---------- */
let bgCv = null, bgTheme = -1, bgW = 0, bgH = 0;
function buildBg(ti) {
  const th = THEMES[ti];
  bgCv = mkCanvas(W * dpr, H * dpr); bgTheme = ti; bgW = W; bgH = H;
  const g = bgCv.getContext('2d'); g.setTransform(dpr, 0, 0, dpr, 0, 0);
  const gr = g.createLinearGradient(0, 0, 0, H);
  gr.addColorStop(0, th.sky[0]); gr.addColorStop(0.55, th.sky[1]); gr.addColorStop(1, th.sky[2]);
  g.fillStyle = gr; g.fillRect(0, 0, W, H);
  if (th.stars) {
    for (let i = 0; i < 90; i++) {
      const x = hash(i * 7 + 1) * W, y = hash(i * 13 + 5) * H * 0.6, r = 0.5 + hash(i * 3 + 2) * 1.4;
      g.globalAlpha = th.stars * (0.35 + hash(i + 99) * 0.6); g.fillStyle = '#fff'; g.beginPath(); g.arc(x, y, r, 0, 7); g.fill();
    }
    g.globalAlpha = 1;
  }
  if (th.sun) {
    const sx = W * 0.8, sy = H * 0.2, sr = Math.min(W, H) * 0.07;
    const sg = g.createRadialGradient(sx, sy, sr * 0.2, sx, sy, sr * 3);
    sg.addColorStop(0, 'rgba(255,250,220,' + 0.9 * th.sun + ')'); sg.addColorStop(0.3, 'rgba(255,240,200,' + 0.3 * th.sun + ')'); sg.addColorStop(1, 'rgba(255,240,200,0)');
    g.fillStyle = sg; g.fillRect(sx - sr * 3, sy - sr * 3, sr * 6, sr * 6);
    g.fillStyle = 'rgba(255,253,235,' + th.sun + ')'; g.beginPath(); g.arc(sx, sy, sr * 0.7, 0, 7); g.fill();
  }
  // 遠山
  const layers = [[0.58, th.mtn[0], 11, 0.16], [0.7, th.mtn[1], 23, 0.12]];
  layers.forEach(([base, col, seed, amp], li) => {
    g.fillStyle = col; g.beginPath(); g.moveTo(0, H);
    const n = 9 + li * 3; const pts = [];
    for (let i = 0; i <= n; i++) {
      const x = i / n * W, y = H * base - (i % 2 ? hash(seed + i) * amp * H + amp * H * 0.3 : hash(seed + i * 3) * amp * H * 0.3);
      pts.push([x, y]); g.lineTo(x, y);
    }
    g.lineTo(W, H); g.closePath(); g.fill();
    // 山頂積雪
    g.fillStyle = th.cave ? 'rgba(160,210,255,0.35)' : 'rgba(255,255,255,0.8)';
    for (let i = 1; i < pts.length - 1; i++) {
      const [x, y] = pts[i]; if (pts[i - 1][1] < y || pts[i + 1][1] < y) continue;
      const lx = lerp(x, pts[i - 1][0], 0.28), ly = lerp(y, pts[i - 1][1], 0.28), rx = lerp(x, pts[i + 1][0], 0.28), ry = lerp(y, pts[i + 1][1], 0.28);
      g.beginPath(); g.moveTo(lx, ly); g.lineTo(x, y); g.lineTo(rx, ry); g.lineTo(lerp(x, rx, 0.5), lerp(y, ry, 0.65) + 4); g.lineTo(x, y + 6); g.lineTo(lerp(x, lx, 0.5), lerp(y, ly, 0.6) + 3); g.closePath(); g.fill();
    }
  });
  // 地面雪原
  const gg = g.createLinearGradient(0, H * 0.78, 0, H);
  gg.addColorStop(0, th.cave ? '#3f78ad' : '#f4fbff'); gg.addColorStop(1, th.cave ? '#2a5a8c' : '#d3ecfb');
  g.fillStyle = gg; g.beginPath(); g.moveTo(0, H * 0.8);
  for (let i = 0; i <= 8; i++) g.quadraticCurveTo((i - 0.5) / 8 * W, H * (0.78 + hash(i + 40) * 0.03), i / 8 * W, H * 0.8);
  g.lineTo(W, H); g.lineTo(0, H); g.closePath(); g.fill();
  if (th.cave) {
    // 冰柱和水晶
    for (let i = 0; i < 26; i++) {
      const x = i / 25 * W + (hash(i) - 0.5) * 20, len = 20 + hash(i + 7) * Math.min(90, H * 0.12), w = 8 + hash(i + 3) * 12;
      const ig = g.createLinearGradient(x, 0, x, len); ig.addColorStop(0, '#9fd6ff'); ig.addColorStop(1, 'rgba(190,235,255,0.2)');
      g.fillStyle = ig; g.beginPath(); g.moveTo(x - w / 2, 0); g.lineTo(x + w / 2, 0); g.lineTo(x, len); g.closePath(); g.fill();
    }
    for (let i = 0; i < 7; i++) {
      const x = hash(i + 70) * W, y = H * (0.82 + hash(i + 80) * 0.15), s = 10 + hash(i + 90) * 18;
      g.fillStyle = 'rgba(140,220,255,0.5)'; g.beginPath(); g.moveTo(x, y - s * 1.6); g.lineTo(x + s * 0.4, y); g.lineTo(x - s * 0.4, y); g.closePath(); g.fill();
    }
  }
}
function auroraY(i, k, t, H) { return Math.sin(i * 0.5 + t * 0.35 + k * 2) * H * 0.035 + Math.sin(i * 0.17 - t * 0.22 + k) * H * 0.05; }

  if (!amt) return;
  g.save(); g.globalCompositeOperation = 'lighter';
  const bands = [[0.1, '70,255,170'], [0.2, pink ? '255,110,210' : '110,190,255'], [0.05, '150,110,255']];
  bands.forEach(([yb, col], k) => {
    const y0 = H * yb, n = 20;
    g.beginPath();
    for (let i = 0; i <= n; i++) { const x = i / n * W, y = y0 + auroraY(i, k, t, H); if (i) g.lineTo(x, y); else g.moveTo(x, y); }
    for (let i = n; i >= 0; i--) { const x = i / n * W, y = y0 + auroraY(i, k, t, H) + H * 0.2 * (0.55 + 0.45 * Math.sin(i * 0.8 + t * 0.6 + k)); g.lineTo(x, y); }
    g.closePath();
    const gr = g.createLinearGradient(0, y0 - H * 0.05, 0, y0 + H * 0.26);
    gr.addColorStop(0, 'rgba(' + col + ',0)'); gr.addColorStop(0.3, 'rgba(' + col + ',' + (0.2 * amt).toFixed(3) + ')'); gr.addColorStop(1, 'rgba(' + col + ',0)');
    g.fillStyle = gr; g.fill();
  });
  g.restore();
}
/* 飄雪 */
const flakes = [];
for (let i = 0; i < 70; i++) flakes.push({ x: Math.random(), y: Math.random(), r: 0.8 + Math.random() * 2.4, sp: 0.02 + Math.random() * 0.05, ph: Math.random() * 6 });
function drawFlakes(g, dt, amt) {
  g.fillStyle = '#ffffff';
  const n = Math.round(flakes.length * (amt == null ? 1 : amt));
  for (let i = 0; i < n; i++) {
    const f = flakes[i];
    f.y += f.sp * dt * (0.6 + f.r * 0.25); f.x += Math.sin(time * 0.8 + f.ph) * 0.0006 * f.r;
    if (f.y > 1.02) { f.y = -0.02; f.x = Math.random(); }
    g.globalAlpha = 0.45 + f.r * 0.15;
    g.beginPath(); g.arc(f.x * W, f.y * H, f.r, 0, 7); g.fill();
  }
  g.globalAlpha = 1;
}
function drawBackground(ti, dt) {
  if (!bgCv || bgTheme !== ti || bgW !== W || bgH !== H) buildBg(ti);
  ctx.drawImage(bgCv, 0, 0, W, H);
  const th = THEMES[ti];
  drawAurora(ctx, th.aur, time, th.pink);
  if (th.stars) {
    for (let i = 0; i < 6; i++) {
      const a = 0.5 + 0.5 * Math.sin(time * 2 + i * 1.7);
      const x = hash(i * 31 + 3) * W, y = hash(i * 17 + 9) * H * 0.45, s = 2 + a * 3;
      ctx.globalAlpha = a * 0.9; ctx.fillStyle = '#fff';
      ctx.fillRect(x - s, y - 0.6, s * 2, 1.2); ctx.fillRect(x - 0.6, y - s, 1.2, s * 2);
    }
    ctx.globalAlpha = 1;
  }
}

/* ---------- 地形小圖 ---------- */
function drawRock(g, cx, cy, S, seed) {
  g.fillStyle = 'rgba(20,60,110,0.22)'; ell(g, cx, cy + S * 0.3, S * 0.4, S * 0.12); g.fill();
  const n = 8, pts = [];
  for (let i = 0; i < n; i++) { const a = i / n * Math.PI * 2, r = S * (0.36 + hash(seed * 9 + i) * 0.08); pts.push([cx + Math.cos(a) * r, cy + Math.sin(a) * r * 0.86 + S * 0.02]); }
  const gr = g.createLinearGradient(cx, cy - S * 0.4, cx, cy + S * 0.4);
  gr.addColorStop(0, '#a7b9d3'); gr.addColorStop(1, '#5c7194');
  g.fillStyle = gr; g.beginPath();
  for (let i = 0; i < n; i++) { const p = pts[i], q = pts[(i + 1) % n]; const mx = (p[0] + q[0]) / 2, my = (p[1] + q[1]) / 2; if (i) g.quadraticCurveTo(p[0], p[1], mx, my); else g.moveTo(mx, my); }
  g.quadraticCurveTo(pts[0][0], pts[0][1], (pts[0][0] + pts[1][0]) / 2, (pts[0][1] + pts[1][1]) / 2); g.closePath(); g.fill();
  g.strokeStyle = 'rgba(40,60,100,0.35)'; g.lineWidth = Math.max(1, S * 0.03); g.stroke();
  // 雪帽
  g.fillStyle = '#ffffff';
  ell(g, cx - S * 0.04, cy - S * 0.2, S * 0.27, S * 0.13, -0.15); g.fill();
  ell(g, cx + S * 0.12, cy - S * 0.16, S * 0.14, S * 0.09, 0.3); g.fill();
  g.fillStyle = 'rgba(255,255,255,0.35)'; ell(g, cx - S * 0.18, cy + S * 0.02, S * 0.06, S * 0.1, 0.4); g.fill();
}
function drawSnowPatch(g, x, y, S, seed) {
  const cx = x + S / 2, cy = y + S / 2;
  g.fillStyle = '#c9e3f4';
  for (let i = 0; i < 6; i++) { const a = i / 6 * Math.PI * 2 + seed; ell(g, cx + Math.cos(a) * S * 0.24, cy + Math.sin(a) * S * 0.22 + S * 0.04, S * 0.21, S * 0.18); g.fill(); }
  g.fillStyle = '#ffffff';
  for (let i = 0; i < 6; i++) { const a = i / 6 * Math.PI * 2 + seed; ell(g, cx + Math.cos(a) * S * 0.23, cy + Math.sin(a) * S * 0.21, S * 0.2, S * 0.17); g.fill(); }
  ell(g, cx, cy, S * 0.3, S * 0.26); g.fill();
  g.fillStyle = '#a9cbe4';
  for (let i = 0; i < 5; i++) { g.beginPath(); g.arc(x + S * (0.25 + hash(seed * 50 + i) * 0.5), y + S * (0.3 + hash(seed * 70 + i) * 0.45), S * 0.02, 0, 7); g.fill(); }
}
function crackLines(g, x, y, S, seed, n, alpha) {
  g.strokeStyle = 'rgba(90,150,200,' + alpha + ')'; g.lineWidth = Math.max(1, S * 0.022); g.lineCap = 'round';
  const cx = x + S * (0.35 + hash(seed) * 0.3), cy = y + S * (0.35 + hash(seed + 1) * 0.3);
  for (let i = 0; i < n; i++) {
    let a = hash(seed * 5 + i) * Math.PI * 2, px = cx, py = cy;
    g.beginPath(); g.moveTo(px, py);
    for (let k = 0; k < 3; k++) { a += (hash(seed + i * 7 + k) - 0.5) * 1.2; px += Math.cos(a) * S * 0.14; py += Math.sin(a) * S * 0.14; g.lineTo(clamp(px, x + 2, x + S - 2), clamp(py, y + 2, y + S - 2)); }

}
function drawThin(g, x, y, S, seed) {
  g.fillStyle = 'rgba(80,160,215,0.45)'; g.fillRect(x + 1, y + 1, S - 2, S - 2);
  g.fillStyle = 'rgba(235,250,255,0.6)'; rrect(g, x + S * 0.08, y + S * 0.08, S * 0.84, S * 0.84, S * 0.12); g.fill();
  g.strokeStyle = 'rgba(255,255,255,0.9)'; g.lineWidth = Math.max(1, S * 0.03); g.setLineDash([S * 0.08, S * 0.06]); rrect(g, x + S * 0.1, y + S * 0.1, S * 0.8, S * 0.8, S * 0.1); g.stroke(); g.setLineDash([]);

function drawWaterBase(g, x, y, S) {
  const gr = g.createLinearGradient(x, y, x, y + S);

  g.fillStyle = gr; g.fillRect(x, y, S, S);

}
function drawFilled(g, x, y, S) {
  g.fillStyle = 'rgba(150,205,240,0.55)'; rrect(g, x + S * 0.08, y + S * 0.08, S * 0.84, S * 0.84, S * 0.1); g.fill();
  g.strokeStyle = 'rgba(255,255,255,0.85)'; g.lineWidth = Math.max(1, S * 0.03); g.stroke();
  g.fillStyle = 'rgba(255,255,255,0.7)';
  [[0.3, 0.35, 0.05], [0.62, 0.55, 0.04], [0.45, 0.7, 0.03]].forEach(([a, b, r]) => { g.beginPath(); g.arc(x + S * a, y + S * b, S * r, 0, 7); g.fill(); });
}
function drawArrowDecal(g, cx, cy, S, dir, glow) {

  g.fillStyle = 'rgba(40,140,255,' + (0.18 + glow * 0.2) + ')'; ell(g, 0, 0, S * 0.42, S * 0.42); g.fill();

const WARP_COL = ['#a46bff', '#21c79a'];

  g.fillStyle = rg; ell(g, cx, cy, S * 0.4, S * 0.36); g.fill();

    for (let i = 0; i <= 10; i++) { const a = a0 + i * 0.22, r = S * (0.34 - i * 0.026); const x = cx + Math.cos(a) * r, y = cy + Math.sin(a) * r * 0.9; if (i) g.lineTo(x, y); else g.moveTo(x, y); }
    g.globalAlpha = 0.85; g.stroke();

function drawGatePosts(g, x, y, S, col) {

function drawKey(g, cx, cy, S, col, t) {

function drawBlock(g, cx, cy, S, sink) {

const parts = [];
const PMAX = 240;

    const a = (o.ang != null ? o.ang + (Math.random() - 0.5) * (o.spread || 1) : Math.random() * Math.PI * 2), sp = (o.speed || 100) * (0.4 + Math.random() * 0.8);
    spawn({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - (o.up || 0), g: o.g || 0, life: (o.life || 0.6) * (0.7 + Math.random() * 0.6), size: (o.size || 3) * (0.6 + Math.random() * 0.8),

}

// view: { L, D, x, y, S }；畫靜態地形到快取
function renderTerrain(g, L, D, ox, oy, S, ti) {
  const th = THEMES[ti], w = L.w, h = L.h, pad = S * 0.34;
  // 雪堆邊框
  g.fillStyle = 'rgba(20,60,110,0.25)'; rrect(g, ox - pad, oy - pad + S * 0.12, w * S + pad * 2, h * S + pad * 2, pad); g.fill();
  g.fillStyle = '#f7fcff'; rrect(g, ox - pad, oy - pad, w * S + pad * 2, h * S + pad * 2, pad); g.fill();
  g.fillStyle = '#ffffff';
  const per = Math.max(1, Math.round(S * 0.9));
  for (let x = ox - pad * 0.4; x < ox + w * S + pad * 0.4; x += per) { g.beginPath(); g.arc(x, oy - pad * 0.62, pad * 0.5, 0, 7); g.fill(); }

  g.fillStyle = gr; rrect(g, ox, oy, w * S, h * S, S * 0.1); g.fill();
  g.save(); rrect(g, ox, oy, w * S, h * S, S * 0.1); g.clip();

    g.strokeStyle = 'rgba(255,255,255,0.45)'; g.lineWidth = 1; g.strokeRect(px + 0.5, py + 0.5, S - 1, S - 1);
    if ((x + y) % 2) { g.fillStyle = 'rgba(255,255,255,0.12)'; g.fillRect(px, py, S, S); }
    if (hash(c + 7) < 0.4 && t === T.ICE) {

      g.beginPath(); g.moveTo(px + S * 0.32, py + S * 0.8); g.lineTo(px + S * 0.42, py + S * 0.7); g.stroke();
    }
    const mi = L.mutIdx[c];
    if (mi >= 0 && D.m[mi] === 2) { drawFilled(g, px, py, S); continue; }
    if (t === T.SNOW) drawSnowPatch(g, px, py, S, hash(c) * 6);

    else if (t === T.WATER) drawWaterBase(g, px, py, S);
    else if (t >= T.AU && t <= T.AL) drawArrowDecal(g, px + S / 2, py + S / 2, S, t - T.AU, 0);
    if (base === T.GATE) drawGatePosts(g, px, py, S, L.col[c]);

  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) { const c = y * w + x; if (L.ter[c] === T.ROCK) drawRock(g, ox + x * S + S / 2, oy + y * S + S / 2, S, c); }

/* ---------- 移動 ---------- */

/* ---------- 剩幾步（決定音樂要不要加層、偵測卡死） ---------- */

    if (ver !== G.ver || G.code !== code || scene !== 'play' || G.won) return;
    if (r === null) {
      G.dead = true; G.near = false; G.remain = null;
      setMsg('走不出去了！按「復原」回上一步，或按「重來」', 'bad', 4);
      $('#bUndo').classList.add('glow');

/* ---------- 提示、復原、重來、換企鵝 ---------- */

  if (anim) { if (anim.fail) return; skipAnim(); if (G.won) return; }
  const ver = G.ver, wantFish = G.L.fish.length > 0 && G.S.f !== G.L.allFish;
  setMsg('企鵝想一想…', '', 1.5);
  const go = (r) => {
    if (ver !== G.ver || scene !== 'play' || G.won || overlay) return;
    if (!r || r.big || !r.path.length) {
      SND.nope();
      setMsg(r === null ? '走不出去了！先按「復原」吧' : '太難算了，先換個方向試試看', 'bad', 3);
      if (r === null) $('#bUndo').classList.add('glow');

    }
    const [pi, d] = r.path[0];
    G.sel = pi; computeValid();
    const ev = [], mr = Core.move(G.L, G.S, pi, d, ev);
    const path = [G.S.p[pi]];
    for (const e of ev) if ((e.t === 'move' || e.t === 'warp') && e.who === 'p') path.push(e.t === 'warp' ? -1 - e.to : e.to);
    G.hint = { pi, d, t: 0, end: mr && mr.S ? mr.S.p[pi] : G.S.p[pi], path };
    G.hints++; SND.hint(); pv[pi].sq = 0.6;
    setMsg('提示：' + (G.L.peng.length > 1 ? SCARF_NAME[pi] + '企鵝' : '') + '往' + DIR_NAME[d] + '滑！', 'good', 4);
  };

/* ---------- 過關 ---------- */
function onWin() {

  const fishAll = G.S.f === G.L.allFish;
  let st;

  else st = fishAll ? 3 : 2;
  const R = { stars: st, moves: G.moves, par: G.par, fish: popcount(G.S.f), fishN: G.L.fish.length, best: null, newWorld: -1, prev: 0 };
  if (G.mode === 'level') {
    const before = WORLDS.map((w, i) => worldUnlocked(i));
    R.prev = starsArr[G.idx] || 0;
    if (st > R.prev) { starsArr[G.idx] = st; Save.set('stars', starsArr); }
    if (bestArr[G.idx] == null || G.moves < bestArr[G.idx]) { bestArr[G.idx] = G.moves; Save.set('best', bestArr); }
    R.best = bestArr[G.idx];
    WORLDS.forEach((w, i) => { if (!before[i] && worldUnlocked(i)) R.newWorld = i; });
  }
  G.result = R;
  if (KG.music) KG.music.stop(0.3);
  setTimeout(jingleWin, 160);
  setTimeout(() => SND.squeak(1.15), 650);
  setTimeout(() => SND.squeak(1.32), 1000);
  G.L.igloos.forEach((c) => burst(cellCX(c), cellCY(c) - BV.S * 0.3, 7, { speed: BV.S * 1.3, up: BV.S * 1.6, g: -BV.S * 0.4, life: 1.1, size: BV.S * 0.12, col: ['#ff6f91', '#ff9db5'], kind: 'heart', drag: 1.4 }));

/* ---------- 每格畫面 ---------- */
function update(dt) {

    v.blinkT -= dt; if (v.blinkT < 0) { v.blink = 0.12; v.blinkT = rand(2, 5); } v.blink = Math.max(0, v.blink - dt);

  for (let i = G.crackFx.length - 1; i >= 0; i--) { G.crackFx[i].t += dt; if (G.crackFx[i].t > 0.55) G.crackFx.splice(i, 1); }
  if (G.hint) G.hint.t += dt;
  if (G.won) G.wonT += dt;
  // 滑行時的雪花噴濺
  if (anim && anim.cur && anim.cur.t === 'move' && anim.cur.who === 'p' && Math.random() < 0.85) {
    const e = anim.cur, k = clamp(anim.t / anim.dur, 0, 1), S = BV.S;
    const x = lerp(cellCX(e.from), cellCX(e.to), k) - Core.DX[e.dir] * S * 0.35, y = lerp(cellCY(e.from), cellCY(e.to), k) - Core.DY[e.dir] * S * 0.35 + S * 0.15;
    spawn({ x: x + rand(-S, S) * 0.12, y: y + rand(-S, S) * 0.1, vx: -Core.DX[e.dir] * S * rand(0.5, 1.5) + rand(-S, S) * 0.4, vy: -Core.DY[e.dir] * S * rand(0.5, 1.5) - S * rand(0.2, 0.8), g: S * 3, life: rand(0.3, 0.5), size: S * rand(0.04, 0.08), col: '#ffffff' });
  }

}

  const ta = $('#shareTxt'); if (!ta) return;
  const text = ta.value + '\n' + shareLink(edCode());
  const ok = () => { SND.ui(); setMsg('複製好了！', 'good', 1.6); };
  const fallback = () => { try { ta.focus(); ta.select(); document.execCommand('copy'); ok(); } catch (e) { setMsg('請長按分享碼自己複製', '', 2.4); } };
  try { if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(ok, fallback); else fallback(); } catch (e) { fallback(); }
}
function edLoad() {
  openOverlay('load', '<h2>讀取分享碼</h2><p>把朋友給你的分享碼貼在下面</p><textarea id="loadTxt" placeholder="IS1-…"></textarea>' +
    '<div class="acts"><button class="btn big blue" data-a="doload">讀取</button><button class="btn" data-a="close">取消</button></div>');
  SND.ui();
  setTimeout(() => { const t = $('#loadTxt'); if (t) try { t.focus(); } catch (e) { /* 忽略 */ } }, 60);
}
function doLoadCode() {
  const code = decodeShare($('#loadTxt').value);
  if (!code) { SND.nope(); setMsg('這串分享碼看不懂耶', 'bad', 2); return; }
  hideOverlay(); edSetCode(code); edChanged(); SND.unlock(); setMsg('讀取成功！', 'good', 1.6);
}
function renderEdit(dt) {
  drawBackground(3, dt);
  if (!ED.L) return;
  if (G.termDirty || !terrCv || terrCv.edVer !== ED.ver) { buildTerrain(ED.L, ED.D, 0); terrCv.edVer = ED.ver; }
  ctx.drawImage(terrCv, BV.x - terrCv.pad, BV.y - terrCv.pad, terrCv.lw, terrCv.lh);
  drawDynamic(ctx, ED.L, ED.D, BV.x, BV.y, BV.S, time, false);
  // 格線提示
  ctx.strokeStyle = 'rgba(40,110,180,0.25)'; ctx.lineWidth = 1;
  for (let x = 1; x < ED.w; x++) { ctx.beginPath(); ctx.moveTo(BV.x + x * BV.S, BV.y); ctx.lineTo(BV.x + x * BV.S, BV.y + ED.h * BV.S); ctx.stroke(); }
  for (let y = 1; y < ED.h; y++) { ctx.beginPath(); ctx.moveTo(BV.x, BV.y + y * BV.S); ctx.lineTo(BV.x + ED.w * BV.S, BV.y + y * BV.S); ctx.stroke(); }
}

/* =====================================================================
 * 標題畫面的小動畫：企鵝在冰上滑來滑去
 * ===================================================================== */
const TS = { x: 0.2, from: 0.2, to: 0.2, st: 'stand', t: 0, face: 1, sq: 0 };
function renderTitle(dt) {
  drawBackground(4, dt);
  const S = clamp(Math.min(W, H) * 0.14, 44, 92), y = H - S * 0.95 - (isLand() ? 4 : 18);
  const x0 = W * 0.1, x1 = W * 0.9;
  // 冰道
  ctx.fillStyle = 'rgba(20,60,110,0.25)'; rrect(ctx, x0 - S * 0.3, y - S * 0.35, x1 - x0 + S * 0.6, S * 0.95, S * 0.4); ctx.fill();
  const gr = ctx.createLinearGradient(0, y - S * 0.4, 0, y + S * 0.5); gr.addColorStop(0, '#f2fbff'); gr.addColorStop(1, '#b9e2fa');
  ctx.fillStyle = gr; rrect(ctx, x0 - S * 0.3, y - S * 0.42, x1 - x0 + S * 0.6, S * 0.9, S * 0.4); ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,0.8)'; ctx.lineWidth = 2;
  for (let i = 0; i < 6; i++) { const sx = lerp(x0, x1, hash(i + 5)); ctx.beginPath(); ctx.moveTo(sx, y + S * 0.2); ctx.lineTo(sx + S * 0.3, y - S * 0.05); ctx.stroke(); }
  const ig = x1 - S * 0.1;
  drawRock(ctx, x0 + S * 0.05, y, S * 0.9, 4);
  drawFish(ctx, lerp(x0, x1, 0.55), y + S * 0.05, S * 0.8, time, 1);
  drawIgloo(ctx, ig, y - S * 0.05, S * 1.2, false, time);
  // 企鵝狀態機
  TS.t += dt; TS.sq = Math.max(0, TS.sq - dt * 4);
  const left = x0 + S * 0.8, right = ig - S * 1.1;
  if (TS.st === 'stand' && TS.t > 1.8) { TS.st = 'slide'; TS.t = 0; TS.from = TS.x; TS.to = TS.x < 0.5 ? 1 : 0; TS.face = TS.to > TS.from ? 1 : 3; }
  if (TS.st === 'slide') {
    const k = clamp(TS.t / 1.3, 0, 1), e = k * k * (3 - 2 * k);
    TS.x = lerp(TS.from, TS.to, e);
    if (k >= 1) { TS.st = 'stand'; TS.t = 0; TS.sq = 1; burst(lerp(left, right, TS.x), y + S * 0.3, 8, { speed: S * 1.5, g: S * 4, up: S, life: 0.5, size: S * 0.06, col: '#fff' }); }
    else if (Math.random() < 0.7) spawn({ x: lerp(left, right, TS.x) - (TS.face === 1 ? 1 : -1) * S * 0.35, y: y + S * 0.2, vx: (TS.face === 1 ? -1 : 1) * S * rand(0.5, 1.5), vy: -S * rand(0.2, 0.8), g: S * 3, life: 0.4, size: S * 0.05, col: '#fff' });
  }
  const px = lerp(left, right, TS.x);
  drawPenguin(ctx, px, y - S * 0.12, S, { pose: TS.st === 'slide' ? 'slide' : 'stand', face: TS.st === 'slide' ? TS.face : 2, t: time, scarf: SCARF[0], sq: TS.sq });
  updateParts(dt); drawParts(ctx);
}

/* =====================================================================
 * 主迴圈、尺寸
 * ===================================================================== */
function resize() {
  const r = cv.getBoundingClientRect();
  W = Math.max(1, r.width || innerWidth); H = Math.max(1, r.height || innerHeight);
  dpr = window.devicePixelRatio || 1;
  cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
  document.body.classList.toggle('land', isLand()); document.body.classList.toggle('port', !isLand());
  document.body.style.setProperty('--lw', leftW() + 'px');
  if (scene === 'edit' && ED.L) layoutBoard(ED.L); else layoutBoard();
  G.termDirty = true;
}
window.addEventListener('resize', resize);
window.addEventListener('orientationchange', () => setTimeout(resize, 120));
if (window.visualViewport) window.visualViewport.addEventListener('resize', resize);

let lastT = performance.now(), windT = 0;
function frame(now) {
  const dt = Math.min(0.05, Math.max(0, (now - lastT) / 1000)); lastT = now; time += dt;
  update(dt);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  if (scene === 'play' && G.L) renderPlay(dt);
  else if (scene === 'edit') renderEdit(dt);
  else if (scene === 'title') renderTitle(dt);
  else { drawBackground(scene === 'levels' ? WORLDS[curWorld].theme : 5, dt); updateParts(dt); }
  drawFlakes(ctx, dt, scene === 'play' ? 0.6 : 1);
  windT -= dt;
  if (windT <= 0) { windT = 0.4; updateWind(overlay === 'pause' ? 0 : scene === 'play' ? 0.02 : 0.03); }
  requestAnimationFrame(frame);
}

/* 按鈕 */
const onClick = (sel, fn) => $(sel).addEventListener('click', fn);
onClick('#bPlay', () => { SND.ui(); goMap(); });
onClick('#bEdit', () => { SND.ui(); goEdit(); });
onClick('#tMusic', toggleMusic);
onClick('#tSfx', toggleSfx);
onClick('#bMapBack', () => { SND.back(); goTitle(); });
onClick('#bLvBack', () => { SND.back(); goMap(); });
onClick('#bPause', () => pauseGame());
onClick('#bUndo', () => doUndo());
onClick('#bRestart', () => doRestart());
onClick('#bHint', () => doHint());
onClick('#bSwitch', () => { if (scene === 'play' && !overlay && !G.won) selectNext(false, 1); });
onClick('#eWm', () => edResize(-1, 0)); onClick('#eWp', () => edResize(1, 0));
onClick('#eHm', () => edResize(0, -1)); onClick('#eHp', () => edResize(0, 1));
onClick('#eTry', edTry);
onClick('#eCheck', () => { SND.ui(); edVerify(); });
onClick('#eShare', edShare);
onClick('#eLoad', edLoad);
onClick('#eClear', () => { edDefault(); SND.restart(); edChanged(); });
onClick('#eBack', () => { SND.back(); goTitle(); });

/* 測試用掛鉤 */
window.__ice = {
  state: () => ({ scene, overlay, world: curWorld, idx: G.idx, mode: G.mode, moves: G.moves, par: G.par, won: G.won, sel: G.sel, anim: !!anim, near: G.near, dead: G.dead, remain: G.remain,
    music: KG.music ? KG.music.isPlaying() : null, p: G.S ? G.S.p.slice() : null, f: G.S ? G.S.f : 0, board: { x: BV.x, y: BV.y, S: BV.S, w: G.L ? G.L.w : 0, h: G.L ? G.L.h : 0 },
    hint: G.hint ? { pi: G.hint.pi, d: G.hint.d } : null, msg: $('#msg').classList.contains('on') ? $('#msg').textContent : '' }),
  start: (i) => { startLevel(i); return true; },
  closeIntro: () => { introQueue = []; if (overlay === 'intro') hideOverlay(); },
  fast: (k) => { fast = k || 1; },
  solution: (fish) => { const r = Core.solve(G.L, G.S, { fish: fish !== false }); return r ? r.path : null; },
  cell: (c) => ({ x: cellCX(c), y: cellCY(c) }),
  skip: () => skipAnim(),
  edCode: () => edCode(),
  levels: LEVELS, Core
};

/* 開始 */
resize();
if (!Save.get('edit', null)) edDefault();
goTitle();
(function hashLevel() {
  const m = /#lv=([\w\-]+)/.exec(location.hash || '');
  if (!m) return;
  const code = decodeShare(m[1]);
  if (code) { ED.g = null; Save.set('edit', code); goEdit(); setMsg('收到朋友的關卡！按「試玩」玩玩看', 'good', 3.5); }
})();
requestAnimationFrame(frame);

</script>
</body>
