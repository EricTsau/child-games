<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>小小科學實驗室</title>
<link rel="stylesheet" href="../../assets/common.css">
<style>
  :root { --ink: #2d3a58; --paper: #fffdf5; --line: #d9e6f5; --acc: #ff8a3d; }
  html, body { height: 100%; overflow: hidden; background: #d7f1ff; overscroll-behavior: none; -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
  body { font-family: "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", "Heiti TC", system-ui, sans-serif; color: var(--ink); }
  #cv { position: fixed; inset: 0; display: block; width: 100vw; height: 100vh; height: 100dvh; touch-action: none; z-index: 1; }
  .scr { position: fixed; inset: 0; z-index: 10; display: none; pointer-events: none; }
  .scr.on { display: block; }
  .scr .pe { pointer-events: auto; }
  button { font-family: inherit; color: inherit; -webkit-user-select: none; user-select: none; touch-action: manipulation; }
  .b {
    border: none; border-radius: 16px; padding: 10px 16px; font-size: 17px; font-weight: 800; cursor: pointer;
    background: linear-gradient(180deg, #ffffff 0%, #eef4ff 100%); color: var(--ink);
    box-shadow: 0 4px 0 #b7c6dd, 0 8px 14px rgba(45, 58, 88, 0.16); transition: transform .08s, box-shadow .08s, filter .15s;
    min-height: 44px; line-height: 1.15;
  }
  .b:active { transform: translateY(3px); box-shadow: 0 1px 0 #b7c6dd, 0 3px 6px rgba(45, 58, 88, 0.16); }
  .b.g { background: linear-gradient(180deg, #8ae6a0 0%, #34b765 100%); color: #fff; box-shadow: 0 4px 0 #23864a, 0 8px 14px rgba(35, 134, 74, .3); text-shadow: 0 2px 0 rgba(0,0,0,.15); }
  .b.bl { background: linear-gradient(180deg, #8fd3ff 0%, #3796e6 100%); color: #fff; box-shadow: 0 4px 0 #2468a8, 0 8px 14px rgba(36, 104, 168, .3); text-shadow: 0 2px 0 rgba(0,0,0,.15); }
  .b.o { background: linear-gradient(180deg, #ffc27a 0%, #ff8a3d 100%); color: #fff; box-shadow: 0 4px 0 #c75d16, 0 8px 14px rgba(199, 93, 22, .3); text-shadow: 0 2px 0 rgba(0,0,0,.15); }
  .b.p { background: linear-gradient(180deg, #d6b8ff 0%, #9a6cf0 100%); color: #fff; box-shadow: 0 4px 0 #6b45b5, 0 8px 14px rgba(107, 69, 181, .3); text-shadow: 0 2px 0 rgba(0,0,0,.15); }
  .b.sel { background: linear-gradient(180deg, #fff3c4 0%, #ffd65c 100%); box-shadow: 0 4px 0 #c99a1c, 0 8px 14px rgba(201, 154, 28, .25); }
  .b.off { filter: grayscale(.85) opacity(.55); }
  .b[disabled] { filter: grayscale(.9) opacity(.45); cursor: default; }
  .b.big { font-size: 22px; padding: 14px 26px; border-radius: 22px; min-width: 200px; }
  .b.sm { font-size: 15px; padding: 8px 12px; min-height: 40px; border-radius: 13px; }
  .b.glow { animation: glow 1.1s ease-in-out infinite; }
  @keyframes glow { 0%,100% { filter: brightness(1); transform: scale(1); } 50% { filter: brightness(1.12); transform: scale(1.04); } }

  /* 標題 */
  #title .tc { position: absolute; left: 0; right: 0; top: 0; bottom: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; padding: 64px 16px 16px; }
  .logo { margin: 0; font-size: clamp(34px, 9vw, 64px); font-weight: 900; letter-spacing: 2px; line-height: 1.1; text-align: center; white-space: nowrap; }
  .logo span { display: inline-block; color: #fff; -webkit-text-stroke: 0; text-shadow: 0 3px 0 var(--c), 0 -3px 0 var(--c), 3px 0 0 var(--c), -3px 0 0 var(--c), 2px 2px 0 var(--c), -2px -2px 0 var(--c), 2px -2px 0 var(--c), -2px 2px 0 var(--c), 0 7px 0 rgba(30, 50, 90, .25); animation: bob 2.4s ease-in-out infinite; }
  @keyframes bob { 0%,100% { transform: translateY(0) rotate(0); } 50% { transform: translateY(-6px) rotate(-2deg); } }
  .tsub { font-size: clamp(15px, 4vw, 20px); font-weight: 800; color: #3f557d; background: rgba(255,255,255,.75); padding: 6px 14px; border-radius: 999px; }
  .tstar { font-size: 18px; font-weight: 900; color: #b37a00; background: #fff6d6; padding: 4px 14px; border-radius: 999px; box-shadow: 0 3px 0 #e8cf84; }
  .tbtns { display: flex; gap: 14px; flex-wrap: wrap; justify-content: center; margin-top: 6px; }
  .tgl { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
  .star { color: #ffc21a; text-shadow: 0 2px 0 #c98a00; }
  .star.no { color: #d5dce8; text-shadow: 0 2px 0 #b5bfcf; }

  /* 一般頁面（選實驗、筆記本） */
  .page { position: absolute; inset: 0; display: flex; flex-direction: column; }
  .shead { flex: 0 0 auto; height: 64px; display: flex; align-items: center; justify-content: center; padding: 0 66px; gap: 10px; position: relative; }
  .shead h2 { margin: 0; font-size: clamp(20px, 5.5vw, 28px); font-weight: 900; color: #fff; text-shadow: 0 3px 0 #2f6db5, 0 -2px 0 #2f6db5, 2px 0 0 #2f6db5, -2px 0 0 #2f6db5; white-space: nowrap; }
  .sbody { flex: 1 1 auto; overflow-y: auto; overflow-x: hidden; -webkit-overflow-scrolling: touch; padding: 6px 14px 12px; touch-action: pan-y; }
  .sfoot { flex: 0 0 auto; display: flex; gap: 10px; justify-content: center; padding: 10px 14px calc(12px + env(safe-area-inset-bottom)); }
  .grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; max-width: 1000px; margin: 0 auto; }
  @media (min-aspect-ratio: 5/4) { .grid { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
  .card8 { background: #fff; border-radius: 20px; padding: 8px 8px 10px; box-shadow: 0 5px 0 rgba(45, 58, 88, .14), 0 10px 20px rgba(45, 58, 88, .12); border: 3px solid #fff; cursor: pointer; text-align: center; position: relative; transition: transform .1s; display: flex; flex-direction: column; align-items: center; gap: 2px; }
  .card8:active { transform: scale(.97); }
  .card8 canvas { width: 100%; aspect-ratio: 4 / 3; border-radius: 14px; display: block; }
  .card8 .nm { font-size: 18px; font-weight: 900; margin-top: 4px; }
  .card8 .ds { font-size: 13px; color: #6a7896; font-weight: 700; min-height: 2.4em; line-height: 1.2; }
  .card8 .st { font-size: 18px; letter-spacing: 2px; }
  .card8 .tag { position: absolute; top: 12px; right: 12px; background: #34b765; color: #fff; font-size: 12px; font-weight: 900; padding: 2px 8px; border-radius: 999px; }
  .card8 .num { position: absolute; top: 12px; left: 12px; background: rgba(255,255,255,.9); color: var(--ink); font-size: 13px; font-weight: 900; width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; }

  /* 筆記本 */
  #note .page { background: transparent; }
  .nbook { max-width: 760px; margin: 0 auto; background: var(--paper); border-radius: 18px; box-shadow: 0 6px 0 rgba(120, 90, 40, .18), 0 12px 26px rgba(80, 60, 30, .18); padding: 14px 14px 14px 34px; position: relative;
    background-image: repeating-linear-gradient(180deg, transparent 0 31px, #dfe9f7 31px 32px); }
  .nbook::before { content: ''; position: absolute; left: 22px; top: 0; bottom: 0; width: 2px; background: #ffb3b3; }
  .nsum { font-size: 17px; font-weight: 900; text-align: center; margin: 0 0 10px; }
  .nent { display: grid; grid-template-columns: 72px 1fr; gap: 10px; padding: 10px 0; border-bottom: 2px dashed #e5d9c3; align-items: start; }
  .nent:last-child { border-bottom: none; }
  .nent canvas { width: 72px; height: 54px; border-radius: 10px; }
  .nent h3 { margin: 0; font-size: 18px; font-weight: 900; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .nent p { margin: 4px 0; font-size: 15px; line-height: 1.45; font-weight: 600; }
  .nent .meta { font-size: 13px; color: #7a6a52; font-weight: 700; }
  .nent .acts { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 6px; }
  .nent.todo { opacity: .7; }
  .stamp { display: inline-block; border: 3px solid #e2574c; color: #e2574c; font-size: 13px; font-weight: 900; padding: 0 6px; border-radius: 8px; transform: rotate(-6deg); }

  /* 實驗畫面 */
  #hud { z-index: 3; pointer-events: none; position: absolute; top: 8px; left: 66px; right: 66px; height: 50px; display: flex; align-items: center; justify-content: center; }
  #hud .hn { background: rgba(255,255,255,.92); border-radius: 999px; padding: 6px 16px; font-size: 18px; font-weight: 900; box-shadow: 0 4px 0 rgba(45,58,88,.13); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
  #pauseBtn { z-index: 4; position: absolute; right: 12px; top: 62px; width: 44px; height: 44px; border-radius: 50%; border: 3px solid #fff; background: linear-gradient(180deg, #fff, #e8f0ff); box-shadow: 0 4px 0 rgba(45,58,88,.18); cursor: pointer; display: grid; place-items: center; padding: 0; }
  #pauseBtn i { display: block; width: 14px; height: 16px; border-left: 5px solid var(--ink); border-right: 5px solid var(--ink); box-sizing: border-box; }
  #panel { position: absolute; background: rgba(255, 255, 255, .96); display: flex; flex-direction: column; box-shadow: 0 -4px 18px rgba(45,58,88,.16); }
  #panel.bottom { left: 0; right: 0; bottom: 0; border-radius: 22px 22px 0 0; }
  #panel.side { right: 0; top: 0; bottom: 0; border-radius: 22px 0 0 22px; box-shadow: -4px 0 18px rgba(45,58,88,.16); }
  .ph { flex: 0 0 auto; display: flex; align-items: center; gap: 8px; padding: 10px 12px 4px 14px; }
  #panel.side .ph { padding: 62px 62px 4px 14px; min-height: 106px; }
  @media (max-height: 520px) { #stepTxt { font-size: 16px; line-height: 1.4; } #panel .b.sm { min-height: 38px; padding: 6px 10px; } .pfoot { padding-top: 6px; padding-bottom: 8px; } }
  .ph .lbl { font-size: 15px; font-weight: 900; color: #fff; background: var(--ec, #3796e6); padding: 3px 10px; border-radius: 999px; white-space: nowrap; }
  .dots { display: flex; gap: 5px; flex: 1 1 auto; }
  .dots i { width: 11px; height: 11px; border-radius: 50%; background: #dbe4f2; display: block; }
  .dots i.d { background: #34b765; }
  .dots i.c { background: var(--ec, #3796e6); box-shadow: 0 0 0 3px rgba(55,150,230,.25); }
  .ic { border: none; background: #eef4ff; border-radius: 12px; width: 44px; height: 40px; font-size: 20px; cursor: pointer; flex: 0 0 auto; box-shadow: 0 3px 0 #c6d3e8; }
  .pbody { flex: 1 1 auto; overflow-y: auto; overflow-x: hidden; padding: 4px 14px 8px; -webkit-overflow-scrolling: touch; touch-action: pan-y; }
  #stepTxt { font-size: 18px; font-weight: 800; line-height: 1.45; margin: 2px 0 8px; }
  #feedback { min-height: 0; font-size: 16px; font-weight: 800; border-radius: 12px; padding: 0 10px; margin: 0 0 8px; max-height: 0; overflow: hidden; transition: max-height .25s, padding .25s; }
  #feedback.on { max-height: 120px; padding: 8px 10px; }
  #feedback.ok { background: #e2f8e8; color: #1f7a42; }
  #feedback.info { background: #fff3dc; color: #8a5a00; }
  #ctrls { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 8px; align-items: center; }
  .seg { display: flex; gap: 6px; flex-wrap: wrap; width: 100%; }
  .seg .b { flex: 1 1 0; min-width: 0; padding-left: 6px; padding-right: 6px; }
  .rng { width: 100%; display: flex; align-items: center; gap: 10px; font-size: 16px; font-weight: 800; }
  .rng span { white-space: nowrap; min-width: 7.5em; }
  .rng input { flex: 1 1 auto; min-width: 0; height: 36px; accent-color: #ff8a3d; touch-action: pan-x; }
  #results { font-size: 15px; font-weight: 700; line-height: 1.5; }
  #results .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  #results .chip { background: #f1f5fb; border-radius: 10px; padding: 3px 8px; white-space: nowrap; }
  #results .chip.y { background: #def6e6; color: #1f7a42; }
  #results .chip.n { background: #ffe8de; color: #b4471a; }
  #results .chip.u { color: #8d99b2; }
  #results .rt { font-size: 14px; color: #6a7896; margin-bottom: 4px; font-weight: 800; }
  .pfoot { flex: 0 0 auto; display: flex; gap: 10px; padding: 8px 12px calc(10px + env(safe-area-inset-bottom)); border-top: 2px solid #eef2f8; }
  .pfoot .b { flex: 1 1 0; }

  /* 卡片（猜猜看、結論、測驗、暫停） */
  .modal { position: fixed; inset: 0; z-index: 9000; display: none; align-items: center; justify-content: center; padding: 62px 12px 10px; background: rgba(30, 45, 80, .42); }
  .modal.on { display: flex; }
  .card { width: min(560px, 100%); max-height: 100%; background: var(--paper); border-radius: 24px; box-shadow: 0 8px 0 rgba(30,45,80,.2), 0 18px 40px rgba(30,45,80,.3); display: flex; flex-direction: column; overflow: hidden; animation: pop .32s cubic-bezier(.2, 1.5, .4, 1); border: 4px solid #fff; }
  @keyframes pop { 0% { transform: scale(.7); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
  .chead { flex: 0 0 auto; padding: 12px 16px 8px; display: flex; align-items: center; gap: 10px; background: var(--hc, #3796e6); color: #fff; }
  .chead h3 { margin: 0; font-size: 21px; font-weight: 900; flex: 1 1 auto; text-shadow: 0 2px 0 rgba(0,0,0,.15); }
  .chead .ic { background: rgba(255,255,255,.25); box-shadow: none; color: #fff; }
  .cbody { flex: 1 1 auto; overflow-y: auto; padding: 12px 16px; -webkit-overflow-scrolling: touch; touch-action: pan-y; }
  .cfoot { flex: 0 0 auto; padding: 10px 14px 12px; display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; border-top: 2px solid #efe7d6; }
  .cfoot .b { flex: 1 1 140px; }
  .q { font-size: 20px; font-weight: 900; line-height: 1.45; margin: 2px 0 12px; }
  .opts { display: flex; flex-direction: column; gap: 10px; }
  .opts .b { text-align: left; font-size: 18px; padding: 12px 14px; display: flex; gap: 10px; align-items: center; }
  .opts .b .k { flex: 0 0 auto; width: 30px; height: 30px; border-radius: 50%; background: #e3ecfa; display: grid; place-items: center; font-size: 16px; }
  .opts .b.right { background: linear-gradient(180deg, #b9f2c8, #6fd690); box-shadow: 0 4px 0 #3ea862; }
  .opts .b.wrong { background: linear-gradient(180deg, #ffd3c4, #ff9f80); box-shadow: 0 4px 0 #d66a47; }
  .why { margin-top: 12px; padding: 10px 12px; border-radius: 14px; font-size: 16px; font-weight: 700; line-height: 1.5; background: #eef6ff; }
  .why.ok { background: #e2f8e8; }
  .why.no { background: #fff0e8; }
  .pts { margin: 6px 0 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 8px; }
  .pts li { font-size: 17px; line-height: 1.5; font-weight: 700; padding: 8px 10px 8px 34px; background: #fff; border-radius: 12px; position: relative; box-shadow: 0 2px 0 #efe5cf; }
  .pts li::before { content: ''; position: absolute; left: 12px; top: 15px; width: 12px; height: 12px; border-radius: 50%; background: var(--hc, #3796e6); }
  .guess { font-size: 16px; font-weight: 800; padding: 10px 12px; border-radius: 14px; background: #fff6d6; margin-bottom: 6px; line-height: 1.45; }
  .bigst { font-size: 50px; text-align: center; letter-spacing: 6px; margin: 4px 0; }
  .bigst span { display: inline-block; animation: pop .4s cubic-bezier(.2, 1.6, .4, 1) both; }
  .ctr { text-align: center; font-size: 18px; font-weight: 800; line-height: 1.5; }
  .pgrid { display: flex; flex-direction: column; gap: 10px; }
  .pgrid .row { display: flex; gap: 10px; }
  .pgrid .row .b { flex: 1 1 0; }
  .cicon { width: 120px; height: 90px; display: block; margin: 0 auto 8px; }
</style>
</head>
<body>
<canvas id="cv" aria-label="小小科學實驗室"></canvas>

<div id="title" class="scr">
  <div class="tc">
    <h1 class="logo pe" id="logo"></h1>
    <div class="tsub">動手做實驗，發現科學的小祕密！</div>
    <div class="tstar" id="tStars"></div>
    <div class="tbtns">
      <button class="b g big pe" id="bStart">開始做實驗</button>
      <button class="b bl big pe" id="bNote">實驗筆記本</button>
    </div>
    <div class="tgl">
      <button class="b sm pe" id="tMus"></button>
      <button class="b sm pe" id="tSfx"></button>
      <button class="b sm pe" id="tVoi"></button>
    </div>
  </div>
</div>

<div id="lab" class="scr">
  <div class="page">
    <div class="shead"><h2>選一個實驗</h2></div>
    <div class="sbody pe"><div class="grid" id="labGrid"></div></div>
    <div class="sfoot"><button class="b sm pe" id="labBack">回標題</button><button class="b bl pe" id="labNote">實驗筆記本</button></div>
  </div>
</div>

<div id="note" class="scr">
  <div class="page">
    <div class="shead"><h2>我的實驗筆記本</h2></div>
    <div class="sbody pe"><div class="nbook" id="nbook"></div></div>
    <div class="sfoot"><button class="b sm pe" id="noteTitle">回標題</button><button class="b g pe" id="noteLab">去實驗室</button></div>
  </div>
</div>

<div id="exp" class="scr">
  <div id="hud"><div class="hn" id="hudName"></div></div>
  <button id="pauseBtn" class="pe" aria-label="暫停"><i></i></button>
  <div id="panel" class="pe bottom">
    <div class="ph"><span class="lbl" id="stepLbl"></span><div class="dots" id="dots"></div><button class="ic" id="sayBtn" aria-label="再聽一次">🔈</button></div>
    <div class="pbody">
      <div id="stepTxt"></div>
      <div id="feedback"></div>
      <div id="ctrls"></div>
      <div id="results"></div>
    </div>
    <div class="pfoot"><button class="b sm" id="hintBtn">提示</button><button class="b o" id="conclBtn" disabled>看結論</button></div>
  </div>
</div>

<div id="modal" class="modal"><div class="card" id="card"><div class="chead" id="chead"></div><div class="cbody" id="cbody"></div><div class="cfoot" id="cfoot"></div></div></div>

<script src="../../assets/common.js"></script>
<script src="../../assets/kg-music.js"></script>
<script>
'use strict';
/* =====================================================================
 * 小小科學實驗室：8 個動手做的科學實驗（猜猜看 → 實驗步驟 → 結論卡 → 小測驗）
 * ===================================================================== */
(function () {
const SLUG = 'science-lab';
const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
const FONT = '"PingFang TC","Noto Sans TC","Microsoft JhengHei","Heiti TC",system-ui,sans-serif';
const TAU = Math.PI * 2;
const VW = 600, VH = 480;
let W = 360, H = 640, dpr = 1, time = 0;
const $ = (id) => document.getElementById(id);
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const lerp = (a, b, t) => a + (b - a) * t;
const rand = (a, b) => a + Math.random() * (b - a);
const dist = (ax, ay, bx, by) => Math.hypot(ax - bx, ay - by);
const ease = { out: t => 1 - Math.pow(1 - t, 3), back: t => { const c = 1.70158; return 1 + (c + 1) * Math.pow(t - 1, 3) + c * Math.pow(t - 1, 2); }, inout: t => -(Math.cos(Math.PI * t) - 1) / 2 };
function esc(s) { return String(s).replace(/[&<>"]/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[ch])); }

/* ---------- 存檔 ---------- */
const Save = {
  get(k, d) { return KG.store.get(SLUG + ':' + k, d); },
  set(k, v) { KG.store.set(SLUG + ':' + k, v); }
};
let book = Save.get('book', {}) || {};
function rec(id) { if (!book[id]) book[id] = { done: false, stars: 0, guess: -1, right: false, quiz: 0 }; return book[id]; }
function saveBook() { Save.set('book', book); }
function totalStars() { let n = 0; for (const k in book) n += book[k].stars || 0; return n; }

/* ---------- 聲音 ---------- */
let sfxOn = Save.get('sfx', true) !== false;
let voiceOn = Save.get('voice', true) !== false;
const lastSfx = {};
const vary = (k) => 1 + (Math.random() * 2 - 1) * (k == null ? 0.045 : k);
function sfx(name, o, gap) {
  if (!sfxOn || !KG.sfx || paused) return;
  const now = performance.now();
  if (lastSfx[name] && now - lastSfx[name] < (gap || 40)) return;
  lastSfx[name] = now;
  o = Object.assign({}, o || {});
  if (o.pitch == null) o.pitch = vary();
  try { KG.sfx.play(name, o); } catch (e) { /* 忽略 */ }
}
function uiSfx(name, o) { const p = paused; paused = false; sfx(name, o); paused = p; }
const panX = (vx) => clamp((vx / VW) * 2 - 1, -1, 1) * 0.6;

if (KG.sfx) {
  const S = KG.sfx;
  S.define('plop', (p, s) => {   // 東西掉進水裡：p 越小越低沉（東西越大）
    s.noise(0.32, { vol: 0.2, freq: 1300 * p, sweep: 300, q: 0.7 });
    s.tone(520 * p, 0.12, { vol: 0.16, slide: 170 * p, delay: 0.01 });
    s.tone(760 * p, 0.07, { vol: 0.06, slide: 1500 * p, delay: 0.13 });
  });
  S.define('bigsplash', (p, s) => {
    s.noise(0.55, { vol: 0.24, freq: 900 * p, sweep: 220, q: 0.6, type: 'lowpass' });
    s.noise(0.3, { vol: 0.12, freq: 2600 * p, sweep: 900, q: 0.8 });

const PMAX = KG.lowEnd ? 220 : 380;

function spawn(o) {

      return p;
    }
  }

}

    p.life += dt;

    p.vy += p.g * dt;
    if (p.drag) { const k = Math.exp(-p.drag * dt); p.vx *= k; p.vy *= k; }
    p.x += p.vx * dt; p.y += p.vy * dt; p.rot += dt * 3;
    if (p.y > p.floor) { p.on = false; }
  }
}

    if (!p.on) continue;
    const k = p.life / p.max, a = k < 0.7 ? 1 : 1 - (k - 0.7) / 0.3;
    c.globalAlpha = a;
    if (p.kind === 'spark') {

    } else if (p.kind === 'bubble') {

      c.fillStyle = 'rgba(255,255,255,0.5)'; circle(c, p.x - p.size * 0.35, p.y - p.size * 0.35, p.size * 0.3); c.fill();
    } else if (p.kind === 'ring') {

  cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
  layoutPanel();
}
function layoutPanel() {
  const P = $('panel'), hud = $('hud');
  const side = W > H * 1.15;
  panelMode = side ? 'side' : 'bottom';
  P.className = 'pe ' + panelMode;
  if (side) {
    const pw = Math.round(clamp(W * 0.34, 270, 400));
    P.style.width = pw + 'px'; P.style.height = '';
    hud.style.left = (W - pw + 8) + 'px'; hud.style.right = '64px'; hud.style.justifyContent = 'flex-start';
    stage.x = 0; stage.y = 0; stage.w = W - pw; stage.h = H;
  } else {
    const s0 = Math.min(W / VW, 1.6);
    const ph = Math.round(clamp(H - 70 - VH * s0 - 16, 230, H * 0.5));
    P.style.height = ph + 'px'; P.style.width = '';
    hud.style.left = '66px'; hud.style.right = '66px'; hud.style.justifyContent = 'center';
    stage.x = 0; stage.y = 62; stage.w = W; stage.h = H - ph - 62;
  }
  const s = Math.min(stage.w / VW, stage.h / VH);
  view.s = s; view.ox = stage.x + (stage.w - VW * s) / 2; view.oy = stage.y + (stage.h - VH * s) / 2;

}
function toV(e) {
  const r = cv.getBoundingClientRect();
  const sx = (e.clientX - r.left) * (W / r.width), sy = (e.clientY - r.top) * (H / r.height);
  return { x: (sx - view.ox) / view.s, y: (sy - view.oy) / view.s };
}

    c.save(); c.translate(left + 110 * u, by); c.scale(u, u);
    c.fillStyle = 'rgba(255,140,180,0.85)'; c.beginPath(); c.arc(0, -36, 28, 0.15 * Math.PI, 0.85 * Math.PI); c.closePath(); c.fill();
    c.strokeStyle = '#fff'; c.lineWidth = 4; c.beginPath(); c.arc(0, -36, 30, -0.38 * Math.PI, 1.38 * Math.PI); c.moveTo(-11, -64); c.lineTo(-11, -96); c.moveTo(11, -64); c.lineTo(11, -96); c.stroke();
    c.restore();
  }
  // 試管架
  c.save(); c.translate(right, by); c.scale(u, u);
  c.fillStyle = '#b07a44'; rr(c, -50, -36, 100, 12, 4); c.fill(); c.fillRect(-46, -36, 6, 36); c.fillRect(40, -36, 6, 36);
  ['#ffd23f', '#6fc4ff', '#ff8a3d'].forEach((col, k) => { const x = -26 + k * 26, lv = 0.4 + 0.15 * Math.sin(time * 1.5 + k); c.fillStyle = col; rr(c, x - 7, -70 + (1 - lv) * 50, 14, lv * 50 + 4, 6); c.fill(); c.strokeStyle = '#fff'; c.lineWidth = 3; rr(c, x - 8, -96, 16, 80, 7); c.stroke(); });
  c.restore();
  drawMascot(c, right - 150 * u, by - 52 * u * 0.9, u * 0.9);
}

/* =====================================================================
 * 主迴圈
 * ===================================================================== */
let lastT = performance.now();
function frame(now) {
  let dt = (now - lastT) / 1000; lastT = now;
  if (!(dt > 0)) dt = 0; if (dt > 0.05) dt = 0.05;
  time += dt;
  if (scene === 'exp' && RUN) {
    if (!paused && RUN.phase === 'do') {
      RUN.exp.update(RUN.S, dt); updateParts(dt); updateLabels(dt); updateTimers(dt);
      const st = RUN.exp.steps[RUN.step];
      RUN.stepT += dt; RUN.idleT += dt;
      if (RUN.hintT > 0) RUN.hintT -= dt;
      if (!RUN.stepDone && !RUN.allDone) {
        if (RUN.idleT > 20 && st.hint && st.hint(RUN.S)) { RUN.hintT = 4; RUN.idleT = 0; }
        if (st.check(RUN.S)) completeStep();
      }
      RUN.resT -= dt; if (RUN.resT <= 0) { RUN.resT = 0.2; refreshResults(); }
    }
  } else updateTitleFx(dt);
  draw();
  requestAnimationFrame(frame);
}
function draw() {
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  if (scene === 'exp' && RUN) {
    ctx.fillStyle = '#d7f1ff'; ctx.fillRect(0, 0, W, H);
    ctx.setTransform(dpr * view.s, 0, 0, dpr * view.s, dpr * view.ox, dpr * view.oy);
    ctx.lineCap = 'butt'; ctx.lineJoin = 'miter';
    RUN.exp.draw(RUN.S, ctx);
    drawLabels(ctx); drawHint(ctx);
  } else drawTitleBg(scene);
}

$('logo').innerHTML = '小小科學實驗室'.split('').map((ch, i) => '<span style="--c:' + ['#ff6b8a', '#ff9f43', '#f5c400', '#34b765', '#2f9be0', '#7b61ff', '#e8503a'][i] + ';animation-delay:' + (i * 0.12) + 's">' + ch + '</span>').join('');
$('bStart').addEventListener('click', () => { uiSfx('select'); goLab(); });
$('bNote').addEventListener('click', () => { uiSfx('page'); goNote(); });
$('tMus').addEventListener('click', toggleMusic);
$('tSfx').addEventListener('click', toggleSfx);
$('tVoi').addEventListener('click', toggleVoice);
$('labBack').addEventListener('click', () => { uiSfx('back'); goTitle(); });
$('labNote').addEventListener('click', () => { uiSfx('page'); goNote(); });
$('noteTitle').addEventListener('click', () => { uiSfx('back'); goTitle(); });
$('noteLab').addEventListener('click', () => { uiSfx('select'); goLab(); });
$('pauseBtn').addEventListener('click', () => pauseGame());
$('sayBtn').addEventListener('click', () => { if (!RUN) return; uiSfx('ui'); const st = RUN.exp.steps[RUN.step]; speak(RUN.allDone ? '實驗完成了！按看結論。' : (st.say || st.t)); });
$('hintBtn').addEventListener('click', () => {
  if (!RUN || RUN.phase !== 'do' || paused) return;
  uiSfx('ui'); RUN.idleT = 0;
  if (RUN.allDone) { setFeedback('按「看結論」看看你發現了什麼！', 'info'); return; }
  const st = RUN.exp.steps[RUN.step], h = st.hint && st.hint(RUN.S);
  RUN.hintT = 4;
  setFeedback(st.tip || (h ? '看看橘色箭頭指的地方！' : '照著上面的說明試試看！'), 'info');
});
$('conclBtn').addEventListener('click', () => { if (!RUN || !RUN.allDone || paused) return; showConcl(RUN.exp, false); });

function onResize() { resize(); }
window.addEventListener('resize', onResize);
window.addEventListener('orientationchange', () => setTimeout(onResize, 120));
if (window.visualViewport) window.visualViewport.addEventListener('resize', onResize);
resize();
goTitle();
requestAnimationFrame(frame);

/* 測試用 */
window.__sl = {
  get scene() { return scene; }, get run() { return RUN; }, get paused() { return paused; }, book: () => book,
  start: (id) => startExp(id), begin: () => { if (RUN && RUN.phase === 'predict') { RUN.guess = 0; beginDo(); } },
  skip: () => { if (RUN && RUN.phase === 'do' && !RUN.stepDone) completeStep(); },
  view: () => ({ W, H, stage: Object.assign({}, stage), view: Object.assign({}, view), panelMode }),
  toScreen: (x, y) => ({ x: view.ox + x * view.s, y: view.oy + y * view.s }),
  music: () => (KG.music ? KG.music.isPlaying() : null), exps: () => EXPS.map(e => e.id), step: () => (RUN ? RUN.step : -1)
};
})();
