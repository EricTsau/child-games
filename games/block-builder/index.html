<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>積木小城市</title>
<link rel="stylesheet" href="../../assets/common.css">
<style>
  html, body { height: 100%; overflow: hidden; background: #9fdcff; }
  #gl { position: fixed; inset: 0; width: 100vw; height: 100vh; height: 100dvh; display: block; touch-action: none; outline: none; }
  #msg { position: fixed; inset: 0; display: grid; place-items: center; padding: 24px; text-align: center; font-size: 20px; font-weight: 800; color: #2b5a7a; }
  .hide { display: none !important; }
  .panel { background: rgba(255, 255, 255, 0.9); border: 3px solid #fff; border-radius: 20px; box-shadow: 0 5px 0 rgba(40, 70, 110, 0.16), 0 10px 22px rgba(40, 70, 110, 0.18); }
  .tb { width: 48px; height: 48px; border-radius: 16px; border: 3px solid #fff; background: linear-gradient(180deg, #fff 0%, #e9f5ff 100%);
    box-shadow: 0 5px 0 rgba(40, 70, 110, 0.18), 0 8px 18px rgba(40, 70, 110, 0.18); font-size: 22px; line-height: 1; display: grid; place-items: center;
    cursor: pointer; color: var(--kg-ink); padding: 0; font-family: var(--kg-font); transition: transform 0.1s ease, opacity 0.2s; }
  .tb:active { transform: scale(0.9); }
  .tb:disabled { opacity: 0.4; }
  .ui { position: fixed; z-index: 50; }

  #side { top: 68px; right: 10px; display: flex; flex-direction: column; gap: 8px; }
  #side .tb { border-radius: 50%; }
  #dock { left: 0; right: 0; bottom: 0; display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 0 6px calc(8px + env(safe-area-inset-bottom)); pointer-events: none; }
  #dock > * { pointer-events: auto; }
  #modes { display: flex; gap: 4px; padding: 4px; }
  .mode { display: flex; flex-direction: column; align-items: center; justify-content: center; min-width: 56px; height: 50px; border-radius: 14px; border: 0;
    background: transparent; font: 800 12px var(--kg-font); color: var(--kg-ink); gap: 2px; cursor: pointer; padding: 0 4px; transition: transform 0.1s; }
  .mode .ic { font-size: 20px; line-height: 1; }
  .mode.on { background: linear-gradient(180deg, #ffe58a 0%, #f5b82e 100%); box-shadow: inset 0 -3px 0 rgba(0, 0, 0, 0.12); }
  .mode:active { transform: scale(0.92); }
  #shapes { display: flex; gap: 4px; padding: 4px; overflow-x: auto; max-width: min(100%, 940px); scrollbar-width: none; touch-action: pan-x; }
  #shapes::-webkit-scrollbar { display: none; }
  .shp { flex: 0 0 auto; width: 58px; height: 62px; border-radius: 14px; border: 3px solid transparent; background: #fff; display: flex; flex-direction: column;
    align-items: center; justify-content: flex-start; padding: 0; font: 800 11px var(--kg-font); color: var(--kg-ink); cursor: pointer; transition: transform 0.12s; }
  .shp img { width: 44px; height: 44px; margin-top: 1px; pointer-events: none; }
  .shp.on { border-color: #ff8fb1; box-shadow: 0 3px 0 #ffc2d4; transform: translateY(-2px); }
  #colors { display: grid; grid-template-columns: repeat(16, 30px); gap: 6px; padding: 6px 8px; }
  .sw { width: 30px; height: 30px; border-radius: 50%; border: 3px solid #fff; box-shadow: 0 2px 0 rgba(0, 0, 0, 0.2); cursor: pointer; padding: 0; transition: transform 0.12s; }
  .sw.on { transform: scale(1.2); box-shadow: 0 0 0 3px #4a3b52; }
  @media (max-width: 640px) { #colors { grid-template-columns: repeat(8, 32px); gap: 6px 8px; } .sw { width: 32px; height: 32px; } }
  @media (max-width: 360px) { #colors { grid-template-columns: repeat(8, 28px); gap: 5px 6px; } .sw { width: 28px; height: 28px; }
    .mode { min-width: 50px; } .tb { width: 42px; height: 42px; font-size: 19px; } #top { gap: 5px; } }
  @media (orientation: landscape) and (max-height: 560px) {
    #dock { display: contents; }
    #modes { position: fixed; z-index: 50; bottom: calc(6px + env(safe-area-inset-bottom)); left: 50%; transform: translateX(-50%); }
    #shapes { position: fixed; z-index: 50; left: calc(8px + env(safe-area-inset-left)); top: 66px; bottom: 8px; max-width: none; display: grid; grid-template-columns: repeat(3, 48px);
      grid-auto-rows: 54px; overflow-y: auto; overflow-x: hidden; align-content: start; touch-action: pan-y; }
    .shp { width: 48px; height: 54px; font-size: 10px; } .shp img { width: 36px; height: 36px; }
    #colors { position: fixed; z-index: 50; right: calc(8px + env(safe-area-inset-right)); top: 124px; grid-template-columns: repeat(4, 28px); gap: 7px; }
    .sw { width: 28px; height: 28px; }

  }
  /* 跟著蓋的步驟面板 */
  #guide { top: 66px; left: 50%; transform: translateX(-50%); width: min(94vw, 440px); padding: 8px 10px; display: flex; flex-direction: column; gap: 6px; }
  @media (max-width: 640px) { #guide { left: calc(8px + env(safe-area-inset-left)); right: 64px; width: auto; transform: none; } }
  #shapes.more { -webkit-mask-image: linear-gradient(90deg, #000 calc(100% - 46px), rgba(0,0,0,.15)); mask-image: linear-gradient(90deg, #000 calc(100% - 46px), rgba(0,0,0,.15)); }
  #shapes.more.vert { -webkit-mask-image: linear-gradient(180deg, #000 calc(100% - 40px), rgba(0,0,0,.15)); mask-image: linear-gradient(180deg, #000 calc(100% - 40px), rgba(0,0,0,.15)); }
  .gtop { display: flex; align-items: center; gap: 8px; font-weight: 800; }
  .gtop b { font-size: 18px; }
  .gtop span { font-size: 14px; color: #6a5a75; flex: 1; }
  .gx { width: 34px; height: 34px; border-radius: 50%; border: 0; background: #ffe1ea; font-size: 16px; cursor: pointer; color: var(--kg-ink); }
  .gbar { height: 8px; border-radius: 99px; background: #e6eef7; overflow: hidden; }
  .gbar i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, #7bd88f, #46b864); border-radius: 99px; transition: width 0.3s; }
  .grow { display: flex; align-items: center; gap: 6px; }
  .gneed { display: flex; gap: 4px; flex: 1; overflow: hidden; flex-wrap: nowrap; min-width: 0; }
  .chip { display: flex; align-items: center; gap: 2px; background: #fff; border: 2px solid #e6eef7; border-radius: 12px; padding: 0 6px 0 2px; font: 800 13px var(--kg-font); cursor: pointer; }
  .chip img { width: 30px; height: 30px; }
  .chip i { width: 12px; height: 12px; border-radius: 50%; display: inline-block; border: 2px solid #fff; box-shadow: 0 0 0 1px #ccd; }
  .gauto { border: 0; border-radius: 999px; padding: 8px 12px; font: 800 14px var(--kg-font); color: #6b4a00; background: linear-gradient(180deg, #ffe58a, #f5b82e); box-shadow: 0 3px 0 #c48a12; cursor: pointer; white-space: nowrap; }
  .gauto:active { transform: translateY(2px); box-shadow: 0 1px 0 #c48a12; }
  /* 長按吸色的圓圈 */
  #ring { position: fixed; z-index: 60; width: 64px; height: 64px; margin: -32px 0 0 -32px; border-radius: 50%; pointer-events: none; display: none;

  #ring.go { display: block; animation: ringgo 0.55s linear forwards; }
  @keyframes ringgo { from { transform: scale(1.6); opacity: 0.2; } to { transform: scale(0.8); opacity: 1; } }

  .slot img { width: 88px; height: 66px; border-radius: 10px; background: #dff1ff; object-fit: cover; flex: 0 0 auto; }

    #title .card { width: min(640px, 100%); }

    #guide .gbar { grid-column: 1 / -1; order: 3; height: 6px; }
    .gtop b { font-size: 16px; } .gtop span { font-size: 12px; }
    .chip img { width: 24px; height: 24px; } .gauto { padding: 6px 10px; font-size: 13px; }

</style>

<body>
<div id="msg">積木小城市 載入中…</div>
<canvas id="gl" tabindex="0" aria-label="積木小城市 建造畫面"></canvas>

<div id="top" class="ui">
  <button class="tb" id="bUndo" title="復原 (Z)" aria-label="復原">↶</button>
  <button class="tb" id="bRedo" title="重做 (Y)" aria-label="重做">↷</button>
  <button class="tb" id="bNight" title="白天/晚上 (N)" aria-label="白天晚上切換">🌙</button>
  <button class="tb" id="bCam" title="重設視角 (C)" aria-label="重設視角">🎯</button>
</div>
<div id="side" class="ui">
  <button class="tb" id="bMenu" title="選單 (Esc)" aria-label="選單">☰</button>
</div>
<div id="guide" class="ui panel hide">
  <div class="gtop"><b id="gName">小房子</b><span id="gStep">第 1 / 5 步</span><button class="gx" id="gExit" aria-label="離開跟著蓋">✕</button></div>
  <div class="gbar"><i id="gFill"></i></div>
  <div class="grow"><div class="gneed" id="gNeed"></div><button class="gauto" id="gAuto">✨ 幫我蓋</button></div>
</div>
<div id="coach" class="ui panel hide"></div>
<div id="dock" class="ui">
  <div id="modes" class="panel">
    <button class="mode on" data-mode="build"><span class="ic">🧱</span>放置</button>
    <button class="mode" data-mode="erase"><span class="ic">🧽</span>擦除</button>
    <button class="mode" data-mode="paint"><span class="ic">🖌️</span>上色</button>
    <button class="mode" data-mode="pick"><span class="ic">💧</span>吸色</button>
    <button class="mode" id="bRot"><span class="ic">🔄</span>轉向</button>
  </div>
  <div id="shapes" class="panel"></div>
  <div id="colors" class="panel"></div>
</div>
<div id="ring"></div>

<div id="title" class="ov show"><div class="card">
  <div class="logo" id="logo"></div>
  <p>蓋房子、燈塔、城堡和火箭，<br>打造屬於你的小島城市！</p>
  <div class="grid2">
    <button class="kg-btn green" data-act="free">🧱 自由建造</button>
    <button class="kg-btn" data-act="tpl">📐 跟著蓋</button>
    <button class="kg-btn blue" data-act="town">🏘️ 隨機小鎮</button>
    <button class="kg-btn yellow" data-act="saves">📁 我的作品</button>
  </div>
  <div class="stat">完成挑戰 <b id="tDone">0</b> / <b id="tAll">8</b>　⭐ <b id="tStars">0</b></div>
</div></div>

<div id="menu" class="ov menu"><div class="card">
  <button class="x" data-close>✕</button>
  <h2>休息一下</h2>
  <p id="mInfo">小島上有 0 塊積木</p>
  <div class="grid2">
    <button class="kg-btn green" data-act="resume">▶️ 繼續建造</button>
    <button class="kg-btn yellow" data-act="save">💾 存成作品</button>
    <button class="kg-btn blue" data-act="saves">📁 我的作品</button>
    <button class="kg-btn" data-act="tpl">📐 跟著蓋</button>
    <button class="kg-btn blue" data-act="town">🏘️ 隨機小鎮</button>
    <button class="kg-btn green" data-act="photo">📷 拍照下載</button>
    <button class="kg-btn yellow" data-act="share">🔗 分享碼</button>
    <button class="kg-btn" data-act="clear">🧹 清空小島</button>
    <button class="kg-btn blue" data-act="home">🏝️ 回標題</button>
  </div>
</div></div>

<div id="tpl" class="ov"><div class="card wide">
  <button class="x" data-close>✕</button>
  <h2>跟著蓋</h2>
  <p>一層一層照著發亮的藍圖蓋，點藍圖附近就會自動對準！</p>
  <div class="tgrid" id="tGrid"></div>
</div></div>

<div id="saves" class="ov"><div class="card wide">
  <button class="x" data-close>✕</button>
  <h2>我的作品</h2>
  <div class="acts" style="margin-top:0"><button class="kg-btn green" data-act="save">💾 存目前的小島</button><button class="kg-btn yellow" data-act="share">🔗 分享碼</button></div>
  <div class="slist" id="sList"></div>
</div></div>

<div id="share" class="ov"><div class="card">
  <button class="x" data-close>✕</button>
  <h2>分享碼</h2>
  <p>把這串文字傳給朋友，或貼上朋友的分享碼再按「匯入」。</p>
  <textarea id="shareTxt" spellcheck="false" aria-label="分享碼"></textarea>
  <div class="acts"><button class="kg-btn blue" id="shCopy">📋 複製</button><button class="kg-btn green" id="shImport">📥 匯入</button></div>
</div></div>

<div id="confirm" class="ov"><div class="card">
  <h2 id="cfTitle">確定嗎？</h2>
  <p id="cfMsg"></p>
  <div class="acts"><button class="kg-btn blue" id="cfNo">取消</button><button class="kg-btn green" id="cfYes">好</button></div>
</div></div>

<div id="done" class="ov"><div class="card">
  <div class="bigstars" id="dStars"></div>
  <h2 id="dTitle">完成了！</h2>
  <p id="dMsg"></p>
  <div class="acts">
    <button class="kg-btn green" id="dFree">🧱 繼續自由建造</button>
    <button class="kg-btn yellow" id="dAgain">🔁 再蓋一次</button>
    <button class="kg-btn blue" id="dMore">📐 挑別的</button>
  </div>
</div></div>

<script src="../../assets/common.js"></script>
<script type="module">
import * as THREE from 'three';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';

const $ = id => document.getElementById(id);
let renderer = null;
try {
  renderer = new THREE.WebGLRenderer({ canvas: $('gl'), antialias: true, powerPreference: 'high-performance' });
} catch (e) { renderer = null; }
if (!renderer) $('msg').textContent = '這個遊戲需要支援 3D（WebGL）的瀏覽器，請換一個瀏覽器或裝置再試試看。';
else main();

function main() {
  const cv = $('gl');
  const N = 32, HM = 40, MAXB = 20000, HISTMAX = 100;
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const lerp = (a, b, t) => a + (b - a) * t;
  const TAU = Math.PI * 2;
  const SKEY = 'block-builder:';

  /* =========================================================
   * 顏色（16 種友善顏色）
   * ========================================================= */
  const COLORS = [
    ['#e8464a', '紅色'], ['#ff8a3a', '橘色'], ['#ffd23f', '黃色'], ['#a3e05a', '淺綠'],
    ['#3dbb5c', '綠色'], ['#2ec4b6', '青色'], ['#5bc0f0', '天藍'], ['#3a74d8', '藍色'],
    ['#8e66d8', '紫色'], ['#ff7eb6', '粉紅'], ['#a0643c', '咖啡'], ['#ecc79e', '米色'],
    ['#f7f5f0', '白色'], ['#b8bec8', '淺灰'], ['#5a606c', '深灰'], ['#2a2c33', '黑色']
  ];
  const COL3 = COLORS.map(c => new THREE.Color(c[0]));

  /* =========================================================
   * 積木形狀（全部用基本幾何拼出來）
   * ========================================================= */
  const geoN = (g) => g.index ? g.toNonIndexed() : g;
  function merge(list) {
    let n = 0;
    const parts = list.map(g => { const q = geoN(g); n += q.attributes.position.count; return q; });
    const pos = new Float32Array(n * 3), nor = new Float32Array(n * 3);
    let o = 0;
    for (const g of parts) {
      pos.set(g.attributes.position.array, o * 3);
      nor.set(g.attributes.normal.array, o * 3);
      o += g.attributes.position.count;
    }
    const out = new THREE.BufferGeometry();
    out.setAttribute('position', new THREE.BufferAttribute(pos, 3));
    out.setAttribute('normal', new THREE.BufferAttribute(nor, 3));
    out.computeBoundingSphere();
    return out;
  }
  // 倒角方塊：44 個三角形（圓角盒要 108 個），積木多的時候省很多
  function chamferBox(w, h, d, r) {
    const H = [w / 2, h / 2, d / 2];
    r = Math.min(r, H[0] * 0.9, H[1] * 0.9, H[2] * 0.9);
    const P = (ax, s) => { const v = [0, 0, 0]; for (let i = 0; i < 3; i++) v[i] = s[i] * (i === ax ? H[i] : H[i] - r); return v; };
    const pos = [], nor = [];
    const tri = (a, b, c) => {
      const u = [b[0] - a[0], b[1] - a[1], b[2] - a[2]], v = [c[0] - a[0], c[1] - a[1], c[2] - a[2]];
      let n = [u[1] * v[2] - u[2] * v[1], u[2] * v[0] - u[0] * v[2], u[0] * v[1] - u[1] * v[0]];

  function pick(sx, sy) {
    const ray = screenRay(sx, sy);

      const gx = ray.origin.x + ray.direction.x * t + N / 2, gz = ray.origin.z + ray.direction.z * t + N / 2;

  function mulberry(seed) {
    return function () { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };

  function makeTown(seed) {
    const rnd = mulberry(seed == null ? (Math.random() * 1e9) | 0 : seed);
    const ri = (a, b) => a + Math.floor(rnd() * (b - a + 1));
    const pk = a => a[Math.floor(rnd() * a.length)];
    const P = TB();
    const roads = [10, 21];
    const isRoad = v => roads.includes(v) || roads.includes(v - 1);
    for (const r of roads) { P.paintRect(0, r, N - 1, r + 1, C.dgray); P.paintRect(r, 0, r + 1, N - 1, C.dgray); }
    for (const r of roads) for (let i = 1; i < N; i += 3) { if (!isRoad(i)) { P.ground.push([i, r, C.white]); P.ground.push([r, i, C.white]); } }
    const lots = [[0, 9], [12, 20], [23, 31]];
    const wallCols = [C.red, C.yellow, C.white, C.sky, C.pink, C.orange, C.tan, C.lime, C.teal];
    const roofCols = [C.red, C.brown, C.blue, C.dgray, C.green, C.purple];
    for (const [x0, x1] of lots) for (const [z0, z1] of lots) {
      const kind = rnd();
      const facing = z1 < 10 ? 'S' : z0 > 22 ? 'N' : (rnd() < 0.5 ? 'S' : 'N');
      if (kind < 0.42) {
        const w = ri(4, Math.min(6, x1 - x0 - 1)), d = ri(4, Math.min(5, z1 - z0 - 1));
        const hx = x0 + 1 + ri(0, x1 - x0 - 1 - w), hz = z0 + 1 + ri(0, z1 - z0 - 1 - d);
        const hx1 = hx + w - 1, hz1 = hz + d - 1;
        const wc = pk(wallCols), rc = pk(roofCols), h = ri(2, 3);
        const fz = facing === 'S' ? hz1 : hz;
        const dx = hx + ((w / 2) | 0);
        P.p(T.DOOR, dx, 0, fz, pk([C.brown, C.blue, C.red, C.green]), facing === 'S' ? 0 : 2);
        for (let x = hx + 1; x < hx1; x++) if (x !== dx && rnd() < 0.6) P.p(T.WIN, x, 1, fz, C.white, 0);
        for (let x = hx + 1; x < hx1; x++) if (rnd() < 0.5) P.p(T.WIN, x, 1, facing === 'S' ? hz : hz1, C.white, 0);
        if (d > 2) { P.p(T.WIN, hx, 1, hz + 1, C.white, 1); P.p(T.WIN, hx1, 1, hz1 - 1, C.white, 1); }
        for (let y = 0; y < h; y++) P.ring(y, hx, hz, hx1, hz1, wc);
        let a = hz, b = hz1, y = h;
        while (a <= b) {
          for (let x = hx; x <= hx1; x++) {
            if (a === b) P.p(T.CUBE, x, y, a, rc);
            else { P.p(T.SLOPE, x, y, b, rc, 0); P.p(T.SLOPE, x, y, a, rc, 2); }
          }
          a++; b--; y++;
        }
        P.p(T.FLOWER, hx - 1 >= x0 ? hx - 1 : hx1 + 1, 0, fz, pk([C.pink, C.red, C.yellow, C.purple]));
        if (rnd() < 0.7) P.p(T.TREE, rnd() < 0.5 ? x0 : x1, 0, facing === 'S' ? z0 : z1, pk([C.green, C.lime, C.green]));
        if (rnd() < 0.6) P.p(T.PERSON, dx + 1, 0, facing === 'S' ? hz1 + 1 : hz - 1, pk(wallCols), facing === 'S' ? 0 : 2);
        if (rnd() < 0.5) for (let x = hx; x <= hx1; x++) if (x !== dx) P.p(T.FENCE, x, 0, facing === 'S' ? Math.min(z1, hz1 + 2) : Math.max(z0, hz - 2), C.white, 0);
      } else if (kind < 0.72) {
        const w = ri(4, 5), d = ri(4, 5);
        const hx = x0 + ri(1, Math.max(1, x1 - x0 - w)), hz = z0 + ri(1, Math.max(1, z1 - z0 - d));
        const hx1 = Math.min(x1, hx + w - 1), hz1 = Math.min(z1, hz + d - 1);
        const wc = pk([C.lgray, C.tan, C.sky, C.white, C.teal, C.orange]), h = ri(5, 10);
        const fz = facing === 'S' ? hz1 : hz;
        P.p(T.DOOR, hx + 1, 0, fz, C.dgray, facing === 'S' ? 0 : 2);
        for (let y = 1; y < h; y++) {
          if (y % 2 === 1 || y === 1) {
            for (let x = hx + 1; x < hx1; x++) { if (!(y === 1 && x === hx + 1)) { P.p(T.WIN, x, y, hz, C.white, 0); P.p(T.WIN, x, y, hz1, C.white, 0); } }
            for (let z = hz + 1; z < hz1; z++) { P.p(T.WIN, hx, y, z, C.white, 1); P.p(T.WIN, hx1, y, z, C.white, 1); }
          }
        }
        for (let y = 0; y < h; y++) P.ring(y, hx, hz, hx1, hz1, wc);
        P.rect(h, hx, hz, hx1, hz1, pk([C.dgray, C.red, C.blue]));
        if (rnd() < 0.5) P.p(T.LAMP, hx + 1, h + 1, hz + 1, C.red);
        if (rnd() < 0.6) P.p(T.TREE, hx1 + 1 <= x1 ? hx1 + 1 : x0, 0, facing === 'S' ? z1 : z0, C.green);
      } else if (kind < 0.88) {
        for (let i = 0; i < 4; i++) P.p(T.TREE, ri(x0, x1), 0, ri(z0, z1), pk([C.green, C.lime, C.green, C.orange]));

        for (let z = cz - 2; z <= cz + 2; z++) for (let x = cx - 2; x <= cx + 2; x++) if ((x - cx) ** 2 + (z - cz) ** 2 <= 4 && P.free(x, 0, z)) P.ground.push([x, z, C.sky]);
        P.p(T.PERSON, cx + 3 <= x1 ? cx + 3 : cx - 3, 0, cz, pk(wallCols), 3);
        P.p(T.B2, cx - 1, 0, cz + 3 <= z1 ? cz + 3 : cz - 3, C.brown, 0);
      } else {
        const cx = ri(x0 + 1, x1 - 2), cz = ri(z0 + 1, z1 - 2);
        P.rect(0, cx - 1, cz - 1, cx + 2, cz + 2, C.lgray);
        P.p(T.CYL, cx, 1, cz, pk([C.red, C.blue, C.yellow])); P.p(T.CYL, cx + 1, 1, cz + 1, pk([C.red, C.blue, C.yellow]));

        P.p(T.FLOWER, cx - 1, 1, cz - 1, C.pink); P.p(T.FLOWER, cx + 2, 1, cz + 2, C.yellow);

    }
    // 路燈、車子、行人
    for (const r of roads) for (let i = 2; i < N; i += 6) {
      if (isRoad(i)) continue;
      P.p(T.LAMP, i, 0, r - 1, C.dgray); P.p(T.LAMP, r + 2, 0, i, C.dgray);
    }
    for (let k = 0; k < 6; k++) {
      const r = pk(roads), along = ri(0, N - 3), col = pk([C.red, C.blue, C.yellow, C.green, C.white, C.orange, C.pink]);
      if (rnd() < 0.5) P.p(T.CAR, along, 0, r + (rnd() < 0.5 ? 0 : 1), col, rnd() < 0.5 ? 0 : 2);
      else P.p(T.CAR, r + (rnd() < 0.5 ? 0 : 1), 0, along + 1, col, rnd() < 0.5 ? 1 : 3);
    }
    for (let k = 0; k < 6; k++) { const r = pk(roads); P.p(T.PERSON, ri(0, N - 1), 0, r + (rnd() < 0.5 ? -1 : 2), pk(wallCols), ri(0, 3)); }
    const gr = new Array(N * N).fill(255);
    P.ground.forEach(([x, z, c]) => { gr[z * N + x] = c; });
    return { blocks: P.L.map(q => q.s), ground: gr };
  }

  $('cfNo').addEventListener('click', () => { KG.sound('click'); const f = cfNo; cfNo = null; closeOv(); if (f) f(); });

  function openMenu() {
    $('mInfo').textContent = '小島上有 ' + world.n + ' 個積木' + (world.n > MAXB * 0.9 ? '（快滿了，最多 ' + MAXB + ' 個）' : '');
    openOvl('menu');
  }
  function enterBuild(loadAuto) {
    if (phase === 'title') {
      phase = 'build';
      $('title').classList.remove('show');
      if (openOv === 'title') openOv = null;
      document.querySelectorAll('.ui').forEach(u => { if (u.id !== 'guide' && u.id !== 'coach') u.classList.remove('hide'); });
      if (loadAuto) {
        let d = null;
        try { d = decodeSync(KG.store.get(SKEY + 'auto', '')); } catch (e) { d = null; }
        replaceAll(d || { blocks: [] }, false);
      }
      layout();
      resetCam(false);
      musicOn = true; startMusic();
      if (!prefs.coach) showCoach();
    }
  }
  function showCoach() {
    const el = $('coach');
    el.innerHTML = '點一下：放積木　拖曳：轉動小島<br>兩指：縮放、移動　長按：吸取顏色';
    el.classList.remove('hide'); el.style.opacity = 1;
    setTimeout(() => { el.style.opacity = 0; setTimeout(() => el.classList.add('hide'), 600); }, 5200);
    prefs.coach = 1; KG.store.set(SKEY + 'prefs', prefs);
  }
  function goTitle() {
    if (guide) exitGuide();
    autosave();
    phase = 'title';
    document.querySelectorAll('.ui').forEach(u => u.classList.add('hide'));
    hideGhost();
    replaceAll(makeTown(7), false);
    hist.length = 0; redoS.length = 0;
    refreshTitle();
    openOvl('title');
    layout();
    camGoal.dist = fitDist() * 0.9; camGoal.pitch = 0.5; camGoal.tx = camGoal.tz = 0; camGoal.ty = 1.5;
  }
  function refreshTitle() {
    const done = TEMPLATES.filter(d => tplRec[d.id] && tplRec[d.id].stars > 0).length;
    $('tDone').textContent = done; $('tAll').textContent = TEMPLATES.length;
    $('tStars').textContent = Object.values(tplRec).reduce((a, r) => a + (r.stars || 0), 0);
  }
  function openTemplates() {
    $('tGrid').innerHTML = TEMPLATES.map(d => {
      const r = tplRec[d.id];
      const s = r ? '⭐'.repeat(r.stars) + '☆'.repeat(3 - r.stars) : '☆☆☆';
      return '<button class="tcard" data-id="' + d.id + '"><img alt="" src="' + tplThumb(d) + '">' + d.name + '<span class="stars">' + s + '</span><small>' + tplData(d).steps.length + ' 步</small></button>';
    }).join('');
    openOvl('tpl');
  }
  $('tGrid').addEventListener('click', e => {
    const c = e.target.closest('.tcard'); if (!c) return;
    KG.sound('click');
    const id = c.dataset.id;
    const go = () => { closeOv(); if (openOv) closeOv(); startGuideFrom(id); };
    if (phase === 'build' && world.n > 0 && !guide) confirmBox('要開始跟著蓋嗎？', '小島會清空。想留下現在的作品，可以先存起來！', () => startGuideFrom(id), null, '開始蓋', '先不要');
    else go();
  });
  function startGuideFrom(id) {
    if (openOv) { $(openOv).classList.remove('show'); openOv = null; }
    if (phase === 'title') { phase = 'title'; }
    startGuide(id);
  }
  function openSaves() {
    const list = getSaves();
    $('sList').innerHTML = list.length ? list.map((s, i) => {
      const d = new Date(s.time);
      return '<div class="slot"><img alt="" src="' + (s.thumb || '') + '"><div class="info">' + escH(s.name) + '<small>' + s.n + ' 個積木・' + (d.getMonth() + 1) + '/' + d.getDate() + ' ' + String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0') + '</small></div>' +
        '<button class="sb" data-load="' + i + '">打開</button><button class="sb del" data-del="' + i + '">刪除</button></div>';
    }).join('') : '<p style="text-align:center;color:#8a7a95">還沒有作品，蓋好後按「存目前的小島」吧！</p>';
    $('sList').insertAdjacentHTML('beforeend', '<p style="text-align:center;color:#8a7a95;font-size:13px;margin:4px 0 0">已存 ' + list.length + ' / 10 個</p>');
    openOvl('saves');
  }
  function escH(s) { return String(s).replace(/[&<>"]/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[ch])); }
  $('sList').addEventListener('click', e => {
    const l = e.target.closest('[data-load]'), d = e.target.closest('[data-del]');
    if (l) {
      KG.sound('click');
      const s = getSaves()[+l.dataset.load]; if (!s) return;
      const go = async () => {
        if (openOv) { $(openOv).classList.remove('show'); openOv = null; }
        if (guide) exitGuide();
        enterBuild(false);
        try { await loadCode(s.code, true); KG.sound('sparkle'); KG.toast('打開 ' + s.name); } catch (er) { KG.toast('讀不出來'); sBad(); }
        resetCam();
      };
      if (phase === 'build' && world.n > 0) confirmBox('打開「' + s.name + '」？', '現在的小島會被換掉（可以按 ↶ 復原）。', go); else go();
    } else if (d) {
      KG.sound('click');
      const i = +d.dataset.del, s = getSaves()[i]; if (!s) return;
      confirmBox('刪除「' + s.name + '」？', '刪掉就找不回來囉。', () => { const list = getSaves(); list.splice(i, 1); KG.store.set(SAVES, list); KG.sound('whoosh'); openSaves(); }, () => openSaves(), '刪除', '保留');
    }
  });
  async function openShare() {
    openOvl('share');
    $('shareTxt').value = world.n || ground.some(v => v !== 255) ? '產生中…' : '';
    if (world.n || ground.some(v => v !== 255)) $('shareTxt').value = await encode(world.specs(), ground);
  }
  $('shCopy').addEventListener('click', async () => {
    const t = $('shareTxt');
    try { await navigator.clipboard.writeText(t.value); KG.toast('複製好了'); KG.sound('coin'); }
    catch (e) { t.select(); try { document.execCommand('copy'); KG.toast('複製好了'); } catch (e2) { KG.toast('請手動複製'); } }
  });
  $('shImport').addEventListener('click', async () => {
    const v = $('shareTxt').value.trim();
    try {
      const d = await decode(v);
      closeOv();
      if (guide) exitGuide();
      enterBuild(false);
      replaceAll(d, true, true);
      KG.sound('sparkle'); KG.toast('匯入成功！');
      resetCam();
    } catch (e) { KG.toast('分享碼不正確'); sBad(); $('share').querySelector('.card').classList.add('kg-shake'); setTimeout(() => $('share').querySelector('.card').classList.remove('kg-shake'), 450); }
  });
  function photo() {
    hideGhost();
    const hv = hintRoot.visible; hintRoot.visible = false;
    renderer.render(scene, camera);
    const w = renderer.domElement.width, h = renderer.domElement.height;
    const c2 = document.createElement('canvas'); c2.width = w; c2.height = h;
    const g = c2.getContext('2d');
    g.drawImage(renderer.domElement, 0, 0);
    hintRoot.visible = hv;
    const fs = Math.max(16, Math.round(h * 0.035));
    g.font = '800 ' + fs + 'px ' + getComputedStyle(document.body).fontFamily;
    const txt = '積木小城市';
    const tw = g.measureText(txt).width;
    g.fillStyle = 'rgba(255,255,255,.85)';
    g.beginPath(); if (g.roundRect) g.roundRect(w - tw - fs * 1.6, h - fs * 2.2, tw + fs, fs * 1.6, fs * 0.8); else g.rect(w - tw - fs * 1.6, h - fs * 2.2, tw + fs, fs * 1.6); g.fill();
    g.fillStyle = '#4a3b52'; g.fillText(txt, w - tw - fs * 1.1, h - fs * 0.95);
    c2.toBlob(b => {
      if (!b) return;
      const a = document.createElement('a');
      a.href = URL.createObjectURL(b); a.download = 'block-city-' + Date.now() + '.png';
      a.style.display = 'none';
      document.body.appendChild(a); a.click();
      setTimeout(() => { a.remove(); URL.revokeObjectURL(a.href); }, 4000);
    }, 'image/png');
    // 閃光 + 快門聲
    const f = document.createElement('div');
    f.style.cssText = 'position:fixed;inset:0;background:#fff;z-index:9200;pointer-events:none;transition:opacity .4s';
    document.body.appendChild(f); requestAnimationFrame(() => { f.style.opacity = 0; }); setTimeout(() => f.remove(), 450);
    KG.note(1800, 0.04, 'square', 0.08); KG.note(900, 0.08, 'square', 0.06, 0.05);
  }
  function randomTown(seed) {
    if (guide) exitGuide();
    enterBuild(false);
    replaceAll(makeTown(seed), true, true);
    KG.sound('sparkle'); KG.toast('新的小鎮！');
    resetCam();
  }
  function onAct(act) {
    KG.sound('click');
    if (act === 'free') { enterBuild(true); }
    else if (act === 'tpl') openTemplates();
    else if (act === 'town') {
      if (phase === 'build' && world.n > 0) confirmBox('變出隨機小鎮？', '現在的小島會被換掉（可以按 ↶ 復原）。', () => randomTown());
      else { closeOv(); randomTown(); }
    }
    else if (act === 'saves') openSaves();
    else if (act === 'resume') closeOv();
    else if (act === 'save') { if (openOv === 'menu') closeOv(); saveCreation().then(ok => { if (ok && openOv === 'saves') openSaves(); }); }
    else if (act === 'share') openShare();
    else if (act === 'photo') { closeOv(); setTimeout(photo, 60); }
    else if (act === 'clear') confirmBox('清空小島？', '全部積木都會不見（可以按 ↶ 復原）。', () => { if (guide) exitGuide(); replaceAll({ blocks: [] }, true, true); KG.sound('whoosh'); });
    else if (act === 'home') { closeOv(); goTitle(); }
  }
  document.querySelectorAll('[data-act]').forEach(b => b.addEventListener('click', () => onAct(b.dataset.act)));
  $('dFree').addEventListener('click', () => { KG.sound('click'); closeOv(); });
  $('dAgain').addEventListener('click', () => { KG.sound('click'); closeOv(); startGuide(lastGuideId); });
  $('dMore').addEventListener('click', () => { KG.sound('click'); closeOv(); openTemplates(); });
  document.addEventListener('visibilitychange', () => { if (document.hidden) { autosave(); cancelLP(); ptrs.clear(); gest = null; } });
  window.addEventListener('pagehide', autosave);

  /* =========================================================
   * 自動畫質：太卡就一步步降低（解析度 → 影子 → 夜燈），並記住
   * ========================================================= */
  const QKEY = 'quality:block-builder';
  const baseRatio = Math.min(window.devicePixelRatio || 1, small ? 1.75 : 2);
  const QL = [
    { ratio: baseRatio, shadow: true, lights: true },
    { ratio: Math.min(baseRatio, 1.5), shadow: true, lights: true },
    { ratio: Math.min(baseRatio, 1.25), shadow: true, lights: true },
    { ratio: 1, shadow: true, lights: true },
    { ratio: 1, shadow: false, lights: true },
    { ratio: 0.85, shadow: false, lights: false }
  ];
  let qLevel = clamp(KG.store.get(QKEY, KG.lowEnd ? 2 : 0) | 0, 0, QL.length - 1);
  const perf = { last: 0, n: 0, sum: 0, cool: 2.5 };
  const frameLog = new Float32Array(600); let flN = 0;
  function applyQuality() {
    const q = QL[qLevel];
    renderer.setPixelRatio(q.ratio);
    layout();
    if (renderer.shadowMap.enabled !== q.shadow) {
      renderer.shadowMap.enabled = q.shadow;
      shadowDirty = true;
      scene.traverse(o => { if (o.material) [].concat(o.material).forEach(m => { m.needsUpdate = true; }); });
    }
    lampPickT = 0;
  }
  function renderFrame() {
    if (shadowDirty && renderer.shadowMap.enabled) { renderer.shadowMap.needsUpdate = true; shadowDirty = false; }
    renderer.render(scene, camera);
    const now = performance.now(), dt = perf.last ? Math.min(0.5, (now - perf.last) / 1000) : 0;
    perf.last = now;
    frameLog[flN++ % 600] = dt * 1000;
    if (document.hidden || qLevel >= QL.length - 1) return;
    perf.cool -= dt;
    if (perf.cool > 0) return;
    perf.sum += dt; perf.n++;
    if (perf.n >= 60) {
      if (perf.sum / perf.n > 1 / 45) {
        qLevel++;
        KG.store.set(QKEY, qLevel);
        applyQuality();
        perf.cool = 1.5;
      }
      perf.n = 0; perf.sum = 0;
    }
  }

  /* =========================================================
   * 主迴圈
   * ========================================================= */
  let last = performance.now(), first = true, clock = 0;
  const easeBack = t => { const c = 1.9; t -= 1; return 1 + (c + 1) * t * t * t + c * t * t; };
  function frame(now) {
    const dt = Math.max(0, Math.min(0.05, (now - last) / 1000));
    const rdt = Math.max(0, Math.min(0.3, (now - last) / 1000));   // 日夜切換用真實時間，慢的裝置也能準時完成
    last = now; clock += dt;
    if (phase === 'title' && !ptrs.size) camGoal.yaw += dt * 0.08;
    updCamera(dt);
    // 彈出動畫
    if (anims.length) {
      for (let i = anims.length - 1; i >= 0; i--) {
        const a = anims[i];
        a.t += dt / 0.28;
        if (!world.blocks.has(a.b.id)) { anims.splice(i, 1); continue; }
        if (a.t >= 1) { a.b.sc = 1; world.setM(a.b, 1); anims.splice(i, 1); }
        else { a.b.sc = 0.4 + 0.6 * easeBack(a.t); world.setM(a.b, a.b.sc); }
      }
      shadowDirty = true;
    }
    updParticles(dt);
    if (Math.abs(nightT - nightGoal) > 0.001) { nightT += clamp(nightGoal - nightT, -rdt / 1.2, rdt / 1.2); applyNight(); shadowDirty = true; lampPickT = 0; }
    waterU.uTime.value = clock;
    for (let i = 0; i < clouds.length; i++) { const c = clouds[i]; c.position.x += dt * (0.8 + (i % 3) * 0.3); if (c.position.x > 170) c.position.x = -170; }
    if (guide) { const k = Math.sin(clock * 5); hintMat.opacity = 0.55 + k * 0.2; hintMat.emissiveIntensity = 0.45 + k * 0.3; }
    if (glowDirty) rebuildGlows();
    updLampLights(dt);
    checkLongPress();
    if (hoverDirty && phase === 'build' && !openOv) {
      hoverDirty = false;
      if (hoverXY && !(gest && gest.type !== 'tap')) showPlan(planFor(hoverXY[0], hoverXY[1]));
    }
    if (ghostHold > 0) { ghostHold -= dt; if (ghostHold <= 0 && !ptrs.size && !hoverXY) hideGhost(); }
    renderFrame();
    if (first) { first = false; const m = $('msg'); if (m) m.remove(); }
    requestAnimationFrame(frame);
  }

  // 啟動
  makeIcons();
  buildPalette();
  applyQuality();
  applyNight();
  $('bUndo').disabled = true; $('bRedo').disabled = true;
  document.querySelectorAll('.ui').forEach(u => u.classList.add('hide'));
  replaceAll(makeTown(7), false);
  hist.length = 0;
  layout();
  resetCam(true);
  cam.dist = camGoal.dist = fitDist() * 0.9; cam.pitch = camGoal.pitch = 0.5;
  refreshTitle();
  openOv = 'title';
  requestAnimationFrame(frame);

  /* =========================================================
   * 測試用掛勾
   * ========================================================= */
  function toScreen(x, y, z) {
    _p.set(x, y, z).project(camera);
    const r = cv.getBoundingClientRect();
    return { x: r.left + (_p.x + 1) / 2 * r.width, y: r.top + (1 - _p.y) / 2 * r.height };
  }
  window.__bb2 = {
    state: () => ({ phase, mode, sel: Object.assign({}, sel), count: world.n, hist: hist.length, redo: redoS.length, night: nightGoal, q: qLevel, ov: openOv,
      guide: guide ? { id: guide.id, step: guide.i, steps: guide.steps.length, left: guideStep() ? guideStep().pieces.filter(q => !q.done).length : 0, auto: guide.auto } : null,
      settled: Math.abs(cam.yaw - camGoal.yaw) + Math.abs(cam.pitch - camGoal.pitch) + Math.abs(cam.dist - camGoal.dist) * 0.1 + Math.abs(cam.tx - camGoal.tx) + Math.abs(cam.tz - camGoal.tz) + Math.abs(cam.ty - camGoal.ty) < 0.01,
      cam: { yaw: +camGoal.yaw.toFixed(3), pitch: +camGoal.pitch.toFixed(3), dist: +camGoal.dist.toFixed(2), tx: +camGoal.tx.toFixed(2), tz: +camGoal.tz.toFixed(2) },
      draws: renderer.info.render.calls, tris: renderer.info.render.triangles, view, ptrs: ptrs.size, gest: gest && gest.type }),
    place: (x, y, z, t = 0, c = 0, r = 0) => { const b = doPlace({ t, c, r, x, y, z }, true); return b ? b.id : null; },
    erase: (x, y, z) => doErase(world.at(x, y, z), true),
    paint: (x, y, z, c) => doPaint(world.at(x, y, z), c, true),
    at: (x, y, z) => { const b = world.at(x, y, z); return b ? [b.x, b.y, b.z, b.t, b.c, b.r] : null; },
    undo, redo, count: () => world.n,
    dump: () => ({ blocks: world.specs(), ground: Array.from(ground) }),
    load: (json) => replaceAll(typeof json === 'string' ? JSON.parse(json) : json, false),
    clear: () => replaceAll({ blocks: [] }, true),
    encode: () => encode(world.specs(), ground),
    decode: (s) => decode(s),
    importCode: (s) => loadCode(s, true),
    save: (name) => saveCreation(name),
    saves: () => getSaves().map(s => ({ name: s.name, n: s.n, len: s.code.length, thumb: (s.thumb || '').length })),
    loadSlot: (i) => loadCode(getSaves()[i].code, true),
    deleteAllSaves: () => KG.store.set(SAVES, []),
    random: (seed) => { randomTown(seed); return world.n; },
    town: (seed) => makeTown(seed),
    template: (id) => { startGuideFrom(id); return guide && guide.steps.length; },
    templates: () => TEMPLATES.map(d => { const t = tplData(d); return { id: d.id, name: d.name, steps: t.steps.length, pieces: t.pieces.length }; }),
    autoStep: () => guideAuto(),
    guideTargets: () => { const st = guideStep(); return st ? st.pieces.filter(q => !q.done).map(q => q.s) : []; },
    fill: (n, seed = 1) => {
      const rnd = mulberry(seed); let k = 0, tries = 0;
      const ops = [];
      while (k < n && tries < n * 20 && world.n < MAXB) {
        tries++;
        const x = (rnd() * N) | 0, z = (rnd() * N) | 0, t = [0, 0, 1, 2, 3, 5, 6][(rnd() * 7) | 0];
        const y = columnTop(x, z);
        const b = world.add(t, (rnd() * 16) | 0, (rnd() * 4) | 0, x, y, z);
        if (b) { k++; ops.push({ a: 'add', s: [b.x, b.y, b.z, b.t, b.c, b.r] }); }
      }
      commit(ops); perf.cool = 1.5;
      return k;
    },
    perf: () => { const n = Math.min(flN, 600); let s = 0, mx = 0; const a = []; for (let i = 0; i < n; i++) { s += frameLog[i]; mx = Math.max(mx, frameLog[i]); a.push(frameLog[i]); } a.sort((x, y) => x - y); return { n, avg: n ? s / n : 0, max: mx, p95: n ? a[Math.floor(n * 0.95)] : 0 }; },
    resetPerf: () => { flN = 0; },
    setQuality: (l) => { qLevel = clamp(l, 0, QL.length - 1); applyQuality(); },
    toScreen: (x, y, z) => toScreen(wX(x), y, wX(z)),
    aim: (sx, sy) => { const p = planFor(sx, sy); return p ? { act: p.act, ok: p.ok, x: p.x, y: p.y, z: p.z, t: p.t, b: p.block ? [p.block.x, p.block.y, p.block.z] : null } : null; },
    night: (on) => toggleNight(on),
    mode: (m) => setMode(m),
    select: (t, c, r) => setSel(t, c, r),
    start: () => enterBuild(true),
    title: () => goTitle(),
    camGoal: () => Object.assign({}, camGoal),
    setCam: (o) => { Object.assign(camGoal, o); Object.assign(cam, camGoal); }
  };
}
</script>
</body>
