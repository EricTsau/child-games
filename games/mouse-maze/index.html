<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>老鼠找起司</title>
<link rel="stylesheet" href="../../assets/common.css">
<style>
  /* ===== 共用遊戲介面（標題、選關、結算） ===== */
  html, body { height: 100%; overflow: hidden; touch-action: none; }
  .gk-canvas { position: fixed; inset: 0; width: 100vw; height: 100vh; height: 100dvh; display: block; touch-action: none; }
  .scr {
    position: fixed; inset: 0; z-index: 8500; display: none;
    align-items: center; justify-content: center; flex-direction: column;
    padding: 70px 14px calc(18px + env(safe-area-inset-bottom));
  }
  .scr.show { display: flex; animation: kg-fade .3s ease; }
  .title-scr { background: radial-gradient(ellipse at 50% 45%, rgba(255,255,255,.25) 0%, rgba(255,255,255,0) 55%, var(--vig, rgba(40,20,60,.35)) 100%); }
  .title-wrap { display: flex; flex-direction: column; align-items: center; gap: 6px; text-align: center; }
  .title-art { width: min(300px, 70vw, 34vh); height: min(240px, 56vw, 27vh); }
  .logo {
    margin: 0; font-size: clamp(46px, 13vw, 88px); font-weight: 900; line-height: 1.1; color: var(--logo, #fff);
    letter-spacing: 2px; white-space: nowrap;
    --o: var(--outline, #c2416c); --o2: var(--outline2, rgba(120, 30, 70, .55));
    text-shadow: 0 -4px 0 var(--o), 0 4px 0 var(--o), -4px 0 0 var(--o), 4px 0 0 var(--o),
      -3px -3px 0 var(--o), 3px -3px 0 var(--o), -3px 3px 0 var(--o), 3px 3px 0 var(--o),
      0 10px 0 var(--o), 4px 9px 0 var(--o), -4px 9px 0 var(--o), 0 16px 18px var(--o2);
  }
  .logo span { display: inline-block; animation: gk-bob 1.8s ease-in-out infinite; }
  .subtitle {
    margin-top: 10px; font-size: clamp(16px, 4.4vw, 20px); font-weight: 800; color: var(--ink, #4a3b52);
    background: rgba(255,255,255,.88); border-radius: 999px; padding: 6px 18px; box-shadow: var(--kg-shadow);
  }
  .big-btn {
    margin-top: 16px; font-family: var(--kg-font); font-size: clamp(28px, 8vw, 38px); font-weight: 900; color: #fff;
    min-width: 200px; padding: 14px 40px 16px; border: 5px solid #fff; border-radius: 999px; cursor: pointer;
    background: linear-gradient(180deg, var(--b1, #9be8aa) 0%, var(--b2, #3fb35f) 100%);
    box-shadow: 0 7px 0 var(--b3, #2a8746), 0 14px 26px rgba(0,0,0,.25), inset 0 6px 0 rgba(255,255,255,.35);
    text-shadow: 0 3px 0 rgba(0,0,0,.2); animation: gk-breathe 1.6s ease-in-out infinite;
    transition: transform .1s ease;
  }
  .big-btn:active { transform: translateY(5px) scale(.97); animation: none; }
  .scr-btn {
    font-family: var(--kg-font); font-size: 20px; font-weight: 900; color: #fff; cursor: pointer;
    min-height: 56px; padding: 10px 22px; border: 4px solid #fff; border-radius: 999px;
    background: linear-gradient(180deg, var(--b1, #9be8aa), var(--b2, #3fb35f));
    box-shadow: 0 5px 0 var(--b3, #2a8746), 0 10px 18px rgba(0,0,0,.2), inset 0 4px 0 rgba(255,255,255,.35);
    text-shadow: 0 2px 0 rgba(0,0,0,.18); transition: transform .1s ease;
  }
  .scr-btn.alt { --b1: #9ad8ff; --b2: #3a9ee8; --b3: #2672ad; }
  .scr-btn.warm { --b1: #ffd27a; --b2: #f39a1e; --b3: #c0700c; }
  .scr-btn.go { --b1: #9be8aa; --b2: #3fb35f; --b3: #2a8746; }
  .scr-btn:active { transform: translateY(4px) scale(.96); }
  @keyframes gk-bob { 0%, 100% { transform: translateY(0) rotate(-2deg); } 50% { transform: translateY(-8px) rotate(2deg); } }
  @keyframes gk-breathe { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.06); } }
  @keyframes gk-in { from { transform: scale(.3) translateY(30px); opacity: 0; } to { transform: none; opacity: 1; } }
  @keyframes gk-star { 0% { transform: scale(0) rotate(-120deg); opacity: 0; } 70% { transform: scale(1.3) rotate(10deg); opacity: 1; } 100% { transform: scale(1) rotate(0); } }

  /* 選關 */
  .lv-scr { background: var(--lvbg, linear-gradient(180deg, rgba(255,240,248,.95), rgba(255,250,235,.97))); justify-content: flex-start; overflow-y: auto; touch-action: pan-y; }
  .lv-head { display: flex; align-items: center; justify-content: center; gap: 12px; flex-wrap: wrap; margin: 0 0 14px; }
  .lv-head h2 { margin: 0; font-size: clamp(26px, 7vw, 36px); color: var(--ink, #4a3b52); }
  .star-count { display: inline-flex; align-items: center; gap: 4px; font-size: 22px; font-weight: 900; background: #fff; border-radius: 999px; padding: 4px 14px 4px 8px; box-shadow: var(--kg-shadow); }
  .star-count svg { width: 30px; height: 30px; }
  .lv-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(92px, 1fr)); gap: 16px 14px; width: min(640px, 100%); padding: 8px; }
  .lv-card {
    position: relative; aspect-ratio: 1 / 1.08; border: 4px solid #fff; border-radius: 26px; cursor: pointer; padding: 6px 4px;
    background: linear-gradient(180deg, var(--c1, #ffb3cc), var(--c2, #ff7aa2));
    box-shadow: 0 6px 0 var(--c3, #d4517c), 0 12px 20px rgba(0,0,0,.18), inset 0 5px 0 rgba(255,255,255,.35);
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
    font-family: var(--kg-font); color: #fff; animation: gk-in .45s cubic-bezier(.2,1.5,.4,1) both; transition: transform .1s ease;
  }
  .lv-card:active { transform: translateY(4px) scale(.96); }
  .lv-card .n { font-size: 38px; font-weight: 900; line-height: 1; text-shadow: 0 3px 0 rgba(0,0,0,.2); }
  .lv-card .lb { font-size: 13px; font-weight: 800; opacity: .95; white-space: nowrap; text-shadow: 0 1px 0 rgba(0,0,0,.2); }
  .lv-card .st { display: flex; gap: 1px; }
  .lv-card .st svg { width: 22px; height: 22px; }
  .lv-card.locked { filter: grayscale(.85) brightness(1.05); opacity: .7; cursor: default; }
  .lv-card.next::after { content: ''; position: absolute; inset: -9px; border-radius: 32px; border: 4px dashed var(--nextc, rgba(255,160,40,.95)); animation: gk-breathe 1.2s ease-in-out infinite; pointer-events: none; }
  .col-head { margin: 22px 0 10px; font-size: 22px; font-weight: 900; color: var(--ink, #4a3b52); }
  .col-row { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; width: min(640px, 100%); padding-bottom: 10px; }
  .col-item {
    position: relative; width: 96px; border: 4px solid #fff; border-radius: 22px; background: #fff; cursor: pointer; padding: 4px 4px 6px;
    box-shadow: 0 5px 0 rgba(74,59,82,.15), 0 10px 18px rgba(0,0,0,.12); font-family: var(--kg-font); text-align: center; transition: transform .1s ease;
  }
  .col-item:active { transform: scale(.95); }
  .col-item canvas { width: 80px; height: 64px; display: block; margin: 0 auto; }
  .col-item .nm { font-size: 13px; font-weight: 800; color: var(--ink, #4a3b52); white-space: nowrap; }
  .col-item.sel { border-color: var(--sel, #ffcf3d); box-shadow: 0 0 0 4px var(--sel, #ffcf3d), 0 10px 18px rgba(0,0,0,.18); }
  .col-item.locked canvas { filter: brightness(0) opacity(.22); }
  .col-item .lock { position: absolute; top: 20px; left: 0; right: 0; font-size: 16px; font-weight: 900; color: #6b5a74; display: flex; align-items: center; justify-content: center; gap: 2px; }
  .col-item .lock svg { width: 22px; height: 22px; }
  .lv-back { margin-top: 18px; }

  /* 結算 */
  .res-scr { background: rgba(50, 30, 70, .45); backdrop-filter: blur(3px); }
  .res-card {
    position: relative; width: min(400px, 100%); text-align: center; padding: 46px 20px 22px;
    background: linear-gradient(180deg, #fff 0%, var(--card2, #fff1f6) 100%); border: 6px solid #fff; border-radius: 34px;
    box-shadow: 0 18px 44px rgba(40,20,60,.4), inset 0 -8px 0 rgba(0,0,0,.04); animation: gk-in .5s cubic-bezier(.2,1.5,.4,1) both;
  }
  .res-ribbon {
    position: absolute; left: 50%; top: -28px; transform: translateX(-50%); white-space: nowrap;
    font-size: 30px; font-weight: 900; color: #fff; padding: 8px 34px 10px; border-radius: 18px;
    background: linear-gradient(180deg, var(--r1, #ff9fbe), var(--r2, #e8648d)); border: 4px solid #fff;
    box-shadow: 0 6px 0 var(--r3, #b9406a), 0 10px 20px rgba(0,0,0,.2); text-shadow: 0 3px 0 rgba(0,0,0,.18);
  }
  .res-stars { display: flex; justify-content: center; align-items: flex-end; gap: 4px; margin: 6px 0 8px; position: relative; }
  .res-stars svg { width: 78px; height: 78px; animation: gk-star .6s cubic-bezier(.2,1.5,.4,1) both; }
  .res-stars svg:nth-child(2) { width: 96px; height: 96px; margin-bottom: 14px; }
  .res-msg { font-size: 19px; font-weight: 800; line-height: 1.5; margin: 4px 0 10px; color: var(--ink, #4a3b52); }
  .res-unlock { display: none; margin: 0 auto 12px; padding: 8px 12px; border-radius: 18px; background: linear-gradient(180deg, #fff7c9, #ffe68a); border: 3px dashed #f5b82e; font-size: 17px; font-weight: 900; color: #8a5a00; align-items: center; justify-content: center; gap: 8px; }
  .res-unlock.show { display: flex; animation: gk-in .5s .9s cubic-bezier(.2,1.5,.4,1) both; }
  .res-unlock canvas { width: 60px; height: 48px; flex: none; }
  .res-btns { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }

  /* 遊戲中的小按鈕 */
  .gk-round {
    pointer-events: auto; width: 48px; height: 48px; border-radius: 50%; border: 3px solid #fff; cursor: pointer; font-size: 22px; line-height: 1;
    display: grid; place-items: center; background: linear-gradient(180deg, #fff, #ffe9f1); box-shadow: var(--kg-shadow); color: var(--ink, #4a3b52); font-family: var(--kg-font); font-weight: 900;
  }
  .gk-round:active { transform: scale(.9); }
  .gk-round svg { width: 26px; height: 26px; }
  .gk-banner { position: fixed; left: 50%; top: 40%; transform: translate(-50%, -50%); z-index: 8200; display: none; text-align: center; pointer-events: none; width: max-content; max-width: 96vw; }
  .gk-banner.show { display: block; animation: gk-in .5s cubic-bezier(.2,1.5,.4,1) both; }
  .gk-banner .t1 { font-size: clamp(32px, 9.5vw, 56px); font-weight: 900; color: #fff; --o: var(--outline, #c2416c);
    text-shadow: 0 -3px 0 var(--o), 0 3px 0 var(--o), -3px 0 0 var(--o), 3px 0 0 var(--o), -2px -2px 0 var(--o), 2px -2px 0 var(--o), -2px 2px 0 var(--o), 2px 2px 0 var(--o), 0 8px 0 var(--o), 0 12px 16px rgba(0,0,0,.3); white-space: nowrap; }
  .gk-banner .t2 { display: inline-block; margin-top: 10px; font-size: clamp(16px, 4.4vw, 22px); font-weight: 900; color: var(--ink, #4a3b52); background: #fffdf3; border: 3px solid var(--b1, #ffd27a); border-radius: 999px; padding: 6px 18px; box-shadow: var(--kg-shadow); }
  body { background: #8fd16a; --outline: #3d8a2e; --outline2: rgba(30, 80, 20, .45); --b1: #ffe066; --b2: #f5a623; --b3: #c47a0a;
    --r1: #ffe066; --r2: #f5a623; --r3: #c47a0a; --card2: #fffbe6; --vig: rgba(30, 70, 20, .35); --ink: #4a3b2a;
    --lvbg: linear-gradient(180deg, rgba(230,250,215,.96), rgba(255,248,220,.97)); --c1: #a6e37f; --c2: #5cb83a; --c3: #3d8a2e; }
  .mhud { position: fixed; top: 12px; left: 50%; transform: translateX(-50%); width: max-content; max-width: calc(100vw - 128px); z-index: 8000; display: none; gap: 8px; pointer-events: none; }
  .mhud.show { display: flex; }
  .leaf {
    display: flex; align-items: center; gap: 4px; height: 46px; padding: 0 14px; border-radius: 18px; font-weight: 900; font-size: 20px; color: #3d5a1e; white-space: nowrap;
    background: linear-gradient(180deg, #fffdf0, #f3ecc8); border: 3px solid #6aa84f;
    box-shadow: inset 0 3px 0 #fff, 0 5px 0 #4f8a35, 0 8px 16px rgba(30,60,10,.25);
  }
  .leaf canvas { width: 30px; height: 30px; }
  .leaf canvas.off { opacity: .28; filter: grayscale(1); }
  .leaf canvas.pop { animation: kg-pop .5s cubic-bezier(.2,1.6,.4,1); }
  @media (max-width: 379px) { .mhud { top: 64px; } }
  @media (max-width: 420px) { .leaf { padding: 0 8px; font-size: 17px; height: 42px; gap: 3px; } .leaf canvas { width: 24px; height: 24px; } }
  #pad { position: fixed; z-index: 7500; display: none; width: 196px; height: 196px; touch-action: none; }
  #pad.show { display: block; }
  #pad button {
    position: absolute; width: 64px; height: 64px; border-radius: 22px; border: 4px solid #fff; cursor: pointer; touch-action: none;
    background: linear-gradient(180deg, #ffe680, #f5b42e); box-shadow: 0 5px 0 #c4850f, 0 8px 14px rgba(0,0,0,.2), inset 0 4px 0 rgba(255,255,255,.5);
    display: grid; place-items: center; padding: 0;
  }
  #pad button svg { width: 34px; height: 34px; }
  #pad button.on, #pad button:active { transform: translateY(4px); box-shadow: 0 1px 0 #c4850f, 0 3px 6px rgba(0,0,0,.2); }
  #pad .u { left: 66px; top: 0; } #pad .d { left: 66px; top: 132px; } #pad .l { left: 0; top: 66px; } #pad .r { left: 132px; top: 66px; }
  #pad .mid { position: absolute; left: 74px; top: 74px; width: 48px; height: 48px; border-radius: 50%; background: rgba(255,255,255,.55); box-shadow: inset 0 2px 6px rgba(0,0,0,.15); }
</style>
</head>
<body>
<canvas id="cv" class="gk-canvas"></canvas>
<div class="mhud" id="hud">
  <div class="leaf" id="hudLv">第 1 關</div>
  <div class="leaf" id="hudItems"></div>
</div>
<div id="pad">
  <div class="mid"></div>
  <button class="u" data-d="u" aria-label="上"><svg viewBox="0 0 40 40"><path d="M20 8 34 28H6Z" fill="#fff" stroke="#b5700a" stroke-width="4" stroke-linejoin="round"/></svg></button>
  <button class="d" data-d="d" aria-label="下"><svg viewBox="0 0 40 40"><path d="M20 32 34 12H6Z" fill="#fff" stroke="#b5700a" stroke-width="4" stroke-linejoin="round"/></svg></button>
  <button class="l" data-d="l" aria-label="左"><svg viewBox="0 0 40 40"><path d="M8 20 28 6V34Z" fill="#fff" stroke="#b5700a" stroke-width="4" stroke-linejoin="round"/></svg></button>
  <button class="r" data-d="r" aria-label="右"><svg viewBox="0 0 40 40"><path d="M32 20 12 6V34Z" fill="#fff" stroke="#b5700a" stroke-width="4" stroke-linejoin="round"/></svg></button>
</div>
<script src="../../assets/common.js"></script>
<script>
'use strict';
(() => {
  /* ===================== 共用遊戲套件（每個遊戲內嵌一份） ===================== */
  const TAU = Math.PI * 2;
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const lerp = (a, b, t) => a + (b - a) * t;
  const Ease = {
    linear: t => t,
    outQuad: t => 1 - (1 - t) * (1 - t),
    outCubic: t => 1 - Math.pow(1 - t, 3),
    inCubic: t => t * t * t,
    inQuad: t => t * t,
    inOutSine: t => -(Math.cos(Math.PI * t) - 1) / 2,
    outBack: t => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); },
    outElastic: t => t === 0 ? 0 : t === 1 ? 1 : Math.pow(2, -10 * t) * Math.sin((t * 10 - 0.75) * TAU / 3) + 1,
    outBounce: t => {
      const n1 = 7.5625, d1 = 2.75;
      if (t < 1 / d1) return n1 * t * t;
      if (t < 2 / d1) return n1 * (t -= 1.5 / d1) * t + 0.75;
      if (t < 2.5 / d1) return n1 * (t -= 2.25 / d1) * t + 0.9375;
      return n1 * (t -= 2.625 / d1) * t + 0.984375;
    }
  };

  /** 補間動畫：Tween.to(物件, {屬性: 目標}, 秒, 緩動, 延遲, 完成時) */
  const Tween = {
    list: [],
    to(obj, props, dur, ease, delay, done) {
      const tw = { obj, props, dur: Math.max(0.001, dur), ease: typeof ease === 'function' ? ease : (Ease[ease] || Ease.outCubic), t: -(delay || 0), from: null, done };
      this.list.push(tw);
      return tw;
    },
    update(dt) {
      const list = this.list.slice();
      for (let i = 0; i < list.length; i++) {
        const tw = list[i];
        if (tw.dead) continue;
        tw.t += dt;
        if (tw.t < 0) continue;
        if (!tw.from) { tw.from = {}; for (const k in tw.props) tw.from[k] = tw.obj[k]; }
        const k = Math.min(1, tw.t / tw.dur), e = tw.ease(k);
        for (const p in tw.props) tw.obj[p] = tw.from[p] + (tw.props[p] - tw.from[p]) * e;
        if (k >= 1) { tw.dead = true; if (tw.done) tw.done(); }
      }
      this.list = this.list.filter(t => !t.dead);
    },
    kill(obj, prop) { this.list.forEach(t => { if (t.obj === obj && (!prop || prop in t.props)) t.dead = true; }); },
    clear() { this.list.forEach(t => { t.dead = true; }); this.list = []; },
    busy(obj) { return this.list.some(t => !t.dead && (!obj || t.obj === obj)); }
  };

  /** 畫圖小工具 */
  const Draw = {
    rr(c, x, y, w, h, r) { c.beginPath(); c.roundRect(x, y, w, h, r); },
    starPath(c, x, y, r, inner, rot) {
      c.beginPath();
      for (let i = 0; i < 10; i++) {
        const rr = i % 2 ? r * (inner || 0.5) : r, a = (rot || 0) - Math.PI / 2 + i * Math.PI / 5;
        c.lineTo(x + Math.cos(a) * rr, y + Math.sin(a) * rr);
      }
      c.closePath();
    },
    heartPath(c, x, y, s) {
      c.beginPath();
      c.moveTo(x, y + s * 0.35);
      c.bezierCurveTo(x - s * 0.1, y + s * 0.25, x - s * 0.55, y + s * 0.02, x - s * 0.5, y - s * 0.22);
      c.bezierCurveTo(x - s * 0.45, y - s * 0.5, x - s * 0.08, y - s * 0.5, x, y - s * 0.25);
      c.bezierCurveTo(x + s * 0.08, y - s * 0.5, x + s * 0.45, y - s * 0.5, x + s * 0.5, y - s * 0.22);
      c.bezierCurveTo(x + s * 0.55, y + s * 0.02, x + s * 0.1, y + s * 0.25, x, y + s * 0.35);
      c.closePath();
    },
    /** 有光澤的星星 */
    star(c, x, y, r, on) {
      Draw.starPath(c, x, y + r * 0.08, r, 0.52);
      c.fillStyle = 'rgba(120,70,0,.25)'; c.fill();
      Draw.starPath(c, x, y, r, 0.52);
      const g = c.createLinearGradient(0, y - r, 0, y + r);
      if (on !== false) { g.addColorStop(0, '#fff3a0'); g.addColorStop(0.5, '#ffd23f'); g.addColorStop(1, '#f59e0b'); }
      else { g.addColorStop(0, '#eee'); g.addColorStop(1, '#bbb'); }
      c.fillStyle = g; c.fill();
      c.lineWidth = Math.max(1.5, r * 0.12); c.strokeStyle = on !== false ? '#d9822b' : '#999'; c.lineJoin = 'round'; c.stroke();
      c.fillStyle = 'rgba(255,255,255,.6)';
      c.beginPath(); c.ellipse(x - r * 0.2, y - r * 0.28, r * 0.18, r * 0.1, -0.6, 0, TAU); c.fill();
    },
    /** 可愛大眼睛。mode: open / happy / closed / sad / dizzy */
    eye(c, x, y, r, mode, lookX, lookY, ink) {
      ink = ink || '#3a2440';
      if (mode === 'happy') {
        c.strokeStyle = ink; c.lineWidth = r * 0.45; c.lineCap = 'round';
        c.beginPath(); c.arc(x, y + r * 0.35, r * 0.75, Math.PI * 1.15, Math.PI * 1.85); c.stroke();
        return;
      }
      if (mode === 'closed') {
        c.strokeStyle = ink; c.lineWidth = r * 0.4; c.lineCap = 'round';
        c.beginPath(); c.arc(x, y - r * 0.2, r * 0.7, Math.PI * 0.15, Math.PI * 0.85); c.stroke();
        return;
      }
      if (mode === 'dizzy') {
        c.strokeStyle = ink; c.lineWidth = r * 0.3; c.lineCap = 'round';
        c.beginPath();
        for (let a = 0; a < TAU * 1.6; a += 0.3) { const rr = r * 0.9 * a / (TAU * 1.6); c.lineTo(x + Math.cos(a) * rr, y + Math.sin(a) * rr); }
        c.stroke();
        return;
      }
      c.fillStyle = ink;
      c.beginPath(); c.ellipse(x, y, r * 0.86, r, 0, 0, TAU); c.fill();
      const lx = (lookX || 0) * r * 0.2, ly = (lookY || 0) * r * 0.2;
      c.fillStyle = '#fff';
      c.beginPath(); c.arc(x - r * 0.3 + lx, y - r * 0.38 + ly, r * 0.36, 0, TAU); c.fill();
      c.beginPath(); c.arc(x + r * 0.3 + lx, y + r * 0.35 + ly, r * 0.16, 0, TAU); c.fill();
      if (mode === 'sad') {
        c.strokeStyle = ink; c.lineWidth = r * 0.25; c.lineCap = 'round';
        c.beginPath(); c.moveTo(x - r * 0.8, y - r * 1.5); c.lineTo(x + r * 0.6, y - r * 1.2); c.stroke();
      }
    },
    blush(c, x, y, r, a) {
      c.fillStyle = 'rgba(255,105,140,' + (a == null ? 0.45 : a) + ')';
      c.beginPath(); c.ellipse(x, y, r, r * 0.62, 0, 0, TAU); c.fill();
    },
    shadow(c, x, y, rx, ry, a) {
      c.save(); c.translate(x, y); c.scale(1, ry / rx);
      const g = c.createRadialGradient(0, 0, 0, 0, 0, rx);
      g.addColorStop(0, 'rgba(30,20,50,' + (a == null ? 0.3 : a) + ')'); g.addColorStop(1, 'rgba(30,20,50,0)');
      c.fillStyle = g; c.beginPath(); c.arc(0, 0, rx, 0, TAU); c.fill(); c.restore();
    },
    /** 雲朵 */
    cloud(c, x, y, s, a) {
      c.save(); c.translate(x, y); c.scale(s, s);
      c.globalAlpha *= (a == null ? 1 : a);
      c.fillStyle = 'rgba(150,180,220,.35)';
      c.beginPath(); c.ellipse(4, 26, 64, 10, 0, 0, TAU); c.fill();
      const g = c.createLinearGradient(0, -34, 0, 30);
      g.addColorStop(0, '#ffffff'); g.addColorStop(1, '#e3efff');
      c.fillStyle = g;
      c.beginPath();
      [[-38, 10, 22], [-14, -4, 30], [16, -8, 28], [42, 8, 20], [2, 12, 26]].forEach(([a1, b, r]) => { c.moveTo(a1 + r, b); c.arc(a1, b, r, 0, TAU); });
      c.fill();
      c.fillStyle = 'rgba(255,255,255,.9)';
      c.beginPath(); c.ellipse(-16, -16, 14, 6, -0.3, 0, TAU); c.fill();
      c.restore();
    }
  };

  /** 粒子特效、浮動文字、畫面震動 */
  const FX = {
    parts: [], texts: [], rings: [], shakeT: 0, shakeMag: 0, hitStop: 0,
    burst(x, y, o) {
      o = o || {};
      const n = o.n || 14;
      for (let i = 0; i < n; i++) {
        const a = o.angle != null ? o.angle + KG.rand(-(o.spread || 0.6), o.spread || 0.6) : Math.random() * TAU;
        const v = KG.rand(o.speedMin || 80, o.speed || 260);
        this.parts.push({
          x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - (o.up == null ? 60 : o.up), g: o.gravity == null ? 420 : o.gravity,
          life: 1, decay: 1 / (o.life || 0.9) * KG.rand(0.8, 1.2), r: KG.rand(o.size || 6, (o.size || 6) * 1.7),
          rot: Math.random() * TAU, vr: KG.rand(-6, 6), shape: o.shape || 'star', c: KG.pick(o.colors || ['#ffd23f', '#ff8fb1', '#7fd1ff', '#9be27f', '#fff'])
        });
      }
    },
    ring(x, y, color, size) { this.rings.push({ x, y, r: 4, max: size || 60, life: 1, color: color || '#fff' }); },
    text(str, x, y, o) {
      o = o || {};
      if (o.tag) this.texts = this.texts.filter(t => t.tag !== o.tag);
      this.texts.push({ tag: o.tag, str, x, y, vy: o.vy == null ? -70 : o.vy, life: 1, dur: o.dur || 1.1, size: o.size || 30, color: o.color || '#fff', stroke: o.stroke || '#c2416c', scale: 0 });
    },
    shake(mag, t) { this.shakeMag = Math.max(this.shakeMag, mag); this.shakeT = Math.max(this.shakeT, t || 0.3); },
    update(dt) {
      this.parts.forEach(p => { p.vy += p.g * dt; p.x += p.vx * dt; p.y += p.vy * dt; p.vx *= 0.99; p.rot += p.vr * dt; p.life -= p.decay * dt; });
      this.parts = this.parts.filter(p => p.life > 0);
      this.rings.forEach(r => { r.life -= dt * 2.2; r.r = lerp(r.max, 4, Math.max(0, r.life)); });
      this.rings = this.rings.filter(r => r.life > 0);
      this.texts.forEach(t => { t.life -= dt / t.dur; t.y += t.vy * dt; t.vy *= 0.97; t.scale = Math.min(1, t.scale + dt * 5); });
      this.texts = this.texts.filter(t => t.life > 0);
      this.shakeT = Math.max(0, this.shakeT - dt);
      if (this.shakeT <= 0) this.shakeMag = 0;
    },
    offset() {
      if (this.shakeT <= 0) return [0, 0];
      const m = this.shakeMag * Math.min(1, this.shakeT * 4);
      return [KG.rand(-m, m), KG.rand(-m, m)];
    },
    draw(c, font) {
      this.rings.forEach(r => {
        c.globalAlpha = Math.max(0, r.life); c.strokeStyle = r.color; c.lineWidth = 5 * r.life + 1;
        c.beginPath(); c.arc(r.x, r.y, r.r, 0, TAU); c.stroke();
      });
      this.parts.forEach(p => {
        c.globalAlpha = Math.min(1, p.life * 1.6);
        c.fillStyle = p.c;
        c.save(); c.translate(p.x, p.y); c.rotate(p.rot);
        if (p.shape === 'star') { Draw.starPath(c, 0, 0, p.r, 0.45); c.fill(); }
        else if (p.shape === 'heart') { Draw.heartPath(c, 0, 0, p.r * 2); c.fill(); }
        else if (p.shape === 'confetti') { c.fillRect(-p.r * 0.6, -p.r * 0.3, p.r * 1.2, p.r * 0.6); }
        else { c.beginPath(); c.arc(0, 0, p.r * 0.7, 0, TAU); c.fill(); }
        c.restore();
      });
      c.globalAlpha = 1;
      this.texts.forEach(t => {
        const s = Ease.outBack(Math.min(1, t.scale));
        c.save(); c.translate(t.x, t.y); c.scale(s, s);
        c.globalAlpha = Math.min(1, t.life * 3);
        c.font = '900 ' + t.size + 'px ' + (font || 'sans-serif');
        c.textAlign = 'center'; c.textBaseline = 'middle'; c.lineJoin = 'round';
        c.lineWidth = t.size * 0.28; c.strokeStyle = t.stroke; c.strokeText(t.str, 0, 0);
        c.fillStyle = t.color; c.fillText(t.str, 0, 0);
        c.restore();
      });
      c.globalAlpha = 1;
    },
    clear() { this.parts = []; this.texts = []; this.rings = []; this.shakeT = 0; this.hitStop = 0; }
  };

  /** 背景音樂：用 KG.note 合成的循環小旋律（靜音時不發聲） */
  const Music = {
    timer: null, song: null, step: 0, next: 0,
    midi(m) { return 440 * Math.pow(2, (m - 69) / 12); },
    start(song) {
      this.stop();
      this.song = song; this.step = 0; this.next = performance.now() + 120;
      this.timer = setInterval(() => this.tick(), 50);
    },
    stop() { if (this.timer) clearInterval(this.timer); this.timer = null; this.song = null; },
    tick() {
      const s = this.song; if (!s) return;
      const now = performance.now();
      if (document.hidden || KG.isMuted() || !Music.unlocked) { this.next = now + 100; return; }
      const beat = 60000 / s.bpm / 2; // 八分音符
      if (this.next < now - 500) this.next = now;
      while (this.next < now + 160) {
        const delay = Math.max(0, (this.next - now) / 1000);
        const m = s.mel[this.step % s.mel.length];
        if (m) KG.note(this.midi(m), beat / 1000 * (s.legato || 0.9), s.wave || 'triangle', s.vol || 0.05, delay);
        if (s.bass) {
          const b = s.bass[this.step % s.bass.length];
          if (b) KG.note(this.midi(b), beat / 1000 * 1.6, 'sine', (s.vol || 0.05) * 1.2, delay);
        }
        this.step++;
        this.next += beat;
      }
    }
  };

  // 使用者第一次互動後才開始發聲（瀏覽器自動播放規則）
  ['pointerdown', 'keydown'].forEach(ev => window.addEventListener(ev, () => { Music.unlocked = true; }, { once: true, capture: true }));

  /** 小段音效 */
  const Jingle = {
    win() { [72, 76, 79, 84, 79, 84, 88].forEach((m, i) => KG.note(Music.midi(m), 0.2, 'triangle', 0.18, i * 0.11)); },
    star(i) { KG.note(Music.midi(76 + i * 4), 0.25, 'triangle', 0.22); KG.note(Music.midi(88 + i * 4), 0.3, 'sine', 0.12, 0.08); },
    unlock() { [79, 83, 86, 91].forEach((m, i) => KG.note(Music.midi(m), 0.18, 'sine', 0.18, i * 0.08)); },
    combo(n) { KG.note(Music.midi(72 + Math.min(n, 10) * 2), 0.15, 'triangle', 0.2); KG.note(Music.midi(79 + Math.min(n, 10) * 2), 0.2, 'triangle', 0.16, 0.07); },
    step(i) { KG.note(Music.midi(67 + (i % 8) * 2), 0.1, 'triangle', 0.16); }
  };

  /** 高解析度畫布 */
  function hiDPI(cv) {
    const ctx = cv.getContext('2d');
    const o = { ctx, W: 0, H: 0, DPR: 1 };
    o.fit = (w, h) => {
      o.DPR = Math.min(window.devicePixelRatio || 1, 2.5);
      o.W = w; o.H = h;
      cv.width = Math.round(w * o.DPR); cv.height = Math.round(h * o.DPR);
      ctx.setTransform(o.DPR, 0, 0, o.DPR, 0, 0);
    };
    return o;
  }

  /** 防止頁面捲動（選關畫面可以捲） */
  document.addEventListener('touchmove', e => { if (!e.target.closest || !e.target.closest('.lv-scr')) e.preventDefault(); }, { passive: false });

  /**
   * 標題、選關、結算畫面。
   * UI.init({ slug, title, subtitle, levels:[{label, colors}], items:[{name, need}], drawMascot(c,w,h,t), drawItem(c,i,w,h), onPlay(i), onItem(i), onMenu(), music })
   */
  const UI = {
    o: null, save: null, artT: 0, artRaf: 0, current: 0, bannerTimer: 0,
    init(o) {
      this.o = o;
      this.save = KG.store.get(o.slug + ':save', null) || { stars: [], item: 0 };
      if (!Array.isArray(this.save.stars)) this.save.stars = [];
      const mk = (cls, html) => { const d = document.createElement('div'); d.className = cls; d.innerHTML = html; document.body.appendChild(d); return d; };
      this.title = mk('scr title-scr',
        '<div class="title-wrap"><canvas class="title-art"></canvas><h1 class="logo">' + [...o.title].map((ch, i) => '<span style="animation-delay:' + (i * 0.12) + 's">' + ch + '</span>').join('') + '</h1>' +
        '<div class="subtitle">' + o.subtitle + '</div><button class="big-btn">開始</button></div>');
      this.lv = mk('scr lv-scr', '<div class="lv-head"><h2>選擇關卡</h2><div class="star-count"></div></div><div class="lv-grid"></div>' +
        (o.items && o.items.length ? '<div class="col-head">' + (o.itemsTitle || '收藏') + '</div><div class="col-row"></div>' : '') +
        '<button class="scr-btn alt lv-back">回標題</button>');
      this.res = mk('scr res-scr', '<div class="res-card"><div class="res-ribbon"></div><div class="res-stars"></div><div class="res-msg"></div><div class="res-unlock"></div><div class="res-btns"></div></div>');
      this.ban = mk('gk-banner', '<div class="t1"></div><div class="t2"></div>');
      this.title.querySelector('.big-btn').addEventListener('click', () => {
        KG.sound('pop');
        if (!this.save.started) { this.save.started = 1; this.persist(); this.play(0); }
        else this.showLevels();
      });
      this.lv.querySelector('.lv-back').addEventListener('click', () => { KG.sound('click'); this.showTitle(); });
      this.artCv = hiDPI(this.title.querySelector('.title-art'));
    },
    persist() { KG.store.set(this.o.slug + ':save', this.save); },
    total() { return this.save.stars.reduce((a, b) => a + (b || 0), 0); },
    stars(i) { return this.save.stars[i] || 0; },
    unlocked(i) { return i === 0 || this.stars(i - 1) > 0; },
    itemUnlocked(i) { return this.total() >= this.o.items[i].need; },
    item() { const i = this.save.item || 0; return this.o.items && this.o.items[i] && this.itemUnlocked(i) ? i : 0; },
    hideAll() { [this.title, this.lv, this.res].forEach(s => s.classList.remove('show')); cancelAnimationFrame(this.artRaf); this.artRaf = 0; },
    banner(t1, t2, dur) {
      const b = this.ban;
      b.querySelector('.t1').textContent = t1;
      const s2 = b.querySelector('.t2'); s2.textContent = t2 || ''; s2.style.display = t2 ? '' : 'none';
      b.classList.remove('show'); void b.offsetWidth; b.classList.add('show');
      clearTimeout(this.bannerTimer);
      this.bannerTimer = setTimeout(() => b.classList.remove('show'), (dur || 2) * 1000);
    },
    hideBanner() { clearTimeout(this.bannerTimer); this.ban.classList.remove('show'); },
    showTitle() {
      this.hideAll(); this.hideBanner();
      this.title.classList.add('show');
      if (this.o.music) Music.start(this.o.music);
      const r = this.title.querySelector('.title-art').getBoundingClientRect();
      this.artCv.fit(r.width || 260, r.height || 200);
      let last = performance.now();
      const loop = now => {
        this.artT += Math.min(0.05, (now - last) / 1000); last = now;
        const a = this.artCv;
        a.ctx.setTransform(a.DPR, 0, 0, a.DPR, 0, 0);
        a.ctx.clearRect(0, 0, a.W, a.H);
        this.o.drawMascot(a.ctx, a.W, a.H, this.artT);
        this.artRaf = requestAnimationFrame(loop);
      };
      this.artRaf = requestAnimationFrame(loop);
      if (this.o.onMenu) this.o.onMenu();
    },
    showLevels() {
      this.hideAll(); this.hideBanner();
      if (this.o.music && !Music.song) Music.start(this.o.music);
      const total = this.total(), max = this.o.levels.length * 3;
      this.lv.querySelector('.star-count').innerHTML = starSVG(true) + total + ' / ' + max;
      const grid = this.lv.querySelector('.lv-grid');

      this.o.levels.forEach((L, i) => {
        const b = document.createElement('button');
        const open = this.unlocked(i), st = this.stars(i);

          : '<div class="n" style="width:44px;height:44px">' + LOCK_SVG + '</div><div class="lb">' + (L.label || '') + '</div>';

      const newItem = (this.o.items || []).findIndex((_, k) => !itemsBefore[k] && this.itemUnlocked(k));
      this.hideAll();

      r.querySelector('.res-stars').innerHTML = [0, 1, 2].map(k => starSVG(k < o.stars)).join('');
      [...r.querySelectorAll('.res-stars svg')].forEach((s, k) => { s.style.animationDelay = (0.35 + k * 0.28) + 's'; });
      for (let k = 0; k < o.stars; k++) setTimeout(() => Jingle.star(k), 380 + k * 280);

      if (i + 1 < this.o.levels.length) add('下一關 ▶', 'go', () => this.play(i + 1));
      add('再玩一次', 'warm', () => this.play(i));

    { label: '12×12 夜晚', n: 12, theme: 'night', gates: 2, tip: '兩把鑰匙、兩扇門！' }
  ];
  const LV_COLORS = { garden: ['#a6e37f', '#5cb83a', '#3d8a2e'], box: ['#f0c98f', '#c98a4f', '#8a5a2a'], night: ['#9aa8ff', '#5a5fc0', '#363a8a'] };
  LEVELS.forEach(L => { L.colors = LV_COLORS[L.theme]; });
  const SKINS = [
    { name: '灰灰鼠', need: 0, fur: ['#d9d9e6', '#a9a9bd', '#6f6f86'], hat: null },
    { name: '粉紅鼠', need: 3, fur: ['#ffe0ec', '#ffb3cc', '#c96a8f'], hat: 'bow' },

    { name: '超人鼠', need: 24, fur: ['#d9d9e6', '#a9a9bd', '#6f6f86'], hat: 'cape' }
  ];
  const THEMES = {
    garden: { bg: ['#9be07a', '#5fb84a'], floor: ['#f7e7bd', '#ecd49a'], wall: ['#3f9a3a', '#5fc04f', '#8fe07a', '#2c6e28'] },
    box: { bg: ['#d6b48a', '#b88f60'], floor: ['#f2d2a0', '#e6bd80'], wall: ['#9a6a3a', '#c48c52', '#e6b47a', '#6b4422'] },
    night: { bg: ['#2d4a5a', '#1c3040'], floor: ['#5a6a7a', '#4a5868'], wall: ['#1f5a3a', '#2f7a4a', '#4f9a62', '#123a24'], dark: true }
  };
  const SONG = {
    bpm: 116, vol: 0.045, wave: 'triangle',
    mel: [76, 0, 79, 0, 81, 79, 76, 0, 74, 76, 74, 72, 74, 0, 0, 0, 76, 0, 79, 0, 84, 83, 81, 79, 77, 76, 74, 76, 72, 0, 0, 0],
    bass: [48, 0, 0, 55, 48, 0, 0, 55, 43, 0, 0, 50, 43, 0, 0, 50, 48, 0, 0, 55, 45, 0, 0, 52, 41, 0, 43, 0, 48, 0, 0, 0]
  };

  /* ---------- 狀態 ---------- */
  let W = 0, H = 0, ox = 0, oy = 0, cs = 40, size = 400, n = 5;
  let level = LEVELS[0], li = 0, theme = THEMES.garden, skin = SKINS[0];
  let cells = [], gates = [], keys = [], cookies = [], prints = [], fireflies = [], deco = [];
  let goal = [0, 0], got = 0, haveKeys = [], steps = 0;
  let playing = false, won = false, time = 0;
  const mouse = { r: 0, c: 0, x: 0, y: 0, moving: false, face: 1, sq: 0, bumpT: 0, mood: 'idle', moodT: 0, dir: 'r', run: null };
  let held = null, queued = null, dragging = null;
  const mazeCv = document.createElement('canvas');

  /* ---------- 迷宮生成（遞迴回溯法） ---------- */
  function genMaze(N) {
    const g = [];
    for (let r = 0; r < N; r++) { g.push([]); for (let c = 0; c < N; c++) g[r].push({ n: true, e: true, s: true, w: true, seen: false }); }
    const stack = [[0, 0]];
    g[0][0].seen = true;
    while (stack.length) {
      const [r, c] = stack[stack.length - 1];
      const opts = Object.keys(DIRS).filter(d => { const [dr, dc] = DIRS[d]; const r2 = r + dr, c2 = c + dc; return r2 >= 0 && r2 < N && c2 >= 0 && c2 < N && !g[r2][c2].seen; });
      if (!opts.length) { stack.pop(); continue; }
      const d = KG.pick(opts), [dr, dc] = DIRS[d];
      g[r][c][WALL[d]] = false; g[r + dr][c + dc][WALL[OPP[d]]] = false;
      g[r + dr][c + dc].seen = true;
      stack.push([r + dr, c + dc]);
    }
    return g;
  }

  const gateAt = (r, c, d) => gates.find(g => !g.open && ((g.r === r && g.c === c && g.d === d) || (g.r === r + DIRS[d][0] && g.c === c + DIRS[d][1] && g.d === OPP[d])));
  function canGo(r, c, d) {
    if (cells[r][c][WALL[d]]) return false;
    return !gateAt(r, c, d);
  }

  function bfs(sr, sc, blockGates) {
    const dist = cells.map(row => row.map(() => -1)), par = cells.map(row => row.map(() => null));
    const q = [[sr, sc]]; dist[sr][sc] = 0;
    while (q.length) {
      const [r, c] = q.shift();
      for (const d in DIRS) {
        if (cells[r][c][WALL[d]]) continue;
        if (blockGates && gateAt(r, c, d)) continue;
        const r2 = r + DIRS[d][0], c2 = c + DIRS[d][1];
        if (dist[r2][c2] < 0) { dist[r2][c2] = dist[r][c] + 1; par[r2][c2] = [r, c, d]; q.push([r2, c2]); }
      }
    }
    return { dist, par };
  }

  function buildLevel() {
    n = level.n;
    cells = genMaze(n);
    gates = []; keys = []; cookies = []; prints = []; haveKeys = [];
    goal = [n - 1, n - 1];
    // 起點到終點的路
    const { par } = bfs(0, 0, false);
    const path = [];
    let cur = goal;
    while (cur && !(cur[0] === 0 && cur[1] === 0)) { const p = par[cur[0]][cur[1]]; path.unshift({ r: p[0], c: p[1], d: p[2] }); cur = [p[0], p[1]]; }
    const colors = [['#ff7aa8', '#c2416c'], ['#5ab8ff', '#1d6fd6']];
    const used = new Set(['0,0', goal.join(',')]);
    for (let k = 0; k < level.gates; k++) {
      const idx = Math.floor(path.length * (level.gates === 1 ? 0.55 : (k === 0 ? 0.35 : 0.72)));
      const e = path[clamp(idx, 1, path.length - 1)];
      gates.push({ r: e.r, c: e.c, d: e.d, open: false, col: colors[k], k, anim: 0 });
    }
    // 每把鑰匙放在「還打不開下一扇門」時走得到、而且最遠的地方
    for (let k = 0; k < gates.length; k++) {
      const saved = gates.map(g => g.open);
      gates.forEach((g, i) => { g.open = i < k; });
      const { dist } = bfs(0, 0, true);
      let best = null, bd = -1;
      for (let r = 0; r < n; r++) for (let c = 0; c < n; c++) {
        if (dist[r][c] < 0 || used.has(r + ',' + c)) continue;
        const score = dist[r][c] + (deadEnd(r, c) ? 3 : 0) + Math.random();
        if (score > bd) { bd = score; best = [r, c]; }
      }
      gates.forEach((g, i) => { g.open = saved[i]; });
      if (best) { keys.push({ r: best[0], c: best[1], k, col: gates[k].col, got: false }); used.add(best.join(',')); }
    }
    // 兩塊餅乾放在死路（離路線遠一點）
    const onPath = new Set(path.map(p => p.r + ',' + p.c));
    const cand = [];
    for (let r = 0; r < n; r++) for (let c = 0; c < n; c++) if (!used.has(r + ',' + c) && !onPath.has(r + ',' + c)) cand.push([r, c, deadEnd(r, c) ? 2 : 0]);
    const pickFar = () => {
      let best = null, bs = -1;
      cand.forEach(p => {
        if (used.has(p[0] + ',' + p[1])) return;
        const md = Math.min(...[...used].map(u => { const [a, b] = u.split(',').map(Number); return Math.abs(a - p[0]) + Math.abs(b - p[1]); }));
        const s = md + p[2] + Math.random() * 1.5;
        if (s > bs) { bs = s; best = p; }
      });
      if (best) { cookies.push({ r: best[0], c: best[1], got: false }); used.add(best[0] + ',' + best[1]); }
    };
    pickFar(); pickFar();
    while (cookies.length < 2) { const r = KG.randInt(0, n - 1), c = KG.randInt(0, n - 1); if (!used.has(r + ',' + c)) { cookies.push({ r, c, got: false }); used.add(r + ',' + c); } }
  }
  function deadEnd(r, c) { return ['n', 'e', 's', 'w'].filter(w => !cells[r][c][w]).length === 1; }

  /* ---------- 版面 ---------- */
  function layout() {
    W = innerWidth; H = innerHeight;
    view.fit(W, H);
    const land = W > H * 1.1;
    const top = W < 380 ? 116 : 72;
    if (land) {
      size = Math.min(H - top - 34, W - 220 - 40, 760);
      ox = Math.round(Math.max(16, (W - 210 - size) / 2)); oy = Math.round(top + 6 + (H - top - 34 - size) / 2);
      pad.style.left = Math.round(Math.min(W - 206, ox + size + (W - ox - size - 196) / 2)) + 'px';
      pad.style.top = Math.round(Math.max(top, H - 216)) + 'px';
      pad.style.transform = '';
    } else {
      const padH = H - top > W * 1.35 ? 206 : 0;
      size = Math.min(W - 40, H - top - padH - 24, 760);
      ox = Math.round((W - size) / 2); oy = Math.round(top + Math.max(0, (H - top - padH - size) * 0.3));
      if (padH) {
        const scale = clamp((H - oy - size - 16) / 200, 0.7, 1);
        pad.style.left = Math.round(W / 2 - 98) + 'px';
        pad.style.top = Math.round(oy + size + 10 + Math.max(0, (H - oy - size - 10 - 200 * scale) / 2)) + 'px';
        pad.style.transform = 'scale(' + scale + ')'; pad.style.transformOrigin = '50% 0';
      } else { pad.style.left = (W - 206) + 'px'; pad.style.top = (H - 206) + 'px'; pad.style.transform = 'scale(.7)'; pad.style.transformOrigin = '100% 100%'; }
    }
    cs = size / n;
    drawMaze();
  }

  /* ---------- 背景與迷宮（靜態快取） ---------- */
  function drawMaze() {
    mazeCv.width = cv.width; mazeCv.height = cv.height;
    const c = mazeCv.getContext('2d');
    c.setTransform(view.DPR, 0, 0, view.DPR, 0, 0);
    const T = theme;
    let g = c.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, T.bg[0]); g.addColorStop(1, T.bg[1]);
    c.fillStyle = g; c.fillRect(0, 0, W, H);
    // 背景裝飾
    const rnd = mulberry(level.n * 31 + li);
    if (theme === THEMES.box) {
      c.strokeStyle = 'rgba(120,80,40,.15)'; c.lineWidth = 2;
      for (let y = 0; y < H; y += 10) { c.beginPath(); c.moveTo(0, y); c.lineTo(W, y); c.stroke(); }
      for (let i = 0; i < 6; i++) { c.fillStyle = 'rgba(255,255,255,.18)'; c.save(); c.translate(rnd() * W, rnd() * H); c.rotate(rnd() - 0.5); c.fillRect(-40, -12, 80, 24); c.restore(); }
    } else {
      for (let i = 0; i < W * H / 2500; i++) {
        const x = rnd() * W, y = rnd() * H;
        c.strokeStyle = T.dark ? 'rgba(80,140,110,.5)' : 'rgba(60,140,40,.45)'; c.lineWidth = 2; c.lineCap = 'round';
        c.beginPath(); c.moveTo(x - 3, y); c.lineTo(x - 5, y - 7); c.moveTo(x, y); c.lineTo(x, y - 9); c.moveTo(x + 3, y); c.lineTo(x + 5, y - 7); c.stroke();
      }
      for (let i = 0; i < W * H / 9000; i++) {
        const x = rnd() * W, y = rnd() * H, col = ['#fff', '#ffd23f', '#ff8fb1', '#b49cff'][Math.floor(rnd() * 4)];
        c.fillStyle = T.dark ? 'rgba(255,255,255,.35)' : col;
        for (let k = 0; k < 5; k++) { c.beginPath(); c.arc(x + Math.cos(k * 1.256) * 4, y + Math.sin(k * 1.256) * 4, 3, 0, TAU); c.fill(); }
        c.fillStyle = '#ffcf3d'; c.beginPath(); c.arc(x, y, 2.5, 0, TAU); c.fill();
      }
    }
    if (!cells.length) return;
    // 地板
    const pad2 = Math.min(cs * 0.5, 22);
    c.save();
    c.shadowColor = 'rgba(0,0,0,.3)'; c.shadowBlur = 20; c.shadowOffsetY = 8;
    Draw.rr(c, ox - pad2 * 0.6, oy - pad2 * 0.6, size + pad2 * 1.2, size + pad2 * 1.2, pad2);
    g = c.createLinearGradient(0, oy, 0, oy + size);
    g.addColorStop(0, T.floor[0]); g.addColorStop(1, T.floor[1]);
    c.fillStyle = g; c.fill();
    c.restore();
    // 地板紋理
    for (let r = 0; r < n; r++) for (let cc = 0; cc < n; cc++) {
      if ((r + cc) % 2) { c.fillStyle = 'rgba(255,255,255,.12)'; c.fillRect(ox + cc * cs, oy + r * cs, cs, cs); }
      if (theme !== THEMES.box && rnd() < 0.5) { c.fillStyle = 'rgba(150,110,60,.18)'; c.beginPath(); c.arc(ox + (cc + rnd()) * cs, oy + (r + rnd()) * cs, cs * 0.04 + 1, 0, TAU); c.fill(); }
    }
    // 牆壁線段
    const segs = [];
    for (let r = 0; r < n; r++) for (let cc = 0; cc < n; cc++) {
      const x = ox + cc * cs, y = oy + r * cs, k = cells[r][cc];
      if (k.n) segs.push([x, y, x + cs, y]);
      if (k.w) segs.push([x, y, x, y + cs]);
      if (r === n - 1 && k.s) segs.push([x, y + cs, x + cs, y + cs]);
      if (cc === n - 1 && k.e) segs.push([x + cs, y, x + cs, y + cs]);
    }
    const wt = Math.max(6, cs * 0.24);
    const stroke = (col, w, dy) => {
      c.strokeStyle = col; c.lineWidth = w; c.lineCap = 'round';
      c.beginPath(); segs.forEach(([a, b, d, e]) => { c.moveTo(a, b + dy); c.lineTo(d, e + dy); }); c.stroke();
    };
    stroke('rgba(0,0,0,.22)', wt, wt * 0.45);
    stroke(T.wall[3], wt + 3, 0);
    stroke(T.wall[0], wt, 0);
    stroke(T.wall[1], wt * 0.62, -wt * 0.12);
    stroke(T.wall[2], wt * 0.22, -wt * 0.25);
    // 樹籬上的小花／紙箱的膠帶
    segs.forEach(([a, b, d, e]) => {
      if (rnd() > 0.35) return;
      const t = rnd(), x = a + (d - a) * t, y = b + (e - b) * t;
      if (theme === THEMES.box) { c.fillStyle = 'rgba(240,220,170,.85)'; c.save(); c.translate(x, y); c.rotate(a === d ? Math.PI / 2 : 0); c.fillRect(-wt * 0.5, -wt * 0.55, wt, wt * 1.1); c.restore(); }
      else {
        const col = T.dark ? '#c9d6ff' : ['#fff', '#ffd23f', '#ff8fb1'][Math.floor(rnd() * 3)];
        c.fillStyle = col;
        for (let k = 0; k < 5; k++) { c.beginPath(); c.arc(x + Math.cos(k * 1.256) * wt * 0.18, y - wt * 0.1 + Math.sin(k * 1.256) * wt * 0.18, wt * 0.13, 0, TAU); c.fill(); }
        c.fillStyle = '#ffb400'; c.beginPath(); c.arc(x, y - wt * 0.1, wt * 0.1, 0, TAU); c.fill();
      }
    });
    // 起點小洞
    const sx = ox + cs * 0.5, sy = oy + cs * 0.5;
    c.fillStyle = '#5a3a20'; c.beginPath(); c.ellipse(sx, sy + cs * 0.22, cs * 0.3, cs * 0.14, 0, 0, TAU); c.fill();
    c.fillStyle = '#2a1a0a'; c.beginPath(); c.ellipse(sx, sy + cs * 0.24, cs * 0.24, cs * 0.1, 0, 0, TAU); c.fill();
  }
  function mulberry(a) { return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

  /* ---------- 角色與物品 ---------- */
  function drawHat(c, kind, s) {
    c.lineJoin = 'round'; c.lineWidth = 2 * s;
    if (kind === 'bow') {
      c.fillStyle = '#ff5c8a'; c.strokeStyle = '#b02a5a';
      [-1, 1].forEach(d => { c.beginPath(); c.moveTo(10 * s, -30 * s); c.lineTo(10 * s + d * 11 * s, -37 * s); c.lineTo(10 * s + d * 11 * s, -23 * s); c.closePath(); c.fill(); c.stroke(); });
      c.beginPath(); c.arc(10 * s, -30 * s, 3.5 * s, 0, TAU); c.fill(); c.stroke();
    } else if (kind === 'chef') {
      c.fillStyle = '#fff'; c.strokeStyle = '#b9b9c9';
      c.beginPath(); c.arc(-6 * s, -40 * s, 8 * s, 0, TAU); c.arc(6 * s, -42 * s, 9 * s, 0, TAU); c.arc(0, -46 * s, 8 * s, 0, TAU); c.fill(); c.stroke();
      Draw.rr(c, -11 * s, -38 * s, 22 * s, 10 * s, 3 * s); c.fill(); c.stroke();
    } else if (kind === 'explorer') {
      c.fillStyle = '#d9b26a'; c.strokeStyle = '#8a6a2a';
      c.beginPath(); c.ellipse(0, -30 * s, 20 * s, 5 * s, 0, 0, TAU); c.fill(); c.stroke();
      c.beginPath(); c.ellipse(0, -33 * s, 11 * s, 9 * s, 0, Math.PI, 0); c.fill(); c.stroke();
      c.fillStyle = '#6b4a1a'; c.fillRect(-11 * s, -34 * s, 22 * s, 3 * s);
    } else if (kind === 'crown') {
      c.fillStyle = '#ffd23f'; c.strokeStyle = '#c4891a';
      c.beginPath(); c.moveTo(-10 * s, -28 * s); c.lineTo(-12 * s, -42 * s); c.lineTo(-5 * s, -35 * s); c.lineTo(0, -45 * s); c.lineTo(5 * s, -35 * s); c.lineTo(12 * s, -42 * s); c.lineTo(10 * s, -28 * s); c.closePath(); c.fill(); c.stroke();
      c.fillStyle = '#ff5c8a'; c.beginPath(); c.arc(0, -33 * s, 2.5 * s, 0, TAU); c.fill();
    }
  }

  function drawMouse(c, x, y, s, sk, t, o) {
    o = o || {};
    const mood = o.mood || 'idle', face = o.face || 1, walk = o.walk || 0, sq = o.sq || 0;
    const hop = mood === 'happy' ? Math.abs(Math.sin(t * 9)) * 12 * s : Math.abs(Math.sin(walk * Math.PI)) * 3 * s;
    Draw.shadow(c, x, y + 16 * s, 20 * s, 6 * s, 0.3);
    c.save();
    c.translate(x, y - hop);
    const breathe = Math.sin(t * 3) * 0.03;
    c.scale(face * (1 + sq * 0.25 + breathe), 1 - sq * 0.25 - breathe);
    const [f0, f1, f2] = sk.fur;
    c.lineJoin = 'round'; c.lineCap = 'round';
    // 披風
    if (sk.hat === 'cape') {
      c.fillStyle = '#ff4d6d'; c.strokeStyle = '#a8183a'; c.lineWidth = 2 * s;
      c.beginPath(); c.moveTo(-8 * s, -6 * s); c.quadraticCurveTo(-30 * s, 6 * s + Math.sin(t * 6) * 3 * s, -24 * s, 18 * s); c.lineTo(4 * s, 14 * s); c.closePath(); c.fill(); c.stroke();
    }
    // 尾巴
    c.strokeStyle = '#ff9fbf'; c.lineWidth = 3.2 * s;
    c.beginPath(); c.moveTo(-12 * s, 10 * s); c.bezierCurveTo(-28 * s, 14 * s, -30 * s, -4 * s + Math.sin(t * 4) * 4 * s, -22 * s, -8 * s); c.stroke();
    // 身體
    let g = c.createRadialGradient(-4 * s, -2 * s, 2, 0, 4 * s, 22 * s);
    g.addColorStop(0, f0); g.addColorStop(1, f1);
    c.fillStyle = g; c.strokeStyle = f2; c.lineWidth = 2.2 * s;
    c.beginPath(); c.ellipse(0, 6 * s, 15 * s, 13 * s, 0, 0, TAU); c.fill(); c.stroke();
    c.fillStyle = '#fff6f8'; c.beginPath(); c.ellipse(2 * s, 9 * s, 8 * s, 7 * s, 0, 0, TAU); c.fill();
    // 腳
    c.fillStyle = '#ffb3c8';
    const st = Math.sin(walk * Math.PI * 2) * 3 * s;
    c.beginPath(); c.ellipse(-6 * s + st, 18 * s, 5 * s, 3 * s, 0, 0, TAU); c.ellipse(7 * s - st, 18 * s, 5 * s, 3 * s, 0, 0, TAU); c.fill();
    // 耳朵
    [-1, 1].forEach(d => {
      c.fillStyle = f1; c.strokeStyle = f2;
      c.beginPath(); c.arc(d * 13 * s, -22 * s, 10 * s, 0, TAU); c.fill(); c.stroke();
      c.fillStyle = '#ffb3c8'; c.beginPath(); c.arc(d * 13 * s, -22 * s, 6 * s, 0, TAU); c.fill();
    });
    // 頭
    g = c.createRadialGradient(-5 * s, -16 * s, 2, 0, -10 * s, 18 * s);
    g.addColorStop(0, f0); g.addColorStop(1, f1);
    c.fillStyle = g; c.strokeStyle = f2;
    c.beginPath(); c.ellipse(0, -10 * s, 16 * s, 14 * s, 0, 0, TAU); c.fill(); c.stroke();
    c.fillStyle = 'rgba(255,255,255,.6)'; c.beginPath(); c.ellipse(-6 * s, -18 * s, 5 * s, 2.5 * s, -0.4, 0, TAU); c.fill();
    // 臉
    const blink = (t % 3.3) > 3.15;
    const em = mood === 'happy' ? 'happy' : mood === 'dizzy' ? 'dizzy' : blink ? 'closed' : 'open';
    Draw.eye(c, -2 * s, -11 * s, 3.6 * s, em, 0.6, 0);
    Draw.eye(c, 8 * s, -11 * s, 3.6 * s, em, 0.6, 0);
    Draw.blush(c, -7 * s, -4 * s, 3.2 * s); Draw.blush(c, 13 * s, -4 * s, 3.2 * s);
    c.fillStyle = '#ff6b9a'; c.beginPath(); c.arc(14 * s, -7 * s, 2.6 * s, 0, TAU); c.fill();
    c.strokeStyle = 'rgba(70,50,60,.55)'; c.lineWidth = 0.9 * s;
    [[-2, 0], [1, 0], [-1, 3]].forEach(([a, b]) => { c.beginPath(); c.moveTo(14 * s, -6 * s); c.lineTo(24 * s, (-8 + a * 2 + b) * s); c.stroke(); });
    c.strokeStyle = '#5a3a48'; c.lineWidth = 1.4 * s;
    if (mood === 'happy') { c.fillStyle = '#c2416c'; c.beginPath(); c.arc(9 * s, -3 * s, 3 * s, 0, Math.PI); c.fill(); }
    else { c.beginPath(); c.arc(8 * s, -4 * s, 2.2 * s, 0.2, Math.PI - 0.2); c.stroke(); }
    if (sk.hat && sk.hat !== 'cape') drawHat(c, sk.hat, s);
    c.restore();
  }

  function drawCheese(c, x, y, s, t, eaten) {
    const e = eaten || 0;
    if (e >= 1) return;
    c.save(); c.translate(x, y + Math.sin(t * 2.5) * 1.5 * s); c.scale(1 - e * 0.6, 1 - e * 0.6);
    // 光暈
    const gl = c.createRadialGradient(0, 0, 0, 0, 0, 30 * s);
    gl.addColorStop(0, 'rgba(255,240,150,.7)'); gl.addColorStop(1, 'rgba(255,240,150,0)');
    c.fillStyle = gl; c.beginPath(); c.arc(0, 0, 30 * s, 0, TAU); c.fill();
    Draw.shadow(c, 0, 13 * s, 18 * s, 5 * s, 0.3);
    c.lineJoin = 'round';
    // 側面
    c.fillStyle = '#f5b82e'; c.strokeStyle = '#a8700a'; c.lineWidth = 2 * s;
    c.beginPath(); c.moveTo(-18 * s, 0); c.lineTo(16 * s, -8 * s); c.lineTo(16 * s, 8 * s); c.lineTo(-18 * s, 14 * s); c.closePath(); c.fill(); c.stroke();
    // 頂面
    const g = c.createLinearGradient(0, -16 * s, 0, 0);
    g.addColorStop(0, '#fff2a0'); g.addColorStop(1, '#ffd23f');
    c.fillStyle = g;
    c.beginPath(); c.moveTo(-18 * s, 0); c.lineTo(6 * s, -18 * s); c.lineTo(16 * s, -8 * s); c.closePath(); c.fill(); c.stroke();
    // 洞
    c.fillStyle = '#e09a14';
    [[-6, 6, 3], [6, 2, 2.4], [8, 9, 1.8], [-12, 9, 1.8]].forEach(([a, b, r]) => { c.beginPath(); c.arc(a * s, b * s, r * s, 0, TAU); c.fill(); });
    c.fillStyle = '#f0b830'; c.beginPath(); c.ellipse(2 * s, -8 * s, 3 * s, 1.6 * s, -0.5, 0, TAU); c.fill();
    // 閃亮
    c.globalAlpha = (Math.sin(t * 4) + 1) / 2;
    Draw.starPath(c, 14 * s, -18 * s, 5 * s, 0.35); c.fillStyle = '#fff'; c.fill();
    c.restore();
  }

  function drawCookie(c, x, y, s, t) {
    c.save(); c.translate(x, y + Math.sin(t * 3 + x) * 1.5 * s); c.rotate(Math.sin(t * 1.5 + y) * 0.1);
    Draw.shadow(c, 0, 10 * s, 11 * s, 3.5 * s, 0.28);
    const g = c.createRadialGradient(-3 * s, -3 * s, 1, 0, 0, 11 * s);
    g.addColorStop(0, '#f5d39a'); g.addColorStop(1, '#c98a45');
    c.fillStyle = g; c.strokeStyle = '#8a5520'; c.lineWidth = 1.8 * s;
    c.beginPath(); c.arc(0, 0, 10 * s, 0, TAU); c.fill(); c.stroke();
    c.fillStyle = '#5a3218';
    [[-4, -3], [3, -4], [4, 3], [-3, 4], [0, 0]].forEach(([a, b]) => { c.beginPath(); c.arc(a * s, b * s, 1.7 * s, 0, TAU); c.fill(); });
    c.fillStyle = 'rgba(255,255,255,.45)'; c.beginPath(); c.ellipse(-4 * s, -6 * s, 3 * s, 1.4 * s, -0.5, 0, TAU); c.fill();
    c.restore();
  }

  function drawKey(c, x, y, s, col, t) {
    c.save(); c.translate(x, y + Math.sin(t * 3) * 2 * s); c.rotate(-0.6 + Math.sin(t * 2) * 0.15);
    c.lineJoin = 'round';
    c.fillStyle = col[0]; c.strokeStyle = col[1]; c.lineWidth = 2 * s;
    c.beginPath(); c.arc(-8 * s, 0, 7 * s, 0, TAU); c.fill(); c.stroke();
    c.fillStyle = '#fff'; c.beginPath(); c.arc(-8 * s, 0, 2.6 * s, 0, TAU); c.fill();
    c.fillStyle = col[0];
    c.beginPath(); c.rect(-2 * s, -2.5 * s, 16 * s, 5 * s); c.fill(); c.stroke();
    c.beginPath(); c.rect(8 * s, 2 * s, 3 * s, 5 * s); c.rect(12 * s, 2 * s, 3 * s, 4 * s); c.fill(); c.stroke();
    c.fillStyle = 'rgba(255,255,255,.6)'; c.beginPath(); c.ellipse(-10 * s, -3 * s, 2.5 * s, 1.2 * s, -0.5, 0, TAU); c.fill();
    c.restore();
  }

  function drawGate(g) {
    const [dr, dc] = DIRS[g.d];
    // 門在兩格中間的牆線上
    const cx = ox + (g.c + 0.5 + dc * 0.5) * cs, cy = oy + (g.r + 0.5 + dr * 0.5) * cs;
    const horiz = dr !== 0; // 上下移動 → 門是水平的
    const len = cs * 0.92, th = Math.max(6, cs * 0.2);
    const a = g.anim; // 0 關、1 開
    if (a >= 1) return;
    ctx.save(); ctx.translate(cx, cy); if (!horiz) ctx.rotate(Math.PI / 2);
    ctx.globalAlpha = 1 - a;
    ctx.scale(1, 1 - a * 0.8);
    ctx.fillStyle = 'rgba(0,0,0,.2)'; Draw.rr(ctx, -len / 2, -th / 2 + 3, len, th, th / 2); ctx.fill();
    const gr = ctx.createLinearGradient(0, -th / 2, 0, th / 2);
    gr.addColorStop(0, g.col[0]); gr.addColorStop(1, g.col[1]);
    ctx.fillStyle = gr; ctx.strokeStyle = 'rgba(60,20,40,.6)'; ctx.lineWidth = 2;
    Draw.rr(ctx, -len / 2, -th / 2, len, th, th / 2); ctx.fill(); ctx.stroke();
    // 鎖
    ctx.fillStyle = '#ffd23f'; ctx.strokeStyle = '#a8700a';
    Draw.rr(ctx, -th * 0.55, -th * 0.6, th * 1.1, th * 1.2, th * 0.25); ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#6b4a10'; ctx.beginPath(); ctx.arc(0, -th * 0.08, th * 0.16, 0, TAU); ctx.fill();
    ctx.fillRect(-th * 0.06, -th * 0.08, th * 0.12, th * 0.32);
    ctx.restore();
  }

  function drawPrint(p) {
    const s = cs / 60;
    ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.ang);
    ctx.globalAlpha = Math.min(0.45, p.life * 0.45);
    ctx.fillStyle = theme.dark ? '#d0d8ff' : '#8a5a35';
    ctx.beginPath(); ctx.ellipse(0, 0, 4 * s, 3.2 * s, 0, 0, TAU); ctx.fill();
    [[-4, -4], [-1, -6], [2, -6], [5, -4]].forEach(([a, b]) => { ctx.beginPath(); ctx.arc(b * s * -1 - 2 * s, a * s * 0.8, 1.5 * s, 0, TAU); ctx.fill(); });
    ctx.restore();
    ctx.globalAlpha = 1;
  }

  function drawMascot(c, w, h, t) {
    const s = Math.min(w / 220, h / 180);
    const tt = t % 4;
    const mx = w * 0.32 + Math.min(1, tt / 2) * w * 0.22;
    drawCheese(c, w * 0.72, h * 0.62, s * 1.6, t, 0);
    drawMouse(c, mx, h * 0.6, s * 1.5, SKINS[UI.item()], t, { mood: tt > 2 ? 'happy' : 'idle', face: 1, walk: tt < 2 ? t * 3 : 0 });
    if (tt > 2) { c.globalAlpha = 1 - (tt - 2) / 2; Draw.heartPath(c, mx + 10 * s, h * 0.3 - (tt - 2) * 20 * s, 18 * s); c.fillStyle = '#ff6b9a'; c.fill(); c.globalAlpha = 1; }
  }

  function drawItem(c, i, w, h) {
    const g = c.createLinearGradient(0, 0, 0, h);
    g.addColorStop(0, '#e6f9d8'); g.addColorStop(1, '#bfe8a5');
    c.fillStyle = g; Draw.rr(c, 0, 0, w, h, 12); c.fill();
    drawMouse(c, w / 2, h * 0.6, h / 64, SKINS[i], 1, { face: 1 });
  }

  /* ---------- 移動 ---------- */
  function tryStep(d, fromRun) {
    if (mouse.moving || !playing) return false;
    const [dr, dc] = DIRS[d];
    if (dc) mouse.face = dc;
    mouse.dir = d;
    if (!canGo(mouse.r, mouse.c, d)) {
      if (!fromRun && mouse.bumpT <= 0) {
        mouse.bumpT = 0.35;
        const g = gateAt(mouse.r, mouse.c, d);
        if (g) { KG.sound('wrong'); FX.text('要先找鑰匙！', ox + (mouse.c + 0.5) * cs, oy + mouse.r * cs, { size: Math.max(20, cs * 0.4), stroke: g.col[1] }); }
        else KG.sound('hit');
        mouse.sq = 0.6; Tween.to(mouse, { sq: 0 }, 0.4, 'outElastic');
        FX.burst(ox + (mouse.c + 0.5 + dc * 0.45) * cs, oy + (mouse.r + 0.5 + dr * 0.45) * cs, { n: 5, shape: 'circle', colors: ['#fff', '#e8d6b0'], size: 3, speed: 90, up: 20, gravity: 100, life: 0.4 });
      }
      return false;
    }
    mouse.moving = true;
    const fr = mouse.r, fc = mouse.c;
    mouse.r += dr; mouse.c += dc;
    steps++;
    prints.push({ x: ox + (fc + 0.5 + dc * 0.15) * cs + (dr ? (steps % 2 ? 1 : -1) * cs * 0.08 : 0), y: oy + (fr + 0.62 + dr * 0.15) * cs + (dc ? (steps % 2 ? 1 : -1) * cs * 0.06 : 0), ang: Math.atan2(dr, dc), life: 1 });
    if (prints.length > 90) prints.shift();
    KG.note(steps % 2 ? 880 : 990, 0.04, 'sine', 0.06);
    Tween.to(mouse, { x: mouse.c, y: mouse.r }, 0.15, 'linear', 0, () => { mouse.moving = false; arrive(); });
    return true;
  }

  function arrive() {
    const r = mouse.r, c = mouse.c;
    const px = ox + (c + 0.5) * cs, py = oy + (r + 0.5) * cs;
    let stop = false;
    cookies.forEach((k, i) => {
      if (!k.got && k.r === r && k.c === c) {
        k.got = true; got++; stop = true;
        KG.sound('coin');
        FX.burst(px, py, { n: 14, colors: ['#f5d39a', '#ffd23f', '#fff'], size: cs * 0.08 });
        FX.text(got === 2 ? '好棒！兩塊餅乾！' : '吃到餅乾！', px, py - cs * 0.6, { size: Math.max(22, cs * 0.45), stroke: '#8a5520' });
        mouse.mood = 'happy'; mouse.moodT = 0.8;
        refreshHud(i);
      }
    });
    keys.forEach(k => {
      if (!k.got && k.r === r && k.c === c) {
        k.got = true; stop = true;
        haveKeys.push(k.k);
        KG.sound('sparkle');
        FX.burst(px, py, { n: 16, colors: [k.col[0], '#fff', '#ffd23f'], size: cs * 0.09 });
        FX.text('拿到鑰匙！', px, py - cs * 0.6, { size: Math.max(22, cs * 0.45), stroke: k.col[1] });
        const g = gates[k.k];
        setTimeout(() => {
          KG.sound('pop');
          Tween.to(g, { anim: 1 }, 0.6, 'outBack', 0, () => { g.open = true; });
          g.open = true;
          const [dr, dc] = DIRS[g.d];
          FX.burst(ox + (g.c + 0.5 + dc * 0.5) * cs, oy + (g.r + 0.5 + dr * 0.5) * cs, { n: 18, colors: [g.col[0], '#fff', '#ffd23f'], size: cs * 0.09, speed: 200 });
          FX.text('門打開了！', ox + (g.c + 0.5) * cs, oy + (g.r + 0.2) * cs, { size: Math.max(22, cs * 0.45), stroke: g.col[1] });
        }, 350);
        refreshHud();
      }
    });
    if (r === goal[0] && c === goal[1]) { win(); return; }
    // 滑動時沿著走道自動走到路口
    if (mouse.run && !stop) {
      const back = OPP[mouse.run];
      const opts = Object.keys(DIRS).filter(d => d !== back && canGo(r, c, d));
      if (opts.length === 1) { mouse.run = opts[0]; tryStep(opts[0], true); return; }
    }
    mouse.run = null;
  }

  function win() {
    playing = false; won = true;
    mouse.mood = 'happy'; mouse.moodT = 99;
    const px = ox + (goal[1] + 0.5) * cs, py = oy + (goal[0] + 0.5) * cs;
    KG.sound('win');
    cheeseEat.v = 0;
    Tween.to(cheeseEat, { v: 1 }, 1.0, 'inQuad');
    for (let i = 0; i < 5; i++) setTimeout(() => { KG.note(700 + i * 90, 0.08, 'square', 0.06); FX.burst(px, py, { n: 6, shape: 'circle', colors: ['#ffd23f', '#fff2a0'], size: cs * 0.06, speed: 120 }); }, i * 180);
    setTimeout(() => {
      FX.burst(px, py - cs * 0.3, { n: 20, shape: 'heart', colors: ['#ff6b9a', '#ff9fc6', '#fff'], size: cs * 0.1, speed: 220 });
      FX.text('好好吃！', px, py - cs * 0.8, { size: Math.max(28, cs * 0.6), stroke: '#c47a0a' });
      KG.say('好好吃！');
    }, 900);
    setTimeout(() => {
      pad.classList.remove('show'); hud.classList.remove('show');
      const stars = 1 + got;
      UI.result({ stars, title: stars === 3 ? '太完美了！' : '找到起司了！', msg: '吃到 ' + got + ' / 2 塊餅乾<br>走了 ' + steps + ' 步' });
    }, 2300);
  }
  const cheeseEat = { v: 0 };

  /* ---------- 輸入 ---------- */
  const KEYMAP = { ArrowUp: 'u', ArrowDown: 'd', ArrowLeft: 'l', ArrowRight: 'r', w: 'u', s: 'd', a: 'l', d: 'r', W: 'u', S: 'd', A: 'l', D: 'r' };
  window.addEventListener('keydown', e => {
    const d = KEYMAP[e.key];
    if (!d) return;
    e.preventDefault();
    held = d; queued = d; mouse.run = null;
  });
  window.addEventListener('keyup', e => { if (KEYMAP[e.key] === held) held = null; });
  window.addEventListener('blur', () => { held = null; dragging = null; });
  pad.querySelectorAll('button').forEach(b => {
    b.addEventListener('pointerdown', e => { e.preventDefault(); held = b.dataset.d; queued = held; mouse.run = null; b.classList.add('on'); try { b.setPointerCapture(e.pointerId); } catch (err) { /* 忽略 */ } });
    const up = () => { if (held === b.dataset.d) held = null; b.classList.remove('on'); };
    b.addEventListener('pointerup', up); b.addEventListener('pointercancel', up); b.addEventListener('lostpointercapture', up);
  });
  cv.addEventListener('pointerdown', e => {
    if (!playing) return;
    try { cv.setPointerCapture(e.pointerId); } catch (err) { /* 忽略 */ }
    const mx = ox + (mouse.x + 0.5) * cs, my = oy + (mouse.y + 0.5) * cs;
    const near = Math.hypot(e.clientX - mx, e.clientY - my) < Math.max(cs * 1.3, 50);
    dragging = { x0: e.clientX, y0: e.clientY, x: e.clientX, y: e.clientY, t0: performance.now(), follow: near };
    mouse.run = null;
  });
  cv.addEventListener('pointermove', e => { if (dragging) { dragging.x = e.clientX; dragging.y = e.clientY; if (!dragging.follow && Math.hypot(e.clientX - dragging.x0, e.clientY - dragging.y0) > 26) swipeGo(); } });
  const endDrag = () => { dragging = null; };
  cv.addEventListener('pointerup', endDrag);
  cv.addEventListener('pointercancel', endDrag);

  function swipeGo() {
    const dx = dragging.x - dragging.x0, dy = dragging.y - dragging.y0;
    const d = Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 'r' : 'l') : (dy > 0 ? 'd' : 'u');
    dragging.follow = false; dragging.done = true;
    dragging.x0 = dragging.x; dragging.y0 = dragging.y;
    mouse.run = d;
    if (!mouse.moving) { if (!tryStep(d)) mouse.run = null; }
  }

  function steer() {
    if (mouse.moving || !playing) return;
    if (held || queued) { const d = held || queued; queued = null; tryStep(d); return; }
    if (dragging && dragging.follow) {
      // 手指拖著小老鼠走
      const mx = ox + (mouse.x + 0.5) * cs, my = oy + (mouse.y + 0.5) * cs;
      const dx = dragging.x - mx, dy = dragging.y - my;
      if (Math.max(Math.abs(dx), Math.abs(dy)) < cs * 0.55) return;
      const primary = Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 'r' : 'l') : (dy > 0 ? 'd' : 'u');
      const secondary = Math.abs(dx) > Math.abs(dy) ? (Math.abs(dy) > cs * 0.4 ? (dy > 0 ? 'd' : 'u') : null) : (Math.abs(dx) > cs * 0.4 ? (dx > 0 ? 'r' : 'l') : null);
      if (canGo(mouse.r, mouse.c, primary)) tryStep(primary);
      else if (secondary && canGo(mouse.r, mouse.c, secondary)) tryStep(secondary);
      else tryStep(primary);
      return;
    }
    if (mouse.run) { const d = mouse.run; if (!tryStep(d, true)) mouse.run = null; }
  }

  /* ---------- HUD ---------- */
  function iconCanvas(drawFn, cls) {
    const cnv = document.createElement('canvas');
    if (cls) cnv.className = cls;
    const h = hiDPI(cnv); h.fit(30, 30); drawFn(h.ctx);
    return cnv;
  }
  function refreshHud(popIdx) {
    hudItems.innerHTML = '';
    cookies.forEach((k, i) => hudItems.appendChild(iconCanvas(c => drawCookie(c, 15, 14, 1.15, 0), (k.got ? '' : 'off') + (i === popIdx ? ' pop' : ''))));
    keys.forEach(k => hudItems.appendChild(iconCanvas(c => drawKey(c, 16, 15, 0.95, k.col, 0), k.got ? 'pop' : 'off')));
  }

  /* ---------- 主迴圈 ---------- */
  function render(dt) {
    const [sx, sy] = FX.offset();
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.drawImage(mazeCv, 0, 0);
    ctx.setTransform(view.DPR, 0, 0, view.DPR, sx * view.DPR, sy * view.DPR);
    if (!cells.length) { FX.draw(ctx, FONT); return; }
    const s = cs / 60;
    prints.forEach(p => { p.life = Math.max(0.25, p.life - dt * 0.02); drawPrint(p); });
    gates.forEach(drawGate);
    cookies.forEach(k => { if (!k.got) drawCookie(ctx, ox + (k.c + 0.5) * cs, oy + (k.r + 0.5) * cs, s * 1.5, time); });
    keys.forEach(k => { if (!k.got) drawKey(ctx, ox + (k.c + 0.5) * cs, oy + (k.r + 0.5) * cs, s * 1.4, k.col, time); });
    drawCheese(ctx, ox + (goal[1] + 0.5) * cs, oy + (goal[0] + 0.5) * cs, s * 1.25, time, cheeseEat.v);
    const walk = mouse.moving ? ((mouse.x + mouse.y) % 1) : 0;
    drawMouse(ctx, ox + (mouse.x + 0.5) * cs, oy + (mouse.y + 0.5) * cs - cs * 0.06, s * 1.15, skin, time, { mood: mouse.mood, face: mouse.face, walk, sq: mouse.sq });
    // 夜晚：只看得到小老鼠附近
    if (theme.dark) {
      const mx = ox + (mouse.x + 0.5) * cs, my = oy + (mouse.y + 0.5) * cs, R = cs * 3.2;
      const g = ctx.createRadialGradient(mx, my, R * 0.35, mx, my, R);
      g.addColorStop(0, 'rgba(8,12,40,0)'); g.addColorStop(1, 'rgba(8,12,40,.88)');
      ctx.fillStyle = g; ctx.fillRect(-20, -20, W + 40, H + 40);
      // 起司的光
      const cx = ox + (goal[1] + 0.5) * cs, cy = oy + (goal[0] + 0.5) * cs;
      ctx.globalCompositeOperation = 'lighter';
      const g2 = ctx.createRadialGradient(cx, cy, 0, cx, cy, cs * 1.2);
      g2.addColorStop(0, 'rgba(255,220,100,.45)'); g2.addColorStop(1, 'rgba(255,220,100,0)');
      ctx.fillStyle = g2; ctx.beginPath(); ctx.arc(cx, cy, cs * 1.2, 0, TAU); ctx.fill();
      ctx.globalCompositeOperation = 'source-over';
      fireflies.forEach(f => {
        f.x += Math.cos(time * 0.7 + f.ph) * 12 * dt; f.y += Math.sin(time * 0.9 + f.ph * 2) * 10 * dt;
        const a = 0.5 + 0.5 * Math.sin(time * 3 + f.ph);
        const fg = ctx.createRadialGradient(f.x, f.y, 0, f.x, f.y, 10);
        fg.addColorStop(0, 'rgba(230,255,140,' + a + ')'); fg.addColorStop(1, 'rgba(230,255,140,0)');
        ctx.fillStyle = fg; ctx.beginPath(); ctx.arc(f.x, f.y, 10, 0, TAU); ctx.fill();
      });
    }
    FX.draw(ctx, FONT);
  }

  let last = performance.now();
  function frame(now) {
    const dt = Math.min(0.05, (now - last) / 1000);
    last = now; time += dt;
    Tween.update(dt);
    FX.update(dt);
    mouse.bumpT -= dt;
    mouse.moodT -= dt; if (mouse.moodT <= 0 && !won) mouse.mood = 'idle';
    steer();
    render(dt);
    requestAnimationFrame(frame);
  }

  /* ---------- 流程 ---------- */
  function startLevel(i) {
    li = i; level = LEVELS[i]; theme = THEMES[level.theme]; skin = SKINS[UI.item()];
    Tween.clear(); FX.clear();
    buildLevel();
    Object.assign(mouse, { r: 0, c: 0, x: 0, y: 0, moving: false, face: 1, sq: 0, mood: 'happy', moodT: 1, run: null });
    held = null; queued = null; dragging = null; got = 0; steps = 0; won = false; cheeseEat.v = 0;
    fireflies = [];
    for (let k = 0; k < 14; k++) fireflies.push({ x: KG.rand(0, innerWidth), y: KG.rand(0, innerHeight), ph: Math.random() * 6 });
    hudLv.textContent = '第 ' + (i + 1) + ' 關';
    refreshHud();
    hud.classList.add('show'); pad.classList.add('show');
    layout();
    playing = true;
    UI.banner('第 ' + (i + 1) + ' 關', level.tip, 2.2);
    KG.say(level.tip);
  }

  function toMenu() {
    playing = false; won = false;
    hud.classList.remove('show'); pad.classList.remove('show');
    cells = []; gates = []; keys = []; cookies = []; prints = [];
    theme = THEMES.garden;
    layout();
  }

  window.addEventListener('resize', layout);
  // 測試用（網址加 #debug）
  if (location.hash === '#debug') window.__dbg = { path: () => { const { par } = bfs(mouse.r, mouse.c, false); const out = []; let cur = goal; while (cur && !(cur[0] === mouse.r && cur[1] === mouse.c)) { const p = par[cur[0]][cur[1]]; out.unshift(p[2]); cur = [p[0], p[1]]; } return out; }, st: () => ({ playing, won, steps, got }) };

  UI.init({
    slug: 'mouse-maze', title: '老鼠找起司', subtitle: '走迷宮，帶小老鼠找到起司！',
    levels: LEVELS, items: SKINS, itemsTitle: '小老鼠的衣櫃', itemWord: '造型',
    drawMascot, drawItem, music: SONG,
    onPlay: startLevel, onMenu: toMenu, onItem: i => { skin = SKINS[i]; }
  });
  layout();
  requestAnimationFrame(t => { last = t; frame(t); });
  UI.showTitle();
})();
</script>
