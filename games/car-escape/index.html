<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>停車場脫困</title>
<link rel="stylesheet" href="../../assets/common.css">
<style>
  :root { --ink: #33304a; --card: #fffaf0; --line: #e9dcc6; --red: #f2544b; --teal: #23a79a; --sun: #ffcb3d; --sky: #4aa8f0; }
  html, body { height: 100%; overflow: hidden; background: #79c25a; overscroll-behavior: none; }
  #game { position: fixed; inset: 0; display: block; width: 100vw; height: 100vh; height: 100dvh; touch-action: none; outline: none; z-index: 1; }
  .hidden { display: none !important; }
  .layer { position: fixed; inset: 0; z-index: 100; pointer-events: none; font-family: var(--kg-font); color: var(--ink); }
  .layer button, .layer .pe { pointer-events: auto; }
  button { font-family: var(--kg-font); color: var(--ink); -webkit-tap-highlight-color: transparent; }
  svg.i { width: 1.15em; height: 1.15em; vertical-align: -0.2em; fill: none; stroke: currentColor; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; flex: none; }
  .b {
    border: 0; border-radius: 16px; padding: 10px 14px; font-size: 18px; font-weight: 800; cursor: pointer;
    background: #fff; box-shadow: 0 4px 0 #d8c9ae, 0 6px 14px rgba(40, 30, 60, 0.18);
    display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 46px; line-height: 1.1;
    transition: transform 0.08s ease, box-shadow 0.08s ease; touch-action: manipulation; white-space: nowrap;
  }
  .b:active { transform: translateY(3px); box-shadow: 0 1px 0 #d8c9ae, 0 2px 6px rgba(40, 30, 60, 0.2); }
  .b.red { background: linear-gradient(#ff7a6b, #e9453c); color: #fff; box-shadow: 0 4px 0 #b52d27, 0 6px 14px rgba(181, 45, 39, 0.35); text-shadow: 0 2px 0 rgba(0,0,0,0.15); }
  .b.teal { background: linear-gradient(#4fd0c1, #1f9d90); color: #fff; box-shadow: 0 4px 0 #157a70, 0 6px 14px rgba(21, 122, 112, 0.35); text-shadow: 0 2px 0 rgba(0,0,0,0.15); }
  .b.sun { background: linear-gradient(#ffe07a, #ffbf26); color: #5a3f00; box-shadow: 0 4px 0 #c99100, 0 6px 14px rgba(201, 145, 0, 0.3); }
  .b.sky { background: linear-gradient(#7cc6ff, #3b95e6); color: #fff; box-shadow: 0 4px 0 #2a6fb0, 0 6px 14px rgba(42, 111, 176, 0.3); text-shadow: 0 2px 0 rgba(0,0,0,0.15); }
  .b.off { opacity: 0.55; }
  .b.on { outline: 3px solid var(--red); outline-offset: 1px; }
  .b[disabled] { opacity: 0.45; }
  .b.round { width: 48px; height: 48px; min-height: 48px; padding: 0; border-radius: 50%; font-size: 20px; }
  .card { background: var(--card); border: 4px solid #fff; border-radius: 24px; box-shadow: 0 14px 40px rgba(30, 20, 50, 0.35); }

  /* 標題 */
  #scrTitle { display: flex; flex-direction: column; align-items: center; justify-content: space-between; padding: 64px 16px max(16px, env(safe-area-inset-bottom)); }
  .logo { text-align: center; pointer-events: none; }
  .logo h1 {
    margin: 0; font-size: clamp(38px, 10.5vw, 64px); font-weight: 900; letter-spacing: 3px; color: #fff; line-height: 1.05;
    -webkit-text-stroke: 7px #2f2a45; paint-order: stroke fill; text-shadow: 0 6px 0 #2f2a45;
  }
  .logo h1 span { color: #ff5d52; }
  .logo p { margin: 10px auto 0; display: inline-block; font-size: clamp(15px, 4vw, 19px); font-weight: 800; background: #fff; border-radius: 999px; padding: 5px 16px; box-shadow: 0 3px 0 rgba(47, 42, 69, 0.25); }
  .tbtns { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; width: min(420px, 100%); }
  .tbtns .wide { grid-column: 1 / -1; font-size: 24px; min-height: 60px; }
  .tbtns .tog { min-height: 40px; font-size: 15px; }
  body.land #scrTitle { flex-direction: row; justify-content: flex-start; align-items: center; padding: 50px 16px 10px; gap: 16px; }
  body.land #scrTitle .tcol { width: min(46vw, 430px); display: flex; flex-direction: column; gap: 10px; align-items: center; }
  body.land .tbtns { gap: 8px; }
  body.land .tbtns .b { min-height: 42px; }
  body.land .tbtns .tog { min-height: 36px; }
  body:not(.land) #scrTitle .tcol { display: contents; }
  body.land .logo h1 { font-size: clamp(34px, 6.4vw, 66px); }
  body.land .tbtns .wide { min-height: 48px; font-size: 21px; }
  .badge { background: #ff5d52; color: #fff; border-radius: 999px; font-size: 12px; padding: 2px 7px; margin-left: 2px; }

  /* 選關 */
  #scrLevels { display: flex; flex-direction: column; align-items: center; padding: 10px 12px max(10px, env(safe-area-inset-bottom)); }
  .lvHead { width: min(760px, 100%); display: flex; align-items: center; justify-content: center; gap: 10px; min-height: 52px; padding: 0 60px 0 116px; }
  @media (max-width: 520px) { .lvHead h2 { display: none; } .lvHead { padding: 0 60px 0 110px; } }
  .lvHead h2 { margin: 0; font-size: 24px; color: #fff; -webkit-text-stroke: 5px #2f2a45; paint-order: stroke fill; }
  .lvStars { font-weight: 900; background: #fff; border-radius: 999px; padding: 4px 12px; font-size: 16px; box-shadow: 0 3px 0 rgba(0,0,0,0.15); }
  .tabs { width: min(760px, 100%); display: flex; gap: 6px; margin: 8px 0; }
  .tabs .b { flex: 1; padding: 6px 2px; min-height: 52px; font-size: 16px; flex-direction: column; gap: 0; border-radius: 14px; }
  .tabs .b small { font-size: 11px; font-weight: 700; opacity: 0.8; }
  .tabs .b.sel { background: linear-gradient(#ff7a6b, #e9453c); color: #fff; box-shadow: 0 4px 0 #b52d27; }
  .grid { width: min(760px, 100%); flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; padding: 4px 2px 12px; align-content: start; touch-action: pan-y; }
  body.land .grid { grid-template-columns: repeat(8, 1fr); }
  .lv { position: relative; border: 0; border-radius: 14px; background: #fff; min-height: 58px; font-size: 20px; font-weight: 900; box-shadow: 0 4px 0 #d8c9ae; cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; padding: 4px 0; }
  .lv:active { transform: translateY(3px); box-shadow: 0 1px 0 #d8c9ae; }
  .lv .st { font-size: 12px; letter-spacing: 1px; color: #ccc; line-height: 1; }
  .lv .st b { color: #ffb800; font-weight: 900; }
  .lv.done { background: #fff8e1; }
  .lv.lock { background: #e8e2d8; color: #a59c8f; box-shadow: 0 4px 0 #c9bfae; }
  .lv .tw { position: absolute; top: 3px; right: 5px; width: 9px; height: 9px; border-radius: 50%; background: #4fd0c1; }
  .tierNote { width: min(760px, 100%); text-align: center; font-weight: 800; font-size: 14px; color: #fff; text-shadow: 0 1px 2px rgba(0,0,0,0.4); margin-bottom: 4px; }

  /* 遊戲 HUD */
  #hudTop { position: absolute; top: 8px; left: 50%; transform: translateX(-50%); width: min(260px, calc(100vw - 136px)); background: rgba(255, 250, 240, 0.96); border: 3px solid #fff; border-radius: 18px; box-shadow: 0 4px 0 rgba(47, 42, 69, 0.2); text-align: center; padding: 4px 8px 5px; }
  #hudTop .t1 { font-size: 15px; font-weight: 900; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #hudTop .t2 { font-size: 15px; font-weight: 800; color: #6a6380; white-space: nowrap; }
  #hudTop .t2 b { color: var(--ink); font-size: 20px; }
  #btnPause { position: absolute; top: 68px; right: 10px; }
  #hudBot { position: absolute; left: 50%; transform: translateX(-50%); bottom: max(10px, env(safe-area-inset-bottom)); display: flex; gap: 10px; width: min(460px, calc(100vw - 20px)); }
  #hudBot .b { flex: 1; min-height: 56px; font-size: 18px; flex-direction: column; gap: 1px; padding: 6px 4px; }
  #hudBot .b svg.i { width: 24px; height: 24px; }
  body.land #hudTop { left: 10px; top: 66px; transform: none; width: 150px; }
  body.land #hudTop .t2 { white-space: normal; line-height: 1.25; }
  body.land #hudBot { left: 10px; transform: none; width: 150px; flex-direction: column; bottom: max(10px, env(safe-area-inset-bottom)); gap: 8px; }
  body.land #hudBot .b { flex-direction: row; min-height: 50px; gap: 8px; }

  /* 編輯器 */
  #edTop { position: absolute; top: 8px; left: 50%; transform: translateX(-50%); width: min(270px, calc(100vw - 136px)); text-align: center; background: rgba(255, 250, 240, 0.96); border: 3px solid #fff; border-radius: 18px; padding: 4px 8px 6px; box-shadow: 0 4px 0 rgba(47, 42, 69, 0.2); }
  #edTop .t1 { font-weight: 900; font-size: 16px; }
  #edStatus { font-size: 13px; font-weight: 800; color: #6a6380; min-height: 18px; }
  #edSize { margin-top: 3px; display: flex; gap: 6px; justify-content: center; }
  #edSize .b { min-height: 32px; padding: 3px 10px; font-size: 14px; border-radius: 10px; }
  #edTools { position: absolute; left: 50%; transform: translateX(-50%); bottom: calc(max(10px, env(safe-area-inset-bottom)) + 60px); width: min(460px, calc(100vw - 20px)); display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
  #edTools .b { min-height: 48px; padding: 2px; font-size: 13px; flex-direction: column; gap: 0; border-radius: 12px; }
  #edTools canvas { width: 46px; height: 24px; }
  #edActs { position: absolute; left: 50%; transform: translateX(-50%); bottom: max(10px, env(safe-area-inset-bottom)); width: min(460px, calc(100vw - 20px)); display: flex; gap: 6px; }
  #edActs .b { flex: 1; min-height: 50px; font-size: 15px; padding: 4px 2px; gap: 3px; }
  #eQuit { order: 9; }
  body.land #edTop { left: 10px; top: 66px; transform: none; width: 168px; }
  body.land #edTools { left: 10px; transform: none; bottom: max(10px, env(safe-area-inset-bottom)); width: 168px; grid-template-columns: repeat(2, 1fr); }
  body.land #edActs { left: auto; right: 10px; transform: none; top: 68px; bottom: auto; width: 128px; flex-direction: column; }
  body.land #edActs .b { flex: none; min-height: 46px; }

  /* 浮動卡片 */
  .ov { position: fixed; inset: 0; z-index: 8000; display: flex; align-items: center; justify-content: center; padding: 12px; background: rgba(36, 28, 52, 0.5); pointer-events: auto; font-family: var(--kg-font); color: var(--ink); }
  .ov .card { width: min(380px, 100%); max-height: calc(100% - 8px); overflow-y: auto; padding: 18px 18px 16px; text-align: center; animation: pop 0.32s cubic-bezier(0.2, 1.5, 0.4, 1); }
  .ov h2 { margin: 2px 0 10px; font-size: 26px; }
  .ov p { margin: 6px 0 12px; font-size: 17px; line-height: 1.5; font-weight: 700; }
  .ov .acts { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .ov .acts .wide { grid-column: 1 / -1; }
  body.land .ov .card { width: min(560px, 100%); }
  body.land .ov .acts { grid-template-columns: 1fr 1fr 1fr; }
  body.land .ov .acts .wide { grid-column: auto; }
  .stars { display: flex; justify-content: center; gap: 8px; margin: 2px 0 6px; }
  .stars svg { width: 54px; height: 54px; opacity: 0; transform: scale(0.3); }
  .stars svg.show { animation: starIn 0.4s cubic-bezier(0.2, 1.6, 0.4, 1) forwards; }
  .resLine { font-size: 18px; font-weight: 800; margin: 4px 0; }
  .resLine b { font-size: 24px; color: #e9453c; }
  .newrec { display: inline-block; background: var(--sun); border-radius: 999px; padding: 3px 12px; font-weight: 900; font-size: 15px; margin: 2px 0 8px; }
  .cardPic { display: block; margin: 0 auto 6px; width: 200px; height: 110px; }
  #ovPause .acts .b, #ovResult .acts .b, #ovCard .acts .b { min-height: 50px; }
  @keyframes pop { from { transform: scale(0.7); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  @keyframes starIn { from { opacity: 0; transform: scale(0.3) rotate(-40deg); } to { opacity: 1; transform: scale(1) rotate(0); } }

  #msg { position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%); z-index: 7000; pointer-events: none; font-family: var(--kg-font); font-weight: 900; font-size: 18px; color: #fff; background: rgba(47, 42, 69, 0.88); border-radius: 999px; padding: 8px 18px; white-space: nowrap; max-width: calc(100vw - 24px); overflow: hidden; text-overflow: ellipsis; transition: opacity 0.25s; opacity: 0; }
  #msg.show { opacity: 1; }
</style>
</head>
<body>
<canvas id="game" tabindex="0" aria-label="停車場脫困：滑動車子，讓小紅車開出停車場的益智遊戲"></canvas>

<div id="scrTitle" class="layer">
  <div class="tcol">
    <div class="logo"><h1>停車場<span>脫困</span></h1><p>移開擋路的車，讓小紅車開出去！</p></div>
    <div class="tbtns pe" id="tBtns">
      <button class="b red wide" id="tPlay"></button>
      <button class="b sun" id="tLevels"></button>
      <button class="b sky" id="tDaily"></button>
      <button class="b teal wide" id="tEdit"></button>
      <button class="b tog" id="tMusic"></button>
      <button class="b tog" id="tSfx"></button>
    </div>
  </div>
</div>

<div id="scrLevels" class="layer hidden">
  <div class="lvHead"><h2>選擇關卡</h2><span class="lvStars" id="lvStars"></span></div>
  <div class="tabs pe" id="lvTabs"></div>
  <div class="tierNote" id="lvNote"></div>
  <div class="grid pe" id="lvGrid"></div>
</div>
<button class="b round hidden" id="btnBack" style="position:fixed;top:10px;left:66px;z-index:120" aria-label="返回"></button>

<div id="hudPlay" class="layer hidden">
  <div id="hudTop"><div class="t1" id="hudName"></div><div class="t2" id="hudMoves"></div></div>
  <button class="b round" id="btnPause" aria-label="暫停"></button>
  <div id="hudBot">
    <button class="b" id="btnUndo"></button>
    <button class="b" id="btnRestart"></button>
    <button class="b sun" id="btnHint"></button>
  </div>
</div>

<div id="edUI" class="layer hidden">
  <div id="edTop"><div class="t1">自己設計停車場</div><div id="edStatus"></div><div id="edSize" class="pe"></div></div>
  <div id="edTools"></div>
  <div id="edActs"></div>
</div>

<div id="ovPause" class="ov hidden" role="dialog" aria-label="暫停">
  <div class="card"><h2>休息一下</h2>
    <div class="acts">
      <button class="b red wide" id="pResume"></button>
      <button class="b" id="pRestart"></button>
      <button class="b" id="pQuit"></button>
      <button class="b tog" id="pMusic"></button>
      <button class="b tog" id="pSfx"></button>
      <button class="b wide" id="pHome"></button>
    </div>
  </div>
</div>
<div id="ovResult" class="ov hidden" role="dialog" aria-label="過關">
  <div class="card"><h2 id="rTitle">脫困成功！</h2>
    <div class="stars" id="rStars"></div>
    <div class="resLine" id="rMoves"></div>
    <div id="rExtra"></div>
    <div class="acts" id="rActs"></div>
  </div>
</div>
<div id="ovCard" class="ov hidden" role="dialog">
  <div class="card"><canvas class="cardPic" id="cPic" width="400" height="220"></canvas><h2 id="cTitle"></h2><p id="cText"></p>
    <div class="acts"><button class="b red wide" id="cOk" style="grid-column:1/-1"></button></div>
  </div>
</div>
<div id="msg"></div>

<script src="../../assets/common.js"></script>
<script src="../../assets/kg-music.js"></script>
<script>
'use strict';
/*CORE-BEGIN*/
/* =====================================================================
 * 規則核心：題目格式、合法移動、BFS 解題器（遊戲、提示、編輯器、出題程式共用）
 *   題目字串  "W:最少步數:零件,零件,…"
 *   零件      類型 方向 x y [n]   例：Rh02 紅車橫放在 (0,2)
 *     R 小紅車(2)  C 小汽車(2)  T 卡車／公車(3)  G 垃圾車(3，一次只能開一格)
 *     S 機車(1，前後左右都能走)  P 柱子(不能動)  B 路障(走滿 n 步後打開)
 * ===================================================================== */
const Core = (function () {
  const LEN = { R: 2, C: 2, T: 3, G: 3, S: 1, P: 1, B: 1 };
  function exitRow(W) { return W === 7 ? 3 : 2; }
  function parse(str) {
    const parts = String(str).split(':');
    const W = +parts[0], opt = +parts[1];
    const pieces = parts[2].split(',').filter(Boolean).map(tok => {
      const t = tok[0], o = tok[1] === 'v' ? 'v' : tok[1] === 'h' ? 'h' : 'o';
      return { t, o, x: +tok[2], y: +tok[3], n: tok.length > 4 ? +tok.slice(4) : 0, len: LEN[t] };
    });
    // 紅車永遠是第一個
    pieces.sort((a, b) => (a.t === 'R' ? -1 : 0) - (b.t === 'R' ? -1 : 0));
    return { W, opt, pieces };
  }
  function encode(puz) {
    const ps = puz.pieces.slice().sort((a, b) => (a.t === 'R' ? -1 : 0) - (b.t === 'R' ? -1 : 0));
    return puz.W + ':' + (puz.opt || 0) + ':' + ps.map(p => p.t + (p.o || 'o') + p.x + p.y + (p.t === 'B' ? p.n : '')).join(',');
  }
  function cellsOf(p) {
    const out = [];
    for (let k = 0; k < p.len; k++) out.push(p.o === 'v' ? [p.x, p.y + k] : [p.x + k, p.y]);
    return out;
  }
  /** 檢查擺放是否合法：回傳錯誤字串或 '' */
  function validate(puz) {
    const W = puz.W, occ = new Array(W * W).fill(-1);
    let reds = 0;
    for (let i = 0; i < puz.pieces.length; i++) {
      const p = puz.pieces[i];
      if (p.t === 'R') { reds++; if (p.o !== 'h' || p.y !== exitRow(W)) return 'red-row'; }
      for (const [x, y] of cellsOf(p)) {
        if (x < 0 || y < 0 || x >= W || y >= W) return 'out';
        if (occ[y * W + x] >= 0) return 'overlap';
        occ[y * W + x] = i;
      }
    }
    if (reds !== 1) return 'red-count';
    return '';
  }

  /** 解題器 */
  function Solver(puz) {
    const W = puz.W, N = W * W;
    const veh = [], start = [], barriers = [];
    const base = new Uint8Array(N);
    let maxN = 0;
    puz.pieces.forEach(p => {
      if (p.t === 'P') base[p.y * W + p.x] = 255;
      else if (p.t === 'B') { barriers.push({ cell: p.y * W + p.x, n: p.n }); maxN = Math.max(maxN, p.n); }
      else {
        const v = { t: p.t, o: p.t === 'S' ? 's' : p.o, len: p.len, fix: p.o === 'v' ? p.x : p.y, one: p.t === 'G' };
        veh.push(v);
        start.push(v.o === 's' ? p.y * W + p.x : v.o === 'h' ? p.x : p.y);
      }
    });
    const nv = veh.length, occ = new Uint8Array(N);
    function fill(pos, t) {
      occ.set(base);
      for (let b = 0; b < barriers.length; b++) if (t < barriers[b].n) occ[barriers[b].cell] = 254;
      for (let i = 0; i < nv; i++) {
        const v = veh[i], p = pos[i];
        if (v.o === 's') occ[p] = i + 1;
        else if (v.o === 'h') for (let k = 0; k < v.len; k++) occ[v.fix * W + p + k] = i + 1;
        else for (let k = 0; k < v.len; k++) occ[(p + k) * W + v.fix] = i + 1;
      }
    }
    /** 每個合法移動呼叫 cb(車號, 新位置)；呼叫前要先 fill */
    function each(pos, cb) {
      for (let i = 0; i < nv; i++) {
        const v = veh[i], p = pos[i], lim = v.one ? 1 : W;
        if (v.o === 'h') {
          const r = v.fix * W;
          for (let k = 1; k <= lim && p - k >= 0 && !occ[r + p - k]; k++) cb(i, p - k);
          for (let k = 1; k <= lim && p + v.len - 1 + k < W && !occ[r + p + v.len - 1 + k]; k++) cb(i, p + k);
        } else if (v.o === 'v') {
          const c = v.fix;
          for (let k = 1; k <= lim && p - k >= 0 && !occ[(p - k) * W + c]; k++) cb(i, p - k);
          for (let k = 1; k <= lim && p + v.len - 1 + k < W && !occ[(p + v.len - 1 + k) * W + c]; k++) cb(i, p + k);
        } else {
          const x = p % W, y = (p - x) / W;
          for (let k = 1; x - k >= 0 && !occ[p - k]; k++) cb(i, p - k);
          for (let k = 1; x + k < W && !occ[p + k]; k++) cb(i, p + k);
          for (let k = 1; y - k >= 0 && !occ[p - k * W]; k++) cb(i, p - k * W);
          for (let k = 1; y + k < W && !occ[p + k * W]; k++) cb(i, p + k * W);
        }
      }
    }
    function moves(pos, t) { fill(pos, t || 0); const out = []; each(pos, (i, np) => out.push([i, np])); return out; }
    /** 某台車在某方向（-1 / +1）最遠能到哪（拖曳、點目的地用）。axis: 'x' 或 'y'（機車用） */
    function range(pos, t, i, axis) {
      fill(pos, t || 0);
      const v = veh[i], p = pos[i];
      let lo = 0, hi = 0;
      if (v.o === 'h' || (v.o === 's' && axis === 'x')) {

/* =====================================================================
 * 車子的造型（全部用程式畫）
 * ===================================================================== */
const SKINS = {

  taxi: { body: '#ffc928', dark: '#c99100', roof: '#ffdb5e' },
  van: { body: '#e4e9f0', dark: '#9aa6b5', roof: '#f6f8fb' },
  green: { body: '#5cc46a', dark: '#2f8a3e', roof: '#84d98f' },
  blue: { body: '#4aa3ff', dark: '#2470c0', roof: '#7dbdff' },
  purple: { body: '#a07cf0', dark: '#6a48b8', roof: '#bea3f6' },
  orange: { body: '#ff9a3c', dark: '#c76512', roof: '#ffb671' },
  pink: { body: '#ff86b8', dark: '#cc4c82', roof: '#ffabd0' },
  teal: { body: '#33c2b8', dark: '#1c8a82', roof: '#6ad7cf' },
  truck: { body: '#2f6fe0', dark: '#1d4aa0', roof: '#5a90f0' },
  bus: { body: '#f4efe2', dark: '#9a9180', roof: '#fffaf0', stripe: '#1fa08f' },
  garbage: { body: '#ffd23f', dark: '#c49a00', roof: '#fff2b0' },
  scooter: { body: '#fff', dark: '#555', roof: '#fff' }

const CAR_SKINS = ['taxi', 'van', 'green', 'blue', 'purple', 'orange', 'pink', 'teal', 'taxi', 'green', 'blue'];
const HELMETS = ['#ff5d52', '#4aa3ff', '#ffc928', '#5cc46a', '#a07cf0', '#ff86b8'];
function rr(g, x, y, w, h, r) {
  r = Math.min(r, w / 2, h / 2);
  g.beginPath(); g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r); g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath();
}
function ell(g, x, y, rx, ry) { g.beginPath(); g.ellipse(x, y, Math.max(0.1, rx), Math.max(0.1, ry), 0, 0, TAU); }
/** 畫一台朝右的車，範圍 (0,0)~(L*C, C) */
function paintVehicle(g, kind, L, C, extra) {
  const sk = SKINS[kind] || SKINS.green;
  const pad = C * 0.09, x0 = pad, y0 = C * 0.13, w = L * C - pad * 2, h = C - y0 * 2;
  g.lineJoin = 'round';
  if (kind === 'scooter') { paintScooter(g, C, extra); return; }

  g.fillStyle = '#2b2b33';
  const wy = [y0 - h * 0.06, y0 + h * 0.86], wl = Math.min(C * 0.36, w * 0.17), ww = h * 0.2;
  const wxs = L === 2 ? [x0 + w * 0.12, x0 + w * 0.7] : [x0 + w * 0.08, x0 + w * 0.36, x0 + w * 0.8];
  wxs.forEach(wx => wy.forEach(yy => { rr(g, wx, yy, wl, ww, ww * 0.4); g.fill(); }));

  if (kind === 'bus') { paintBus(g, L, C, x0, y0, w, h, sk); return; }
  if (kind === 'garbage') { paintGarbage(g, L, C, x0, y0, w, h, sk); return; }
  // 車身
  g.fillStyle = sk.dark; rr(g, x0, y0 + h * 0.04, w, h, h * 0.34); g.fill();
  g.fillStyle = sk.body; rr(g, x0, y0, w, h * 0.97, h * 0.34); g.fill();
  // 後照鏡
  g.fillStyle = sk.dark;
  ell(g, x0 + w * 0.62, y0 - h * 0.02, w * 0.035, h * 0.07); g.fill();
  ell(g, x0 + w * 0.62, y0 + h * 0.97, w * 0.035, h * 0.07); g.fill();
  const van = kind === 'van';
  // 車頂、玻璃
  const ws0 = van ? 0.66 : 0.58, ws1 = van ? 0.8 : 0.73, rf0 = van ? 0.14 : 0.28;
  g.fillStyle = '#9fd6f2';
  g.beginPath();
  g.moveTo(x0 + w * ws0, y0 + h * 0.16); g.lineTo(x0 + w * ws1, y0 + h * 0.08); g.quadraticCurveTo(x0 + w * (ws1 + 0.03), y0 + h * 0.5, x0 + w * ws1, y0 + h * 0.92); g.lineTo(x0 + w * ws0, y0 + h * 0.84); g.closePath(); g.fill();
  g.fillStyle = '#7fc0e4';
  g.beginPath(); g.moveTo(x0 + w * (rf0 - 0.04), y0 + h * 0.18); g.lineTo(x0 + w * rf0, y0 + h * 0.2); g.lineTo(x0 + w * rf0, y0 + h * 0.8); g.lineTo(x0 + w * (rf0 - 0.04), y0 + h * 0.82); g.quadraticCurveTo(x0 + w * (rf0 - 0.07), y0 + h * 0.5, x0 + w * (rf0 - 0.04), y0 + h * 0.18); g.fill();
  g.fillStyle = sk.roof; rr(g, x0 + w * rf0, y0 + h * 0.17, w * (ws0 - rf0), h * 0.66, h * 0.16); g.fill();
  // 頭燈、尾燈
  g.fillStyle = '#fff6b8';
  ell(g, x0 + w - w * 0.025, y0 + h * 0.2, w * 0.025, h * 0.1); g.fill();
  ell(g, x0 + w - w * 0.025, y0 + h * 0.8, w * 0.025, h * 0.1); g.fill();
  g.fillStyle = '#d8302a';
  rr(g, x0 + 1, y0 + h * 0.12, w * 0.03, h * 0.18, 2); g.fill();
  rr(g, x0 + 1, y0 + h * 0.7, w * 0.03, h * 0.18, 2); g.fill();
  if (van) {
    // 七人座：側窗與車頂行李架
    g.fillStyle = '#7fc0e4';
    rr(g, x0 + w * 0.18, y0 + h * 0.06, w * 0.44, h * 0.07, 3); g.fill();
    rr(g, x0 + w * 0.18, y0 + h * 0.87, w * 0.44, h * 0.07, 3); g.fill();
    g.strokeStyle = '#9aa6b5'; g.lineWidth = Math.max(1, C * 0.03);
    g.beginPath(); g.moveTo(x0 + w * 0.2, y0 + h * 0.3); g.lineTo(x0 + w * 0.6, y0 + h * 0.3); g.moveTo(x0 + w * 0.2, y0 + h * 0.7); g.lineTo(x0 + w * 0.6, y0 + h * 0.7); g.stroke();
  }

    g.fillStyle = '#fff'; rr(g, x0 + w * 0.36, y0 + h * 0.32, w * 0.14, h * 0.36, 3); g.fill();
    g.fillStyle = '#e9453c'; rr(g, x0 + w * 0.39, y0 + h * 0.38, w * 0.08, h * 0.24, 2); g.fill();
    g.strokeStyle = '#2b2b33'; g.lineWidth = Math.max(1, C * 0.025);
    g.beginPath(); g.moveTo(x0 + w * 0.06, y0 + h * 0.5); g.lineTo(x0 + w * 0.24, y0 + h * 0.5); g.stroke();
  }

    // 小紅車的大眼睛（在擋風玻璃上）
    const ex = x0 + w * 0.67;
    [0.32, 0.68].forEach(fy => {
      g.fillStyle = '#fff'; ell(g, ex, y0 + h * fy, w * 0.055, h * 0.15); g.fill();
      g.fillStyle = '#2b2440'; ell(g, ex + w * 0.018, y0 + h * fy, w * 0.03, h * 0.09); g.fill();
      g.fillStyle = '#fff'; ell(g, ex + w * 0.026, y0 + h * fy - h * 0.04, w * 0.01, h * 0.03); g.fill();
    });
    g.fillStyle = 'rgba(255,255,255,0.35)'; ell(g, x0 + w * 0.4, y0 + h * 0.3, w * 0.09, h * 0.06); g.fill();
    // 腮紅
    g.fillStyle = 'rgba(255,170,170,0.8)';
    ell(g, x0 + w * 0.86, y0 + h * 0.2, w * 0.03, h * 0.06); g.fill();
    ell(g, x0 + w * 0.86, y0 + h * 0.8, w * 0.03, h * 0.06); g.fill();
  }
  // 亮面
  g.fillStyle = 'rgba(255,255,255,0.28)'; rr(g, x0 + w * 0.06, y0 + h * 0.08, w * 0.88, h * 0.1, h * 0.05); g.fill();
}
function paintTruck(g, L, C, x0, y0, w, h, sk) {
  const cab = w * 0.3, bed = w - cab - w * 0.02;
  // 車斗
  g.fillStyle = sk.dark; rr(g, x0, y0 + h * 0.03, bed, h, h * 0.12); g.fill();
  g.fillStyle = sk.body; rr(g, x0, y0, bed, h * 0.97, h * 0.12); g.fill();
  g.fillStyle = '#c9925a'; rr(g, x0 + h * 0.1, y0 + h * 0.1, bed - h * 0.2, h * 0.77, h * 0.06); g.fill();
  g.strokeStyle = '#a87443'; g.lineWidth = Math.max(1, C * 0.02);
  for (let k = 1; k < 4; k++) { const yy = y0 + h * (0.1 + 0.77 * k / 4); g.beginPath(); g.moveTo(x0 + h * 0.1, yy); g.lineTo(x0 + bed - h * 0.1, yy); g.stroke(); }
  // 西瓜（台灣藍色小貨車載水果）
  const n = 3, r = Math.min(h * 0.2, bed / 8);
  for (let k = 0; k < n; k++) for (let j = 0; j < 2; j++) {
    const cx = x0 + h * 0.1 + (bed - h * 0.2) * (k + 0.5 + (j ? 0.25 : -0.1)) / n, cy = y0 + h * (j ? 0.66 : 0.32);
    g.fillStyle = '#3e9b3a'; ell(g, cx, cy, r, r); g.fill();
    g.strokeStyle = '#1f5f1e'; g.lineWidth = Math.max(1, r * 0.2);
    g.beginPath(); g.moveTo(cx - r * 0.7, cy - r * 0.2); g.quadraticCurveTo(cx, cy - r * 0.6, cx + r * 0.7, cy - r * 0.2); g.stroke();
    g.beginPath(); g.moveTo(cx - r * 0.7, cy + r * 0.3); g.quadraticCurveTo(cx, cy - 0.05 * r, cx + r * 0.7, cy + r * 0.3); g.stroke();
    g.fillStyle = 'rgba(255,255,255,0.35)'; ell(g, cx - r * 0.3, cy - r * 0.4, r * 0.25, r * 0.15); g.fill();
  }
  // 車頭
  const cx0 = x0 + w - cab;
  g.fillStyle = sk.dark; rr(g, cx0, y0 + h * 0.03, cab, h, h * 0.3); g.fill();
  g.fillStyle = sk.body; rr(g, cx0, y0, cab, h * 0.97, h * 0.3); g.fill();
  g.fillStyle = sk.roof; rr(g, cx0 + cab * 0.08, y0 + h * 0.14, cab * 0.5, h * 0.7, h * 0.14); g.fill();
  g.fillStyle = '#9fd6f2'; rr(g, cx0 + cab * 0.62, y0 + h * 0.12, cab * 0.18, h * 0.74, h * 0.06); g.fill();
  g.fillStyle = '#fff6b8'; ell(g, x0 + w - 2, y0 + h * 0.2, 2.5, h * 0.09); g.fill(); ell(g, x0 + w - 2, y0 + h * 0.8, 2.5, h * 0.09); g.fill();
  g.fillStyle = 'rgba(255,255,255,0.28)'; rr(g, cx0 + cab * 0.1, y0 + h * 0.06, cab * 0.8, h * 0.08, 3); g.fill();
}
function paintBus(g, L, C, x0, y0, w, h, sk) {
  g.fillStyle = sk.dark; rr(g, x0, y0 + h * 0.03, w, h, h * 0.2); g.fill();
  g.fillStyle = sk.body; rr(g, x0, y0, w, h * 0.97, h * 0.2); g.fill();
  g.fillStyle = sk.stripe; rr(g, x0, y0, w, h * 0.13, h * 0.1); g.fill(); rr(g, x0, y0 + h * 0.84, w, h * 0.13, h * 0.1); g.fill();
  // 擋風玻璃（前方）、冷氣機、天窗
  g.fillStyle = '#2f4a66'; rr(g, x0 + w * 0.9, y0 + h * 0.12, w * 0.07, h * 0.73, 4); g.fill();
  g.fillStyle = '#d7d2c4'; rr(g, x0 + w * 0.3, y0 + h * 0.26, w * 0.26, h * 0.45, 5); g.fill();
  g.strokeStyle = '#b4ae9d'; g.lineWidth = Math.max(1, C * 0.02);
  for (let k = 1; k < 5; k++) { const xx = x0 + w * (0.3 + 0.26 * k / 5); g.beginPath(); g.moveTo(xx, y0 + h * 0.3); g.lineTo(xx, y0 + h * 0.67); g.stroke(); }
  g.fillStyle = '#c8e6f3'; rr(g, x0 + w * 0.08, y0 + h * 0.32, w * 0.12, h * 0.33, 4); g.fill(); rr(g, x0 + w * 0.64, y0 + h * 0.32, w * 0.12, h * 0.33, 4); g.fill();
  // 路線牌
  g.fillStyle = '#2b2b33'; rr(g, x0 + w * 0.82, y0 + h * 0.36, w * 0.06, h * 0.28, 3); g.fill();
  g.fillStyle = '#ffb400'; rr(g, x0 + w * 0.835, y0 + h * 0.42, w * 0.03, h * 0.16, 2); g.fill();
  g.fillStyle = '#fff6b8'; ell(g, x0 + w - 2, y0 + h * 0.18, 2.5, h * 0.08); g.fill(); ell(g, x0 + w - 2, y0 + h * 0.82, 2.5, h * 0.08); g.fill();
}
function paintGarbage(g, L, C, x0, y0, w, h, sk) {
  const cab = w * 0.28, box = w - cab - w * 0.015;
  // 後面的壓縮斗
  g.fillStyle = '#6b6f7a'; rr(g, x0, y0 + h * 0.08, box * 0.16, h * 0.84, h * 0.12); g.fill();
  g.fillStyle = '#8a8f9a'; rr(g, x0 + box * 0.02, y0 + h * 0.14, box * 0.1, h * 0.72, h * 0.08); g.fill();
  // 車廂
  g.fillStyle = '#d6d6cc'; rr(g, x0 + box * 0.14, y0 + h * 0.03, box * 0.86, h, h * 0.22); g.fill();
  g.fillStyle = '#f7f7f0'; rr(g, x0 + box * 0.14, y0, box * 0.86, h * 0.97, h * 0.22); g.fill();
  g.fillStyle = sk.body; rr(g, x0 + box * 0.14, y0 + h * 0.4, box * 0.86, h * 0.2, 3); g.fill();
  // 回收標誌（三個箭頭繞圈）
  const cx = x0 + box * 0.56, cy = y0 + h * 0.5, r = h * 0.22;
  g.strokeStyle = '#2f9e4a'; g.lineWidth = Math.max(1.5, h * 0.07); g.lineCap = 'round';
  for (let k = 0; k < 3; k++) {
    const a0 = k * TAU / 3 - 1.4, a1 = a0 + 1.5;
    g.beginPath(); g.arc(cx, cy, r, a0, a1); g.stroke();
    const ax = cx + Math.cos(a1) * r, ay = cy + Math.sin(a1) * r;
    g.fillStyle = '#2f9e4a'; g.beginPath(); g.moveTo(ax + Math.cos(a1 + 1.57) * r * 0.42, ay + Math.sin(a1 + 1.57) * r * 0.42);
    g.lineTo(ax + Math.cos(a1) * r * 0.32, ay + Math.sin(a1) * r * 0.32); g.lineTo(ax - Math.cos(a1) * r * 0.32, ay - Math.sin(a1) * r * 0.32); g.fill();
  }
  g.lineCap = 'butt';
  // 音符（垃圾車會唱歌）
  const nx = x0 + box * 0.3, ny = y0 + h * 0.3;
  g.fillStyle = '#5a4fcf'; ell(g, nx, ny + h * 0.14, h * 0.07, h * 0.055); g.fill();
  g.strokeStyle = '#5a4fcf'; g.lineWidth = Math.max(1, h * 0.04);
  g.beginPath(); g.moveTo(nx + h * 0.06, ny + h * 0.14); g.lineTo(nx + h * 0.06, ny - h * 0.04); g.lineTo(nx + h * 0.14, ny); g.stroke();
  // 車頭
  const cx0 = x0 + w - cab;
  g.fillStyle = sk.dark; rr(g, cx0, y0 + h * 0.03, cab, h, h * 0.3); g.fill();
  g.fillStyle = sk.body; rr(g, cx0, y0, cab, h * 0.97, h * 0.3); g.fill();
  g.fillStyle = sk.roof; rr(g, cx0 + cab * 0.08, y0 + h * 0.15, cab * 0.48, h * 0.68, h * 0.14); g.fill();
  g.fillStyle = '#ff8a00'; rr(g, cx0 + cab * 0.22, y0 + h * 0.4, cab * 0.18, h * 0.2, 3); g.fill();
  g.fillStyle = '#9fd6f2'; rr(g, cx0 + cab * 0.62, y0 + h * 0.12, cab * 0.18, h * 0.74, h * 0.06); g.fill();
  g.fillStyle = '#fff6b8'; ell(g, x0 + w - 2, y0 + h * 0.2, 2.5, h * 0.09); g.fill(); ell(g, x0 + w - 2, y0 + h * 0.8, 2.5, h * 0.09); g.fill();
}
function paintScooter(g, C, helmet) {
  const cx = C * 0.5, cy = C * 0.5, L = C * 0.8, wdt = C * 0.3;
  g.fillStyle = '#2b2b33';
  rr(g, cx - L * 0.5, cy - wdt * 0.17, L * 0.22, wdt * 0.34, wdt * 0.15); g.fill();
  rr(g, cx + L * 0.28, cy - wdt * 0.17, L * 0.22, wdt * 0.34, wdt * 0.15); g.fill();
  g.fillStyle = '#e8eef5'; rr(g, cx - L * 0.36, cy - wdt * 0.5, L * 0.66, wdt, wdt * 0.45); g.fill();
  g.fillStyle = '#4aa3ff'; rr(g, cx + L * 0.12, cy - wdt * 0.42, L * 0.2, wdt * 0.84, wdt * 0.35); g.fill();
  // 把手
  g.strokeStyle = '#2b2b33'; g.lineWidth = Math.max(1.5, C * 0.05); g.lineCap = 'round';
  g.beginPath(); g.moveTo(cx + L * 0.24, cy - wdt * 0.95); g.lineTo(cx + L * 0.24, cy + wdt * 0.95); g.stroke(); g.lineCap = 'butt';
  g.fillStyle = '#9fd6f2'; ell(g, cx + L * 0.26, cy - wdt * 1.0, C * 0.035, C * 0.035); g.fill(); ell(g, cx + L * 0.26, cy + wdt * 1.0, C * 0.035, C * 0.035); g.fill();
  // 騎士（安全帽）
  g.fillStyle = '#f3c9a0'; ell(g, cx + L * 0.08, cy - wdt * 0.62, C * 0.05, C * 0.05); g.fill(); ell(g, cx + L * 0.08, cy + wdt * 0.62, C * 0.05, C * 0.05); g.fill();
  g.fillStyle = '#6a7fd0'; ell(g, cx - L * 0.06, cy, C * 0.13, C * 0.18); g.fill();
  g.fillStyle = helmet || '#ff5d52'; ell(g, cx - L * 0.04, cy, C * 0.13, C * 0.13); g.fill();
  g.fillStyle = 'rgba(255,255,255,0.5)'; ell(g, cx - L * 0.08, cy - C * 0.05, C * 0.05, C * 0.03); g.fill();
  g.fillStyle = '#2b2b33'; rr(g, cx + L * 0.02, cy - C * 0.07, C * 0.05, C * 0.14, 2); g.fill();
}
const spriteCache = new Map();
function sprite(kind, L, C, extra) {
  const key = kind + '|' + L + '|' + Math.round(C * dpr) + '|' + (extra || '');
  let s = spriteCache.get(key);
  if (s) return s;
  s = document.createElement('canvas');
  s.width = Math.ceil(L * C * dpr); s.height = Math.ceil(C * dpr);
  const g = s.getContext('2d');
  g.setTransform(dpr, 0, 0, dpr, 0, 0);
  paintVehicle(g, kind, L, C, extra);
  if (spriteCache.size > 120) spriteCache.clear();
  spriteCache.set(key, s);
  return s;
}

/* =====================================================================
 * 場景模型：遊戲、標題示範、編輯器共用
 * ===================================================================== */
// M = { W, er, vis:[{t,o,len,skin,dir,x,y,ox,oy,sq,sel,ang,extra}], pillars:[{x,y}], barriers:[{x,y,n,a}], arm, lightGreen, red: vis[0] }
function buildModel(puz, seedStr) {
  const W = puz.W, rng = rngOf(hashStr(seedStr || Core.encode(puz)));
  const M = { W, er: Core.exitRow(W), vis: [], pillars: [], barriers: [], arm: 0, light: 0, booth: 0 };
  let trucks = 0;
  puz.pieces.forEach(p => {
    if (p.t === 'P') { M.pillars.push({ x: p.x, y: p.y, pop: 1 }); return; }
    if (p.t === 'B') { M.barriers.push({ x: p.x, y: p.y, n: p.n, a: 0, wob: 0, pop: 1 }); return; }
    let skin = 'green', extra = '';
    if (p.t === 'R') skin = 'red';
    else if (p.t === 'C') skin = CAR_SKINS[Math.floor(rng() * CAR_SKINS.length)];
    else if (p.t === 'T') skin = (trucks++ + Math.floor(rng() * 2)) % 2 ? 'bus' : 'truck';
    else if (p.t === 'G') skin = 'garbage';
    else if (p.t === 'S') { skin = 'scooter'; extra = HELMETS[Math.floor(rng() * HELMETS.length)]; }
    const dir = p.t === 'R' ? 1 : rng() < 0.5 ? 1 : -1;
    const ang = p.t === 'S' ? Math.floor(rng() * 4) * Math.PI / 2 : p.o === 'h' ? (dir > 0 ? 0 : Math.PI) : (dir > 0 ? Math.PI / 2 : -Math.PI / 2);
    M.vis.push({ t: p.t, o: p.t === 'S' ? 's' : p.o, len: p.len, skin, extra, dir, x: p.x, y: p.y, ox: 0, oy: 0, sq: 0, wob: 0, ang, pop: 1, glow: 0, out: 0 });
  });
  M.red = M.vis[0];
  return M;
}

/* =====================================================================

const B = { C: 40, bx: 0, by: 0, W: 6, area: null };

function cellXY(x, y) { return [B.bx + x * B.C, B.by + y * B.C]; }

/* ---------- 背景（快取在離屏畫布） ---------- */
let bgCanvas = null, bgKey = '';
function buildBg() {
  const key = [W, H, dpr, B.C, B.bx, B.by, B.W, scene].join('|');

  // 草地

  g.fillStyle = grd; g.fillRect(0, 0, W, H);
  g.fillStyle = 'rgba(255,255,255,0.08)';
  for (let k = 0; k < 90; k++) { ell(g, rng() * W, rng() * H, 6 + rng() * 18, 3 + rng() * 8); g.fill(); }
  g.fillStyle = 'rgba(40,110,40,0.12)';
  for (let k = 0; k < 70; k++) { ell(g, rng() * W, rng() * H, 4 + rng() * 14, 2 + rng() * 6); g.fill(); }
  const m = MARGIN_U * C, lotX = bx - m, lotY = by - m, lotW = GW * C + m * 2, lotH = GW * C + m * 2;
  // 人行道
  g.fillStyle = 'rgba(0,0,0,0.12)'; rr(g, lotX - C * 0.14, lotY - C * 0.1, lotW + C * 0.28, lotH + C * 0.34, C * 0.4); g.fill();
  g.fillStyle = '#e8e1d2'; rr(g, lotX - C * 0.14, lotY - C * 0.14, lotW + C * 0.28, lotH + C * 0.28, C * 0.4); g.fill();
  // 出口車道
  const laneY = by + er * C, laneX0 = bx + GW * C, laneX1 = laneX0 + EXIT_U * C + C * 3;
  g.fillStyle = '#e8e1d2'; g.fillRect(laneX0, laneY - C * 0.28, laneX1 - laneX0, C * 1.56);
  g.fillStyle = '#5b606c'; g.fillRect(laneX0 - m, laneY - C * 0.08, laneX1 - laneX0 + m, C * 1.16);
  // 柏油
  g.fillStyle = '#5b606c'; rr(g, lotX, lotY, lotW, lotH, C * 0.28); g.fill();
  g.fillStyle = 'rgba(255,255,255,0.05)';

  g.fillStyle = 'rgba(0,0,0,0.08)';
  for (let k = 0; k < GW * 3; k++) { ell(g, lotX + rng() * lotW, lotY + rng() * lotH, C * (0.2 + rng() * 0.4), C * (0.1 + rng() * 0.2)); g.fill(); }

    g.beginPath(); g.moveTo(bx + k * C, by); g.lineTo(bx + k * C, by + GW * C); g.stroke();

    g.beginPath(); g.moveTo(x, by + GW * C + m * 0.55); g.lineTo(x, by + GW * C - C * 0.32); g.stroke();
  }
  for (let k = 0; k <= GW; k++) {

    g.beginPath(); g.moveTo(bx - m * 0.55, y); g.lineTo(bx + C * 0.25, y); g.stroke();
  }

  for (let k = 0; k < 2; k++) {
    const ax = bx + GW * C + C * (0.15 + k * 0.62), ay = laneY + C * 0.5;

    if (rng() < 0.35) { g.fillStyle = ['#ff8fb1', '#ffd65c', '#fff'][Math.floor(rng() * 3)]; for (let q = 0; q < 4; q++) { ell(g, tx + (rng() - 0.5) * r * 1.2, ty + (rng() - 0.5) * r * 1.2, r * 0.1, r * 0.1); g.fill(); } }
  });
}

/* ---------- 粒子（物件池） ---------- */
const PMAX = 90;
const parts = [];
for (let i = 0; i < PMAX; i++) parts.push({ on: false });

  if (!p) return;
  p.on = true; p.x = o.x; p.y = o.y; p.vx = o.vx || 0; p.vy = o.vy || 0; p.life = 0; p.max = o.max || 0.6; p.r = o.r || 4; p.col = o.col || '#fff';
  p.kind = o.kind || 'puff'; p.rot = Math.random() * TAU; p.vr = (Math.random() - 0.5) * 10; p.g = o.g || 0;
}
function puffs(px, py, n, dirx, diry) {
  if (KG.lowEnd) n = Math.ceil(n / 2);
  for (let k = 0; k < n; k++) spawn({ x: px + (Math.random() - 0.5) * 6, y: py + (Math.random() - 0.5) * 6, vx: (dirx || 0) * (20 + Math.random() * 40) + (Math.random() - 0.5) * 30, vy: (diry || 0) * (20 + Math.random() * 40) + (Math.random() - 0.5) * 30, r: B.C * (0.08 + Math.random() * 0.08), max: 0.45 + Math.random() * 0.3, col: 'rgba(235,235,240,0.7)', kind: 'puff' });
}
function confettiBurst(px, py, n) {
  const cols = ['#ff5d52', '#ffcb3d', '#4fd0c1', '#4aa3ff', '#a07cf0', '#ff86b8'];
  if (KG.lowEnd) n = Math.ceil(n * 0.6);
  for (let k = 0; k < n; k++) {
    const a = -Math.PI / 2 + (Math.random() - 0.5) * 2.2, sp = 180 + Math.random() * 320;
    spawn({ x: px, y: py, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, r: 4 + Math.random() * 4, max: 1.4 + Math.random() * 0.8, col: cols[k % cols.length], kind: 'conf', g: 520 });
  }
}
function updateParts(dt) {
  for (let i = 0; i < PMAX; i++) {
    const p = parts[i]; if (!p.on) continue;
    p.life += dt; if (p.life >= p.max) { p.on = false; continue; }
    p.vy += p.g * dt; p.x += p.vx * dt; p.y += p.vy * dt; p.rot += p.vr * dt;
    if (p.kind === 'puff') { p.vx *= 0.92; p.vy *= 0.92; }
    else { p.vx *= 0.985; }
  }
}
function drawParts() {
  for (let i = 0; i < PMAX; i++) {
    const p = parts[i]; if (!p.on) continue;
    const k = p.life / p.max;
    if (p.kind === 'puff') { ctx.globalAlpha = (1 - k) * 0.8; ctx.fillStyle = p.col; ell(ctx, p.x, p.y, p.r * (1 + k * 1.6), p.r * (1 + k * 1.6)); ctx.fill(); }
    else { ctx.globalAlpha = Math.min(1, (1 - k) * 2); ctx.fillStyle = p.col; ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot); ctx.fillRect(-p.r, -p.r * 0.55, p.r * 2, p.r * 1.1); ctx.restore(); }
  }
  ctx.globalAlpha = 1;
}

/* ---------- 移動 ---------- */
function blockersAhead() {
  // 紅車到出口之間還有幾個東西擋著；只剩一個而且一步就能讓開，也算「快出去了」
  const S = G.S, W = G.puz.W, er = Core.exitRow(W), t = moves();
  S.fill(G.pos, t);
  const set = [];
  for (let x = G.pos[0] + 2; x < W; x++) { const o = S.occ[er * W + x]; if (o && set.indexOf(o) < 0) set.push(o); }
  if (set.length !== 1) return set.length;
  const o = set[0];
  if (o === 254) { const b = G.M.barriers.find(q => q.y === er && t < q.n); return b && b.n - t <= 1 ? 0.5 : 1; }
  if (o === 255) return 9;
  const i = o - 1, v = S.veh[i];
  if (v.o === 'h') return 9;
  const r = S.range(G.pos, t, i, 'y'), tg = targetOf(G.M, S, i, G.pos[i]), L = v.o === 's' ? 1 : v.len;
  // 往上或往下一次開走，能不能離開出口那一排
  const upOk = tg.y + L - 1 + r[0] < er, downOk = tg.y + r[1] > er;
  return upOk || downOk ? 0.5 : 1;
}
function updateCloseLayer() {
  if (!KG.music || !G.S) return;
  const n = blockersAhead();
  const on = n < 1 && !G.won;

  KG.music.setTempo(n === 0 && !G.won ? 1.05 : 1);
}

}
function moveSound(i, dist) {

  else sfx('purr', { pitch: 0.82 + dist * 0.09 + (v.len === 3 ? -0.1 : 0), pan, vol: v.len === 3 ? 1 : 0.85 });

}
/** 把車 i 移到 np（已確認合法）。anim：要不要做滑動動畫 */

  const lastH = G.hist[G.hist.length - 1];

    lastH[2] = np;

  } else G.hist.push([i, from, np]);
  G.pos[i] = np;

  const v = G.M.vis[i];

    const a = targetOf(G.M, G.S, i, from), b = targetOf(G.M, G.S, i, np);
    v.ang = b.x > a.x ? 0 : b.x < a.x ? Math.PI : b.y > a.y ? Math.PI / 2 : -Math.PI / 2;

/* ---------- 提示：用解題器算下一步 ---------- */

}

    const [px, py] = vehCenterPx(mv[0]);

  if (T.phase === 'win' && T.t > 0.6) { T.phase = 'drive'; T.t = 0; tween(T.M, { arm: 1 }, 0.6, 'out'); T.M.light = 1; T.M.booth = 1; }
  if (T.phase === 'drive' && T.t > 0.6) {
    const red = T.M.red; if (!T.drive) T.drive = { x0: red.x, t: 0 };
    T.drive.t += dt; red.x = T.drive.x0 + 0.6 * T.drive.t + 5 * T.drive.t * T.drive.t;
    if (Math.random() < 0.4) { const [px, py] = vehCenterOf(red); puffs(px - B.C, py, 1, -1, 0); }
    if (T.drive.t > 2.2) { T.phase = 'reset'; T.t = 0; }
  }
  if (T.phase === 'reset') { tween(T.M, { arm: 0 }, 0.4); T.M.light = 0; T.M.booth = 0; titleDemoReset(); }
}
function vehCenterOf(v) { const r = vehRect(v); return [B.bx + (r.x + r.w / 2) * B.C, B.by + (r.y + r.h / 2) * B.C]; }

/* =====================================================================
 * 畫面
 * ===================================================================== */
function drawModel(M, o) {
  o = o || {};
  const C = B.C;
  drawBooth(M);
  M.pillars.forEach(drawPillar);
  M.barriers.forEach(b => drawBarrier(b, o.moves || 0));
  if (o.dots) drawDots(o.dots);
  if (o.hint) drawHintGhost(M, o.hint);
  for (let i = 0; i < M.vis.length; i++) if (i !== o.top) drawVehicle(M.vis[i]);
  if (o.top != null && o.top >= 0) { drawVehicle(M.vis[o.top]); if (o.selOutline) drawSelection(M.vis[o.top]); }
  if (o.hint) drawHint(M, o.hint);
  drawArm(M);
  void C;
}
function drawDots(d) {
  const C = B.C;
  ctx.fillStyle = 'rgba(255,255,255,0.55)';
  d.forEach(([x, y]) => { ell(ctx, B.bx + (x + 0.5) * C, B.by + (y + 0.5) * C, C * 0.09, C * 0.09); ctx.fill(); });
}
function selDots() {
  if (G.sel < 0 || G.won) return null;
  const i = G.sel, v = G.S.veh[i], tg = targetOf(G.M, G.S, i, G.pos[i]), out = [];
  const axes = v.o === 's' ? ['x', 'y'] : [v.o === 'h' ? 'x' : 'y'];
  axes.forEach(ax => {
    const r = G.S.range(G.pos, moves(), i, ax), L = v.o === 's' ? 1 : v.len;
    for (let k = r[0]; k <= r[1]; k++) {
      if (k === 0) continue;
      if (ax === 'x') out.push([k > 0 ? tg.x + L - 1 + k : tg.x + k, tg.y]); else out.push([tg.x, k > 0 ? tg.y + L - 1 + k : tg.y + k]);
    }
  });
  return out;
}
function hintGhost(M, h) {
  const v = M.vis[h.i], tg = targetOf(M, G.S, h.i, h.to);
  const ghost = Object.assign({}, v, { x: tg.x, y: tg.y, ox: 0, oy: 0, sq: 0, wob: 0, pop: 1 });
  if (v.o === 's') { ghost.ang = tg.x > v.x ? 0 : tg.x < v.x ? Math.PI : tg.y > v.y ? Math.PI / 2 : -Math.PI / 2; }
  return ghost;
}
function drawHintGhost(M, h) {
  const k = 0.5 + 0.5 * Math.sin(time * 5);
  drawVehicle(hintGhost(M, h), 0.3 + k * 0.15);
}
function drawHint(M, h) {
  const v = M.vis[h.i], ghost = hintGhost(M, h);
  const k = 0.5 + 0.5 * Math.sin(time * 5), C = B.C, r = vehRect(v);
  ctx.strokeStyle = 'rgba(255,203,61,' + (0.55 + k * 0.45) + ')'; ctx.lineWidth = 3 + k * 2;
  rr(ctx, B.bx + r.x * C - 2, B.by + r.y * C - 2, r.w * C + 4, r.h * C + 4, C * 0.26); ctx.stroke();
  const [ax, ay] = vehCenterOf(v), [bx2, by2] = vehCenterOf(ghost);
  const ang = Math.atan2(by2 - ay, bx2 - ax), dist = Math.hypot(bx2 - ax, by2 - ay);
  ctx.strokeStyle = '#2f2a45'; ctx.lineWidth = C * 0.2; ctx.lineCap = 'round';
  ctx.save(); ctx.translate(ax, ay); ctx.rotate(ang);
  ctx.globalAlpha = 0.35; ctx.beginPath(); ctx.moveTo(C * 0.1, 0); ctx.lineTo(dist - C * 0.3, 0); ctx.stroke(); ctx.globalAlpha = 1;
  ctx.restore();
  ctx.save(); ctx.translate(ax, ay); ctx.rotate(ang);
  const sh = (time * 1.4) % 1 * C * 0.2; void sh;
  ctx.strokeStyle = '#ffcb3d'; ctx.lineWidth = C * 0.13; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(C * 0.1 + sh, 0); ctx.lineTo(dist - C * 0.3, 0); ctx.stroke();
  ctx.fillStyle = '#ffcb3d'; ctx.beginPath(); ctx.moveTo(dist, 0); ctx.lineTo(dist - C * 0.36, -C * 0.24); ctx.lineTo(dist - C * 0.36, C * 0.24); ctx.closePath(); ctx.fill();
  ctx.lineCap = 'butt'; ctx.restore();
  if (h.hand) {
    // 教學用的小手
    const p = (time * 0.7) % 1, e = Ease.inOut(Math.min(1, p * 1.4));
    const hx = lerp(ax, bx2, e), hy = lerp(ay, by2, e) + C * 0.15;
    ctx.globalAlpha = p > 0.85 ? (1 - p) / 0.15 : 1;
    ctx.fillStyle = 'rgba(0,0,0,0.2)'; ell(ctx, hx + 4, hy + 6, C * 0.2, C * 0.2); ctx.fill();
    ctx.fillStyle = '#fff'; ell(ctx, hx, hy, C * 0.2, C * 0.2); ctx.fill();
    ctx.strokeStyle = '#2f2a45'; ctx.lineWidth = 3; ctx.stroke();
    ctx.fillStyle = '#ffcb3d'; ell(ctx, hx, hy, C * 0.08, C * 0.08); ctx.fill();
    ctx.globalAlpha = 1;
  }
}
function drawPlay(dt) {
  const M = G.M;
  if (G.driveOut) {
    const d = G.driveOut; d.t += dt;
    M.red.x = d.x0 + 0.6 * d.t + 5.5 * d.t * d.t;
    if (Math.random() < 0.5) { const [px, py] = vehCenterOf(M.red); puffs(px - B.C * 0.9, py, 1, -1, 0); }
    if (d.t > 2) G.driveOut = null;
  }
  let hint = G.hint;
  if (!hint && G.tut && !G.won && moves() === 0 && !G.paused) hint = { i: G.tut[0], to: G.tut[2], hand: true };
  drawModel(M, { moves: moves(), dots: drag ? null : selDots(), hint, top: drag && drag.i >= 0 ? drag.i : G.sel, selOutline: G.sel >= 0 && !G.won });
}
function drawEdit() {
  drawModel(E.M, { moves: 0 });
}

/* =====================================================================
 * 場景切換、浮動卡片
 * ===================================================================== */
function showOv(id) { $(id).classList.remove('hidden'); }
function hideOv(id) { $(id).classList.add('hidden'); }
function setScene(s) {
  scene = s;
  $('scrTitle').classList.toggle('hidden', s !== 'title');
  $('scrLevels').classList.toggle('hidden', s !== 'levels');
  $('btnBack').classList.toggle('hidden', s !== 'levels');
  $('hudPlay').classList.toggle('hidden', s !== 'play');
  $('edUI').classList.toggle('hidden', s !== 'edit');
  if (s !== 'play') { G.won = false; G.driveOut = null; G.paused = false; hideOv('ovPause'); hideOv('ovResult'); hideOv('ovCard'); clearTimers('win'); clearTimers('res'); }
  if (s !== 'play' && KG.music) { KG.music.setLayer('close', false); KG.music.setTempo(1); }
  drag = null;
  layout();
}
function goTitle() { setScene('title'); refreshTitle(); musicMenu(); if (KG.music) KG.music.resume(); }
let lvTier = 0;
function goLevels(t) {
  if (t != null) lvTier = t; else { const l = Save.get('last', null); lvTier = l ? l.tier : 0; }
  if (!tierUnlocked(lvTier)) lvTier = 0;
  setScene('levels'); buildLevels(); musicMenu(); if (KG.music) KG.music.resume();
}
function goEdit() { setScene('edit'); if (!E.M) editLoad(); else editRebuild(); layout(); musicMenu(); if (KG.music) KG.music.resume(); }
function goDaily() { startPuzzle({ mode: 'daily', code: DAILY[dailyIndex()] }); }
function continueTarget() {
  // 下一個還沒過的關卡
  const l = Save.get('last', null);
  if (l && LEVELS[l.tier]) {
    const st = Save.stars(l.tier);
    if (!(st[l.idx] > 0)) return l;
    if (l.idx < 39 && levelUnlocked(l.tier, l.idx + 1)) return { tier: l.tier, idx: l.idx + 1 };
    if (l.idx === 39 && l.tier < 4 && tierUnlocked(l.tier + 1)) return { tier: l.tier + 1, idx: 0 };
  }
  for (let t = 0; t < 5; t++) { if (!tierUnlocked(t)) break; const st = Save.stars(t); for (let i = 0; i < 40; i++) if (!(st[i] > 0) && levelUnlocked(t, i)) return { tier: t, idx: i }; }
  return { tier: 0, idx: 0 };
}
function refreshTitle() {
  const c = continueTarget();
  $('tPlay').innerHTML = ico('play') + '開始玩 <small style="font-size:15px;opacity:.9">' + TIER_NAMES[c.tier] + ' ' + (c.idx + 1) + '</small>';
  $('tLevels').innerHTML = ico('grid') + '選關';
  const done = Save.get('daily', {})[todayKey()];
  $('tDaily').innerHTML = ico('cal') + '每日一題' + (done ? ' ' + ico('check') : '<span class="badge">新</span>');
  $('tEdit').innerHTML = ico('pencil') + '自己設計停車場';
  refreshToggles();
}
function refreshToggles() {
  const mOn = KG.music ? KG.music.isEnabled() : false;
  ['tMusic', 'pMusic'].forEach(id => { const b = $(id); b.innerHTML = ico('music') + '音樂 ' + (mOn ? '開' : '關'); b.classList.toggle('off', !mOn); });
  ['tSfx', 'pSfx'].forEach(id => { const b = $(id); b.innerHTML = ico('sfx') + '音效 ' + (sfxOn ? '開' : '關'); b.classList.toggle('off', !sfxOn); });
}
function toggleMusic() { if (!KG.music) return; KG.music.setEnabled(!KG.music.isEnabled()); if (G.paused && scene === 'play') KG.music.pause(); sfx('ui'); refreshToggles(); }
function toggleSfx() { sfxOn = !sfxOn; Save.set('sfx', sfxOn); sfx('ui'); refreshToggles(); }
function buildLevels() {
  const tabs = $('lvTabs'); tabs.innerHTML = '';
  let total = 0;
  for (let t = 0; t < 5; t++) total += Save.totalStars(t);
  $('lvStars').innerHTML = '★ ' + total + ' / 600';
  TIER_NAMES.forEach((n, t) => {
    const b = document.createElement('button');
    const un = tierUnlocked(t);
    b.className = 'b' + (t === lvTier ? ' sel' : '') + (un ? '' : ' off');
    b.innerHTML = (un ? '' : ico('lock')) + n + '<small>' + (un ? Save.cleared(t) + '/40' + (t === 4 ? ' 7×7' : '') : '過 10 關開放') + '</small>';
    b.addEventListener('click', () => {
      if (!un) { sfx('bump'); showMsg('先在「' + TIER_NAMES[t - 1] + '」過 10 關'); return; }
      lvTier = t; sfx('page'); buildLevels();
    });
    tabs.appendChild(b);
  });
  const notes = ['一般的小汽車和卡車', '後半段有機車出現', '垃圾車、柱子登場', '施工路障：走滿幾步才會打開', '7×7 大停車場，全部一起來'];
  $('lvNote').textContent = notes[lvTier];
  const grid = $('lvGrid'); grid.innerHTML = '';
  const st = Save.stars(lvTier);
  for (let i = 0; i < 40; i++) {
    const b = document.createElement('button');
    const un = levelUnlocked(lvTier, i), s = st[i] || 0;
    b.className = 'lv' + (s ? ' done' : '') + (un ? '' : ' lock');
    const f = featuresOf(Core.parse(LEVELS[lvTier][i]));
    b.innerHTML = (un ? (i + 1) : ico('lock')) + '<span class="st">' + [0, 1, 2].map(k => k < s ? '<b>★</b>' : '★').join('') + '</span>' + ((f.S || f.G || f.P || f.B) && un ? '<span class="tw"></span>' : '');
    b.setAttribute('aria-label', '第 ' + (i + 1) + ' 關');
    b.addEventListener('click', () => {
      if (!un) { sfx('bump'); showMsg('先過前面的關卡喔'); return; }
      sfx('select'); startLevel(lvTier, i);
    });
    grid.appendChild(b);
  }
}
function pauseGame() {
  if (scene !== 'play' || G.won || G.paused || !$('ovCard').classList.contains('hidden')) return;
  G.paused = true; drag = null;
  if (KG.music) KG.music.pause();
  const q = $('pQuit');
  q.innerHTML = G.mode === 'custom' ? ico('pencil') + '回去設計' : ico('grid') + '選關';
  refreshToggles(); showOv('ovPause'); sfx('back', { vol: 0.6 });
}
function resumeGame() {
  if (!G.paused) return;
  G.paused = false; hideOv('ovPause');
  if (KG.music) KG.music.resume();
  sfx('select');
}

/* =====================================================================
 * 版面配置
 * ===================================================================== */
function layout() {
  const r = cv.getBoundingClientRect();
  W = Math.max(200, r.width); H = Math.max(200, r.height); dpr = window.devicePixelRatio || 1;
  cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
  const land = W > H * 1.1;
  document.body.classList.toggle('land', land);
  spriteCache.clear(); bgKey = '';
  let area, GW = 6;
  if (scene === 'play' && G.puz) {
    GW = G.puz.W;
    if (land) area = { x: 168, y: 8, w: W - 168 - 64, h: H - 16 };
    else {
      const top = Math.max($('hudTop').getBoundingClientRect().bottom, $('btnPause').getBoundingClientRect().bottom) + 4;
      const bot = $('hudBot').getBoundingClientRect().top - 6;
      area = { x: 8, y: top, w: W - 16, h: bot - top };
    }
  } else if (scene === 'edit') {
    GW = E.W;
    if (land) area = { x: 186, y: 8, w: W - 186 - 146, h: H - 16 };
    else {
      const top = $('edTop').getBoundingClientRect().bottom + 4, bot = $('edTools').getBoundingClientRect().top - 6;
      area = { x: 8, y: top, w: W - 16, h: bot - top };
    }
  } else if (scene === 'title') {
    if (land) { const c = document.querySelector('#scrTitle .tcol').getBoundingClientRect(); area = { x: c.right + 10, y: 20, w: W - c.right - 24, h: H - 30 }; }
    else {
      const top = document.querySelector('#scrTitle .logo').getBoundingClientRect().bottom + 6, bot = $('tBtns').getBoundingClientRect().top - 8;
      area = { x: 8, y: top, w: W - 16, h: Math.max(80, bot - top) };
    }
  } else area = { x: 10, y: 60, w: W - 20, h: H - 70 };
  fitBoard(area, GW);
}
function onResize() { layout(); }
window.addEventListener('resize', onResize);
window.addEventListener('orientationchange', () => setTimeout(onResize, 200));
if (window.visualViewport) window.visualViewport.addEventListener('resize', onResize);

/* =====================================================================
 * 事件
 * ===================================================================== */
let activePid = null;
cv.addEventListener('pointerdown', e => {
  if (activePid != null && activePid !== e.pointerId) return;
  activePid = e.pointerId;
  try { cv.setPointerCapture(e.pointerId); } catch (err) { /* 忽略 */ }
  const [x, y] = ptr(e);
  if (scene === 'play') playDown(x, y, e.pointerId);
  else if (scene === 'edit') editDown(x, y);
  e.preventDefault();
});
cv.addEventListener('pointermove', e => { if (e.pointerId !== activePid) return; const [x, y] = ptr(e); if (scene === 'play') playMove(x, y); });
function endPtr(e, cancel) {
  if (e.pointerId !== activePid) return;
  activePid = null;
  const [x, y] = ptr(e);
  if (scene === 'play') playUp(x, y, cancel);
}
cv.addEventListener('pointerup', e => endPtr(e, false));
cv.addEventListener('pointercancel', e => endPtr(e, true));
cv.addEventListener('lostpointercapture', e => { if (e.pointerId === activePid) endPtr(e, false); });

function bind(id, fn, snd) { $(id).addEventListener('click', () => { if (snd !== false) sfx(snd || 'ui'); fn(); }); }
bind('tPlay', () => { const c = continueTarget(); startLevel(c.tier, c.idx); }, 'select');
bind('tLevels', () => goLevels(), 'page');
bind('tDaily', goDaily, 'select');
bind('tEdit', goEdit, 'page');
bind('tMusic', toggleMusic, false);
bind('tSfx', toggleSfx, false);
bind('btnBack', () => { goTitle(); }, 'back');
bind('btnPause', pauseGame, false);
bind('btnUndo', doUndo, false);
bind('btnRestart', doRestart, false);
bind('btnHint', doHint, false);
bind('pResume', resumeGame, false);
bind('pRestart', () => { G.paused = false; hideOv('ovPause'); if (KG.music) KG.music.resume(); startPuzzle({ mode: G.mode, tier: G.tier, idx: G.idx, code: G.code }); });
bind('pQuit', () => { G.paused = false; hideOv('ovPause'); if (G.mode === 'custom') goEdit(); else goLevels(G.mode === 'level' ? G.tier : undefined); });
bind('pHome', () => { G.paused = false; hideOv('ovPause'); goTitle(); });
bind('pMusic', toggleMusic, false);
bind('pSfx', toggleSfx, false);
$('btnUndo').innerHTML = ico('undo') + '復原';
$('btnRestart').innerHTML = ico('restart') + '重來';
$('btnHint').innerHTML = ico('hint') + '提示';
$('btnPause').innerHTML = ico('pause');
$('btnBack').innerHTML = ico('back');
$('pResume').innerHTML = ico('play') + '繼續';
$('pRestart').innerHTML = ico('restart') + '重新開始';
$('pHome').innerHTML = ico('home') + '回標題';

window.addEventListener('keydown', e => {
  const k = e.key;
  if (scene === 'play') {
    if (!$('ovCard').classList.contains('hidden')) { if (k === 'Enter' || k === ' ') { e.preventDefault(); $('cOk').click(); } return; }
    if (k === 'Escape' || k === 'p' || k === 'P') { e.preventDefault(); if (G.paused) resumeGame(); else pauseGame(); return; }
    if (G.paused || G.won) return;
    if (k === 'ArrowLeft') { e.preventDefault(); keyMove(-1, 0); }
    else if (k === 'ArrowRight') { e.preventDefault(); keyMove(1, 0); }
    else if (k === 'ArrowUp') { e.preventDefault(); keyMove(0, -1); }
    else if (k === 'ArrowDown') { e.preventDefault(); keyMove(0, 1); }
    else if (k === 'Tab') { e.preventDefault(); cycleSel(e.shiftKey ? -1 : 1); }
    else if (k === 'z' || k === 'Z' || k === 'Backspace') { e.preventDefault(); doUndo(); }
    else if (k === 'r' || k === 'R') doRestart();
    else if (k === 'h' || k === 'H') doHint();
  } else if (k === 'Escape' && (scene === 'levels' || scene === 'edit')) goTitle();
});
document.addEventListener('visibilitychange', () => { if (document.hidden) pauseGame(); });

/* =====================================================================
 * 主迴圈
 * ===================================================================== */
function frame(now) {
  const dt = Math.min(0.05, Math.max(0, (now - last) / 1000));
  last = now; time += dt;
  const frozen = scene === 'play' && G.paused;
  if (!frozen) { updateTweens(dt); updateTimers(dt); updateParts(dt); }
  if (msgTimer > 0) { msgTimer -= dt; if (msgTimer <= 0) $('msg').classList.remove('show'); }
  if (shakeT > 0) shakeT -= dt;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  buildBg();
  ctx.drawImage(bgCanvas, 0, 0, W, H);
  if (shakeT > 0) { const k = shakeA * Math.min(1, shakeT * 5); ctx.translate((Math.random() * 2 - 1) * k, (Math.random() * 2 - 1) * k); }
  if (scene === 'title') { titleUpdate(dt); drawModel(T.M, {}); }
  else if (scene === 'levels') { if (T.M) drawModel(T.M, {}); ctx.setTransform(dpr, 0, 0, dpr, 0, 0); ctx.fillStyle = 'rgba(36,28,52,0.45)'; ctx.fillRect(0, 0, W, H); }
  else if (scene === 'play' && G.M) drawPlay(frozen ? 0 : dt);
  else if (scene === 'edit' && E.M) drawEdit();
  drawParts();
  drawFloat(frozen ? 0 : dt);
  requestAnimationFrame(frame);
}

/* ---------- 測試用 ---------- */
window.__ce = {
  state: () => ({ scene, mode: G.mode, tier: G.tier, idx: G.idx, moves: moves(), opt: G.opt, won: G.won, paused: G.paused, sel: G.sel, pos: G.pos.slice(),
    music: KG.music ? KG.music.isPlaying() : null, close: G.closeOn, C: B.C, bx: B.bx, by: B.by, W: G.puz ? G.puz.W : 0, hint: G.hint, busy: G.busy,
    card: !$('ovCard').classList.contains('hidden'), result: !$('ovResult').classList.contains('hidden'), edit: { W: E.W, n: E.pieces.length, opt: E.opt, tool: E.tool } }),
  start: (t, i) => { startLevel(t, i); return window.__ce.state(); },
  daily: () => goDaily(),
  cell: (x, y) => cellXY(x + 0.5, y + 0.5),
  veh: i => vehCenterPx(i),
  vehInfo: () => G.S.veh.map((v, i) => Object.assign({ i, pos: G.pos[i] }, v)),
  solve: () => { const r = G.S.solve(G.pos, moves()); return r.path; },
  move: (i, to) => { commitMove(i, to); return window.__ce.state(); },
  solveAllBut: (k) => { const p = G.S.solve(G.pos, moves()).path; p.slice(0, Math.max(0, p.length - (k || 0))).forEach(([i, , to]) => commitMove(i, to, { anim: false })); G.M.vis.forEach((v, i) => { const tg = targetOf(G.M, G.S, i, G.pos[i]); v.x = tg.x; v.y = tg.y; }); return window.__ce.state(); },
  unlockAll: () => { unlockAll = true; },
  skipCards: () => { const s = Save.get('seen', {}); ['intro', 'S', 'G', 'P', 'B', 'W7'].forEach(k => { s[k] = 1; }); Save.set('seen', s); },
  levels: () => LEVELS, daily_: () => DAILY, Core
};

/* ---------- 開始 ---------- */
buildEditUI();
layout();
goTitle();
requestAnimationFrame(t => { last = t; frame(t); });
})();
