<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>數學小怪獸</title>
<link rel="stylesheet" href="../../assets/common.css">
<style>
  html, body { height: 100%; overflow: hidden; }
  body { background: linear-gradient(180deg, #8fd8ff 0%, #c8eeff 45%, #e9fbff 70%); }
  /* 背景：雲朵與草地 */
  #bg { position: fixed; inset: 0; overflow: hidden; pointer-events: none; }
  .hill { position: absolute; border-radius: 50%; }
  .hill.h1 { left: -30%; right: 25%; bottom: -26vh; height: 52vh; background: radial-gradient(ellipse at 50% 20%, #9be37a 0%, #6cc556 60%, #4fae45 100%); }
  .hill.h2 { left: 20%; right: -35%; bottom: -30vh; height: 56vh; background: radial-gradient(ellipse at 45% 20%, #b3ee8c 0%, #7fd163 55%, #5bb84c 100%); }
  .cloud { position: absolute; width: 120px; height: 40px; background: #fff; border-radius: 40px; opacity: .92;
    box-shadow: 0 6px 0 rgba(120,170,200,.15); animation: drift linear infinite; }
  .cloud::before, .cloud::after { content: ''; position: absolute; background: #fff; border-radius: 50%; }
  .cloud::before { width: 56px; height: 56px; left: 16px; top: -28px; }
  .cloud::after { width: 70px; height: 70px; left: 44px; top: -40px; }
  @keyframes drift { from { transform: translateX(-200px) scale(var(--s,1)); } to { transform: translateX(calc(100vw + 200px)) scale(var(--s,1)); } }
  .flower { position: absolute; font-size: 22px; filter: drop-shadow(0 2px 1px rgba(0,0,0,.15)); }

  #app {
    position: fixed; inset: 0; height: 100vh; height: 100dvh;
    display: grid; gap: 8px;
    padding: 70px max(12px, env(safe-area-inset-right)) max(12px, env(safe-area-inset-bottom)) max(12px, env(safe-area-inset-left));
    grid-template-columns: minmax(0, 1fr);
    grid-template-rows: auto minmax(0, 1fr) auto;
    grid-template-areas: "board" "mon" "cookies";
    touch-action: none;
  }
  #board {
    grid-area: board; justify-self: center; align-self: center; width: min(560px, 100%);
    background: linear-gradient(180deg, #fff 0%, #fff7fb 100%); border: 5px solid #fff; border-radius: 28px;
    box-shadow: var(--kg-shadow); padding: 10px 14px 12px; position: relative; text-align: center;
  }
  #eq { font-size: clamp(34px, 9vw, 52px); font-weight: 900; line-height: 1.15; letter-spacing: 2px; }
  #eq .n { display: inline-block; color: #7c5cf0; text-shadow: 0 3px 0 rgba(124,92,240,.18); }
  #eq .op { color: #ff7aa8; margin: 0 6px; }
  #eq .q { display: inline-grid; place-items: center; min-width: 1.35em; height: 1.35em; border-radius: 50%; border: 4px dashed #ffb44d; color: #ff9a1f; vertical-align: middle; font-size: .85em; }
  #eq .q.done { border-style: solid; background: #fff1c9; animation: kg-pop .4s cubic-bezier(.2,1.6,.4,1); }
  #pics { display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 6px; margin-top: 6px; min-height: 36px; }
  .grp { display: flex; flex-wrap: wrap; justify-content: center; max-width: 100%; gap: 6px; }
  .five { display: flex; gap: 1px; background: #fff3d6; border-radius: 12px; padding: 2px 5px; box-shadow: inset 0 -2px 0 rgba(0,0,0,.06); }
  .it { display: inline-block; font-size: var(--ps, 28px); line-height: 1.15; position: relative; filter: drop-shadow(0 2px 1px rgba(0,0,0,.18)); animation: kg-pop .35s cubic-bezier(.2,1.6,.4,1) both; }
  .it.x { opacity: .4; }
  .it.x::after { content: '✖'; position: absolute; inset: 0; display: grid; place-items: center; color: #ff4d6d; font-size: .8em; opacity: 1; filter: none; }
  .pop { font-size: 26px; font-weight: 900; color: #ff7aa8; }
  #sayBtn { position: absolute; right: -6px; top: -14px; width: 50px; height: 50px; border-radius: 50%; border: 3px solid #fff;
    background: linear-gradient(180deg, #ffe58a, #f5b82e); box-shadow: 0 4px 0 #c48a12; font-size: 22px; cursor: pointer; }
  #sayBtn:active { transform: translateY(3px); box-shadow: 0 1px 0 #c48a12; }

  #monWrap { grid-area: mon; min-height: 0; display: flex; align-items: center; justify-content: center; position: relative; }
  #monster { width: min(100%, 100%); height: 100%; max-width: 440px; max-height: 440px; overflow: visible; }
  #monWrap.no { animation: headno .7s ease; }
  @keyframes headno { 0%,100% { transform: rotate(0); } 15% { transform: rotate(-7deg); } 35% { transform: rotate(7deg); } 55% { transform: rotate(-5deg); } 75% { transform: rotate(4deg); } }

  #cookies { grid-area: cookies; display: flex; justify-content: center; align-items: center; gap: clamp(12px, 5vw, 34px); padding: 6px 0 4px; }
  .cookie {
    --cs: clamp(80px, 24vw, 108px);
    width: var(--cs); height: var(--cs); border-radius: 50%; position: relative; cursor: grab; touch-action: none;
    background:
      radial-gradient(circle at 24% 30%, #5a3416 0 6%, transparent 7%),
      radial-gradient(circle at 74% 24%, #5a3416 0 5%, transparent 6%),
      radial-gradient(circle at 80% 66%, #6b3d19 0 6%, transparent 7%),
      radial-gradient(circle at 30% 76%, #5a3416 0 5%, transparent 6%),
      radial-gradient(circle at 54% 86%, #6b3d19 0 4%, transparent 5%),
      radial-gradient(circle at 36% 32%, #f6d39a 0%, #e2a55a 55%, #c4823a 100%);
    box-shadow: inset 0 -6px 10px rgba(110,60,20,.35), inset 0 5px 8px rgba(255,240,200,.6), 0 7px 0 rgba(120,70,30,.3), 0 12px 18px rgba(80,50,30,.25);
    display: grid; place-items: center;
    animation: kg-pop .4s cubic-bezier(.2,1.6,.4,1) both;
    transition: opacity .3s, filter .3s;
  }
  .cookie span { font-size: calc(var(--cs) * .44); font-weight: 900; color: #fff; line-height: 1;
    text-shadow: 0 0 0 #5a3416, -2px -2px 0 #6b3d19, 2px -2px 0 #6b3d19, -2px 2px 0 #6b3d19, 2px 2px 0 #6b3d19, 0 4px 0 #6b3d19; }
  .cookie.drag { cursor: grabbing; z-index: 20; }
  .cookie.nope { filter: grayscale(.8) brightness(.95); opacity: .45; pointer-events: none; }
  .cookie.gone { opacity: 0; }

  .crumb { position: fixed; width: 9px; height: 9px; border-radius: 40%; background: #c4823a; pointer-events: none; z-index: 30; }
  .heart { position: fixed; pointer-events: none; z-index: 30; font-size: 28px; animation: rise 1.2s ease-out forwards; }
  @keyframes rise { from { transform: translate(-50%, 0) scale(.5); opacity: 1; } to { transform: translate(-50%, -110px) scale(1.2); opacity: 0; } }

  /* 選難度卡片 */
  .lv { display: grid; gap: 12px; }
  .lv .kg-btn { font-size: 22px; padding: 14px 20px; min-height: 60px; }

  @media (min-aspect-ratio: 6/5) {
    #app {
      grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr) auto;
      grid-template-rows: minmax(0, 1fr);
      grid-template-areas: "board mon cookies";
    }
    #cookies { flex-direction: column; gap: 14px; }
    .cookie { --cs: clamp(70px, 22vh, 108px); }
    #eq { font-size: clamp(30px, 9vh, 56px); }
  }
</style>
</head>
<body>
<div id="bg">
  <div class="cloud" style="top:18%;animation-duration:60s;animation-delay:-20s;--s:1"></div>
  <div class="cloud" style="top:32%;animation-duration:85s;animation-delay:-60s;--s:.7"></div>
  <div class="cloud" style="top:10%;animation-duration:110s;animation-delay:-5s;--s:.85"></div>
  <div class="hill h1"></div><div class="hill h2"></div>
  <div class="flower" style="left:8%;bottom:9%">🌼</div><div class="flower" style="left:22%;bottom:4%">🌷</div>
  <div class="flower" style="right:10%;bottom:12%">🌸</div><div class="flower" style="right:30%;bottom:3%">🌼</div>
  <div class="flower" style="left:48%;bottom:15%;font-size:16px">🌼</div>
</div>
<div class="kg-hud"><div class="kg-pill" id="hudQ">第 1/10 題</div><div class="kg-pill" id="hudS">⭐ 0</div></div>
<div id="app">
  <div id="board">
    <div id="eq"></div>
    <div id="pics"></div>
    <button id="sayBtn" aria-label="再念一次">🔊</button>
  </div>
  <div id="monWrap">
    <svg id="monster" viewBox="0 0 300 300" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <filter id="fur" x="-15%" y="-15%" width="130%" height="130%">
          <feTurbulence type="fractalNoise" baseFrequency="0.11" numOctaves="2" seed="4" result="n"/>
          <feDisplacementMap in="SourceGraphic" in2="n" scale="11" xChannelSelector="R" yChannelSelector="G"/>
        </filter>
        <radialGradient id="bodyG" cx="38%" cy="30%" r="75%">
          <stop offset="0" stop-color="#d8c9ff"/><stop offset=".45" stop-color="#a587ff"/><stop offset="1" stop-color="#6a47d6"/>
        </radialGradient>
        <radialGradient id="bellyG" cx="50%" cy="35%" r="65%">
          <stop offset="0" stop-color="#f3edff"/><stop offset="1" stop-color="#cdbcff"/>
        </radialGradient>
        <radialGradient id="irisG" cx="40%" cy="35%" r="70%">
          <stop offset="0" stop-color="#8fe0ff"/><stop offset="1" stop-color="#2d8fd6"/>
        </radialGradient>
        <linearGradient id="hornG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff6c9"/><stop offset="1" stop-color="#ffc85a"/></linearGradient>
        <clipPath id="mClip"><path id="mClipPath" d=""/></clipPath>
      </defs>
      <ellipse cx="150" cy="288" rx="96" ry="11" fill="rgba(40,60,30,.2)"/>
      <g id="mon">
        <ellipse cx="108" cy="270" rx="32" ry="17" fill="#7556dd" filter="url(#fur)"/>
        <ellipse cx="192" cy="270" rx="32" ry="17" fill="#7556dd" filter="url(#fur)"/>
        <g id="armL"><ellipse cx="40" cy="182" rx="20" ry="36" fill="url(#bodyG)" filter="url(#fur)" transform="rotate(28 40 182)"/></g>
        <g id="armR"><ellipse cx="260" cy="182" rx="20" ry="36" fill="url(#bodyG)" filter="url(#fur)" transform="rotate(-28 260 182)"/></g>
        <path d="M86 78 Q66 34 92 16 Q100 46 118 64 Z" fill="url(#hornG)" stroke="#e0a53a" stroke-width="3" stroke-linejoin="round"/>
        <path d="M214 78 Q234 34 208 16 Q200 46 182 64 Z" fill="url(#hornG)" stroke="#e0a53a" stroke-width="3" stroke-linejoin="round"/>
        <circle cx="150" cy="160" r="114" fill="url(#bodyG)" filter="url(#fur)"/>
        <ellipse cx="150" cy="214" rx="72" ry="54" fill="url(#bellyG)" opacity=".75" filter="url(#fur)"/>
        <!-- 眼睛 -->
        <g id="eyes">
          <g id="eyeL" transform="translate(110 118)">
            <circle r="36" fill="#fff" stroke="#4a3b52" stroke-width="3"/>
            <g class="pupil"><circle r="19" fill="url(#irisG)"/><circle r="10" fill="#1d1830"/><circle cx="6" cy="-7" r="6" fill="#fff"/><circle cx="-6" cy="6" r="2.5" fill="#fff"/></g>
            <path class="lid" d="M-37 0 A37 37 0 0 1 37 0 Z" fill="#9a7cf5" stroke="#4a3b52" stroke-width="3" transform="scale(1 0)"/>
          </g>
          <g id="eyeR" transform="translate(190 118)">
            <circle r="36" fill="#fff" stroke="#4a3b52" stroke-width="3"/>
            <g class="pupil"><circle r="19" fill="url(#irisG)"/><circle r="10" fill="#1d1830"/><circle cx="6" cy="-7" r="6" fill="#fff"/><circle cx="-6" cy="6" r="2.5" fill="#fff"/></g>
            <path class="lid" d="M-37 0 A37 37 0 0 1 37 0 Z" fill="#9a7cf5" stroke="#4a3b52" stroke-width="3" transform="scale(1 0)"/>
          </g>
        </g>
        <g id="happy" style="display:none" fill="none" stroke="#3a2a55" stroke-width="7" stroke-linecap="round">
          <path d="M86 124 Q110 96 134 124"/><path d="M166 124 Q190 96 214 124"/>
        </g>
        <ellipse cx="74" cy="168" rx="17" ry="10" fill="#ff8fc0" opacity=".65"/>
        <ellipse cx="226" cy="168" rx="17" ry="10" fill="#ff8fc0" opacity=".65"/>
        <!-- 嘴巴 -->
        <path id="mouth" d="" fill="#5a1f3a" stroke="#3a1428" stroke-width="4" stroke-linejoin="round"/>
        <g clip-path="url(#mClip)">
          <ellipse id="tongue" cx="150" cy="240" rx="32" ry="18" fill="#ff7a9c"/>
          <rect id="toothL" x="122" y="180" width="17" height="15" rx="4" fill="#fff"/>
          <rect id="toothR" x="161" y="180" width="17" height="15" rx="4" fill="#fff"/>
        </g>
        <path id="mouthLine" d="" fill="none" stroke="#3a1428" stroke-width="4" stroke-linejoin="round"/>
      </g>
    </svg>
  </div>
  <div id="cookies"></div>
</div>
<script src="../../assets/common.js"></script>
<script>
'use strict';
(function () {
  const $ = id => document.getElementById(id);
  const svg = $('monster'), mon = $('mon'), monWrap = $('monWrap');
  const mouth = $('mouth'), mouthLine = $('mouthLine'), mClipPath = $('mClipPath');
  const tongue = $('tongue'), toothL = $('toothL'), toothR = $('toothR');
  const pupils = svg.querySelectorAll('.pupil');
  const lids = svg.querySelectorAll('.lid');
  const cookiesEl = $('cookies');
  const FOODS = ['🍎', '🍓', '🍌', '🍪', '🧁', '🍩', '🐟', '🍬', '🍒', '🥕', '🍇', '🍊'];
  const TOTAL = 10;

  let level = 10;
  let qi = 0, firstTry = 0, triedWrong = false, busy = true;
  let q = null;

  /* ---------- 怪獸動畫狀態 ---------- */
  let mouthOpen = 0, mouthTarget = 0;
  let look = { x: 0, y: 0 }, lookTarget = { x: 0, y: 0 };
  let blinkT = 2.5, blink = 0;
  let squish = 0;
  let t = 0, last = performance.now();
  let happyUntil = 0;

  function mouthGeom(o) {
    const ux = 102, vx = 198, y = 190;
    const cu = 206 - 52 * o;             // 上唇控制點
    const cl = 214 + 82 * o;             // 下唇控制點
    return { d: `M${ux} ${y} Q150 ${cu} ${vx} ${y} Q150 ${cl} ${ux} ${y} Z`, cu, cl, y };
  }
  function drawMouth() {
    const g = mouthGeom(mouthOpen);
    mouth.setAttribute('d', g.d);
    mClipPath.setAttribute('d', g.d);
    mouthLine.setAttribute('d', `M${102} ${g.y} Q150 ${g.cu} ${198} ${g.y}`);
    // 牙齒貼著上唇
    const ty = 190 * 0.606 + 0.394 * g.cu;
    toothL.setAttribute('y', (ty - 3).toFixed(1));
    toothR.setAttribute('y', (ty - 3).toFixed(1));
    tongue.setAttribute('cy', (190 * 0.5 + g.cl * 0.5 - 6).toFixed(1));
    const show = mouthOpen > 0.12 ? 1 : 0;
    toothL.style.opacity = toothR.style.opacity = tongue.style.opacity = show;
  }

  function frame(now) {
    const dt = Math.min(0.05, (now - last) / 1000);
    last = now; t += dt;
    mouthOpen += (mouthTarget - mouthOpen) * Math.min(1, dt * 14);
    look.x += (lookTarget.x - look.x) * Math.min(1, dt * 10);
    look.y += (lookTarget.y - look.y) * Math.min(1, dt * 10);
    squish *= Math.pow(0.02, dt);
    // 眨眼
    blinkT -= dt;
    if (blinkT <= 0) { blink = 1; blinkT = 2 + Math.random() * 3; }
    if (blink > 0) blink = Math.max(0, blink - dt * 6);
    const lidS = blink > 0 ? Math.sin(blink * Math.PI) : 0;
    lids.forEach(l => l.setAttribute('transform', `scale(1 ${(lidS * 1.0).toFixed(3)})`));
    pupils.forEach(p => p.setAttribute('transform', `translate(${look.x.toFixed(2)} ${look.y.toFixed(2)})`));
    // 身體上下輕輕晃
    const bob = Math.sin(t * 2.2) * 3;
    const sx = 1 + squish * 0.06 + Math.sin(t * 2.2) * 0.008, sy = 1 - squish * 0.06 - Math.sin(t * 2.2) * 0.008;
    mon.setAttribute('transform', `translate(150 285) scale(${sx.toFixed(4)} ${sy.toFixed(4)}) translate(-150 ${(-285 + bob).toFixed(2)})`);
    $('armL').setAttribute('transform', `rotate(${(Math.sin(t * 3) * 6 - (happyUntil > now ? 30 * Math.abs(Math.sin(t * 10)) : 0)).toFixed(2)} 56 160)`);
    $('armR').setAttribute('transform', `rotate(${(-Math.sin(t * 3 + 1) * 6 + (happyUntil > now ? 30 * Math.abs(Math.sin(t * 10)) : 0)).toFixed(2)} 244 160)`);
    const happy = happyUntil > now;
    $('eyes').style.display = happy ? 'none' : '';
    $('happy').style.display = happy ? '' : 'none';
    drawMouth();
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  // 怪獸嘴巴在螢幕上的位置
  function mouthScreen() {
    const m = svg.getScreenCTM();
    const p = svg.createSVGPoint();
    p.x = 150; p.y = 200;
    const r = p.matrixTransform(m);
    return { x: r.x, y: r.y, scale: m.a };
  }
  function lookAt(x, y) {
    const m = svg.getScreenCTM();
    if (!m) return;
    const p = svg.createSVGPoint();
    p.x = x; p.y = y;
    const r = p.matrixTransform(m.inverse());
    const dx = r.x - 150, dy = r.y - 118;
    const d = Math.hypot(dx, dy) || 1;
    const k = Math.min(12, d / 8);
    lookTarget = { x: dx / d * k, y: dy / d * k };
  }
  window.addEventListener('pointermove', e => { if (!dragging) lookAt(e.clientX, e.clientY); });

  /* ---------- 題目 ---------- */
  function makeQ(prev) {
    for (let tries = 0; tries < 30; tries++) {
      let a, b, op, ans;
      if (Math.random() < 0.55) {
        op = '+';
        ans = KG.randInt(2, level);
        a = KG.randInt(1, ans - 1); b = ans - a;
      } else {
        op = '-';
        a = KG.randInt(2, level);
        b = KG.randInt(1, Math.min(a - 1, level <= 5 ? 3 : level <= 10 ? 5 : 9) || 1);
        ans = a - b;
      }
      if (prev && prev.a === a && prev.b === b && prev.op === op) continue;
      return { a, b, op, ans, food: KG.pick(FOODS) };
    }
    return { a: 1, b: 1, op: '+', ans: 2, food: '🍎' };
  }
  function choices(ans) {
    const set = new Set([ans]);
    let guard = 0;
    while (set.size < 3 && guard++ < 50) {
      const v = ans + KG.pick([-3, -2, -1, 1, 2, 3]);
      if (v >= 0 && v <= level + 2) set.add(v);
    }
    let v = 0;
    while (set.size < 3) set.add(v++);
    return KG.shuffle([...set]);
  }

  function itemsHTML(n, crossFrom) {
    let html = '<div class="grp">', k = 0;
    for (let g = 0; g < n; g += 5) {
      html += '<div class="five">';
      for (let i = g; i < Math.min(n, g + 5); i++) {
        html += `<span class="it${crossFrom != null && i >= crossFrom ? ' x' : ''}" style="animation-delay:${(k++ * 0.04).toFixed(2)}s">${q.food}</span>`;
      }
      html += '</div>';
    }
    return html + '</div>';
  }

  function renderQ() {
    $('hudQ').textContent = `第 ${qi + 1}/${TOTAL} 題`;
    $('eq').innerHTML = `<span class="n">${q.a}</span><span class="op">${q.op === '+' ? '+' : '−'}</span><span class="n">${q.b}</span><span class="op">=</span><span class="q" id="qmark">?</span>`;
    const total = q.op === '+' ? q.a + q.b : q.a;
    const pics = $('pics');
    pics.style.setProperty('--ps', total > 14 ? '20px' : total > 8 ? '24px' : '30px');
    if (q.op === '+') pics.innerHTML = itemsHTML(q.a) + '<span class="pop">+</span>' + itemsHTML(q.b);
    else pics.innerHTML = itemsHTML(q.a, q.a - q.b);
    // 餅乾
    cookiesEl.innerHTML = '';
    choices(q.ans).forEach((v, i) => {
      const c = document.createElement('div');
      c.className = 'cookie';
      c.style.animationDelay = (0.1 + i * 0.1) + 's';
      c.dataset.v = v;
      c.innerHTML = `<span>${v}</span>`;
      c.setAttribute('role', 'button');
      c.setAttribute('aria-label', String(v));
      bindCookie(c);
      cookiesEl.appendChild(c);
    });
    triedWrong = false;
    setTimeout(sayQ, 350);
  }
  function sayQ() { if (q) KG.say(`${q.a} ${q.op === '+' ? '加' : '減'} ${q.b}，等於多少？`); }
  $('sayBtn').addEventListener('click', () => { KG.sound('click'); sayQ(); });

  /* ---------- 拖曳餅乾 ---------- */
  let dragging = null;
  function bindCookie(c) {
    let sx = 0, sy = 0, moved = 0, pid = null;
    c.addEventListener('pointerdown', e => {
      if (busy || dragging) return;
      e.preventDefault();
      dragging = c; pid = e.pointerId;
      try { c.setPointerCapture(pid); } catch (er) { /* 忽略 */ }
      sx = e.clientX; sy = e.clientY; moved = 0;
      c.style.animation = 'none';
      c.style.transition = 'none';
      c.style.transform = 'scale(1.12)';
      c.classList.add('drag');
      KG.sound('pop');
    });
    c.addEventListener('pointermove', e => {
      if (dragging !== c || e.pointerId !== pid) return;
      const dx = e.clientX - sx, dy = e.clientY - sy;
      moved = Math.max(moved, Math.hypot(dx, dy));
      c.style.transform = `translate(${dx}px, ${dy}px) scale(1.12) rotate(${dx * 0.05}deg)`;
      const m = mouthScreen();
      const d = Math.hypot(e.clientX - m.x, e.clientY - m.y);
      mouthTarget = Math.max(0, Math.min(1, 1.3 - d / (260 * m.scale)));
      lookAt(e.clientX, e.clientY);
    });
    const end = e => {
      if (dragging !== c || e.pointerId !== pid) return;
      dragging = null;
      c.classList.remove('drag');
      const m = mouthScreen();
      const d = Math.hypot(e.clientX - m.x, e.clientY - m.y);
      if (moved < 12 || d < 120 * m.scale) feed(c);
      else {
        mouthTarget = 0;
        c.style.transition = 'transform .45s cubic-bezier(.2,1.5,.4,1)';
        c.style.transform = '';
      }
    };
    c.addEventListener('pointerup', end);
    c.addEventListener('pointercancel', end);
  }

  function feed(c) {
    busy = true;
    const m = mouthScreen();
    const r = c.getBoundingClientRect();
    // 目前的位移量（拖曳時的 transform）
    const cx = r.left + r.width / 2, cy = r.top + r.height / 2;
    const cur = new DOMMatrixReadOnly(getComputedStyle(c).transform === 'none' ? undefined : getComputedStyle(c).transform);
    const tx = cur.m41 + (m.x - cx), ty = cur.m42 + (m.y - cy);
    mouthTarget = 1;
    lookAt(m.x, m.y + 40);
    c.style.transition = 'transform .38s cubic-bezier(.4,0,.6,1)';
    c.style.transform = `translate(${tx}px, ${ty}px) scale(.42) rotate(200deg)`;
    KG.sound('whoosh');
    const v = +c.dataset.v;
    setTimeout(() => (v === q.ans ? right(c, m) : wrong(c)), 400);
  }

  function right(c, m) {
    c.classList.add('gone');
    if (!triedWrong) firstTry++;
    $('hudS').textContent = '⭐ ' + firstTry;
    const qm = $('qmark');
    qm.textContent = q.ans; qm.classList.add('done');
    // 咀嚼
    const seq = [0.15, 0.85, 0.15, 0.75, 0.1, 0.6, 0];
    seq.forEach((o, i) => setTimeout(() => {
      mouthTarget = o; squish = 1;
      if (o < 0.3) { KG.note(180 + Math.random() * 60, 0.09, 'square', 0.08); crumbs(m.x, m.y, 4); }
    }, i * 150));
    setTimeout(() => {
      happyUntil = performance.now() + 1300;
      KG.sound('correct');
      KG.say(KG.pick(['好好吃！答對了！', '答對了！好棒！', '哇！真好吃！']));
      KG.toast(KG.pick(['好吃！好棒！', '答對了！😋', '你好厲害！']));
      for (let i = 0; i < 5; i++) heart(m.x + KG.rand(-90, 90) * m.scale, m.y - 120 * m.scale + KG.rand(-30, 30));
    }, seq.length * 150);
    setTimeout(next, seq.length * 150 + 1300);
  }

  function wrong(c) {
    triedWrong = true;
    mouthTarget = 0;
    squish = 0.6;
    KG.sound('boing');
    monWrap.classList.remove('no'); void monWrap.offsetWidth; monWrap.classList.add('no');
    KG.say('不是這個喔，再想想看！');
    c.style.transition = 'transform .6s cubic-bezier(.2,1.6,.4,1)';
    c.style.transform = '';
    setTimeout(() => { c.classList.add('nope'); busy = false; }, 600);
  }

  function crumbs(x, y, n) {
    for (let i = 0; i < n; i++) {
      const el = document.createElement('div');
      el.className = 'crumb';
      el.style.left = x + 'px'; el.style.top = y + 'px';
      document.body.appendChild(el);
      const a = KG.rand(Math.PI * 0.1, Math.PI * 0.9), sp = KG.rand(40, 110);
      el.animate([
        { transform: 'translate(0,0) rotate(0)', opacity: 1 },
        { transform: `translate(${Math.cos(a) * sp * (Math.random() < .5 ? -1 : 1)}px, ${Math.sin(a) * sp + 60}px) rotate(300deg)`, opacity: 0 }
      ], { duration: 700, easing: 'cubic-bezier(.2,.6,.4,1)' }).onfinish = () => el.remove();
    }
  }
  function heart(x, y) {
    const el = document.createElement('div');
    el.className = 'heart';
    el.textContent = KG.pick(['💖', '⭐', '✨', '💜']);
    el.style.left = x + 'px'; el.style.top = y + 'px';
    el.style.animationDelay = KG.rand(0, 0.3) + 's';
    document.body.appendChild(el);
    setTimeout(() => el.remove(), 1600);
  }

  function next() {
    qi++;
    if (qi >= TOTAL) return finish();
    q = makeQ(q);
    renderQ();
    busy = false;
  }

  function finish() {
    busy = true;
    const stars = firstTry >= 9 ? 3 : firstTry >= 6 ? 2 : 1;
    KG.best('math-monster-' + level, firstTry);
    KG.showWin({
      icon: '👾', title: '小怪獸吃飽了！', stars,
      message: `10 題裡面，一次就答對 ${firstTry} 題！`,
      onReplay: chooseLevel
    });
    KG.say('小怪獸吃飽了，謝謝你！');
  }

  function start(lv) {
    level = lv;
    qi = 0; firstTry = 0;
    $('hudS').textContent = '⭐ 0';
    q = makeQ(null);
    renderQ();
    busy = false;
  }

  /* 選擇難度 */
  function chooseLevel() {
    busy = true;
    const ov = document.createElement('div');
    ov.className = 'kg-overlay';
    ov.innerHTML = `<div class="kg-card"><div class="kg-big kg-bounce">👾</div><h2>選擇難度</h2><p>小怪獸想吃多少餅乾呢？</p>
      <div class="lv">
        <button class="kg-btn green" data-lv="5">🍓 5 以內</button>
        <button class="kg-btn blue" data-lv="10">🍎 10 以內</button>
        <button class="kg-btn" data-lv="20">🍉 20 以內</button>
      </div></div>`;
    ov.querySelectorAll('button').forEach(b => b.addEventListener('click', () => {
      KG.sound('click');
      ov.remove();
      start(+b.dataset.lv);
    }));
    document.body.appendChild(ov);
  }

  // 防止雙指縮放
  document.addEventListener('gesturestart', e => e.preventDefault());
  drawMouth();
  KG.showStart({
    icon: '👾', title: '數學小怪獸',
    message: '算一算，把答案正確的餅乾拖進小怪獸的嘴巴裡！',
    button: '開始玩！',
    onStart: chooseLevel
  });
})();
</script>
</body>
</html>
