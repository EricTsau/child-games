<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffe9cf">
<title>合成大西瓜</title>
<link rel="stylesheet" href="../../assets/common.css">
<style>
  html, body { height: 100%; overflow: hidden; background: #ffe9cf; overscroll-behavior: none; }
  #game {
    position: fixed; inset: 0; display: block;
    width: 100vw; height: 100vh; height: 100dvh;
    touch-action: none; cursor: pointer;
  }
  .fm-pause {
    position: fixed; top: 66px; right: 10px; z-index: 8500;
    width: 48px; height: 48px; border-radius: 50%; border: 3px solid #fff;
    background: linear-gradient(180deg, #fff 0%, #ffe9d6 100%);
    box-shadow: 0 5px 0 rgba(120,60,20,.22), 0 10px 20px rgba(120,60,20,.18);
    display: none; place-items: center; cursor: pointer; padding: 0;
    transition: transform .12s ease;
  }
  .fm-pause:active { transform: scale(.9); }
  .fm-pause i { display: block; width: 6px; height: 20px; border-radius: 3px; background: #a0582a; margin: 0 3px; }
  .fm-pause.show { display: flex; align-items: center; justify-content: center; }

  .fm-screen {
    position: fixed; inset: 0; z-index: 9000; display: none;
    align-items: center; justify-content: center; flex-direction: column;
    padding: 64px 16px 16px; text-align: center; pointer-events: auto;
  }
  .fm-screen.show { display: flex; animation: fmFade .25s ease; }
  #titleScr { background: rgba(255,246,232,.72); backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px); }
  .fm-screen.dim { background: rgba(90,50,25,.42); backdrop-filter: blur(2px); -webkit-backdrop-filter: blur(2px); }

  .fm-title { display: flex; flex-direction: column; align-items: center; gap: 4px; width: 100%; max-width: 900px; }
  .fm-col { display: flex; flex-direction: column; align-items: center; min-width: 0; }
  #ring { width: min(74vw, 38vh, 330px); height: min(74vw, 38vh, 330px); display: block; animation: kg-pop .5s cubic-bezier(.2,1.6,.4,1) both; }
  .fm-logo { font-weight: 900; font-size: clamp(42px, 12vw, 80px); line-height: 1.05; letter-spacing: 2px; white-space: nowrap; margin: 0 0 2px; }
  .fm-logo span {
    display: inline-block; color: var(--c); paint-order: stroke fill;
    -webkit-text-stroke: .15em #6a2f12;
    text-shadow: 0 .07em 0 #6a2f12, 0 .14em 14px rgba(120,50,10,.25);
    animation: fmBob 2.4s ease-in-out infinite; animation-delay: calc(var(--i) * -.2s);
  }
  .fm-sub { color: #7a4220; font-weight: 800; font-size: clamp(15px, 3.9vw, 19px); margin: 4px 0 14px; line-height: 1.4; }
  .fm-actions { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
  .fm-actions .kg-btn { min-width: 132px; }
  .fm-bigbtn { font-size: 24px !important; padding: 14px 34px !important; }
  .fm-bestline { margin-top: 14px; font-weight: 900; font-size: 16px; color: #7a4220; background: rgba(255,255,255,.8); border-radius: 999px; padding: 5px 16px; border: 3px solid #fff; }
  .fm-resume-info { font-weight: 800; font-size: 14px; color: #9a5a2a; margin: -6px 0 10px; min-height: 1em; }
  .fm-tip { margin-top: 10px; color: #9a5a2a; font-weight: 700; font-size: 13.5px; line-height: 1.45; opacity: .9; }
  .kg-btn:focus { outline: none; }
  .kg-btn:focus-visible { outline: 4px solid #ffb020; outline-offset: 3px; }

  .fm-card {
    width: min(400px, 100%);
    background: linear-gradient(180deg, #fffaf2 0%, #ffe6cf 100%);
    border: 5px solid #fff; border-radius: 30px; padding: 20px 20px 22px; color: #5a2e12;
    box-shadow: 0 8px 0 #d38c55, 0 18px 40px rgba(90,40,10,.4);
    animation: kg-pop .38s cubic-bezier(.2,1.6,.4,1); position: relative;
  }
  .fm-card h2 { margin: 2px 0 6px; font-size: 32px; font-weight: 900; }
  .fm-score { font-size: 64px; font-weight: 900; line-height: 1.05; color: #ff7a1a; -webkit-text-stroke: 2px #8a3b06; paint-order: stroke fill; text-shadow: 0 4px 0 #8a3b06; margin: 4px 0; }
  .fm-best { font-size: 18px; font-weight: 800; margin-bottom: 8px; }
  .fm-big { display: flex; align-items: center; justify-content: center; gap: 10px; margin: 6px auto 16px; background: rgba(255,255,255,.8); border-radius: 18px; padding: 6px 16px; width: max-content; max-width: 100%; font-weight: 800; }
  .fm-big canvas { width: 54px; height: 54px; }
  .fm-big b { font-size: 22px; color: #e8541a; }
  .fm-new { display: none; position: absolute; top: -18px; left: 50%; transform: translateX(-50%) rotate(-4deg);
    background: linear-gradient(180deg, #ffe066, #ffb020); color: #6b3a00; font-weight: 900; font-size: 18px;
    padding: 6px 18px; border-radius: 999px; border: 3px solid #fff; box-shadow: 0 4px 0 #c47c00; white-space: nowrap;
    animation: fmWiggle 1s ease-in-out infinite; }
  .fm-new.show { display: block; }
  .fm-card .fm-new.show + h2 { margin-top: 22px; }
  .fm-hint { margin-top: 12px; font-size: 13px; font-weight: 700; opacity: .55; }

  @media (orientation: landscape) and (max-height: 620px) {
    .fm-screen { padding: 10px 70px 10px; }
    .fm-title { flex-direction: row; justify-content: center; gap: 28px; }
    #ring { width: min(80vh, 40vw, 330px); height: min(80vh, 40vw, 330px); }
    .fm-logo { font-size: clamp(36px, 11vh, 64px); }
    .fm-sub { margin: 2px 0 10px; font-size: 15px; }
    .fm-bestline { margin-top: 10px; }
    .fm-tip { display: none; }
    .fm-card { padding: 12px 18px 14px; }
    .fm-card h2 { font-size: 26px; margin: 0; }
    .fm-score { font-size: 46px; }
    .fm-big { margin: 4px auto 10px; }
    .fm-hint { display: none; }
  }
  @media (max-height: 700px) and (orientation: portrait) {
    .fm-tip { display: none; }
  }
  @keyframes fmBob { 0%,100% { transform: translateY(0) rotate(-3deg); } 50% { transform: translateY(-7px) rotate(3deg); } }
  @keyframes fmFade { from { opacity: 0; } to { opacity: 1; } }
  @keyframes fmWiggle { 0%,100% { transform: translateX(-50%) rotate(-4deg) scale(1); } 50% { transform: translateX(-50%) rotate(3deg) scale(1.06); } }
</style>
</head>
<body>
<canvas id="game" aria-label="合成大西瓜遊戲畫面"></canvas>
<button class="fm-pause" id="pauseBtn" aria-label="暫停" title="暫停 (P)"><i></i><i></i></button>

<div class="fm-screen show" id="titleScr">
  <div class="fm-title">
    <canvas id="ring" aria-label="水果進化圖"></canvas>
    <div class="fm-col">
      <div class="fm-logo" aria-label="合成大西瓜"></div>
      <div class="fm-sub">一樣的水果碰在一起，<br>就會合成更大的水果！</div>
      <div class="fm-resume-info" id="resumeInfo"></div>
      <div class="fm-actions">
        <button class="kg-btn green fm-bigbtn" id="btnContinue">繼續</button>
        <button class="kg-btn yellow fm-bigbtn" id="btnNew">開始</button>
      </div>
      <div class="fm-bestline" id="titleBest">最高分 0</div>
      <div class="fm-tip">拖曳或移動滑鼠瞄準，放開／點一下就放下水果<br>鍵盤：← → 移動・空白鍵或 ↓ 放下・P 暫停</div>
    </div>
  </div>
</div>

<div class="fm-screen dim" id="pauseScr">
  <div class="fm-card">
    <h2>暫停中</h2>
    <div class="fm-best" id="pauseScore">分數 0</div>
    <div style="height:8px"></div>
    <div class="fm-actions">
      <button class="kg-btn green" id="btnResume">繼續</button>
      <button class="kg-btn yellow" id="btnRestart">重新開始</button>
      <button class="kg-btn blue" id="btnMenu1">回標題</button>
    </div>
    <div class="fm-hint">按 P 或 Esc 繼續</div>
  </div>
</div>

<div class="fm-screen dim" id="overScr">
  <div class="fm-card">
    <div class="fm-new" id="newRec">新紀錄！</div>
    <h2 id="overTitle">裝滿了！</h2>
    <div class="fm-score" id="overScore">0</div>
    <div class="fm-best" id="overBest">最高分 0</div>
    <div class="fm-big"><canvas id="bigIcon" width="108" height="108"></canvas><div>最大的水果<br><b id="bigName">櫻桃</b></div></div>
    <div class="fm-actions">
      <button class="kg-btn green" id="btnAgain">再玩一次</button>
      <button class="kg-btn blue" id="btnMenu2">回標題</button>
    </div>
    <div class="fm-hint">Enter 再玩一次</div>
  </div>
</div>

<script src="../../assets/common.js"></script>
<script>
'use strict';
(function () {
const SLUG = 'fruit-merge';
const SAVE_KEY = SLUG + ':save', BIG_KEY = SLUG + ':maxTier';
let userActed = false, silent = false;
window.addEventListener('pointerdown', () => { userActed = true; }, { capture: true });
window.addEventListener('keydown', () => { userActed = true; }, { capture: true });
const N = (f, d, t, v, dl, sl) => { if (userActed && !silent) KG.note(f, d, t, v, dl, sl); };
const SFX = n => { if (userActed && !silent) KG.sound(n); };
const $ = id => document.getElementById(id);
const cv = $('game'), ctx = cv.getContext('2d');
const FONT = '"Baloo 2","PingFang TC","Noto Sans TC","Microsoft JhengHei","Heiti TC",system-ui,sans-serif';
const TAU = Math.PI * 2;
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const rnd = (a, b) => a + Math.random() * (b - a);
const outBack = t => { const c = 1.9, c3 = c + 1; return 1 + c3 * Math.pow(t - 1, 3) + c * Math.pow(t - 1, 2); };
function mulberry(seed) { return function () { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function mkCanvas(w, h) { const c = document.createElement('canvas'); c.width = Math.max(1, Math.ceil(w)); c.height = Math.max(1, Math.ceil(h)); return c; }
function rg(c, x0, y0, r0, x1, y1, r1, st) { const g = c.createRadialGradient(x0, y0, r0, x1, y1, r1); for (let i = 0; i < st.length; i += 2) g.addColorStop(st[i], st[i + 1]); return g; }
function lg(c, x0, y0, x1, y1, st) { const g = c.createLinearGradient(x0, y0, x1, y1); for (let i = 0; i < st.length; i += 2) g.addColorStop(st[i], st[i + 1]); return g; }
function ell(c, x, y, rx, ry, rot) { c.beginPath(); c.ellipse(x, y, Math.max(0.01, rx), Math.max(0.01, ry), rot || 0, 0, TAU); }
function rrect(c, x, y, w, h, r) { c.beginPath(); c.moveTo(x + r, y); c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r); c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath(); }

/* =========================================================
 * 水果資料
 * ========================================================= */
const NAMES = ['櫻桃', '草莓', '葡萄', '金桔', '橘子', '蘋果', '水梨', '桃子', '鳳梨', '哈密瓜', '西瓜'];
const RAD = [15, 20, 26, 32, 39, 46, 54, 62, 72, 84, 100];
const SCORE = [1, 3, 6, 10, 15, 21, 28, 36, 45, 55, 66];
const JUICE = ['#ff3b5c', '#ff5470', '#a061ee', '#ffc21a', '#ff8c1a', '#ff4d4d', '#f3dc78', '#ffa0a8', '#ffd23f', '#a8dc6a', '#ff5468'];
const SPAWN_W = [0.3, 0.26, 0.2, 0.14, 0.1];
const NT = 11;

/* ---- 世界尺寸（物理單位） ---- */
const WW = 400, FY = 700, RIM = 100, DY = 112, DROPY = 50, WT = 18, FT = 22;
const GRAV = 2400, STEP = 1 / 120;
let SUB = 8, ITER = 3, sleepOn = true;
const MU = 0.32, REST = 0.14, BOUNCE_V = 160, SLOP = 0.25, MAXCORR = 3, MAXV = 2400, MAXW = 40;
const WAKE_V = 45, SLEEP_V2 = 14 * 14, SLEEP_T = 0.45, SQUISH_V = 260;

/* =========================================================
 * 美術：水果（依大小預先畫到離屏畫布）
 * ========================================================= */
function leaf(c, x, y, len, wid, rot, col) {
  c.save(); c.translate(x, y); c.rotate(rot);
  c.beginPath(); c.moveTo(0, 0); c.quadraticCurveTo(len * 0.5, -wid, len, 0); c.quadraticCurveTo(len * 0.5, wid, 0, 0);
  c.fillStyle = lg(c, 0, -wid, 0, wid, [0, '#a6e86a', 1, col || '#2f9a3c']); c.fill();
  c.strokeStyle = 'rgba(20,80,20,.55)'; c.lineWidth = Math.max(0.8, wid * 0.14); c.stroke();
  c.beginPath(); c.moveTo(len * 0.1, 0); c.quadraticCurveTo(len * 0.5, -wid * 0.12, len * 0.88, 0); c.stroke();
  c.restore();
}
function stem(c, x0, y0, cx, cy, x1, y1, w, col) {
  c.strokeStyle = col || '#7a4a22'; c.lineWidth = w; c.lineCap = 'round';
  c.beginPath(); c.moveTo(x0, y0); c.quadraticCurveTo(cx, cy, x1, y1); c.stroke();
}
function base(c, R, c1, c2, c3) {
  c.fillStyle = rg(c, -R * 0.35, -R * 0.42, R * 0.06, 0, 0, R * 1.04, [0, c1, 0.55, c2, 1, c3]);
  c.beginPath(); c.arc(0, 0, R, 0, TAU); c.fill();
}
function rim(c, R, col) {
  const lw = Math.max(1, R * 0.06);
  c.lineWidth = lw; c.strokeStyle = col; c.beginPath(); c.arc(0, 0, R - lw / 2, 0, TAU); c.stroke();
}
function shine(c, R) {
  c.fillStyle = 'rgba(255,255,255,.7)'; ell(c, -R * 0.42, -R * 0.44, R * 0.21, R * 0.11, -0.75); c.fill();
  c.fillStyle = 'rgba(255,255,255,.6)'; ell(c, -R * 0.15, -R * 0.66, R * 0.06, R * 0.05); c.fill();
}
function clipCircle(c, R) { c.save(); c.beginPath(); c.arc(0, 0, R, 0, TAU); c.clip(); }
function dots(c, R, n, rr, col, rng, avoidFace) {
  c.fillStyle = col;
  for (let i = 0; i < n; i++) {
    const a = rng() * TAU, d = Math.sqrt(rng()) * R * 0.95, x = Math.cos(a) * d, y = Math.sin(a) * d;
    if (avoidFace && Math.abs(x) < R * 0.55 && y > -R * 0.2 && y < R * 0.42) continue;
    ell(c, x, y, rr * (0.7 + rng() * 0.6), rr * (0.7 + rng() * 0.6)); c.fill();
  }
}

const ART = [
  // 0 櫻桃
  (c, R, rng) => {
    base(c, R, '#ff8fa0', '#e8263f', '#9c0f25'); rim(c, R, '#8a0c20'); shine(c, R);
  },
  // 1 草莓
  (c, R, rng) => {
    base(c, R, '#ff9aa6', '#f0304a', '#a8132b');
    clipCircle(c, R);
    for (let row = -4; row <= 4; row++) for (let col = -4; col <= 4; col++) {
      const x = (col + (row & 1 ? 0.5 : 0)) * R * 0.27, y = row * R * 0.25;
      if (x * x + y * y > R * R * 0.82) continue;
      if (Math.abs(x) < R * 0.56 && y > -R * 0.22 && y < R * 0.42) continue;
      c.fillStyle = '#ffe58a'; ell(c, x, y, R * 0.04, R * 0.065, Math.atan2(y, x) + Math.PI / 2); c.fill();
      c.fillStyle = 'rgba(140,10,30,.35)'; ell(c, x + R * 0.02, y + R * 0.035, R * 0.035, R * 0.02, 0); c.fill();
    }
    c.restore();
    rim(c, R, '#99112a'); shine(c, R);
  },
  // 2 葡萄
  (c, R, rng) => {
    base(c, R, '#d9b8ff', '#8a4be0', '#4b1d96');
    clipCircle(c, R);
    c.strokeStyle = 'rgba(255,255,255,.16)'; c.lineWidth = R * 0.05;
    for (let i = 0; i < 7; i++) { const a = i / 7 * TAU + 0.3; c.beginPath(); c.arc(Math.cos(a) * R * 0.78, Math.sin(a) * R * 0.78, R * 0.33, 0, TAU); c.stroke(); }
    dots(c, R, 26, R * 0.03, 'rgba(255,255,255,.22)', rng, true);
    c.restore();
    rim(c, R, '#3f1585'); shine(c, R);
  },
  // 3 金桔
  (c, R, rng) => {
    base(c, R, '#fff19a', '#ffbe1e', '#d47a00');
    clipCircle(c, R); dots(c, R, 60, R * 0.03, 'rgba(190,100,0,.28)', rng, false); dots(c, R, 30, R * 0.03, 'rgba(255,255,220,.35)', rng, false); c.restore();
    rim(c, R, '#b06200'); shine(c, R);
  },
  // 4 橘子
  (c, R, rng) => {
    base(c, R, '#ffd08a', '#ff8a12', '#cf5200');
    clipCircle(c, R); dots(c, R, 90, R * 0.025, 'rgba(170,60,0,.25)', rng, false); dots(c, R, 40, R * 0.025, 'rgba(255,230,180,.35)', rng, false); c.restore();
    rim(c, R, '#a84200'); shine(c, R);
  },
  // 5 蘋果
  (c, R, rng) => {
    base(c, R, '#ff9d93', '#e8303a', '#97111b');
    clipCircle(c, R);
    c.fillStyle = rg(c, R * 0.55, R * 0.3, 0, R * 0.55, R * 0.3, R * 0.75, [0, 'rgba(255,215,100,.5)', 1, 'rgba(255,215,100,0)']); c.fillRect(-R, -R, 2 * R, 2 * R);
    c.strokeStyle = 'rgba(255,220,180,.18)'; c.lineWidth = R * 0.03;
    for (let i = 0; i < 9; i++) { const x = (i - 4) * R * 0.2; c.beginPath(); c.moveTo(x * 0.6, -R * 0.75); c.quadraticCurveTo(x * 1.3, 0, x * 0.8, R); c.stroke(); }
    c.restore();
    c.strokeStyle = 'rgba(110,10,20,.5)'; c.lineWidth = R * 0.05; c.lineCap = 'round';
    c.beginPath(); c.arc(0, -R * 1.12, R * 0.4, Math.PI * 0.33, Math.PI * 0.67); c.stroke();
    rim(c, R, '#860d17'); shine(c, R);
  },
  // 6 水梨
  (c, R, rng) => {
    base(c, R, '#fffbd6', '#f0d57a', '#c69a3c');
    clipCircle(c, R); dots(c, R, 70, R * 0.022, 'rgba(140,90,30,.4)', rng, false);
    c.fillStyle = rg(c, R * 0.3, R * 0.5, 0, R * 0.3, R * 0.5, R * 0.8, [0, 'rgba(200,150,60,.3)', 1, 'rgba(200,150,60,0)']); c.fillRect(-R, -R, 2 * R, 2 * R);
    c.restore();
    rim(c, R, '#a07a2a'); shine(c, R);
  },
  // 7 桃子
  (c, R, rng) => {
    c.fillStyle = rg(c, -R * 0.4, -R * 0.45, R * 0.05, R * 0.1, R * 0.1, R * 1.05, [0, '#fff4dc', 0.35, '#ffc9a8', 0.75, '#ff8a9a', 1, '#e0566e']);
    c.beginPath(); c.arc(0, 0, R, 0, TAU); c.fill();
    clipCircle(c, R);
    c.fillStyle = rg(c, -R * 0.6, R * 0.3, 0, -R * 0.6, R * 0.3, R * 0.7, [0, 'rgba(255,240,170,.55)', 1, 'rgba(255,240,170,0)']); c.fillRect(-R, -R, 2 * R, 2 * R);
    c.restore();
    c.strokeStyle = 'rgba(200,60,85,.45)'; c.lineWidth = R * 0.06; c.lineCap = 'round';
    c.beginPath(); c.moveTo(R * 0.02, -R * 0.92); c.bezierCurveTo(R * 0.5, -R * 0.55, R * 0.62, R * 0.1, R * 0.5, R * 0.62); c.stroke();
    rim(c, R, '#c34560'); shine(c, R);
  },
  // 8 鳳梨
  (c, R, rng) => {
    base(c, R, '#fff19a', '#f5be2a', '#c27e05');
    clipCircle(c, R);
    c.strokeStyle = 'rgba(160,90,0,.5)'; c.lineWidth = R * 0.045;
    const d = R * 0.32;
    for (let k = -8; k <= 8; k++) {
      c.beginPath(); c.moveTo(k * d - R * 1.2, -R * 1.2); c.lineTo(k * d + R * 1.2, R * 1.2); c.stroke();
      c.beginPath(); c.moveTo(k * d + R * 1.2, -R * 1.2); c.lineTo(k * d - R * 1.2, R * 1.2); c.stroke();
    }
    c.fillStyle = 'rgba(150,80,0,.55)';
    for (let i = -6; i <= 6; i++) for (let j = -6; j <= 6; j++) {
      const x = (i + j) * d / 2, y = (j - i) * d / 2;
      if (x * x + y * y > R * R) continue;
      if (Math.abs(x) < R * 0.5 && y > -R * 0.15 && y < R * 0.38) continue;
      ell(c, x, y + R * 0.02, R * 0.035, R * 0.035); c.fill();
    }
    c.restore();
    rim(c, R, '#a46400'); shine(c, R);
  },
  // 9 哈密瓜
  (c, R, rng) => {
    base(c, R, '#f6fbd8', '#c9e08a', '#8fae48');
    clipCircle(c, R);
    c.strokeStyle = 'rgba(250,252,232,.9)'; c.lineWidth = R * 0.035; c.lineCap = 'round';
    const g = 7, sp = R * 2.2 / g, pts = [];

/* =========================================================
 * 更新
 * ========================================================= */
function update(dt) {
  clock += dt;
  Music.update(dt);
  if (state === 'play') {
    if (keyL !== keyR) targetX += (keyR ? 1 : -1) * 430 * dt;
    const r = RAD[cur];
    targetX = clamp(targetX, r + 0.5, WW - r - 0.5);
    dropX += (targetX - dropX) * Math.min(1, dt * 24);
    dropX = clamp(dropX, r + 0.5, WW - r - 0.5);
    acc += dt; let n = 0;
    while (acc >= STEP - 1e-9 && n < 6) { physicsFrame(); acc -= STEP; n++; if (state !== 'play') break; }
    if (n >= 6) acc = 0;
    if (cooldown > 0) { cooldown -= dt; if (cooldown <= 0) curAppear = 0; }
    else if (curAppear < 1) curAppear = Math.min(1, curAppear + dt / 0.25);
    saveT += dt; if (dirty && saveT > 1.5) save();
  } else if (state === 'ending') updateEnding(dt);
  // 動畫
  for (let i = 0; i < bodies.length; i++) {
    const b = bodies[i];
    if (b.sq > 0) b.sq = Math.max(0, b.sq - dt * 3.2);
    if (b.happy > 0) b.happy -= dt;
    if (b.pop < 1) b.pop = Math.min(1, b.pop + dt / 0.35);
    if (b.blink > 0) b.blink -= dt;
    else { b.blinkT -= dt; if (b.blinkT <= 0) { b.blink = 0.13; b.blinkT = rnd(2, 5.5); } }
  }
  updateFx(dt);
  if (shownScore < score) shownScore = Math.min(score, shownScore + Math.max(1, (score - shownScore) * dt * 8));
  else shownScore = score;
  if (score > best && state === 'play' && !newBest) newBest = true;
  shake = shake > 0.3 ? shake * Math.pow(0.0015, dt) : 0;

/* =========================================================

  if (state === 'over') {
    if ((k === 'Enter' || k === ' ') && document.activeElement && document.activeElement.tagName === 'BUTTON') return;
    if (k === 'Enter' || k === ' ' || k === 'r' || k === 'R') { e.preventDefault(); SFX('click'); startGame(false); }
    return;
  }
  if (state !== 'play') return;
  if (k === 'ArrowLeft' || k === 'a' || k === 'A') { e.preventDefault(); keyL = true; }
  else if (k === 'ArrowRight' || k === 'd' || k === 'D') { e.preventDefault(); keyR = true; }
  else if (k === ' ' || k === 'ArrowDown' || k === 's' || k === 'S' || k === 'Enter') { e.preventDefault(); if (!e.repeat) drop(); }
});
window.addEventListener('keyup', e => {
  const k = e.key;
  if (k === 'ArrowLeft' || k === 'a' || k === 'A') keyL = false;
  if (k === 'ArrowRight' || k === 'd' || k === 'D') keyR = false;
});
window.addEventListener('blur', () => { keyL = keyR = false; });

$('btnContinue').addEventListener('click', () => { SFX('click'); startGame(true); });
$('btnNew').addEventListener('click', () => { SFX('click'); startGame(false); });
pauseBtn.addEventListener('click', pause);
$('btnResume').addEventListener('click', resume);
$('btnRestart').addEventListener('click', () => { SFX('click'); startGame(false); });
$('btnMenu1').addEventListener('click', () => { SFX('click'); toTitle(); });
$('btnAgain').addEventListener('click', () => { SFX('click'); startGame(false); });
$('btnMenu2').addEventListener('click', () => { SFX('click'); toTitle(); });
document.addEventListener('visibilitychange', () => { if (document.hidden) { if (state === 'play') pause(); else save(); } });
window.addEventListener('pagehide', save);

/* =========================================================
 * 尺寸、品質、主迴圈
 * ========================================================= */
function resize() {
  layout();
  const dpr = window.devicePixelRatio || 1;
  RS = Math.max(1, dpr * QMUL[quality]); if (dpr < 1) RS = dpr;
  cv.width = Math.round(W * RS); cv.height = Math.round(H * RS);
  sprCache.clear();
  SUB = quality === 0 ? 6 : 8;
  partCap = quality === 2 ? MAXP : quality === 1 ? 180 : 110;
  buildBackground();
  if (state === 'title') drawTitleRing();
}
let resizeT = 0;
window.addEventListener('resize', () => { clearTimeout(resizeT); resizeT = setTimeout(resize, 80); });
const perf = { last: 0, n: 0, sum: 0, cool: 3 };
function governor() {
  const now = performance.now(), dt = perf.last ? Math.min(0.5, (now - perf.last) / 1000) : 0;
  perf.last = now;
  if (document.hidden || quality === 0 || state !== 'play') return;
  perf.cool -= dt; if (perf.cool > 0 || dt > 0.2) return;
  perf.sum += dt; perf.n++;
  if (perf.n >= 90) { if (perf.sum / perf.n > 1 / 45) { quality--; resize(); perf.cool = 3; } perf.n = 0; perf.sum = 0; }
}
let last = performance.now();
function frame(now) {
  const dt = Math.max(0, Math.min(0.05, (now - last) / 1000)); last = now;
  if (!document.hidden) { update(dt); draw(); governor(); }
  requestAnimationFrame(frame);
}

(function () {
  const logo = document.querySelector('.fm-logo'), cols = ['#ff5a6e', '#ffa21f', '#ffd93d', '#7ccf4a', '#ff7aa8'];
  [...'合成大西瓜'].forEach((ch, i) => { const s = document.createElement('span'); s.textContent = ch; s.style.setProperty('--c', cols[i]); s.style.setProperty('--i', i); logo.appendChild(s); });
})();

resetBoard();
resize();
refreshTitle();
Music.start();
requestAnimationFrame(frame);

/* ---------- 測試掛勾 ---------- */
function stats() {
  let nan = 0, esc = 0, maxV = 0, maxPen = 0, sleeping = 0, maxW = 0;
  for (const b of bodies) {
    if (!(isFinite(b.x) && isFinite(b.y) && isFinite(b.vx) && isFinite(b.vy))) nan++;
    if (b.x - b.r < -2 || b.x + b.r > WW + 2 || b.y + b.r > FY + 2) esc++;
    maxV = Math.max(maxV, Math.hypot(b.vx, b.vy)); maxW = Math.max(maxW, Math.abs(b.w));
    if (b.sleep) sleeping++;
  }
  for (let i = 0; i < bodies.length; i++) for (let j = i + 1; j < bodies.length; j++) {
    const a = bodies[i], b = bodies[j], p = a.r + b.r - Math.hypot(a.x - b.x, a.y - b.y);
    if (p > maxPen) maxPen = p;
  }
  return { n: bodies.length, nan, escaped: esc, maxV: +maxV.toFixed(1), maxW: +maxW.toFixed(2), maxPen: +maxPen.toFixed(2), sleeping, nanEvents };
}
window.__fm = {
  state: () => ({ state, score, best, cur, next, maxTier, drops, merges, melonPairs, chain, overT: +overT.toFixed(2), fruits: bodies.length, cooldown: +cooldown.toFixed(2), dropX: +dropX.toFixed(1), quality, land, S: +S.toFixed(3), OX, OY, W, H, parts: pn }),
  start: resume => startGame(!!resume),
  title: () => toTitle(),
  pause, resume,
  drop: x => { if (x != null) { dropX = targetX = clamp(x, RAD[cur] + 0.5, WW - RAD[cur] - 0.5); } cooldown = 0; return drop(); },
  step: n => { silent = true; try { for (let i = 0; i < (n || 1); i++) update(1 / 60); } finally { silent = false; } draw(); return stats(); },
  spawn: (t, x, y) => { const b = addBody(makeBody(clamp(t | 0, 0, NT - 1), x == null ? WW / 2 : x, y == null ? DROPY : y)); b.fresh = false; return b.id; },
  clear: () => { bodies.length = 0; overT = 0; },
  setNext: t => { next = clamp(t | 0, 0, NT - 1); },
  setCur: t => { cur = clamp(t | 0, 0, NT - 1); },
  setScore: v => { score = shownScore = v; },
  noOver: on => { noOver = !!on; },
  tune: (sub, it, sl) => { SUB = sub; ITER = it; sleepOn = sl; },
  forceOver: () => gameOver(),
  bodies: () => bodies.map(b => ({ t: b.tier, x: +b.x.toFixed(1), y: +b.y.toFixed(1), r: +b.r.toFixed(1), v: +Math.hypot(b.vx, b.vy).toFixed(1), sleep: b.sleep })),
  stats, save: () => save(), toScreen: (x, y) => toScreen(x, y),
  world: { WW, FY, RIM, DY, DROPY, RAD }
};
})();
</script>
