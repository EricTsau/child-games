<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>跟我做</title>
<link rel="stylesheet" href="../../assets/common.css">
<style>
  html, body { height: 100%; overflow: hidden; }
  body {
    height: 100vh; height: 100dvh;
    touch-action: none;
    background: linear-gradient(180deg, #9fdcff 0%, #d9f2ff 45%, #fff3f8 100%);
  }
  /* 背景：彩虹、雲、草地 */
  .bg { position: fixed; inset: 0; overflow: hidden; pointer-events: none; }
  .rainbow {
    position: absolute; left: 50%; top: 58%;
    width: 150vmax; height: 150vmax; transform: translate(-50%, 0); border-radius: 50%;
    background: radial-gradient(circle,
      transparent 0 52%, rgba(180,150,255,.35) 52% 54%, rgba(110,190,255,.35) 54% 56%,
      rgba(120,220,140,.35) 56% 58%, rgba(255,230,100,.38) 58% 60%, rgba(255,170,90,.35) 60% 62%,
      rgba(255,120,150,.35) 62% 64%, transparent 64%);
  }
  .cloud { position: absolute; width: 140px; height: 48px; background: #fff; border-radius: 40px; opacity: .9;
    box-shadow: 0 8px 18px rgba(80,120,170,.12); animation: drift linear infinite; }
  .cloud::before, .cloud::after { content: ''; position: absolute; background: #fff; border-radius: 50%; }
  .cloud::before { width: 64px; height: 64px; left: 20px; top: -30px; }
  .cloud::after { width: 48px; height: 48px; left: 70px; top: -20px; }
  @keyframes drift { from { transform: translateX(-200px) scale(var(--sc,1)); } to { transform: translateX(calc(100vw + 200px)) scale(var(--sc,1)); } }
  .hills { position: absolute; left: 0; right: 0; bottom: 0; width: 100%; height: 26vh; }
  .float-note { position: absolute; font-size: 28px; opacity: .35; animation: kg-bounce 3s ease-in-out infinite; }

  #stage {
    position: fixed; inset: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 3vh; padding: 76px 12px 18px;
  }
  #board { display: grid; gap: var(--gap, 18px); grid-template-columns: repeat(var(--cols, 2), var(--s, 150px)); }
  .pad {
    --s2: var(--s, 150px);
    position: relative; width: var(--s2); height: var(--s2);
    border: 6px solid rgba(255,255,255,.85); border-radius: 34%;
    background: radial-gradient(circle at 34% 28%, var(--a) 0%, var(--b) 72%, var(--d) 100%);
    box-shadow: 0 9px 0 var(--d), 0 18px 28px rgba(74,59,82,.22), inset 0 -12px 22px rgba(0,0,0,.12);
    cursor: pointer; padding: 0; outline: none;
    filter: saturate(.8) brightness(.96);
    transition: transform .12s ease, filter .12s ease, box-shadow .12s ease;
    touch-action: none;
    animation: pad-in .5s cubic-bezier(.2,1.6,.4,1) both;
  }
  @keyframes pad-in { from { transform: scale(.3); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  .pad::before { /* 亮面反光 */
    content: ''; position: absolute; left: 14%; top: 7%; width: 56%; height: 26%;
    border-radius: 50%; background: linear-gradient(180deg, rgba(255,255,255,.85), rgba(255,255,255,0));
    transform: rotate(-12deg); pointer-events: none;
  }
  .pad::after { /* 發光圈 */
    content: ''; position: absolute; inset: -14px; border-radius: 38%;
    box-shadow: 0 0 0 0 rgba(255,255,255,0); opacity: 0; transition: opacity .12s; pointer-events: none;
    background: radial-gradient(circle, var(--a) 0%, transparent 70%);
    z-index: -1;
  }
  .pad .face {
    position: absolute; inset: 0; display: grid; place-items: center;
    font-size: calc(var(--s2) * .5); line-height: 1;
    filter: drop-shadow(0 5px 3px rgba(0,0,0,.18));
    animation: idle 2.4s ease-in-out infinite; animation-delay: var(--dl, 0s);
    pointer-events: none;
  }
  @keyframes idle { 0%,100% { transform: translateY(0) rotate(0); } 50% { transform: translateY(-5%) rotate(3deg); } }
  .pad .num {
    position: absolute; right: 9%; bottom: 7%; font-size: calc(var(--s2) * .13); font-weight: 900;
    color: rgba(255,255,255,.9); text-shadow: 0 2px 0 rgba(0,0,0,.15); pointer-events: none;
  }
  .pad.lit {
    transform: scale(1.08) translateY(-4px);
    filter: saturate(1.25) brightness(1.15);
    box-shadow: 0 9px 0 var(--d), 0 0 0 8px rgba(255,255,255,.8), 0 0 46px 14px var(--a);
  }
  .pad.lit::after { opacity: 1; }
  .pad.lit .face { animation: sing .35s ease; }
  @keyframes sing { 0% { transform: scale(1); } 40% { transform: scale(1.22) translateY(-8%) rotate(-6deg); } 100% { transform: scale(1); } }
  .pad.shake { animation: kg-shake .4s ease; }
  .notefx {
    position: absolute; left: 50%; top: 10%; font-size: calc(var(--s2) * .22); font-weight: 900; color: #fff;
    text-shadow: 0 2px 6px rgba(0,0,0,.25); pointer-events: none; animation: note-up .9s ease-out forwards;
  }
  @keyframes note-up { from { transform: translate(-50%, 0) scale(.6); opacity: 1; } to { transform: translate(calc(-50% + var(--dx)), -120%) scale(1.2); opacity: 0; } }

  #status {
    min-height: 56px; display: flex; align-items: center; justify-content: center; gap: 8px;
    padding: 10px 26px; border-radius: 999px; background: rgba(255,255,255,.92); border: 4px solid #fff;
    font-size: clamp(20px, 5vw, 28px); font-weight: 900; box-shadow: var(--kg-shadow);
    transition: background .2s;
  }
  #status.you { background: #fff6c9; }
  #status.good { background: #d9ffe0; }
  #status.oops { background: #ffe3ec; }
  .dots { display: flex; gap: 6px; }
  .dots i { width: 14px; height: 14px; border-radius: 50%; background: #e4dbe8; display: block; transition: background .15s, transform .15s; }
  .dots i.on { background: #ff8fb1; transform: scale(1.2); }
</style>
</head>
<body>
<div class="bg" aria-hidden="true">
  <div class="rainbow"></div>
  <div class="cloud" style="top:12%;animation-duration:48s;animation-delay:-10s;--sc:1"></div>
  <div class="cloud" style="top:28%;animation-duration:62s;animation-delay:-40s;--sc:.7"></div>
  <div class="cloud" style="top:6%;animation-duration:75s;animation-delay:-60s;--sc:.55"></div>
  <span class="float-note" style="left:8%;top:40%">♪</span>
  <span class="float-note" style="right:9%;top:52%;animation-delay:-1s">♫</span>
  <span class="float-note" style="left:16%;top:75%;animation-delay:-2s">♬</span>
  <svg class="hills" viewBox="0 0 400 100" preserveAspectRatio="none">
    <defs>
      <linearGradient id="h1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#b6ecb0"/><stop offset="1" stop-color="#8fd88a"/></linearGradient>
      <linearGradient id="h2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8fe07a"/><stop offset="1" stop-color="#5fbf5a"/></linearGradient>
    </defs>
    <path d="M0 55 Q 60 15 130 45 T 270 40 T 400 35 V100 H0Z" fill="url(#h1)"/>
    <path d="M0 75 Q 90 45 190 70 T 400 62 V100 H0Z" fill="url(#h2)"/>
  </svg>
</div>

<div class="kg-hud">
  <div class="kg-pill">🌈 第 <span id="round">1</span> 關</div>
  <div class="kg-pill" id="heart">💖</div>
</div>

<main id="stage">
  <div id="board" aria-label="動物按鈕"></div>
  <div id="status">準備好了嗎？</div>
</main>

<script src="../../assets/common.js"></script>
<script>
'use strict';
(function () {
  const board = document.getElementById('board');
  const statusEl = document.getElementById('status');
  const roundEl = document.getElementById('round');
  const heartEl = document.getElementById('heart');

  // 每個動物按鈕：顏色與音符（大調和弦，聽起來和諧）
  const PADS = [
    { e: '🐶', name: '小狗', a: '#ffd0dd', b: '#ff7fa6', d: '#d9557f', f: 523.25 },
    { e: '🐱', name: '小貓', a: '#fff0b5', b: '#ffc93d', d: '#d69a12', f: 659.25 },
    { e: '🐸', name: '青蛙', a: '#d4f7c8', b: '#62c972', d: '#3c9a4e', f: 783.99 },
    { e: '🐰', name: '兔子', a: '#d3edff', b: '#58b2f0', d: '#2f82c2', f: 1046.5 },
    { e: '🐻', name: '小熊', a: '#ece0ff', b: '#a283f2', d: '#7559c9', f: 587.33 },
    { e: '🐷', name: '小豬', a: '#ffe0cc', b: '#ff9d66', d: '#d6703a', f: 880 }
  ];

  let seq = [], round = 0, idx = 0, phase = 'idle', mistakes = 0, nPads = 4;
  let timers = [];
  const later = (fn, ms) => { const id = setTimeout(fn, ms); timers.push(id); return id; };
  const clearTimers = () => { timers.forEach(clearTimeout); timers = []; };
  let padEls = [];

  /* ---------- 版面 ---------- */
  function layout() {
    const W = innerWidth, H = innerHeight;
    const availW = W - 28, availH = H - 76 - 18 - 90;
    let best = { s: 0, cols: 2 };
    [2, 3].forEach(cols => {
      if (cols > nPads) return;
      const rows = Math.ceil(nPads / cols);
      const gap = Math.max(12, Math.min(24, W * 0.035));
      const s = Math.min((availW - gap * (cols - 1)) / cols, (availH - gap * (rows - 1) - 20) / rows, 230);
      if (s > best.s) best = { s, cols, gap };
    });
    board.style.setProperty('--s', Math.floor(best.s) + 'px');
    board.style.setProperty('--cols', best.cols);
    board.style.setProperty('--gap', best.gap + 'px');
  }
  window.addEventListener('resize', layout);

  function buildPads() {
    board.innerHTML = '';
    padEls = [];
    for (let i = 0; i < nPads; i++) {
      const p = PADS[i];
      const el = document.createElement('button');
      el.className = 'pad';
      el.setAttribute('aria-label', p.name);
      el.style.setProperty('--a', p.a); el.style.setProperty('--b', p.b); el.style.setProperty('--d', p.d);
      el.style.setProperty('--dl', (-i * 0.4) + 's');
      el.style.animationDelay = (i * 0.07) + 's';
      el.innerHTML = `<span class="face">${p.e}</span><span class="num">${i + 1}</span>`;
      el.addEventListener('pointerdown', ev => { ev.preventDefault(); press(i); });
      board.appendChild(el);
      padEls.push(el);
    }
    layout();
  }

  /* ---------- 聲音與亮燈 ---------- */
  function tone(i, dur) {
    const f = PADS[i].f;
    KG.note(f, dur, 'triangle', 0.26);
    KG.note(f * 2, dur * 0.7, 'sine', 0.07);
    KG.note(f / 2, dur * 0.8, 'sine', 0.08);
  }
  function flash(i, ms) {
    const el = padEls[i];
    if (!el) return;
    el.classList.add('lit');
    tone(i, Math.max(0.25, ms / 1000));
    const n = document.createElement('span');
    n.className = 'notefx';
    n.textContent = KG.pick(['♪', '♫', '♬']);
    n.style.setProperty('--dx', KG.randInt(-40, 40) + '%');
    el.appendChild(n);
    setTimeout(() => n.remove(), 900);
    later(() => el.classList.remove('lit'), ms);
  }

  function setStatus(html, cls) {
    statusEl.innerHTML = html;
    statusEl.className = cls || '';
  }
  function dotsHtml() {
    let h = '<span class="dots">';
    for (let i = 0; i < seq.length; i++) h += `<i class="${i < idx ? 'on' : ''}"></i>`;
    return h + '</span>';
  }

  /* ---------- 遊戲流程 ---------- */
  function newGame() {
    clearTimers();
    seq = []; round = 0; nPads = 4; phase = 'idle';
    buildPads();
    nextRound();
  }

  function nextRound() {
    round++;
    mistakes = 0;
    roundEl.textContent = round;
    heartEl.style.filter = 'none'; heartEl.style.opacity = 1;
    let delay = 700;
    if (round === 7 && nPads === 4) {
      // 第 7 關起多兩位動物朋友
      nPads = 6;
      buildPads();
      KG.toast('新朋友來了！🐻🐷');
      KG.sound('sparkle');
      delay = 1600;
    }
    let n;
    do { n = KG.randInt(0, nPads - 1); } while (seq.length >= 2 && n === seq[seq.length - 1] && n === seq[seq.length - 2]);
    seq.push(n);
    setStatus('看仔細 👀');
    phase = 'watch';
    later(playSeq, delay);
  }

  function playSeq() {
    phase = 'watch';
    setStatus('看仔細 👀');
    const gap = Math.max(400, 820 - round * 32);   // 越後面越快
    seq.forEach((p, i) => later(() => flash(p, gap * 0.62), 350 + i * gap));
    later(() => {
      phase = 'input'; idx = 0;
      setStatus('換你囉 👆 ' + dotsHtml(), 'you');
    }, 350 + seq.length * gap - gap * 0.3);
  }

  function press(i) {
    if (phase !== 'input') {
      // 非輸入時間也給一點回饋（小小聲）
      if (phase === 'idle') { flash(i, 220); }
      return;
    }
    flash(i, 260);
    if (seq[idx] === i) {
      idx++;
      setStatus('換你囉 👆 ' + dotsHtml(), 'you');
      if (idx === seq.length) {
        phase = 'done';
        later(success, 320);
      }
    } else {
      mistake(i);
    }
  }

  function success() {
    KG.sound('correct');
    const praise = KG.pick(['好棒！', '答對了！', '真厲害！', '太棒了！']);
    setStatus(praise + ' 🎉', 'good');
    padEls.forEach((el, k) => later(() => { el.classList.add('lit'); later(() => el.classList.remove('lit'), 180); }, k * 70));
    const r = board.getBoundingClientRect();
    if (round % 3 === 0) { KG.confetti(r.left + r.width / 2, r.top + r.height / 2, 70); KG.say(praise); }
    else KG.sound('sparkle');
    later(nextRound, 1200);
  }

  function mistake(i) {
    mistakes++;
    padEls[i].classList.remove('shake'); void padEls[i].offsetWidth; padEls[i].classList.add('shake');
    if (mistakes === 1) {
      // 第一次錯：溫柔地再示範一次
      phase = 'oops';
      KG.sound('boing');
      heartEl.style.filter = 'grayscale(1)'; heartEl.style.opacity = 0.4;
      setStatus('沒關係，再看一次～ 💕', 'oops');
      KG.say('沒關係，再看一次');
      later(playSeq, 1600);
    } else {
      phase = 'over';
      KG.sound('wrong');
      setStatus('答案是這個喔 👉', 'oops');
      later(() => flash(seq[idx], 700), 500);
      later(endGame, 1700);
    }
  }

  function endGame() {
    const score = round - 1;
    const best = KG.best('simon-says', score);
    const stars = score >= 10 ? 3 : score >= 5 ? 2 : 1;
    setStatus('準備好了嗎？');
    KG.showWin({
      icon: score >= 5 ? '🏆' : '🌈',
      title: score >= 5 ? '記憶力好厲害！' : '玩得很好喔！',
      message: `你過了 ${score} 關！最高紀錄 ${best} 關`,
      stars, onReplay: newGame
    });
  }

  /* ---------- 鍵盤 ---------- */
  const ARROWS = { ArrowUp: 0, ArrowRight: 1, ArrowLeft: 2, ArrowDown: 3 };
  window.addEventListener('keydown', e => {
    if (document.querySelector('.kg-overlay')) return;
    let i = -1;
    if (/^Digit[1-6]$/.test(e.code)) i = +e.code.slice(5) - 1;
    else if (e.code in ARROWS) i = ARROWS[e.code];
    if (i >= 0 && i < nPads) { e.preventDefault(); if (!e.repeat) press(i); }
  });
  document.addEventListener('contextmenu', e => e.preventDefault());

  buildPads();
  KG.showStart({
    icon: '🌈', title: '跟我做',
    message: '動物們會依序亮燈唱歌，記住順序，再照著按一次！',
    onStart: newGame
  });
})();
</script>
</body>
</html>
