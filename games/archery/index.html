<script type="module">
import * as THREE from 'three';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';

let renderer = null;
try {
  renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('gl'), antialias: true, powerPreference: 'high-performance' });
} catch (e) { renderer = null; }
if (!renderer) document.getElementById('msg').textContent = '這個遊戲需要支援 3D（WebGL）的瀏覽器，請換一個瀏覽器或裝置再試試看。';
else main();

function main() {
  const $ = id => document.getElementById(id);
  const glc = $('gl'), hud = $('hud'), hctx = hud.getContext('2d'), ov = $('ov'), ui = $('ui');
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const lerp = (a, b, t) => a + (b - a) * t;
  const TAU = Math.PI * 2;
  const easeOut = t => 1 - Math.pow(1 - clamp(t, 0, 1), 3);
  const easeIO = t => { t = clamp(t, 0, 1); return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2; };
  function mulberry(seed) {
    return function () {
      seed |= 0; seed = seed + 0x6D2B79F5 | 0;
      let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }
  function gauss() { let u = 0, v = 0; while (u === 0) u = Math.random(); v = Math.random(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(TAU * v); }
  const esc = s => String(s).replace(/[&<>"]/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[ch]));

  /* =========================================================
   * 存檔
   * ========================================================= */
  const SKEY = 'archery:stats';
  const stats = (function () {
    const d = { best: {}, bestX: {}, arrows: 0, tens: 0, xs: 0, games: 0, vs: [{ w: 0, l: 0 }, { w: 0, l: 0 }, { w: 0, l: 0 }], ch: { max: 0, stars: {} } };
    const s = KG.store.get(SKEY, null);
    if (!s || typeof s !== 'object') return d;
    const o = Object.assign(d, s);
    if (!Array.isArray(o.vs) || o.vs.length < 3) o.vs = d.vs;
    if (!o.ch || typeof o.ch !== 'object') o.ch = { max: 0, stars: {} };
    if (!o.ch.stars) o.ch.stars = {};
    if (!o.best) o.best = {};
    if (!o.bestX) o.bestX = {};
    return o;
  })();
  const saveStats = () => KG.store.set(SKEY, stats);
  const sel = Object.assign({ dist: 70, ends: 4, pdist: 30, pwind: 1 }, KG.store.get('archery:sel', {}) || {});
  const saveSel = () => KG.store.set('archery:sel', sel);

  /* =========================================================
   * 音效（自製噪音 + KG.note）
   * ========================================================= */
  let AC = null, NB = null, gest = false;
  function ac() {
    if (KG.isMuted() || !gest) return null;
    if (!AC) {
      const C = window.AudioContext || window.webkitAudioContext;
      if (!C) return null;
      try { AC = new C(); } catch (e) { return null; }
      NB = AC.createBuffer(1, Math.floor(AC.sampleRate * 1.6), AC.sampleRate);
      const d = NB.getChannelData(0);
      for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    }
    if (AC.state === 'suspended') AC.resume();
    return AC;
  }
  window.addEventListener('pointerdown', () => { gest = true; ac(); }, { capture: true });
  window.addEventListener('keydown', () => { gest = true; ac(); }, { capture: true });
  function noise(dur, vol, freq, q, delay, type, f2) {
    const a = ac(); if (!a) return;
    const t = a.currentTime + (delay || 0);
    const src = a.createBufferSource(); src.buffer = NB;
    const f = a.createBiquadFilter(); f.type = type || 'bandpass';
    f.frequency.setValueAtTime(freq, t);
    if (f2) f.frequency.exponentialRampToValueAtTime(f2, t + dur);
    f.Q.value = q || 1;
    const g = a.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + Math.min(0.03, dur * 0.3));
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    src.connect(f); f.connect(g); g.connect(a.destination);
    src.start(t, Math.random() * Math.max(0, 1.5 - dur), dur + 0.05);
  }
  const note = (...a) => { if (gest) KG.note(...a); };
  const sfx = {
    creak(p) { note(60 + p * 70, 0.14, 'sawtooth', 0.03, 0, 52 + p * 60); noise(0.1, 0.05, 260 + p * 380, 6); },
    anchor() { note(2100, 0.03, 'square', 0.05); note(1400, 0.04, 'square', 0.03, 0.03); },
    twang() { note(96, 0.38, 'triangle', 0.34, 0, 78); note(192, 0.22, 'sine', 0.16, 0, 160); note(420, 0.08, 'square', 0.04, 0, 300); noise(0.07, 0.3, 2000, 1.4); },
    whoosh(slow) { noise(slow ? 1.2 : 0.4, slow ? 0.16 : 0.12, slow ? 900 : 2400, 1.2, 0.02, 'bandpass', slow ? 300 : 900); },
    thud() { noise(0.1, 0.55, 330, 1.1); note(130, 0.16, 'sine', 0.38, 0, 52); },
    ground() { noise(0.09, 0.35, 220, 0.9); note(90, 0.1, 'sine', 0.2, 0, 50); },
    pop() { noise(0.14, 0.6, 2600, 0.7); note(980, 0.07, 'square', 0.1, 0, 240); },
    apple() { noise(0.08, 0.5, 900, 1.3); note(520, 0.12, 'sine', 0.22, 0, 260); },
    letdown() { note(140, 0.22, 'sine', 0.12, 0, 90); },
    heart() { note(58, 0.12, 'sine', 0.16); note(52, 0.12, 'sine', 0.12, 0.16); },
    applause(n) {
      for (let i = 0; i < n; i++) noise(0.025 + Math.random() * 0.03, 0.07 + Math.random() * 0.1, 1300 + Math.random() * 1900, 1.4, Math.random() * 1.9);
      noise(1.4, 0.06, 650, 0.5, 0.08); noise(1.2, 0.04, 1100, 0.6, 0.5);
    },
    aww() { noise(1.0, 0.05, 420, 1.2, 0.05, 'bandpass', 260); },
    bird() { const f = 2600 + Math.random() * 1400; note(f, 0.06, 'sine', 0.025, 0, f * 1.4); note(f * 1.1, 0.07, 'sine', 0.02, 0.1, f * 1.5); note(f, 0.05, 'sine', 0.02, 0.22, f * 1.3); }
  };

  /* 背景音樂：輕柔的運動場旋律 */
  const CH = [[262, 330, 392], [220, 262, 330], [175, 220, 262], [196, 247, 294]];
  const MEL = [523, 0, 587, 659, 0, 784, 659, 0, 587, 523, 0, 440, 523, 0, 0, 0, 440, 0, 523, 587, 0, 659, 587, 0, 523, 440, 0, 392, 440, 0, 0, 0];
  let mStep = 0;
  setInterval(() => {
    if (KG.isMuted() || document.hidden || !gest) return;
    if (!(S.phase === 'menu' || (S.phase === 'aim' && !DR.active) || S.phase === 'endsum' || S.phase === 'over' || S.phase === 'ai')) { mStep++; return; }

      sfx.apple(); burst(e.x, e.y, e.z, '#ffe2a8', 18, 1.8, 0.6, 5);
      e.tg.dead = true; S.apples++;

      // 蘋果帶著箭掉下來
      ap.updateMatrixWorld(true);
      ap.attach(m);

      e.tg.group.children.forEach(c => { if (c.isLine) c.visible = false; });
    }
    // 計分
    let txt = res.label, col = RC[res.label] || '#fff';
    if (res.label === 'M') { txt = e.kind === 'boss' || e.kind === 'board' ? '脫靶' : '沒射中'; col = '#ffffff'; }
    if (res.label === 'A') { txt = '命中蘋果！'; col = '#ff5a5a'; }
    if (res.label === 'X') txt = 'X';
    const ownScore = res.own || res.label === 'M';
    const poppedOnly = f.lastPop && (e.kind === 'ground' || e.kind === 'back' || e.kind === 'lost');
    if ((ownScore && !poppedOnly) || res.label === 'A') addPop(e.x, e.y + 0.05, e.z, txt, col, res.label === 'X' || res.label === '10' ? 1.25 : 1);
    if (f.who === 'p') {
      if (res.v >= 10 || res.label === 'A') { sfx.applause(res.x ? 60 : 42); KG.vibrate([30, 40, 30]); }
      else if (res.v === 9) sfx.applause(16);
      else if (res.label === 'M' && S.mode !== 'challenge') sfx.aww();
    } else if (res.v >= 10) sfx.applause(18);
    S.last = res;
    S.result = res;
    flight.res = res;
    // 鏡頭轉到靶
    CAM.track = e.kind === 'apple' ? e.tg.apple : null;
    setReview(poppedOnly ? f.lastPop : e, f.who);
    S.phase = 'review';
    S.reviewT = f.chase ? 1.9 : 1.5;
    if (f.who === 'a') S.reviewT = 1.2;
    $('bars').classList.remove('on');
  }

  /* =========================================================
   * 鏡頭
   * ========================================================= */
  const CAM = { mode: 'title', pos: new THREE.Vector3(0, 3, 10), look: new THREE.Vector3(0, 1.3, -70), fov: 40, dp: new THREE.Vector3(), dl: new THREE.Vector3(), df: 40, rvPos: new THREE.Vector3(), rvLook: new THREE.Vector3(), rvFov: 30, k: 0 };
  function vfovFor(minDimMeters, dist) { const Vh = minDimMeters * (H / Math.min(W, H)); return 2 * Math.atan(Vh / 2 / dist) * 180 / Math.PI; }
  function idleFov() { return clamp(2 * Math.atan(Math.tan(24 * Math.PI / 180) / (W / H)) * 180 / Math.PI, 30, 64); }
  function setReview(e, who) {
    let cx, cy, cz, size;
    if (e.tg && e.tg.kind !== 'balloon') {
      tgPos(e.tg, simT, TP);
      cx = e.tg.kind === 'boss' ? e.tg.x : TP.x; cy = e.tg.kind === 'boss' ? TY : TP.y; cz = e.tg.z;
      size = e.tg.faceD ? Math.max(e.tg.faceD, 0.6) : 0.5;
      if (e.kind === 'apple') { cx = e.x; cy = e.y; size = 0.5; }
    } else {
      cx = e.x; cy = Math.max(0.4, e.y); cz = e.z; size = e.kind === 'pop' ? 0.8 : 1.2;
      if (e.kind === 'lost') { cx = who === 'a' ? LANE_X[AI_LANE] : 0; cy = TY; cz = -S.D; size = 1.6; }
    }
    const V = size * 2.2 * (H / Math.min(W, H));
    const dist = V / (2 * Math.tan(15 * Math.PI / 180));
    CAM.rvLook.set(cx * 0.7 + e.x * 0.3, cy * 0.7 + e.y * 0.3, cz);
    CAM.rvPos.set(cx + dist * 0.38, cy + dist * 0.1, cz + dist * 0.92);
    CAM.rvFov = 30;
    CAM.mode = 'review';
  }
  function setAiView() {
    const tg = aiTarget();
    const size = tg.faceD;
    const V = size * 2.3 * (H / Math.min(W, H));
    const dist = V / (2 * Math.tan(15 * Math.PI / 180));
    CAM.rvLook.set(tg.x, TY, tg.z);
    CAM.rvPos.set(tg.x - dist * 0.32, TY + dist * 0.1, tg.z + dist * 0.95);
    CAM.rvFov = 30;
    CAM.mode = 'review';
    CAM.track = null;
    CAM.pos.copy(CAM.rvPos); CAM.look.copy(CAM.rvLook); CAM.fov = CAM.rvFov;
  }
  const SW = { x: 0, y: 0 };
  function swayAt(t, amp) {
    SW.x = amp * (0.55 * Math.sin(t * 1.7 + 0.3) + 0.3 * Math.sin(t * 3.1 + 1.1) + 0.15 * Math.sin(t * 5.3 + 2.0));
    SW.y = amp * (0.45 * Math.sin(t * 1.3 + 0.7) + 0.3 * Math.sin(t * 2.7 + 2.1) + 0.15 * Math.sin(t * 4.9)) + amp * 0.55 * Math.sin(t * TAU / 4.2);
    return SW;
  }
  function updateCamera(dt) {
    const k = 1 - Math.exp(-dt * 4.2);
    if (CAM.mode === 'title') {
      const a = clock * 0.06;
      CAM.dp.set(Math.sin(a) * 13 - 2, 3.4 + Math.sin(clock * 0.11) * 0.6, -48 + Math.cos(a) * 8);
      CAM.dl.set(0, 1.4, -S.D);
      CAM.df = idleFov() + 6;
      CAM.pos.lerp(CAM.dp, k); CAM.look.lerp(CAM.dl, k); CAM.fov = lerp(CAM.fov, CAM.df, k);
    } else if (CAM.mode === 'aim') {
      const r = easeIO(DR.raise);
      const z = DR.active ? easeOut(DR.draw * 1.1) : 0;
      const fa = vfovFor(S.view, S.D);
      CAM.pos.set(0, EYE_Y, 0);
      CAM.look.set(lerp(0, S.ref.x + DR.aimX + DR.sx, r), lerp(TY - 0.25, S.ref.y + DR.aimY + DR.sy, r), -S.D);
      CAM.fov = lerp(idleFov(), lerp(fa * 2.4, fa, z), r);
    } else if (CAM.mode === 'hold') {
      // 放箭後保持原視角
    } else if (CAM.mode === 'chase' && flight) {
      const s = flight.s;
      tv.set(s.vx, s.vy, s.vz).normalize();
      CAM.pos.set(s.x - tv.x * 1.25 + 0.2, s.y - tv.y * 1.25 + 0.12, s.z - tv.z * 1.25);
      CAM.look.set(s.x + tv.x * 4, s.y + tv.y * 4, s.z + tv.z * 4);
      CAM.fov = W < H ? 62 : 44;
    } else if (CAM.mode === 'review') {
      if (CAM.track) { CAM.track.getWorldPosition(tv2); CAM.rvLook.lerp(tv2, 1 - Math.exp(-dt * 6)); }
      CAM.pos.lerp(CAM.rvPos, k); CAM.look.lerp(CAM.rvLook, k); CAM.fov = lerp(CAM.fov, CAM.rvFov, k);
    }
    cam.position.copy(CAM.pos);
    if (shake > 0) {
      const sh = shake * (CAM.mode === 'aim' || CAM.mode === 'hold' ? 0.004 : 0.03);
      cam.position.x += (Math.random() - 0.5) * sh; cam.position.y += (Math.random() - 0.5) * sh;
    }
    cam.lookAt(CAM.look);
    if (Math.abs(cam.fov - CAM.fov) > 1e-4) { cam.fov = CAM.fov; cam.updateProjectionMatrix(); }
    sky.position.copy(cam.position);
  }

  /* =========================================================
   * 遊戲流程
   * ========================================================= */
  function inGame() { return S.phase !== 'menu'; }
  function startPro(dist, ends) {
    S.mode = 'pro'; S.ends = ends; S.endNo = 1; S.cur = []; S.endsDone = []; S.total = 0; S.xs = 0; S.tens = 0; S.shots = 0;
    const faceD = dist >= 50 ? (dist === 70 ? 1.22 : 0.8) : dist === 30 ? 0.8 : 0.4;
    buildRound({ D: dist, faceD });
    newProWind();
    beginGame();
    banner('第 1 回合', dist + ' 公尺 · ' + Math.round(faceD * 100) + ' 公分靶面');
  }
  function newProWind() {
    const D = S.D;
    const r = D <= 18 ? [0, 1.5] : D <= 30 ? [0.5, 2.5] : D <= 50 ? [1, 3.5] : [1, 4.5];
    randWind(r[0], r[1]);
  }
  function startPractice(dist, w) {
    S.mode = 'practice'; S.pwind = w; S.ends = 0; S.endNo = 1; S.cur = []; S.endsDone = []; S.total = 0; S.xs = 0; S.tens = 0; S.shots = 0;
    const faceD = dist === 70 ? 1.22 : dist >= 30 ? 0.8 : 0.4;
    buildRound({ D: dist, faceD });
    practiceWind();
    beginGame();
    banner('練習', dist + ' 公尺');
  }
  function practiceWind() { if (S.pwind === 0) setWind(0, 0, 0); else if (S.pwind === 1) randWind(0.5, 2); else randWind(2.5, 5); }
  function startChallenge(i) {
    const lv = LEVELS[i];
    S.mode = 'challenge'; S.level = i; S.lv = lv; S.shotsLeft = lv.arrows; S.timer = lv.time || 0; S.popped = 0; S.apples = 0;
    S.cur = []; S.endsDone = []; S.total = 0; S.xs = 0; S.tens = 0; S.shots = 0;
    buildRound({ D: lv.d, faceD: lv.lanes || 0, objs: lv.objs, view: lv.view });
    if (lv.wind) setWind(lv.wind[0], lv.wind[1], 0.08); else setWind(0, 0, 0);
    beginGame();
    banner('第 ' + (i + 1) + ' 關', lv.name);
  }
  function startVs(ai) {
    S.mode = 'vs'; S.cur = []; S.endsDone = []; S.total = 0; S.xs = 0; S.tens = 0; S.shots = 0;
    S.vs = { ai, set: 1, p: 0, a: 0, order: ['p', 'a', 'p', 'a', 'p', 'a'], idx: 0, pArr: [], aArr: [], sets: [], shootoff: false };
    buildRound({ D: 70, faceD: 1.22 });
    randWind(1, 4);
    beginGame();
    banner('第 1 局', '對手：' + AI_NAMES[ai]);
  }
  function beginGame() {
    closeOv();
    ui.classList.remove('off');
    simT = 0; acc = 0; timeScale = 1;
    S.result = null; S.last = null;
    DR.raise = 0;
    playerReady();
    CAM.pos.set(0, EYE_Y, 0);
    renderer.shadowMap.needsUpdate = true;
    hudDirty = true;
  }
  function clearPops() { POPS.forEach(o => o.el.remove()); POPS.length = 0; }
  function playerReady() {
    clearPops();
    S.phase = 'aim';
    CAM.mode = 'aim';
    DR.active = false; DR.draw = 0; DR.anchored = false; DR.anchorT = 0; DR.aimX = 0; DR.aimY = 0; DR.sx = 0; DR.sy = 0; DR.arrowOn = true; DR.warned = false;
    timeScale = 1;
    hudDirty = true;
  }
  function beginDraw() {
    if (S.phase !== 'aim' || DR.active) return;
    DR.active = true; DR.draw = 0; DR.target = 0; DR.anchored = false; DR.anchorT = 0; DR.creak = 0.12; DR.heart = 0; DR.warned = false;
    DR.seed = Math.random() * 100;
    const k = S.view * 0.12;
    const a = Math.random() * TAU;
    DR.aimX = Math.cos(a) * k * (0.6 + Math.random() * 0.6);
    DR.aimY = -Math.abs(Math.sin(a)) * k * (0.6 + Math.random() * 0.6) - k * 0.2;
    DR.amp = swayBase() * 2.5;
    DR.arrowOn = true;
    sfx.creak(0);
  }
  function swayBase() { return 0.0008 * S.D + 0.004; }
  function letDown(msg) {
    DR.active = false; DR.anchored = false; DR.draw = 0;
    sfx.letdown();
    if (msg) showHint(msg, 1.6);
  }
  function releaseDraw() {
    if (!DR.active) return;
    if (DR.draw < 0.3) { letDown('拉得不夠，要拉滿才射得準'); return; }
    const power = DR.anchored ? 1 : DR.draw;
    const ax = DR.aimX + DR.sx, ay = DR.aimY + DR.sy;
    DR.active = false;
    DR.string = power;
    launch('p', { x: S.ref.x + ax, y: S.ref.y + ay, z: -S.D }, power);
    if (!DR.anchored) showHint('沒有拉滿弓，箭會掉低！', 1.6);
  }
  function updateAim(dt) {
    if (DR.active) {
      DR.raise = Math.min(1, DR.raise + dt * 3);
      const tgt = DR.kb ? 1 : DR.target;
      if (!DR.anchored) {
        if (tgt > DR.draw) DR.draw = Math.min(tgt, DR.draw + dt * 1.7); else DR.draw = Math.max(tgt, DR.draw - dt * 3);
        if (DR.draw >= DR.creak) { sfx.creak(DR.draw); DR.creak += 0.18; }
        if (DR.draw >= 0.97) { DR.draw = 1; DR.anchored = true; DR.anchorT = 0; sfx.anchor(); KG.vibrate(15); }
      } else {
        DR.anchorT += dt;
        if (DR.anchorT > 3.2) { DR.heart -= dt; if (DR.heart <= 0) { sfx.heart(); DR.heart = Math.max(0.45, 1.0 - (DR.anchorT - 3.2) * 0.08); } }
        if (DR.anchorT > 6 && !DR.warned) { DR.warned = true; showHint('手臂開始發抖了，快放箭！', 2); }
        if (DR.anchorT > 14) { letDown('撐太久了，先放下弓休息一下'); }
      }
      let amp = swayBase();
      if (!DR.anchored) amp *= 2.4;
      else { const t = DR.anchorT; amp *= 1 + 1.5 * Math.exp(-2.3 * t) + (t > 4.5 ? Math.min(4.5, (t - 4.5) * 0.8) : 0); }
      DR.amp = lerp(DR.amp, amp, 1 - Math.exp(-dt * 3));
      swayAt(clock * 1.0 + DR.seed, DR.amp);
      DR.sx = SW.x; DR.sy = SW.y;
      // 鍵盤瞄準
      if (keys.l || keys.r || keys.u || keys.d) {
        const sp = S.view * (keys.shift ? 0.07 : 0.22) * dt;
        DR.aimX += ((keys.r ? 1 : 0) - (keys.l ? 1 : 0)) * sp;
        if (DR.anchored || DR.kb) DR.aimY += ((keys.u ? 1 : 0) - (keys.d ? 1 : 0)) * sp;
      }
      clampAim();
    } else {
      DR.raise = Math.max(0, DR.raise - dt * 2.2);
      if (DR.draw > 0) DR.draw = Math.max(0, DR.draw - dt * 4);
    }
  }
  function clampAim() { const L = S.view * 1.2; DR.aimX = clamp(DR.aimX, -L, L); DR.aimY = clamp(DR.aimY, -L, L); }

  function afterShot() {
    const res = S.result;
    if (!res) return;
    const m = S.mode;
    if (res.who === 'p') {
      stats.arrows++;
      if (res.own && res.v >= 10) stats.tens++;
      if (res.x) stats.xs++;
    }
    if (m === 'pro' || m === 'practice') {
      S.cur.push(res); S.total += res.v; if (res.x) S.xs++; if (res.v >= 10) S.tens++;
      saveStats();
      if (S.cur.length >= 6) showEndSummary(); else playerReady();
    } else if (m === 'challenge') {
      S.shotsLeft--;
      if (res.own) { S.cur.push(res); S.total += res.v; if (res.x) S.xs++; if (res.v >= 10) S.tens++; }
      else S.cur.push(res);
      saveStats();
      const g = goal();
      if (g.done) finishChallenge(true);
      else if (S.lv.time && S.timer <= 0) timeUp();
      else if (S.shotsLeft <= 0 || g.fail) finishChallenge(false, '');
      else playerReady();
    } else if (m === 'vs') {
      const v = S.vs;
      if (res.who === 'p') { v.pArr.push(res); if (res.x) S.xs++; if (res.v >= 10) S.tens++; } else v.aArr.push(res);
      saveStats();
      v.idx++;
      if (v.idx < v.order.length) { if (v.order[v.idx] === 'p') playerReady(); else aiTurn(); }
      else setDone();
    }
    hudDirty = true;
  }
  function goal() {
    const g = S.lv.goal;
    if (g.type === 'score') return { done: S.total >= g.n && S.shotsLeft <= 0, fail: S.total + (S.shotsLeft) * 10 < g.n, prog: S.total + ' / ' + g.n + ' 分' };
    if (g.type === 'pop') return { done: S.popped >= g.n, fail: TG.filter(t => t.kind === 'balloon' && !t.dead).length + S.popped < g.n || S.popped + S.shotsLeft * 6 < g.n, prog: '氣球 ' + S.popped + ' / ' + g.n };
    if (g.type === 'apple') return { done: S.apples >= g.n, fail: false, prog: '蘋果 ' + S.apples + ' / ' + g.n };
    if (g.type === 'tens') return { done: S.tens >= g.n, fail: S.tens + S.shotsLeft < g.n, prog: '10 分 ' + S.tens + ' / ' + g.n };
    return { done: false, fail: false, prog: '' };
  }
  function timeUp() {
    const g = S.lv.goal;
    finishChallenge(g.type === 'score' && S.total >= g.n, '時間到！');
  }
  function aiTurn() {
    clearPops();
    S.phase = 'ai';
    S.aiT = 1.15;
    setAiView();
    showHint(AI_NAMES[S.vs.ai] + ' 瞄準中…', 1.2);
    hudDirty = true;
  }
  function aiShoot() {
    const tg = aiTarget();
    const aim = solveAim(tg, 'a');
    const sig = AI_SIG[S.vs.ai] * tg.faceD / 2;
    const ws = Math.hypot(wind.bx, wind.bz);
    aim.x += gauss() * sig + gauss() * ws * 0.00067 * S.D * [0.35, 0.22, 0.12][S.vs.ai];
    aim.y += gauss() * sig;
    launch('a', { x: aim.x, y: aim.y, z: -S.D }, 1);
  }
  // 求出能命中目標中心的瞄點（考慮風與移動）
  function solveAim(tg, who) {
    const O = shooterO(who || 'p');
    tgPos(tg, simT, TP);
    let ax = TP.x, ay = TP.y;
    const out = { x: ax, y: ay };
    for (let it = 0; it < 8; it++) {
      launchDir(O, { x: ax, y: ay, z: -S.D }, DIR);
      flyTo(O, DIR, V_FULL, simT, tg.z, false, FT);
      tgPos(tg, FT.t, TP);
      const ex = TP.x - FT.x, ey = TP.y - FT.y;
      ax += ex; ay += ey;
      if (Math.abs(ex) + Math.abs(ey) < 1e-5) break;
    }
    out.x = ax; out.y = ay;
    return out;
  }
  function setDone() {
    const v = S.vs;
    const ps = v.pArr.reduce((a, r) => a + r.v, 0), as = v.aArr.reduce((a, r) => a + r.v, 0);
    let msg;
    if (v.shootoff) {
      const pr = v.pArr[0], ar = v.aArr[0];
      let pw = ps > as || (ps === as && pr.d < ar.d) || (ps === as && pr.d === ar.d);
      if (pr.label === 'M' && ar.label === 'M') pw = true;
      if (pw) v.p++; else v.a++;
      msg = pw ? '加賽獲勝！' : '加賽落敗';
      v.sets.push({ p: ps, a: as, so: true });
    } else {
      if (ps > as) { v.p += 2; msg = '你贏得這一局 +2'; }
      else if (ps < as) { v.a += 2; msg = '電腦贏得這一局'; }
      else { v.p += 1; v.a += 1; msg = '平手，各得 1 分'; }
      v.sets.push({ p: ps, a: as });
    }
    showSetSummary(ps, as, msg);
  }
  function nextSet() {
    const v = S.vs;
    if (v.p >= 6 || v.a >= 6 || v.shootoff) { finishVs(); return; }
    v.set++; v.pArr = []; v.aArr = []; v.idx = 0;
    if (v.p === 5 && v.a === 5) { v.shootoff = true; v.order = ['p', 'a']; }
    else v.order = ['p', 'a', 'p', 'a', 'p', 'a'];
    clearArrows();
    randWind(1, 4);
    playerReady();
    banner(v.shootoff ? '加賽' : '第 ' + v.set + ' 局', v.shootoff ? '一箭決勝負，最接近中心者獲勝' : '你 ' + v.p + ' : ' + v.a + ' 電腦');
  }
  function nextEnd() {
    S.endsDone.push(S.cur.slice());
    if (S.mode === 'pro' && S.endNo >= S.ends) { finishPro(); return; }
    S.endNo++; S.cur = [];
    clearArrows();
    if (S.mode === 'pro') newProWind(); else practiceWind();

    banner('第 ' + S.endNo + ' 回合', S.mode === 'pro' ? '共 ' + S.ends + ' 回合' : '練習');
  }

  /* =========================================================
   * 結算與選單
   * ========================================================= */
  function slot(label, big) {
    const l = label == null ? '' : label;
    if (l === '') return '<div class="sl"></div>';
    return '<div class="sl on" style="background:' + RC[l] + ';color:' + RT[l] + (big ? '' : '') + '">' + l + '</div>';
  }
  const sortEnd = arr => arr.slice().sort((a, b) => (b.v - a.v) || ((b.x ? 1 : 0) - (a.x ? 1 : 0)));
  function showEndSummary() {
    S.phase = 'endsum';
    const sum = S.cur.reduce((a, r) => a + r.v, 0);
    const last = S.mode === 'pro' && S.endNo >= S.ends;
    const line = sortEnd(S.cur).map(r => slot(r.label)).join('');
    openOv('<div class="card narrow"><h2>第 ' + S.endNo + ' 回合' + (S.mode === 'pro' ? ' / ' + S.ends : '') + '</h2>' +
      '<div class="endline">' + line + '</div>' +
      '<div class="kv"><div><b>' + sum + '</b><span>本回合</span></div><div><b>' + S.total + '</b><span>累計</span></div><div><b>' + S.xs + '</b><span>X 數</span></div></div>' +
      '<button class="btn wide" data-act="nextend" data-primary="1">' + (last ? '查看成績' : '拔箭，下一回合') + '</button>' +
      (S.mode === 'practice' ? '<button class="btn ghost wide" data-act="quit">結束練習</button>' : '') + '</div>', true);
    if (sum >= 54) sfx.applause(30);
  }
  function showSetSummary(ps, as, msg) {
    S.phase = 'endsum';
    const v = S.vs;
    const row = (arr) => arr.map(r => slot(r.label)).join('');
    const end = v.p >= 6 || v.a >= 6 || v.shootoff;

  function addPop(x, y, z, text, color, scale) {
    const el = document.createElement('div');
    el.className = 'pop';
    el.innerHTML = '<span style="color:' + color + ';font-size:' + Math.round(40 * (scale || 1)) + 'px">' + esc(text) + '</span>';

  function updatePops(dt) {
    for (let i = POPS.length - 1; i >= 0; i--) {
      const p = POPS[i];
      p.t += dt;

      last: S.last ? { label: S.last.label, v: S.last.v, x: S.last.x, dx: S.last.dx, dy: S.last.dy, kind: S.last.kind, who: S.last.who } : null,
      vs: S.vs ? { set: S.vs.set, p: S.vs.p, a: S.vs.a, idx: S.vs.idx, shootoff: S.vs.shootoff, sets: S.vs.sets.slice() } : null,
      draw: DR.draw, anchored: DR.anchored, active: DR.active, cam: CAM.mode, fov: cam.fov, quality: qLevel, overlay: !ov.classList.contains('hidden'),
      chase: !!(flight && flight.chase), view: S.view
    }),
    start: (o) => {
      o = o || {};
      if (o.mode === 'pro') startPro(o.dist || 70, o.ends || 2);
      else if (o.mode === 'practice') startPractice(o.dist || 30, o.wind || 0);
      else if (o.mode === 'challenge') startChallenge(o.level || 0);
      else if (o.mode === 'vs') startVs(o.ai || 0);
    },
    shootAt: (x, y, power) => {
      if (S.phase !== 'aim') return false;
      DR.active = false; DR.raise = 1;
      launch('p', { x: S.ref.x + x, y: S.ref.y + y, z: -S.D }, power == null ? 1 : power);
      return true;
    },
    setWind: (x, z) => { wind.bx = x; wind.bz = z; wind.gust = 0; },
    step: sec => { const n = Math.round(sec * 60); for (let i = 0; i < n; i++) { update(1 / 60); tick3D(1 / 60); } },
    scoreAt: (dx, dy, faceD) => scoreAt(dx, dy, faceD),
    predict: (x, y, power) => { const O = shooterO('p'); launchDir(O, { x: S.ref.x + x, y: S.ref.y + y, z: -S.D }, DIR); const e = predict(O, DIR, V_FULL * (0.22 + 0.78 * (power == null ? 1 : power)), simT); return { kind: e.kind, x: e.x, y: e.y, z: e.z, dx: e.dx, dy: e.dy, popped: (e.popped || []).length }; },
    solve: i => { const tg = TG.filter(t => !t.dead && t.kind !== 'boss').concat(TG.filter(t => t.kind === 'boss' && t.lane === MY_LANE))[i || 0]; if (!tg) return null; const a = solveAim(tg, 'p'); return { x: a.x - S.ref.x, y: a.y - S.ref.y }; },
    targets: () => TG.map(t => ({ kind: t.kind, x: t.x, y: t.y, z: t.z, dead: !!t.dead, lane: t.lane })),
    next: () => { const b = ov.querySelector('[data-primary]'); if (b) { b.click(); return true; } return false; },
    skip: () => skip(),
    menu: () => toMenu(),
    pause: () => togglePause(),
    levels: LEVELS.length,
    freeze: on => { frozen = !!on; },
    render: () => { tick3D(0); renderFrame(); drawHud(); if (inGame()) updateDomHud(); updatePops(0); },
    unlockAll: () => { stats.ch.max = LEVELS.length - 1; saveStats(); }
  };
}
</script>
