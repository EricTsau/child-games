<script>
'use strict';
const SLUG = 'bubble-shooter';
const cv = document.getElementById('game');
const ctx = cv.getContext('2d');
const FONT = '"Baloo 2","PingFang TC","Noto Sans TC","Microsoft JhengHei","Heiti TC",system-ui,sans-serif';
let W = 0, H = 0, dpr = 1, U = 1, time = 0;

/* =====================================================================
 * 數學、緩動、補間
 * ===================================================================== */
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const TAU = Math.PI * 2;
const Ease = {
  outCubic: t => 1 - Math.pow(1 - t, 3),
  inOutSine: t => -(Math.cos(Math.PI * t) - 1) / 2,
  outBack: t => { const c = 1.70158, c3 = c + 1; return 1 + c3 * Math.pow(t - 1, 3) + c * Math.pow(t - 1, 2); },
  outElastic: t => (t === 0 || t === 1) ? t : Math.pow(2, -10 * t) * Math.sin((t * 10 - 0.75) * (TAU / 3)) + 1
};
function mulberry(a) {
  return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
}
function shade(hex, amt) {
  const n = parseInt(hex.slice(1), 16);
  const f = v => clamp(v + amt, 0, 255);
  return 'rgb(' + f(n >> 16) + ',' + f((n >> 8) & 255) + ',' + f(n & 255) + ')';
}
function rgba(hex, a) {
  const n = parseInt(hex.slice(1), 16);
  return 'rgba(' + (n >> 16) + ',' + ((n >> 8) & 255) + ',' + (n & 255) + ',' + a + ')';
}

/* =====================================================================
 * 盤面邏輯（純邏輯，不畫圖；測試與機器人也用這一份）
 * 座標單位：泡泡半徑 R=16，盤面寬 11 顆。
 * ===================================================================== */
const COLS = 11, R = 16, D = 32, RH = R * Math.sqrt(3), BW = COLS * D, BH = 480;
const LX = BW / 2, LY = 436;
const DEADY = R + 13 * RH + 2;          // 泡泡中心超過這條線就輸
const HIT = D * 0.8;                     // 碰撞距離（稍微寬鬆）
const MINA = 0.14, MAXA = Math.PI - 0.14;
const K = (r, c) => r * 16 + c;
const COLORS = ['#ff4f6d', '#ffc531', '#3fc768', '#3d9bff', '#9a6bff', '#ff8a3d'];
const CNAME = ['紅心', '黃星', '綠葉', '藍圈', '紫鑽', '橘月'];

class Board {
  constructor() { this.g = []; this.shift = 0; this.ceil = 0; }
  clone() {
    const b = new Board(); b.shift = this.shift; b.ceil = this.ceil;
    b.g = this.g.map(row => row.map(x => x ? { c: x.c, t: x.t, a: x.a } : null));
    return b;
  }
  ind(r) { return ((r + this.shift) & 1) === 1; }
  cols(r) { return this.ind(r) ? COLS - 1 : COLS; }
  x(r, c) { return R + c * D + (this.ind(r) ? R : 0); }
  y(r) { return R + (r + this.ceil) * RH; }
  get(r, c) { const row = this.g[r]; return row && c >= 0 && c < row.length ? row[c] : null; }
  set(r, c, b) {
    while (this.g.length <= r) this.g.push(new Array(this.cols(this.g.length)).fill(null));
    this.g[r][c] = b;
  }
  trim() { while (this.g.length && this.g[this.g.length - 1].every(v => !v)) this.g.pop(); }
  each(fn) { for (let r = 0; r < this.g.length; r++) { const row = this.g[r]; for (let c = 0; c < row.length; c++) if (row[c]) fn(r, c, row[c]); } }
  count(fn) { let n = 0; this.each((r, c, b) => { if (!fn || fn(b)) n++; }); return n; }
  /** 鄰居：回傳平坦陣列 [r,c,r,c,...] */
  nb(r, c) {
    const o = [];
    const p = (rr, cc) => { if (rr >= 0 && cc >= 0 && cc < this.cols(rr)) o.push(rr, cc); };
    p(r, c - 1); p(r, c + 1);
    const a = this.ind(r) ? c : c - 1;
    p(r - 1, a); p(r - 1, a + 1); p(r + 1, a); p(r + 1, a + 1);
    return o;
  }
  attached(r, c) {
    if (r === 0) return true;
    const n = this.nb(r, c);
    for (let i = 0; i < n.length; i += 2) if (this.get(n[i], n[i + 1])) return true;
    return false;
  }
  collide(x, y) {
    const rr = Math.round((y - R) / RH - this.ceil);
    for (let r = Math.max(0, rr - 1); r <= rr + 1 && r < this.g.length; r++) {
      const cc = Math.round((x - R - (this.ind(r) ? R : 0)) / D);
      for (let c = cc - 1; c <= cc + 1; c++) {
        if (!this.get(r, c)) continue;
        const dx = this.x(r, c) - x, dy = this.y(r) - y;
        if (dx * dx + dy * dy < HIT * HIT) return true;
      }
    }
    return false;
  }
  /** 找最近的空格（必須黏得住） */
  snap(x, y) {
    const rr = Math.round((y - R) / RH - this.ceil);
    for (let span = 1; span <= 4; span++) {
      let best = null, bd = 1e18;
      for (let r = Math.max(0, rr - span); r <= rr + span; r++) {
        const n = this.cols(r);
        for (let c = 0; c < n; c++) {
          if (this.get(r, c) || !this.attached(r, c)) continue;
          const dx = this.x(r, c) - x, dy = this.y(r) - y, d = dx * dx + dy * dy;
          if (d < bd) { bd = d; best = [r, c]; }
        }
      }
      if (best) return best;
    }
    return null;
  }
  /** 沿著角度發射的路徑（瞄準線與真正的飛行都用這一個函式） */
  trace(a) {
    let x = LX, y = LY, dx = Math.cos(a), dy = -Math.sin(a);
    const pts = [x, y], S = 4, top = this.y(0);
    let bounces = 0;
    for (let i = 0; i < 3000; i++) {
      x += dx * S; y += dy * S;
      if (x < R) { x = 2 * R - x; dx = -dx; pts.push(R, y); bounces++; }
      else if (x > BW - R) { x = 2 * (BW - R) - x; dx = -dx; pts.push(BW - R, y); bounces++; }
      if (y <= top) { y = top; break; }
      if (this.collide(x, y)) break;
    }
    pts.push(x, y);
    return { pts, x, y, cell: this.snap(x, y), bounces };
  }
  /** 同色群組（彩虹泡泡算萬用色） */
  group(k0, col) {
    const seen = new Set([k0]), q = [k0], out = [];
    while (q.length) {
      const k = q.shift(); out.push(k);
      const n = this.nb(k >> 4, k & 15);
      for (let i = 0; i < n.length; i += 2) {
        const kk = K(n[i], n[i + 1]);
        if (seen.has(kk)) continue;
        const b = this.get(n[i], n[i + 1]);
        if (b && ((b.t === 'n' && b.c === col) || b.t === 'rainbow')) { seen.add(kk); q.push(kk); }
      }
    }
    return out;
  }
  /** 沒有連到天花板的泡泡 */
  floating() {
    const seen = new Set(), q = [];
    const row0 = this.g[0] || [];
    for (let c = 0; c < row0.length; c++) if (row0[c]) { seen.add(K(0, c)); q.push(K(0, c)); }
    while (q.length) {
      const k = q.pop(), n = this.nb(k >> 4, k & 15);
      for (let i = 0; i < n.length; i += 2) {
        const kk = K(n[i], n[i + 1]);
        if (!seen.has(kk) && this.get(n[i], n[i + 1])) { seen.add(kk); q.push(kk); }
      }
    }
    const out = [];
    this.each((r, c) => { if (!seen.has(K(r, c))) out.push(K(r, c)); });
    return out;
  }
  /** 新泡泡放在 k 之後的結算：配對、特殊泡泡、掉落 */
  resolve(k) {
    const r0 = k >> 4, c0 = k & 15, b = this.get(r0, c0);
    const popped = new Map(), trig = [], ev = { pop: [], drop: [], fx: [], freed: 0, matched: 0, rainbow: -1 };
    const isSp = t => t === 'bomb' || t === 'light';
    if (isSp(b.t)) trig.push({ k, d: 0 });
    else if (b.t === 'rainbow') {
      let best = -1, bs = 0;
      const n = this.nb(r0, c0);
      for (let i = 0; i < n.length; i += 2) {
        const nb = this.get(n[i], n[i + 1]);
        if (!nb || nb.t !== 'n') continue;
        const gl = this.group(k, nb.c).length;
        if (gl > bs) { bs = gl; best = nb.c; }
      }
      if (best >= 0) { b.t = 'n'; b.c = best; ev.rainbow = best; }
    }
    if (b.t === 'n') {
      const g = this.group(k, b.c);
      if (g.length >= 3) { g.forEach((kk, i) => popped.set(kk, i * 0.035)); ev.matched = g.length; }
    }
    // 碰到的炸彈／閃電會被觸發
    const touch = (kk, d) => {
      const n = this.nb(kk >> 4, kk & 15);
      for (let i = 0; i < n.length; i += 2) {
        const nb = this.get(n[i], n[i + 1]), nk = K(n[i], n[i + 1]);
        if (nb && isSp(nb.t) && !popped.has(nk)) trig.push({ k: nk, d });
      }
    };
    if (!isSp(b.t)) touch(k, 0.05);
    for (const [kk, d] of popped) touch(kk, d + 0.05);
    while (trig.length) {
      const t = trig.shift();
      if (popped.has(t.k) && t.k !== k) continue;
      if (t.k === k && popped.has(k) && !isSp(b.t)) continue;
      const tr = t.k >> 4, tc = t.k & 15, tb = this.get(tr, tc);
      if (!tb) continue;
      popped.set(t.k, t.d);
      const tx = this.x(tr, tc), ty = this.y(tr);
      ev.fx.push({ t: tb.t, x: tx, y: ty, r: tr, d: t.d });
      this.each((r, c, ob) => {
        const kk = K(r, c);
        if (popped.has(kk) || ob.t === 'stone') return;
        let hit = false, dd = 0;
        if (tb.t === 'bomb') { const dx = this.x(r, c) - tx, dy = this.y(r) - ty; dd = Math.sqrt(dx * dx + dy * dy); hit = dd <= D * 2.05; }
        else { hit = r === tr; dd = Math.abs(this.x(r, c) - tx); }
        if (!hit) return;
        popped.set(kk, t.d + 0.06 + dd * 0.0015);
        if (isSp(ob.t)) trig.push({ k: kk, d: t.d + 0.14 });
      });
    }
    for (const [kk, d] of popped) {
      const r = kk >> 4, c = kk & 15, pb = this.get(r, c);
      if (!pb) continue;
      ev.pop.push({ k: kk, b: pb, x: this.x(r, c), y: this.y(r), d });
      if (pb.a >= 0) ev.freed++;
      this.g[r][c] = null;
    }
    if (ev.pop.length) {
      for (const kk of this.floating()) {
        const r = kk >> 4, c = kk & 15, pb = this.get(r, c);
        ev.drop.push({ k: kk, b: pb, x: this.x(r, c), y: this.y(r) });
        if (pb.a >= 0) ev.freed++;
        this.g[r][c] = null;
      }
    }
    this.trim();
    return ev;
  }
  /** 無盡模式：最上面插入一排 */
  insertRow(row) { this.shift ^= 1; this.g.unshift(row.slice(0, this.cols(0))); }
  lowestY() { this.trim(); return this.g.length ? this.y(this.g.length - 1) : -1; }
}

/* 依形狀與色彩群聚產生泡泡（同一個種子結果固定） */
function fillColors(board, cells, n, rng, cl) {
  for (const [r, c] of cells) {
    const b = board.get(r, c);
    if (!b || b.c !== -2) continue;
    const cand = [];
    const nn = board.nb(r, c);
    for (let i = 0; i < nn.length; i += 2) { const o = board.get(nn[i], nn[i + 1]); if (o && o.c >= 0 && o.t === 'n') cand.push(o.c); }
    b.c = cand.length && rng() < cl ? cand[Math.floor(rng() * cand.length)] : Math.floor(rng() * n);
  }
}
function randomRow(board, n, rng, extra, rowIdx) {
  const len = board.ind(rowIdx) ? COLS - 1 : COLS, row = [];
  let prev = Math.floor(rng() * n);
  for (let c = 0; c < len; c++) {
    if (rng() > 0.6) prev = Math.floor(rng() * n);
    let b = { c: prev, t: 'n', a: -1 };
    if (extra && rng() < extra) {
      const t = ['bomb', 'light', 'rainbow', 'stone'][Math.floor(rng() * 4)];
      b = { c: -1, t, a: -1 };
    }
    row.push(b);
  }
  return row;
}

/* =====================================================================
 * 關卡（40 關）：手繪地圖 + 固定種子產生的形狀；全部都經過機器人驗證可破關。
 * 目標 clear=清空泡泡、animals=救出動物、score=限定發數內達到分數
 * 圖例：. 空  x 隨機色  0-5 指定色  S 石頭  B 炸彈  L 閃電  W 彩虹  A 動物(隨機色)
 * ===================================================================== */
const THEMES = [
  { name: '晨光草原', key: 'meadow', ui: '#3fb35f' },
  { name: '珊瑚海灣', key: 'ocean', ui: '#2f86d6' },
  { name: '糖霜雪山', key: 'snow', ui: '#8a6ee8' },
  { name: '星光夜空', key: 'night', ui: '#5b4bc4' }
];
const MAPS = {
  1: ['00011122200', '0011122200', '11122200011', '1122200011'],
  3: ['00A011A12A2', '0001112220', '22200011122', '2220001112', '1110002221'.slice(0, 11) + '1'],
  6: ['xxxxxxxxxxx', 'xxxxxxxxxx', 'xxSxxxxxSxx', 'xxxxxxxxxx', 'xxxxxxxxxxx', 'xSxxxxxxSx', '..xxSSSxx..'],
  10: ['xAxxxAxxxAx', 'xxxxxxxxxx', 'xxBxxxxxBxx', 'xxxxxxxxxx', 'SxxxxSxxxxS', 'xxxxxxxxxx', 'xxxxxxxxxxx', 'xxx.xx.xxx', '..x..x..x..'],
  16: ['xxxxx.xxxxx', 'xxxxLxxxxx', 'xxx.xxx.xxx', 'xxxxWxxxxx', 'xxxxxxxxxxx', 'x.xxxxxx.x', 'xxx.xxx.xxx', '.xxxxxxxx.', '..xxxxxxx..'],
  20: ['AxxxxAxxxxA', 'xxxxxxxxxx', 'xBxxxxxxxBx', 'xxxSxxSxxx', 'xxxxxxxxxxx', 'xxLxxxxLxx', 'xxxxxxxxxxx', '.xxxxxxxxx.'.slice(0, 10), '..xxx.xxx..', '...x...x...'],
  25: ['x.x.x.x.x.x', 'xxxxxxxxxx', 'xxxxxxxxxxx', 'xSxxBxxSxx', 'xxxxxxxxxxx', 'xxxxxxxxxx', 'xxxWxxxWxxx', 'xxxxxxxxxx', '.xxxxxxxxx.'],
  30: ['AxAxxxxxAxA', 'xxxxxxxxxx', 'xxxBxxxBxxx', 'xxxxxxxxxx', 'SxxxxLxxxxS', 'xxxxxxxxxx', 'xxSxxxxxSxx', 'xxxxxxxxxx', 'xxxxxxxxxxx', '.x.xxxx.x.'],
  35: ['xxxxxxxxxxx', 'xxSxxxxSxx', 'xxxxxxxxxxx', 'xLxxxxxxLx', 'xxxxxBxxxxx', 'xxxxxxxxxx', 'xSxxxxxxxSx', 'xxxxWWxxxx', 'xxxxxxxxxxx'],
  40: ['AxxxAxAxxxA', 'xxxxxxxxxx', 'xxBxxxxxBxx', 'xxxxSSxxxx', 'xLxxxxxxxLx', 'xxxxxxxxxx', 'xxxSxxxSxxx', 'xxxxWxxxxx', 'xxxxxxxxxxx', 'x.xxxxxx.x', 'x...x.x...x']
};
const SHAPES = {
  full: () => true,
  vee: (u, v) => Math.abs(u) > v * 0.75 - 0.2,
  pyramid: (u, v) => Math.abs(u) <= 1.05 - v * 0.8,
  pillars: (u, v, r, c) => v < 0.12 || Math.floor((u + 1) * 5.5) % 3 !== 2,
  diamond: (u, v) => Math.abs(u) <= 0.25 + (v < 0.5 ? v * 1.6 : (1 - v) * 1.6),
  heart: (u, v) => { const X = u * 1.25, Y = (0.35 - v) * 1.6; const q = X * X + Y * Y - 1; return v < 0.1 || q * q * q - X * X * Y * Y * Y <= 0; },
  waves: (u, v) => v < 0.55 + 0.4 * Math.sin(u * 5),
  checker: (u, v, r, c) => r === 0 || (r + c) % 3 !== 0,
  arch: (u, v) => v < 0.3 || Math.abs(u) > 0.5,
  bridge: (u, v) => v < 0.18 || Math.abs(u) < 0.28 || Math.abs(u) > 0.72,
  rings: (u, v) => { const d = Math.sqrt(u * u + (v - 0.45) * (v - 0.45) * 2.4); return v < 0.12 || Math.floor(d * 4.2) % 2 === 0; },
  stairs: (u, v) => v <= (u + 1) * 0.55 + 0.15,
  zig: (u, v) => Math.abs(u - Math.sin(v * 9) * 0.5) < 0.62 || v < 0.15,
  funnel: (u, v) => Math.abs(u) >= 0.15 + v * 0.35 || v < 0.2
};
// [目標, 形狀, 排數, 色數, 特殊{S,B,L,W,A}, 天花板每N發下降, 瞄準線長度(0=全長)]
const LV = [
  ['clear', 'map', 0, 3, {}, 0, 0],
  ['clear', 'pyramid', 4, 3, {}, 0, 0],
  ['animals', 'map', 0, 3, {}, 0, 0],
  ['score', 'full', 5, 4, {}, 0, 0],
  ['clear', 'pillars', 6, 4, {}, 0, 0],
  ['clear', 'map', 0, 4, {}, 0, 0],
  ['animals', 'waves', 6, 4, { A: 4 }, 0, 0],
  ['clear', 'heart', 8, 4, { B: 2 }, 0, 0],
  ['score', 'checker', 7, 4, { B: 2 }, 10, 0],
  ['animals', 'map', 0, 4, {}, 10, 0],
  ['clear', 'vee', 7, 4, { W: 2 }, 10, 0],
  ['animals', 'pyramid', 7, 4, { A: 4, W: 1 }, 10, 0],
  ['score', 'full', 8, 4, { L: 2 }, 10, 0],
  ['clear', 'diamond', 9, 5, { L: 1, W: 1 }, 0, 0],
  ['animals', 'arch', 8, 5, { A: 5, S: 3 }, 9, 0],
  ['clear', 'map', 0, 5, {}, 9, 0],
  ['score', 'waves', 8, 5, { B: 2 }, 9, 0],
  ['clear', 'rings', 9, 5, { S: 4, W: 1 }, 9, 0],
  ['animals', 'bridge', 9, 5, { A: 5, L: 2 }, 9, 0],
  ['animals', 'map', 0, 5, {}, 9, 0],
  ['clear', 'stairs', 8, 5, { B: 1, W: 1 }, 9, 380],
  ['animals', 'zig', 9, 5, { A: 5, S: 2 }, 9, 380],
  ['score', 'funnel', 9, 5, { L: 2, B: 1 }, 9, 380],
  ['clear', 'heart', 9, 5, { S: 3, B: 2 }, 8, 380],
  ['clear', 'map', 0, 5, {}, 8, 380],
  ['animals', 'checker', 9, 5, { A: 6, W: 2 }, 8, 380],
  ['score', 'pillars', 9, 5, { B: 2, L: 1 }, 8, 380],
  ['clear', 'waves', 9, 5, { S: 4, L: 1 }, 8, 380],
  ['animals', 'rings', 10, 5, { A: 6, B: 2 }, 8, 380],
  ['animals', 'map', 0, 5, {}, 8, 380],
  ['clear', 'full', 8, 6, { W: 2, B: 1 }, 9, 0],
  ['score', 'arch', 9, 6, { L: 2, W: 1 }, 8, 340],
  ['animals', 'diamond', 10, 6, { A: 5, B: 2 }, 8, 340],
  ['clear', 'bridge', 10, 6, { S: 4, W: 2 }, 8, 340],
  ['clear', 'map', 0, 6, {}, 8, 340],
  ['animals', 'vee', 9, 6, { A: 6, L: 2 }, 8, 300],
  ['score', 'zig', 10, 6, { B: 2, W: 2 }, 8, 300],
  ['clear', 'stairs', 10, 6, { S: 4, B: 2, W: 1 }, 7, 300],
  ['animals', 'funnel', 10, 6, { A: 6, L: 2, W: 1 }, 7, 300],
  ['animals', 'map', 0, 6, {}, 7, 300]
];
// 機器人測出來的發數係數（越大越寬鬆），讓小朋友也過得了
const SHOT_K = 1.0;
const SCORE_K = { 3: 0.7, 8: 0.8, 12: 2.0, 16: 1.0, 22: 1.6, 26: 1.1, 31: 2.2, 36: 0.7 };
const SHOT_EXTRA = { 10: 4, 27: 2, 28: 2, 37: 3 };
function buildBoard(i) {
  const L = LV[i], n = L[3], sp = L[4];
  const rng = mulberry(9173 + i * 7919);
  const b = new Board();
  let rows;
  if (L[1] === 'map') rows = MAPS[i + 1];
  else {
    rows = [];
    const f = SHAPES[L[1]];
    for (let r = 0; r < L[2]; r++) {
      let s = '';
      for (let c = 0; c < b.cols(r); c++) {
        const u = (b.x(r, c) - BW / 2) / (BW / 2 - R), v = L[2] > 1 ? r / (L[2] - 1) : 0;
        s += f(u, v, r, c) ? 'x' : '.';
      }
      rows.push(s);
    }
  }
  const cells = [];
  rows.forEach((s, r) => {
    for (let c = 0; c < b.cols(r); c++) {
      const ch = s[c] || '.';
      if (ch === '.') continue;
      let bb = { c: -2, t: 'n', a: -1 };
      if (ch >= '0' && ch <= '5') bb.c = +ch;
      else if (ch === 'S') bb = { c: -1, t: 'stone', a: -1 };
      else if (ch === 'B') bb = { c: -1, t: 'bomb', a: -1 };
      else if (ch === 'L') bb = { c: -1, t: 'light', a: -1 };
      else if (ch === 'W') bb = { c: -1, t: 'rainbow', a: -1 };

  else if (e.pointerType === 'mouse' && !P.paused && !P.result) {
    const inside = px > -20 && px < BW + 20 && py > -20 && py < LY - 6;
    P.hover = inside; if (inside) { aimFrom(px, py); P.kbAim = false; }
  }
});
function endPointer(e, cancel) {
  const [px, py, sx, sy] = toBoard(e.clientX, e.clientY);
  if (pressed && pressed.pid === e.pointerId) {
    const b = hitBtn(sx, sy), id = pressed.id;
    pressed = null;
    if (!cancel && b && b.id === id && b.onClick) { KG.sound('pop'); b.onClick(); }
    return;
  }
  if (scr === 'map' && mapDrag && mapDrag.pid === e.pointerId) {
    const md = mapDrag; mapDrag = null;
    if (md.moved < 10 && !cancel) {
      let best = -1, bd = (52 * U) * (52 * U);
      for (let i = 0; i < LV.length; i++) {
        const dx = mapNodeX(i) - sx, dy = mapNodeY(i) - mapScroll - sy, d = dx * dx + dy * dy;
        if (d < bd) { bd = d; best = i; }
      }
      if (best >= 0) {
        if (Save.unlocked(best)) { mapCard = best; KG.sound('click'); }
        else { KG.sound('wrong'); KG.toast('先過前一關才能玩喔！'); }
      }
    }
    return;
  }
  if (scr !== 'play' || !P) return;
  if (P.aiming && e.pointerId === P.pid) {
    P.aiming = false;
    aimFrom(px, py);
    if (cancel) return;
    // 放開在發射台上 = 取消
    if (Math.hypot(px - LX, py - LY) < 26) return;
    fire(P.aimA);
  }
}
cv.addEventListener('pointerup', e => endPointer(e, false));
cv.addEventListener('pointercancel', e => endPointer(e, true));
cv.addEventListener('pointerleave', e => { if (e.pointerType === 'mouse' && P) P.hover = false; });
cv.addEventListener('contextmenu', e => e.preventDefault());
cv.addEventListener('wheel', e => { if (scr === 'map') { mapScroll += e.deltaY; clampMap(); } }, { passive: true });
function doSwap() {
  if (!P || P.shot || P.sim.over || P.paused) return;
  P.sim.swap(); P.swapT = 1; sfx('swap');
}
const keys = {};
window.addEventListener('keydown', e => {
  if (scr !== 'play' || !P) {
    if (scr === 'title' && (e.key === 'Enter' || e.key === ' ')) goMap();
    else if (scr === 'map' && mapCard >= 0 && (e.key === 'Enter' || e.key === ' ')) startLevel(mapCard);
    else if (scr === 'map' && e.key === 'Escape') { if (mapCard >= 0) mapCard = -1; else goTitle(); }
    else if (scr === 'map' && (e.key === 'Enter' || e.key === ' ')) { const st = Save.stars(); let cur = 0; while (cur < LV.length - 1 && (st[cur] || 0) > 0) cur++; mapCard = cur; }
    return;
  }
  if (e.key === 'p' || e.key === 'P' || e.key === 'Escape') { togglePause(!P.paused); e.preventDefault(); return; }
  if (P.result) { if (e.key === 'Enter' || e.key === ' ') { if (P.endless) startLevel('endless'); else if (P.result.won && P.lv < LV.length - 1) startLevel(P.lv + 1); else startLevel(P.lv); } return; }
  if (P.paused) { if (e.key === 'Enter') togglePause(false); return; }
  if (e.key === 'ArrowLeft' || e.key === 'ArrowRight' || e.key === 'a' || e.key === 'd') { keys[e.key] = true; P.kbAim = true; e.preventDefault(); }
  if (e.key === ' ' || e.key === 'ArrowUp' || e.key === 'Enter' || e.key === 'w') { if (P.banner > 0.6) P.banner = 0.6; else fire(P.aimA); e.preventDefault(); }
  if (e.key === 'x' || e.key === 'X' || e.key === 'Shift' || e.key === 'ArrowDown' || e.key === 's') { doSwap(); e.preventDefault(); }
});
window.addEventListener('keyup', e => { keys[e.key] = false; });
function keyAim(dt) {
  if (!P) return;
  const l = keys.ArrowLeft || keys.a, r = keys.ArrowRight || keys.d;
  if (l) P.aimA = clamp(P.aimA + dt * 1.3, MINA, MAXA);
  if (r) P.aimA = clamp(P.aimA - dt * 1.3, MINA, MAXA);
}

/* =====================================================================
 * 主迴圈
 * ===================================================================== */
let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  if (!document.hidden) { keyAim(dt); update(dt); draw(); }
  requestAnimationFrame(frame);
}
function relayout() { layout(); }
window.addEventListener('resize', relayout);
window.addEventListener('orientationchange', () => setTimeout(relayout, 120));
if (window.visualViewport) window.visualViewport.addEventListener('resize', relayout);
document.addEventListener('visibilitychange', () => { if (document.hidden && scr === 'play' && P && !P.result) togglePause(true); if (document.hidden) Music.next = 0.2; });
layout();
Music.start('menu');
requestAnimationFrame(frame);

/* =====================================================================
 * 測試用掛勾
 * ===================================================================== */
function parseGrid(rows) {
  const b = new Board();
  rows.forEach((s, r) => {
    s = s.replace(/\s/g, '');
    for (let c = 0; c < b.cols(r); c++) {
      const ch = s[c] || '.';
      if (ch === '.') continue;
      let bb = null;
      if (ch >= '0' && ch <= '5') bb = { c: +ch, t: 'n', a: -1 };
      else if (ch >= 'a' && ch <= 'f') bb = { c: ch.charCodeAt(0) - 97, t: 'n', a: 0 };
      else bb = { c: -1, t: { S: 'stone', B: 'bomb', L: 'light', W: 'rainbow' }[ch], a: -1 };
      b.set(r, c, bb);
    }
  });
  return b;
}
function gridStr(b) {
  return b.g.map(row => row.map(x => !x ? '.' : x.t === 'n' ? (x.a >= 0 ? String.fromCharCode(97 + x.c) : String(x.c)) : { stone: 'S', bomb: 'B', light: 'L', rainbow: 'W' }[x.t]).join(''));
}
window.__bs = {
  consts: { R, D, RH, BW, BH, LX, LY, COLS, DEADY, MINA, MAXA },
  Board, Sim, LV, buildBoard, levelInfo, parseGrid, gridStr,
  state: () => ({
    screen: scr, level: P ? P.lv : null, mode: P ? (P.endless ? 'endless' : 'adventure') : null,
    score: P ? P.sim.score : 0, shots: P ? P.sim.shots : 0, shotsLeft: P ? P.sim.shotsLeft : 0,
    goal: P ? P.sim.info.goal : null, freed: P ? P.sim.freed : 0, animals: P ? P.sim.info.animals : 0, target: P ? P.sim.info.target : 0,
    over: P ? P.sim.over : false, won: P ? P.sim.won : false, result: P && P.result ? { won: P.result.won, stars: P.result.stars, score: P.result.score } : null,
    flying: !!(P && P.shot), busy: P ? Math.max(0, P.busy) : 0, banner: P ? Math.max(0, P.banner) : 0, paused: P ? P.paused : false,
    ammo: P ? P.sim.ammo.map(a => a.t === 'n' ? a.c : a.t) : [], grid: P ? gridStr(P.sim.board) : [], ceil: P ? P.sim.board.ceil : 0,
    aim: P ? P.aimA : 0, combo: P ? P.sim.combo : 0, mapCard
  }),
  start: lv => { startLevel(lv == null ? 0 : lv); P.banner = 0; return true; },
  map: () => goMap(), title: () => goTitle(),
  board: () => P && P.sim.board,
  sim: () => P && P.sim,
  setGrid: rows => { if (!P) startLevel(0); const b = parseGrid(rows); P.sim.board = b; P.vCeil = 0; P.totalStart = 0; return gridStr(b); },
  setAmmo: (a, b) => { const f = v => typeof v === 'number' ? { c: v, t: 'n' } : { c: -1, t: v }; P.sim.ammo[0] = f(a); if (b != null) P.sim.ammo[1] = f(b); },
  trace: a => { const t = P.sim.board.trace(a); return { pts: t.pts.map(v => Math.round(v * 100) / 100), cell: t.cell, bounces: t.bounces }; },
  shootAt: a => { if (P) { P.banner = 0; P.busy = 0; } const ev = fire(a); return ev ? { cell: ev.cell, pops: ev.pop.length, drops: ev.drop.length, gain: ev.gain, win: !!ev.win, lose: ev.lose || null, path: ev.trace.pts.map(v => Math.round(v * 100) / 100) } : null; },
  step: sec => { const n = Math.round((sec || 0) * 60); for (let i = 0; i < n; i++) update(1 / 60); draw(); },
  shotPos: () => { if (!P || !P.shot) return null; const sh = P.shot; let s = sh.s, i = 0; while (i < sh.seg.length - 1 && s > sh.seg[i]) { s -= sh.seg[i]; i++; } const t = sh.seg[i] ? Math.min(1, s / sh.seg[i]) : 1, p = sh.pts; return [lerp(p[i * 2], p[i * 2 + 2], t), lerp(p[i * 2 + 1], p[i * 2 + 3], t)]; },
  toScreen: (x, y) => [bx + x * bs, by + y * bs],
  btn: id => { const b = btnReg.find(q => q.id === id); return b ? [b.x + b.w / 2, b.y + b.h / 2] : null; },
  mapNode: i => [mapNodeX(i), mapNodeY(i) - mapScroll],
  swapPos: () => [bx + (LX - 54) * bs, by + (LY + 18) * bs],
  layout: () => ({ W, H, bs, bx, by, side, U }),
  pause: on => togglePause(on),
  unlockAll: () => { const a = []; for (let i = 0; i < LV.length; i++) a[i] = Math.max(Save.stars()[i] || 0, 1); Save.set('stars', a); },
  finishNow: () => { if (P && P.overT >= 0) { P.overT = -1; finish(); } }
};
</script>
