<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>滑塊拼圖</title>
<link rel="stylesheet" href="../../assets/common.css">
<style>
  html, body { height: 100%; overflow: hidden; }
  body { height: 100vh; height: 100dvh; touch-action: none; background: #cdeeff; }
  #bg { position: absolute; inset: 0; width: 100%; height: 100%; }
  .floaty { animation: floaty 9s ease-in-out infinite alternate; transform-box: fill-box; transform-origin: center; }
  @keyframes floaty { from { transform: translateY(-14px) rotate(-10deg); } to { transform: translateY(14px) rotate(10deg); } }
  .drift { animation: drift linear infinite; }
  @keyframes drift { from { transform: translateX(-260px); } to { transform: translateX(1300px); } }

  /* 糖果造型 HUD */
  #hud { position: fixed; top: 10px; left: 50%; transform: translateX(-50%); z-index: 8000; display: flex; align-items: center; gap: 8px; pointer-events: none;
    padding: 5px 14px 5px 5px; border-radius: 999px; border: 4px solid #fff; font-weight: 900; font-size: 18px; color: #7a3d5c; white-space: nowrap;
    background: linear-gradient(180deg, #fff 0%, #ffe6f0 100%); box-shadow: 0 5px 0 #f3a6c4, 0 10px 18px rgba(160,60,110,.25); }
  #hud .lv { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; color: #fff; font-size: 20px;
    background: radial-gradient(circle at 35% 30%, #ffb3cc, #ff6f9e 60%, #e8507f); box-shadow: inset 0 -3px 0 rgba(0,0,0,.15); -webkit-text-stroke: 3px #c2406e; paint-order: stroke fill; }
  #hud .it { display: flex; align-items: center; gap: 3px; }
  #hud svg { width: 26px; height: 26px; }
  #par { display: flex; gap: 0; } #par svg { width: 20px; height: 20px; transition: transform .3s, opacity .3s; }
  #par svg.off { opacity: .35; transform: scale(.8); filter: grayscale(1); }

  #wrap { position: absolute; inset: 0; display: grid; grid-template-rows: 1fr auto; padding: 70px 10px max(10px, env(safe-area-inset-bottom)); }
  #stage { position: relative; min-height: 0; touch-action: none; }
  #cv { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; cursor: pointer; }
  #bar { display: flex; gap: 8px; align-items: flex-end; justify-content: center; padding-top: 6px; }
  .rb { width: 58px; height: 58px; border-radius: 50%; border: 4px solid #fff; cursor: pointer; display: grid; place-items: center; padding: 0;
    background: linear-gradient(180deg, #9ee0ff, #3a9ee8); box-shadow: 0 5px 0 #2672ad, 0 8px 14px rgba(0,0,0,.2); transition: transform .12s cubic-bezier(.3,1.8,.5,1); }
  .rb:active { transform: translateY(3px) scale(.92); }
  .rb svg { width: 30px; height: 30px; }
  .rb.y { background: linear-gradient(180deg, #ffe58a, #f5b82e); box-shadow: 0 5px 0 #c48a12, 0 8px 14px rgba(0,0,0,.2); }
  .rb.g { background: linear-gradient(180deg, #9be8aa, #46b864); box-shadow: 0 5px 0 #2f8a48, 0 8px 14px rgba(0,0,0,.2); }
  .rb.p { background: linear-gradient(180deg, #ffb3cc, #e8648d); box-shadow: 0 5px 0 #b8325e, 0 8px 14px rgba(0,0,0,.2); }
  .rb.off { filter: saturate(.25); }
  #thumb { width: 62px; height: 62px; border-radius: 14px; border: 4px solid #fff; box-shadow: 0 5px 0 rgba(0,0,0,.12); background: #fff; }
  #mascot { width: 76px; height: 76px; flex: none; margin-right: -4px; }
  #mascot svg { width: 100%; height: 100%; overflow: visible; }
  #mascot .body { transform-origin: 50% 95%; animation: breathe 2.4s ease-in-out infinite; transform-box: fill-box; }
  #mascot.happy .body { animation: hop .55s cubic-bezier(.3,1.6,.5,1); }
  #mascot.cheer .body { animation: hop .55s cubic-bezier(.3,1.6,.5,1) infinite; }
  @keyframes breathe { 0%,100% { transform: scale(1,1); } 50% { transform: scale(1.04,.96); } }
  @keyframes hop { 0% { transform: scale(1,1); } 25% { transform: scale(1.15,.85); } 55% { transform: translateY(-18px) scale(.92,1.1); } 100% { transform: none; } }
  .eye { animation: blink 4s infinite; transform-box: fill-box; transform-origin: center; }
  @keyframes blink { 0%, 92%, 100% { transform: scaleY(1); } 95% { transform: scaleY(.1); } }
  #bubble { position: absolute; left: 50%; bottom: calc(100% + 6px); background: #fff; border-radius: 16px; padding: 4px 12px; font-weight: 900; font-size: 15px; color: #c2406e; white-space: nowrap; box-shadow: 0 4px 0 rgba(0,0,0,.1); opacity: 0; transform: translateX(-30%) scale(.5); transition: all .25s cubic-bezier(.3,1.7,.5,1); pointer-events: none; }
  #bubble.on { opacity: 1; transform: translateX(-30%) scale(1); }
  .mwrap { position: relative; }

  .frames { position: relative; display: flex; gap: 10px; align-items: center; justify-content: center; flex-wrap: wrap; background: rgba(255,255,255,.75); padding: 6px 12px; border-radius: 22px; border: 3px solid #fff; }
  .frames b { color: #c2406e; }
  .fr { position: relative; width: 56px; height: 56px; border-radius: 16px; border: 4px solid #fff; cursor: pointer; box-shadow: 0 4px 0 rgba(0,0,0,.12); }
  .fr.on { outline: 4px solid #ffb020; transform: scale(1.08); }
  .fr .lk { position: absolute; inset: 6px; } .fr .lk svg { width: 100%; height: 100%; }
  .fr .need { position: absolute; bottom: -9px; left: 50%; transform: translateX(-50%); font-size: 12px; font-weight: 900; background: #ffd23f; color: #7a4a00; border-radius: 99px; padding: 0 6px; }

  @media (orientation: landscape) and (max-height: 600px) {
    #wrap { grid-template-rows: 1fr; grid-template-columns: 1fr auto; padding: 64px 12px 8px; }
    #bar { flex-direction: column; align-items: center; padding: 0 0 0 8px; gap: 6px; }
    .mwrap { display: none; }
    .rb { width: 52px; height: 52px; } #thumb { width: 52px; height: 52px; }
    .bgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  }
  .bgrid { display: contents; }
  @media (max-width: 440px) {
    #bar { gap: 6px; }
    #mascot { width: 60px; height: 60px; }
    .rb { width: 54px; height: 54px; } .rb svg { width: 27px; height: 27px; }
    #thumb { width: 56px; height: 56px; }
  }
  @media (max-width: 360px) { #mascot { display: none; } }
</style>
</head>
<body>
<svg id="bg" viewBox="0 0 1000 1000" preserveAspectRatio="xMidYMid slice" aria-hidden="true"></svg>
<div id="hud" hidden>
  <div class="lv" id="lv">1</div>
  <div class="it" id="itMoves"></div>
  <div class="it" id="itTime"></div>
  <div id="par"></div>
</div>
<div id="wrap" hidden>
  <div id="stage"><canvas id="cv"></canvas></div>
  <div id="bar">
    <div class="mwrap"><div id="mascot"></div><div id="bubble"></div></div>
    <canvas id="thumb" width="128" height="128" title="完整的圖"></canvas>
    <div class="bgrid">
      <button class="rb y" id="bHint" aria-label="偷看完整的圖"></button>
      <button class="rb g" id="bNum" aria-label="數字提示"></button>
      <button class="rb p" id="bShuffle" aria-label="重新開始"></button>
      <button class="rb" id="bMenu" aria-label="選關卡"></button>
    </div>
  </div>
</div>
<script src="../../assets/common.js"></script>
<script id="gk-kit">
/* ===== GK 遊戲小工具（標題畫面、關卡選擇、獎勵畫面、特效、背景音樂）===== */
const GK = (function () {
  'use strict';
  const GK = {};
  // ---------- 緩動 ----------
  GK.ease = {
    outCubic: t => 1 - Math.pow(1 - t, 3),
    inOutSine: t => -(Math.cos(Math.PI * t) - 1) / 2,
    outBack: t => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); },
    outElastic: t => t === 0 ? 0 : t === 1 ? 1 : Math.pow(2, -10 * t) * Math.sin((t * 10 - 0.75) * (2 * Math.PI) / 3) + 1,
  };
  GK.lerp = (a, b, t) => a + (b - a) * t;
  GK.clamp = (v, a, b) => Math.max(a, Math.min(b, v));

  // ---------- 樣式 ----------
  const css = `
  [hidden] { display: none !important; }
  .gk-screen { position: fixed; inset: 0; z-index: 8900; display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 14px; padding: 70px 16px 24px; overflow: hidden; animation: kg-fade .3s ease; text-align: center; }
  .gk-screen.out { animation: gkOut .28s ease forwards; }
  @keyframes gkOut { to { opacity: 0; transform: scale(1.04); } }
  .gk-rays { position: absolute; left: 50%; top: 42%; width: 260vmax; height: 260vmax; margin: -130vmax 0 0 -130vmax; pointer-events: none;
    background: repeating-conic-gradient(rgba(255,255,255,.16) 0 10deg, rgba(255,255,255,0) 10deg 20deg); animation: gkSpin 40s linear infinite; }
  @keyframes gkSpin { to { transform: rotate(360deg); } }
  .gk-logo { position: relative; font-size: clamp(38px, 11vw, 76px); font-weight: 900; line-height: 1.05; letter-spacing: 2px; color: #fff; margin: 0;
    -webkit-text-stroke: 0; paint-order: stroke fill; }
  .gk-logo span { display: inline-block; animation: gkLetter .7s cubic-bezier(.2,1.8,.4,1) both, gkWave 2.4s ease-in-out infinite;
    text-shadow: 0 4px 0 var(--gk-dark,#c24470), 0 7px 0 var(--gk-dark,#c24470), 0 12px 16px rgba(0,0,0,.25);
    -webkit-text-stroke: 7px var(--gk-dark,#c24470); paint-order: stroke fill; }
  @keyframes gkLetter { from { transform: translateY(-80px) scale(.3); opacity: 0; } }
  @keyframes gkWave { 0%,100% { translate: 0 0; } 50% { translate: 0 -6px; } }
  .gk-sub { position: relative; font-size: 18px; font-weight: 800; color: var(--gk-dark,#c24470); background: rgba(255,255,255,.85);
    padding: 6px 18px; border-radius: 999px; box-shadow: 0 4px 0 rgba(0,0,0,.08); }
  .gk-art { position: relative; width: min(78vw, 46vh, 360px); aspect-ratio: 1; flex: none; }
  .gk-art > svg, .gk-art > canvas { width: 100%; height: 100%; display: block; overflow: visible; }
  .gk-row { position: relative; display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }
  .gk-btn { position: relative; font-family: var(--kg-font); font-weight: 900; color: #fff; border: 4px solid #fff; border-radius: 999px; cursor: pointer;
    font-size: 24px; padding: 12px 34px; min-height: 60px; letter-spacing: 2px;
    background: linear-gradient(180deg, #9cf08f 0%, #4cc75a 55%, #33a845 100%);
    box-shadow: 0 6px 0 #23803a, 0 12px 20px rgba(0,0,0,.25), inset 0 3px 0 rgba(255,255,255,.5);
    text-shadow: 0 2px 0 rgba(0,0,0,.2); transition: transform .12s cubic-bezier(.3,1.8,.5,1); }
  .gk-btn::after { content: ""; position: absolute; left: 14%; right: 14%; top: 6px; height: 34%; border-radius: 999px; background: rgba(255,255,255,.35); pointer-events: none; }
  .gk-btn:active { transform: translateY(4px) scale(.95); box-shadow: 0 2px 0 #23803a, 0 4px 8px rgba(0,0,0,.25); }
  .gk-btn.big { font-size: 30px; padding: 14px 52px; animation: gkPulse 1.4s ease-in-out infinite; }
  @keyframes gkPulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.07); } }
  .gk-btn.blue { background: linear-gradient(180deg, #9ee0ff 0%, #44a8f0 60%, #2f8ad6 100%); box-shadow: 0 6px 0 #1f64a8, 0 12px 20px rgba(0,0,0,.25), inset 0 3px 0 rgba(255,255,255,.5); }
  .gk-btn.pink { background: linear-gradient(180deg, #ffb3cc 0%, #ff6f9e 60%, #e8507f 100%); box-shadow: 0 6px 0 #b8325e, 0 12px 20px rgba(0,0,0,.25), inset 0 3px 0 rgba(255,255,255,.5); }
  .gk-btn.orange { background: linear-gradient(180deg, #ffd88a 0%, #ffa53a 60%, #f08a1c 100%); box-shadow: 0 6px 0 #b86010, 0 12px 20px rgba(0,0,0,.25), inset 0 3px 0 rgba(255,255,255,.5); }
  .gk-btn.small { font-size: 18px; padding: 8px 20px; min-height: 56px; }
  .gk-btn svg { width: 1.2em; height: 1.2em; vertical-align: -0.2em; }
  .gk-title2 { position: relative; font-size: clamp(28px, 8vw, 44px); font-weight: 900; color: #fff; margin: 0;
    -webkit-text-stroke: 6px var(--gk-dark,#c24470); paint-order: stroke fill; text-shadow: 0 5px 0 var(--gk-dark,#c24470), 0 10px 14px rgba(0,0,0,.2); }
  .gk-grid { position: relative; display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 14px; width: min(560px, 100%);
    max-height: calc(100% - 150px); overflow-y: auto; padding: 8px 6px 14px; touch-action: pan-y; }
  .gk-card { position: relative; border: 4px solid #fff; border-radius: 24px; padding: 8px 6px 6px; cursor: pointer; font-family: var(--kg-font);
    background: linear-gradient(180deg, #fff 0%, #fff3f8 100%); box-shadow: 0 6px 0 rgba(0,0,0,.12), 0 10px 18px rgba(0,0,0,.15);
    display: flex; flex-direction: column; align-items: center; gap: 4px; color: var(--kg-ink); animation: kg-pop .4s cubic-bezier(.2,1.6,.4,1) both;
    transition: transform .12s; min-height: 112px; }
  .gk-card:active { transform: scale(.93); }
  .gk-card .num { font-size: 30px; font-weight: 900; color: #fff; -webkit-text-stroke: 5px var(--gk-dark,#c24470); paint-order: stroke fill; line-height: 1.1; }
  .gk-card .pic { flex: none; width: 100%; aspect-ratio: 1.25; border-radius: 14px; overflow: hidden; display: grid; place-items: center; }
  .gk-card .pic > * { width: 100%; height: 100%; }
  .gk-card .lbl { font-size: 14px; font-weight: 800; }
  .gk-card.locked { filter: grayscale(.85); opacity: .75; cursor: default; }
  .gk-card .lock { position: absolute; inset: 0; display: grid; place-items: center; }
  .gk-card .lock svg { width: 46px; height: 46px; filter: drop-shadow(0 3px 2px rgba(0,0,0,.3)); }
  .gk-stars { display: flex; gap: 2px; justify-content: center; }
  .gk-stars svg { width: 24px; height: 24px; }
  .gk-total { position: relative; display: inline-flex; align-items: center; gap: 6px; font-size: 22px; font-weight: 900; background: rgba(255,255,255,.9);
    padding: 4px 16px 4px 8px; border-radius: 999px; border: 3px solid #fff; box-shadow: 0 4px 0 rgba(0,0,0,.1); color: var(--kg-ink); }
  .gk-total svg { width: 32px; height: 32px; }
  .gk-panel { position: relative; width: min(420px, 100%); background: linear-gradient(180deg, #fff 0%, #fff5f9 100%); border: 6px solid #fff; border-radius: 34px;
    padding: 64px 20px 22px; box-shadow: 0 14px 0 rgba(0,0,0,.08), 0 24px 40px rgba(0,0,0,.3); animation: kg-pop .45s cubic-bezier(.2,1.6,.4,1); }
  .gk-ribbon { position: absolute; left: 50%; top: -30px; transform: translateX(-50%); width: calc(100% + 28px); max-width: 96vw; padding: 12px 10px 16px; font-size: 30px; font-weight: 900; color: #fff;
    background: linear-gradient(180deg, var(--gk-light,#ff9fbe), var(--gk-mid,#ff6f9e)); border-radius: 18px; box-shadow: 0 6px 0 var(--gk-dark,#c24470), 0 10px 18px rgba(0,0,0,.2);
    -webkit-text-stroke: 5px var(--gk-dark,#c24470); paint-order: stroke fill; white-space: nowrap; }
  .gk-bigstars { display: flex; justify-content: center; align-items: flex-end; gap: 6px; margin: 2px 0 8px; }
  .gk-bigstars svg { width: 76px; height: 76px; animation: gkStar .55s cubic-bezier(.2,1.9,.4,1) both; filter: drop-shadow(0 5px 3px rgba(0,0,0,.18)); }
  .gk-bigstars svg:nth-child(2) { width: 96px; height: 96px; transform-origin: center; }
  @keyframes gkStar { from { transform: scale(0) rotate(-120deg); opacity: 0; } }
  .gk-msg { font-size: 20px; font-weight: 800; margin: 4px 0 10px; line-height: 1.45; color: var(--kg-ink); }
  .gk-unlock { margin: 0 0 14px; padding: 8px 12px; border-radius: 18px; background: linear-gradient(180deg, #fff6c8, #ffe58a); font-weight: 900; font-size: 18px;
    color: #8a5a00; animation: gkPulse 1.2s ease-in-out infinite; display: flex; align-items: center; justify-content: center; gap: 8px; }
  .gk-unlock svg { width: 40px; height: 40px; }
  #gk-fx { position: fixed; inset: 0; pointer-events: none; z-index: 9650; }
  .gk-float { position: fixed; z-index: 9660; pointer-events: none; font-weight: 900; font-size: 30px; color: #fff; white-space: nowrap;
    -webkit-text-stroke: 5px var(--c, #e8648d); paint-order: stroke fill; transform: translate(-50%, -50%); animation: gkFloat 1s ease-out forwards; }
  @keyframes gkFloat { 0% { transform: translate(-50%, -20%) scale(.4); opacity: 0; } 20% { transform: translate(-50%, -60%) scale(1.25); opacity: 1; }
    35% { transform: translate(-50%, -70%) scale(1); } 100% { transform: translate(-50%, -190%) scale(1); opacity: 0; } }
  .gk-callout { position: fixed; left: 50%; top: 38%; z-index: 9660; pointer-events: none; font-size: clamp(40px, 12vw, 72px); font-weight: 900; color: #fff6a8;
    -webkit-text-stroke: 8px var(--c, #e8648d); paint-order: stroke fill; text-shadow: 0 6px 0 var(--c, #e8648d), 0 12px 20px rgba(0,0,0,.25); white-space: nowrap;
    animation: gkCall 1.3s cubic-bezier(.2,1.6,.4,1) forwards; }
  @keyframes gkCall { 0% { transform: translate(-50%, -50%) scale(0) rotate(-12deg); } 25% { transform: translate(-50%, -50%) scale(1.15) rotate(3deg); }
    40% { transform: translate(-50%, -50%) scale(1) rotate(0); opacity: 1; } 80% { opacity: 1; } 100% { transform: translate(-50%, -80%) scale(1.05); opacity: 0; } }
  .gk-shake { animation: gkShake .4s ease; }
  @keyframes gkShake { 0%,100% { translate: 0 0; } 15% { translate: -9px 4px; } 30% { translate: 8px -5px; } 45% { translate: -6px 3px; } 60% { translate: 5px -2px; } 80% { translate: -2px 1px; } }
  .gk-rart { width: 120px; height: 120px; margin: 0 auto 6px; display: grid; place-items: center; }
  .gk-rart > img, .gk-rart > svg { max-width: 100%; max-height: 100%; }
  .gk-head { position: relative; display: flex; flex-direction: column; align-items: center; gap: 8px; }
  @media (max-height: 560px) {
    .gk-head { flex-direction: row; gap: 14px; }
    .gk-rart { width: 74px; height: 74px; }
    .gk-panel { padding: 40px 16px 14px; }
    .gk-bigstars svg { width: 50px; height: 50px; } .gk-bigstars svg:nth-child(2) { width: 62px; height: 62px; }
    .gk-ribbon { font-size: 24px; padding: 8px 10px 10px; top: -24px; }
    .gk-msg { font-size: 16px; margin: 2px 0 6px; }
    .gk-unlock { margin-bottom: 8px; padding: 4px 10px; }
    .gk-title2 { font-size: 28px; }
    .gk-total { font-size: 18px; } .gk-total svg { width: 26px; height: 26px; }
    .gk-grid { display: flex; overflow-x: auto; overflow-y: hidden; max-height: none; width: 100%; touch-action: pan-x; flex: none; padding: 6px 10px 10px; }
    .gk-grid .gk-card { flex: 0 0 108px; min-height: 0; }
    .gk-grid .gk-card .pic { height: 54px; aspect-ratio: auto; }
    .gk-lv > .gk-row:last-child { position: absolute; left: 14px; bottom: 12px; }
 .gk-art { width: min(40vw, 38vh, 260px); } .gk-screen { gap: 8px; padding-top: 60px; } .gk-logo { font-size: clamp(30px, 8vh, 56px); } }
  `;
  const st = document.createElement('style'); st.textContent = css; document.head.appendChild(st);

  // ---------- 圖示（自己畫的 SVG） ----------
  GK.starSVG = (on = true, id = '') => {
    const g = 'gks' + (on ? 'a' : 'b') + Math.random().toString(36).slice(2, 7);
    return `<svg viewBox="0 0 100 100" ${id}><defs><linearGradient id="${g}" x1="0" y1="0" x2="0" y2="1">${on
      ? '<stop offset="0" stop-color="#fff59a"/><stop offset=".55" stop-color="#ffd23f"/><stop offset="1" stop-color="#f7a21b"/>'
      : '<stop offset="0" stop-color="#eee6ee"/><stop offset="1" stop-color="#cfc3d3"/>'}</linearGradient></defs>
      <path d="M50 6 L62 36 L94 38 L69 58 L78 90 L50 72 L22 90 L31 58 L6 38 L38 36 Z" fill="url(#${g})" stroke="${on ? '#d9800f' : '#b3a5b8'}" stroke-width="6" stroke-linejoin="round"/>
      <path d="M50 18 L57 38 L40 40 Z" fill="#fff" opacity="${on ? .7 : .4}"/>${on ? '<circle cx="40" cy="56" r="4" fill="#7a3d00"/><circle cx="60" cy="56" r="4" fill="#7a3d00"/><path d="M44 65 Q50 70 56 65" stroke="#7a3d00" stroke-width="3" fill="none" stroke-linecap="round"/>' : ''}</svg>`;
  };
  GK.lockSVG = () => `<svg viewBox="0 0 60 60"><path d="M18 28 V20 a12 12 0 0 1 24 0 V28" stroke="#8a7a96" stroke-width="7" fill="none"/>
    <rect x="10" y="26" width="40" height="30" rx="8" fill="#ffd23f" stroke="#c7860f" stroke-width="4"/><circle cx="30" cy="39" r="5" fill="#8a5a00"/><rect x="28" y="40" width="4" height="9" rx="2" fill="#8a5a00"/>
    <rect x="15" y="30" width="10" height="5" rx="2.5" fill="#fff" opacity=".6"/></svg>`;
  GK.heartSVG = (on = true) => `<svg viewBox="0 0 60 56"><path d="M30 52 C8 38 2 26 6 16 C10 6 24 4 30 14 C36 4 50 6 54 16 C58 26 52 38 30 52Z" fill="${on ? '#ff5c7f' : '#e5d9e2'}" stroke="${on ? '#c42d55' : '#c4b6c0'}" stroke-width="4" stroke-linejoin="round"/>
    <ellipse cx="18" cy="18" rx="6" ry="4" fill="#fff" opacity=".7" transform="rotate(-30 18 18)"/></svg>`;
  GK.icons = {
    play: '<svg viewBox="0 0 40 40"><path d="M12 7 L33 20 L12 33 Z" fill="#fff" stroke="rgba(0,0,0,.15)" stroke-width="2" stroke-linejoin="round"/></svg>',
    replay: '<svg viewBox="0 0 40 40"><path d="M30 14 A12 12 0 1 0 32 24" stroke="#fff" stroke-width="6" fill="none" stroke-linecap="round"/><path d="M24 6 L34 14 L22 18 Z" fill="#fff"/></svg>',

  // ---------- 存檔 ----------
  GK.save = {

  // ---------- 畫面 ----------
  let curScreen = null;
  GK.closeScreen = () => { if (curScreen) { const s = curScreen; curScreen = null; s.classList.add('out'); setTimeout(() => s.remove(), 280); } };
  function screen(bg, theme) {

  }
  function btn(b) {

  /** 關卡選擇 opts: {title, bg, theme, count, game, labels[], pics[] (html), need[i] (需要的星星), onPick(i), onBack, extra} */

    if (o.onReplay) row.appendChild(btn({ text: '', icon: 'replay', cls: 'orange small', onClick: o.onReplay }));

  // ---------- 粒子特效 ----------
  let fx = null, fctx = null, parts = [], running = false;
  function ensureFx() {
    if (fx) return;

  function starPath(c, r) { c.beginPath(); for (let i = 0; i < 10; i++) { const rr = i % 2 ? r * .45 : r, a = i / 10 * Math.PI * 2 - Math.PI / 2; c.lineTo(Math.cos(a) * rr, Math.sin(a) * rr); } c.closePath(); }

      parts.push({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - (type === 'dust' ? 20 : 120), g: type === 'bubble' ? -60 : type === 'dust' ? 40 : 600,
        r: (o.size || 1) * (type === 'confetti' ? KG.rand(4, 8) : type === 'dust' ? KG.rand(6, 14) : KG.rand(6, 13)), rot: Math.random() * 6, vr: KG.rand(-8, 8),
        life: 0, max: KG.rand(.6, 1.1) * (o.life || 1), type, c: type === 'dust' ? (o.colors ? KG.pick(o.colors) : 'rgba(255,255,255,.9)') : KG.pick(cols) });
    }
    if (!running) { running = true; last = performance.now(); requestAnimationFrame(tick); }
  };
  let last = 0;
  function tick(now) {
    const dt = Math.min(.05, (now - last) / 1000); last = now;
    fctx.clearRect(0, 0, innerWidth, innerHeight);
    parts = parts.filter(p => (p.life += dt) < p.max);
    for (const p of parts) {
      p.vy += p.g * dt; p.vx *= (1 - 1.5 * dt); p.x += p.vx * dt; p.y += p.vy * dt; p.rot += p.vr * dt;
      const k = 1 - p.life / p.max;
      fctx.save(); fctx.translate(p.x, p.y); fctx.rotate(p.rot); fctx.globalAlpha = Math.min(1, k * 2);
      const s = p.type === 'dust' ? (1 + p.life * 2) : (0.4 + 0.6 * Math.min(1, p.life * 6));
      fctx.scale(s, s);
      fctx.fillStyle = p.c;
      if (p.type === 'star' || p.type === 'spark') { starPath(fctx, p.r); fctx.fill(); fctx.strokeStyle = 'rgba(255,255,255,.8)'; fctx.lineWidth = 2; fctx.stroke(); }
      else if (p.type === 'heart') { heartPath(fctx, p.r); fctx.fill(); }
      else if (p.type === 'confetti') { fctx.fillRect(-p.r, -p.r * .5, p.r * 2, p.r); }
      else if (p.type === 'bubble') { fctx.beginPath(); fctx.arc(0, 0, p.r, 0, 7); fctx.strokeStyle = 'rgba(255,255,255,.9)'; fctx.lineWidth = 2; fctx.stroke(); }
      else { fctx.beginPath(); fctx.arc(0, 0, p.r, 0, 7); fctx.fill(); }
      fctx.restore();
    }
    if (parts.length) requestAnimationFrame(tick); else { running = false; fctx.clearRect(0, 0, innerWidth, innerHeight); }
  }
  /** 飄字 +10 */
  GK.float = (x, y, text, color) => {
    const e = document.createElement('div'); e.className = 'gk-float'; e.textContent = text;

  };
  /** 大字稱讚 */
  GK.callout = (text, color) => {
    document.querySelectorAll('.gk-callout').forEach(e => e.remove());
    const e = document.createElement('div'); e.className = 'gk-callout'; e.textContent = text;
    if (color) e.style.setProperty('--c', color);
    document.body.appendChild(e); setTimeout(() => e.remove(), 1300);
  };
  GK.praise = () => KG.pick(['好棒！', '太厲害了！', '完美！', '好聰明！', '讚喔！']);
  GK.shake = (el) => { el = el || document.body; el.classList.remove('gk-shake'); void el.offsetWidth; el.classList.add('gk-shake'); };

  // ---------- 背景音樂 ----------
  // song: { bpm, mel: [midi|0, beats, ...], bass: [midi|0, beats, ...], wave, vol }
  const mtof = m => 440 * Math.pow(2, (m - 69) / 12);
  GK.music = (function () {
    let song = null, timer = null, tracks = [], unlocked = false;
    // 瀏覽器要求使用者先互動才能出聲
    const unlock = () => { unlocked = true; };
    addEventListener('pointerdown', unlock, { once: true, capture: true });
    addEventListener('keydown', unlock, { once: true, capture: true });
    function sched() {
      if (!song) return;
      const now = performance.now() / 1000;
      if (!unlocked || document.hidden || KG.isMuted()) { tracks.forEach(tr => { tr.next = Math.max(tr.next, now); }); return; }
      const beat = 60 / song.bpm;
      tracks.forEach(tr => {
        while (tr.next < now + 0.35) {
          const m = tr.notes[tr.i], b = tr.notes[tr.i + 1];
          const d = Math.max(0, tr.next - now);
          if (m) KG.note(mtof(m), b * beat * tr.len, tr.wave, tr.vol, d);
          tr.next += b * beat;
          tr.i = (tr.i + 2) % tr.notes.length;

      });
    }

      play(s) {
        if (song === s && timer) return;

        const now = performance.now() / 1000 + 0.05;
        tracks = [{ notes: s.mel, wave: s.wave || 'triangle', vol: s.vol || 0.07, len: 0.85, i: 0, next: now }];
        if (s.bass) tracks.push({ notes: s.bass, wave: 'sine', vol: (s.vol || 0.07) * 1.3, len: 0.9, i: 0, next: now });
        timer = setInterval(sched, 90); sched();
      },
      stop() { clearInterval(timer); timer = null; song = null; },
    };
  })();
  // 預設的開心旋律（C 大調）
  GK.songs = {
    happy: { bpm: 112, mel: [72, 1, 76, 1, 79, 1, 76, 1, 77, 1, 81, 1, 79, 2, 76, 1, 79, 1, 84, 1, 79, 1, 77, 1, 74, 1, 72, 2],
      bass: [48, 2, 55, 2, 53, 2, 55, 2, 48, 2, 55, 2, 50, 2, 48, 2] },
    calm: { bpm: 92, mel: [76, 1, 79, 1, 81, 2, 79, 1, 76, 1, 74, 2, 72, 1, 74, 1, 76, 1, 79, 1, 76, 4],
      bass: [48, 4, 45, 4, 41, 4, 43, 4] },
    space: { bpm: 128, wave: 'square', vol: 0.04, mel: [72, .5, 0, .5, 79, .5, 76, .5, 84, 1, 79, 1, 74, .5, 0, .5, 77, .5, 74, .5, 81, 1, 77, 1],
      bass: [36, 1, 48, 1, 36, 1, 48, 1, 38, 1, 50, 1, 38, 1, 50, 1] },
  };
  return GK;
})();

  // ---------- 繪圖小工具 ----------

  function rad(c, x, y, r, stops) { const g = c.createRadialGradient(x - r * .3, y - r * .35, r * .1, x, y, r); stops.forEach((s, i) => g.addColorStop(i / (stops.length - 1), s)); return g; }

  // 可愛臉：眼睛、腮紅、微笑

      <path d="M0 800 Q250 700 500 790 Q750 700 1000 780 L1000 1000 L0 1000Z" fill="#b8ecb0"/><path d="M0 880 Q500 800 1000 880 L1000 1000 L0 1000Z" fill="#8fdc8a"/>
      ${piece(60, 420, 1, '#ffb3cc', 1)}${piece(860, 300, .8, '#ffe58a', 3)}${piece(820, 640, 1.1, '#a8ecff', 5)}${piece(110, 700, .7, '#c9b6ff', 2)}${piece(480, 40, .6, '#b5ea8f', 4)}
      <rect width="1000" height="1000" fill="url(#bvg)"/>`;
  }
  $('bg').innerHTML = bgSVG();

  // ---------- 遊戲狀態 ----------
  let level = 0, N = 3, pic = 0, showNum = true, frame = KG.store.get(GAME + ':frame', 0);
  let grid = [], tiles = [], blank = 0, steps = 10;
  let moves = 0, time = 0, timing = false, solved = false, solveT = 0, playing = false, peek = 0;
  let parts = [], glows = [];
  let W = 0, H = 0, dpr = 1, bx = 0, by = 0, bs = 0, gap = 0;
  let winTimer = null, rafId = 0;
  if (!(FRAMES[frame] && GK.save.total(GAME) >= FRAMES[frame].need)) frame = 0;

  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 3);
    W = stage.clientWidth; H = stage.clientHeight;
    cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
    bs = Math.max(120, Math.min(W, H, 640) - 34);
    bx = (W - bs) / 2; by = (H - bs) / 2;
    gap = Math.max(4, bs * 0.012);
  }
  function drawThumb() {
    tctx.clearRect(0, 0, 128, 128);
    tctx.save(); rr(tctx, 0, 0, 128, 128, 18); tctx.clip(); tctx.drawImage(sources[pic], 0, 0, 128, 128); tctx.restore();
  }
  const par = () => [Math.ceil(steps * 1.6), Math.ceil(steps * 3.2)];
  function updatePar() {
    const [a, b] = par(), n = moves <= a ? 3 : moves <= b ? 2 : 1;
    [...$('par').children].forEach((s, i) => s.classList.toggle('off', i >= n));
  }

  function startLevel(i) {
    level = i; const L = LEVELS[i];
    N = L.n; pic = L.pic; steps = L.steps;
    GK.closeScreen();
    $('hud').hidden = false; $('wrap').hidden = false;
    $('lv').textContent = i + 1;
    $('par').innerHTML = [0, 1, 2].map(() => GK.starSVG(true)).join('');
    resize(); newGame();
    playing = true;
    GK.music.play(GK.songs.calm);
    mascot('happy', i === 0 ? '點方塊滑過去！' : '加油！', 1600);
  }

  function newGame() {
    clearTimeout(winTimer);
    const total = N * N;
    grid = []; tiles = [];
    for (let i = 0; i < total; i++) { grid.push(i); tiles.push({ x: i % N, y: Math.floor(i / N), tx: i % N, ty: Math.floor(i / N), home: true }); }
    blank = total - 1;
    // 用合法步數洗牌：一定解得開
    let bpos = total - 1, prev = -1;
    for (let s = 0; s < steps; s++) {
      const opts = neighbors(bpos).filter(p => p !== prev);
      const p = KG.pick(opts);
      grid[bpos] = grid[p]; grid[p] = blank; prev = bpos; bpos = p;
    }
    if (isSolved()) return newGame();
    grid.forEach((t, p) => { const tl = tiles[t]; tl.tx = p % N; tl.ty = Math.floor(p / N); tl.x = tl.tx; tl.y = tl.ty; tl.home = p === t; tl.pop = 0; });
    moves = 0; time = 0; timing = false; solved = false; solveT = 0; parts = []; glows = []; peek = 0;
    movesEl.textContent = '0'; timeEl.textContent = '0:00';
    updatePar(); drawThumb();
    // 開場：方塊從上面掉下來
    tiles.forEach((tl, t) => { tl.drop = 0.25 + (tl.tx + tl.ty) * 0.05; tl.y0 = tl.ty - N - 1; });
  }

  function neighbors(p) {
    const x = p % N, y = Math.floor(p / N), r = [];
    if (x > 0) r.push(p - 1); if (x < N - 1) r.push(p + 1);
    if (y > 0) r.push(p - N); if (y < N - 1) r.push(p + N);
    return r;
  }
  const blankPos = () => grid.indexOf(blank);
  const isSolved = () => grid.every((t, i) => t === i);

  // 把 pos 的方塊（同一行或列可一次推多塊）滑向空格
  function slideFrom(pos) {
    if (solved || !playing) return false;
    const b = blankPos();
    const bxp = b % N, byp = Math.floor(b / N), x = pos % N, y = Math.floor(pos / N);
    if (pos === b || (x !== bxp && y !== byp)) { KG.sound('tick'); nudge(pos); return false; }
    const step = x === bxp ? (y > byp ? N : -N) : (x > bxp ? 1 : -1);
    let cur = b;
    while (cur !== pos) { const nx = cur + step; grid[cur] = grid[nx]; grid[nx] = blank; cur = nx; moves++; }
    let newHome = 0;
    grid.forEach((t, p) => {
      const tl = tiles[t];
      tl.tx = p % N; tl.ty = Math.floor(p / N);
      if (t === blank) { tl.x = tl.tx; tl.y = tl.ty; return; }
      const h = p === t;
      if (h && !tl.home) { newHome++; glows.push({ t, life: 0.7 }); }
      tl.home = h;
    });
    movesEl.textContent = moves; updatePar();
    timing = true;
    KG.note(440 + Math.random() * 60, 0.06, 'triangle', 0.16); KG.note(330, 0.05, 'sine', 0.12, 0.04);
    if (newHome) {
      setTimeout(() => {
        KG.note(1046, .1, 'triangle', .16); KG.note(1318, .14, 'triangle', .14, .06);
        glows.forEach(g => { const c = cellCenter(tiles[g.t].tx, tiles[g.t].ty); GK.burst(c.x, c.y, { type: 'spark', count: 6, speed: .5, size: .7, colors: ['#fff6a8', '#fff'] }); });
      }, 120);
      if (Math.random() < .35) mascot('happy', KG.pick(['對了！', '好棒！', '讚喔！']));
    }
    if (isSolved()) win();
    return true;
  }
  function nudge(pos) { const tl = tiles[grid[pos]]; if (tl) tl.pop = 0.25; }
  function slideDir(dx, dy) {
    const b = blankPos(), x = b % N - dx, y = Math.floor(b / N) - dy;
    if (x < 0 || y < 0 || x >= N || y >= N) { KG.sound('tick'); return; }
    slideFrom(y * N + x);
  }
  function cellCenter(x, y) {
    const r = cv.getBoundingClientRect(), cell = bs / N;
    return { x: r.left + bx + (x + .5) * cell, y: r.top + by + (y + .5) * cell };
  }

  function win() {
    solved = true; timing = false;
    KG.sound('sparkle');
    const r = cv.getBoundingClientRect();
    setTimeout(() => { GK.callout('完成！', '#e8648d'); GK.burst(r.left + bx + bs / 2, r.top + by + bs / 2, { type: 'star', count: 30 }); KG.sound('win'); }, 500);
    mascot('cheer', '拼好了！');
    const [a, b] = par();
    const stars = moves <= a ? 3 : moves <= b ? 2 : 1;
    const before = GK.save.total(GAME);
    GK.save.setStars(GAME, level, stars);
    const after = GK.save.total(GAME);
    const nf = FRAMES.find(f => f.need > before && f.need <= after);
    winTimer = setTimeout(() => {
      playing = false;
      GK.music.stop();
      KG.say('完成了！好棒！');
      const pc = document.createElement('canvas'); pc.width = pc.height = 240;
      const px = pc.getContext('2d'); rr(px, 0, 0, 240, 240, 26); px.clip(); px.drawImage(sources[pic], 0, 0, 240, 240);
      GK.reward({
        stars, theme: { dark: '#c2406e', mid: '#ff6f9e', light: '#ffb3cc' },
        art: `<img src="${pc.toDataURL()}" style="width:120px;height:120px;border-radius:20px;border:4px solid #fff;box-shadow:0 6px 12px rgba(0,0,0,.2)" alt="">`,
        message: `用了 ${moves} 步、${fmt(time)}`,
        unlock: nf ? { art: `<div style="width:40px;height:40px;border-radius:10px;border:3px solid #fff;background:${nf.css}"></div>`, text: '新的拼圖框：' + nf.name + '！' } : null,
        onMenu: showLevels, onReplay: () => startLevel(level),
        onNext: level < LEVELS.length - 1 ? () => startLevel(level + 1) : null,
      });
    }, 2300);
  }
  const fmt = t => Math.floor(t / 60) + ':' + String(Math.floor(t % 60)).padStart(2, '0');

  // ---------- 輸入 ----------
  let down = null;
  cv.addEventListener('pointerdown', e => {
    e.preventDefault();
    try { cv.setPointerCapture(e.pointerId); } catch (er) { /* 忽略 */ }
    const r = cv.getBoundingClientRect();
    down = { x: e.clientX - r.left, y: e.clientY - r.top, id: e.pointerId };
  });
  cv.addEventListener('pointerup', e => {
    if (!down || down.id !== e.pointerId) return;
    const r = cv.getBoundingClientRect();
    const dx = e.clientX - r.left - down.x, dy = e.clientY - r.top - down.y;
    if (Math.hypot(dx, dy) > 28) {
      if (Math.abs(dx) > Math.abs(dy)) slideDir(Math.sign(dx), 0); else slideDir(0, Math.sign(dy));
    } else {
      const cx = Math.floor((down.x - bx) / (bs / N)), cy = Math.floor((down.y - by) / (bs / N));
      if (cx >= 0 && cy >= 0 && cx < N && cy < N) slideFrom(cy * N + cx);
    }
    down = null;
  });
  cv.addEventListener('pointercancel', () => { down = null; });
  window.addEventListener('keydown', e => {
    const k = { ArrowLeft: [-1, 0], ArrowRight: [1, 0], ArrowUp: [0, -1], ArrowDown: [0, 1] }[e.key];
    if (k && playing && !document.querySelector('.gk-screen')) { e.preventDefault(); slideDir(k[0], k[1]); }
  });
  $('bHint').addEventListener('click', () => { if (!playing || solved) return; KG.sound('whoosh'); peek = 1.6; mascot('happy', '偷看一下！', 1200); });
  $('bNum').addEventListener('click', () => { KG.sound('click'); showNum = !showNum; $('bNum').classList.toggle('off', !showNum); });
  $('bShuffle').addEventListener('click', () => { if (solved) return; KG.sound('whoosh'); newGame(); mascot('happy', '重新來！'); });
  $('bMenu').addEventListener('click', () => { KG.sound('click'); showLevels(); });

  // ---------- 繪製 ----------
  function drawFrame() {
    const F = FRAMES[frame];
    ctx.save();
    ctx.shadowColor = 'rgba(60,40,80,.35)'; ctx.shadowBlur = 26; ctx.shadowOffsetY = 12;
    rr(ctx, bx - 14, by - 14, bs + 28, bs + 28, 28);
    ctx.fillStyle = lin(ctx, bx, by, bx + bs, by + bs, [F.a, F.b]); ctx.fill();
    ctx.restore();
    ctx.save(); rr(ctx, bx - 14, by - 14, bs + 28, bs + 28, 28); ctx.clip();
    if (F.candy) { ctx.fillStyle = 'rgba(255,111,158,.75)'; for (let k = -bs; k < bs * 2; k += 26) { ctx.beginPath(); ctx.moveTo(bx + k, by - 20); ctx.lineTo(bx + k + 12, by - 20); ctx.lineTo(bx + k + 12 - bs - 40, by + bs + 20); ctx.lineTo(bx + k - bs - 40, by + bs + 20); ctx.fill(); } }
    if (F.grain) { ctx.strokeStyle = 'rgba(90,50,20,.15)'; ctx.lineWidth = 2; for (let k = 0; k < 14; k++) { ctx.beginPath(); ctx.moveTo(bx - 14, by + k * bs / 13); ctx.bezierCurveTo(bx + bs * .3, by + k * bs / 13 + 8, bx + bs * .6, by + k * bs / 13 - 8, bx + bs + 14, by + k * bs / 13); ctx.stroke(); } }
    if (F.stars) for (let k = 0; k < 30; k++) star5(ctx, bx - 10 + (k * 97) % (bs + 20), by - 10 + (k * 61) % (bs + 20), 2 + k % 3, 'rgba(255,255,255,.8)');
    // 上緣高光
    ctx.fillStyle = 'rgba(255,255,255,.35)'; rr(ctx, bx - 6, by - 11, bs + 12, 8, 4); ctx.fill();
    ctx.restore();
    rr(ctx, bx - 3, by - 3, bs + 6, bs + 6, 18); ctx.fillStyle = F.in; ctx.fill();
  }

  function draw(dt, now) {
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, W, H);
    if (!playing && !solved) return;
    const src = sources[pic], sc = IMG / N, cell = bs / N;
    drawFrame();
    ctx.save(); rr(ctx, bx, by, bs, bs, 16); ctx.clip(); ctx.globalAlpha = 0.2; ctx.drawImage(src, bx, by, bs, bs); ctx.restore();

    if (solved) solveT = Math.min(1, solveT + dt * 1.6);
    const g = gap * (1 - solveT), rad = Math.max(4, cell * 0.12) * (1 - solveT * 0.6), k = Math.min(1, dt * 16);
    for (let t = 0; t < tiles.length; t++) {
      const tl = tiles[t];
      tl.x += (tl.tx - tl.x) * k; tl.y += (tl.ty - tl.y) * k;
      if (Math.abs(tl.tx - tl.x) < .002) tl.x = tl.tx; if (Math.abs(tl.ty - tl.y) < .002) tl.y = tl.ty;
      if (t === blank && !solved) continue;
      let yy = tl.y, sq = 1;
      if (tl.drop > 0) {   // 開場掉落（easeOutBack）
        tl.drop -= dt; const p = GK.clamp(1 - tl.drop / 0.45, 0, 1);
        yy = GK.lerp(tl.y0, tl.ty, GK.ease.outBack(p));
        if (p <= 0) continue;
      }
      if (tl.pop > 0) { tl.pop -= dt; sq = 1 + Math.sin(tl.pop / .25 * Math.PI) * 0.06; }
      const moving = Math.abs(tl.tx - tl.x) + Math.abs(tl.ty - tl.y);
      const s = (cell - g) * sq * (1 + Math.min(moving, .5) * 0.08), x = bx + tl.x * cell + (cell - s) / 2, y = by + yy * cell + (cell - s) / 2;
      ctx.save();
      if (t === blank) ctx.globalAlpha = solveT;
      ctx.shadowColor = 'rgba(80,30,60,.35)'; ctx.shadowBlur = (6 + moving * 14) * (1 - solveT); ctx.shadowOffsetY = (3 + moving * 6) * (1 - solveT);
      rr(ctx, x, y, s, s, rad); ctx.fillStyle = '#fff'; ctx.fill();
      ctx.shadowColor = 'transparent'; ctx.clip();
      ctx.drawImage(src, (t % N) * sc, Math.floor(t / N) * sc, sc, sc, x, y, s, s);
      ctx.globalAlpha *= (1 - solveT);
      ctx.fillStyle = lin(ctx, x, y, x, y + s, ['rgba(255,255,255,.3)', 'rgba(255,255,255,0)', 'rgba(0,0,0,.1)']); ctx.fillRect(x, y, s, s);
      ctx.restore();
      if (solveT < 1) {
        ctx.save(); ctx.globalAlpha = 1 - solveT;
        rr(ctx, x + 1.5, y + 1.5, s - 3, s - 3, rad);
        ctx.strokeStyle = tl.home && !solved ? 'rgba(255,240,140,.95)' : 'rgba(255,255,255,.8)'; ctx.lineWidth = tl.home ? 4 : 3; ctx.stroke();
        if (showNum && t !== blank) {
          const r = Math.max(11, cell * 0.12);
          circ(ctx, x + r + 5, y + r + 5, r, tl.home ? '#ffd23f' : 'rgba(255,255,255,.92)');
          ctx.fillStyle = tl.home ? '#fff' : '#e8648d'; ctx.font = `900 ${Math.round(r * 1.2)}px ${getComputedStyle(document.body).fontFamily}`;
          ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
          if (tl.home) { ctx.lineWidth = 3; ctx.strokeStyle = '#d9800f'; ctx.strokeText(String(t + 1), x + r + 5, y + r + 6); }
          ctx.fillText(String(t + 1), x + r + 5, y + r + 6);
        }
        ctx.restore();
      }
    }
    // 放對位置的閃光
    glows = glows.filter(gl => (gl.life -= dt) > 0);
    glows.forEach(gl => {
      const tl = tiles[gl.t], x = bx + tl.x * cell, y = by + tl.y * cell;
      ctx.save(); ctx.globalAlpha = gl.life / .7 * .6; rr(ctx, x + g / 2, y + g / 2, cell - g, cell - g, rad); ctx.fillStyle = '#fff8c0'; ctx.fill(); ctx.restore();
    });
    // 偷看整張圖
    if (peek > 0) {
      peek -= dt;
      ctx.save(); ctx.globalAlpha = Math.min(1, peek * 3, (1.6 - peek) * 5);
      rr(ctx, bx, by, bs, bs, 16); ctx.clip(); ctx.drawImage(src, bx, by, bs, bs); ctx.restore();
    }
    // 完成時的亮光掃過
    if (solved && solveT > .3) {
      const p = (solveT - .3) / .7 * 1.6 - .3;
      ctx.save(); rr(ctx, bx, by, bs, bs, 16); ctx.clip();
      const gx = bx + p * bs * 1.6 - bs * .3;
      const gr = ctx.createLinearGradient(gx - 80, by, gx + 80, by + 160);
      gr.addColorStop(0, 'rgba(255,255,255,0)'); gr.addColorStop(.5, 'rgba(255,255,255,.55)'); gr.addColorStop(1, 'rgba(255,255,255,0)');
      ctx.fillStyle = gr; ctx.fillRect(bx, by, bs, bs); ctx.restore();
    }
  }

  let last = performance.now(), acc = 0;
  function loop(now) {
    const dt = Math.min(0.05, (now - last) / 1000); last = now;
    if (timing) { time += dt; acc += dt; if (acc > 0.25) { acc = 0; timeEl.textContent = fmt(time); } }
    draw(dt, now);
    rafId = requestAnimationFrame(loop);
  }

  // ---------- 畫面 ----------
  const BG = 'radial-gradient(circle at 50% 35%, #fff0f7 0%, #ffc7de 45%, #b9a6ff 100%)';
  const THEME = { dark: '#c2406e', mid: '#ff6f9e', light: '#ffb3cc' };
  function hideGame() { playing = false; timing = false; clearTimeout(winTimer); $('hud').hidden = true; $('wrap').hidden = true; }

  function titleArt() {
    // 用 SVG 拼出一張小拼圖，有一塊在滑動
    const c = document.createElement('canvas'); c.width = c.height = 300;
    const x = c.getContext('2d'); x.drawImage(sources[0], 0, 0, 300, 300);
    const url = c.toDataURL();
    let tiles = '';
    for (let i = 0; i < 8; i++) {
      const tx = i % 3, ty = Math.floor(i / 3);
      const anim = i === 5 ? 'style="animation: tslide 2.4s ease-in-out infinite"' : i === 7 ? 'style="animation: tslide2 2.4s ease-in-out infinite"' : '';
      tiles += `<g ${anim}><svg x="${10 + tx * 100}" y="${10 + ty * 100}" width="92" height="92" viewBox="${tx * 100} ${ty * 100} 100 100"><image href="${url}" width="300" height="300"/></svg>
        <rect x="${10 + tx * 100}" y="${10 + ty * 100}" width="92" height="92" rx="14" fill="none" stroke="#fff" stroke-width="5"/></g>`;
    }
    return `<svg viewBox="-20 -20 350 380"><style>@keyframes tslide{0%,30%{transform:translateY(0)}45%,80%{transform:translateY(100px)}95%,100%{transform:translateY(0)}}@keyframes tslide2{0%,100%{transform:translateX(0)}}</style>
      <rect x="-6" y="-6" width="324" height="324" rx="30" fill="#ff8fb1" stroke="#fff" stroke-width="8"/><rect x="4" y="4" width="304" height="304" rx="20" fill="#d97fa6"/>
      ${tiles}<g transform="translate(196 210) scale(1.2)"><g style="animation: kg-bounce 1.6s ease-in-out infinite">${mascotSVG('happy').replace(/^<svg[^>]*>|<\/svg>$/g, '')}</g></g></svg>`;
  }

  function showTitle() {
    hideGame();
    GK.music.play(GK.songs.calm);
    GK.title({
      title: '滑塊拼圖', sub: '滑動方塊，把圖拼回來！', bg: BG, theme: THEME, art: titleArt(),
      buttons: [{ text: '開始', cls: 'big', icon: 'play', onClick: showLevels }],
    });
  }

  function showLevels() {
    hideGame();
    GK.music.play(GK.songs.calm);
    const pics = LEVELS.map(L => {
      const c = document.createElement('canvas'); c.width = 160; c.height = 128;
      const x = c.getContext('2d'); x.drawImage(sources[L.pic], 0, 64, 512 * 2, 410 * 2, 0, 0, 160, 128);
      x.strokeStyle = 'rgba(255,255,255,.9)'; x.lineWidth = 3;
      for (let k = 1; k < L.n; k++) { x.beginPath(); x.moveTo(k * 160 / L.n, 0); x.lineTo(k * 160 / L.n, 128); x.moveTo(0, k * 128 / L.n); x.lineTo(160, k * 128 / L.n); x.stroke(); }
      return `<img src="${c.toDataURL()}" alt="" style="object-fit:cover">`;
    });
    const el = GK.levels({
      title: '選一張圖', game: GAME, count: LEVELS.length, bg: BG, theme: THEME,
      labels: LEVELS.map(L => PICS[L.pic].name + ' ' + L.n + '×' + L.n), pics,
      onPick: i => startLevel(i), onBack: showTitle,
    });
    const total = GK.save.total(GAME);
    const row = document.createElement('div'); row.className = 'frames';
    row.innerHTML = '<b>拼圖框</b>';
    FRAMES.forEach((f, i) => {
      const locked = total < f.need;
      const b = document.createElement('button');
      b.className = 'fr' + (i === frame ? ' on' : '');
      b.style.background = f.css; b.setAttribute('aria-label', f.name);
      if (locked) b.innerHTML = `<div class="lk">${GK.lockSVG()}</div><div class="need">★${f.need}</div>`;
      b.addEventListener('click', () => {
        if (locked) { KG.sound('wrong'); KG.toast('要 ' + f.need + ' 顆星星才能解鎖'); return; }
        frame = i; KG.store.set(GAME + ':frame', i); KG.sound('pop');
        row.querySelectorAll('.fr').forEach((s, k) => s.classList.toggle('on', k === i));
        const r = b.getBoundingClientRect(); GK.burst(r.left + r.width / 2, r.top + r.height / 2, { type: 'star', count: 10 });
      });
      row.appendChild(b);
    });
    el.insertBefore(row, el.querySelector('.gk-row'));
  }

  document.addEventListener('touchmove', e => { if (!e.target.closest('.gk-grid')) e.preventDefault(); }, { passive: false });
  window.addEventListener('resize', resize);
  mascot('idle');
  resize();
  rafId = requestAnimationFrame(loop);
  showTitle();
})();
</script>
</body>
</html>
