<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>小鳥飛飛</title>
<link rel="stylesheet" href="../../assets/common.css">
<style>
  html, body { height: 100%; overflow: hidden; background: #bfe8ff; }
  #game {
    position: fixed; inset: 0; display: block;
    width: 100vw; height: 100vh; height: 100dvh;
    touch-action: none; cursor: pointer;
  }
</style>
</head>
<body>
<canvas id="game" aria-label="小鳥飛飛遊戲畫面"></canvas>
<div class="kg-hud">
  <div class="kg-pill" id="hudPipes">🌳 0</div>
  <div class="kg-pill" id="hudStars">⭐ 0</div>
</div>
<script src="../../assets/common.js"></script>
<script>
'use strict';

/* ========== 畫布與尺寸 ========== */
const cv = document.getElementById('game');
const ctx = cv.getContext('2d');
const FONT = '"PingFang TC","Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif';
let W = 0, H = 0, dpr = 1, S = 1, LW = 400, LH = 600;
const GROUND = 84;           // 地面高度（邏輯單位）
const PW = 74;               // 水管寬度
const CAP_H = 28;

function resize() {
  dpr = Math.min(window.devicePixelRatio || 1, 3);
  W = cv.clientWidth; H = cv.clientHeight;
  cv.width = Math.round(W * dpr);
  cv.height = Math.round(H * dpr);
  S = Math.min(H / 600, W / 400);   // 邏輯座標縮放：高度至少 600、寬度至少 400
  LW = W / S; LH = H / S;
  bird.x = Math.max(90, Math.min(LW * 0.28, 300));
}
window.addEventListener('resize', resize);

/* ========== 遊戲狀態 ========== */
const bird = { x: 100, y: 300, vy: 0, rot: 0, wing: 0, flapBoost: 0, blink: 0, blinkT: 2 };
let state = 'intro';         // intro / ready / play / dying / over
let pipes = [], stars = [], parts = [], clouds = [];
let worldX = 0, speed = 110, gap = 205, passed = 0, starCount = 0, dyingT = 0, time = 0;
let lastGapY = 300;

const hudPipes = document.getElementById('hudPipes');
const hudStars = document.getElementById('hudStars');

function initClouds() {
  clouds = [];
  for (let i = 0; i < 7; i++) {
    clouds.push({ x: Math.random() * (LW + 200) - 100, y: 40 + Math.random() * 220, s: 0.6 + Math.random() * 0.8, p: 0.12 + Math.random() * 0.15 });
  }
}

function reset() {
  pipes = []; stars = []; parts = [];
  speed = 110; gap = 205; passed = 0; starCount = 0; dyingT = 0;
  bird.y = (LH - GROUND) * 0.45; bird.vy = 0; bird.rot = 0;
  lastGapY = (LH - GROUND) / 2;
  updateHud();
}

function updateHud() {
  hudPipes.textContent = '🌳 ' + passed;
  hudStars.textContent = '⭐ ' + starCount;
}

/* ========== 輸入 ========== */
function flap() {
  if (state === 'ready') { state = 'play'; spawnPipe(LW + 120); }
  if (state !== 'play') return;
  bird.vy = -330;
  bird.flapBoost = 0.25;
  KG.sound('jump');
  // 飄出小羽毛
  for (let i = 0; i < 3; i++) {
    parts.push({ t: 'feather', x: bird.x - 12, y: bird.y + 6, vx: -40 - Math.random() * 60, vy: 20 + Math.random() * 40,
      life: 0.9, max: 0.9, r: Math.random() * 6, vr: (Math.random() - 0.5) * 6 });
  }
}
cv.addEventListener('pointerdown', (e) => { e.preventDefault(); flap(); });
window.addEventListener('keydown', (e) => {
  if (e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'KeyW' || e.code === 'Enter') {
    if (document.querySelector('.kg-overlay')) return;   // 對話框開著時不處理
    e.preventDefault();
    if (!e.repeat) flap();
  }
});

/* ========== 水管與星星 ========== */
function spawnPipe(x) {
  const top = 110, bottom = LH - GROUND - 110;
  let gy = lastGapY + (Math.random() * 2 - 1) * 150;      // 變化不要太大，比較好飛
  gy = Math.max(top, Math.min(bottom, gy));
  const prev = pipes[pipes.length - 1];
  pipes.push({ x, gy, gap, passed: false, flower: Math.floor(Math.random() * 3) });
  // 兩根水管之間放一顆星星
  if (prev && Math.random() < 0.8) {
    stars.push({ x: (prev.x + x) / 2 + PW / 2, y: (prev.gy + gy) / 2, taken: false, ph: Math.random() * 6 });
  }
  lastGapY = gy;
}
const SPACING = 260;

/* ========== 碰撞 ========== */
function circleRect(cx, cy, r, rx, ry, rw, rh) {
  const nx = Math.max(rx, Math.min(cx, rx + rw));
  const ny = Math.max(ry, Math.min(cy, ry + rh));
  return (cx - nx) ** 2 + (cy - ny) ** 2 < r * r;
}
function hitPipe(p) {
  const r = 14;   // 判定比外觀小，比較寬容
  const topH = p.gy - p.gap / 2, botY = p.gy + p.gap / 2;
  return circleRect(bird.x, bird.y, r, p.x, -100, PW, topH + 100) ||
         circleRect(bird.x, bird.y, r, p.x - 6, topH - CAP_H, PW + 12, CAP_H) ||
         circleRect(bird.x, bird.y, r, p.x, botY, PW, LH) ||
         circleRect(bird.x, bird.y, r, p.x - 6, botY, PW + 12, CAP_H);
}

function crash() {
  if (state !== 'play') return;
  state = 'dying'; dyingT = 0;
  KG.sound('hit'); KG.vibrate(60);
  bird.vy = -160;
  for (let i = 0; i < 10; i++) {
    const a = Math.random() * Math.PI * 2;
    parts.push({ t: 'spark', x: bird.x, y: bird.y, vx: Math.cos(a) * 140, vy: Math.sin(a) * 140, life: 0.6, max: 0.6, c: '#fff3a0' });
  }
}

function finish() {
  state = 'over';
  const score = passed + starCount;
  const prevBest = KG.best('flappy-bird') || 0;
  const best = KG.best('flappy-bird', score);
  const st = score >= 20 ? 3 : score >= 8 ? 2 : 1;
  KG.showWin({
    icon: '🐤',
    title: score > prevBest && score > 0 ? '新紀錄！好棒！' : '飛得真好！',
    stars: st,
    message: '穿過 ' + passed + ' 棵樹、撿到 ' + starCount + ' 顆星星，分數 ' + score + '　最高 ' + best,
    onReplay: () => { reset(); state = 'ready'; }
  });
}

/* ========== 更新 ========== */
function update(dt) {
  time += dt;
  // 眨眼
  bird.blinkT -= dt;
  if (bird.blinkT <= 0) { bird.blink = 0.15; bird.blinkT = 2 + Math.random() * 3; }
  if (bird.blink > 0) bird.blink -= dt;
  bird.flapBoost = Math.max(0, bird.flapBoost - dt);
  bird.wing += dt * (bird.flapBoost > 0 ? 34 : 14);

  const moving = state === 'ready' || state === 'play' || state === 'intro';
  if (moving) worldX += speed * dt;
  clouds.forEach(c => { if (moving) c.x -= speed * c.p * dt + 6 * dt; if (c.x < -200) { c.x = LW + 100 + Math.random() * 200; c.y = 40 + Math.random() * 220; } });

  if (state === 'intro' || state === 'ready') {
    bird.y = (LH - GROUND) * 0.45 + Math.sin(time * 3) * 10;
    bird.rot = Math.sin(time * 3) * 0.08;
  } else if (state === 'play') {
    bird.vy = Math.min(bird.vy + 1050 * dt, 420);
    bird.y += bird.vy * dt;
    if (bird.y < 20) { bird.y = 20; bird.vy = Math.max(bird.vy, 0); }
    bird.rot = Math.max(-0.45, Math.min(1.1, bird.vy / 500));
    // 慢慢變快一點點
    speed = Math.min(165, 110 + passed * 2.2);
    gap = Math.max(168, 205 - passed * 1.5);

    pipes.forEach(p => {
      p.x -= speed * dt;
      if (!p.passed && p.x + PW < bird.x - 10) {
        p.passed = true; passed++;
        KG.sound('pop'); updateHud();
        parts.push({ t: 'text', x: bird.x, y: bird.y - 30, vx: 0, vy: -50, life: 0.9, max: 0.9, s: '+1', c: '#fff' });
        if (passed % 10 === 0) { KG.toast(KG.pick(['好棒！', '太厲害了！', '飛得好高！'])); KG.sound('sparkle'); }
      }
      if (hitPipe(p)) crash();
    });
    pipes = pipes.filter(p => p.x > -PW - 30);
    const last = pipes[pipes.length - 1];
    if (!last || last.x < LW - SPACING + 40) spawnPipe((last ? last.x : LW) + SPACING);

    stars.forEach(s => {
      s.x -= speed * dt;
      if (!s.taken && Math.hypot(s.x - bird.x, s.y - bird.y) < 34) {
        s.taken = true; starCount++; updateHud();
        KG.sound('coin');
        for (let i = 0; i < 12; i++) {
          const a = i / 12 * Math.PI * 2;
          parts.push({ t: 'spark', x: s.x, y: s.y, vx: Math.cos(a) * 120, vy: Math.sin(a) * 120, life: 0.7, max: 0.7, c: KG.pick(['#ffe066', '#fff', '#ffb3c8']) });
        }
        parts.push({ t: 'text', x: s.x, y: s.y - 20, vx: 0, vy: -60, life: 1, max: 1, s: '⭐+1', c: '#ffe066' });
      }
    });
    stars = stars.filter(s => s.x > -40 && !s.taken);

    if (bird.y > LH - GROUND - 16) { bird.y = LH - GROUND - 16; crash(); }
  } else if (state === 'dying') {
    dyingT += dt;
    bird.vy = Math.min(bird.vy + 1300 * dt, 600);
    bird.y += bird.vy * dt;
    bird.rot = Math.min(1.5, bird.rot + dt * 5);
    if (bird.y > LH - GROUND - 16) { bird.y = LH - GROUND - 16; bird.vy = 0; }
    if (dyingT > 1.1) finish();
  }

  parts.forEach(p => {
    p.life -= dt; p.x += p.vx * dt; p.y += p.vy * dt;
    if (p.t === 'feather') { p.vy += 60 * dt; p.r += p.vr * dt; p.vx *= 0.98; }
    if (p.t === 'spark') { p.vx *= 0.92; p.vy *= 0.92; }
  });
  parts = parts.filter(p => p.life > 0);
}

/* ========== 繪圖工具 ========== */
function rr(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}
function starPath(x, y, R, r, rot) {
  ctx.beginPath();
  for (let i = 0; i < 10; i++) {
    const a = rot + i * Math.PI / 5 - Math.PI / 2;
    const rad = i % 2 ? r : R;
    ctx.lineTo(x + Math.cos(a) * rad, y + Math.sin(a) * rad);
  }
  ctx.closePath();
}

function drawCloud(x, y, s) {
  ctx.save();
  ctx.translate(x, y); ctx.scale(s, s);
  ctx.fillStyle = 'rgba(120,170,210,0.18)';
  ctx.beginPath(); ctx.ellipse(6, 30, 70, 14, 0, 0, Math.PI * 2); ctx.fill();
  const g = ctx.createLinearGradient(0, -30, 0, 34);
  g.addColorStop(0, '#ffffff'); g.addColorStop(1, '#e3f3ff');
  ctx.fillStyle = g;
  ctx.beginPath();
  ctx.arc(-38, 12, 22, 0, Math.PI * 2);
  ctx.arc(-12, -2, 30, 0, Math.PI * 2);
  ctx.arc(22, 4, 26, 0, Math.PI * 2);
  ctx.arc(48, 16, 18, 0, Math.PI * 2);
  ctx.rect(-38, 12, 86, 22);
  ctx.fill();
  ctx.restore();
}

function hillY(x, off, base, amp, f) {
  const t = (x + off) * f;
  return base - amp * (0.55 + 0.3 * Math.sin(t) + 0.15 * Math.sin(t * 2.3 + 1.3));
}
function drawHills(off, base, amp, f, c1, c2) {
  const g = ctx.createLinearGradient(0, base - amp, 0, LH);
  g.addColorStop(0, c1); g.addColorStop(1, c2);
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.moveTo(0, LH);
  for (let x = 0; x <= LW + 10; x += 10) ctx.lineTo(x, hillY(x, off, base, amp, f));
  ctx.lineTo(LW + 10, LH); ctx.closePath(); ctx.fill();
}
function drawTree(x, y, s) {
  ctx.save(); ctx.translate(x, y); ctx.scale(s, s);
  ctx.fillStyle = '#8a5a3c'; rr(-4, -18, 8, 20, 3); ctx.fill();
  const g = ctx.createRadialGradient(-6, -36, 3, 0, -30, 22);
  g.addColorStop(0, '#9ee68b'); g.addColorStop(1, '#3f9d4e');
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.arc(0, -30, 18, 0, Math.PI * 2); ctx.arc(-11, -22, 12, 0, Math.PI * 2); ctx.arc(11, -22, 12, 0, Math.PI * 2); ctx.fill();
  ctx.restore();
}

function drawBackground() {
  // 天空
  const sky = ctx.createLinearGradient(0, 0, 0, LH);
  sky.addColorStop(0, '#7cc8ff'); sky.addColorStop(0.6, '#c4ebff'); sky.addColorStop(1, '#fff3d6');
  ctx.fillStyle = sky; ctx.fillRect(0, 0, LW, LH);
  // 太陽
  const sx = LW - 110, sy = 110;
  const sg = ctx.createRadialGradient(sx, sy, 10, sx, sy, 120);
  sg.addColorStop(0, 'rgba(255,250,200,0.9)'); sg.addColorStop(0.35, 'rgba(255,236,150,0.45)'); sg.addColorStop(1, 'rgba(255,236,150,0)');
  ctx.fillStyle = sg; ctx.beginPath(); ctx.arc(sx, sy, 120, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#fff0a0'; ctx.beginPath(); ctx.arc(sx, sy, 36, 0, Math.PI * 2); ctx.fill();
  clouds.forEach(c => drawCloud(c.x, c.y, c.s));
  const gy = LH - GROUND;
  // 遠山、近山
  drawHills(worldX * 0.15, gy + 10, 170, 0.006, '#a9d8f0', '#cdeaf5');
  drawHills(worldX * 0.35, gy + 10, 110, 0.011, '#8fdc8f', '#5dbb6a');
  // 近山上的小樹
  const off = worldX * 0.35, step = 120;
  for (let k = Math.floor(off / step) - 1; k < (off + LW) / step + 1; k++) {
    const x = k * step - off + ((k * 37) % 50);
    if ((k * 7919) % 3 === 0) continue;
    drawTree(x, hillY(x, off, gy + 10, 110, 0.011) + 4, 0.8 + ((k * 13) % 5) / 10);
  }
  drawHills(worldX * 0.6, gy + 6, 40, 0.02, '#74cf6c', '#4fae55');
}

function drawGround() {
  const gy = LH - GROUND;
  const g = ctx.createLinearGradient(0, gy, 0, LH);
  g.addColorStop(0, '#e9c98a'); g.addColorStop(1, '#c99a5c');
  ctx.fillStyle = g; ctx.fillRect(0, gy, LW, GROUND);
  // 斜紋
  ctx.save();
  ctx.beginPath(); ctx.rect(0, gy + 18, LW, GROUND); ctx.clip();
  ctx.fillStyle = 'rgba(255,255,255,0.12)';
  const off = worldX % 40;
  for (let x = -off - 40; x < LW + 40; x += 40) {
    ctx.beginPath(); ctx.moveTo(x, gy + 18); ctx.lineTo(x + 20, gy + 18); ctx.lineTo(x - 10, LH); ctx.lineTo(x - 30, LH); ctx.fill();
  }
  ctx.restore();
  // 草皮
  const gg = ctx.createLinearGradient(0, gy - 4, 0, gy + 20);
  gg.addColorStop(0, '#8fe36f'); gg.addColorStop(1, '#4fb44a');
  ctx.fillStyle = gg;
  ctx.beginPath(); ctx.moveTo(0, gy + 20);
  const goff = worldX % 16;
  for (let x = -goff - 16; x < LW + 16; x += 16) { ctx.lineTo(x, gy + 2); ctx.quadraticCurveTo(x + 8, gy - 6, x + 16, gy + 2); }
  ctx.lineTo(LW + 16, gy + 20); ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#3e9a3e'; ctx.fillRect(0, gy + 18, LW, 3);
  // 小花
  const foff = worldX % 90;
  for (let x = -foff; x < LW + 90; x += 90) {
    ctx.fillStyle = '#fff'; ctx.beginPath();
    for (let i = 0; i < 5; i++) { const a = i * 1.2566; ctx.arc(x + 30 + Math.cos(a) * 4, gy + 40 + Math.sin(a) * 4, 3, 0, Math.PI * 2); }
    ctx.fill();
    ctx.fillStyle = '#ffc93c'; ctx.beginPath(); ctx.arc(x + 30, gy + 40, 2.5, 0, Math.PI * 2); ctx.fill();
  }
}

function drawPipePart(x, y, h, capAtBottom) {
  // 管身
  const g = ctx.createLinearGradient(x, 0, x + PW, 0);
  g.addColorStop(0, '#3f9d4e'); g.addColorStop(0.25, '#a8f08f'); g.addColorStop(0.45, '#6fd36a'); g.addColorStop(1, '#2f8040');
  ctx.fillStyle = g;
  ctx.strokeStyle = 'rgba(28,90,40,0.55)'; ctx.lineWidth = 3;
  rr(x, y, PW, h, 6); ctx.fill(); ctx.stroke();
  // 白色亮線
  ctx.fillStyle = 'rgba(255,255,255,0.35)';
  ctx.fillRect(x + 12, y + 4, 6, h - 8);
  // 管口
  const cy = capAtBottom ? y + h - CAP_H : y;
  const cg = ctx.createLinearGradient(x - 6, 0, x + PW + 6, 0);
  cg.addColorStop(0, '#46a856'); cg.addColorStop(0.25, '#b8f7a0'); cg.addColorStop(0.5, '#78d870'); cg.addColorStop(1, '#2f8040');
  ctx.fillStyle = cg;
  rr(x - 6, cy, PW + 12, CAP_H, 10); ctx.fill(); ctx.stroke();
  ctx.fillStyle = 'rgba(255,255,255,0.4)';
  rr(x + 2, cy + 5, PW - 4, 5, 3); ctx.fill();
}
function drawFlower(x, y, kind) {
  const petal = ['#ff8fb1', '#ffd65c', '#b49cff'][kind];
  ctx.fillStyle = '#4fae55';
  ctx.beginPath(); ctx.ellipse(x - 7, y + 4, 7, 3.5, -0.5, 0, Math.PI * 2); ctx.ellipse(x + 7, y + 4, 7, 3.5, 0.5, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = petal;
  for (let i = 0; i < 5; i++) { const a = i * 1.2566 + 0.3; ctx.beginPath(); ctx.arc(x + Math.cos(a) * 5.5, y - 6 + Math.sin(a) * 5.5, 4.2, 0, Math.PI * 2); ctx.fill(); }
  ctx.fillStyle = '#fff6b0'; ctx.beginPath(); ctx.arc(x, y - 6, 3.4, 0, Math.PI * 2); ctx.fill();
}
function drawPipes() {
  pipes.forEach(p => {
    const topH = p.gy - p.gap / 2, botY = p.gy + p.gap / 2;
    drawPipePart(p.x, -10, topH + 10, true);
    drawPipePart(p.x, botY, LH - GROUND - botY + 6, false);
    // 管口上的小花和小葉子
    drawFlower(p.x + PW * 0.3, botY - 1, p.flower);
    drawFlower(p.x + PW * 0.75, botY - 1, (p.flower + 1) % 3);
  });
}

function drawStars() {
  stars.forEach(s => {
    const bob = Math.sin(time * 4 + s.ph) * 5;
    const rot = Math.sin(time * 2 + s.ph) * 0.25;
    const x = s.x, y = s.y + bob;
    const gl = ctx.createRadialGradient(x, y, 2, x, y, 34);
    gl.addColorStop(0, 'rgba(255,240,150,0.7)'); gl.addColorStop(1, 'rgba(255,240,150,0)');
    ctx.fillStyle = gl; ctx.beginPath(); ctx.arc(x, y, 34, 0, Math.PI * 2); ctx.fill();
    const g = ctx.createRadialGradient(x - 4, y - 6, 2, x, y, 18);
    g.addColorStop(0, '#fff9c4'); g.addColorStop(0.5, '#ffd84a'); g.addColorStop(1, '#f2a516');
    ctx.fillStyle = g; ctx.strokeStyle = '#e49a12'; ctx.lineWidth = 2.5; ctx.lineJoin = 'round';
    starPath(x, y, 18, 8.5, rot); ctx.fill(); ctx.stroke();
    // 小臉
    ctx.fillStyle = '#6b4a00';
    ctx.beginPath(); ctx.arc(x - 4, y - 1, 1.8, 0, Math.PI * 2); ctx.arc(x + 4, y - 1, 1.8, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = '#6b4a00'; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.arc(x, y + 2, 3, 0.2, Math.PI - 0.2); ctx.stroke();
  });
}

function drawBird() {
  ctx.save();
  ctx.translate(bird.x, bird.y);
  // 地面影子
  const gy = LH - GROUND;
  ctx.save(); ctx.rotate(0);
  const dist = Math.max(0, gy - bird.y);
  ctx.fillStyle = 'rgba(60,90,40,' + Math.max(0.05, 0.25 - dist / 2000) + ')';
  ctx.beginPath(); ctx.ellipse(0, dist + 2, 18 - Math.min(10, dist / 40), 4, 0, 0, Math.PI * 2); ctx.fill();
  ctx.restore();

  ctx.rotate(bird.rot);
  const r = 21;
  // 尾巴
  ctx.fillStyle = '#f2a900';
  ctx.beginPath(); ctx.moveTo(-r + 2, -2); ctx.lineTo(-r - 12, -10); ctx.lineTo(-r - 8, 0); ctx.lineTo(-r - 13, 8); ctx.lineTo(-r + 2, 6); ctx.fill();
  // 身體
  const g = ctx.createRadialGradient(-6, -9, 3, 0, 0, r * 1.15);
  g.addColorStop(0, '#fff8b8'); g.addColorStop(0.5, '#ffd83a'); g.addColorStop(1, '#f0a400');
  ctx.fillStyle = g;
  ctx.strokeStyle = 'rgba(190,120,0,0.6)'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.ellipse(0, 0, r * 1.08, r, 0, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
  // 肚子
  ctx.fillStyle = 'rgba(255,252,220,0.85)';
  ctx.beginPath(); ctx.ellipse(2, 9, r * 0.62, r * 0.42, 0, 0, Math.PI * 2); ctx.fill();
  // 頭上呆毛
  ctx.strokeStyle = '#f0a400'; ctx.lineWidth = 3; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(-2, -r + 1); ctx.quadraticCurveTo(-4, -r - 10, 4, -r - 9); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(3, -r + 2); ctx.quadraticCurveTo(6, -r - 6, 11, -r - 3); ctx.stroke();
  // 眼睛
  const dead = state === 'dying' || state === 'over';
  if (dead) {
    ctx.strokeStyle = '#3a2a1a'; ctx.lineWidth = 2.5;
    ctx.beginPath(); ctx.moveTo(4, -11); ctx.lineTo(12, -3); ctx.moveTo(12, -11); ctx.lineTo(4, -3); ctx.stroke();
  } else if (bird.blink > 0) {
    ctx.strokeStyle = '#3a2a1a'; ctx.lineWidth = 2.5;
    ctx.beginPath(); ctx.arc(8, -7, 5, 0.2, Math.PI - 0.2); ctx.stroke();
  } else {
    ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(8, -7, 7, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#2b1d14'; ctx.beginPath(); ctx.arc(10, -6.5, 4.4, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(11.5, -8.5, 1.7, 0, Math.PI * 2); ctx.arc(8.6, -4.6, 0.9, 0, Math.PI * 2); ctx.fill();
  }
  // 腮紅
  ctx.fillStyle = 'rgba(255,110,140,0.5)';
  ctx.beginPath(); ctx.ellipse(6, 5, 5, 3.2, 0, 0, Math.PI * 2); ctx.fill();
  // 嘴巴
  ctx.fillStyle = '#ff8a1f'; ctx.strokeStyle = '#d96a0a'; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.moveTo(r - 3, -4); ctx.quadraticCurveTo(r + 11, -1, r + 9, 2); ctx.lineTo(r - 3, 3); ctx.closePath(); ctx.fill(); ctx.stroke();
  ctx.fillStyle = '#ffa64a';
  ctx.beginPath(); ctx.moveTo(r - 3, 3); ctx.lineTo(r + 7, 3); ctx.quadraticCurveTo(r + 2, 8, r - 3, 7); ctx.closePath(); ctx.fill(); ctx.stroke();
  // 翅膀（拍動）
  const wa = dead ? 0.5 : Math.sin(bird.wing) * 0.7;
  ctx.save();
  ctx.translate(-6, 2); ctx.rotate(-wa);
  const wg = ctx.createLinearGradient(0, -8, 0, 10);
  wg.addColorStop(0, '#fff3a0'); wg.addColorStop(1, '#f0b000');
  ctx.fillStyle = wg; ctx.strokeStyle = 'rgba(190,120,0,0.7)'; ctx.lineWidth = 1.8;
  ctx.beginPath(); ctx.ellipse(-6, 0, 12, 7.5, 0.25, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
  ctx.restore();
  ctx.restore();

  // 撞到時頭上的暈暈星星
  if (dead) {
    for (let i = 0; i < 3; i++) {
      const a = time * 4 + i * 2.1;
      ctx.fillStyle = '#ffe066'; ctx.strokeStyle = '#e49a12'; ctx.lineWidth = 1.5;
      starPath(bird.x + Math.cos(a) * 22, bird.y - 30 + Math.sin(a) * 6, 6, 2.7, a);
      ctx.fill(); ctx.stroke();
    }
  }
}

function drawParts() {
  parts.forEach(p => {
    const a = Math.max(0, p.life / p.max);
    ctx.globalAlpha = a;
    if (p.t === 'spark') {
      ctx.fillStyle = p.c; starPath(p.x, p.y, 5 * a + 2, 2 * a + 1, 0); ctx.fill();
    } else if (p.t === 'feather') {
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.r);
      ctx.fillStyle = '#ffe27a'; ctx.beginPath(); ctx.ellipse(0, 0, 6, 2.6, 0, 0, Math.PI * 2); ctx.fill();
      ctx.restore();
    } else if (p.t === 'text') {
      ctx.font = 'bold 24px ' + FONT; ctx.textAlign = 'center';
      ctx.lineWidth = 5; ctx.strokeStyle = 'rgba(80,60,20,0.6)'; ctx.strokeText(p.s, p.x, p.y);
      ctx.fillStyle = p.c; ctx.fillText(p.s, p.x, p.y);
    }
    ctx.globalAlpha = 1;
  });
}

function drawReadyHint() {
  if (state !== 'ready') return;
  const x = LW / 2, y = (LH - GROUND) * 0.72;
  const s = 1 + Math.sin(time * 6) * 0.06;
  ctx.save(); ctx.translate(x, y); ctx.scale(s, s);
  ctx.fillStyle = 'rgba(255,255,255,0.92)';
  rr(-120, -30, 240, 60, 30); ctx.fill();
  ctx.strokeStyle = '#ffd65c'; ctx.lineWidth = 4; ctx.stroke();
  ctx.fillStyle = '#4a3b52'; ctx.font = 'bold 24px ' + FONT; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText('👆 點一下就飛！', 0, 1);
  ctx.restore();
  ctx.textBaseline = 'alphabetic';
}

function draw() {
  ctx.setTransform(dpr * S, 0, 0, dpr * S, 0, 0);
  drawBackground();
  drawPipes();
  drawGround();
  drawStars();
  drawBird();
  drawParts();
  drawReadyHint();
}

/* ========== 主迴圈（只會啟動一次） ========== */
let last = performance.now();
function loop(now) {
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  update(dt);
  draw();
  requestAnimationFrame(loop);
}

resize();
initClouds();
reset();
requestAnimationFrame(loop);
KG.showStart({
  icon: '🐤',
  title: '小鳥飛飛',
  message: '點一下螢幕（或按空白鍵）讓小鳥往上飛，穿過大樹、撿星星！',
  button: '開始飛！',
  onStart: () => { reset(); state = 'ready'; }
});
</script>
</body>
