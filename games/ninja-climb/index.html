<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>忍者爬高高</title>
<link rel="stylesheet" href="../../assets/common.css">
<style>
  html, body { height: 100%; overflow: hidden; background: #1d2350; overscroll-behavior: none; }
  #game { position: fixed; inset: 0; display: block; width: 100vw; height: 100vh; height: 100dvh; touch-action: none; }
  .hidden { display: none !important; }
  #pauseBtn {
    position: fixed; right: 10px; top: 60px; z-index: 9100; width: 48px; height: 48px; border-radius: 50%;
    border: 3px solid #fff; background: linear-gradient(180deg, #fff 0%, #e7ecff 100%); box-shadow: var(--kg-shadow);
    display: flex; align-items: center; justify-content: center; cursor: pointer; padding: 0;
  }
  #pauseBtn i { display: inline-block; width: 6px; height: 18px; background: #3a3f6b; border-radius: 3px; margin: 0 2.5px; }
  #pauseBtn:active { transform: scale(0.9); }
  .ov {
    position: fixed; inset: 0; z-index: 9000; display: flex; align-items: center; justify-content: center;
    padding: 66px 14px 14px; background: rgba(18, 20, 48, 0.5); touch-action: manipulation;
  }
  .ov.clear { background: transparent; }
  .card {
    background: #fffaf0; border: 4px solid #fff; border-radius: 26px; box-shadow: 0 8px 0 rgba(30, 30, 70, 0.25), 0 18px 40px rgba(0, 0, 0, 0.3);
    width: min(430px, 100%); max-height: 100%; display: flex; flex-direction: column; overflow: hidden; color: #3b3352;
    animation: pop 0.28s cubic-bezier(.2, 1.4, .4, 1);
  }
  @keyframes pop { from { transform: scale(0.85); opacity: 0; } to { transform: none; opacity: 1; } }
  .card h2 { margin: 0; padding: 14px 16px 6px; text-align: center; font-size: 26px; font-weight: 900; color: #3b3352; }
  .card .body { overflow-y: auto; padding: 4px 16px 10px; flex: 1 1 auto; min-height: 0; }
  .card .foot { padding: 10px 14px 14px; display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; flex: 0 0 auto; }
  .kg-btn { font-size: 18px; padding: 11px 20px; }
  .kg-btn.gray { background: linear-gradient(180deg, #eef0f7 0%, #c9cde0 100%); box-shadow: 0 5px 0 #9a9fb8, 0 10px 18px rgba(80, 80, 120, 0.25); color: #3b3352; text-shadow: none; }
  .kg-btn.purple { background: linear-gradient(180deg, #c8b6ff 0%, #8a6ee8 100%); box-shadow: 0 5px 0 #6248b8, 0 10px 18px rgba(98, 72, 184, 0.35); }
  .kg-btn.sm { font-size: 15px; padding: 8px 14px; }
  .kg-btn:disabled { filter: grayscale(0.8); opacity: 0.55; }
  .coin { display: inline-block; width: 0.95em; height: 0.95em; border-radius: 50%; vertical-align: -0.12em; margin-right: 0.2em;
    background: radial-gradient(circle at 35% 35%, #fff6b0 0 18%, #ffd23f 30%, #e39b10 100%); box-shadow: inset 0 0 0 2px #c27a08; }
  .scrollic { display: inline-block; width: 1.1em; height: 0.7em; border-radius: 0.2em; vertical-align: -0.02em; margin-right: 0.2em;
    background: linear-gradient(90deg, #a5642e 0 14%, #f7e7c0 14% 86%, #a5642e 86%); }
  /* 標題 */
  .ttl { flex-direction: column; justify-content: flex-start; gap: 10px; overflow: hidden; }
  .tgrid { width: min(440px, 100%); display: flex; flex-direction: column; gap: 10px; min-height: 0; flex: 1 1 auto; }
  .tleft { display: flex; flex-direction: column; align-items: center; gap: 10px; }
  .logo { margin: 0; font-size: 52px; line-height: 1.05; font-weight: 900; letter-spacing: 2px; color: #fff; text-align: center;
    -webkit-text-stroke: 3px #2b2350; paint-order: stroke fill;
    text-shadow: 0 5px 0 #2b2350, 0 10px 20px rgba(0, 0, 0, 0.35); }
  .logo span { color: #ffd84a; }
  .logo small { display: block; font-size: 15px; letter-spacing: 4px; -webkit-text-stroke: 0; color: #fff; text-shadow: 0 2px 0 #2b2350; margin-top: 6px; }
  .stats { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
  .chip { background: rgba(255, 250, 240, 0.95); border-radius: 999px; padding: 6px 14px; font-weight: 900; font-size: 17px; color: #3b3352; box-shadow: 0 4px 0 rgba(30, 30, 70, 0.25); }
  .tbtns { display: flex; flex-direction: column; gap: 10px; align-items: center; width: 100%; }
  .tbtns .row { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
  .go { font-size: 26px !important; padding: 14px 44px !important; }
  .mpanel { background: rgba(255, 250, 240, 0.95); border-radius: 20px; padding: 10px 12px; box-shadow: 0 5px 0 rgba(30, 30, 70, 0.25); min-height: 0; overflow-y: auto; }
  .mpanel h3 { margin: 0 0 6px; font-size: 17px; text-align: center; }
  .mrow { display: flex; align-items: center; gap: 8px; padding: 5px 0; font-size: 15px; font-weight: 800; }
  .mrow + .mrow { border-top: 2px dashed #eadfca; }
  .mrow .mt { flex: 1; min-width: 0; }
  .mrow .bar { height: 8px; border-radius: 4px; background: #eadfca; margin-top: 4px; overflow: hidden; }
  .mrow .bar b { display: block; height: 100%; background: linear-gradient(90deg, #7bd88f, #3fb86a); border-radius: 4px; }
  .mrow .rw { white-space: nowrap; font-size: 14px; }
  .mrow.done { color: #2f8a48; }
  .mrow .ck { width: 22px; height: 22px; border-radius: 50%; background: #3fb86a; color: #fff; display: grid; place-items: center; font-size: 14px; flex: 0 0 auto; }
  .spacer { flex: 1 1 auto; }
  @media (orientation: landscape) and (max-height: 560px) {
    .ov { padding: 10px 70px; }
    .ttl { justify-content: center; }
    .tgrid { flex-direction: row; width: min(760px, 100%); align-items: center; flex: 0 1 auto; max-height: 100%; }
    .tleft { flex: 1 1 0; }
    .mpanel { flex: 1 1 0; max-height: 100%; }
    .logo { font-size: 40px; }
    .go { font-size: 22px !important; padding: 11px 36px !important; }
    .card h2 { padding-top: 10px; font-size: 22px; }
    .tbtns .kg-btn.sm, .tbtns .kg-btn.yellow { font-size: 15px; padding: 8px 14px; }
    .it canvas { width: 54px; height: 54px; }
    .grid { grid-template-columns: repeat(auto-fill, minmax(104px, 1fr)); gap: 8px; }
    .ring { width: 64px; height: 64px; margin: 2px auto; }
  }
  /* 商店 */
  .tabs { display: flex; gap: 6px; justify-content: center; padding: 0 14px 8px; flex: 0 0 auto; }
  .tab { border: none; border-radius: 999px; padding: 7px 14px; font-weight: 900; font-size: 15px; background: #eee6d6; color: #6b5e7a; cursor: pointer; font-family: var(--kg-font); }
  .tab.on { background: #ffcf4a; color: #4b3500; box-shadow: 0 3px 0 #c48a12; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(118px, 1fr)); gap: 10px; }
  .it { background: #fff; border-radius: 16px; border: 3px solid #eee3cf; padding: 6px; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 4px; }
  .it.eq { border-color: #3fb86a; background: #effbf1; }
  .it canvas { width: 76px; height: 76px; }
  .it .nm { font-weight: 900; font-size: 15px; }
  .it .kg-btn { font-size: 14px; padding: 6px 10px; width: 100%; }
  .wallet { text-align: center; font-weight: 900; font-size: 18px; padding-bottom: 6px; }
  .big { font-size: 46px; font-weight: 900; text-align: center; color: #3b3352; line-height: 1.1; }
  .sub { text-align: center; font-weight: 800; font-size: 16px; color: #6b5e7a; margin: 4px 0; }
  .nb { display: inline-block; background: #ff5a7a; color: #fff; border-radius: 999px; padding: 2px 10px; font-size: 15px; margin-left: 6px; vertical-align: middle; animation: pop 0.4s; }
  .res { display: flex; justify-content: center; gap: 14px; flex-wrap: wrap; font-weight: 900; font-size: 18px; margin: 8px 0; }
  .ring { display: block; width: 86px; height: 86px; margin: 6px auto; }
  .note { text-align: center; font-size: 14px; color: #8a7e98; font-weight: 700; }
</style>
</head>
<body>
<canvas id="game" aria-label="忍者爬高高"></canvas>
<button id="pauseBtn" class="hidden" aria-label="暫停"><i></i><i></i></button>
<script src="../../assets/common.js"></script>
<script src="../../assets/kg-music.js"></script>
<script>
'use strict';
/* =====================================================================
 * 忍者爬高高：在兩面牆之間跳來跳去，一直往上爬！
 * 點一下跳到對面、按住慢慢往下滑、往上滑二段跳（商店解鎖／彈簧竹）
 * 每 100 公尺換一個場景：竹林、城堡、雪山、夜空燈籠、雲端
 * ===================================================================== */
(function () {
const SLUG = 'ninja-climb';
const cv = document.getElementById('game');
const ctx = cv.getContext('2d');
const FONT = '"PingFang TC","Noto Sans TC","Microsoft JhengHei","Heiti TC",system-ui,sans-serif';
const TAU = Math.PI * 2;
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const lerp = (a, b, t) => a + (b - a) * t;
const rand = (a, b) => a + Math.random() * (b - a);
const pick = (arr) => arr[Math.floor(Math.random() * arr.length)];

/* ---------- 世界尺寸（單位：遊戲單位，1 公尺 = 40 單位） ---------- */
const CW = 360, WALL = 44, LX = WALL + 15, RX = CW - WALL - 15, NR = 11, NSC = 1.25;
const UPM = 40, ZONE_H = 4000, GROUND = 30;
const GRAV = 2000, JVX = 640, JVY = 780;
let W = 360, H = 640, dpr = 1, S = 1, colX = 0, viewH = 600, time = 0;

/* ---------- 存檔 ---------- */
const Save = {
  get(k, d) { return KG.store.get(SLUG + ':' + k, d); },
  set(k, v) { KG.store.set(SLUG + ':' + k, v); }
};
let bank = Save.get('coins', 0) | 0;
let owned = Save.get('owned', { o: [0], t: [0], dj: false });
if (!owned || !Array.isArray(owned.o)) owned = { o: [0], t: [0], dj: false };
let outfitId = Save.get('outfit', 0) | 0, trailId = Save.get('trail', 0) | 0;
let tutDone = Save.get('tut', false);
function saveBank() { Save.set('coins', bank); }
function bestM() { return KG.best(SLUG) || 0; }

/* ---------- 服裝、拖尾 ---------- */
const OUTFITS = [
  { name: '墨影', price: 0, body: '#2f3552', band: '#e8434d', limb: '#262b45' },
  { name: '赤炎', price: 60, body: '#cf3b3b', band: '#ffd24a', limb: '#9e2a2a' },
  { name: '青竹', price: 90, body: '#3c8f5a', band: '#f6efcf', limb: '#2c6b43' },
  { name: '櫻花', price: 120, body: '#f28bb0', band: '#ffffff', limb: '#d86b93', pat: 'sakura' },
  { name: '雪狐', price: 160, body: '#f4f6ff', band: '#57a6e8', limb: '#d3d9ef', pat: 'fox' },
  { name: '金虎', price: 220, body: '#f2a93b', band: '#3b2a1a', limb: '#cf8a22', pat: 'tiger' },
  { name: '星夜', price: 280, body: '#4b3a8f', band: '#ffe27a', limb: '#3a2c70', pat: 'stars' },
  { name: '熊貓', price: 360, body: '#ffffff', band: '#3fbf7f', limb: '#2b2b33', pat: 'panda' }
];
const TRAILS = [
  { name: '疾風', price: 0 },
  { name: '煙霧', price: 50 },
  { name: '星光', price: 90 },
  { name: '櫻吹雪', price: 130 },
  { name: '火花', price: 180 },
  { name: '彩虹', price: 250 }
];
const DJ_PRICE = 150;

/* ---------- 場景 ---------- */
const ZONES = [
  { name: '竹林', sky: ['#a8dcae', '#e9f7d9'], wall: '#5aa64a', ink: '#24402a',
    pool: { spikes: 3, crumble: 1.6, bird: 1.2, spring: 1, zig: 1 }, barrels: true },
  { name: '城堡', sky: ['#ffc58f', '#ffeccc'], wall: '#9a9aa8', ink: '#3b2a3a',
    pool: { spikes: 2.4, blade: 2.6, crumble: 1.5, bird: 1, zig: 1.4, spring: 0.8 }, barrels: true },
  { name: '雪山', sky: ['#bcdcff', '#f2f8ff'], wall: '#8fa4bf', ink: '#2a3a55',
    pool: { spikes: 2, ice: 2.4, wind: 2, bird: 1.2, zig: 1, spring: 0.8 }, barrels: true },
  { name: '夜空燈籠', sky: ['#171c46', '#3d3a7c'], wall: '#8e2f2f', ink: '#fff0c8',
    pool: { crow: 2.4, blade: 2, spikes: 2, crumble: 1.5, bird: 1.2, spring: 0.8 }, barrels: false },
  { name: '雲端', sky: ['#9fd2ff', '#ffeefa'], wall: '#f3eee4', ink: '#4a3b6a',
    pool: { wind: 2, crow: 2, blade: 2, spikes: 2, zig: 1.5, crumble: 1, spring: 0.8, bird: 1 }, barrels: true }
];
const zoneIdx = (y) => Math.max(0, Math.floor(y / ZONE_H));
const zoneOf = (y) => ZONES[zoneIdx(y) % ZONES.length];

/* =====================================================================
 * 聲音
 * ===================================================================== */
let sfxOn = Save.get('sfx', true) !== false;
const lastSfx = {};
function sfx(name, o) {
  if (!sfxOn || !KG.sfx) return;
  const now = performance.now();
  if (lastSfx[name] && now - lastSfx[name] < 40) return;
  lastSfx[name] = now;
  try { KG.sfx.play(name, o); } catch (e) { /* 忽略 */ }
}
const vary = (k) => 1 + (Math.random() * 2 - 1) * (k || 0.04);
function panW(x) { return clamp((x / CW) * 2 - 1, -1, 1) * 0.6; }
// E 小調五聲音階（E G A B D）
const PENTA = [329.63, 392.0, 440.0, 493.88, 587.33, 659.26, 783.99, 880.0, 987.77, 1174.66, 1318.51];
if (KG.sfx) {
  KG.sfx.define('jumpW', (p, s) => {
    s.noise(0.17, { vol: 0.2, freq: 900 * p, sweep: 3400 * p, q: 1.4 });
    s.tone(300 * p, 0.12, { type: 'triangle', vol: 0.11, slide: 620 * p });
  });
  KG.sfx.define('stick', (p, s) => {
    s.noise(0.035, { vol: 0.26, freq: 1500 * p, q: 3.5 });
    s.tone(260 * p, 0.06, { type: 'triangle', vol: 0.16, slide: 170 * p });
  });
  KG.sfx.define('coinC', (p, s) => {
    s.tone(1318.5 * p, 0.09, { type: 'triangle', vol: 0.11 });
    s.tone(1975.5 * p, 0.2, { vol: 0.08, delay: 0.05 });
  });
  KG.sfx.define('scroll', (p, s) => {
    s.noise(0.12, { vol: 0.14, freq: 2600 * p, sweep: 1200 * p, q: 0.8 });
    [659.26, 783.99, 987.77, 1318.5].forEach((f, i) => s.tone(f * p, 0.22, { type: 'triangle', vol: 0.11, delay: 0.05 + i * 0.06 }));
  });
  KG.sfx.define('whizz', (p, s) => {
    s.noise(0.32, { vol: 0.16, freq: 5200 * p, sweep: 1800 * p, q: 3, type: 'bandpass' });
    s.tone(1800 * p, 0.28, { type: 'sine', vol: 0.04, slide: 900 * p });
  });
  KG.sfx.define('caw', (p, s) => {
    for (let k = 0; k < 2; k++) {
      const d = k * 0.2;
      s.tone(640 * p, 0.16, { type: 'sawtooth', vol: 0.045, slide: 430 * p, delay: d, attack: 0.01 });
      s.tone(655 * p, 0.16, { type: 'square', vol: 0.025, slide: 420 * p, delay: d, attack: 0.01 });
      s.noise(0.14, { vol: 0.07, freq: 1300 * p, q: 2.5, delay: d });
    }
  });
  KG.sfx.define('crunch', (p, s) => {
    for (let k = 0; k < 4; k++) s.noise(0.08, { vol: 0.22 - k * 0.03, freq: (700 + Math.random() * 600) * p, type: 'lowpass', q: 1, delay: k * 0.05 + Math.random() * 0.02 });
    s.tone(110 * p, 0.2, { vol: 0.2, slide: 60 });
  });
  KG.sfx.define('crack', (p, s) => {
    s.noise(0.05, { vol: 0.18, freq: 2200 * p, q: 3 });
    s.noise(0.05, { vol: 0.12, freq: 1700 * p, q: 3, delay: 0.08 });
  });
  KG.sfx.define('thudH', (p, s) => {
    s.tone(150 * p, 0.24, { vol: 0.42, slide: 50 });
    s.noise(0.14, { vol: 0.24, freq: 600, type: 'lowpass' });
    s.tone(420 * p, 0.08, { type: 'square', vol: 0.05, slide: 180 });
  });
  KG.sfx.define('gong', (p, s) => {
    const f = 110 * p;
    s.tone(f, 1.8, { vol: 0.16, attack: 0.01 });
    s.tone(f * 1.48, 1.3, { vol: 0.06, attack: 0.02 });
    s.tone(f * 2.13, 0.9, { vol: 0.04, attack: 0.02 });
    s.tone(f * 2.94, 0.6, { vol: 0.025 });
    s.noise(0.3, { vol: 0.05, freq: 900, type: 'lowpass' });
  });
  KG.sfx.define('shieldOn', (p, s) => {
    s.tone(330 * p, 0.35, { type: 'triangle', vol: 0.12, slide: 660 * p });
    s.tone(990 * p, 0.3, { vol: 0.06, delay: 0.12 });
  });
  KG.sfx.define('shieldBreak', (p, s) => {
    s.noise(0.25, { vol: 0.22, freq: 4000 * p, sweep: 900, q: 1, type: 'bandpass' });
    [1318.5, 987.77, 783.99].forEach((f, i) => s.tone(f * p, 0.14, { type: 'triangle', vol: 0.08, delay: i * 0.05 }));
  });
  KG.sfx.define('rocket', (p, s) => {
    s.noise(0.9, { vol: 0.2, freq: 400 * p, sweep: 2600 * p, q: 0.8 });
    s.tone(180 * p, 0.8, { type: 'sawtooth', vol: 0.05, slide: 700 * p });
  });
  KG.sfx.define('slowmo', (p, s) => {
    s.tone(880 * p, 0.5, { type: 'triangle', vol: 0.1, slide: 330 * p });
    s.tone(440 * p, 0.6, { vol: 0.07, slide: 165 * p, delay: 0.05 });
  });
  KG.sfx.define('magnet', (p, s) => {
    s.tone(520 * p, 0.12, { type: 'square', vol: 0.05 });
    s.tone(780 * p, 0.12, { type: 'square', vol: 0.05, delay: 0.08 });
    s.tone(1040 * p, 0.2, { vol: 0.07, delay: 0.16 });
  });
  KG.sfx.define('spring', (p, s) => {
    s.tone(200 * p, 0.32, { type: 'triangle', vol: 0.2, slide: 700 * p });
    s.noise(0.25, { vol: 0.12, freq: 900 * p, sweep: 3600 * p, q: 1.2 });
  });
  KG.sfx.define('djump', (p, s) => {
    s.noise(0.14, { vol: 0.16, freq: 1500 * p, sweep: 4200 * p, q: 1.6 });
    s.tone(587 * p, 0.1, { type: 'triangle', vol: 0.1, slide: 880 * p });
  });
  KG.sfx.define('warn', (p, s) => { s.tone(1046 * p, 0.05, { type: 'triangle', vol: 0.06 }); });
  KG.sfx.define('roll', (p, s) => {
    for (let k = 0; k < 3; k++) s.noise(0.09, { vol: 0.1, freq: 260 * p, type: 'lowpass', delay: k * 0.07 });
    s.tone(90 * p, 0.25, { vol: 0.12, slide: 70 });
  });
  KG.sfx.define('chirp', (p, s) => {
    s.tone(2300 * p, 0.06, { vol: 0.05, slide: 3100 * p });
    s.tone(2500 * p, 0.07, { vol: 0.045, slide: 3300 * p, delay: 0.09 });
  });
  KG.sfx.define('shing', (p, s) => { s.noise(0.12, { vol: 0.08, freq: 6000 * p, q: 4 }); s.tone(2400 * p, 0.1, { vol: 0.025 }); });
}

/* 標題：平靜的古箏風（pluck），E 小調五聲 */
const TITLE_SONG = {
  bpm: 80, steps: 16, swing: 0.1,
  chords: ['Em', 'Cmaj7', 'Am7', 'D', 'Em', 'Cmaj7', 'Am7', 'Bm7'],
  tracks: [
    { inst: 'pad', chord: 'hold', vol: 0.42 },
    { inst: 'sub', chord: 'R.......5.......', vol: 0.5 },
    { inst: 'pluck', vol: 1.05, seq: [
      'E5 - B4 - E5 G5 A5 -', 'G5 - - E5 D5 - - .', 'E5 - - D5 B4 - A4 -', 'A4 - - - - . D5 E5',
      'B4 - D5 - E5 - G5 A5', 'B5 - - A5 G5 - E5 -', 'D5 - E5 D5 B4 - A4 -', 'B4 - - - - . . .'] },
    { inst: 'pluck', vol: 0.42, seq: [
      '. . . . . . . E4', '. . . . . . . G4', '. . . . . . . E4', '. . . . . . . D4',
      '. . . . . . . B3', '. . . . . . . G4', '. . . . . . . A4', '. . . . . . D4 .'] },
    { inst: 'kalimba', arp: 'updown', rate: 4, oct: 4, vol: 0.32 },
    { inst: 'shaker', pat: '....o.......o...', vol: 0.45 },
    { inst: 'tom', pitch: 82, pat: ['x...............', '................', 'x.......o.......', '................'], vol: 0.4 }
  ]
};
/* 遊戲中：150 bpm 太鼓流行風，五聲音階笛子旋律 */
const GAME_SONG = {
  bpm: 150, steps: 16, swing: 0.04,
  chords: ['Em', 'C', 'D', 'Em', 'Em', 'C', 'D', 'Bm7', 'C', 'D', 'Bm7', 'Em', 'Am7', 'D', 'C', 'Em'],
  layers: { z1: false, z2: false, z3: false, z4: false, danger: false },
  tracks: [
    { inst: 'tom', pitch: 78, pat: ['X.....x.X.......', 'X.....x.X...x...'], vol: 0.8 },
    { inst: 'kick', pat: 'x.......x.......', vol: 0.4 },

    }

}

/* ---------- 風 ---------- */

  for (const w of winds) {

    ctx.fillStyle = 'rgba(255,255,255,0.12)';

      ctx.beginPath(); ctx.moveTo(sx(x), sy(yy)); ctx.lineTo(sx(x - w.dir * 34), sy(yy)); ctx.stroke();

/* ---------- 危險物 ---------- */
function drawHazards(front) {
  const top = camY + viewH;
  for (const h of hz) {
    const isFront = h.k === 'blade' || h.k === 'star' || h.warn > 0 || (h.k === 'crow' && h.st === 'aim');
    if (isFront !== !!front && h.k !== 'crow') continue;
    if (h.k === 'blade') {
      if (h.y1 < camY - 30 || h.y0 > top + 30) continue;
      // 軌道
      const left = h.side === 0, wx = left ? WALL : CW - WALL;
      ctx.fillStyle = 'rgba(30,25,45,0.55)';
      ctx.fillRect(sx(left ? wx - 7 : wx), sy(h.y1 + 6), 7 * S, (h.y1 - h.y0 + 12) * S);
      ctx.fillStyle = 'rgba(255,90,90,0.6)';
      ctx.fillRect(sx(left ? wx - 1.5 : wx - 0.5), sy(h.y1 + 6), 2 * S, (h.y1 - h.y0 + 12) * S);
      drawBlade(sx(h.x), sy(h.y), h.r * S, h.spin || 0);
    } else if (h.k === 'bird') {
      if (h.warn > 0) { drawWarn(h.dir > 0 ? WALL + 16 : CW - WALL - 16, h.by, h.warn, h.dir > 0 ? 'right' : 'left'); continue; }
      drawBird(sx(h.x), sy(h.y), S, h.dir, h.t, h.night);
    } else if (h.k === 'barrel') {
      if (h.warn > 0) { drawWarn(h.x, camY + viewH - 150, h.warn, 'down'); continue; }
      drawBarrel(sx(h.x), sy(h.y), h.r * S, h.rot, h.snow);
    } else if (h.k === 'crow') {
      if (front && h.st === 'aim' && h.aim) {
        const lock = h.t > 0.62;
        ctx.save();
        ctx.strokeStyle = lock ? 'rgba(255,60,80,0.9)' : 'rgba(255,90,110,0.5)';
        ctx.lineWidth = (lock ? 3 : 2) * S; ctx.setLineDash([8 * S, 7 * S]); ctx.lineDashOffset = -time * 60;
        ctx.beginPath(); ctx.moveTo(sx(h.x), sy(h.y)); ctx.lineTo(sx(h.aim.x), sy(h.aim.y)); ctx.stroke();
        ctx.setLineDash([]);
        ctx.strokeStyle = 'rgba(255,60,80,0.9)'; ctx.lineWidth = 2 * S;
        ctx.beginPath(); ctx.arc(sx(h.aim.x), sy(h.aim.y), (lock ? 14 : 20 - h.t * 8) * S, 0, TAU); ctx.stroke();
        ctx.restore();
      }
      if (!front) drawCrow(sx(h.x), sy(h.y), S, h.hx > CW / 2 ? -1 : 1, h.st === 'aim');
    } else if (h.k === 'star') {
      drawShuriken(sx(h.x), sy(h.y), h.r * S, h.rot);
    }
  }
}
function drawWarn(x, y, t, dir) {
  const px = sx(x), py = sy(y);
  const pulse = 0.5 + 0.5 * Math.sin(time * 18);
  ctx.save();
  ctx.globalAlpha = 0.6 + pulse * 0.4;
  ctx.fillStyle = '#ff4a5e'; ctx.strokeStyle = '#fff'; ctx.lineWidth = 3 * S;
  ctx.beginPath(); ctx.arc(px, py, 15 * S, 0, TAU); ctx.fill(); ctx.stroke();
  txtC('!', px, py + 1 * S, 20 * S, '#fff');
  ctx.fillStyle = '#ff4a5e';
  if (dir === 'down') { ctx.beginPath(); ctx.moveTo(px - 8 * S, py + 19 * S); ctx.lineTo(px + 8 * S, py + 19 * S); ctx.lineTo(px, py + 29 * S); ctx.fill(); }
  else { const d = dir === 'right' ? 1 : -1; ctx.beginPath(); ctx.moveTo(px + d * 19 * S, py - 8 * S); ctx.lineTo(px + d * 19 * S, py + 8 * S); ctx.lineTo(px + d * 29 * S, py); ctx.fill(); }
  ctx.restore();
  void t;
}
function drawBlade(x, y, r, a) {
  ctx.save(); ctx.translate(x, y); ctx.rotate(a);
  ctx.fillStyle = '#d7dbe8'; ctx.strokeStyle = '#4a4e66'; ctx.lineWidth = 1.5 * S;
  ctx.beginPath();

  ctx.fillStyle = '#e8434d'; ctx.beginPath(); ctx.arc(0, 0, r * 0.2, 0, TAU); ctx.fill();
  ctx.restore();
}

    ctx.beginPath(); ctx.moveTo(-2, 0); ctx.quadraticCurveTo(-14, -12 * flap - 4, -22, -4 * flap); ctx.quadraticCurveTo(-14, 2, -2, 4); ctx.fill();
    ctx.beginPath(); ctx.moveTo(2, 0); ctx.quadraticCurveTo(14, -12 * flap - 4, 22, -4 * flap); ctx.quadraticCurveTo(14, 2, 2, 4); ctx.fill();
    ctx.fillStyle = '#5c4a80'; ctx.beginPath(); ctx.ellipse(0, 0, 9, 8, 0, 0, TAU); ctx.fill();
    ctx.beginPath(); ctx.moveTo(-6, -5); ctx.lineTo(-4, -12); ctx.lineTo(-1, -6); ctx.moveTo(6, -5); ctx.lineTo(4, -12); ctx.lineTo(1, -6); ctx.fill();
    ctx.fillStyle = '#ffe27a'; ctx.beginPath(); ctx.arc(-3, -1, 2, 0, TAU); ctx.arc(3, -1, 2, 0, TAU); ctx.fill();
  } else {

    ctx.beginPath(); ctx.ellipse(0, 0, 12, 9, 0, 0, TAU); ctx.fill();
    ctx.fillStyle = '#ffffff'; ctx.beginPath(); ctx.ellipse(2, 3, 7, 5, 0, 0, TAU); ctx.fill();
    ctx.fillStyle = '#3a86c4';
    ctx.beginPath(); ctx.moveTo(-3, -2); ctx.quadraticCurveTo(-8, -16 * flap, -16, -10 * flap - 2); ctx.quadraticCurveTo(-8, 2, -3, 3); ctx.fill();
    ctx.fillStyle = '#ffb02e'; ctx.beginPath(); ctx.moveTo(11, -1); ctx.lineTo(18, 1); ctx.lineTo(11, 3); ctx.fill();
    ctx.fillStyle = '#222'; ctx.beginPath(); ctx.arc(6, -3, 2, 0, TAU); ctx.fill();

  ctx.beginPath(); ctx.ellipse(0, 2, 14, 11, 0, 0, TAU); ctx.stroke();
  ctx.beginPath(); ctx.arc(10, -6, 8, 0, TAU); ctx.stroke();

function drawShuriken(x, y, r, a) {

/* ---------- 忍者 ---------- */
function drawNinja(c, x, y, k, o, pose) {
  // pose: {state, side, rot, sqx, sqy, t, dead, shield}
  c.save();
  c.translate(x, y);
  const face = pose.side === 0 ? 1 : -1; // 面向牆的另一邊
  c.rotate(pose.rot || 0);
  c.scale(k * face * (pose.sqx || 1), k * (pose.sqy || 1));
  c.lineJoin = 'round'; c.lineCap = 'round';
  const onWall = pose.state === 'wall', air = pose.state === 'air' || pose.state === 'rocket';
  const t = pose.t || 0;
  // 頭巾飄帶
  const fl = Math.sin(t * 14) * 3;
  c.fillStyle = o.band;
  c.beginPath(); c.moveTo(-10, -13); c.quadraticCurveTo(-20, -16 + fl, -27, -10 + fl * 1.4); c.lineTo(-24, -6 + fl); c.quadraticCurveTo(-18, -10, -10, -9); c.fill();

  c.fillStyle = o.limb;
  if (onWall) { c.beginPath(); c.ellipse(-9, 14, 5, 3.6, -0.5, 0, TAU); c.ellipse(-3, 16, 5, 3.6, 0.2, 0, TAU); c.fill(); }
  else if (air) { c.beginPath(); c.ellipse(-4, 13, 4.5, 3.5, 0.6, 0, TAU); c.ellipse(5, 12, 4.5, 3.5, -0.6, 0, TAU); c.fill(); }
  else { c.beginPath(); c.ellipse(-5, 15, 5, 3.5, 0, 0, TAU); c.ellipse(5, 15, 5, 3.5, 0, 0, TAU); c.fill(); }
  // 身體
  c.fillStyle = o.body;
  c.beginPath(); c.ellipse(0, 5, 10, 9.5, 0, 0, TAU); c.fill();
  c.fillStyle = o.band; c.fillRect(-9.5, 6, 19, 3);
  if (o.pat === 'stars') { c.fillStyle = '#ffe27a'; [[-4, 1], [4, 10], [5, 2]].forEach(([a, b]) => { c.beginPath(); c.arc(a, b, 1.3, 0, TAU); c.fill(); }); }
  if (o.pat === 'panda') { c.fillStyle = '#2b2b33'; c.beginPath(); c.ellipse(0, 4, 10, 4, 0, Math.PI, TAU); c.fill(); }
  // 手
  c.fillStyle = o.limb;
  if (onWall) { c.beginPath(); c.arc(-12, -2, 3.8, 0, TAU); c.arc(-11, 8, 3.6, 0, TAU); c.fill(); }
  else if (air) { c.beginPath(); c.arc(9, 0, 3.6, 0, TAU); c.arc(-8, 2, 3.6, 0, TAU); c.fill(); }

  let dt = (now - last) / 1000; last = now;
  if (!(dt > 0)) dt = 0;
  dt = Math.min(dt, 0.05);
  const steps = (window.__nc && window.__nc.speed) || 1;
  for (let i = 0; i < steps; i++) step(dt);
  draw();
  requestAnimationFrame(frame);
}

  if (scene === 'play') { updatePlay(dt); updateHint(); }
  else if (scene === 'title') updateDemo(dt);
  else if (scene === 'dying') {
    N.deadT += dt;
    N.vy -= GRAV * 0.8 * dt; N.x += N.vx * dt; N.y += N.vy * dt; N.rot += N.spin * dt;
    N.x = clamp(N.x, LX, RX);

  if (scene !== 'paused') {
    updateParts(dt);
    updateLabels(dt);

    '<div class="mpanel" style="box-shadow:none;background:#fff3dc">' + missionHTML() + '</div></div>' +
    '<div class="foot">' + toggleLabels() + '</div>' +
    '<div class="foot" style="padding-top:0"><button class="kg-btn gray" data-a="title">回標題</button><button class="kg-btn yellow" data-a="restart">重新開始</button><button class="kg-btn green" data-a="resume">繼續</button></div></div>');
  sfx('select');
}
function resumeGame() {
  if (scene !== 'paused') return;
  closeOv(); scene = 'play'; setPauseBtn(true); last = performance.now();
  if (KG.music) KG.music.resume();
  sfx('ui');
}
document.addEventListener('visibilitychange', () => { if (document.hidden && scene === 'play') pauseGame(); });
let reviveTimer = null;
function afterDeath() {
  if (scene !== 'dying') return;
  saveBank();
  if (!run.revived && bank >= 50) showRevive();
  else gameOver();
}
function showRevive() {
  scene = 'revive';
  let left = 5;
  const d = overlay('', '<div class="card"><h2>要復活嗎？</h2><div class="body">' +
    '<svg class="ring" viewBox="0 0 100 100"><circle cx="50" cy="50" r="42" fill="#fff3dc" stroke="#eadfca" stroke-width="10"/>' +
    '<circle id="rv" cx="50" cy="50" r="42" fill="none" stroke="#3fb86a" stroke-width="10" stroke-linecap="round" stroke-dasharray="264" stroke-dashoffset="0" transform="rotate(-90 50 50)"/>' +
    '<text id="rvn" x="50" y="62" text-anchor="middle" font-size="36" font-weight="900" fill="#3b3352">5</text></svg>' +
    '<div class="sub">花 <span class="coin"></span>50 金幣，從這裡繼續爬（每場一次）</div><div class="note">你有 <span class="coin"></span>' + bank + '</div></div>' +
    '<div class="foot"><button class="kg-btn gray" data-a="norevive">不用了</button><button class="kg-btn green" data-a="revive">復活！</button></div></div>');
  const t0 = performance.now();
  clearInterval(reviveTimer);
  reviveTimer = setInterval(() => {
    const el = (performance.now() - t0) / 1000;
    const rv = d.querySelector('#rv'), rn = d.querySelector('#rvn');
    if (rv) rv.setAttribute('stroke-dashoffset', String(264 * clamp(el / 5, 0, 1)));
    const nl = Math.max(0, Math.ceil(5 - el));
    if (rn && nl !== left) { left = nl; rn.textContent = String(nl); if (nl > 0) sfx('tick', { pitch: 1 + (5 - nl) * 0.05 }); }
    if (el >= 5) { clearInterval(reviveTimer); if (scene === 'revive') gameOver(); }
  }, 100);
  sfx('select');
}
function doRevive() {
  clearInterval(reviveTimer);
  if (bank < 50) return;
  bank -= 50; saveBank(); run.revived = true;
  closeOv();
  // 找一個安全的牆面
  let y = Math.max(camY + viewH * 0.4, run.maxY - 40), side = 0;
  for (let k = 0; k < 40; k++) {
    let ok = -1;
    for (const s of [0, 1]) if (solidAt(s, y) && !spikeHit(s, y) && !featAt(s, y, 'crumble') && !featAt(s, y, 'ice')) { ok = s; break; }
    if (ok >= 0) { side = ok; break; }
    y += 20;
  }
  hz = hz.filter((h) => h.k === 'blade' && Math.abs(h.y - y) > 200);
  N.state = 'wall'; N.side = side; N.x = wallX(side); N.y = y; N.vx = N.vy = 0; N.rot = 0; N.invuln = 2.5; N.sqx = 0.6; N.sqy = 1.3;
  camY = Math.min(camY, y - viewH * 0.4);
  scene = 'play'; setPauseBtn(true); last = performance.now();
  burst(N.x, N.y, 20, ['#ffffff', '#ffd84a', '#7bf0a0'], 300, 'star', 6, 0);
  musicGame();
  jingle(J_REVIVE); sfx('unlock');
  popLabel('復活！', '#7bf0a0');
}
function gameOver() {
  clearInterval(reviveTimer);
  scene = 'over'; setPauseBtn(false);
  const m = Math.floor(Math.max(0, run.maxY - GROUND) / UPM);
  const prev = run.bestAtStart;
  KG.best(SLUG, m);
  const isBest = m > prev && m > 0;
  mprog('climb', m);
  saveBank();
  overlay('', '<div class="card"><h2>' + (isBest ? '新紀錄！' : '摔下來了！') + '</h2><div class="body">' +
    '<div class="big">' + m + ' <span style="font-size:24px">公尺</span>' + (isBest ? '<span class="nb">最高</span>' : '') + '</div>' +
    '<div class="sub">最高紀錄 ' + bestM() + ' 公尺・到達「' + esc(zoneOf(run.maxY).name) + '」</div>' +
    '<div class="res"><span><span class="coin"></span>+' + run.coins + '</span><span><span class="scrollic"></span>' + run.scrolls + '</span><span>跳了 ' + run.jumps + ' 次</span></div>' +
    '<div class="note">金幣 <span class="coin"></span>' + bank + '，可以到商店買新衣服！</div>' +
    '<div class="mpanel" style="box-shadow:none;background:#fff3dc;margin-top:8px">' + missionHTML() + '</div></div>' +
    '<div class="foot"><button class="kg-btn gray" data-a="title">回標題</button><button class="kg-btn yellow" data-a="shop2">商店</button><button class="kg-btn green" data-a="restart">再玩一次</button></div></div>');
  if (isBest) { setTimeout(() => { jingle(J_BEST); KG.confetti(); }, 600); }
  setTimeout(() => { if (scene === 'over') musicTitle(); }, 1600);
}
let shopTab = 'o', shopFrom = 'title';
function showShop(from) {
  shopFrom = from || 'title';
  const tabs = '<div class="tabs"><button class="tab ' + (shopTab === 'o' ? 'on' : '') + '" data-a="tab-o">服裝</button><button class="tab ' + (shopTab === 't' ? 'on' : '') + '" data-a="tab-t">拖尾</button><button class="tab ' + (shopTab === 's' ? 'on' : '') + '" data-a="tab-s">技能</button></div>';
  let grid = '';
  if (shopTab === 'o') {
    grid = OUTFITS.map((o, i) => {
      const has = owned.o.includes(i), eq = outfitId === i;
      const btn = eq ? '<button class="kg-btn green sm" disabled>穿著中</button>' : has ? '<button class="kg-btn blue sm" data-a="eqo-' + i + '">穿上</button>' :
        '<button class="kg-btn yellow sm" data-a="buyo-' + i + '"' + (bank < o.price ? ' disabled' : '') + '><span class="coin"></span>' + o.price + '</button>';
      return '<div class="it' + (eq ? ' eq' : '') + '"><canvas data-o="' + i + '" width="152" height="152"></canvas><div class="nm">' + o.name + '</div>' + btn + '</div>';
    }).join('');
  } else if (shopTab === 't') {
    grid = TRAILS.map((t, i) => {
      const has = owned.t.includes(i), eq = trailId === i;
      const btn = eq ? '<button class="kg-btn green sm" disabled>使用中</button>' : has ? '<button class="kg-btn blue sm" data-a="eqt-' + i + '">使用</button>' :
        '<button class="kg-btn yellow sm" data-a="buyt-' + i + '"' + (bank < t.price ? ' disabled' : '') + '><span class="coin"></span>' + t.price + '</button>';
      return '<div class="it' + (eq ? ' eq' : '') + '"><canvas data-t="' + i + '" width="152" height="152"></canvas><div class="nm">' + t.name + '</div>' + btn + '</div>';
    }).join('');
  } else {
    const btn = owned.dj ? '<button class="kg-btn green sm" disabled>已學會</button>' : '<button class="kg-btn yellow sm" data-a="buydj"' + (bank < DJ_PRICE ? ' disabled' : '') + '><span class="coin"></span>' + DJ_PRICE + '</button>';
    grid = '<div class="it' + (owned.dj ? ' eq' : '') + '" style="grid-column:1/-1"><canvas data-s="dj" width="152" height="152"></canvas><div class="nm">二段跳</div>' +
      '<div class="note">在牆上往上滑：直直往上跳<br>在空中往上滑：再跳一次</div>' + btn + '</div>';
  }
  const d = overlay('shop', '<div class="card"><h2>忍者商店</h2><div class="wallet"><span class="coin"></span>' + bank + '</div>' + tabs +
    '<div class="body"><div class="grid">' + grid + '</div></div><div class="foot"><button class="kg-btn blue" data-a="shopback">返回</button></div></div>');
  d.querySelectorAll('canvas').forEach(drawPreviewCanvas);
}
function drawPreviewCanvas(c) {
  const g = c.getContext('2d');
  const w = c.width, h = c.height;
  g.clearRect(0, 0, w, h);
  const bg = g.createLinearGradient(0, 0, 0, h); bg.addColorStop(0, '#bfe3ff'); bg.addColorStop(1, '#eaf6ff');
  g.fillStyle = bg; g.beginPath(); g.arc(w / 2, h / 2, w / 2, 0, TAU); g.fill();
  if (c.dataset.o != null) {
    drawNinja(g, w / 2, h / 2 + 10, 3.2, OUTFITS[+c.dataset.o], { state: 'stand', side: 0, rot: 0, t: 0.3 });
  } else if (c.dataset.t != null) {
    const ti = +c.dataset.t;
    const pts = []; for (let i = 0; i < 12; i++) { const t = i / 11; pts.push([18 + t * 100, 112 - Math.sin(t * Math.PI) * 60 - t * 20]); }
    g.lineCap = 'round';
    if (ti === 0) { g.strokeStyle = 'rgba(255,255,255,0.95)'; g.lineWidth = 8; g.beginPath(); pts.forEach((p, i) => (i ? g.lineTo(p[0], p[1]) : g.moveTo(p[0], p[1]))); g.stroke(); g.strokeStyle = '#9fc6e6'; g.lineWidth = 2; g.stroke(); }
    else if (ti === 5) { ['#ff8a8a', '#ffc36a', '#fff07a', '#8fe39a', '#7ac4ff', '#b49cff'].forEach((col, ci) => { g.strokeStyle = col; g.lineWidth = 5; g.beginPath(); pts.forEach((p, i) => (i ? g.lineTo(p[0], p[1] + (ci - 2.5) * 4.5) : g.moveTo(p[0], p[1] + (ci - 2.5) * 4.5))); g.stroke(); }); }
    else {
      pts.forEach((p, i) => {
        const r = 4 + i * 0.6;
        if (ti === 1) { g.fillStyle = 'rgba(150,150,170,0.55)'; g.beginPath(); g.arc(p[0], p[1], r * 1.6, 0, TAU); g.fill(); }
        else if (ti === 2) { g.fillStyle = i % 2 ? '#ffd84a' : '#fff3a0'; starAt(g, p[0], p[1], r * 1.4); }
        else if (ti === 3) { g.fillStyle = i % 2 ? '#ff8fb1' : '#ffc1d6'; g.beginPath(); g.ellipse(p[0], p[1], r * 1.4, r * 0.8, i, 0, TAU); g.fill(); }
        else if (ti === 4) { g.fillStyle = ['#ffd84a', '#ff8a3a', '#ff5a3a'][i % 3]; starAt(g, p[0] + Math.sin(i) * 4, p[1], r); }
      });
    }
    const o = OUTFITS[outfitId] || OUTFITS[0];
    drawNinja(g, 122, 76, 2.0, o, { state: 'air', side: 0, rot: 0.4, t: 0.3 });
  } else {
    g.strokeStyle = 'rgba(255,255,255,0.9)'; g.lineWidth = 3; g.setLineDash([5, 6]);
    g.beginPath(); g.moveTo(40, 140); g.lineTo(40, 70); g.quadraticCurveTo(42, 40, 70, 30); g.stroke(); g.setLineDash([]);
    g.fillStyle = '#ffcf3a'; g.beginPath(); g.moveTo(76, 18); g.lineTo(92, 40); g.lineTo(60, 40); g.closePath(); g.fill();
    drawNinja(g, 80, 70, 2.4, OUTFITS[outfitId] || OUTFITS[0], { state: 'air', side: 0, rot: -0.2, t: 0.3 });
  }
}
function starAt(g, x, y, r) { g.beginPath(); for (let i = 0; i < 10; i++) { const rr = i % 2 ? r * 0.45 : r, a = i * Math.PI / 5 - Math.PI / 2; g.lineTo(x + Math.cos(a) * rr, y + Math.sin(a) * rr); } g.closePath(); g.fill(); }
function onAction(a, el) {
  if (a === 'start') startGame();
  else if (a === 'restart') { clearInterval(reviveTimer); startGame(); }
  else if (a === 'resume') resumeGame();
  else if (a === 'title') { clearInterval(reviveTimer); if (scene === 'paused' || scene === 'play') saveBank(); showTitle(); sfx('back'); }
  else if (a === 'shop') { showShop('title'); sfx('select'); }
  else if (a === 'shop2') { showShop('over'); sfx('select'); }
  else if (a === 'shopback') { sfx('back'); if (shopFrom === 'over') { showTitle(); } else showTitle(); }
  else if (a === 'revive') doRevive();
  else if (a === 'norevive') { sfx('back'); gameOver(); }
  else if (a === 'music') {
    if (KG.music) KG.music.setEnabled(!KG.music.isEnabled());
    sfx('ui'); refreshToggles();
  } else if (a === 'sfx') {
    sfxOn = !sfxOn; Save.set('sfx', sfxOn); if (sfxOn) sfx('ui'); refreshToggles();
  } else if (a.startsWith('tab-')) { shopTab = a.slice(4); sfx('click'); showShop(shopFrom); }
  else if (a.startsWith('buyo-') || a.startsWith('buyt-')) {
    const i = +a.slice(5), isO = a[3] === 'o', def = isO ? OUTFITS[i] : TRAILS[i];
    if (bank < def.price) { sfx('error'); return; }
    bank -= def.price; saveBank();
    if (isO) { owned.o.push(i); outfitId = i; Save.set('outfit', i); } else { owned.t.push(i); trailId = i; Save.set('trail', i); }
    Save.set('owned', owned);
    sfx('unlock'); KG.confetti(innerWidth / 2, innerHeight / 3, 60);
    showShop(shopFrom);
  } else if (a.startsWith('eqo-')) { outfitId = +a.slice(4); Save.set('outfit', outfitId); sfx('select'); showShop(shopFrom); }
  else if (a.startsWith('eqt-')) { trailId = +a.slice(4); Save.set('trail', trailId); sfx('select'); showShop(shopFrom); }
  else if (a === 'buydj') {
    if (bank < DJ_PRICE) { sfx('error'); return; }
    bank -= DJ_PRICE; saveBank(); owned.dj = true; Save.set('owned', owned);
    sfx('unlock'); KG.confetti(innerWidth / 2, innerHeight / 3, 60); showShop(shopFrom);
  }
  void el;
}
function refreshToggles() {
  if (!ovEl) return;
  const mOn = KG.music ? KG.music.isEnabled() : false;
  ovEl.querySelectorAll('[data-a="music"]').forEach((b) => { b.textContent = '音樂 ' + (mOn ? '開' : '關'); b.className = 'kg-btn sm ' + (mOn ? 'blue' : 'gray'); });
  ovEl.querySelectorAll('[data-a="sfx"]').forEach((b) => { b.textContent = '音效 ' + (sfxOn ? '開' : '關'); b.className = 'kg-btn sm ' + (sfxOn ? 'blue' : 'gray'); });
}

/* ---------- 尺寸 ---------- */
function resize() {
  const r = cv.getBoundingClientRect();
  W = r.width || innerWidth; H = r.height || innerHeight;
  dpr = Math.min(KG.lowEnd ? 1.5 : 2, window.devicePixelRatio || 1);
  cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
  S = Math.min(W / CW, H / 500);
  colX = (W - CW * S) / 2; viewH = H / S;
  buildSprites();
}
window.addEventListener('resize', resize);
window.addEventListener('orientationchange', () => setTimeout(resize, 120));
if (window.visualViewport) window.visualViewport.addEventListener('resize', resize);
window.addEventListener('pagehide', saveBank);

/* ---------- 測試掛鉤 ---------- */
window.__nc = {
  god: false, speed: 1,
  get scene() { return scene; }, get N() { return N; }, get run() { return run; }, get camY() { return camY; },
  get hz() { return hz; }, get feats() { return feats; }, get items() { return items; },
  setCoins(n) { bank = n; saveBank(); }, start: startGame, pause: pauseGame, resume: resumeGame,
  warp(m) { // 直接跳到某個高度
    const y = m * UPM + GROUND;
    feats = []; hz = []; items = []; winds = []; pend = [];
    N.y = y; N.x = LX; N.side = 0; N.state = 'wall'; camY = y - viewH * 0.35; genY = y + 200; run.maxY = y; run.zone = zoneIdx(y); started = true;
  },
  predict() {
    let x = N.x, y = N.y, vx = N.side === 0 ? JVX : -JVX, vy = JVY;
    for (let i = 0; i < 90; i++) { for (const w of winds) if (y > w.y0 && y < w.y1) vx += w.dir * 1100 / 60; vy -= GRAV / 60; x += vx / 60; y += vy / 60;
      if (x <= LX || x >= RX) { const s2 = x <= LX ? 0 : 1; return { s: s2, y, bad: !!(spikeHit(s2, y) || featAt(s2, y, 'crumble')) }; } }
    return null;
  },
  tap() { tap(); }, swipe() { doSwipe(); }, get winds() { return winds; }, get musicLayers() { return layerState; }, get tempo() { return tempoNow; },
  die() { die(false); }, spawn(kind) {
    if (kind === 'crow') pend.push({ k: 'crow', y: camY + viewH - 60, shots: 1 });
    if (kind === 'bird') pend.push({ k: 'bird', y: N.y + 150, dir: 1, sp: 150 });
    if (kind === 'barrel') { barrelT = 0; }
    if (kind && kind.startsWith('pu:')) items.push({ kind: 'pu', pu: kind.slice(3), x: N.x + (N.side ? -40 : 40), y: N.y, ph: 0 });
  }
};

resize();
loadMissions();
showTitle();
requestAnimationFrame((t) => { last = t; frame(t); });
})();
</script>
