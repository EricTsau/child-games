<body>
<div id="msg">3D 冰壺 載入中…</div>
<div id="stage">
  <canvas id="gl"></canvas>
  <canvas id="ui" aria-label="冰壺遊戲畫面"></canvas>
</div>
<div id="menu"></div>
<script src="../../assets/common.js"></script>
<script src="../../assets/kg-music.js"></script>
<script type="module">
import * as THREE from 'three';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

let renderer = null;
try {
  renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('gl'), antialias: true, powerPreference: 'high-performance' });
} catch (e) { renderer = null; }
if (!renderer) document.getElementById('msg').textContent = '這個遊戲需要支援 3D（WebGL）的瀏覽器，請換一個瀏覽器或裝置再試試看。';
else main();

function main() {
  const cv = document.getElementById('ui');
  const ctx = cv.getContext('2d');
  const menu = document.getElementById('menu');
  const FONT = '"Baloo 2","PingFang TC","Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif';
  const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
  const lerp = (a, b, t) => a + (b - a) * t;
  const TAU = Math.PI * 2;
  const ease = t => (t <= 0 ? 0 : t >= 1 ? 1 : t * t * (3 - 2 * t));

  /* =========================================================
   * 場地尺寸（公尺）。遊戲座標：x 左右、y 沿著冰道往前（投壺方向）
   * 3D 座標：(x, 高度, -y)
   * ========================================================= */
  const R = 0.16, HALF = 2.2, TEE = 28, HOUSE = 1.83, HOG = TEE - 6.4, BACK = TEE + HOUSE, BOARD = 31.8;
  const NEAR_TEE = -5.2, NEAR_HOG = 1.2, START_Y = 0, SHEET0 = -10.5;
  const FRIC = 0.85, CURL = 0.072, REST = 0.9, H = 1 / 240;
  const TEAM = [
    { name: '紅隊', s: '紅', hex: 0xe8424a, css: '#ff5560', dark: '#a8222b' },
    { name: '黃隊', s: '黃', hex: 0xffc228, css: '#ffcb3a', dark: '#b07d0a' }
  ];
  // 出手力道：0~0.72 細膩控制（守衛、進營），0.72~1 打擊
  const V0 = 5.6, V1 = 7.45, V2 = 11, PK = 0.72;
  const powerToV = p => (p <= PK ? V0 + (V1 - V0) * p / PK : V1 + (V2 - V1) * (p - PK) / (1 - PK));
  const vToPower = v => (v <= V1 ? clamp((v - V0) / (V1 - V0) * PK, 0, PK) : clamp(PK + (v - V1) / (V2 - V1) * (1 - PK), PK, 1));
  const pForDist = d => vToPower(Math.sqrt(2 * FRIC * d));
  const ZONES = [
    { a: pForDist(HOG + R - START_Y + 0.15), b: pForDist(TEE - HOUSE - START_Y + 0.1), name: '守衛', col: '#7fd0ff' },
    { a: pForDist(TEE - HOUSE - START_Y + 0.1), b: pForDist(BACK + 0.05 - START_Y), name: '進營', col: '#7be08f' },
    { a: PK, b: 1, name: '打擊', col: '#ff7b84' }
  ];

  /* =========================================================
   * 物理
   * ========================================================= */
  function adv(s, h, swp) {
    const v = Math.hypot(s.vx, s.vy);
    const nv = v - FRIC * (1 - 0.2 * swp) * h;
    if (nv <= 0.002) { s.vx = 0; s.vy = 0; s.moving = false; return false; }
    // 旋轉造成的側向彎曲：慢的時候彎得明顯，刷冰會讓它比較直
    const al = s.spin * CURL * (1 - 0.55 * swp) * v / (v + 0.8) * h;
    const ux = s.vx / v, uy = s.vy / v;
    const nx = s.vx + al * uy, ny = s.vy - al * ux, m = Math.hypot(nx, ny);
    s.vx = nx / m * nv; s.vy = ny / m * nv;
    s.x += s.vx * h; s.y += s.vy * h;
    s.rot += s.spin * h * (0.45 + Math.min(1.3, v * 0.3));
    return true;
  }
  // ev(kind, a, b, speed)：1 停下、2 出界、3 碰撞
  function physStep(arr, h, sw, ev) {
    let n = 0;
    for (let i = 0; i < arr.length; i++) {
      const s = arr[i];
      if (!s.inPlay || !s.moving) continue;
      if (!adv(s, h, s.swept ? sw : 0)) { if (ev) ev(1, s); continue; }
      n++;
      if (s.x > HALF - R || s.x < R - HALF || s.y - R > BACK) { s.inPlay = false; s.moving = false; if (ev) ev(2, s); }
    }
    if (!n) return 0;
    const D = 2 * R, D2 = D * D;
    for (let i = 0; i < arr.length; i++) {
      const a = arr[i];
      if (!a.inPlay || !a.moving) continue;
      for (let j = 0; j < arr.length; j++) {
        if (j === i) continue;
        const b = arr[j];
        if (!b.inPlay || (b.moving && j < i)) continue;
        const dx = b.x - a.x, dy = b.y - a.y;
        if (dx > D || dx < -D || dy > D || dy < -D) continue;
        const d2 = dx * dx + dy * dy;
        if (d2 >= D2 || d2 < 1e-10) continue;
        const d = Math.sqrt(d2), nx = dx / d, ny = dy / d, pen = (D - d) * 0.5;
        a.x -= nx * pen; a.y -= ny * pen; b.x += nx * pen; b.y += ny * pen;
        const rv = (a.vx - b.vx) * nx + (a.vy - b.vy) * ny;
        if (rv > 0) {
          const k = rv * (1 + REST) * 0.5;
          a.vx -= k * nx; a.vy -= k * ny; b.vx += k * nx; b.vy += k * ny;
          a.moving = b.moving = true; a.hit = b.hit = true;
          a.spin *= 0.3; b.spin = 0;
          if (ev) ev(3, a, b, rv);
        }
      }
    }
    return n;
  }
  const dTee = s => Math.hypot(s.x, s.y - TEE);
  const inHouse = s => s.inPlay && dTee(s) <= HOUSE + R;
  const inFGZ = s => s.inPlay && s.y > HOG && s.y < TEE && dTee(s) > HOUSE + R;

  /* =========================================================
   * 冰壺
   * ========================================================= */
  function mkStone(i, team) {
    return { i, team, x: 0, y: 0, vx: 0, vy: 0, spin: 0, rot: 0, inPlay: false, inHand: false, moving: false, hit: false, swept: false, used: false, out: 0 };
  }
  const stones = [];
  for (let i = 0; i < 16; i++) stones.push(mkStone(i, i < 8 ? 0 : 1));
  const sim = [];
  for (let i = 0; i < 16; i++) sim.push(mkStone(i, i < 8 ? 0 : 1));
  const tmpS = mkStone(-1, 0);
  const snap = [];
  for (let i = 0; i < 16; i++) snap.push({ x: 0, y: 0, inPlay: false, rot: 0 });

  function traceAlone(v, th, spin, stopY) {
    const s = tmpS;
    s.x = 0; s.y = START_Y; s.vx = v * Math.sin(th); s.vy = v * Math.cos(th); s.spin = spin; s.moving = true;
    for (let k = 0; k < 50 / H; k++) {
      if (!adv(s, H, 0)) break;
      if (stopY != null && s.y >= stopY) break;
    }
    return s;
  }
  function solveDraw(tx, ty, spin) {
    let v = Math.sqrt(2 * FRIC * (ty - START_Y)), th = 0;
    for (let it = 0; it < 4; it++) {
      const r = traceAlone(v, th, spin);
      v *= Math.sqrt((ty - START_Y) / Math.max(1, r.y - START_Y));
      th += Math.atan((tx - r.x) / (ty - START_Y));
    }
    return { v, th };
  }
  function solveHit(tx, ty, v, spin) {
    let th = 0;
    for (let it = 0; it < 3; it++) {
      const r = traceAlone(v, th, spin, ty);
      th += Math.atan((tx - r.x) / (ty - START_Y));
    }
    return th;
  }

  /* =========================================================
   * 遊戲狀態
   * ========================================================= */
  const OPTS_KEY = 'curling:opts';
  const opts = Object.assign({ ai: 2, ends: 4, per: 4, fgz: false, assist: 1 }, KG.store.get(OPTS_KEY, {}));
  const stats = Object.assign({ w: [0, 0, 0], l: [0, 0, 0] }, KG.store.get('curling:stats', {}));
  const chStars = KG.store.get('curling:stars', []);
  let sfxOn = KG.store.get('curling:sfx', true) !== false;

  const G = {
    mode: 'title', phase: 'title', t: 0, paused: false, aiLevel: 2, ends: 4, per: 4, fgz: false,
    end: 1, score: [0, 0], endPts: [[], []], hammer: 1, n: 0, cur: null, extra: 0,
    ch: null, plan: null, job: null, lastEnd: null, msg: ''
  };
  const aim = { p: 0.5, th: 0, spin: 1, dirty: true, shown: false };
  let sweepAmt = 0, sweepHold = false, brushPhase = 0, strokeT = 0, aiSweep = 0, clock = 0, shake = 0, crowdCheer = 0;
  let touchUsed = false, firstAimHint = !KG.store.get('curling:seenHint', false);
  const floats = [];
  let banner = null;

  const isHuman = team => G.mode === '2p' || G.mode === 'challenge' || (G.mode === 'ai' && team === 0);
  const throwTeam = n => (G.mode === 'challenge' ? 1 : (n % 2 === 0 ? 1 - G.hammer : G.hammer));
  const left = team => { let c = 0; for (let i = team * 8; i < team * 8 + G.per; i++) if (!stones[i].used) c++; return c; };
  const inGame = () => G.mode !== 'title' && G.phase !== 'title';

  /* =========================================================
   * 音效與音樂
   * ========================================================= */
  const lastSnd = {};
  function sfx(name, o) {
    if (!sfxOn) return;
    const now = performance.now();
    if (lastSnd[name] && now - lastSnd[name] < 40) return;
    lastSnd[name] = now;
    try { KG.sfx.play(name, o); } catch (e) { /* 忽略 */ }
  }
  const vary = (a) => 1 + (Math.random() - 0.5) * (a || 0.08);
  KG.sfx.define('clack', (p, s) => {
    s.noise(0.05, { vol: 0.42, freq: 2300 * p, q: 2.6 });
    s.tone(1180 * p, 0.07, { type: 'triangle', vol: 0.16, slide: 860 * p });
    s.tone(200 * p, 0.11, { vol: 0.32, slide: 110 });
  });
  KG.sfx.define('brush', (p, s) => {
    s.noise(0.12, { vol: 0.15, freq: 3400 * p, sweep: 1500 * p, q: 0.9, attack: 0.025 });
    s.noise(0.08, { vol: 0.06, freq: 800 * p, q: 1.2, attack: 0.02, type: 'bandpass' });
  });
  KG.sfx.define('release', (p, s) => {
    s.noise(0.4, { vol: 0.14, freq: 700 * p, sweep: 260, type: 'lowpass', q: 0.8, attack: 0.03 });
    s.tone(120 * p, 0.22, { vol: 0.22, slide: 70 });
  });
  KG.sfx.define('ooh', (p, s) => {
    s.noise(1.15, { vol: 0.2, freq: 330 * p, sweep: 560 * p, q: 4, attack: 0.28 });
    s.noise(1.05, { vol: 0.11, freq: 820 * p, sweep: 1050 * p, q: 5, attack: 0.32 });
  });
  KG.sfx.define('aww', (p, s) => {
    s.noise(1.0, { vol: 0.18, freq: 820 * p, sweep: 330 * p, q: 3.5, attack: 0.15 });
    s.noise(0.9, { vol: 0.08, freq: 1500 * p, sweep: 700 * p, q: 4, attack: 0.18 });
  });
  KG.sfx.define('cheer', (p, s) => {
    s.noise(1.9, { vol: 0.16, freq: 1300 * p, q: 0.6, attack: 0.14 });
    s.noise(1.6, { vol: 0.12, freq: 620 * p, sweep: 880 * p, q: 2, attack: 0.2 });
    for (let i = 0; i < 12; i++) s.noise(0.03, { vol: 0.07 + Math.random() * 0.05, freq: 1600 + Math.random() * 1200, q: 2, delay: 0.08 + i * 0.1 + Math.random() * 0.06 });
  });
  KG.sfx.define('outthud', (p, s) => {
    s.tone(130 * p, 0.18, { vol: 0.3, slide: 60 });
    s.noise(0.12, { vol: 0.16, freq: 600 * p, type: 'lowpass' });
  });
  KG.sfx.define('tick2', (p, s) => { s.tone(1500 * p, 0.03, { type: 'triangle', vol: 0.07 }); });
  KG.sfx.define('chime', (p, s) => {
    s.tone(784 * p, 0.25, { type: 'sine', vol: 0.12 });
    s.tone(1175 * p, 0.35, { type: 'sine', vol: 0.09, delay: 0.08 });
  });

  // 背景音樂：慵懶 lo-fi 爵士（84 bpm，搖擺 0.18）
  const VO = { C: 'B3+E4+G4', Am: 'C4+E4+G4', Dm: 'C4+F4+A4', G: 'B3+D4+F4', F: 'A3+C4+E4', Em: 'G3+B3+D4' };
  const comp = (v, pat) => pat.replace(/V/g, v);
  const SONG_TITLE = {
    bpm: 84, steps: 16, swing: 0.18,
    chords: ['Cmaj7', 'Am7', 'Dm7', 'G7', 'Cmaj7', 'Am7', 'Dm7', 'G7'],
    tracks: [
      { inst: 'kick', pat: ['X.........x.....', 'X.........x..o..'], vol: 0.81 },
      { inst: 'snare', pat: ['....o.......o...', '....o.......o..o'], vol: 1.00 },
      { inst: 'shaker', pat: 'x.o.x.o.x.o.x.oo', vol: 1.00 },
      { inst: 'hat', pat: '..o...o...o...o.', vol: 0.72 },
      { inst: 'bass', chord: ['R-----..5---.7..', 'R-----..5---.3..'], vol: 0.78 },
      { inst: 'organ', chord: 'hold', oct: 4, vol: 0.34 },
      { inst: 'kalimba', seq: [VO.C, VO.Am, VO.Dm, VO.G, VO.C, VO.Am, VO.Dm, VO.G].map(v => comp(v, '. V - . . V . .')), vol: 0.81 },
      { inst: 'flute', vol: 1.00, seq: [
        'E5 - - D5 E5 - G5 -',
        'C5 - - - . . A4 C5',
        'D5 - - C5 D5 - F5 -',
        'B4 - - - . . G4 B4',
        'E5 - - D5 E5 - G5 -',
        'A5 - G5 - E5 - C5 -',
        'F5 - E5 - D5 - C5 -',
        'D5 - - - B4 - . .'
      ] }
    ]

    cv.width = Math.round(W * dpr); cv.height = Math.round(Hh * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    applyQuality();
    camera.aspect = W / Hh;
    camera.updateProjectionMatrix();
    updateCamera(0, true);
  }

  /* ---------- 自動畫質 ---------- */
  const QKEY = 'quality:' + location.pathname.split('/').filter(Boolean).slice(-1)[0];
  const baseRatio = Math.min(window.devicePixelRatio || 1, small ? 1.75 : 2);
  const QL = [
    { ratio: baseRatio, mirror: true, crowd: true },
    { ratio: Math.min(baseRatio, 1.4), mirror: true, crowd: true },
    { ratio: 1, mirror: true, crowd: true },
    { ratio: 1, mirror: false, crowd: true },
    { ratio: 0.8, mirror: false, crowd: false }
  ];
  let qLevel = clamp(KG.store.get(QKEY, KG.lowEnd ? 2 : 0) | 0, 0, QL.length - 1);
  const perf = { last: 0, n: 0, sum: 0, cool: 3 };
  function applyQuality() {
    const q = QL[qLevel];
    renderer.setPixelRatio(q.ratio);
    renderer.setSize(W, Hh, false);
    crowdRows.forEach(m => { m.visible = q.crowd || m.position.z < -BOARD; });
    glows.visible = q.mirror; boardsM.visible = q.mirror;
  }
  function renderFrame() {
    renderer.render(scene, camera);
    const now = performance.now(), dt = perf.last ? Math.min(0.5, (now - perf.last) / 1000) : 0;
    perf.last = now;
    if (document.hidden || qLevel >= QL.length - 1) return;
    perf.cool -= dt;
    if (perf.cool > 0) return;
    perf.sum += dt; perf.n++;
    if (perf.n >= 60) {
      if (perf.sum / perf.n > 1 / 45) {
        qLevel++;
        KG.store.set(QKEY, qLevel);
        applyQuality();
        perf.cool = 1.5;
      }
      perf.n = 0; perf.sum = 0;
    }
  }

  /* =========================================================
   * 對局流程
   * ========================================================= */
  function resetStones() {
    for (const s of stones) { s.inPlay = false; s.inHand = false; s.moving = false; s.used = false; s.hit = false; s.swept = false; s.out = 0; s.vx = s.vy = 0; s.spin = 0; }
    HL.length = 0;
  }
  function showBanner(title, sub, col, dur) { banner = { t: 0, title, sub: sub || '', col: col || '#ffffff', dur: dur || 1.8 }; }
  function addFloat(x, y, text, color, size) { floats.push({ x, y, text, color, size: size || 22, life: 1.4 }); }

  function startMatch(mode) {
    hideMenu();
    ensureLoops();
    G.mode = mode;
    G.aiLevel = opts.ai; G.ends = opts.ends; G.per = opts.per; G.fgz = opts.fgz;
    G.end = 1; G.score = [0, 0]; G.endPts = [[], []]; G.extra = 0; G.paused = false;
    G.hammer = mode === 'ai' ? 0 : 1;
    rp.n = 0; rp.cur = -1;
    KG.music.play(SONG_GAME, { restart: true });
    setMusicLayer('tense', false); setMusicLayer('sweep', false);
    startEnd();
  }
  function startEnd() {
    resetStones();
    G.n = 0;
    try { KG.music.setTempo(G.end >= G.ends ? 1.05 : 1); } catch (e) { /* 忽略 */ }
    const nm = G.extra && G.end > G.ends - G.extra ? '延長賽' : '第 ' + G.end + ' 局';
    showBanner(nm, TEAM[G.hammer].name + '擁有最後一壺（後手）', '#ffffff', 2);
    sfx('chime');
    nextTurn(true);
  }
  function nextTurn(first) {
    HL.length = 0;
    if (G.mode !== 'challenge' && G.n >= G.per * 2) { scoreEnd(); return; }
    const team = throwTeam(G.n);
    let s = null;
    for (let i = team * 8; i < team * 8 + 8; i++) if (!stones[i].used && !stones[i].inPlay) { s = stones[i]; break; }
    if (!s) { scoreEnd(); return; }
    s.used = true; s.inHand = true; s.inPlay = false; s.moving = false; s.hit = false; s.swept = false; s.out = 0;
    s.x = 0; s.y = START_Y; s.vx = s.vy = 0; s.spin = 0; s.rot = 0;
    G.cur = s;
    aim.dirty = true; aim.shown = !touchUsed;
    if (G.mode !== 'challenge') { aim.th = 0; }
    cam.mode = 'aim';
    sweepAmt = 0; aiSweep = 0;
    const lastTwo = G.mode !== 'challenge' && G.n >= G.per * 2 - 2;
    setMusicLayer('tense', lastTwo);
    if (isHuman(team)) {
      G.phase = 'aim'; G.t = 0;
      if (!first) {
        if (G.mode === '2p') showBanner('輪到' + TEAM[team].name, '請把裝置交給' + TEAM[team].s + '隊的玩家', TEAM[team].css, 1.6);
        else if (G.mode === 'ai') showBanner('你的回合', '第 ' + (G.per - left(team)) + ' 壺 / ' + G.per, TEAM[team].css, 1.2);
        sfx('ui', { pitch: team ? 1.12 : 1 });
      }
    } else {
      G.phase = 'think'; G.t = 0; G.plan = null; G.job = null;
      if (!first) showBanner('電腦回合', ['', '簡單', '普通', '困難'][G.aiLevel] + '電腦正在思考…', TEAM[team].css, 1.2);
      sfx('ui', { pitch: 0.9 });
    }
  }

  function snapshot() { for (let i = 0; i < 16; i++) { const s = stones[i], o = snap[i]; o.x = s.x; o.y = s.y; o.inPlay = s.inPlay; o.rot = s.rot; } }
  function throwV(v, th, spin) {
    const s = G.cur;
    if (!s || !s.inHand) return;
    snapshot();
    s.inHand = false; s.inPlay = true; s.moving = true; s.swept = true; s.hit = false;
    s.vx = v * Math.sin(th); s.vy = v * Math.cos(th); s.spin = spin;
    G.phase = 'throw'; G.t = 0; G.throwV = v;
    cam.mode = 'follow'; cam.focus = s;
    sweepAmt = 0; aiSweep = 0; aiWant = false; aiCheckT = 0;
    rp.n = 0; rp.cur = s.i; rp.acc = 0; rp.team = s.team; recordFrame();
    sfx('release', { pitch: vary() });
    emit(s.x, s.y - 0.1, 0.05, 10, 0.8, FROST, 0.4);
    setMusicLayer('sweep', true);
    if (firstAimHint && isHuman(s.team)) { firstAimHint = false; KG.store.set('curling:seenHint', true); }
    physAcc = 0;
  }
  function throwHuman() {
    if (G.phase !== 'aim' || !G.cur || !isHuman(G.cur.team)) return;
    throwV(powerToV(aim.p), aim.th, aim.spin);
  }
  function recordFrame() {
    if (rp.n >= RP_MAX) return;
    const o = rp.n * 64;
    for (let i = 0; i < 16; i++) {
      const s = stones[i];
      rp.data[o + i * 4] = s.x; rp.data[o + i * 4 + 1] = s.y; rp.data[o + i * 4 + 2] = s.rot;
      rp.data[o + i * 4 + 3] = s.inPlay || s.inHand ? 1 : s.out > 0 ? s.out : 0;
    }
    rp.n++;
  }

  let lastOoh = 0;
  function gameEv(kind, a, b, rv) {
    if (kind === 3) {
      const vol = clamp(rv / 3.2, 0.12, 1.1);
      const sx = clamp(((a.x + b.x) / 2) / HALF, -1, 1) * 0.5;
      sfx('clack', { vol, pitch: vary(0.1) * (rv > 3 ? 1.05 : 0.95), pan: sx });
      const mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2;
      emit(mx, my, 0.06, Math.min(16, 4 + Math.round(rv * 3)), 0.6 + rv * 0.25, rv > 2.5 ? GOLD : WHITE, 0.8);
      if (rv > 1.6) shake = Math.max(shake, Math.min(0.9, rv * 0.18));
      KG.vibrate(Math.min(60, 10 + rv * 10));
      if (rv > 2.2 && clock - lastOoh > 1.2) { lastOoh = clock; sfx('ooh', { pitch: vary(0.1), vol: 0.9 }); crowdCheer = Math.max(crowdCheer, 0.6); }
    } else if (kind === 2) {
      a.out = 1;
      sfx('outthud', { pitch: vary(), vol: 0.7 });
      emit(a.x, a.y, 0.08, 12, 0.9, FROST, 0.9);
    }
  }

  function removeStone(s) { s.inPlay = false; s.moving = false; s.out = 1; emit(s.x, s.y, 0.06, 12, 0.7, FROST, 0.9); }

  function settle() {
    const s = G.cur;
    G.msg = '';
    let violation = false;
    if (s.inPlay && !s.hit && s.y <= HOG + R) {
      removeStone(s); sfx('wrong', { vol: 0.8 });
      addFloat(s.x, s.y, '沒過前衛線！', '#ffb0b0', 20);
      G.msg = 'hog';
    }
    // 自由防守區
    const lim = G.per === 8 ? 4 : 2;
    if (G.mode !== 'challenge' && G.fgz && G.n < lim) {
      const opp = 1 - s.team;
      for (let i = 0; i < 16; i++) {
        const o = snap[i], st = stones[i];
        if (st.team !== opp || !o.inPlay) continue;
        const wasG = o.y > HOG && o.y < TEE && Math.hypot(o.x, o.y - TEE) > HOUSE + R;
        if (wasG && !st.inPlay) { violation = true; break; }
      }
      if (violation) {
        for (let i = 0; i < 16; i++) { const o = snap[i], st = stones[i]; if (st === s) continue; st.x = o.x; st.y = o.y; st.inPlay = o.inPlay; st.out = 0; st.vx = st.vy = 0; st.moving = false; }
        if (s.inPlay) removeStone(s);
        showBanner('違反自由防守區規則', '前幾壺不能打掉對手的守衛壺，位置已恢復', '#ffb0b0', 2.4);
        sfx('wrong');
      }
    }
    // 觀眾反應
    if (!violation && G.msg !== 'hog') {
      let removedOpp = 0, inH = s.inPlay && inHouse(s);
      for (let i = 0; i < 16; i++) if (snap[i].inPlay && !stones[i].inPlay && stones[i].team !== s.team) removedOpp++;
      if (removedOpp > 0 || (inH && dTee(s) < 0.45)) { sfx('cheer', { pitch: vary(0.08), vol: 0.85 }); crowdCheer = 1; }
      else if (!s.inPlay && G.throwV > 7.6 && removedOpp === 0) { sfx('aww', { pitch: vary(0.08), vol: 0.8 }); }
      if (inH && dTee(s) < 0.3) addFloat(s.x, s.y, '正中紅心！', '#ffe27e', 24);
      else if (removedOpp >= 2) addFloat(s.x, s.y + 0.6, '雙殺！', '#ffe27e', 26);
      else if (removedOpp === 1) addFloat(s.x, s.y + 0.6, '打出去了！', '#ffffff', 22);
    }
    setMusicLayer('sweep', false);
    G.phase = 'settle'; G.t = 0;
    cam.mode = 'house';
    // 挑戰模式判斷
    if (G.mode === 'challenge') checkChallenge();
    else markCounting();
  }
  function afterSettle() {
    if (G.mode === 'challenge') return;
    G.n++;
    nextTurn(false);
  }
  function countEnd(arr) {
    const L = [];
    for (const s of arr) if (s.inPlay && dTee(s) <= HOUSE + R) L.push(s);
    L.sort((a, b) => dTee(a) - dTee(b));
    if (!L.length) return { team: -1, pts: 0, list: L };
    const t = L[0].team;
    let k = 0;
    while (k < L.length && L[k].team === t) k++;
    return { team: t, pts: k, list: L.slice(0, k) };
  }
  function markCounting() {
    HL.length = 0;
    const r = countEnd(stones);
    r.list.forEach(s => HL.push({ x: s.x, y: s.y, c: TEAM[s.team].hex, s: 1 }));
  }
  function scoreEnd() {
    const r = countEnd(stones);
    G.lastEnd = r;
    const ei = G.end - 1;
    G.endPts[0][ei] = r.team === 0 ? r.pts : 0;
    G.endPts[1][ei] = r.team === 1 ? r.pts : 0;
    if (r.team >= 0) { G.score[r.team] += r.pts; G.hammer = 1 - r.team; }
    HL.length = 0;
    r.list.forEach(s => HL.push({ x: s.x, y: s.y, c: 0xffe066, s: 1.15 }));
    G.phase = 'endshow'; G.t = 0;
    cam.mode = 'endshow';
    setMusicLayer('tense', false);
    if (r.team >= 0) {
      showBanner(TEAM[r.team].name + ' 得 ' + r.pts + ' 分！', (G.extra && G.end > G.ends - G.extra ? '延長賽' : '第 ' + G.end + ' 局') + '結束', TEAM[r.team].css, 2.6);
      playJ('end'); sfx('cheer', { vol: 0.8 }); crowdCheer = 1;
    } else {
      showBanner('空局', '沒有壺在大本營裡，後手不變', '#ffffff', 2.6);
      playJ('blank');
    }
  }
  function endCard() {
    G.phase = 'endcard';
    const r = G.lastEnd;
    const last = G.end >= G.ends && G.score[0] !== G.score[1];
    const tooLong = G.end >= G.ends && G.extra >= 2 && G.score[0] === G.score[1];
    let res;
    if (r.team >= 0) res = '<span style="color:' + TEAM[r.team].dark + '">' + TEAM[r.team].name + '</span> 這局得 ' + r.pts + ' 分';
    else res = '空局，沒有隊伍得分';
    showMenu('<div class="panel"><h2>' + (G.extra && G.end > G.ends - G.extra ? '延長賽結束' : '第 ' + G.end + ' 局結束') + '</h2>' +
      '<div class="sub" style="font-size:18px;color:#1d3150">' + res + '</div>' + boardHTML() +
      '<button class="btn grn" data-act="' + (last || tooLong ? 'final' : 'nextend') + '">' + (last || tooLong ? '看比賽結果' : (G.end >= G.ends ? '進入延長賽' : '下一局')) + '</button></div>');
  }
  function boardHTML() {
    const N = Math.max(G.ends, G.endPts[0].length);
    let h = '<div class="wrapx"><table class="sb"><tr><th></th>';
    for (let i = 0; i < N; i++) h += '<th>' + (i < G.ends - G.extra ? i + 1 : '延') + '</th>';
    h += '<th>總分</th></tr>';
    for (let t = 0; t < 2; t++) {
      h += '<tr class="' + (t ? 'y' : 'r') + '"><td class="tm">' + teamLabel(t) + '</td>';
      for (let i = 0; i < N; i++) { const v = G.endPts[t][i]; h += '<td class="' + (v > 0 ? 'hi' : '') + '">' + (v == null ? '' : v) + '</td>'; }
      h += '<td class="tot">' + G.score[t] + '</td></tr>';
    }
    return h + '</table></div>';
  }
  const teamLabel = t => (G.mode === 'ai' ? (t === 0 ? '紅隊（你）' : '黃隊（電腦）') : TEAM[t].name);
  function nextEnd() {
    hideMenu();
    if (G.end >= G.ends) { G.ends++; G.extra++; }
    G.end++;
    startEnd();
  }
  function gameOver() {
    G.phase = 'over';
    KG.music.stop(0.3);
    const a = G.score[0], b = G.score[1];
    let title, sub = '', good = true;
    if (G.mode === 'ai') {
      const lv = G.aiLevel - 1;
      if (a > b) { title = '你贏了！'; stats.w[lv]++; }
      else if (a < b) { title = '電腦獲勝'; good = false; stats.l[lv]++; }
      else { title = '平手！'; }
      KG.store.set('curling:stats', stats);
      const margin = a - b;
      const best = KG.best('curling-ai' + G.aiLevel, margin);
      sub = ['', '簡單', '普通', '困難'][G.aiLevel] + '電腦　戰績 ' + stats.w[lv] + ' 勝 ' + stats.l[lv] + ' 敗' + (best != null && best > 0 ? '　最大分差 +' + best : '');
      if (a > b && best === margin) sub += '　★ 新紀錄！';
    } else {
      if (a === b) title = '平手！';
      else title = TEAM[a > b ? 0 : 1].name + '獲勝！';
      sub = '雙人同樂　' + a + '：' + b;
    }
    if (good) { playJ('win'); setTimeout(() => KG.confetti(), 200); sfx('cheer'); crowdCheer = 1; } else playJ('lose');
    showMenu('<div class="panel"><div class="bigres" style="color:' + (good ? '#1f5fae' : '#8a4a55') + '">' + title + '</div>' +
      '<div class="sub">' + sub + '</div>' + boardHTML() +
      '<div class="row2"><button class="btn grn" data-act="again">再玩一次</button><button class="btn ghost" data-act="home">主選單</button></div></div>');
  }

  /* =========================================================
   * 挑戰模式
   * ========================================================= */
  const CH = [
    { name: '進營練習', desc: '把黃壺停在大本營（藍色大圓圈）裡面。力道拉到「進營」區就對了！', st: [], goal: () => stones.some(s => s.team === 1 && inHouse(s)) },
    { name: '打掉紅壺', desc: '用力撞！把紅壺打出大本營。力道拉到「打擊」區。', st: [[0, 0, TEE]], goal: () => !stones.some(s => s.team === 0 && inHouse(s)) },
    { name: '放守衛壺', desc: '把黃壺停在大本營前方、前衛線之後的守衛區（不能進大本營）。', st: [], goal: () => stones.some(s => s.team === 1 && inFGZ(s) && Math.abs(s.x) < 1.2) },
    { name: '命中紅心', desc: '把黃壺停在中間的紅色小圈裡。記得用刷冰來微調距離！', st: [], goal: () => stones.some(s => s.team === 1 && s.inPlay && dTee(s) <= 0.61 + R * 0.5) },
    { name: '繞過守衛', desc: '前面有紅色守衛壺擋路。瞄偏一點，用旋轉讓壺彎進大本營！', st: [[0, 0, TEE - 3.4]], goal: () => G.cur && inHouse(G.cur) },
    { name: '打擊留住', desc: '把紅壺打出大本營，而且你的黃壺要留在大本營裡。', st: [[0, 0.3, TEE + 0.2]], goal: () => !stones.some(s => s.team === 0 && inHouse(s)) && G.cur && inHouse(G.cur) },
    { name: '推進', desc: '輕輕撞你自己的黃色守衛壺，把它推進大本營裡！', st: [[1, 0, TEE - 3.2]], goal: () => inHouse(stones[8]) },
    { name: '穿越縫隙', desc: '兩顆紅壺中間有一條小縫，穿過去停在大本營的白圈以內！', st: [[0, -0.43, TEE - 3.3], [0, 0.43, TEE - 3.3]], goal: () => G.cur && G.cur.inPlay && dTee(G.cur) <= 1.22 + R },
    { name: '雙殺', desc: '一壺把兩顆紅壺都打出大本營！瞄準其中一顆的側邊。', st: [[0, -0.42, TEE - 0.45], [0, 0.5, TEE + 0.55]], goal: () => !stones.some(s => s.team === 0 && inHouse(s)) },
    { name: '最後一壺', desc: '最後一壺！讓黃隊這局拿到 3 分以上。先想想要打掉哪一顆？', st: [[0, 0, TEE + 0.05], [0, 1.1, TEE - 1.4], [1, -0.75, TEE + 0.3], [1, 0.55, TEE + 0.85], [1, -0.4, TEE + 1.35]], goal: () => { const r = countEnd(stones); return r.team === 1 && r.pts >= 3; } }
  ];
  const TRIES = 3;
  function loadLayout(lv) {
    resetStones();
    const used = [0, 8];
    CH[lv].st.forEach(p => { const s = stones[used[p[0]]++]; s.inPlay = true; s.used = true; s.x = p[1]; s.y = p[2]; s.rot = Math.random() * TAU; });
  }
  function startChallenge(lv) {
    hideMenu();
    ensureLoops();
    G.mode = 'challenge'; G.per = 8; G.paused = false;
    G.ch = { lv, attempt: 1 };
    rp.n = 0; rp.cur = -1;
    aim.p = 0.5; aim.th = 0; aim.spin = 1;
    KG.music.play(SONG_GAME, { restart: true });
    setMusicLayer('tense', lv >= 7); setMusicLayer('sweep', false);
    loadLayout(lv);
    G.n = 0;
    showBanner('挑戰 ' + (lv + 1) + '：' + CH[lv].name, CH[lv].desc, '#ffffff', 3.2);
    sfx('chime');
    nextTurn(true);
  }
  function checkChallenge() {
    const c = CH[G.ch.lv];
    const ok = c.goal();
    G.ch.ok = ok;
    if (ok) { sfx('cheer'); crowdCheer = 1; }
  }
  function challengeAfter() {
    const c = G.ch;
    if (c.ok) {
      const stars = TRIES + 1 - c.attempt;
      const prev = chStars[c.lv] || 0;
      if (stars > prev) { chStars[c.lv] = stars; KG.store.set('curling:stars', chStars); }
      const total = chStars.reduce((a, b) => a + (b || 0), 0);
      KG.best('curling-challenge', total);
      G.phase = 'chres';
      KG.music.stop(0.3);
      playJ('clear'); KG.confetti();
      let st = '';
      for (let i = 0; i < 3; i++) st += i < stars ? '★' : '<i>★</i>';
      const hasNext = c.lv < CH.length - 1;
      showMenu('<div class="panel"><div class="bigres" style="color:#1f5fae">挑戰成功！</div><div class="stars">' + st + '</div>' +
        '<div class="sub">挑戰 ' + (c.lv + 1) + '：' + CH[c.lv].name + '　第 ' + c.attempt + ' 次就成功' + (stars > prev && prev ? '　★ 新紀錄！' : '') + '</div>' +
        (hasNext ? '<button class="btn grn" data-act="chgo" data-v="' + (c.lv + 1) + '">下一關</button>' : '<div class="sub" style="color:#b07400">全部挑戰完成，你是冰壺高手！</div>') +
        '<div class="row2"><button class="btn ghost" data-act="chgo" data-v="' + c.lv + '">再玩一次</button><button class="btn ghost" data-act="chlist">關卡列表</button></div></div>');
    } else if (c.attempt < TRIES) {
      c.attempt++;
      loadLayout(c.lv);
      showBanner('再試一次！', '還剩 ' + (TRIES - c.attempt + 1) + ' 次機會', '#ffe27e', 1.6);
      sfx('back');
      G.n++;
      nextTurn(true);
    } else {
      G.phase = 'chres';

  cv.addEventListener('pointermove', e => {
    const [x, y] = local(e);
    if (drag && drag.id === e.pointerId) {
      drag.moved += Math.hypot(x - drag.x, y - drag.y);
      drag.x = x; drag.y = y;
      dragAim(x, y);
      return;
    }
    if (lastRub && canSweep() && (e.buttons || e.pointerType !== 'mouse')) {
      rubAcc += Math.hypot(x - lastRub[0], y - lastRub[1]);
      lastRub = [x, y];
      if (rubAcc > 38) { rubAcc = 0; stroke(); }
    }
  });
  function endPointer(e) {
    if (activeHit) {
      const [x, y] = local(e);
      const h = findHit(x, y);
      if (h && h.id === activeHit.id) h.fn();
      activeHit = null;
      return;
    }
    lastRub = null;
    if (drag && drag.id === e.pointerId) {
      const d = drag;
      drag = null;
      if (G.phase !== 'aim') return;
      if (aim.p < 0.03 || d.moved < 12) { if (d.moved >= 12) { KG.toast('再往下拉長一點才會投出喔'); sfx('back'); } return; }
      throwHuman();
    }
  }
  cv.addEventListener('pointerup', endPointer);
  cv.addEventListener('pointercancel', () => { drag = null; activeHit = null; lastRub = null; });
  window.addEventListener('keydown', e => {
    const k = e.key;
    if (k === 'p' || k === 'P' || k === 'Escape') { if (G.paused) resumeGame(); else pauseGame(); return; }
    if (!inGame() || G.paused) return;
    const human = G.cur && isHuman(G.cur.team);
    if (G.phase === 'aim' && human) {
      if (k === 'ArrowLeft' || k === 'a' || k === 'A') { aim.th = clamp(aim.th - 0.0012, -0.095, 0.095); aim.dirty = true; aim.shown = true; e.preventDefault(); }
      else if (k === 'ArrowRight' || k === 'd' || k === 'D') { aim.th = clamp(aim.th + 0.0012, -0.095, 0.095); aim.dirty = true; aim.shown = true; e.preventDefault(); }
      else if (k === 'ArrowUp' || k === 'w' || k === 'W') { aim.p = clamp(aim.p + 0.008, 0, 1); aim.dirty = true; aim.shown = true; e.preventDefault(); if (!e.repeat) sfx('tick2'); }
      else if (k === 'ArrowDown' || k === 's' || k === 'S') { aim.p = clamp(aim.p - 0.008, 0, 1); aim.dirty = true; aim.shown = true; e.preventDefault(); if (!e.repeat) sfx('tick2'); }
      else if (k === 'c' || k === 'C' || k === 'Tab') { e.preventDefault(); aim.spin = -aim.spin; aim.dirty = true; aim.shown = true; sfx('select', { pitch: aim.spin > 0 ? 1.08 : 0.94 }); }
      else if ((k === ' ' || k === 'Enter') && !e.repeat) { e.preventDefault(); if (aim.shown) throwHuman(); else { aim.shown = true; sfx('tap'); } }
      return;
    }
    if (G.phase === 'replay' && (k === ' ' || k === 'Enter')) { e.preventDefault(); endReplay(); return; }
    if (k === ' ') {
      e.preventDefault();
      if (!e.repeat && canSweep()) { sweepHold = true; holdT = 0; }
    }
  });
  window.addEventListener('keyup', e => { if (e.key === ' ') sweepHold = false; });
  window.addEventListener('blur', () => { sweepHold = false; });
  window.addEventListener('resize', resize);
  if (window.visualViewport) window.visualViewport.addEventListener('resize', resize);
  window.addEventListener('orientationchange', () => setTimeout(resize, 120));
  document.addEventListener('visibilitychange', () => { if (document.hidden) { sweepHold = false; if (inGame() && !G.paused) pauseGame(); } });

  /* =========================================================
   * 主迴圈
   * ========================================================= */
  let last = performance.now(), first = true, frozen = false;
  let slowMode = false, lastDraw = 0;
  function frame(now) {
    if (slowMode && now - lastDraw < 700) { requestAnimationFrame(frame); return; }
    lastDraw = now;
    const dt = Math.max(0, Math.min(0.05, (now - last) / 1000));
    last = now;
    update(dt);
    if (G.phase === 'replay') cam.focus = rpFocus;
    updateCamera(dt);
    sync3D();
    syncPath();
    syncBrushes(dt);
    renderFrame();
    drawHUD();
    updateLoops(dt);
    if (first) { first = false; const m = document.getElementById('msg'); if (m) m.remove(); }
    if (!frozen) requestAnimationFrame(frame);
  }
  resize();
  titleMenu();
  updateCamera(0, true);
  requestAnimationFrame(frame);

  /* ---------- 測試用 ---------- */
  window.__curl = {
    slow: on => { slowMode = !!on; },
    freeze: on => { if (frozen && !on) { frozen = false; last = performance.now(); requestAnimationFrame(frame); } else if (on) { frozen = true; } },
    state: () => ({ banner: banner ? banner.title : null, mode: G.mode, phase: G.phase, paused: G.paused, end: G.end, ends: G.ends, n: G.n, score: G.score.slice(), hammer: G.hammer, cur: G.cur ? { team: G.cur.team, x: +G.cur.x.toFixed(3), y: +G.cur.y.toFixed(3) } : null, aim: Object.assign({}, aim), cam: cam.mode, q: qLevel, ch: G.ch ? Object.assign({}, G.ch) : null, sweep: sweepAmt }),
    stones: () => stones.filter(s => s.inPlay).map(s => [s.team, +s.x.toFixed(3), +s.y.toFixed(3), +dTee(s).toFixed(3)]),
    start: (mode, o) => { Object.assign(opts, o || {}); startMatch(mode || 'ai'); },
    challenge: lv => startChallenge(lv || 0),
    setAim: (p, th, spin) => { aim.p = p; aim.th = th || 0; if (spin) aim.spin = spin; aim.dirty = true; aim.shown = true; },
    throwNow: () => throwHuman(),
    throwV: (v, th, spin) => throwV(v, th, spin),
    tick: sec => { for (let i = 0; i < sec * 60; i++) { update(1 / 60); if (G.phase === 'replay') cam.focus = rpFocus; updateCamera(1 / 60); } },
    sweep: on => { sweepHold = !!on; },
    pause: () => pauseGame(),
    resume: () => resumeGame(),
    next: () => { const b = menu.querySelector('[data-act="nextend"],[data-act="final"]'); if (b) b.click(); },
    stopDist: p => { const s = traceAlone(powerToV(p), 0, 1); return [+s.x.toFixed(3), +s.y.toFixed(3)]; },
    solveDraw: (x, y, sp) => solveDraw(x, y, sp),
    simThrow: (v, th, sp) => { const r = simThrow(G.cur ? G.cur.i : 8, v, th, sp); return r.filter(s => s.inPlay).map(s => [s.team, +s.x.toFixed(2), +s.y.toFixed(2)]); },
    chGoal: () => CH[G.ch.lv].goal(),
    zones: () => ZONES.map(z => [z.name, +z.a.toFixed(3), +z.b.toFixed(3)]),
    hits: () => HITS.map(h => ({ id: h.id, x: Math.round(h.x + h.w / 2), y: Math.round(h.y + h.h / 2) })),
    stoneScreen: () => { if (!G.cur) return null; toScreen(G.cur.x, G.cur.y, 0.1, scr2); return [Math.round(scr2[0]), Math.round(scr2[1])]; },
    replay: () => startReplay(),
    layoutCh: lv => { G.ch = G.ch || { lv, attempt: 1 }; G.ch.lv = lv; loadLayout(lv); },
    countEnd: () => { const r = countEnd(stones); return [r.team, r.pts]; },
    chTry: (lv, v, th, spin) => {
      G.ch = G.ch || { lv, attempt: 1 }; G.ch.lv = lv; loadLayout(lv);
      const s = stones[15]; s.used = true; s.inPlay = true; s.moving = true; s.hit = false; s.swept = false;
      s.x = 0; s.y = START_Y; s.vx = v * Math.sin(th); s.vy = v * Math.cos(th); s.spin = spin; G.cur = s;
      for (let k = 0; k < 45 / H; k++) if (!physStep(stones, H, 0, null)) break;
      if (s.inPlay && !s.hit && s.y <= HOG + R) s.inPlay = false;
      return CH[lv].goal();
    }
  };
}
</script>
