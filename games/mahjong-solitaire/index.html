<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0c1714">
<title>上海麻將 Mahjong Solitaire</title>
<link rel="stylesheet" href="../../assets/common.css">
<style>
  :root { --gold: #d6b46e; --gold2: #a8813f; --jade: #4f9c7d; --ink: #f2ead9; --mut: #b4ab98; --panel: rgba(12, 18, 16, .84); --line: rgba(214, 180, 110, .45); --pf: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", "Heiti TC", system-ui, sans-serif; --sf: "Noto Serif TC", "Source Han Serif TC", "Songti TC", "STSong", "PMingLiU", "MingLiU", "Noto Serif CJK TC", serif; }
  html, body { height: 100%; overflow: hidden; background: #0b1412; color: var(--ink); font-family: var(--pf); touch-action: none; }
  #cv { position: fixed; inset: 0; width: 100vw; height: 100vh; height: 100dvh; display: block; touch-action: none; cursor: default; }
  .hide { display: none !important; }
  button { font-family: var(--pf); -webkit-user-select: none; user-select: none; }
  button:focus { outline: none; }
  button:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
  .kg-fab { z-index: 9350; background: rgba(14, 20, 18, .82); border: 1.5px solid var(--line); box-shadow: 0 4px 14px rgba(0, 0, 0, .5); font-size: 20px; }
  .kg-fab:hover { border-color: var(--gold); }
  .glass { background: var(--panel); border: 1px solid var(--line); box-shadow: 0 6px 22px rgba(0, 0, 0, .45); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); }

  /* HUD */
  #hud { position: fixed; inset: 0; pointer-events: none; z-index: 50; }
  #hud .ui { pointer-events: auto; }
  #info { position: fixed; top: 10px; left: 50%; transform: translateX(-50%); padding: 5px 14px 6px; border-radius: 9px; text-align: center; white-space: nowrap; max-width: calc(100vw - 136px); }
  #iName { font-family: var(--sf); font-size: 15px; font-weight: 700; letter-spacing: 3px; color: var(--gold); line-height: 1.25; overflow: hidden; text-overflow: ellipsis; }
  #iName small { font-family: var(--pf); font-size: 11px; letter-spacing: 1px; color: var(--mut); font-weight: 400; margin-left: 6px; }
  #iStats { display: flex; gap: 12px; justify-content: center; font-size: 12px; color: var(--mut); letter-spacing: .5px; line-height: 1.35; }
  #iStats b { color: var(--ink); font-weight: 700; font-variant-numeric: tabular-nums; margin-left: 3px; }
  #iStats .warn b { color: #e3836f; }
  .rbtn { position: fixed; width: 48px; height: 48px; padding: 0; border-radius: 50%; color: var(--ink); cursor: pointer; display: flex; align-items: center; justify-content: center; }
  .rbtn:active { transform: translateY(1px); border-color: var(--gold); }
  .rbtn svg { width: 20px; height: 20px; }
  #bPause { right: 10px; top: 66px; }

  #dock { position: fixed; z-index: 60; display: flex; gap: 8px; }
  .dbtn { position: relative; flex: 1; min-width: 0; height: 56px; border-radius: 12px; border: 1px solid var(--line); background: linear-gradient(180deg, rgba(34, 44, 40, .94), rgba(14, 20, 18, .94)); color: var(--ink); font-size: 13px; font-weight: 700; letter-spacing: 2px; cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; box-shadow: 0 6px 16px rgba(0, 0, 0, .45), inset 0 1px 0 rgba(255, 255, 255, .06); touch-action: manipulation; transition: transform .08s, opacity .2s, border-color .2s; }
  .dbtn svg { width: 22px; height: 22px; flex: none; }
  .dbtn:active { transform: translateY(2px); border-color: var(--gold); }
  .dbtn:disabled { opacity: .38; cursor: default; }
  .dbtn .cnt { position: absolute; top: 4px; right: 6px; min-width: 18px; height: 18px; padding: 0 4px; border-radius: 9px; background: var(--gold); color: #1d1408; font-size: 11px; line-height: 18px; letter-spacing: 0; font-weight: 800; }
  .dbtn.pulse { animation: mjPulse 1.2s ease-in-out infinite; border-color: var(--gold); }
  @keyframes mjPulse { 50% { box-shadow: 0 0 0 4px rgba(214, 180, 110, .25), 0 6px 16px rgba(0, 0, 0, .45); } }

  body.portrait #dock { left: max(10px, env(safe-area-inset-left)); right: max(10px, env(safe-area-inset-right)); bottom: calc(10px + env(safe-area-inset-bottom)); max-width: 520px; margin: 0 auto; }
  body.wide #dock { left: 50%; transform: translateX(-50%); bottom: calc(14px + env(safe-area-inset-bottom)); width: 440px; }
  body.short #dock { flex-direction: column; left: calc(10px + env(safe-area-inset-left)); top: 66px; width: 52px; gap: 6px; }
  body.short .dbtn { flex: none; height: 52px; font-size: 11px; letter-spacing: 1px; gap: 1px; }
  body.short .dbtn svg { width: 19px; height: 19px; }
  body.short .dbtn .cnt { top: 2px; right: 2px; min-width: 15px; height: 15px; line-height: 15px; font-size: 10px; }
  body.short #info { top: 8px; padding: 3px 12px 4px; }
  body.short #iStats { font-size: 11.5px; }

  /* 遮罩 */
  .ov { position: fixed; inset: 0; z-index: 9200; display: flex; align-items: center; justify-content: center; padding: 16px; background: rgba(4, 8, 7, .62); animation: kg-fade .25s ease; }
  .card { background: rgba(12, 18, 16, .95) !important; width: min(420px, 100%); max-height: calc(100% - 8px); overflow: auto; border-radius: 14px; padding: 20px 18px 16px; text-align: center; color: var(--ink); animation: mjRise .3s cubic-bezier(.2, .9, .3, 1.1); }
  @keyframes mjRise { from { transform: translateY(14px) scale(.97); opacity: 0; } to { transform: none; opacity: 1; } }
  .card h2 { margin: 0 0 6px; font-family: var(--sf); font-size: 24px; letter-spacing: 6px; padding-left: 6px; color: var(--gold); font-weight: 800; }
  .card p { margin: 0 0 12px; font-size: 14px; line-height: 1.6; color: var(--mut); }
  .orn { display: block; width: 120px; height: 10px; margin: 0 auto 10px; }
  .gbtn { font-family: var(--pf); font-size: 15px; font-weight: 800; letter-spacing: 3px; padding: 11px 16px; border-radius: 9px; cursor: pointer; border: 1px solid var(--line); background: rgba(255, 255, 255, .04); color: var(--ink); transition: transform .1s, background .2s, border-color .2s; touch-action: manipulation; }
  .gbtn:hover { border-color: var(--gold); }
  .gbtn:active { transform: translateY(1px); }
  .gbtn:disabled { opacity: .4; cursor: default; }
  .gbtn.pri { background: linear-gradient(180deg, #e4c47f, #b68c45); color: #1d1408; border-color: #f0d79c; box-shadow: 0 6px 16px rgba(180, 140, 70, .3); }
  .gbtn.jade { background: linear-gradient(180deg, #3f8a6c, #24584a); border-color: #74b99a; }
  .acts { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
  .acts .gbtn { flex: 1; min-width: 110px; }
  .acts.col { flex-direction: column; }
  .stat { display: grid; grid-template-columns: 1fr auto; gap: 6px 14px; margin: 8px auto 14px; font-size: 14px; max-width: 280px; text-align: left; color: var(--mut); }
  .stat span:nth-child(2n) { text-align: right; font-variant-numeric: tabular-nums; color: var(--ink); font-weight: 700; }
  .stat .gold { color: var(--gold) !important; }
  .frow { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
  .frow label { flex: none; width: 92px; font-size: 13px; color: var(--mut); letter-spacing: 1px; text-align: left; }
  .seg { flex: 1; display: flex; border: 1px solid var(--line); border-radius: 9px; overflow: hidden; }
  .seg button { flex: 1; padding: 9px 4px; background: transparent; color: var(--mut); border: 0; border-left: 1px solid rgba(214, 180, 110, .25); font-size: 14px; font-weight: 700; letter-spacing: 1px; cursor: pointer; }
  .seg button:first-child { border-left: 0; }
  .seg button.on { background: rgba(214, 180, 110, .18); color: var(--ink); box-shadow: inset 0 -2px 0 var(--gold); }

  /* 標題 */
  #title { background: radial-gradient(ellipse at 50% 38%, rgba(10, 20, 17, .15), rgba(4, 8, 7, .7) 75%); flex-direction: column; justify-content: center; gap: 18px; padding: 64px 16px calc(16px + env(safe-area-inset-bottom)); }
  .logo { text-align: center; pointer-events: none; }
  .logo .sub { font-size: 11px; letter-spacing: 7px; color: var(--gold); opacity: .85; padding-left: 7px; }
  .logo h1 { margin: 4px 0 0; font-family: var(--sf); font-size: clamp(44px, 13vw, 76px); font-weight: 900; letter-spacing: 14px; padding-left: 14px; color: #f6efe0; text-shadow: 0 2px 0 rgba(0, 0, 0, .5), 0 0 30px rgba(214, 180, 110, .25); line-height: 1.15; }
  #deco { display: block; margin: 10px auto 0; width: min(340px, 86vw); height: 108px; }
  .tcard { width: min(400px, 100%); border-radius: 14px; padding: 14px; display: flex; flex-direction: column; gap: 8px; }
  .tcard .gbtn { width: 100%; }
  .tcard .gbtn.pri { font-size: 17px; padding: 13px; }
  .tcard .two { display: flex; gap: 8px; }
  .tcard .two .gbtn { flex: 1; }
  .gbtn small { display: block; font-size: 11.5px; font-weight: 500; letter-spacing: 1px; opacity: .78; margin-top: 2px; }
  .rec { font-size: 12px; color: var(--mut); letter-spacing: 1px; line-height: 1.7; text-align: center; }
  .rec b { color: var(--gold); font-weight: 700; }
  body.land #title { flex-direction: row; align-items: center; justify-content: center; gap: 4vw; padding: 16px calc(16px + env(safe-area-inset-right)) 16px calc(70px + env(safe-area-inset-left)); }
  body.land #title .logo { flex: 1 1 auto; min-width: 0; }
  /* 橫向時標題依可用寬度縮小，不換行 */
  body.land #title .logo h1 { white-space: nowrap; font-size: clamp(30px, min(7vw, 9vh), 76px); letter-spacing: .14em; padding-left: .14em; }
  body.short .logo h1 { font-size: 46px; letter-spacing: 10px; padding-left: 10px; }
  body.short #deco { height: 84px; width: min(300px, 40vw); }
  body.short .tcard { gap: 6px; padding: 10px; width: min(360px, 48vw); }
  body.short .tcard .gbtn { padding: 8px 10px; }
  body.short .tcard .gbtn.pri { padding: 10px; }

  /* 選關 */
  #levels .card { width: min(760px, 100%); max-height: calc(100% - 4px); padding: 16px 14px 14px; display: flex; flex-direction: column; }
  #lvGrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; overflow: auto; padding: 2px 2px 6px; margin: 4px 0 10px; text-align: left; }
  .lv { position: relative; border: 1px solid rgba(214, 180, 110, .3); border-radius: 11px; background: linear-gradient(180deg, rgba(40, 52, 47, .6), rgba(16, 22, 20, .7)); padding: 8px 9px 8px; cursor: pointer; color: var(--ink); font-family: var(--pf); text-align: left; transition: border-color .15s, transform .1s; }
  .lv:hover { border-color: var(--gold); }
  .lv:active { transform: scale(.98); }
  .lv.cur { border-color: var(--gold); box-shadow: inset 0 0 0 1px rgba(214, 180, 110, .4); }
  .lv canvas { display: block; width: 100%; height: 74px; margin-bottom: 6px; }
  .lv .nm { font-family: var(--sf); font-size: 17px; font-weight: 800; letter-spacing: 3px; color: #f6efe0; }
  .lv .en { font-size: 10.5px; color: var(--mut); letter-spacing: 1px; margin-left: 4px; font-weight: 400; }
  .lv .meta { display: flex; justify-content: space-between; align-items: center; margin-top: 3px; font-size: 11.5px; color: var(--mut); }
  .lv .meta b { color: var(--gold); font-weight: 700; font-variant-numeric: tabular-nums; }
  .dif { font-size: 11px; padding: 1px 6px; border-radius: 4px; border: 1px solid; letter-spacing: 1px; }
  .dif.d0 { color: #8fcfb2; border-color: rgba(143, 207, 178, .5); }
  .dif.d1 { color: #b9d58c; border-color: rgba(185, 213, 140, .5); }
  .dif.d2 { color: #e2c57f; border-color: rgba(226, 197, 127, .5); }
  .dif.d3 { color: #e58f78; border-color: rgba(229, 143, 120, .5); }
  .stars { display: inline-flex; gap: 2px; vertical-align: middle; }
  .stars svg { width: 13px; height: 13px; }
  .bigstars { display: flex; justify-content: center; gap: 10px; margin: 6px 0 8px; }
  .bigstars svg { width: 40px; height: 40px; opacity: 0; transform: scale(.3) rotate(-30deg); animation: mjStar .45s cubic-bezier(.2, 1.6, .4, 1) forwards; }
  @keyframes mjStar { to { opacity: 1; transform: none; } }
  .big { font-family: var(--sf); font-size: 40px; font-weight: 900; color: var(--gold); letter-spacing: 3px; margin: 0 0 2px; font-variant-numeric: tabular-nums; }
  .newrec { display: inline-block; font-size: 12px; letter-spacing: 3px; padding: 2px 8px 2px 11px; border-radius: 3px; color: #17110a; background: linear-gradient(90deg, #b68c45, #ecd194, #b68c45); font-weight: 800; margin-bottom: 4px; }
  .note { font-size: 11.5px; color: #8e8574; margin-top: 10px; line-height: 1.6; }
  body.short .card { padding: 10px 14px; }
  body.short .card h2 { font-size: 19px; margin: 0 0 4px; }
  body.short .card .stat { grid-template-columns: 1fr auto 1fr auto; max-width: none; font-size: 12.5px; margin: 4px 0 8px; gap: 3px 12px; }
  body.short .card .acts .gbtn { padding: 8px 6px; }
  body.short #winOv .big { font-size: 30px; }
  body.short .bigstars svg { width: 30px; height: 30px; }
  body.short .orn { margin-bottom: 4px; }
  body.short #levels .card { padding: 10px; }
  body.short .seg button { padding: 6px 4px; }
  body.short .frow { margin-bottom: 5px; }
  body.short .lv canvas { height: 54px; }
</style>
</head>
<body>
<canvas id="cv" aria-label="上海麻將牌桌"></canvas>
<div id="hud" class="hide">
  <div id="info" class="glass"><div id="iName">烏龜</div><div id="iStats"><span>時間<b id="sTime">0:00</b></span><span>剩餘<b id="sLeft">144</b></span><span id="sPairsW">可配對<b id="sPairs">0</b></span></div></div>
  <button id="bPause" class="rbtn glass ui" aria-label="暫停"><svg viewBox="0 0 24 24"><rect x="6" y="5" width="4" height="14" rx="1" fill="#f2ead9"/><rect x="14" y="5" width="4" height="14" rx="1" fill="#f2ead9"/></svg></button>
</div>
<div id="dock" class="hide">
  <button class="dbtn" id="bHint" aria-label="提示"><svg viewBox="0 0 24 24" fill="none" stroke="#d6b46e" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-3.6 10.8c.6.5 1 1.2 1.1 2V16h5v-.2c.1-.8.5-1.5 1.1-2A6 6 0 0 0 12 3Z"/></svg><span>提示</span></button>
  <button class="dbtn" id="bUndo" aria-label="復原"><svg viewBox="0 0 24 24" fill="none" stroke="#f2ead9" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg><span>復原</span></button>
  <button class="dbtn" id="bShuf" aria-label="洗牌"><svg viewBox="0 0 24 24" fill="none" stroke="#f2ead9" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M16 3h5v5M4 20 21 3M21 16v5h-5M15 15l6 6M4 4l5 5"/></svg><span>洗牌</span><i class="cnt" id="shufCnt">3</i></button>
  <button class="dbtn" id="bFit" aria-label="全景"><svg viewBox="0 0 24 24" fill="none" stroke="#f2ead9" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg><span>全景</span></button>
</div>

<div id="title" class="ov hide">
  <div class="logo">
    <div class="sub">MAHJONG SOLITAIRE</div>
    <h1>上海麻將</h1>
    <canvas id="deco"></canvas>
  </div>
  <div class="tcard glass">
    <button class="gbtn pri" id="tPlay">開始<small id="tPlaySub"></small></button>
    <button class="gbtn hide" id="tResume">繼續上一局<small id="tResumeSub"></small></button>
    <div class="two">
      <button class="gbtn" id="tLevels">選擇牌局</button>
      <button class="gbtn jade" id="tDaily">每日挑戰<small id="tDailySub"></small></button>
    </div>
    <button class="gbtn" id="tSet">設定</button>
    <div class="rec" id="tRec"></div>
  </div>
</div>

<div id="levels" class="ov hide">
  <div class="card glass">
    <h2>選擇牌局</h2>
    <div id="lvGrid"></div>
    <div class="acts"><button class="gbtn" id="lvClose">返回</button></div>
  </div>
</div>

<div id="setOv" class="ov hide">
  <div class="card glass">
    <h2>設定</h2>
    <svg class="orn" viewBox="0 0 120 10"><path d="M0 5h48M72 5h48" stroke="#a8813f" stroke-width="1"/><path d="M60 1l4 4-4 4-4-4z" fill="#d6b46e"/></svg>
    <div class="frow"><label>可取牌高亮</label><div class="seg" data-k="hl"><button data-v="on">開</button><button data-v="off">關</button></div></div>
    <div class="frow"><label>背景音樂</label><div class="seg" data-k="music"><button data-v="on">開</button><button data-v="off">關</button></div></div>
    <div class="frow"><label>音效</label><div class="seg" data-k="sfx"><button data-v="on">開</button><button data-v="off">關</button></div></div>
    <div class="frow"><label>直向旋轉牌局</label><div class="seg" data-k="rotate"><button data-v="auto">自動</button><button data-v="off">不旋轉</button></div></div>
    <p class="note" style="margin:4px 0 12px">兩指縮放、單指拖曳可移動牌桌；點「全景」回到完整畫面。<br>鍵盤：方向鍵選牌・Enter 取牌・H 提示・Z 復原・S 洗牌・P 暫停</p>
    <div class="acts"><button class="gbtn pri" id="setClose">完成</button></div>
  </div>
</div>

<div id="pauseOv" class="ov hide">
  <div class="card glass">
    <h2>暫停</h2>
    <svg class="orn" viewBox="0 0 120 10"><path d="M0 5h48M72 5h48" stroke="#a8813f" stroke-width="1"/><path d="M60 1l4 4-4 4-4-4z" fill="#d6b46e"/></svg>
    <div class="stat" id="pStats"></div>
    <div class="frow"><label>可取牌高亮</label><div class="seg" data-k="hl"><button data-v="on">開</button><button data-v="off">關</button></div></div>
    <div class="frow"><label>背景音樂</label><div class="seg" data-k="music"><button data-v="on">開</button><button data-v="off">關</button></div></div>
    <div class="acts col" style="margin-top:12px">
      <button class="gbtn pri" id="pResume">繼續</button>
      <div class="acts"><button class="gbtn" id="pRestart">重新開始</button><button class="gbtn" id="pLevels">選擇牌局</button></div>
      <button class="gbtn" id="pQuit">回到標題</button>
    </div>
  </div>
</div>

<div id="stuckOv" class="ov hide">
  <div class="card glass">
    <h2>無牌可配</h2>
    <svg class="orn" viewBox="0 0 120 10"><path d="M0 5h48M72 5h48" stroke="#a8813f" stroke-width="1"/><path d="M60 1l4 4-4 4-4-4z" fill="#d6b46e"/></svg>
    <p id="stMsg">目前沒有可以配對的牌了。</p>
    <div class="acts col">
      <button class="gbtn pri" id="stShuf">洗牌</button>
      <div class="acts"><button class="gbtn" id="stUndo">復原一步</button><button class="gbtn" id="stRestart">重來</button></div>
    </div>
  </div>
</div>

<div id="winOv" class="ov hide" style="background:rgba(4,8,7,.45)">
  <div class="card glass">
    <div style="font-size:12px;letter-spacing:6px;color:var(--mut);padding-left:6px" id="wSub">牌局完成</div>
    <h2 id="wTitle">功德圓滿</h2>
    <div class="bigstars" id="wStars"></div>
    <div id="wNew" class="newrec hide">新紀錄</div>
    <div class="big" id="wTime">0:00</div>
    <div class="stat" id="wStats"></div>
    <div class="acts">
      <button class="gbtn pri" id="wNext">下一關</button>
      <button class="gbtn" id="wAgain">再玩</button>
    </div>
    <div class="acts" style="margin-top:8px"><button class="gbtn" id="wLevels" style="flex:1">選擇牌局</button><button class="gbtn" id="wTitleB" style="flex:1">回到標題</button></div>
    <div class="note" id="wNote"></div>
  </div>
</div>

<script src="../../assets/common.js"></script>
<script>
(function () {
  'use strict';
/*CORE-START*/
  /* ---------- 牌局佈局（資料）----------
   * 座標以「半張牌」為單位：一張牌佔 x..x+2、y..y+2；z 為層數。
   * A(z, dx, dy, rows)：ASCII 圖，'#' 為一張牌（每格 = 一整張牌，dx/dy 為半張偏移）
   * R(z, x, y, w, h)：矩形（x、y 為半張單位，w、h 為張數）
   * C(z, y, w, cx)：以 cx（半張單位）為中心的一列 w 張
   * T(x, y, z)：單張 */
  const A = (z, dx, dy, rows) => { const o = []; rows.forEach((r, ri) => { for (let c = 0; c < r.length; c++) if (r[c] === '#') o.push([dx + c * 2, dy + ri * 2, z]); }); return o; };

  /** 建立一組精靈圖：k = 每個世界單位的實際像素 */

  // 金色光點

    r.addColorStop(0, 'rgba(255,248,220,1)'); r.addColorStop(0.25, 'rgba(255,214,120,.9)'); r.addColorStop(0.6, 'rgba(214,160,60,.3)'); r.addColorStop(1, 'rgba(214,160,60,0)');

  /* =========================================================
   * 牌局狀態
   * ========================================================= */
  let phase = 'title', paused = false;
  let G = null;                 // 目前牌局
  let tiles = [], N = 0, alive = [], faces = [], free = [], order = [];
  let sel = -1, focus = -1, hint = null;
  const BB = { x0: 0, y0: 0, x1: 1, y1: 1, cx: 0, cy: 0, w: 1, h: 1 };
  const anim = new Map();       // 單張牌的動畫：shake / in / flip
  const ghosts = [];            // 被拿走的牌（飛出淡出）
  let pendingSeed = null;

  function setupBoard(pos) {
    tiles = buildBoard(pos); N = tiles.length;
    let x0 = 1e9, y0 = 1e9, x1 = -1e9, y1 = -1e9;
    for (const t of tiles) {
      t.wx = t.x * TW / 2 + t.z * D; t.wy = t.y * TH / 2 - t.z * D;
      x0 = Math.min(x0, t.wx - D); x1 = Math.max(x1, t.wx + TW); y0 = Math.min(y0, t.wy); y1 = Math.max(y1, t.wy + TH + D);
    }
    const p = 6;
    Object.assign(BB, { x0: x0 - p, y0: y0 - p, x1: x1 + p, y1: y1 + p });
    BB.w = BB.x1 - BB.x0; BB.h = BB.y1 - BB.y0; BB.cx = (BB.x0 + BB.x1) / 2; BB.cy = (BB.y0 + BB.y1) / 2;
    order = tiles.map(t => t.id).sort((a, b) => { const A = tiles[a], B = tiles[b]; return A.z - B.z || (A.y - A.x) - (B.y - B.x) || B.x - A.x; });
  }
  function recompute() {
    for (let i = 0; i < N; i++) free[i] = alive[i] ? (isFreeA(tiles, alive, i) ? 1 : 0) : 0;
  }
  function remaining() { let n = 0; for (let i = 0; i < N; i++) if (alive[i]) n++; return n; }
  function availPairs() {
    const c = new Int32Array(36); let p = 0;
    for (let i = 0; i < N; i++) if (free[i]) c[keyOf(faces[i])]++;
    for (let k = 0; k < 36; k++) p += c[k] * (c[k] - 1) / 2;

  }

    for (const k in by) { const a = by[k]; for (let x = 0; x < a.length; x++) for (let y = x + 1; y < a.length; y++) { const s = tiles[a[x]].w + tiles[a[y]].w; if (s > bs) { bs = s; best = [a[x], a[y]]; } } }
    return best;
  }

  function newGame(L, seed, opts) {

    pendingSeed = null;
    seed = seed >>> 0;
    const pos = opts.custom || L.pos;
    setupBoard(pos);
    const d = dealChecked(tiles, seed);
    if (!d) return false;
    alive = new Array(N).fill(1); faces = d.faces; free = new Array(N).fill(0);

    ['title', 'levels', 'pauseOv', 'stuckOv', 'winOv', 'setOv'].forEach(id => $(id).classList.add('hide'));

  /** 發牌：反向擺牌保證有解，並再用解題器確認（讓提示與自動解一定找得到路） */

  /* ---- 解法（提示 / 自動解）---- */

  /* =========================================================

  let W = innerWidth, H = innerHeight, dpr = 1;

  function computeVp() {

  function buildBg() {
    bgC = mk(W * dpr, H * dpr);
    const g = bgC.getContext('2d'); g.scale(dpr, dpr);
    const r = g.createRadialGradient(W / 2, H * 0.45, 0, W / 2, H * 0.45, Math.max(W, H) * 0.75);

  function hitTile(sx, sy) {

  }

     2. 否則找手指附近（約 18px 內）可以拿的牌，最近的優先；和已選的牌同花色的再優先
     3. 都沒有 → 回傳正下方的牌（讓它搖一下，告訴玩家被擋住） */

    const selKey = sel >= 0 ? keyOf(faces[sel]) : -1;
    let best = -1, bs = 1e18;
    for (let i = 0; i < N; i++) {
      if (!alive[i] || !free[i]) continue;
      const t = tiles[i];
      const dx = Math.max(t.wx - D - w.x, 0, w.x - (t.wx + TW)), dy = Math.max(t.wy - w.y, 0, w.y - (t.wy + TH + D));
      const d = Math.hypot(dx, dy);
      if (d > tol) continue;
      let sc = d;
      if (selKey >= 0 && i !== sel && keyOf(faces[i]) === selKey) sc -= tol * 0.6;
      if (sc < bs) { bs = sc; best = i; }
    }
    return best >= 0 ? best : exact;
  }
  const ptrs = new Map();
  let gest = null;
  const canPlay = () => phase === 'play' && G && !paused && !G.done && $('stuckOv').classList.contains('hide') && $('levels').classList.contains('hide');
  cv.addEventListener('pointerdown', e => {
    if (!canPlay()) return;
    try { cv.setPointerCapture(e.pointerId); } catch (_) { /* 忽略 */ }
    ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (ptrs.size === 1) gest = { type: 'tap', id: e.pointerId, x0: e.clientX, y0: e.clientY, px: view.px, py: view.py, t0: performance.now(), far: 0 };
    else if (ptrs.size === 2) {
      const p = [...ptrs.values()];
      const mx = (p[0].x + p[1].x) / 2, my = (p[0].y + p[1].y) / 2;
      gest = { type: 'pinch', d0: Math.hypot(p[0].x - p[1].x, p[0].y - p[1].y) || 1, uz0: view.uz, w: s2w(mx, my) };
    }
  });
  cv.addEventListener('pointermove', e => {
    if (!ptrs.has(e.pointerId)) {
      if (e.pointerType === 'mouse' && canPlay()) cv.style.cursor = hitTile(e.clientX, e.clientY) >= 0 ? 'pointer' : 'default';
      return;
    }
    ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (!gest) return;
    if (e.pointerId === gest.id && gest.far != null) gest.far = Math.max(gest.far, Math.hypot(e.clientX - gest.x0, e.clientY - gest.y0));
    // 手指點下去難免會滑一點：沒放大時（畫面不能拖）多給一點空間
    if (gest.type === 'tap' && e.pointerId === gest.id && gest.far > (view.uz > 1.02 ? 14 : 28)) gest.type = 'pan';
    if (gest.type === 'pan' && e.pointerId === gest.id) {
      view.px = gest.px + (e.clientX - gest.x0); view.py = gest.py + (e.clientY - gest.y0); clampPan(); markDirty();
    } else if (gest.type === 'pinch' && ptrs.size >= 2) {
      const p = [...ptrs.values()];
      const d = Math.hypot(p[0].x - p[1].x, p[0].y - p[1].y), mx = (p[0].x + p[1].x) / 2, my = (p[0].y + p[1].y) / 2;
      view.uz = clamp(gest.uz0 * d / gest.d0, 1, 4);
      view.px = 0; view.py = 0;
      const s = w2s(gest.w.x, gest.w.y);
      view.px = mx - s.x; view.py = my - s.y; clampPan(); updateFitBtn(); markDirty();
    }
  });
  function endPtr(e, cancel) {
    if (!ptrs.has(e.pointerId)) return;
    ptrs.delete(e.pointerId);
    // 放大後輕輕拖了一點點又放開，也當成點擊
    const tapLike = gest && gest.id === e.pointerId && !cancel && performance.now() - gest.t0 < 800 && (gest.type === 'tap' || (gest.type === 'pan' && gest.far <= 18));
    if (tapLike) {
      if (gest.type === 'pan') { view.px = gest.px; view.py = gest.py; clampPan(); markDirty(); }
      const i = smartHit(gest.x0, gest.y0, e.pointerType === 'mouse' ? 6 : 18);
      focus = -1;
      if (i >= 0) pick(i, 'tap');
      else if (sel >= 0) { sel = -1; markDirty(); }
    }
    if (gest && gest.type === 'pinch') {
      if (ptrs.size === 1) { const [id, p] = [...ptrs.entries()][0]; gest = { type: 'pan', id, x0: p.x, y0: p.y, px: view.px, py: view.py, t0: 0 }; }
      ensureSpritesSoon();
    }
    if (!ptrs.size) gest = null;
  }
  cv.addEventListener('pointerup', e => endPtr(e, false));
  cv.addEventListener('pointercancel', e => endPtr(e, true));
  cv.addEventListener('wheel', e => {
    e.preventDefault();
    if (!canPlay()) return;
    zoomAt(e.clientX, e.clientY, Math.exp(-clamp(e.deltaY, -120, 120) * 0.0018));
    ensureSpritesSoon();
  }, { passive: false });
  document.addEventListener('gesturestart', e => e.preventDefault());

  function moveFocus(dx, dy) {
    const cand = []; for (let i = 0; i < N; i++) if (free[i]) cand.push(i);
    if (!cand.length) return;
    const cen = i => w2s(tiles[i].wx + TW / 2, tiles[i].wy + TH / 2);
    if (focus < 0 || !free[focus]) {
      const c = { x: view.x + view.w / 2, y: view.y + view.h / 2 };
      let best = cand[0], bd = 1e18;
      for (const i of cand) { const p = cen(i), d = (p.x - c.x) ** 2 + (p.y - c.y) ** 2; if (d < bd) { bd = d; best = i; } }
      focus = best; markDirty(); SFX.click(); return;
    }
    const f = cen(focus);
    let best = -1, bs = 1e18;
    for (const i of cand) {
      if (i === focus) continue;
      const p = cen(i), vx = p.x - f.x, vy = p.y - f.y;
      const along = vx * dx + vy * dy, side = Math.abs(vx * dy - vy * dx);
      if (along <= 4) continue;
      const s = along + side * 2.2;
      if (s < bs) { bs = s; best = i; }
    }
    if (best >= 0) { focus = best; markDirty(); SFX.click(); }
  }
  window.addEventListener('keydown', e => {
    const k = e.key;
    if (phase === 'play' && G) {
      if (k === 'Escape' || k === 'p' || k === 'P') {
        if (!$('levels').classList.contains('hide')) { $('levels').classList.add('hide'); setPause(false); return; }
        if (!$('winOv').classList.contains('hide') || !$('stuckOv').classList.contains('hide')) return;
        setPause(!paused); e.preventDefault(); return;
      }
      if (!canPlay()) return;
      if (k === 'ArrowLeft') { moveFocus(-1, 0); e.preventDefault(); }
      else if (k === 'ArrowRight') { moveFocus(1, 0); e.preventDefault(); }
      else if (k === 'ArrowUp') { moveFocus(0, -1); e.preventDefault(); }
      else if (k === 'ArrowDown') { moveFocus(0, 1); e.preventDefault(); }
      else if (k === 'Enter' || k === ' ') { if (focus >= 0) pick(focus, 'key'); else moveFocus(1, 0); e.preventDefault(); }
      else if (k === 'h' || k === 'H') doHint();
      else if (k === 'z' || k === 'Z' || k === 'u' || k === 'U' || k === 'Backspace') { undo(); e.preventDefault(); }
      else if (k === 's' || k === 'S') doShuffle();
      else if (k === 'f' || k === 'F' || k === '0') resetView();
      else if (k === '+' || k === '=') { zoomAt(view.x + view.w / 2, view.y + view.h / 2, 1.25); ensureSpritesSoon(); }
      else if (k === '-' || k === '_') { zoomAt(view.x + view.w / 2, view.y + view.h / 2, 0.8); ensureSpritesSoon(); }
    } else if (phase === 'title' && (k === 'Enter') && $('levels').classList.contains('hide') && $('setOv').classList.contains('hide')) { $('tPlay').click(); }
  });

  /* ---- 按鈕 ---- */
  $('bPause').addEventListener('click', () => setPause(!paused));
  $('bHint').addEventListener('click', () => { if (canPlay()) doHint(); });
  $('bUndo').addEventListener('click', () => { if (canPlay()) undo(); });
  $('bShuf').addEventListener('click', () => { if (canPlay()) doShuffle(); });
  $('bFit').addEventListener('click', () => { SFX.click(); resetView(); });
  $('pResume').addEventListener('click', () => { SFX.click(); setPause(false); });
  $('pRestart').addEventListener('click', () => { SFX.click(); const g = G; newGame(g.L, g.seed, { daily: g.daily }); });
  $('pLevels').addEventListener('click', () => { SFX.click(); $('pauseOv').classList.add('hide'); showLevels(); });
  $('pQuit').addEventListener('click', () => { SFX.click(); saveGame(); showTitle(); });
  $('stShuf').addEventListener('click', () => doShuffle());
  $('stUndo').addEventListener('click', () => undo());
  $('stRestart').addEventListener('click', () => { SFX.click(); const g = G; newGame(g.L, g.seed, { daily: g.daily }); });
  $('wNext').addEventListener('click', () => { SFX.click(); if (G.daily) { showLevels(); return; } newGame(LAYOUTS[(G.L.idx + 1) % LAYOUTS.length]); });
  $('wAgain').addEventListener('click', () => { SFX.click(); const g = G; newGame(g.L, g.daily ? g.seed : null, { daily: g.daily }); });
  $('wLevels').addEventListener('click', () => { SFX.click(); $('winOv').classList.add('hide'); showLevels(); });
  $('wTitleB').addEventListener('click', () => { SFX.click(); showTitle(); });
  $('tPlay').addEventListener('click', () => { SFX.click(); newGame(layoutById(settings.last) || LAYOUTS[7]); });
  $('tResume').addEventListener('click', () => { SFX.click(); resumeSaved(); });
  $('tLevels').addEventListener('click', () => { SFX.click(); showLevels(); });
  $('tDaily').addEventListener('click', () => { SFX.click(); const di = dailyInfo(); newGame(di.layout, di.seed, { daily: di.date }); });
  $('tSet').addEventListener('click', () => { SFX.click(); $('setOv').classList.remove('hide'); });
  $('setClose').addEventListener('click', () => { SFX.click(); $('setOv').classList.add('hide'); });
  $('lvClose').addEventListener('click', () => {
    SFX.click(); $('levels').classList.add('hide');
    if (phase === 'play' && G && !G.done) { if ($('winOv').classList.contains('hide')) setPause(false); }
  });
  function syncSegs() { document.querySelectorAll('.seg[data-k]').forEach(el => el.querySelectorAll('button').forEach(b => b.classList.toggle('on', b.dataset.v === settings[el.dataset.k]))); }
  document.querySelectorAll('.seg[data-k]').forEach(el => el.addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    const key = el.dataset.k;
    settings[key] = b.dataset.v; saveSettings(); syncSegs(); SFX.click();
    if (key === 'hl') markDirty();
    if (key === 'rotate' && tiles.length) resetView();
  }));
  syncSegs();

  document.addEventListener('visibilitychange', () => { if (document.hidden) { if (phase === 'play' && G && !G.done && !paused) setPause(true); saveGame(); } });
  window.addEventListener('pagehide', saveGame);
  window.addEventListener('resize', resize);

  /* =========================================================
   * 主迴圈（只在有變化或動畫時重繪）
   * ========================================================= */
  let last = performance.now();
  function frame(now) {
    requestAnimationFrame(frame);
    const dt = Math.min(0.05, (now - last) / 1000); last = now;
    if (phase === 'play' && G && !paused && !G.done && !document.hidden && $('stuckOv').classList.contains('hide')) { G.time += dt; showTime(false); }
    const active = update(dt);
    musicTick(now);
    if (active || dirty > 0 || boardDirty) { if (dirty > 0) dirty--; render(now); }
  }

  /* =========================================================
   * 測試介面
   * ========================================================= */
  window.__mj = {
    state: () => ({
      phase, paused, layout: G && G.L.id, seed: G && G.seed, daily: G && G.daily, remaining: remaining(), total: N, pairs: N ? availPairs() : 0,
      free: free.reduce((a, v) => a + v, 0), time: G ? +G.time.toFixed(2) : 0, hints: G && G.hints, shuffles: G && G.shuffles, shufLeft: G && G.shufLeft,
      sel, focus, hint: hint && [hint.a, hint.b], done: G && G.done, hist: G ? G.hist.length : 0, rot: view.rot, zoom: +view.uz.toFixed(3), pan: [Math.round(view.px), Math.round(view.py)],
      fit: +view.fit.toFixed(4), tileScreenW: +(TW * view.fit * view.uz).toFixed(1), spriteK: SP && SP.k,
      overlays: ['title', 'levels', 'pauseOv', 'stuckOv', 'winOv', 'setOv'].filter(id => !$(id).classList.contains('hide'))
    }),
    layouts: () => LAYOUTS.map(l => ({ id: l.id, name: l.name, n: l.n, diff: l.diff })),
    start: (layout, seed) => newGame(layoutById(layout) || LAYOUTS[0], seed),
    startDaily: () => { const di = dailyInfo(); return newGame(di.layout, di.seed, { daily: di.date }); },
    startCustom: (pos, seed) => newGame({ id: 'custom', name: '自訂', en: 'Custom', diff: 0, n: pos.length, par: pos.length * 3, idx: 0 }, seed || 1, { custom: pos }),
    setSeed: s => { pendingSeed = s >>> 0; },
    freeTiles: () => { const o = []; for (let i = 0; i < N; i++) if (free[i]) o.push(i); return o; },
    tiles: () => tiles.map(t => ({ id: t.id, x: t.x, y: t.y, z: t.z, face: faces[t.id], key: keyOf(faces[t.id]), alive: alive[t.id], free: free[t.id] })),
    pick: id => pick(id, 'hook'),
    autoSolve: n => autoSolve(n),
    hint: () => doHint(),
    undo: () => undo(),
    shuffle: () => doShuffle(),
    pause: v => setPause(v),
    fit: () => resetView(),
    zoom: (f, x, y) => { zoomAt(x == null ? view.x + view.w / 2 : x, y == null ? view.y + view.h / 2 : y, f); ensureSprites(); },
    screenPos: id => { const t = tiles[id]; return w2s(t.wx + TW / 2, t.wy + TH / 2); },
    hitAt: (x, y) => hitTile(x, y),
    snapshot: () => JSON.stringify({ alive, faces, free }),
    solvable: limit => { const r = solve(tiles, alive, faces, limit || 600000); return r ? r.length : r; },
    verify: (layoutId, seeds, limit) => {
      const L = layoutById(layoutId), T = buildBoard(L.pos), out = { ok: 0, fail: [], maxNodes: 0, ms: 0 };
      const t0 = performance.now();
      for (const s of seeds) {
        const d = dealChecked(T, s >>> 0);
        const r = d && solve(T, new Array(T.length).fill(1), d.faces, limit || 600000);
        out.maxNodes = Math.max(out.maxNodes, solve.nodes || 0);
        if (r && r.length === T.length / 2) out.ok++; else out.fail.push(s);
      }
      out.ms = Math.round(performance.now() - t0);
      return out;
    },
    freeIn: (pos, aliveMask) => { const T = buildBoard(pos); const al = aliveMask || new Array(T.length).fill(1); return freeList(T, al); },
    win: () => { if (!G) return; for (let i = 0; i < N; i++) alive[i] = 0; recompute(); G.done = true; winGame(); },
    toTitle: () => showTitle(),
    levels: () => showLevels()
  };

  /* ---- 啟動 ---- */
  resize();
  showTitle();
  requestAnimationFrame(frame);

})();
</script>
</body>
</html>
