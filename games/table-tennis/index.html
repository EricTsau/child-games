<script type="module">
import * as THREE from 'three';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const $ = id => document.getElementById(id);
let renderer = null;
try {
  renderer = new THREE.WebGLRenderer({ canvas: $('gl'), antialias: true, powerPreference: 'high-performance' });
} catch (e) { renderer = null; }
if (!renderer) $('msg').textContent = '這個遊戲需要支援 3D（WebGL）的瀏覽器，請換一個瀏覽器或裝置再試試看。';
else main();

function main() {
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const lerp = (a, b, t) => a + (b - a) * t;
  const rand = (a, b) => a + Math.random() * (b - a);
  const gauss = () => (Math.random() + Math.random() + Math.random() - 1.5) / 0.75;

  /* =========================================================
   * 物理常數（公尺、秒）：標準球桌 2.74 × 1.525，高 0.76，網高 15.25 cm
   * ========================================================= */
  const G = 9.81, KD = 0.125, KM = 0.0032, R = 0.02;
  const TY = 0.76, HL = 1.37, HW = 0.7625, NH = 0.1525, NW = 0.915;
  const DT = 1 / 240, ZP = 1.62;
  const EV_TABLE = 1, EV_NET = 2, EV_FLOOR = 3, EV_CORD = 4;

  const mkBall = () => ({ x: 0, y: 1, z: 0, vx: 0, vy: 0, vz: 0, wx: 0, wy: 0, wz: 0, ix: 0, iz: 0, iv: 0, ptop: 0 });
  const copyBall = (d, s) => { d.x = s.x; d.y = s.y; d.z = s.z; d.vx = s.vx; d.vy = s.vy; d.vz = s.vz; d.wx = s.wx; d.wy = s.wy; d.wz = s.wz; return d; };

  // 飛行：重力 + 空氣阻力 + 馬格努斯力（旋轉 ω × 速度 v）
  function flight(b, dt) {
    const sp = Math.sqrt(b.vx * b.vx + b.vy * b.vy + b.vz * b.vz);
    const ax = -KD * sp * b.vx + KM * (b.wy * b.vz - b.wz * b.vy);
    const ay = -G - KD * sp * b.vy + KM * (b.wz * b.vx - b.wx * b.vz);
    const az = -KD * sp * b.vz + KM * (b.wx * b.vy - b.wy * b.vx);
    b.vx += ax * dt; b.vy += ay * dt; b.vz += az * dt;
    b.x += b.vx * dt; b.y += b.vy * dt; b.z += b.vz * dt;
    const f = 1 - 0.3 * dt;
    b.wx *= f; b.wy *= f; b.wz *= f;
  }
  // 球彈跳：垂直恢復係數 + 接觸點摩擦（滑動 → 滾動），旋轉與速度互相影響
  function bounceTable(b, vin) {
    const e = 0.9 - 0.012 * Math.min(vin, 6), mu = 0.36;
    b.vy = vin * e;
    const sx = b.vx + b.wz * R, sz = b.vz - b.wx * R;
    const s = Math.hypot(sx, sz);
    if (s > 1e-6) {
      const J = Math.min(mu * (1 + e) * vin, s / 2.5);
      const ux = sx / s, uz = sz / s;
      b.vx -= J * ux; b.vz -= J * uz;
      b.wx += 1.5 / R * J * uz; b.wz -= 1.5 / R * J * ux;
    }
  }
  // 一個子步：飛行 + 撞網 / 球桌 / 地板（連續偵測，不會穿透）
  function step(b, dt, det) {
    const px = b.x, py = b.y, pz = b.z;
    flight(b, dt);
    if ((pz > 0) !== (b.z > 0)) {
      const t = pz / (pz - b.z);
      const nx = px + (b.x - px) * t, ny = py + (b.y - py) * t;
      if (Math.abs(nx) < NW && ny < TY + NH + R && ny > TY - 0.01) {
        const h = ny - (TY + NH);
        b.ix = nx; b.iz = 0; b.iv = Math.abs(b.vz);
        if (h > -R * 0.45) {
          // 擦到網頂白帶：減速、往上彈，仍然過網
          b.vz *= 0.42; b.vy = Math.abs(b.vy) * 0.3 + 0.55; b.vx *= 0.8;
          if (!det) b.vx += (Math.random() - 0.5) * 0.35;
          b.wx *= 0.5; b.wy *= 0.5; b.wz *= 0.5;
          b.y = Math.max(b.y, TY + NH + R);
          return EV_CORD;
        }
        const back = pz > 0 ? 1 : -1;
        b.z = back * (R + 0.003); b.x = nx; b.y = ny;
        b.vz = -b.vz * 0.12; b.vx *= 0.35; b.vy = Math.min(b.vy, 0) * 0.3;
        b.wx *= 0.2; b.wy *= 0.2; b.wz *= 0.2;
        return EV_NET;
      }
    }
    if (b.vy < 0 && b.y < TY + R && py >= TY + R - 1e-4 && Math.abs(b.x) <= HW && Math.abs(b.z) <= HL) {
      b.y = TY + R;
      const vin = -b.vy;
      b.ix = b.x; b.iz = b.z; b.iv = vin;
      if (vin < 0.3) { b.vy = 0; b.vx *= 0.985; b.vz *= 0.985; return 0; }
      const hs = Math.hypot(b.vx, b.vz) || 1;
      b.ptop = (b.wx * b.vz - b.wz * b.vx) / hs;   // 對手打出的上旋量（彈跳前）
      bounceTable(b, vin);
      return EV_TABLE;
    }
    if (b.vy < 0 && b.y < R) {
      const vin = -b.vy;
      b.y = R; b.iv = vin;
      b.vx *= 0.8; b.vz *= 0.8;
      if (vin < 0.5) { b.vy = 0; return 0; }
      b.vy = vin * 0.7;
      return EV_FLOOR;
    }
    return 0;
  }

  /* ---------- 擊球解算：用同一套物理反推出能落在目標點的初速 ---------- */
  const SB = mkBall();
  const land = { x: 0, z: 0, t: 0, netY: 9, crossed: false, ok: false };
  function simLand(b0, vx, vy, vz, wx, wy, wz) {
    SB.x = b0.x; SB.y = b0.y; SB.z = b0.z; SB.vx = vx; SB.vy = vy; SB.vz = vz; SB.wx = wx; SB.wy = wy; SB.wz = wz;
    land.netY = 9; land.crossed = false; land.ok = false;
    for (let i = 0; i < 520; i++) {
      const px = SB.x, py = SB.y, pz = SB.z;
      flight(SB, DT);
      if (!land.crossed && (pz > 0) !== (SB.z > 0)) { const t = pz / (pz - SB.z); land.netY = py + (SB.y - py) * t; land.crossed = true; }
      if (SB.vy < 0 && SB.y <= TY + R) {
        const t = (py - (TY + R)) / Math.max(1e-6, py - SB.y);
        land.x = px + (SB.x - px) * t; land.z = pz + (SB.z - pz) * t; land.t = i * DT; land.ok = true;
        return true;
      }
    }
    land.x = SB.x; land.z = SB.z; land.t = 2.2;
    return false;
  }
  const shot = { vx: 0, vy: 0, vz: 0, wx: 0, wy: 0, wz: 0, lx: 0, lz: 0, netY: 0, h: 0 };
  // opt: { net: 是否要過網, assist: 不合法就自動降速, sideSign: 目標檯面（+1 我方 z>0 / -1 對方） }
  function planShot(b, tx, tz, h, top, side, opt) {
    let aimX = tx, aimZ = tz;
    for (let tries = 0; tries < 8; tries++) {
      let vy = 0, ux = 0, uz = -1;
      for (let it = 0; it < 4; it++) {
        const dx = aimX - b.x, dz = aimZ - b.z, d = Math.hypot(dx, dz) || 1;
        ux = dx / d; uz = dz / d;
        const wx = top * uz, wz = -top * ux;
        let lo = -6.5, hi = 7;
        for (let k = 0; k < 17; k++) {
          const mid = (lo + hi) / 2;
          simLand(b, ux * h, mid, uz * h, wx, side, wz);
          const proj = land.ok ? (land.x - b.x) * ux + (land.z - b.z) * uz : 99;
          if (proj > d) hi = mid; else lo = mid;
        }
        vy = (lo + hi) / 2;
        simLand(b, ux * h, vy, uz * h, wx, side, wz);
        const ex = land.x - tx, ez = land.z - tz;
        if (Math.abs(ex) + Math.abs(ez) < 0.012) break;
        aimX -= ex; aimZ -= ez;
      }
      const wx = top * uz, wz = -top * ux;
      if (opt.net) {
        let guard = 0;
        while (land.crossed && land.netY < TY + NH + R + (opt.margin || 0.014) && guard++ < 50) { vy += 0.05; simLand(b, ux * h, vy, uz * h, wx, side, wz); }
      }
      shot.vx = ux * h; shot.vy = vy; shot.vz = uz * h; shot.wx = wx; shot.wy = side; shot.wz = wz;
      shot.lx = land.x; shot.lz = land.z; shot.netY = land.netY; shot.h = h;
      // 擊球點太低、太近時，自然放慢速度（像真人會改用挑打），否則一定出界
      if (opt.fit && tries < 6 && land.ok) {
        const over = Math.hypot(land.x - b.x, land.z - b.z) - Math.hypot(tx - b.x, tz - b.z);
        if (over > 0.12) { h *= 0.86; aimX = tx; aimZ = tz; continue; }
      }
      if (!opt.assist) break;
      const inTable = land.ok && Math.abs(land.x) < HW - 0.04 && Math.abs(land.z) < HL - 0.04 && land.z * opt.sideSign > 0.1;
      if (inTable) break;
      h *= 0.88;
      aimX = tx; aimZ = tz;
    }
    return shot;
  }

  /* ---------- 預測：完整模擬（含彈跳），給電腦判斷落點與擊球位置 ---------- */
  const PB = mkBall();
  const pred = { x: 0, y: 0, z: 0, t: 0, ok: false };
  function trigger(b, side) {
    const sg = side === 0 ? 1 : -1;
    if (b.z * sg >= ZP) return true;
    return b.vy < 0 && b.y < TY + 0.1 && b.y > TY && Math.abs(b.z) < HL && b.z * sg > 0.15;
  }
  // 從目前的球開始，看它會不會合法落在 side 那邊並到達擊球點
  function predictIntercept(src, side, needBounce, serveBounce) {
    copyBall(PB, src);
    let bounced = !needBounce, skip = serveBounce ? 1 : 0;
    pred.ok = false;
    for (let i = 0; i < 900; i++) {
      const ev = step(PB, DT, true);
      if (ev === EV_TABLE) {
        const s = PB.z > 0 ? 0 : 1;
        if (s !== side && skip > 0) { skip--; continue; }
        if (s !== side || bounced) return pred;
        bounced = true;
      } else if (ev === EV_FLOOR || (ev === EV_NET && !bounced)) return pred;
      if (bounced && trigger(PB, side)) {
        if (PB.y < 0.45) return pred;
        pred.x = PB.x; pred.y = PB.y; pred.z = PB.z; pred.t = i * DT; pred.ok = true;
        return pred;
      }
      if (PB.y < 0) return pred;

  /* =========================================================

  const SKEY = 'table-tennis:stats', OKEY = 'table-tennis:opts';

  const LV = [null,
    { name: '初級', react: 0.30, speed: 1.75, reach: 0.30, err: 0.13, pMin: 0.12, pMax: 0.48, spin: 60, spread: 0.32, dz: [0.6, 1.0], ts: 0.68, sf: 0.03, preach: 0.36, shirt: 0x2f9e5b },
    { name: '中級', react: 0.19, speed: 2.6, reach: 0.30, err: 0.075, pMin: 0.28, pMax: 0.75, spin: 120, spread: 0.52, dz: [0.5, 1.15], ts: 0.78, sf: 0.02, preach: 0.31, shirt: 0x2a63c9 },
    { name: '高級', react: 0.11, speed: 3.6, reach: 0.32, err: 0.045, pMin: 0.42, pMax: 0.98, spin: 190, spread: 0.64, dz: [0.45, 1.22], ts: 0.88, sf: 0.01, preach: 0.28, shirt: 0xb8202f }

  function resetRally() {

  }

  }
  function assistOn() { return opts.assist && (mode === 'practice' || level === 1 || mode === 'demo'); }
  function playerReach() { return mode === 'practice' ? 0.34 : mode === 'demo' ? 0.34 : LV[level].preach; }

  function startMatch(o) {

  /* ---------- 練習：發球機 ---------- */

    B.x = rand(-0.15, 0.15); B.y = 1.02; B.z = -HL - 0.28;
    const tx = rand(-0.48, 0.48), tz = rand(0.65, 1.15);

    else if (sp === 'back') { h = 6.4; top = -150; }
    else if (sp === 'side') { h = 7.6; top = 30; side = KG.pick([-1, 1]) * 130; }
    else { h = 7.2; }

  /* ---------- 擊球 ---------- */

  }
  function incomingTop() {
    // 對手打出的旋轉（彈跳前量測，正 = 上旋，負 = 下旋）
    return B.ptop || 0;
  }
  let lastShot = { kind: '', kmh: 0 };
  // side: 0 玩家（往 -z 打）、1 電腦（往 +z 打）。p = { power, top, side, aim }
  function hitBall(side, p, isServe) {

    const inSpeed = Math.hypot(B.vx, B.vy, B.vz);
    const topIn = incomingTop();
    const power = clamp(p.power, 0, 1.4);
    const assist = side === 0 ? (assistOn() || (isServe && power <= 1.05)) : true;

      };

        let found = false;
        for (const aimK of [1, 0.5, 0]) {

            if (aimK !== 1 || i > 0) planShot(B, firstBounce(aimK), tz1, h * F[i], top, sideSpin, { net: false, assist: false, sideSign: -dir });

            copyBall(B, save);

          }

  /* ---------- 玩家擊球參數：由最近的手指 / 滑鼠揮動速度決定 ---------- */
  let touchUsed = false;

  let sHead = 0;

  function swipeVel(now) {
    vel.x = vel.y = 0;
    const newest = samp[(sHead + SAMP - 1) % SAMP];
    if (now - newest.t > 170) return vel;
    let best = 0;
    for (let i = 0; i < SAMP; i++) {
      const a = samp[i];
      if (now - a.t > 190) continue;
      for (let j = 0; j < SAMP; j++) {

        if (dt < 28 || dt > 130) continue;

  }
  function keyParams() {

    if (keys.K) return { power: 0.35, top: -150, side: 0, aim: lat * 0.4 };

    const sv = phase === 'serve' || phase === 'toss' || phase === 'rally' ? server : -1;
    $('rowP').classList.toggle('serving', sv === 0); $('rowA').classList.toggle('serving', sv === 1);
    $('sub').textContent = '第 ' + gameNo + ' 局 · ' + (bestOf === 5 ? '五戰三勝' : '三戰兩勝');
    if (phase === 'serve') $('rally').classList.remove('on');
  }

  const ov = $('ov');
  function hideOverlay() { ov.classList.remove('on'); ov.innerHTML = ''; }
  function card(html) { ov.innerHTML = '<div class="card">' + html + '</div>'; ov.classList.add('on'); return ov.firstChild; }
  function bind(root, map) { root.querySelectorAll('[data-a]').forEach(b => { b.addEventListener('click', e => { KG.sound('click'); map[b.dataset.a](b, e); }); }); }
  function toggles() {
    return '<div class="tg' + (opts.assist ? ' on' : '') + '" data-a="assist">輔助瞄準<small style="color:#8fa6cf;font-size:11px;margin-left:6px;flex:1">初級與練習</small><i></i></div>' +
      '<div class="tg' + (opts.music ? ' on' : '') + '" data-a="music">背景音樂<i></i></div>';
  }
  const togMap = {
    assist: b => { opts.assist = !opts.assist; b.classList.toggle('on', opts.assist); saveOpts(); },
    music: b => { opts.music = !opts.music; b.classList.toggle('on', opts.music); saveOpts(); }
  };
  function showTitle() {
    startMatch({ mode: 'demo', level: 2 });
    const c = card('<div class="logo">3D 桌球</div><div class="logo-sub">TABLE TENNIS</div>' +
      '<div class="two-l"><div><button class="btn" data-a="ai">對戰電腦</button><button class="btn blue" data-a="prac">發球機練習</button><button class="btn sec" data-a="help">操作說明</button></div>' +
      '<div><div class="stats"><div>初級勝<b>' + stats.w[0] + '</b></div><div>中級勝<b>' + stats.w[1] + '</b></div><div>高級勝<b>' + stats.w[2] + '</b></div><div>最長回合<b>' + stats.rally + '</b></div></div>' +
      '<div style="margin-top:6px">' + toggles() + '</div></div></div>');
    bind(c, Object.assign({ ai: showSetupAI, prac: showSetupPractice, help: showHelp }, togMap));
  }
  function seg(name, items, cur) {
    return '<div class="seg" data-seg="' + name + '">' + items.map(it => '<button data-v="' + it[0] + '" class="' + (String(it[0]) === String(cur) ? 'on' : '') + '">' + it[1] + (it[2] ? '<small>' + it[2] + '</small>' : '') + '</button>').join('') + '</div>';
  }
  function bindSeg(c) {
    c.querySelectorAll('.seg').forEach(s => s.querySelectorAll('button').forEach(b => b.addEventListener('click', () => {
      KG.sound('tick');
      s.querySelectorAll('button').forEach(x => x.classList.remove('on')); b.classList.add('on');
      const n = s.dataset.seg, v = b.dataset.v;
      if (n === 'level') opts.level = +v; else if (n === 'bestOf') opts.bestOf = +v; else if (n === 'spin') opts.spin = v;
      saveOpts();
    })));
  }
  function showSetupAI() {
    const c = card('<h2>對戰電腦</h2><div class="two-l"><div><div class="lbl">難度</div>' + seg('level', [[1, '初級', '勝 ' + stats.w[0]], [2, '中級', '勝 ' + stats.w[1]], [3, '高級', '勝 ' + stats.w[2]]], opts.level) +
      '<div class="lbl">賽制（每局 11 分）</div>' + seg('bestOf', [[3, '三戰兩勝'], [5, '五戰三勝']], opts.bestOf) + '</div><div style="margin-top:8px">' + toggles() +
      '<button class="btn" data-a="go">開始比賽</button><button class="btn sec" data-a="back">返回</button></div></div>');
    bindSeg(c);
    bind(c, Object.assign({ go: () => startMatch({ mode: 'ai', level: opts.level, bestOf: opts.bestOf }), back: showTitle }, togMap));
  }
  function showSetupPractice() {
    const c = card('<h2>發球機練習</h2><p style="font-size:13px">把機器送來的球回擊到對面檯面。最佳連續：<b style="color:#fff">' + stats.streak + '</b></p><div class="lbl">球的旋轉</div>' +
      seg('spin', [['top', '上旋'], ['back', '下旋'], ['side', '側旋'], ['none', '不轉'], ['mix', '混合']], opts.spin) +
      '<div style="margin-top:8px">' + toggles() + '</div><div class="two"><button class="btn sec" data-a="back">返回</button><button class="btn" data-a="go">開始練習</button></div>');
    bindSeg(c);
    bind(c, Object.assign({ go: () => startMatch({ mode: 'practice', spin: opts.spin }), back: showTitle }, togMap));
  }
  function showHelp() {
    const c = card('<h2>操作說明</h2><ul class="help">' +
      '<li><b>移動球拍</b>：手指或滑鼠移動，球拍會跟著走。對準來球即可，<b>球到了會自動擊球</b>。</li>' +
      '<li><b>揮拍</b>：擊球瞬間的揮動決定力道與旋轉。<b>往上滑＝上旋拉球</b>、<b>往下滑＝下旋切球</b>、<b>左右滑＝側旋與方向</b>，不動＝擋球。</li>' +
      '<li><b>發球</b>：按住拋球，往上（或往下、左右）滑動後放開即發球。球要先落自己檯面，再落對方檯面。</li>' +
      '<li><b>鍵盤</b>：方向鍵/WASD 移動；J 或空白鍵＝上旋、K＝下旋、L＝側旋；按住空白鍵拋球、放開發球；P 暫停。</li>' +
      '<li><b>規則</b>：11 分一局、需領先 2 分；每 2 分換發球（10 平後每分換）。發球擦網落在對方檯面＝重發。</li></ul>' +
      '<button class="btn" data-a="back">知道了</button>');
    bind(c, { back: showTitle });
  }
  function togglePause(force) {
    if (mode === 'demo' || phase === 'over') return;
    paused = force != null ? force : !paused;
    if (paused) {
      const c = card('<h2>暫停</h2>' + toggles() + '<button class="btn" data-a="resume">繼續</button><div class="two"><button class="btn sec" data-a="restart">重新開始</button><button class="btn sec" data-a="menu">回選單</button></div>');
      bind(c, Object.assign({ resume: () => togglePause(false), restart: () => startMatch({ mode, level, bestOf, spin: practice.spin }), menu: showTitle }, togMap));
    } else { hideOverlay(); last = performance.now(); }
  }
  function showOver(w) {
    ['banner', 'hint', 'shot', 'rally'].forEach(id => $(id).classList.remove('on'));
    bannerT = 0;
    const L = LV[level];
    const res = gameLog.map(g => '<span class="' + (g[0] > g[1] ? 'w' : '') + '">' + g[0] + ' - ' + g[1] + '</span>').join('');
    const c = card('<h2 style="color:' + (w === 0 ? '#ffb26b' : '#9fc0ff') + '">' + (w === 0 ? '你贏了！' : '電腦獲勝') + '</h2>' +
      '<p>對手：' + L.name + ' · 局數 ' + games[0] + ' : ' + games[1] + '</p><div class="res">' + res + '</div>' +
      '<div class="stats"><div>本場最長<b>' + longest + '</b></div><div>最長紀錄<b>' + stats.rally + '</b></div><div>' + L.name + '勝<b>' + stats.w[level - 1] + '</b></div><div>' + L.name + '敗<b>' + stats.l[level - 1] + '</b></div></div>' +
      '<div class="two" style="margin-top:8px"><button class="btn sec" data-a="menu">回選單</button><button class="btn" data-a="again">再來一場</button></div>');
    bind(c, { again: () => startMatch({ mode: 'ai', level, bestOf }), menu: showTitle });
  }
  $('pauseBtn').addEventListener('click', () => { KG.sound('click'); togglePause(); });
  // 選單：沒點準按鈕時，吸附到附近的按鈕
  ov.addEventListener('pointerup', e => {
    if (e.target.closest('button, .tg')) return;
    let best = null, bd = 44;
    ov.querySelectorAll('button, .tg').forEach(b => {
      const r = b.getBoundingClientRect();
      const dx = Math.max(r.left - e.clientX, 0, e.clientX - r.right), dy = Math.max(r.top - e.clientY, 0, e.clientY - r.bottom);
      const d = Math.hypot(dx, dy);
      if (d < bd) { bd = d; best = b; }
    });
    if (best) best.click();
  });

  /* =========================================================
   * 輸入
   * ========================================================= */
  const cv = $('gl');
  const ray = new THREE.Raycaster(), ndc = new THREE.Vector2(), plane = new THREE.Plane(new THREE.Vector3(0, 0, 1), -ZP), hitP = new THREE.Vector3();
  let rect = cv.getBoundingClientRect();
  function aimAt(clientX, clientY, isTouch) {
    const y = clientY - (isTouch ? Math.min(70, rect.height * 0.08) : 0);
    ndc.set((clientX - rect.left) / rect.width * 2 - 1, -((y - rect.top) / rect.height) * 2 + 1);
    ray.setFromCamera(ndc, camera);
    if (!ray.ray.intersectPlane(plane, hitP)) return;
    paddle.tx = clamp(hitP.x * (isTouch ? 1.12 : 1), -1.15, 1.15);
    paddle.ty = clamp(hitP.y, 0.8, 1.42);
  }
  const playing = () => (mode === 'ai' || mode === 'practice') && !paused && phase !== 'over';
  let ptrId = -1, lastMX = -1, lastMY = -1;
  cv.addEventListener('pointerdown', e => {
    e.preventDefault();
    if (e.pointerType !== 'mouse') touchUsed = true;
    if (!playing()) return;
    ptrId = e.pointerId;
    try { cv.setPointerCapture(e.pointerId); } catch (err) { /* 忽略 */ }
    rect = cv.getBoundingClientRect();
    addSample(e.timeStamp, e.clientX, e.clientY);
    aimAt(e.clientX, e.clientY, e.pointerType !== 'mouse');
    lastKeyTime = -1e9;
    if (phase === 'serve' && server === 0 && !autoPlayer) tossBall(0);
  });
  cv.addEventListener('pointermove', e => {
    if (!playing()) return;
    if (e.pointerType !== 'mouse' && e.pointerId !== ptrId) return;
    if (e.pointerType === 'mouse') { if (e.clientX === lastMX && e.clientY === lastMY) return; lastMX = e.clientX; lastMY = e.clientY; }
    const list = e.getCoalescedEvents ? e.getCoalescedEvents() : null;
    if (list && list.length > 1) { for (let i = 0; i < list.length; i++) addSample(list[i].timeStamp, list[i].clientX, list[i].clientY); }
    else addSample(e.timeStamp, e.clientX, e.clientY);
    aimAt(e.clientX, e.clientY, e.pointerType !== 'mouse');
    if (e.pointerType === 'mouse') lastKeyTime = -1e9;
  });
  function releaseServe(t) {
    if (phase === 'toss' && server === 0 && !autoPlayer && B.y > 0.8) {
      const kp = keyParams();
      const p = kp && performance.now() - lastKeyTime < 3000 ? kp : swipeParams(swipeVel(t));
      phase = 'rally'; rally.serving = true;
      hitBall(0, p, true);
    }
  }
  cv.addEventListener('pointerup', e => {
    if (e.pointerId !== ptrId && e.pointerType !== 'mouse') return;
    ptrId = -1;
    if (!playing()) return;
    releaseServe(e.timeStamp);
  });
  cv.addEventListener('pointercancel', () => { ptrId = -1; });
  cv.addEventListener('contextmenu', e => e.preventDefault());
  const KEYMAP = { ArrowLeft: 'left', a: 'left', A: 'left', ArrowRight: 'right', d: 'right', D: 'right', ArrowUp: 'up', w: 'up', W: 'up', ArrowDown: 'down', s: 'down', S: 'down', j: 'J', J: 'J', k: 'K', K: 'K', l: 'L', L: 'L' };
  window.addEventListener('keydown', e => {
    if (e.key === 'p' || e.key === 'P' || e.key === 'Escape') { togglePause(); return; }
    const k = KEYMAP[e.key];
    if (k) { keys[k] = true; lastKeyTime = performance.now(); if (e.key.startsWith('Arrow')) e.preventDefault(); }
    if (e.key === ' ') {
      e.preventDefault();
      if (e.repeat) return;
      keys.space = true; lastKeyTime = performance.now();
      if (playing() && phase === 'serve' && server === 0) tossBall(0);
    }
  });
  window.addEventListener('keyup', e => {
    const k = KEYMAP[e.key];
    if (k) keys[k] = false;
    if (e.key === ' ') {
      if (playing() && phase === 'toss' && server === 0) {
        const lat = (keys.right ? 1 : 0) - (keys.left ? 1 : 0);
        const p = keys.K ? { power: 0.2, top: -150, side: 0, aim: lat * 0.4 } : keys.L ? { power: 0.35, top: 20, side: -(lat || 1) * 120, aim: lat * 0.4 } : { power: 0.45, top: 90, side: 0, aim: lat * 0.4 };
        phase = 'rally'; rally.serving = true; hitBall(0, p, true);
      }
      keys.space = false;
    }
  });
  function resize() {
    rect = cv.getBoundingClientRect();
    W = Math.max(1, rect.width); H = Math.max(1, rect.height);
    renderer.setSize(W, H, false);
    fitCamera();
  }
  window.addEventListener('resize', resize);
  if (window.visualViewport) window.visualViewport.addEventListener('resize', resize);
  window.addEventListener('orientationchange', () => setTimeout(resize, 120));
  document.addEventListener('visibilitychange', () => { if (document.hidden && playing()) togglePause(true); });

  /* =========================================================
   * 自動畫質（太卡就一步步降：解析度 → 影子 → 更低解析度），並記住
   * ========================================================= */
  const QKEY = 'quality:' + location.pathname.split('/').filter(Boolean).slice(-1)[0];
  const baseRatio = Math.min(window.devicePixelRatio || 1, small ? 1.75 : 2);
  const QLEVELS = [
    { ratio: baseRatio, shadow: true },
    { ratio: Math.min(baseRatio, 1.35), shadow: true },
    { ratio: 1, shadow: true },
    { ratio: 1, shadow: false },
    { ratio: 0.8, shadow: false }
  ];
  let qLevel = clamp(KG.store.get(QKEY, KG.lowEnd ? 2 : 0) | 0, 0, QLEVELS.length - 1);
  const perf = { last: 0, n: 0, sum: 0, cool: 2.5 };
  function applyQuality() {
    const q = QLEVELS[qLevel];
    renderer.setPixelRatio(q.ratio);
    renderer.setSize(W, H, false);
    if (renderer.shadowMap.enabled !== q.shadow) {
      renderer.shadowMap.enabled = q.shadow;
      scene.traverse(o => { if (o.material) [].concat(o.material).forEach(m => { m.needsUpdate = true; }); });
    }
  }
  function renderFrame() {
    renderer.render(scene, camera);
    const now = performance.now(), dt = perf.last ? Math.min(0.5, (now - perf.last) / 1000) : 0;
    perf.last = now;
    if (document.hidden || qLevel >= QLEVELS.length - 1) return;
    perf.cool -= dt;
    if (perf.cool > 0) return;
    perf.sum += dt; perf.n++;
    if (perf.n >= 60) {
      if (perf.sum / perf.n > 1 / 45) {
        qLevel++;
        KG.store.set(QKEY, qLevel);
        applyQuality();
        perf.cool = 1.5;
      }
      perf.n = 0; perf.sum = 0;
    }
  }

  let last = performance.now(), first = true, noRender = false;
  function loop(now) {
    const dt = Math.max(0, Math.min(0.05, (now - last) / 1000));
    last = now;
    if (!document.hidden) {
      update(dt);
      updateCamera();
      sync3D(dt);
      if (!noRender) renderFrame();
    } else perf.last = 0;
    if (first) { first = false; const m = $('msg'); if (m) m.remove(); }
    requestAnimationFrame(loop);
  }
  resize();
  applyQuality();
  showTitle();
  requestAnimationFrame(loop);

  /* ---------- 測試用介面 ---------- */
  window.__tt = {
    state: () => ({
      mode, phase, paused, level, bestOf, score: score.slice(), games: games.slice(), gameNo, server, longest, ballMode,
      rally: { hits: rally.hits, last: rally.last, canHit: rally.canHit, serving: rally.serving, stage: rally.stage },
      ball: { x: +B.x.toFixed(3), y: +B.y.toFixed(3), z: +B.z.toFixed(3), vx: +B.vx.toFixed(2), vy: +B.vy.toFixed(2), vz: +B.vz.toFixed(2), wx: +B.wx.toFixed(1), wy: +B.wy.toFixed(1), wz: +B.wz.toFixed(1) },
      paddle: { x: +paddle.x.toFixed(3), y: +paddle.y.toFixed(3) }, ai: { x: +ai.x.toFixed(3) }, practice: Object.assign({}, practice), lastShot: Object.assign({}, lastShot),
      quality: qLevel, fov: +camera.fov.toFixed(1), timeScale, slow: slowT > 0, overlay: ov.classList.contains('on'), calls: calls.slice(-12), stats: JSON.parse(JSON.stringify(stats))
    }),
    start: o => startMatch(o),
    menu: () => showTitle(),
    step: n => { for (let i = 0; i < (n || 1); i++) update(1 / 60); },
    auto: on => { autoPlayer = !!on; },
    setPaddle: (x, y) => { paddle.tx = paddle.x = x; if (y != null) paddle.ty = paddle.y = y; },
    // 把球放在任意狀態
    setBall: s => { Object.assign(B, { wx: 0, wy: 0, wz: 0 }, s); ballMode = 'free'; },
    // 從目前球的位置，以玩家（0）或電腦（1）的參數擊球
    hitBall: (p, side) => { if (phase !== 'rally') { resetRally(); phase = 'rally'; } ballMode = 'free'; return hitBall(side || 0, Object.assign({ power: 0.5, top: 0, side: 0, aim: 0 }, p)); },
    serve: p => { if (phase === 'serve' && server === 0) { tossBall(0); for (let i = 0; i < 30; i++) update(1 / 60); phase = 'rally'; rally.serving = true; return hitBall(0, Object.assign({ power: 0.4, top: 0, side: 0, aim: 0 }, p), true); } return null; },
    // 純物理模擬：回傳事件與落點
    sim: (s, sec) => {
      const b = Object.assign(mkBall(), { wx: 0, wy: 0, wz: 0 }, s), ev = [];
      let maxY = b.y;
      for (let i = 0; i < (sec || 2) / DT; i++) { const e = step(b, DT, true); maxY = Math.max(maxY, b.y); if (e) ev.push({ e: ['', 'table', 'net', 'floor', 'cord'][e], x: +b.x.toFixed(3), y: +b.y.toFixed(3), z: +b.z.toFixed(3), t: +(i * DT).toFixed(3), vz: +b.vz.toFixed(2), vy: +b.vy.toFixed(2) }); }
      return { ev, end: { x: b.x, y: b.y, z: b.z }, maxY };
    },
    plan: (from, tx, tz, h, top, side) => { const b = Object.assign(mkBall(), from); planShot(b, tx, tz, h, top || 0, side || 0, { net: true, assist: false, sideSign: Math.sign(tz) }); return Object.assign({}, shot); },
    allCalls: () => calls.slice(),
    autoParams: f => { autoP = f || null; },
    serveCheck: (side, p, x) => {
      resetRally(); phase = 'rally'; rally.serving = true; ballMode = 'free'; server = side;
      Object.assign(B, { x: x || 0, y: 1.0, z: side === 0 ? ZP - 0.05 : -ZP + 0.05, vx: 0, vy: -0.5, vz: 0, wx: 0, wy: 0, wz: 0 });
      const kind = hitBall(side, Object.assign({ power: 0.4, top: 0, side: 0, aim: 0 }, p), true);
      const ok = serveLegal(B, side);
      const sim = window.__tt.sim(Object.assign({}, B), 2).ev.slice(0, 3).map(e => e.e + '@' + e.z);
      phase = 'dead';
      return { ok, kind, v: [B.vx, B.vy, B.vz].map(v => +v.toFixed(2)), sim };
    },
    pause: on => togglePause(on),
    quality: () => qLevel,
    noRender: on => { noRender = !!on; },
    samples: () => samp.map(o => [Math.round(o.t), Math.round(o.x), Math.round(o.y)]).filter(o => o[0] > 0).sort((a, b) => a[0] - b[0]),
    pointerParams: () => { const t = samp[(sHead + SAMP - 1) % SAMP].t; return swipeParams(swipeVel(t + 10)); }
  };
}
</script>
</body>
</html>
