<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>像素畫室</title>
<link rel="stylesheet" href="../../assets/common.css">
<style>
  :root { --ink: #4a3b52; --tb: 54px; --sw: 34px; --gap: 5px; --acc: #ffd65c; }
  html, body { height: 100%; overflow: hidden; }
  body {
    touch-action: none;
    background:
      radial-gradient(circle, rgba(255,255,255,.85) 0 1.6px, transparent 2.4px) 0 0 / 22px 22px,
      linear-gradient(160deg, #e6f3ff 0%, #f9efff 48%, #fff3e0 100%);
  }
  button { font-family: var(--kg-font); color: var(--ink); -webkit-touch-callout: none; }
  .hide { display: none !important; }
  svg { pointer-events: none; }

  /* ===== 編輯器版面 ===== */
  #app {
    position: fixed; inset: 0; display: grid; gap: 8px;
    padding: 10px max(10px, env(safe-area-inset-right)) max(10px, env(safe-area-inset-bottom)) max(10px, env(safe-area-inset-left));
    grid-template-columns: minmax(0, 1fr);
    grid-template-rows: 48px minmax(0, 1fr) auto auto;
    grid-template-areas: "top" "mid" "pal" "tools";
  }
  #app.land {
    grid-template-columns: auto minmax(0, 1fr) auto;
    grid-template-rows: 48px minmax(0, 1fr);
    grid-template-areas: "top top top" "tools mid pal";
  }
  #app.off { visibility: hidden; }
  #top { grid-area: top; display: flex; align-items: center; gap: 6px; padding: 0 56px; min-width: 0; }
  .tbtn {
    flex: 0 0 auto; width: 46px; height: 46px; border: none; border-radius: 15px; background: #fff; cursor: pointer; padding: 0;
    box-shadow: 0 4px 0 rgba(74,59,82,.16), 0 6px 12px rgba(74,59,82,.1);
    display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 10px; font-weight: 900; line-height: 1;
    transition: transform .1s;
  }
  .tbtn svg { width: 26px; height: 26px; }
  .tbtn:active { transform: translateY(3px); }
  .tbtn:disabled { opacity: .4; }
  .tbtn.pink { background: linear-gradient(180deg, #ffb0c8, #f25c8f); color: #fff; box-shadow: 0 4px 0 #c2406e, 0 6px 12px rgba(194,64,110,.3); }
  .tbtn.on { background: linear-gradient(180deg, #fff4bf, #ffd65c); }
  #topMid { flex: 1 1 auto; min-width: 0; display: flex; justify-content: center; }
  #docTitle { font-weight: 900; font-size: 17px; background: rgba(255,255,255,.85); border-radius: 999px; padding: 6px 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; box-shadow: 0 3px 0 rgba(74,59,82,.1); }
  #app:not(.wide) #docTitle { display: none; }

  #mid { grid-area: mid; display: flex; flex-direction: column; gap: 8px; min-height: 0; min-width: 0; }
  #stage {
    flex: 1 1 auto; position: relative; min-height: 0; border-radius: 22px; overflow: hidden; touch-action: none;
    background: rgba(255,255,255,.5); box-shadow: inset 0 2px 10px rgba(74,59,82,.14);
  }
  #stage.cele { animation: cele .7s cubic-bezier(.2,1.6,.4,1); }
  @keyframes cele { 0% { transform: scale(1); } 35% { transform: scale(1.04) rotate(-1deg); } 100% { transform: scale(1); } }
  #stage.shake { animation: kg-shake .35s ease; }
  #cv { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: crosshair; }
  #cv.pan { cursor: grab; }
  #zoomChip { position: absolute; right: 8px; bottom: 8px; font-size: 12px; font-weight: 900; background: rgba(255,255,255,.85); border-radius: 999px; padding: 2px 8px; pointer-events: none; opacity: 0; transition: opacity .3s; }
  #zoomChip.show { opacity: 1; }
  #playBadge { position: absolute; left: 50%; top: 8px; transform: translateX(-50%); font-size: 14px; font-weight: 900; color: #fff; background: #4cbf7a; border-radius: 999px; padding: 4px 12px; pointer-events: none; }

  #viewbar { flex: 0 0 auto; display: flex; gap: 6px; align-items: center; height: 42px; overflow-x: auto; overflow-y: hidden; padding: 0 2px 3px; scrollbar-width: none; }
  #viewbar::-webkit-scrollbar { display: none; }
  .vb {
    flex: 0 0 auto; height: 38px; min-width: 40px; padding: 0 9px; border: none; border-radius: 999px; background: #fff; cursor: pointer;
    box-shadow: 0 3px 0 rgba(74,59,82,.16); display: inline-flex; align-items: center; justify-content: center; gap: 4px; font-weight: 900; font-size: 14px; white-space: nowrap;
  }
  .vb svg { width: 24px; height: 24px; flex: 0 0 auto; }
  .vb.on { background: linear-gradient(180deg, #fff4bf, #ffd65c); box-shadow: 0 3px 0 #d69a12; }
  .vb .t { display: none; }
  #app.wide .vb .t, .vb.always .t { display: inline; }
  .seg { flex: 0 0 auto; display: inline-flex; background: #fff; border-radius: 999px; box-shadow: 0 3px 0 rgba(74,59,82,.16); padding: 3px; gap: 2px; }
  .seg button { border: none; background: none; height: 32px; padding: 0 10px; border-radius: 999px; font-weight: 900; font-size: 14px; cursor: pointer; }
  .seg button.on { background: #7cc8ff; color: #fff; }
  #prog { flex: 1 1 120px; min-width: 120px; height: 38px; border-radius: 999px; background: #fff; box-shadow: 0 3px 0 rgba(74,59,82,.16); position: relative; overflow: hidden; display: flex; align-items: center; justify-content: center; font-weight: 900; font-size: 15px; }
  #prog i { position: absolute; left: 0; top: 0; bottom: 0; width: 0; background: linear-gradient(180deg, #b8f5c4, #5fd17f); transition: width .35s cubic-bezier(.2,1.4,.4,1); }
  #prog span { position: relative; }
  .spacer { flex: 1 1 auto; }

  /* 動畫格 */
  #frames { flex: 0 0 auto; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; background: rgba(255,255,255,.75); border-radius: 18px; padding: 6px; box-shadow: 0 3px 0 rgba(74,59,82,.08); }
  #fthumbs { flex: 1 1 160px; min-width: 0; display: flex; gap: 6px; overflow-x: auto; padding: 3px; scrollbar-width: thin; touch-action: pan-x; }
  .fth { flex: 0 0 auto; width: 46px; height: 46px; border-radius: 10px; border: 3px solid #fff; padding: 0; position: relative; cursor: pointer;
    background: repeating-conic-gradient(#f1edf5 0 25%, #fff 0 50%) 0 0 / 10px 10px; box-shadow: 0 2px 0 rgba(74,59,82,.15); }
  .fth canvas { width: 100%; height: 100%; display: block; image-rendering: pixelated; border-radius: 6px; }
  .fth.on { border-color: #f2a91f; box-shadow: 0 0 0 2px #fff, 0 3px 0 rgba(74,59,82,.2); }
  .fth b { position: absolute; left: -4px; top: -6px; background: var(--ink); color: #fff; font-size: 10px; border-radius: 999px; min-width: 16px; height: 16px; line-height: 16px; text-align: center; }
  #facts { display: flex; gap: 4px; align-items: center; flex: 1 1 auto; justify-content: center; flex-wrap: nowrap; }
  .fb { flex: 0 0 auto; width: 36px; height: 38px; border: none; border-radius: 12px; background: #fff; box-shadow: 0 3px 0 rgba(74,59,82,.16); display: grid; place-items: center; cursor: pointer; padding: 0; }
  .fb svg { width: 24px; height: 24px; }
  .fb:disabled { opacity: .35; }
  .fb.on { background: #b8f5c4; }
  #fpsBox { flex: 0 0 auto; display: flex; align-items: center; gap: 4px; font-weight: 900; font-size: 13px; background: #fff; border-radius: 999px; padding: 0 10px; height: 40px; box-shadow: 0 3px 0 rgba(74,59,82,.16); }
  #fps { width: 72px; accent-color: #8e6cef; }
  #app:not(.wide) #fpsBox .t2 { display: none; }
  #pal.guide #curSw { display: none; }
  #pal.guide .sw { width: 100%; height: 100%; }

  /* 工具 */
  #tools { grid-area: tools; display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; align-content: center; justify-self: center; width: calc(var(--tb) * 6 + 30px); }
  #app.land #tools { width: calc(var(--tb) * 2 + 6px); justify-content: flex-start; }
  .tool {
    width: var(--tb); height: var(--tb); border: none; border-radius: 16px; background: #fff; cursor: pointer; padding: 2px 0 0; position: relative;
    box-shadow: 0 4px 0 rgba(74,59,82,.16), 0 6px 12px rgba(74,59,82,.08);
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px;
    font-size: clamp(9px, calc(var(--tb) * .2), 12px); font-weight: 900; line-height: 1.05; transition: transform .12s cubic-bezier(.2,1.6,.4,1);
  }
  .tool svg { width: 58%; height: 58%; }
  .tool:active { transform: scale(.92); }
  .tool.on { background: linear-gradient(180deg, #fff6cc, #ffd65c); box-shadow: 0 0 0 3px #fff, 0 0 0 5px #f2a91f, 0 5px 8px rgba(74,59,82,.2); transform: translateY(-2px); }
  .tool.mir { background: linear-gradient(180deg, #ffe0f1, #ff9ccf); box-shadow: 0 0 0 3px #fff, 0 0 0 5px #f25cb3; }
  .tool.dis { opacity: .35; pointer-events: none; }

  /* 調色盤 */
  #pal { grid-area: pal; display: grid; gap: var(--gap); justify-content: center; align-content: center;
    grid-template-columns: calc(var(--sw) * 1.5) repeat(8, var(--sw)); grid-template-rows: repeat(4, var(--sw)); }
  #app.land #pal { grid-template-columns: repeat(4, var(--sw)); grid-template-rows: calc(var(--sw) * 1.4) repeat(8, var(--sw)); }
  #curSw { grid-row: 1 / 5; position: relative; border: none; border-radius: 14px; padding: 0; cursor: pointer; overflow: hidden;
    background: conic-gradient(#e83f4f, #ffd93d, #4cbf7a, #7cc8ff, #8e6cef, #f25cb3, #e83f4f); box-shadow: 0 4px 0 rgba(74,59,82,.18); }
  #app.land #curSw { grid-row: auto; grid-column: 1 / 5; }
  #curSw .in { position: absolute; inset: 5px 5px 20px; border-radius: 10px; border: 3px solid #fff; box-shadow: inset 0 -4px 0 rgba(0,0,0,.12); }
  #curSw .lb { position: absolute; left: 0; right: 0; bottom: 2px; font-size: 11px; font-weight: 900; color: #fff; text-shadow: 0 1px 2px rgba(0,0,0,.5); }
  #curSw input { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer; border: none; padding: 0; }
  .sw { width: var(--sw); height: var(--sw); border: 3px solid #fff; border-radius: 10px; padding: 0; cursor: pointer; position: relative;
    box-shadow: 0 3px 0 rgba(74,59,82,.18), inset 0 -4px 0 rgba(0,0,0,.1); transition: transform .15s cubic-bezier(.2,1.6,.4,1); }
  .sw.on { transform: scale(1.14); box-shadow: 0 0 0 3px var(--ink), 0 4px 8px rgba(74,59,82,.35); z-index: 1; }
  .sw .n { position: absolute; inset: 0; display: grid; place-items: center; font-weight: 900; font-size: calc(var(--sw) * .48); color: #fff;
    text-shadow: 1px 1px 0 rgba(0,0,0,.45), -1px -1px 0 rgba(0,0,0,.45), 1px -1px 0 rgba(0,0,0,.45), -1px 1px 0 rgba(0,0,0,.45); }
  .sw.done::after { content: ''; position: absolute; right: -5px; top: -5px; width: 14px; height: 14px; border-radius: 50%; background: #4cbf7a; border: 2px solid #fff; }

  #fx { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 60; }

  /* ===== 畫面（標題、選圖、作品櫃） ===== */
  .screen { position: fixed; inset: 0; z-index: 8900; overflow-y: auto; overflow-x: hidden; touch-action: pan-y; -webkit-overflow-scrolling: touch;
    display: flex; flex-direction: column; align-items: center; padding: 70px 14px max(24px, env(safe-area-inset-bottom));
    background: radial-gradient(circle, rgba(255,255,255,.85) 0 1.6px, transparent 2.4px) 0 0 / 22px 22px, linear-gradient(160deg, #e6f3ff 0%, #f9efff 48%, #fff3e0 100%); }
  #title { justify-content: center; gap: clamp(6px, 2vh, 18px); padding-top: 64px; }
  .logo { width: min(92vw, 560px, 70vh); height: auto; display: block; overflow: visible; animation: drop .8s cubic-bezier(.2,1.6,.4,1) both; }
  .logo text { font-family: var(--kg-font); }
  @keyframes drop { from { transform: translateY(-40px) scale(.7); opacity: 0; } to { transform: none; opacity: 1; } }
  #hero { width: min(58vw, 34vh, 240px); aspect-ratio: 1; display: block; animation: drop .9s .1s cubic-bezier(.2,1.6,.4,1) both; }
  .tbtns { display: flex; flex-wrap: wrap; gap: 14px; justify-content: center; animation: drop .9s .2s cubic-bezier(.2,1.6,.4,1) both; max-width: 640px; }
  .big {
    font-family: var(--kg-font); font-weight: 900; font-size: clamp(20px, 5.4vw, 26px); color: #fff; letter-spacing: 1px; cursor: pointer;
    border: 4px solid #fff; border-radius: 999px; padding: 8px 24px 8px 12px; min-height: 64px; display: inline-flex; align-items: center; gap: 8px;
    text-shadow: 0 2px 0 rgba(0,0,0,.2); transition: transform .1s;
  }
  .big svg { width: 38px; height: 38px; flex: 0 0 auto; }
  .big:active { transform: translateY(5px) scale(.97); }
  .big.g { background: linear-gradient(180deg, #8ff0a4, #34b45a); box-shadow: 0 7px 0 #22803f, 0 12px 20px rgba(20,90,40,.3); }
  .big.b { background: linear-gradient(180deg, #a6dcff, #3a9ee8); box-shadow: 0 7px 0 #2268a3, 0 12px 20px rgba(30,80,140,.3); }
  .big.p { background: linear-gradient(180deg, #ffb3d1, #e8558d); box-shadow: 0 7px 0 #b83a6c, 0 12px 20px rgba(160,40,90,.3); }
  .big.y { background: linear-gradient(180deg, #ffe58a, #f2a91f); box-shadow: 0 7px 0 #b9790c, 0 12px 20px rgba(160,110,10,.3); color: #6b4a00; text-shadow: none; }
  .big.sm { font-size: 18px; min-height: 52px; padding: 6px 18px 6px 10px; }
  .big.sm svg { width: 30px; height: 30px; }
  .tsub { font-size: 15px; font-weight: 800; background: rgba(255,255,255,.8); border-radius: 999px; padding: 6px 16px; text-align: center; animation: drop .9s .3s both; }
  .banner { font-size: clamp(24px, 6.5vw, 32px); font-weight: 900; color: #fff; letter-spacing: 2px; padding: 6px 30px; border-radius: 16px; border: 4px solid #fff;
    background: linear-gradient(180deg, #b49cff, #7a56e0); box-shadow: 0 6px 0 rgba(0,0,0,.15); text-shadow: 0 3px 0 rgba(0,0,0,.2); animation: drop .5s both; }
  .banner.p { background: linear-gradient(180deg, #ffb3d1, #e8558d); }
  .shead { display: flex; align-items: center; gap: 12px; width: min(680px, 100%); justify-content: center; position: relative; }
  .back { position: absolute; left: 0; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(112px, 1fr)); gap: 14px; width: min(680px, 100%); margin: 16px auto 8px; }
  .card2 { position: relative; border: 4px solid #fff; border-radius: 22px; background: #fff; padding: 6px 6px 5px; cursor: pointer;
    box-shadow: 0 6px 0 rgba(0,0,0,.1), 0 10px 18px rgba(0,0,0,.1); display: flex; flex-direction: column; align-items: center; gap: 3px;
    animation: drop .45s both cubic-bezier(.2,1.6,.4,1); transition: transform .12s; font-family: var(--kg-font); }
  .card2:active { transform: scale(.94); }
  .card2 canvas { width: 100%; aspect-ratio: 1; border-radius: 14px; image-rendering: pixelated; display: block;
    background: repeating-conic-gradient(#f1edf5 0 25%, #fff 0 50%) 0 0 / 16px 16px; }
  .card2 .nm { font-size: 16px; font-weight: 900; }
  .card2 .sub { font-size: 12px; font-weight: 800; opacity: .7; }
  .card2 .ok { position: absolute; right: -8px; top: -8px; width: 34px; height: 34px; border-radius: 50%; background: #4cbf7a; border: 3px solid #fff; display: grid; place-items: center; box-shadow: 0 3px 0 rgba(0,0,0,.15); }
  .card2 .ok svg { width: 22px; height: 22px; }
  .card2 .pc { position: absolute; left: 10px; top: 10px; background: rgba(74,59,82,.8); color: #fff; font-size: 12px; font-weight: 900; border-radius: 999px; padding: 1px 7px; }
  .card2 .del { position: absolute; right: -10px; top: -10px; width: 42px; height: 42px; border-radius: 50%; border: 3px solid #fff; background: #ff8ea0; display: grid; place-items: center; cursor: pointer; padding: 0; box-shadow: 0 3px 0 rgba(0,0,0,.15); }
  .card2 .del svg { width: 22px; height: 22px; }
  .empty { margin-top: 30px; font-size: 19px; font-weight: 800; text-align: center; background: rgba(255,255,255,.85); padding: 20px 24px; border-radius: 24px; line-height: 1.6; }

  /* ===== 視窗 ===== */
  .ov { position: fixed; inset: 0; z-index: 9000; display: grid; place-items: center; padding: 64px 14px 14px; background: rgba(60,40,80,.45); backdrop-filter: blur(3px); animation: kg-fade .2s ease; overflow-y: auto; touch-action: pan-y; }
  .card { width: min(440px, 100%); background: linear-gradient(180deg, #fff 0%, #fff6fa 100%); border: 5px solid #fff; border-radius: 30px; padding: 18px 16px 18px; text-align: center;
    box-shadow: 0 16px 40px rgba(60,40,80,.35); animation: kg-pop .35s cubic-bezier(.2,1.6,.4,1); }
  .card h2 { margin: 0 0 10px; font-size: 26px; }
  .card p { margin: 0 0 12px; font-size: 16px; line-height: 1.5; font-weight: 700; }
  .acts { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-top: 8px; }
  .acts .kg-btn { font-size: 18px; padding: 10px 20px; }
  .tiles { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
  .tile { min-height: 58px; border: none; border-radius: 18px; background: #fff; box-shadow: 0 4px 0 rgba(74,59,82,.15), 0 6px 12px rgba(74,59,82,.08); display: flex; align-items: center; gap: 8px; padding: 6px 12px; font-size: 17px; font-weight: 900; cursor: pointer; text-align: left; }
  .tile svg { width: 32px; height: 32px; flex: 0 0 auto; }
  .tile:active { transform: translateY(3px); }
  .tile.on { background: linear-gradient(180deg, #fff4bf, #ffd65c); }
  .sizes { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; margin-bottom: 6px; }
  .sizeb { border: 4px solid #fff; border-radius: 22px; background: linear-gradient(180deg, #fff, #f1ecff); box-shadow: 0 5px 0 rgba(74,59,82,.15); padding: 10px 6px 8px; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 4px; font-weight: 900; font-size: 18px; }
  .sizeb canvas { width: 64px; height: 64px; image-rendering: pixelated; }
  .sizeb small { font-size: 12px; opacity: .7; }
  .sizeb:active { transform: scale(.95); }
  .card textarea { width: 100%; height: 76px; border-radius: 14px; border: 3px solid #e3dcef; padding: 8px; font: 12px/1.3 ui-monospace, monospace; resize: none; user-select: text; -webkit-user-select: text; touch-action: auto; }
  .exImg { max-width: 100%; width: 192px; image-rendering: pixelated; border-radius: 12px; background: repeating-conic-gradient(#f1edf5 0 25%, #fff 0 50%) 0 0 / 16px 16px; border: 4px solid #fff; box-shadow: 0 4px 0 rgba(74,59,82,.15); }
  .dl { display: inline-flex; align-items: center; justify-content: center; text-decoration: none; }
  .chk { display: inline-flex; align-items: center; gap: 6px; font-weight: 900; font-size: 15px; margin: 6px 0; cursor: pointer; }
  .chk input { width: 22px; height: 22px; accent-color: #8e6cef; }
  .winPic { width: 160px; height: 160px; image-rendering: pixelated; border-radius: 16px; background: #fff; border: 5px solid #fff; box-shadow: 0 6px 0 rgba(74,59,82,.15); animation: kg-pop .6s .1s cubic-bezier(.2,1.6,.4,1) both; }
  .stars { display: flex; justify-content: center; gap: 4px; margin: 6px 0; }
  .stars svg { width: 48px; height: 48px; animation: kg-pop .5s cubic-bezier(.2,1.8,.4,1) both; }
  .stars svg:nth-child(2) { width: 60px; height: 60px; animation-delay: .15s; }
  .stars svg:nth-child(3) { animation-delay: .3s; }
  @media (max-height: 520px) {
    .ov { padding-top: 12px; }
    .card { width: min(560px, 100%); padding: 12px 14px; }
    .card h2 { font-size: 21px; margin-bottom: 6px; }
    .tiles { grid-template-columns: repeat(3, 1fr); gap: 8px; }
    .tile { min-height: 46px; font-size: 15px; }
    .tile svg { width: 26px; height: 26px; }
    .sizes { grid-template-columns: repeat(4, 1fr); }
    .card textarea { height: 48px; }
    .winPic { width: 110px; height: 110px; }
    .stars svg { width: 34px; height: 34px; } .stars svg:nth-child(2) { width: 42px; height: 42px; }
  }
  @media (prefers-reduced-motion: reduce) { .logo, #hero, .tbtns, .card2 { animation: none; } }
</style>
</head>
<body>
<div id="app" class="off">
  <div id="top">
    <button class="tbtn" id="bMenu" aria-label="選單"></button>
    <button class="tbtn" id="bUndo" aria-label="復原"></button>
    <button class="tbtn" id="bRedo" aria-label="重做"></button>
    <div id="topMid"><span id="docTitle">自由創作</span></div>
    <button class="tbtn" id="bAnim" aria-label="動畫"></button>
    <button class="tbtn pink" id="bSave" aria-label="存檔"></button>
  </div>
  <div id="tools"></div>
  <div id="mid">
    <div id="stage"><canvas id="cv"></canvas><div id="zoomChip"></div><div id="playBadge" class="hide">播放中．點一下停止</div></div>
    <div id="frames" class="hide">
      <div id="fthumbs"></div>
      <div id="facts">
        <button class="fb" id="fAdd" aria-label="新增一格"></button>
        <button class="fb" id="fDup" aria-label="複製這一格"></button>
        <button class="fb" id="fDel" aria-label="刪除這一格"></button>
        <button class="fb" id="fLeft" aria-label="往前移"></button>
        <button class="fb" id="fRight" aria-label="往後移"></button>
        <button class="fb" id="fPlay" aria-label="播放"></button>
        <label id="fpsBox"><span class="t2">速度</span><input type="range" id="fps" min="1" max="20" value="6"><span id="fpsV">6</span></label>
      </div>
    </div>
    <div id="viewbar"></div>
  </div>
  <div id="pal"></div>

  ov.querySelectorAll('.sizeb').forEach(b => {
    const s = +b.dataset.s, c = b.querySelector('canvas'), x = c.getContext('2d');
    for (let y = 0; y < s; y++) for (let xx = 0; xx < s; xx++) { x.fillStyle = (xx + y) & 1 ? '#efeaf4' : '#fff'; x.fillRect(xx, y, 1, 1); }
    // 一顆小愛心示意大小
    const heart = PIC[0].target; for (let y = 0; y < 16; y++) for (let xx = 0; xx < 16; xx++) { const v = heart[y * 16 + xx]; if (v) { x.fillStyle = PAL32[v - 1]; x.fillRect(xx + ((s - 16) >> 1), y + ((s - 16) >> 1), 1, 1); } }
    b.addEventListener('click', () => {
      ov.close(); KG.sound('pop');
      if (fromEditor && S.mode === 'free' && (doc.frames.length > 1 || FR().some(v => v))) saveDraft();
      newCanvas(s);
    });
  });
  const cont = ov.querySelector('#szCont');
  if (cont) cont.addEventListener('click', () => { ov.close(); try { loadDoc(decodeDoc(fromB64(d.code)), d.workId); } catch (_) { newCanvas(16); } });
}
function newCanvas(s) {
  if (!SIZES.includes(s)) return false;
  return loadDoc(newDoc(s), null);
}
let gifURL = null;
function openExport() {
  commitSel();
  if (gifURL) { URL.revokeObjectURL(gifURL); gifURL = null; }
  const bytes = encodeGIF(doc, Math.max(4, Math.round(256 / N())), S.transparent);
  const blob = new Blob([bytes], { type: 'image/gif' }); gifURL = URL.createObjectURL(blob);
  const ov = sheet({
    title: '匯出圖片',
    html: `<img class="exImg" id="exImg" src="${gifURL}" alt="作品預覽"><br>
      <label class="chk"><input type="checkbox" id="exTr" ${S.transparent ? 'checked' : ''}> 透明背景</label>
      <div class="acts" style="margin:4px 0 6px">
        <button class="kg-btn green" id="exGif">下載 GIF${doc.frames.length > 1 ? ' 動畫' : ''}</button>
        <button class="kg-btn blue" id="exP8">PNG ×8</button>
        <button class="kg-btn blue" id="exP16">PNG ×16</button>
      </div><p style="font-size:13px;opacity:.75;margin:6px 0 0">${doc.frames.length > 1 ? `共 ${doc.frames.length} 格．每秒 ${doc.fps} 格。PNG 會存目前這一格。` : 'PNG 會把每一格放大，邊緣清清楚楚。'}</p>`,
    buttons: [{ text: '關閉', cls: 'yellow' }]
  });
  ov.querySelector('#exTr').addEventListener('change', e => { S.transparent = e.target.checked; ov.close(); openExport(); });
  ov.querySelector('#exGif').addEventListener('click', () => { download(blob, `pixel-${stamp()}.gif`); KG.sound('coin'); KG.toast('GIF 下載囉！'); });
  const png = sc => exportPNG(sc, S.transparent).toBlob(b => { if (b) { download(b, `pixel-${stamp()}-x${sc}.png`); KG.sound('coin'); KG.toast('PNG 下載囉！'); } }, 'image/png');
  ov.querySelector('#exP8').addEventListener('click', () => png(8));
  ov.querySelector('#exP16').addEventListener('click', () => png(16));
}
function openShare() {
  commitSel();
  const code = shareCode();
  const ov = sheet({
    title: '分享代碼',
    html: `<p style="font-size:14px">把這串代碼傳給朋友，貼上就能看到你的畫！</p>
      <textarea id="shOut" readonly>${code}</textarea>
      <div class="acts" style="margin:6px 0 12px"><button class="kg-btn green" id="shCopy">複製代碼</button></div>
      <p style="font-size:14px">收到朋友的代碼？貼在下面：</p>
      <textarea id="shIn" placeholder="貼上 PX1 開頭的代碼"></textarea>
      <div class="acts" style="margin-top:6px"><button class="kg-btn blue" id="shLoad">打開這張畫</button></div>`,
    buttons: [{ text: '關閉', cls: 'yellow' }]
  });
  ov.querySelector('#shCopy').addEventListener('click', () => {
    const t = ov.querySelector('#shOut'); t.select();
    const ok = () => { KG.sound('coin'); KG.toast('複製好了！'); };
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(code).then(ok, () => { try { document.execCommand('copy'); ok(); } catch (_) {} });
    else { try { document.execCommand('copy'); ok(); } catch (_) {} }
  });
  ov.querySelector('#shLoad').addEventListener('click', () => {
    try { const d = parseShare(ov.querySelector('#shIn').value); saveDraft(); ov.close(); loadDoc(d, null); KG.sound('win'); KG.toast('打開朋友的畫了！'); }
    catch (_) { KG.sound('wrong'); KG.toast('代碼好像不對喔'); }
  });
}

/* ===================== 按鈕綁定 ===================== */
$('#bMenu').innerHTML = IC.menu + '選單';
$('#bUndo').innerHTML = IC.undo + '復原';
$('#bRedo').innerHTML = IC.redo + '重做';
$('#bAnim').innerHTML = IC.film + '動畫';
$('#bSave').innerHTML = IC.save + '存檔';
$('#fAdd').innerHTML = IC.plus; $('#fDup').innerHTML = IC.dup; $('#fDel').innerHTML = IC.clear;
$('#fLeft').innerHTML = IC.left; $('#fRight').innerHTML = IC.right;
$('#pkBack').innerHTML = IC.back; $('#glBack').innerHTML = IC.back;
$('#bMenu').addEventListener('click', () => { KG.sound('click'); openMenu(); });
$('#bUndo').addEventListener('click', undo);
$('#bRedo').addEventListener('click', redo);
$('#bAnim').addEventListener('click', () => { KG.sound('click'); toggleAnim(); });
$('#bSave').addEventListener('click', () => saveWork());
$('#fAdd').addEventListener('click', () => addFrame(false));
$('#fDup').addEventListener('click', () => addFrame(true));
$('#fDel').addEventListener('click', delFrame);
$('#fLeft').addEventListener('click', () => moveFrame(-1));
$('#fRight').addEventListener('click', () => moveFrame(1));
$('#fPlay').addEventListener('click', togglePlay);
$('#fps').addEventListener('input', e => { doc.fps = +e.target.value; $('#fpsV').textContent = doc.fps; S.playT = 0; clearTimeout(saveTimer); saveTimer = setTimeout(saveDraft, 600); });
$('#tFree').addEventListener('click', () => { KG.sound('click'); sizePicker(false); });
$('#tGuide').addEventListener('click', () => showScreen('picks'));
$('#tGal').addEventListener('click', () => showScreen('gal'));
$('#pkBack').addEventListener('click', () => showScreen('title'));
$('#glBack').addEventListener('click', () => showScreen('title'));

window.addEventListener('keydown', e => {
  if (e.target && (e.target.tagName === 'TEXTAREA' || e.target.tagName === 'INPUT' && e.target.type !== 'range' && e.target.type !== 'checkbox')) return;
  if (e.key === 'Escape') { if (sheets.length) { sheets[sheets.length - 1].close(); return; } if (S.sel) { commitSel(); S.sel = null; buildViewbar(); } return; }
  if (S.screen !== 'editor' || sheets.length) return;
  const k = e.key.toLowerCase();
  if ((e.ctrlKey || e.metaKey) && k === 'z') { e.preventDefault(); e.shiftKey ? redo() : undo(); return; }
  if ((e.ctrlKey || e.metaKey) && k === 'y') { e.preventDefault(); redo(); return; }
  if ((e.ctrlKey || e.metaKey) && k === 's') { e.preventDefault(); saveWork(); return; }
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  if (e.key === ' ') { e.preventDefault(); spaceDown = true; cv.classList.add('pan'); return; }
  const t = TOOLS.find(x => x[2] && x[2].toLowerCase() === k);
  if (t) { toolBtn(t[0]); return; }
  if (k === 'h') { setHand(!S.hand); buildViewbar(); return; }
  if (k === '#' || k === 'x') { S.grid = !S.grid; buildViewbar(); S.dirty = true; return; }
  if (k === '0') { fit(); return; }
  if (k === '+' || k === '=') { zoomAt(stW / 2, stH / 2, 1.25); return; }
  if (k === '-') { zoomAt(stW / 2, stH / 2, 0.8); return; }
  if (k === 'delete' || k === 'backspace') { if (S.sel) deleteSel(); return; }
  if (k === 'enter') { if (S.sel) { commitSel(); S.sel = null; buildViewbar(); } return; }
  if (k === 'arrowleft' && S.mode === 'free' && S.animOpen) { setFrame(doc.cur - 1); return; }
  if (k === 'arrowright' && S.mode === 'free' && S.animOpen) { setFrame(doc.cur + 1); return; }
  if (/^[1-9]$/.test(k) && S.mode === 'guide') { const c = S.guide.pic.legend[+k - 1]; if (c) setColor(c); return; }
});
window.addEventListener('keyup', e => { if (e.key === ' ') { spaceDown = false; cv.classList.toggle('pan', S.hand); } });

window.addEventListener('resize', layout);
window.addEventListener('orientationchange', () => setTimeout(layout, 120));
if (window.visualViewport) visualViewport.addEventListener('resize', layout);
document.addEventListener('visibilitychange', () => {
  if (document.hidden) { stopPlay(); saveDraft(); Music.stop(); ptrs.clear(); if (stroke) endStroke(); gesture = null; }
  else syncMusic();
});
window.addEventListener('pagehide', saveDraft);

/* ===================== 標題畫面動畫 ===================== */
const hero = $('#hero'), hx = hero.getContext('2d');
const H = { pic: 0, t: 0, order: null };
function heroPick() {
  H.pic = (H.pic + 1 + Math.floor(Math.random() * (PIC.length - 1))) % PIC.length; H.t = 0;
  const p = PIC[H.pic], cells = [];
  for (let i = 0; i < 256; i++) if (p.target[i]) cells.push(i);
  cells.sort((a, b) => ((a / 16 | 0) + (a % 16) * 0.35 + Math.random() * 2.5) - ((b / 16 | 0) + (b % 16) * 0.35 + Math.random() * 2.5));
  H.order = new Float32Array(256).fill(99);
  cells.forEach((c, k) => { H.order[c] = k / cells.length * 2.2; });
}
let lastHeroPop = 0;
function heroDraw(dt) {
  if (!H.order) heroPick();
  H.t += dt;
  const W = 240, p = PIC[H.pic];
  hx.clearRect(0, 0, W, W);
  // 畫框
  hx.fillStyle = '#c98d5c'; roundRect(hx, 4, 4, W - 8, W - 8, 22); hx.fill();
  hx.fillStyle = '#8a5a36'; roundRect(hx, 10, 12, W - 20, W - 20, 16); hx.fill();
  hx.fillStyle = '#fff'; roundRect(hx, 14, 14, W - 28, W - 28, 12); hx.fill();
  const s = 12, o = (W - 16 * s) / 2;
  hx.fillStyle = '#f1edf5';
  for (let y = 0; y < 16; y++) for (let x = (y & 1); x < 16; x += 2) hx.fillRect(o + x * s, o + y * s, s, s);
  const fade = H.t > 4.2 ? Math.max(0, 1 - (H.t - 4.2) / 0.5) : 1;
  hx.globalAlpha = fade;
  for (let i = 0; i < 256; i++) {
    const t0 = H.order[i]; if (H.t < t0) continue;
    const k = Math.min(1, (H.t - t0) / 0.18), sc = k < 1 ? 1.35 * k - 0.35 * k * k : 1, w = s * sc;
    const x = i % 16, y = i / 16 | 0;
    hx.fillStyle = PAL32[p.target[i] - 1];
    hx.fillRect(o + x * s + (s - w) / 2, o + y * s + (s - w) / 2, w + 0.5, w + 0.5);
    if (k < 1 && S.screen === 'title' && performance.now() - lastHeroPop > 90 && !KG.isMuted() && H.t > 0.05) { lastHeroPop = performance.now(); }
  }
  hx.globalAlpha = 1;
  if (H.t > 4.8) heroPick();
}
function roundRect(c, x, y, w, h, r) { c.beginPath(); c.moveTo(x + r, y); c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r); c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath(); }

/* ===================== 主迴圈 ===================== */
let lastT = performance.now();
function loop(now) {
  const dt = Math.min(0.05, (now - lastT) / 1000); lastT = now;
  if (!document.hidden) {
    if (S.screen === 'title') heroDraw(dt);
    if (S.screen === 'editor') {
      if (S.playing) { S.playT += dt; S.dirty = true; }
      if (S.sel) S.dirty = true;
      if (S.dirty) { S.dirty = false; render(); }
      if (thumbDirty.size && !stroke) updThumbs();
    }
    fxStep(dt);
  }
  requestAnimationFrame(loop);
}

/* ===================== 測試掛鉤 ===================== */
window.__px = {
  state: () => ({
    screen: S.screen, mode: S.mode, size: doc.size, frames: doc.frames.length, cur: doc.cur, tool: S.tool, color: S.color, mirror: S.mirror,
    undo: S.undo.length, redo: S.redo.length, hand: S.hand, grid: S.grid, onion: S.onion, playing: S.playing, fps: doc.fps,
    view: { ...S.view, fitS }, sel: S.sel ? { x: S.sel.x, y: S.sel.y, w: S.sel.w, h: S.sel.h, floating: !!S.sel.buf } : null,
    guide: S.guide ? { id: S.guide.pic.id, pct: S.guide.pct, total: S.guide.pic.total } : null, palLen: doc.pal.length,
    pixels: Array.from(FR()), stage: { w: stW, h: stH }
  }),
  setPixel(x, y, c) { if (!inb(x, y)) return false; beginChange(); FR()[y * N() + x] = c; afterChange(); return true; },
  getPixel: (x, y) => inb(x, y) ? FR()[y * N() + x] : -1,
  tool: name => setTool(name, true),
  color: c => { setColor(c, true); return S.color; },
  mirror: m => { S.mirror = m & 3; updTools(); S.dirty = true; return S.mirror; },
  undo, redo,
  fill(x, y, c) { beginChange(); const ch = fillAt(x, y, c); if (!ch) cancelChange(); else afterChange(); return ch; },
  exportGif(scale = 8, transparent = false) { const b = encodeGIF(doc, scale, transparent); return { length: b.length, header: String.fromCharCode(...b.slice(0, 6)), b64: toB64(b) }; },
  exportPng(scale = 8) { const c = exportPNG(scale, false); return { w: c.width, h: c.height, url: c.toDataURL('image/png') }; },
  load(j) {
    if (typeof j === 'string') { if (j.startsWith('PX1')) return loadDoc(parseShare(j)); j = JSON.parse(j); }
    const n = j.size; if (!SIZES.includes(n)) throw new Error('bad size');
    const d = newDoc(n);
    d.frames = (j.frames || [j.pixels]).slice(0, MAXF).map(f => Uint8Array.from(f.length === n * n ? f : new Array(n * n).fill(0)));
    if (j.fps) d.fps = j.fps;
    return loadDoc(d);
  },
  shareCode, parseShare: c => { const d = parseShare(c); return { size: d.size, frames: d.frames.map(f => Array.from(f)), fps: d.fps }; },
  saveWork: () => saveWork(), works: () => works().map(w => ({ id: w.id, name: w.name, len: w.code.length })),
  openWork(i) { const w = works()[i]; if (!w) return false; return loadDoc(decodeDoc(fromB64(w.code)), w.id); },
  newCanvas, addFrame: () => addFrame(false), dupFrame: () => addFrame(true), delFrame, moveFrame, setFrame, togglePlay, toggleAnim: v => toggleAnim(v),
  startGuide, pics: () => PIC.map(p => ({ id: p.id, name: p.name, total: p.total, colors: p.legend.length })),
  solveGuide(leave = 0) { const p = S.guide.pic; beginChange(); const F = FR(); let k = 0; const idx = []; for (let i = 0; i < 256; i++) if (p.target[i]) idx.push(i); for (const i of idx) { if (k++ < idx.length - leave) F[i] = p.target[i]; } afterChange(); return idx.slice(idx.length - leave).map(i => [i % 16, i >> 4, p.target[i]]); },
  showScreen, cellToClient: (x, y) => cellClient(x, y), fit: () => fit(true), zoom: f => zoomAt(stW / 2, stH / 2, f),
  fns: {
    flood: (arr, n, x, y, c) => { const a = Uint8Array.from(arr); const k = flood(a, n, x, y, c); return { count: k, px: Array.from(a) }; },
    line: (a, b, c, d) => linePts(a, b, c, d), rect: (a, b, c, d, f) => rectPts(a, b, c, d, f), ellipse: (a, b, c, d, f) => ellipsePts(a, b, c, d, f),
    mirror: (x, y, m, n) => mirrorPts(x, y, m, n), shift: (arr, n, dx, dy) => Array.from(shiftFrame(Uint8Array.from(arr), n, dx, dy))
  }
};

buildTitle();
allocBuffers();
requestAnimationFrame(loop);
})();
