<script>
'use strict';
/* =====================================================================
 * 小小消防員：開消防車穿過小鎮（看紅綠燈、禮讓行人），到現場用水柱滅火、
 * 升起雲梯救出小朋友、小貓和小狗。20 個任務、消防局可以洗車和換裝。
 * ===================================================================== */
(function () {
const SLUG = 'fire-rescue';
const cv = document.getElementById('game');
const mainCtx = cv.getContext('2d');
let ctx = mainCtx;
const FONT = '"PingFang TC","Noto Sans TC","Microsoft JhengHei","Heiti TC",system-ui,sans-serif';
let W = 360, H = 640, dpr = 1, U = 1, time = 0;
const TAU = Math.PI * 2;
const INK = '#4a2a22';
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const lerp = (a, b, t) => a + (b - a) * t;
const rand = (a, b) => a + Math.random() * (b - a);
const Ease = {
  outCubic: t => 1 - Math.pow(1 - t, 3),
  inOutSine: t => -(Math.cos(Math.PI * t) - 1) / 2,
  outBack: t => { const c = 1.70158, c3 = c + 1; return 1 + c3 * Math.pow(t - 1, 3) + c * Math.pow(t - 1, 2); }
};
/** 固定亂數（同一張地圖每次都一樣） */
function seeded(seed) { let s = seed >>> 0; return () => { s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296; }; }

/* ---------- 補間動畫、延遲呼叫、畫面震動 ---------- */
const tweens = [];
function tween(obj, to, dur, ease, delay, done) {
  const tw = { obj, to, from: null, dur: dur || 0.3, ease: Ease[ease] || Ease.outCubic, t: -(delay || 0), done };
  tweens.push(tw);
  return tw;
}
function updateTweens(dt) {
  for (let i = tweens.length - 1; i >= 0; i--) {
    const tw = tweens[i];
    if (!tw) continue;
    tw.t += dt;
    if (tw.t < 0) continue;
    if (!tw.from) { tw.from = {}; for (const k in tw.to) tw.from[k] = tw.obj[k]; }
    const p = Math.min(1, tw.t / tw.dur), e = tw.ease(p);
    for (const k in tw.to) tw.obj[k] = tw.from[k] + (tw.to[k] - tw.from[k]) * e;
    if (p >= 1) { const j = tweens.indexOf(tw); if (j >= 0) tweens.splice(j, 1); if (tw.done) tw.done(); }
  }
}
let timers = [];
function after(sec, fn) { timers.push({ t: sec, fn }); }
function updateTimers(dt) {
  for (let i = timers.length - 1; i >= 0; i--) {
    const tm = timers[i];
    if (!tm) continue;
    tm.t -= dt;
    if (tm.t <= 0) { timers.splice(i, 1); tm.fn(); }
  }
}
let shakeT = 0, shakeAmt = 0, shx = 0, shy = 0;
function shake(a, d) { shakeAmt = Math.max(shakeT > 0 ? shakeAmt : 0, a); shakeT = Math.max(shakeT, d || 0.25); }

/* ---------- 繪圖小工具 ---------- */
function circ(x, y, r) { ctx.moveTo(x + r, y); ctx.arc(x, y, r, 0, TAU); }
function rr(x, y, w, h, r) {
  r = Math.max(0, Math.min(r, w / 2, h / 2));
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}
function starPath(x, y, R, r, rot) {
  ctx.beginPath();
  for (let i = 0; i < 10; i++) {
    const a = (rot || 0) + i * Math.PI / 5 - Math.PI / 2, rad = i % 2 ? r : R;
    ctx.lineTo(x + Math.cos(a) * rad, y + Math.sin(a) * rad);
  }
  ctx.closePath();
}
function heartPath(x, y, s) {
  ctx.beginPath();
  ctx.moveTo(x, y + s * 0.35);
  ctx.bezierCurveTo(x - s * 1.1, y - s * 0.35, x - s * 0.55, y - s * 1.05, x, y - s * 0.45);
  ctx.bezierCurveTo(x + s * 0.55, y - s * 1.05, x + s * 1.1, y - s * 0.35, x, y + s * 0.35);
  ctx.closePath();
}
function shade(hex, amt) {
  const n = parseInt(hex.slice(1), 16);
  const f = v => clamp(v + amt, 0, 255);
  return 'rgb(' + f(n >> 16) + ',' + f((n >> 8) & 255) + ',' + f(n & 255) + ')';
}
function rgba(hex, a) {
  const n = parseInt(hex.slice(1), 16);
  return 'rgba(' + (n >> 16) + ',' + ((n >> 8) & 255) + ',' + (n & 255) + ',' + a + ')';
}
function setFont(size, weight) { ctx.font = (weight || '900') + ' ' + Math.round(size) + 'px ' + FONT; }
/** 有外框與陰影的字 */
function txt(s, x, y, size, fill, o) {
  o = o || {};
  ctx.save();
  setFont(size, o.weight);
  ctx.textAlign = o.align || 'center';
  ctx.textBaseline = 'middle';
  ctx.lineJoin = 'round';
  if (o.shadow !== false) {
    ctx.fillStyle = o.shadow || 'rgba(60,20,10,0.25)';
    if (o.stroke) { ctx.strokeStyle = ctx.fillStyle; ctx.lineWidth = o.sw || size * 0.22; ctx.strokeText(s, x, y + size * 0.09); }
    ctx.fillText(s, x, y + size * 0.09);
  }
  if (o.stroke) { ctx.strokeStyle = o.stroke; ctx.lineWidth = o.sw || size * 0.22; ctx.strokeText(s, x, y); }
  ctx.fillStyle = fill; ctx.fillText(s, x, y);
  ctx.restore();
}
/** 標題字：每個字會彈跳 */
function logo(s, cx, cy, size, colors) {
  ctx.save();
  setFont(size);
  ctx.textBaseline = 'middle'; ctx.textAlign = 'center'; ctx.lineJoin = 'round';
  const chars = [...s];
  let total = 0;
  const widths = chars.map(c => { const w = ctx.measureText(c).width * 1.02; total += w; return w; });
  let x = cx - total / 2;
  chars.forEach((c, i) => {
    const w = widths[i];
    const bob = Math.sin(time * 3 + i * 0.7) * size * 0.06;
    const rot = Math.sin(time * 2.2 + i) * 0.06;
    ctx.save();
    ctx.translate(x + w / 2, cy + bob); ctx.rotate(rot);
    ctx.strokeStyle = 'rgba(80,10,0,0.3)'; ctx.lineWidth = size * 0.36; ctx.strokeText(c, 0, size * 0.1);
    ctx.strokeStyle = '#7a1408'; ctx.lineWidth = size * 0.34; ctx.strokeText(c, 0, 0);
    ctx.strokeStyle = '#fff'; ctx.lineWidth = size * 0.17; ctx.strokeText(c, 0, 0);
    const col = colors[i % colors.length];
    const g = ctx.createLinearGradient(0, -size / 2, 0, size / 2);
    g.addColorStop(0, shade(col, 70)); g.addColorStop(0.5, col); g.addColorStop(1, shade(col, -35));
    ctx.fillStyle = g; ctx.fillText(c, 0, 0);
    ctx.globalAlpha = 0.55; ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.ellipse(-w * 0.18, -size * 0.25, size * 0.1, size * 0.05, -0.5, 0, TAU); ctx.fill();
    ctx.restore();
    x += w;
  });
  ctx.restore();
}
function glossyStar(x, y, R, on, rot) {
  ctx.save();
  ctx.lineJoin = 'round';
  if (on) {
    ctx.fillStyle = 'rgba(160,90,0,0.25)'; starPath(x, y + R * 0.12, R, R * 0.5, rot); ctx.fill();
    const g = ctx.createRadialGradient(x - R * 0.3, y - R * 0.4, R * 0.1, x, y, R * 1.1);
    g.addColorStop(0, '#fffbd0'); g.addColorStop(0.45, '#ffd93d'); g.addColorStop(1, '#f39a0c');
    ctx.fillStyle = g; ctx.strokeStyle = '#c9700a'; ctx.lineWidth = Math.max(1.5, R * 0.12);
    starPath(x, y, R, R * 0.5, rot); ctx.fill(); ctx.stroke();
    ctx.fillStyle = 'rgba(255,255,255,0.75)';
    ctx.beginPath(); ctx.ellipse(x - R * 0.25, y - R * 0.3, R * 0.22, R * 0.12, -0.6, 0, TAU); ctx.fill();
  } else {
    ctx.fillStyle = 'rgba(90,60,50,0.2)'; ctx.strokeStyle = 'rgba(90,60,50,0.35)'; ctx.lineWidth = Math.max(1.5, R * 0.1);
    starPath(x, y, R, R * 0.5, rot); ctx.fill(); ctx.stroke();
  }
  ctx.restore();
}
function panel(x, y, w, h, r, border) {
  rr(x, y + 7, w, h, r); ctx.fillStyle = 'rgba(70,20,10,0.25)'; ctx.fill();
  rr(x, y, w, h, r); ctx.fillStyle = '#fffaf2'; ctx.fill();
  ctx.lineWidth = 5; ctx.strokeStyle = border || '#e8452c'; ctx.stroke();
}
/** 自動換行（中文逐字） */
const wrapCache = new Map();
function wrapText(s, maxW, size) {
  const key = s + '|' + Math.round(maxW) + '|' + Math.round(size);
  let r = wrapCache.get(key);
  if (r) return r;
  setFont(size, '800');
  r = [];
  let line = '';
  for (const ch of s) {
    const t = line + ch;
    if (ctx.measureText(t).width > maxW && line) {
      if ('，。！？、：）」'.indexOf(ch) >= 0 && line.length > 1) { r.push(line.slice(0, -1)); line = line.slice(-1) + ch; }
      else { r.push(line); line = ch; }
    } else line = t;
  }
  if (line) r.push(line);
  if (wrapCache.size > 300) wrapCache.clear();
  wrapCache.set(key, r);
  return r;
}

/* ---------- 按鈕（每一格畫面重新登記，支援鍵盤焦點） ---------- */
let btnReg = [], pressed = null, focusId = null, kbMode = false;
const BTN = {
  red: ['#ffb3a6', '#ef4a32', '#a8261a'], green: ['#a6f59c', '#3fbf5c', '#24873e'], blue: ['#a8e0ff', '#3c9ff0', '#22659e'],
  yellow: ['#fff09a', '#f8b921', '#b57c0b'], purple: ['#dcc6ff', '#9b6ff2', '#5f3fae'], orange: ['#ffd0a0', '#ff8a3d', '#c1561a'],
  white: ['#ffffff', '#fbefe6', '#c9a596'], teal: ['#a6f0e6', '#2fb7a6', '#1c7d71'], gray: ['#e8e8ee', '#a5a7b5', '#6d6f80']
};
function drawIcon(name, x, y, s, col) {
  ctx.save(); ctx.translate(x, y);
  ctx.fillStyle = col || '#fff'; ctx.strokeStyle = col || '#fff';
  ctx.lineWidth = s * 0.2; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  if (name === 'play') { ctx.beginPath(); ctx.moveTo(-s * 0.32, -s * 0.45); ctx.lineTo(s * 0.45, 0); ctx.lineTo(-s * 0.32, s * 0.45); ctx.closePath(); ctx.fill(); ctx.stroke(); }
  else if (name === 'pause') { rr(-s * 0.38, -s * 0.42, s * 0.26, s * 0.84, s * 0.08); ctx.fill(); rr(s * 0.12, -s * 0.42, s * 0.26, s * 0.84, s * 0.08); ctx.fill(); }
  else if (name === 'replay') {
    ctx.beginPath(); ctx.arc(0, 0, s * 0.42, -Math.PI * 0.3, Math.PI * 1.35); ctx.stroke();
    const a = -Math.PI * 0.3, ex = Math.cos(a) * s * 0.42, ey = Math.sin(a) * s * 0.42;
    ctx.beginPath(); ctx.moveTo(ex + s * 0.2, ey - s * 0.05); ctx.lineTo(ex - s * 0.02, ey + s * 0.25); ctx.lineTo(ex - s * 0.25, ey - s * 0.12); ctx.closePath(); ctx.fill();
  }
  else if (name === 'menu') { for (let i = -1; i <= 1; i += 2) for (let j = -1; j <= 1; j += 2) { rr(i * s * 0.25 - s * 0.17, j * s * 0.25 - s * 0.17, s * 0.34, s * 0.34, s * 0.08); ctx.fill(); } }
  else if (name === 'back') { ctx.beginPath(); ctx.moveTo(s * 0.4, 0); ctx.lineTo(-s * 0.35, 0); ctx.moveTo(-s * 0.05, -s * 0.32); ctx.lineTo(-s * 0.38, 0); ctx.lineTo(-s * 0.05, s * 0.32); ctx.stroke(); }
  else if (name === 'lock') {
    ctx.lineWidth = s * 0.16; ctx.beginPath(); ctx.arc(0, -s * 0.12, s * 0.26, Math.PI, 0); ctx.stroke();
    rr(-s * 0.38, -s * 0.12, s * 0.76, s * 0.6, s * 0.12); ctx.fill();
  }
  else if (name === 'speaker') {
    ctx.beginPath(); ctx.moveTo(-s * 0.45, -s * 0.16); ctx.lineTo(-s * 0.22, -s * 0.16); ctx.lineTo(s * 0.05, -s * 0.4); ctx.lineTo(s * 0.05, s * 0.4); ctx.lineTo(-s * 0.22, s * 0.16); ctx.lineTo(-s * 0.45, s * 0.16); ctx.closePath(); ctx.fill();
    ctx.lineWidth = s * 0.12;
    ctx.beginPath(); ctx.arc(s * 0.08, 0, s * 0.22, -0.9, 0.9); ctx.stroke();
    ctx.beginPath(); ctx.arc(s * 0.08, 0, s * 0.4, -0.9, 0.9); ctx.stroke();
  }
  else if (name === 'siren') {
    ctx.beginPath(); ctx.arc(0, s * 0.12, s * 0.34, Math.PI, 0); ctx.lineTo(s * 0.34, s * 0.22); ctx.lineTo(-s * 0.34, s * 0.22); ctx.closePath(); ctx.fill();
    rr(-s * 0.46, s * 0.24, s * 0.92, s * 0.18, s * 0.05); ctx.fill();
    ctx.lineWidth = s * 0.1;
    ctx.beginPath(); ctx.moveTo(-s * 0.5, -s * 0.3); ctx.lineTo(-s * 0.36, -s * 0.2); ctx.moveTo(s * 0.5, -s * 0.3); ctx.lineTo(s * 0.36, -s * 0.2); ctx.moveTo(0, -s * 0.52); ctx.lineTo(0, -s * 0.36); ctx.stroke();
  }
  else if (name === 'horn') {
    ctx.beginPath(); ctx.moveTo(-s * 0.45, -s * 0.12); ctx.lineTo(-s * 0.1, -s * 0.12); ctx.lineTo(s * 0.42, -s * 0.42); ctx.lineTo(s * 0.42, s * 0.42); ctx.lineTo(-s * 0.1, s * 0.12); ctx.lineTo(-s * 0.45, s * 0.12); ctx.closePath(); ctx.fill();
  }
  else if (name === 'drop') {
    ctx.beginPath(); ctx.moveTo(0, -s * 0.5); ctx.bezierCurveTo(s * 0.15, -s * 0.2, s * 0.4, 0, s * 0.4, s * 0.15);
    ctx.arc(0, s * 0.15, s * 0.4, 0, Math.PI); ctx.bezierCurveTo(-s * 0.4, 0, -s * 0.15, -s * 0.2, 0, -s * 0.5); ctx.fill();
  }
  else if (name === 'close') { ctx.beginPath(); ctx.moveTo(-s * 0.3, -s * 0.3); ctx.lineTo(s * 0.3, s * 0.3); ctx.moveTo(s * 0.3, -s * 0.3); ctx.lineTo(-s * 0.3, s * 0.3); ctx.stroke(); }
  else if (name === 'home') {
    ctx.beginPath(); ctx.moveTo(-s * 0.45, -s * 0.02); ctx.lineTo(0, -s * 0.45); ctx.lineTo(s * 0.45, -s * 0.02); ctx.closePath(); ctx.fill();
    rr(-s * 0.3, -s * 0.05, s * 0.6, s * 0.48, s * 0.05); ctx.fill();
  }
  else if (name === 'sponge') { rr(-s * 0.45, -s * 0.28, s * 0.9, s * 0.56, s * 0.14); ctx.fill(); }
  else if (name === 'shirt') {
    ctx.beginPath(); ctx.moveTo(-s * 0.18, -s * 0.42); ctx.lineTo(-s * 0.48, -s * 0.25); ctx.lineTo(-s * 0.36, 0); ctx.lineTo(-s * 0.26, -s * 0.06);
    ctx.lineTo(-s * 0.26, s * 0.42); ctx.lineTo(s * 0.26, s * 0.42); ctx.lineTo(s * 0.26, -s * 0.06); ctx.lineTo(s * 0.36, 0); ctx.lineTo(s * 0.48, -s * 0.25); ctx.lineTo(s * 0.18, -s * 0.42);
    ctx.quadraticCurveTo(0, -s * 0.25, -s * 0.18, -s * 0.42); ctx.fill();

/** 立體按鈕。o: {label, icon, color, onClick, size, pulse, disabled, def, radius} */
function button(id, x, y, w, h, o) {
  btnReg.push({ id, x, y, w, h, onClick: o.onClick, disabled: o.disabled, def: o.def, silent: o.silent });
  const pal = BTN[o.color || 'red'];
  const isDown = pressed && pressed.id === id;
  let s = isDown ? 0.93 : 1;
  if (o.pulse && !isDown) s *= 1 + Math.sin(time * 5) * 0.035;
  const lip = Math.max(4, h * 0.1);
  ctx.save();
  ctx.translate(x + w / 2, y + h / 2); ctx.scale(s, s);
  if (o.disabled) ctx.globalAlpha = 0.55;
  const r = o.radius == null ? h / 2 : o.radius;
  const yo = isDown ? lip * 0.6 : 0;
  rr(-w / 2, -h / 2 + lip + 3, w, h, r); ctx.fillStyle = 'rgba(70,20,10,0.2)'; ctx.fill();
  rr(-w / 2, -h / 2 + lip, w, h, r); ctx.fillStyle = pal[2]; ctx.fill();
  rr(-w / 2, -h / 2 + yo, w, h, r);
  const g = ctx.createLinearGradient(0, -h / 2, 0, h / 2);
  g.addColorStop(0, pal[0]); g.addColorStop(0.55, pal[1]); g.addColorStop(1, shade(pal[1], -15));
  ctx.fillStyle = g; ctx.fill();
  ctx.strokeStyle = pal[2]; ctx.lineWidth = Math.max(2, h * 0.05); ctx.stroke();
  rr(-w / 2 + Math.min(h, w) * 0.22, -h / 2 + yo + h * 0.09, w - Math.min(h, w) * 0.44, h * 0.28, h * 0.14);
  ctx.fillStyle = 'rgba(255,255,255,0.45)'; ctx.fill();
  const fs = o.size || h * 0.42;
  const tc = o.color === 'white' ? '#6b3a2c' : '#fff';
  const sc = o.color === 'white' ? '#fff' : pal[2];
  if (o.icon && o.label) {
    setFont(fs);
    const tw = ctx.measureText(o.label).width;
    const tot = fs * 1.15 + tw;
    drawIcon(o.icon, -tot / 2 + fs * 0.45, yo, fs * 0.9, tc);
    txt(o.label, -tot / 2 + fs * 1.15 + tw / 2, yo + 1, fs, tc, { stroke: sc, sw: fs * 0.2, shadow: false });
  } else if (o.icon) drawIcon(o.icon, 0, yo, fs * 1.1, tc);
  else if (o.label != null) txt(o.label, 0, yo + 1, fs, tc, { stroke: sc, sw: fs * 0.2, shadow: false });
  if (o.badge) { ctx.fillStyle = '#ffd93d'; ctx.beginPath(); circ(w / 2 - 6, -h / 2 + 6, 10); ctx.fill(); ctx.strokeStyle = '#b57c0b'; ctx.lineWidth = 2; ctx.stroke(); txt(o.badge, w / 2 - 6, -h / 2 + 6, 13, '#6b3a00', { shadow: false }); }
  ctx.restore();
  if (kbMode && focusId === id) {

    ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 4; ctx.setLineDash([9, 6]); ctx.lineDashOffset = -time * 30; ctx.stroke(); ctx.setLineDash([]);

/** 看不見的觸控區 */
function hotspot(id, x, y, w, h, onClick, silent) { btnReg.push({ id, x, y, w, h, onClick, hot: true, silent }); }
function hitBtn(x, y) {
  let best = null, bd = 14;
  for (let i = btnReg.length - 1; i >= 0; i--) {
    const b = btnReg[i];
    if (b.disabled) continue;
    if (x >= b.x - 4 && x <= b.x + b.w + 4 && y >= b.y - 4 && y <= b.y + b.h + 8) return b;
    if (b.hot) continue;
    const dx = Math.max(b.x - x, 0, x - (b.x + b.w)), dy = Math.max(b.y - y, 0, y - (b.y + b.h));
    const d = Math.hypot(dx, dy);
    if (d < bd) { bd = d; best = b; }
  }
  return best;
}
function focusMove(dir) {
  const list = btnReg.filter(b => !b.disabled && !b.hot);
  if (!list.length) return;
  let i = list.findIndex(b => b.id === focusId);
  i = i < 0 ? (dir > 0 ? 0 : list.length - 1) : (i + dir + list.length) % list.length;
  focusId = list[i].id;
  sfx('click', { vol: 0.6 });
}
function focusPress() {
  const b = btnReg.find(q => q.id === focusId && !q.disabled) || btnReg.find(q => q.def && !q.disabled);
  if (b && b.onClick) { sfx('ui'); b.onClick(); }
}

/* ---------- 粒子（物件池） ---------- */
const PMAX = KG.lowEnd ? 120 : 200;
const parts = [];
for (let i = 0; i < PMAX; i++) parts.push({ on: false, x: 0, y: 0, vx: 0, vy: 0, life: 0, max: 1, size: 1, color: '#fff', shape: 0, rot: 0, vr: 0, g: 0, drag: 1, grow: 0 });
let pIdx = 0;
const SH_STAR = 0, SH_SPARK = 1, SH_DOT = 2, SH_CONF = 3, SH_RING = 4, SH_HEART = 5, SH_PUFF = 6, SH_BUBBLE = 7;
function allocP() {
  for (let k = 0; k < PMAX; k++) {
    const p = parts[(pIdx + k) % PMAX];
    if (!p.on) { pIdx = (pIdx + k + 1) % PMAX; return p; }
  }
  const p = parts[pIdx]; pIdx = (pIdx + 1) % PMAX; return p;
}
function burst(x, y, o) {
  const n = Math.ceil((o.n || 12) * (KG.lowEnd ? 0.6 : 1));
  const cols = o.colors || ['#ffe066', '#ff8fb1', '#7bd88f', '#6cc4ff', '#ffffff'];
  for (let i = 0; i < n; i++) {
    const p = allocP();

function ladderTip(v) { return v.slot.kind === 'tree' ? [v.x - 20, v.y + 6] : [v.slot.x - v.slot.w * 0.5 - 2, v.slot.y + v.slot.h * 0.5 + 6]; }

      burst(v.x, v.y - 20, { n: 8, colors: ['#ff5a86', '#ff8fb1'], shape: SH_HEART, speed: 90, g: -40, size: 6, life: 0.9 });

/* ---------- 每一格 ---------- */
function updateFire(dt) {
  MS.t += dt; MS.fireT += dt;
  if (FS.intro > 0) FS.intro -= dt;
  // 噴水
  const want = FS.spraying && !FS.refill && FS.water > 0 && !FS.done;
  FS.pressure = clamp(FS.pressure + (want ? 6 : -5) * dt, 0, 1);
  if (FS.ptr || FS.kb) {
    if (FS.ptr) { const [wx, wy] = toWorld(FS.ptr.x, FS.ptr.y); FS.tx = wx; FS.ty = wy; }
    const ta = solveAim(FS.tx, FS.ty);
    FS.aim = lerp(FS.aim, ta, 1 - Math.pow(0.0005, dt));
  }
  if (want) {
    FS.emitAcc += dt * 52 * FS.pressure;
    const n = Math.floor(FS.emitAcc); FS.emitAcc -= n;
    if (n > 0) emitWater(n);
    const use = USE * dt * FS.pressure;
    FS.water = Math.max(0, FS.water - use); MS.water += use;
    if (FS.water <= 0 && !FS.emptyWarned) {
      FS.emptyWarned = true; FS.spraying = false; sfx('fr_empty');
      showBanner('沒水了！', 2.2, '#3c9ff0', '點消防栓或「加水」按鈕');
      say('沒水了，快去消防栓加水！');
    } else if (FS.water < 25 && !FS.lowWarned) { FS.lowWarned = true; sfx('fr_oops', { vol: 0.5, pitch: 1.3 }); }
  }
  // 加水
  if (FS.refill) {
    FS.water = Math.min(TANK, FS.water + 46 * dt);
    FS.gurgT -= dt; if (FS.gurgT <= 0) { FS.gurgT = 0.2; sfx('fr_gurgle', { pan: -0.7 }); }
    if (Math.random() < dt * 20) burst(HYD.x + 6, HYD.y - 30, { n: 1, colors: ['#bfe8ff', '#ffffff'], shape: SH_BUBBLE, speed: 40, g: -60, size: 4, life: 0.7 });
    if (FS.water >= TANK) { FS.refill = false; FS.emptyWarned = false; FS.lowWarned = false; sfx('fr_full'); const [sx, sy] = toScreen(HYD.x + 60, HYD.y - 110); popText(sx, sy, '加滿了！', { size: 18, stroke: '#2a7ac0' }); }
  }
  // 水珠
  const fires = FS.slots;
  for (const p of WP) {
    if (!p.on) continue;
    p.vy += GRAV * dt; p.x += p.vx * dt; p.y += p.vy * dt; p.life -= dt;
    if (p.life <= 0 || p.x > 760 || p.x < -160) { p.on = false; continue; }
    let hit = false;
    for (const s of fires) {
      if (s.fire <= 0) continue;
      const r = slotHitR(s);
      const dx = p.x - s.x, dy = p.y - s.y;
      if (dx * dx + dy * dy < r * r) {
        hit = true; p.on = false;
        s.fire -= 0.013; s.hitT = 0.4;
        if (Math.random() < 0.3) puff(p.x, p.y - 6, rand(6, 11), rand(-15, 15), rand(-60, -35), rand(0.6, 1.1), 0);
        sfx('fr_sizzle', { pan: panOf(s.x), gap: 110 });
        if (s.fire <= 0) extinguish(s);
        break;
      }
    }
    if (hit) continue;
    if (p.y > GROUND + 6 && p.x > 0) {
      p.on = false;
      if (Math.random() < 0.3) burst(p.x, GROUND + 4, { n: 2, colors: ['#bfe8ff', '#ffffff'], shape: SH_DOT, speed: 90, dir: -Math.PI / 2, spread: 2, g: 500, size: 3, life: 0.4 });
      if (Math.random() < 0.05) sfx('fr_drip', { gap: 120, vol: 0.5 });
    }
  }
  // 火：變大、冒煙、蔓延
  let total = 0, burning = 0;
  for (const s of fires) {
    if (s.cool > 0) s.cool -= dt;
    if (s.soot > 0.3) s.soot = Math.max(0.3, s.soot - dt * 0.01);
    if (s.fire <= 0) continue;
    burning++; total += s.fire;
    s.hitT -= dt;
    if (s.hitT <= 0) s.fire = Math.min(1, s.fire + 0.05 * dt);
    if (Math.random() < dt * (2 + s.fire * 4)) puff(s.x + rand(-12, 12), s.y - s.h * 0.35 - s.fire * 20, rand(6, 11) * (0.6 + s.fire * 0.6), rand(4, 16), rand(-60, -40), rand(1.5, 2.2), 1, 10);
    if (s.fire > 0.55 && !FS.done) {
      s.spreadT += dt;
      if (s.spreadT > FS.spreadInt) {
        s.spreadT = rand(-2, 1);
        const c = s.nb.filter(o => o.fire <= 0 && o.cool <= 0 && !(o.victim && o.victim.st !== 'wait'));
        if (c.length && burningCount() < FS.maxBurn) ignite(c[Math.floor(Math.random() * c.length)]);
      }
    }
  }
  // 受困者
  for (const v of FS.victims) {
    if (v.shake > 0) v.shake -= dt;
    if (v.hint > 0) v.hint -= dt;
    if (v.st === 'saved') v.hop = Math.max(0, v.hop - dt);
  }
  updateLadder(dt);
  // 劈啪聲
  FS.crackT -= dt;
  if (total > 0 && FS.crackT <= 0) {
    FS.crackT = rand(0.05, 0.22) / Math.min(2.5, 0.4 + total);
    const s = fires.find(q => q.fire > 0 && Math.random() < 0.6) || fires.find(q => q.fire > 0);
    if (s) sfx('fr_crackle', { pan: panOf(s.x), vol: 0.4 + 0.4 * Math.min(1, s.fire), gap: 30 });
  }
  if (M) M.setLayer('tension', total > 2.6 && !FS.lastOut);
  loopSet('fire', 'wind', Math.min(1, total / 3), total > 0 ? 0.04 + 0.08 * Math.min(1, total / 3) : 0);
  loopSet('hose', 'water', 0.35 + 0.65 * FS.pressure, FS.refill ? 0.05 : 0.13 * FS.pressure);
  loopSet('engine', 'engine', FS.refill ? 0.25 : 0.06 + FS.pressure * 0.12, 0.022 + FS.pressure * 0.012);
  sirenUpdate(dt, false);
  updateSmoke(dt);
  // 過關
  if (!FS.done && burning === 0 && FS.victims.every(v => v.st === 'saved') && LAD.st === 'idle') {
    FS.done = true; FS.doneT = 0; FS.spraying = false;
    showBanner('任務完成！', 2.4, '#ef4a32');
    jingleFanfare();
    after(0.3, () => say('任務完成！大家都安全了！'));
    for (let i = 0; i < 3; i++) after(i * 0.25, () => burst(rand(250, 550), rand(200, 380), { n: 18, colors: ['#ffe066', '#ff8fb1', '#7bd88f', '#6cc4ff', '#fff'], shape: SH_CONF, speed: 260, g: 300, size: 8, life: 1.4 }));
    after(2.6, showResult);
  }
  if (FS.done) FS.doneT += dt;
}

  const bh = Math.round(clamp(H * 0.1, 40, 54)), gap = Math.round(clamp(H * 0.022, 8, 14));
  const pw = Math.min(W - 40, 360), ph = 64 + (bh + gap) * 3 + bh * 0.85 + 30;
  const px = (W - pw) / 2, py = Math.max(8, (H - ph) / 2);
  panel(px, py, pw, ph, 28, '#ef4a32');
  txt('暫停一下', W / 2, py + 34, 26, INK, { shadow: false });
  const bw = pw - 60, bx = px + 30;
  let y = py + 62;
  button('resume', bx, y, bw, bh, { label: '繼續', icon: 'play', color: 'green', def: true, onClick: () => setPaused(false) }); y += bh + gap;
  button('restart', bx, y, bw, bh, { label: '重新開始', icon: 'replay', color: 'yellow', onClick: () => { paused = false; if (M) M.resume(); loopsSilence(); startMission(MS.i); } }); y += bh + gap;
  button('quit', bx, y, bw, bh, { label: '回消防局', icon: 'home', color: 'blue', onClick: () => { paused = false; if (M) M.resume(); toStation(); } }); y += bh + gap + 4;
  toggleRow(px + 16, y, pw - 32, Math.round(bh * 0.85));
}

/* =====================================================================
 * 輸入
 * ===================================================================== */
function toLocal(e) {
  const r = cv.getBoundingClientRect();
  return [(e.clientX - r.left) * W / (r.width || W), (e.clientY - r.top) * H / (r.height || H)];
}
function fireDown(x, y, e) {
  if (FS.done || Result.on) return;
  const [wx, wy] = toWorld(x, y);
  // 點受困的人
  let best = null, bd = 50 / Math.max(0.6, Math.min(1, FL.s));
  for (const v of FS.victims) {
    if (v.st !== 'wait') continue;
    const cy = v.slot.kind === 'tree' ? v.y - 18 : v.slot.y;
    const d = Math.hypot(wx - v.x, wy - cy);
    if (d < bd) { bd = d; best = v; }
  }
  if (best && (best.slot.fire <= 0 || !FS.water)) { requestRescue(best); return; }
  if (best && best.slot.fire > 0 && LAD.st === 'idle' && FS.water <= 0) { requestRescue(best); return; }
  // 點消防栓
  if (Math.hypot(wx - HYD.x - 4, wy - HYD.y + 22) < 42) { startRefill(); return; }
  if (FS.refill) { const [sx, sy] = toScreen(HYD.x + 80, HYD.y - 120); popText(sx, sy, '加水中，等一下！', { size: 16, stroke: '#2a7ac0' }); return; }
  if (FS.water <= 0) { showBanner('沒水了！', 1.6, '#3c9ff0', '點消防栓或「加水」按鈕'); sfx('fr_empty'); return; }
  FS.ptr = { id: e.pointerId, x, y }; FS.spraying = true; FS.kb = false;
  FS.tx = wx; FS.ty = wy; FS.aim = lerp(FS.aim, solveAim(wx, wy), 0.7);
  sfx('fr_nozzle');
  try { cv.setPointerCapture(e.pointerId); } catch (er) { /* 忽略 */ }
}
cv.addEventListener('pointerdown', (e) => {
  e.preventDefault();
  kbMode = false;
  const [x, y] = toLocal(e);
  const b = hitBtn(x, y);
  if (b) { pressed = { id: b.id, pid: e.pointerId }; if (!b.silent) sfx('click', { vol: 0.7 }); return; }
  if (paused || Result.on) return;
  if (scene === 'drive' && !D.arrived) { D.ptr = { id: e.pointerId, x, y }; try { cv.setPointerCapture(e.pointerId); } catch (er) { /* 忽略 */ } }
  else if (scene === 'fire') fireDown(x, y, e);
  else if (scene === 'wash') { WASH.ptr = { id: e.pointerId, x, y }; if (washAt(x, y)) sfx('fr_foam'); }
});
cv.addEventListener('pointermove', (e) => {
  const [x, y] = toLocal(e);
  if (D.ptr && D.ptr.id === e.pointerId) { D.ptr.x = x; D.ptr.y = y; }
  if (FS.ptr && FS.ptr.id === e.pointerId) { FS.ptr.x = x; FS.ptr.y = y; }
  if (WASH.ptr && WASH.ptr.id === e.pointerId) {
    const d = Math.hypot(x - WASH.ptr.x, y - WASH.ptr.y);
    const steps = Math.ceil(d / 8);
    let on = false;
    for (let i = 1; i <= steps; i++) on = washAt(lerp(WASH.ptr.x, x, i / steps), lerp(WASH.ptr.y, y, i / steps)) || on;
    WASH.ptr.x = x; WASH.ptr.y = y;
    WASH.moved += d;
    if (on && WASH.moved > 26) {
      WASH.moved = 0;
      sfx('fr_squeak', { gap: 110 });
      if (Math.random() < 0.35) sfx('fr_foam', { gap: 150 });
      burst(x, y, { n: 2, colors: ['#ffffff', '#d8f2ff', '#ffe0f0'], shape: SH_BUBBLE, speed: 70, g: -50, size: 7, life: 0.9 });
    }
  }
});
function endPointer(e, cancel) {
  const [x, y] = toLocal(e);
  if (pressed && pressed.pid === e.pointerId) {
    const b = hitBtn(x, y), id = pressed.id;
    pressed = null;
    if (!cancel && b && b.id === id && b.onClick) { if (!b.silent && !b.hot) sfx('ui'); b.onClick(); }
    return;
  }
  if (D.ptr && D.ptr.id === e.pointerId) D.ptr = null;
  if (FS.ptr && FS.ptr.id === e.pointerId) { FS.ptr = null; FS.spraying = false; }
  if (WASH.ptr && WASH.ptr.id === e.pointerId) WASH.ptr = null;
}
cv.addEventListener('pointerup', (e) => endPointer(e, false));
cv.addEventListener('pointercancel', (e) => endPointer(e, true));
cv.addEventListener('contextmenu', (e) => e.preventDefault());
const GAME_KEYS = { ArrowUp: 1, ArrowDown: 1, ArrowLeft: 1, ArrowRight: 1, w: 1, a: 1, s: 1, d: 1, ' ': 1 };
window.addEventListener('keydown', (e) => {
  const k = e.key.length === 1 ? e.key.toLowerCase() : e.key;
  if ((scene === 'drive' || scene === 'fire') && !Result.on) {
    if (k === 'Escape' || k === 'p') { e.preventDefault(); setPaused(!paused); kbMode = true; return; }
    if (paused) {
      if (k === 'ArrowDown' || k === 'ArrowRight' || (k === 'Tab' && !e.shiftKey)) { kbMode = true; focusMove(1); e.preventDefault(); }
      else if (k === 'ArrowUp' || k === 'ArrowLeft' || (k === 'Tab' && e.shiftKey)) { kbMode = true; focusMove(-1); e.preventDefault(); }
      else if (k === 'Enter' || k === ' ') { e.preventDefault(); focusPress(); }
      return;
    }
    if (GAME_KEYS[k]) e.preventDefault();
    if (scene === 'drive') {
      keys[k] = true;
      if (k === 'h') honk();
      if (k === 'm') { sirenOn = !sirenOn; Save.set('siren', sirenOn); }
    } else {
      keys[k] = true;
      if (!FS.kb && !FS.ptr && (k.indexOf('Arrow') === 0 || k === ' ')) { FS.kb = true; const t = FS.slots.find(s => s.fire > 0); if (t) { FS.tx = t.x; FS.ty = t.y; } }
      if (k === ' ' && !e.repeat) {
        if (FS.water <= 0) { sfx('fr_empty'); showBanner('沒水了！', 1.6, '#3c9ff0', '按 R 加水'); }
        else if (!FS.refill) { FS.spraying = true; sfx('fr_nozzle'); }
      }
      if (k === 'r') startRefill();
      if (k === 'l' || k === 'Enter') { const v = FS.victims.find(q => q.st === 'wait' && q.slot.fire <= 0) || FS.victims.find(q => q.st === 'wait'); if (v) requestRescue(v); }
      if (k === 'Tab') { e.preventDefault(); const list = FS.slots.filter(s => s.fire > 0); if (list.length) { FS.kb = true; const cur = list.findIndex(s => Math.hypot(s.x - FS.tx, s.y - FS.ty) < 20); const t = list[(cur + 1) % list.length]; FS.tx = t.x; FS.ty = t.y; } }
    }
    return;
  }
  if (Result.on && (k === 'Enter' || k === ' ')) { e.preventDefault(); toTips(); return; }
  if (k === 'ArrowRight' || k === 'ArrowDown' || (k === 'Tab' && !e.shiftKey)) { kbMode = true; focusMove(1); e.preventDefault(); }
  else if (k === 'ArrowLeft' || k === 'ArrowUp' || (k === 'Tab' && e.shiftKey)) { kbMode = true; focusMove(-1); e.preventDefault(); }
  else if (k === 'Enter' || k === ' ') { e.preventDefault(); kbMode = true; focusPress(); }
  else if (k === 'Escape') { if (scene === 'map' || scene === 'wash' || scene === 'dress') toStation(); }
});
window.addEventListener('keyup', (e) => {
  const k = e.key.length === 1 ? e.key.toLowerCase() : e.key;
  keys[k] = false;
  if (k === ' ' && scene === 'fire' && !FS.ptr) FS.spraying = false;
});
window.addEventListener('blur', () => { for (const k in keys) keys[k] = false; if (!FS.ptr) FS.spraying = false; });
document.addEventListener('visibilitychange', () => {
  if (document.hidden) { loopsSilence(); if ((scene === 'drive' || scene === 'fire') && !paused && !Result.on) setPaused(true); }
});
function keyAim(dt) {
  if (scene !== 'fire' || !FS.kb || paused) return;
  const sp = 320 * dt;
  if (keys.ArrowLeft || keys.a) FS.tx -= sp;
  if (keys.ArrowRight || keys.d) FS.tx += sp;
  if (keys.ArrowUp || keys.w) FS.ty -= sp;
  if (keys.ArrowDown || keys.s) FS.ty += sp;
  FS.tx = clamp(FS.tx, 300, 600); FS.ty = clamp(FS.ty, 60, GROUND);
}

/* =====================================================================
 * 主迴圈
 * ===================================================================== */
function resize() {
  const r = cv.getBoundingClientRect();
  W = Math.max(1, r.width || innerWidth); H = Math.max(1, r.height || innerHeight);
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
  U = clamp(Math.min(W / 400, H / 700), 0.75, 1.5);
  wrapCache.clear();
  layoutFire();
  if (town && scene === 'drive') ensureTownCanvas();
}
window.addEventListener('resize', resize);
window.addEventListener('orientationchange', () => setTimeout(resize, 120));
if (window.visualViewport) window.visualViewport.addEventListener('resize', resize);

function step(dt) {
  time += dt; sceneT += dt;
  if (shakeT > 0) shakeT -= dt;
  if (!paused) {
    banner.t += dt;
    updateTweens(dt); updateTimers(dt); updateParts(dt); updatePops(dt);
    keyAim(dt);
    if (scene === 'drive') updateDrive(dt);
    else if (scene === 'fire') { if (!Result.on) updateFire(dt); else updateSmoke(dt); }
    else if (scene === 'wash') updateWash(dt);
  }
  Result.update(dt);
  duckUpdate();
}
function render() {
  btnReg = [];
  if (shakeT > 0 && !paused) { const k = shakeAmt * Math.min(1, shakeT * 4); shx = (Math.random() * 2 - 1) * k; shy = (Math.random() * 2 - 1) * k; } else { shx = 0; shy = 0; }
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  if (scene === 'title') { drawTitle(); drawParts(); }
  else if (scene === 'station') { drawStation(); drawParts(); }
  else if (scene === 'wash') { drawWash(); drawParts(); }
  else if (scene === 'dress') drawDress();
  else if (scene === 'map') drawMap();
  else if (scene === 'tips') { drawTips(); drawParts(); }
  else if (scene === 'drive') { drawDrive(); drawPops(); }
  else if (scene === 'fire') { drawFireStage(); if (!Result.on) drawFireHud(); }
  shx = 0; shy = 0;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  if (Result.on) { btnReg = []; Result.draw(); drawParts(); }
  if (paused) { btnReg = []; drawPause(); }
}
let last = performance.now();
const perfStat = { n: 0, sum: 0, max: 0 };
function frame(now) {
  const dt = Math.min(0.05, Math.max(0, (now - last) / 1000));
  last = now;
  const t0 = performance.now();
  try { step(dt); render(); } catch (err) { console.error(err); }
  const ft = performance.now() - t0;
  perfStat.n++; perfStat.sum += ft; if (ft > perfStat.max) perfStat.max = ft;
  requestAnimationFrame(frame);
}
resize();
playSong(SONG_STATION);
requestAnimationFrame((t) => { last = t; frame(t); });

/* ---------- 測試用 ---------- */
function autoDriveInput() {
  if (!D.path || D.path.length < 2) return null;
  const n = D.path[1];
  const dx = (n[0] + 0.5) * T - D.x, dy = (n[1] + 0.5) * T - D.y, l = Math.hypot(dx, dy) || 1;
  return [dx / l, dy / l];
}
window.__fr = {
  state: () => ({ scene, paused, mission: MS ? MS.i : null, t: MS ? +MS.t.toFixed(1) : 0, arrived: D.arrived, v: Math.round(D.v), tile: [Math.floor(D.x / T), Math.floor(D.y / T)], dest: D.dest ? [D.dest.rx, D.dest.ry] : null,
    pathLen: D.path ? D.path.length : null, burning: scene === 'fire' ? burningCount() : null, total: scene === 'fire' ? +totalFire().toFixed(2) : null, water: Math.round(FS.water), used: MS ? Math.round(MS.water) : 0,
    victims: FS.victims.map(v => v.type + ':' + v.st), ladder: LAD.st, done: FS.done, result: Result.on ? Result.o : null, music: M ? M.isPlaying() : null, yields: MS ? MS.yields : 0, reds: MS ? MS.reds : 0, redRuns: MS ? MS.redRuns : 0,
    stars: stars.slice(), dirt: +dirt.toFixed(2), washLeft: +WASH.left.toFixed(2), sirenOn, banner: banner.t < banner.life ? banner.s : '' }),
  start: i => startMission(i || 0),
  fire: () => startFire(),
  go: s => { if (s === 'station') toStation(); else if (s === 'map') toMap(); else if (s === 'wash') toWash(); else if (s === 'dress') toDress(); else if (s === 'title') toTitle(); else if (s === 'tips') toTips(); },
  /** 自動開車 sec 秒 */
  drive: (sec, stopRed) => { D.auto = stopRed ? 2 : 1; for (let i = 0; i < sec * 60 && scene === 'drive'; i++) step(1 / 60); D.auto = 0; },
  tick: (sec) => { for (let i = 0; i < sec * 60; i++) step(1 / 60); },
  /** 自動滅火：瞄準最近的火，火熄了就救人 */
  autoFire: (sec) => {
    for (let i = 0; i < sec * 60 && scene === 'fire' && !Result.on; i++) {
      const t = FS.slots.filter(s => s.fire > 0).sort((a, b) => b.fire - a.fire)[0];
      if (FS.water <= 0 && !FS.refill) startRefill();
      if (t && !FS.refill) { FS.kb = true; FS.tx = t.x; FS.ty = t.y; FS.spraying = true; } else FS.spraying = false;
      const v = FS.victims.find(q => q.st === 'wait' && q.slot.fire <= 0);
      if (v && LAD.st === 'idle') requestRescue(v);
      step(1 / 60);
    }
    FS.spraying = false; FS.kb = false;
  },
  slots: () => FS.slots.map(s => { const [x, y] = toScreen(s.x, s.y); return { kind: s.kind, fire: +s.fire.toFixed(2), x: Math.round(x), y: Math.round(y), victim: s.victim ? s.victim.type : null }; }),
  victims: () => FS.victims.map(v => { const [x, y] = toScreen(v.x, v.slot.kind === 'tree' ? v.y - 18 : v.slot.y); return { type: v.type, st: v.st, x: Math.round(x), y: Math.round(y), fire: v.slot.fire }; }),
  truck: () => { const [x, y] = toScreenDrive(...truckVis()); return { x: Math.round(x), y: Math.round(y), dir: D.dir }; },
  next: () => { if (!D.path || D.path.length < 2) return null; const n = D.path[Math.min(2, D.path.length - 1)]; const [x, y] = toScreenDrive((n[0] + 0.5) * T, (n[1] + 0.5) * T); return { x: Math.round(x), y: Math.round(y) }; },
  btns: () => btnReg.map(b => ({ id: b.id, x: Math.round(b.x + b.w / 2), y: Math.round(b.y + b.h / 2), w: Math.round(b.w), h: Math.round(b.h) })),
  pause: p => setPaused(p),
  setStars: arr => { stars = arr.slice(); Save.set('stars', stars); },
  setDirt: d => { dirt = d; Save.set('dirt', d); },
  perf: reset => { const r = { avg: perfStat.n ? +(perfStat.sum / perfStat.n).toFixed(2) : 0, max: +perfStat.max.toFixed(1), n: perfStat.n }; if (reset) { perfStat.n = 0; perfStat.sum = 0; perfStat.max = 0; } return r; }
};
})();
</script>
