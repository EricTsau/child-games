<script>
'use strict';
/* =====================================================================
 * 連連看：點兩個一樣的圖案，用最多轉兩個彎（三段）的線連起來就會消掉。
 * 線只能走空格，也可以繞到盤面外圈。闖關 50 關、計時挑戰、小小孩模式。
 * ===================================================================== */
(function () {
const SLUG = 'link-match';
const cv = document.getElementById('game');
const ctx = cv.getContext('2d');
const FONT = '"PingFang TC","Noto Sans TC","Microsoft JhengHei","Heiti TC",system-ui,sans-serif';
let W = 390, H = 844, dpr = 1, U = 1, time = 0;
const TAU = Math.PI * 2;
const OUT = '#4a2f45';
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const lerp = (a, b, t) => a + (b - a) * t;
const rand = (a, b) => a + Math.random() * (b - a);
const randInt = (a, b) => Math.floor(a + Math.random() * (b - a + 1));
function shuffleArr(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); const t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
const Ease = {
  outCubic: t => 1 - Math.pow(1 - t, 3),
  outQuad: t => 1 - (1 - t) * (1 - t),
  inOutSine: t => -(Math.cos(Math.PI * t) - 1) / 2,
  outBack: t => { const c = 1.5, c3 = c + 1; return 1 + c3 * Math.pow(t - 1, 3) + c * Math.pow(t - 1, 2); }
};
function hexA(hex, a) {
  const h = hex.replace('#', ''), n = parseInt(h.length === 3 ? h.split('').map(x => x + x).join('') : h, 16);
  return 'rgba(' + ((n >> 16) & 255) + ',' + ((n >> 8) & 255) + ',' + (n & 255) + ',' + a + ')';
}
function rrPath(g, x, y, w, h, r) {
  r = Math.max(0, Math.min(r, w / 2, h / 2));
  g.moveTo(x + r, y); g.lineTo(x + w - r, y); g.quadraticCurveTo(x + w, y, x + w, y + r);
  g.lineTo(x + w, y + h - r); g.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  g.lineTo(x + r, y + h); g.quadraticCurveTo(x, y + h, x, y + h - r);
  g.lineTo(x, y + r); g.quadraticCurveTo(x, y, x + r, y); g.closePath();
}
function rr(x, y, w, h, r) { ctx.beginPath(); rrPath(ctx, x, y, w, h, r); }
function mkCanvas(w, h) { const c = document.createElement('canvas'); c.width = Math.max(1, Math.ceil(w)); c.height = Math.max(1, Math.ceil(h)); return c; }
function txt(s, x, y, size, color, o) {
  o = o || {};
  ctx.font = (o.weight || '900') + ' ' + size + 'px ' + FONT;
  ctx.textAlign = o.align || 'center'; ctx.textBaseline = o.base || 'middle';
  if (o.stroke) { ctx.lineJoin = 'round'; ctx.strokeStyle = o.stroke; ctx.lineWidth = o.sw || size * 0.22; ctx.strokeText(s, x, y); }
  ctx.fillStyle = color; ctx.fillText(s, x, y);
}
/** 太長就縮小字 */
function fitTxt(s, x, y, size, maxW, color, o) {
  o = o || {};
  ctx.font = (o.weight || '900') + ' ' + size + 'px ' + FONT;
  const w = ctx.measureText(s).width;
  if (w > maxW && w > 0) size = Math.max(8, size * maxW / w);
  txt(s, x, y, size, color, o);
  return size;
}
function textW(s, size, weight) { ctx.font = (weight || '900') + ' ' + size + 'px ' + FONT; return ctx.measureText(s).width; }
function fmtTime(s) { s = Math.max(0, Math.ceil(s)); return String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0'); }

/* ---------- 補間、延遲呼叫 ---------- */
const timers = [];
function after(sec, fn) { timers.push({ t: sec, fn }); }
function updateTimers(dt) {
  for (let i = timers.length - 1; i >= 0; i--) {
    const tm = timers[i]; tm.t -= dt;
    if (tm.t <= 0) { timers.splice(i, 1); tm.fn(); }
  }
}

/* ---------- 存檔 ---------- */
const Save = {
  get(k, d) { return KG.store.get(SLUG + ':' + k, d); },
  set(k, v) { KG.store.set(SLUG + ':' + k, v); }
};

/* =====================================================================
 * 聲音：音效
 * ===================================================================== */
let sfxOn = Save.get('sfx', true) !== false;
let voiceOn = Save.get('voice', true) !== false;
const MUSIC_VOL = 0.32, MENU_VOL = 0.5;
const lastSfx = {};
function sfx(name, o, gap) {
  if (!sfxOn || !KG.sfx) return;
  const now = performance.now();
  if (lastSfx[name] && now - lastSfx[name] < (gap || 40)) return;
  lastSfx[name] = now;
  try { KG.sfx.play(name, o); } catch (e) { /* 忽略 */ }
}
function sfxReady() { return sfxOn && KG.sfx && !KG.isMuted(); }
function panX(x) { return clamp((x / W) * 2 - 1, -1, 1) * 0.6; }
const vary = (k) => 1 + (Math.random() * 2 - 1) * (k || 0.04);
// E 大調音階（E4 開始），圖案、連擊都照這個音階
const EMAJ = [329.63, 369.99, 415.30, 440.00, 493.88, 554.37, 622.25, 659.25, 739.99, 830.61, 880.00, 987.77];
if (KG.sfx) {
  KG.sfx.define('tsel', (p, s) => {
    s.tone(660 * p, 0.09, { type: 'triangle', vol: 0.17, slide: 690 * p });
    s.tone(1320 * p, 0.05, { vol: 0.05 });
    s.noise(0.02, { vol: 0.05, freq: 4200, q: 2 });
  });
  KG.sfx.define('desel', (p, s) => { s.tone(560 * p, 0.07, { type: 'triangle', vol: 0.1, slide: 420 * p }); });
  KG.sfx.define('pairPop', (p, s) => {
    s.tone(480 * p, 0.11, { vol: 0.22, slide: 1250 * p });
    s.noise(0.05, { vol: 0.09, freq: 3200 * p, q: 1.4 });
    s.tone(1480 * p, 0.06, { vol: 0.04, delay: 0.04 });
  });
  KG.sfx.define('combo', (p, s) => {
    [1, 1.26, 1.5].forEach((m, i) => s.tone(659 * p * m, 0.32, { vol: 0.075, delay: i * 0.055 }));
    s.tone(1318 * p, 0.25, { vol: 0.03, delay: 0.11 });
  });
  KG.sfx.define('bump', (p, s) => {
    s.tone(220 * p, 0.14, { type: 'triangle', vol: 0.17, slide: 160 * p });
    s.tone(175 * p, 0.13, { vol: 0.12, delay: 0.08, slide: 135 * p });
  });
  KG.sfx.define('shimmer', (p, s) => {
    [1319, 1661, 1976, 2489].forEach((f, i) => s.tone(f * p, 0.32, { vol: 0.04, delay: i * 0.05 }));
    s.tone(659 * p, 0.5, { vol: 0.06 });
    s.noise(0.35, { vol: 0.025, freq: 7000, q: 0.7, type: 'highpass' });
  });
  KG.sfx.define('swirl', (p, s) => {
    s.noise(0.55, { vol: 0.12, freq: 500 * p, sweep: 3800 * p, q: 2.4 });
    s.noise(0.45, { vol: 0.07, freq: 3400 * p, sweep: 700, q: 2, delay: 0.25 });
    for (let i = 0; i < 6; i++) s.tone(EMAJ[i * 2 % 12] * p, 0.09, { type: 'triangle', vol: 0.045, delay: i * 0.065 });
  });
  KG.sfx.define('slideW', (p, s) => {
    s.noise(0.2, { vol: 0.11, freq: 1700 * p, sweep: 480 * p, q: 1.2 });
    s.tone(300 * p, 0.1, { type: 'triangle', vol: 0.05, slide: 190 * p, delay: 0.1 });
  });
  KG.sfx.define('dropIn', (p, s) => {
    s.noise(0.4, { vol: 0.1, freq: 2600 * p, sweep: 500, q: 1 });
    for (let i = 0; i < 5; i++) s.noise(0.03, { vol: 0.06, freq: 1800 + i * 260, q: 3, delay: 0.18 + i * 0.05 });
  });
  KG.sfx.define('timeup', (p, s) => {
    s.tone(988, 0.16, { type: 'square', vol: 0.05 });
    s.tone(740, 0.16, { type: 'square', vol: 0.05, delay: 0.17 });
    s.tone(494, 0.55, { type: 'triangle', vol: 0.16, delay: 0.34, slide: 330 });
  });
  KG.sfx.define('starTone', (p, s) => { s.tone(784 * p, 0.4, { vol: 0.11 }); s.tone(1568 * p, 0.25, { vol: 0.035 }); s.noise(0.05, { vol: 0.04, freq: 6000, q: 0.7, type: 'highpass' }); });
  KG.sfx.define('bonus', (p, s) => { s.tone(988 * p, 0.08, { type: 'triangle', vol: 0.1 }); s.tone(1319 * p, 0.16, { type: 'triangle', vol: 0.1, delay: 0.07 }); });
  KG.sfx.define('page', (p, s) => { s.noise(0.08, { vol: 0.1, freq: 2600 * p, sweep: 1200 * p, q: 0.8 }); s.tone(520 * p, 0.06, { type: 'triangle', vol: 0.07 }); });
}
/** 連線的電流聲：沿著路線一段一段跑過去，左右聲道跟著走 */
function zapPath(pts) {
  if (!sfxReady()) return;
  const now = performance.now();
  if (lastSfx.zap && now - lastSfx.zap < 40) return;
  lastSfx.zap = now;
  try {
    const v = vary(0.05), n = pts.length;
    KG.sfx.tone(520 * v, 0.26, { type: 'sawtooth', vol: 0.035, slide: 1560 * v, pan: panX(pts[0].x) });
    for (let i = 0; i < n; i++) KG.sfx.tone(EMAJ[4 + i * 2] * 2 * v, 0.08, { type: 'triangle', vol: 0.07, delay: i * 0.07, pan: panX(pts[i].x) });
    const m = pts[Math.floor(n / 2)];
    KG.sfx.noise(0.24, { vol: 0.045, freq: 2400, sweep: 7000, q: 1.2, pan: panX(m.x) });
  } catch (e) { /* 忽略 */ }
}

  layers: { hurry: false, spark: false },

    { inst: 'clap', pat: '....x.......x...', vol: 0.5 },

    { inst: 'pad', chord: 'hold', vol: 0.2 },

    { inst: 'pluck', chord: '...5..5....5.5..', oct: 3, vol: 0.3 },
    { inst: 'pluck', chord: '...7..7....7.7..', oct: 3, vol: 0.27 },
    { inst: 'bell', vol: 0.95, seq: [
      'B4 . E5 F#5 G#5 - F#5 E5', 'D#5 - E5 - B4 - - .', 'C#5 . E5 F#5 G#5 - B5 -', 'A5 - G#5 F#5 - - D#5 .',
      'B4 . D#5 F#5 G#5 - F#5 D#5', 'E5 - - C#5 - - B4 .', 'A4 . C#5 E5 F#5 - E5 C#5', 'D#5 - - - F#5 - - .',
      'E5 . C#5 E5 G#5 - E5 -', 'F#5 . D#5 F#5 B5 - A5 -', 'G#5 - F#5 D#5 B4 - D#5 -', 'E5 - G#5 - E5 C#5 B4 .',
      'A4 - C#5 - E5 - A5 -', 'G#5 - F#5 - D#5 - B4 .', 'E5 . G#5 B5 G#5 . E5 D#5', 'F#5 - - . D#5 - B4 .'] },
    { inst: 'shaker', pat: 'xoxoxoxoxoxoxoxo', vol: 0.75, layer: 'hurry' },

const MENU_SONG = {

  tracks: [

    { inst: 'rim', pat: '....x.......x...', vol: 0.4 },
    { inst: 'shaker', pat: '..o...o...o...o.', vol: 0.5 },
    { inst: 'bass', chord: 'R.....5.R.....3.', vol: 0.52 },
    { inst: 'pad', chord: 'hold', vol: 0.28 },
    { inst: 'pluck', chord: '..3...5...7.....', oct: 3, vol: 0.28 },
    { inst: 'kalimba', vol: 0.95, seq: [
      'E5 - C#5 - A4 . B4 C#5', 'A4 - - . F#4 - E4 .', 'F#4 . A4 . D5 - C#5 -', 'B4 - - . G#4 - - .',
      'G#4 . B4 . E5 - D5 C#5', 'C#5 - A4 - - . F#4 .', 'D5 - - C#5 B4 - A4 .', 'G#4 - - - E4 - - .'] },
    { inst: 'flute', vol: 0.36, seq: ['', 'C#5 - - - - - - .', '', 'E5 - - - B4 - - .', '', 'A5 - - - - - - .', '', 'B4 - - - - - - .'] }

let musicBase = MENU_VOL;
function musicMenu() { if (KG.music) { musicBase = MENU_VOL; KG.music.setVolume(MENU_VOL); KG.music.play(MENU_SONG); } }
function musicGame(kid) {
  if (!KG.music) return;

  KG.music.setVolume(MUSIC_VOL);
  KG.music.play(GAME_SONG, { restart: true });
  if (kid) KG.music.setTempo(0.94);
}
function jingleClear() {
  if (!KG.music || !sfxOn) return;
  KG.music.jingle({ bpm: 150, inst: 'bell', vol: 0.28, notes: [['B4', 1], ['E5', 1], ['G#5', 1], ['B5', 2], ['G#5', 1], ['A5', 1], ['B5', 1], ['E5+G#5+B5', 4]],

  KG.music.jingle({ bpm: 150, inst: 'pluck', vol: 0.15, notes: [['G#4+B4', 2], ['x', 1], ['A4+C#5', 2], ['x', 1], ['B4+D#5', 2], ['G#4+B4+E5', 4]] });
}
function jingleSmall() { if (KG.music && sfxOn) KG.music.jingle({ bpm: 180, inst: 'bell', vol: 0.3, notes: [['E5', 1], ['G#5', 1], ['B5', 1], ['E6', 3]], bass: [['E3', 6, 0]], bassVol: 0.3 }); }
function jingleLose() { if (KG.music && sfxOn) KG.music.jingle({ bpm: 120, inst: 'pluck', vol: 0.3, notes: [['B4', 1], ['G#4', 1], ['E4', 1], ['D#4', 2], ['E4', 3]], bass: [['E3', 8, 0]], bassVol: 0.3 }); }
function jingleStart() { if (KG.music && sfxOn) KG.music.jingle({ bpm: 200, inst: 'bell', vol: 0.28, notes: [['E5', 1], ['G#5', 1], ['B5', 2]] }); }
/** 語音：講話的時候把音樂調小 */
let duckT = 0;
function sayName(text) {
  if (!voiceOn || KG.isMuted()) return;
  KG.say(text, 1.0);
  if (KG.music) { KG.music.setVolume(musicBase * 0.4); duckT = 1.1; }
}
function updateDuck(dt) {
  if (duckT > 0) { duckT -= dt; if (duckT <= 0 && KG.music) KG.music.setVolume(musicBase); }
}

/* =====================================================================
 * 美術：圖案（全部用程式畫，100×100 的座標）
 * ===================================================================== */
function Kit(g) {
  g.lineJoin = 'round'; g.lineCap = 'round';
  const K = {
    g, lw: 3.6,
    st(fill, noLine) { if (fill) { g.fillStyle = fill; g.fill(); } if (!noLine) { g.lineWidth = K.lw; g.strokeStyle = OUT; g.stroke(); } },
    path(fn, fill, noLine) { g.beginPath(); fn(g); K.st(fill, noLine); },
    circ(x, y, r, fill, noLine) { g.beginPath(); g.arc(x, y, r, 0, TAU); K.st(fill, noLine); },
    ell(x, y, rx, ry, rot, fill, noLine) { g.beginPath(); g.ellipse(x, y, rx, ry, rot || 0, 0, TAU); K.st(fill, noLine); },
    rect(x, y, w, h, r, fill, noLine) { g.beginPath(); rrPath(g, x, y, w, h, r); K.st(fill, noLine); },
    poly(p, fill, noLine) { g.beginPath(); g.moveTo(p[0], p[1]); for (let i = 2; i < p.length; i += 2) g.lineTo(p[i], p[i + 1]); g.closePath(); K.st(fill, noLine); },
    dot(x, y, r, fill) { g.beginPath(); g.arc(x, y, r, 0, TAU); g.fillStyle = fill; g.fill(); },
    curve(fn, color, w) { g.beginPath(); fn(g); g.strokeStyle = color || OUT; g.lineWidth = w || K.lw; g.stroke(); },
    tube(fn, color, w) { K.curve(fn, OUT, w + K.lw * 1.5); K.curve(fn, color, w); },
    eyes(x, y, sep, r) { for (const s of [-1, 1]) { K.dot(x + s * sep, y, r, OUT); K.dot(x + s * sep - r * 0.3, y - r * 0.35, r * 0.4, '#fff'); } },
    smile(x, y, w) { g.beginPath(); g.arc(x, y - w * 0.45, w * 0.6, 0.22 * Math.PI, 0.78 * Math.PI); g.strokeStyle = OUT; g.lineWidth = K.lw * 0.75; g.stroke(); },
    blush(x, y, sep, r) { K.dot(x - sep, y, r || 4.5, 'rgba(255,105,140,0.45)'); K.dot(x + sep, y, r || 4.5, 'rgba(255,105,140,0.45)'); },
    shine(x, y, rx, ry, rot) { g.beginPath(); g.ellipse(x, y, rx, ry, rot || 0, 0, TAU); g.fillStyle = 'rgba(255,255,255,0.65)'; g.fill(); },
    clip(fn, draw) { g.save(); g.beginPath(); fn(g); g.clip(); draw(); g.restore(); },
    blob(pts, fill, noLine) {
      g.beginPath();
      const n = pts.length, mid = (a, b) => [(a[0] + b[0]) / 2, (a[1] + b[1]) / 2];
      let m = mid(pts[n - 1], pts[0]); g.moveTo(m[0], m[1]);
      for (let i = 0; i < n; i++) { const p = pts[i], q = mid(p, pts[(i + 1) % n]); g.quadraticCurveTo(p[0], p[1], q[0], q[1]); }
      g.closePath(); K.st(fill, noLine);
    }
  };
  return K;
}

    [[34, 40], [50, 46], [66, 40], [42, 54], [58, 54], [50, 36]].forEach(([x, y]) => K.ell(x, y, 2.2, 3.6, 0, '#3b2a2a', true));

/** 需要 n 種圖案：先用目前主題，不夠再從其他主題補 */
function pickFaces(n, onlyTheme) {
  const th = themeOf(themeId);
  if (th.id === 'mix') return shuffleArr(FACES).slice(0, n);
  let list = shuffleArr(th.faces);
  if (onlyTheme || list.length >= n) return list.slice(0, n);
  const others = THEMES.filter(t => t.id !== th.id && t.id !== 'mix');
  const start = THEMES.indexOf(th);
  const ordered = [];
  for (let k = 1; k <= others.length + 1; k++) { const t = THEMES[(start + k) % 6]; if (t && t.id !== th.id) ordered.push(t); }
  for (const t of ordered) { if (list.length >= n) break; list = list.concat(shuffleArr(t.faces).slice(0, n - list.length)); }
  return list.slice(0, n);
}

/* ---------- 點圖案 ---------- */
function cellPx(i) { const r = rOf(i), c = cOf(i); return { x: cellX(c), y: cellY(r) }; }
function tapCell(i) {
  if (G.over || G.clearing) return;
  G.idle = 0;
  const v = G.g[i];
  if (v <= 0) return;
  const p = cellPx(i);
  if (G.sel === i) { G.sel = -1; sfx('desel', { pitch: vary(0.04), pan: panX(p.x) }); return; }
  if (G.sel < 0) { selectCell(i); return; }
  const a = G.sel;
  if (G.g[a] !== v) {
    G.sk[a] = 0.3;
    sfx('bump', { vol: 0.55, pitch: 1.25 * vary(0.05), pan: panX(p.x) });
    selectCell(i);
    showMsg('要找一樣的圖案喔', 'soft');
    return;
  }
  const path = findPath(G.g, G.R, G.C, a, i, 2);
  if (path) { doMatch(a, i, path); return; }
  // 連不起來：輕輕搖一下，說明原因
  G.sk[a] = 0.4; G.sk[i] = 0.4;
  G.sel = -1;
  const far = findPath(G.g, G.R, G.C, a, i, 12);
  showMsg(far ? '路線超過兩個轉彎了' : '中間被擋住了，連不過去', 'bad');
  sfx('bump', { pitch: vary(0.05), pan: panX(p.x) });
  KG.vibrate(25);
}
function selectCell(i) {
  G.sel = i;
  const v = G.g[i], face = G.faces[v], p = cellPx(i);
  sfx('tsel', { pitch: (EMAJ[face.idx % 8] / 660) * 1.5 * vary(0.03), pan: panX(p.x) });
  if (G.mode === 'kid') sayName(face.name);
}
const COMBO_WIN = 3.2;
function doMatch(a, b, path) {
  const v = G.g[a], face = G.faces[v];
  const pa = cellPx(a), pb = cellPx(b);
  const pts = path.map(i => [rOf(i), cOf(i)]);
  // 連擊
  if (time - G.lastMatch < COMBO_WIN && G.combo > 0) G.combo++; else G.combo = 1;
  G.lastMatch = time;
  G.maxCombo = Math.max(G.maxCombo, G.combo);
  const colors = ['#ffe066', '#ffa8d8', '#8ce8ff', '#b2f2bb', '#d0bfff'];
  G.paths.push({ pts, t: 0, col: colors[Math.min(colors.length - 1, Math.floor((G.combo - 1) / 2))] });
  zapPath(path.map(i => cellPx(i)));
  // 方塊先變成「幽靈」播完動畫，盤面立刻清空可以繼續點
  for (const i of [a, b]) { G.ghosts.push({ r: rOf(i), c: cOf(i), face, t: 0 }); G.g[i] = 0; G.ad[i] = 0; G.sk[i] = 0; }

    sfx('pairPop', { pitch: vary(0.05), pan: panX(pa.x) });
    setTimeout(() => sfx('pairPop', { pitch: vary(0.05) * 1.06, pan: panX(pb.x) }, 10), 45);
    burst(pa.x, pa.y, face.col); burst(pb.x, pb.y, face.col);

    after(0.12, () => sfx('combo', { pitch: EMAJ[Math.min(7, G.combo - 2)] / EMAJ[0] * vary(0.015) }));

function afterMatchCheck() {

}
function showMsg(text, kind) { G.msg = { text, kind: kind || 'info', t: 2 }; }

/* ---------- 提示、洗牌 ---------- */
function doHint(free) {

  if (!free && G.hints <= 0) { showMsg('提示用完了', 'soft'); sfx('bump', { pitch: 1.2 }); return; }
  let mv = solve(G.g, G.R, G.C, G.grav, 4);
  if (!mv || mv[0] < 0) { const m = findMove(G.g, G.R, G.C, true); mv = m ? [m[0], m[1]] : null; }
  if (!mv) { G.autoShuf = 0.2; return; }

}
function doShuffle(manual) {

    G.shuffles--;
  }
  const cells = [];
  for (let r = 0; r < G.R; r++) for (let c = 0; c < G.C; c++) { const i = idxOf(r, c); if (G.g[i] > 0) cells.push(i); }

  for (let att = 0; att < 30 && !plan; att++) plan = pairPlan(G.g, G.R, G.C, G.grav, cells);

  if (!plan) {
    // 怎麼洗都連不到（例如只剩被石頭圍住的一對）：用魔法直接收走一對
    const m = groupsOf(G.g, G.R, G.C);
    for (const arr of m.values()) if (arr.length >= 2) {
      const face = G.faces[G.g[arr[0]]];
      for (const i of [arr[0], arr[1]]) { const p = cellPx(i); burst(p.x, p.y, face.col); G.ghosts.push({ r: rOf(i), c: cOf(i), face, t: 0.2 }); G.g[i] = 0; }

    sfx('shimmer');

  const pairTypes = [];
  byType.forEach((arr, v) => { for (let k = 0; k + 1 < arr.length; k += 2) pairTypes.push(v); });

  const from = new Map();
  byType.forEach((arr, v) => from.set(v, shuffleArr(arr)));
  const newVal = new Map();
  plan.forEach(([a, b], k) => { newVal.set(a, types[k]); newVal.set(b, types[k]); });
  cells.forEach(cell => {
    const v = newVal.get(cell);
    G.g[cell] = v;
    const src = from.get(v).pop(), r = rOf(cell), c = cOf(cell);

/* ---------- 過關、時間到 ---------- */
function boardCleared() {

    G.clearing = 1.3;
    G.round++;
    G.left = Math.min(G.left + 20, 180);
    G.score += 200;
    G.tBonus = { text: '+20 秒', t: 1.4 };
    G.banner = { title: '清空了！', sub: '加 20 秒、200 分', t: 1.3, max: 1.3 };
    jingleSmall();
    after(1.3, () => { G.clearing = 0; buildBoard(); });
    return;
  }
  if (G.mode === 'kid') {
    G.clearing = 2.2;
    Save.set('kidBoards', (Save.get('kidBoards', 0) || 0) + 1);
    G.banner = { title: '好棒！', sub: '全部連完了！', t: 2.1, max: 2.1 };
    jingleClear();

  }

  if (newBest) prog.best[d.i] = t;
  if (!(prog.stars[d.i] >= stars)) prog.stars[d.i] = stars;
  saveProg();
  G.result = { kind: 'win', stars, time: t, best: prog.best[d.i], newBest: newBest && prevBest != null, combo: G.maxCombo, shown: 0 };
  if (KG.music) KG.music.stop(0.5);
  jingleClear();
  confettiBurst();

}
function timeUp() {
  G.over = true; G.left = 0; G.sel = -1;
  if (KG.music) KG.music.stop(0.3);
  sfx('timeup');
  after(0.9, jingleLose);
  KG.vibrate(60);
  if (G.mode === 'timed') {
    const prev = Save.get('bestScore', 0) || 0;
    const nb = G.score > prev;
    if (nb) Save.set('bestScore', G.score);

  } else {

}
function musicMenuLater() { after(1.2, () => { if (scene === 'play' && overlay === 'result') musicMenu(); }); }

/* ---------- 每格時間更新 ---------- */
function updatePlay(dt) {
  if (overlay === 'pause' || overlay === 'help') return;
  for (let i = 0; i < G.ad.length; i++) {
    if (G.ad[i]) { G.at[i] += dt; if (G.at[i] >= G.ad[i]) { G.ad[i] = 0; } }
    if (G.sk[i] > 0) G.sk[i] = Math.max(0, G.sk[i] - dt);
  }
  for (let k = G.ghosts.length - 1; k >= 0; k--) { G.ghosts[k].t += dt; if (G.ghosts[k].t > 0.5) G.ghosts.splice(k, 1); }
  for (let k = G.paths.length - 1; k >= 0; k--) { G.paths[k].t += dt; if (G.paths[k].t > 0.45) G.paths.splice(k, 1); }
  if (G.msg && (G.msg.t -= dt) <= 0) G.msg = null;
  if (G.comboLbl && (G.comboLbl.t -= dt) <= 0) G.comboLbl = null;
  if (G.banner && (G.banner.t -= dt) <= 0) G.banner = null;
  if (G.tBonus && (G.tBonus.t -= dt) <= 0) G.tBonus = null;
  if (G.hint && (G.hint.t -= dt) <= 0) G.hint = null;
  if (G.scoreBump > 0) G.scoreBump -= dt;
  if (G.combo > 0 && time - G.lastMatch > COMBO_WIN) { G.combo = 0; if (KG.music) KG.music.setLayer('spark', false); }
  if (G.clearing > 0) { G.clearing = Math.max(0.0001, G.clearing - dt); }
  if (G.over || overlay) return;
  if (G.autoShuf > 0) { G.autoShuf -= dt; if (G.autoShuf <= 0) { G.autoShuf = 0; doShuffle(false); } }
  if (G.clearing) return;
  G.elapsed += dt;
  if (G.limit) {
    G.left -= dt;
    const sec = Math.ceil(G.left);
    if (sec !== G.lastSec) {
      if (sec <= 10 && sec > 0 && sec < G.lastSec) sfx(sec <= 5 ? 'countdown' : 'tick', { vol: sec <= 5 ? 0.7 : 1 });
      G.lastSec = sec;
    }
    const hurry = G.left < 15;
    if (hurry !== G.hurry) {
      G.hurry = hurry;
      if (KG.music) { KG.music.setLayer('hurry', hurry); KG.music.setTempo(hurry ? 1.06 : 1); }
      if (hurry) showMsg('快沒時間了！加油！', 'warn');
    }
    if (G.left <= 0) { timeUp(); return; }
  }
  if (G.mode === 'kid') {
    G.idle += dt;
    if (G.idle > 7 && !G.hint) { G.idle = 0; doHint(true); }
  }
}

/* =====================================================================
 * 粒子
 * ===================================================================== */
const PMAX = KG.lowEnd ? 140 : 260;
const parts = [];
function addP(p) { if (parts.length >= PMAX) parts.shift(); parts.push(p); }
function burst(x, y, col) {
  const n = KG.lowEnd ? 8 : 13, s = Math.max(10, L.th || 40);
  for (let k = 0; k < n; k++) {
    const a = rand(0, TAU), sp = rand(80, 260) * s / 50;
    addP({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 60, g: 420, life: rand(0.35, 0.65), max: 0.65, size: rand(2.5, 5.5) * s / 50, col: k % 3 ? col : '#fff', kind: k % 4 ? 'dot' : 'star', rot: rand(0, TAU) });
  }
  addP({ x, y, vx: 0, vy: 0, g: 0, life: 0.35, max: 0.35, size: s * 0.55, col: '#fff', kind: 'ring' });
}
function sparkle(x, y, col, n) {
  for (let k = 0; k < n; k++) { const a = rand(0, TAU), sp = rand(20, 70); addP({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, g: -20, life: rand(0.4, 0.9), max: 0.9, size: rand(2, 4), col, kind: 'star', rot: 0 }); }
}
function confettiBurst() {
  const cols = ['#ff8fb1', '#ffd65c', '#7bd88f', '#6cc4ff', '#b49cff', '#ffa94d'];
  for (let k = 0; k < (KG.lowEnd ? 60 : 110); k++) {
    const x = rand(0, W);
    addP({ x, y: rand(-40, -5), vx: rand(-40, 40), vy: rand(60, 220), g: 120, life: rand(1.6, 2.8), max: 2.8, size: rand(4, 8), col: cols[k % 6], kind: 'conf', rot: rand(0, TAU), vr: rand(-6, 6) });
  }
}
function updateParts(dt) {
  for (let k = parts.length - 1; k >= 0; k--) {
    const p = parts[k];
    p.life -= dt;
    if (p.life <= 0) { parts.splice(k, 1); continue; }
    p.vy += p.g * dt; p.x += p.vx * dt; p.y += p.vy * dt;
    if (p.vr) p.rot += p.vr * dt;
    if (p.kind === 'conf') p.vx *= 0.99;
  }
}
function starPath(x, y, r, inner) {
  ctx.beginPath();
  for (let i = 0; i < 10; i++) { const a = -Math.PI / 2 + i * Math.PI / 5, rr2 = i % 2 ? r * (inner || 0.45) : r; const px = x + Math.cos(a) * rr2, py = y + Math.sin(a) * rr2; if (i) ctx.lineTo(px, py); else ctx.moveTo(px, py); }
  ctx.closePath();
}
function drawParts() {
  for (const p of parts) {
    const a = clamp(p.life / p.max, 0, 1);
    ctx.globalAlpha = p.kind === 'conf' ? Math.min(1, a * 3) : a;
    if (p.kind === 'dot') { ctx.fillStyle = p.col; ctx.beginPath(); ctx.arc(p.x, p.y, p.size * (0.5 + a * 0.5), 0, TAU); ctx.fill(); }
    else if (p.kind === 'star') { ctx.fillStyle = p.col; starPath(p.x, p.y, p.size * 1.4, 0.45); ctx.fill(); }
    else if (p.kind === 'ring') { ctx.strokeStyle = p.col; ctx.lineWidth = 3 * a + 1; ctx.beginPath(); ctx.arc(p.x, p.y, p.size * (1.5 - a), 0, TAU); ctx.stroke(); }
    else if (p.kind === 'conf') { ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot); ctx.fillStyle = p.col; ctx.fillRect(-p.size / 2, -p.size * 0.3, p.size, p.size * 0.6); ctx.restore(); }
  }
  ctx.globalAlpha = 1;

/* =====================================================================
 * 版面
 * ===================================================================== */
const L = { tall: true, tw: 40, th: 48, bx: 0, by: 0, ring: 16, region: { x: 0, y: 0, w: 0, h: 0 }, lp: 0, rp: 0 };
function layoutPlay() {
  const tall = isTallScreen();
  L.tall = tall;
  let region;
  if (tall) {
    region = { x: 10, y: 112, w: W - 20, h: H - 112 - 92 };
  } else {
    L.lp = clamp(W * 0.15, 116, 210); L.rp = clamp(W * 0.1, 88, 140);
    region = { x: L.lp, y: 8, w: W - L.lp - L.rp, h: H - 16 };
  }
  L.region = region;
  if (!G.R) return;
  const asp = G.mode === 'kid' ? 0.9 : 0.84, m = 0.62;
  let th = Math.min(region.h / (G.R + m * 2), region.w / ((G.C + m * 2) * asp));
  th = Math.min(th, (G.mode === 'kid' ? 150 : 86) * Math.max(1, U));
  L.th = th; L.tw = th * asp;
  L.bx = region.x + (region.w - L.tw * G.C) / 2;

}
function cellX(c) { return c < 0 ? L.bx - L.ring : c >= G.C ? L.bx + G.C * L.tw + L.ring : L.bx + (c + 0.5) * L.tw; }
function cellY(r) { return r < 0 ? L.by - L.ring : r >= G.R ? L.by + G.R * L.th + L.ring : L.by + (r + 0.5) * L.th; }
let bgCanvas = null;
function resize() {
  const r = cv.getBoundingClientRect();
  W = Math.max(1, r.width || innerWidth); H = Math.max(1, r.height || innerHeight);
  dpr = window.devicePixelRatio || 1;
  cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
  U = clamp(Math.min(W / 400, H / 560), 0.68, 1.35);
  if (scene === 'play' && G.g && G.tall !== isTallScreen()) transposeBoard();
  layoutPlay();
  buildBg();
}
window.addEventListener('resize', resize);
window.addEventListener('orientationchange', () => setTimeout(resize, 120));
if (window.visualViewport) window.visualViewport.addEventListener('resize', resize);

/* =====================================================================
 * 背景：黃昏的城市（城市流行風）
 * ===================================================================== */
function buildBg() {
  bgCanvas = mkCanvas(W * dpr, H * dpr);
  const g = bgCanvas.getContext('2d'); g.scale(dpr, dpr);
  const gr = g.createLinearGradient(0, 0, 0, H);
  gr.addColorStop(0, '#2d2160'); gr.addColorStop(0.45, '#6a3f9e'); gr.addColorStop(0.78, '#e46fa8'); gr.addColorStop(1, '#ffbf8a');
  g.fillStyle = gr; g.fillRect(0, 0, W, H);
  // 星星
  let seed = 7; const rnd = () => { seed = (seed * 16807) % 2147483647; return seed / 2147483647; };
  for (let k = 0; k < 70; k++) { g.globalAlpha = 0.25 + rnd() * 0.6; g.fillStyle = '#fff'; g.beginPath(); g.arc(rnd() * W, rnd() * H * 0.5, 0.6 + rnd() * 1.3, 0, TAU); g.fill(); }
  g.globalAlpha = 1;
  // 夕陽（橫條紋）
  const sy = H * 0.8, sr = Math.min(W, H) * 0.26;
  const sg = g.createLinearGradient(0, sy - sr, 0, sy + sr * 0.3);
  sg.addColorStop(0, '#fff3a8'); sg.addColorStop(1, '#ff7aa8');
  g.save(); g.beginPath(); g.arc(W * 0.5, sy, sr, 0, TAU); g.clip();
  g.fillStyle = sg; g.fillRect(W * 0.5 - sr, sy - sr, sr * 2, sr * 2);
  g.globalCompositeOperation = 'destination-out';
  for (let k = 0; k < 6; k++) { const y = sy - sr * 0.1 + k * sr * 0.13; g.fillRect(W * 0.5 - sr, y, sr * 2, 2 + k * 1.6); }
  g.restore();
  // 城市剪影
  const base = H;
  const layers = [['#4b2d7f', 0.2, 0.5], ['#33205e', 0.12, 0.85]];
  layers.forEach(([col, hmul, alpha], li) => {
    let x = -10;
    g.fillStyle = col; g.globalAlpha = 1;
    while (x < W + 10) {
      const bw = (24 + rnd() * 46) * Math.max(0.8, U), bh = H * (hmul + rnd() * hmul * 0.9);
      g.fillRect(x, base - bh, bw - 2, bh);

function drawLogo(cx, cy, size) {
  // 三個字放在方塊上，線從第一塊繞上去接到第三塊（剛好兩個彎）
  const tw = size, th = size * 1.15, gap = size * 0.22;
  const xs = [cx - tw - gap, cx, cx + tw + gap];
  const chars = ['連', '連', '看'], cols = ['#ff6b9a', '#ffb703', '#4dabf7'];
  const loop = (time % 3.2) / 3.2;
  const lift = th * 0.75;
  const pts = [[xs[0], cy - th * 0.2], [xs[0], cy - lift - th * 0.2], [xs[2], cy - lift - th * 0.2], [xs[2], cy - th * 0.2]];
  // 路線
  const grow = clamp((loop - 0.15) / 0.25, 0, 1), fade = loop < 0.75 ? 1 : clamp(1 - (loop - 0.75) / 0.15, 0, 1);

    const len = total * grow;
    ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.globalAlpha = fade;

      ctx.beginPath(); ctx.moveTo(pts[0][0], pts[0][1]); let acc = 0;
      for (let k = 1; k < 4; k++) { const sl = Math.hypot(pts[k][0] - pts[k - 1][0], pts[k][1] - pts[k - 1][1]); if (acc + sl <= len) { ctx.lineTo(pts[k][0], pts[k][1]); acc += sl; } else { const f = (len - acc) / sl; ctx.lineTo(lerp(pts[k - 1][0], pts[k][0], f), lerp(pts[k - 1][1], pts[k][1], f)); break; } }
      ctx.strokeStyle = col; ctx.lineWidth = wd; ctx.stroke();
    }
    ctx.globalAlpha = 1;
  }
  xs.forEach((x, k) => {
    const bob = Math.sin(time * 2.2 + k * 0.9) * size * 0.04;
    const pop = (k !== 1 && loop > 0.4 && loop < 0.75) ? 1 + 0.08 * Math.sin((loop - 0.4) / 0.35 * Math.PI) : 1;
    const w = tw * pop, h = th * pop, x0 = x - w / 2, y0 = cy - h / 2 + bob;

    const gr = ctx.createLinearGradient(0, y0, 0, y0 + h); gr.addColorStop(0, '#fffef8'); gr.addColorStop(1, '#ffe2bd');
    rr(x0, y0, w, h - d, w * 0.2); ctx.fillStyle = gr; ctx.fill(); ctx.strokeStyle = 'rgba(150,105,55,0.6)'; ctx.lineWidth = 2; ctx.stroke();
    txt(chars[k], x, y0 + (h - d) / 2 + 2, size * 0.66, cols[k], { stroke: '#fff', sw: size * 0.12 });
  });
}

  if (tall) btn('thBack', W / 2 - 90, H - 74, 180, 56, '完成', { color: 'green', fn: goTitle });
  else btn('thBack', W - 160, H - 60, 140, 48, '完成', { color: 'green', fn: goTitle });
  regOn = true;
}

/* =====================================================================
 * 遮罩：暫停、結算、玩法
 * ===================================================================== */
function dim() { ctx.fillStyle = 'rgba(20,10,45,0.62)'; ctx.fillRect(0, 0, W, H); }
function drawPause() {
  dim();
  const cw = Math.min(360, W - 32), bh = clamp(52 * U, 44, 58), gap = clamp(10 * U, 7, 12);
  const kid = G.mode === 'kid';
  const rows = 4;
  const ch = Math.min(H - 20, 64 + rows * (bh + gap) + 10);
  const x = (W - cw) / 2, y = (H - ch) / 2;
  card(x, y, cw, ch);
  txt('暫停中', W / 2, y + 34, clamp(26 * U, 20, 30), '#6a3f9e');
  let by = y + 62;
  const bx = x + 18, bw = cw - 36, hw = (bw - gap) / 2;
  btn('pResume', bx, by, bw, bh, '繼續玩', { color: 'green', icon: ICON.play, fn: resumeGame }); by += bh + gap;
  btn('pRestart', bx, by, hw, bh, '重新開始', { color: 'yellow', icon: ICON.retry, size: clamp(17 * U, 14, 20), fn: () => { overlay = null; startGame(G.mode, G.level); } });
  btn('pMenu', bx + hw + gap, by, hw, bh, G.mode === 'level' ? '選關' : '回選單', { color: 'blue', icon: ICON.list, size: clamp(17 * U, 14, 20), fn: () => { overlay = null; if (G.mode === 'level') { scene = 'levels'; musicMenu(); } else goTitle(); } }); by += bh + gap;
  toggleRow(bx, by, bw, bh, gap, clamp(17 * U, 14, 20)); by += bh + gap;
  btn('pHelp', bx, by, kid ? hw : bw, bh, '玩法說明', { color: 'purple', icon: ICON.help, size: clamp(17 * U, 14, 20), fn: () => { overlay = 'help'; helpFrom = 'pause'; } });
  if (kid) btn('pVoice', bx + hw + gap, by, hw, bh, '念名字 ' + (voiceOn ? '開' : '關'), { color: 'white', icon: ICON.voice, on: voiceOn, size: clamp(16 * U, 13, 19), fn: toggleVoice });
}
let helpFrom = null;
function drawHelp() {
  dim();
  const cw = Math.min(520, W - 28), tall = H > W * 0.95;
  const ch = Math.min(H - 20, tall ? 560 : 360);
  const x = (W - cw) / 2, y = (H - ch) / 2;
  card(x, y, cw, ch);
  const ts = clamp(24 * U, 19, 28);
  txt('怎麼玩', W / 2, y + 30, ts, '#6a3f9e');
  const lines = ['點一個圖案，再點另一個一樣的圖案。', '兩個之間的線最多只能轉兩個彎', '（三段直線），而且只能走空格，', '也可以繞到盤面外面那一圈。', '連得到就會消掉，全部消光就過關！', '連續很快消掉會有「連擊」。'];
  const fs = clamp(15 * U, 12.5, 18), bh = clamp(50 * U, 42, 56);
  // 小圖：兩個彎的例子
  const showDemo = ch > 330;
  let ty = y + 30 + ts;
  const lh = fs * 1.5;
  if (!tall && showDemo) {
    // 橫式：文字在左、圖在右
    const tx = x + 22, tmax = cw * 0.58;
    lines.forEach((s, k) => fitTxt(s, tx, ty + k * lh, fs, tmax, '#4a3560', { align: 'left', weight: '700' }));
    helpDemo(x + cw * 0.62, y + 56, cw * 0.34, ch - 56 - bh - 30);
  } else {
    lines.forEach((s, k) => fitTxt(s, W / 2, ty + k * lh, fs, cw - 30, '#4a3560', { weight: '700' }));
    if (showDemo) helpDemo(x + 30, ty + lines.length * lh, cw - 60, ch - (ty + lines.length * lh - y) - bh - 30);
  }
  btn('hOk', W / 2 - 90, y + ch - bh - 14, 180, bh, '知道了', { color: 'green', fn: () => { overlay = helpFrom === 'pause' ? 'pause' : null; helpFrom = null; } });
}
function helpDemo(x, y, w, h) {
  if (h < 60) return;
  const R = 3, C = 4;
  const s = Math.min(h / (R + 1.4), w / ((C + 1.4) * 0.86)), tw = s * 0.86;
  const bx = x + (w - tw * C) / 2, by = y + (h - s * R) / 2;
  const f1 = FACE_BY_ID.panda, f2 = FACE_BY_ID.apple, f3 = FACE_BY_ID.boba;
  const grid = [[f1, f3, f2, f1], [f2, null, null, f3], [f3, f2, f1, f2]];
  grid.forEach((row, r) => row.forEach((f, c) => { if (f) ctx.drawImage(tileSprite(f, tw, s), bx + c * tw, by + r * s, tw, s); }));
  const ring = s * 0.42;
  const loop = (time % 2.4) / 2.4, grow = clamp(loop / 0.5, 0, 1);
  const pts = [[bx + tw * 0.5, by + s * 0.5], [bx + tw * 0.5, by - ring], [bx + tw * 3.5, by - ring], [bx + tw * 3.5, by + s * 0.5]];
  let total = 0; for (let k = 1; k < 4; k++) total += Math.hypot(pts[k][0] - pts[k - 1][0], pts[k][1] - pts[k - 1][1]);
  const len = total * grow;
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  for (const [wd, col] of [[s * 0.26, 'rgba(255,200,60,0.35)'], [s * 0.11, '#ffb703'], [s * 0.04, '#fff']]) {
    ctx.beginPath(); ctx.moveTo(pts[0][0], pts[0][1]); let acc = 0;
    for (let k = 1; k < 4; k++) { const sl = Math.hypot(pts[k][0] - pts[k - 1][0], pts[k][1] - pts[k - 1][1]); if (acc + sl <= len) { ctx.lineTo(pts[k][0], pts[k][1]); acc += sl; } else { const f = (len - acc) / sl; ctx.lineTo(lerp(pts[k - 1][0], pts[k][0], f), lerp(pts[k - 1][1], pts[k][1], f)); break; } }
    ctx.strokeStyle = col; ctx.lineWidth = wd; ctx.stroke();
  }
  fitTxt('熊貓繞外圈：轉 2 個彎 ✓', x + w / 2, by + s * R + s * 0.42, clamp(s * 0.3, 11, 16), w, '#2f9e44', { weight: '800' });
}
function drawResult() {
  dim();
  const r = G.result; if (!r) return;
  const cw = Math.min(380, W - 32), bh = clamp(52 * U, 44, 58), gap = 10;
  const ts = clamp(30 * U, 22, 34), fs0 = clamp(17 * U, 14, 20), ss0 = clamp(26 * U, 20, 32);
  const contentH = r.kind === 'win' ? 18 + ts + 12 + ss0 * 2 + 22 + fs0 * 2.6 + 22 + bh * 2 + gap + 16
    : r.kind === 'timed' ? 38 + ts * 2 + 20 + fs0 * 2.5 + 24 + bh + 16 : 38 + ts + 16 + fs0 * 2.6 + 26 + bh + 16;
  const ch = Math.min(H - 16, contentH);
  const x = (W - cw) / 2, y = (H - ch) / 2;
  card(x, y, cw, ch);
  let ty = y + 38;
  const bx = x + 18, bw = cw - 36, hw = (bw - gap) / 2, by = y + ch - bh - 16;
  if (r.kind === 'win') {
    ty = y + 18 + ts / 2;
    txt('過關！', W / 2, ty, ts, '#e8590c', { stroke: '#ffe8cc', sw: 6 });
    const ss = ss0;
    ty += ts / 2 + 12 + ss;
    for (let s = 0; s < 3; s++) {
      const appear = sceneT - 0.25 - s * 0.28;
      const on = s < r.stars && appear > 0;
      if (s < r.stars && appear > 0 && !(r.shown & (1 << s))) { r.shown |= (1 << s); sfx('starTone', { pitch: [1, 1.26, 1.5][s] }); }
      const k = on ? Ease.outBack(clamp(appear / 0.3, 0, 1)) : 1;
      ctx.save(); ctx.translate(W / 2 + (s - 1) * ss * 2.3, ty); ctx.scale(k, k); drawStar(0, 0, ss, on); ctx.restore();
    }
    ty += ss + 22;
    const fs = clamp(17 * U, 14, 20);
    fitTxt('時間 ' + fmtTime(r.time) + (r.newBest ? '  新紀錄！' : '  最佳 ' + fmtTime(r.best)), W / 2, ty, fs, cw - 30, '#4a3560', { weight: '800' });
    ty += fs * 1.5;
    if (r.combo >= 2) fitTxt('最高連擊 ×' + r.combo, W / 2, ty, fs * 0.9, cw - 30, '#d6336c', { weight: '800' });
    const hasNext = G.def.i < 49;
    btn('rNext', bx, by - bh - gap, bw, bh, hasNext ? '下一關' : '全部過關了！', { color: 'green', icon: hasNext ? ICON.next : null, disabled: !hasNext, fn: () => { overlay = null; startGame('level', G.def.i + 1); } });
    btn('rRetry', bx, by, hw, bh, '再玩一次', { color: 'yellow', icon: ICON.retry, size: clamp(17 * U, 14, 20), fn: () => { overlay = null; startGame('level', G.def.i); } });
    btn('rMenu', bx + hw + gap, by, hw, bh, '選關', { color: 'blue', icon: ICON.list, size: clamp(17 * U, 14, 20), fn: () => { overlay = null; scene = 'levels'; musicMenu(); } });
  } else if (r.kind === 'timed') {
    txt('時間到！', W / 2, ty, ts, '#6a3f9e');
    ty += ts + 14;
    txt(r.score + ' 分', W / 2, ty, ts * 1.2, '#e8590c', { stroke: '#ffe8cc', sw: 6 });
    ty += ts + 6;
    const fs = clamp(17 * U, 14, 20);
    fitTxt(r.newBest ? '新紀錄！' : '最佳 ' + r.best + ' 分', W / 2, ty, fs, cw - 30, r.newBest ? '#d6336c' : '#4a3560', { weight: '800' });
    ty += fs * 1.5;
    fitTxt('清空 ' + r.rounds + ' 盤 · 最高連擊 ×' + Math.max(1, r.combo), W / 2, ty, fs * 0.9, cw - 30, '#4a3560', { weight: '700' });
    btn('rRetry', bx, by, hw, bh, '再玩一次', { color: 'green', icon: ICON.retry, size: clamp(17 * U, 14, 20), fn: () => { overlay = null; startGame('timed'); } });
    btn('rMenu', bx + hw + gap, by, hw, bh, '回選單', { color: 'blue', icon: ICON.list, size: clamp(17 * U, 14, 20), fn: () => { overlay = null; goTitle(); } });
  } else {
    txt('時間到！', W / 2, ty, ts, '#6a3f9e');
    ty += ts + 16;
    const fs = clamp(18 * U, 14, 21);
    fitTxt('還剩 ' + r.left + ' 對，差一點點！', W / 2, ty, fs, cw - 30, '#4a3560', { weight: '800' });
    ty += fs * 1.6;
    fitTxt('提示和洗牌可以幫忙喔', W / 2, ty, fs * 0.85, cw - 30, '#7a6a90', { weight: '700' });
    btn('rRetry', bx, by, hw, bh, '再試一次', { color: 'green', icon: ICON.retry, size: clamp(17 * U, 14, 20), fn: () => { overlay = null; startGame('level', G.def.i); } });
    btn('rMenu', bx + hw + gap, by, hw, bh, '選關', { color: 'blue', icon: ICON.list, size: clamp(17 * U, 14, 20), fn: () => { overlay = null; scene = 'levels'; musicMenu(); } });
  }
}

/* =====================================================================
 * 場景切換
 * ===================================================================== */
function goTitle() { scene = 'title'; overlay = null; sceneT = 0; G.over = true; timers.length = 0; parts.length = 0; musicMenu(); }
function pauseGame() {
  if (scene !== 'play' || overlay || G.over) return;
  overlay = 'pause'; sceneT = 0;
  if (KG.music) KG.music.pause();
  sfx('back');
}
function resumeGame() { overlay = null; if (KG.music) KG.music.resume(); sfx('select'); }
document.addEventListener('visibilitychange', () => { if (document.hidden) pauseGame(); });

/* =====================================================================
 * 輸入
 * ===================================================================== */
function toLocal(e) { const r = cv.getBoundingClientRect(); return { x: (e.clientX - r.left) * (W / (r.width || W)), y: (e.clientY - r.top) * (H / (r.height || H)) }; }
/** 點到附近也算：找最近的圖案 */
function pickTile(x, y) {
  if (!G.g) return -1;
  const fc = (x - L.bx) / L.tw - 0.5, fr = (y - L.by) / L.th - 0.5;
  const c0 = Math.round(fc), r0 = Math.round(fr);
  let best = -1, bd = 1e9;
  for (let r = r0 - 1; r <= r0 + 1; r++) for (let c = c0 - 1; c <= c0 + 1; c++) {
    if (r < 0 || c < 0 || r >= G.R || c >= G.C) continue;
    const i = idxOf(r, c);
    if (G.g[i] <= 0) continue;
    const d = Math.hypot(fc - c, (fr - r) * 1.05);
    if (d < bd) { bd = d; best = i; }
  }
  return bd < 0.95 ? best : -1;
}
let downPt = null;
cv.addEventListener('pointerdown', (e) => {
  const p = toLocal(e);
  kbdNav = false;
  try { cv.focus({ preventScroll: true }); } catch (err) { /* 忽略 */ }
  const b = hitBtn(p.x, p.y, 6);
  if (b) { if (!b.disabled) { pressId = b.id; downPt = p; } else sfx('error', { vol: 0.6 }); return; }
  if (scene === 'play' && !overlay) {
    G.kbd = false;
    const i = pickTile(p.x, p.y);
    if (i >= 0) tapCell(i);
    else if (G.sel >= 0 && p.x > L.bx - L.tw && p.x < L.bx + (G.C + 1) * L.tw && p.y > L.by - L.th && p.y < L.by + (G.R + 1) * L.th) { G.sel = -1; sfx('desel', { pitch: 0.95 }); }
  }
});
window.addEventListener('pointerup', (e) => {
  if (!pressId) return;
  const p = toLocal(e), id = pressId;
  pressId = null;
  const b = btnPrev.find(x => x.id === id);
  if (b && !b.disabled && p.x >= b.x - 16 && p.x <= b.x + b.w + 16 && p.y >= b.y - 16 && p.y <= b.y + b.h + 16) {
    if (!b.silent) sfx('ui', { pitch: vary(0.03) });
    if (b.fn) b.fn();
  }
});
window.addEventListener('pointercancel', () => { pressId = null; });
window.addEventListener('keydown', (e) => {
  const k = e.key;
  if (scene === 'play' && !overlay && G.g) {
    if (k === 'Escape' || k === 'p' || k === 'P') { pauseGame(); e.preventDefault(); return; }
    if (k === 'h' || k === 'H') { doHint(false); return; }
    if (k === 's' || k === 'S') { doShuffle(true); return; }
    const mv = { ArrowUp: [-1, 0], ArrowDown: [1, 0], ArrowLeft: [0, -1], ArrowRight: [0, 1] }[k];
    if (mv) {
      e.preventDefault();
      if (!G.kbd || G.cur < 0) { G.kbd = true; G.cur = G.sel >= 0 ? G.sel : idxOf(0, 0); return; }
      const r = clamp(rOf(G.cur) + mv[0], 0, G.R - 1), c = clamp(cOf(G.cur) + mv[1], 0, G.C - 1);
      G.cur = idxOf(r, c); sfx('click', { vol: 0.5, pitch: 1.4 });
      return;
    }
    if (k === 'Enter' || k === ' ') { e.preventDefault(); if (G.kbd && G.cur >= 0) tapCell(G.cur); else { G.kbd = true; G.cur = idxOf(0, 0); } return; }
    return;
  }
  // 選單：方向鍵／Tab 換按鈕，Enter 按下
  const list = btnPrev.filter(b => !b.disabled);
  if (!list.length) return;
  if (k === 'Escape') { if (overlay === 'pause') resumeGame(); else if (overlay === 'help') { overlay = helpFrom === 'pause' ? 'pause' : null; helpFrom = null; } else if (scene !== 'title' && scene !== 'play') goTitle(); return; }
  const idx = list.findIndex(b => b.id === focusId);
  if (k === 'ArrowDown' || k === 'ArrowRight' || (k === 'Tab' && !e.shiftKey)) { e.preventDefault(); kbdNav = true; focusId = list[(idx + 1 + list.length) % list.length].id; sfx('click', { vol: 0.5 }); }
  else if (k === 'ArrowUp' || k === 'ArrowLeft' || (k === 'Tab' && e.shiftKey)) { e.preventDefault(); kbdNav = true; focusId = list[(idx - 1 + list.length) % list.length].id; sfx('click', { vol: 0.5 }); }
  else if (k === 'Enter' || k === ' ') {
    e.preventDefault();
    const b = list[idx >= 0 ? idx : 0];
    if (b) { sfx('ui'); if (b.fn) b.fn(); }
  }
});

/* =====================================================================
 * 主迴圈
 * ===================================================================== */
let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, Math.max(0, (now - last) / 1000));
  last = now; time += dt; sceneT += dt;
  btnPrev = btnReg; btnReg = [];
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  updateDuck(dt);
  if (!(scene === 'play' && (overlay === 'pause' || overlay === 'help'))) { updateTimers(dt); updateParts(dt); }
  if (scene === 'title') drawTitle();
  else if (scene === 'levels') drawLevels();
  else if (scene === 'themes') drawThemes();
  else if (scene === 'play') {
    updatePlay(dt);
    regOn = !overlay;
    drawPlay();
    regOn = true;
  }
  if (overlay === 'pause') drawPause();
  else if (overlay === 'result') drawResult();
  else if (overlay === 'help') drawHelp();
  if (scene !== 'play') drawParts();
  requestAnimationFrame(frame);
}

/* ---------- 測試用 ---------- */
window.__lm = {
  state: () => ({ scene, overlay, mode: G.mode, level: G.def ? G.def.i : null, R: G.R, C: G.C, tall: G.tall, grav: G.grav, sel: G.sel,
    pairsLeft: G.pairsLeft, tiles: G.g ? tileCount(G.g) : 0, elapsed: G.elapsed, left: G.left, limit: G.limit, score: G.score, combo: G.combo,
    hints: G.hints, shuffles: G.shuffles, over: G.over, won: G.won, msg: G.msg ? G.msg.text : null, combolbl: G.comboLbl ? G.comboLbl.n : null,
    music: KG.music ? KG.music.isPlaying() : null, theme: themeId, tw: L.tw, th: L.th, genStats, result: G.result }),
  start: (mode, level) => { overlay = null; startGame(mode || 'level', level || 0); return window.__lm.state(); },
  moves: () => allMoves(G.g, G.R, G.C).map(([a, b]) => [[rOf(a), cOf(a)], [rOf(b), cOf(b)]]),
  tileXY: (r, c) => [cellX(c), cellY(r)],
  cellAt: (r, c) => G.g[idxOf(r, c)],
  /** 找一對同種但連不起來的 */
  badPair: () => { const m = groupsOf(G.g, G.R, G.C); for (const arr of m.values()) for (let i = 0; i < arr.length; i++) for (let j = i + 1; j < arr.length; j++) if (!findPath(G.g, G.R, G.C, arr[i], arr[j], 2)) return [[rOf(arr[i]), cOf(arr[i])], [rOf(arr[j]), cOf(arr[j])]]; return null; },
  /** 快轉：自動消到剩 k 對 */
  solveTo: (k) => { let guard = 0; while (G.pairsLeft > (k || 0) && guard++ < 200) { const mv = findMove(G.g, G.R, G.C, true); if (!mv) { doShuffle(false); continue; } doMatch(mv[0], mv[1], mv[2]); } return window.__lm.state(); },
  setLeft: (s) => { G.left = s; },
  autoShuffle: () => { doShuffle(false); },
  hintNow: () => { G.hints = 99; doHint(false); },
  buttons: () => btnPrev.map(b => ({ id: b.id, x: b.x + b.w / 2, y: b.y + b.h / 2, w: b.w, h: b.h, disabled: b.disabled })),
  finishAnims: () => { timers.forEach(t => { t.t = 0; }); }
};

resize();
musicMenu();
requestAnimationFrame((t) => { last = t; frame(t); });
})();
</script>
</body>
