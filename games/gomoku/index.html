<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>五子棋 Gomoku</title>
<link rel="stylesheet" href="../../assets/common.css">
<style>
  :root { --gold: #d6b46e; --gold2: #a8813f; --ink: #f2ead9; --mut: #b6aa95; --panel: rgba(20, 14, 10, .84); --line: rgba(214, 180, 110, .45);
    --pf: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", "Heiti TC", system-ui, sans-serif;
    --sf: "BiauKai", "DFKai-SB", "標楷體", "Kaiti TC", "STKaiti", "KaiTi", "Noto Serif TC", "Source Han Serif TC", "Songti TC", "PMingLiU", serif; }
  html, body { height: 100%; overflow: hidden; background: #0d0907; color: var(--ink); font-family: var(--pf); touch-action: none; }
  #cv { position: fixed; inset: 0; width: 100vw; height: 100vh; height: 100dvh; display: block; touch-action: none; }
  .hide { display: none !important; }
  button { font-family: var(--pf); -webkit-user-select: none; user-select: none; }
  .kg-fab { background: rgba(22, 16, 12, .84); border: 1.5px solid var(--line); box-shadow: 0 4px 14px rgba(0, 0, 0, .5); font-size: 20px; }
  .kg-fab:hover { border-color: var(--gold); }
  .glass { background: var(--panel); border: 1px solid var(--line); box-shadow: 0 6px 22px rgba(0, 0, 0, .45); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); }
  .ui { position: fixed; z-index: 50; }
  #bPause { right: 10px; top: 66px; width: 48px; height: 48px; padding: 0; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; color: var(--ink); }
  #bPause svg { width: 20px; height: 20px; }
  #bPause:active { transform: translateY(1px); border-color: var(--gold); }
  #info { padding: 0 12px; height: 34px; border-radius: 8px; font-size: 12.5px; letter-spacing: 1px; white-space: nowrap; color: var(--mut); display: flex; align-items: center; justify-content: center; gap: 8px; overflow: hidden; }
  #info b { color: var(--gold); font-weight: 700; }
  #info .sep { flex: none; width: 1px; height: 12px; background: rgba(214, 180, 110, .35); }

  #bar { display: flex; gap: 8px; }
  .chip { flex: 1; min-width: 0; display: flex; align-items: center; gap: 8px; padding: 0 10px; border-radius: 10px; transition: border-color .25s, box-shadow .25s; }
  .chip.on { border-color: var(--gold); box-shadow: 0 0 0 1px rgba(214, 180, 110, .35), 0 6px 22px rgba(0, 0, 0, .45); }
  .chip.won { border-color: #f0cf86; }
  .stn { flex: none; width: 26px; height: 26px; border-radius: 50%; box-shadow: 0 2px 4px rgba(0, 0, 0, .55); }
  .stn.b { background: radial-gradient(circle at 34% 30%, #74767c 0, #2a2b2f 38%, #0b0b0c 80%); }
  .stn.w { background: radial-gradient(circle at 34% 30%, #fff 0, #f1eee6 40%, #c9c3b4 90%); }
  .cname { flex: 1; min-width: 0; display: flex; flex-direction: column; line-height: 1.2; }
  .cname b { font-family: var(--sf); font-size: 15px; letter-spacing: 2px; color: var(--ink); font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .cname small { font-size: 11.5px; color: var(--mut); letter-spacing: 1px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .chip.on .cname small { color: var(--gold); }
  .dots::after { content: ''; animation: dots 1.2s steps(4) infinite; }
  @keyframes dots { 0% { content: ''; } 25% { content: '．'; } 50% { content: '．．'; } 75% { content: '．．．'; } }

  #ctrl, #rbar { display: grid; grid-template-columns: repeat(3, 1fr); gap: 7px; }
  #rbar { grid-template-columns: repeat(5, 1fr); }
  .cbtn { min-height: 46px; min-width: 0; border-radius: 10px; border: 1px solid var(--line); background: linear-gradient(180deg, rgba(46, 36, 28, .95), rgba(22, 16, 12, .95)); color: var(--ink); font-size: 15px; font-weight: 700; letter-spacing: 2px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px; box-shadow: 0 4px 12px rgba(0, 0, 0, .4), inset 0 1px 0 rgba(255, 255, 255, .06); touch-action: manipulation; transition: transform .08s, border-color .2s, opacity .2s, background .2s; white-space: nowrap; padding: 0 4px; }
  .cbtn svg { width: 17px; height: 17px; flex: none; }
  .cbtn:active { transform: translateY(1px); border-color: var(--gold); }
  .cbtn:disabled { opacity: .35; cursor: default; }
  .cbtn.warn { border-color: rgba(200, 55, 45, .55); }
  .cbtn.lit { border-color: var(--gold); background: linear-gradient(180deg, rgba(110, 82, 40, .95), rgba(52, 38, 20, .95)); }
  .cbtn.go { border-color: #f0d79c; background: linear-gradient(180deg, #e4c47f, #b68c45); color: #1d1408; }
  .cbtn.go svg path, .cbtn.go svg circle { stroke: #1d1408; }
  #rbar .cnt { grid-column: span 3; display: flex; align-items: center; justify-content: center; font-size: 14px; color: var(--mut); letter-spacing: 1px; white-space: nowrap; border-radius: 10px; border: 1px solid rgba(214, 180, 110, .25); background: rgba(20, 14, 10, .7); }
  #rbar .cnt b { color: var(--gold); font-size: 17px; margin: 0 4px; font-variant-numeric: tabular-nums; }
  #rbar .wide { grid-column: span 2; }

  #note { border-radius: 10px; padding: 10px 12px; overflow: hidden; font-size: 12.5px; color: var(--mut); line-height: 1.7; letter-spacing: .5px; display: flex; flex-direction: column; }
  #note .mh { margin-top: 8px; }
  .mlist { flex: 1; min-height: 0; overflow-y: auto; display: grid; grid-template-columns: repeat(auto-fill, minmax(62px, 1fr)); align-content: start; gap: 2px 4px; font-size: 13px; touch-action: pan-y; padding-right: 4px; }
  .mlist span { white-space: nowrap; color: var(--ink); border-radius: 4px; padding: 0 4px; cursor: default; font-variant-numeric: tabular-nums; }
  .mlist span i { font-style: normal; color: #8e826f; font-size: 11px; margin-right: 4px; }
  .mlist span.w { color: #cfc6b4; }
  .mlist span.cur { background: rgba(214, 180, 110, .2); color: var(--gold); }
  .mlist span.fut { opacity: .35; }
  .mlist.rp span { cursor: pointer; }
  .mlist .empty { grid-column: 1 / -1; color: #8e826f; }
  #note h3 { margin: 0 0 4px; font-family: var(--sf); font-size: 14px; font-weight: 700; letter-spacing: 4px; color: var(--gold); }
  #note .kv { display: flex; justify-content: space-between; gap: 8px; white-space: nowrap; }
  #note .kv span:last-child { color: var(--ink); overflow: hidden; text-overflow: ellipsis; }
  #note .tip { margin-top: 6px; font-size: 12px; color: #8e8574; }
  #note .tip b { color: var(--gold); font-weight: 700; }

  .ov { position: fixed; inset: 0; z-index: 9200; display: flex; align-items: center; justify-content: center; padding: 16px; background: rgba(6, 4, 3, .66); animation: kg-fade .25s ease; }
  .card { background: rgba(20, 15, 11, .96) !important; width: min(440px, 100%); max-height: calc(100% - 8px); overflow: auto; border-radius: 14px; padding: 20px 18px 16px; text-align: center; color: var(--ink); }
  .card h2 { margin: 0 0 6px; font-family: var(--sf); font-size: 25px; letter-spacing: 6px; padding-left: 6px; color: var(--gold); font-weight: 800; white-space: nowrap; }
  .card p { margin: 0 0 12px; font-size: 14px; line-height: 1.6; color: var(--mut); }
  .gbtn { font-family: var(--pf); font-size: 15.5px; font-weight: 800; letter-spacing: 3px; min-height: 46px; padding: 10px 16px; border-radius: 9px; cursor: pointer; border: 1px solid var(--line); background: rgba(255, 255, 255, .04); color: var(--ink); transition: transform .1s, background .2s, border-color .2s; touch-action: manipulation; white-space: nowrap; }
  .gbtn:hover { border-color: var(--gold); }
  .gbtn:active { transform: translateY(1px); }
  .gbtn.pri { background: linear-gradient(180deg, #e4c47f, #b68c45); color: #1d1408; border-color: #f0d79c; box-shadow: 0 6px 16px rgba(180, 140, 70, .3); }
  .acts { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
  .acts .gbtn { flex: 1; min-width: 110px; }

  #title { background: linear-gradient(180deg, rgba(8, 5, 3, .82) 0%, rgba(8, 5, 3, .35) 30%, rgba(8, 5, 3, .42) 50%, rgba(8, 5, 3, .92) 100%); flex-direction: column; justify-content: space-between; padding: 66px 16px calc(16px + env(safe-area-inset-bottom)); }
  .logo { text-align: center; pointer-events: none; }
  .logo .sub { font-size: 11px; letter-spacing: 6px; color: var(--gold); opacity: .9; white-space: nowrap; }
  .logo .tl { display: flex; align-items: center; justify-content: center; gap: 12px; margin-top: 6px; white-space: nowrap; }
  .logo h1 { margin: 0; font-family: var(--sf); font-size: clamp(40px, 13vw, 78px); font-weight: 900; letter-spacing: .16em; padding-left: .16em; color: #f6efe0; text-shadow: 0 2px 0 rgba(0, 0, 0, .5), 0 0 30px rgba(214, 180, 110, .25); line-height: 1.12; white-space: nowrap; }
  .seal { flex: none; width: 1.05em; height: 1.05em; font-size: clamp(28px, 8vw, 48px); border-radius: 6px; background: #a8231c; color: #f7e6d0; font-family: var(--sf); font-weight: 900; display: grid; place-items: center; box-shadow: inset 0 0 0 3px #a8231c, inset 0 0 0 5px rgba(247, 230, 208, .75); transform: rotate(-4deg); line-height: 1; }
  .seal span { font-size: .62em; }
  .logo .motto { margin-top: 10px; font-family: var(--sf); font-size: 15px; letter-spacing: 8px; padding-left: 8px; color: #d9c9a8; white-space: nowrap; }
  .tcard { width: min(440px, 100%); border-radius: 14px; padding: 14px 14px 12px; }
  .seg { display: flex; border: 1px solid var(--line); border-radius: 9px; overflow: hidden; margin-bottom: 8px; }
  .seg button { flex: 1; min-width: 0; min-height: 44px; padding: 6px 2px; background: transparent; color: var(--mut); border: 0; border-left: 1px solid rgba(214, 180, 110, .25); font-size: 14px; font-weight: 700; letter-spacing: 1px; cursor: pointer; touch-action: manipulation; white-space: nowrap; }
  .seg button:first-child { border-left: 0; }
  .seg button.on { background: rgba(214, 180, 110, .18); color: var(--ink); box-shadow: inset 0 -2px 0 var(--gold); }
  .seg.big button { font-size: 15px; font-family: var(--sf); letter-spacing: 2px; }
  .frow { display: flex; align-items: center; gap: 10px; }
  .frow label { flex: none; width: 40px; font-size: 13px; color: var(--mut); letter-spacing: 1px; text-align: left; white-space: nowrap; }
  .frow .seg { flex: 1; }
  .qbtn { flex: none; width: 44px; height: 44px; margin-bottom: 8px; border-radius: 9px; border: 1px solid var(--line); background: rgba(255, 255, 255, .04); color: var(--gold); font-family: var(--sf); font-size: 18px; font-weight: 800; cursor: pointer; touch-action: manipulation; }
  .tbtns { display: flex; gap: 8px; margin-top: 2px; }
  .tbtns .gbtn { flex: 1; font-size: 17px; }
  .tbtns .gbtn:not(.pri) { font-size: 14px; letter-spacing: 1px; flex: .8; }
  .rec { margin-top: 9px; font-size: 12px; color: var(--mut); letter-spacing: 1px; line-height: 1.7; }
  .rec b { color: var(--gold); font-weight: 700; }
  body.land #title { flex-direction: row; align-items: center; justify-content: space-between; gap: 18px; padding: 16px calc(70px + env(safe-area-inset-right)) 16px calc(70px + env(safe-area-inset-left)); background: linear-gradient(90deg, rgba(8, 5, 3, .7) 15%, rgba(8, 5, 3, .92) 100%); }
  body.land #title .logo { flex: 1; min-width: 0; }
  body.land #title .logo .sub { letter-spacing: 3px; font-size: 10.5px; }
  body.land #title .logo h1 { font-size: clamp(26px, min(5.2vw, 11vh), 78px); }
  body.land .seal { font-size: clamp(22px, min(4.5vw, 7vh), 48px); }
  body.land .logo .motto { font-size: clamp(11px, 1.8vw, 15px); letter-spacing: 4px; }
  body.land #title .tcard { width: min(430px, 54vw); flex: none; }
  body.short .logo .motto { font-size: 12px; letter-spacing: 4px; margin-top: 6px; }
  body.short .tcard { padding: 8px 10px; max-height: calc(100vh - 16px); overflow: auto; }
  body.short .seg { margin-bottom: 5px; }
  body.short .seg button { min-height: 38px; font-size: 13px; }
  body.short .qbtn { width: 38px; height: 38px; margin-bottom: 5px; }
  body.short .tbtns .gbtn { min-height: 42px; padding: 6px 10px; }
  body.short .rec { margin-top: 4px; line-height: 1.5; font-size: 11.5px; }

  .stat { display: grid; grid-template-columns: 1fr auto; gap: 5px 14px; margin: 6px auto 14px; font-size: 14px; max-width: 300px; text-align: left; }
  .stat span { white-space: nowrap; }
  .stat span:nth-child(2n) { text-align: right; font-variant-numeric: tabular-nums; color: var(--gold); font-weight: 700; }
  .pcard .frow { margin-bottom: 2px; }
  .pcard .frow label { width: 64px; }
  .pcard .acts { flex-direction: column; margin-top: 10px; }
  body.short .card { padding: 10px 14px; width: min(600px, 100%); }
  body.short .card h2 { font-size: 20px; margin: 0 0 4px; }
  body.short .pcard .stat { grid-template-columns: 1fr auto 1fr auto; max-width: none; font-size: 12.5px; margin: 4px 0 8px; gap: 3px 12px; }
  body.short .pcard .acts { flex-direction: row; margin-top: 4px; }
  body.short .pcard .acts .gbtn { min-width: 0; padding: 8px 6px; font-size: 14px; letter-spacing: 1px; }

  .res { font-size: 13px; letter-spacing: 4px; color: var(--mut); white-space: nowrap; }
  .big { font-family: var(--sf); font-size: 44px; font-weight: 900; color: var(--gold); letter-spacing: 8px; padding-left: 8px; margin: 2px 0; white-space: nowrap; }
  .big.lose { color: #c9bfae; }
  .big.win { color: #f0cf86; text-shadow: 0 0 24px rgba(214, 180, 110, .35); }
  .reason { display: inline-block; font-family: var(--sf); font-size: 17px; letter-spacing: 4px; padding: 3px 14px 3px 18px; border-radius: 4px; margin: 2px 0 10px; color: #f7e6d0; background: #8e2019; box-shadow: inset 0 0 0 2px #8e2019, inset 0 0 0 3px rgba(247, 230, 208, .5); white-space: nowrap; }
  .reason.draw { background: #3e4a42; box-shadow: inset 0 0 0 2px #3e4a42, inset 0 0 0 3px rgba(247, 230, 208, .4); }
  .omsg { font-size: 13.5px; color: var(--mut); margin: 0 0 4px; }

  #ruleOv .card { width: min(560px, 100%); text-align: left; }
  #ruleOv h2 { text-align: center; }
  .rtext { font-size: 13.5px; line-height: 1.75; color: #d9cfbd; margin: 0 0 8px; }
  .rtext b { color: var(--gold); }
  .rgrid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 6px 0 10px; }
  .rgrid figure { margin: 0; text-align: center; }
  .rgrid canvas { width: 100%; aspect-ratio: 1; border-radius: 6px; display: block; }
  .rgrid figcaption { font-family: var(--sf); font-size: 14px; color: var(--gold); letter-spacing: 2px; margin-top: 3px; white-space: nowrap; }
  .rgrid small { display: block; font-size: 11px; color: var(--mut); line-height: 1.4; }
  .kg-toast { top: 46%; padding: 9px 20px; border-radius: 8px; background: rgba(20, 15, 11, .94); border: 1px solid var(--gold); color: #f0dcae; font-family: var(--sf); font-size: 17px; font-weight: 700; letter-spacing: 2px; white-space: nowrap; box-shadow: 0 8px 26px rgba(0, 0, 0, .55); top: 14%; }
</style>
</head>
<body>
<canvas id="cv" aria-label="五子棋棋盤"></canvas>
<button id="bPause" class="ui glass hide" aria-label="選單"><svg viewBox="0 0 24 24"><rect x="6" y="5" width="4" height="14" rx="1" fill="#f2ead9"/><rect x="14" y="5" width="4" height="14" rx="1" fill="#f2ead9"/></svg></button>
<div id="info" class="ui glass hide"></div>
<div id="bar" class="ui hide">
  <div class="chip glass" id="chipB"><span class="stn b"></span><div class="cname"><b></b><small></small></div></div>
  <div class="chip glass" id="chipW"><span class="stn w"></span><div class="cname"><b></b><small></small></div></div>
</div>
<div id="note" class="ui glass hide"><h3>對局資訊</h3><div id="nKv"></div><div id="nTip" class="tip"></div><h3 class="mh" id="nMh">棋譜</h3><div class="mlist" id="nList"></div></div>
<div id="ctrl" class="ui hide">
  <button class="cbtn" id="cUndo"><svg viewBox="0 0 24 24" fill="none" stroke="#d6b46e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14 4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-3"/></svg>悔棋</button>
  <button class="cbtn" id="cHint"><svg viewBox="0 0 24 24" fill="none" stroke="#d6b46e" stroke-width="2" stroke-linecap="round"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.2 1 2V16h5v-.1c0-.8.4-1.5 1-2A6 6 0 0 0 12 3Z"/></svg>提示</button>
  <button class="cbtn" id="cPlace"><svg viewBox="0 0 24 24" fill="none" stroke="#d6b46e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8"/><path d="m8.5 12 2.5 2.5 4.5-5"/></svg>落子</button>
  <button class="cbtn" id="cNum"><svg viewBox="0 0 24 24" fill="none" stroke="#d6b46e" stroke-width="2" stroke-linecap="round"><path d="M9 4 7 20M17 4l-2 16M4 9h16M3 15h16"/></svg>手順</button>
  <button class="cbtn" id="cNew"><svg viewBox="0 0 24 24" fill="none" stroke="#d6b46e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 4v7h-7"/></svg>新局</button>
  <button class="cbtn warn" id="cResign"><svg viewBox="0 0 24 24" fill="none" stroke="#e2756c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 21V4M5 4h12l-2 4 2 4H5"/></svg><span>認輸</span></button>
</div>
<div id="rbar" class="ui hide">
  <button class="cbtn" id="rFirst" aria-label="第一手"><svg viewBox="0 0 24 24" fill="none" stroke="#d6b46e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 5v14M18 6l-8 6 8 6z"/></svg></button>
  <button class="cbtn" id="rPrev" aria-label="上一手"><svg viewBox="0 0 24 24" fill="none" stroke="#d6b46e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 5-7 7 7 7"/></svg></button>
  <button class="cbtn" id="rPlay" aria-label="自動播放"><svg viewBox="0 0 24 24" fill="none" stroke="#d6b46e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 5v14l11-7z"/></svg></button>
  <button class="cbtn" id="rNext" aria-label="下一手"><svg viewBox="0 0 24 24" fill="none" stroke="#d6b46e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 5 7 7-7 7"/></svg></button>
  <button class="cbtn" id="rLast" aria-label="最後一手"><svg viewBox="0 0 24 24" fill="none" stroke="#d6b46e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 5v14M6 6l8 6-8 6z"/></svg></button>
  <div class="cnt" id="rCnt">第<b>0</b>/ 0 手</div>
  <button class="cbtn wide" id="rExit">結束覆盤</button>
</div>

<div id="title" class="ov hide">
  <div class="logo">
    <div class="sub">GOMOKU · FIVE IN A ROW</div>
    <div class="tl"><h1>五子棋</h1><div class="seal"><span>弈</span></div></div>
    <div class="motto">黑白交錯 · 五子連珠</div>
  </div>
  <div class="tcard glass">
    <div class="seg big" id="segMode"><button data-v="ai">對弈電腦</button><button data-v="pvp">雙人對弈</button></div>
    <div class="frow" id="rowSide"><label>執子</label><div class="seg" id="segSide"><button data-v="1">執黑先行</button><button data-v="2">執白後走</button></div></div>
    <div class="frow" id="rowLv"><label>棋力</label><div class="seg" id="segLv"><button data-v="0">入門</button><button data-v="1">進階</button><button data-v="2">高手</button><button data-v="3">大師</button></div></div>
    <div class="frow"><label>禁手</label><div class="seg" id="segRenju"><button data-v="0">自由規則</button><button data-v="1">黑棋禁手</button></div><button class="qbtn" id="tRule" aria-label="規則說明">?</button></div>
    <div class="tbtns"><button class="gbtn pri" id="tStart">開始對局</button><button class="gbtn hide" id="tResume">繼續上局</button></div>
    <div class="rec" id="tRec"></div>
  </div>
</div>
<div id="pauseOv" class="ov hide">
  <div class="card glass pcard">
    <h2>暫停</h2>
    <div class="frow"><label>落子方式</label><div class="seg" id="pPlace"><button data-v="confirm">點兩下確認</button><button data-v="direct">單點直接落子</button></div></div>
    <div class="frow"><label>手順數字</label><div class="seg" id="pNum"><button data-v="on">顯示</button><button data-v="off">隱藏</button></div></div>
    <div class="frow"><label>背景音樂</label><div class="seg" id="pMusic"><button data-v="on">開</button><button data-v="off">關</button></div></div>
    <div class="stat" id="pStats"></div>
    <div class="acts">
      <button class="gbtn pri" id="pResume">繼續對局</button>
      <button class="gbtn" id="pRule">規則說明</button>
      <button class="gbtn" id="pQuit">回到標題</button>
    </div>
  </div>
</div>
<div id="ruleOv" class="ov hide">
  <div class="card glass">

<script>
/*ENGINE-START*/
function GMEngine() {
  'use strict';
  // 15x15 棋盤，四周各留 4 格牆（值 3），格子 p = (y+4)*23 + (x+4)
  const N = 15, P = 23, OF = 4, SZ = P * P;
  const D = [1, P, P + 1, P - 1];
  const B = new Uint8Array(SZ).fill(3);
  const ON = new Int16Array(225), TO = new Int16Array(SZ).fill(-1);

  // 五格視窗：每個點在每個方向最多 5 個視窗
  const PW = new Int16Array(SZ * 20).fill(-1);
  const WS = [], WD = [], wmap = new Map();
  for (let i = 0; i < 225; i++) {
    const p = ON[i];
    for (let d = 0; d < 4; d++) for (let j = 0; j < 5; j++) {
      const s = p - j * D[d]; let ok = true;
      for (let k = 0; k < 5; k++) if (B[s + k * D[d]] !== 0) { ok = false; break; }

      PW[p * 20 + d * 5 + j] = w;
    }
  }
  const NW = WS.length;
  const C1 = new Uint8Array(NW), C2 = new Uint8Array(NW);
  const T = [0, 1, 12, 120, 420, 30000];
  let ev1 = 0, ev2 = 0, n41 = 0, n42 = 0;
  const nb = new Uint8Array(SZ);
  const NBO = []; for (let dy = -2; dy <= 2; dy++) for (let dx = -2; dx <= 2; dx++) if (dx || dy) NBO.push(dy * P + dx);

  for (let i = 0; i < SZ * 3; i++) { ZA[i] = rnd32(); ZB[i] = rnd32(); }

  const MV = new Int16Array(240); let mc = 0;
  let renju = false;
  const side = () => (mc & 1) ? 2 : 1;

  function upd(p, c, add) {
    const base = p * 20;
    for (let k = 0; k < 20; k++) {
      const w = PW[base + k]; if (w < 0) continue;
      const a = C1[w], b = C2[w];

      if (a === 0) { ev2 -= T[b]; if (b === 4) n42--; }

    B[p] = c; upd(p, c, 1); inval(p);

  }
  function unmake() {

  const PV = new Float64Array(SZ * 2), PF = new Uint8Array(SZ * 2), PVALID = new Uint8Array(SZ * 2);
  let NOCACHE = false;
  function inval(p) {
    for (let d = 0; d < 4; d++) { const dd = D[d]; for (let k = -4; k <= 4; k++) { const q = (p + k * dd) * 2; PVALID[q] = 0; PVALID[q + 1] = 0; } }
  }
  function cinfo(p, c) {
    const k = p * 2 + c - 1;
    if (PVALID[k]) { const f = PF[k]; F_FIVE = !!(f & 1); F_WIN = !!(f & 2); F_F43 = !!(f & 4); F_FOUR = !!(f & 8); F_O3 = !!(f & 16); return PV[k]; }
    NOCACHE = false;
    const v = pinfo(p, c);

    return v;
  }
  function run(p, dd, c) {
    let n = 1, q = p + dd;
    while (B[q] === c) { n++; q += dd; }
    q = p - dd;
    while (B[q] === c) { n++; q -= dd; }
    return n;
  }
  function fiveAt(p, c) {
    const exact = c === 1 && renju;
    for (let d = 0; d < 4; d++) { const L = run(p, D[d], c); if (L === 5 || (L > 5 && !exact)) return true; }
    return false;
  }

  // ---------- 禁手判定（只對黑棋） ----------
  let STRAIGHT = false;
  function fourCnt(p, dd) { // 前提：B[p] 已是黑；回傳此方向「四」的數目（活四算一個）
    let n = 0, k1 = 0, k2 = 0;
    for (let k = -4; k <= 4; k++) {
      if (!k) continue;
      const q = p + k * dd;
      if (B[q] !== 0) continue;
      B[q] = 1; const L = run(p, dd, 1); B[q] = 0;
      if (L === 5) { if (n === 0) k1 = k; else k2 = k; n++; }
    }
    STRAIGHT = n === 2 && k2 - k1 === 5;
    return STRAIGHT ? 1 : n;
  }
  function isThree(p, dd, depth) {
    for (let k = -4; k <= 4; k++) {
      if (!k) continue;
      const q = p + k * dd;
      if (B[q] !== 0) continue;
      B[q] = 1; fourCnt(p, dd); const st = STRAIGHT; B[q] = 0;
      if (st && (depth >= 2 || !forbidden(q, depth + 1))) return true;

  }
  // 0 = 非禁手，1 = 三三，2 = 四四，3 = 長連
  function forbidden(p, depth) {
    if (!renju || B[p] !== 0) return 0;
    B[p] = 1;
    let five = false, over = false, r = 0;
    for (let d = 0; d < 4; d++) { const L = run(p, D[d], 1); if (L === 5) five = true; else if (L > 5) over = true; }

    else if (over) r = 3;

      let fours = 0; const h4 = [0, 0, 0, 0];
      for (let d = 0; d < 4; d++) { h4[d] = fourCnt(p, D[d]); fours += h4[d]; }
      if (fours >= 2) r = 2;
      else {
        let th = 0;
        for (let d = 0; d < 4 && th < 2; d++) if (!h4[d] && isThree(p, D[d], depth)) th++;
        if (th >= 2) r = 1;
      }
    }
    B[p] = 0;
    return r;
  }
  function maybeForbid(p) {
    let dirs = 0;
    for (let d = 0; d < 4; d++) {
      const dd = D[d]; let n = 0;
      for (let k = 1; k <= 4; k++) { if (B[p + k * dd] === 1) n++; if (B[p - k * dd] === 1) n++; }
      if (n >= 4) return true;
      if (n >= 2) dirs++;
    }
    return dirs >= 2;
  }

  // ---------- 點評分（棋形辨識） ----------
  let F_FIVE = false, F_WIN = false, F_F43 = false, F_FOUR = false, F_O3 = false;
  function pinfo(p, c) {
    const Cm = c === 1 ? C1 : C2, Co = c === 1 ? C2 : C1;
    let fives = 0, o4 = 0, f4 = 0, o3 = 0, t3 = 0, o2 = 0, t2 = 0, o1 = 0;
    const base = p * 20;
    for (let d = 0; d < 4; d++) {
      let mx = 0, cn = 0;
      for (let j = 0; j < 5; j++) {
        const w = PW[base + d * 5 + j];
        if (w < 0 || Co[w]) continue;
        const n = Cm[w] + 1;
        if (n > mx) { mx = n; cn = 1; } else if (n === mx) cn++;
      }
      if (mx === 5) fives++;
      else if (mx === 4) { if (cn >= 2) o4++; else f4++; }
      else if (mx === 3) { if (cn >= 2) o3++; else t3++; }
      else if (mx === 2) { if (cn >= 3) o2++; else t2++; }
      else if (mx === 1) o1++;
    }
    F_FIVE = F_WIN = F_F43 = F_FOUR = F_O3 = false;
    if (c === 1 && renju && (fives || o4 + f4 >= 2 || o3 >= 2)) {
      if (fives && fiveAt(p, 1)) { F_FIVE = true; return 1e7; }
      NOCACHE = true;
      if (forbidden(p, 0)) return -1;
      fives = 0;
    }
    if (fives) { F_FIVE = true; return 1e7; }
    const f = o4 + f4;
    F_FOUR = f > 0; F_O3 = o3 > 0;
    if (o4 || f >= 2) { F_WIN = true; return 1e6; }
    if (f && o3) { F_F43 = true; return 3e5; }
    if (o3 >= 2) return 1e5 + t3 * 300;
    return f * 2600 + o3 * 3000 + t3 * 300 + o2 * 260 + t2 * 40 + o1 * 6;
  }

  // ---------- 走法產生 ----------
  const GM = new Int16Array(72 * 225), GN = new Int16Array(72), GF = new Uint8Array(72 * 225);
  const cP = new Int16Array(225), cA = new Float64Array(225), cB = new Float64Array(225), cF = new Uint8Array(225);
  const KEY = new Float64Array(64);
  let candN = 0, genWin = -1, jitter = 0;
  // 回傳 1 = 我可連五，2 = 我有活四／雙四（三手內必勝），-1 = 必敗，0 = 走法在 GM
  function gen(ply, beam) {
    const me = side(), op = 3 - me;
    let n = 0, opF = 0, opF1 = -1, myWin = -1, opThr = false;
    for (let i = 0; i < 225; i++) {
      const p = ON[i];
      if (B[p] || !nb[p]) continue;
      const a = cinfo(p, me);
      if (F_FIVE) { genWin = p; candN = 0; return 1; }
      if (F_WIN && myWin < 0) myWin = p;
      const mf = F_FOUR;
      const b = cinfo(p, op);
      if (F_FIVE) { if (!opF) opF1 = p; opF++; }
      if (F_WIN || F_F43) opThr = true;
      cP[n] = p; cA[n] = a; cB[n] = b; cF[n] = (mf ? 1 : 0) | (F_FOUR ? 2 : 0);
      n++;
    }
    candN = n;
    const base = ply * 225;
    if (opF) {
      if (opF > 1) return -1;
      for (let i = 0; i < n; i++) if (cP[i] === opF1) { if (cA[i] < 0) return -1; break; }
      GM[base] = opF1; GF[base] = 0; GN[ply] = 1; return 0;
    }
    if (myWin >= 0) { genWin = myWin; return 2; }
    let m = 0;
    for (let pass = 0; pass < 2 && m === 0; pass++) {
      for (let i = 0; i < n; i++) {
        if (cA[i] < 0) continue;
        if (pass === 0 && opThr && !(cF[i] & 3)) continue;
        let key = opThr ? cA[i] + cB[i] : cA[i] + cB[i] * 0.85;
        if (jitter) key *= 1 + Math.random() * jitter;
        if (m === beam && key <= KEY[m - 1]) continue;
        let j = m < beam ? m++ : m - 1;
        while (j > 0 && KEY[j - 1] < key) { KEY[j] = KEY[j - 1]; GM[base + j] = GM[base + j - 1]; GF[base + j] = GF[base + j - 1]; j--; }
        KEY[j] = key; GM[base + j] = cP[i]; GF[base + j] = cF[i];
      }
    }
    GN[ply] = m;
    return 0;
  }

  // ---------- 搜尋 ----------
  const WIN = 10000000, INF = 1e9;
  const TBITS = 18, TMASK = (1 << TBITS) - 1;
  const TK = new Int32Array(1 << TBITS), TV = new Int32Array(1 << TBITS), TDp = new Int8Array(1 << TBITS), TF = new Int8Array(1 << TBITS), TM = new Int16Array(1 << TBITS);
  let nodes = 0, deadline = 0, aborted = false, vDeadline = 0, vAbort = false;
  const vFail = new Map();
  let BEAM = 10, LEAFQ = false;
  function hasFive(c) {
    const Cm = c === 1 ? C1 : C2, Co = c === 1 ? C2 : C1;
    if (!(c === 1 && renju)) return true;
    for (let w = 0; w < NW; w++) {
      if (Cm[w] !== 4 || Co[w]) continue;
      for (let t = 0; t < 5; t++) { const e = WS[w] + t * WD[w]; if (!B[e]) { if (fiveAt(e, 1)) return true; break; } }
    }
    return false;
  }
  function evaluate(me) { return me === 1 ? ev1 - ev2 : ev2 - ev1; }
  function ab(depth, alpha, beta, ply, ext) {
    if ((++nodes & 1023) === 0 && Date.now() > deadline) aborted = true;
    if (aborted) return 0;
    const me = side();
    if (mc >= 225) return 0;
    const ti = hA & TMASK;
    let ttm = -1;
    if (TK[ti] === hB) {
      ttm = TM[ti];
      if (TDp[ti] >= depth) {
        const v = TV[ti], f = TF[ti];
        if (f === 0 || (f === 1 && v >= beta) || (f === 2 && v <= alpha)) return v;
      }
    }
    if (depth <= 0) {
      const my4 = me === 1 ? n41 : n42, op4 = me === 1 ? n42 : n41;

    }
    const bw = ply <= 1 ? BEAM : ply <= 3 ? BEAM - 2 : Math.max(5, BEAM - 4);
    const st = gen(ply, bw);

    if (st === 2) return WIN - ply - 2;
    if (st === -1) return -(WIN - ply - 1);
    const n = GN[ply];
    if (n === 0) return 0;
    if (depth <= 0 && (n > 1 || ply > 56)) return evaluate(me);
    const base = ply * 225;
    if (ttm >= 0) for (let i = 1; i < n; i++) if (GM[base + i] === ttm) { const f = GF[base + i]; GM[base + i] = GM[base]; GF[base + i] = GF[base]; GM[base] = ttm; GF[base] = f; break; }
    let best = -INF, bm = -1;

  // ---------- VCF（連續衝四） ----------

    if (vAbort) return -1;

      if (cnt > 1) return -1;
    }
    const base = depth * 64;
    let k = 0;
    for (let i = 0; i < 225; i++) {

        let e = -1;

  function fivePts(me, p) { // 剛在 p 落子後，me 的連五點數目（0、1、2+），單一點存在 FIVEQ
    const Cm = me === 1 ? C1 : C2, Co = me === 1 ? C2 : C1;
    let q1 = -1, cnt = 0;
    for (let t = 0; t < 20; t++) {
      const w = PW[p * 20 + t];
      if (w < 0 || Cm[w] !== 4 || Co[w]) continue;
      let e = -1;
      for (let u = 0; u < 5; u++) { const z = WS[w] + u * WD[w]; if (!B[z]) { e = z; break; } }
      if (e < 0 || e === q1) continue;
      if (fiveAt(e, me)) { if (q1 < 0) { q1 = e; cnt = 1; } else cnt = 2; }
    }
    FIVEQ = q1;
    return cnt;
  }
  let FIVEQ = -1;
  function vct(depth) {
    if ((++nodes & 255) === 0 && Date.now() > vDeadline) vAbort = true;
    if (vAbort) return -1;
    const me = side(), op = 3 - me;
    const key = hA * 4096 + (hB & 4095);
    const fd = tFail.get(key);
    if (fd !== undefined && fd >= depth) return -1;
    let forced = -1;
    if (me === 1 ? n42 : n41) {
      let cnt = 0;
      for (let i = 0; i < 225; i++) { const p = ON[i]; if (B[p] || !nb[p]) continue; cinfo(p, op); if (F_FIVE) { forced = p; cnt++; } }
      if (cnt > 1) return -1;
    }
    const base = depth * 32;
    let k = 0;
    for (let i = 0; i < 225; i++) {
      const p = ON[i];
      if (B[p] || !nb[p] || (forced >= 0 && p !== forced)) continue;
      const a = cinfo(p, me);
      if (F_FIVE) return p;
      if (a < 0) continue;
      if (F_WIN && forced < 0) return p;
      if (!(F_FOUR || F_O3)) continue;
      const sc = a + (F_FOUR ? 5e5 : 0);

  let lastT = now();

    draw() { [330, 392, 330, 294].forEach((f, i) => KG.note(f, 0.6, 'triangle', 0.1, i * 0.2)); }

    if (!KG.isMuted()) {

  // ---------------- 對局流程 ----------------

  function finish(res, silent) {

    let outcome = res.winner === 0 ? 'd' : null;

  function maybeAI() {

  function undo() {

  // ---------------- 規則示意圖 ----------------
  function drawMini(id, blacks, whites, mark) {
    const cc = $(id); if (!cc) return;
    const g = cc.getContext('2d'), w = cc.width, n = 7, m = w / (n + 0.2), o = m * 0.6;
    paintWood(g, 0, 0, w, w, m, 11 + id.length);
    g.strokeStyle = 'rgba(48,26,8,.8)'; g.lineWidth = 1.4;
    g.beginPath();
    for (let i = 0; i < n; i++) { g.moveTo(o, o + i * m); g.lineTo(o + (n - 1) * m, o + i * m); g.moveTo(o + i * m, o); g.lineTo(o + i * m, o + (n - 1) * m); }
    g.stroke();
    const st = (x, y, b) => {
      const X = o + x * m, Y = o + y * m, R = m * 0.45;
      const gr = g.createRadialGradient(X - R * 0.35, Y - R * 0.4, R * 0.05, X, Y, R);
      if (b) { gr.addColorStop(0, '#6d7076'); gr.addColorStop(0.5, '#1e1f22'); gr.addColorStop(1, '#030303'); }
      else { gr.addColorStop(0, '#fff'); gr.addColorStop(0.6, '#ebe6da'); gr.addColorStop(1, '#aaa394'); }
      g.fillStyle = 'rgba(30,15,3,.35)'; g.beginPath(); g.arc(X + 2, Y + 3, R, 0, TAU); g.fill();
      g.fillStyle = gr; g.beginPath(); g.arc(X, Y, R, 0, TAU); g.fill();
    };
    blacks.forEach(([x, y]) => st(x, y, true));
    whites.forEach(([x, y]) => st(x, y, false));
    const [mx, my] = mark, X = o + mx * m, Y = o + my * m, a = m * 0.3;
    g.strokeStyle = '#d8301f'; g.lineWidth = 5; g.lineCap = 'round';
    g.beginPath(); g.moveTo(X - a, Y - a); g.lineTo(X + a, Y + a); g.moveTo(X + a, Y - a); g.lineTo(X - a, Y + a); g.stroke();
  }

  // ---------------- 輸入 ----------------
  function hitPt(px, py) {
    if (!L) return -1;
    // 觸控座標換算成畫布座標（畫布被拉伸或位移時也對得上）
    const r = cv.getBoundingClientRect();
    if (r.width > 0 && r.height > 0) {
      if (Math.abs(r.width - W) > 1 || Math.abs(r.height - H) > 1) { layout(); updateUI(); }
      px = (px - r.left) * W / r.width; py = (py - r.top) * H / r.height;
    }
    const pad = L.c * 0.35;
    if (px < L.bx - pad || px > L.bx + L.bs + pad || py < L.by - pad || py > L.by + L.bs + pad) return -1;
    const x = clamp(Math.round((px - L.ox) / L.c), 0, 14), y = clamp(Math.round((py - L.oy) / L.c), 0, 14);
    return x + y * 15;
  }
  let down = null;
  cv.addEventListener('pointerdown', e => {
    if (S.screen !== 'play' || S.replay >= 0) return;
    const i = hitPt(e.clientX, e.clientY);
    if (i < 0 || !humanTurn()) return;
    const direct = prefs.place === 'direct';
    down = { id: e.pointerId, start: i, wasGhost: S.ghost === i, moved: false };
    try { cv.setPointerCapture(e.pointerId); } catch (er) { /* 忽略 */ }
    if (!direct && S.ghost !== i) { S.ghost = i; if (!E.at(i)) snd.tick(); }
    if (direct) S.ghost = i;
    S.hover = -1;
    updateUI();
  });
  cv.addEventListener('pointermove', e => {
    if (S.screen !== 'play' || S.replay >= 0) return;
    const i = hitPt(e.clientX, e.clientY);
    if (down && e.pointerId === down.id) {
      if (i >= 0 && i !== S.ghost && humanTurn()) { S.ghost = i; down.moved = true; snd.tick(); updateUI(); }
      return;
    }
    if (e.pointerType === 'mouse') {
      const h = humanTurn() && i >= 0 && !E.at(i) ? i : -1;
      if (h !== S.hover) { S.hover = h; dirty = true; }
    }
  });
  const endPtr = e => {
    if (!down || (e && e.pointerId !== down.id)) return;
    const d = down; down = null;
    if (!e || e.type !== 'pointerup' || !humanTurn()) { if (prefs.place === 'direct') S.ghost = -1; dirty = true; return; }
    const i = S.ghost;
    if (prefs.place === 'direct') {
      S.ghost = -1;
      if (i >= 0 && !E.at(i)) tryPlace(i);
      else if (i >= 0) snd.bad();
    } else if (d.wasGhost && !d.moved && i >= 0) {
      if (E.at(i)) { snd.bad(); S.ghost = -1; } else tryPlace(i);
    } else if (i >= 0 && E.at(i)) { S.ghost = -1; }
    if (e.pointerType === 'mouse') S.hover = -1;
    updateUI(); dirty = true;
  };
  cv.addEventListener('pointerup', endPtr);
  cv.addEventListener('pointercancel', endPtr);
  cv.addEventListener('pointerleave', () => { if (S.hover >= 0) { S.hover = -1; dirty = true; } });

  addEventListener('keydown', e => {
    if (S.screen !== 'play') return;
    const k = e.key;
    if (k === 'Escape' || k === 'p' || k === 'P') {
      if (!$('cfOv').classList.contains('hide')) { hideOv('cfOv'); return; }
      if (!$('ruleOv').classList.contains('hide')) { hideOv('ruleOv'); return; }
      if (!$('overOv').classList.contains('hide')) return;
      togglePause(); return;
    }
    if (S.paused || !$('overOv').classList.contains('hide') || !$('cfOv').classList.contains('hide')) return;
    if (S.replay >= 0) {
      if (k === 'ArrowLeft') replayStep(S.replay - 1);
      else if (k === 'ArrowRight') replayStep(S.replay + 1);
      else if (k === 'Home') replayStep(0);
      else if (k === 'End') replayStep(S.moves.length);
      return;
    }
    if (k === 'u' || k === 'U' || k === 'Backspace') { e.preventDefault(); undo(); return; }
    if (k === 'h' || k === 'H') { hint(); return; }
    if (k === 'n' || k === 'N') { toggleNums(); return; }
    const dirs = { ArrowLeft: [-1, 0], ArrowRight: [1, 0], ArrowUp: [0, -1], ArrowDown: [0, 1] };
    if (dirs[k]) {
      e.preventDefault();
      if (!humanTurn()) return;
      let g = S.ghost;
      if (g < 0) g = S.moves.length ? S.moves[S.moves.length - 1] : 112;
      else g = clamp(g % 15 + dirs[k][0], 0, 14) + clamp(Math.floor(g / 15) + dirs[k][1], 0, 14) * 15;
      S.ghost = g; snd.tick(); updateUI(); return;
    }
    if ((k === 'Enter' || k === ' ') && S.ghost >= 0) { e.preventDefault(); tryPlace(S.ghost); updateUI(); }
  });

  $('cNew').addEventListener('click', () => { KG.sound('click'); newGame(); });
  $('cResign').addEventListener('click', () => { KG.sound('click'); if (S.over) showOver(); else resign(); });
  $('nList').addEventListener('click', e => { const sp = e.target.closest('span[data-k]'); if (!sp || S.replay < 0) return; replayAuto(false); replayStep(+sp.dataset.k); });
  $('rFirst').addEventListener('click', () => { replayAuto(false); replayStep(0); });
  $('rPrev').addEventListener('click', () => { replayAuto(false); replayStep(S.replay - 1); });
  $('rNext').addEventListener('click', () => { replayAuto(false); replayStep(S.replay + 1); });
  $('rLast').addEventListener('click', () => { replayAuto(false); replayStep(S.moves.length); });
  $('rPlay').addEventListener('click', () => { KG.sound('click'); replayAuto(!S.rTimer); });
  $('rExit').addEventListener('click', () => { KG.sound('click'); exitReplay(); });
  $('cfNo').addEventListener('click', () => { KG.sound('click'); hideOv('cfOv'); cfYes = null; });
  $('cfYes').addEventListener('click', () => { KG.sound('click'); hideOv('cfOv'); const f = cfYes; cfYes = null; if (f) f(); });
  $('bPause').addEventListener('click', () => { KG.sound('click'); togglePause(); });
  $('pResume').addEventListener('click', () => { KG.sound('click'); togglePause(false); });
  $('pRule').addEventListener('click', () => { KG.sound('click'); showRules(); });
  $('pQuit').addEventListener('click', () => {
    KG.sound('click'); hideOv('pauseOv'); S.paused = false; cancelSearch(); S.searchId++; clearTimeout(S.aiTimer); replayAuto(false);
    S.thinking = false; S.hinting = false; S.replay = -1;
    save(); S.screen = 'title'; showScreen();
  });
  $('tRule').addEventListener('click', () => { KG.sound('click'); showRules(); });
  $('ruleClose').addEventListener('click', () => { KG.sound('click'); hideOv('ruleOv'); });
  bindSeg('pMusic', v => { prefs.music = v === 'on'; savePrefs(); });
  bindSeg('pNum', v => { prefs.nums = v === 'on'; savePrefs(); updateUI(); });
  bindSeg('pPlace', v => { prefs.place = v; savePrefs(); S.ghost = -1; updateUI(); });
  bindSeg('segMode', v => { prefs.mode = v; savePrefs(); showTitle(); });
  bindSeg('segSide', v => { prefs.side = +v; savePrefs(); });
  bindSeg('segLv', v => { prefs.lv = +v; savePrefs(); $('tRec').innerHTML = recLine(); });
  bindSeg('segRenju', v => { prefs.renju = v === '1'; savePrefs(); if (prefs.renju && !store.get('gm:ruleSeen', false)) { store.set('gm:ruleSeen', true); showRules(); } });
  $('tStart').addEventListener('click', () => { KG.sound('click'); startGame({ mode: prefs.mode, side: prefs.side, lv: prefs.lv, renju: prefs.renju }); });
  $('tResume').addEventListener('click', () => { KG.sound('click'); resumeSaved(); });
  function resumeSaved() {
    const sv = store.get('gm:save', null);
    if (!sv) return false;
    startGame({ mode: sv.mode, side: sv.human, lv: sv.lv, renju: sv.renju, moves: sv.moves, hints: sv.hints, undos: sv.undos });
    return true;
  }

  addEventListener('resize', () => { layout(); updateUI(); });
  if (window.visualViewport) visualViewport.addEventListener('resize', () => { layout(); updateUI(); });
  addEventListener('orientationchange', () => setTimeout(() => { layout(); updateUI(); }, 250));
  document.addEventListener('visibilitychange', () => {
    if (document.hidden && S.screen === 'play' && !S.over && !S.paused && S.replay < 0 && $('cfOv').classList.contains('hide')) togglePause(true);
  });

  // ---------------- 測試介面 ----------------
  const toIdx = (x, y) => (typeof x === 'string' ? COLS.indexOf(x[0].toUpperCase()) + (15 - parseInt(x.slice(1), 10)) * 15 : y === undefined ? x : x + y * 15);
  window.__gm = {
    get state() {
      return {
        screen: S.screen, mode: S.mode, human: S.human, level: S.lv, renju: S.renju, side: side(), moves: S.moves.slice(),
        coords: S.moves.map(coord), over: S.over && { winner: S.over.winner, reason: S.over.reason, line: S.over.line || null },
        thinking: S.thinking, paused: S.paused, ghost: S.ghost, hint: S.hint && S.hint.i, replay: S.replay, hints: S.hints, undos: S.undos,
        forbidden: Array.from(S.forb.entries()), nums: prefs.nums, place: prefs.place, lastSearch: S.lastSearch,
        layout: L && { c: L.c, ox: L.ox, oy: L.oy, bx: L.bx, by: L.by, bs: L.bs, portrait: L.portrait }
      };
    },
    start: opts => startGame(opts || {}),
    play(x, y) { return doMove(toIdx(x, y)); },
    tap(x, y) { return tryPlace(toIdx(x, y)); },
    aiMove(level, timeMs) {
      return new Promise(res => {
        const lv = level == null ? S.lv : level;
        askEngine(timeMs ? { level: lv, timeMs } : { level: lv }, r => { S.lastSearch = r; if (r.move >= 0) doMove(r.move, { noAI: true }); res(r); });
      });
    },
    think: (opts, moves) => new Promise(res => askEngine(opts || { level: 2 }, res, moves)),
    forbidden(x, y) { const i = toIdx(x, y); return E.forbidden(i); },
    forbiddenName(x, y) { return FORB_NAME[E.forbidden(toIdx(x, y))] || ''; },
    screenXY(x, y) { const i = toIdx(x, y); return { x: PX(i), y: PY(i) }; },
    coord, hint, undo, resign, newGame, enterReplay, replayStep, exitReplay,
    pause: v => togglePause(v), showTitle: () => { S.screen = 'title'; showScreen(); }, resume: resumeSaved,
    setPlace: v => { prefs.place = v; savePrefs(); updateUI(); }, setNums: v => { prefs.nums = !!v; savePrefs(); updateUI(); },
    stats: () => stats, engine: E, GMEngine
  };

  // ---------------- 啟動 ----------------
  layout();
  showTitle();
  requestAnimationFrame(loop);
  setTimeout(musicTick, 1500);
})();
</script>
</body>
</html>
