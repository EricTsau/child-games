<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>彩色連線</title>
<link rel="stylesheet" href="../../assets/common.css">
<style>
  :root { --bg1: #1b1446; --bg2: #0f2347; --ink: #f4f1ff; --mute: #b9b3e6; --card: rgba(255,255,255,0.08); --line: rgba(255,255,255,0.14); }
  html, body { height: 100%; overflow: hidden; background: var(--bg1); color: var(--ink); overscroll-behavior: none; }
  body { touch-action: none; }
  #cv { position: fixed; inset: 0; width: 100vw; height: 100vh; height: 100dvh; display: block; touch-action: none; outline: none; }
  button { font-family: var(--kg-font); }
  .scr { position: fixed; inset: 0; display: none; flex-direction: column; z-index: 200; pointer-events: none; }
  .scr.on { display: flex; }
  .scr > * { pointer-events: auto; }
  .hidden { display: none !important; }

  /* 按鈕 */
  .cbtn { --c1: #ff7aa8; --c2: #e2477d; --c3: #a92a5a; position: relative; border: 0; border-radius: 18px; color: #fff; font-weight: 800; font-size: 20px; padding: 12px 18px;
    background: linear-gradient(180deg, var(--c1), var(--c2)); box-shadow: 0 5px 0 var(--c3), 0 10px 20px rgba(0,0,0,0.28); cursor: pointer; text-shadow: 0 2px 0 rgba(0,0,0,0.18);
    display: inline-flex; align-items: center; justify-content: center; gap: 8px; transition: transform .08s, box-shadow .08s; min-height: 50px; -webkit-user-select: none; user-select: none; }
  .cbtn:active, .cbtn.press { transform: translateY(4px); box-shadow: 0 1px 0 var(--c3), 0 4px 10px rgba(0,0,0,0.28); }
  .cbtn:focus-visible { outline: 3px solid #fff; outline-offset: 3px; }
  .cbtn svg { width: 24px; height: 24px; flex: none; }
  .cbtn.blue { --c1: #6fb7ff; --c2: #3a7ff0; --c3: #2353a8; }
  .cbtn.green { --c1: #6fe39a; --c2: #2bb766; --c3: #1a7f45; }
  .cbtn.yellow { --c1: #ffe07a; --c2: #f6b622; --c3: #b67e06; color: #5a3b00; text-shadow: none; }
  .cbtn.purple { --c1: #b892ff; --c2: #7c4ff0; --c3: #5230ab; }
  .cbtn.ghost { --c1: rgba(255,255,255,0.18); --c2: rgba(255,255,255,0.1); --c3: rgba(0,0,0,0.35); }
  .cbtn.small { font-size: 16px; padding: 8px 12px; min-height: 42px; border-radius: 14px; }
  .cbtn[disabled] { filter: grayscale(0.7) brightness(0.8); opacity: 0.6; }
  .tog { display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
  .tog .pill { font-size: 13px; padding: 2px 8px; border-radius: 99px; background: rgba(0,0,0,0.25); }
  .tog.off .pill { background: rgba(0,0,0,0.45); color: #ffb3b3; }

  /* 標題 */
  #scrTitle { align-items: center; padding: max(64px, env(safe-area-inset-top)) 16px max(16px, env(safe-area-inset-bottom)); }
  .logo { text-align: center; margin-top: 4px; pointer-events: none; }
  .logo h1 { margin: 0; font-size: clamp(40px, 11vw, 66px); line-height: 1.05; letter-spacing: 4px; font-weight: 900;
    background: linear-gradient(90deg, #ff6b8b, #ffc94d 30%, #5be08f 55%, #4fb5ff 78%, #b07cff); -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 4px 0 rgba(0,0,0,0.35)); }
  .logo p { margin: 4px 0 0; color: var(--mute); font-size: 15px; font-weight: 700; }
  #titleArt { flex: 1; min-height: 110px; width: 100%; pointer-events: none; }
  .tmenu { display: flex; flex-direction: column; gap: 12px; width: min(340px, 100%); }
  .tmenu .row { display: flex; gap: 10px; }
  .tmenu .row > * { flex: 1; min-width: 0; padding-left: 8px; padding-right: 8px; }
  .tstat { text-align: center; color: var(--mute); font-weight: 700; font-size: 15px; margin-top: 10px; pointer-events: none; }
  .tstat b { color: #ffd84d; }
  @media (min-aspect-ratio: 5/4) {
    #scrTitle { display: none; }
    #scrTitle.on { display: grid; grid-template-columns: 1fr minmax(300px, 380px); grid-template-rows: auto 1fr; column-gap: 24px; padding: 64px max(70px, 5vw) 18px; align-items: stretch; }
    #scrTitle .logo { grid-column: 2; grid-row: 1; align-self: end; }
    #titleArt { grid-column: 1; grid-row: 1 / span 2; min-height: 0; }
    #scrTitle .tbox { grid-column: 2; grid-row: 2; align-self: start; margin-top: 14px; }
    .logo h1 { font-size: clamp(40px, 6vw, 70px); }
  }
  @media (min-aspect-ratio: 5/4) and (max-height: 460px) {
    #scrTitle.on { padding-top: 14px; padding-bottom: 10px; }
    .logo h1 { font-size: 40px; }
    .tmenu { gap: 8px; }
    .tmenu .cbtn { min-height: 44px; padding: 8px 12px; font-size: 18px; }
    .tstat { margin-top: 6px; }
  }

  /* 選單頁（選關卡包、選關） */
  .page { align-items: stretch; }
  .phead { flex: none; display: flex; flex-direction: column; align-items: center; padding: max(14px, env(safe-area-inset-top)) 70px 8px; text-align: center; }
  .phead h2 { margin: 0; font-size: 26px; font-weight: 900; }
  .phead .sub { color: var(--mute); font-size: 14px; font-weight: 700; margin-top: 2px; }
  .pbody { flex: 1; min-height: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; touch-action: pan-y; padding: 8px 14px 16px; }
  .pfoot { flex: none; display: flex; justify-content: center; gap: 12px; padding: 10px 14px max(12px, env(safe-area-inset-bottom)); background: linear-gradient(0deg, rgba(10,8,35,0.85), rgba(10,8,35,0)); }
  .pfoot .cbtn { min-width: 150px; }
  .packs { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; max-width: 980px; margin: 0 auto; }
  .pack { position: relative; border: 0; border-radius: 20px; padding: 10px 8px 12px; background: var(--card); box-shadow: inset 0 0 0 2px var(--line); color: var(--ink); cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 4px; }
  .pack:active { transform: scale(0.97); }
  .pack:focus-visible { outline: 3px solid #fff; }
  .pack canvas { width: 88px; height: 88px; }
  .pack .nm { font-size: 19px; font-weight: 900; }
  .pack .sz { font-size: 13px; color: var(--mute); font-weight: 700; }
  .pack .st { font-size: 14px; font-weight: 800; color: #ffd84d; }
  .pack.locked { background: rgba(255,255,255,0.04); }
  .pack.locked .nm, .pack.locked .sz { opacity: 0.6; }
  .pack .st.lkt { color: #d8d2ff; font-size: 12.5px; }
  .pack.locked canvas { opacity: 0.45; filter: grayscale(0.6); }
  .pack .tag { position: absolute; top: 8px; right: 8px; font-size: 12px; font-weight: 900; padding: 2px 8px; border-radius: 99px; background: #ff5c8a; color: #fff; }
  .levels { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; max-width: 760px; margin: 0 auto; }
  @media (min-aspect-ratio: 5/4) { .levels { grid-template-columns: repeat(10, 1fr); } }
  .lv { position: relative; aspect-ratio: 1 / 1; border: 0; border-radius: 16px; background: var(--card); box-shadow: inset 0 0 0 2px var(--line); color: var(--ink); font-size: 22px; font-weight: 900; cursor: pointer;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; padding: 2px; min-width: 0; }
  .lv:active { transform: scale(0.95); }
  .lv:focus-visible { outline: 3px solid #fff; }
  .lv .ss { display: flex; gap: 1px; height: 13px; }
  .lv .ss svg { width: 13px; height: 13px; }
  .lv.done { background: linear-gradient(180deg, rgba(91,224,143,0.28), rgba(91,224,143,0.12)); }
  .lv.perfect { background: linear-gradient(180deg, rgba(255,216,77,0.32), rgba(255,170,60,0.14)); }
  .lv.locked { opacity: 0.4; }
  .lv.next { box-shadow: inset 0 0 0 3px #ffd84d; }

  /* 遊戲中 */
  #scrPlay { pointer-events: none; }
  #scrPlay.on { display: flex; flex-direction: column; }
  #hud { flex: none; height: 116px; padding: 12px 66px 0; display: flex; flex-direction: column; align-items: center; gap: 6px; pointer-events: none; text-align: center; }
  #hudTitle { font-size: 19px; font-weight: 900; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
  #hudProg { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; }
  .chip { font-size: 14px; font-weight: 800; padding: 3px 10px; border-radius: 99px; background: rgba(255,255,255,0.1); box-shadow: inset 0 0 0 1.5px rgba(255,255,255,0.12); white-space: nowrap; }
  .chip b { color: #ffd84d; }
  #boardArea { flex: 1; min-height: 0; margin: 0 12px; pointer-events: none; }
  #bar { flex: none; display: flex; justify-content: center; gap: 10px; padding: 10px 12px max(14px, env(safe-area-inset-bottom)); }
  #bar .cbtn { flex: 1; max-width: 130px; font-size: 18px; padding: 8px 6px; flex-direction: column; gap: 2px; min-height: 64px; }
  #bar .cbtn span { font-size: 15px; }
  #bar .cbtn .badge { position: absolute; top: -6px; right: -4px; font-size: 12px; background: #ff5c8a; border-radius: 99px; padding: 1px 6px; box-shadow: 0 2px 0 rgba(0,0,0,0.25); }
  #pauseBtn { position: fixed; top: 66px; right: 10px; width: 48px; height: 48px; min-height: 0; padding: 0; border-radius: 50%; z-index: 600; }
  #pauseBtn svg { width: 22px; height: 22px; }
  @media (min-aspect-ratio: 5/4) {
    #scrPlay.on { flex-direction: row; }
    #hud { width: 200px; height: auto; padding: 72px 8px 12px 14px; align-items: flex-start; text-align: left; }
    #hudTitle { white-space: normal; font-size: 18px; }
    #hudProg { flex-direction: column; align-items: flex-start; }
    #boardArea { margin: 10px 6px; }
    #bar { width: 170px; flex-direction: column; justify-content: flex-start; padding: 128px 14px 14px 6px; }
    #bar .cbtn { flex: none; max-width: none; flex-direction: row; min-height: 52px; gap: 8px; }
  }
  @media (min-aspect-ratio: 5/4) and (max-height: 460px) {
    #bar { padding-top: 122px; gap: 8px; }
    #bar .cbtn { min-height: 46px; }
  }

  /* 遮罩：暫停、結果、說明 */
  .ov { position: fixed; inset: 0; z-index: 800; display: none; align-items: center; justify-content: center; background: rgba(8,6,30,0.62); padding: 70px 14px 14px; }
  .ov.on { display: flex; }
  .card { width: min(360px, 100%); max-height: 100%; display: flex; flex-direction: column; border-radius: 26px; background: linear-gradient(180deg, #2c2470, #1d1856); box-shadow: inset 0 0 0 2px rgba(255,255,255,0.14), 0 20px 50px rgba(0,0,0,0.45); padding: 18px 18px 16px; text-align: center; animation: pop .28s cubic-bezier(.3,1.6,.5,1); }
  .card h2 { margin: 2px 0 6px; font-size: 26px; font-weight: 900; }
  .card .cbody { overflow-y: auto; min-height: 0; flex: 1; touch-action: pan-y; }
  .card .acts { display: flex; flex-direction: column; gap: 10px; margin-top: 12px; flex: none; }
  .card .acts .row { display: flex; gap: 10px; }
  .card .acts .row > * { flex: 1; }
  .card p { margin: 6px 0; color: var(--mute); font-weight: 700; font-size: 15px; line-height: 1.5; }
  .stars { display: flex; justify-content: center; gap: 8px; margin: 4px 0 8px; }
  .stars svg { width: 54px; height: 54px; transform: scale(0); animation: starIn .45s cubic-bezier(.3,1.8,.5,1) forwards; }
  .stats { display: flex; justify-content: center; gap: 8px; flex-wrap: wrap; margin: 4px 0; }
  .help li { text-align: left; margin: 8px 0; color: #e8e4ff; font-weight: 700; font-size: 15px; line-height: 1.45; }
  .help ul { padding-left: 22px; margin: 6px 0; }
  @media (max-height: 460px) {
    .ov { padding: 10px 70px; }
    .card { width: min(520px, 100%); padding: 12px 14px; }
    .card h2 { font-size: 22px; margin: 0 0 2px; }
    .stars svg { width: 40px; height: 40px; }
    .card .acts { flex-direction: row; flex-wrap: wrap; margin-top: 8px; }
    .card .acts > * { flex: 1 1 40%; }
    .card .acts .row { flex: 1 1 100%; }
    .card .cbtn { min-height: 44px; padding: 8px 10px; font-size: 17px; }
  }
  #banner { position: fixed; left: 50%; top: 40%; z-index: 700; transform: translate(-50%, -50%); pointer-events: none; font-size: 26px; font-weight: 900; padding: 10px 22px; border-radius: 99px;
    background: linear-gradient(180deg, rgba(255,255,255,0.96), rgba(236,232,255,0.96)); color: #3b2a8a; box-shadow: 0 10px 30px rgba(0,0,0,0.35); opacity: 0; white-space: nowrap; }
  #banner.show { animation: ban 1.5s ease forwards; }
  @keyframes ban { 0% { opacity: 0; transform: translate(-50%, -30%) scale(0.7); } 14% { opacity: 1; transform: translate(-50%, -50%) scale(1.06); } 22% { transform: translate(-50%, -50%) scale(1); } 78% { opacity: 1; } 100% { opacity: 0; transform: translate(-50%, -70%) scale(0.96); } }
  @keyframes pop { from { transform: scale(0.85); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  @keyframes starIn { from { transform: scale(0) rotate(-40deg); } to { transform: scale(1) rotate(0); } }
</style>
</head>
<body>
<canvas id="cv" tabindex="0" aria-label="彩色連線：把一樣顏色的圓點用線連起來"></canvas>

<div id="scrTitle" class="scr">
  <div class="logo"><h1>彩色連線</h1><p>把一樣顏色的圓點連起來，線不能交叉！</p></div>
  <div id="titleArt"></div>
  <div class="tbox">
    <div class="tmenu">
      <button class="cbtn green" id="bPlay"></button>
      <button class="cbtn yellow" id="bDaily"></button>
      <div class="row">
        <button class="cbtn blue small" id="bHelp">怎麼玩</button>
        <button class="cbtn purple small tog" id="bMusicT">音樂 <span class="pill"></span></button>
        <button class="cbtn purple small tog" id="bSfxT">音效 <span class="pill"></span></button>
      </div>
    </div>
    <div class="tstat" id="tStat"></div>
  </div>
</div>

<div id="scrPacks" class="scr page">
  <div class="phead"><h2>選擇關卡包</h2><div class="sub" id="packSub"></div></div>
  <div class="pbody"><div class="packs" id="packGrid"></div></div>
  <div class="pfoot"><button class="cbtn ghost" id="bPacksBack">返回</button></div>
</div>

<div id="scrLevels" class="scr page">
  <div class="phead"><h2 id="lvTitle"></h2><div class="sub" id="lvSub"></div></div>
  <div class="pbody"><div class="levels" id="lvGrid"></div></div>
  <div class="pfoot"><button class="cbtn ghost" id="bLvBack">返回</button></div>
</div>

<div id="scrPlay" class="scr">
  <div id="hud"><div id="hudTitle"></div><div id="hudProg"></div></div>
  <div id="boardArea"></div>
  <div id="bar">
    <button class="cbtn blue" id="bUndo"></button>
    <button class="cbtn yellow" id="bHint"></button>
    <button class="cbtn purple" id="bRestart"></button>
  </div>
</div>
<button class="cbtn ghost hidden" id="pauseBtn" aria-label="暫停"></button>

<div class="ov" id="ovPause"><div class="card">
  <h2>暫停一下</h2>
  <div class="cbody"><p id="pauseInfo"></p></div>
  <div class="acts">
    <button class="cbtn green" id="pResume">繼續</button>
    <div class="row"><button class="cbtn purple small" id="pRestart">重新開始</button><button class="cbtn blue small" id="pLevels">選關</button></div>
    <div class="row"><button class="cbtn ghost small tog" id="pMusic">音樂 <span class="pill"></span></button><button class="cbtn ghost small tog" id="pSfx">音效 <span class="pill"></span></button></div>
    <div class="row"><button class="cbtn ghost small tog" id="pSym">圖案記號 <span class="pill"></span></button><button class="cbtn ghost small" id="pTitle">回標題</button></div>
  </div>
</div></div>

<div class="ov" id="ovResult"><div class="card">
  <h2 id="rTitle"></h2>
  <div class="cbody">
    <div class="stars" id="rStars"></div>
    <div class="stats" id="rStats"></div>
    <p id="rMsg"></p>
  </div>
  <div class="acts" id="rActs"></div>
</div></div>

<div class="ov" id="ovHelp"><div class="card">
  <h2>怎麼玩</h2>
  <div class="cbody help"><ul>
    <li>從圓點開始拖，拖到<b>一樣顏色</b>的圓點，就連起來了。</li>
    <li>線和線不能交叉。拖過別的線，會把那條線剪斷。</li>
    <li>點一下線可以把它擦掉；也可以按「復原」。</li>
    <li>每一格都填滿、不用提示，就能拿到 <b>3 顆星</b>！</li>
    <li><b>橋</b>：一條橫的、一條直的可以從橋上穿過去，兩個方向都要用到才算填滿。</li>
    <li><b>牆</b>：粗粗的牆擋住的地方不能走過去。</li>
    <li>每個顏色的圓點上都有不同的圖案，分不清顏色也能玩。</li>
  </ul></div>
  <div class="acts"><button class="cbtn green" id="hClose">知道了</button></div>
</div></div>

<div id="banner"></div>

<script src="../../assets/common.js"></script>
<script src="../../assets/kg-music.js"></script>
<script>
'use strict';
/* =====================================================================
 * 題目：圖形、解題器（數解，最多 2 個 → 唯一解）、出題器、編碼
 * ===================================================================== */
function LinkLib() {
  'use strict';
  function rngOf(seed) {
    let a = seed >>> 0;
    return function () {
      a = (a + 0x6D2B79F5) >>> 0;
      let t = a;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  const DR = [-1, 0, 1, 0], DC = [0, 1, 0, -1]; // 上 右 下 左
  const DCH = 'URDL';

  /** 建立圖：一般格子 = 一個節點；橋 = 兩個節點（橫向 id = 格子編號、直向 id = N + 第幾座橋） */
  function graph(w, h, bridges, walls) {
    const N = w * h, bset = new Map();
    (bridges || []).forEach((c, i) => bset.set(c, i));
    const wset = new Set(walls || []); // 'c,R' 或 'c,D'
    const NN = N + bset.size;
    const adj = []; for (let i = 0; i < NN; i++) adj.push([]);
    const nodeAt = (c, horiz) => (bset.has(c) && !horiz) ? N + bset.get(c) : c;
    const cellOf = new Int32Array(NN); for (let c = 0; c < N; c++) cellOf[c] = c;
    bset.forEach((i, c) => { cellOf[N + i] = c; });
    for (let r = 0; r < h; r++) for (let c = 0; c < w; c++) {
      const i = r * w + c;
      if (c + 1 < w && !wset.has(i + ',R')) { const a = nodeAt(i, true), b = nodeAt(i + 1, true); adj[a].push(b); adj[b].push(a); }
      if (r + 1 < h && !wset.has(i + ',D')) { const a = nodeAt(i, false), b = nodeAt(i + w, false); adj[a].push(b); adj[b].push(a); }
    }
    return { w, h, N, NN, adj, bset, wset, cellOf, nodeAt };
  }

  /**
   * 解題：ends = [[a,b],...]（節點編號）。回傳解的個數（最多 limit），out.sol = 每個節點的顏色
   * 每一步選「可走的路最少」的線頭往前延伸，並檢查死角與區域連通。
   */
  function solve(G, ends, limit, out, budget) {
    const NN = G.NN, adj = G.adj, K = ends.length;
    const col = new Int8Array(NN).fill(-1);
    const head = new Int32Array(K * 2), done = new Uint8Array(K);
    const isHead = new Int16Array(NN).fill(-1); // 線頭屬於哪個顏色
    for (let k = 0; k < K; k++) {
      head[2 * k] = ends[k][0]; head[2 * k + 1] = ends[k][1];
      col[ends[k][0]] = k; col[ends[k][1]] = k;
      isHead[ends[k][0]] = k; isHead[ends[k][1]] = k;
    }
    let count = 0, nodes = 0, left = K, empty = 0;
    for (let i = 0; i < NN; i++) if (col[i] < 0) empty++;
    const comp = new Int32Array(NN), stack = new Int32Array(NN);
    const served = new Uint8Array(NN + 1);
    const maxNodes = budget || 4e6;

    function adjacent(a, b) { const l = adj[a]; for (let i = 0; i < l.length; i++) if (l[i] === b) return true; return false; }
    let fSlot = -1, fCell = -1, stamp = 0;
    const forcedAt = new Int32Array(K * 2), forcedTo = new Int32Array(K * 2);
    function ok() {
      stamp++;
      // 1) 空格至少要有 2 個出口（空格或未完成的線頭）
      fSlot = -1;
      for (let i = 0; i < NN; i++) {
        if (col[i] >= 0) continue;
        const l = adj[i]; let n = 0, h1 = -1, h2 = -1;
        for (let j = 0; j < l.length; j++) {
          const v = l[j];
          if (col[v] < 0) n++;
          else if (isHead[v] >= 0 && !done[isHead[v]]) { n++; if (h1 < 0) h1 = v; else h2 = v; }
        }
        if (n < 2) return false;
        if (n === 2 && h1 >= 0) {

  if (!Title.pz) titleNext();
  const tot = totalStars();
  const d = Save.get('daily', {})[todayKey()];
  $('tStat').innerHTML = '星星 <b>' + tot + '</b> / ' + (PACKS.length * 90) + (d ? '　今天的每日一題 ' + '★'.repeat(d.stars) : '');
  $('dailyLbl').textContent = d ? '每日一題（已完成）' : '每日一題';
  refreshToggles();
  musicMenu(); if (KG.music) KG.music.resume();
  setTimeout(resize, 0);
}
function updTitle(dt) {
  const T = Title; if (!T.pz) return;
  T.t += dt;
  const K = T.pz.ends.length;
  if (T.phase === 0) {
    // 一條一條畫出來
    const k = T.k;
    const speed = 9;
    T.grow[k] = Math.min(T.paths[k].length - 1, T.grow[k] + dt * speed);
    if (T.grow[k] >= T.paths[k].length - 1) { T.k++; T.pulseK = T.pulseK || []; T.pulseK[k] = time; if (T.k >= K) { T.phase = 1; T.t = 0; } }
  } else if (T.phase === 1) { if (T.t > 3.4) { T.phase = 2; T.t = 0; } }
  else if (T.phase === 2) { if (T.t > 0.6) titleNext(); }
}
function drawTitle(g) {
  const T = Title; if (!T.pz || TB.cs < 8) return;
  const K = T.pz.ends.length;
  const cellCol = new Int16Array(T.pz.w * T.pz.h).fill(-1);
  const conn = [];
  for (let k = 0; k < K; k++) {
    const P = T.paths[k], n = Math.floor(T.grow[k]);
    for (let i = 0; i <= n && i < P.length; i++) if (cellCol[P[i]] < 0) cellCol[P[i]] = k;
    conn.push(T.grow[k] >= P.length - 1);
  }
  const V = { pz: T.pz, B: TB, paths: T.paths, grow: T.grow, conn, cellCol, wave: T.phase === 1 ? T.t : -1, waveC: T.pz.w / 2, waveR: T.pz.h / 2, flowT: time, pulse: T.pulseK || [],
    alpha: T.phase === 2 ? 1 - T.t / 0.6 : Math.min(1, T.t * 3 + (T.k > 0 || T.phase ? 1 : 0)) };
  drawBoard(g, V);
}

/* ---------- 關卡包 ---------- */
function goPacks() {
  scene = 'packs'; closeOverlays(); showScreen('scrPacks');
  const grid = $('packGrid'); grid.innerHTML = '';
  PACKS.forEach(p => {
    const btn = document.createElement('button'); btn.className = 'pack';
    const un = packUnlocked(p);
    if (!un) btn.classList.add('locked');
    const cvs = document.createElement('canvas'); cvs.width = 176; cvs.height = 176;
    btn.appendChild(cvs);
    btn.insertAdjacentHTML('beforeend', '<div class="nm">' + p.name + '</div><div class="sz">' + p.size + (p.special ? '・' + p.special : '') + '</div><div class="st">★ ' + Save.total(p.id) + ' / 90</div>');
    if (p.bonus) btn.insertAdjacentHTML('beforeend', '<div class="tag">加碼</div>');
    if (p.special) btn.insertAdjacentHTML('beforeend', '<div class="tag" style="background:#7c4ff0">特別</div>');
    if (!un) { btn.querySelector('.st').innerHTML = LOCK + ' ' + PACK[p.need[0]].name + ' 過 ' + p.need[1] + ' 關'; btn.querySelector('.st').classList.add('lkt'); }
    btn.addEventListener('click', () => { if (!un) { sfx('error'); KG.vibrate(20); return; } sfx('select'); goLevels(p.id); });
    grid.appendChild(btn);
    // 小預覽：第一關的解答
    const pz = getPuzzle(p.id, p.id === 'bridge' || p.id === 'wall' ? 12 : 0);
    const g = cvs.getContext('2d'), n = Math.max(pz.w, pz.h), cs = 168 / n;
    const V = { pz, B: { x: 4, y: 4, cs }, paths: pz.sol, conn: pz.sol.map(() => true), cellCol: null, flowT: 0 };
    const sv = DPR; DPR = 1; drawBoard(g, V); DPR = sv;
  });
  $('packSub').textContent = '總共 ' + totalStars() + ' 顆星';
  musicMenu();
}

/* ---------- 選關 ---------- */
let curPack = 'p5';
const LOCK = '<svg viewBox="0 0 24 24" width="14" height="14" style="vertical-align:-2px"><rect x="5" y="10.5" width="14" height="10" rx="2.5" fill="currentColor"/><path d="M8 10.5V8a4 4 0 0 1 8 0v2.5" fill="none" stroke="currentColor" stroke-width="2.4"/></svg>';
function goLevels(pid) {
  if (pid) curPack = pid;
  scene = 'levels'; paused = false; closeOverlays(); showScreen('scrLevels');
  const p = PACK[curPack];
  $('lvTitle').textContent = p.name + '　' + p.size;
  $('lvSub').textContent = '★ ' + Save.total(curPack) + ' / 90　過了 ' + Save.solved(curPack) + ' 關';
  const grid = $('lvGrid'); grid.innerHTML = '';
  const st = Save.stars(curPack);
  let nextMarked = false;
  for (let i = 0; i < 30; i++) {
    const b = document.createElement('button'); b.className = 'lv';
    const un = levelUnlocked(curPack, i), s = st[i] || 0;
    if (!un) b.classList.add('locked');
    if (s >= 3) b.classList.add('perfect'); else if (s > 0) b.classList.add('done');
    if (un && !s && !nextMarked) { b.classList.add('next'); nextMarked = true; }
    b.innerHTML = '<div>' + (i + 1) + '</div><div class="ss">' + (un ? [0, 1, 2].map(j => ICON.star(j < s)).join('') : '') + '</div>';
    b.setAttribute('aria-label', '第 ' + (i + 1) + ' 關' + (un ? '' : '（還沒打開）'));
    b.addEventListener('click', () => { if (!un) { sfx('error'); KG.vibrate(20); return; } sfx('select'); startLevel(curPack, i); });
    grid.appendChild(b);
  }
  musicMenu(); if (KG.music) KG.music.resume();
  const nx = grid.querySelector('.next'); if (nx) setTimeout(() => nx.scrollIntoView({ block: 'nearest' }), 0);
}

/* ---------- 開始一關 ---------- */
function startLevel(pid, i) {
  G.daily = false; G.pack = pid; G.level = i;
  Save.set('last', [pid, i]);
  enterPlay(getPuzzle(pid, i));
}
function startDaily() {
  G.daily = true; G.pack = 'daily'; G.level = 0;
  sfx('select');
  enterPlay(dailyPuzzle());
}
function enterPlay(pz) {
  closeOverlays();
  scene = 'play'; paused = false;
  showScreen('scrPlay');
  setupPuzzle(pz);
  kbCursor.c = pz.ends[0][0];
  resize();
  musicGame();
  if (KG.music) { KG.music.setLayer('beat', false); KG.music.setLayer('keys', false); KG.music.setLayer('top', false); KG.music.resume(); }
  jingleStart();
  // 圓點一個一個跳出來
  pz.ends.forEach((e, k) => { G.pulse[k] = time + k * 0.06; });
  setTimeout(() => { if (scene === 'play') sfx('page', { pitch: 1.1 }); }, 60);
}
function updateHud() {
  if (!G.pz) return;
  const K = G.pz.ends.length;
  $('hudTitle').textContent = G.daily ? '每日一題' + (G.pz.bridges.length ? '・橋' : '') + (G.pz.walls.length ? '・牆' : '') : PACK[G.pack].name + '・第 ' + (G.level + 1) + ' 關';
  $('hudProg').innerHTML = '<span class="chip">' + G.pz.w + '×' + G.pz.h + '</span><span class="chip">連線 <b>' + G.connN + '</b>/' + K + '</span><span class="chip">填滿 <b>' + Math.floor(G.filled * 100) + '%</b></span><span class="chip" id="hudTime">' + fmtTime(G.t) + '</span>';
  $('bUndo').disabled = !G.undo.length;
  const hb = $('bHint'); hb.querySelector('.badge') && hb.querySelector('.badge').remove();
  if (G.hints) hb.insertAdjacentHTML('beforeend', '<span class="badge">' + G.hints + '</span>');
}

/* ---------- 暫停 ---------- */
function setPaused(p) {
  if (scene !== 'play' || p === paused) return;
  if (p && (G.done || $('ovResult').classList.contains('on'))) return;
  if (drag.on) endDrag(false);
  paused = p;
  $('ovPause').classList.toggle('on', p);
  if (p) {
    $('pauseInfo').textContent = '已經連上 ' + G.connN + ' / ' + G.pz.ends.length + ' 條，填滿 ' + Math.floor(G.filled * 100) + '%，用了 ' + fmtTime(G.t);
    refreshToggles();
    if (KG.music) KG.music.pause();
    sfx('back');
    setTimeout(() => $('pResume').focus({ preventScroll: true }), 30);
  } else {
    if (KG.music) KG.music.resume();
    sfx('select');
    cv.focus({ preventScroll: true });
  }
}

/* ---------- 結果 ---------- */
function showResult(stars, filled, rec) {
  const ov = $('ovResult');
  const K = G.pz.ends.length;
  $('rTitle').textContent = filled ? (stars >= 3 ? '完美過關！' : '過關了！') : '全部連起來了！';
  $('rStars').innerHTML = [0, 1, 2].map(i => ICON.star(i < stars).replace('<svg', '<svg style="animation-delay:' + (0.1 + i * 0.16) + 's"')).join('');
  const best = G.daily ? null : Save.times(G.pack)[G.level];
  $('rStats').innerHTML = '<span class="chip">時間 <b>' + fmtTime(G.t) + '</b></span><span class="chip">筆數 <b>' + G.moves + '</b></span><span class="chip">填滿 <b>' + Math.floor(G.filled * 100) + '%</b></span>' +
    (best != null ? '<span class="chip">最快 <b>' + fmtTime(best) + '</b></span>' : '');
  let msg = '';
  if (!filled) msg = '還有 ' + (G.totalUnits - G.coverUnits) + ' 格空著，把每一格都填滿可以拿到 3 顆星！';
  else if (G.hints) msg = '用了 ' + G.hints + ' 次提示。不用提示再挑戰一次，可以拿到 3 顆星！';
  else msg = rec && rec.bestT && !G.daily ? '新紀錄！每一格都填滿了。' : '每一格都填滿了，好厲害！';
  $('rMsg').textContent = msg;
  const acts = $('rActs'); acts.innerHTML = '';
  const add = (txt, cls, fn, parent) => { const b = document.createElement('button'); b.className = 'cbtn ' + cls; b.textContent = txt; b.addEventListener('click', fn); (parent || acts).appendChild(b); return b; };
  const hasNext = !G.daily && G.level < 29;
  let first;
  if (!filled) first = add('繼續填滿', 'green', () => { sfx('select'); ov.classList.remove('on'); G.done = false; G.perfectShown = 'partial'; });
  if (hasNext) { const b = add('下一關', filled ? 'green' : 'blue', () => { sfx('select'); startLevel(G.pack, G.level + 1); }); first = first || b; }
  const row = document.createElement('div'); row.className = 'row'; acts.appendChild(row);
  add('再玩一次', 'purple small', () => { sfx('select'); if (G.daily) enterPlay(G.pz); else startLevel(G.pack, G.level); }, row);
  if (G.daily) add('回標題', 'ghost small', () => { sfx('back'); goTitle(); }, row);
  else add('選關', 'ghost small', () => { sfx('back'); goLevels(G.pack); }, row);
  first = first || row.firstChild;
  ov.classList.add('on');
  [0, 1, 2].forEach(i => { if (i < stars) setTimeout(() => sfx('star', { pitch: semi([0, 4, 7][i]) * 0.9, vol: 0.8 }), 140 + i * 160); });
  setTimeout(() => first.focus({ preventScroll: true }), 40);
}

/* ---------- 按鈕 ---------- */
function bindPress(id, fn) { $(id).addEventListener('click', fn); }
bindPress('bPlay', () => { sfx('select'); goPacks(); });
bindPress('bDaily', () => startDaily());
bindPress('bHelp', () => { sfx('ui'); $('ovHelp').classList.add('on'); setTimeout(() => $('hClose').focus({ preventScroll: true }), 30); });
bindPress('hClose', () => { sfx('back'); $('ovHelp').classList.remove('on'); });
bindPress('bMusicT', toggleMusic); bindPress('pMusic', toggleMusic);
bindPress('bSfxT', toggleSfx); bindPress('pSfx', toggleSfx); bindPress('pSym', toggleSym);
bindPress('bPacksBack', () => { sfx('back'); goTitle(); });
bindPress('bLvBack', () => { sfx('back'); goPacks(); });
bindPress('bUndo', () => doUndo());
bindPress('bHint', () => doHint());
bindPress('bRestart', () => doRestart());
bindPress('pauseBtn', () => setPaused(true));
bindPress('pResume', () => setPaused(false));
bindPress('pRestart', () => { setPaused(false); if (G.daily) enterPlay(G.pz); else startLevel(G.pack, G.level); });
bindPress('pLevels', () => { paused = false; closeOverlays(); if (KG.music) KG.music.resume(); sfx('back'); if (G.daily) goTitle(); else goLevels(G.pack); });
bindPress('pTitle', () => { paused = false; closeOverlays(); if (KG.music) KG.music.resume(); sfx('back'); goTitle(); });

window.addEventListener('keydown', e => {
  const k = e.key;
  if (scene === 'play') {
    if (k === 'Escape' || k === 'p' || k === 'P') {
      e.preventDefault();
      if ($('ovResult').classList.contains('on')) return;
      setPaused(!paused); return;
    }
    if (overlayOn()) return;
    const d = { ArrowUp: 0, ArrowRight: 1, ArrowDown: 2, ArrowLeft: 3, w: 0, d: 1, s: 2, a: 3 }[k];
    if (d != null) { e.preventDefault(); kbCursor.show = true; kbMove(d); return; }
    if (k === ' ' || k === 'Enter') { if (document.activeElement && document.activeElement.tagName === 'BUTTON' && !kbCursor.show) return; e.preventDefault(); kbCursor.show = true; kbGrab(); return; }
    if ((k === 'z' || k === 'Z') || (k === 'Backspace')) { e.preventDefault(); doUndo(); return; }
    if (k === 'h' || k === 'H') { doHint(); return; }
    if (k === 'r' || k === 'R') { doRestart(); return; }
  } else if (k === 'Escape') {
    if ($('ovHelp').classList.contains('on')) { $('ovHelp').classList.remove('on'); sfx('back'); }
    else if (scene === 'levels') { sfx('back'); goPacks(); }
    else if (scene === 'packs') { sfx('back'); goTitle(); }
  }
});
document.addEventListener('visibilitychange', () => { if (document.hidden && scene === 'play' && !G.done && !overlayOn()) setPaused(true); });

/* =====================================================================
 * 主迴圈
 * ===================================================================== */
let lastT = performance.now(), hudTick = 0;
function frame(now) {
  requestAnimationFrame(frame);
  let dt = (now - lastT) / 1000; lastT = now;
  if (!(dt > 0)) dt = 0; dt = Math.min(dt, 0.05);
  time += dt;
  for (const o of blobs) { o.x += o.vx * dt; o.y += o.vy * dt; }
  updParts(dt);
  if (scene === 'play' && !paused && !G.done && !overlayOn()) {
    G.t += dt; hudTick += dt;
    if (hudTick > 0.5) { hudTick = 0; const el = $('hudTime'); if (el) el.textContent = fmtTime(G.t); }
  }
  if (G.waveT >= 0) G.waveT += dt;
  if (G.hintAnim) { G.hintAnim.t += dt; if (G.hintAnim.t > 0.5) G.hintAnim = null; }
  if (scene === 'title') updTitle(dt);
  render();
}
function render() {
  const g = ctx;
  g.setTransform(DPR, 0, 0, DPR, 0, 0);
  drawBg(g);
  if (scene === 'title') drawTitle(g);
  else if (scene === 'play' && G.pz) {
    const V = playView();
    drawBoard(g, V);
    // 拖曳中：手指位置的光圈
    if (drag.on) {
      const C = COLORS[drag.k];
      const r = B.cs * (drag.touch ? 0.95 : 0.6);
      g.globalAlpha = 0.28; g.fillStyle = C.c; g.beginPath(); g.arc(drag.x, drag.y, r, 0, TAU); g.fill();
      g.globalAlpha = 1;
    }
    if (kbCursor.show && !paused) {
      const p = centerOf(kbCursor.c); const s = B.cs;
      g.strokeStyle = '#fff'; g.lineWidth = 3; g.setLineDash([6, 4]); g.lineDashOffset = -time * 20;
      rrect(g, p.x - s / 2 + 2, p.y - s / 2 + 2, s - 4, s - 4, s * 0.2); g.stroke(); g.setLineDash([]);
    }
    drawParts(g);
    if (drag.on && drag.touch) drawLoupe(g, V);
  }
  if (scene !== 'play') drawParts(g);
}
let pvCache = { ver: -1, cellCol: null };
function playView() {
  const pz = G.pz, K = pz.ends.length;
  const grow = G.hintAnim ? G.paths.map((p, k) => k === G.hintAnim.k ? easeOut(Math.min(1, G.hintAnim.t / 0.45)) * (p.length - 1) : null) : null;
  if (!grow && pvCache.ver === G.ver && pvCache.pz === pz) return Object.assign(pvCache.V, { wave: G.waveT, waveC: G.waveC, waveR: G.waveR, flowT: time });
  const cellCol = new Int16Array(pz.w * pz.h).fill(-1);
  for (let k = 0; k < K; k++) {
    const P = G.paths[k], n = grow && grow[k] != null ? Math.floor(grow[k]) : P.length - 1;
    for (let i = 0; i <= n && i < P.length; i++) if (cellCol[P[i]] < 0 || !isBridge(P[i])) cellCol[P[i]] = k;
  }
  const V = { pz, B, paths: G.paths, conn: G.conn, cellCol, grow, wave: G.waveT, waveC: G.waveC, waveR: G.waveR, flowT: time, pulse: G.pulse, hinted: G.hinted };
  pvCache = grow ? { ver: -1 } : { ver: G.ver, pz, V };
  return V;
}
/** 放大鏡：手指上方顯示手指底下的樣子（手機上手指會擋住） */
function drawLoupe(g, V) {
  const R = Math.min(64, Math.max(44, B.cs * 1.6)), Z = clamp(68 / B.cs, 1.25, 2.2);
  let lx = drag.x, ly = drag.y - R - 46;
  if (ly - R < 6) { ly = drag.y + R + 46; }
  lx = clamp(lx, R + 6, W - R - 6);
  g.save();
  g.fillStyle = 'rgba(0,0,0,0.35)'; g.beginPath(); g.arc(lx, ly + 4, R + 4, 0, TAU); g.fill();
  g.beginPath(); g.arc(lx, ly, R, 0, TAU); g.clip();
  g.fillStyle = '#1a1650'; g.fillRect(lx - R, ly - R, R * 2, R * 2);
  g.translate(lx, ly); g.scale(Z, Z); g.translate(-drag.x, -drag.y);
  drawBoard(g, V);
  const C = COLORS[drag.k];
  g.globalAlpha = 0.5; g.strokeStyle = '#fff'; g.lineWidth = 2 / Z;
  g.beginPath(); g.arc(drag.x, drag.y, B.cs * 0.22, 0, TAU); g.stroke();
  g.globalAlpha = 0.3; g.fillStyle = C.c; g.beginPath(); g.arc(drag.x, drag.y, B.cs * 0.22, 0, TAU); g.fill();
  g.restore();
  g.strokeStyle = 'rgba(255,255,255,0.85)'; g.lineWidth = 3; g.beginPath(); g.arc(lx, ly, R, 0, TAU); g.stroke();
  g.strokeStyle = rgba(COLORS[drag.k].c, 0.9); g.lineWidth = 2; g.beginPath(); g.arc(lx, ly, R - 3, 0, TAU); g.stroke();
}

/* ---------- 開始 ---------- */
resize();
goTitle();
requestAnimationFrame(frame);

/* ---------- 測試用 ---------- */
window.__cl = {
  state: () => ({ scene, paused, pack: G.pack, level: G.level, daily: G.daily, K: G.pz ? G.pz.ends.length : 0, connN: G.connN, filled: G.filled, done: G.done, hints: G.hints, moves: G.moves,
    undo: G.undo.length, music: KG.music ? KG.music.isPlaying() : null, B: Object.assign({}, B), drag: drag.on, result: $('ovResult').classList.contains('on'), w: G.pz && G.pz.w }),
  start: (p, i) => { startLevel(p, i || 0); return window.__cl.state(); },
  daily: () => { startDaily(); return window.__cl.state(); },
  /** 把解答的第 k 條線的格子中心座標給測試用（真的拖曳） */
  solPts: k => G.pz.sol[k].map(c => centerOf(c)),
  /** 直接把解答填到只剩 n 條 */
  solveAllBut: n => { const K = G.pz.ends.length; for (let k = 0; k < K - (n || 0); k++) G.paths[k] = G.pz.sol[k].slice(); evaluate(); return window.__cl.state(); },
  cellCenter: c => centerOf(c),
  pz: () => G.pz,
  paths: () => G.paths.map(p => p.slice())
};
</script>
