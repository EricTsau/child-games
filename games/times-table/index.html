  }

  /* ---------- 說題目 ---------- */
  function sayQ() {
    const q = game.q;
    if (game.mode === 'learn') { KG.say('點一句口訣，我會念給你聽！'); return; }
    if (!q || game.mode !== 'play') return;
    mood('talk', 1100);
    const { a, b } = q;
    if (q.kind === 'array') { const th = q.theme; KG.say(`每${th.box}有${cnCount(a)}${th.unit}${th.name}，${cnCount(b)}${th.box}一共有幾${th.unit}？`); }
    else if (q.kind === 'chantPick') KG.say(DIG[a] + DIG[b] + '，接下去是什麼？', 0.9);
    else if (q.kind === 'chantFill') KG.say(DIG[a] + '，什麼，' + chantProduct(a * b) + '？', 0.9);
    else if (q.kind === 'boss') KG.say(cnNum(a) + '乘' + cnNum(b), 1.05);
    else KG.say(cnNum(a) + '乘以' + cnNum(b) + '，等於多少？');
  }
  $('sayBtn').addEventListener('click', () => { KG.sound('click'); sayQ(); });

  /* =====================================================================
   * 冒險地圖
   * ===================================================================== */
  let mapEl = null, walker = null;
  function islandPos(land) {
    const P = [];
    for (let i = 0; i < NI; i++) P.push(land ? { x: 130 + i * 185, y: i % 2 ? 292 : 150 } : { x: i % 2 ? 292 : 128, y: 1690 - 140 - i * 175 });
    return P;
  }
  function segPath(p0, p1, i) {
    const mx = (p0.x + p1.x) / 2, my = (p0.y + p1.y) / 2, dx = p1.x - p0.x, dy = p1.y - p0.y, L = Math.hypot(dx, dy);
    const k = (i % 2 ? 1 : -1) * 36;
    return `M${p0.x} ${p0.y} Q${(mx - dy / L * k).toFixed(1)} ${(my + dx / L * k).toFixed(1)} ${p1.x} ${p1.y}`;
  }
  const EXP_OFF = { x: 58, y: 14 };
  function mapSVG(land) {
    const W = land ? 130 + 8 * 185 + 130 : 420, H = land ? 440 : 1690;
    const P = islandPos(land), cur = furthest();
    let s = `<svg id="mapSvg" viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg">
      <defs><pattern id="mw" width="90" height="46" patternUnits="userSpaceOnUse"><path d="M4 23 q11 -9 22 0 t22 0" stroke="#fff" stroke-width="3" fill="none" opacity=".35" stroke-linecap="round"/></pattern>
        <linearGradient id="msea" x1="0" y1="0" x2="${land ? 1 : 0}" y2="${land ? 0 : 1}"><stop offset="0" stop-color="#8fe0ff"/><stop offset="1" stop-color="#3cb6e0"/></linearGradient></defs>
      <rect width="${W}" height="${H}" fill="url(#msea)"/><rect width="${W}" height="${H}" fill="url(#mw)"/>`;
    // 裝飾：小船、小魚、泡泡
    const deco = land ? [[205, 395], [575, 50], [945, 400], [1315, 55], [1640, 400]] : [[350, 1640], [350, 1260], [70, 990], [350, 560], [60, 300]];
    deco.forEach((d, i) => {
      if (i % 2) s += `<g transform="translate(${d[0]} ${d[1]})" opacity=".85"><path d="M-22 0 Q0 14 22 0 Z" fill="#c98040" stroke="#6b3a10" stroke-width="3"/><path d="M0 -2 V-34 L18 -8 Z" fill="#fff" stroke="#c9c9d9" stroke-width="2"/></g>`;
      else s += `<g transform="translate(${d[0]} ${d[1]})" opacity=".8"><path d="M-14 0 Q0 -12 14 0 Q0 12 -14 0 Z M14 0 L24 -8 L24 8 Z" fill="#ffb35c" stroke="#d9784a" stroke-width="2"/><circle cx="-6" cy="-2" r="2" fill="#5b3413"/></g>`;
    });
    // 路徑
    for (let i = 0; i < NI - 1; i++) {
      const d = segPath(P[i], P[i + 1], i), open = islandUnlocked(i + 1);
      s += `<path d="${d}" fill="none" stroke="rgba(10,70,100,.25)" stroke-width="12" stroke-linecap="round" stroke-dasharray="2 20" transform="translate(0 3)"/>`;
      s += `<path class="seg" data-i="${i}" d="${d}" fill="none" stroke="${open ? '#fff' : 'rgba(255,255,255,.5)'}" stroke-width="11" stroke-linecap="round" stroke-dasharray="2 20"/>`;
    }
    // 島
    for (let i = 0; i < NI; i++) {
      const I = ISLANDS[i], p = P[i], locked = !islandUnlocked(i), st = islandStars(i);
      const nextGoal = !locked && i === cur;
      s += `<g class="isl${locked ? ' locked' : ''}" data-i="${i}" transform="translate(${p.x} ${p.y})" role="button" aria-label="${I.name}">
        <ellipse cx="0" cy="22" rx="96" ry="40" fill="#c9f3ff" opacity=".55"/>
        ${nextGoal ? `<ellipse class="ring" cx="0" cy="16" rx="98" ry="46" fill="none" stroke="#ffd34d" stroke-width="5"/>` : ''}
        <g class="bob"${locked ? ' style="filter:grayscale(.85) brightness(1.08);opacity:.8"' : ''}>
          <path d="M-82 18 Q-84 -6 -42 -12 Q0 -20 46 -12 Q86 -6 82 18 Q62 42 0 44 Q-62 42 -82 18 Z" fill="#ffe3a3" stroke="#e0b060" stroke-width="3"/>
          <path d="M-62 10 Q-60 -10 -22 -14 Q20 -20 54 -8 Q68 2 60 14 Q30 26 -10 24 Q-52 24 -62 10 Z" fill="#8fd96a"/>
          <g transform="translate(-40 -86) scale(.8)">${LANDMARK[i]}</g>
          <g transform="translate(-62 -30)"><circle r="21" fill="${I.c}" stroke="#fff" stroke-width="4"/>${I.mixed ? '<use href="#ic-gstar" x="-14" y="-14" width="28" height="28"/>' : `<text y="9" text-anchor="middle" font-size="26" font-weight="900" fill="#fff" font-family="var(--kg-font)">${I.t}</text>`}</g>
          <g transform="translate(0 56)"><rect x="-56" y="-16" width="112" height="32" rx="16" fill="#fff" stroke="${I.c}" stroke-width="3.5"/><text y="7" text-anchor="middle" font-size="18" font-weight="900" fill="${Kit.darken(I.c, 0.35)}" font-family="var(--kg-font)">${I.name}</text></g>
          ${locked ? '' : `<g transform="translate(0 86)"><rect x="-40" y="-12" width="80" height="24" rx="12" fill="rgba(255,255,255,.9)"/><use href="#ic-gstar" x="-36" y="-10" width="20" height="20"/><text x="8" y="6" text-anchor="middle" font-size="15" font-weight="900" fill="#8a5a00" font-family="var(--kg-font)">${st}/15</text></g>`}
        </g>
        ${locked ? `<g transform="translate(-22 -40) scale(.44)">${Kit.ICON.lock().replace('<svg', '<svg width="100" height="100"')}</g>` : ''}
      </g>`;
    }
    const ep = P[Math.min(KG.store.get(KEY + ':pos', 0) || 0, cur)];
    s += `<g class="exp" id="mapExp" transform="translate(${ep.x + EXP_OFF.x} ${ep.y + EXP_OFF.y})"><g id="mapExpFlip"><g transform="translate(-33 -80) scale(.55)" class="exp-svg">${explorerInner('mp')}</g></g></g>`;
    return s + '</svg>';
  }
  function showMap() {
    closeScreens();
    stopReadAll();
    game.mode = 'map'; game.busy = true; game.q = null;
    showGame(false);
    if (!Kit.Music.playing) Kit.Music.start(Kit.SONGS.gentle);
    Kit.ensureDefs();
    const el = document.createElement('div');
    el.id = 'mapScr';
    const due = dueCount();
    el.innerHTML = `<div class="mhead"><div class="kit-banner">冒險地圖</div><div class="kit-total">${Kit.ICON.star(true)}<span>${totalStars()} / ${MAXSTARS}</span></div></div>` +
      `<div class="mscroll" id="mscroll"></div>` +
      `<div class="mtools" id="mtools"><button class="tbtn g" id="tReview"><svg viewBox="0 0 100 100"><use href="#ic-review"/></svg>複習站${due ? `<span class="bdg">${due}</span>` : ''}</button>` +
      `<button class="tbtn y" id="tStk"><svg viewBox="0 0 100 100"><use href="#ic-gstar"/></svg>貼紙簿</button>` +
      `<button class="tbtn p" id="tParent"><svg viewBox="0 0 100 100"><use href="#ic-parent"/></svg>家長專區</button></div>`;
    document.body.appendChild(el);
    mapEl = el;
    el.querySelector('#tReview').addEventListener('click', () => { KG.sound('pop'); startReview(); });
    el.querySelector('#tStk').addEventListener('click', () => { KG.sound('pop'); showStickers(); });
    el.querySelector('#tParent').addEventListener('click', () => { KG.sound('pop'); showParent(); });
    layoutMap(true);
    const sc = el.querySelector('#mscroll');
    sc.addEventListener('wheel', e => {
      if (!el.classList.contains('land') || Math.abs(e.deltaY) <= Math.abs(e.deltaX)) return;
      e.preventDefault(); sc.scrollLeft += e.deltaY;
    }, { passive: false });
    sc.addEventListener('click', e => {
      if (walker) return;
      const svg = $('mapSvg');
      if (!svg) return;
      const m = svg.getScreenCTM();
      if (!m) return;
      const pt = new DOMPoint(e.clientX, e.clientY).matrixTransform(m.inverse());
      const P = islandPos(mapEl.classList.contains('land'));
      let best = -1, bd = 1e9;
      P.forEach((p, i) => { const d = Math.hypot(pt.x - p.x, pt.y - (p.y + 4)); if (d < bd) { bd = d; best = i; } });
      if (best >= 0 && bd < 112) tapIsland(best);
    });
    // 探險家走到新島
    const pos = KG.store.get(KEY + ':pos', 0) || 0, cur = furthest();
    if (cur > pos) setTimeout(() => walkTo(pos, cur), 500);
  }
  let mapLand = null;
  function layoutMap(force) {
    if (!mapEl || !document.body.contains(mapEl)) return;
    const land = innerWidth > innerHeight * 1.15;
    mapEl.classList.toggle('land', land);
    const head = mapEl.querySelector('.mhead'), tools = mapEl.querySelector('#mtools');
    if (land && tools.parentNode !== head) head.appendChild(tools);
    if (!land && tools.parentNode === head) mapEl.appendChild(tools);
    const sc = mapEl.querySelector('#mscroll');
    if (force || land !== mapLand || !$('mapSvg')) { sc.innerHTML = mapSVG(land); mapLand = land; }
    const svg = $('mapSvg'), r = sc.getBoundingClientRect(), vb = svg.viewBox.baseVal;
    if (land) { svg.style.height = r.height + 'px'; svg.style.width = (r.height * vb.width / vb.height) + 'px'; }
    else { const w = Math.min(r.width, 560); svg.style.width = w + 'px'; svg.style.height = (w * vb.height / vb.width) + 'px'; svg.style.margin = '0 auto'; }
    scrollToIsland(Math.min(KG.store.get(KEY + ':pos', 0) || 0, furthest()), false);
  }
  function scrollToIsland(i, smooth) {
    const sc = mapEl && mapEl.querySelector('#mscroll'), svg = $('mapSvg');
    if (!sc || !svg) return;
    const land = mapEl.classList.contains('land'), P = islandPos(land)[i], vb = svg.viewBox.baseVal;
    const k = (land ? svg.clientHeight / vb.height : svg.clientWidth / vb.width) || 1;
    if (land) sc.scrollTo({ left: P.x * k - sc.clientWidth / 2, behavior: smooth ? 'smooth' : 'auto' });
    else sc.scrollTo({ top: P.y * k - sc.clientHeight / 2, behavior: smooth ? 'smooth' : 'auto' });
  }
  function walkTo(from, to) {
    const seg = mapEl && mapEl.querySelectorAll('#mapSvg .seg');
    if (!seg || !seg.length) return;
    const exp = $('mapExp');
    exp.classList.add('walk');
    walker = { from, i: from, t: 0, to, exp };
    KG.say('出發！前往' + ISLANDS[to].name + '！');
  }
  function stepWalker(dt) {
    const w = walker;
    if (!w || !mapEl || !document.body.contains(mapEl)) { walker = null; return; }
    const seg = mapEl.querySelector(`#mapSvg .seg[data-i="${w.i}"]`);
    if (!seg) { walker = null; return; }
    const L = seg.getTotalLength();
    const prevT = w.t;
    w.t = Math.min(1, w.t + dt * 140 / L);
    const p = seg.getPointAtLength(L * Kit.E.inOut(w.t)), p0 = seg.getPointAtLength(L * Kit.E.inOut(prevT));
    w.exp.setAttribute('transform', `translate(${(p.x + EXP_OFF.x).toFixed(1)} ${(p.y + EXP_OFF.y).toFixed(1)})`);
    if (Math.abs(p.x - p0.x) > 0.05) $('mapExpFlip').setAttribute('transform', p.x < p0.x ? 'scale(-1 1)' : '');
    if (Math.floor(w.t * 8) !== Math.floor(prevT * 8)) KG.note(Math.floor(w.t * 8) % 2 ? 660 : 520, 0.05, 'triangle', 0.06);
    // 地圖跟著捲動
    const sc = mapEl.querySelector('#mscroll'), svg = $('mapSvg'), vb = svg.viewBox.baseVal;
    if (mapEl.classList.contains('land')) { const k = svg.clientHeight / vb.height; sc.scrollLeft = p.x * k - sc.clientWidth / 2; }
    else { const k = svg.clientWidth / vb.width; sc.scrollTop = p.y * k - sc.clientHeight / 2; }
    if (w.t >= 1) {
      w.i++; w.t = 0;
      if (w.i >= w.to) {
        walker = null;
        w.exp.classList.remove('walk');
        $('mapExpFlip').setAttribute('transform', '');
        KG.store.set(KEY + ':pos', w.to);
        KG.sound('win');
        const r = w.exp.getBoundingClientRect();
        Kit.FX.burst(r.left + r.width / 2, r.top + r.height / 2, { n: 24, speed: 380 });
        Kit.callout('抵達' + ISLANDS[w.to].name + '！', '#ffd34d', '#165f7c');
        KG.say('抵達' + ISLANDS[w.to].name + '！');
        if (w.exp.animate) w.exp.firstElementChild.animate([{ transform: 'translateY(0)' }, { transform: 'translateY(-26px)' }, { transform: 'translateY(0)' }], { duration: 500, easing: 'ease-out', iterations: 2 });
      }
    }
  }
  function tapIsland(i) {
    if (!islandUnlocked(i)) {
      KG.sound('wrong');
      Kit.shake(mapEl.querySelector('#mscroll'), 4, 250);
      KG.say('先完成' + ISLANDS[i - 1].name + '的拼圖挑戰，就可以去囉！');
      Kit.callout('還沒開放', '#cfc6da', '#5a4a6a');
      return;
    }
    KG.sound('pop');
    showIsland(i);
  }
  function showIsland(i) {
    const I = ISLANDS[i];
    document.querySelectorAll('#islOv').forEach(x => x.remove());
    const ov = document.createElement('div');
    ov.className = 'kit-ov'; ov.id = 'islOv';
    let dots = '';
    if (!I.mixed) for (let n = 1; n <= 9; n++) { const lv = level(FACTS[fk(I.t, n)]); dots += `<span class="lv${lv}" title="${LEVEL_NAMES[lv]}">${I.t}×${n}</span>`; }
    let list = '';
    let nextS = -1;
    for (let s = 0; s < NS; s++) if (stageUnlocked(i, s) && !starsOf(i, s) && nextS < 0) nextS = s;
    for (let s = 0; s < NS; s++) {
      const un = stageUnlocked(i, s);
      list += `<button class="sbtn${s === 4 ? ' boss' : ''}${un ? '' : ' locked'}${s === nextS ? ' next' : ''}" data-s="${s}" style="animation-delay:${(s * 0.05).toFixed(2)}s">` +
        `<span class="no">${un ? (s === 4 ? '<svg viewBox="0 0 100 100"><path d="M50 10 L62 38 L92 40 L68 58 L78 88 L50 70 L22 88 L32 58 L8 40 L38 38 Z" fill="#fff"/></svg>' : s + 1) : '<svg viewBox="0 0 100 100"><rect x="22" y="44" width="56" height="42" rx="10" fill="#fff"/><path d="M34 46 V34 a16 16 0 0 1 32 0 V46" stroke="#fff" stroke-width="10" fill="none"/></svg>'}</span>` +
        `<span class="nm">${stageName(i, s)}<small>${(I.mixed ? STAGE_DESC_MIX : STAGE_DESC)[s]}</small></span><span class="st">${Kit.starRow(starsOf(i, s))}</span></button>`;
    }
    ov.innerHTML = `<div class="icard"><button class="xbtn" aria-label="關閉"><svg viewBox="0 0 100 100"><use href="#ic-close"/></svg></button>` +
      `<div class="ihead">${landmarkSVG(i)}<div><h2>${I.name}</h2><div class="isub">${islTitle(i)}</div></div></div>` +
      (dots ? `<div class="dots">${dots}</div>` : '<div style="height:8px"></div>') +
      `<div class="slist">${list}</div>` +
      (I.mixed ? '' : `<div class="irow"><button class="tbtn" id="studyBtn"><svg viewBox="0 0 100 100"><use href="#ic-book"/></svg>口訣表</button></div>`) + '</div>';
    ov.querySelector('.xbtn').addEventListener('click', () => { KG.sound('click'); ov.remove(); });
    ov.addEventListener('click', e => { if (e.target === ov) { KG.sound('click'); ov.remove(); } });
    ov.querySelectorAll('.sbtn').forEach(b => b.addEventListener('click', () => {
      const s = +b.dataset.s;
      if (!stageUnlocked(i, s)) { KG.sound('wrong'); Kit.shake(b, 6); KG.say(s === 4 ? '先完成拼圖挑戰，魔王就會出現！' : '先完成前一關喔！'); return; }
      KG.sound('pop'); ov.remove(); startStage(i, s);
    }));
    const sb = ov.querySelector('#studyBtn');
    if (sb) sb.addEventListener('click', () => { KG.sound('pop'); ov.remove(); showLearn(i, false); });
    document.body.appendChild(ov);
    KG.say(I.name + '，' + (I.mixed ? '綜合大挑戰' : cnNum(I.t) + '的乘法'));
  }

  /* ---------- 貼紙簿 ---------- */
  function showStickers() {
    closeScreens();
    game.mode = 'stickers';
    const ov = document.createElement('div');
    ov.className = 'kit-screen'; ov.id = 'stkScr';
    ov.style.background = 'linear-gradient(180deg, rgba(160,226,255,.97), rgba(232,250,255,.98))';
    const tot = totalStars();
    ov.innerHTML = `<div class="kit-banner">我的貼紙簿</div><div class="kit-total">${Kit.ICON.star(true)}<span>${tot} / ${MAXSTARS}</span></div>` +
      `<div class="pcard" style="text-align:center"><div class="kit-shelf-title" style="color:#165f7c">集星星換貼紙！</div><div class="kit-shelf" id="shelf"></div></div>` +
      `<div class="row-btns"><button class="kit-bigbtn small alt" id="backMap">${Kit.ICON.back()}<span>回地圖</span></button></div>`;
    const shelf = ov.querySelector('#shelf');
    STICKERS.forEach((s, k) => {
      const un = tot >= s.need;
      const b = document.createElement('button');
      b.className = 'stk' + (un ? '' : ' locked');
      b.innerHTML = stickerSVG(s, k) + (un ? `<span>${s.name}</span>` : `<span class="need">${Kit.ICON.star(true)}${s.need}</span>`);
      b.addEventListener('click', () => {
        if (!un) { KG.sound('wrong'); Kit.shake(b, 5); KG.say('再集' + cnNum(Math.min(99, s.need - tot)) + '顆星星，就可以得到喔！'); return; }
        KG.sound('sparkle'); KG.say(s.name);
        const r = b.getBoundingClientRect();
        Kit.FX.burst(r.left + r.width / 2, r.top + r.height / 2, { n: 12, types: ['star', 'spark'] });
        b.animate([{ transform: 'scale(1)' }, { transform: 'scale(1.2) rotate(-6deg)' }, { transform: 'scale(1)' }], { duration: 400, easing: 'cubic-bezier(.2,1.6,.4,1)' });
      });
      shelf.appendChild(b);
    });
    ov.querySelector('#backMap').addEventListener('click', () => { KG.sound('pop'); showMap(); });
    document.body.appendChild(ov);
  }

  /* ---------- 家長專區 ---------- */
  function fmtDue(due, now) {
    const d = due - now;
    if (d <= 0) return '現在';
    if (d < 3600000) return Math.max(1, Math.round(d / MIN)) + ' 分鐘後';
    if (d < DAY) return Math.round(d / 3600000) + ' 小時後';
    return Math.round(d / DAY) + ' 天後';
  }
  function stats(now) {
    now = now == null ? Date.now() : now;
    let seen = 0, n = 0, c = 0, rtSum = 0, rtN = 0;
    const lv = [0, 0, 0, 0, 0];
    ALLKEYS.forEach(k => {
      const s = FACTS[k];
      lv[level(s)]++;
      if (s && s.n) { seen++; n += s.n; c += s.c; if (s.rt) { rtSum += s.rt; rtN++; } }
    });
    const weak = ALLKEYS.filter(k => FACTS[k] && FACTS[k].n && (level(FACTS[k]) === 1 || (level(FACTS[k]) === 2 && FACTS[k].c < FACTS[k].n))).sort((x, y) => score(FACTS[x]) - score(FACTS[y])).slice(0, 8);
    return { seen, attempts: n, correct: c, acc: n ? c / n : 0, avgRt: rtN ? rtSum / rtN : 0, due: dueCount(now), levels: lv, weak };
  }
  function showParent() {
    closeScreens();
    game.mode = 'parent';
    const now = Date.now(), S = stats(now);
    const ov = document.createElement('div');
    ov.className = 'kit-screen'; ov.id = 'parentScr';
    ov.style.background = 'linear-gradient(180deg, rgba(220,212,255,.97), rgba(240,250,255,.98))';
    let heat = '<div class="hc hd">×</div>';
    for (let b = 1; b <= 9; b++) heat += `<div class="hc hd">${b}</div>`;
    for (let a = 1; a <= 9; a++) {
      heat += `<div class="hc hd">${a}</div>`;
      for (let b = 1; b <= 9; b++) { const lv = level(FACTS[fk(a, b)]); heat += `<button class="hc lv${lv}" data-k="${fk(a, b)}" aria-label="${a}乘${b}，${LEVEL_NAMES[lv]}">${a * b}</button>`; }
    }
    const leg = LEVEL_NAMES.map((n, i) => `<span><i class="lv${i}"></i>${n}（${S.levels[i]}）</span>`).join('');
    ov.innerHTML = `<div class="kit-banner">家長專區</div>
      <div class="pcard"><h3>九九乘法熟練度地圖</h3><div class="heat" id="heat">${heat}</div><div class="legend">${leg}</div>
        <div class="pdetail" id="pdetail">點一格，可以看那一題的作答紀錄。（橫列 = 被乘數，直行 = 乘數）</div></div>
      <div class="pcard"><div class="stats">
        <div class="stat"><b>${S.seen}<small style="font-size:14px">/81</small></b><span>練習過的題目</span></div>
        <div class="stat"><b>${Math.round(S.acc * 100)}%</b><span>答對率</span></div>
        <div class="stat"><b>${S.avgRt ? (S.avgRt / 1000).toFixed(1) + 's' : '-'}</b><span>平均作答時間</span></div>
        <div class="stat"><b>${S.due}</b><span>現在該複習</span></div></div></div>
      <div class="pcard"><h3>需要加強的題目</h3><div class="chips">${S.weak.length ? S.weak.map(k => { const f = parseKey(k); return `<button class="chip" data-k="${k}">${f.a} × ${f.b} = ${f.a * f.b}</button>`; }).join('') : '<span class="pnote">目前沒有特別弱的題目，繼續保持！</span>'}</div>
        <p class="pnote">系統會記錄每一題的連續答對次數與作答速度，用「間隔複習」安排複習時間：越不熟的題目越快再出現；地圖上的「複習站」會優先出到期的題目。</p></div>
      <div class="pcard"><h3>魔王快問快答計時</h3><div class="seg" id="tmSeg"><button data-m="relax">輕鬆（每題 20 秒）</button><button data-m="normal">普通（每題 10 秒）</button><button data-m="off">不計時</button></div>
        <p class="pnote">只有每座島最後的「魔王快問快答」會計時，而且可以不玩；其他關卡都沒有時間限制。</p></div>
      <div class="pcard" style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap"><span class="pnote" style="margin:0">清除所有星星、貼紙與熟練度紀錄</span><button class="rstbtn" id="rstBtn">重設進度</button></div>
      <div class="row-btns"><button class="kit-bigbtn small alt" id="backMap">${Kit.ICON.back()}<span>回地圖</span></button></div>`;
    const det = ov.querySelector('#pdetail');
    const showK = k => {
      const f = parseKey(k), s = FACTS[k], lv = level(s);
      ov.querySelectorAll('.hc.sel').forEach(x => x.classList.remove('sel'));
      const cell = ov.querySelector(`.hc[data-k="${k}"]`); if (cell) cell.classList.add('sel');
      det.innerHTML = `<b>${f.a} × ${f.b} = ${f.a * f.b}</b>　口訣「${chant(f.a, f.b)}」<br>` + (s && s.n
        ? `${LEVEL_NAMES[lv]}・答對 ${s.c} / ${s.n} 次・連續答對 ${s.st} 次${s.rt ? '・平均 ' + (s.rt / 1000).toFixed(1) + ' 秒' : ''}・下次複習：${fmtDue(s.due, Date.now())}`
        : '還沒有練習過這一題');
      KG.say(chant(f.a, f.b), 0.9);
    };
    ov.querySelectorAll('.hc[data-k], .chip[data-k]').forEach(c => c.addEventListener('click', () => { KG.sound('click'); showK(c.dataset.k); }));
    const seg = ov.querySelector('#tmSeg');
    const paint = () => seg.querySelectorAll('button').forEach(b => b.classList.toggle('on', b.dataset.m === bossTimerMode));
    paint();
    seg.querySelectorAll('button').forEach(b => b.addEventListener('click', () => { bossTimerMode = b.dataset.m; KG.store.set(KEY + ':bossTimer', bossTimerMode); KG.sound('click'); paint(); }));
    const rst = ov.querySelector('#rstBtn');
    let armed = 0;
    rst.addEventListener('click', () => {
      if (!armed) { armed = setTimeout(() => { armed = 0; rst.textContent = '重設進度'; rst.classList.remove('warn'); }, 3000); rst.textContent = '再按一次確認'; rst.classList.add('warn'); KG.sound('boing'); return; }
      clearTimeout(armed); armed = 0;
      resetAll();
      KG.sound('whoosh');
      showParent();
    });
    ov.querySelector('#backMap').addEventListener('click', () => { KG.sound('pop'); showMap(); });
    document.body.appendChild(ov);
  }
  function resetAll() {
    FACTS = {}; saveFacts();
    STARS = []; while (STARS.length < NI * NS) STARS.push(0); KG.store.set(KEY + ':stars', STARS);
    KG.store.set(KEY + ':pos', 0); KG.store.set(KEY + ':reviews', 0);
  }

  /* ---------- 畫面切換 ---------- */
  function closeScreens() {
    clearTimeout(game.timer);
    hopTimers.forEach(clearTimeout); hopTimers = [];
    walker = null;
    document.querySelectorAll('.kit-screen, .kit-ov, .kit-title, #mapScr').forEach(el => { el.classList.add('out'); el.id = ''; setTimeout(() => el.remove(), 300); });
    mapEl = null;
  }

  /* ---------- 暫停 ---------- */
  function pause() {
    if (game.mode !== 'play' && game.mode !== 'learn') return;
    if ($('pauseOv')) return;
    game.paused = true;
    KG.sound('click');
    stopReadAll();
    if (window.speechSynthesis) try { speechSynthesis.cancel(); } catch (e) { /* 忽略 */ }
    const ov = document.createElement('div');
    ov.className = 'kit-ov'; ov.id = 'pauseOv';
    ov.innerHTML = `<div class="pz-card"><div class="ow">${explorerSVG('pz')}</div><h2>休息一下</h2><div class="kit-rbtns"></div></div>`;
    const bx = ov.querySelector('.kit-rbtns');
    const add = (cls, icon, text, fn) => { const el = document.createElement('button'); el.className = 'kit-rbtn ' + cls; el.innerHTML = `<div class="b">${icon}</div><span>${text}</span>`; el.addEventListener('click', () => { KG.sound('pop'); ov.remove(); fn(); }); bx.appendChild(el); };
    add('b2', Kit.ICON.menu(), '地圖', () => { game.paused = false; showMap(); });
    add('g big', Kit.ICON.play(), '繼續', () => { game.paused = false; lastT = performance.now(); });
    document.body.appendChild(ov);
  }
  $('pauseBtn').addEventListener('click', pause);

  /* ---------- 鍵盤 ---------- */
  window.addEventListener('keydown', e => {
    if (e.key === 'Escape' || e.key === 'p') { const po = $('pauseOv'); if (po) po.querySelector('.kit-rbtn.g').click(); else if (game.mode === 'play' || game.mode === 'learn') pause(); else { const io = $('islOv'); if (io) io.remove(); } return; }
    if (game.mode !== 'play' || $('pauseOv')) return;
    const q = game.q;
    if (!q) return;
    if (q.kind === 'type') {
      if (/^[0-9]$/.test(e.key)) { padKey(e.key); return; }
      if (e.key === 'Backspace') { e.preventDefault(); padKey('del'); return; }
      if (e.key === 'Enter') { padKey('ok'); return; }
    } else if (/^[1-4]$/.test(e.key)) { const b = ansEl.querySelectorAll('.opt')[+e.key - 1]; if (b) b.click(); return; }
    if (e.key === ' ') { e.preventDefault(); sayQ(); }
  });

  /* ---------- 版面 ---------- */
  let laying = false;
  function layout() {
    if (laying) return;
    laying = true;
    const ar = app.getBoundingClientRect();
    const land = ar.width > ar.height * 1.15;
    app.classList.toggle('land', land);
    const q = game.q;
    if (game.mode === 'play' && q) {
      if (q.kind === 'array') drawArray();
      if (q.kind === 'grid') sizeGrid();
    }
    laying = false;
  }
  let rzT = 0;
  function onResize() { layout(); clearTimeout(rzT); rzT = setTimeout(() => { layout(); layoutMap(false); }, 120); }
  window.addEventListener('resize', onResize);
  if (window.visualViewport) visualViewport.addEventListener('resize', onResize);
  window.addEventListener('orientationchange', () => setTimeout(onResize, 150));
  if (window.ResizeObserver) { const ro = new ResizeObserver(() => { if (!laying) layout(); }); ro.observe(stage); }
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) {
      if (window.speechSynthesis) try { speechSynthesis.cancel(); } catch (e) { /* 忽略 */ }
      if (game.mode === 'play' && game.boss && game.tMax) pause();
    } else lastT = performance.now();
  });

  /* ---------- 主迴圈（魔王計時、地圖走路） ---------- */
  let lastT = performance.now();
  function loop(now) {
    const dt = Math.min(0.05, Math.max(0, (now - lastT) / 1000)); lastT = now;
    if (game.mode === 'play' && game.boss && game.tMax && game.q && game.q.kind === 'boss' && !game.answered && !game.busy && !game.paused && !document.hidden) {
      game.tLeft -= dt;
      const bar = $('tbarI');
      if (bar) bar.style.width = Math.max(0, game.tLeft / game.tMax * 100).toFixed(1) + '%';
      const sec = Math.ceil(game.tLeft);
      if (sec <= 3 && sec !== game.lastSec && sec > 0) { game.lastSec = sec; KG.sound('tick'); const tb = $('tbar'); if (tb) tb.classList.add('warn'); }
      if (game.tLeft <= 0) bossTimeout();
    }
    if (walker) stepWalker(dt);
    requestAnimationFrame(loop);
  }

  /* ---------- 標題 ---------- */
  function titleHero() {
    return `<svg viewBox="0 0 220 220" style="width:100%;height:100%;overflow:visible">
      <ellipse cx="110" cy="172" rx="108" ry="34" fill="#6fd3f0"/><ellipse cx="110" cy="166" rx="94" ry="26" fill="#ffe3a3" stroke="#e0b060" stroke-width="3"/>
      <ellipse cx="100" cy="160" rx="70" ry="16" fill="#8fd96a"/>
      <g transform="translate(20 52) scale(1.05)">${LANDMARK[0]}</g>
      <g transform="translate(104 60) scale(.72)" class="exp-svg">${explorerInner('t')}</g>
      <g font-family="var(--kg-font)" font-weight="900">
        <g transform="translate(18 26) rotate(-8)"><rect x="-6" y="-24" width="64" height="34" rx="17" fill="#fff" stroke="#ff9a3c" stroke-width="3"/><text x="26" y="0" text-anchor="middle" font-size="22" fill="#ff6a3d">2×3</text></g>
        <g transform="translate(150 22) rotate(8)"><rect x="-6" y="-24" width="68" height="34" rx="17" fill="#fff" stroke="#3a9ee8" stroke-width="3"/><text x="28" y="0" text-anchor="middle" font-size="22" fill="#2f86cc">9×9</text></g>
      </g></svg>`;
  }
  function showTitle() {
    game.mode = 'title';
    showGame(false);
    Kit.title({
      logo: '九九乘法大冒險', colors: ['#ff9a3c', '#ff5f7e', '#2f8fe8', '#46b864', '#8f5bf0'], stroke: '#165f7c',
      bg: 'radial-gradient(circle at 50% 40%, rgba(255,255,255,.6), rgba(255,255,255,0) 60%), linear-gradient(180deg, #9fe2ff 0%, #d9f6ff 55%, #fff1cc 100%)',
      hero: titleHero(),
      sub: '跟小探險家一起，闖過九座乘法島！',
      buttons: [{ text: '開始冒險', onClick: () => { KG.say('九九乘法大冒險！我們出發吧！'); showMap(); } }]
    });
  }

  /* ---------- 開始 ---------- */
  addItemDefs();
  $('starIc').innerHTML = Kit.ICON.star(true);
  Kit.ensureDefs();
  layout();
  requestAnimationFrame(loop);
  showTitle();

  /* ---------- 測試掛鉤 ---------- */
  window.__tt9 = {
    ISLANDS, STICKERS, INTERVAL, FAST,
    get state() {
      const q = game.q;
      return { mode: game.mode, isl: game.isl, st: game.st, review: game.review, qi: game.qi, total: game.plan.length, first: game.first, busy: game.busy, answered: game.answered, wrong: game.wrong,
        q: q && { kind: q.kind, a: q.a, b: q.b, p: q.p, val: q.val, opts: q.opts, key: q.key }, typed: game.typed, boss: game.boss && Object.assign({}, game.boss), tLeft: game.tLeft, tMax: game.tMax,
        grid: game.grid && { blanks: game.grid.blanks.slice(), done: Array.from(game.grid.done), hidden: Array.from(game.grid.hidden) }, stars: totalStars(), furthest: furthest(), paused: game.paused };
    },
    start(isl, st) { return startStage(isl, st || 0, true); },
    learn: i => showLearn(i, true),
    answer(v) {
      const q = game.q;
      if (!q) return false;
      if (q.kind === 'type') { game.typed = String(v); const t = $('tans'); if (t) t.textContent = game.typed; return submit(+v, null); }
      const btn = Array.from(ansEl.querySelectorAll('.opt')).find(o => +o.dataset.v === +v);
      return submit(+v, btn || null);
    },
    correct() { return game.q ? this.answer(game.q.val) : false; },
    skip() { clearTimeout(game.timer); next(); },
    facts() { return ALLKEYS.map(k => { const { a, b } = parseKey(k); return { a, b, p: a * b, key: k, chant: chant(a, b) }; }); },
    mastery() { return JSON.parse(JSON.stringify(FACTS)); },
    level: k => level(FACTS[k]),
    chant, chantProduct, cnNum,
    distractors: (a, b) => distractorPool(a, b),
    pick: (a, b, n) => pickDistractors(a, b, n || 3),
    record: (a, b, ok, ms, now, kind) => record(a, b, ok, ms, now, kind),
    pickReview, dueCount, stats, weightedFacts,
    resetAll() { resetAll(); },
    map: showMap, review: startReview, parent: showParent, stickers: showStickers, title: showTitle, pause,
    island: showIsland, selectBlank,
    setStars(arr) { arr.forEach((v, i) => { STARS[i] = v; }); KG.store.set(KEY + ':stars', STARS); },
    setTimerMode(m) { bossTimerMode = m; KG.store.set(KEY + ':bossTimer', m); },
    tick(sec) { game.tLeft -= sec; }
  };
})();

</script>
</body>
</html>
