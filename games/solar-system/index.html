<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>太陽系探險</title>
<link rel="stylesheet" href="../../assets/common.css">
<style>
  :root {
    --ink: #eef3ff; --sub: #a9b8e8; --gold: #ffd166; --cyan: #5ce1e6; --pink: #ff8fb1; --green: #5be49b; --red: #ff6b81;
    --card: rgba(16, 22, 58, 0.93); --line: rgba(140, 165, 255, 0.28);
    --f: "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", "Heiti TC", system-ui, sans-serif;
    --barH: 140px;
  }
  html, body { height: 100%; overflow: hidden; background: #050817; color: var(--ink); font-family: var(--f); }
  #gl { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; outline: none; }
  #msg { position: fixed; inset: 0; z-index: 400; display: grid; place-items: center; padding: 24px; text-align: center; color: #cfe0ff;
         font-size: 20px; font-weight: 800; background: radial-gradient(circle at 50% 45%, #1a2160, #050817 70%); }
  .hidden { display: none !important; }
  button { font-family: var(--f); -webkit-tap-highlight-color: transparent; }
  #labels { position: fixed; inset: 0; pointer-events: none; z-index: 50; overflow: hidden; }
  .lbl { position: absolute; left: 0; top: 0; white-space: nowrap; font-size: 13px; font-weight: 800; color: #fff; text-align: center;
         text-shadow: 0 1px 3px #000, 0 0 6px rgba(0,0,0,.8); transform: translate(-999px,-999px); will-change: transform; }
  .lbl i { display: block; width: 7px; height: 7px; border-radius: 50%; background: var(--gold); margin: 0 auto 2px; box-shadow: 0 0 6px var(--gold); font-style: normal; }
  .lbl small { display: block; font-size: 11px; color: var(--gold); }
  .lbl.tgt { font-size: 15px; color: var(--gold); }

  .screen { position: fixed; inset: 0; z-index: 100; pointer-events: none; }
  .screen > * { pointer-events: auto; }
  .btn { font: 800 18px var(--f); color: #241a00; background: linear-gradient(#ffe28f, #ffb53f); border: none; border-radius: 16px; padding: 11px 18px;
         box-shadow: 0 4px 0 #b97a10, 0 8px 16px rgba(0,0,0,.35); cursor: pointer; white-space: nowrap; transition: transform .08s; }
  .btn:active { transform: translateY(3px); box-shadow: 0 1px 0 #b97a10, 0 4px 8px rgba(0,0,0,.35); }
  .btn.cyan { background: linear-gradient(#a6f4ff, #3cc6e8); box-shadow: 0 4px 0 #1f86a3, 0 8px 16px rgba(0,0,0,.35); color: #062a36; }
  .btn.ghost { background: rgba(255,255,255,.12); color: #fff; box-shadow: inset 0 0 0 2px rgba(255,255,255,.35); }
  .btn.pink { background: linear-gradient(#ffc2d4, #ff7aa2); box-shadow: 0 4px 0 #c24470, 0 8px 16px rgba(0,0,0,.35); color: #4a0d24; }
  .btn:disabled { filter: grayscale(.8) brightness(.7); cursor: default; }
  .pill { position: fixed; top: 12px; left: 50%; transform: translateX(-50%); max-width: calc(100% - 132px); padding: 8px 16px; border-radius: 999px;
          background: rgba(10,14,40,.78); box-shadow: inset 0 0 0 2px var(--line); font-weight: 800; font-size: 16px; text-align: center; white-space: nowrap;
          overflow: hidden; text-overflow: ellipsis; pointer-events: none !important; }
  #pauseBtn { position: fixed; right: 10px; top: 66px; width: 48px; height: 48px; border-radius: 50%; z-index: 290; border: 3px solid #fff;
              background: linear-gradient(#3b4aa8, #1c2462); color: #fff; font-size: 18px; font-weight: 900; cursor: pointer; box-shadow: 0 4px 12px rgba(0,0,0,.4); }

  /* ---------- 標題 ---------- */
  #sTitle { display: flex; align-items: center; justify-content: center; pointer-events: none; }
  .tWrap { width: min(560px, calc(100% - 24px)); display: flex; flex-direction: column; align-items: center; gap: 14px; padding: 64px 0 16px; max-height: 100%; overflow: auto; }
  .logo { text-align: center; pointer-events: none; }
  .logo h1 { margin: 0; font-size: clamp(40px, 11vw, 70px); line-height: 1.05; letter-spacing: 4px; font-weight: 900;
             background: linear-gradient(#fff8d2, #ffd166 45%, #ff9a3c); -webkit-background-clip: text; background-clip: text; color: transparent;
             filter: drop-shadow(0 0 14px rgba(255,170,70,.55)) drop-shadow(0 4px 0 rgba(90,40,0,.5)); }
  .logoSub { font-size: 15px; color: var(--cyan); font-weight: 800; letter-spacing: 3px; margin-bottom: 4px; }
  .menu { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; width: 100%; }
  .mbtn { display: grid; grid-template-columns: 44px 1fr; grid-template-rows: auto auto; align-items: center; text-align: left; column-gap: 8px;
          padding: 10px 12px; border: none; border-radius: 18px; cursor: pointer; color: #fff; background: rgba(18,26,74,.82);
          box-shadow: inset 0 0 0 2px rgba(140,170,255,.35), 0 6px 16px rgba(0,0,0,.35); transition: transform .08s; }
  .mbtn:active { transform: scale(.96); }
  .mbtn canvas, .mbtn img { grid-row: 1 / 3; width: 44px; height: 44px; }
  .mbtn span { font-size: 18px; font-weight: 900; }
  .mbtn small { font-size: 12px; color: var(--sub); }
  .mbtn.main { background: linear-gradient(135deg, rgba(255,170,60,.92), rgba(255,110,90,.9)); box-shadow: 0 5px 0 #9c3f1c, 0 8px 18px rgba(0,0,0,.35); }
  .mbtn.main small { color: #ffe9c9; }
  .trow { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
  .tog { font: 800 15px var(--f); padding: 8px 14px; border-radius: 999px; border: none; cursor: pointer; color: #fff; background: rgba(255,255,255,.12);
         box-shadow: inset 0 0 0 2px rgba(255,255,255,.3); }
  .tog.on { background: rgba(92,225,230,.25); box-shadow: inset 0 0 0 2px var(--cyan); }
  @media (orientation: landscape) and (max-height: 500px) {
    .tWrap { width: min(760px, calc(100% - 130px)); padding: 8px 0; gap: 8px; }
    .logo h1 { font-size: 40px; }
    .logoSub { font-size: 13px; margin-bottom: 0; }
    .menu { grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
    .mbtn { padding: 7px 10px; grid-template-columns: 36px 1fr; }
    .mbtn img { width: 36px; height: 36px; }
    .mbtn span { font-size: 16px; }
  }
  .hint.low { top: auto; bottom: calc(var(--barH) + 18px); }
  .bests { font-size: 13px; color: var(--sub); text-align: center; pointer-events: none; }

  /* ---------- 探索 ---------- */
  .ebar { position: fixed; left: 8px; right: 8px; bottom: calc(8px + env(safe-area-inset-bottom)); display: flex; gap: 8px; align-items: flex-end; pointer-events: none; }
  .ebar > * { pointer-events: auto; }
  .tools { display: flex; gap: 6px; flex: 0 0 auto; }
  .tool { width: 66px; height: 58px; border: none; border-radius: 14px; background: rgba(14,20,58,.86); color: #fff; cursor: pointer; padding: 4px 2px;
          box-shadow: inset 0 0 0 2px rgba(140,170,255,.3); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; }
  .tool b { font-size: 19px; line-height: 1; }
  .tool span { font-size: 11.5px; font-weight: 800; white-space: nowrap; }
  .tool.on { background: rgba(255,190,70,.3); box-shadow: inset 0 0 0 2px var(--gold); }
  .chips { display: flex; gap: 6px; overflow-x: auto; overflow-y: hidden; flex: 1 1 auto; min-width: 0; padding: 2px; scrollbar-width: none; touch-action: pan-x; }
  .chips::-webkit-scrollbar { display: none; }
  .chip { flex: 0 0 auto; width: 58px; height: 64px; border: none; border-radius: 14px; background: rgba(14,20,58,.86); color: #fff; cursor: pointer;
          box-shadow: inset 0 0 0 2px rgba(140,170,255,.25); display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 2px; }
  .chip img { width: 38px; height: 38px; }
  .chip span { font-size: 12px; font-weight: 800; white-space: nowrap; }
  .chip.on { background: rgba(92,225,230,.26); box-shadow: inset 0 0 0 2px var(--cyan); }
  .hint { position: fixed; left: 50%; top: 58px; transform: translateX(-50%); max-width: calc(100% - 140px); font-size: 13px; font-weight: 700; color: #dfe7ff;
          background: rgba(10,14,40,.7); padding: 6px 12px; border-radius: 12px; text-align: center; pointer-events: none !important; transition: opacity .5s; }
  @media (orientation: portrait) {
    .ebar { flex-direction: column; align-items: stretch; }
    .tools { justify-content: space-between; }
    .tool { flex: 1 1 0; width: auto; }
  }

  .card { position: fixed; z-index: 120; background: var(--card); border-radius: 20px; box-shadow: inset 0 0 0 2px var(--line), 0 12px 30px rgba(0,0,0,.5);
          display: flex; flex-direction: column; overflow: hidden; animation: cardIn .28s ease-out;
          left: 8px; right: 8px; bottom: calc(var(--barH) + 14px); max-height: min(48%, 440px); }
  @keyframes cardIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: none; } }
  .card .x { position: absolute; right: 8px; top: 8px; width: 38px; height: 38px; border-radius: 50%; border: none; background: rgba(255,255,255,.12); color: #fff; font-size: 18px; cursor: pointer; }
  .cHead { display: flex; gap: 10px; align-items: center; padding: 12px 52px 6px 12px; }
  .cHead img { width: 54px; height: 54px; flex: 0 0 auto; }
  .cHead h2 { margin: 0; font-size: 24px; color: var(--gold); }
  .cHead p { margin: 2px 0 0; font-size: 14px; color: var(--sub); font-weight: 700; }
  .cBody { overflow-y: auto; padding: 4px 12px 8px; flex: 1 1 auto; touch-action: pan-y; }
  .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  .stat { background: rgba(255,255,255,.06); border-radius: 12px; padding: 6px 9px; }
  .stat b { display: block; font-size: 12px; color: var(--cyan); }
  .stat span { font-size: 14px; font-weight: 700; }
  .facts { margin: 10px 0 2px; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 6px; }
  .facts li { font-size: 15px; line-height: 1.45; padding: 7px 10px 7px 34px; background: rgba(255,209,102,.09); border-radius: 12px; position: relative; }
  .facts li::before { content: attr(data-n); position: absolute; left: 8px; top: 7px; width: 20px; height: 20px; border-radius: 50%; background: var(--gold); color: #3a2500;
                      font-size: 12px; font-weight: 900; display: grid; place-items: center; }
  .cFoot { display: flex; gap: 8px; padding: 8px 12px 12px; justify-content: center; flex-wrap: wrap; flex: 0 0 auto; }
  .cFoot .btn { font-size: 16px; padding: 9px 14px; }
  @media (orientation: landscape) {
    .card { left: auto; right: 68px; width: min(340px, 44%); max-height: calc(100% - var(--barH) - 24px); bottom: calc(var(--barH) + 14px); }
  }
  @media (orientation: landscape) and (max-height: 559px) { body.cardOpen #eTitle, body.cardOpen #eHint { opacity: 0 !important; } }
  @media (orientation: landscape) and (min-height: 560px) {
    .card { width: min(380px, 40%); max-height: calc(100% - var(--barH) - 84px); }
  }

  /* ---------- 任務 ---------- */
  .mdots { position: fixed; top: 56px; left: 50%; transform: translateX(-50%); display: flex; gap: 4px; pointer-events: none !important; }
  .mdots img { width: 22px; height: 22px; opacity: .45; border-radius: 50%; }
  .mdots img.done { opacity: 1; box-shadow: 0 0 0 2px var(--green); }
  .mdots img.cur { opacity: 1; box-shadow: 0 0 0 2px var(--gold); transform: scale(1.2); }
  #arrow { position: fixed; left: 0; top: 0; width: 0; height: 0; pointer-events: none !important; }
  #arrow .ah { position: absolute; left: -16px; top: -16px; width: 32px; height: 32px; }
  #arrow .ah::before { content: ''; position: absolute; left: 4px; top: 6px; border-left: 24px solid var(--gold); border-top: 10px solid transparent; border-bottom: 10px solid transparent;
                       filter: drop-shadow(0 0 4px rgba(255,200,80,.9)); }
  #arrow img { position: absolute; left: -15px; top: -15px; width: 30px; height: 30px; }
  #joy { position: fixed; left: 26px; bottom: 26px; width: 124px; height: 124px; margin: 0; border-radius: 50%; background: rgba(255,255,255,.08);
         box-shadow: inset 0 0 0 3px rgba(255,255,255,.25); pointer-events: none !important; transition: opacity .2s; }
  #joy .knob { position: absolute; left: 37px; top: 37px; width: 50px; height: 50px; border-radius: 50%; background: radial-gradient(circle at 40% 35%, #fff, #9fc4ff);
               box-shadow: 0 3px 10px rgba(0,0,0,.4); }
  #joy.free { transition: none; }
  .fb { position: fixed; left: 50%; top: 92px; transform: translateX(-50%); font-size: 22px; font-weight: 900; color: var(--gold); white-space: nowrap;
        text-shadow: 0 2px 0 #5a3500, 0 0 10px rgba(0,0,0,.6); pointer-events: none !important; opacity: 0; }
  .fb.show { animation: fbPop 1.3s ease-out forwards; }
  @keyframes fbPop { 0% { opacity: 0; transform: translate(-50%, 10px) scale(.8); } 12% { opacity: 1; transform: translate(-50%, 0) scale(1.1); }
                     22% { transform: translate(-50%, 0) scale(1); } 75% { opacity: 1; } 100% { opacity: 0; transform: translate(-50%, -14px); } }
  .khint { position: fixed; left: 160px; bottom: 30px; font-size: 13px; color: var(--sub); pointer-events: none !important; }

  /* ---------- 面板（護照、排排看、百科） ---------- */
  .panel { pointer-events: auto; background: rgba(5,8,26,.74); display: flex; flex-direction: column; }
  .pHead { flex: 0 0 auto; margin: 10px 62px 0; min-height: 48px; display: flex; align-items: center; justify-content: center; gap: 10px; flex-wrap: wrap; text-align: center; }
  .pHead h2 { margin: 0; font-size: 24px; color: var(--gold); }
  .pMain { flex: 1 1 auto; overflow-y: auto; padding: 10px 12px; touch-action: pan-y; }
  .pFoot { flex: 0 0 auto; display: flex; gap: 10px; justify-content: center; padding: 8px 12px calc(12px + env(safe-area-inset-bottom)); flex-wrap: wrap; }
  .inner { width: min(860px, 100%); margin: 0 auto; }
  .seg { display: inline-flex; background: rgba(255,255,255,.1); border-radius: 999px; padding: 3px; }
  .seg button { border: none; background: none; color: #fff; font: 800 14px var(--f); padding: 7px 12px; border-radius: 999px; cursor: pointer; }
  .seg button.on { background: var(--gold); color: #3a2500; }

  .pass { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; max-width: 600px; margin: 0 auto; }
  .slot { position: relative; aspect-ratio: 1; border-radius: 50%; border: 3px dashed rgba(160,180,255,.4); display: grid; place-items: center; cursor: pointer; background: rgba(255,255,255,.04); }
  .slot img.ghost { width: 50%; opacity: .35; filter: grayscale(.6); }
  .slot span { position: absolute; bottom: -2px; left: 0; right: 0; text-align: center; font-size: 13px; font-weight: 800; color: var(--sub); }
  .slot img.st { position: absolute; inset: -4%; width: 108%; height: 108%; }
  .slot.has { border-color: transparent; background: none; }
  .passInfo { text-align: center; color: var(--sub); font-size: 14px; margin: 12px 0 4px; line-height: 1.5; }
  .passBook { background: linear-gradient(#f9f1dc, #efe2c0); color: #4a3b22; border-radius: 18px; padding: 14px; box-shadow: 0 10px 30px rgba(0,0,0,.45), inset 0 0 0 3px #d8c79c; }
  .passBook h3 { margin: 0 0 10px; text-align: center; font-size: 17px; color: #6b5326; letter-spacing: 2px; }
  .passBook .slot { border-color: rgba(120,95,50,.35); background: rgba(120,95,50,.06); }
  .passBook .slot span { color: #7a6438; }
  @media (orientation: landscape) and (max-height: 560px) { .pass { grid-template-columns: repeat(8, 1fr); gap: 8px; } .passBook { padding: 10px; } }

  .sortWrap { display: flex; flex-direction: column; gap: 12px; align-items: center; justify-content: center; min-height: 100%; }
  .sortTop { display: flex; align-items: center; gap: 8px; width: 100%; justify-content: center; }
  .sunTag { flex: 0 0 auto; width: 46px; text-align: center; font-size: 12px; font-weight: 800; color: var(--gold); }
  .sunTag img { width: 40px; height: 40px; display: block; margin: 0 auto; }
  .slots { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; flex: 1 1 auto; max-width: 760px; }
  .sslot { position: relative; aspect-ratio: 1; max-height: 92px; border-radius: 16px; border: 2px dashed rgba(160,180,255,.45); background: rgba(255,255,255,.04); display: grid; place-items: center; }
  .sslot > em { position: absolute; left: 5px; top: 2px; font-style: normal; font-size: 12px; font-weight: 900; color: var(--sub); }
  .sslot.hl { border-color: var(--gold); background: rgba(255,209,102,.12); }
  .sslot.ok { border-style: solid; border-color: var(--green); background: rgba(91,228,155,.14); }
  .tray { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; min-height: 84px; width: 100%; max-width: 760px; padding: 8px; border-radius: 16px; background: rgba(255,255,255,.05); }
  .piece { width: 70px; height: 80px; display: flex; flex-direction: column; align-items: center; justify-content: center; border-radius: 14px; cursor: grab; touch-action: none; }
  .piece img { pointer-events: none; }
  .piece span { font-size: 13px; font-weight: 800; pointer-events: none; }
  .piece.sel { background: rgba(255,209,102,.25); box-shadow: inset 0 0 0 2px var(--gold); }
  .piece.lift { opacity: .25; }
  .piece.bad { animation: shake .4s; }
  .sslot .piece { width: 100%; height: 100%; }
  @keyframes shake { 0%,100% { transform: none; } 20% { transform: translateX(-7px); } 40% { transform: translateX(7px); } 60% { transform: translateX(-5px); } 80% { transform: translateX(5px); } }
  #ghostPiece { position: fixed; z-index: 260; pointer-events: none; left: 0; top: 0; }
  .sortFb { text-align: center; font-size: 16px; font-weight: 800; color: #dfe7ff; min-height: 24px; }
  @media (orientation: landscape) { .slots { grid-template-columns: repeat(8, 1fr); } .piece { width: 64px; height: 72px; } .tray { min-height: 76px; } }

  .book { display: flex; flex-direction: column; gap: 10px; }
  .bcard { background: var(--card); border-radius: 18px; padding: 12px 14px; box-shadow: inset 0 0 0 2px var(--line); }
  .bcard h3 { margin: 0 0 6px; font-size: 19px; color: var(--gold); display: flex; align-items: center; gap: 8px; }
  .bcard h3 img { width: 34px; height: 34px; }
  .bcard p { margin: 0 0 6px; font-size: 15.5px; line-height: 1.6; }
  .bcard .row { display: flex; gap: 8px; flex-wrap: wrap; }
  .bcard .row .btn { font-size: 14px; padding: 7px 12px; }
  .toc { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; margin-bottom: 4px; }
  .toc button { border: none; border-radius: 999px; padding: 6px 11px; font: 800 13px var(--f); color: #fff; background: rgba(255,255,255,.1); cursor: pointer; }

  /* ---------- 對話框 ---------- */
  .modal { position: fixed; inset: 0; z-index: 200; display: flex; align-items: center; justify-content: center; padding: 64px 10px 12px; background: rgba(3,6,20,.55); }
  .modal.clear { background: rgba(3,6,20,.15); align-items: flex-end; }
  @media (orientation: landscape) { .modal.clear { align-items: center; justify-content: flex-end; padding-right: 68px; } .modal.clear .mcard { width: min(520px, 58%); } }
  .mcard { width: min(560px, 100%); max-height: 100%; background: var(--card); border-radius: 22px; box-shadow: inset 0 0 0 2px var(--line), 0 14px 40px rgba(0,0,0,.6);
           display: flex; flex-direction: column; overflow: hidden; animation: pop .28s ease-out; }
  @keyframes pop { from { opacity: 0; transform: scale(.9); } to { opacity: 1; transform: none; } }
  .mhead { display: flex; justify-content: space-between; align-items: center; padding: 10px 14px 0; font-size: 14px; font-weight: 800; color: var(--sub); gap: 8px; }
  .mbody { overflow-y: auto; padding: 8px 14px; flex: 1 1 auto; touch-action: pan-y; }
  .mfoot { display: flex; gap: 10px; justify-content: center; padding: 8px 14px 14px; flex-wrap: wrap; flex: 0 0 auto; }
  .qTop { display: flex; gap: 10px; align-items: center; }
  .qTop img { width: 52px; height: 52px; flex: 0 0 auto; }
  .qText { font-size: 21px; font-weight: 900; line-height: 1.4; }
  .opts { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 12px; }
  .opts.one { grid-template-columns: 1fr; }
  .opt { font: 800 17px var(--f); color: #fff; padding: 12px 10px; border-radius: 14px; border: none; cursor: pointer; background: rgba(255,255,255,.1);
         box-shadow: inset 0 0 0 2px rgba(255,255,255,.22); text-align: center; line-height: 1.3; min-height: 50px; }
  .opt.right { background: rgba(91,228,155,.35); box-shadow: inset 0 0 0 3px var(--green); }
  .opt.wrong { background: rgba(255,107,129,.3); box-shadow: inset 0 0 0 3px var(--red); animation: shake .4s; }
  .opt:disabled { cursor: default; }
  .qEx { margin-top: 10px; font-size: 15px; line-height: 1.5; min-height: 22px; color: #dfe7ff; }
  .qEx b { color: var(--gold); }
  .dots { display: flex; gap: 3px; }
  .dots i { width: 9px; height: 9px; border-radius: 50%; background: rgba(255,255,255,.2); }
  .dots i.r { background: var(--green); } .dots i.w { background: var(--red); } .dots i.c { background: var(--gold); }
  @media (orientation: landscape) and (max-height: 560px) {
    .modal { padding: 8px 64px; }
    .qText { font-size: 18px; }
    .opt { padding: 8px; min-height: 40px; font-size: 16px; }
    .opts { margin-top: 8px; gap: 6px; }
    .qTop img { width: 40px; height: 40px; }
  }
  .res { text-align: center; }
  .res .bigI { width: 76px; height: 76px; display: block; margin: 0 auto; }
  .res h2 { margin: 6px 0; font-size: 26px; color: var(--gold); }
  .res p { margin: 4px 0; font-size: 16px; }
  .res .stars { font-size: 34px; letter-spacing: 4px; color: var(--gold); text-shadow: 0 0 10px rgba(255,200,80,.6); }
  .res .stars .off { color: rgba(255,255,255,.18); text-shadow: none; }
  .stampBig { width: 170px; height: 170px; margin: 4px auto; display: block; }
  .stampBig.go { animation: stampDown .45s cubic-bezier(.3,1.6,.5,1) both; }

  /* =====================================================================

  const TOOLS = [['speed', '▶', '速度 中'], ['labels', '名', '名稱'], ['real', '⇔', '真實比例'], ['size', '▤', '比大小'], ['home', '☀', '總覽']];

  /* ---------- 真實比例／比大小 ---------- */
  function setReal(on) {
    if (layTo === 'line') leaveLine(true);
    closeCard(true); selBody = null; focusOrbit = -1;
    if (on) {

      setTimeout(() => { if (layTo === 'real' && mode === 'explore') openCard(OTHER.real, 'real', '<button class="btn ghost" data-c="r1">看內行星</button><button class="btn ghost" data-c="r2">看到木星土星</button><button class="btn ghost" data-c="r3">看全部</button>'); }, 900);
    } else {

  function lineFit() {

  }
  function enterLine() {

    flyToPoint(v1.copy(lineAxis).multiplyScalar(LINE_LEN / 2 - 2), lineFit(), 2.2);
    cam.tYaw = cam.yaw = Math.round(cam.yaw / TAU) * TAU; cam.tPitch = 0.08;
    $('#eHint').textContent = (W >= H ? '左邊' : '上面') + '的大火球是太陽，是地球的 109 倍！拖曳可以移動、兩指縮放';

  function leaveLine(quiet) {

    flyToPoint(v1.set(0, 0, 0), portrait ? 125 : 95, 2.2); cam.tPitch = 0.62;
    $('#eHint').textContent = '拖曳轉動・兩指或滾輪縮放・點星球飛過去'; $('#eHint').classList.remove('low');
    refreshTools();
  }
  let hintT = 0;
  function hintShow() { $('#eHint').style.opacity = 1; hintT = 7; }
  function hintHide() { hintT = Math.min(hintT, 0.01); }

  /* =====================================================================
   * 指標操作
   * ===================================================================== */
  const ptrs = new Map();
  let drag = null;
  canvas.addEventListener('pointerdown', e => {
    canvas.focus({ preventScroll: true });
    try { canvas.setPointerCapture(e.pointerId); } catch (er) { /* 忽略 */ }
    const r = canvas.getBoundingClientRect(), x = e.clientX - r.left, y = e.clientY - r.top;
    ptrs.set(e.pointerId, { x, y, sx: x, sy: y, t: performance.now() });
    if (mode === 'mission') { joyDown(e.pointerId, x, y); return; }
    if (ptrs.size === 1) drag = { moved: false, pinch: 0 };
    else if (ptrs.size === 2) { const p = [...ptrs.values()]; drag = { moved: true, pinch: Math.hypot(p[0].x - p[1].x, p[0].y - p[1].y), d0: cam.tDist }; }
  });
  canvas.addEventListener('pointermove', e => {
    const p = ptrs.get(e.pointerId); if (!p) return;
    const r = canvas.getBoundingClientRect(), x = e.clientX - r.left, y = e.clientY - r.top;
    const dx = x - p.x, dy = y - p.y; p.x = x; p.y = y;
    if (mode === 'mission') { joyMove(e.pointerId, x, y); return; }
    if (!drag || paused) return;
    if (ptrs.size >= 2 && drag.pinch) {
      const q = [...ptrs.values()], d = Math.hypot(q[0].x - q[1].x, q[0].y - q[1].y);
      cam.tDist = drag.d0 * drag.pinch / Math.max(20, d); clampDist(); return;
    }
    if (Math.hypot(x - p.sx, y - p.sy) > 7) drag.moved = true;
    if (!drag.moved || mode === 'title') return;
    if (layTo === 'line' && layT >= 1) {
      const k = cam.dist * 2 * Math.tan(camera.fov * Math.PI / 360) / H;
      if (cam.focus) { focusPos(cam.fixed); cam.focus = null; }
      const along = lineAxis.x ? -dx : -dy;
      cam.fixed.addScaledVector(lineAxis, along * k);
      const s = cam.fixed.dot(lineAxis); cam.fixed.copy(lineAxis).multiplyScalar(clamp(s, -20, LINE_LEN + 10));
      cam.tPitch = clamp(cam.tPitch + (lineAxis.x ? dy : 0) * 0.004, -0.5, 0.9);
    } else {
      cam.tYaw -= dx * 0.008; cam.tPitch = clamp(cam.tPitch + dy * 0.006, -1.2, 1.45);
    }
    hintHide();
  });
  function ptrUp(e) {
    const p = ptrs.get(e.pointerId); if (!p) return;
    ptrs.delete(e.pointerId);
    if (mode === 'mission') { joyUp(e.pointerId); return; }
    if (drag && !drag.moved && performance.now() - p.t < 600 && ptrs.size === 0 && !paused && mode === 'explore') {
      const b = pickAt(p.x, p.y);
      if (b) selectBody(b);

    if (ptrs.size === 0) drag = null;

  }
  canvas.addEventListener('pointerup', ptrUp);
  canvas.addEventListener('pointercancel', ptrUp);
  canvas.addEventListener('wheel', e => {
    e.preventDefault();

  }, { passive: false });
  function clampDist() { const l = distLimits(); cam.tDist = clamp(cam.tDist, l[0], l[1]); }
  function pickAt(x, y) {
    let best = null, bd = 1e9;
    for (const b of BODIES) {
      if (fLine > 0.5 && !b.planet) continue;
      if (b.key === 'belt') continue;
      b.getPos(v1); project(v1, scr);
      if (scr.z > 1) continue;
      const rp = screenRadius(v1, b.getR() * (b.planet && b.planet.ring ? 1.6 : 1));

      if (d < 36 && d < bd) { bd = d; best = b; }
    }
    return best;
  }

  /* ---------- 鍵盤 ---------- */
  const keys = {};
  addEventListener('keydown', e => {
    keys[e.code] = true;

    if (paused) return;
    if (mode === 'explore' && (e.code === 'ArrowRight' || e.code === 'ArrowLeft')) {
      const list = layTo === 'line' ? BODIES.filter(b => b.planet) : BODIES.filter(b => b.key !== 'belt' || layTo !== 'line');
      let i = selBody ? list.indexOf(selBody) : -1;
      i = (i + (e.code === 'ArrowRight' ? 1 : -1) + list.length) % list.length;
      selectBody(list[i]); e.preventDefault();

    if (mode === 'mission' && e.code.startsWith('Arrow')) e.preventDefault();
  });
  addEventListener('keyup', e => { keys[e.code] = false; });
  addEventListener('blur', () => { for (const k in keys) keys[k] = false; });

  /* =====================================================================
   * 太空任務
   * ===================================================================== */
  const M = { state: 'off', leg: 0, pos: new THREE.Vector3(), vel: new THREE.Vector3(), head: 0, bank: 0, legStars: 0, run: null, combo: 0, comboT: 0, t: 0, tries: 0, auto: false, bumpT: 0, tension: false, hotT: 0 };
  const joy = { id: null, ox: 0, oy: 0, x: 0, y: 0 };
  const joyEl = $('#joy'), knob = joyEl.querySelector('.knob');
  function joyDown(id, x, y) {
    if (M.state !== 'fly' || paused || joy.id != null) return;
    joy.id = id; joy.ox = x; joy.oy = y; joy.x = 0; joy.y = 0;
    joyEl.classList.add('free');

    knob.style.transform = '';
    $('#kHint').style.opacity = 0;
  }
  function joyMove(id, x, y) {
    if (id !== joy.id) return;
    let dx = x - joy.ox, dy = y - joy.oy; const l = Math.hypot(dx, dy), mx = 56;
    if (l > mx) { dx *= mx / l; dy *= mx / l; }
    joy.x = dx / mx; joy.y = dy / mx;
    knob.style.transform = `translate(${dx}px, ${dy}px)`;
  }
  function joyUp(id) {
    if (id !== joy.id) return;
    joy.id = null; joy.x = joy.y = 0; knob.style.transform = '';
    joyEl.classList.remove('free'); joyEl.style.left = ''; joyEl.style.top = ''; joyEl.style.bottom = ''; joyEl.style.opacity = '';
  }

  // 推進器的持續聲音
  let thr = null;
  function thrusterSet(x) {
    if (!thr && mode === 'mission' && sfxOn) thrusterStart();
    if (!thr) return;

    thr.w.set(x, on ? 0.1 : 0); thr.e.set(x * 0.6, on ? 0.035 : 0);
  }
  function thrusterStart() {

  function buildPass(forMission) {

  function startMission(from) {

  function missionPos(i, out) { const a = MISSION_ANG[i], d = MD(PLANETS[i].sd); return out.set(Math.cos(a) * d, 0, -Math.sin(a) * d); }
  function startLeg(i, snap) {
    M.leg = i; M.state = 'fly'; viewShift.tx = 0; viewShift.ty = 0; M.legStars = 0; M.tries = 0; M.combo = 0; M.tension = false; M.t = 0;
    const tp = missionPos(i, new THREE.Vector3()), tr = PLANETS[i].sr;
    if (i === 0) { const a = MISSION_ANG[0] - 0.9; M.pos.set(Math.cos(a) * 26, 0, -Math.sin(a) * 26); }
    else { const pp = missionPos(i - 1, v1); v2.copy(tp).sub(pp).normalize(); M.pos.copy(pp).addScaledVector(v2, PLANETS[i - 1].sr * (PLANETS[i - 1].key === 'saturn' ? 2.4 : 1) + 2.5); }
    M.vel.set(0, 0, 0);
    v2.copy(tp).sub(M.pos); M.head = Math.atan2(v2.x, v2.z);
    if (snap) { chase.pos.set(M.pos.x, M.pos.y + 25, M.pos.z + 12); chase.look.copy(M.pos); }
    // 星星：沿著彎彎的路線＋星球旁邊
    STARS.forEach(s => { s.on = false; s.m.visible = false; });
    const len = v2.length(), dir = v2.clone().normalize(), side = new THREE.Vector3(-dir.z, 0, dir.x), bend = (Math.random() < 0.5 ? -1 : 1) * Math.min(9, len * 0.28);
    const end = tp.clone().addScaledVector(dir, -(tr + 3.4));
    let k = 0;
    for (let n = 0; n < 7; n++) {
      const t = 0.14 + n * 0.115, wob = Math.sin(t * Math.PI) * bend + Math.sin(n * 1.7) * 1.2;
      const p = M.pos.clone().lerp(end, t).addScaledVector(side, wob);
      placeStar(k++, p);
    }
    for (let n = 0; n < 3; n++) {
      const a = Math.atan2(-dir.z, -dir.x) + (n - 1) * 0.75;
      placeStar(k++, v1.set(tp.x + Math.cos(a) * (tr + 3.6), 0, tp.z + Math.sin(a) * (tr + 3.6)));
    }
    // 木星這一段要穿過小行星帶
    ROCKS.forEach(r => { r.on = false; r.m.visible = false; });
    if (PLANETS[i].key === 'jupiter') {
      for (let n = 0; n < ROCKS.length; n++) {
        const r = ROCKS[n], t = 0.2 + n * 0.08, p = M.pos.clone().lerp(end, t).addScaledVector(side, (n % 2 ? 1 : -1) * (2 + Math.random() * 4));
        r.on = true; r.m.visible = true; r.s = 0.7 + Math.random() * 0.8; r.m.scale.setScalar(r.s); r.m.position.copy(p);
        r.spin.set(Math.random() - 0.5, Math.random() - 0.5, Math.random() - 0.5).multiplyScalar(2); r.d = p.length(); r.a = Math.atan2(-p.z, p.x); r.w = 0.05 * (Math.random() < 0.5 ? 1 : -1);
      }
    }
    if (KG.music) { KG.music.setLayer('tension', false); KG.music.setTempo(i === 7 ? 1.07 : 1); }
    $('#mLeg').innerHTML = `第 ${i + 1} 站：${PLANETS[i].name}　⭐ <span id="mStar">${M.run.stars}</span>`;
    document.querySelectorAll('#mDots img').forEach(im => { const j = +im.dataset.i; im.classList.toggle('cur', j === i); im.classList.toggle('done', !!stamps()[PLANETS[j].key]); });
    $('#arrowImg').src = ICON[PLANETS[i].key];
    setTimeout(() => { if (mode === 'mission' && M.leg === i && M.state === 'fly') flash(`出發！飛向${PLANETS[i].name}`); }, 350);
  }
  function placeStar(k, p) { const s = STARS[k]; s.on = true; s.m.visible = true; s.m.position.copy(p); s.base = p.y; s.m.scale.setScalar(1); s.pop = 0; }
  const PENTA = [1, 9 / 8, 5 / 4, 3 / 2, 5 / 3, 2, 9 / 4];
  function collectStar(s) {

  function endMissionCleanup() {

  }

  function updateMission(dt) {
    const p = PLANETS[M.leg], tp = missionPos(M.leg, v3.set(0, 0, 0)).clone(), tr = p.sr;

    }
    for (const r of ROCKS) if (r.on) { r.a += r.w * dt; r.m.position.set(Math.cos(r.a) * r.d, 0, -Math.sin(r.a) * r.d); r.m.rotation.x += r.spin.x * dt; r.m.rotation.y += r.spin.y * dt; }
    if (M.state === 'fly') {
      let ix = joy.x, iy = joy.y;
      if (keys.ArrowLeft || keys.KeyA) ix -= 1; if (keys.ArrowRight || keys.KeyD) ix += 1;
      if (keys.ArrowUp || keys.KeyW) iy -= 1; if (keys.ArrowDown || keys.KeyS) iy += 1;
      if (M.auto) {
        let tgt = null, bd = 1e9;
        for (const s of STARS) if (s.on) { const d = s.m.position.distanceTo(M.pos); if (d < bd) { bd = d; tgt = s.m.position; } }
        if (!tgt) tgt = tp;
        v1.copy(tgt).sub(M.pos); v1.y = 0; v1.normalize(); ix = v1.x; iy = v1.z;
      }
      const il = Math.hypot(ix, iy); if (il > 1) { ix /= il; iy /= il; }
      const MAX = 11;
      v1.set(ix * MAX, 0, iy * MAX);
      M.vel.lerp(v1, 1 - Math.exp(-dt * (il > 0.05 ? 2.6 : 1.4)));
      M.pos.addScaledVector(M.vel, dt);
      // 碰撞：太陽、其他星球、石頭、邊界
      const ds = M.pos.length();
      if (ds < SUN_R + 2.2) {
        M.pos.setLength(SUN_R + 2.2); v1.copy(M.pos).normalize(); M.vel.addScaledVector(v1, Math.max(0, -M.vel.dot(v1)) * 1.6 + 3);
        if (M.hotT <= 0) { M.hotT = 1.2; sfx('sizzle'); flash('好燙！離太陽遠一點'); KG.vibrate(25); }
      }
      if (ds > 132) { M.pos.setLength(132); v1.copy(M.pos).normalize(); M.vel.addScaledVector(v1, -Math.max(0, M.vel.dot(v1)) * 1.5); }
      PLANETS.forEach((q, j) => {
        if (j === M.leg) return;

        if (v2.distanceTo(M.pos) < rr) { v1.copy(M.pos).sub(v2).normalize(); M.pos.copy(v2).addScaledVector(v1, rr); M.vel.addScaledVector(v1, Math.max(0, -M.vel.dot(v1)) * 1.5); bump(); }

        if (d < rr) { v1.copy(M.pos).sub(r.m.position).normalize(); M.pos.copy(r.m.position).addScaledVector(v1, rr); M.vel.addScaledVector(v1, Math.max(0, -M.vel.dot(v1)) * 1.6 + 2); bump(); }

  /* ---------- 任務問答 ---------- */

        : { bpm: 160, inst: 'bell', vol: 0.28, notes: [['A4', 1], ['D5', 1], ['F#5+A5', 4]], bass: [['D3', 6, 0]], bassVol: 0.28 });

  }
  function missionDone() {

    KG.best(SLUG + ':stars', r.stars);

  const starRow = n => `<div class="stars">${[0, 1, 2].map(i => `<span class="${i < n ? '' : 'off'}">★</span>`).join('')}</div>`;

  /* =====================================================================
   * 問答（任務和星球問答共用）
   * ===================================================================== */
  const QZ = { mode: 'quiz', list: [], idx: 0, score: 0, streak: 0, done: false, res: [] };
  function startQuiz() {
    QZ.mode = 'quiz'; QZ.idx = 0; QZ.score = 0; QZ.streak = 0; QZ.res = [];
    const by = {}; shuffle(QUIZ).forEach(q => { (by[q.p] = by[q.p] || []).push(q); });
    const keys2 = shuffle(Object.keys(by)), pick = [];
    while (pick.length < 10) { for (const k of keys2) { if (by[k].length && pick.length < 10) pick.push(by[k].pop()); } }
    QZ.list = shuffle(pick);
    show('#sQuiz', true); $('#sQuiz').classList.remove('clear');
    showQuestion();
  }
  function showQuestion() {

  $('#qOpts').addEventListener('click', e => {

      $('#qNext').classList.remove('hidden');
    } else {

      sfx('nope', { pan }); KG.vibrate([20, 40, 20]);
      if (QZ.mode === 'mission') {
        M.tries++;
        $('#qEx').innerHTML = '差一點點！再想想看，選另一個答案。';

        document.querySelectorAll('#qOpts .opt').forEach((x, i) => { x.disabled = true; if (QZ.opts[i].ok) x.classList.add('right'); });
        $('#qEx').innerHTML = '正確答案是：' + q.ex;
        $('#qNext').textContent = QZ.idx + 1 < QZ.list.length ? '下一題' : '看成績';
        $('#qNext').classList.remove('hidden');
      }
    }
    if (QZ.mode === 'quiz') { $('#qScore').textContent = `答對 ${QZ.score}`; $('#qDots').innerHTML = QZ.list.map((x, i) => `<i class="${QZ.res[i] === 1 ? 'r' : QZ.res[i] === 0 ? 'w' : i === QZ.idx ? 'c' : ''}"></i>`).join(''); }
  });
  $('#qNext').onclick = () => {
    sfx('blip'); stopSpeak();
    if (QZ.mode === 'mission') { show('#sQuiz', false); missionCorrect(); return; }
    QZ.idx++;
    if (QZ.idx < QZ.list.length) showQuestion(); else quizDone();
  };
  $('#qSay').onclick = () => { sfx('blip'); const q = QZ.list[QZ.idx]; speak(q.q + '。' + QZ.opts.map((o, i) => '選項' + (i + 1) + '，' + o.t).join('。')); };
  function quizDone() {
    show('#sQuiz', false);
    const s = QZ.score, best = KG.best(SLUG + ':quiz'), isBest = best == null || s > best;
    KG.best(SLUG + ':quiz', s);
    const n = s >= 9 ? 3 : s >= 7 ? 2 : s >= 4 ? 1 : 0;
    if (n >= 2) { KG.confetti(); jingle({ bpm: 150, inst: 'kalimba', vol: 0.34, notes: [['G4', 1], ['B4', 1], ['D5', 1], ['G5', 2], ['F#5', 1], ['G5+B5', 4]], bass: [['G2', 4, 0], ['D3', 2, 4], ['G2', 5, 6]], bassVol: 0.3 }); }
    else jingle({ bpm: 120, inst: 'kalimba', vol: 0.3, notes: [['D5', 1], ['B4', 1], ['G4', 1], ['A4', 3]], bass: [['G2', 6, 0]], bassVol: 0.25 });
    cam.auto = 0.04; flyToPoint(v1.set(0, 0, 0), 100, 2);
    showResult({
      html: `${iconImg(n >= 2 ? 'sun' : 'moon', 'bigI')}<h2>${n >= 3 ? '天文小博士！' : n >= 2 ? '好厲害！' : n >= 1 ? '不錯喔！' : '再試一次吧！'}</h2>${starRow(n)}<p>10 題答對 <b>${s}</b> 題${isBest && s > 0 ? '（新紀錄！）' : ''}</p><p>最佳紀錄：${Math.max(s, best || 0)} 題</p>`,
      buttons: [['回主選單', 'btn ghost', () => go('title')], ['再玩一次', 'btn', () => { closeResult(); startQuiz(); }]]
    });
  }

  /* ---------- 結果視窗 ---------- */
  function showResult(o) {
    $('#rBody').innerHTML = o.html;
    $('#rFoot').innerHTML = '';
    o.buttons.forEach(b => { const el = document.createElement('button'); el.className = b[1]; el.textContent = b[0]; el.onclick = () => { sfx('blip'); b[2](); }; $('#rFoot').appendChild(el); });
    show('#sResult', true);
  }
  function closeResult() { show('#sResult', false); }

  /* =====================================================================
   * 排排看
   * ===================================================================== */
  let sortMode = 'dist';
  const SORT = { order: [], slots: [], start: 0, wrong: 0, sel: null, done: false };
  $('#sortSeg').addEventListener('click', e => { const b = e.target.closest('[data-sm]'); if (!b || b.dataset.sm === sortMode) return; sfx('blip'); startSort(b.dataset.sm); });
  $('#sortReset').onclick = () => { sfx('blipBack'); startSort(sortMode); };
  function pieceHTML(k) {
    const p = PKEY[k];
    return `<div class="piece" data-k="${k}"><img src="${ICON[k]}" alt="" style="width:44px;height:44px"><span>${p.name}</span></div>`;
  }
  function startSort(m) {
    sortMode = m;
    document.querySelectorAll('#sortSeg button').forEach(b => b.classList.toggle('on', b.dataset.sm === m));
    SORT.order = m === 'dist' ? PLANETS.map(p => p.key) : PLANETS.slice().sort((a, b) => a.km - b.km).map(p => p.key);
    SORT.start = performance.now(); SORT.wrong = 0; SORT.sel = null; SORT.done = false;
    $('#sortStart').innerHTML = m === 'dist' ? `${iconImg('sun')}太陽` : '<b style="font-size:22px">小</b><br>最小';
    $('#slots').innerHTML = SORT.order.map((k, i) => `<div class="sslot" data-s="${i}"><em>${i + 1}</em></div>`).join('');
    $('#tray').innerHTML = shuffle(SORT.order).map(pieceHTML).join('');
    $('#sortFb').textContent = m === 'dist' ? '把星球拖到格子裡：從離太陽最近的排到最遠！' : '把星球拖到格子裡：從最小的排到最大！';
    $('#sortCheck').disabled = true;
  }
  let pdrag = null;
  const ghost = $('#ghostPiece');
  $('#sSort').addEventListener('pointerdown', e => {
    const pc = e.target.closest('.piece'); if (!pc || SORT.done || pc.classList.contains('locked')) return;
    e.preventDefault();
    pdrag = { el: pc, id: e.pointerId, sx: e.clientX, sy: e.clientY, moved: false };
    try { pc.setPointerCapture(e.pointerId); } catch (er) { /* 忽略 */ }
  });
  $('#sSort').addEventListener('pointermove', e => {
    if (!pdrag || e.pointerId !== pdrag.id) return;
    if (!pdrag.moved && Math.hypot(e.clientX - pdrag.sx, e.clientY - pdrag.sy) > 8) {
      pdrag.moved = true; sfx('lift');
      ghost.innerHTML = pdrag.el.outerHTML; ghost.classList.remove('hidden');
      const r = pdrag.el.getBoundingClientRect(); pdrag.ox = e.clientX - r.left; pdrag.oy = e.clientY - r.top;
      ghost.firstChild.style.width = r.width + 'px'; ghost.firstChild.style.height = r.height + 'px';
      pdrag.el.classList.add('lift');
    }
    if (pdrag.moved) {
      ghost.style.transform = `translate(${e.clientX - pdrag.ox}px, ${e.clientY - pdrag.oy}px) scale(1.08)`;
      const s = nearestSlot(e.clientX, e.clientY);
      document.querySelectorAll('.sslot').forEach(x => x.classList.toggle('hl', x === s));
    }
  });
  function endPDrag(e) {
    if (!pdrag || e.pointerId !== pdrag.id) return;
    const d = pdrag; pdrag = null;
    ghost.classList.add('hidden'); ghost.innerHTML = '';
    d.el.classList.remove('lift');
    document.querySelectorAll('.sslot').forEach(x => x.classList.remove('hl'));
    if (!d.moved) { tapPiece(d.el); return; }
    const s = nearestSlot(e.clientX, e.clientY);
    if (s) placePiece(d.el, s); else toTray(d.el);
  }
  $('#sSort').addEventListener('pointerup', endPDrag);
  $('#sSort').addEventListener('pointercancel', endPDrag);
  $('#slots').addEventListener('click', e => {
    const s = e.target.closest('.sslot'); if (!s || !SORT.sel || e.target.closest('.piece')) return;
    placePiece(SORT.sel, s);
  });
  $('#tray').addEventListener('click', e => { if (SORT.sel && !e.target.closest('.piece')) { const el = SORT.sel; el.classList.remove('sel'); SORT.sel = null; toTray(el); } });
  function nearestSlot(x, y) {
    let best = null, bd = 1e9;
    document.querySelectorAll('.sslot').forEach(s => {
      if (s.classList.contains('ok')) return;
      const r = s.getBoundingClientRect(), d = Math.hypot(r.left + r.width / 2 - x, r.top + r.height / 2 - y);
      if (d < bd && d < Math.max(70, r.width * 0.95)) { bd = d; best = s; }
    });
    return best;
  }
  function tapPiece(el) {
    if (SORT.sel === el) { el.classList.remove('sel'); SORT.sel = null; sfx('blipBack'); return; }
    if (SORT.sel) SORT.sel.classList.remove('sel');
    SORT.sel = el; el.classList.add('sel'); sfx('lift');
    $('#sortFb').textContent = `選好了${PKEY[el.dataset.k].name}，點一個格子放進去`;
  }
  function placePiece(el, slot) {
    if (SORT.sel) SORT.sel.classList.remove('sel'); SORT.sel = null;
    const from = el.parentElement;
    const other = slot.querySelector('.piece');
    if (other && other !== el) { if (from.classList.contains('sslot')) from.appendChild(other); else $('#tray').appendChild(other); }
    slot.appendChild(el);
    const r = slot.getBoundingClientRect();
    sfx('place', { pan: panX(r.left + r.width / 2), pitch: 1 + (+slot.dataset.s) * 0.04, exact: true });
    KG.vibrate(6);
    checkFull();
  }
  function toTray(el) { if (el.parentElement.classList.contains('sslot')) { $('#tray').appendChild(el); sfx('drop'); } checkFull(); }
  function checkFull() {
    const full = [...document.querySelectorAll('.sslot')].every(s => s.querySelector('.piece'));
    $('#sortCheck').disabled = !full;
    if (full) $('#sortFb').textContent = '排好了嗎？按「檢查答案」！';
  }
  $('#sortCheck').onclick = () => {
    if (SORT.done) return;
    let bad = 0;
    document.querySelectorAll('.sslot').forEach(s => {
      const pc = s.querySelector('.piece'); if (!pc || s.classList.contains('ok')) return;
      if (pc.dataset.k === SORT.order[+s.dataset.s]) { s.classList.add('ok'); pc.classList.add('locked'); }
      else { bad++; pc.classList.add('bad'); setTimeout(() => { pc.classList.remove('bad'); $('#tray').appendChild(pc); }, 420); }
    });
    if (bad) {
      SORT.wrong += bad; sfx('nope'); KG.vibrate(30);
      $('#sortFb').textContent = `有 ${bad} 顆放錯了，綠色的是對的，再排排看！` + (sortMode === 'dist' ? '（口訣：水金地火木土天海）' : '（提示：金星比地球小一點點，海王星比天王星小一點點）');
      $('#sortCheck').disabled = true;
    } else {
      SORT.done = true;
      const sec = Math.round((performance.now() - SORT.start) / 1000), key = SLUG + ':sort-' + sortMode;
      const best = KG.best(key, null, true), isBest = best == null || sec < best;
      KG.best(key, sec, true);
      const n = SORT.wrong === 0 ? 3 : SORT.wrong <= 3 ? 2 : 1;
      sfx('good'); setTimeout(() => sfx('sparkle'), 150); KG.confetti();
      jingle({ bpm: 150, inst: 'marimba', vol: 0.36, notes: [['G4', 1], ['A4', 1], ['B4', 1], ['D5', 1], ['G5', 4]], bass: [['G2', 4, 0], ['D3', 4, 4]], bassVol: 0.3 });
      setTimeout(() => showResult({
        html: `${iconImg('earth', 'bigI')}<h2>全部排對了！</h2>${starRow(n)}<p>用了 <b>${sec}</b> 秒${isBest ? '（新紀錄！）' : ''}，放錯 ${SORT.wrong} 次</p><p>${sortMode === 'dist' ? '水、金、地、火、木、土、天、海！' : '最小的是水星，最大的是木星！'}</p>`,
        buttons: [['回主選單', 'btn ghost', () => go('title')], [sortMode === 'dist' ? '換比大小' : '換排順序', 'btn cyan', () => { closeResult(); startSort(sortMode === 'dist' ? 'size' : 'dist'); }], ['再玩一次', 'btn', () => { closeResult(); startSort(sortMode); }]]
      }), 700);
    }
  };

  /* =====================================================================
   * 天文小百科
   * ===================================================================== */
  function buildBook() {
    if ($('#bookList').dataset.built) return;
    $('#bookList').dataset.built = 1;
    const toc = `<div class="toc">${BOOK.map(b => `<button data-j="${b.id}">${esc(b.t)}</button>`).join('')}</div>`;
    const planets = `<div class="bcard" id="bk-planets"><h3>${iconImg('saturn')}八大行星快速認識</h3><div class="row">${PLANETS.map(p => `<button class="btn ghost" data-f="${p.key}">${p.name}</button>`).join('')}</div><p style="margin-top:8px;font-size:14px;color:var(--sub)">點名字，飛過去看介紹！</p></div>`;
    $('#bookList').innerHTML = toc + BOOK.map(b => `<div class="bcard" id="bk-${b.id}"><h3>${iconImg(b.icon)}${esc(b.t)}</h3>${b.p.map(t => `<p>${esc(t)}</p>`).join('')}
      <div class="row"><button class="btn cyan" data-s="${b.id}">🔈 念給我聽</button>${b.go === 'sort' ? '<button class="btn ghost" data-g="sort">去排排看</button>' : ''}${b.go === 'real' ? '<button class="btn ghost" data-g="real">看真實比例</button>' : ''}</div></div>`).join('') + planets;
  }
  $('#bookList').addEventListener('click', e => {
    const t = e.target.closest('button'); if (!t) return;
    sfx('blip');
    if (t.dataset.j) { const el = $('#bk-' + t.dataset.j), pm = $('#sBook .pMain'); pm.scrollTo({ top: el.getBoundingClientRect().top - pm.getBoundingClientRect().top + pm.scrollTop - 8, behavior: 'smooth' }); }
    if (t.dataset.s) { const b = BOOK.find(x => x.id === t.dataset.s); speak(b.t + '。' + b.p.join('')); }
    if (t.dataset.g === 'sort') go('sort');
    if (t.dataset.g === 'real') go('explore', { real: true });
    if (t.dataset.f) go('explore', { focus: t.dataset.f });
  });
  $('#bookBack').onclick = () => { sfx('blipBack'); go('title'); };

  /* =====================================================================
   * 畫面大小
   * ===================================================================== */
  function resize() {
    const r = canvas.getBoundingClientRect();
    W = Math.max(1, Math.round(r.width)); H = Math.max(1, Math.round(r.height));
    const wasP = portrait; portrait = H > W;
    renderer.setSize(W, H, false); composer.setSize(W, H);
    bloom.resolution.set(W / 2, H / 2);
    camera.aspect = W / H; camera.updateProjectionMatrix();
    if (mode === 'explore' && layTo === 'line' && wasP !== portrait) enterLine();
    updateBarH();
  }
  addEventListener('resize', resize);
  if (window.visualViewport) visualViewport.addEventListener('resize', resize);
  addEventListener('orientationchange', () => setTimeout(resize, 250));

  /* =====================================================================
   * 自動畫質：太卡就一步步降低（解析度 → 發光 → 更低解析度）
   * ===================================================================== */
  const QKEY = 'quality:' + SLUG;
  const baseRatio = Math.min(window.devicePixelRatio || 1, 2);
  const QLEVELS = [
    { ratio: baseRatio, bloom: true }, { ratio: Math.min(baseRatio, 1.4), bloom: true }, { ratio: 1, bloom: true },
    { ratio: 1, bloom: false }, { ratio: 0.75, bloom: false }
  ];
  let qLevel = clamp(KG.store.get(QKEY, LOW ? 2 : 0) | 0, 0, QLEVELS.length - 1);
  const perf = { last: 0, n: 0, sum: 0, cool: 3, lock: false };
  function applyQuality() {
    const q = QLEVELS[qLevel];
    renderer.setPixelRatio(q.ratio); renderer.setSize(W, H, false);
    composer.setPixelRatio(q.ratio); composer.setSize(W, H);
    bloom.resolution.set(W / 2, H / 2);
  }
  function renderFrame() {
    if (QLEVELS[qLevel].bloom) composer.render(); else renderer.render(scene, camera);
    const now = performance.now(), dt = perf.last ? Math.min(0.5, (now - perf.last) / 1000) : 0;
    perf.last = now;
    if (perf.lock || document.hidden || qLevel >= QLEVELS.length - 1) return;
    perf.cool -= dt; if (perf.cool > 0) return;
    perf.sum += dt; perf.n++;
    if (perf.n >= 60) {
      if (perf.sum / perf.n > 1 / 42) { qLevel++; KG.store.set(QKEY, qLevel); applyQuality(); perf.cool = 1.5; }
      perf.n = 0; perf.sum = 0;
    }
  }

  /* =====================================================================
   * 主迴圈
   * ===================================================================== */
  let last = performance.now(), first = true;
  function update(dt) {
    const sim = paused ? 0 : dt;
    simT += sim;
    const sp = (mode === 'explore' ? SPEEDS[speedIdx][0] : mode === 'mission' ? 0 : 0.6) * sim;
    if (layTo !== 'mission') PL.forEach(p => { p.ang += p.w * sp; });
    PL.forEach(p => { p.mesh.rotation.y += p.spin * sim * (mode === 'explore' ? Math.max(0.2, SPEEDS[speedIdx][0]) : 0.6); if (p.clouds) p.clouds.rotation.y += p.spin * sim * 0.25; });
    moon.ang += sp * 1.6; moonPivot.rotation.y = moon.ang; moonMesh.rotation.y = -moon.ang + Math.PI;
    sunMesh.rotation.y += sim * 0.04;
    corona.material.rotation += sim * 0.05; corona2.material.rotation -= sim * 0.03;
    const pulse = 1 + Math.sin(simT * 1.7) * 0.025; corona.scale.multiplyScalar(pulse);
    beltG.rotation.y += sp * 0.12;
    comet.M += (mode === 'mission' ? 0.12 : 0.6) * sim * (mode === 'explore' ? Math.max(0.3, SPEEDS[speedIdx][0]) : 1) * 0.22;
    updateLayout(dt);
    // 彗星
    {
      const q = logLerp(8, 0.59 * AU, fReal), Qa = logLerp(88, 35 * AU, fReal);
      cometPos(q, Qa, comet.M, comet.g.position);
      const d = comet.g.position.length(), near = clamp(1.4 - d / Qa * 1.6, 0.15, 1.2);
      const sc = logLerp(1, 60, fReal);
      comet.g.scale.setScalar(sc);
      comet.g.lookAt(sunG.position);
      comet.tails.forEach(t => { t.scale.set(t.userData.w * near, t.userData.w * near, (2 + near * 7) * (t.userData.w > 0.6 ? 0.8 : 1.15)); });
      comet.coma.material.opacity = 0.4 + near * 0.5;
      comet.nuc.rotation.y += sim * 0.5;
    }
    // 火箭
    if (mode === 'mission' && M.state !== 'off') updateMission(sim);
    else {
      const f = ((mode === 'explore' || mode === 'quiz') && cam.focus && cam.focus.key !== 'belt' && layTo === 'sty') ? cam.focus : null;
      if (mode === 'quiz') rocket.visible = !!f;
      const fr = f ? f.getR() : 0;
      if (f) f.getPos(v2); else v2.set(0, 0, 0);
      const R = f ? fr * (f.planet && f.planet.ring ? 2.7 : 1.7) + 1.2 : 30, ws = f ? 0.55 : 0.18;
      rktA += sim * ws;
      v1.set(v2.x + Math.cos(rktA) * R, v2.y + Math.sin(rktA * 1.3) * R * 0.18 + (f ? fr * 0.4 : 2.5), v2.z - Math.sin(rktA) * R);
      rocket.position.lerp(v1, mode === 'title' ? 1 : 1 - Math.exp(-sim * 3));
      rocket.rotation.set(0, rktA + Math.PI, 0); rocket.rotateZ(-0.4);
      rocket.scale.setScalar(f ? clamp(fr * 0.32, 0.22, 1.1) : 1.1);
      rocket.userData.flame.scale.set(1, 0.6 + Math.random() * 0.2, 1); rocket.userData.flame.visible = true;
      if (!paused && Math.random() < 0.5) { rocket.localToWorld(v1.set(0, 0, -1.3)); exhaust.spawn(v1.x, v1.y, v1.z, (Math.random() - 0.5) * 0.4, (Math.random() - 0.5) * 0.4, (Math.random() - 0.5) * 0.4, 0.45, [1, 0.6, 0.25]); }
    }
    sparks.update(sim); exhaust.update(sim);
    exhaust.pts.material.size = rocket.scale.x * 0.9;
    updateCamera(dt);
    if (hintT > 0) { hintT -= dt; if (hintT <= 0) $('#eHint').style.opacity = 0; }
  }
  let rktA = 0;
  function frame(now) {
    const dt = Math.max(0, Math.min(0.05, (now - last) / 1000));
    last = now;
    update(dt);
    renderFrame();
    updateLabels();
    if (first) { first = false; const m = $('#msg'); if (m) m.remove(); }
    requestAnimationFrame(frame);
  }

  resize();
  applyQuality();
  go('title');
  cam.dist = cam.tDist; cam.fly = null; cam.target.set(0, 0, 0);
  requestAnimationFrame(frame);

  /* ---------- 測試掛鉤 ---------- */
  window.__ss = {
    _dbg: { scene, sky, belt, camera },
    state: () => ({ mode, layout: layTo, layT, paused, leg: M.leg, mstate: M.state, stars: M.run && M.run.stars, legStars: M.legStars, quizIdx: QZ.idx, quizScore: QZ.score, q: qLevel, music: KG.music && KG.music.isPlaying(), sel: selBody && selBody.key, camDist: cam.dist, fReal, fLine, W, H }),
    go: (m, o) => go(m, o),
    select: k => selectBody(BP[k]),
    real: on => setReal(on),
    line: on => on ? enterLine() : leaveLine(),
    tick: sec => { for (let i = 0; i < sec * 30; i++) update(1 / 30); },
    quality: l => { qLevel = l; perf.lock = true; applyQuality(); },
    mission: i => startMission(i || 0),
    auto: on => { M.auto = !!on; },
    warp: () => { const tp = missionPos(M.leg, new THREE.Vector3()); M.pos.copy(tp).add(v1.set(PLANETS[M.leg].sr + 3, 0, 0)); },
    answer: ok => { const i = QZ.opts.findIndex(o => o.ok === ok); document.querySelectorAll('#qOpts .opt')[i].click(); },
    screen: (k) => { const b = BP[k]; b.getPos(v1); project(v1, scr); return { x: scr.x, y: scr.y, z: scr.z, r: screenRadius(v1, b.getR()) }; },
    sortSolve: () => { SORT.order.forEach((k, i) => { const el = document.querySelector(`.piece[data-k="${k}"]`); placePiece(el, document.querySelector(`.sslot[data-s="${i}"]`)); }); }
  };
}
</script>
</body>
</html>
