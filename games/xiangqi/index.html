<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>中國象棋 Xiangqi</title>
<link rel="stylesheet" href="../../assets/common.css">
<style>
  :root { --gold: #d6b46e; --gold2: #a8813f; --ink: #f2ead9; --mut: #b6aa95; --panel: rgba(20, 14, 10, .84); --line: rgba(214, 180, 110, .45); --red: #c8372d;
    --pf: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", "Heiti TC", system-ui, sans-serif;
    --sf: "BiauKai", "DFKai-SB", "標楷體", "Kaiti TC", "STKaiti", "KaiTi", "Noto Serif TC", "Source Han Serif TC", "Songti TC", "PMingLiU", serif; }
  html, body { height: 100%; overflow: hidden; background: #0d0907; color: var(--ink); font-family: var(--pf); touch-action: none; }
  #cv { position: fixed; inset: 0; width: 100vw; height: 100vh; height: 100dvh; display: block; touch-action: none; }
  .hide { display: none !important; }
  button { font-family: var(--pf); -webkit-user-select: none; user-select: none; }
  .kg-fab { background: rgba(22, 16, 12, .84); border: 1.5px solid var(--line); box-shadow: 0 4px 14px rgba(0, 0, 0, .5); font-size: 20px; }
  .kg-fab:hover { border-color: var(--gold); }
  .glass { background: var(--panel); border: 1px solid var(--line); box-shadow: 0 6px 22px rgba(0, 0, 0, .45); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); }

  .ui { position: fixed; z-index: 50; }
  #bPause { right: 10px; top: 66px; width: 48px; height: 48px; padding: 0; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; color: var(--ink); }
  #bPause svg { width: 20px; height: 20px; }
  #bPause:active { transform: translateY(1px); border-color: var(--gold); }
  #info { padding: 0 12px; height: 34px; border-radius: 8px; font-size: 12.5px; letter-spacing: 1px; white-space: nowrap; color: var(--mut); display: flex; align-items: center; justify-content: center; gap: 8px; overflow: hidden; }
  #info b { color: var(--gold); font-weight: 700; }
  #info .sep { width: 1px; height: 12px; background: rgba(214, 180, 110, .35); }

  .pbar { display: flex; align-items: center; gap: 9px; padding: 0 10px; border-radius: 10px; transition: border-color .25s, box-shadow .25s; }
  .pbar.on { border-color: var(--gold); box-shadow: 0 0 0 1px rgba(214, 180, 110, .35), 0 6px 22px rgba(0, 0, 0, .45); }
  .pc { flex: none; width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; font-family: var(--sf); font-weight: 900; font-size: 17px; line-height: 1;
    background: radial-gradient(circle at 38% 32%, #f8e4b8, #e0b97c 55%, #b9884f); box-shadow: inset 0 -2px 0 rgba(90, 55, 20, .55), 0 2px 4px rgba(0, 0, 0, .5); }
  .pc.r { color: #a3201b; } .pc.b { color: #1e1a16; }
  .pname { flex: 1; min-width: 0; display: flex; flex-direction: column; line-height: 1.2; }
  .pname b { font-family: var(--sf); font-size: 15px; letter-spacing: 2px; color: var(--ink); font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .pname small { font-size: 11.5px; color: var(--mut); letter-spacing: 1px; white-space: nowrap; }
  .pbar.on .pname small { color: var(--gold); }
  .pbar.chk .pname small { color: #ff8a7a; font-weight: 700; }
  .caps { flex: none; max-width: 46%; display: flex; flex-wrap: wrap-reverse; justify-content: flex-end; gap: 2px; font-family: var(--sf); font-size: 13px; font-weight: 700; line-height: 1; }
  .caps i { font-style: normal; width: 17px; height: 17px; border-radius: 50%; display: grid; place-items: center; background: #d9b37a; box-shadow: inset 0 -1px 0 rgba(90, 55, 20, .6); }
  .caps i.r { color: #a3201b; } .caps i.b { color: #1e1a16; }
  .dots::after { content: ''; animation: dots 1.2s steps(4) infinite; }
  @keyframes dots { 0% { content: ''; } 25% { content: '．'; } 50% { content: '．．'; } 75% { content: '．．．'; } }

  #ctrl { display: grid; grid-template-columns: repeat(3, 1fr); gap: 7px; }
  .cbtn { min-height: 46px; border-radius: 10px; border: 1px solid var(--line); background: linear-gradient(180deg, rgba(46, 36, 28, .95), rgba(22, 16, 12, .95)); color: var(--ink); font-size: 15px; font-weight: 700; letter-spacing: 2px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px; box-shadow: 0 4px 12px rgba(0, 0, 0, .4), inset 0 1px 0 rgba(255, 255, 255, .06); touch-action: manipulation; transition: transform .08s, border-color .2s, opacity .2s; }
  .cbtn svg { width: 17px; height: 17px; flex: none; }
  .cbtn:active { transform: translateY(1px); border-color: var(--gold); }
  .cbtn:disabled { opacity: .35; cursor: default; }
  .cbtn.warn { border-color: rgba(200, 55, 45, .55); }
  #moveBox { border-radius: 10px; padding: 6px 4px 6px 10px; display: flex; flex-direction: column; min-height: 0; }
  #moveBox h3 { margin: 0 0 4px; font-family: var(--sf); font-size: 13px; font-weight: 700; letter-spacing: 4px; color: var(--gold); }
  .mlist { flex: 1; min-height: 0; overflow-y: auto; font-family: var(--sf); font-size: 15px; line-height: 1.75; color: var(--ink); padding-right: 6px; touch-action: pan-y; }
  .mlist .mr { display: grid; grid-template-columns: 30px 1fr 1fr; }
  .mlist .no { color: #8e826f; font-family: var(--pf); font-size: 12px; }
  .mlist .cur { color: var(--gold); }
  .mlist .rd { color: #e9a196; }
  .mlist .empty { color: #8e826f; font-family: var(--pf); font-size: 13px; }

  /* 遮罩與卡片 */
  .ov { position: fixed; inset: 0; z-index: 9200; display: flex; align-items: center; justify-content: center; padding: 16px; background: rgba(6, 4, 3, .66); animation: kg-fade .25s ease; }
  .card { background: rgba(20, 15, 11, .96) !important; width: min(440px, 100%); max-height: calc(100% - 8px); overflow: auto; border-radius: 14px; padding: 20px 18px 16px; text-align: center; color: var(--ink); }
  .card h2 { margin: 0 0 6px; font-family: var(--sf); font-size: 25px; letter-spacing: 6px; padding-left: 6px; color: var(--gold); font-weight: 800; }
  .card p { margin: 0 0 12px; font-size: 14px; line-height: 1.6; color: var(--mut); }
  .gbtn { font-family: var(--pf); font-size: 15.5px; font-weight: 800; letter-spacing: 3px; min-height: 46px; padding: 10px 16px; border-radius: 9px; cursor: pointer; border: 1px solid var(--line); background: rgba(255, 255, 255, .04); color: var(--ink); transition: transform .1s, background .2s, border-color .2s; touch-action: manipulation; }
  .gbtn:hover { border-color: var(--gold); }
  .gbtn:active { transform: translateY(1px); }
  .gbtn.pri { background: linear-gradient(180deg, #e4c47f, #b68c45); color: #1d1408; border-color: #f0d79c; box-shadow: 0 6px 16px rgba(180, 140, 70, .3); }
  .gbtn.dng { background: linear-gradient(180deg, #a3302a, #5e1612); border-color: #e2756c; }
  .acts { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
  .acts .gbtn { flex: 1; min-width: 120px; }

  #title { background: linear-gradient(180deg, rgba(8, 5, 3, .8) 0%, rgba(8, 5, 3, .35) 30%, rgba(8, 5, 3, .4) 50%, rgba(8, 5, 3, .92) 100%); flex-direction: column; justify-content: space-between; padding: 66px 16px calc(16px + env(safe-area-inset-bottom)); }
  .logo { text-align: center; pointer-events: none; }
  .logo .sub { font-size: 11px; letter-spacing: 6px; color: var(--gold); opacity: .9; }
  .logo .tl { display: flex; align-items: center; justify-content: center; gap: 12px; margin-top: 6px; white-space: nowrap; }
  .logo h1 { margin: 0; font-family: var(--sf); font-size: clamp(44px, 13vw, 78px); font-weight: 900; letter-spacing: .16em; padding-left: .16em; color: #f6efe0; text-shadow: 0 2px 0 rgba(0, 0, 0, .5), 0 0 30px rgba(214, 180, 110, .25); line-height: 1.12; white-space: nowrap; }
  .seal { flex: none; width: 1.05em; height: 1.05em; font-size: clamp(30px, 8vw, 48px); border-radius: 6px; background: #a8231c; color: #f7e6d0; font-family: var(--sf); font-weight: 900; display: grid; place-items: center; box-shadow: inset 0 0 0 3px #a8231c, inset 0 0 0 5px rgba(247, 230, 208, .75); transform: rotate(-4deg); line-height: 1; }
  .seal span { font-size: .62em; }
  .logo .motto { margin-top: 10px; font-family: var(--sf); font-size: 15px; letter-spacing: 8px; padding-left: 8px; color: #d9c9a8; }
  .tcard { width: min(440px, 100%); border-radius: 14px; padding: 14px 14px 12px; }
  .seg { display: flex; border: 1px solid var(--line); border-radius: 9px; overflow: hidden; margin-bottom: 8px; }
  .seg button { flex: 1; min-height: 44px; padding: 6px 2px; background: transparent; color: var(--mut); border: 0; border-left: 1px solid rgba(214, 180, 110, .25); font-size: 14px; font-weight: 700; letter-spacing: 1px; cursor: pointer; touch-action: manipulation; }
  .seg button:first-child { border-left: 0; }
  .seg button.on { background: rgba(214, 180, 110, .18); color: var(--ink); box-shadow: inset 0 -2px 0 var(--gold); }
  .seg.big button { font-size: 15px; font-family: var(--sf); letter-spacing: 2px; }
  .frow { display: flex; align-items: center; gap: 10px; }
  .frow label { flex: none; width: 40px; font-size: 13px; color: var(--mut); letter-spacing: 1px; text-align: left; }
  .frow .seg { flex: 1; }
  .tbtns { display: flex; gap: 8px; margin-top: 2px; }
  .tbtns .gbtn { flex: 1; font-size: 17px; }
  .tbtns .gbtn:not(.pri) { font-size: 14px; letter-spacing: 1px; flex: .8; }
  .rec { margin-top: 9px; font-size: 12px; color: var(--mut); letter-spacing: 1px; line-height: 1.7; }
  .rec b { color: var(--gold); font-weight: 700; }
  .tips { margin-top: 4px; font-size: 11.5px; color: #8e8574; line-height: 1.6; }
  body.land #title { flex-direction: row; align-items: center; justify-content: space-between; gap: 18px; padding: 16px calc(70px + env(safe-area-inset-right)) 16px calc(70px + env(safe-area-inset-left)); background: linear-gradient(90deg, rgba(8, 5, 3, .7) 15%, rgba(8, 5, 3, .92) 100%); }
  body.land #title .logo { flex: 1; min-width: 0; }
  body.land #title .logo .sub { letter-spacing: 3px; white-space: nowrap; font-size: 10.5px; }
  body.land #title .logo h1 { font-size: clamp(26px, min(5.2vw, 11vh), 78px); }
  body.land .seal { font-size: clamp(24px, min(4.5vw, 7vh), 48px); }
  body.land #title .tcard { width: min(430px, 52vw); flex: none; }
  body.short .tips { display: none; }
  body.short .logo .motto { font-size: 13px; letter-spacing: 5px; margin-top: 6px; }
  body.short .tcard { padding: 9px 11px; max-height: calc(100vh - 20px); overflow: auto; }
  body.short .seg { margin-bottom: 5px; }
  body.short .seg button { min-height: 40px; font-size: 13px; }
  body.short .tbtns .gbtn { min-height: 44px; padding: 6px 10px; }
  body.short .rec { margin-top: 4px; line-height: 1.5; font-size: 11.5px; }

  .stat { display: grid; grid-template-columns: 1fr auto; gap: 5px 14px; margin: 6px auto 14px; font-size: 14px; max-width: 300px; text-align: left; }
  .stat span:nth-child(2n) { text-align: right; font-variant-numeric: tabular-nums; color: var(--gold); font-weight: 700; }
  .pcard .frow { margin-bottom: 2px; }
  .pcard .frow label { width: 64px; }
  .pcard .acts { flex-direction: column; margin-top: 10px; }
  body.short .card { padding: 10px 14px; width: min(580px, 100%); }
  body.short .card h2 { font-size: 20px; margin: 0 0 4px; }
  body.short .pcard .stat { grid-template-columns: 1fr auto 1fr auto; max-width: none; font-size: 12.5px; margin: 4px 0 8px; gap: 3px 12px; }
  body.short .pcard .acts { flex-direction: row; margin-top: 4px; }
  body.short .pcard .acts .gbtn { min-width: 0; padding: 8px 6px; font-size: 14px; letter-spacing: 1px; }

  .res { font-size: 13px; letter-spacing: 4px; color: var(--mut); }
  .big { font-family: var(--sf); font-size: 44px; font-weight: 900; color: var(--gold); letter-spacing: 8px; padding-left: 8px; margin: 2px 0; }
  .big.lose { color: #c9bfae; }
  .big.win { color: #f0cf86; text-shadow: 0 0 24px rgba(214, 180, 110, .35); }
  .reason { display: inline-block; font-family: var(--sf); font-size: 17px; letter-spacing: 4px; padding: 3px 14px 3px 18px; border-radius: 4px; margin: 2px 0 10px; color: #f7e6d0; background: #8e2019; box-shadow: inset 0 0 0 2px #8e2019, inset 0 0 0 3px rgba(247, 230, 208, .5); }
  .reason.draw { background: #3e4a42; box-shadow: inset 0 0 0 2px #3e4a42, inset 0 0 0 3px rgba(247, 230, 208, .4); }
  .stars { font-size: 30px; letter-spacing: 6px; color: #f0cf86; margin: 0 0 6px; }
  .stars .off { color: #4a4036; }
  .mlist.full { max-height: 52vh; text-align: left; border-radius: 8px; padding: 8px 12px; background: rgba(255, 255, 255, .03); border: 1px solid rgba(214, 180, 110, .2); margin: 6px 0 14px; }

  #pzOv .card { width: min(640px, 100%); }
  .pzgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 8px; margin: 8px 0 12px; text-align: left; }
  .lv { position: relative; border: 1px solid rgba(214, 180, 110, .3); border-radius: 10px; background: linear-gradient(180deg, rgba(56, 42, 30, .6), rgba(24, 18, 13, .75)); padding: 8px 10px; min-height: 64px; cursor: pointer; color: var(--ink); font-family: var(--pf); text-align: left; transition: border-color .15s, transform .1s; touch-action: manipulation; }
  .lv:hover { border-color: var(--gold); }
  .lv:active { transform: translateY(1px); }
  .lv .no { font-size: 11px; color: var(--mut); letter-spacing: 1px; }
  .lv .nm { font-family: var(--sf); font-size: 17px; font-weight: 800; letter-spacing: 3px; color: #f6efe0; }
  .lv .ds { font-size: 12px; color: var(--gold); letter-spacing: 1px; }
  .lv .st { position: absolute; right: 8px; top: 7px; font-size: 13px; letter-spacing: 1px; color: #f0cf86; }
  .lv .st .off { color: #4a4036; }
  .lv.done { border-color: rgba(214, 180, 110, .6); }
  .kg-toast { top: 46%; padding: 9px 20px; border-radius: 8px; background: rgba(20, 15, 11, .94); border: 1px solid var(--gold); color: #f0dcae; font-family: var(--sf); font-size: 17px; font-weight: 700; letter-spacing: 2px; white-space: nowrap; box-shadow: 0 8px 26px rgba(0, 0, 0, .55); }
</style>
</head>
<body>
<canvas id="cv" aria-label="中國象棋棋盤"></canvas>
<button id="bPause" class="ui glass hide" aria-label="選單"><svg viewBox="0 0 24 24"><rect x="6" y="5" width="4" height="14" rx="1" fill="#f2ead9"/><rect x="14" y="5" width="4" height="14" rx="1" fill="#f2ead9"/></svg></button>
<div id="info" class="ui glass hide"></div>
<div id="barTop" class="ui pbar glass hide"><span class="pc"></span><div class="pname"><b></b><small></small></div><div class="caps"></div></div>
<div id="barBot" class="ui pbar glass hide"><span class="pc"></span><div class="pname"><b></b><small></small></div><div class="caps"></div></div>
<div id="moveBox" class="ui glass hide"><h3>棋譜</h3><div class="mlist" id="mlistSide"></div></div>
<div id="ctrl" class="ui hide">
  <button class="cbtn" id="cHint"><svg viewBox="0 0 24 24" fill="none" stroke="#d6b46e" stroke-width="2" stroke-linecap="round"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.2 1 2V16h5v-.1c0-.8.4-1.5 1-2A6 6 0 0 0 12 3Z"/></svg>提示</button>
  <button class="cbtn" id="cUndo"><svg viewBox="0 0 24 24" fill="none" stroke="#d6b46e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14 4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-3"/></svg>悔棋</button>
  <button class="cbtn" id="cFlip"><svg viewBox="0 0 24 24" fill="none" stroke="#d6b46e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 4v16M7 4 3 8M7 4l4 4M17 20V4M17 20l-4-4M17 20l4-4"/></svg>翻轉</button>
  <button class="cbtn" id="cList"><svg viewBox="0 0 24 24" fill="none" stroke="#d6b46e" stroke-width="2" stroke-linecap="round"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M9 8h6M9 12h6M9 16h3"/></svg>棋譜</button>
  <button class="cbtn" id="cDraw"><svg viewBox="0 0 24 24" fill="none" stroke="#d6b46e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12h16M4 7h16M4 17h16"/></svg>求和</button>
  <button class="cbtn warn" id="cResign"><svg viewBox="0 0 24 24" fill="none" stroke="#e2756c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 21V4M5 4h12l-2 4 2 4H5"/></svg><span>認輸</span></button>
</div>

<div id="title" class="ov hide">
  <div class="logo">
    <div class="sub">XIANGQI · CHINESE CHESS</div>
    <div class="tl"><h1>中國象棋</h1><div class="seal"><span>弈</span></div></div>
    <div class="motto">楚河漢界 · 運籌帷幄</div>
  </div>
  <div class="tcard glass">
    <div class="seg big" id="segMode"><button data-v="ai">對弈電腦</button><button data-v="pvp">雙人對弈</button><button data-v="puzzle">殘局挑戰</button></div>
    <div class="frow" id="rowSide"><label>執子</label><div class="seg" id="segSide"><button data-v="0">執紅先行</button><button data-v="1">執黑後走</button></div></div>
    <div class="frow" id="rowDiff"><label>難度</label><div class="seg" id="segDiff"><button data-v="easy">入門</button><button data-v="normal">普通</button><button data-v="hard">困難</button><button data-v="master">大師</button></div></div>
    <div class="tbtns"><button class="gbtn pri" id="tStart">開始對局</button><button class="gbtn hide" id="tResume">繼續上局</button></div>
    <div class="rec" id="tRec"></div>
    <div class="tips">點選棋子後點選落點，或直接拖曳。鍵盤：方向鍵移動游標・Enter 選取/落子・U 悔棋・H 提示・F 翻轉・P 選單</div>
  </div>
</div>
<div id="pzOv" class="ov hide">
  <div class="card glass">
    <h2>殘局挑戰</h2>
    <p>紅方先行，於限定步數內將死黑方。黑方由電腦全力防守。</p>
    <div class="pzgrid" id="pzGrid"></div>
    <div class="acts"><button class="gbtn" id="pzBack">返回</button></div>
  </div>
</div>
<div id="pauseOv" class="ov hide">
  <div class="card glass pcard">
    <h2>暫停</h2>
    <div class="frow"><label>背景音樂</label><div class="seg" id="pMusic"><button data-v="on">開</button><button data-v="off">關</button></div></div>
    <div class="frow"><label>落點提示</label><div class="seg" id="pDots"><button data-v="on">顯示</button><button data-v="off">隱藏</button></div></div>
    <div class="stat" id="pStats"></div>
    <div class="acts">
      <button class="gbtn pri" id="pResume">繼續對局</button>
      <button class="gbtn" id="pRestart">重新開始</button>
      <button class="gbtn" id="pQuit">回到標題</button>
    </div>
  </div>
</div>
<div id="listOv" class="ov hide">
  <div class="card glass">
    <h2>棋譜</h2>
    <div class="mlist full" id="mlistOv"></div>
    <div class="acts"><button class="gbtn pri" id="lClose">關閉</button></div>
  </div>
</div>
<div id="cfOv" class="ov hide">
  <div class="card glass">
    <h2 id="cfTitle">確認</h2>
    <p id="cfMsg"></p>
    <div class="acts"><button class="gbtn" id="cfNo">取消</button><button class="gbtn pri" id="cfYes">確定</button></div>
  </div>
</div>
<div id="overOv" class="ov hide">
  <div class="card glass">
    <div class="res" id="oSub">對局結束</div>
    <div class="big" id="oBig">勝</div>
    <div class="stars hide" id="oStars"></div>
    <div><span class="reason" id="oReason">將死</span></div>
    <p id="oMsg"></p>
    <div class="stat" id="oStats"></div>
    <div class="acts" id="oActs"></div>
  </div>
</div>
<script src="../../assets/common.js"></script>
<script>
/*ENGINE-START*/
function XQEngine() {
  'use strict';
  // ---- 棋盤：16x16 填充陣列，格子 sq = (y+3)*16 + (x+3)；y=0 在黑方底線 ----
  const B = new Uint8Array(256);
  const IN_BOARD = new Uint8Array(256), IN_FORT = new Uint8Array(256);
  for (let y = 0; y < 10; y++) for (let x = 0; x < 9; x++) {
    const s = (y + 3) * 16 + x + 3; IN_BOARD[s] = 1;
    if (x >= 3 && x <= 5 && (y <= 2 || y >= 7)) IN_FORT[s] = 1;
  }
  const KING_D = [-16, -1, 1, 16], ADV_D = [-17, -15, 15, 17];

  };
  // 古琴風背景音樂（五聲音階）
  const SCALE = [146.83, 174.61, 196.0, 220.0, 261.63, 293.66, 349.23, 392.0, 440.0, 523.25];
  let musicT = 0, mIdx = 4, mStep = 0;
  function musicTick() {
    clearTimeout(musicT);
    if (!prefs.music || document.hidden || S.paused) { musicT = setTimeout(musicTick, 800); return; }
    if (!KG.isMuted()) {
      mStep++;
      if (mStep % 16 === 1) KG.note(73.42, 4.5, 'sine', 0.05);
      if (mStep % 16 === 9) KG.note(110, 4, 'sine', 0.035);
      if (Math.random() < 0.82) {
        mIdx = clamp(mIdx + [-2, -1, -1, 1, 1, 2, 0][Math.floor(Math.random() * 7)], 0, SCALE.length - 1);
        const f = SCALE[mIdx];
        if (Math.random() < 0.18) KG.note(f, 1.4, 'triangle', 0.045, 0, f * (Math.random() < 0.5 ? 1.06 : 0.95));
        else { KG.note(f, 1.8, 'triangle', 0.05); KG.note(f * 2, 0.8, 'sine', 0.014); }
        if (Math.random() < 0.2) KG.note(SCALE[clamp(mIdx - 3, 0, 9)], 1.6, 'triangle', 0.03, 0.02);
      }
    }
    musicT = setTimeout(musicTick, [620, 620, 930, 1240, 620, 1550][Math.floor(Math.random() * 6)]);
  }

  // ---------------- 對局流程 ----------------
  function startGame(opts) {
    opts = opts || {};
    cancelSearch();
    clearTimeout(S.aiTimer);
    S.mode = opts.mode || 'ai';
    S.human = opts.side == null ? 0 : (opts.side === 'black' || opts.side === 1 || opts.side === '1') ? 1 : 0;
    S.diff = DIFF[opts.diff] ? opts.diff : 'normal';
    S.pz = S.mode === 'puzzle' ? (opts.puzzle | 0) : -1;
    if (S.mode === 'puzzle') S.human = 0;
    S.startFen = opts.fen || (S.mode === 'puzzle' ? PUZZLES[S.pz].fen : START_FEN);
    S.moves = []; S.over = null; S.sel = -1; S.selMoves = []; S.hint = null; S.hints = opts.hints || 0; S.undos = 0;
    S.thinking = false; S.paused = false; S.userFlip = !!opts.flip; S.cursor = null;
    anim = null; banner = null; pops.length = 0; drag = null;
    E.fromFen(S.startFen);
    if (opts.moves) for (const s of opts.moves) { if (!applyQuiet(s)) break; }
    S.screen = 'play';
    showScreen();
    buildStatic();
    updateUI();
    if (opts.moves && opts.moves.length) { const r = evalEnd(); if (r) { finish(r, true); return; } }
    save();
    dirty = true;
    maybeAI();
  }
  function applyQuiet(iccs) {
    const mv = E.iccsToMv(iccs);
    if (E.legalMoves().indexOf(mv) < 0) return false;
    const p = E.B[mv & 255], cap = E.B[mv >> 8], cn = moveToChinese(E, mv);
    E.makeMove(mv);
    S.moves.push({ iccs, cn, cap, chk: E.inCheck(), side: 1 - E.sd, p });
    return true;
  }
  function save() {
    if (S.screen !== 'play' || S.over) { store.set('xq:save', null); return; }
    store.set('xq:save', { mode: S.mode, human: S.human, diff: S.diff, pz: S.pz, startFen: S.startFen, moves: S.moves.map(m => m.iccs), hints: S.hints, flip: S.userFlip });
  }

  function doMove(mv, opt) {
    opt = opt || {};
    if (S.over) return false;
    if (E.legalMoves().indexOf(mv) < 0) return false;
    const src = mv & 255, dst = mv >> 8;
    const p = E.B[src], cap = E.B[dst];
    const cn = moveToChinese(E, mv), iccs = E.mvToIccs(mv);
    E.makeMove(mv);
    const chk = E.inCheck();
    S.moves.push({ iccs, cn, cap, chk, side: 1 - E.sd, p });
    S.sel = -1; S.selMoves = []; S.hint = null;
    const x2 = sx(E.sqX(dst)), y2 = sy(E.sqY(dst));
    const effects = () => {
      if (cap) {
        snd.capture(); burst(x2, y2, 18, !!(cap & 8)); shake = { t0: now(), amp: L.c * 0.07 };
        KG.vibrate(25);
      } else snd.clack();
      if (chk && !S.over) { banner = { text: '將軍！', t0: now(), dur: 1150 }; setTimeout(() => snd.check(), 60); }
      animating = true; dirty = true;
    };
    if (cap) pops.push({ p: cap, x: x2, y: y2, t0: now() + (opt.instant ? 0 : 200) });
    if (opt.instant) effects();
    else {
      const dist = Math.hypot(sx(E.sqX(src)) - x2, sy(E.sqY(src)) - y2);
      anim = { p, to: dst, x1: sx(E.sqX(src)), y1: sy(E.sqY(src)), x2, y2, t0: now(), dur: clamp(140 + dist * 0.55, 170, 360), done: effects };
    }
    const res = evalEnd();
    if (res) finish(res);
    else save();
    updateUI();
    animating = true; dirty = true;
    if (!S.over) maybeAI();
    return true;
  }

  // 判定勝負：回傳 {winner: 0|1|-1, reason, detail}
  function evalEnd() {
    const sd = E.sd, mover = 1 - sd;
    if (E.legalMoves().length === 0) return { winner: mover, loser: sd, reason: E.inCheck() ? '將死' : '困斃' };
    const rep = E.gameRep();
    if (rep.count >= 3) {
      if (rep.oppChk && !rep.selfChk) return { winner: sd, loser: mover, reason: '長將判負', detail: SIDE_NAME[mover] + '長將不變' };
      if (rep.selfChk && !rep.oppChk) return { winner: mover, loser: sd, reason: '長將判負', detail: SIDE_NAME[sd] + '長將不變' };
      return { winner: -1, reason: '和棋', detail: '同一局面重複三次' };
    }
    if (E.sinceCapture() >= 120) return { winner: -1, reason: '和棋', detail: '六十回合未吃子' };
    if (E.attackers(0) === 0 && E.attackers(1) === 0) return { winner: -1, reason: '和棋', detail: '雙方均無過河進攻子力' };
    if (S.mode === 'puzzle') {
      const redMoves = S.moves.filter(m => m.side === 0).length;
      if (sd === 0 && redMoves >= PUZZLES[S.pz].n) return { winner: 1, loser: 0, reason: '挑戰失敗', detail: PUZZLES[S.pz].n + ' 步內未能將死' };
    }
    return null;
  }

  function finish(res, silent) {
    S.over = res;
    S.thinking = false; S.sel = -1; S.selMoves = []; S.hint = null;
    cancelSearch();
    clearTimeout(S.aiTimer);
    store.set('xq:save', null);
    let outcome = res.winner === -1 ? 'd' : null;
    if (S.mode === 'ai' && !silent) {
      outcome = res.winner === -1 ? 'd' : res.winner === S.human ? 'w' : 'l';
      stats[S.diff][outcome]++; saveStats();
    } else if (S.mode === 'pvp' && !silent) { stats.pvp++; saveStats(); }
    let stars = 0;
    if (S.mode === 'puzzle' && res.winner === 0 && !silent) {
      stars = S.hints === 0 && S.undos === 0 ? 3 : S.hints + S.undos <= 1 ? 2 : 1;
      const pz = PUZZLES[S.pz];
      stats.pz[pz.id] = Math.max(stats.pz[pz.id] || 0, stars); saveStats();
    }
    S.lastStars = stars;
    updateUI();
    if (silent) return;
    const humanLost = (S.mode === 'ai' || S.mode === 'puzzle') && res.winner !== -1 && res.winner !== (S.mode === 'puzzle' ? 0 : S.human);
    setTimeout(() => {
      if (res.winner === -1) snd.draw(); else if (humanLost) snd.lose(); else snd.win();
      const txt = res.winner === -1 ? '和' : humanLost ? '負' : '勝';
      banner = { text: res.reason === '挑戰失敗' ? '失敗' : res.reason === '長將判負' ? '長將' : res.reason === '和棋' ? '和棋' : res.reason === '困斃' ? '困斃' : res.reason === '認輸' ? '認輸' : (txt === '負' ? '絕殺' : '將死'), t0: now(), dur: 1300, col: res.winner === -1 ? '#3e4a42' : '#a8231c' };
      dirty = true;
      if (!humanLost && res.winner !== -1) for (let i = 0; i < 3; i++) setTimeout(() => burst(L.bx + L.bw * (0.25 + 0.25 * i), L.oy + 4.5 * L.c, 14, true), i * 120);
    }, anim ? anim.dur + 120 : 120);
    S.overTimer = setTimeout(() => showOver(), (anim ? anim.dur : 0) + 1500);
  }

  function maybeAI() {
    if (S.over || S.screen !== 'play') return;
    const side = aiSide();
    if (side < 0 || E.sd !== side) return;
    S.thinking = true; updateUI(); animating = true; dirty = true;
    const myId = ++S.searchId;
    const t0 = now();
    const ply = S.moves.length;
    const book = S.mode === 'ai' && S.startFen === START_FEN && ply < 10 ? BOOK.get(E.key) : null;
    const play = (iccs) => {
      if (myId !== S.searchId || S.over || S.screen !== 'play') return;
      const wait = Math.max(0, (anim ? 420 : 380) - (now() - t0));
      S.aiTimer = setTimeout(() => {
        if (myId !== S.searchId || S.over) return;
        if (S.paused) { S.resumeAI = () => play(iccs); return; }
        S.thinking = false;
        const mv = E.iccsToMv(iccs);
        if (!doMove(mv)) { updateUI(); }
      }, wait);
    };
    if (book && book.length && Math.random() < 0.9) { play(book[Math.floor(Math.random() * book.length)]); return; }
    const opts = S.mode === 'puzzle' ? { timeMs: 900, maxDepth: 30, minDepth: 3 } : DIFF[S.diff].opts;
    askEngine(opts, r => {
      if (myId !== S.searchId) return;
      if (!r.mv) { S.thinking = false; updateUI(); return; }
      S.lastSearch = r;
      play(r.iccs);
    });
  }

  function undo() {
    if (S.screen !== 'play' || S.over && S.mode !== 'puzzle') return;
    if (S.over) { S.over = null; clearTimeout(S.overTimer); hideOv('overOv'); }
    cancelSearch(); clearTimeout(S.aiTimer); S.searchId++; S.thinking = false;
    const ai = aiSide();
    let popped = 0, humanPopped = false;
    while (S.moves.length) {
      const m = S.moves[S.moves.length - 1];
      E.undoMove(); S.moves.pop(); popped++;
      if (m.side !== ai) humanPopped = true;
      if (ai < 0 || (humanPopped && E.sd !== ai)) break;
    }
    if (ai >= 0 && E.sd === ai && S.moves.length === 0) { /* AI 先手局面：重新讓電腦走 */ }
    if (!popped) { snd.bad(); return; }
    S.undos++;
    S.sel = -1; S.selMoves = []; S.hint = null; anim = null; banner = null; pops.length = 0;
    snd.select();
    save(); updateUI(); dirty = true;
    maybeAI();
  }

  function hint() {
    if (!humanTurn()) return;
    S.thinking = true; updateUI();
    const myId = ++S.searchId;
    $('cHint').disabled = true;
    askEngine({ timeMs: 900, maxDepth: 30, minDepth: 3 }, r => {
      if (myId !== S.searchId) return;
      S.thinking = false;
      if (r.mv) {
        S.hints++;
        S.hint = { mv: r.mv, t0: now() };
        const src = r.mv & 255;
        S.sel = src; S.selMoves = E.legalMoves().filter(m => (m & 255) === src);
        KG.toast('提示：' + moveToChinese(E, r.mv));
        snd.select();
        save();
      }
      updateUI(); animating = true; dirty = true;
    });
  }

  function offerDraw() {
    if (!humanTurn()) return;
    if (S.mode === 'pvp') {
      confirmBox('求和', SIDE_NAME[E.sd] + '提議和棋，' + SIDE_NAME[1 - E.sd] + '是否同意？', '同意和棋', () => finish({ winner: -1, reason: '和棋', detail: '雙方同意和棋' }));
      return;
    }
    if (S.mode === 'puzzle') return;
    if (S.moves.length < 10) { KG.toast('對局尚早，電腦婉拒和棋'); return; }
    S.thinking = true; updateUI();
    const myId = ++S.searchId;
    askEngine({ timeMs: 500, maxDepth: 30, minDepth: 2 }, r => {
      if (myId !== S.searchId) return;
      S.thinking = false;
      const aiScore = -r.score; // r.score 為輪到方（玩家）的評分
      if (aiScore <= 40) { KG.toast('電腦接受和棋'); finish({ winner: -1, reason: '和棋', detail: '雙方議和' }); }
      else { KG.toast('電腦拒絕和棋'); snd.bad(); updateUI(); }
    });
  }
  function resign() {
    if (S.screen !== 'play') return;
    if (S.over) { showOver(); return; }
    const who = S.mode === 'pvp' ? E.sd : S.mode === 'puzzle' ? 0 : S.human;
    confirmBox('認輸', S.mode === 'pvp' ? SIDE_NAME[who] + '確定要認輸嗎？' : '確定要認輸嗎？', '認輸', () => {
      cancelSearch(); S.searchId++;
      finish({ winner: 1 - who, loser: who, reason: '認輸', detail: SIDE_NAME[who] + '認輸' });
    });
  }
  function flip() {
    if (S.screen !== 'play') return;
    S.userFlip = !S.userFlip; buildStatic(); save(); updateUI(); dirty = true; snd.select();
  }

  // ---------------- 介面 ----------------
  function showOv(id) { $(id).classList.remove('hide'); }
  function hideOv(id) { $(id).classList.add('hide'); }
  function showScreen() {
    const play = S.screen === 'play';
    for (const id of ['bPause', 'info', 'barTop', 'barBot', 'ctrl', 'moveBox']) $(id).classList.toggle('hide', !play);
    if (play) hideOv('title'); else showTitle();
  }
  let cfYes = null;
  function confirmBox(title, msg, yesText, onYes) {
    $('cfTitle').textContent = title; $('cfMsg').textContent = msg; $('cfYes').textContent = yesText || '確定';
    cfYes = onYes; showOv('cfOv');
  }
  function capsHtml(side) {
    // side 吃掉的對方棋子
    let h = '';
    const order = [4, 3, 5, 1, 2, 6];
    const list = S.moves.filter(m => m.side === side && m.cap).map(m => m.cap).sort((a, b) => order.indexOf(a & 7) - order.indexOf(b & 7));
    for (const p of list) h += `<i class="${p & 8 ? 'r' : 'b'}">${PIECE_CHARS[p & 8 ? 0 : 1][p & 7]}</i>`;
    return h;
  }
  function sideLabel(side) {
    if (S.mode === 'pvp') return SIDE_NAME[side];
    if (S.mode === 'puzzle') return side === 0 ? '你・紅方' : '守方・電腦';
    return side === S.human ? '你・' + SIDE_NAME[side].slice(0, 1) + '方' : '電腦・' + DIFF[S.diff].name;
  }
  function updateUI() {
    if (S.screen !== 'play') return;
    const fl = flipped();
    const topSide = fl ? 0 : 1, botSide = 1 - topSide;
    for (const [id, side] of [['barTop', topSide], ['barBot', botSide]]) {
      const el = $(id);
      const pc = el.querySelector('.pc'); pc.textContent = side === 0 ? '帥' : '將'; pc.className = 'pc ' + (side === 0 ? 'r' : 'b');
      el.querySelector('b').textContent = sideLabel(side);
      const sm = el.querySelector('small');
      const active = !S.over && E.sd === side;
      let st = '';
      sm.classList.remove('dots');
      if (S.over) {
        st = S.over.winner === -1 ? '和棋' : S.over.winner === side ? '勝' : '負・' + S.over.reason;
      } else if (active) {
        if (S.thinking && (side === aiSide() || S.hint === null)) { st = side === aiSide() ? '思考中' : '分析中'; sm.classList.add('dots'); }
        else if (E.inCheck()) st = '被將軍！';
        else st = S.mode === 'pvp' ? '輪到' + SIDE_NAME[side] : side === aiSide() ? '準備中' : '輪到你';
      } else st = '等待';
      sm.textContent = st;
      el.classList.toggle('on', active);
      el.classList.toggle('chk', active && E.inCheck());
      el.querySelector('.caps').innerHTML = capsHtml(side);
    }
    // 資訊列
    const round = Math.floor(S.moves.length / 2) + 1;
    let info;
    if (S.mode === 'puzzle') {
      const pz = PUZZLES[S.pz], used = S.moves.filter(m => m.side === 0).length;
      info = `殘局 <b>${pz.name}</b><span class="sep"></span>紅先 ${N_CN[pz.n]} 步殺<span class="sep"></span>已走 <b>${used}</b>/${pz.n}`;
    } else if (S.mode === 'pvp') info = `雙人對弈<span class="sep"></span>第 <b>${round}</b> 回合`;
    else info = `對弈電腦・<b>${DIFF[S.diff].name}</b><span class="sep"></span>第 <b>${round}</b> 回合`;
    $('info').innerHTML = info;
    // 按鈕狀態
    const ht = humanTurn();
    $('cHint').disabled = !ht;
    $('cUndo').disabled = !S.moves.length || (!!S.over && S.mode !== 'puzzle') || (aiSide() >= 0 && !S.moves.some(m => m.side !== aiSide()));
    $('cDraw').disabled = !ht || S.mode === 'puzzle';
    $('cResign').querySelector('span').textContent = S.over ? '結算' : '認輸';
    $('cResign').disabled = false;
    renderList($('mlistSide'));
    if (!$('listOv').classList.contains('hide')) renderList($('mlistOv'));
  }
  function renderList(el) {
    if (!el || (el.offsetParent === null && el.id === 'mlistSide')) return;
    const ms = S.moves;
    if (!ms.length) { el.innerHTML = '<div class="empty">尚未落子</div>'; return; }
    let h = '', i = 0, no = 1;
    const firstBlack = ms[0].side === 1;
    while (i < ms.length) {
      let r = '', b = '';
      if (i === 0 && firstBlack) r = '…';
      else { r = cell(i); i++; }
      if (i < ms.length && ms[i].side === 1) { b = cell(i); i++; }
      h += `<div class="mr"><span class="no">${no}.</span><span>${r}</span><span>${b}</span></div>`;
      no++;
    }
    function cell(k) { const m = ms[k]; const cls = (k === ms.length - 1 ? 'cur ' : '') + (m.side === 0 ? 'rd' : ''); return `<span class="${cls}">${m.cn}${m.chk ? '＋' : ''}</span>`; }
    el.innerHTML = h;
    el.scrollTop = el.scrollHeight;
  }

  function showTitle() {
    S.screen = 'title';
    for (const id of ['bPause', 'info', 'barTop', 'barBot', 'ctrl', 'moveBox']) $(id).classList.add('hide');
    E.fromFen(START_FEN); S.moves = []; S.over = null; S.sel = -1; S.userFlip = false; S.mode = 'ai'; S.human = 0;
    buildStatic();
    setSeg('segMode', prefs.mode); setSeg('segSide', String(prefs.side)); setSeg('segDiff', prefs.diff);
    $('rowSide').classList.toggle('hide', prefs.mode !== 'ai');
    $('rowDiff').classList.toggle('hide', prefs.mode !== 'ai');
    $('tStart').textContent = prefs.mode === 'puzzle' ? '選擇殘局' : '開始對局';
    const sv = store.get('xq:save', null);
    const rb = $('tResume');
    if (sv && sv.moves) {
      rb.classList.remove('hide');
      rb.textContent = '繼續上局';
      rb.title = (sv.mode === 'ai' ? '對弈電腦・' + DIFF[sv.diff].name : sv.mode === 'pvp' ? '雙人對弈' : '殘局・' + (PUZZLES[sv.pz] || {}).name) + '・第 ' + (Math.floor(sv.moves.length / 2) + 1) + ' 回合';
    } else rb.classList.add('hide');
    const s = stats;
    const tot = k => s[k].w + '勝 ' + s[k].l + '負 ' + s[k].d + '和';
    const solved = Object.keys(s.pz).length;
    const starSum = Object.values(s.pz).reduce((a, b) => a + b, 0);
    $('tRec').innerHTML = prefs.mode === 'puzzle'
      ? `殘局已破解 <b>${solved}</b> / ${PUZZLES.length}　累計 <b>${starSum}</b> 星`
      : prefs.mode === 'pvp' ? `雙人對局已完成 <b>${s.pvp}</b> 局` : `${DIFF[prefs.diff].name}戰績　<b>${tot(prefs.diff)}</b>`;
    showOv('title');
    dirty = true;
  }
  function setSeg(id, v) { $(id).querySelectorAll('button').forEach(b => b.classList.toggle('on', b.dataset.v === v)); }
  function bindSeg(id, fn) { $(id).querySelectorAll('button').forEach(b => b.addEventListener('click', () => { setSeg(id, b.dataset.v); KG.sound('click'); fn(b.dataset.v); })); }

  function showPuzzles() {
    const g = $('pzGrid'); g.innerHTML = '';
    PUZZLES.forEach((pz, i) => {
      const st = stats.pz[pz.id] || 0;
      const b = document.createElement('button');
      b.className = 'lv' + (st ? ' done' : '');
      b.innerHTML = `<div class="no">第 ${i + 1} 局</div><div class="nm">${pz.name}</div><div class="ds">紅先${N_CN[pz.n]}步殺</div><div class="st">${[0, 1, 2].map(k => `<span class="${k < st ? '' : 'off'}">★</span>`).join('')}</div>`;
      b.addEventListener('click', () => { KG.sound('click'); hideOv('pzOv'); startGame({ mode: 'puzzle', puzzle: i }); KG.toast(pz.tip); });
      g.appendChild(b);
    });
    showOv('pzOv');
  }

  function showOver() {
    if (!S.over) return;
    const res = S.over;
    const isAI = S.mode === 'ai', isPz = S.mode === 'puzzle';
    const humanSide = isPz ? 0 : S.human;
    let big, cls, sub;
    if (isPz) {
      const pz = PUZZLES[S.pz];
      sub = '殘局・' + pz.name;
      if (res.winner === 0) { big = '破解成功'; cls = 'win'; } else { big = '挑戰失敗'; cls = 'lose'; }
    } else if (isAI) {
      sub = '對弈電腦・' + DIFF[S.diff].name;
      if (res.winner === -1) { big = '和局'; cls = ''; } else if (res.winner === humanSide) { big = '你贏了'; cls = 'win'; } else { big = '你輸了'; cls = 'lose'; }
    } else {
      sub = '雙人對弈';
      if (res.winner === -1) { big = '和局'; cls = ''; } else { big = SIDE_NAME[res.winner] + '勝'; cls = 'win'; }
    }
    $('oSub').textContent = sub;
    const ob = $('oBig'); ob.textContent = big; ob.className = 'big ' + cls;
    const rs = $('oReason');
    rs.textContent = res.reason === '和棋' ? '和棋' : res.reason;
    rs.className = 'reason' + (res.winner === -1 ? ' draw' : '');
    let msg = '';
    const rounds = Math.ceil(S.moves.length / 2);
    if (res.reason === '將死') msg = SIDE_NAME[res.loser] + '被將死';
    else if (res.reason === '困斃') msg = SIDE_NAME[res.loser] + '無子可動，困斃判負';
    else if (res.detail) msg = res.detail;
    msg += (msg ? '・' : '') + '共 ' + rounds + ' 回合';
    $('oMsg').textContent = msg;
    const stEl = $('oStars');
    if (isPz && res.winner === 0) {
      stEl.classList.remove('hide');
      stEl.innerHTML = [0, 1, 2].map(k => `<span class="${k < S.lastStars ? '' : 'off'}">★</span>`).join('');
    } else stEl.classList.add('hide');
    const os = $('oStats');
    if (isAI) { const s = stats[S.diff]; os.innerHTML = `<span>${DIFF[S.diff].name}戰績</span><span>${s.w} 勝 ${s.l} 負 ${s.d} 和</span>`; os.classList.remove('hide'); }
    else if (isPz) { const solved = Object.keys(stats.pz).length; os.innerHTML = `<span>已破解殘局</span><span>${solved} / ${PUZZLES.length}</span>`; os.classList.remove('hide'); }
    else os.classList.add('hide');
    const acts = $('oActs'); acts.innerHTML = '';
    const btn = (text, cls2, fn) => { const b = document.createElement('button'); b.className = 'gbtn ' + (cls2 || ''); b.textContent = text; b.addEventListener('click', () => { KG.sound('click'); hideOv('overOv'); fn(); }); acts.appendChild(b); };
    if (isPz) {
      if (res.winner === 0 && S.pz < PUZZLES.length - 1) btn('下一題', 'pri', () => { startGame({ mode: 'puzzle', puzzle: S.pz + 1 }); KG.toast(PUZZLES[S.pz].tip); });
      btn(res.winner === 0 ? '再解一次' : '再試一次', res.winner === 0 ? '' : 'pri', () => startGame({ mode: 'puzzle', puzzle: S.pz }));
      if (res.winner !== 0 && S.moves.length) btn('悔棋重來', '', () => undo());
      btn('題目列表', '', () => { S.screen = 'title'; showScreen(); showPuzzles(); });
    } else {
      btn('再來一局', 'pri', () => startGame({ mode: S.mode, side: S.human, diff: S.diff }));
      btn('檢視棋局', '', () => { });
      btn('回到標題', '', () => { S.screen = 'title'; showScreen(); });
    }
    showOv('overOv');
  }

  function togglePause(v) {
    if (S.screen !== 'play') return;
    S.paused = v == null ? !S.paused : v;
    if (S.paused) {
      setSeg('pMusic', prefs.music ? 'on' : 'off'); setSeg('pDots', prefs.dots ? 'on' : 'off');
      const s = stats;
      $('pStats').innerHTML = DIFF_KEYS.map(k => `<span>${DIFF[k].name}</span><span>${s[k].w}勝 ${s[k].l}負 ${s[k].d}和</span>`).join('') + `<span>殘局破解</span><span>${Object.keys(s.pz).length} / ${PUZZLES.length}</span>`;
      showOv('pauseOv');
    } else {
      hideOv('pauseOv');
      if (S.resumeAI) { const f = S.resumeAI; S.resumeAI = null; f(); }
    }
    updateUI();
  }

  // ---------------- 輸入 ----------------
  function hitSq(px, py) {
    if (!L) return -1;
    let x = Math.round((px - L.ox) / L.c), y = Math.round((py - L.oy) / L.c);
    if (x < 0 || x > 8 || y < 0 || y > 9) return -1;
    const dx = px - (L.ox + x * L.c), dy = py - (L.oy + y * L.c);
    if (Math.abs(dx) > L.c * 0.62 || Math.abs(dy) > L.c * 0.62) return -1;
    if (flipped()) { x = 8 - x; y = 9 - y; }
    return E.sqXY(x, y);
  }
  function ownPiece(sq) { const p = E.B[sq]; return p && ((p & 8) ? 0 : 1) === E.sd; }
  function select(sq) {
    S.sel = sq; S.selMoves = E.legalMoves().filter(m => (m & 255) === sq);
    snd.select(); dirty = true;
  }
  function tapSquare(sq, isDrop) {
    if (!humanTurn()) return false;
    if (sq < 0) { if (S.sel >= 0) { S.sel = -1; S.selMoves = []; dirty = true; } return false; }
    if (S.sel >= 0) {
      const mv = S.selMoves.find(m => (m >> 8) === sq);
      if (mv) { doMove(mv, { instant: isDrop }); return true; }
    }
    if (ownPiece(sq)) { if (S.sel !== sq || isDrop) select(sq); return false; }
    if (S.sel >= 0) { snd.bad(); S.sel = -1; S.selMoves = []; dirty = true; }
    return false;
  }
  cv.addEventListener('pointerdown', e => {
    if (S.screen !== 'play') return;
    S.cursor = null;
    const sq = hitSq(e.clientX, e.clientY);
    if (!humanTurn()) return;
    if (sq >= 0 && ownPiece(sq)) {
      if (S.sel !== sq) select(sq);
      drag = { sq, x0: e.clientX, y0: e.clientY, x: e.clientX, y: e.clientY, active: false, id: e.pointerId };
      try { cv.setPointerCapture(e.pointerId); } catch (er) { /* 忽略 */ }
    } else tapSquare(sq, false);
    dirty = true;
  });
  cv.addEventListener('pointermove', e => {
    if (!drag || e.pointerId !== drag.id) return;
    drag.x = e.clientX; drag.y = e.clientY;
    if (!drag.active && Math.hypot(drag.x - drag.x0, drag.y - drag.y0) > 8) drag.active = true;
    if (drag.active) dirty = true;
  });
  const endDrag = e => {
    if (!drag || (e && e.pointerId !== drag.id)) return;
    const d = drag; drag = null;
    if (d.active && e && e.type === 'pointerup') {
      const sq = hitSq(e.clientX, e.clientY);
      if (sq !== d.sq) {
        const mv = S.selMoves.find(m => (m >> 8) === sq);
        if (mv && humanTurn()) doMove(mv, { instant: true });
        else snd.bad();
      }
    }
    dirty = true;
  };
  cv.addEventListener('pointerup', endDrag);
  cv.addEventListener('pointercancel', endDrag);

  addEventListener('keydown', e => {
    if (S.screen !== 'play') return;
    const k = e.key;
    if (k === 'Escape' || k === 'p' || k === 'P') {
      if (!$('cfOv').classList.contains('hide')) { hideOv('cfOv'); return; }
      if (!$('listOv').classList.contains('hide')) { hideOv('listOv'); return; }
      togglePause(); return;
    }
    if (S.paused || !$('overOv').classList.contains('hide')) return;
    if (k === 'u' || k === 'U' || k === 'Backspace') { undo(); e.preventDefault(); return; }
    if (k === 'h' || k === 'H') { hint(); return; }
    if (k === 'f' || k === 'F') { flip(); return; }
    if (k === 'm' || k === 'M') { openList(); return; }
    const dirs = { ArrowLeft: [-1, 0], ArrowRight: [1, 0], ArrowUp: [0, -1], ArrowDown: [0, 1] };
    if (dirs[k]) {
      e.preventDefault();
      if (!S.cursor) { const ks = S.sel >= 0 ? S.sel : findKing(E.sd); S.cursor = { x: E.sqX(ks), y: E.sqY(ks) }; }
      else { const f = flipped() ? -1 : 1; S.cursor.x = clamp(S.cursor.x + dirs[k][0] * f, 0, 8); S.cursor.y = clamp(S.cursor.y + dirs[k][1] * f, 0, 9); }
      dirty = true; return;
    }
    if ((k === 'Enter' || k === ' ') && S.cursor) {
      e.preventDefault();
      tapSquare(E.sqXY(S.cursor.x, S.cursor.y), false); dirty = true;
    }
  });

  // 按鈕
  $('cHint').addEventListener('click', () => { KG.sound('click'); hint(); });
  $('cUndo').addEventListener('click', () => undo());
  $('cFlip').addEventListener('click', () => flip());
  $('cList').addEventListener('click', () => { KG.sound('click'); openList(); });
  $('cDraw').addEventListener('click', () => { KG.sound('click'); offerDraw(); });
  $('cResign').addEventListener('click', () => { KG.sound('click'); resign(); });
  function openList() { renderList($('mlistOv')); showOv('listOv'); const el = $('mlistOv'); el.scrollTop = el.scrollHeight; }
  $('lClose').addEventListener('click', () => { KG.sound('click'); hideOv('listOv'); });
  $('cfNo').addEventListener('click', () => { KG.sound('click'); hideOv('cfOv'); cfYes = null; });
  $('cfYes').addEventListener('click', () => { KG.sound('click'); hideOv('cfOv'); const f = cfYes; cfYes = null; if (f) f(); });
  $('bPause').addEventListener('click', () => { KG.sound('click'); togglePause(); });
  $('pResume').addEventListener('click', () => { KG.sound('click'); togglePause(false); });
  $('pRestart').addEventListener('click', () => { KG.sound('click'); hideOv('pauseOv'); S.paused = false; startGame({ mode: S.mode, side: S.human, diff: S.diff, puzzle: S.pz }); });
  $('pQuit').addEventListener('click', () => { KG.sound('click'); hideOv('pauseOv'); S.paused = false; cancelSearch(); S.searchId++; clearTimeout(S.aiTimer); save(); S.screen = 'title'; showScreen(); });
  bindSeg('pMusic', v => { prefs.music = v === 'on'; savePrefs(); });
  bindSeg('pDots', v => { prefs.dots = v === 'on'; savePrefs(); dirty = true; });
  bindSeg('segMode', v => { prefs.mode = v; savePrefs(); showTitle(); });
  bindSeg('segSide', v => { prefs.side = +v; savePrefs(); });
  bindSeg('segDiff', v => { prefs.diff = v; savePrefs(); showTitle(); });
  $('tStart').addEventListener('click', () => {
    KG.sound('click');
    if (prefs.mode === 'puzzle') { showPuzzles(); return; }
    startGame({ mode: prefs.mode, side: prefs.side, diff: prefs.diff });
  });
  $('tResume').addEventListener('click', () => { KG.sound('click'); resumeSaved(); });
  $('pzBack').addEventListener('click', () => { KG.sound('click'); hideOv('pzOv'); showTitle(); });
  function resumeSaved() {
    const sv = store.get('xq:save', null);
    if (!sv) return false;
    startGame({ mode: sv.mode, side: sv.human, diff: sv.diff, puzzle: sv.pz, fen: sv.startFen, moves: sv.moves, hints: sv.hints, flip: sv.flip });
    return true;
  }

  addEventListener('resize', () => { layout(); updateUI(); });
  document.addEventListener('visibilitychange', () => { if (document.hidden && S.screen === 'play' && !S.over && !S.paused && $('overOv').classList.contains('hide')) togglePause(true); });

  // ---------------- 測試介面 ----------------
  function parseSq(a) {
    if (Array.isArray(a)) return E.sqXY(a[0], a[1]);
    if (typeof a === 'string' && /^[a-i][0-9]$/i.test(a)) { const s = a.toLowerCase(); return E.sqXY('abcdefghi'.indexOf(s[0]), 9 - +s[1]); }
    if (typeof a === 'object' && a) return E.sqXY(a.x, a.y);
    return a;
  }
  window.__xq = {
    get state() {
      return {
        screen: S.screen, mode: S.mode, human: S.human, diff: S.diff, puzzle: S.pz, sd: E.sd, fen: E.toFen(),
        moves: S.moves.map(m => m.iccs), notation: S.moves.map(m => m.cn), over: S.over, thinking: S.thinking, inCheck: E.inCheck(),
        flipped: flipped(), sel: S.sel, paused: S.paused, hints: S.hints, lastSearch: S.lastSearch || null,
        layout: L && { c: L.c, ox: L.ox, oy: L.oy, portrait: L.portrait, bx: L.bx, by: L.by, bw: L.bw, bh: L.bh }
      };
    },
    start: opts => startGame(opts),
    move(a, b) {
      let mv;
      if (b === undefined) mv = E.iccsToMv(a); else { const s = parseSq(a), d = parseSq(b); mv = s | (d << 8); }
      return doMove(mv, { instant: true });
    },
    legalMoves: () => E.legalMoves().map(E.mvToIccs),
    fen: () => E.toFen(),
    setFen(f, opts) { startGame(Object.assign({ mode: 'pvp' }, opts || {}, { fen: f })); return E.toFen(); },
    aiMove(depth, timeMs) {
      return new Promise(res => {
        askEngine({ maxDepth: depth || 4, timeMs: timeMs || 60000, minDepth: depth || 4 }, r => { if (r.mv) doMove(r.mv, { instant: true }); res(r); });
      });
    },
    think: (opts) => new Promise(res => askEngine(opts || { timeMs: 1000 }, res)),
    perft(n) { const T = XQEngine(); T.fromFen(E.toFen()); return T.perft(n); },
    evalEnd: () => evalEnd(),
    screenXY(sqStr) { const s = parseSq(sqStr); return { x: sx(E.sqX(s)), y: sy(E.sqY(s)) }; },
    puzzles: PUZZLES, notation: mv => moveToChinese(E, typeof mv === 'string' ? E.iccsToMv(mv) : mv),
    undo, hint, flip, resign, offerDraw, pause: v => togglePause(v), showTitle: () => { S.screen = 'title'; showScreen(); },
    resume: resumeSaved, stats: () => stats, book: () => BOOK.size, engine: E, XQEngine
  };

  // ---------------- 啟動 ----------------
  layout();
  showTitle();
  requestAnimationFrame(loop);
  setTimeout(musicTick, 1500);
})();
</script>
</body>
