<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>調色魔法師</title>
<link rel="stylesheet" href="../../assets/common.css">
<style>
  /* ===== 遊戲共用 UI 套件（標題、關卡、結算、特效） ===== */
  :root { --k-main: #ff7eb0; --k-dark: #7a2f57; --k-light: #fff0f6; --k-accent: #ffd34d; }
  .kit-hidden-defs { position: absolute; width: 0; height: 0; overflow: hidden; }
  .kit-title {
    position: fixed; inset: 0; z-index: 8900; display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: clamp(4px, 1.6vh, 16px); padding: 64px 16px max(18px, env(safe-area-inset-bottom)); overflow: hidden;
    transition: opacity .35s ease, transform .35s ease;
  }
  .kit-title.out, .kit-screen.out { opacity: 0; transform: scale(1.06); pointer-events: none; }
  .kit-tdeco { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
  .kit-logo { position: relative; animation: kit-drop .9s cubic-bezier(.2,1.6,.4,1) both; }
  .kit-logo-svg { display: block; width: min(92vw, 600px, 75vh); height: auto; overflow: visible; filter: drop-shadow(0 8px 10px rgba(0,0,0,.18)); }
  .kit-logo-svg text { font-family: var(--kg-font); }
  .kit-lc { animation: kit-lc 2.4s ease-in-out infinite; }
  @keyframes kit-lc { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-7px); } }
  @keyframes kit-drop { from { transform: translateY(-50px) scale(.6); opacity: 0; } to { transform: none; opacity: 1; } }
  .kit-hero { position: relative; width: min(72vw, 40vh, 330px); aspect-ratio: 1; display: grid; place-items: center; animation: kit-drop 1s .15s cubic-bezier(.2,1.6,.4,1) both; }
  .kit-hero > svg, .kit-hero > canvas { width: 100%; height: 100%; overflow: visible; display: block; }
  .kit-tbtns { display: flex; gap: 14px; flex-wrap: wrap; justify-content: center; animation: kit-drop 1s .3s cubic-bezier(.2,1.6,.4,1) both; }
  .kit-tsub { font-size: 17px; font-weight: 800; color: var(--k-dark); background: rgba(255,255,255,.8); border-radius: 999px; padding: 6px 16px; text-align: center; max-width: 92vw; animation: kit-drop 1s .4s both; }
  .kit-bigbtn {
    font-family: var(--kg-font); font-weight: 900; font-size: clamp(24px, 6.5vw, 32px); color: #fff; letter-spacing: 2px;
    border: 5px solid #fff; border-radius: 999px; padding: 10px 32px 10px 18px; min-height: 72px;
    display: inline-flex; align-items: center; gap: 8px; cursor: pointer; position: relative;
    background: linear-gradient(180deg, #8ff0a4 0%, #3fbf63 55%, #2fa552 100%);
    box-shadow: 0 8px 0 #22803f, 0 14px 24px rgba(20,90,40,.35), inset 0 4px 0 rgba(255,255,255,.55);
    text-shadow: 0 3px 0 rgba(0,0,0,.22); animation: kit-pulse 1.6s ease-in-out infinite;
  }
  .kit-bigbtn svg { width: 40px; height: 40px; flex: 0 0 auto; filter: drop-shadow(0 3px 0 rgba(0,0,0,.18)); }
  .kit-bigbtn:active { transform: translateY(6px) scale(.97); box-shadow: 0 2px 0 #22803f, 0 4px 8px rgba(20,90,40,.35); animation: none; }
  .kit-bigbtn.alt { background: linear-gradient(180deg, #a6dcff 0%, #3a9ee8 60%, #2f86cc 100%); box-shadow: 0 8px 0 #2268a3, 0 14px 24px rgba(30,80,140,.35), inset 0 4px 0 rgba(255,255,255,.55); animation-delay: .4s; }
  .kit-bigbtn.alt:active { box-shadow: 0 2px 0 #2268a3; }
  .kit-bigbtn.pink { background: linear-gradient(180deg, #ffb3d1 0%, #ff6fa5 60%, #e8558d 100%); box-shadow: 0 8px 0 #b83a6c, 0 14px 24px rgba(160,40,90,.35), inset 0 4px 0 rgba(255,255,255,.55); }
  .kit-bigbtn.pink:active { box-shadow: 0 2px 0 #b83a6c; }
  .kit-bigbtn.small { font-size: 22px; min-height: 60px; padding: 8px 24px 8px 14px; }
  .kit-bigbtn.small svg { width: 30px; height: 30px; }
  @keyframes kit-pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.05); } }

  /* 關卡選擇 */
  .kit-screen {
    position: fixed; inset: 0; z-index: 8900; overflow-y: auto; overflow-x: hidden; -webkit-overflow-scrolling: touch;
    padding: 70px 14px max(20px, env(safe-area-inset-bottom)); display: flex; flex-direction: column; align-items: center;
    transition: opacity .3s ease, transform .3s ease; touch-action: pan-y;
  }
  .kit-banner {
    position: relative; display: inline-block; color: #fff; font-size: clamp(24px, 6.5vw, 32px); font-weight: 900; letter-spacing: 2px;
    padding: 8px 34px; border-radius: 16px; border: 4px solid #fff; background: linear-gradient(180deg, var(--k-main), var(--k-dark));
    box-shadow: 0 6px 0 rgba(0,0,0,.18), 0 10px 18px rgba(0,0,0,.18); text-shadow: 0 3px 0 rgba(0,0,0,.25); animation: kit-drop .6s both cubic-bezier(.2,1.6,.4,1);
  }
  .kit-banner::before, .kit-banner::after { content: ''; position: absolute; top: 14px; width: 26px; height: 100%; background: var(--k-dark); z-index: -1; border-radius: 4px; }
  .kit-banner::before { left: -18px; clip-path: polygon(0 0, 100% 0, 100% 100%, 0 100%, 40% 50%); }
  .kit-banner::after { right: -18px; clip-path: polygon(0 0, 100% 0, 60% 50%, 100% 100%, 0 100%); }
  .kit-total { margin-top: 10px; display: inline-flex; align-items: center; gap: 6px; font-size: 20px; font-weight: 900; color: var(--k-dark);
    background: rgba(255,255,255,.9); border: 3px solid #fff; border-radius: 999px; padding: 3px 14px 3px 6px; box-shadow: 0 4px 0 rgba(0,0,0,.12); }
  .kit-total svg { width: 30px; height: 30px; }
  .kit-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 14px; width: min(640px, 100%); margin: 16px auto 8px; }
  .kit-lv {
    position: relative; aspect-ratio: 1 / 1.08; border-radius: 26px; border: 5px solid #fff; cursor: pointer; font-family: var(--kg-font);
    background: linear-gradient(180deg, #fff 0%, var(--k-light) 100%); color: var(--k-dark);
    box-shadow: 0 7px 0 rgba(0,0,0,.13), 0 12px 20px rgba(0,0,0,.12);
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; padding: 4px;
    animation: kit-drop .5s both cubic-bezier(.2,1.6,.4,1); transition: transform .12s;
  }
  .kit-lv:active { transform: scale(.93); }
  .kit-lv .num {
    width: 58%; aspect-ratio: 1; border-radius: 50%; display: grid; place-items: center; font-size: clamp(26px, 7vw, 36px); font-weight: 900; color: #fff;
    background: radial-gradient(circle at 35% 28%, rgba(255,255,255,.7) 0 12%, transparent 13%), linear-gradient(180deg, var(--k-main), var(--k-dark));
    box-shadow: inset 0 -5px 0 rgba(0,0,0,.15), 0 4px 0 rgba(0,0,0,.12); text-shadow: 0 3px 0 rgba(0,0,0,.25);
  }
  .kit-lv .lname { font-size: 13px; font-weight: 800; line-height: 1.1; text-align: center; max-width: 100%; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  .kit-lv .stars { display: flex; gap: 1px; }
  .kit-lv .stars svg { width: 22px; height: 22px; }
  .kit-lv.locked { background: linear-gradient(180deg, #f2eef6, #ddd6e6); cursor: default; }
  .kit-lv.locked .num { background: linear-gradient(180deg, #cfc6da, #a99dba); }
  .kit-lv .lock { position: absolute; width: 46%; top: 16%; left: 27%; }
  .kit-lv.locked .num span { opacity: 0; }
  .kit-lv.next::after { content: ''; position: absolute; inset: -9px; border-radius: 30px; border: 4px solid var(--k-accent); animation: kit-ring 1.2s ease-in-out infinite; pointer-events: none; }
  @keyframes kit-ring { 0%, 100% { transform: scale(1); opacity: 1; } 50% { transform: scale(1.06); opacity: .5; } }
  .kit-extra { width: min(640px, 100%); }
  .kit-shelf-title { font-size: 18px; font-weight: 900; color: var(--k-dark); margin: 10px 0 6px; text-align: center; }
  .kit-shelf { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }
  .kit-item { width: 84px; border-radius: 20px; border: 4px solid #fff; background: rgba(255,255,255,.85); box-shadow: 0 5px 0 rgba(0,0,0,.12);
    display: flex; flex-direction: column; align-items: center; padding: 4px 2px; font-size: 12px; font-weight: 800; color: var(--k-dark); cursor: pointer; font-family: var(--kg-font); position: relative; }
  .kit-item svg.pv { width: 62px; height: 62px; }
  .kit-item.sel { border-color: var(--k-accent); box-shadow: 0 0 0 3px var(--k-main), 0 5px 0 rgba(0,0,0,.12); }
  .kit-item.locked { filter: grayscale(1); opacity: .6; cursor: default; }
  .kit-item .need { display: flex; align-items: center; gap: 2px; }
  .kit-item .need svg { width: 14px; height: 14px; }

  /* 結算卡 */
  .kit-ov { position: fixed; inset: 0; z-index: 9500; display: grid; place-items: center; padding: 16px; background: rgba(60,40,80,.5); backdrop-filter: blur(3px); animation: kg-fade .25s ease; overflow-y: auto; }
  .kit-rcard {
    position: relative; width: min(420px, 100%); margin-top: 30px; text-align: center; color: var(--k-dark);
    background: linear-gradient(180deg, #fff 0%, var(--k-light) 100%); border: 6px solid #fff; border-radius: 34px; padding: 50px 18px 20px;
    box-shadow: 0 10px 0 rgba(0,0,0,.12), 0 24px 44px rgba(40,20,60,.35); animation: kit-cardin .6s cubic-bezier(.2,1.5,.4,1) both;
  }
  @keyframes kit-cardin { from { transform: translateY(60px) scale(.6); opacity: 0; } to { transform: none; opacity: 1; } }
  .kit-ribbon { position: absolute; left: 50%; top: -34px; transform: translateX(-50%); width: 112%; max-width: 440px; }
  .kit-ribbon svg { width: 100%; height: auto; display: block; overflow: visible; }
  .kit-ribbon svg text { font-family: var(--kg-font); }
  .kit-rstars { display: flex; justify-content: center; align-items: flex-end; gap: 4px; margin: 0 0 6px; }
  .kit-rstar { position: relative; width: 74px; height: 74px; }
  .kit-rstar.mid { width: 96px; height: 96px; margin-bottom: 14px; }
  .kit-rstar svg { position: absolute; inset: 0; width: 100%; height: 100%; }
  .kit-rstar .on { transform: scale(0); }
  .kit-rstar.lit .on { animation: kit-starin .55s cubic-bezier(.2,1.8,.4,1) forwards; }
  @keyframes kit-starin { 0% { transform: scale(0) rotate(-90deg); } 100% { transform: scale(1) rotate(0); } }
  .kit-rhero { width: 120px; height: 120px; margin: -6px auto 2px; }
  .kit-rhero svg { width: 100%; height: 100%; overflow: visible; }
  .kit-rmsg { font-size: 19px; font-weight: 800; line-height: 1.45; margin: 4px 0 12px; }
  .kit-unlock { display: flex; align-items: center; gap: 10px; text-align: left; margin: 0 auto 14px; padding: 8px 12px; border-radius: 20px; border: 3px dashed var(--k-main);
    background: #fff; font-weight: 900; font-size: 17px; animation: kit-drop .6s 1.2s both cubic-bezier(.2,1.6,.4,1); max-width: 340px; }
  .kit-unlock .ic { width: 58px; height: 58px; flex: 0 0 auto; }
  .kit-unlock .ic svg { width: 100%; height: 100%; }
  .kit-rbtns { display: flex; justify-content: center; gap: 14px; flex-wrap: wrap; }
  .kit-rbtn { font-family: var(--kg-font); display: flex; flex-direction: column; align-items: center; gap: 4px; background: none; border: none; cursor: pointer; font-size: 15px; font-weight: 900; color: var(--k-dark); padding: 0; }
  .kit-rbtn .b { width: 70px; height: 70px; border-radius: 50%; border: 4px solid #fff; display: grid; place-items: center; transition: transform .1s; }
  .kit-rbtn .b svg { width: 38px; height: 38px; }
  .kit-rbtn:active .b { transform: translateY(4px) scale(.95); }
  .kit-rbtn.g .b { background: linear-gradient(180deg, #8ff0a4, #34b45a); box-shadow: 0 6px 0 #22803f, 0 10px 16px rgba(0,0,0,.2); }
  .kit-rbtn.y .b { background: linear-gradient(180deg, #ffe58a, #f2a91f); box-shadow: 0 6px 0 #b9790c, 0 10px 16px rgba(0,0,0,.2); }
  .kit-rbtn.b2 .b { background: linear-gradient(180deg, #a6dcff, #3a9ee8); box-shadow: 0 6px 0 #2268a3, 0 10px 16px rgba(0,0,0,.2); }
  .kit-rbtn.big .b { width: 84px; height: 84px; animation: kit-pulse 1.4s ease-in-out infinite; }

  /* HUD */
  .kit-hud { position: fixed; top: 10px; left: 50%; transform: translateX(-50%); z-index: 8000; display: flex; gap: 8px; pointer-events: none; max-width: calc(100vw - 136px); }
  .kit-chip {
    height: 48px; display: inline-flex; align-items: center; gap: 4px; padding: 0 14px 0 6px; border-radius: 999px; white-space: nowrap;
    background: var(--chip-bg, linear-gradient(180deg, #fff, #ffeef6)); border: 4px solid var(--chip-border, #fff); color: var(--k-dark);
    box-shadow: 0 5px 0 rgba(0,0,0,.15), 0 8px 14px rgba(0,0,0,.12); font-size: 20px; font-weight: 900;
  }
  .kit-chip svg { width: 32px; height: 32px; flex: 0 0 auto; }
  .kit-chip.bump { animation: kit-bump .4s cubic-bezier(.2,1.8,.4,1); }
  @keyframes kit-bump { 0% { transform: scale(1); } 40% { transform: scale(1.25); } 100% { transform: scale(1); } }
  .kit-prog { width: 74px; height: 16px; border-radius: 99px; background: rgba(0,0,0,.12); overflow: hidden; box-shadow: inset 0 2px 3px rgba(0,0,0,.15); }
  .kit-prog i { display: block; height: 100%; width: 0; border-radius: 99px; background: linear-gradient(180deg, #ffe680, #ffb21f); box-shadow: inset 0 3px 0 rgba(255,255,255,.5); transition: width .4s cubic-bezier(.2,1.4,.4,1); }

  /* 特效 */
  .kit-fx { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 9550; }
  .kit-float {
    position: fixed; z-index: 9560; pointer-events: none; font-weight: 900; font-size: 30px; color: var(--c, #fff); white-space: nowrap;
    text-shadow: 3px 0 0 var(--o, #6b3a8a), -3px 0 0 var(--o, #6b3a8a), 0 3px 0 var(--o, #6b3a8a), 0 -3px 0 var(--o, #6b3a8a), 2px 2px 0 var(--o, #6b3a8a), -2px 2px 0 var(--o, #6b3a8a), 2px -2px 0 var(--o, #6b3a8a), -2px -2px 0 var(--o, #6b3a8a), 0 6px 0 rgba(0,0,0,.2);
    animation: kit-float 1s ease-out forwards;
  }
  @keyframes kit-float { 0% { transform: translate(-50%, -50%) scale(.4); opacity: 0; } 20% { transform: translate(-50%, -80%) scale(1.25); opacity: 1; } 100% { transform: translate(-50%, -200%) scale(1); opacity: 0; } }
  .kit-callout {
    position: fixed; left: 50%; top: 38%; z-index: 9560; pointer-events: none; white-space: nowrap; letter-spacing: 3px;
    font-size: clamp(40px, 11vw, 74px); font-weight: 900; color: var(--c, #ffd23f);
    text-shadow: 4px 0 0 #fff, -4px 0 0 #fff, 0 4px 0 #fff, 0 -4px 0 #fff, 3px 3px 0 #fff, -3px 3px 0 #fff, 3px -3px 0 #fff, -3px -3px 0 #fff, 0 9px 0 var(--o, #7a2f57), 0 14px 18px rgba(0,0,0,.25);
    animation: kit-callout 1.3s forwards;
  }
  @keyframes kit-callout {
    0% { transform: translate(-50%, -50%) scale(.2) rotate(-12deg); opacity: 0; }
    22% { transform: translate(-50%, -50%) scale(1.18) rotate(3deg); opacity: 1; }
    38% { transform: translate(-50%, -50%) scale(1) rotate(-2deg); }
    80% { opacity: 1; transform: translate(-50%, -55%) scale(1) rotate(0); }
    100% { transform: translate(-50%, -90%) scale(.9); opacity: 0; }
  }
  @media (prefers-reduced-motion: reduce) { .kit-lc, .kit-bigbtn, .kit-rbtn.big .b { animation: none; } }

  :root { --k-main: #ff7eb0; --k-dark: #8a2f6a; --k-light: #fff0f8; --k-accent: #ffd34d; }
  html, body { height: 100%; overflow: hidden; background: #f3e6ff; }
  #cv { position: fixed; inset: 0; display: block; touch-action: none; }
  #bubble {
    position: fixed; z-index: 20; background: #fff; border: 4px solid #fff; border-radius: 24px; padding: 10px 14px;
    font-size: clamp(15px, min(4.6vw, 4.2vh), 24px); font-weight: 900; color: #5b3a6e; line-height: 1.35; text-align: center;
    box-shadow: 0 6px 0 rgba(120,60,140,.15), 0 10px 20px rgba(120,60,140,.18); pointer-events: none;
    transform-origin: 20% 100%; animation: bubIn .45s cubic-bezier(.2,1.6,.4,1); display: none;
  }
  #bubble::after { content: ''; position: absolute; width: 22px; height: 22px; background: #fff; transform: rotate(45deg); border-radius: 4px; }
  #bubble.tail-left::after { left: -10px; top: calc(50% - 11px); }
  #bubble.tail-down::after { left: calc(30% - 11px); bottom: -10px; }
  #bubble .cw { display: inline-block; padding: 0 8px; border-radius: 12px; color: #fff; text-shadow: 0 2px 0 rgba(0,0,0,.25); }
  #bubble .hint { display: flex; justify-content: center; align-items: center; gap: 4px; margin-top: 6px; font-size: 18px; }
  #bubble .drop { width: 26px; height: 26px; border-radius: 50% 50% 50% 0; transform: rotate(-45deg); border: 3px solid rgba(0,0,0,.25); display: inline-block; }
  @keyframes bubIn { from { transform: scale(.3); opacity: 0; } to { transform: none; opacity: 1; } }
  .rbtn {
    position: fixed; z-index: 20; width: 62px; height: 62px; border-radius: 50%; border: 4px solid #fff; padding: 0; cursor: pointer; display: none; place-items: center;
    box-shadow: 0 6px 0 var(--sh), 0 10px 16px rgba(0,0,0,.2); transition: transform .1s;
  }
  .rbtn svg { width: 36px; height: 36px; }
  .rbtn:active { transform: translateY(4px) scale(.95); box-shadow: 0 2px 0 var(--sh); }
  .rbtn.pulse { animation: kit-pulse .8s ease-in-out infinite; }
  #btnEmpty { background: linear-gradient(180deg, #a6dcff, #3a9ee8); --sh: #2268a3; }
  #btnHint { background: linear-gradient(180deg, #ffe58a, #f2a91f); --sh: #b9790c; }
  #btnMenu { background: linear-gradient(180deg, #ffb3d1, #e8558d); --sh: #b83a6c; }
  .rbtn .lb { position: absolute; bottom: -24px; left: 50%; transform: translateX(-50%); font-size: 14px; font-weight: 900; color: #5b3a6e; white-space: nowrap; text-shadow: 0 2px 0 #fff; }
  .kit-chip .drops { display: flex; gap: 3px; }
  .kit-chip .drops i { width: 18px; height: 18px; border-radius: 50% 50% 50% 0; transform: rotate(-45deg); background: #e6dcef; border: 2px solid #cbbcd8; display: block; }
  .kit-chip .drops i.on { border-color: rgba(0,0,0,.2); animation: kit-bump .4s; }
  .kit-item canvas.pv { width: 66px; height: 66px; }
  .kit-hero canvas { width: 100%; height: 100%; }
  .freebtn { margin: 14px auto 0; display: flex; }
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="bubble" class="tail-left"></div>
<button class="rbtn" id="btnHint" aria-label="提示"><svg viewBox="0 0 100 100"><path d="M50 12 C30 12 20 28 20 42 C20 56 32 62 36 72 H64 C68 62 80 56 80 42 C80 28 70 12 50 12 Z" fill="#fff8d0" stroke="#fff" stroke-width="6" stroke-linejoin="round"/><rect x="36" y="74" width="28" height="8" rx="4" fill="#fff"/><rect x="40" y="84" width="20" height="7" rx="3.5" fill="#fff"/><path d="M38 40 Q42 30 52 28" stroke="#f2a91f" stroke-width="6" fill="none" stroke-linecap="round"/></svg><span class="lb">提示</span></button>
<button class="rbtn" id="btnEmpty" aria-label="倒掉"><svg viewBox="0 0 100 100"><path d="M20 34 H80 L72 86 Q71 90 66 90 H34 Q29 90 28 86 Z" fill="#fff" stroke="#fff" stroke-width="5" stroke-linejoin="round"/><rect x="14" y="22" width="72" height="12" rx="6" fill="#fff"/><rect x="40" y="12" width="20" height="10" rx="4" fill="#fff"/><path d="M40 46 V78 M60 46 V78" stroke="#3a9ee8" stroke-width="6" stroke-linecap="round"/></svg><span class="lb">倒掉</span></button>
<button class="rbtn" id="btnMenu" aria-label="關卡"><svg viewBox="0 0 100 100"><g fill="#fff"><rect x="18" y="18" width="27" height="27" rx="8"/><rect x="55" y="18" width="27" height="27" rx="8"/><rect x="18" y="55" width="27" height="27" rx="8"/><rect x="55" y="55" width="27" height="27" rx="8"/></g></svg><span class="lb">關卡</span></button>
<div class="kit-hud" id="hud" style="display:none">
  <div class="kit-chip" id="chipL"><svg viewBox="0 0 100 100"><path d="M50 10 C24 10 8 30 8 52 C8 74 26 90 44 90 C52 90 54 84 50 78 C46 72 50 66 58 66 H70 C84 66 92 58 92 46 C92 24 72 10 50 10 Z" fill="#ffe2b8" stroke="#b9792c" stroke-width="5"/><circle cx="30" cy="40" r="8" fill="#ff4d5e"/><circle cx="50" cy="28" r="8" fill="#ffd93b"/><circle cx="72" cy="38" r="8" fill="#3b7ddd"/><circle cx="28" cy="64" r="8" fill="#8e6cef"/></svg><span id="lvTxt">第 1 關</span></div>
  <div class="kit-chip" id="chipP"><div class="drops" id="drops"></div></div>
</div>
<script src="../../assets/common.js"></script>
<script>
/* ===== 遊戲共用 UI 套件 Kit：標題畫面、關卡選擇、結算、圖示、特效、背景音樂 ===== */
const Kit = (function () {
  'use strict';
  /* ---------- 緩動函式 ---------- */
  const E = {
    linear: t => t,
    outQuad: t => 1 - (1 - t) * (1 - t),
    outCubic: t => 1 - Math.pow(1 - t, 3),
    inOut: t => (t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2),
    outBack: t => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); },

  /* ---------- 背景音樂（用 KG.note 合成） ---------- */
  const Music = (function () {

        const m = song.mel[step % song.mel.length];
        if (m) KG.note(mf(m), dur * 1.5, song.wave || 'triangle', song.vol || 0.045);
        if (song.bass && step % 2 === 0) {
          const b = song.bass[(step / 2 | 0) % song.bass.length];
          if (b) KG.note(mf(b), dur * 1.9, 'sine', (song.vol || 0.045) * 1.4);
        }
        if (song.tick && step % 4 === 2) KG.note(2200, 0.03, 'square', 0.012);
      }
      step++;
      timer = setTimeout(tick, dur * 1000);
    }
    return {
      start(s) { this.stop(); song = s; step = 0; timer = setTimeout(tick, 80); },
      stop() { clearTimeout(timer); timer = null; song = null; },
      get playing() { return !!song; }
    };

  /* ---------- 粒子特效（全螢幕畫布） ---------- */
  const FX = (function () {

    const DEF = ['#ff7eb0', '#ffd34d', '#7bd88f', '#6cc4ff', '#b49cff', '#ffa94d'];
    function ensure() {
      if (cv) return;

      cv.className = 'kit-fx';
      document.body.appendChild(cv);

    }
    function resize() {
      const d = window.devicePixelRatio || 1;
      cv.width = innerWidth * d; cv.height = innerHeight * d;
      c = cv.getContext('2d');
      c.setTransform(d, 0, 0, d, 0, 0);
    }
    function starPath(ctx, r) {
      ctx.beginPath();
      for (let i = 0; i < 10; i++) {
        const a = -Math.PI / 2 + i * Math.PI / 5, rr = i % 2 ? r * 0.45 : r;

      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(p.rot);
      const s = p.size * (p.grow ? (1 + (1 - p.life) * 1.5) : (0.4 + p.life * 0.6));

<script>

  function mixColor(p) {

        C.RY[i] * r * y * (1 - b) + C.RB[i] * r * (1 - y) * b + C.YB[i] * (1 - r) * y * b + C.RYB[i] * r * y * b);

  /* ---------- 背景（預先畫好） ---------- */

        g.fillStyle = 'rgba(255,255,255,.95)'; g.font = `900 ${s * 0.2}px ${getComputedStyle(document.body).fontFamily}`;
        g.textAlign = 'center'; g.textBaseline = 'middle'; g.save(); g.translate(bx, byy + s * 0.01); if (o.flip) g.scale(-1, 1); g.fillText('?', 0, 0); g.restore();

    sg.addColorStop(0, css(lighter(shirt, 0.35))); sg.addColorStop(1, cssA(shirt, 0.85));

  /* ---------- 顏料罐 ---------- */
  function drawPot(g, p, x, y, a, s, glow, wob) {
    const w = s * 0.78, h = s * 0.9;
    g.save();
    g.translate(x, y);
    g.rotate(a + Math.sin(wob * 20) * wob * 0.3);
    if (glow) {

      g.strokeStyle = 'rgba(255,230,120,.95)'; g.lineWidth = 6;
      Kit.roundRect(g, -w / 2 - 6, -h / 2 - 10, w + 12, h + 16, w * 0.3); g.stroke();
      g.restore();
    }
    // 影子
    if (a === 0) { g.fillStyle = 'rgba(80,40,20,.25)'; g.beginPath(); g.ellipse(0, h / 2, w * 0.55, h * 0.08, 0, 0, Math.PI * 2); g.fill(); }
    // 玻璃罐
    g.fillStyle = 'rgba(255,255,255,.55)';
    g.strokeStyle = '#7a6a8a'; g.lineWidth = Math.max(2.5, s * 0.04);
    Kit.roundRect(g, -w / 2, -h / 2 + h * 0.08, w, h * 0.92, w * 0.26); g.fill();

    const pg = g.createLinearGradient(-w / 2, 0, w / 2, 0);
    pg.addColorStop(0, css(lighter(p.col, 0.35))); pg.addColorStop(0.5, css(p.col)); pg.addColorStop(1, cssA(p.col, p.k === 3 ? 0.9 : 0.75));
    g.fillStyle = pg;
    g.beginPath(); g.moveTo(-w, top);
    for (let xx = -w / 2; xx <= w / 2; xx += w / 6) g.lineTo(xx, top + Math.sin(xx * 0.2 + t * 4) * h * 0.02);
    g.lineTo(w, top); g.lineTo(w, h); g.lineTo(-w, h); g.closePath(); g.fill();
    g.restore();
    Kit.roundRect(g, -w / 2, -h / 2 + h * 0.08, w, h * 0.92, w * 0.26); g.stroke();
    // 罐口

    g.beginPath(); g.ellipse(w * 0.22, -h / 2 + h * 0.15, w * 0.07, h * 0.08, 0, 0, Math.PI * 2); g.fill();
    // 臉
    const fy = top + (h / 2 - top) * 0.45;
    g.fillStyle = p.k === 3 ? '#5b3a6e' : 'rgba(40,20,40,.85)';
    const happy = celebrateT > 0;
    if (happy) {
      g.strokeStyle = g.fillStyle; g.lineWidth = s * 0.035; g.lineCap = 'round';
      [-1, 1].forEach(k => { g.beginPath(); g.arc(k * w * 0.18, fy + s * 0.02, s * 0.05, Math.PI * 1.1, Math.PI * 1.9); g.stroke(); });
    } else {
      [-1, 1].forEach(k => { g.beginPath(); g.arc(k * w * 0.18, fy, s * 0.045, 0, Math.PI * 2); g.fill(); });
      g.fillStyle = '#fff'; [-1, 1].forEach(k => { g.beginPath(); g.arc(k * w * 0.18 + s * 0.015, fy - s * 0.015, s * 0.016, 0, Math.PI * 2); g.fill(); });
    }
    g.strokeStyle = p.k === 3 ? '#5b3a6e' : 'rgba(40,20,40,.85)'; g.lineWidth = s * 0.03; g.lineCap = 'round';
    g.beginPath(); g.arc(0, fy + s * 0.05, s * 0.06, 0.2, Math.PI - 0.2); g.stroke();
    g.fillStyle = 'rgba(255,120,160,.45)';
    [-1, 1].forEach(k => { g.beginPath(); g.ellipse(k * w * 0.3, fy + s * 0.06, s * 0.05, s * 0.03, 0, 0, Math.PI * 2); g.fill(); });
    // 玻璃反光
    g.fillStyle = 'rgba(255,255,255,.7)';
    Kit.roundRect(g, -w / 2 + w * 0.1, -h / 2 + h * 0.2, w * 0.1, h * 0.55, w * 0.05); g.fill();
    g.restore();
    // 名牌
    if (a === 0) {
      g.save();
      g.font = `900 ${Math.round(s * 0.24)}px ${getComputedStyle(document.body).fontFamily}`;
      g.textAlign = 'center'; g.textBaseline = 'middle';
      g.lineWidth = 6; g.strokeStyle = '#fff'; g.lineJoin = 'round';
      g.strokeText(p.name, x, y + h / 2 + s * 0.2);
      g.fillStyle = p.k === 3 ? '#8a7a99' : css(p.col.map(v => v * 0.8));
      g.fillText(p.name, x, y + h / 2 + s * 0.2);
      g.restore();
    }
  }

  /* ---------- 調色碗 ---------- */
  function drawBowl(g) {
    const L = LY, cx = L.bx, cy = L.by, r = L.br;
    // 影子 + 碗腳
    g.fillStyle = 'rgba(80,40,20,.25)';
    g.beginPath(); g.ellipse(cx, cy + r * 0.74, r * 0.75, r * 0.1, 0, 0, Math.PI * 2); g.fill();
    g.lineWidth = Math.max(3, r * 0.035); g.strokeStyle = '#6a5a8a';
    g.fillStyle = '#c9d6ff';
    g.beginPath(); g.ellipse(cx, cy + r * 0.68, r * 0.42, r * 0.09, 0, 0, Math.PI * 2); g.fill(); g.stroke();

    const bg2 = g.createLinearGradient(cx - r, 0, cx + r, 0);
    bg2.addColorStop(0, '#ffffff'); bg2.addColorStop(0.55, '#eef2ff'); bg2.addColorStop(1, '#b9c6f0');

    g.fillStyle = 'rgba(255,126,176,.35)';
    g.fillRect(cx - r, cy + r * 0.1, r * 2, r * 0.08);
    g.fillStyle = 'rgba(108,196,255,.35)';
    for (let i = -3; i <= 3; i++) { g.beginPath(); g.arc(cx + i * r * 0.3, cy + r * 0.62, r * 0.05, 0, Math.PI * 2); g.fill(); }
    g.restore();
    bodyPath(); g.stroke();
    // 碗的臉
    const fy = cy + r * 0.36;
    const happy = bowlHappy > 0, sad = bowlSad > 0;
    g.fillStyle = '#3a2a55'; g.strokeStyle = '#3a2a55'; g.lineCap = 'round';
    if (happy) {
      g.lineWidth = r * 0.045;
      [-1, 1].forEach(k => { g.beginPath(); g.arc(cx + k * r * 0.24, fy + r * 0.02, r * 0.07, Math.PI * 1.1, Math.PI * 1.9); g.stroke(); });
    } else {
      const bl = (t % 4.3) > 4.15 ? 0.15 : 1;
      [-1, 1].forEach(k => {
        g.beginPath(); g.ellipse(cx + k * r * 0.24, fy, r * 0.055, r * 0.075 * bl, 0, 0, Math.PI * 2); g.fill();
        if (bl > 0.5) { g.fillStyle = '#fff'; g.beginPath(); g.arc(cx + k * r * 0.24 + r * 0.02, fy - r * 0.025, r * 0.022, 0, Math.PI * 2); g.fill(); g.fillStyle = '#3a2a55'; }
      });
    }
    g.lineWidth = r * 0.035;
    g.beginPath();
    if (sad) { g.arc(cx, fy + r * 0.2, r * 0.08, Math.PI * 1.15, Math.PI * 1.85); }
    else if (happy) { g.fillStyle = '#c8325a'; g.moveTo(cx - r * 0.1, fy + r * 0.08); g.quadraticCurveTo(cx, fy + r * 0.26, cx + r * 0.1, fy + r * 0.08); g.closePath(); g.fill(); }
    else g.arc(cx, fy + r * 0.08, r * 0.07, 0.2, Math.PI - 0.2);
    g.stroke();
    g.fillStyle = 'rgba(255,120,160,.45)';
    [-1, 1].forEach(k => { g.beginPath(); g.ellipse(cx + k * r * 0.4, fy + r * 0.1, r * 0.08, r * 0.045, 0, 0, Math.PI * 2); g.fill(); });
    // 碗口
    g.lineWidth = Math.max(3, r * 0.035); g.strokeStyle = '#6a5a8a';
    g.fillStyle = '#ffffff';
    g.beginPath(); g.ellipse(cx, cy, r, r * 0.3, 0, 0, Math.PI * 2); g.fill(); g.stroke();
    const inner = g.createLinearGradient(0, cy - r * 0.27, 0, cy + r * 0.27);
    inner.addColorStop(0, '#aeb9e0'); inner.addColorStop(1, '#e6ebff');
    g.fillStyle = inner;
    g.beginPath(); g.ellipse(cx, cy, r * 0.9, r * 0.25, 0, 0, Math.PI * 2); g.fill();
    // 顏料
    if (fillShown > 0.001 && shown) {
      g.save();
      g.beginPath(); g.ellipse(cx, cy, r * 0.9, r * 0.25, 0, 0, Math.PI * 2); g.clip();
      const f = Math.min(1, fillShown);
      const ly = cy + (1 - f) * r * 0.1;
      const rx = r * 0.86 * (0.7 + 0.3 * f), ry = r * 0.23 * (0.7 + 0.3 * f);
      const lg = g.createRadialGradient(cx - rx * 0.3, ly - ry * 0.4, ry * 0.2, cx, ly, rx);
      lg.addColorStop(0, css(lighter(shown, 0.3))); lg.addColorStop(0.6, css(shown)); lg.addColorStop(1, cssA(shown, 0.8));
      g.fillStyle = lg;
      g.beginPath();
      for (let i = 0; i <= 40; i++) {
        const an = i / 40 * Math.PI * 2;
        const wv = 1 + Math.sin(an * 5 + t * 4) * 0.012 * (1 + stirT * 3);
        const px = cx + Math.cos(an) * rx * wv, py = ly + Math.sin(an) * ry * wv;

      g.beginPath(); g.ellipse(cx - rx * 0.4, ly - ry * 0.35, rx * 0.22, ry * 0.18, -0.1, 0, Math.PI * 2); g.fill();
      g.restore();

    g.strokeStyle = 'rgba(255,255,255,.9)'; g.lineWidth = r * 0.03; g.lineCap = 'round';
    g.beginPath(); g.ellipse(cx, cy, r * 0.95, r * 0.28, 0, Math.PI * 1.05, Math.PI * 1.35); g.stroke();
    g.beginPath(); g.moveTo(cx - r * 0.82, cy + r * 0.2); g.quadraticCurveTo(cx - r * 0.75, cy + r * 0.5, cx - r * 0.5, cy + r * 0.62); g.stroke();
  }

  /* ---------- 倒顏料 ---------- */
  const POUR_MOVE = 0.35, POUR_FLOW = 0.75, POUR_BACK = 0.35;
  function pourPose(i, k) {
    const L = LY, home = { x: L.pots[i], y: L.potY };
    const side = home.x <= L.bx ? -1 : 1;
    const px = L.bx + side * L.br * 0.92, py = L.by - L.br * 0.75 - L.ps * 0.45;
    const ang = -side * 2.0;
    const e = Kit.E.inOut(k);
    return { x: Kit.lerp(home.x, px, e), y: Kit.lerp(home.y, py, e) - Math.sin(k * Math.PI) * L.ps * 0.6, a: Kit.lerp(0, ang, e), side };
  }
  function tapPot(i) {
    if (busy || mode === 'menu') return;
    if (pouring) { KG.sound('tick'); return; }
    const tot = parts.reduce((a, b) => a + b, 0);
    if (tot >= CAP) {
      KG.sound('boing');
      bowlSad = 1.2;
      say('碗滿了！先倒掉再試試看～', true);
      $('btnEmpty').classList.add('pulse');
      return;
    }
    pouring = { i, t: 0, from: shown ? shown.slice() : null, to: mixColor(parts.map((v, k) => v + (k === i ? 1 : 0))), splashed: false };
    KG.sound('whoosh');
    KG.say(POTS[i].name);
    hintOn = false;
  }
  function updatePour(dt) {
    if (!pouring) return;
    const p = pouring, L = LY, a = potAnim[p.i];
    p.t += dt;
    let pose;
    if (p.t < POUR_MOVE) pose = pourPose(p.i, p.t / POUR_MOVE);
    else if (p.t < POUR_MOVE + POUR_FLOW) {
      pose = pourPose(p.i, 1);
      const k = (p.t - POUR_MOVE) / POUR_FLOW;
      if (!p.splashed) { p.splashed = true; KG.sound('splash'); }
      if (Math.random() < dt * 30) KG.note(300 + Math.random() * 200, 0.06, 'sine', 0.06, 0, 160);
      const tot = parts.reduce((x, y) => x + y, 0);
      fillShown = (tot + k) / CAP;
      if (!p.from) shown = p.to.slice();
      else shown = p.from.map((v, j) => Kit.lerp(v, p.to[j], Math.min(1, k * 1.3)));
      // 濺起的顏料滴
      if (Math.random() < dt * 18) {
        const sx = L.bx + pose.side * L.br * 0.28;
        drips.push({ x: sx, y: L.by, vx: KG.rand(-80, 80), vy: KG.rand(-200, -90), life: 1, c: p.to });
      }
    } else if (p.t < POUR_MOVE + POUR_FLOW + POUR_BACK) {
      if (!p.added) { p.added = true; parts[p.i]++; shown = p.to.slice(); fillShown = parts.reduce((x, y) => x + y, 0) / CAP; stirT = 0.9; KG.sound('pop'); }
      pose = pourPose(p.i, 1 - (p.t - POUR_MOVE - POUR_FLOW) / POUR_BACK);
    } else {
      pose = { x: L.pots[p.i], y: L.potY, a: 0 };
      a.wob = 0.3;
      pouring = null;
      afterPour();
    }
    a.x = pose.x; a.y = pose.y; a.a = pose.a;
  }
  function streamPoints() {
    if (!pouring) return null;
    const p = pouring, L = LY;
    const k = p.t - POUR_MOVE;
    if (k < 0 || k > POUR_FLOW + 0.12) return null;
    const a = potAnim[p.i], h = L.ps * 0.9;
    const mx = a.x + Math.sin(a.a) * h * 0.5, my = a.y - Math.cos(a.a) * h * 0.5;
    const side = a.x < L.bx ? -1 : 1;
    const ex = L.bx + side * L.br * 0.28, ey = L.by + (1 - Math.min(1, fillShown)) * L.br * 0.1;
    const w = L.ps * 0.13 * (k > POUR_FLOW ? Math.max(0, 1 - (k - POUR_FLOW) / 0.12) : Math.min(1, k * 8));
    return { mx, my, ex, ey, w, col: p.to };
  }
  function drawStream(g) {
    const s = streamPoints();
    if (!s || s.w <= 0.5) return;
    g.save();
    g.strokeStyle = css(s.col); g.lineCap = 'round'; g.lineWidth = s.w;
    g.beginPath(); g.moveTo(s.mx, s.my);
    const cxm = (s.mx + s.ex) / 2 + Math.sin(t * 20) * 3;
    g.quadraticCurveTo(cxm, s.my + (s.ey - s.my) * 0.1, s.ex, s.ey); g.stroke();
    g.strokeStyle = 'rgba(255,255,255,.45)'; g.lineWidth = s.w * 0.3;
    g.beginPath(); g.moveTo(s.mx - s.w * 0.2, s.my); g.quadraticCurveTo(cxm - s.w * 0.2, s.my + (s.ey - s.my) * 0.1, s.ex - s.w * 0.2, s.ey); g.stroke();
    g.fillStyle = css(s.col);
    g.beginPath(); g.ellipse(s.ex, s.ey, s.w * 1.4, s.w * 0.5, 0, 0, Math.PI * 2); g.fill();
    g.restore();
  }

  function same(a, b) { // 比例是否一樣
    const ta = a.reduce((x, y) => x + y, 0), tb = b.reduce((x, y) => x + y, 0);
    if (!ta || !tb) return false;
    return a.every((v, i) => v * tb === b[i] * ta);
  }
  function nearestName(p) {
    let best = null, bd = 1e9;
    const c = mixColor(p);
    NAMED.forEach(n => {
      if (same(n.r, p)) { bd = -1; best = n; }
      if (bd < 0) return;
      const d = n.c.reduce((s2, v, i) => s2 + (v - c[i]) * (v - c[i]), 0);
      if (d < bd) { bd = d; best = n; }
    });
    return best;
  }

  function afterPour() {
    const tot = parts.reduce((a, b) => a + b, 0);
    if (mode === 'free') {
      const n = nearestName(parts);
      say(`變成<span class="cw" style="background:${css(shown)}">${n.n}</span>了！`);
      KG.say(n.n);
      ch.happy = 0.8; ch.jump = 0.5;
      return;
    }
    if (same(parts, target.r)) {
      success();
    } else if (tot >= CAP) {
      say('好像不太對耶～<br>按「倒掉」再試一次！', true);
      $('btnEmpty').classList.add('pulse');
      ch.sweat = 1;
      bowlSad = 1.5;
      KG.sound('boing');
    } else {
      const n = nearestName(parts);
      ch.sweat = 0.8;
      say(`現在是<span class="cw" style="background:${css(shown)}">${n.n}</span>，<br>還要再加什麼呢？`);
    }
  }

  function success() {
    busy = true;
    celebrateT = 2.2; bowlHappy = 2.2;
    ch.happy = 2; ch.jump = 1; ch.shirtTo = target.c.slice(); ch.shirtFrom = ch.shirt.slice(); ch.shirtT = 0;
    KG.sound('correct');
    setTimeout(() => KG.sound('sparkle'), 200);
    Kit.callout(KG.pick(['完成！', '好漂亮！', '魔法成功！', '太厲害了！']), css(lighter(target.c, 0.2)), '#8a2f6a');
    KG.say(`哇！是${target.n}！謝謝你！`);
    const L = LY;
    Kit.FX.burst(L.bx, L.by, { n: 26, types: ['star', 'spark', 'circle'], colors: [css(target.c), '#ffffff', '#ffd34d'], speed: 460 });
    Kit.FX.burst(L.cx, L.cy - L.s * 0.6, { n: 16, types: ['heart'], colors: ['#ff7eb0', '#ff9fc8', css(target.c)], speed: 300 });
    Kit.FX.ring(L.bx, L.by, '#ffffff');
    const dropsEl = $('drops').children[tIdx];
    if (dropsEl) { dropsEl.classList.add('on'); dropsEl.style.background = css(target.c); }
    setTimeout(() => {
      tIdx++;
      if (tIdx >= LEVELS[lvIdx].targets.length) finishLevel();
      else { drain(); setTimeout(nextTarget, 700); }
    }, 2300);
  }

  function drain() {
    if (!parts.some(Boolean)) return;
    drainT = 0.6;
    KG.sound('splash');
    KG.note(500, 0.4, 'sine', 0.12, 0, 150);
  }
  function emptyBowl() {
    if (pouring) return;
    if (!parts.some(Boolean)) { KG.sound('tick'); return; }
    if (mode === 'level') mistakes++;
    drain();
    $('btnEmpty').classList.remove('pulse');
    setTimeout(() => {
      parts = [0, 0, 0, 0];
      if (mode === 'level' && target) say(`幫我調出<span class="cw" style="background:${css(target.c)}">${target.n}</span>！`);
      else if (mode === 'free') say('點顏料罐，<br>倒進碗裡混混看！');
    }, 620);
  }

  function nextTarget() {
    const names = LEVELS[lvIdx].targets;
    target = T(names[tIdx]);
    parts = [0, 0, 0, 0]; shown = null; fillShown = 0;
    const un = FRIENDS.filter(f => prog.total >= f.need);
    ch = { kind: KG.pick(un).kind, jump: 1, happy: 0, shirt: [1, 1, 1], shirtTo: null, sweat: 0, enter: 1 };
    say(`幫我調出<span class="cw" style="background:${css(target.c)}">${target.n}</span>！`);
    KG.say(`幫我調出${target.n}！`);
    hintOn = false;
    busy = false;
    $('btnEmpty').classList.remove('pulse');
  }

  function say(html, wiggle) {
    const b = $('bubble');
    b.style.display = 'block';
    b.innerHTML = html;
    b.style.animation = 'none'; void b.offsetWidth; b.style.animation = '';
    if (wiggle) Kit.shake(b, 5);
  }

  /* ---------- 提示 ---------- */
  function showHint() {
    if (mode !== 'level' || !target || busy) return;
    hintOn = true;
    KG.sound('sparkle');
    const r = target.r;
    let h = '';
    r.forEach((n, i) => {
      if (!n) return;
      if (h) h += '<span>＋</span>';
      h += `<span class="drop" style="background:${css(POTS[i].col)}"></span>${n > 1 ? '<b>×' + n + '</b>' : ''}`;
    });
    say(`幫我調出<span class="cw" style="background:${css(target.c)}">${target.n}</span>！<div class="hint">${h}</div>`);
    const words = r.map((n, i) => n ? (n > 1 ? n + '份' : '') + POTS[i].name : '').filter(Boolean).join('加');
    KG.say(words);
    if (parts.some((v, i) => v > 0 && !r[i]) || parts.some((v, i) => v > r[i] * 4)) setTimeout(() => say('先按「倒掉」，<br>再照著提示倒喔！', true), 2200);
  }

  /* ---------- 主迴圈 ---------- */
  function frame(now) {
    const dt = Math.min(0.05, (now - last) / 1000);
    last = now; t += dt;
    update(dt);
    draw();
    requestAnimationFrame(frame);
  }
  function update(dt) {
    updatePour(dt);
    stirT = Math.max(0, stirT - dt);
    celebrateT = Math.max(0, celebrateT - dt);
    bowlHappy = Math.max(0, bowlHappy - dt);
    bowlSad = Math.max(0, bowlSad - dt);
    ch.jump = Math.max(0, ch.jump - dt * 1.6);
    ch.happy = Math.max(0, ch.happy - dt);
    ch.sweat = Math.max(0, ch.sweat - dt * 0.6);
    if (ch.enter) ch.enter = Math.max(0, ch.enter - dt * 2);
    if (ch.shirtTo) {
      ch.shirtT = Math.min(1, ch.shirtT + dt * 1.6);
      ch.shirt = ch.shirtFrom.map((v, i) => Kit.lerp(v, ch.shirtTo[i], ch.shirtT));
    }
    if (drainT > 0) {
      drainT -= dt;
      fillShown = Math.max(0, fillShown - dt * 2.2);
      stirT = 0.4;
      if (drainT <= 0) { fillShown = 0; shown = null; parts = [0, 0, 0, 0]; }
    }
    potAnim.forEach(a => { a.wob = Math.max(0, a.wob - dt); });
    for (let i = drips.length - 1; i >= 0; i--) {
      const d = drips[i];
      d.vy += 700 * dt; d.x += d.vx * dt; d.y += d.vy * dt; d.life -= dt * 1.8;
      if (d.life <= 0) drips.splice(i, 1);
    }
  }
  function draw() {
    if (!ctx) return;
    ctx.clearRect(0, 0, W, H);
    ctx.drawImage(bg, 0, 0, W, H);
    const L = LY;
    // 閃亮亮的魔法光點
    for (let i = 0; i < 8; i++) {
      const x = (i * 137.5 % 100) / 100 * W, y = 90 + ((i * 61) % 100) / 100 * (L.tableY - 120);
      const a = (Math.sin(t * 2 + i * 1.7) + 1) / 2;
      ctx.save(); ctx.translate(x, y); ctx.globalAlpha = a * 0.8; ctx.fillStyle = '#fff';
      Kit.FX.sparkPath(ctx, 6 + a * 4); ctx.fill(); ctx.restore();
    }
    // 角色站的圓台
    ctx.fillStyle = '#ffd1e6'; ctx.strokeStyle = '#c66a9a'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.ellipse(L.cx, L.cy + 4, L.s * 0.42, L.s * 0.1, 0, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    if (mode !== 'menu') {
      const enterX = (ch.enter || 0) * -W * 0.4;
      const balloon = mode === 'free' ? (shown || [0.97, 0.95, 1]) : (target ? target.c : null);
      drawFriend(ctx, L.cx + enterX, L.cy, L.s, ch.kind, { t, jump: Math.sin(ch.jump * Math.PI) * (ch.jump > 0 ? 1 : 0), happy: ch.happy, shirt: ch.shirt, balloon, balloonQ: mode === 'free' && !shown, sweat: ch.sweat, flip: L.land });
    }
    drawBowl(ctx);
    drawStream(ctx);
    drips.forEach(d => { ctx.fillStyle = css(d.c); ctx.globalAlpha = Math.max(0, d.life); ctx.beginPath(); ctx.arc(d.x, d.y, L.br * 0.04, 0, Math.PI * 2); ctx.fill(); ctx.globalAlpha = 1; });
    // 顏料罐（倒的那個最後畫，在最上層）
    const need = hintOn && target ? target.r : null;
    POTS.forEach((p, i) => { if (!pouring || pouring.i !== i) drawPot(ctx, p, potAnim[i].x, potAnim[i].y + Math.sin(t * 2 + i) * 2, potAnim[i].a, L.ps, need && need[i] > 0, potAnim[i].wob); });
    if (pouring) { const a = potAnim[pouring.i]; drawPot(ctx, POTS[pouring.i], a.x, a.y, a.a, LY.ps, false, 0); }
  }
  requestAnimationFrame(frame);

  /* ---------- 輸入 ---------- */
  cv.addEventListener('pointerdown', e => {
    e.preventDefault();
    if (mode === 'menu') return;
    const L = LY, x = e.clientX, y = e.clientY;
    for (let i = 0; i < POTS.length; i++) {
      const a = potAnim[i];
      if (Math.abs(x - a.x) < L.ps * 0.55 && y > a.y - L.ps * 0.65 && y < a.y + L.ps * 0.8) { tapPot(i); return; }
    }
    if (Math.hypot(x - L.bx, (y - L.by) * 1.6) < L.br && parts.some(Boolean) && !pouring) {
      stirT = 1; KG.sound('splash');
      return;
    }
    if (Math.abs(x - L.cx) < L.s * 0.4 && y < L.cy && y > L.cy - L.s * 1.1) {
      ch.jump = 1; ch.happy = 0.6; KG.sound('boing');
    }
  });
  window.addEventListener('keydown', e => {
    const k = { '1': 0, '2': 1, '3': 2, '4': 3, r: 0, y: 1, b: 2, w: 3 }[e.key.toLowerCase()];
    if (k != null) tapPot(k);
    else if (e.key === 'Backspace' || e.key === 'Delete') emptyBowl();
  });
  $('btnEmpty').addEventListener('click', () => { if (mode !== 'menu') emptyBowl(); });
  $('btnHint').addEventListener('click', showHint);
  $('btnMenu').addEventListener('click', () => { KG.sound('pop'); showLevels(); });

  /* ---------- 流程 ---------- */
  function setUI(m) {
    mode = m;
    $('hud').style.display = m === 'menu' ? 'none' : '';
    $('btnEmpty').style.display = m === 'menu' ? 'none' : 'grid';
    $('btnHint').style.display = m === 'level' ? 'grid' : 'none';
    $('btnMenu').style.display = m === 'free' ? 'grid' : 'none';
    $('chipP').style.display = m === 'level' ? '' : 'none';
    if (m === 'menu') $('bubble').style.display = 'none';
  }
  function startLevel(i) {
    lvIdx = i; tIdx = 0; mistakes = 0;
    setUI('level');
    $('lvTxt').textContent = '第 ' + (i + 1) + ' 關';
    $('drops').innerHTML = LEVELS[i].targets.map(() => '<i></i>').join('');
    if (!Kit.Music.playing) Kit.Music.start(Kit.SONGS.gentle);
    parts = [0, 0, 0, 0]; shown = null; fillShown = 0;
    nextTarget();
    Kit.callout('第 ' + (i + 1) + ' 關', '#ffd34d', '#8a2f6a');
  }
  function startFree() {
    setUI('free');
    $('lvTxt').textContent = '自由玩';
    if (!Kit.Music.playing) Kit.Music.start(Kit.SONGS.gentle);
    parts = [0, 0, 0, 0]; shown = null; fillShown = 0; target = null;
    const un = FRIENDS.filter(f => prog.total >= f.need);
    ch = { kind: KG.pick(un).kind, jump: 1, happy: 0, shirt: [1, 1, 1], shirtTo: null, sweat: 0, enter: 1 };
    say('點顏料罐，<br>倒進碗裡混混看！');
    KG.say('自由玩！想調什麼顏色都可以喔！');
    busy = false;
  }
  function finishLevel() {
    busy = true;
    Kit.Music.stop();
    const stars = mistakes === 0 ? 3 : mistakes <= 2 ? 2 : 1;
    const before = prog.total;
    prog.set(lvIdx, stars);
    const nf = FRIENDS.find(f => f.need > before && f.need <= prog.total);
    Kit.result({
      stars,
      message: `調出了 ${LEVELS[lvIdx].targets.join('、')}！<br>你是真正的調色魔法師！`,
      hero: `<canvas id="rhero" width="240" height="240" style="width:100%;height:100%"></canvas>`,
      unlock: nf ? `新朋友來了：${nf.name}！` : null,
      unlockIcon: nf ? `<canvas id="uhero" width="120" height="120" style="width:100%;height:100%"></canvas>` : null,
      onNext: lvIdx < LEVELS.length - 1 ? () => startLevel(lvIdx + 1) : null,
      onReplay: () => startLevel(lvIdx),
      onMenu: showLevels
    });
    const rh = $('rhero');
    if (rh) { const g = rh.getContext('2d'); g.scale(2, 2); drawFriend(g, 74, 112, 84, ch.kind, { t: 0, happy: 1, shirt: ch.shirt, balloon: target.c }); }
    const uh = $('uhero');
    if (uh && nf) { const g = uh.getContext('2d'); drawFriend(g, 64, 116, 82, nf.kind, { t: 0 }); }
  }
  function showLevels() {
    setUI('menu');
    busy = true;
    pouring = null;
    POTS.forEach((p, i) => { potAnim[i].x = LY.pots[i]; potAnim[i].y = LY.potY; potAnim[i].a = 0; });
    if (!Kit.Music.playing) Kit.Music.start(Kit.SONGS.gentle);
    Kit.levelSelect({
      title: '調色關卡', count: LEVELS.length, progress: prog, names: LEVELS.map(l => l.name),
      bg: 'linear-gradient(180deg, rgba(217,200,255,.95), rgba(255,220,236,.96))',
      onPick: startLevel,
      extra: (box, close) => {
        box.innerHTML = '<div class="kit-shelf-title">來找你調色的朋友（集星星解鎖）</div><div class="kit-shelf"></div>';
        const shelf = box.querySelector('.kit-shelf');
        FRIENDS.forEach(f => {
          const un = prog.total >= f.need;
          const b = document.createElement('div');
          b.className = 'kit-item' + (un ? '' : ' locked');
          b.innerHTML = `<canvas class="pv" width="132" height="132"></canvas>` + (un ? `<span>${f.name}</span>` : `<span class="need">${Kit.ICON.star(true)}${f.need}</span>`);
          const g = b.querySelector('canvas').getContext('2d');
          drawFriend(g, 66, 124, 104, f.kind, { t: 0 });
          b.addEventListener('click', () => { if (un) { KG.say(f.name); KG.sound('pop'); } else { KG.sound('wrong'); Kit.shake(b, 5); } });
          shelf.appendChild(b);
        });
        const fb = document.createElement('button');
        fb.className = 'kit-bigbtn alt small freebtn';
        fb.innerHTML = Kit.ICON.play() + '<span>自由調色</span>';
        fb.addEventListener('click', () => { KG.sound('pop'); close(); startFree(); });
        box.appendChild(fb);
      }
    });
  }

  window.addEventListener('resize', layout);
  layout();
  setUI('menu');
  // 標題畫面的主角
  const heroCv = document.createElement('canvas');
  heroCv.width = 600; heroCv.height = 600;
  let heroT = 0, heroAlive = true;
  function heroLoop() {
    if (!heroAlive) return;
    heroT += 1 / 60;
    const g = heroCv.getContext('2d');
    g.setTransform(1, 0, 0, 1, 0, 0);
    g.clearRect(0, 0, 600, 600);
    g.scale(2, 2);
    const bal = [[1, 0.55, 0.08], [0.22, 0.7, 0.3], [0.55, 0.2, 0.68], [0.96, 0.55, 0.6]][Math.floor(heroT / 2) % 4];
    drawFriend(g, 175, 275, 210, 'bear', { t: heroT, balloon: bal, shirt: [1, 0.85, 0.92], jump: Math.max(0, Math.sin(heroT * 3)) * 0.25 });
    requestAnimationFrame(heroLoop);
  }
  Kit.title({
    logo: '調色魔法師', colors: ['#ff4d5e', '#ffb12e', '#3fbf6f', '#3b7ddd', '#8e6cef'], stroke: '#6a2a7a',
    bg: 'radial-gradient(circle at 50% 45%, rgba(255,255,255,.7), rgba(255,255,255,0) 55%), linear-gradient(160deg, #ffd6ec 0%, #e3d4ff 50%, #c9ecff 100%)',
    hero: '',
    sub: '紅、黃、藍、白，混出好多新顏色！',
    buttons: [{ text: '開始', onClick: () => { heroAlive = false; KG.say('調色魔法師！'); showLevels(); } }],
    onMount: ov => { ov.querySelector('.kit-hero').appendChild(heroCv); heroLoop(); }
  });
})();
</script>
</body>
</html>
