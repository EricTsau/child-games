let renderer = null;
try {
  renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('gl'), antialias: true, powerPreference: 'high-performance' });

function main() {
  const cv = document.getElementById('ui');
  const ctx = cv.getContext('2d');
  const FONT = "'Rajdhani','Baloo 2','PingFang TC','Noto Sans TC','Microsoft JhengHei',sans-serif";
  const font = (w, s) => w + ' ' + Math.round(s) + 'px ' + FONT;
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const lerp = (a, b, t) => a + (b - a) * t;
  const smooth = t => t * t * (3 - 2 * t);
  const rand = (a, b) => a + Math.random() * (b - a);
  const damp = (a, b, k, dt) => a + (b - a) * (1 - Math.exp(-k * dt));
  const TAU = Math.PI * 2;

  /* =========================================================
   * 存檔與車輛資料
   * ========================================================= */

  function persist() { KG.store.set(SAVE_KEY, save); }
  let best = KG.best('highway-racer') || 0;

  const CARS = [
    { id: 'bolt', name: '閃電 GT', en: 'BOLT GT', price: 0, color: 0xe3262f, w: 1.86, len: 4.3, h: 0.6, roof: 0.5, cabinLen: 0.42, spoiler: 1, lane: 10, nitro: 1, coinMul: 1, perk: '均衡好上手，新手首選' },
    { id: 'gale', name: '疾風 R', en: 'GALE R', price: 150, color: 0x1f6dff, w: 1.84, len: 4.25, h: 0.56, roof: 0.46, cabinLen: 0.38, spoiler: 2, lane: 14, nitro: 1, coinMul: 1, perk: '換車道更靈敏' },
    { id: 'beast', name: '猛獸 V8', en: 'BEAST V8', price: 300, color: 0xffa514, w: 2.0, len: 4.65, h: 0.7, roof: 0.5, cabinLen: 0.36, spoiler: 1, scoop: true, lane: 9, nitro: 1.3, coinMul: 1, perk: '氮氣持續時間 +30%' },

    { id: 'aurora', name: '極光 EV', en: 'AURORA EV', price: 1000, color: 0xeef3fa, w: 1.9, len: 4.4, h: 0.55, roof: 0.5, cabinLen: 0.46, spoiler: 0, glow: 0x30e8ff, lane: 12, nitro: 1.15, coinMul: 2, perk: '撿到的金幣加倍' }

  /* =========================================================

  let phase = 'title';         // title | garage | ready | play | pause | crash | over

  /* =========================================================

  const camera = new THREE.PerspectiveCamera(60, 1, 0.1, 950);

  const hemi = new THREE.HemisphereLight(0xcfe8ff, 0x55663a, 1.0);
  scene.add(hemi);
  const sun = new THREE.DirectionalLight(0xfff2dc, 2.2);

  const maxAniso = Math.min(8, renderer.capabilities.getMaxAnisotropy());

  function makeTex(w, h, draw, srgb) {
    const c = document.createElement('canvas');
    c.width = w; c.height = h;
    draw(c.getContext('2d'), w, h);
    const t = new THREE.CanvasTexture(c);
    if (srgb !== false) t.colorSpace = THREE.SRGBColorSpace;
    t.anisotropy = 4;
    return t;
  }
  function mulberry(seed) {
    return function () {
      seed |= 0; seed = seed + 0x6D2B79F5 | 0;
      let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }
  const glowTex = makeTex(128, 128, (c, w, h) => {
    const g = c.createRadialGradient(w / 2, h / 2, 0, w / 2, h / 2, w / 2);
    g.addColorStop(0, 'rgba(255,255,255,1)'); g.addColorStop(0.35, 'rgba(255,255,255,.45)'); g.addColorStop(1, 'rgba(255,255,255,0)');

  const shadowTex = makeTex(128, 128, (c, w, h) => {
    const g = c.createRadialGradient(w / 2, h / 2, 0, w / 2, h / 2, w / 2);
    g.addColorStop(0, 'rgba(0,0,0,.85)'); g.addColorStop(0.55, 'rgba(0,0,0,.55)'); g.addColorStop(1, 'rgba(0,0,0,0)');
    c.fillStyle = g; c.fillRect(0, 0, w, h);
  });
  const addMat = (tex, color, op) => new THREE.MeshBasicMaterial({ map: tex, color: color, transparent: true, opacity: op == null ? 1 : op, blending: THREE.AdditiveBlending, depthWrite: false, toneMapped: false, fog: false });
  const shadowMat = new THREE.MeshBasicMaterial({ map: shadowTex, transparent: true, depthWrite: false, opacity: 0.75 });
  const flatPlane = new THREE.PlaneGeometry(1, 1).rotateX(-Math.PI / 2);

  /* ---------- 天空 ---------- */
  const skyU = {
    uTop: { value: new THREE.Color() }, uHor: { value: new THREE.Color() }, uSunCol: { value: new THREE.Color() },
    uSunDir: { value: new THREE.Vector3(0.2, 0.3, -1).normalize() }, uNight: { value: 0 }, uSunSize: { value: 0.0016 }
  };
  const sky = new THREE.Mesh(new THREE.SphereGeometry(800, 32, 16), new THREE.ShaderMaterial({
    uniforms: skyU, side: THREE.BackSide, depthWrite: false, fog: false,
    vertexShader: 'varying vec3 vDir; void main(){ vDir = position; vec4 p = projectionMatrix * modelViewMatrix * vec4(position, 1.0); gl_Position = p.xyww; }',
    fragmentShader: `uniform vec3 uTop, uHor, uSunCol, uSunDir; uniform float uNight, uSunSize; varying vec3 vDir;
      float hash(vec3 p){ p = fract(p * 0.3183099 + 0.1); p *= 17.0; return fract(p.x * p.y * p.z * (p.x + p.y + p.z)); }
      void main(){
        vec3 d = normalize(vDir); float h = d.y;
        vec3 col = mix(uHor, uTop, smoothstep(0.0, 0.5, h));
        float s = max(dot(d, normalize(uSunDir)), 0.0);
        col += uSunCol * (pow(s, 6.0) * 0.32 + pow(s, 60.0) * 0.5);
        col += uSunCol * smoothstep(1.0 - uSunSize, 1.0 - uSunSize * 0.55, s) * 3.0;
        if (uNight > 0.01) {
          vec3 c = floor(d * 230.0); float st = hash(c);
          col += vec3(step(0.9972, st) * uNight * (0.5 + 0.9 * hash(c + 1.7))) * smoothstep(0.06, 0.3, h);
        }
        gl_FragColor = vec4(col, 1.0);
        #include <tonemapping_fragment>
        #include <colorspace_fragment>
      }`
  }));
  sky.frustumCulled = false;
  sky.renderOrder = -10;
  scene.add(sky);

  // 遠山
  const mountTex = makeTex(1024, 256, (c, w, h) => {
    const rnd = mulberry(7);
    function ridge(base, amp, alpha, freq) {
      c.fillStyle = 'rgba(255,255,255,' + alpha + ')';
      c.beginPath(); c.moveTo(0, h);
      let y = base;
      for (let x = 0; x <= w; x += 8) {
        y = base - amp * (0.5 + 0.5 * Math.sin(x * freq + rnd() * 0.3)) * (0.6 + 0.4 * Math.sin(x * freq * 0.37 + 2)) - rnd() * amp * 0.12;
        c.lineTo(x, y);
      }
      c.lineTo(w, h); c.closePath(); c.fill();
    }
    ridge(150, 110, 0.55, 0.011);
    ridge(200, 70, 1, 0.019);
  });
  const mountMat = new THREE.MeshBasicMaterial({ map: mountTex, transparent: true, fog: false, depthWrite: false });
  const mountains = new THREE.Mesh(new THREE.PlaneGeometry(1800, 200), mountMat);
  mountains.position.set(0, 55, -520);
  mountains.renderOrder = -5;
  scene.add(mountains);

  /* ---------- 路面與草地 ---------- */
  const roadTex = makeTex(512, 512, (c, w, h) => {
    const rnd = mulberry(3);
    c.fillStyle = '#3a3d44'; c.fillRect(0, 0, w, h);
    for (let i = 0; i < 9000; i++) { const v = 40 + rnd() * 40 | 0; c.fillStyle = 'rgba(' + v + ',' + v + ',' + (v + 6) + ',.5)'; c.fillRect(rnd() * w, rnd() * h, 2, 2); }
    const px = x => (x + ROAD_HALF) / (ROAD_HALF * 2) * w;
    // 路肩
    c.fillStyle = 'rgba(70,70,74,.6)'; c.fillRect(0, 0, px(-6.8), h); c.fillRect(px(6.8), 0, w - px(6.8), h);
    // 車輪痕
    LANES.forEach(x => { c.fillStyle = 'rgba(20,20,24,.18)'; c.fillRect(px(x - 0.9) - 6, 0, 12, h); c.fillRect(px(x + 0.9) - 6, 0, 12, h); });
    c.fillStyle = '#f2f2ee';
    c.fillRect(px(-6.8) - 3, 0, 6, h); c.fillRect(px(6.8) - 3, 0, 6, h);
    [-3.4, 0, 3.4].forEach(x => { c.fillRect(px(x) - 3, 0, 6, h * 0.36); });
    c.fillStyle = '#e8c23a';
    c.fillRect(px(-6.8) + 5, 0, 3, h);
  });
  roadTex.wrapS = THREE.ClampToEdgeWrapping; roadTex.wrapT = THREE.RepeatWrapping;
  roadTex.repeat.set(1, 30); roadTex.anisotropy = maxAniso;
  const roadMat = new THREE.MeshStandardMaterial({ map: roadTex, roughness: 0.92, metalness: 0.0, envMapIntensity: 0.4 });
  const road = new THREE.Mesh(new THREE.PlaneGeometry(ROAD_HALF * 2, 360).rotateX(-Math.PI / 2).translate(0, 0, -160), roadMat);
  scene.add(road);
  const grassTex = makeTex(128, 128, (c, w, h) => {
    const rnd = mulberry(11);
    c.fillStyle = '#6f9a45'; c.fillRect(0, 0, w, h);
    for (let i = 0; i < 1600; i++) { c.fillStyle = rnd() < 0.5 ? 'rgba(60,110,40,.5)' : 'rgba(140,170,80,.4)'; c.fillRect(rnd() * w, rnd() * h, 2, 3); }
  });
  grassTex.wrapS = grassTex.wrapT = THREE.RepeatWrapping;
  grassTex.repeat.set(60, 80); grassTex.anisotropy = maxAniso;
  const ground = new THREE.Mesh(new THREE.PlaneGeometry(600, 800).rotateX(-Math.PI / 2), new THREE.MeshLambertMaterial({ map: grassTex }));
  ground.position.set(0, -0.04, -300);
  scene.add(ground);
  // 護欄
  const railMat = new THREE.MeshStandardMaterial({ color: 0xc9ced6, metalness: 0.7, roughness: 0.35 });
  [-1, 1].forEach(s => {
    const r = new THREE.Mesh(new THREE.BoxGeometry(0.08, 0.32, 360), railMat);
    r.position.set(s * 7.9, 0.62, -160);
    scene.add(r);
  });

  /* ---------- 共用：InstancedMesh 小工具 ---------- */
  function inst(geo, mat, n, color) {
    const m = new THREE.InstancedMesh(geo, mat, n);
    m.frustumCulled = false;
    m.count = 0;
    if (color) { const c = new THREE.Color(); for (let i = 0; i < n; i++) m.setColorAt(i, c.setHex(color)); }
    scene.add(m);
    return m;
  }
  function flush(m, n) {
    m.count = n;
    m.instanceMatrix.needsUpdate = true;
    if (m.instanceColor) m.instanceColor.needsUpdate = true;
  }
  const m4 = new THREE.Matrix4(), m5 = new THREE.Matrix4(), q4 = new THREE.Quaternion(), v3 = new THREE.Vector3(), s3 = new THREE.Vector3(1, 1, 1), e3 = new THREE.Euler();
  const tmpC = new THREE.Color(), tmpC2 = new THREE.Color();
  const ZAXIS = new THREE.Vector3(0, 0, 1);

  /* ---------- 路邊景物 ---------- */
  // 護欄柱
  const POSTS = 60, POST_SP = 5;
  const posts = []; for (let i = 0; i < POSTS; i++) posts.push({ z: 20 - i * POST_SP });
  const postI = inst(new THREE.BoxGeometry(0.12, 0.85, 0.14), new THREE.MeshLambertMaterial({ color: 0x8a9099 }), POSTS * 2);
  // 路燈
  const LAMPS = 12, LAMP_SP = 32;
  const lamps = []; for (let i = 0; i < LAMPS; i++) lamps.push({ z: 4 - i * LAMP_SP });
  const lampPoleMat = new THREE.MeshLambertMaterial({ color: 0x6d737c });
  const poleI = inst(new THREE.CylinderGeometry(0.11, 0.16, 8, 6).translate(0, 4, 0), lampPoleMat, LAMPS * 2);
  const armI = inst(new THREE.BoxGeometry(2.3, 0.12, 0.14), lampPoleMat, LAMPS * 2);
  const lampHeadMat = new THREE.MeshBasicMaterial({ color: 0xffffff, toneMapped: false });
  const headI = inst(new THREE.BoxGeometry(0.95, 0.16, 0.42), lampHeadMat, LAMPS * 2);
  const poolMat = addMat(glowTex, 0xffc070, 0);
  const poolI = inst(flatPlane, poolMat, LAMPS * 2);
  // 建築
  const winCanvas = [document.createElement('canvas'), document.createElement('canvas')];
  winCanvas.forEach(c => { c.width = 128; c.height = 256; });
  (function () {
    const a = winCanvas[0].getContext('2d'), b = winCanvas[1].getContext('2d');
    const rnd = mulberry(21);
    a.fillStyle = '#e4e2dc'; a.fillRect(0, 0, 128, 256);
    b.fillStyle = '#000'; b.fillRect(0, 0, 128, 256);
    a.fillStyle = '#8f8d88'; a.fillRect(0, 0, 128, 6);
    for (let r = 0; r < 14; r++) for (let col = 0; col < 6; col++) {
      const x = 8 + col * 19.5, y = 14 + r * 17.4;
      a.fillStyle = rnd() < 0.5 ? '#35435a' : '#2b3649'; a.fillRect(x, y, 12, 10);
      if (rnd() < 0.38) { b.fillStyle = rnd() < 0.6 ? '#ffcf73' : '#fff1c8'; b.fillRect(x, y, 12, 10); }
    }
  })();
  const winMap = new THREE.CanvasTexture(winCanvas[0]); winMap.colorSpace = THREE.SRGBColorSpace;
  const winEmi = new THREE.CanvasTexture(winCanvas[1]); winEmi.colorSpace = THREE.SRGBColorSpace;
  const bldGeo = new THREE.BoxGeometry(1, 1, 1).translate(0, 0.5, 0);
  plainFaces(bldGeo, [2, 3], 0.5, 0.99);
  const bldMat = new THREE.MeshLambertMaterial({ map: winMap, emissiveMap: winEmi, emissive: 0xffffff, emissiveIntensity: 0 });
  const BLD = 36, BLD_SPAN = 360;
  const blds = [];
  const BLD_COLS = [0xd8d2c4, 0xc4ccd8, 0xb8b0a8, 0xe0d8c8, 0xa8b8c8, 0xd0c0b0, 0x9aa4b0];
  function rollBld(o) { o.x = o.side * rand(17, 34); o.w = rand(8, 15); o.d = rand(8, 15); o.h = rand(7, 34) * (Math.random() < 0.2 ? 1.6 : 1); o.c = BLD_COLS[Math.random() * BLD_COLS.length | 0]; }
  for (let i = 0; i < BLD; i++) { const o = { side: i % 2 ? 1 : -1, z: 10 - Math.floor(i / 2) * 20 - rand(0, 8) }; rollBld(o); blds.push(o); }
  const bldI = inst(bldGeo, bldMat, BLD, 0xffffff);
  // 樹
  const TREES = 64, TREE_SPAN = 360;
  const trees = [];
  const TREE_COLS = [0x3f7d34, 0x4f8f3a, 0x2f6a2c, 0x5c9a3f, 0x6a8f2a];
  function rollTree(o) { o.x = o.side * rand(10.2, 14.5); o.s = rand(0.8, 1.5); o.c = TREE_COLS[Math.random() * TREE_COLS.length | 0]; o.r = rand(0, TAU); }
  for (let i = 0; i < TREES; i++) { const o = { side: i % 2 ? 1 : -1, z: 16 - Math.floor(i / 2) * 11.25 - rand(0, 4) }; rollTree(o); trees.push(o); }
  const trunkI = inst(new THREE.CylinderGeometry(0.16, 0.24, 2, 5).translate(0, 1, 0), new THREE.MeshLambertMaterial({ color: 0x6b4a2e }), TREES);
  const crownI = inst(new THREE.IcosahedronGeometry(1.6, 0).translate(0, 3.4, 0), new THREE.MeshLambertMaterial({ flatShading: true }), TREES, 0x4f8f3a);
  // 廣告看板
  const BB_TEXTS = [
    ['極速公路', 'HIGHWAY RUSH', '#ff6a1f', '#2a0f05'],
    ['加油！', '前方還有好多金幣', '#ffd23a', '#3a2205'],
    ['注意安全', '保持車距 · 小心駕駛', '#38b6ff', '#04203a'],
    ['珍珠奶茶', '下一個出口 2 km', '#ff7ab0', '#3a0a22'],
    ['NITRO!', '氮氣加速 衝衝衝', '#b46cff', '#160636']
  ];
  const bbMats = BB_TEXTS.map(t => {
    const tex = makeTex(512, 256, (c, w, h) => {
      const g = c.createLinearGradient(0, 0, 0, h);
      g.addColorStop(0, t[3]); g.addColorStop(1, '#000');
      c.fillStyle = g; c.fillRect(0, 0, w, h);
      c.strokeStyle = t[2]; c.lineWidth = 14; c.strokeRect(10, 10, w - 20, h - 20);
      c.fillStyle = t[2]; c.textAlign = 'center'; c.textBaseline = 'middle';
      c.font = '900 92px ' + FONT; c.fillText(t[0], w / 2, h * 0.42);
      c.fillStyle = '#ffffff'; c.font = '800 38px ' + FONT; c.fillText(t[1], w / 2, h * 0.76);
    });
    return new THREE.MeshLambertMaterial({ map: tex, emissiveMap: tex, emissive: 0xffffff, emissiveIntensity: 0.2 });
  });
  const bbFrameMat = new THREE.MeshLambertMaterial({ color: 0x30343c });
  const bbPostGeo = new THREE.CylinderGeometry(0.16, 0.16, 6, 6).translate(0, 3, 0);
  const bbFrameGeo = new THREE.BoxGeometry(6.6, 3.4, 0.3);
  const bbFaceGeo = new THREE.PlaneGeometry(6.2, 3.1);
  const billboards = [];

  window.__hr = {
    state: () => ({ phase, dist: Math.round(dist), speed: Math.round(speed * 3.6), lane, carX: +carX.toFixed(2), nitro: +nitro.toFixed(2), boosting, shieldT: +shieldT.toFixed(1), invT, coins: runCoins, bank: save.coins, score, bonus, traffic: traffic.filter(v => v.active).length, coinsOut: coins.filter(c => c.active).length, rain: +rainAmt.toFixed(2), night: +night.toFixed(2), envT: +envT.toFixed(3), q: qLevel, continued, car: save.car }),
    start: () => startRun(),
    tick: sec => { const n = Math.round(sec * 60); for (let i = 0; i < n; i++) update(1 / 60 * timeScale, 1 / 60); },
    steer: d => steer(d),
    nitro: () => { nitro = 1; tryNitro(); },
    setDist: d => { dist = d; nextKm = Math.ceil((d + 1) / 1000) * 1000; },
    rain: on => { if (on) { nextRainAt = dist - 1; rainEnd = dist + 600; } else { rainEnd = dist - 1; } },
    god: on => { god = !!on; },
    addCoins: n => { save.coins += n; persist(); },
    shield: () => { shieldT = 15; },
    crash: () => { const v = spawnVehicle(lane, -3); if (v) { v.z = 0; crash(v); } },
    spawnAhead: (L, z) => spawnVehicle(L, z),
    garage: () => { phase = 'garage'; },
    hits: () => HITS.map(h => ({ id: h.id, x: Math.round(h.x + h.w / 2), y: Math.round(h.y + h.h / 2) })),
    peek: () => ({ v: traffic.filter(v => v.active && !v.wreck).map(v => [v.lane, v.tLane, +v.z.toFixed(1), v.T.len, +v.x.toFixed(2)]), c: coins.filter(c => c.active).map(c => [+c.x.toFixed(2), +c.z.toFixed(1)]) }),
    quality: n => { qLevel = clamp(n, 0, QLEVELS.length - 1); perf.cool = 1e9; applyQuality(); },
    info: () => ({ calls: renderer.info.render.calls, tris: renderer.info.render.triangles })
  };
}
</script>
</body>
</html>
