<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>一筆畫</title>
<link rel="stylesheet" href="../../assets/common.css">
<style>
  :root { --ink: #ffe08a; --glow: #ffd36b; --bg1: #26365f; --bg2: #7b5b8f; --bg3: #f2a284; }
  html, body { height: 100%; overflow: hidden; background: #1d2547; overscroll-behavior: none; }
  #cv { position: fixed; inset: 0; display: block; width: 100vw; height: 100vh; height: 100dvh; touch-action: none; }
  .screen { position: fixed; inset: 0; z-index: 8500; display: none; color: #fff; }
  .screen.on { display: flex; }
  .btn {
    font-family: var(--kg-font); font-size: 19px; font-weight: 800; letter-spacing: 1px;
    color: #fff; border: 1.5px solid rgba(255,255,255,0.55); border-radius: 999px; padding: 12px 28px; cursor: pointer;
    background: rgba(255,255,255,0.14); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
    box-shadow: 0 6px 22px rgba(0,0,0,0.18), inset 0 1px 0 rgba(255,255,255,0.35);
    transition: transform .12s ease, background .2s ease; touch-action: manipulation;
  }
  .btn:hover { background: rgba(255,255,255,0.22); }
  .btn:active { transform: scale(0.95); }
  .btn.primary { background: linear-gradient(180deg, #fff6d8, var(--ink)); color: #5a4317; border-color: #fff; text-shadow: none;
    box-shadow: 0 6px 24px rgba(255, 210, 120, 0.45), inset 0 1px 0 #fff; }
  .btn.small { font-size: 16px; padding: 9px 18px; }

  /* 標題 */
  #title { flex-direction: column; align-items: center; padding: max(70px, env(safe-area-inset-top)) 20px max(22px, env(safe-area-inset-bottom)); }
  #title .logo { margin: 0; font-size: clamp(52px, 13vw, 92px); font-weight: 900; letter-spacing: 10px; line-height: 1;
    background: linear-gradient(180deg, #fff 20%, var(--ink)); -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 4px 18px rgba(255, 220, 140, 0.45)); }
  #title .tag { margin: 10px 0 0; font-size: 16px; opacity: .85; letter-spacing: 1px; text-align: center; }
  #tSpace { flex: 1; width: 100%; min-height: 120px; }
  #title .panel { display: flex; flex-direction: column; align-items: center; gap: 12px; width: 100%; max-width: 360px; }
  #title .panel .btn { width: 100%; max-width: 280px; }
  #title .tstat { font-size: 15px; opacity: .85; display: flex; gap: 14px; }
  .toggle { display: flex; align-items: center; gap: 10px; font-size: 15px; cursor: pointer; opacity: .92; }
  .toggle input { appearance: none; -webkit-appearance: none; width: 46px; height: 26px; border-radius: 99px; background: rgba(255,255,255,0.25);
    position: relative; cursor: pointer; transition: background .2s; margin: 0; flex: none; }
  .toggle input::after { content: ''; position: absolute; left: 3px; top: 3px; width: 20px; height: 20px; border-radius: 50%; background: #fff; transition: left .2s; }
  .toggle input:checked { background: var(--ink); }
  .toggle input:checked::after { left: 23px; }
  #title .col { display: contents; }
  @media (orientation: landscape) and (max-height: 560px) {
    #title { padding: 62px 24px 14px; }
    #title.on { display: grid; grid-template-columns: 1fr minmax(300px, 1fr); grid-template-rows: 1fr auto auto 1fr; column-gap: 16px; }
    #title .col { display: flex; flex-direction: column; align-items: center; }
    #title .head { grid-column: 2; grid-row: 2; }
    #title .col:last-child { grid-column: 2; grid-row: 3; margin-top: 14px; }
    #tSpace { grid-column: 1; grid-row: 1 / 5; height: 100%; min-height: 0; }
    #title .logo { font-size: 58px; }
    #title .tag { font-size: 14px; }
    #title .panel { gap: 9px; }
    #title .panel .btn { padding: 10px 24px; }
  }

  /* 關卡地圖 */
  #map { flex-direction: column; align-items: center; padding-top: max(12px, env(safe-area-inset-top)); }
  .mhead { height: 52px; display: flex; align-items: center; justify-content: flex-end; gap: 10px; width: 100%; padding: 0 68px 0 160px; flex: none; }
  .mhead .mt { font-size: 22px; font-weight: 900; letter-spacing: 3px; }
  .pill { background: rgba(255,255,255,0.16); border: 1px solid rgba(255,255,255,0.35); border-radius: 99px; padding: 4px 12px; font-size: 15px; font-weight: 800; white-space: nowrap; }
  #backBtn { position: fixed; left: 66px; top: 14px; z-index: 8600; padding: 8px 14px; font-size: 15px; }
  .chips { display: flex; gap: 8px; padding: 8px 12px 4px; overflow-x: auto; max-width: 100%; scrollbar-width: none; flex: none; }
  .chips::-webkit-scrollbar { display: none; }
  .chip { flex: none; display: flex; flex-direction: column; align-items: center; min-width: 64px; padding: 6px 10px; border-radius: 16px; cursor: pointer;
    font-family: var(--kg-font); color: #fff; border: 1.5px solid rgba(255,255,255,0.3); background: rgba(255,255,255,0.1); }
  .chip b { font-size: 16px; } .chip small { font-size: 12px; opacity: .8; }
  .chip.sel { background: rgba(255,255,255,0.3); border-color: #fff; box-shadow: 0 0 18px rgba(255,255,255,0.3); }
  .chip.lock { opacity: .55; }
  .chinfo { font-size: 15px; opacity: .9; padding: 6px 12px 2px; text-align: center; flex: none; }
  .gridwrap { flex: 1; width: 100%; overflow-y: auto; touch-action: pan-y; -webkit-overflow-scrolling: touch; padding: 8px 12px max(16px, env(safe-area-inset-bottom)); }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(78px, 1fr)); gap: 10px; max-width: 760px; margin: 0 auto; }
  .lv { position: relative; aspect-ratio: 0.86; border-radius: 18px; border: 1.5px solid rgba(255,255,255,0.35); background: rgba(255,255,255,0.12);
    display: flex; flex-direction: column; align-items: center; justify-content: space-between; padding: 6px 4px 6px; cursor: pointer; color: #fff;
    font-family: var(--kg-font); transition: transform .12s; animation: lvIn .4s ease both; }
  .lv:active { transform: scale(0.94); }
  .lv canvas { width: 70%; aspect-ratio: 1; }
  .lv .n { position: absolute; left: 7px; top: 4px; font-size: 13px; font-weight: 800; opacity: .85; }
  .lv .st { display: flex; gap: 1px; height: 14px; }
  .lv .st svg { width: 14px; height: 14px; }
  .lv.lock { opacity: .45; cursor: default; }
  .lv.next { border-color: #fff; box-shadow: 0 0 0 2px rgba(255,255,255,0.25), 0 0 22px var(--glow); }
  .lv.done { background: rgba(255,255,255,0.2); }
  @keyframes lvIn { from { opacity: 0; transform: translateY(12px) scale(.9); } to { opacity: 1; transform: none; } }

  /* 遊戲 HUD */
  #hud { position: fixed; top: 14px; left: 50%; transform: translateX(-50%); z-index: 8000; display: none; align-items: center; gap: 6px;
    max-width: calc(100vw - 136px); color: #fff; pointer-events: none; }
  #hud.on { display: flex; }
  #hud .pill { font-size: 15px; padding: 8px 11px; overflow: hidden; text-overflow: ellipsis; background: rgba(0,0,0,0.18); }
  #hudProg { flex: none; }
  @media (max-width: 370px) { #hud .pill { font-size: 14px; padding: 7px 9px; } #hudTime { display: none; } }
  #hudName { min-width: 0; }
  #hudProg { font-variant-numeric: tabular-nums; }
  .fab { position: fixed; z-index: 8000; width: 48px; height: 48px; border-radius: 50%; display: none; place-items: center; cursor: pointer;
    border: 1.5px solid rgba(255,255,255,0.55); background: rgba(255,255,255,0.16); color: #fff; padding: 0; touch-action: manipulation;
    backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); }
  .fab.on { display: grid; }
  #pauseBtn { right: 10px; top: 68px; }
  #tools { position: fixed; z-index: 8000; left: 50%; transform: translateX(-50%); bottom: max(14px, env(safe-area-inset-bottom)); display: none; gap: 14px; }
  #tools.on { display: flex; }
  .tool { position: relative; width: 74px; height: 62px; border-radius: 20px; border: 1.5px solid rgba(255,255,255,0.5); background: rgba(255,255,255,0.15);
    color: #fff; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; cursor: pointer; font-family: var(--kg-font);
    font-size: 13px; font-weight: 800; backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); touch-action: manipulation; transition: transform .1s; padding: 0; }
  .tool:active { transform: scale(0.92); }
  .tool svg { width: 26px; height: 26px; }
  .tool .badge { position: absolute; right: -6px; top: -6px; min-width: 24px; height: 24px; border-radius: 12px; background: var(--ink); color: #4b3a14;
    font-size: 13px; line-height: 24px; text-align: center; padding: 0 5px; box-shadow: 0 2px 8px rgba(0,0,0,0.25); font-variant-numeric: tabular-nums; }
  .tool.dim { opacity: .55; }
  .tool.flash { animation: flash 0.9s ease 2; }
  @keyframes flash { 50% { box-shadow: 0 0 0 4px #fff, 0 0 26px var(--glow); } }
  @media (orientation: landscape) and (max-height: 560px) {
    #tools { left: auto; right: 10px; top: 124px; bottom: auto; transform: none; flex-direction: column; gap: 8px; }
    .tool { width: 60px; height: 54px; font-size: 12px; }
    .tool svg { width: 22px; height: 22px; }
  }
  #tip { position: fixed; z-index: 7900; left: 50%; transform: translateX(-50%); bottom: 96px; color: #fff; font-size: 16px; font-weight: 800;
    background: rgba(0,0,0,0.22); padding: 8px 16px; border-radius: 99px; pointer-events: none; opacity: 0; transition: opacity .4s; white-space: nowrap; max-width: 92vw; overflow: hidden; text-overflow: ellipsis; }
  #tip.on { opacity: 1; }
  @media (orientation: landscape) and (max-height: 560px) { #tip { bottom: 12px; } }

  /* 對話框 */
  .modal { position: fixed; inset: 0; z-index: 8800; display: none; place-items: center; padding: 16px; background: rgba(10, 12, 30, 0.42);
    backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px); }
  .modal.on { display: grid; animation: kg-fade .25s ease; }
  .card { width: min(360px, 100%); border-radius: 28px; padding: 22px 22px 20px; color: #fff; text-align: center;
    background: linear-gradient(180deg, rgba(255,255,255,0.24), rgba(255,255,255,0.1)); border: 1.5px solid rgba(255,255,255,0.45);
    box-shadow: 0 20px 60px rgba(0,0,0,0.35); animation: kg-pop .35s cubic-bezier(.2,1.4,.4,1); max-height: 100%; overflow-y: auto; }
  .card h2 { margin: 0 0 6px; font-size: 28px; letter-spacing: 3px; }
  .card p { margin: 6px 0; opacity: .9; }
  .card .acts { display: flex; flex-direction: column; gap: 10px; margin-top: 14px; align-items: stretch; }
  .card .row { display: flex; gap: 10px; } .card .row .btn { flex: 1; padding-left: 8px; padding-right: 8px; }
  .rstars { display: flex; justify-content: center; gap: 10px; margin: 8px 0 4px; }
  .rstars svg { width: 54px; height: 54px; transform: scale(0); }
  .rstars svg.pop { animation: starPop .45s cubic-bezier(.2,1.6,.4,1) forwards; }
  .rstars svg:nth-child(2) { margin-top: -12px; }
  @keyframes starPop { from { transform: scale(0) rotate(-40deg); } to { transform: scale(1) rotate(0); } }
  .rname { font-size: 15px; opacity: .85; }
  .rnote { font-size: 14px; color: var(--ink); min-height: 1em; }
  #msg { position: fixed; left: 50%; top: 19%; transform: translate(-50%, 0); z-index: 8900; color: #fff; font-size: 17px; font-weight: 800;
    background: rgba(20, 20, 40, 0.55); border: 1px solid rgba(255,255,255,0.3); padding: 9px 18px; border-radius: 99px; pointer-events: none;
    opacity: 0; transition: opacity .3s, transform .3s; white-space: nowrap; }
  #msg.on { opacity: 1; transform: translate(-50%, -6px); }
  @media (orientation: landscape) and (max-height: 560px) { .card { padding: 14px 18px; } .card h2 { font-size: 22px; } .rstars svg { width: 40px; height: 40px; } .card .acts { margin-top: 8px; } }
</style>
</head>
<body>
<canvas id="cv" aria-label="一筆畫遊戲畫面"></canvas>

<div id="title" class="screen">
  <div class="col head">
    <h1 class="logo">一筆畫</h1>
    <p class="tag">一筆畫完所有的線，不重複、不提筆</p>
  </div>
  <div id="tSpace"></div>
  <div class="col">
    <div class="panel">
      <button class="btn primary" id="bPlay">開始</button>
      <button class="btn" id="bDaily">每日一題</button>
      <label class="toggle"><input type="checkbox" id="optKeep"> 放開手指時保留進度</label>
      <div class="tstat"><span id="tStars"></span><span id="tDaily"></span></div>
    </div>
  </div>
</div>

<div id="map" class="screen">
  <button class="btn small" id="backBtn">‹ 返回</button>
  <div class="mhead"><span class="pill" id="mStars"></span></div>
  <div class="chips" id="chips"></div>
  <div class="chinfo" id="chinfo"></div>
  <div class="gridwrap"><div class="grid" id="grid"></div></div>
</div>

<div id="hud"><span class="pill" id="hudName"></span><span class="pill" id="hudProg"><span id="hudCnt"></span><span id="hudTime"></span></span></div>
<button class="fab" id="pauseBtn" aria-label="暫停"><svg viewBox="0 0 24 24" width="22" height="22"><rect x="6" y="5" width="4" height="14" rx="1.5" fill="#fff"/><rect x="14" y="5" width="4" height="14" rx="1.5" fill="#fff"/></svg></button>
<div id="tools">
  <button class="tool" id="tUndo" aria-label="復原"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg>復原</button>
  <button class="tool" id="tRestart" aria-label="重來"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12a8 8 0 1 1-2.6-5.9"/><path d="M20 4v5h-5"/></svg>重來</button>
  <button class="tool" id="tHint" aria-label="提示"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18h6M10 21h4"/><path d="M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.2 1 2.1h5c0-.9.4-1.6 1-2.1A6 6 0 0 0 12 3z"/></svg><span id="hintLbl">提示</span><span class="badge" id="hintBadge">3</span></button>
</div>
<div id="tip"></div>
<div id="msg"></div>

<div id="pause" class="modal"><div class="card">
  <h2>暫停</h2>
  <p id="pInfo"></p>
  <div class="acts">
    <button class="btn primary" id="pResume">繼續</button>
    <button class="btn" id="pRestart">重新開始</button>
    <button class="btn" id="pMap">關卡地圖</button>
    <label class="toggle" style="justify-content:center"><input type="checkbox" id="optKeep2"> 放開手指時保留進度</label>
  </div>
</div></div>

<div id="result" class="modal"><div class="card">
  <div class="rname" id="rName"></div>
  <h2 id="rTitle">完成！</h2>
  <div class="rstars" id="rStars"></div>
  <p id="rInfo"></p>
  <div class="rnote" id="rNote"></div>
  <div class="acts">
    <button class="btn primary" id="rNext">下一關</button>
    <div class="row"><button class="btn" id="rRetry">再玩一次</button><button class="btn" id="rMap">地圖</button></div>
  </div>
</div></div>

<script src="../../assets/common.js"></script>
<script>
'use strict';
/*LEVELS-BEGIN*/
/* =====================================================================
 * 關卡：圖形資料、解題器（尤拉路徑＋單向線＋雙線）、程序產生
 * 圖形格式：點 'a0,0 b4,0'；線 'a-b-c~.3-a'（~ 後面是彎曲量，正值往行進方向左手邊彎）
 * ===================================================================== */
function mulberry(seed) {
  let s = seed >>> 0;
  return function () {
    s = (s + 0x6D2B79F5) >>> 0;
    let t = s;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function parseFig(name, ptsStr, edgeStr) {
  const P = [], idx = {};
  ptsStr.trim().split(/\s+/).forEach(tok => {
    const m = /^([A-Za-z][A-Za-z0-9]*):(-?[\d.]+),(-?[\d.]+)$/.exec(tok) || /^([A-Za-z][A-Za-z0-9]*),(-?[\d.]+),(-?[\d.]+)$/.exec(tok) || /^([A-Za-z]+)(-?[\d.]+),(-?[\d.]+)$/.exec(tok);
    if (!m) throw new Error('bad pt ' + tok + ' in ' + name);
    idx[m[1]] = P.length; P.push([+m[2], +m[3]]);
  });
  const E = [];
  edgeStr.trim().split(/\s+/).forEach(chain => {
    const hops = chain.split(/-(?=[A-Za-z])/);
    let prev = null;
    hops.forEach((h, i) => {
      const m = /^([A-Za-z][A-Za-z0-9]*?)(?:~(-?[\d.]+))?$/.exec(h);
      if (!m || idx[m[1]] == null) throw new Error('bad hop ' + h + ' in ' + name);
      const v = idx[m[1]];
      if (i > 0) E.push({ a: prev, b: v, bulge: m[2] ? +m[2] : 0, cnt: 1, dir: 0 });
      prev = v;
    });
  });
  return { name, P, E };
}
function cloneFig(f) { return { name: f.name, P: f.P.map(p => p.slice()), E: f.E.map(e => Object.assign({}, e)) }; }
const ringPts = (n, r, cx, cy, rot) => { const a = []; for (let i = 0; i < n; i++) { const t = (rot || 0) + i * Math.PI * 2 / n - Math.PI / 2; a.push([cx + Math.cos(t) * r, cy + Math.sin(t) * r]); } return a; };

/* ---------- 第 1、2 章：手繪圖形 ---------- */
const FIG = {
  // 第一章：簡單形狀
  tri: ['三角形', 'a2,0 b4,3.4 c0,3.4', 'a-b-c-a'],
  square: ['正方形', 'a0,0 b3,0 c3,3 d0,3', 'a-b-c-d-a'],
  flag: ['小旗子', 'p0,6 q0,2.4 r0,0 f3.4,1.1', 'p-q-r-f-q'],
  icecream: ['冰淇淋', 'a0,2.2 b3.2,2.2 t1.6,6', 'a-b-t-a a-b~.42'],
  pent: ['五角星', '', ''],
  heart: ['愛心', 'l0,1.9 m3,1.4 r6,1.9 b3,6', 'l-m~.33-r~.33-b~.1-l~.1 m-b'],
  arrow: ['箭頭', 's0,2 m3.6,2 u3.6,0.3 t6.2,2 v3.6,3.7', 's-m-u-t-v-m'],
  fish1: ['小魚', 'n0,2 t4.2,2 u6.2,0.5 v6.2,3.5', 'n-t~.3 n-t~-.3 t-u-v-t'],
  umbrella: ['雨傘', 'a0,3 c3,3 e6,3 h3,6.4 k1.8,6.4', 'a-e~.42 a-c~.14-e~.14 c-h-k~.5'],
  bowtie: ['蝴蝶結', 'a0,0 b0,3 c2,1.5 d4,0 e4,3', 'a-b-c-a c-d-e-c'],
  house1: ['小房子', 'a0,2.6 b4,2.6 c4,6 d0,6 r2,0', 'a-r-b-c-d-a a-b'],
  envelope: ['信封', 'a0,0 b4.4,0 c4.4,3 d0,3 m2.2,1.8', 'a-b-c-d-a a-m-b'],
  diamond: ['鑽石', 'a1.2,0 b3.2,0 c4.4,1.3 d0,1.3 p2.2,4.4', 'a-b-c-p-d-a d-c'],
  cup: ['杯子', 'a0,0 b3,0 h3,0.9 k3,2.6 c3,3.6 d0,3.6', 'a-b-h-k-c-d-a h-k~.7'],
  sail: ['帆船', 'a0,4 m3,4 b6,4 c5,5.2 d1,5.2 p3,0', 'a-m-b-c-d-a m-p-b~.12'],
  kite: ['風箏', 't2,0 l0,2 r4,2 b2,5 q3.1,6.4 z2.2,7.8', 't-l-b-r-t t-b b-q~-.3-z~.3'],
  apple: ['蘋果', 't3,1.7 l0.3,3.2 b3,6.4 r5.7,3.2 s3.4,0 f5.2,0.2', 't-l~-.22-b~-.25-r~-.25-t~-.22 t-s s-f~.3 s-f~-.3'],
  mountain: ['雪山', 'a0,4.4 p2,1.4 v3,2.6 s3.9,1 z4.6,1.7 w5.4,1.6 q4.5,0 b7,4.4', 'a-p-v-s-q-w-b-a s-z-w'],
  crown: ['皇冠', 'a0,4 s0,3 p0,0.4 v1.5,2.2 q3,0 w4.5,2.2 r6,0.4 t6,3 b6,4', 'a-s-p-v-q-w-r-t-b-a s-t'],
  xtree: ['聖誕樹', 't3,0 a1.4,2 a2.1,2 c0,4.2 e2.5,4.2 g2.5,5.6 h3.5,5.6 f3.5,4.2 d6,4.2 b3.9,2 b4.6,2', ''],
  // 第二章：圖畫
  house: ['煙囪小屋', 'r3,0 k3.9,1.2 k1,3.9,0.2 k2,4.6,0.2 k3,4.6,2.13 b6,4 c6,8 f3.8,8 h3.8,5.6 g2.2,5.6 e2.2,8 d0,8 a0,4',

}

/* ---------- 標題畫面：自動示範一筆畫 ---------- */
let demo = null;
const DEMO_FIGS = ['star', 'house', 'fish', 'rabbit', 'butterfly', 'flower', 'cat'];
function startDemo() {
  const f = FIG[DEMO_FIGS[Math.floor(Math.random() * DEMO_FIGS.length)]];
  const b = new Board({ name: f.name, P: f.P, E: f.E });
  const sol = solveGraph(b.lv, null, null, { rng: mulberry(Math.random() * 1e9) });
  demo = { b, sol, k: -1, t: 0, phase: 0, fade: 0 };
  layoutDemo();
}
function stopDemo() { demo = null; }
function layoutDemo() {
  const r = $('tSpace').getBoundingClientRect(), c = cv.getBoundingClientRect();
  demo.b.layout(r.left - c.left, r.top - c.top, r.width, Math.max(80, r.height));
}
function updDemo(dt) {
  const d = demo; if (!d || !d.sol) return;
  d.t += dt;
  if (d.phase === 0) { d.fade = Math.min(1, d.fade + dt * 2); if (d.t > 0.8) { d.phase = 1; d.t = 0; d.b.cur = d.sol.start; } }
  else if (d.phase === 1) {
    const per = 0.42;
    while (d.t > per && d.k + 1 < d.sol.steps.length) {
      d.t -= per; d.k++;
      const s = d.sol.steps[d.k]; d.b.commit(s.e, s.from);
      spark(d.b.vx[s.to], d.b.vy[s.to], 5, 100, d.b.vr * 0.8);
      if (d.k + 1 === d.sol.steps.length) { d.phase = 2; d.t = 0; for (let i = 0; i < d.b.vx.length; i++) spark(d.b.vx[i], d.b.vy[i], 4, 160, d.b.vr); }
    }
  } else if (d.phase === 2) { if (d.t > 2) { d.fade -= dt * 1.5; if (d.fade <= 0) startDemo(); } }
}
function drawDemo() {
  const d = demo; if (!d) return;
  const b = d.b;
  b.draw({ alpha: d.fade, glowBoost: d.phase === 2 ? 0.5 + 0.5 * Math.sin(d.t * 4) : 0 });
  if (d.phase === 1 && d.k + 1 < d.sol.steps.length) {
    const s = d.sol.steps[d.k + 1], ed = b.ed[s.e], t = Math.min(1, d.t / 0.42);
    const e = b.lv.E[s.e];
    ctx.save(); ctx.globalAlpha = d.fade; ctx.lineCap = 'round';
    ctx.beginPath(); polyAdd(ctx, ed, s.from, t, e.cnt === 2 ? (s.k === 0 ? -1 : 1) : 0);
    ctx.strokeStyle = theme.ink; ctx.lineWidth = b.lw * 1.05; ctx.stroke();
    const pt = pointAt(ed, s.from === ed.a ? t : 1 - t);
    ctx.drawImage(glowSpr, pt.x - b.lw * 4, pt.y - b.lw * 4, b.lw * 8, b.lw * 8);
    ctx.restore();
  }
  b.drawDots(d.fade, d.phase === 1);
}

/* ---------- 主迴圈 ---------- */
let lastT = performance.now(), hudT = 0;
function frame(now) {
  requestAnimationFrame(frame);
  let dt = (now - lastT) / 1000; lastT = now;
  if (dt > 0.05) dt = 0.05; if (dt < 0) dt = 0;
  if (needLayout) layout();
  time += dt;
  Music.update(dt);
  if (scene === 'play' && !S.paused) {
    if (S.started && !S.done) S.elapsed += dt;
    if (S.done) { S.winT += dt; if (S.winT > 1.25 && !S.resultShown) showResult(); }
    hudT += dt; if (hudT > 0.25) { hudT = 0; updateHud(); }
    if (S.dragging && B.cur >= 0) { S.trailT += dt; if (S.trailT > 0.05) { S.trailT = 0; spark(S.fx, S.fy, 1, 30, B.vr * 0.6); } }
  }
  if (S.ghostT > 0) S.ghostT = Math.max(0, S.ghostT - dt * 2.2);
  if (S.wrongT > 0) S.wrongT = Math.max(0, S.wrongT - dt);
  if (S.shakeT > 0) S.shakeT = Math.max(0, S.shakeT - dt);
  if (scene === 'title') updDemo(dt);
  updParts(dt);
  render(dt);
}
function render(dt) {
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.drawImage(bgCv, 0, 0, W, H);
  drawMotes(dt);
  if (scene === 'title') drawDemo();
  else if (scene === 'play' && B) drawPlay();
  drawParts();
}
function drawPlay() {
  let sx = 0, sy = 0;
  if (S.shakeT > 0) { const k = S.shakeT * 14; sx = (Math.random() * 2 - 1) * k; sy = (Math.random() * 2 - 1) * k; }
  ctx.save(); ctx.translate(sx, sy);
  const winGlow = S.done ? Math.max(0, 1 - Math.abs(S.winT - 0.35) * 1.6) : 0;
  // 完成時的光暈
  if (S.done) {
    const p = Math.min(1, S.winT / 1.1), r = B.span * (0.3 + p * 1.1);
    ctx.globalAlpha = (1 - p) * 0.55;
    ctx.drawImage(glowSpr, B.cx - r, B.cy - r, r * 2, r * 2);
    ctx.globalAlpha = 1;
    ctx.strokeStyle = hexA(theme.ink, (1 - p) * 0.8); ctx.lineWidth = 3 + (1 - p) * 6;
    ctx.beginPath(); ctx.arc(B.cx, B.cy, B.span * (0.2 + p * 0.9), 0, TAU); ctx.stroke();
  }
  if (S.ghost && S.ghostT > 0) {
    ctx.save(); ctx.globalAlpha = S.ghostT * 0.8; ctx.lineCap = ctx.lineJoin = 'round';
    ctx.strokeStyle = theme.ink; ctx.lineWidth = B.lw * (1 + (1 - S.ghostT) * 1.5); ctx.stroke(S.ghost);
    ctx.restore();
  }
  B.draw({ glowBoost: winGlow });
  // 提示：下一條線（流動的虛線）
  const hint = S.hint;
  if (hint && hint.type === 'edge' && B.cur === hint.from && B.canGo(hint.e, hint.from)) {
    const e = B.lv.E[hint.e];
    ctx.save(); ctx.lineCap = 'round';
    ctx.setLineDash([B.lw * 0.1, B.lw * 2.2]); ctx.lineDashOffset = -time * 40;
    ctx.beginPath(); polyAdd(ctx, B.ed[hint.e], hint.from, 1, e.cnt === 2 ? (e.cnt - B.rem[hint.e] === 0 ? -1 : 1) : 0);
    ctx.strokeStyle = '#fff'; ctx.lineWidth = B.lw * 1.3; ctx.globalAlpha = 0.6 + 0.4 * Math.sin(time * 6); ctx.stroke();
    ctx.restore();
  }
  // 拖曳中的墨線
  if (S.dragging && B.cur >= 0 && !S.done) {
    ctx.save(); ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    if (S.disp && B.canGo(S.disp.e, B.cur)) {
      const e = B.lv.E[S.disp.e], side = e.cnt === 2 ? (e.cnt - B.rem[S.disp.e] === 0 ? -1 : 1) : 0;
      ctx.beginPath(); polyAdd(ctx, B.ed[S.disp.e], B.cur, clamp(S.disp.t, 0, 1), side);
      ctx.strokeStyle = hexA(theme.glow, 0.25); ctx.lineWidth = B.lw * 3.2; ctx.stroke();
      ctx.strokeStyle = theme.ink; ctx.lineWidth = B.lw * 1.05; ctx.stroke();
      ctx.strokeStyle = 'rgba(255,255,255,0.75)'; ctx.lineWidth = B.lw * 0.36; ctx.stroke();
    } else {
      ctx.setLineDash([2, B.lw * 1.4]);
      ctx.beginPath(); ctx.moveTo(B.vx[B.cur], B.vy[B.cur]); ctx.lineTo(S.fx, S.fy);
      ctx.strokeStyle = hexA(theme.ink, 0.6); ctx.lineWidth = B.lw * 0.6; ctx.stroke();
    }
    ctx.restore();
    const g = B.lw * 4.2;
    ctx.globalAlpha = 0.85; ctx.drawImage(glowSpr, S.fx - g, S.fy - g, g * 2, g * 2); ctx.globalAlpha = 1;
  }
  B.drawDots(1, true);
  // 提示：起點
  if (hint && hint.type === 'start' && B.cur < 0) {
    const x = B.vx[hint.v], y = B.vy[hint.v], p = (time * 1.1) % 1;
    ctx.strokeStyle = 'rgba(255,255,255,' + (1 - p) + ')'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(x, y, B.vr * (1.4 + p * 2.6), 0, TAU); ctx.stroke();
    ctx.beginPath(); ctx.arc(x, y, B.vr * (1.4 + ((p + 0.5) % 1) * 2.6), 0, TAU); ctx.globalAlpha = 1 - (p + 0.5) % 1; ctx.stroke(); ctx.globalAlpha = 1;
    drawFinger(x + B.vr * 0.6, y + B.vr * 0.6 + Math.sin(time * 5) * 4);
    if (hint.next != null && !hint.free) {
      const e = B.lv.E[hint.next];
      ctx.save(); ctx.setLineDash([B.lw * 0.1, B.lw * 2.2]); ctx.lineDashOffset = -time * 40; ctx.lineCap = 'round';
      ctx.beginPath(); polyAdd(ctx, B.ed[hint.next], hint.v, 1, e.cnt === 2 ? -1 : 0);
      ctx.strokeStyle = 'rgba(255,255,255,0.7)'; ctx.lineWidth = B.lw * 1.2; ctx.stroke(); ctx.restore();
    }
  }
  // 鍵盤游標
  if (S.kb >= 0 && B.cur < 0) {
    ctx.strokeStyle = theme.ink; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(B.vx[S.kb], B.vy[S.kb], B.vr * 2 + Math.sin(time * 6) * 2, 0, TAU); ctx.stroke();
  }
  // 錯誤閃爍
  if (S.wrongT > 0) {
    ctx.strokeStyle = 'rgba(255,120,120,' + (S.wrongT / 0.6) + ')'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(S.wrongX, S.wrongY, B.vr * (2.6 - S.wrongT * 1.5), 0, TAU); ctx.stroke();
  }
  ctx.restore();
}
function drawFinger(x, y) {
  ctx.save(); ctx.translate(x, y); ctx.rotate(-0.5);
  const s = clamp(B.vr * 2.2, 14, 24);
  ctx.fillStyle = 'rgba(255,255,255,0.95)'; ctx.strokeStyle = 'rgba(60,60,90,0.5)'; ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.moveTo(-s * 0.18, 0); ctx.lineTo(-s * 0.18, s * 0.9); ctx.quadraticCurveTo(-s * 0.55, s * 0.95, -s * 0.5, s * 1.3);
  ctx.lineTo(-s * 0.3, s * 2); ctx.lineTo(s * 0.5, s * 2); ctx.quadraticCurveTo(s * 0.62, s * 1.4, s * 0.55, s * 0.95);
  ctx.lineTo(s * 0.18, s * 0.8); ctx.lineTo(s * 0.18, 0); ctx.arc(0, 0, s * 0.18, 0, Math.PI, true);
  ctx.closePath(); ctx.fill(); ctx.stroke();
  ctx.restore();
}

/* ---------- 測試掛鉤 ---------- */
window.__os = {
  get levels() { return LEVELS.length; },
  verify: VERIFY,
  verifyAll() {
    const fails = [];
    LEVELS.forEach((lv, i) => { const s = solveGraph(lv, null, null, { budget: 400000 }); if (!s || !checkPath(lv, s)) fails.push(i); });
    for (let d = 0; d < 30; d++) { const dl = buildDaily(20260101 + d * 37, LEVELS); const s = solveGraph(dl, null, null, {}); if (!s || !checkPath(dl, s)) fails.push('daily' + d); }
    return { ok: !fails.length, fails, count: LEVELS.length };
  },
  info(i) { const l = LEVELS[i]; return { name: l.name, ch: l.ch, num: l.num, V: l.P.length, E: l.E.length, trav: l.trav, arrows: l.E.filter(e => e.dir).length, doubles: l.E.filter(e => e.cnt === 2).length }; },
  start(i) { startLevel(i); return this.state(); },
  daily() { startLevel(0, true); return this.state(); },
  solve(i) { const lv = i == null ? LV : LEVELS[i]; const s = solveGraph(lv, null, null, {}); return s ? [s.start].concat(s.steps.map(x => x.to)) : null; },
  solveSteps(i) { const lv = i == null ? LV : LEVELS[i]; const s = solveGraph(lv, null, null, {}); return s ? s.steps.map(x => ({ e: x.e, from: x.from, to: x.to })) : null; },
  traceEdge(to, e) {
    if (scene !== 'play' || S.done) return false;
    if (B.cur < 0) return tryStart(to);
    const cur = B.cur;
    let pick = -1;
    if (e != null) { if (B.canGo(e, cur) && B.other(e, cur) === to) pick = e; }
    else for (const i of B.adj[cur]) if (B.canGo(i, cur) && B.other(i, cur) === to) { pick = i; break; }
    if (pick < 0) return false;
    doCommit(pick, cur); return true;
  },
  vertexScreen(i) { const r = cv.getBoundingClientRect(); return { x: r.left + B.vx[i] * r.width / W, y: r.top + B.vy[i] * r.height / H }; },
  edgePoint(e, t) { const p = pointAt(B.ed[e], t), r = cv.getBoundingClientRect(); return { x: r.left + p.x * r.width / W, y: r.top + p.y * r.height / H }; },
  state() {
    return { scene, level: levelIdx, name: LV && LV.name, daily: !!(LV && LV.daily), cur: B ? B.cur : -1, path: B ? B.steps.map(s => s.to) : [], steps: B ? B.steps.length : 0,
      left: B ? B.left : 0, done: S.done, resultShown: S.resultShown, hintsUsed: S.hintsUsed, hints: hintState().n, keep: KEEP, paused: S.paused,
      stars: STARS.slice(), elapsed: S.elapsed, hint: S.hint ? { type: S.hint.type, v: S.hint.v, e: S.hint.e } : null, snapR: B ? B.snapR : 0 };
  },
  log: LOG,
  setKeep, undo: undoBtn, restart: restartBtn, hint: hintBtn, goMap, goTitle,
  unlockAll() { for (let i = 0; i < LEVELS.length; i++) if (!STARS[i]) STARS[i] = 1; Save.set('stars', STARS); },
  setHints(n) { Save.set('hints', { n, t: Date.now() }); updateHud(true); }
};
function checkPath(lv, s) {
  const rem = lv.E.map(e => e.cnt); let cur = s.start;
  for (const st of s.steps) {
    const e = lv.E[st.e];
    if (st.from !== cur || rem[st.e] <= 0) return false;
    if (e.dir && e.a !== cur) return false;
    if (!((e.a === cur && e.b === st.to) || (e.b === cur && e.a === st.to))) return false;
    rem[st.e]--; cur = st.to;
  }
  return rem.every(r => r === 0);
}

layout();
goTitle();
requestAnimationFrame(frame);
</script>
