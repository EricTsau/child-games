<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>七巧板</title>
<link rel="stylesheet" href="../../assets/common.css">
<style>
  html, body { height: 100%; overflow: hidden; background: #fdf1df; overscroll-behavior: none; }
  #game {
    position: fixed; inset: 0; display: block;
    width: 100vw; height: 100vh; height: 100dvh;
    touch-action: none; outline: none;
  }
</style>
</head>
<body>
<canvas id="game" aria-label="七巧板拼圖遊戲" tabindex="0"></canvas>
<script src="../../assets/common.js"></script>
<script src="../../assets/kg-music.js"></script>
<script>
'use strict';
/* =====================================================================
 * 七巧板：把七塊積木拼成剪影。拖曳移動、點一下旋轉 45°、
 * 平行四邊形點兩下（或按翻面鈕）翻面。
 * ===================================================================== */
const SLUG = 'tangram';
const cv = document.getElementById('game');
const ctx = cv.getContext('2d');
const FONT = '"Baloo 2","PingFang TC","Noto Sans TC","Microsoft JhengHei","Heiti TC",system-ui,sans-serif';
let W = 0, H = 0, dpr = 1, U = 1, time = 0;

/* ---------- 數學與緩動 ---------- */
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const TAU = Math.PI * 2;
const R2 = Math.SQRT1_2;
const Ease = {
  outCubic: t => 1 - Math.pow(1 - t, 3),
  inOutSine: t => -(Math.cos(Math.PI * t) - 1) / 2,
  outBack: t => { const c = 1.70158, c3 = c + 1; return 1 + c3 * Math.pow(t - 1, 3) + c * Math.pow(t - 1, 2); },
  outElastic: t => (t === 0 || t === 1) ? t : Math.pow(2, -10 * t) * Math.sin((t * 10 - 0.75) * (TAU / 3)) + 1
};
function smooth(t) { t = clamp(t, 0, 1); return t * t * (3 - 2 * t); }

/* ---------- 存檔 ---------- */
const Save = {
  get(k, d) { return KG.store.get(SLUG + ':' + k, d); },
  set(k, v) { KG.store.set(SLUG + ':' + k, v); }
};
let sfxOn = Save.get('sfx', true) !== false;
let skin = Save.get('skin', 'candy') === 'wood' ? 'wood' : 'candy';

/* ---------- 繪圖小工具 ---------- */
function circ(x, y, r) { ctx.moveTo(x + r, y); ctx.arc(x, y, r, 0, TAU); }
function rr(x, y, w, h, r) {
  r = Math.max(0, Math.min(r, w / 2, h / 2));
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}
function starPath(x, y, R, r, rot) {
  ctx.beginPath();
  for (let i = 0; i < 10; i++) {
    const a = (rot || 0) + i * Math.PI / 5 - Math.PI / 2, rad = i % 2 ? r : R;
    ctx.lineTo(x + Math.cos(a) * rad, y + Math.sin(a) * rad);
  }
  ctx.closePath();
}
function shade(hex, amt) {
  const n = parseInt(hex.slice(1), 16);
  const f = v => clamp(v + amt, 0, 255);
  return 'rgb(' + f(n >> 16) + ',' + f((n >> 8) & 255) + ',' + f(n & 255) + ')';
}
function rgba(hex, a) {
  const n = parseInt(hex.slice(1), 16);
  return 'rgba(' + (n >> 16) + ',' + ((n >> 8) & 255) + ',' + (n & 255) + ',' + a + ')';
}
function glossyStar(x, y, R, on, rot) {
  ctx.save();
  ctx.lineJoin = 'round';
  if (on) {
    ctx.fillStyle = 'rgba(160,90,0,0.25)'; starPath(x, y + R * 0.12, R, R * 0.5, rot); ctx.fill();
    const g = ctx.createRadialGradient(x - R * 0.3, y - R * 0.4, R * 0.1, x, y, R * 1.1);
    g.addColorStop(0, '#fffbd0'); g.addColorStop(0.45, '#ffd93d'); g.addColorStop(1, '#f39a0c');
    ctx.fillStyle = g; ctx.strokeStyle = '#c9700a'; ctx.lineWidth = Math.max(1.5, R * 0.12);
    starPath(x, y, R, R * 0.5, rot); ctx.fill(); ctx.stroke();
    ctx.fillStyle = 'rgba(255,255,255,0.75)';
    ctx.beginPath(); ctx.ellipse(x - R * 0.25, y - R * 0.3, R * 0.22, R * 0.12, -0.6, 0, TAU); ctx.fill();
  } else {
    ctx.fillStyle = 'rgba(110,80,60,0.18)'; ctx.strokeStyle = 'rgba(110,80,60,0.32)'; ctx.lineWidth = Math.max(1.5, R * 0.1);
    starPath(x, y, R, R * 0.5, rot); ctx.fill(); ctx.stroke();
  }
  ctx.restore();
}
/** 有外框與陰影的字 */
function txt(s, x, y, size, fill, o) {
  o = o || {};
  ctx.save();
  ctx.font = (o.weight || '900') + ' ' + size + 'px ' + FONT;
  ctx.textAlign = o.align || 'center';
  ctx.textBaseline = o.base || 'middle';
  ctx.lineJoin = 'round';
  if (o.shadow !== false) {
    ctx.fillStyle = o.shadow || 'rgba(70,40,20,0.25)';
    if (o.stroke) { ctx.strokeStyle = ctx.fillStyle; ctx.lineWidth = o.sw || size * 0.22; ctx.strokeText(s, x, y + size * 0.09); }
    ctx.fillText(s, x, y + size * 0.09);
  }
  if (o.stroke) { ctx.strokeStyle = o.stroke; ctx.lineWidth = o.sw || size * 0.22; ctx.strokeText(s, x, y); }
  ctx.fillStyle = fill; ctx.fillText(s, x, y);
  ctx.restore();
}
function fitSize(s, size, maxW) {
  ctx.font = '900 ' + size + 'px ' + FONT;
  const w = ctx.measureText(s).width;
  return w > maxW ? size * maxW / w : size;
}

/* ---------- 粒子（物件池，最多 MAXP 個） ---------- */
const MAXP = KG.lowEnd ? 110 : 180;
const parts = [];
for (let i = 0; i < MAXP; i++) parts.push({ on: false });
let partCursor = 0;
function spawn(o) {
  let p = null;
  for (let k = 0; k < MAXP; k++) { const q = parts[(partCursor + k) % MAXP]; if (!q.on) { p = q; partCursor = (partCursor + k + 1) % MAXP; break; } }
  if (!p) { p = parts[partCursor]; partCursor = (partCursor + 1) % MAXP; }
  p.on = true; p.x = o.x; p.y = o.y; p.vx = o.vx || 0; p.vy = o.vy || 0; p.g = o.g == null ? 300 : o.g;
  p.life = o.life || 0.8; p.max = p.life; p.size = o.size || 6; p.color = o.color || '#fff';
  p.shape = o.shape || 'sparkle'; p.rot = Math.random() * TAU; p.vr = (Math.random() - 0.5) * 6; p.drag = o.drag == null ? 0.96 : o.drag;
  return p;
}
function burst(x, y, o) {
  o = o || {};
  const n = o.n || 14, cols = o.colors || ['#ffe066', '#ff8fb1', '#7bd88f', '#6cc4ff', '#ffffff'];
  for (let i = 0; i < n; i++) {
    const a = o.dir != null ? o.dir + (Math.random() - 0.5) * (o.spread || 1.2) : Math.random() * TAU;
    const sp = (o.speed || 200) * (0.35 + Math.random() * 0.8);
    spawn({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - (o.up || 0), life: (o.life || 0.8) * (0.7 + Math.random() * 0.5),
      size: (o.size || 6) * (0.6 + Math.random() * 0.7), color: cols[i % cols.length], shape: o.shape || 'sparkle', g: o.g, drag: o.drag });
  }
}
function ring(x, y, color, r, life) { const p = spawn({ x, y, life: life || 0.5, size: r || 40, color, shape: 'ring', g: 0 }); p.vr = 0; }
function updateParts(dt) {
  for (const p of parts) {
    if (!p.on) continue;
    p.life -= dt; if (p.life <= 0) { p.on = false; continue; }
    p.vy += p.g * dt;
    const d = Math.pow(p.drag, dt * 60);
    p.vx *= d; p.vy *= d; p.x += p.vx * dt; p.y += p.vy * dt; p.rot += p.vr * dt;
  }
}
function drawParts() {
  for (const p of parts) {
    if (!p.on) continue;
    const a = clamp(p.life / p.max, 0, 1), s = p.size;
    ctx.globalAlpha = Math.min(1, a * 1.6);
    ctx.fillStyle = p.color;
    if (p.shape === 'ring') {
      ctx.strokeStyle = p.color; ctx.lineWidth = 5 * a + 1; ctx.beginPath(); circ(p.x, p.y, s * (0.3 + (1 - a))); ctx.stroke();
    } else if (p.shape === 'dot') {
      ctx.beginPath(); circ(p.x, p.y, s * (0.4 + a * 0.6)); ctx.fill();
    } else if (p.shape === 'star') {
      starPath(p.x, p.y, s, s * 0.45, p.rot); ctx.fill();
    } else {
      ctx.beginPath();
      ctx.moveTo(p.x, p.y - s); ctx.quadraticCurveTo(p.x, p.y, p.x + s, p.y);
      ctx.quadraticCurveTo(p.x, p.y, p.x, p.y + s); ctx.quadraticCurveTo(p.x, p.y, p.x - s, p.y);
      ctx.quadraticCurveTo(p.x, p.y, p.x, p.y - s); ctx.fill();
    }
  }
  ctx.globalAlpha = 1;
}

/* ---------- 畫面震動 ---------- */
let shakeT = 0, shakeAmt = 0;
function shake(amt, dur) { shakeAmt = Math.max(shakeT > 0 ? shakeAmt : 0, amt); shakeT = Math.max(shakeT, dur || 0.25); }
function shakeOffset() {
  if (shakeT <= 0) return [0, 0];
  const k = shakeAmt * Math.min(1, shakeT * 5);
  return [(Math.random() * 2 - 1) * k, (Math.random() * 2 - 1) * k];
}

/* ---------- 按鈕（每格重新登記） ---------- */
let btnReg = [], pressed = null;
const BTN = {
  green: ['#a6f59c', '#3fbf5c', '#24873e'], pink: ['#ffb3cc', '#f45f93', '#b8366a'], blue: ['#a8e0ff', '#3c9ff0', '#22659e'],
  yellow: ['#fff09a', '#f8b921', '#b57c0b'], purple: ['#dcc6ff', '#9b6ff2', '#5f3fae'], orange: ['#ffd0a0', '#ff8a3d', '#c1561a'],
  red: ['#ffb0a8', '#ef5a4c', '#a8322a'], teal: ['#a8f0e6', '#22b8a6', '#167a6e'],
  white: ['#ffffff', '#f6ece0', '#c9ad92'], wood: ['#f7d7a8', '#d9a066', '#9a6331']
};
function drawIcon(name, x, y, s, col) {
  ctx.save(); ctx.translate(x, y);
  ctx.fillStyle = col || '#fff'; ctx.strokeStyle = col || '#fff';
  ctx.lineWidth = s * 0.17; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  if (name === 'play') { ctx.beginPath(); ctx.moveTo(-s * 0.32, -s * 0.45); ctx.lineTo(s * 0.48, 0); ctx.lineTo(-s * 0.32, s * 0.45); ctx.closePath(); ctx.fill(); ctx.stroke(); }
  else if (name === 'next') { for (const dx of [-0.28, 0.22]) { ctx.beginPath(); ctx.moveTo(s * (dx - 0.18), -s * 0.38); ctx.lineTo(s * (dx + 0.22), 0); ctx.lineTo(s * (dx - 0.18), s * 0.38); ctx.stroke(); } }
  else if (name === 'replay' || name === 'rotate') {
    ctx.lineWidth = s * 0.15;
    ctx.beginPath(); ctx.arc(0, 0, s * 0.38, -Math.PI * 0.25, Math.PI * 1.35); ctx.stroke();
    const a = -Math.PI * 0.25, ex = Math.cos(a) * s * 0.38, ey = Math.sin(a) * s * 0.38;
    ctx.beginPath(); ctx.moveTo(ex + s * 0.22, ey - s * 0.02); ctx.lineTo(ex - s * 0.04, ey + s * 0.24); ctx.lineTo(ex - s * 0.2, ey - s * 0.16); ctx.closePath(); ctx.fill();
  }
  else if (name === 'flip') {
    ctx.lineWidth = s * 0.12;
    ctx.beginPath(); ctx.moveTo(0, -s * 0.48); ctx.lineTo(0, s * 0.48); ctx.setLineDash([s * 0.12, s * 0.1]); ctx.stroke(); ctx.setLineDash([]);
    ctx.beginPath(); ctx.moveTo(-s * 0.1, -s * 0.32); ctx.lineTo(-s * 0.5, s * 0.32); ctx.lineTo(-s * 0.1, s * 0.32); ctx.closePath(); ctx.fill();
    ctx.globalAlpha = 0.6; ctx.beginPath(); ctx.moveTo(s * 0.1, -s * 0.32); ctx.lineTo(s * 0.5, s * 0.32); ctx.lineTo(s * 0.1, s * 0.32); ctx.closePath(); ctx.stroke();
  }
  else if (name === 'bulb') {
    ctx.beginPath(); ctx.arc(0, -s * 0.12, s * 0.3, Math.PI * 0.8, Math.PI * 2.2); ctx.lineTo(s * 0.13, s * 0.25); ctx.lineTo(-s * 0.13, s * 0.25); ctx.closePath(); ctx.fill();
    ctx.lineWidth = s * 0.09; ctx.beginPath(); ctx.moveTo(-s * 0.13, s * 0.35); ctx.lineTo(s * 0.13, s * 0.35); ctx.moveTo(-s * 0.09, s * 0.46); ctx.lineTo(s * 0.09, s * 0.46); ctx.stroke();
  }
  else if (name === 'eye') {
    ctx.lineWidth = s * 0.1;
    ctx.beginPath(); ctx.moveTo(-s * 0.5, 0); ctx.quadraticCurveTo(0, -s * 0.45, s * 0.5, 0); ctx.quadraticCurveTo(0, s * 0.45, -s * 0.5, 0); ctx.stroke();
    ctx.beginPath(); circ(0, 0, s * 0.16); ctx.fill();
  }
  else if (name === 'menu') { for (let i = -1; i <= 1; i += 2) for (let j = -1; j <= 1; j += 2) { rr(i * s * 0.24 - s * 0.16, j * s * 0.24 - s * 0.16, s * 0.32, s * 0.32, s * 0.08); ctx.fill(); } }
  else if (name === 'pause') { rr(-s * 0.32, -s * 0.38, s * 0.22, s * 0.76, s * 0.06); ctx.fill(); rr(s * 0.1, -s * 0.38, s * 0.22, s * 0.76, s * 0.06); ctx.fill(); }
  else if (name === 'back') { ctx.lineWidth = s * 0.18; ctx.beginPath(); ctx.moveTo(s * 0.2, -s * 0.38); ctx.lineTo(-s * 0.2, 0); ctx.lineTo(s * 0.2, s * 0.38); ctx.stroke(); }
  else if (name === 'save') {
    rr(-s * 0.4, -s * 0.4, s * 0.8, s * 0.8, s * 0.1); ctx.fill();
    ctx.fillStyle = 'rgba(0,0,0,0.28)'; ctx.fillRect(-s * 0.24, -s * 0.4, s * 0.44, s * 0.26); ctx.fillRect(-s * 0.26, s * 0.06, s * 0.52, s * 0.3);
  }
  else if (name === 'trash') {
    ctx.fillRect(-s * 0.36, -s * 0.34, s * 0.72, s * 0.1); ctx.fillRect(-s * 0.1, -s * 0.44, s * 0.2, s * 0.1);
    ctx.beginPath(); ctx.moveTo(-s * 0.28, -s * 0.2); ctx.lineTo(s * 0.28, -s * 0.2); ctx.lineTo(s * 0.22, s * 0.44); ctx.lineTo(-s * 0.22, s * 0.44); ctx.closePath(); ctx.fill();
  }
  else if (name === 'x') { ctx.lineWidth = s * 0.2; ctx.beginPath(); ctx.moveTo(-s * 0.3, -s * 0.3); ctx.lineTo(s * 0.3, s * 0.3); ctx.moveTo(s * 0.3, -s * 0.3); ctx.lineTo(-s * 0.3, s * 0.3); ctx.stroke(); }
  else if (name === 'brush') {
    ctx.save(); ctx.rotate(-0.7); rr(-s * 0.08, -s * 0.5, s * 0.16, s * 0.55, s * 0.05); ctx.fill();
    ctx.beginPath(); ctx.moveTo(-s * 0.16, s * 0.08); ctx.lineTo(s * 0.16, s * 0.08); ctx.quadraticCurveTo(s * 0.18, s * 0.45, 0, s * 0.52); ctx.quadraticCurveTo(-s * 0.18, s * 0.45, -s * 0.16, s * 0.08); ctx.fill(); ctx.restore();
  }
  else if (name === 'gallery') { rr(-s * 0.45, -s * 0.36, s * 0.9, s * 0.72, s * 0.1); ctx.stroke(); ctx.beginPath(); ctx.moveTo(-s * 0.35, s * 0.26); ctx.lineTo(-s * 0.08, -s * 0.08); ctx.lineTo(s * 0.1, s * 0.12); ctx.lineTo(s * 0.22, 0); ctx.lineTo(s * 0.36, s * 0.26); ctx.closePath(); ctx.fill(); ctx.beginPath(); circ(s * 0.2, -s * 0.16, s * 0.08); ctx.fill(); }
  else if (name === 'lock') {
    ctx.lineWidth = s * 0.14; ctx.beginPath(); ctx.arc(0, -s * 0.12, s * 0.24, Math.PI, 0); ctx.stroke();
    rr(-s * 0.36, -s * 0.12, s * 0.72, s * 0.58, s * 0.12); ctx.fill();
  }
  ctx.restore();
}
/** 立體按鈕。opts: {label, icon, color, onClick, size, pulse, disabled, radius, badge} */
function button(id, x, y, w, h, opts) {
  btnReg.push({ id, x, y, w, h, onClick: opts.onClick, disabled: opts.disabled, sound: opts.sound });
  const pal = BTN[opts.color || 'green'];
  const isDown = pressed && pressed.id === id;
  let s = isDown ? 0.93 : 1;
  if (opts.pulse && !isDown) s *= 1 + Math.sin(time * 5) * 0.035;
  const lip = Math.max(3, h * 0.09);
  ctx.save();
  ctx.translate(x + w / 2, y + h / 2); ctx.scale(s, s);
  if (opts.disabled) ctx.globalAlpha = 0.5;
  const r = opts.radius == null ? h / 2 : opts.radius;
  const yo = isDown ? lip * 0.6 : 0;
  rr(-w / 2, -h / 2 + lip + 3, w, h, r); ctx.fillStyle = 'rgba(80,45,20,0.2)'; ctx.fill();
  rr(-w / 2, -h / 2 + lip, w, h, r); ctx.fillStyle = pal[2]; ctx.fill();
  rr(-w / 2, -h / 2 + yo, w, h, r);
  const g = ctx.createLinearGradient(0, -h / 2, 0, h / 2);
  g.addColorStop(0, pal[0]); g.addColorStop(0.55, pal[1]); g.addColorStop(1, shade(pal[1], -15));
  ctx.fillStyle = g; ctx.fill();
  ctx.strokeStyle = pal[2]; ctx.lineWidth = Math.max(2, h * 0.045); ctx.stroke();
  rr(-w / 2 + Math.min(h, w) * 0.2, -h / 2 + yo + h * 0.09, w - Math.min(h, w) * 0.4, h * 0.28, h * 0.14);
  ctx.fillStyle = 'rgba(255,255,255,0.42)'; ctx.fill();
  const fs = opts.size || h * 0.4;
  const tc = (opts.color === 'white') ? '#7a4f2c' : '#fff';
  if (opts.icon && opts.label) {
    ctx.font = '900 ' + fs + 'px ' + FONT;
    const tw = ctx.measureText(opts.label).width;
    const tot = fs * 1.15 + tw;
    drawIcon(opts.icon, -tot / 2 + fs * 0.45, yo, fs * 0.95, tc);
    txt(opts.label, -tot / 2 + fs * 1.15 + tw / 2, yo + 1, fs, tc, { stroke: pal[2], sw: fs * 0.18, shadow: false });
  } else if (opts.icon) drawIcon(opts.icon, 0, yo, fs * 1.15, tc);
  else if (opts.label != null) txt(opts.label, 0, yo + 1, fs, tc, { stroke: opts.color === 'white' ? null : pal[2], sw: fs * 0.18, shadow: false });
  if (opts.badge != null) {
    const bx = w / 2 - 4, by = -h / 2 + 4 + yo, br = Math.max(9, h * 0.2);
    ctx.fillStyle = '#ff5c7a'; ctx.strokeStyle = '#fff'; ctx.lineWidth = 2;
    ctx.beginPath(); circ(bx, by, br); ctx.fill(); ctx.stroke();
    txt(String(opts.badge), bx, by + 1, br * 1.2, '#fff', { shadow: false });
  }
  ctx.restore();
}
function hitBtn(x, y) {
  let best = null, bd = 1e9;
  for (let i = btnReg.length - 1; i >= 0; i--) {
    const b = btnReg[i];
    if (b.disabled) continue;
    if (x >= b.x && x <= b.x + b.w && y >= b.y && y <= b.y + b.h + 6) return b;
    // 寬鬆一點：靠近按鈕 10px 內也算
    const dx = Math.max(b.x - x, 0, x - b.x - b.w), dy = Math.max(b.y - y, 0, y - b.y - b.h - 6), d = Math.hypot(dx, dy);
    if (d < 10 && d < bd) { bd = d; best = b; }
  }
  return best;
}

/* ---------- 音樂（D 宮調五聲音階：D E F# A B） ---------- */
const PLAY_SONG = {
  bpm: 76, steps: 16, swing: 0.06,
  chords: ['Dsus2', 'Bm7', 'Esus4', 'Asus4', 'Dsus2', 'Bm7', 'Asus4', 'Dsus2'],
  layers: { zheng: false, rim: false },
  tracks: [
    { inst: 'pad', chord: 'hold', vol: 0.5 },
    { inst: 'sub', chord: 'R.......5.......', vol: 0.42 },
    { inst: 'flute', vol: 0.75, legato: 0.95, seq: [
      'A4 - B4 D5 E5 - - .', 'F#5 - E5 D5 B4 - - .', 'E5 - - D5 B4 A4 B4 .', 'A4 - - - - - . .',
      'D5 - E5 F#5 A5 - F#5 E5', 'D5 - B4 D5 E5 - - .', 'B4 - A4 B4 D5 - E5 -', 'D5 - - - - - . .'] },
    { inst: 'kalimba', vol: 0.55, seq: [
      '. . . . . . A5 F#5', '. . . . . . D5 E5', '. . . . . . . E5', '. . D5 E5 F#5 A5 F#5 E5',
      '', '. . . . . . A5 B5', '', '. . A5 F#5 E5 D5 B4 A4'] },
    { inst: 'pluck', arp: 'updown', rate: 2, oct: 4, span: 2, vol: 0.28, layer: 'zheng' },
    { inst: 'shaker', pat: '..o...o...o...o.', vol: 0.55 },
    { inst: 'rim', pat: ['....x.......o...', '....x.......x..o'], vol: 0.4, layer: 'rim' }
  ]
};
const MENU_SONG = {
  bpm: 92, steps: 16, swing: 0.1,
  chords: ['Dsus2', 'Asus4', 'Bm7', 'Esus4', 'Dsus2', 'Asus4', 'Bm7', 'Dsus2'],
  tracks: [
    { inst: 'pad', chord: 'hold', vol: 0.38 },
    { inst: 'sub', chord: 'R.......R...5...', vol: 0.45 },
    { inst: 'kalimba', vol: 0.95, seq: [

/* =====================================================================
 * 幾何：七塊積木（單位 = 小三角形的股長）
 *   L 大三角形×2、M 中三角形、S 小三角形×2、Q 正方形、P 平行四邊形
 *   每塊 = 基本形狀 → (翻面) → 旋轉 rot×45° → 平移到錨點 (x, y)
 * ===================================================================== */
const BASE = {
  L: [[0, 0], [2, 0], [0, 2]], M: [[0, 0], [1, 1], [-1, 1]], S: [[0, 0], [1, 0], [0, 1]],
  Q: [[0, 0], [1, 0], [1, 1], [0, 1]], P: [[0, 0], [1, 0], [2, 1], [1, 1]]
};
const AREA = { L: 2, M: 1, S: 0.5, Q: 1, P: 1 };
const COS8 = [], SIN8 = [];
for (let r = 0; r < 8; r++) { COS8.push(Math.round(Math.cos(r * Math.PI / 4) * 1e9) / 1e9); SIN8.push(Math.round(Math.sin(r * Math.PI / 4) * 1e9) / 1e9); }
function polyOf(t, rot, flip, x, y) {
  const c = COS8[rot & 7], s = SIN8[rot & 7];
  return BASE[t].map(v => { const vx = flip ? -v[0] : v[0], vy = v[1]; return [vx * c - vy * s + x, vx * s + vy * c + y]; });
}
function centroid(poly) { let x = 0, y = 0; for (const p of poly) { x += p[0]; y += p[1]; } return [x / poly.length, y / poly.length]; }
function bboxOf(polys) {
  let mx = 1e9, my = 1e9, Mx = -1e9, My = -1e9;
  for (const poly of polys) for (const p of poly) { mx = Math.min(mx, p[0]); my = Math.min(my, p[1]); Mx = Math.max(Mx, p[0]); My = Math.max(My, p[1]); }
  return { x: mx, y: my, w: Mx - mx, h: My - my };
}
/** 凸多邊形內部測試（頂點順序任意方向） */
function inConvex(px, py, poly) {
  let sign = 0;
  for (let i = 0, n = poly.length; i < n; i++) {
    const a = poly[i], b = poly[(i + 1) % n];
    const cr = (b[0] - a[0]) * (py - a[1]) - (b[1] - a[1]) * (px - a[0]);
    if (Math.abs(cr) < 1e-12) continue;
    const sg = cr > 0 ? 1 : -1;
    if (!sign) sign = sg; else if (sg !== sign) return false;
  }
  return true;
}
function distToSeg(px, py, a, b) {
  const dx = b[0] - a[0], dy = b[1] - a[1], L2 = dx * dx + dy * dy;
  let t = L2 ? ((px - a[0]) * dx + (py - a[1]) * dy) / L2 : 0; t = clamp(t, 0, 1);
  const qx = a[0] + dx * t, qy = a[1] + dy * t;
  return [Math.hypot(px - qx, py - qy), qx, qy];
}
function distToPoly(px, py, poly) {
  if (inConvex(px, py, poly)) return 0;
  let d = 1e9;
  for (let i = 0; i < poly.length; i++) d = Math.min(d, distToSeg(px, py, poly[i], poly[(i + 1) % poly.length])[0]);
  return d;
}
/** 兩個頂點集合是否相同（允許誤差） */
function sameVerts(a, b, eps) {
  if (a.length !== b.length) return false;
  for (const p of a) { let ok = false; for (const q of b) if (Math.abs(p[0] - q[0]) < eps && Math.abs(p[1] - q[1]) < eps) { ok = true; break; } if (!ok) return false; }
  return true;
}

const Lay = { u: 40, ox: 0, oy: 0, land: false, board: { x: 0, y: 0, w: 8, h: 8 }, tray: { x: 0, y: 0, w: 8, h: 4 }, sil: { x: 0, y: 0 }, tools: [], area: null };

/** 把 7 塊積木排進寬 tw 的收納盤，回傳每塊外框左上角與總高度 */
function packTray(pieces, tw) {
  const gap = 0.35;

  const pos = [];

    pos.push({ x, y, bb });
    x += bb.w + gap; rowH = Math.max(rowH, bb.h); maxW = Math.max(maxW, x - gap);

}

/* ---------- 判定：用高解析度點陣算覆蓋面積 ---------- */
const RES = 16;
const Cover = { mask: null, buf: null, w: 0, h: 0, x0: 0, y0: 0, silCount: 1 };
function buildMask(silPolys) {
  const bb = bboxOf(silPolys);
  Cover.x0 = bb.x - 1; Cover.y0 = bb.y - 1;
  Cover.w = Math.ceil((bb.w + 2) * RES); Cover.h = Math.ceil((bb.h + 2) * RES);
  Cover.mask = new Uint8Array(Cover.w * Cover.h); Cover.buf = new Uint8Array(Cover.w * Cover.h);
  let n = 0;
  for (const poly of silPolys) rasterize(poly, (k) => { if (!Cover.mask[k]) { Cover.mask[k] = 1; n++; } });
  Cover.silCount = Math.max(1, n);
}
/** 對多邊形外框內的每個取樣點呼叫 fn(index)，回傳落在範圍外的取樣點數 */
function rasterize(poly, fn) {
  const bb = bboxOf([poly]);
  const i0 = Math.floor((bb.x - Cover.x0) * RES), i1 = Math.ceil((bb.x + bb.w - Cover.x0) * RES);
  const j0 = Math.floor((bb.y - Cover.y0) * RES), j1 = Math.ceil((bb.y + bb.h - Cover.y0) * RES);
  let outside = 0;
  for (let j = j0; j < j1; j++) {
    const py = Cover.y0 + (j + 0.37) / RES;
    for (let i = i0; i < i1; i++) {
      const px = Cover.x0 + (i + 0.41) / RES;
      if (!inConvex(px, py, poly)) continue;
      if (i < 0 || j < 0 || i >= Cover.w || j >= Cover.h) { outside++; continue; }
      fn(j * Cover.w + i);
    }
  }

}
function coverage(pieces) {
  const buf = Cover.buf; buf.fill(0);

  for (const p of pieces) outside += rasterize(p.poly, (k) => { buf[k]++; });
  for (let k = 0; k < buf.length; k++) {
    const b = buf[k]; if (!b) continue;
    if (Cover.mask[k]) inside++; else out2++;
    if (b > 1) over += b - 1;
  }
  const sc = Cover.silCount;

/** 估算兩塊積木重疊的面積（單位²） */
function overlapArea(a, b) {

  const x0 = Math.max(ba.x, bb.x), x1 = Math.min(ba.x + ba.w, bb.x + bb.w), y0 = Math.max(ba.y, bb.y), y1 = Math.min(ba.y + ba.h, bb.y + bb.h);
  if (x1 - x0 < 0.02 || y1 - y0 < 0.02) return 0;
  const st = 1 / 12; let n = 0;
  for (let y = y0 + st * 0.43; y < y1; y += st) for (let x = x0 + st * 0.47; x < x1; x += st) if (inConvex(x, y, a.poly) && inConvex(x, y, b.poly)) n++;
  return n * st * st;
}

/* ---------- 吸附 ---------- */
/** 找出放下積木時最好的位移：剪影槽位 > 頂點對頂點 > 點到邊 > 格點 */
function findSnap(p, others, silVerts, silEdges, slots) {
  let best = null;
  const consider = (dx, dy, score, kind, slot) => { if (!best || score < best.score) best = { dx, dy, score, kind, slot }; };
  // 1. 剪影槽位（同形狀、同方向）
  if (slots) {
    slots.forEach((s, si) => {
      if (s.t !== p.t) return;
      const dx = s.cx - p.cx, dy = s.cy - p.cy, d = Math.hypot(dx, dy);
      if (d > 0.62) return;
      const moved = p.poly.map(v => [v[0] + dx, v[1] + dy]);
      if (!sameVerts(moved, s.poly, 0.06)) return;
      if (others.some(o => o.slot === si)) return;
      consider(dx, dy, d * 0.3 - 1, 'slot', si);
    });
    if (best) return best;
  }
  const vs = p.poly;
  const targets = silVerts.slice();
  others.forEach(o => o.poly.forEach(v => targets.push(v)));
  for (const v of vs) for (const t of targets) {
    const dx = t[0] - v[0], dy = t[1] - v[1], d = Math.hypot(dx, dy);
    if (d < 0.34) consider(dx, dy, d, 'vert');
  }
  if (best && best.score < 0.05) return best;
  const segs = silEdges.slice();
  others.forEach(o => { for (let i = 0; i < o.poly.length; i++) segs.push([o.poly[i], o.poly[(i + 1) % o.poly.length]]); });
  for (const v of vs) for (const sg of segs) {
    const r = distToSeg(v[0], v[1], sg[0], sg[1]);
    if (r[0] < 0.22) consider(r[1] - v[0], r[2] - v[1], r[0] * 1.35 + 0.02, 'edge');
  }
  for (const v of vs) {
    const lx = Math.round(v[0] * 2) / 2, ly = Math.round(v[1] * 2) / 2, d = Math.hypot(lx - v[0], ly - v[1]);
    if (d < 0.17) consider(lx - v[0], ly - v[1], d * 1.6 + 0.03, 'grid');
  }
  return best;
}

    p.rot = d.r0; p.flip = d.f0; p.x = d.x0; p.y = d.y0; updPiece(p);
    p.dx = ocx - p.cx; p.dy = ocy - p.cy; p.wig = 0.35; p.inTray = d.inTray0;
    sfx('tg_bump', { x: sx }); KG.vibrate(20);
    afterChange();
    return;
  }
  p.inTray = false;
  if (snap) {
    p.pop = 0.1;

    const [cx, cy] = toScreen(p.cx, p.cy);

  } else sfx('tg_place', { x: sx });

}
function relayoutHome(p, k) {
  const ocx = p.cx, ocy = p.cy;
  // 收納盤位置是依照目前方向排的；方向改了就用重心對齊
  const pose = Lay.trayPose[k];
  const tmp = polyOf(p.t, pose.rot, pose.flip, Lay.homes[k].x, Lay.homes[k].y), c = centroid(tmp);

function afterChange() { updateSlots(false); checkWin(); }
function tapPiece(p) {
  if (p.t === 'P') {
    const now = performance.now();
    if (G.pendTap && G.pendTap.p === p && now - G.pendTap.t < 320) { G.pendTap = null; doFlip(p); return; }
    G.pendTap = { p, t: now };

  }

}
function doRotate(p, dir) {

}
/** 收納盤裡的積木轉向後重新排好，避免疊在一起 */
function repackTray() {
  const pk = packTray(G.pieces, Lay.tray.w - 0.6);
  if (pk.w > Lay.tray.w - 0.4 || pk.h > Lay.tray.h - 0.25) return;
  const tx0 = Lay.tray.x + (Lay.tray.w - pk.w) / 2, ty0 = Lay.tray.y + (Lay.tray.h - pk.h) / 2;
  Lay.homes = pk.pos.map(q => ({ x: tx0 + q.x - q.bb.x, y: ty0 + q.y - q.bb.y }));
  Lay.trayPose = G.pieces.map(p => ({ rot: p.rot, flip: p.flip }));
  G.pieces.forEach((p, k) => { if (!p.inTray || (G.drag && G.drag.p === p)) return; const ox = p.cx, oy = p.cy; p.x = Lay.homes[k].x; p.y = Lay.homes[k].y; updPiece(p); p.dx += ox - p.cx; p.dy += oy - p.cy; });
}
function doFlip(p) {
  p = p || G.pieces.find(q => q.t === 'P');
  if (!p) return;
  flipPiece(p);
  const [sx] = toScreen(p.cx, p.cy);
  sfx('tg_flip', { x: sx });
  if (!p.inTray) settleAfterTurn(p); else { repackTray(); afterChange(); }
}
/** 轉完之後再吸附一次 */
function settleAfterTurn(p) {
  const others = G.pieces.filter(o => o !== p && !o.inTray);
  const snap = findSnap(p, others, G.mode === 'puzzle' ? G.silVerts : [], G.mode === 'puzzle' ? G.silEdges : [], G.mode === 'puzzle' ? G.slots : null);
  if (snap && snap.score < 0.2) { p.x += snap.dx; p.y += snap.dy; updPiece(p); p.dx -= snap.dx; p.dy -= snap.dy; if (snap.kind === 'slot') { p.pop = 0.08; sfx('tg_snap', { pitch: SNAP_PITCH[p.t] }); } }
  afterChange();
}
/* ---------- 自由創作：保存 ---------- */
function saveCreation() {
  const onb = G.pieces.filter(p => !p.inTray);
  if (onb.length < 7) { KG.toast('把七塊都放到板子上喔！'); sfx('tg_bump'); return; }
  for (let a = 0; a < 7; a++) for (let b = a + 1; b < 7; b++) if (overlapArea(G.pieces[a], G.pieces[b]) > 0.08) { KG.toast('有積木疊在一起了'); sfx('tg_bump'); return; }
  // 積木要連在一起（邊或角碰到）
  const touch = (a, b) => a.poly.some(v => distToPoly(v[0], v[1], b.poly) < 0.06) || b.poly.some(v => distToPoly(v[0], v[1], a.poly) < 0.06);
  const seen = new Set([0]), st = [0];
  while (st.length) { const a = st.pop(); for (let b = 0; b < 7; b++) if (!seen.has(b) && touch(G.pieces[a], G.pieces[b])) { seen.add(b); st.push(b); } }
  if (seen.size < 7) { KG.toast('讓積木們手牽手連在一起吧！'); sfx('tg_bump'); return; }
  const bb = bboxOf(G.pieces.map(p => p.poly));
  const sol = G.pieces.map(p => [p.t, p.rot, p.flip, +(p.x - bb.x).toFixed(4), +(p.y - bb.y).toFixed(4)]);
  const sig = JSON.stringify(sol);
  if (creations.some(c => JSON.stringify(c.sol) === sig)) { KG.toast('這個作品已經保存過了'); return; }
  creations.unshift({ id: Date.now().toString(36), sol });
  if (creations.length > 30) creations.length = 30;
  Save.set('creations', creations);
  G.saveT = 0; G.saveFlash = 1;
  jingle(JINGLE_SAVE); sfx('tg_chime', { pitch: 1.12 });
  G.pieces.forEach(p => { const [sx, sy] = toScreen(p.cx, p.cy); burst(sx, sy, { n: 8, speed: 180, g: 100, size: 6 }); p.pop = 0.12; });
  KG.toast('保存好了！到「我的作品」拼拼看');
}

const thumbCache = new Map();
function thumb(pz, size, col) {
  const key = pz.key + ':' + Math.round(size) + ':' + col + ':' + dpr;
  let t = thumbCache.get(key);
  if (t) return t;
  const c = makeCanvas(size * dpr, size * dpr), g = c.getContext('2d');
  g.setTransform(dpr, 0, 0, dpr, 0, 0);
  const s = Math.min((size * 0.86) / Math.max(pz.w, pz.h, 3), size * 0.3);
  const ox = (size - pz.w * s) / 2, oy = (size - pz.h * s) / 2;
  g.fillStyle = col; g.strokeStyle = col; g.lineWidth = 1.6; g.lineJoin = 'round';
  pz.sol.forEach(p => { polyPath(g, p.poly, ox, oy, s); g.fill(); g.stroke(); });
  thumbCache.set(key, c);
  return c;
}

function drawTitleDemo(cx, cy, size) {
  const D = titleDemo, pz = D.list[D.k % D.list.length];
  const u = size / Math.max(pz.w, pz.h, 4);
  const used = new Set();
  const cyc = 5.2, t = D.t % cyc;
  const k = t < 1.3 ? Ease.outBack(smooth(t / 1.3)) : t < 3.9 ? 1 : 1 - smooth((t - 3.9) / 1.2);
  D.pieces.forEach((p, i) => {
    const si = pz.sol.findIndex((s, j) => s.t === p.t && !used.has(j)); used.add(si);
    const s = pz.sol[si];
    p.rot = s.rot; p.flip = s.flip; p.x = s.x; p.y = s.y; updPiece(p);
    const tx = cx + (p.cx - pz.w / 2) * u, ty = cy + (p.cy - pz.h / 2) * u;
    const a = i / 7 * TAU + time * 0.4, rr2 = size * 0.62;
    const fx = cx + Math.cos(a) * rr2, fy = cy + Math.sin(a) * rr2 * 0.55;
    p.lift = 1 - k; p.angA = (1 - k) * (Math.sin(time + i) * 1.4 + i); p.pop = 0; p.flipA = 1; p.wig = 0; p.glow = 0;
    drawPiece(p, u, lerp(fx, tx, k), lerp(fy, ty, k));

function gridLayout(n, top, cardMinW, aspect) {
  const availW = W - 24, availH = H - top - 16;
  const geo = (cols) => {
    const cw = Math.min(190, (availW - (cols - 1) * 12) / cols), ch = cw * aspect;
    const rows = Math.ceil(n / cols);
    return { cols, cw, ch, x0: (W - (cols * cw + (cols - 1) * 12)) / 2, top, totalH: rows * ch + (rows - 1) * 12 };
  };
  let best = null;
  for (let cols = 2; cols <= Math.max(2, n); cols++) {
    const g = geo(cols);
    if (g.cw < cardMinW && best) break;
    best = g;
    if (g.totalH <= availH) break;
  }
  return best;
}

    if (d.moved) {
      const [wx, wy] = toWorld(clamp(x, 6, W - 6), clamp(y, 6, H - 6));
      const p = d.p;
      moveCentroidTo(p, wx - d.ox, wy - d.oy);
    }
  }
});
function endPointer(e, cancel) {
  activePointers.delete(e.pointerId);
  const [x, y] = evPos(e);
  if (scrollDrag && scrollDrag.pid === e.pointerId) {
    if (scrollDrag.moved) pressed = null;
    scrollDrag = null;
  }
  if (pressed && pressed.pid === e.pointerId) {
    const b = hitBtn(x, y), id = pressed.id;
    pressed = null;
    if (!cancel && b && b.id === id && b.onClick) { sfx(b.sound || 'ui'); b.onClick(); }
    return;
  }
  const d = G.drag;
  if (d && d.pid === e.pointerId) {
    G.drag = null;
    if (paused) return;
    const p = d.p;
    if (!d.moved && !cancel && performance.now() - d.t0 < 450) { tapPiece(p); return; }
    dropPiece(p, d);
  }
}
cv.addEventListener('pointerup', (e) => endPointer(e, false));
cv.addEventListener('pointercancel', (e) => endPointer(e, true));
cv.addEventListener('contextmenu', (e) => e.preventDefault());
cv.addEventListener('wheel', (e) => { if (scene === 'chapters' || scene === 'levels' || scene === 'gallery') { menuScroll = clamp(menuScroll + e.deltaY, 0, menuMax); e.preventDefault(); } }, { passive: false });
window.addEventListener('keydown', (e) => {
  const k = e.key;
  if (scene === 'play' || scene === 'create') {
    if (k === 'Escape' || k === 'p' || k === 'P') { setPause(!paused); e.preventDefault(); return; }
    if (paused || G.state !== 'play') { if (G.state === 'result' && k === 'Enter') { const n = nextPuzzle(); if (n) startPuzzle(n, G.ch); } return; }
    if (k === 'Tab') {
      e.preventDefault();
      const list = G.pieces, i = G.sel ? list.indexOf(G.sel) : -1, p = list[(i + (e.shiftKey ? list.length - 1 : 1)) % list.length];
      G.sel = p; p.z = ++G.zTop; p.pop = 0.08; sfx('tg_pick');
      return;
    }
    const p = G.sel;
    if (!p) { if (k.startsWith('Arrow') || k === 'r' || k === 'R' || k === ' ') { G.sel = G.pieces[0]; e.preventDefault(); } return; }
    if (k === 'r' || k === 'R' || k === ' ') { doRotate(p, e.shiftKey ? -1 : 1); e.preventDefault(); }
    else if (k === 'e' || k === 'E') doRotate(p, -1);
    else if (k === 'f' || k === 'F') doFlip(p.t === 'P' ? p : null);
    else if (k === 'h' || k === 'H') useHint();
    else if (k.startsWith('Arrow')) {
      e.preventDefault();
      const st = e.shiftKey ? 0.1 : 0.5;
      const dx = k === 'ArrowLeft' ? -st : k === 'ArrowRight' ? st : 0, dy = k === 'ArrowUp' ? -st : k === 'ArrowDown' ? st : 0;
      const drag = { x0: p.x, y0: p.y, r0: p.rot, f0: p.flip, inTray0: p.inTray };
      p.x += dx; p.y += dy; updPiece(p); p.dx -= dx; p.dy -= dy;
      if (p.inTray && onBoard(p)) p.inTray = false;
      G.drag = drag; G.drag.p = p;
      if (!p.inTray) dropPiece(p); else afterChange();
      G.drag = null;
    }
  } else if (scene === 'title' && (k === 'Enter' || k === ' ')) { goChapters(); e.preventDefault(); }
  else if ((scene === 'levels' || scene === 'gallery') && k === 'Escape') goChapters();
  else if (scene === 'chapters' && k === 'Escape') goTitle();
});

/* =====================================================================
 * 主迴圈
 * ===================================================================== */
function resizeCanvas() {
  const r = cv.getBoundingClientRect();
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  W = Math.max(200, r.width || innerWidth); H = Math.max(200, r.height || innerHeight);
  cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
  U = clamp(Math.min(W / 400, H / 700), 0.75, 1.4);
  spriteCache.clear(); thumbCache.clear();
  buildBg();
  if (G.pz && (scene === 'play' || scene === 'create')) relayout(false);
}
window.addEventListener('resize', resizeCanvas);
window.addEventListener('orientationchange', () => setTimeout(resizeCanvas, 120));
if (window.visualViewport) window.visualViewport.addEventListener('resize', resizeCanvas);
document.addEventListener('visibilitychange', () => { if (document.hidden && (scene === 'play' || scene === 'create') && G.state === 'play') setPause(true); });

function update(dt) {
  sceneT += dt;
  if (shakeT > 0) shakeT -= dt;
  updateParts(dt);
  if (scene === 'title') titleDemo.t += dt;
  if (scene !== 'play' && scene !== 'create') return;
  if (paused) return;
  if (G.state === 'play' && scene === 'play') G.t += dt;
  if (G.pendTap && performance.now() - G.pendTap.t > 320) { const p = G.pendTap.p; G.pendTap = null; doRotate(p, 1); }
  const kdecay = Math.exp(-dt * 13);
  for (const p of G.pieces) {
    if (p.appear < 0) { p.appear += dt; continue; }
    const dragging = G.drag && G.drag.p === p && G.drag.moved;
    p.lift += ((dragging ? 1 : 0) - p.lift) * Math.min(1, dt * 16);
    p.dx *= kdecay; p.dy *= kdecay; if (Math.abs(p.dx) < 1e-3) p.dx = 0; if (Math.abs(p.dy) < 1e-3) p.dy = 0;
    p.angA *= Math.exp(-dt * 15); if (Math.abs(p.angA) < 1e-3) p.angA = 0;
    if (p.flipA < 1) p.flipA = Math.min(1, p.flipA + dt * 7);
    p.pop *= Math.exp(-dt * 10);
    if (p.wig > 0) p.wig = Math.max(0, p.wig - dt);
    if (p.glow > 0) p.glow = Math.max(0, p.glow - dt);
  }
  if (G.state === 'win' || G.state === 'result') {
    const prev = G.winT;
    G.winT += dt;
    if (prev < 0.35 && G.winT >= 0.35) jingle(G.revealed ? JINGLE_REVEAL : JINGLE_WIN);
    if (prev < 0.5 && G.winT >= 0.5) { const [cx, cy] = toScreen(Lay.sil.x + G.pz.w / 2, Lay.sil.y + G.pz.h / 2); KG.confetti(cx, cy, KG.lowEnd ? 60 : 100); }
    if (prev < 1.0 && G.winT >= 1.0) { sfx('sparkle'); shake(3, 0.2); }
    if (prev < 1.7 && G.winT >= 1.7) { G.state = 'result'; G.starFx = 0; }
    if (G.chapterJustDone && prev < 3.2 && G.winT >= 3.2) { jingle(JINGLE_CHAPTER); KG.toast('「' + G.ch.name + '」全部完成！'); G.chapterJustDone = false; }
    if (G.ch && G.ch.kind === 'vehicle' && G.winT > 1.0 && Math.floor(G.winT * 4) !== Math.floor(prev * 4)) {
      const T = aliveTransform();
      if (T) { const [lx, ly] = toScreen(Lay.sil.x, Lay.sil.y + G.pz.h); spawn({ x: lx + T.dx, y: ly - Lay.u * 0.3, vx: -60, vy: -20, g: -30, life: 0.7, size: Lay.u * 0.18, color: 'rgba(255,255,255,0.8)', shape: 'dot' }); }
    }
  }
  if (G.mode === 'create' && G.saveFlash > 0) G.saveFlash = Math.max(0, G.saveFlash - dt * 1.5);
}
function draw() {
  btnReg = [];
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  if (scene === 'title') { drawTitle(); drawParts(); }
  else if (scene === 'chapters') { drawChapters(); drawParts(); }
  else if (scene === 'levels') { drawLevels(); drawParts(); }
  else if (scene === 'gallery') { drawGallery(); drawParts(); }
  else {
    drawPlay();
    if (G.mode === 'create' && G.saveFlash > 0) { ctx.fillStyle = 'rgba(255,250,220,' + G.saveFlash * 0.35 + ')'; ctx.fillRect(0, 0, W, H); }
    if (paused) { btnReg = []; drawPause(); }
  }
}
let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, Math.max(0, (now - last) / 1000));
  last = now; time += dt;
  update(dt);
  draw();
  requestAnimationFrame(frame);
}
KG.music.setVolume(0.4);
resizeCanvas();
goTitle();
requestAnimationFrame((t) => { last = t; frame(t); });

/* ---------- 測試用 ---------- */
window.__tg = {
  state: () => ({ scene, paused, state: G.state, prog: +G.prog.toFixed(3), hints: G.hints, stars: G.stars, matched: G.matched, t: +G.t.toFixed(1), u: +Lay.u.toFixed(1), land: Lay.land, name: G.pz && G.pz.name, music: KG.music.isPlaying() }),
  chapters: () => CHAPTERS.map(c => ({ name: c.name, n: c.puzzles.length })),
  start: (ci, pi) => startPuzzle(CHAPTERS[ci].puzzles[pi || 0], CHAPTERS[ci]),
  create: () => startCreate(),
  pieces: () => G.pieces.map(p => { const [sx, sy] = toScreen(p.cx, p.cy); return { i: p.i, t: p.t, rot: p.rot, flip: p.flip, sx: Math.round(sx), sy: Math.round(sy), slot: p.slot, inTray: p.inTray }; }),
  targets: () => G.pieces.map((p, k) => { const s = G.slots[G.pieceSlot ? G.pieceSlot[k] : k]; const [sx, sy] = toScreen(s.cx, s.cy); return { i: p.i, rot: s.rot, flip: s.flip, sx: Math.round(sx), sy: Math.round(sy) }; }),
  place: (i) => { const p = G.pieces[i], s = G.slots[G.pieceSlot[i]]; p.rot = s.rot; p.flip = s.flip; updPiece(p); moveCentroidTo(p, s.cx, s.cy); p.inTray = false; afterChange(); },
  solveAll: () => { G.pieces.forEach((p, i) => { const s = G.slots[G.pieceSlot[i]]; p.rot = s.rot; p.flip = s.flip; updPiece(p); moveCentroidTo(p, s.cx, s.cy); p.inTray = false; }); afterChange(); },
  /** 用另一種擺法（把兩個大三角形互換）也要能過關 */
  solveSwapped: () => { const order = [1, 0, 2, 4, 3, 5, 6]; G.pieces.forEach((p, i) => { const s = G.slots[G.pieceSlot[order[i]]]; p.rot = s.rot; p.flip = s.flip; updPiece(p); moveCentroidTo(p, s.cx, s.cy); p.inTray = false; }); afterChange(); },
  /** 依照給定的擺法（相對剪影左上角）放積木，用來測試「不同擺法也算過關」 */
  placePoses: (list) => { const used = new Set(); list.forEach(([t, rot, flip, x, y]) => { const p = G.pieces.find(q => q.t === t && !used.has(q)); used.add(p); p.rot = rot; p.flip = flip; p.x = x + Lay.sil.x; p.y = y + Lay.sil.y; updPiece(p); p.inTray = false; }); afterChange(); },
  hint: () => useHint(),
  fast: (sec) => { for (let i = 0; i < sec * 60; i++) update(1 / 60); },
  pause: (on) => setPause(on),
  buttons: () => btnReg.map(b => ({ id: b.id, x: Math.round(b.x + b.w / 2), y: Math.round(b.y + b.h / 2), disabled: !!b.disabled })),
  goChapters, goTitle, goLevels, goGallery,
  creations: () => creations.length
};
</script>
</body>
