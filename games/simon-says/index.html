<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>跟我做</title>
<link rel="stylesheet" href="../../assets/common.css">
<style>
  html, body { height: 100%; overflow: hidden; }
  body {
    height: 100vh; height: 100dvh; touch-action: none;
    background: radial-gradient(ellipse at 50% 35%, #7a5bd6 0%, #4a2f9a 45%, #24165a 100%);
  }

  /* ===== 舞台背景 ===== */
  .stage { position: fixed; inset: 0; overflow: hidden; pointer-events: none; }
  .backwall { position: absolute; inset: 0; background:
      radial-gradient(circle at 50% 30%, rgba(255, 220, 255, .25), transparent 55%),
      repeating-linear-gradient(90deg, rgba(255, 255, 255, .03) 0 30px, rgba(0, 0, 0, .04) 30px 60px); }
  .floor {
    position: absolute; left: -10%; right: -10%; bottom: 0; height: 26%;
    background:
      linear-gradient(180deg, rgba(255, 255, 255, .25), transparent 8%),
      repeating-linear-gradient(90deg, rgba(90, 40, 10, .25) 0 3px, transparent 3px 70px),
      linear-gradient(180deg, #e3a165, #b46a35 60%, #8a4a22);
    transform: perspective(500px) rotateX(28deg); transform-origin: 50% 100%;
    box-shadow: 0 -10px 30px rgba(0, 0, 0, .35);
  }
  .floor::before { content: ''; position: absolute; left: 0; right: 0; top: 0; height: 10px; background: linear-gradient(#ffd08a, #c47a3a); }
  .curtain { position: absolute; top: 0; bottom: 0; width: min(22vw, 190px); }
  .curtain.l { left: 0; } .curtain.r { right: 0; transform: scaleX(-1); }
  .valance {
    position: absolute; left: 0; right: 0; top: 0; height: 62px;
    background: radial-gradient(circle at 50% 0, #e8456a 0 34px, transparent 35px) 0 18px / 70px 50px repeat-x,
                linear-gradient(180deg, #b81e4a, #e8456a);
    filter: drop-shadow(0 6px 6px rgba(0, 0, 0, .35));
  }
  .valance::after { content: ''; position: absolute; left: 0; right: 0; bottom: -12px; height: 12px;
    background: radial-gradient(circle at 50% 0, #ffd34a 0 5px, transparent 6px) 0 0 / 35px 12px repeat-x; }
  .bulbs { position: absolute; left: 0; right: 0; top: 78px; height: 20px; display: flex; justify-content: space-around; }
  .bulbs i { width: 10px; height: 10px; border-radius: 50%; background: var(--c); box-shadow: 0 0 10px 3px var(--c); animation: twinkle 1.6s ease-in-out infinite; animation-delay: var(--d); opacity: .8; }
  @keyframes twinkle { 0%, 100% { opacity: .35; transform: scale(.8); } 50% { opacity: 1; transform: scale(1.1); } }
  .beam {
    position: absolute; top: -10%; width: 34vmin; height: 120%; left: var(--x);
    background: linear-gradient(180deg, rgba(255, 250, 210, .32), rgba(255, 250, 210, 0) 85%);
    clip-path: polygon(42% 0, 58% 0, 100% 100%, 0 100%);
    transform-origin: 50% 0; animation: sway 6s ease-in-out infinite; animation-delay: var(--dl);
    mix-blend-mode: screen;
  }
  @keyframes sway { 0%, 100% { transform: rotate(-14deg); } 50% { transform: rotate(14deg); } }
  .sparkle-bg { position: absolute; width: 6px; height: 6px; background: #fff; border-radius: 50%; opacity: .6; animation: twinkle 2.2s infinite; }

  /* ===== 共用介面元件 ===== */
  .scr { position: fixed; inset: 0; z-index: 7000; display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: clamp(10px, 2.4vh, 22px); padding: 72px 16px 24px; text-align: center; touch-action: none; }
  .scr[hidden] { display: none; }
  .scr.dim { background: radial-gradient(ellipse at center, rgba(20, 10, 50, .2), rgba(20, 10, 50, .6)); animation: kg-fade .25s ease; }
  .logo { display: flex; justify-content: center; font-size: clamp(56px, 17vw, 120px); font-weight: 900; line-height: 1.05; letter-spacing: .02em; }
  .logo span { display: inline-block; color: var(--c); -webkit-text-stroke: .14em #fff; paint-order: stroke fill;
    text-shadow: 0 .07em 0 var(--d), 0 .12em .2em rgba(0, 0, 0, .4);
    animation: lgIn .7s cubic-bezier(.2, 1.7, .4, 1) both, lgBob 2.4s ease-in-out infinite; }
  @keyframes lgIn { from { transform: translateY(-80px) scale(.3); opacity: 0; } to { transform: none; opacity: 1; } }
  @keyframes lgBob { 0%, 100% { transform: translateY(0) rotate(-3deg); } 50% { transform: translateY(-8px) rotate(3deg); } }
  .tag { font-size: clamp(16px, 4.4vw, 22px); font-weight: 900; color: #5a2a8a; background: linear-gradient(180deg, #fff, #f1e3ff);
    border: 3px solid #fff; border-radius: 999px; padding: 6px 18px; box-shadow: 0 4px 0 #b49cff, 0 8px 16px rgba(0, 0, 0, .25); }
  .cbtn { --b1: #9cf07a; --b2: #3fbf4c; --b3: #2a8f37; position: relative; font: 900 clamp(22px, 6.4vw, 32px)/1 var(--kg-font); color: #fff;
    padding: .55em 1.5em .6em; border: 4px solid #fff; border-radius: 999px; cursor: pointer; background: linear-gradient(180deg, var(--b1), var(--b2));
    box-shadow: 0 7px 0 var(--b3), 0 14px 24px rgba(0, 0, 0, .35); text-shadow: 0 3px 0 rgba(0, 0, 0, .18); transition: transform .1s, box-shadow .1s;
    min-height: 56px; touch-action: manipulation; }
  .cbtn::before { content: ''; position: absolute; left: 14%; right: 14%; top: 7%; height: 36%; border-radius: 999px; background: linear-gradient(rgba(255, 255, 255, .75), rgba(255, 255, 255, 0)); pointer-events: none; }
  .cbtn:active { transform: translateY(5px) scale(.97); box-shadow: 0 2px 0 var(--b3), 0 6px 12px rgba(0, 0, 0, .25); }
  .cbtn.pulse { animation: pulse 1.3s ease-in-out infinite; }
  .cbtn.blue { --b1: #8ad6ff; --b2: #3d9df0; --b3: #2470b8; }
  .cbtn.pink { --b1: #ffb0cc; --b2: #f26a9b; --b3: #c2426f; }
  .cbtn.small { font-size: 19px; padding: .5em 1.1em; min-height: 52px; }
  @keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.07); } }
  .panel { width: min(560px, 100%); max-height: calc(100% - 10px); overflow: auto; background: linear-gradient(180deg, rgba(255, 255, 255, .97), rgba(245, 235, 255, .97));
    border: 5px solid #fff; border-radius: 30px; padding: 18px 14px 20px; box-shadow: 0 10px 0 rgba(90, 50, 160, .35), 0 20px 40px rgba(0, 0, 0, .4);
    animation: kg-pop .4s cubic-bezier(.2, 1.6, .4, 1); }
  .panel h2 { margin: 2px 0 12px; font-size: 28px; color: #5a2a8a; }
  .lvls { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 12px; }
  .lv { position: relative; border: 4px solid #fff; border-radius: 24px; padding: 10px 4px 8px; cursor: pointer; background: linear-gradient(180deg, var(--l1), var(--l2));
    box-shadow: 0 6px 0 var(--l3), 0 10px 16px rgba(0, 0, 0, .15); font-family: var(--kg-font); color: #fff; min-height: 104px; transition: transform .1s;
    animation: kg-pop .45s cubic-bezier(.2, 1.6, .4, 1) both; }
  .lv:active { transform: translateY(4px); box-shadow: 0 2px 0 var(--l3); }
  .lv b { display: block; font-size: 34px; line-height: 1; text-shadow: 0 3px 0 rgba(0, 0, 0, .2); }
  .lv small { display: block; font-size: 13px; font-weight: 800; margin: 3px 0 4px; text-shadow: 0 1px 0 rgba(0, 0, 0, .25); }
  .lv.locked { filter: grayscale(.9) brightness(1.05); cursor: default; }
  .lv .lock { display: grid; place-items: center; height: 34px; }
  .lv .lock svg { width: 34px; height: 34px; }
  .stars-row { display: flex; justify-content: center; gap: 2px; }
  .st path:first-child { fill: #e6dccf; stroke: #c9b8a6; }
  .st.on path:first-child { fill: url(#gStar); stroke: #d98a00; }
  .row { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; align-items: center; }
  .total { display: inline-flex; align-items: center; gap: 4px; font-weight: 900; font-size: 20px; color: #5a2a8a; }
  .skins { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-top: 6px; }
  .skin { position: relative; width: 74px; height: 74px; border-radius: 20px; border: 4px solid #fff; cursor: pointer; padding: 0;
    background: linear-gradient(180deg, #f6edff, #e0ccff); box-shadow: 0 5px 0 #b49cff; display: grid; place-items: center; }
  .skin svg.ani { width: 62px; height: 62px; }
  .skin.sel { outline: 4px solid #ff8fb1; outline-offset: 1px; transform: scale(1.06); }
  .skin.locked svg.ani { filter: grayscale(1) opacity(.45); }
  .skin .need { position: absolute; bottom: -2px; right: -6px; display: flex; align-items: center; gap: 1px; font: 900 13px var(--kg-font); color: #5a2a8a; background: #fff; border-radius: 999px; padding: 1px 6px 1px 3px; box-shadow: 0 2px 4px rgba(0, 0, 0, .2); }
  .result { position: relative; width: min(400px, 100%); padding-top: 48px; overflow: visible; margin-top: 20px; }
  .ribbon { position: absolute; left: 50%; top: -26px; transform: translateX(-50%); white-space: nowrap; font-size: 28px; font-weight: 900; color: #fff; padding: 8px 34px 10px;
    background: linear-gradient(180deg, #ff9fc0, #f2668f); border-radius: 14px; border: 4px solid #fff; box-shadow: 0 6px 0 #c2426f, 0 10px 18px rgba(0, 0, 0, .2); text-shadow: 0 2px 0 rgba(0, 0, 0, .2); }
  .bigstars { display: flex; justify-content: center; gap: 6px; margin: 4px 0 8px; }
  .bigstars svg { width: 70px; height: 70px; animation: starIn .5s cubic-bezier(.2, 1.8, .4, 1) both; }
  .bigstars svg:nth-child(2) { width: 86px; height: 86px; margin-top: -12px; }
  @keyframes starIn { from { transform: scale(0) rotate(-120deg); opacity: 0; } to { transform: none; opacity: 1; } }
  .result p { font-size: 19px; font-weight: 800; margin: 4px 0 14px; color: #5a3a6a; }
  .unlock { display: inline-flex; align-items: center; gap: 8px; margin: -4px 0 12px; padding: 6px 14px; background: #fff3c4; border-radius: 999px; font-weight: 900; color: #a0620a; animation: kg-pop .5s .9s both; }
  .band { display: flex; justify-content: center; gap: 2px; }
  .band svg.ani { width: clamp(60px, 18vw, 96px); height: clamp(60px, 18vw, 96px); animation: hop .8s ease-in-out infinite; }
  .band svg.ani:nth-child(2) { animation-delay: .2s; } .band svg.ani:nth-child(3) { animation-delay: .4s; } .band svg.ani:nth-child(4) { animation-delay: .6s; }
  @keyframes hop { 0%, 100% { transform: translateY(0) scale(1, 1); } 30% { transform: translateY(-14px) scale(.96, 1.05); } 60% { transform: translateY(0) scale(1.06, .94); } }

  /* ===== HUD：跑馬燈招牌 ===== */
  .hud { position: fixed; top: 10px; left: 50%; transform: translateX(-50%); z-index: 8000; pointer-events: none;
    width: min(250px, calc(100vw - 136px)); padding: 6px 10px 7px; border-radius: 16px; color: #fff; font-weight: 900;
    background: linear-gradient(180deg, #8c4bd6, #5a2a9a); border: 4px dotted #ffe27a;
    box-shadow: 0 0 0 3px #3a1a6a, 0 0 18px rgba(255, 226, 122, .55), 0 6px 12px rgba(0, 0, 0, .35); }
  .hud[hidden] { display: none; }
  .hud .top { display: flex; justify-content: space-between; align-items: center; font-size: 17px; text-shadow: 0 2px 0 #3a1a6a; }
  .hearts { display: flex; gap: 1px; }
  .hearts svg { width: 22px; height: 22px; transition: transform .3s, filter .3s; }
  .hearts svg.off { filter: grayscale(1) opacity(.45); transform: scale(.8); }
  .prog { display: flex; justify-content: center; gap: 3px; margin-top: 4px; flex-wrap: wrap; }
  .prog svg { width: 18px; height: 18px; transition: transform .3s; }
  .prog svg.on { transform: scale(1.15); }
  .prog svg path { fill: #3a1a6a; }
  .prog svg.on path { fill: #ffe27a; }

  /* ===== 遊戲區 ===== */
  #play { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2.4vh; padding: 92px 12px 16px; }
  #play[hidden] { display: none; }
  #board { display: grid; gap: var(--gap, 18px); grid-template-columns: repeat(var(--cols, 2), var(--s, 150px)); }
  .pad { --s2: var(--s, 150px); position: relative; width: var(--s2); height: var(--s2); border: none; padding: 0; background: none; cursor: pointer; outline: none;
    touch-action: none; animation: pad-in .55s cubic-bezier(.2, 1.6, .4, 1) both; }
  @keyframes pad-in { from { transform: scale(.2) rotate(-30deg); opacity: 0; } to { transform: none; opacity: 1; } }
  .pad .disc { position: absolute; inset: 0; border-radius: 50%;
    background: radial-gradient(circle at 35% 28%, var(--a) 0%, var(--b) 60%, var(--d) 100%);
    box-shadow: 0 10px 0 var(--d), 0 18px 26px rgba(0, 0, 0, .35), inset 0 -10px 18px rgba(0, 0, 0, .15), inset 0 8px 10px rgba(255, 255, 255, .45);
    border: 6px solid rgba(255, 255, 255, .9); transition: transform .12s, box-shadow .12s, filter .12s; filter: saturate(.85) brightness(.92); }
  .pad .disc::before { content: ''; position: absolute; left: 16%; top: 6%; width: 50%; height: 22%; border-radius: 50%; background: linear-gradient(rgba(255, 255, 255, .85), rgba(255, 255, 255, 0)); transform: rotate(-18deg); }
  .pad .disc::after { content: ''; position: absolute; inset: 9%; border-radius: 50%; border: 3px dashed rgba(255, 255, 255, .45); }
  .pad svg.ani { position: absolute; left: 6%; top: 2%; width: 88%; height: 88%; transition: transform .15s; filter: drop-shadow(0 6px 4px rgba(0, 0, 0, .2)); pointer-events: none; }
  .pad .glow { position: absolute; inset: -22%; border-radius: 50%; background: radial-gradient(circle, var(--a) 0%, transparent 65%); opacity: 0; transition: opacity .12s; pointer-events: none; }
  .pad.lit .glow { opacity: 1; }
  .pad.lit .disc { transform: scale(1.08) translateY(-5px); filter: saturate(1.3) brightness(1.18); box-shadow: 0 10px 0 var(--d), 0 0 0 8px rgba(255, 255, 255, .7), 0 0 50px 16px var(--a); }
  .pad.lit svg.ani { transform: scale(1.14) translateY(-9%) rotate(-5deg); }
  .pad.shake { animation: kg-shake .45s ease; }
  .pad .notefx { position: absolute; left: 50%; top: 4%; width: calc(var(--s2) * .26); pointer-events: none; animation: note-up 1s ease-out forwards; }
  @keyframes note-up { from { transform: translate(-50%, 0) scale(.5) rotate(0); opacity: 1; } to { transform: translate(calc(-50% + var(--dx)), -140%) scale(1.2) rotate(var(--r)); opacity: 0; } }

  /* 動物表情切換 */
  svg.ani .e-happy, svg.ani .m-sing, svg.ani .m-sad, svg.ani .tear { display: none; }
  .lit svg.ani .e-open, .cheer svg.ani .e-open { display: none; }
  .lit svg.ani .e-happy, .cheer svg.ani .e-happy { display: inline; }
  .lit svg.ani .m-idle, .cheer svg.ani .m-idle, svg.ani.sing .m-idle { display: none; }
  .lit svg.ani .m-sing, .cheer svg.ani .m-sing, svg.ani.sing .m-sing { display: inline; }
  svg.ani.sing .e-open { display: none; } svg.ani.sing .e-happy { display: inline; }
  .sad svg.ani .m-idle { display: none; }
  .sad svg.ani .m-sad, .sad svg.ani .tear { display: inline; }
  svg.ani .e-open { animation: blink 4s infinite; transform-box: fill-box; transform-origin: center; animation-delay: var(--bd, 0s); }
  @keyframes blink { 0%, 93%, 100% { transform: scaleY(1); } 96% { transform: scaleY(.1); } }

  #status { position: relative; min-height: 58px; display: flex; align-items: center; justify-content: center; gap: 8px;
    padding: 10px 26px; border-radius: 22px; background: #fff; border: 4px solid #fff; color: #4a2a6a;
    font-size: clamp(20px, 5.4vw, 28px); font-weight: 900; box-shadow: 0 6px 0 #c9b3f0, 0 12px 20px rgba(0, 0, 0, .3); }
  #status::before { content: ''; position: absolute; left: 50%; top: -14px; transform: translateX(-50%); border: 10px solid transparent; border-bottom-color: #fff; }
  #status.you { background: #fff6c9; } #status.you::before { border-bottom-color: #fff6c9; }
  #status.good { background: #d9ffe0; } #status.good::before { border-bottom-color: #d9ffe0; }
  #status.oops { background: #ffe3ec; } #status.oops::before { border-bottom-color: #ffe3ec; }
  #status.pop { animation: kg-pop .35s cubic-bezier(.2, 1.6, .4, 1); }
  #freeBack { position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%); z-index: 7100; }
  #freeBack[hidden] { display: none; }
  #fx { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 7600; }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <linearGradient id="gStar" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff2a0"/><stop offset=".55" stop-color="#ffd23a"/><stop offset="1" stop-color="#ffab1a"/></linearGradient>
    <linearGradient id="gHeart" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffb0c8"/><stop offset="1" stop-color="#f0446f"/></linearGradient>
    <radialGradient id="g-dog" cx=".4" cy=".35" r=".7"><stop offset="0" stop-color="#ffe9c4"/><stop offset=".7" stop-color="#f2c07c"/><stop offset="1" stop-color="#d9964f"/></radialGradient>
    <radialGradient id="g-dog2" cx=".4" cy=".3" r=".8"><stop offset="0" stop-color="#b57a4a"/><stop offset="1" stop-color="#7a4a26"/></radialGradient>
    <radialGradient id="g-cat" cx=".4" cy=".35" r=".7"><stop offset="0" stop-color="#ffe2b0"/><stop offset=".7" stop-color="#ffb35a"/><stop offset="1" stop-color="#e88a2e"/></radialGradient>
    <radialGradient id="g-frog" cx=".4" cy=".35" r=".7"><stop offset="0" stop-color="#d8ffb0"/><stop offset=".7" stop-color="#7ed957"/><stop offset="1" stop-color="#47a83a"/></radialGradient>
    <radialGradient id="g-bunny" cx=".4" cy=".35" r=".7"><stop offset="0" stop-color="#ffffff"/><stop offset=".75" stop-color="#f4eefa"/><stop offset="1" stop-color="#d8cbe8"/></radialGradient>
    <radialGradient id="g-bear" cx=".4" cy=".35" r=".7"><stop offset="0" stop-color="#e0a978"/><stop offset=".7" stop-color="#b8784a"/><stop offset="1" stop-color="#8e5530"/></radialGradient>
    <radialGradient id="g-pig" cx=".4" cy=".35" r=".7"><stop offset="0" stop-color="#ffe4ec"/><stop offset=".7" stop-color="#ffb3c8"/><stop offset="1" stop-color="#ee8aa8"/></radialGradient>
    <linearGradient id="g-gold" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff2a0"/><stop offset="1" stop-color="#ffb21a"/></linearGradient>
  </defs>
</svg>

<div class="stage" aria-hidden="true">
  <div class="backwall"></div>
  <div class="beam" style="--x:8%;--dl:0s"></div>
  <div class="beam" style="--x:58%;--dl:-3s"></div>
  <div class="floor"></div>
  <svg class="curtain l" viewBox="0 0 100 400" preserveAspectRatio="none">
    <defs><linearGradient id="cur" x1="0" x2="1"><stop offset="0" stop-color="#8a0f30"/><stop offset=".25" stop-color="#e8456a"/><stop offset=".5" stop-color="#a8163e"/><stop offset=".75" stop-color="#e8456a"/><stop offset="1" stop-color="#9a1238"/></linearGradient></defs>
    <path d="M0 0 H100 C 80 120, 60 220, 70 300 C 74 330, 40 360, 30 400 H0Z" fill="url(#cur)"/>
    <path d="M62 300 C 74 320, 70 340, 40 345" fill="none" stroke="#ffd34a" stroke-width="5" stroke-linecap="round"/>
  </svg>
  <svg class="curtain r" viewBox="0 0 100 400" preserveAspectRatio="none">
    <path d="M0 0 H100 C 80 120, 60 220, 70 300 C 74 330, 40 360, 30 400 H0Z" fill="url(#cur)"/>
    <path d="M62 300 C 74 320, 70 340, 40 345" fill="none" stroke="#ffd34a" stroke-width="5" stroke-linecap="round"/>
  </svg>
  <div class="valance"></div>
  <div class="bulbs" id="bulbs"></div>
</div>

<div class="hud" id="hud" hidden>
  <div class="top"><span id="hudLv">第 1 關</span><span class="hearts" id="hearts"></span></div>
  <div class="prog" id="prog"></div>
</div>

<main id="play" hidden>
  <div id="board" aria-label="動物按鈕"></div>
  <div id="status">準備好了嗎？</div>
</main>
<button class="cbtn small pink" id="freeBack" hidden>回選單</button>

<section class="scr" id="title">
  <div style="flex:1"></div>
  <div class="logo" id="logo"></div>
  <div class="tag">動物樂團唱什麼，你就跟著按！</div>
  <div class="band" id="titleBand"></div>
  <div style="flex:1"></div>
  <button class="cbtn pulse" id="btnStart">開始玩</button>
  <div style="flex:.3"></div>
</section>

<section class="scr dim" id="select" hidden>
  <div class="panel">
    <h2>選擇關卡</h2>
    <div class="row" style="margin:-4px 0 12px"><span class="total" id="totalStars"></span></div>
    <div class="lvls" id="lvls"></div>
    <h2 style="margin-top:16px;font-size:22px">樂團造型</h2>
    <div class="skins" id="skins"></div>
  </div>
</section>

<section class="scr dim" id="resultScr" hidden>
  <div class="panel result">
    <div class="ribbon" id="resTitle">過關啦！</div>
    <div class="band" id="resBand"></div>
    <div class="bigstars" id="resStars"></div>
    <p id="resMsg"></p>
    <div id="resUnlock"></div>
    <div class="row" id="resBtns"></div>
  </div>
</section>
<canvas id="fx"></canvas>

<script src="../../assets/common.js"></script>
<script>
'use strict';
(function () {
  const $ = id => document.getElementById(id);
  const board = $('board'), statusEl = $('status');

  /* ======================= 動物（SVG 手繪） ======================= */
  const ANIMALS = {
    dog: { name: '小狗', a: '#ffd6e2', b: '#ff86ab', d: '#d4557f', f: 523.25 },

  const FX = (function () {
    const c = $('fx'), g = c.getContext('2d');
    let parts = [], texts = [], running = false, last = 0, W = 0, H = 0;
    function size() { const d = Math.min(devicePixelRatio || 1, 2.5); W = innerWidth; H = innerHeight; c.width = W * d; c.height = H * d; g.setTransform(d, 0, 0, d, 0, 0); }
    size(); addEventListener('resize', size);
    function star(r) { g.beginPath(); for (let i = 0; i < 10; i++) { const a = -Math.PI / 2 + i * Math.PI / 5, q = i % 2 ? r * 0.45 : r; g.lineTo(Math.cos(a) * q, Math.sin(a) * q); } g.closePath(); g.fill(); }
    function heart(r) { g.beginPath(); g.moveTo(0, r * 0.9); g.bezierCurveTo(-r * 1.6, -r * 0.2, -r * 0.6, -r * 1.3, 0, -r * 0.4); g.bezierCurveTo(r * 0.6, -r * 1.3, r * 1.6, -r * 0.2, 0, r * 0.9); g.fill(); }
    function note(r) { g.beginPath(); g.ellipse(-r * 0.3, r * 0.6, r * 0.45, r * 0.34, -0.4, 0, Math.PI * 2); g.fill(); g.fillRect(r * 0.05, -r, r * 0.18, r * 1.6); g.beginPath(); g.moveTo(r * 0.2, -r); g.quadraticCurveTo(r * 0.9, -r * 0.6, r * 0.6, 0); g.lineTo(r * 0.2, -r * 0.5); g.fill(); }
    function frame(now) {
      const dt = Math.max(0, Math.min(0.05, (now - last) / 1000)); last = now;
      g.clearRect(0, 0, W, H);
      parts = parts.filter(p => (p.life -= dt / p.dur) > 0);
      parts.forEach(p => {
        p.vy += p.grav * dt; p.x += p.vx * dt; p.y += p.vy * dt; p.rot += p.vr * dt;
        g.save(); g.translate(p.x, p.y); g.rotate(p.rot);
        const sc = p.life > 0.8 ? (1 - p.life) / 0.2 : 1;
        g.scale(sc, sc);
        g.globalAlpha = Math.min(1, p.life * 2.5);
        g.fillStyle = p.col;
        if (p.k === 'star') star(p.r); else if (p.k === 'heart') heart(p.r); else if (p.k === 'note') note(p.r); else { g.beginPath(); g.arc(0, 0, p.r, 0, Math.PI * 2); g.fill(); }
        g.restore();
      });
      texts = texts.filter(t => (t.life -= dt / t.dur) > 0);
      texts.forEach(t => {
        const k = 1 - t.life, intro = Math.min(1, k / 0.18);
        const eb = 1 + 2.7 * Math.pow(intro - 1, 3) + 1.7 * Math.pow(intro - 1, 2);
        g.save(); g.translate(t.x, t.y - k * 50); g.scale(eb, eb); g.rotate(Math.sin(k * 10) * 0.04);
        g.globalAlpha = Math.min(1, t.life * 3);
        g.font = `900 ${t.size}px ${getComputedStyle(document.body).fontFamily}`;
        g.textAlign = 'center'; g.textBaseline = 'middle'; g.lineJoin = 'round';

        g.fillStyle = t.col; g.fillText(t.s, 0, 0);
        g.restore();
      });
      if (parts.length || texts.length) requestAnimationFrame(frame); else { running = false; g.clearRect(0, 0, W, H); }
    }
    function kick() { if (!running) { running = true; last = performance.now(); requestAnimationFrame(frame); } }
    return {
      burst(x, y, n, kinds, cols, speed) {
        for (let i = 0; i < n; i++) {

    const mel = [72, 76, 79, 76, 77, 0, 74, 0, 76, 79, 84, 79, 81, 0, 79, 0, 77, 76, 74, 72, 74, 76, 72, 0, 71, 74, 79, 77, 76, 0, 72, 0];
    const bass = [48, 53, 43, 48, 53, 48, 43, 48];
    let timer = null, step = 0;
    function tick() {
      if (KG.isMuted() || document.hidden) { step++; return; }
      const m = mel[step % mel.length];
      if (m) KG.note(NOTE(m), 0.2, 'triangle', 0.05);
      if (step % 4 === 0) KG.note(NOTE(bass[(step / 4 | 0) % bass.length]), 0.4, 'sine', 0.08);
      if (step % 4 === 2) KG.note(NOTE(bass[(step / 4 | 0) % bass.length] + 12), 0.08, 'sine', 0.03);
      step++;

    return { start() { if (!timer) { step = 0; timer = setInterval(tick, 220); } }, stop() { clearInterval(timer); timer = null; } };

  let nPads = 4, padEls = [];
  function layout() {
    const W = innerWidth, H = innerHeight;

    let best = { s: 0, cols: 2, gap: 16 };
    [2, 3].forEach(cols => {

      const rows = Math.ceil(nPads / cols);
      const gap = Math.max(14, Math.min(28, W * 0.035));
      const s = Math.min((availW - gap * (cols - 1)) / cols, (availH - gap * (rows - 1) - 14) / rows, 220);

      el.addEventListener('pointerdown', ev => { ev.preventDefault(); press(i); });
      board.appendChild(el);
      padEls.push(el);
    }
    layout();
  }

  /* ======================= 聲音與亮燈 ======================= */
  function tone(i, dur) {
    const f = ANIMALS[ORDER[i]].f;
    KG.note(f, dur, 'triangle', 0.26);
    KG.note(f * 2, dur * 0.6, 'sine', 0.06);
    KG.note(f / 2, dur * 0.8, 'sine', 0.09);
  }
  let timers = [];
  const later = (fn, ms) => { const id = setTimeout(fn, ms); timers.push(id); return id; };
  const clearTimers = () => { timers.forEach(clearTimeout); timers = []; };

  function flash(i, ms) {
    const el = padEls[i];
    if (!el) return;
    el.classList.add('lit');
    tone(i, Math.max(0.25, ms / 1000));
    const n = document.createElement('div');
    n.className = 'notefx';
    n.innerHTML = NOTE_SVG(ANIMALS[ORDER[i]].d);
    n.style.setProperty('--dx', KG.randInt(-60, 60) + '%');
    n.style.setProperty('--r', KG.randInt(-30, 30) + 'deg');
    el.appendChild(n);
    setTimeout(() => n.remove(), 1000);
    clearTimeout(el._t);
    el._t = setTimeout(() => el.classList.remove('lit'), ms);
  }
  function setStatus(html, cls) {
    statusEl.innerHTML = html;
    statusEl.className = (cls || '') + ' pop';
  }

  /* ======================= 遊戲流程 ======================= */
  let state = 'title', lvIdx = 0, L = LEVELS[0], seq = [], idx = 0, phase = 'idle', hearts = 3, round = 0;

  function show(id) {
    ['title', 'select', 'resultScr'].forEach(s => { $(s).hidden = s !== id; });
    $('play').hidden = !(state === 'play' || state === 'free');
    $('hud').hidden = state !== 'play';
    $('freeBack').hidden = state !== 'free';
  }

  function updHud() {
    $('hudLv').textContent = `第 ${lvIdx + 1} 關`;
    $('hearts').innerHTML = [0, 1, 2].map(i => heartSvg(i < hearts)).join('');
    let p = '';
    for (let i = 0; i < L.len; i++) p += `<span>${noteIcon.replace('<svg', `<svg class="${i < round - 1 || (phase === 'done' && i < round) ? 'on' : ''}"`)}</span>`;
    $('prog').innerHTML = p;
  }

  function startLevel(i) {
    clearTimers();
    lvIdx = i; L = LEVELS[i];
    state = 'play';
    BGM.stop();
    nPads = L.n;
    seq = []; round = 0; hearts = 3; phase = 'idle';
    show(null);
    buildPads();
    updHud();
    if (L.n === 6 && !(save.stars[i] > 0) && i === 3) { later(() => { FX.text(innerWidth / 2, innerHeight * 0.3, '新朋友來了！', '#a283f2', 44); KG.sound('sparkle'); }, 500); }
    setStatus('準備好了嗎？');
    later(nextRound, 1300);
  }

  function nextRound() {
    round++;
    let n;
    do { n = KG.randInt(0, nPads - 1); } while (seq.length >= 2 && n === seq[seq.length - 1] && n === seq[seq.length - 2]);
    seq.push(n);
    updHud();
    playSeq();
  }

  function playSeq() {
    phase = 'watch';
    setStatus('看仔細喔！');
    const gap = Math.max(380, L.tempo - round * 20);
    seq.forEach((p, i) => later(() => flash(p, gap * 0.62), 450 + i * gap));
    later(() => {
      phase = 'input'; idx = 0;
      setStatus('換你囉！', 'you');
    }, 450 + seq.length * gap - gap * 0.3);
  }

  function padCenter(i) { const r = padEls[i].getBoundingClientRect(); return [r.left + r.width / 2, r.top + r.height / 2]; }

  function press(i) {
    if (state === 'free') {
      flash(i, 320);
      const [x, y] = padCenter(i);
      FX.burst(x, y - 30, 4, ['note', 'star'], [ANIMALS[ORDER[i]].b, '#fff', '#ffe27a'], 200);
      return;
    }
    if (state !== 'play' || phase !== 'input') return;
    flash(i, 280);
    if (seq[idx] === i) {
      idx++;
      const [x, y] = padCenter(i);
      FX.burst(x, y - 20, 5, ['star', 'note'], ['#ffe27a', '#fff', ANIMALS[ORDER[i]].a], 200);
      if (idx === seq.length) { phase = 'done'; later(success, 340); }
    } else mistake(i);
  }

  const PRAISE = ['好棒！', '答對了！', '真厲害！', '太棒了！', '記得好清楚！'];
  function success() {
    KG.sound('correct');
    updHud();
    const praise = KG.pick(PRAISE);
    setStatus(praise, 'good');
    padEls.forEach((el, k) => { el.classList.add('cheer'); later(() => el.classList.remove('cheer'), 900); });
    const r = board.getBoundingClientRect();
    FX.text(r.left + r.width / 2, r.top + r.height / 2, praise, '#ff5f95', 46);
    FX.burst(r.left + r.width / 2, r.top + r.height / 2, 24, ['star', 'heart', 'note'], ['#ffe27a', '#ff8fb1', '#8ad6ff', '#9cf07a'], 360);
    KG.sound('sparkle');
    if (round >= L.len) later(levelClear, 1100);
    else later(nextRound, 1300);
  }

  function mistake(i) {
    hearts--;
    padEls[i].classList.remove('shake'); void padEls[i].offsetWidth; padEls[i].classList.add('shake');
    padEls.forEach(el => { el.classList.add('sad'); later(() => el.classList.remove('sad'), 1300); });
    const hud = $('hud'); hud.classList.remove('kg-shake'); void hud.offsetWidth; hud.classList.add('kg-shake');
    KG.vibrate(40);
    updHud();
    if (hearts > 0) {
      phase = 'oops';
      KG.sound('boing');
      setStatus('沒關係，再聽一次～', 'oops');
      KG.say('沒關係，再聽一次');
      later(playSeq, 1700);
    } else {
      phase = 'over';
      KG.sound('wrong');
      setStatus('答案是這隻喔！', 'oops');
      later(() => flash(seq[idx], 800), 500);
      later(() => showResult(false), 1800);
    }
  }

  function levelClear() {
    phase = 'over';
    KG.confetti();
    showResult(true);
  }

  function showResult(win) {
    state = 'result';
    clearTimers();
    show('resultScr');
    let starsN = 0, unlock = '';
    if (win) {
      starsN = hearts;
      const before = totalStars();
      save.stars[lvIdx] = Math.max(save.stars[lvIdx] || 0, starsN);
      persist();
      const after = totalStars();
      const nc = COSTUMES.find(c => c.need > before && c.need <= after);
      if (nc) unlock = `<div class="unlock">🎁 解鎖新造型：${nc.name}！</div>`;
      $('resTitle').textContent = starsN === 3 ? '超級完美！' : '過關啦！';
      $('resMsg').textContent = `記住了 ${L.len} 個音符，好厲害！`;
      KG.sound('win');
      KG.say('好棒，過關了');
    } else {
      $('resTitle').textContent = '差一點點！';
      $('resMsg').textContent = '動物們等你再來唱一次喔！';
      KG.sound('lose');
    }
    $('resUnlock').innerHTML = unlock;
    band($('resBand'), ORDER.slice(0, 4));
    $('resBand').classList.toggle('sad', !win);
    $('resBand').classList.toggle('cheer', !!win);
    $('resStars').innerHTML = [0, 1, 2].map(k => starSvg(k < starsN, 70)).join('');
    [...$('resStars').children].forEach((s, k) => { s.style.animationDelay = (0.25 + k * 0.25) + 's'; if (k < starsN) setTimeout(() => KG.note(880 + k * 220, 0.18, 'triangle', 0.2), 250 + k * 250); });
    const box = $('resBtns'); box.innerHTML = '';
    const mk = (txt, cls, fn) => { const b = document.createElement('button'); b.className = 'cbtn small ' + cls; b.textContent = txt; b.addEventListener('click', () => { KG.sound('click'); fn(); }); box.appendChild(b); };
    const hasNext = win && lvIdx < LEVELS.length - 1;
    if (hasNext) mk('下一關', '', () => startLevel(lvIdx + 1));
    mk(win ? '再玩一次' : '再試一次', hasNext ? 'blue' : '', () => startLevel(lvIdx));
    mk('選關卡', 'pink', openSelect);
  }

  function openSelect() {
    clearTimers();
    state = 'select';
    show('select');
    BGM.start();
    const total = totalStars();
    $('totalStars').innerHTML = starSvg(true, 28) + ` ${total} / ${LEVELS.length * 3}`;
    const box = $('lvls'); box.innerHTML = '';
    LEVELS.forEach((lv, i) => {
      const ok = i === 0 || (save.stars[i - 1] || 0) > 0;
      const s = save.stars[i] || 0;
      const b = document.createElement('button');
      b.className = 'lv' + (ok ? '' : ' locked');
      b.style.cssText = `--l1:${LCOL[i][0]};--l2:${LCOL[i][1]};--l3:${LCOL[i][2]};animation-delay:${i * 0.05}s`;
      b.innerHTML = (ok ? `<b>${i + 1}</b>` : `<div class="lock">${lockSvg}</div>`) + `<small>${lv.name}</small><div class="stars-row">${[0, 1, 2].map(k => starSvg(k < s, 22)).join('')}</div>`;
      b.addEventListener('click', () => {
        if (!ok) { KG.sound('wrong'); b.classList.remove('kg-shake'); void b.offsetWidth; b.classList.add('kg-shake'); return; }
        KG.sound('pop'); startLevel(i);
      });
      box.appendChild(b);
    });
    const f = document.createElement('button');
    f.className = 'lv';
    f.style.cssText = '--l1:#d6f7ff;--l2:#6cc4ff;--l3:#2f82c2;animation-delay:.4s';
    f.innerHTML = `<b style="height:34px;display:grid;place-items:center"><span style="display:block;width:34px">${NOTE_SVG('#fff')}</span></b><small>自由彈奏</small><div class="stars-row" style="font-size:12px;font-weight:900">隨便玩</div>`;
    f.addEventListener('click', () => { KG.sound('pop'); startFree(); });
    box.appendChild(f);
    const sk = $('skins'); sk.innerHTML = '';
    COSTUMES.forEach((c, i) => {
      const ok = total >= c.need;
      const b = document.createElement('button');
      b.className = 'skin' + (save.costume === i ? ' sel' : '') + (ok ? '' : ' locked');
      b.title = c.name;
      b.innerHTML = animalSVG(ORDER[i % 4], c.id) + (ok ? '' : `<span class="need">${starSvg(true, 14)}${c.need}</span>`);
      b.addEventListener('click', () => {
        if (!ok) { KG.toast(`收集 ${c.need} 顆星星就能解鎖！`); KG.sound('wrong'); return; }
        save.costume = i; persist(); KG.sound('pop'); openSelect();
      });
      sk.appendChild(b);
    });
  }

  function startFree() {
    clearTimers();
    state = 'free';
    BGM.stop();
    nPads = 6;
    show(null);
    buildPads();
    setStatus('隨便按，一起唱歌吧！', 'you');
  }

  $('btnStart').addEventListener('click', () => { KG.sound('click'); openSelect(); });
  $('freeBack').addEventListener('click', () => { KG.sound('click'); openSelect(); });

  const ARROWS = { ArrowUp: 0, ArrowRight: 1, ArrowLeft: 2, ArrowDown: 3 };
  addEventListener('keydown', e => {
    if (state !== 'play' && state !== 'free') return;
    let i = -1;
    if (/^Digit[1-6]$/.test(e.code)) i = +e.code.slice(5) - 1;
    else if (e.code in ARROWS) i = ARROWS[e.code];
    if (i >= 0 && i < nPads) { e.preventDefault(); if (!e.repeat) press(i); }
  });
  document.addEventListener('contextmenu', e => e.preventDefault());
  document.addEventListener('visibilitychange', () => { if (document.hidden) BGM.stop(); else if (state === 'select') BGM.start(); });

  // 標題畫面的樂團輪流唱歌
  band($('titleBand'), ORDER.slice(0, 4));
  let tIdx = 0;
  setInterval(() => {
    if (state !== 'title') return;
    const kids = $('titleBand').children;
    [...kids].forEach((k, i) => k.classList.toggle('sing', i === tIdx % 4));
    tIdx++;
  }, 600);
  window.__simon = () => ({ state, phase, seq: seq.slice(), idx, hearts, round });
  show('title');
})();
</script>
</body>
</html>
