<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>坦克大作戰</title>
<link rel="stylesheet" href="../../assets/common.css">
<style>
  html, body { height: 100%; overflow: hidden; background: #6b4a2e; overscroll-behavior: none; }
  #game {
    position: fixed; inset: 0; display: block;
    width: 100vw; height: 100vh; height: 100dvh;
    touch-action: none;
  }
  #game.nocursor { cursor: none; }
</style>
</head>
<body>
<canvas id="game" aria-label="坦克大作戰"></canvas>
<script src="../../assets/common.js"></script>
<script>
'use strict';
/* =====================================================================
 * 坦克大作戰：玩具兵團的俯視坦克動作遊戲（原創關卡）
 * ===================================================================== */
const SLUG = 'tank-battle';
const cv = document.getElementById('game');
const ctx = cv.getContext('2d');
const FONT = '"Baloo 2","PingFang TC","Noto Sans TC","Microsoft JhengHei","Heiti TC",system-ui,sans-serif';
let W = 0, H = 0, dpr = 1, U = 1, time = 0;

/* ---------- 數學與緩動 ---------- */
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const lerp = (a, b, t) => a + (b - a) * t;
const TAU = Math.PI * 2;
const Ease = {
  outCubic: t => 1 - Math.pow(1 - t, 3),
  inOutSine: t => -(Math.cos(Math.PI * t) - 1) / 2,
  outBack: t => { const c = 1.70158, c3 = c + 1; return 1 + c3 * Math.pow(t - 1, 3) + c * Math.pow(t - 1, 2); },
  outElastic: t => (t === 0 || t === 1) ? t : Math.pow(2, -10 * t) * Math.sin((t * 10 - 0.75) * (TAU / 3)) + 1
};
function angDiff(a, b) { let d = (a - b) % TAU; if (d > Math.PI) d -= TAU; else if (d < -Math.PI) d += TAU; return d; }
function hrand(x, y, k) {
  let h = (Math.imul(x | 0, 374761393) + Math.imul(y | 0, 668265263) + Math.imul(k | 0, 1442695041)) | 0;
  h = Math.imul(h ^ (h >>> 13), 1274126177);
  return ((h ^ (h >>> 16)) >>> 0) / 4294967296;
}

/* ---------- 補間動畫 ---------- */
let tweens = [];
function tween(obj, to, dur, ease, delay, done) {
  const tw = { obj, to, from: null, dur: dur || 0.3, ease: Ease[ease] || Ease.outCubic, t: -(delay || 0), done };
  tweens.push(tw); return tw;
}
function updateTweens(dt) {
  if (!tweens.length) return;
  const list = tweens.slice();
  for (const tw of list) {
    tw.t += dt;
    if (tw.t < 0) continue;
    if (!tw.from) { tw.from = {}; for (const k in tw.to) tw.from[k] = tw.obj[k]; }
    const p = Math.min(1, tw.t / tw.dur), e = tw.ease(p);
    for (const k in tw.to) tw.obj[k] = tw.from[k] + (tw.to[k] - tw.from[k]) * e;
    if (p >= 1) { const i = tweens.indexOf(tw); if (i >= 0) tweens.splice(i, 1); if (tw.done) tw.done(); }
  }
}

/* ---------- 畫面震動（創傷值） ---------- */
let trauma = 0, shX = 0, shY = 0;
function addShake(a) { trauma = Math.min(1, trauma + a); }
function updateShake(dt) {
  trauma = Math.max(0, trauma - dt * 1.7);
  const k = trauma * trauma * 13;
  shX = k ? (Math.random() * 2 - 1) * k : 0; shY = k ? (Math.random() * 2 - 1) * k : 0;
}

/* ---------- 繪圖小工具 ---------- */
function rrp(g, x, y, w, h, r) {
  r = Math.max(0, Math.min(r, w / 2, h / 2));
  g.beginPath();
  g.moveTo(x + r, y);
  g.arcTo(x + w, y, x + w, y + h, r);
  g.arcTo(x + w, y + h, x, y + h, r);
  g.arcTo(x, y + h, x, y, r);
  g.arcTo(x, y, x + w, y, r);
  g.closePath();
}
function rr(x, y, w, h, r) { rrp(ctx, x, y, w, h, r); }
function shade(hex, amt) {
  const n = parseInt(hex.slice(1), 16);
  const f = v => clamp(v + amt, 0, 255);
  return 'rgb(' + f(n >> 16) + ',' + f((n >> 8) & 255) + ',' + f(n & 255) + ')';
}
function rgba(hex, a) {
  const n = parseInt(hex.slice(1), 16);
  return 'rgba(' + (n >> 16) + ',' + ((n >> 8) & 255) + ',' + (n & 255) + ',' + a + ')';
}
function starPath(g, x, y, R, r, rot) {
  g.beginPath();
  for (let i = 0; i < 10; i++) {
    const a = (rot || 0) + i * Math.PI / 5 - Math.PI / 2, rad = i % 2 ? r : R;
    g.lineTo(x + Math.cos(a) * rad, y + Math.sin(a) * rad);
  }
  g.closePath();
}
function glossyStar(x, y, R, on, rot) {
  ctx.save(); ctx.lineJoin = 'round';
  if (on) {
    ctx.fillStyle = 'rgba(80,50,0,0.3)'; starPath(ctx, x, y + R * 0.12, R, R * 0.5, rot); ctx.fill();
    const g = ctx.createRadialGradient(x - R * 0.3, y - R * 0.4, R * 0.1, x, y, R * 1.1);
    g.addColorStop(0, '#fffbd0'); g.addColorStop(0.45, '#ffd93d'); g.addColorStop(1, '#f39a0c');
    ctx.fillStyle = g; ctx.strokeStyle = '#a8600a'; ctx.lineWidth = Math.max(1.5, R * 0.12);
    starPath(ctx, x, y, R, R * 0.5, rot); ctx.fill(); ctx.stroke();
    ctx.fillStyle = 'rgba(255,255,255,0.75)';
    ctx.beginPath(); ctx.ellipse(x - R * 0.25, y - R * 0.3, R * 0.22, R * 0.12, -0.6, 0, TAU); ctx.fill();
  } else {
    ctx.fillStyle = 'rgba(40,40,30,0.3)'; ctx.strokeStyle = 'rgba(255,255,255,0.35)'; ctx.lineWidth = Math.max(1.5, R * 0.1);
    starPath(ctx, x, y, R, R * 0.5, rot); ctx.fill(); ctx.stroke();
  }
  ctx.restore();
}
/** 有外框與陰影的字 */
function txt(s, x, y, size, fill, o) {
  o = o || {};
  ctx.font = (o.weight || '900') + ' ' + size + 'px ' + FONT;
  ctx.textAlign = o.align || 'center';
  ctx.textBaseline = 'middle';
  ctx.lineJoin = 'round';
  if (o.shadow !== false) {
    ctx.fillStyle = o.shadow || 'rgba(20,25,10,0.35)';
    if (o.stroke) { ctx.strokeStyle = ctx.fillStyle; ctx.lineWidth = o.sw || size * 0.22; ctx.strokeText(s, x, y + size * 0.09); }
    ctx.fillText(s, x, y + size * 0.09);
  }
  if (o.stroke) { ctx.strokeStyle = o.stroke; ctx.lineWidth = o.sw || size * 0.22; ctx.strokeText(s, x, y); }
  ctx.fillStyle = fill; ctx.fillText(s, x, y);
}
function fitSize(s, size, maxW, weight) {
  ctx.font = (weight || '900') + ' ' + size + 'px ' + FONT;
  const w = ctx.measureText(s).width;
  return w > maxW ? size * maxW / w : size;
}
/** 遊戲標題字 */
function logo(s, cx, cy, size, colors, outline) {
  ctx.save();
  ctx.font = '900 ' + size + 'px ' + FONT;
  ctx.textBaseline = 'middle'; ctx.textAlign = 'center'; ctx.lineJoin = 'round';
  const chars = [...s];
  const widths = chars.map(c => ctx.measureText(c).width * 1.02);
  const total = widths.reduce((a, b) => a + b, 0);
  let x = cx - total / 2;
  chars.forEach((c, i) => {
    const w = widths[i];
    const bob = Math.sin(time * 3 + i * 0.7) * size * 0.05;
    const rot = Math.sin(time * 2.2 + i) * 0.05;
    ctx.save();
    ctx.translate(x + w / 2, cy + bob); ctx.rotate(rot);
    ctx.strokeStyle = 'rgba(20,25,10,0.4)'; ctx.lineWidth = size * 0.36;
    ctx.strokeText(c, 0, size * 0.1);
    ctx.strokeStyle = outline; ctx.lineWidth = size * 0.34; ctx.strokeText(c, 0, 0);
    ctx.strokeStyle = '#fff6d8'; ctx.lineWidth = size * 0.16; ctx.strokeText(c, 0, 0);
    const col = colors[i % colors.length];
    const g = ctx.createLinearGradient(0, -size / 2, 0, size / 2);
    g.addColorStop(0, shade(col, 70)); g.addColorStop(0.5, col); g.addColorStop(1, shade(col, -40));
    ctx.fillStyle = g; ctx.fillText(c, 0, 0);
    ctx.globalAlpha = 0.5; ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.ellipse(-w * 0.18, -size * 0.25, size * 0.1, size * 0.05, -0.5, 0, TAU); ctx.fill();
    ctx.restore();
    x += w;
  });
  ctx.restore();
}
function vignette(a) {
  const g = ctx.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.35, W / 2, H / 2, Math.max(W, H) * 0.75);
  g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(1, 'rgba(15,20,5,' + a + ')');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
}
function panel(x, y, w, h, col, r) {
  r = r == null ? 14 * U : r;
  rr(x, y + 4, w, h, r); ctx.fillStyle = 'rgba(15,20,5,0.35)'; ctx.fill();
  rr(x, y, w, h, r);
  const g = ctx.createLinearGradient(0, y, 0, y + h);
  g.addColorStop(0, '#fffaf0'); g.addColorStop(1, '#efe3c4');
  ctx.fillStyle = g; ctx.fill();
  ctx.strokeStyle = col; ctx.lineWidth = Math.max(2, 3 * U); ctx.stroke();
}
function bar(x, y, w, h, p, col, bg) {
  rr(x, y, w, h, h / 2); ctx.fillStyle = bg || 'rgba(30,35,20,0.55)'; ctx.fill();
  if (p > 0) {
    const pw = Math.max(h, w * clamp(p, 0, 1));
    rr(x, y, pw, h, h / 2);
    ctx.fillStyle = col; ctx.fill();
    rr(x + h * 0.3, y + h * 0.15, Math.max(0, pw - h * 0.6), h * 0.3, h * 0.15); ctx.fillStyle = 'rgba(255,255,255,0.45)'; ctx.fill();
  }
}

/* ---------- 按鈕（每一格畫面重新登記） ---------- */
let btnReg = [], pressed = null;
const BTN = {
  green: ['#c9ec8e', '#6aa32f', '#3e6519'], yellow: ['#ffe9a0', '#f2b32a', '#9c650a'], red: ['#ffb9a4', '#e2532c', '#922f12'],
  blue: ['#b8deff', '#3d8fe0', '#1f5793'], khaki: ['#fbf0d2', '#d2bb86', '#86704a'], gray: ['#eef0f2', '#a3abb3', '#596169'],
  orange: ['#ffd2a0', '#ff8a3d', '#a8480f'], purple: ['#e0cdff', '#9468e8', '#4f2f9a']
};
function drawIcon(name, x, y, s, col) {
  ctx.save(); ctx.translate(x, y);
  ctx.fillStyle = col || '#fff'; ctx.strokeStyle = col || '#fff';
  ctx.lineWidth = s * 0.2; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  if (name === 'play') { ctx.beginPath(); ctx.moveTo(-s * 0.32, -s * 0.48); ctx.lineTo(s * 0.48, 0); ctx.lineTo(-s * 0.32, s * 0.48); ctx.closePath(); ctx.fill(); ctx.stroke(); }
  else if (name === 'pause') { rr(-s * 0.36, -s * 0.42, s * 0.24, s * 0.84, s * 0.06); ctx.fill(); rr(s * 0.12, -s * 0.42, s * 0.24, s * 0.84, s * 0.06); ctx.fill(); }
  else if (name === 'replay') {
    ctx.beginPath(); ctx.arc(0, 0, s * 0.4, -Math.PI * 0.3, Math.PI * 1.35); ctx.stroke();
    const a = -Math.PI * 0.3, ex = Math.cos(a) * s * 0.4, ey = Math.sin(a) * s * 0.4;
    ctx.beginPath(); ctx.moveTo(ex + s * 0.2, ey - s * 0.05); ctx.lineTo(ex - s * 0.02, ey + s * 0.25); ctx.lineTo(ex - s * 0.25, ey - s * 0.12); ctx.closePath(); ctx.fill();
  }
  else if (name === 'menu') { for (let i = -1; i <= 1; i += 2) for (let j = -1; j <= 1; j += 2) { rr(i * s * 0.24 - s * 0.16, j * s * 0.24 - s * 0.16, s * 0.32, s * 0.32, s * 0.07); ctx.fill(); } }
  else if (name === 'back') { ctx.beginPath(); ctx.moveTo(s * 0.35, -s * 0.38); ctx.lineTo(-s * 0.15, 0); ctx.lineTo(s * 0.35, s * 0.38); ctx.stroke(); ctx.beginPath(); ctx.moveTo(-s * 0.15, 0); ctx.lineTo(-s * 0.15, 0); ctx.stroke(); }
  else if (name === 'lock') {
    ctx.lineWidth = s * 0.15; ctx.beginPath(); ctx.arc(0, -s * 0.12, s * 0.25, Math.PI, 0); ctx.stroke();
    rr(-s * 0.36, -s * 0.12, s * 0.72, s * 0.58, s * 0.1); ctx.fill();
  }
  else if (name === 'coin') {
    ctx.fillStyle = '#b8780a'; ctx.beginPath(); ctx.arc(0, s * 0.06, s * 0.46, 0, TAU); ctx.fill();
    const g = ctx.createRadialGradient(-s * 0.15, -s * 0.15, s * 0.05, 0, 0, s * 0.5);
    g.addColorStop(0, '#fff6b0'); g.addColorStop(0.6, '#ffcc33'); g.addColorStop(1, '#e09a10');
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(0, 0, s * 0.46, 0, TAU); ctx.fill();
    ctx.strokeStyle = '#c0800c'; ctx.lineWidth = s * 0.08; ctx.beginPath(); ctx.arc(0, 0, s * 0.3, 0, TAU); ctx.stroke();
  }
  else if (name === 'wrench') {
    ctx.rotate(-0.8); ctx.lineWidth = s * 0.2; ctx.beginPath(); ctx.moveTo(0, -s * 0.15); ctx.lineTo(0, s * 0.5); ctx.stroke();
    ctx.beginPath(); ctx.arc(0, -s * 0.28, s * 0.24, 0.9, Math.PI * 2 + 0.2 - 0.9 - 0.2 + 0.3); ctx.stroke();
  }
  else if (name === 'tank') {
    rr(-s * 0.5, -s * 0.05, s, s * 0.42, s * 0.12); ctx.fill();
    rr(-s * 0.28, -s * 0.32, s * 0.5, s * 0.3, s * 0.1); ctx.fill();
    ctx.fillRect(s * 0.1, -s * 0.24, s * 0.48, s * 0.1);
  }
  ctx.restore();
}
/** 立體玩具按鈕。opts: {label, icon, color, onClick, size, pulse, disabled, radius, sub} */
function button(id, x, y, w, h, opts) {
  btnReg.push({ id, x, y, w, h, onClick: opts.onClick, disabled: opts.disabled });
  const pal = BTN[opts.color || 'green'];
  const isDown = pressed && pressed.id === id;
  let s = isDown ? 0.93 : 1;
  if (opts.pulse && !isDown) s *= 1 + Math.sin(time * 5) * 0.035;
  const lip = Math.max(3, h * 0.09);
  ctx.save();
  ctx.translate(x + w / 2, y + h / 2); ctx.scale(s, s);
  if (opts.disabled) ctx.globalAlpha = 0.5;
  const r = opts.radius == null ? Math.min(h / 2, 18 * U) : opts.radius;
  const yo = isDown ? lip * 0.6 : 0;
  rr(-w / 2, -h / 2 + lip + 3, w, h, r); ctx.fillStyle = 'rgba(15,20,5,0.3)'; ctx.fill();
  rr(-w / 2, -h / 2 + lip, w, h, r); ctx.fillStyle = pal[2]; ctx.fill();
  rr(-w / 2, -h / 2 + yo, w, h, r);
  const g = ctx.createLinearGradient(0, -h / 2, 0, h / 2);
  g.addColorStop(0, pal[0]); g.addColorStop(0.55, pal[1]); g.addColorStop(1, shade(pal[1], -18));
  ctx.fillStyle = g; ctx.fill();
  ctx.strokeStyle = pal[2]; ctx.lineWidth = Math.max(2, h * 0.045); ctx.stroke();
  rr(-w / 2 + Math.min(r, h * 0.22), -h / 2 + yo + h * 0.08, w - Math.min(r, h * 0.22) * 2, h * 0.28, h * 0.14);
  ctx.fillStyle = 'rgba(255,255,255,0.4)'; ctx.fill();
  const fs = opts.size || h * 0.4;
  const tc = opts.color === 'khaki' ? '#5a4628' : '#fff';
  const sc = opts.color === 'khaki' ? '#fff6dc' : pal[2];
  const ty = yo + (opts.sub ? -h * 0.13 : 0);
  if (opts.icon && opts.label) {
    ctx.font = '900 ' + fs + 'px ' + FONT;
    const tw = ctx.measureText(opts.label).width;
    const tot = fs * 1.15 + tw;
    drawIcon(opts.icon, -tot / 2 + fs * 0.45, ty, fs * 0.95, opts.icon === 'coin' ? null : tc);
    txt(opts.label, -tot / 2 + fs * 1.15 + tw / 2, ty + 1, fs, tc, { stroke: sc, sw: fs * 0.2, shadow: false });
  } else if (opts.icon) drawIcon(opts.icon, 0, ty, fs * 1.1, tc);
  else if (opts.label != null) txt(opts.label, 0, ty + 1, fs, tc, { stroke: sc, sw: fs * 0.2, shadow: false });
  if (opts.sub) txt(opts.sub, 0, yo + h * 0.27, fs * 0.55, tc, { stroke: sc, sw: fs * 0.14, shadow: false, weight: '800' });
  ctx.restore();
}
/** 找按鈕：先找正中的，沒有的話吸附到附近（寬鬆半徑）的按鈕 */
function hitBtn(x, y, snap) {
  for (let i = btnReg.length - 1; i >= 0; i--) {
    const b = btnReg[i];
    if (!b.disabled && x >= b.x && x <= b.x + b.w && y >= b.y && y <= b.y + b.h + 6) return b;
  }
  if (!snap) return null;
  let best = null, bd = snap;
  for (const b of btnReg) {
    if (b.disabled) continue;
    const dx = Math.max(b.x - x, 0, x - (b.x + b.w)), dy = Math.max(b.y - y, 0, y - (b.y + b.h));
    const d = Math.hypot(dx, dy);
    if (d < bd) { bd = d; best = b; }
  }
  return best;
}

/* ---------- 音效（自己的雜訊產生器 + KG.note） ---------- */
const Sfx = (() => {
  let ac = null, nbuf = null;
  const last = {};
  function A() {
    if (!ac) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return null;
      try { ac = new AC(); } catch (e) { return null; }
      const len = Math.floor(ac.sampleRate * 1.5);
      nbuf = ac.createBuffer(1, len, ac.sampleRate);
      const d = nbuf.getChannelData(0);
      for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    }
    if (ac.state === 'suspended') ac.resume();
    return ac;
  }
  function noise(dur, vol, freq, type, slideTo, delay, q) {
    if (KG.isMuted() || document.hidden) return;
    const a = A(); if (!a) return;
    const t = a.currentTime + (delay || 0);
    const src = a.createBufferSource(); src.buffer = nbuf;
    const f = a.createBiquadFilter(); f.type = type || 'lowpass';
    f.frequency.setValueAtTime(freq, t);
    if (slideTo) f.frequency.exponentialRampToValueAtTime(slideTo, t + dur);
    f.Q.value = q || 0.8;
    const g = a.createGain();
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    src.connect(f); f.connect(g); g.connect(a.destination);
    src.start(t, Math.random() * 0.4); src.stop(t + dur + 0.05);
  }
  function can(name, gap) { const n = performance.now(); if (last[name] && n - last[name] < gap) return false; last[name] = n; return true; }
  const n = (f, d, t, v, dl, sl) => { if (!document.hidden) KG.note(f, d, t, v, dl, sl); };
  return {
    unlock() { A(); },
    shoot() { if (!can('shoot', 45)) return; noise(0.14, 0.32, 2200, 'lowpass', 280); n(170, 0.1, 'square', 0.07, 0, 60); },
    eshoot(d) { if (!can('eshoot', 70)) return; noise(0.12, 0.16 * (d || 1), 1500, 'lowpass', 250); },
    snipe() { if (!can('snipe', 80)) return; noise(0.3, 0.3, 4000, 'highpass', 900); n(1200, 0.18, 'sawtooth', 0.05, 0, 200); },
    hitMetal() { if (!can('hm', 50)) return; n(1400, 0.06, 'square', 0.05, 0, 700); noise(0.06, 0.15, 3500, 'bandpass', 0, 0, 2); },
    hurt() { if (!can('hurt', 80)) return; n(220, 0.18, 'square', 0.1, 0, 90); noise(0.15, 0.3, 900); },
    brick() { if (!can('br', 50)) return; noise(0.22, 0.32, 800, 'lowpass', 180); },
    crack() { if (!can('cr', 50)) return; noise(0.08, 0.2, 1800, 'bandpass', 0, 0, 1.5); },
    wood() { if (!can('wd', 60)) return; noise(0.16, 0.3, 1500, 'bandpass', 500, 0, 1.4); n(240, 0.08, 'triangle', 0.1); },
    boom(big) { if (!can('boom', 60)) return; noise(big ? 1.0 : 0.55, big ? 0.6 : 0.42, big ? 1000 : 1400, 'lowpass', 60); n(big ? 85 : 120, big ? 0.7 : 0.38, 'sine', 0.32, 0, 30); },
    ric() { if (!can('ric', 60)) return; n(2100, 0.14, 'sine', 0.07, 0, 3400); },
    power() { KG.sound('sparkle'); n(660, 0.1, 'triangle', 0.12); n(990, 0.16, 'triangle', 0.12, 0.08); },
    whistle() { if (!can('wh', 120)) return; n(1500, 0.8, 'sine', 0.035, 0, 500); },
    plane() { noise(1.8, 0.22, 400, 'bandpass', 1500, 0, 1.2); n(110, 1.6, 'sawtooth', 0.04, 0, 160); },
    mine() { n(520, 0.07, 'square', 0.07); n(760, 0.07, 'square', 0.07, 0.08); },
    beep() { if (!can('beep', 150)) return; n(1600, 0.05, 'square', 0.04); },
    spawn() { if (!can('sp', 200)) return; n(260, 0.35, 'sine', 0.09, 0, 900); },
    coin() { if (!can('coin', 60)) return; n(988, 0.07, 'square', 0.07); n(1319, 0.18, 'square', 0.07, 0.07); },
    capture() { [523, 659, 784, 1047].forEach((f, i) => n(f, 0.18, 'triangle', 0.16, i * 0.09)); },
    click() { n(880, 0.06, 'sine', 0.14); },
    alarm() { if (!can('al', 900)) return; n(880, 0.15, 'square', 0.05); n(660, 0.15, 'square', 0.05, 0.16); }
  };
})();

/* ---------- 背景音樂（用 KG.note 合成） ---------- */
let userActed = false;
window.addEventListener('pointerdown', () => { userActed = true; Sfx.unlock(); }, { capture: true });

const NOTE_IDX = { C: 0, D: 2, E: 4, F: 5, G: 7, A: 9, B: 11 };
function nf(name) {
  const m = /^([A-G])(#|b)?(\d)$/.exec(name);
  if (!m) return 0;
  const n = NOTE_IDX[m[1]] + (m[2] === '#' ? 1 : m[2] === 'b' ? -1 : 0) + (parseInt(m[3], 10) + 1) * 12;
  return 440 * Math.pow(2, (n - 69) / 12);
}
const Music = {
  on: false, song: null, step: 0, next: 0,
  start(song) {
    if (this.song && this.song.src === song && this.on) return;
    this.song = { src: song, bpm: song.bpm, mel: song.mel.trim().split(/\s+/), bass: (song.bass || '').trim().split(/\s+/), vol: song.vol || 1, wave: song.wave || 'triangle' };
    this.on = true; this.step = 0; this.next = 0.15;
  },
  stop() { this.on = false; },
  update(dt) {
    if (!this.on || !this.song || !userActed) return;
    this.next -= dt;
    if (this.next < -0.3) this.next = 0;
    const s = this.song, beat = 60 / s.bpm / 2;
    while (this.next <= 0) {
      if (!KG.isMuted() && !document.hidden) {
        const i = this.step % s.mel.length, tok = s.mel[i];
        if (tok !== '-' && tok !== '.') {
          let len = 1;
          while (s.mel[(i + len) % s.mel.length] === '-' && len < 8) len++;
          const f = nf(tok);
          KG.note(f, beat * len * 0.9, s.wave, 0.045 * s.vol);
          KG.note(f * 2, beat * len * 0.4, 'sine', 0.012 * s.vol);
        }
        if (s.bass.length > 1) {
          const bi = this.step % s.bass.length, bt = s.bass[bi];
          if (bt !== '-' && bt !== '.') KG.note(nf(bt), beat * 1.6, 'triangle', 0.065 * s.vol);
        }
        if (this.step % 4 === 2) KG.note(90, 0.06, 'square', 0.025 * s.vol, 0, 50);
      }
      this.step++;
      this.next += beat;
    }
  }
};

const SR = 3; // 圖片每單位像素
function mk(w, h, res) {
  const r = res || SR;
  const c = document.createElement('canvas');
  c.width = Math.max(1, Math.ceil(w * r)); c.height = Math.max(1, Math.ceil(h * r));
  const g = c.getContext('2d'); g.scale(r, r);
  return [c, g];
}
function radialSprite(size, stops) {
  const [c, g] = mk(size, size, 1);
  const gr = g.createRadialGradient(size / 2, size / 2, 0, size / 2, size / 2, size / 2);
  stops.forEach(s => gr.addColorStop(s[0], s[1]));
  g.fillStyle = gr; g.fillRect(0, 0, size, size);
  return c;
}
const SPR = {};
const treadCache = {};
function buildTread(L, tw) {
  const key = L.toFixed(1) + 'x' + tw.toFixed(1);
  if (treadCache[key]) return treadCache[key];
  const frames = [];
  for (let k = 0; k < 4; k++) {
    const [c, g] = mk(L, tw);
    rrp(g, 0, 0, L, tw, tw * 0.45); g.fillStyle = '#2a2e33'; g.fill();
    g.save(); rrp(g, 0, 0, L, tw, tw * 0.45); g.clip();
    g.fillStyle = '#59616a';
    for (let x = -4 + k; x < L + 4; x += 4) g.fillRect(x, 0.5, 1.7, tw - 1);
    g.fillStyle = 'rgba(255,255,255,0.13)'; g.fillRect(0, 0, L, tw * 0.3);
    g.fillStyle = 'rgba(0,0,0,0.25)'; g.fillRect(0, tw * 0.75, L, tw * 0.25);
    g.restore();
    g.strokeStyle = '#15181b'; g.lineWidth = 0.8; rrp(g, 0.4, 0.4, L - 0.8, tw - 0.8, tw * 0.42); g.stroke();
    frames.push(c);
  }
  treadCache[key] = frames;
  return frames;
}

/* ---------- 出兵 ---------- */
function aliveEnemies() { let n = 0; for (const e of enemies) if (e.alive) n++; return n; }
function pickSpawn() {
  const ok = spawns.filter(s => {

    for (const e of enemies) if (e.alive && Math.hypot(e.x - s.x, e.y - s.y) < T * 0.9) return false;
    return true;
  });
  return ok.length ? ok[(Math.random() * ok.length) | 0] : null;
}
function survivalWave() {

  const n = 3 + Math.floor(k * 1.4);
  const pool = ['light'];
  if (k >= 2) pool.push('heavy');
  if (k >= 3) pool.push('miner', 'light');
  if (k >= 4) pool.push('arty');
  if (k >= 5) pool.push('sniper');
  if (k >= 7) pool.push('heavy');
  const q = [];
  for (let i = 0; i < n; i++) q.push(pool[(Math.random() * pool.length) | 0]);
  if (k % 5 === 0) q.push('boss');
  gst.waveQ = q;
  gst.maxAlive = Math.min(3 + Math.floor(k / 2), 8);
  gst.interval = Math.max(1.0, 2.4 - k * 0.1);
  flashMsg('第 ' + k + ' 波來襲！');

}
function updateSpawner(dt) {

    gst.waveT -= dt;
    if (gst.waveT <= 0) { survivalWave(); gst.waveT = 3; gst.spawnT = 0.5; }

  }
  if (!gst.waveQ.length && (obj === 'survive' || obj === 'capture' || obj === 'escort')) gst.waveQ = LV.def.waves.split('').map(c => KCODE[c]);
  if (!gst.waveQ.length) return;
  gst.spawnT -= dt;
  if (gst.spawnT <= 0 && aliveEnemies() < gst.maxAlive) {
    const s = pickSpawn();

    else gst.spawnT = 0.5;

}

    const c = gst.coins + Math.floor(gst.score / 60);

  }
  if (!gst.won) { const c = Math.floor(gst.coins / 2); addCoins(c); return { won: false, stars: 0, score: gst.score, coins: c, reason: gst.reason }; }
  let stars = 1;

  const timeBonus = def.obj === 'survive' ? 0 : Math.max(0, Math.round((def.par * 1.5 - gst.t) * 10));
  const score = gst.score + timeBonus + (gst.lives * 200) + stars * 300;

/* =====================================================================
 * 測試用自動駕駛（也拿來驗證每關都破得了）
 * ===================================================================== */
const bot = { path: null, pi: 0, think: 0, goal: null, stuck: 0, lx: 0, ly: 0, jig: 0 };
function botThink(dt) {
  const p = player;
  I.mx = I.my = 0; I.aim = null; I.fire = false; I.mine = false; I.air = false; I.tap = false;
  if (!p.alive) return;
  const obj = LV.def.obj;
  // 1) 射擊：最近、看得到的敵人
  const tgt = nearestVisibleEnemy(T * 12);
  if (tgt) { I.aim = leadAngle(p, tgt, KIND.player.bs, 1); I.fire = Math.abs(angDiff(I.aim, p.tang)) < 0.2; }
  if (p.air > 0 && enemies.filter(e => e.alive).length >= 3) I.air = true;
  // 2) 移動目標
  bot.think -= dt;
  if (bot.think <= 0) {
    bot.think = 0.5;
    let goal = null;
    if (obj === 'escort' && convoy && convoy.alive) {
      const d = Math.hypot(convoy.x - p.x, convoy.y - p.y);
      const ahead = convoy.path && convoy.path[Math.min(convoy.path.length - 1, convoy.pi + 2)];
      if (d > T * 2.5 || !ahead) goal = tileOf(convoy);
      else goal = [ahead % LV.w, (ahead / LV.w) | 0];
      if (tgt && Math.hypot(tgt.x - p.x, tgt.y - p.y) < T * 4 && d < T * 4) goal = null;
    } else if (obj === 'capture') {
      const z = zones.find(z => !z.done);
      if (z) goal = [Math.floor(z.x / T), Math.floor(z.y / T)];
      if (z && Math.hypot(z.x - p.x, z.y - p.y) < z.r * 0.5) goal = null;
    } else {
      let best = null, bd = 1e9;
      for (const e of enemies) if (e.alive && e.spawnT <= 0) { const d = Math.hypot(e.x - p.x, e.y - p.y); if (d < bd) { bd = d; best = e; } }
      if (obj === 'defend' && hq && !best) goal = [hq.tx, hq.ty + 2];
      else if (best) { if (!(tgt === best && bd < T * 3.5)) goal = tileOf(best); }
    }
    bot.goal = goal;
    if (goal) { const [sx, sy] = tileOf(p); bot.path = astar(sx, sy, clamp(goal[0], 0, LV.w - 1), clamp(goal[1], 0, LV.h - 1), 3); bot.pi = 0; }
    else bot.path = null;
  }
  if (bot.path && bot.pi < bot.path.length) {
    const idx = bot.path[bot.pi], t = LV.tiles[idx];
    const wx = (idx % LV.w) * T + T / 2, wy = ((idx / LV.w) | 0) * T + T / 2;
    const dx = wx - p.x, dy = wy - p.y, d = Math.hypot(dx, dy);
    if (SOLID_TANK[t]) {
      if (!tgt) { I.aim = Math.atan2(dy, dx); I.fire = Math.abs(angDiff(I.aim, p.tang)) < 0.15; }
      if (d > T * 1.05) { I.mx = dx / d; I.my = dy / d; }
      if (t !== BR && t !== WD) bot.path = null;
    } else if (d < 8) bot.pi++;
    else { I.mx = dx / d; I.my = dy / d; }
  }
  // 卡住就亂動一下
  bot.stuck += dt;
  if (bot.stuck > 1.2) { if ((I.mx || I.my) && Math.hypot(p.x - bot.lx, p.y - bot.ly) < 5) { bot.jig = 0.5; bot.think = 0; } bot.stuck = 0; bot.lx = p.x; bot.ly = p.y; }
  if (bot.jig > 0) { bot.jig -= dt; const a = time * 3; I.mx = Math.cos(a); I.my = Math.sin(a); }
  if (!I.fire && !tgt && I.aim == null && (I.mx || I.my)) I.aim = Math.atan2(I.my, I.mx);
}

/* =====================================================================
 * 主更新
 * ===================================================================== */
function stepGame(dt) {
  if (hitStopT > 0) { hitStopT -= dt; updateParticles(dt * 0.2); return; }
  pathBudget = 3;
  if (!gst.over) gst.t += dt;
  if (gst.introT > 0) gst.introT -= dt;
  if (gst.msgT > 0) gst.msgT -= dt;
  if (gst.hqWarnT > 0) gst.hqWarnT -= dt;
  readInput(dt);
  if (!gst.over || gst.won) updatePlayer(dt);
  for (let i = 0; i < enemies.length; i++) if (enemies[i].alive) updateEnemy(enemies[i], dt);
  if (!gst.over) updateConvoy(dt);
  resolveTankPairs();
  updateBullets(dt);
  updateShells(dt);
  updateMines(dt);
  updatePowerups(dt);
  updatePlane(dt);
  if (!gst.over) { updateSpawner(dt); updateZones(dt); checkWin(); }
  if (hq) hq.hitT -= dt;
  // 冒煙：受傷的坦克
  if (quality > 0) {
    allTanks(t => { if (!t.isTruck && t.hp < t.maxHp * 0.4 && Math.random() < 0.12) addP(0, t.x, t.y, 0, -12, 0.9, 6, { img: IMG.dsmoke, grow: 14, a: 0.6 }); });
  }
  for (let i = enemies.length - 1; i >= 0; i--) if (!enemies[i].alive) enemies.splice(i, 1);
  updateParticles(dt);
  if (gst.over) {
    gst.endT -= dt;
    if (gst.endT <= 0 && !Result.on && scene === 'play') showResult();
  }
}
function updateBullets(dt) {
  for (let i = bCount - 1; i >= 0; i--) {
    const b = bullets[i];
    b.life -= dt;
    if (b.life <= 0) { killBullet(i); continue; }
    const sp = Math.hypot(b.vx, b.vy);
    const n = Math.max(1, Math.ceil(sp * dt / 6));
    let dead = false;
    for (let s = 0; s < n && !dead; s++) {
      const px = b.x, py = b.y;
      b.x += b.vx * dt / n; b.y += b.vy * dt / n;
      const tx = Math.floor(b.x / T), ty = Math.floor(b.y / T);
      if (tx < 0 || ty < 0 || tx >= LV.w || ty >= LV.h) { sparks(b.x, b.y, 3, null, 0, 90); dead = true; break; }
      const idx = ty * LV.w + tx, t = LV.tiles[idx];
      if (SOLID_BUL[t]) {
        if (t === ST && b.bounce > 0) {
          const ptx = Math.floor(px / T), pty = Math.floor(py / T);
          let fx = ptx !== tx, fy = pty !== ty;
          if (fx && fy) { if (SOLID_BUL[tileAt(tx, pty)]) fy = false; else if (SOLID_BUL[tileAt(ptx, ty)]) fx = false; }
          if (fx) b.vx = -b.vx; if (fy) b.vy = -b.vy;
          if (!fx && !fy) { b.vx = -b.vx; b.vy = -b.vy; }
          b.x = px; b.y = py; b.bounce--;
          sparks(px, py, 5, Math.atan2(b.vy, b.vx), 1.2, 150, '#e8f6ff'); Sfx.ric();
          continue;
        }
        if (t === ST) { sparks(px, py, 5, Math.atan2(-b.vy, -b.vx), 1.4, 150, '#e8f6ff'); Sfx.hitMetal(); }
        else if (t === HQT && b.team === 0) { sparks(px, py, 3, null, 0, 90); }
        else { damageTile(idx, b.dmg, b.team); sparks(px, py, 4, Math.atan2(-b.vy, -b.vx), 1.4, 120, '#ffcf8a'); }
        dead = true; break;
      }
      if (b.team === 0) {
        for (let k = 0; k < enemies.length; k++) {
          const e = enemies[k];
          if (!e.alive || e.spawnT > 0) continue;
          const dx = e.x - b.x, dy = e.y - b.y, rr2 = e.r + b.r;
          if (dx * dx + dy * dy < rr2 * rr2) { damageTank(e, b.dmg, px, py, 0); dead = true; break; }
        }
      } else {
        if (player.alive) {
          const dx = player.x - b.x, dy = player.y - b.y, rr2 = player.r + b.r;
          if (dx * dx + dy * dy < rr2 * rr2) { damageTank(player, b.dmg, px, py, 1); dead = true; }
        }
        if (!dead && convoy && convoy.alive) {
          const dx = convoy.x - b.x, dy = convoy.y - b.y, rr2 = convoy.r + b.r;
          if (dx * dx + dy * dy < rr2 * rr2) { damageTank(convoy, b.dmg, px, py, 1); dead = true; }
        }
      }
    }
    if (dead) { addP(1, b.x, b.y, 0, 0, 0.12, 8, { img: IMG.fire, grow: 30 }); killBullet(i); }
  }
  // 子彈互撞抵消
  for (let i = bCount - 1; i >= 0; i--) {
    const a = bullets[i];
    if (a.team !== 0) continue;
    for (let j = bCount - 1; j >= 0; j--) {
      const b = bullets[j];
      if (b.team !== 1) continue;
      const dx = a.x - b.x, dy = a.y - b.y;
      if (dx * dx + dy * dy < 81) {
        sparks((a.x + b.x) / 2, (a.y + b.y) / 2, 6, null, 0, 120, '#fff');
        a.life = 0; b.life = 0;
        break;
      }
    }
  }
}

    const lim = (maxSec || 400) * 60; let i = 0;
    while (i < lim && !gst.over) { stepGame(STEP); i++; }
    const r = { level: l, won: gst.won, over: gst.over, t: +gst.t.toFixed(1), kills: gst.kills, total: gst.total, reason: gst.reason, astar: astarCalls };
    for (let k = 0; k < 200 && !Result.on; k++) stepGame(STEP);
    botOn = false; godMode = prevG;
    r.result = lastResult;
    return r;
  },
  tests: runTests,
  levels: LEVELS.length,
  unlockAll(on) { unlockAll = on !== false; },
  setCoins(n) { coins = n; Save.set('coins', n); },
  upgrades() { return Object.assign({}, upg); },
  pause: pauseGame, resume: resumeGame, scene: () => scene,
  go(s) { if (s === 'title') goTitle(); else if (s === 'levels') goLevels(); else if (s === 'garage') goGarage(); },
  enemies() { return enemies.map(e => ({ kind: e.kind, x: Math.round(e.x), y: Math.round(e.y), hp: e.hp, spawn: e.spawnT > 0 })); },
  spawn(kind, tx, ty) { return !!addEnemy(kind, tx * T + T / 2, ty * T + T / 2, false); },
  kill() { for (const e of enemies) if (e.alive) killTank(e); gst.waveQ = []; },
  give(k) { dropPower(player.x, player.y, k); },
  btns() { return btnReg.map(b => ({ id: b.id, x: Math.round(b.x), y: Math.round(b.y), w: Math.round(b.w), h: Math.round(b.h) })); },
  quality(q) { if (q != null) { quality = q; resizeCanvas(); } return quality; },
  tile(tx, ty) { return tileAt(tx, ty); }
};
