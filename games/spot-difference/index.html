  /* 選關 */
  .lv-scr { background: var(--lvbg, linear-gradient(180deg, rgba(255,240,248,.95), rgba(255,250,235,.97))); justify-content: flex-start; overflow-y: auto; touch-action: pan-y; }

  /* 遊戲中的小按鈕 */
  .gk-round {

  .gk-banner { position: fixed; left: 50%; top: 40%; transform: translate(-50%, -50%); z-index: 8200; display: none; text-align: center; pointer-events: none; width: max-content; max-width: 96vw; }
  .gk-banner.show { display: block; animation: gk-in-c .5s cubic-bezier(.2,1.5,.4,1) both; }
  .gk-banner .t1 { font-size: clamp(32px, 9.5vw, 56px); font-weight: 900; color: #fff; --o: var(--outline, #c2416c);
    text-shadow: 0 -3px 0 var(--o), 0 3px 0 var(--o), -3px 0 0 var(--o), 3px 0 0 var(--o), -2px -2px 0 var(--o), 2px -2px 0 var(--o), -2px 2px 0 var(--o), 2px 2px 0 var(--o), 0 8px 0 var(--o), 0 12px 16px rgba(0,0,0,.3); white-space: nowrap; }
  .gk-banner .t2 { display: inline-block; margin-top: 10px; font-size: clamp(16px, 4.4vw, 22px); font-weight: 900; color: var(--ink, #4a3b52); background: #fffdf3; border: 3px solid var(--b1, #ffd27a); border-radius: 999px; padding: 6px 18px; box-shadow: var(--kg-shadow); }
  body { background: #e8f5d6; --outline: #6a4fc0; --outline2: rgba(60, 30, 120, .45); --b1: #b49cff; --b2: #7a5ae0; --b3: #533aa8;
    --r1: #b49cff; --r2: #7a5ae0; --r3: #533aa8; --card2: #f4f0ff; --vig: rgba(60, 30, 110, .35);

  .shud { position: fixed; top: 12px; left: 50%; transform: translateX(-50%); width: max-content; max-width: calc(100vw - 128px); z-index: 8000; display: none; gap: 8px; pointer-events: none; }
  .shud.show { display: flex; }
  .tag {
    display: flex; align-items: center; gap: 5px; height: 46px; padding: 0 12px; border-radius: 16px; font-weight: 900; font-size: 19px; color: #4a3b7a; white-space: nowrap;
    background: linear-gradient(180deg, #fff, #efe9ff); border: 3px solid #fff; box-shadow: 0 5px 0 #8f7ad6, 0 8px 16px rgba(60,30,120,.2);
  }
  .dot { width: 22px; height: 22px; border-radius: 50%; background: #e3dcf5; box-shadow: inset 0 2px 3px rgba(0,0,0,.18); display: grid; place-items: center; }
  .dot.on { background: radial-gradient(circle at 35% 30%, #fff 0 15%, #ff7aa2 16% 100%); box-shadow: 0 2px 0 #c2416c; animation: kg-pop .45s cubic-bezier(.2,1.6,.4,1); }
  .dot.on::after { content: ''; width: 9px; height: 5px; border-left: 3px solid #fff; border-bottom: 3px solid #fff; transform: translateY(-1px) rotate(-45deg); }
  @media (max-width: 379px) { #hudLv { display: none; } }
  #hintBtn {
    position: fixed; z-index: 7600; display: none; width: 76px; height: 76px; border-radius: 50%; border: 5px solid #fff; cursor: pointer; padding: 0;
    background: conic-gradient(#ffd23f calc(var(--p, 1) * 360deg), #d8d0ea 0); box-shadow: 0 6px 0 #b58a10, 0 10px 18px rgba(0,0,0,.2);
  }
  #hintBtn.show { display: block; }
  #hintBtn .in { position: absolute; inset: 6px; border-radius: 50%; background: linear-gradient(180deg, #fff6c8, #ffd85a); display: grid; place-items: center; }
  #hintBtn.wait .in { background: linear-gradient(180deg, #f3f0f8, #ddd6ea); }
  #hintBtn.ready { animation: gk-breathe 1.2s ease-in-out infinite; }

  #hintBtn:active { transform: translateY(4px) scale(.95); }
  #hintBtn small { position: absolute; bottom: -24px; left: 50%; transform: translateX(-50%); font-size: 15px; font-weight: 900; color: #4a3b7a; white-space: nowrap; text-shadow: 0 1px 0 #fff, 0 -1px 0 #fff, 1px 0 0 #fff, -1px 0 0 #fff; }

<body>
<canvas id="cv" class="gk-canvas"></canvas>
<div class="shud" id="hud"><div class="tag" id="hudLv">第 1 關</div><div class="tag" id="hudDots"></div></div>
<button id="hintBtn" aria-label="提示"><div class="in"><svg viewBox="0 0 40 40"><circle cx="17" cy="17" r="10" fill="#dff4ff" stroke="#6a4fc0" stroke-width="4"/><path d="M24 24l9 9" stroke="#6a4fc0" stroke-width="6" stroke-linecap="round"/><path d="M12 14a6 6 0 0 1 5-4" stroke="#fff" stroke-width="3" stroke-linecap="round" fill="none"/></svg></div><small>提示</small></button>
<script src="../../assets/common.js"></script>
<script>
'use strict';
(() => {
  /* ===================== 共用遊戲套件（每個遊戲內嵌一份） ===================== */
  const TAU = Math.PI * 2;
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const lerp = (a, b, t) => a + (b - a) * t;
  const Ease = {
    linear: t => t,
    outQuad: t => 1 - (1 - t) * (1 - t),
    outCubic: t => 1 - Math.pow(1 - t, 3),
    inCubic: t => t * t * t,
    inQuad: t => t * t,
    inOutSine: t => -(Math.cos(Math.PI * t) - 1) / 2,
    outBack: t => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); },
    outElastic: t => t === 0 ? 0 : t === 1 ? 1 : Math.pow(2, -10 * t) * Math.sin((t * 10 - 0.75) * TAU / 3) + 1,
    outBounce: t => {
      const n1 = 7.5625, d1 = 2.75;
      if (t < 1 / d1) return n1 * t * t;
      if (t < 2 / d1) return n1 * (t -= 1.5 / d1) * t + 0.75;
      if (t < 2.5 / d1) return n1 * (t -= 2.25 / d1) * t + 0.9375;
      return n1 * (t -= 2.625 / d1) * t + 0.984375;
    }
  };

  /** 補間動畫：Tween.to(物件, {屬性: 目標}, 秒, 緩動, 延遲, 完成時) */
  const Tween = {
    list: [],
    to(obj, props, dur, ease, delay, done) {
      const tw = { obj, props, dur: Math.max(0.001, dur), ease: typeof ease === 'function' ? ease : (Ease[ease] || Ease.outCubic), t: -(delay || 0), from: null, done };
      this.list.push(tw);
      return tw;
    },
    update(dt) {
      const list = this.list.slice();
      for (let i = 0; i < list.length; i++) {
        const tw = list[i];
        if (tw.dead) continue;
        tw.t += dt;
        if (tw.t < 0) continue;
        if (!tw.from) { tw.from = {}; for (const k in tw.props) tw.from[k] = tw.obj[k]; }
        const k = Math.min(1, tw.t / tw.dur), e = tw.ease(k);
        for (const p in tw.props) tw.obj[p] = tw.from[p] + (tw.props[p] - tw.from[p]) * e;
        if (k >= 1) { tw.dead = true; if (tw.done) tw.done(); }
      }
      this.list = this.list.filter(t => !t.dead);
    },
    kill(obj, prop) { this.list.forEach(t => { if (t.obj === obj && (!prop || prop in t.props)) t.dead = true; }); },
    clear() { this.list.forEach(t => { t.dead = true; }); this.list = []; },
    busy(obj) { return this.list.some(t => !t.dead && (!obj || t.obj === obj)); }
  };

  /** 畫圖小工具 */
  const Draw = {
    rr(c, x, y, w, h, r) { c.beginPath(); c.roundRect(x, y, w, h, r); },
    starPath(c, x, y, r, inner, rot) {
      c.beginPath();
      for (let i = 0; i < 10; i++) {
        const rr = i % 2 ? r * (inner || 0.5) : r, a = (rot || 0) - Math.PI / 2 + i * Math.PI / 5;
        c.lineTo(x + Math.cos(a) * rr, y + Math.sin(a) * rr);
      }
      c.closePath();
    },
    heartPath(c, x, y, s) {
      c.beginPath();
      c.moveTo(x, y + s * 0.35);
      c.bezierCurveTo(x - s * 0.1, y + s * 0.25, x - s * 0.55, y + s * 0.02, x - s * 0.5, y - s * 0.22);
      c.bezierCurveTo(x - s * 0.45, y - s * 0.5, x - s * 0.08, y - s * 0.5, x, y - s * 0.25);
      c.bezierCurveTo(x + s * 0.08, y - s * 0.5, x + s * 0.45, y - s * 0.5, x + s * 0.5, y - s * 0.22);
      c.bezierCurveTo(x + s * 0.55, y + s * 0.02, x + s * 0.1, y + s * 0.25, x, y + s * 0.35);
      c.closePath();
    },
    /** 有光澤的星星 */
    star(c, x, y, r, on) {
      Draw.starPath(c, x, y + r * 0.08, r, 0.52);
      c.fillStyle = 'rgba(120,70,0,.25)'; c.fill();
      Draw.starPath(c, x, y, r, 0.52);
      const g = c.createLinearGradient(0, y - r, 0, y + r);
      if (on !== false) { g.addColorStop(0, '#fff3a0'); g.addColorStop(0.5, '#ffd23f'); g.addColorStop(1, '#f59e0b'); }
      else { g.addColorStop(0, '#eee'); g.addColorStop(1, '#bbb'); }
      c.fillStyle = g; c.fill();
      c.lineWidth = Math.max(1.5, r * 0.12); c.strokeStyle = on !== false ? '#d9822b' : '#999'; c.lineJoin = 'round'; c.stroke();
      c.fillStyle = 'rgba(255,255,255,.6)';
      c.beginPath(); c.ellipse(x - r * 0.2, y - r * 0.28, r * 0.18, r * 0.1, -0.6, 0, TAU); c.fill();
    },
    /** 可愛大眼睛。mode: open / happy / closed / sad / dizzy */
    eye(c, x, y, r, mode, lookX, lookY, ink) {
      ink = ink || '#3a2440';
      if (mode === 'happy') {
        c.strokeStyle = ink; c.lineWidth = r * 0.45; c.lineCap = 'round';
        c.beginPath(); c.arc(x, y + r * 0.35, r * 0.75, Math.PI * 1.15, Math.PI * 1.85); c.stroke();
        return;
      }
      if (mode === 'closed') {
        c.strokeStyle = ink; c.lineWidth = r * 0.4; c.lineCap = 'round';
        c.beginPath(); c.arc(x, y - r * 0.2, r * 0.7, Math.PI * 0.15, Math.PI * 0.85); c.stroke();
        return;
      }
      if (mode === 'dizzy') {
        c.strokeStyle = ink; c.lineWidth = r * 0.3; c.lineCap = 'round';
        c.beginPath();
        for (let a = 0; a < TAU * 1.6; a += 0.3) { const rr = r * 0.9 * a / (TAU * 1.6); c.lineTo(x + Math.cos(a) * rr, y + Math.sin(a) * rr); }
        c.stroke();
        return;
      }
      c.fillStyle = ink;
      c.beginPath(); c.ellipse(x, y, r * 0.86, r, 0, 0, TAU); c.fill();
      const lx = (lookX || 0) * r * 0.2, ly = (lookY || 0) * r * 0.2;
      c.fillStyle = '#fff';
      c.beginPath(); c.arc(x - r * 0.3 + lx, y - r * 0.38 + ly, r * 0.36, 0, TAU); c.fill();
      c.beginPath(); c.arc(x + r * 0.3 + lx, y + r * 0.35 + ly, r * 0.16, 0, TAU); c.fill();
      if (mode === 'sad') {
        c.strokeStyle = ink; c.lineWidth = r * 0.25; c.lineCap = 'round';
        c.beginPath(); c.moveTo(x - r * 0.8, y - r * 1.5); c.lineTo(x + r * 0.6, y - r * 1.2); c.stroke();
      }
    },
    blush(c, x, y, r, a) {
      c.fillStyle = 'rgba(255,105,140,' + (a == null ? 0.45 : a) + ')';
      c.beginPath(); c.ellipse(x, y, r, r * 0.62, 0, 0, TAU); c.fill();
    },
    shadow(c, x, y, rx, ry, a) {

      g.addColorStop(0, 'rgba(30,20,50,' + (a == null ? 0.3 : a) + ')'); g.addColorStop(1, 'rgba(30,20,50,0)');

    /** 雲朵 */
    cloud(c, x, y, s, a) {
      c.save(); c.translate(x, y); c.scale(s, s);
      c.globalAlpha *= (a == null ? 1 : a);
      c.fillStyle = 'rgba(150,180,220,.35)';
      c.beginPath(); c.ellipse(4, 26, 64, 10, 0, 0, TAU); c.fill();
      const g = c.createLinearGradient(0, -34, 0, 30);
      g.addColorStop(0, '#ffffff'); g.addColorStop(1, '#e3efff');
      c.fillStyle = g;
      c.beginPath();
      [[-38, 10, 22], [-14, -4, 30], [16, -8, 28], [42, 8, 20], [2, 12, 26]].forEach(([a1, b, r]) => { c.moveTo(a1 + r, b); c.arc(a1, b, r, 0, TAU); });
      c.fill();
      c.fillStyle = 'rgba(255,255,255,.9)';

  /** 粒子特效、浮動文字、畫面震動 */
  const FX = {
    parts: [], texts: [], rings: [], shakeT: 0, shakeMag: 0, hitStop: 0,
    burst(x, y, o) {
      o = o || {};
      const n = o.n || 14;
      for (let i = 0; i < n; i++) {
        const a = o.angle != null ? o.angle + KG.rand(-(o.spread || 0.6), o.spread || 0.6) : Math.random() * TAU;
        const v = KG.rand(o.speedMin || 80, o.speed || 260);
        this.parts.push({
          x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - (o.up == null ? 60 : o.up), g: o.gravity == null ? 420 : o.gravity,
          life: 1, decay: 1 / (o.life || 0.9) * KG.rand(0.8, 1.2), r: KG.rand(o.size || 6, (o.size || 6) * 1.7),
          rot: Math.random() * TAU, vr: KG.rand(-6, 6), shape: o.shape || 'star', c: KG.pick(o.colors || ['#ffd23f', '#ff8fb1', '#7fd1ff', '#9be27f', '#fff'])
        });
      }
    },
    ring(x, y, color, size) { this.rings.push({ x, y, r: 4, max: size || 60, life: 1, color: color || '#fff' }); },
    text(str, x, y, o) {
      o = o || {};
      if (o.tag) this.texts = this.texts.filter(t => t.tag !== o.tag);
      this.texts.push({ tag: o.tag, str, x, y, vy: o.vy == null ? -70 : o.vy, life: 1, dur: o.dur || 1.1, size: o.size || 30, color: o.color || '#fff', stroke: o.stroke || '#c2416c', scale: 0 });
    },
    shake(mag, t) { this.shakeMag = Math.max(this.shakeMag, mag); this.shakeT = Math.max(this.shakeT, t || 0.3); },
    update(dt) {
      this.parts.forEach(p => { p.vy += p.g * dt; p.x += p.vx * dt; p.y += p.vy * dt; p.vx *= 0.99; p.rot += p.vr * dt; p.life -= p.decay * dt; });
      this.parts = this.parts.filter(p => p.life > 0);
      this.rings.forEach(r => { r.life -= dt * 2.2; r.r = lerp(r.max, 4, Math.max(0, r.life)); });
      this.rings = this.rings.filter(r => r.life > 0);
      this.texts.forEach(t => { t.life -= dt / t.dur; t.y += t.vy * dt; t.vy *= 0.97; t.scale = Math.min(1, t.scale + dt * 5); });
      this.texts = this.texts.filter(t => t.life > 0);
      this.shakeT = Math.max(0, this.shakeT - dt);
      if (this.shakeT <= 0) this.shakeMag = 0;
    },
    offset() {
      if (this.shakeT <= 0) return [0, 0];
      const m = this.shakeMag * Math.min(1, this.shakeT * 4);
      return [KG.rand(-m, m), KG.rand(-m, m)];
    },
    draw(c, font) {
      this.rings.forEach(r => {
        c.globalAlpha = Math.max(0, r.life); c.strokeStyle = r.color; c.lineWidth = 5 * r.life + 1;
        c.beginPath(); c.arc(r.x, r.y, r.r, 0, TAU); c.stroke();
      });
      this.parts.forEach(p => {
        c.globalAlpha = Math.min(1, p.life * 1.6);
        c.fillStyle = p.c;
        c.save(); c.translate(p.x, p.y); c.rotate(p.rot);
        if (p.shape === 'star') { Draw.starPath(c, 0, 0, p.r, 0.45); c.fill(); }
        else if (p.shape === 'heart') { Draw.heartPath(c, 0, 0, p.r * 2); c.fill(); }
        else if (p.shape === 'confetti') { c.fillRect(-p.r * 0.6, -p.r * 0.3, p.r * 1.2, p.r * 0.6); }
        else { c.beginPath(); c.arc(0, 0, p.r * 0.7, 0, TAU); c.fill(); }
        c.restore();
      });
      c.globalAlpha = 1;
      this.texts.forEach(t => {
        const s = Ease.outBack(Math.min(1, t.scale));
        c.save(); c.translate(t.x, t.y); c.scale(s, s);
        c.globalAlpha = Math.min(1, t.life * 3);
        c.font = '900 ' + t.size + 'px ' + (font || 'sans-serif');
        c.textAlign = 'center'; c.textBaseline = 'middle'; c.lineJoin = 'round';
        c.lineWidth = t.size * 0.28; c.strokeStyle = t.stroke; c.strokeText(t.str, 0, 0);
        c.fillStyle = t.color; c.fillText(t.str, 0, 0);
        c.restore();
      });
      c.globalAlpha = 1;
    },
    clear() { this.parts = []; this.texts = []; this.rings = []; this.shakeT = 0; this.hitStop = 0; }
  };

  /** 背景音樂：用 KG.note 合成的循環小旋律（靜音時不發聲） */
  const Music = {
    timer: null, song: null, step: 0, next: 0,
    midi(m) { return 440 * Math.pow(2, (m - 69) / 12); },
    start(song) {
      this.stop();
      this.song = song; this.step = 0; this.next = performance.now() + 120;
      this.timer = setInterval(() => this.tick(), 50);
    },
    stop() { if (this.timer) clearInterval(this.timer); this.timer = null; this.song = null; },
    tick() {
      const s = this.song; if (!s) return;
      const now = performance.now();
      if (document.hidden || KG.isMuted() || !Music.unlocked) { this.next = now + 100; return; }
      const beat = 60000 / s.bpm / 2; // 八分音符
      if (this.next < now - 500) this.next = now;
      while (this.next < now + 160) {
        const delay = Math.max(0, (this.next - now) / 1000);
        const m = s.mel[this.step % s.mel.length];
        if (m) KG.note(this.midi(m), beat / 1000 * (s.legato || 0.9), s.wave || 'triangle', s.vol || 0.05, delay);
        if (s.bass) {
          const b = s.bass[this.step % s.bass.length];
          if (b) KG.note(this.midi(b), beat / 1000 * 1.6, 'sine', (s.vol || 0.05) * 1.2, delay);
        }
        this.step++;
        this.next += beat;
      }
    }
  };

  // 使用者第一次互動後才開始發聲（瀏覽器自動播放規則）
  ['pointerdown', 'keydown'].forEach(ev => window.addEventListener(ev, () => { Music.unlocked = true; }, { once: true, capture: true }));

  /** 小段音效 */
  const Jingle = {

    star(i) { KG.note(Music.midi(76 + i * 4), 0.25, 'triangle', 0.22); KG.note(Music.midi(88 + i * 4), 0.3, 'sine', 0.12, 0.08); },
    unlock() { [79, 83, 86, 91].forEach((m, i) => KG.note(Music.midi(m), 0.18, 'sine', 0.18, i * 0.08)); },
    combo(n) { KG.note(Music.midi(72 + Math.min(n, 10) * 2), 0.15, 'triangle', 0.2); KG.note(Music.midi(79 + Math.min(n, 10) * 2), 0.2, 'triangle', 0.16, 0.07); },
    step(i) { KG.note(Music.midi(67 + (i % 8) * 2), 0.1, 'triangle', 0.16); }
  };

  /** 高解析度畫布 */
  function hiDPI(cv) {

  const UI = {

  /* ---------- 顏色工具 ---------- */
  function shade(hex, a) {
    const v = parseInt(hex.slice(1), 16);

    if (a < 0) { r *= 1 + a; g *= 1 + a; b *= 1 + a; } else { r += (255 - r) * a; g += (255 - g) * a; b += (255 - b) * a; }
    return 'rgb(' + (r | 0) + ',' + (g | 0) + ',' + (b | 0) + ')';
  }
  /** 填色 + 外框 + 光澤 */
  function fillShape(c, col, y0, y1, lw) {
    const g = c.createLinearGradient(0, y0, 0, y1);

    c.fillStyle = g; c.fill();

  }
  /** 多個圓合成的形狀：先畫粗外框再填色，就不會看到裡面的線 */
  function fillBlob(c, col, y0, y1, lw) {
    c.strokeStyle = shade(col, -0.5); c.lineWidth = (lw || 2) * 2; c.lineJoin = 'round'; c.stroke();
    const g = c.createLinearGradient(0, y0, 0, y1);
    g.addColorStop(0, shade(col, 0.35)); g.addColorStop(0.55, col); g.addColorStop(1, shade(col, -0.18));
    c.fillStyle = g; c.fill();

  function rr(o) { return OBJ[o.type].r * o.s; }
  function place(type, list) {
    const T = OBJ[type], z = scene.zones[T.zone];
    const s = (T.s || 1) * KG.rand(0.85, 1.15);
    for (let k = 0; k < 250; k++) {
      const x = KG.rand(0.08, 0.92) * PW, y = KG.rand(z[0], z[1]) * PH;
      const o = { type, x, y, s, col: KG.pick(T.cols), flip: Math.random() < 0.5 ? -1 : 1, ph: Math.random() * 6 };
      const r = T.r * s;
      if (x - r < 4 || x + r > PW - 4) continue;
      if (list.every(q => Math.hypot(q.x - x, q.y - y) > (rr(q) + r) * 0.95)) return o;
    }
    return null;
  }
  function buildLevel() {
    scene = SCENES[level.scene];
    const pool = KG.shuffle(scene.pool.concat(KG.shuffle(scene.pool).slice(0, level.extra)));
    objs = [];
    pool.forEach(t => { const o = place(t, objs); if (o) objs.push(o); });
    // 選差異
    diffs = [];
    const kinds = ['missing', 'color', 'size', 'extra', 'color', 'missing', 'size'];
    const cand = KG.shuffle(objs.filter(o => o.type !== 'cloud' || Math.random() < 0.5));
    let ki = KG.randInt(0, 3);
    while (diffs.length < level.diffs && cand.length) {
      const kind = kinds[ki++ % kinds.length];
      if (kind === 'extra') {
        const t = KG.pick(scene.pool);
        const o = place(t, objs.concat(diffs.filter(d => d.kind === 'extra').map(d => d.o)));
        if (o) { o.extra = true; diffs.push({ kind, o, x: o.x, y: o.y, r: Math.max(24, rr(o) * 1.15) }); }
        continue;
      }
      const o = cand.shift();
      if (o.diff) continue;
      const T = OBJ[o.type];
      if (kind === 'color' && T.cols.length < 2) { cand.push(o); continue; }
      o.diff = kind;
      if (kind === 'color') o.col2 = KG.pick(T.cols.filter(cc => cc !== o.col));
      if (kind === 'size') o.s2 = o.s * (Math.random() < 0.5 ? 0.6 : 1.45);
      diffs.push({ kind, o, x: o.x, y: o.y, r: Math.max(24, rr(o) * (kind === 'size' && o.s2 > o.s ? 1.5 : 1.15)) });

    } else if (sk.hat === 'cowboy') {
      c.fillStyle = '#c98a4f'; c.strokeStyle = '#6b4422';
      c.beginPath(); c.ellipse(0, hy - 18 * s, 34 * s, 7 * s, 0, 0, TAU); c.fill(); c.stroke();
      c.beginPath(); c.moveTo(-15 * s, hy - 18 * s); c.quadraticCurveTo(-16 * s, hy - 40 * s, 0, hy - 34 * s); c.quadraticCurveTo(16 * s, hy - 40 * s, 15 * s, hy - 18 * s); c.closePath(); c.fill(); c.stroke();
      c.fillStyle = '#ff4d6d'; c.fillRect(-15 * s, hy - 24 * s, 30 * s, 4 * s);
    } else if (sk.hat === 'magic') {
      c.fillStyle = '#3a2a5a'; c.strokeStyle = '#1a1030';
      c.beginPath(); c.ellipse(0, hy - 18 * s, 28 * s, 6 * s, 0, 0, TAU); c.fill(); c.stroke();
      Draw.rr(c, -15 * s, hy - 46 * s, 30 * s, 28 * s, 4 * s); c.fill(); c.stroke();
      c.fillStyle = '#b49cff'; c.fillRect(-15 * s, hy - 26 * s, 30 * s, 5 * s);
      Draw.star(c, 8 * s, hy - 38 * s, 4 * s);
    } else if (sk.hat === 'grad') {
      c.fillStyle = '#2a2a40'; c.strokeStyle = '#111';
      c.beginPath(); c.moveTo(-26 * s, hy - 28 * s); c.lineTo(0, hy - 38 * s); c.lineTo(26 * s, hy - 28 * s); c.lineTo(0, hy - 18 * s); c.closePath(); c.fill(); c.stroke();
      c.strokeStyle = '#ffd23f'; c.lineWidth = 2.5 * s; c.beginPath(); c.moveTo(0, hy - 28 * s); c.lineTo(20 * s, hy - 24 * s); c.lineTo(20 * s, hy - 10 * s); c.stroke();
    }
    c.restore();
    // 放大鏡
    c.save(); c.translate(24 * s, -30 * s); c.rotate(-0.5 + (mood === 'happy' ? Math.sin(t * 10) * 0.3 : Math.sin(t * 1.5) * 0.1));
    c.strokeStyle = '#8a5a35'; c.lineWidth = 5 * s; c.beginPath(); c.moveTo(0, 0); c.lineTo(0, 18 * s); c.stroke();
    c.fillStyle = 'rgba(200,235,255,.75)'; c.strokeStyle = '#ffb400'; c.lineWidth = 4 * s;
    c.beginPath(); c.arc(0, -11 * s, 11 * s, 0, TAU); c.fill(); c.stroke();
    c.fillStyle = 'rgba(255,255,255,.85)'; c.beginPath(); c.ellipse(-4 * s, -15 * s, 4 * s, 2 * s, -0.6, 0, TAU); c.fill();
    c.fillStyle = f1; c.strokeStyle = f2; c.lineWidth = 2 * s; c.beginPath(); c.arc(0, 14 * s, 6 * s, 0, TAU); c.fill(); c.stroke();
    c.restore();
    c.restore();
  }

  function drawMascot(c, w, h, t) {
    const s = Math.min(w / 200, h / 170);
    // 兩張小圖
    [[w * 0.06, '#9ee27a'], [w * 0.62, '#9ee27a']].forEach(([x, col], i) => {
      c.save(); c.translate(x, h * 0.12); c.rotate((i ? 0.08 : -0.08));
      c.fillStyle = '#fff'; Draw.rr(c, 0, 0, w * 0.32, w * 0.26, 10); c.fill();
      c.fillStyle = '#bfe8ff'; Draw.rr(c, 5, 5, w * 0.32 - 10, w * 0.12, 6); c.fill();
      c.fillStyle = col; Draw.rr(c, 5, 5 + w * 0.11, w * 0.32 - 10, w * 0.26 - 10 - w * 0.11, 6); c.fill();
      c.save(); c.translate(w * 0.16, w * 0.16); c.scale(0.7, 0.7); OBJ.flower.draw(c, i && (t % 2) > 1 ? '#6cc4ff' : '#ff7aa2', t); c.restore();
      c.restore();
    });
    drawDog(c, w / 2, h * 0.97, s * 1.05, SKINS[UI.item()], t, (t % 3) < 0.8 ? 'happy' : 'idle');
  }

  function drawItem(c, i, w, h) {
    const g = c.createLinearGradient(0, 0, 0, h);
    g.addColorStop(0, '#f3edff'); g.addColorStop(1, '#ddd2ff');
    c.fillStyle = g; Draw.rr(c, 0, 0, w, h, 12); c.fill();
    drawDog(c, w / 2, h * 0.98, h / 110, SKINS[i], 1, 'idle');
  }

  /* ---------- 互動 ---------- */
  function hitPanel(x, y) {
    for (let i = 0; i < 2; i++) {
      const p = P[i], lx = (x - p.x) / p.s, ly = (y - p.y) / p.s;
      if (lx >= 0 && lx <= PW && ly >= 0 && ly <= PH) return { i, x: lx, y: ly };
    }
    return null;
  }
  cv.addEventListener('pointerdown', e => {
    if (!playing) return;
    const h = hitPanel(e.clientX, e.clientY);
    if (!h) return;
    let best = null, bd = 1e9;
    diffs.forEach(d => { if (d.found) return; const dist = Math.hypot(d.x - h.x, d.y - h.y); if (dist < d.r + 14 && dist < bd) { bd = dist; best = d; } });
    if (best) foundDiff(best);
    else {
      misses++;
      marks.push({ panel: h.i, x: h.x, y: h.y, life: 1 });
      KG.note(330, 0.12, 'sine', 0.15, 0, 260);
      dogMood = 'sad'; dogT = 0.7;
    }
  });

  function foundDiff(d) {
    d.found = true; d.anim = 0;
    Tween.to(d, { anim: 1 }, 0.45, 'outCubic');
    found++;
    if (hintGlow && hintGlow.d === d) hintGlow = null;
    KG.sound('correct');
    KG.vibrate(25);
    P.forEach(p => {
      const x = p.x + d.x * p.s, y = p.y + d.y * p.s;
      FX.burst(x, y, { n: 12, colors: ['#ffd23f', '#ff7aa2', '#fff', '#b49cff'], size: 6 });
      FX.ring(x, y, '#fff', d.r * p.s * 1.4);
    });
    const p = P[1];
    const words = ['找到了！', '好棒！', '眼睛真亮！', '太厲害了！', '好厲害！'];
    FX.text(words[(found - 1) % words.length], clamp(p.x + d.x * p.s, 90, W - 90), p.y + d.y * p.s - d.r * p.s - 10, { size: 28, stroke: '#6a4fc0' });
    dogMood = 'happy'; dogT = 1.2;
    updateDots(true);
    if (found >= diffs.length) {
      playing = false;
      hintBtn.classList.remove('show');
      setTimeout(() => { KG.sound('win'); KG.confetti(innerWidth / 2, innerHeight / 3, 90); dogMood = 'happy'; dogT = 3; UI.banner('全部找到了！', '', 1.5); KG.say('全部找到了！好厲害！'); }, 500);
      setTimeout(() => {
        hud.classList.remove('show');
        const stars = (misses <= 2 && hints === 0) ? 3 : (misses <= 6 && hints <= 1) ? 2 : 1;
        UI.result({ stars, title: stars === 3 ? '神探出動！' : '全部找到了！', msg: '找到 ' + diffs.length + ' 個不同<br>點錯 ' + misses + ' 次・提示 ' + hints + ' 次' });
      }, 2300);
    }
  }

  function updateDots(pop) {
    hudDots.innerHTML = '';
    diffs.forEach((d, i) => { const el = document.createElement('div'); el.className = 'dot' + (i < found ? ' on' : ''); if (!pop || i !== found - 1) el.style.animation = 'none'; hudDots.appendChild(el); });
  }

  hintBtn.addEventListener('click', () => {
    if (!playing) return;
    if (hintT > 0) { KG.sound('tick'); KG.toast('再等一下下喔'); return; }
    const d = KG.pick(diffs.filter(x => !x.found));
    if (!d) return;
    hints++; hintT = HINT_WAIT;
    hintGlow = { d, t: 3 };
    KG.sound('sparkle');
    dogMood = 'happy'; dogT = 0.8;
  });
  window.addEventListener('keydown', e => { if ((e.key === 'h' || e.key === 'H' || e.key === '?') && playing) hintBtn.click(); });

  /* ---------- 主迴圈 ---------- */
  let last = performance.now();
  function frame(now) {
    const dt = Math.max(0, Math.min(0.05, (now - last) / 1000));
    last = now; time += dt;
    Tween.update(dt); FX.update(dt);
    marks.forEach(m => { m.life -= dt * 0.8; }); marks = marks.filter(m => m.life > 0);
    dogT -= dt; if (dogT <= 0) dogMood = 'idle';
    if (hintGlow) { hintGlow.t -= dt; if (hintGlow.t <= 0) hintGlow = null; }
    if (playing) {
      const before = hintT;
      hintT = Math.max(0, hintT - dt);
      hintBtn.style.setProperty('--p', (1 - hintT / HINT_WAIT).toFixed(3));
      hintBtn.classList.toggle('wait', hintT > 0); hintBtn.classList.toggle('ready', hintT <= 0);
      if (before > 0 && hintT <= 0) KG.note(1320, 0.1, 'sine', 0.12);
    }
    const [sx, sy] = FX.offset();
    ctx.setTransform(view.DPR, 0, 0, view.DPR, sx * view.DPR, sy * view.DPR);
    drawBG();
    if (objs.length) { drawPanel(0); drawPanel(1); }
    if (objs.length && dogPos) drawDog(ctx, dogPos.x, dogPos.y, dogPos.s, skin, time, dogMood);
    FX.draw(ctx, FONT);
    requestAnimationFrame(frame);
  }

  /* ---------- 流程 ---------- */
  function startLevel(i) {
    li = i; level = LEVELS[i]; skin = SKINS[UI.item()];
    Tween.clear(); FX.clear();
    buildLevel();
    found = 0; misses = 0; hints = 0; hintT = HINT_WAIT; hintGlow = null; marks = [];
    hudLv.textContent = '第 ' + (i + 1) + ' 關';
    updateDots(false);
    hud.classList.add('show'); hintBtn.classList.add('show');
    layout();
    playing = true;
    UI.banner('找出 ' + diffs.length + ' 個不同', INTRO[level.scene], 2);
    KG.say('找出' + diffs.length + '個不一樣的地方');
  }
  function toMenu() {
    playing = false; objs = []; diffs = [];
    hud.classList.remove('show'); hintBtn.classList.remove('show');
    layout();
  }
  window.addEventListener('resize', layout);
  if (location.hash === '#debug') window.__dbg = { diffs: () => diffs.filter(d => !d.found).map(d => [P[1].x + d.x * P[1].s, P[1].y + d.y * P[1].s]) };

  UI.init({
    slug: 'spot-difference', title: '找不同', subtitle: '兩張圖哪裡不一樣？點點看！',
    levels: LEVELS, items: SKINS, itemsTitle: '偵探狗狗的帽子', itemWord: '帽子',
    drawMascot, drawItem, music: SONG,
    onPlay: startLevel, onMenu: toMenu, onItem: i => { skin = SKINS[i]; }
  });
  layout();
  requestAnimationFrame(t => { last = t; frame(t); });
  UI.showTitle();
})();
</script>
</body>
</html>
