<!doctype html>

<body>
<div id="msg">AIR HOCKEY 載入中…</div>
<canvas id="gl"></canvas>
<canvas id="ui" class="menu" aria-label="3D 空氣曲棍球遊戲畫面"></canvas>
<script src="../../assets/common.js"></script>
<script type="module">
import * as THREE from 'three';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

let renderer = null;
try {
  renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('gl'), antialias: true, powerPreference: 'high-performance' });
} catch (e) {
  renderer = null;
}
if (!renderer) document.getElementById('msg').textContent = '這個遊戲需要支援 3D（WebGL）的瀏覽器，請換一個瀏覽器或裝置再試試看。';
else main();

function main() {
  const cv = document.getElementById('ui');
  const ctx = cv.getContext('2d');
  const FONT = "'Rajdhani','Baloo 2','PingFang TC','Noto Sans TC','Microsoft JhengHei',sans-serif";
  const font = (w, s) => w + ' ' + s + 'px ' + FONT;
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const lerp = (a, b, t) => a + (b - a) * t;
  const rand = (a, b) => a + Math.random() * (b - a);
  const TAU = Math.PI * 2;

  /* =========================================================
   * 球台尺寸（單位：公尺左右；x 左右，y 沿球台長邊，玩家 1 在 +y）
   * ========================================================= */
  const HW = 0.52, HL = 1.0, GW = 0.17;       // 半寬、半長、球門半寬
  const RP = 0.042, RM = 0.06, RS = RP + RM;  // 冰球、球槌半徑
  const PUCK_T = 0.014;                       // 冰球厚度
  const MAXP = 6.6;                           // 冰球速度上限
  const MAXM = 16;                            // 手指控制球槌的速度上限
  const E_WALL = 0.88, E_MAL = 0.9, FRICTION = 0.12;
  const STALL = 7;                            // 同一邊停留秒數上限
  const PB = HW - RP;                         // 冰球中心的左右邊界

  const DIFFS = {
    easy: { key: 'easy', name: '簡單', lag: 0.24, speed: 1.9, strike: 2.7, react: 0.26, err: 0.07, def: 0.22, bank: 0, bounce: false },
    normal: { key: 'normal', name: '普通', lag: 0.15, speed: 3.0, strike: 4.1, react: 0.13, err: 0.035, def: 0.2, bank: 0.2, bounce: true },
    hard: { key: 'hard', name: '困難', lag: 0.11, speed: 4.2, strike: 6.4, react: 0.05, err: 0.012, def: 0.17, bank: 0.45, bounce: true }
  };
  const DKEYS = ['easy', 'normal', 'hard'];

  /* ---------- 存檔 ---------- */
  const SKEY = 'air-hockey:stats', OKEY = 'air-hockey:opts';
  const stats = Object.assign({ wins: { easy: 0, normal: 0, hard: 0 }, losses: { easy: 0, normal: 0, hard: 0 }, streak: 0, bestStreak: 0, pvp: 0 }, KG.store.get(SKEY, {}));
  const opts = Object.assign({ mode: 'ai', diff: 'normal', target: 7 }, KG.store.get(OKEY, {}));
  if (!DIFFS[opts.diff]) opts.diff = 'normal';
  if (opts.target !== 7 && opts.target !== 11) opts.target = 7;

  /* ---------- 狀態 ---------- */
  let phase = 'serve';      // serve | play | goal | over
  let ui = 'title';         // title | pause | null
  let demo = true;          // 標題畫面背景的電腦對打
  let stateT = 0, clock = 0;
  let score = [0, 0], winner = -1, lastScorer = -1, rally = 0;
  let shake = 0, flash = 0, flashCol = '255,255,255';
  let sideT = 0, sideOf = 0, warnSec = -1;
  let banner = null;
  let autoP1 = false;
  let serveTo = 0;
  let newRecord = false;
  let fouls = 0;
  const puck = { x: 0, y: 0, vx: 0, vy: 0, h: 0, sink: 0, rot: 0, spin: 0 };
  function mk(side) {
    return { side, x: 0, y: side * 0.78, tx: 0, ty: side * 0.78, vx: 0, vy: 0, sx: 0, sy: 0, ex: 0, ey: 0, cd: 0, ai: null, aiT: 0, aiSp: 3, aim: null, aimT: 0, glow: 0, human: false };
  }
  const mallets = [mk(1), mk(-1)];
  const TRAIL = 16;
  const trail = new Float32Array(TRAIL * 3);
  let trailN = 0, trailHead = 0;
  function clearTrail() { trailN = 0; }

  /* =========================================================
   * 比賽流程
   * ========================================================= */
  function resetMallets() {
    mallets.forEach(m => { m.x = m.tx = 0; m.y = m.ty = m.side * 0.8; m.vx = m.vy = 0; m.aim = null; m.aiT = 0; });
  }
  function newMatch(o) {
    if (o) {
      if (o.mode === 'ai' || o.mode === '2p') opts.mode = o.mode;
      if (DIFFS[o.diff]) opts.diff = o.diff;
      if (o.target === 7 || o.target === 11) opts.target = o.target;
      KG.store.set(OKEY, { mode: opts.mode, diff: opts.diff, target: opts.target });
    }
    demo = false; ui = null;
    score = [0, 0]; winner = -1; lastScorer = -1; newRecord = false;
    mallets[0].ai = autoP1 ? DIFFS.hard : null;
    mallets[1].ai = opts.mode === 'ai' ? DIFFS[opts.diff] : null;
    resetMallets();
    serve(opts.mode === 'ai' ? 0 : (Math.random() < 0.5 ? 0 : 1));
    banner = { t: 0, text: '比賽開始', sub: '先得 ' + opts.target + ' 分獲勝', col: '#7fe8ff', all: true };
    drawBoard();
    fitCamera();
    startMusic();
    KG.note(523, 0.1, 'square', 0.05); KG.note(784, 0.16, 'square', 0.05, 0.1);
  }
  function toTitle() {
    demo = true; ui = 'title';
    stopMusic();
    mallets[0].ai = DIFFS.normal; mallets[1].ai = DIFFS.normal;
    score = [0, 0]; winner = -1;
    resetMallets();
    serve(0);
    banner = null;
    drawBoard();
    fitCamera();
  }
  // 冰球放到 p 號玩家那一邊
  function serve(p) {
    serveTo = p;
    const s = mallets[p].side;
    puck.x = rand(-0.05, 0.05); puck.y = s * 0.42; puck.vx = puck.vy = 0; puck.h = 0.45; puck.sink = 0; puck.spin = 0;
    phase = 'serve'; stateT = 0;
    sideT = 0; sideOf = s; warnSec = -1;
    rally = 0;
    clearTrail();
  }
  function onGoal(sc) {
    phase = 'goal'; stateT = 0;
    lastScorer = sc;
    const endS = mallets[1 - sc].side;
    const col = sc === 0 ? [0.4, 2.4, 3.2] : [3.2, 0.5, 2.0];
    spawnSparks(puck.x, endS * HL, 0.03, 70, col, 2.4, 1.6);
    ringFx(0, endS * HL, col);
    goalGlow[endS > 0 ? 0 : 1] = 1;
    if (demo) return;
    score[sc]++;
    drawBoard();
    shake = 0.75; flash = 1; flashCol = sc === 0 ? '90,220,255' : '255,80,180';
    KG.vibrate(sc === 0 || opts.mode === '2p' ? [40, 40, 80] : 140);
    const good = opts.mode === '2p' || sc === 0;
    goalHorn(good);
    if (score[sc] >= opts.target) winner = sc;
    const big = opts.mode === 'ai' ? (sc === 0 ? '得分！' : '失分') : '玩家 ' + (sc + 1) + ' 得分！';
    banner = { t: 0, text: winner >= 0 ? (opts.mode === 'ai' ? (sc === 0 ? '勝利！' : '落敗') : '玩家 ' + (sc + 1) + ' 獲勝！') : (score[sc] === opts.target - 1 && score[1 - sc] < opts.target - 1 ? '賽末點！' : big), sub: score[0] + ' : ' + score[1], col: sc === 0 ? '#7fe8ff' : '#ff7ad0', all: true, big: true };
  }
  function finishMatch() {
    phase = 'over'; stateT = 0;
    stopMusic();
    if (opts.mode === 'ai') {
      const d = opts.diff;
      if (winner === 0) {
        stats.wins[d]++; stats.streak++;
        if (stats.streak > stats.bestStreak) { stats.bestStreak = stats.streak; newRecord = stats.streak > 1; }
        KG.sound('win'); KG.confetti();
      } else {
        stats.losses[d]++; stats.streak = 0;
        KG.sound('lose');
      }
      KG.best('air-hockey', stats.bestStreak);
    } else {
      stats.pvp++;
      KG.sound('win'); KG.confetti();
    }
    KG.store.set(SKEY, stats);
  }

  /* =========================================================
   * 物理
   * ========================================================= */
  function capSpeed() {
    const s = Math.hypot(puck.vx, puck.vy);
    if (s > MAXP) { puck.vx *= MAXP / s; puck.vy *= MAXP / s; }
  }
  // 回傳 true 表示進球
  function walls() {
    if (puck.x < -PB) { puck.x = -PB; if (puck.vx < 0) { wallHit(-puck.vx); puck.vx = -puck.vx * E_WALL; puck.vy *= 0.98; } }
    else if (puck.x > PB) { puck.x = PB; if (puck.vx > 0) { wallHit(puck.vx); puck.vx = -puck.vx * E_WALL; puck.vy *= 0.98; } }
    for (let s = -1; s <= 1; s += 2) {
      const ly = puck.y * s;
      if (ly <= HL - RP) continue;
      if (Math.abs(puck.x) < GW) {
        // 球門兩側的柱子
        for (let k = -1; k <= 1; k += 2) {
          const dx = puck.x - k * GW, dy = puck.y - s * HL, d = Math.hypot(dx, dy);
          if (d < RP && d > 1e-6) {
            const nx = dx / d, ny = dy / d;
            puck.x = k * GW + nx * RP; puck.y = s * HL + ny * RP;
            const vn = puck.vx * nx + puck.vy * ny;
            if (vn < 0) { wallHit(-vn); puck.vx -= (1 + E_WALL) * vn * nx; puck.vy -= (1 + E_WALL) * vn * ny; }
          }
        }
        if (ly > HL) puck.x = clamp(puck.x, -GW + RP * 0.6, GW - RP * 0.6);
        if (puck.y * s > HL + RP * 0.7) { onGoal(s > 0 ? 1 : 0); return true; }
      } else {
        puck.y = s * (HL - RP);
        if (puck.vy * s > 0) { wallHit(Math.abs(puck.vy)); puck.vy = -puck.vy * E_WALL; puck.vx *= 0.98; }
      }
    }
    return false;
  }
  function collide(m) {
    const dx = puck.x - m.x, dy = puck.y - m.y, d2 = dx * dx + dy * dy;
    if (d2 >= RS * RS) return;
    let nx, ny;
    const d = Math.sqrt(d2);
    if (d < 1e-6) { nx = 0; ny = -m.side; } else { nx = dx / d; ny = dy / d; }
    puck.x = m.x + nx * RS; puck.y = m.y + ny * RS;
    const rvx = puck.vx - m.vx, rvy = puck.vy - m.vy, vn = rvx * nx + rvy * ny;
    if (vn < 0) {
      puck.vx -= (1 + E_MAL) * vn * nx; puck.vy -= (1 + E_MAL) * vn * ny;
      // 擦邊會讓冰球旋轉（只是視覺）
      puck.spin += clamp((rvx * -ny + rvy * nx) * 30, -40, 40);
      capSpeed();
      onHit(m, -vn, nx, ny);
    }
    // 冰球被夾在牆邊：推回球槌
    const ox = puck.x, oy = puck.y;
    puck.x = clamp(puck.x, -PB, PB);
    if (Math.abs(puck.x) >= GW) puck.y = clamp(puck.y, -(HL - RP), HL - RP);
    if (ox !== puck.x || oy !== puck.y) {
      const ex = m.x - puck.x, ey = m.y - puck.y, e = Math.hypot(ex, ey);
      if (e < RS) {
        const ux = e > 1e-6 ? ex / e : 0, uy = e > 1e-6 ? ey / e : m.side;
        m.x = puck.x + ux * RS; m.y = puck.y + uy * RS;
      }
    }
  }
  const SUBH = 1 / 240;
  function physics(dt) {
    let md = 0;
    for (const m of mallets) md = Math.max(md, Math.hypot(m.ex - m.sx, m.ey - m.sy));
    const pd = Math.hypot(puck.vx, puck.vy) * dt;
    // 分小步：每一步移動不超過冰球半徑的一半，快速揮動也不會穿過去
    const n = Math.min(64, Math.max(Math.ceil(dt / SUBH), Math.ceil((md + pd) / (RP * 0.5))));
    const h = dt / n;
    for (let k = 1; k <= n; k++) {
      const f = k / n;
      for (const m of mallets) { m.x = m.sx + (m.ex - m.sx) * f; m.y = m.sy + (m.ey - m.sy) * f; }
      puck.x += puck.vx * h; puck.y += puck.vy * h;
      if (walls()) return;
      for (const m of mallets) collide(m);
      if (walls()) return;
    }
    const dec = Math.exp(-FRICTION * dt);
    puck.vx *= dec; puck.vy *= dec;
  }

  /* =========================================================
   * 電腦 AI（在自己的座標系裡想：自己的球門在 +HL）
   * ========================================================= */
  function fold(x) {
    const P = 4 * PB;
    let u = ((x + PB) % P + P) % P;
    if (u > 2 * PB) u = P - u;
    return u - PB;
  }
  // 反應時間：電腦看到的是一小段時間之前的冰球
  const HIST = 32, hist = new Float32Array(HIST * 4);
  let histHead = 0, histN = 0;
  function recordPuck() {
    const i = histHead * 4;
    hist[i] = puck.x; hist[i + 1] = puck.y; hist[i + 2] = puck.vx; hist[i + 3] = puck.vy;
    histHead = (histHead + 1) % HIST; histN = Math.min(HIST, histN + 1);
  }
  const seen = { x: 0, y: 0, vx: 0, vy: 0 };
  function seenPuck(lag) {
    const back = Math.min(histN - 1, Math.round(lag * 60));
    if (back <= 0 || phase !== 'play') { seen.x = puck.x; seen.y = puck.y; seen.vx = puck.vx; seen.vy = puck.vy; return seen; }
    const i = ((histHead - 1 - back) % HIST + HIST) % HIST * 4;
    seen.x = hist[i]; seen.y = hist[i + 1]; seen.vx = hist[i + 2]; seen.vy = hist[i + 3];
    return seen;
  }
  function aiThink(m, P, dt) {
    m.aiT -= dt;
    m.aimT -= dt;
    if (m.aiT > 0) return;
    m.aiT = P.react * (0.7 + Math.random() * 0.6);
    const s = m.side;
    const sp0 = seenPuck(P.lag);
    const px = sp0.x, py = sp0.y * s, vx = sp0.vx, vy = sp0.vy * s;
    const mx = m.x, my = m.y * s;
    const defY = HL - P.def;
    let tx, ty, sp = P.speed;
    if (phase !== 'play' && phase !== 'serve') { tx = 0; ty = defY; }
    else if (phase === 'serve' && serveTo !== mallets.indexOf(m)) { tx = 0; ty = defY; }
    else if (py < -0.01 && phase === 'play') {
      // 球在對方場：守門
      if (vy > 0.25) {
        const t = (defY - py) / vy;
        let ix = px + vx * t;
        ix = P.bounce ? fold(ix) : clamp(ix, -PB, PB);
        tx = clamp(ix, -GW - 0.05, GW + 0.05); ty = defY;
      } else { tx = px * 0.35; ty = defY - 0.05; }
      m.aim = null;
    } else if (phase === 'serve') {
      tx = px; ty = Math.min(HL - RM, py + RS + 0.12);
    } else if (vy < -0.9) {
      // 球正在離開：退回防守
      tx = px * 0.35; ty = defY;
      m.aim = null;
    } else if (vy > 1.0 && py > my - RP) {
      // 球已經過了球槌，衝回球門前
      const t = Math.max(0, (HL - 0.12 - py) / vy);
      tx = clamp(P.bounce ? fold(px + vx * t) : px + vx * t, -GW, GW); ty = HL - 0.12; sp = P.strike;
    } else if (vy > 1.6) {
      // 球衝過來：擋在路線上
      const t = Math.max(0, (my - py) / vy);
      tx = P.bounce ? fold(px + vx * t) : px + vx * t; ty = my;
    } else {
      // 進攻
      if (!m.aim || m.aimT <= 0) {
        const gx = (Math.random() < 0.5 ? -1 : 1) * GW * rand(0.25, 0.85);
        m.aim = Math.random() < P.bank ? { x: (Math.random() < 0.5 ? -1 : 1) * 2 * PB - gx, y: -HL } : { x: gx, y: -HL };
        m.aimT = 2.2;
      }
      let dx = m.aim.x - px, dy = m.aim.y - py, L = Math.hypot(dx, dy) || 1;
      let dirx = dx / L, diry = dy / L;
      let sx = px - dirx * (RS + 0.06), sy = py - diry * (RS + 0.06);
      const csx = clamp(sx, -HW + RM, HW - RM), csy = clamp(sy, RM, HL - RM);
      if (Math.abs(csx - sx) + Math.abs(csy - sy) > 0.01) {
        // 站不到球後面：從站得到的位置打
        sx = csx; sy = csy;
        dirx = px - sx; diry = py - sy; L = Math.hypot(dirx, diry) || 1; dirx /= L; diry /= L;
      }
      const rx = mx - px, ry = my - py;
      const along = rx * dirx + ry * diry, perp = rx * -diry + ry * dirx;
      if (along < -RS * 0.5 && Math.abs(perp) < RS * 0.6) {
        tx = px + dirx * 0.3; ty = py + diry * 0.3; sp = P.strike;
      } else if (along > -RS * 0.3 && Math.abs(perp) < RS + 0.05) {
        const sg = perp >= 0 ? 1 : -1;
        tx = sx - diry * sg * (RS + 0.05); ty = sy + dirx * sg * (RS + 0.05);
      } else { tx = sx; ty = sy; }
    }
    const e = P.err * (1 + Math.hypot(vx, vy) * 0.5);
    tx += (Math.random() - 0.5) * 2 * e;
    ty += (Math.random() - 0.5) * P.err;
    m.tx = tx; m.ty = ty * s; m.aiSp = sp;
  }

  /* =========================================================
   * 主要更新
   * ========================================================= */
  const keys = {};
  const kbDir = { x: 0, y: 0 };
  function keyVec(p) {
    let kx = 0, ky = 0;
    const arrows = p === 0, wasd = p === 1 || opts.mode === 'ai' || demo;
    if ((arrows && keys.ArrowLeft) || (wasd && keys.KeyA)) kx -= 1;
    if ((arrows && keys.ArrowRight) || (wasd && keys.KeyD)) kx += 1;
    if ((arrows && keys.ArrowUp) || (wasd && keys.KeyW)) ky += 1;
    if ((arrows && keys.ArrowDown) || (wasd && keys.KeyS)) ky -= 1;
    if (p === 1 && opts.mode === 'ai') return null;
    if (!kx && !ky) return null;
    // 螢幕上的方向換成球台方向
    kbDir.x = view.rx * kx + view.ux * ky;
    kbDir.y = view.ry * kx + view.uy * ky;
    return kbDir;
  }
  function moveMallets(dt) {
    for (let i = 0; i < 2; i++) {
      const m = mallets[i];
      m.cd = Math.max(0, m.cd - dt);
      m.glow = Math.max(0, m.glow - dt * 3);
      if (m.ai) aiThink(m, m.ai, dt);
      else if (!demo) {
        const k = keyVec(i);
        if (k) { m.tx = m.x + k.x * 2.4 * dt; m.ty = m.y + k.y * 2.4 * dt; }
      }
      // 只能在自己半場
      m.tx = clamp(m.tx, -HW + RM, HW - RM);
      m.ty = m.side > 0 ? clamp(m.ty, RM, HL - RM) : clamp(m.ty, -(HL - RM), -RM);
      const maxV = m.ai ? m.aiSp : MAXM;
      let dx = m.tx - m.x, dy = m.ty - m.y;
      const d = Math.hypot(dx, dy), step = maxV * dt;
      if (m.ai && d < 0.04) { const sl = Math.max(0.2, d / 0.04); dx *= sl; dy *= sl; }
      if (d > step) { dx *= step / d; dy *= step / d; }
      m.sx = m.x; m.sy = m.y; m.ex = m.x + dx; m.ey = m.y + dy;
      m.vx = dt > 0 ? dx / dt : 0; m.vy = dt > 0 ? dy / dt : 0;
    }
  }
  function pushOut(m) {
    const dx = m.x - puck.x, dy = m.y - puck.y, d = Math.hypot(dx, dy);
    if (d < RS) {
      const ux = d > 1e-6 ? dx / d : 0, uy = d > 1e-6 ? dy / d : m.side;
      m.x = puck.x + ux * RS; m.y = puck.y + uy * RS;
      m.x = clamp(m.x, -HW + RM, HW - RM);
    }
  }
  function update(dt) {
    clock += dt;
    stateT += dt;
    shake = Math.max(0, shake - dt * 1.8);
    flash = Math.max(0, flash - dt * 2.2);
    goalGlow[0] = Math.max(0, goalGlow[0] - dt * 0.8);
    goalGlow[1] = Math.max(0, goalGlow[1] - dt * 0.8);
    if (banner) { banner.t += dt; if (banner.t > 2.4) banner = null; }
    updateSparks(dt);
    if (ui === 'pause') return;
    puck.rot += puck.spin * dt;
    puck.spin *= Math.exp(-1.5 * dt);

      HITS.push({ id: 'pause', x: px - 24, y: py - 24, w: 48, h: 48, up: togglePause });
    }
    if (ui === 'pause') drawPause();
    if (phase === 'over' && stateT > 1.1) drawOver();
  }
  function drawScoreAI() {
    const D = DIFFS[opts.diff];
    if (view.land) {
      const x = 14, y = H / 2 - 66, w = Math.min(140, W * 0.17), h = 132;
      rr(x, y, w, h, 14);
      ctx.fillStyle = 'rgba(8,10,28,.72)'; ctx.fill();
      ctx.strokeStyle = 'rgba(120,180,255,.35)'; ctx.lineWidth = 1; ctx.stroke();
      txt('電腦·' + D.name, x + 14, y + 22, 13, '#ff8ad8', { weight: 800, align: 'left' });
      txt(String(score[1]), x + w - 14, y + 24, 30, '#ffffff', { weight: 900, align: 'right' });
      ctx.fillStyle = 'rgba(160,200,255,.25)'; ctx.fillRect(x + 12, y + 46, w - 24, 1);
      txt('你', x + 14, y + 68, 14, '#7fe8ff', { weight: 800, align: 'left' });
      txt(String(score[0]), x + w - 14, y + 70, 30, '#ffffff', { weight: 900, align: 'right' });
      txt('先得 ' + opts.target + ' 分', x + w / 2, y + 110, 12, 'rgba(255,214,110,.85)', { weight: 700 });
      return;
    }
    const w = Math.min(232, W - 136), h = 48, x = W / 2 - w / 2, y = 10;
    rr(x, y, w, h, 14);
    ctx.fillStyle = 'rgba(8,10,28,.72)'; ctx.fill();
    ctx.strokeStyle = 'rgba(120,180,255,.35)'; ctx.lineWidth = 1; ctx.stroke();
    txt('你', x + 12, y + h / 2, 13, '#7fe8ff', { weight: 800, align: 'left' });
    txt(String(score[0]), x + w * 0.33, y + h / 2 + 1, 28, '#ffffff', { weight: 900 });
    txt(String(score[1]), x + w * 0.67, y + h / 2 + 1, 28, '#ffffff', { weight: 900 });
    txt(':', x + w / 2, y + h / 2 + 4, 20, '#ffd23a', { weight: 900 });
    txt('先得' + opts.target, x + w / 2, y + 11, 9, 'rgba(255,214,110,.8)', { weight: 700 });
    txt(D.name, x + w - 12, y + h / 2, 13, '#ff8ad8', { weight: 800, align: 'right' });
  }
  function drawScore2P() {
    for (let p = 0; p < 2; p++) {
      const s = mallets[p].side;
      const [x, y] = toScreen(-s * (HW - 0.13), s * 0.2, 0.02);
      const col = p === 0 ? '#7fe8ff' : '#ff8ad8';
      rotText(x, y, playerAngle(p), () => {
        rr(-46, -26, 92, 52, 12);
        ctx.fillStyle = 'rgba(6,8,24,.55)'; ctx.fill();
        ctx.strokeStyle = col; ctx.globalAlpha = 0.6; ctx.lineWidth = 1.5; ctx.stroke(); ctx.globalAlpha = 1;
        txt('P' + (p + 1), -26, -10, 13, col, { weight: 900 });
        txt('先得' + opts.target, -26, 10, 10, 'rgba(255,214,110,.8)', { weight: 700 });
        txt(score[p] + '', 18, 1, 32, '#ffffff', { weight: 900 });
      });
    }
  }
  function drawTitle() {
    const PW = 380, PH = 452;
    panel(PW, PH);
    logo(PW / 2, 58, 46);
    let y = 122;
    const lx = 24, sx = 98, sw = PW - sx - 24;
    txt('模式', lx, y + 22, 15, 'rgba(190,215,255,.85)', { weight: 800, align: 'left' });
    seg('mode', sx, y, sw, 44, [['ai', '對電腦'], ['2p', '雙人對戰']], opts.mode, v => { opts.mode = v; });
    y += 56;
    txt('難度', lx, y + 21, 15, 'rgba(190,215,255,.85)', { weight: 800, align: 'left' });
    seg('diff', sx, y, sw, 42, DKEYS.map(k => [k, DIFFS[k].name]), opts.diff, v => { opts.diff = v; }, opts.mode !== 'ai');
    y += 54;
    txt('目標', lx, y + 21, 15, 'rgba(190,215,255,.85)', { weight: 800, align: 'left' });
    seg('tgt', sx, y, sw, 42, [[7, '先得 7 分'], [11, '先得 11 分']], opts.target, v => { opts.target = v; });
    y += 60;
    button('start', 24, y, PW - 48, 54, '開始比賽', true, () => { KG.sound('click'); newMatch({ mode: opts.mode, diff: opts.diff, target: opts.target }); });
    y += 76;
    const W_ = stats.wins;
    txt('勝場　簡單 ' + W_.easy + ' · 普通 ' + W_.normal + ' · 困難 ' + W_.hard, PW / 2, y, 14, '#ffd23a', { weight: 800 });
    txt('目前連勝 ' + stats.streak + '　最佳連勝 ' + stats.bestStreak, PW / 2, y + 22, 13, 'rgba(255,214,110,.8)', { weight: 700 });
    y += 52;
    txt(opts.mode === 'ai' ? '拖曳手指／滑鼠控制球槌 · 方向鍵或 WASD · P 暫停' : '兩人各守半場 · 各自用手指拖曳自己的球槌', PW / 2, y, 12, 'rgba(190,215,255,.7)', { weight: 600 });
    endPanel();
  }
  function drawPause() {
    const PW = 330, PH = 250;
    panel(PW, PH);
    txt('暫停', PW / 2, 52, 34, '#ffffff', { weight: 900 });
    txt((opts.mode === 'ai' ? '你 ' + score[0] + ' : ' + score[1] + ' 電腦' : 'P1 ' + score[0] + ' : ' + score[1] + ' P2'), PW / 2, 88, 16, '#bfe0ff', { weight: 800 });
    button('resume', 24, 116, PW - 48, 50, '繼續比賽', true, togglePause);
    button('quit', 24, 178, PW - 48, 46, '回到選單', false, () => { KG.sound('click'); toTitle(); });
    endPanel();
  }
  function drawOver() {
    const PW = 340, PH = 336;
    panel(PW, PH);
    let title, col;
    if (opts.mode === 'ai') { title = winner === 0 ? '你贏了！' : '電腦獲勝'; col = winner === 0 ? '#7fe8ff' : '#ff8ad8'; }
    else { title = '玩家 ' + (winner + 1) + ' 獲勝！'; col = winner === 0 ? '#7fe8ff' : '#ff8ad8'; }
    txt(title, PW / 2, 54, 36, col, { weight: 900 });
    txt(score[0] + '  :  ' + score[1], PW / 2, 112, 46, '#ffffff', { weight: 900 });
    if (opts.mode === 'ai') {
      const d = opts.diff;
      txt('對戰 ' + DIFFS[d].name + ' 電腦　戰績 ' + stats.wins[d] + ' 勝 ' + stats.losses[d] + ' 敗', PW / 2, 156, 14, '#bfe0ff', { weight: 700 });
      txt(newRecord ? '★ 新的最佳連勝 ' + stats.bestStreak + '！' : '目前連勝 ' + stats.streak + '　最佳 ' + stats.bestStreak, PW / 2, 180, 14, '#ffd23a', { weight: 800 });
    } else {
      txt('雙人對戰已進行 ' + stats.pvp + ' 場', PW / 2, 164, 14, '#bfe0ff', { weight: 700 });
    }
    button('again', 24, 208, PW - 48, 52, '再來一局', true, () => { KG.sound('click'); newMatch(); });
    button('menu', 24, 270, (PW - 60) / 2, 44, '選單', false, () => { KG.sound('click'); toTitle(); });
    button('home', 36 + (PW - 60) / 2, 270, (PW - 60) / 2, 44, '回首頁', false, () => { location.href = '../../index.html'; });
    endPanel();
  }
  function togglePause() {
    if (demo || phase === 'over') return;
    KG.sound('click');
    ui = ui === 'pause' ? null : 'pause';
  }

  /* =========================================================
   * 輸入
   * ========================================================= */
  const ray = new THREE.Raycaster(), ndc = new THREE.Vector2(), plane = new THREE.Plane(new THREE.Vector3(0, 1, 0), -0.02), hitP = new THREE.Vector3();
  function screenToTable(x, y) {
    ndc.set(x / W * 2 - 1, -(y / H) * 2 + 1);
    ray.setFromCamera(ndc, cam);
    if (!ray.ray.intersectPlane(plane, hitP)) return null;
    return hitP;
  }
  function findHit(x, y) {
    for (let i = HITS.length - 1; i >= 0; i--) { const h = HITS[i]; if (x >= h.x && x <= h.x + h.w && y >= h.y && y <= h.y + h.h) return h; }
    return null;
  }
  const controlling = () => !demo && ui === null && phase !== 'over';
  const ptrs = new Map();
  const activeHits = new Map();
  function aimPointer(p, e) {
    const m = mallets[p];
    if (m.ai) return;
    const t = screenToTable(e.clientX, e.clientY);
    if (!t) return;
    m.tx = t.x; m.ty = t.z;
    m.human = e.pointerType !== 'mouse';
  }
  function pickPlayer(e) {
    if (opts.mode === 'ai') return 0;
    const t = screenToTable(e.clientX, e.clientY);
    if (t) return t.z >= 0 ? 0 : 1;
    const [, cy] = toScreen(0, 0);
    const [, by] = toScreen(0, HL);
    return (e.clientY - cy) * (by - cy) >= 0 ? 0 : 1;
  }
  cv.addEventListener('pointerdown', e => {
    e.preventDefault();
    const h = findHit(e.clientX, e.clientY);
    if (h) { activeHits.set(e.pointerId, h); return; }
    if (!controlling()) return;
    const p = pickPlayer(e);
    ptrs.set(e.pointerId, p);
    aimPointer(p, e);
    try { cv.setPointerCapture(e.pointerId); } catch (err) { /* 忽略 */ }
  });
  cv.addEventListener('pointermove', e => {
    if (e.pointerType === 'mouse') {
      const h = findHit(e.clientX, e.clientY);
      hover = h ? h.id : null;
    }
    if (!controlling()) return;
    if (ptrs.has(e.pointerId)) aimPointer(ptrs.get(e.pointerId), e);
    else if (e.pointerType === 'mouse' && opts.mode === 'ai') aimPointer(0, e);
  });
  function endPointer(e) {
    const a = activeHits.get(e.pointerId);
    if (a) {
      activeHits.delete(e.pointerId);
      const h = findHit(e.clientX, e.clientY);
      if (h && h.id === a.id && h.up) h.up();
    }
    ptrs.delete(e.pointerId);
  }
  cv.addEventListener('pointerup', endPointer);
  cv.addEventListener('pointercancel', e => { ptrs.delete(e.pointerId); activeHits.delete(e.pointerId); });
  cv.addEventListener('contextmenu', e => e.preventDefault());
  window.addEventListener('keydown', e => {
    if (/^(Arrow|Key[WASD])/.test(e.code)) { keys[e.code] = true; e.preventDefault(); }
    if (e.code === 'Space' || e.code === 'Enter') {
      e.preventDefault();
      if (e.repeat) return;
      if (ui === 'title') newMatch({ mode: opts.mode, diff: opts.diff, target: opts.target });
      else if (phase === 'over' && stateT > 1.1) newMatch();
      else if (ui === 'pause') togglePause();
    } else if (e.code === 'KeyP' || e.code === 'Escape') togglePause();
  });
  window.addEventListener('keyup', e => { keys[e.code] = false; });
  window.addEventListener('blur', () => { for (const k in keys) keys[k] = false; });
  window.addEventListener('resize', resize);
  document.addEventListener('visibilitychange', () => { if (document.hidden && !demo && ui === null && phase !== 'over') togglePause(); });

  /* =========================================================
   * 自動畫質：太卡就一步步降低（解析度 → 發光 → 影子），並記住
   * ========================================================= */
  const QKEY = 'quality:' + location.pathname.split('/').filter(Boolean).slice(-1)[0];
  const baseRatio = Math.min(window.devicePixelRatio || 1, small ? 1.75 : 2);
  const QLEVELS = [
    { ratio: baseRatio, bloom: true, shadow: true },
    { ratio: Math.min(baseRatio, 1.35), bloom: true, shadow: true },
    { ratio: 1, bloom: true, shadow: true },
    { ratio: 1, bloom: false, shadow: true },
    { ratio: 1, bloom: false, shadow: false }
  ];
  let qLevel = clamp(KG.store.get(QKEY, KG.lowEnd ? 2 : 0) | 0, 0, QLEVELS.length - 1);
  const perf = { last: 0, n: 0, sum: 0, cool: 2.5 };
  function applyQuality() {
    const q = QLEVELS[qLevel];
    renderer.setPixelRatio(q.ratio);
    renderer.setSize(W, H, false);
    composer.setPixelRatio(q.ratio);
    composer.setSize(W, H);
    if (renderer.shadowMap.enabled !== q.shadow) {
      renderer.shadowMap.enabled = q.shadow;
      scene.traverse(o => { if (o.material) [].concat(o.material).forEach(m => { m.needsUpdate = true; }); });
    }
  }
  function renderFrame() {
    if (QLEVELS[qLevel].bloom) composer.render(); else renderer.render(scene, cam);
    const now = performance.now(), dt = perf.last ? Math.min(0.5, (now - perf.last) / 1000) : 0;
    perf.last = now;
    if (document.hidden || qLevel >= QLEVELS.length - 1) return;
    perf.cool -= dt;
    if (perf.cool > 0) return;
    perf.sum += dt; perf.n++;
    if (perf.n >= 60) {
      if (perf.sum / perf.n > 1 / 45) {
        qLevel++;
        KG.store.set(QKEY, qLevel);
        applyQuality();
        perf.cool = 1.5;
      }
      perf.n = 0; perf.sum = 0;
    }
  }

  let last = performance.now(), first = true;
  function frame(now) {
    const dt = Math.max(0, Math.min(0.05, (now - last) / 1000));
    last = now;
    if (!document.hidden) update(dt);
    updateCamera();
    sync3D();
    renderFrame();
    drawHUD();
    if (first) { first = false; const m = document.getElementById('msg'); if (m) m.remove(); }
    requestAnimationFrame(frame);
  }
  resize();
  applyQuality();
  toTitle();
  requestAnimationFrame(frame);

  /* ---------- 測試用 ---------- */
  window.__ah = {
    state: () => ({
      phase, ui, demo, mode: opts.mode, diff: opts.diff, target: opts.target, score: score.slice(), winner, rally,
      puck: { x: +puck.x.toFixed(3), y: +puck.y.toFixed(3), vx: +puck.vx.toFixed(3), vy: +puck.vy.toFixed(3), h: +puck.h.toFixed(3) },
      m1: { x: +mallets[0].x.toFixed(3), y: +mallets[0].y.toFixed(3) }, m2: { x: +mallets[1].x.toFixed(3), y: +mallets[1].y.toFixed(3) },
      sideT: +sideT.toFixed(2), fouls, q: qLevel, stats: JSON.parse(JSON.stringify(stats)), two: view.two
    }),
    start: o => newMatch(o || {}),
    title: () => toTitle(),
    step: (n, dt) => { for (let i = 0; i < (n || 1); i++) update(dt || 1 / 60); },
    setPointer: (p, x, y) => { mallets[p].tx = x; mallets[p].ty = y; },
    puck: (x, y, vx, vy) => { puck.x = x; puck.y = y; puck.vx = vx || 0; puck.vy = vy || 0; puck.h = 0; puck.sink = 0; phase = 'play'; stateT = 0; sideT = 0; clearTrail(); },
    mallet: (p, x, y) => { const m = mallets[p]; m.x = m.tx = x; m.y = m.ty = y; },
    screen: (x, y) => toScreen(x, y, 0.02).map(Math.round),
    auto: on => { autoP1 = !!on; mallets[0].ai = autoP1 ? DIFFS.hard : (demo ? DIFFS.normal : null); },
    hits: () => HITS.map(h => ({ id: h.id, x: Math.round(h.x + h.w / 2), y: Math.round(h.y + h.h / 2) })),
    pause: () => togglePause()
  };
}
</script>
</body>
