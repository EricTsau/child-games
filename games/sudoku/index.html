<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>數獨 Sudoku</title>
<link rel="stylesheet" href="../../assets/common.css">
<style>
  :root { --gold: #d6b46e; --gold2: #a8813f; --ink: #f2ead9; --mut: #b6aa95; --panel: rgba(22, 17, 13, .86); --line: rgba(214, 180, 110, .42);
    --pf: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", "Heiti TC", system-ui, sans-serif;
    --sf: "BiauKai", "DFKai-SB", "標楷體", "Kaiti TC", "STKaiti", "KaiTi", "Noto Serif TC", "Source Han Serif TC", "Songti TC", "PMingLiU", serif;
    --nf: "Iowan Old Style", "Palatino Linotype", "Palatino", "Book Antiqua", "URW Palladio L", "P052", "Noto Serif", "Source Serif Pro", "DejaVu Serif", "Times New Roman", serif;
    /* 盤面（淺色） */
    --b-thick: #2e2822; --b-thin: #cbbfa6; --b-cell: #faf6ec; --b-hl: #efe6d2; --b-same: #ead8a6; --b-sel: #e3c983; --b-selln: #9d7630;
    --b-given: #1d1915; --b-user: #2a5888; --b-note: #7a6e5e; --b-noteh: #9a6d14; --b-err: #b3261e; --b-errbg: #f4dad4; --b-gold: rgba(214, 170, 80, .75); --b-hu: #f3ead0; }
  body.dk { --b-thick: #7a6036; --b-thin: #3a342c; --b-cell: #1e1b18; --b-hl: #29251f; --b-same: #4a3d22; --b-sel: #6a5428; --b-selln: #d6b46e;
    --b-given: #eee5d2; --b-user: #8fbbe8; --b-note: #a2968a; --b-noteh: #f0cf86; --b-err: #ff8a7a; --b-errbg: #3f201c; --b-gold: rgba(240, 200, 110, .55); --b-hu: #2c2820; }
  html, body { height: 100%; overflow: hidden; color: var(--ink); font-family: var(--pf); touch-action: none; }
  body { background: radial-gradient(ellipse at 50% 38%, #2a211a 0%, #16110d 55%, #0b0907 100%); }
  body::before { content: ''; position: fixed; inset: 0; pointer-events: none; opacity: .5;
    background-image: linear-gradient(rgba(214, 180, 110, .035) 1px, transparent 1px), linear-gradient(90deg, rgba(214, 180, 110, .035) 1px, transparent 1px); background-size: 36px 36px; }
  .hide { display: none !important; }
  button { font-family: var(--pf); -webkit-user-select: none; user-select: none; color: inherit; }
  .kg-fab { background: rgba(22, 16, 12, .84); border: 1.5px solid var(--line); box-shadow: 0 4px 14px rgba(0, 0, 0, .5); font-size: 20px; }
  .kg-fab:hover { border-color: var(--gold); }
  .glass { background: var(--panel); border: 1px solid var(--line); box-shadow: 0 6px 22px rgba(0, 0, 0, .45); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); }
  .ui { position: fixed; z-index: 50; }

  #bPause { right: 10px; top: 66px; width: 48px; height: 48px; padding: 0; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; }
  #bPause svg { width: 20px; height: 20px; }
  #bPause:active { transform: translateY(1px); border-color: var(--gold); }

  #info { height: 44px; border-radius: 10px; display: flex; align-items: center; justify-content: space-around; gap: 6px; padding: 0 10px; font-size: 13px; letter-spacing: 1px; color: var(--mut); white-space: nowrap; overflow: hidden; }
  #info b { color: var(--ink); font-weight: 700; }
  #info .dn { font-family: var(--sf); font-size: 16px; color: var(--gold); letter-spacing: 3px; font-weight: 800; }
  #info .dl { font-size: 10.5px; color: #1d1408; background: linear-gradient(180deg, #e4c47f, #b68c45); border-radius: 4px; padding: 1px 5px; margin-left: 4px; letter-spacing: 1px; font-weight: 800; }
  #info .tm { font-variant-numeric: tabular-nums; font-size: 15px; color: var(--ink); letter-spacing: 1px; }
  #info .sep { width: 1px; height: 14px; background: rgba(214, 180, 110, .3); flex: none; }
  #info .mk.bad b { color: #ff8a7a; }

  /* 盤面 */
  #bw { z-index: 40; border-radius: 6px; box-shadow: 0 0 0 1px rgba(214, 180, 110, .55), 0 0 0 5px rgba(20, 15, 11, .9), 0 0 0 6px rgba(214, 180, 110, .3), 0 18px 46px rgba(0, 0, 0, .6); }
  #board { --c: 40px; position: relative; display: grid; grid-template-columns: repeat(3, auto); gap: 3px; padding: 3px; background: var(--b-thick); border-radius: 5px; touch-action: none; cursor: pointer; }
  .box { display: grid; grid-template-columns: repeat(3, var(--c)); grid-auto-rows: var(--c); gap: 1px; background: var(--b-thin); }
  .cell { position: relative; background: var(--b-cell); display: grid; place-items: center; overflow: hidden; transition: background-color .14s; }
  .cell .v { position: relative; z-index: 2; font-family: var(--nf); font-size: calc(var(--c) * .64); line-height: 1; color: var(--b-user); font-weight: 500; pointer-events: none; }
  .cell.g .v { color: var(--b-given); font-weight: 700; }
  .cell.u .v { font-family: var(--pf); font-weight: 400; font-size: calc(var(--c) * .58); }
  .cell .nt { position: absolute; inset: 1px; display: grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(3, 1fr); z-index: 2; pointer-events: none; }
  .cell .nt span { display: grid; place-items: center; font-size: calc(var(--c) * .25); line-height: 1; color: var(--b-note); font-weight: 600; visibility: hidden; font-family: var(--pf); font-variant-numeric: tabular-nums; }
  .cell .nt span.on { visibility: visible; }
  .cell .nt span.hi { color: var(--b-noteh); font-weight: 900; }
  .cell.hl, .cell.hu { background: var(--b-hl); }
  .cell.hu { background: var(--b-hu); }
  .cell.same { background: var(--b-same); }
  .cell.sel { background: var(--b-sel); box-shadow: inset 0 0 0 2px var(--b-selln); }
  .cell.err .v { color: var(--b-err); }
  .cell.err { background: var(--b-errbg); }
  .cell.err.sel { background: var(--b-errbg); box-shadow: inset 0 0 0 2px var(--b-err); }
  .cell.cf .v { color: var(--b-err); text-decoration: underline; text-decoration-thickness: 1.5px; text-underline-offset: 3px; }
  .cell.hint { box-shadow: inset 0 0 0 2px var(--b-selln); animation: hintP 1.4s ease-in-out infinite; }
  @keyframes hintP { 50% { box-shadow: inset 0 0 0 4px var(--b-selln); } }
  .cell .fx { position: absolute; inset: 0; z-index: 1; opacity: 0; pointer-events: none; background: radial-gradient(circle at 50% 50%, rgba(255, 236, 180, .95), var(--b-gold) 60%, rgba(214, 170, 80, .25)); }
  #board.veil .v, #board.veil .nt { visibility: hidden !important; }
  #board.veil .cell { background: var(--b-cell) !important; box-shadow: none !important; animation: none !important; }
  #veil { position: absolute; inset: 0; z-index: 5; display: grid; place-items: center; font-family: var(--sf); font-size: 26px; letter-spacing: 10px; padding-left: 10px; color: var(--b-note); pointer-events: none; }

  #msg { display: flex; align-items: center; justify-content: center; text-align: center; font-size: 13.5px; line-height: 1.45; letter-spacing: .5px; color: #e9dcc0; padding: 0 6px; pointer-events: none; }
  #msg span { opacity: 0; transition: opacity .3s; }
  #msg span.on { opacity: 1; }
  #msg em { font-style: normal; color: var(--gold); font-weight: 800; font-family: var(--nf); font-size: 1.15em; }

  #tools { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
  .tb { position: relative; border-radius: 10px; border: 1px solid var(--line); background: linear-gradient(180deg, rgba(46, 36, 28, .95), rgba(22, 16, 12, .95)); color: var(--ink); font-size: 12.5px; font-weight: 700; letter-spacing: 1px; cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; box-shadow: 0 4px 12px rgba(0, 0, 0, .4), inset 0 1px 0 rgba(255, 255, 255, .06); touch-action: manipulation; transition: transform .08s, border-color .2s, opacity .2s, background .2s; min-height: 44px; padding: 0 2px; white-space: nowrap; }
  .tb svg { width: 20px; height: 20px; flex: none; }
  .tb:active { transform: translateY(1px); border-color: var(--gold); }
  .tb:disabled { opacity: .35; cursor: default; }
  .tb .pill { position: absolute; top: 4px; right: 4px; font-size: 9px; letter-spacing: 0; padding: 1px 4px; border-radius: 4px; background: rgba(255, 255, 255, .1); color: var(--mut); line-height: 1.3; }
  .tb.on { border-color: var(--gold); background: linear-gradient(180deg, rgba(110, 84, 40, .95), rgba(50, 37, 20, .95)); }
  .tb.on .pill { background: var(--gold); color: #1d1408; }
  body.land .tb { flex-direction: row; gap: 6px; font-size: 13.5px; }
  body.big #info { font-size: 14.5px; } body.big #info .dn { font-size: 19px; } body.big #info .tm { font-size: 18px; } body.big #msg { font-size: 15.5px; } body.big .tb { font-size: 15px; } body.big .nk small { font-size: 12.5px; }
  body.land.short .tb { flex-direction: column; gap: 2px; font-size: 12px; }

  #pad { display: grid; grid-template-columns: repeat(5, 1fr); grid-auto-rows: 1fr; gap: 8px; }
  .nk { position: relative; border-radius: 10px; border: 1px solid rgba(214, 180, 110, .5); background: linear-gradient(180deg, #f8f1e1, #e6d9bd); color: #231d17; cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; box-shadow: 0 4px 0 #8e7448, 0 8px 16px rgba(0, 0, 0, .4); touch-action: manipulation; transition: transform .07s, box-shadow .07s, opacity .25s; min-height: 44px; padding: 0; }
  .nk:active { transform: translateY(3px); box-shadow: 0 1px 0 #8e7448, 0 3px 8px rgba(0, 0, 0, .4); }
  .nk b { font-family: var(--nf); font-size: var(--nkf, 30px); line-height: 1; font-weight: 600; }
  .nk small { font-size: 10.5px; color: #8a7350; letter-spacing: 0; line-height: 1; margin-top: 3px; font-variant-numeric: tabular-nums; }
  .nk.done { opacity: .28; pointer-events: none; box-shadow: 0 1px 0 #8e7448; transform: translateY(3px); }
  .nk.er { background: linear-gradient(180deg, rgba(46, 36, 28, .95), rgba(22, 16, 12, .95)); color: var(--ink); border-color: var(--line); box-shadow: 0 4px 0 #050403, 0 8px 16px rgba(0, 0, 0, .4); }
  .nk.er svg { width: 22px; height: 22px; }
  .nk.er small { color: var(--mut); font-size: 12px; margin-top: 4px; letter-spacing: 1px; }
  #pad.nm .nk:not(.er) { background: linear-gradient(180deg, #3b2f22, #241b13); color: var(--gold); border-color: var(--gold); box-shadow: 0 4px 0 #0c0906, 0 8px 16px rgba(0, 0, 0, .4); }
  #pad.nm .nk:not(.er) b { font-family: var(--pf); font-size: calc(var(--nkf, 30px) * .68); font-weight: 700; }
  #pad.nm .nk:not(.er) small { color: var(--mut); }
  .nk.flash { animation: nkF .35s ease; }
  @keyframes nkF { 40% { filter: brightness(1.18); } }

  /* 遮罩與卡片 */
  .ov { position: fixed; inset: 0; z-index: 9200; display: flex; align-items: center; justify-content: center; padding: 16px; background: rgba(6, 4, 3, .62); animation: kg-fade .25s ease; }
  .card { background: rgba(20, 15, 11, .96) !important; width: min(440px, 100%); max-height: calc(100% - 8px); overflow: auto; border-radius: 14px; padding: 20px 18px 16px; text-align: center; color: var(--ink); animation: cardIn .35s cubic-bezier(.2, .9, .3, 1); }
  @keyframes cardIn { from { transform: translateY(14px) scale(.97); opacity: 0; } }
  .card h2 { margin: 0 0 8px; font-family: var(--sf); font-size: 25px; letter-spacing: 6px; padding-left: 6px; color: var(--gold); font-weight: 800; }
  .card p { margin: 0 0 12px; font-size: 14px; line-height: 1.6; color: var(--mut); }
  .gbtn { font-family: var(--pf); font-size: 15.5px; font-weight: 800; letter-spacing: 3px; min-height: 46px; padding: 8px 16px; border-radius: 9px; cursor: pointer; border: 1px solid var(--line); background: rgba(255, 255, 255, .04); color: var(--ink); transition: transform .1s, background .2s, border-color .2s; touch-action: manipulation; }
  .gbtn:hover { border-color: var(--gold); }
  .gbtn:active { transform: translateY(1px); }
  .gbtn.pri { background: linear-gradient(180deg, #e4c47f, #b68c45); color: #1d1408; border-color: #f0d79c; box-shadow: 0 6px 16px rgba(180, 140, 70, .3); }
  .gbtn small { display: block; font-size: 11px; letter-spacing: 1px; font-weight: 500; opacity: .8; margin-top: 1px; }
  .acts { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
  .acts .gbtn { flex: 1; min-width: 120px; }

  #title { background: linear-gradient(180deg, rgba(8, 5, 3, .55) 0%, rgba(8, 5, 3, .2) 35%, rgba(8, 5, 3, .5) 60%, rgba(8, 5, 3, .9) 100%); flex-direction: column; justify-content: space-between; padding: 70px 16px calc(16px + env(safe-area-inset-bottom)); }
  #tdeco { position: fixed; inset: 0; z-index: -1; pointer-events: none; }
  .logo { text-align: center; pointer-events: none; }
  .logo .sub { font-size: 11px; letter-spacing: 6px; color: var(--gold); opacity: .9; white-space: nowrap; }
  .logo .tl { display: flex; align-items: center; justify-content: center; gap: 14px; margin-top: 8px; white-space: nowrap; }
  .logo h1 { margin: 0; font-family: var(--sf); font-size: clamp(52px, 16vw, 92px); font-weight: 900; letter-spacing: .2em; padding-left: .2em; color: #f6efe0; text-shadow: 0 2px 0 rgba(0, 0, 0, .5), 0 0 30px rgba(214, 180, 110, .25); line-height: 1.1; white-space: nowrap; }
  .seal { flex: none; width: 1.05em; height: 1.05em; font-size: clamp(30px, 8vw, 50px); border-radius: 6px; background: #a8231c; color: #f7e6d0; font-family: var(--sf); font-weight: 900; display: grid; place-items: center; box-shadow: inset 0 0 0 3px #a8231c, inset 0 0 0 5px rgba(247, 230, 208, .75); transform: rotate(-4deg); line-height: 1; }
  .seal span { font-size: .62em; }
  .logo .motto { margin-top: 10px; font-family: var(--sf); font-size: 15px; letter-spacing: 8px; padding-left: 8px; color: #d9c9a8; white-space: nowrap; }
  .tcard { width: min(440px, 100%); border-radius: 14px; padding: 14px 14px 12px; }
  .seg { display: flex; border: 1px solid var(--line); border-radius: 9px; overflow: hidden; }
  .seg button { flex: 1; min-height: 44px; padding: 6px 2px; background: transparent; color: var(--mut); border: 0; border-left: 1px solid rgba(214, 180, 110, .25); font-size: 14px; font-weight: 700; letter-spacing: 1px; cursor: pointer; touch-action: manipulation; }
  .seg button:first-child { border-left: 0; }
  .seg button.on { background: rgba(214, 180, 110, .18); color: var(--ink); box-shadow: inset 0 -2px 0 var(--gold); }
  .seg.big button { font-size: 16px; font-family: var(--sf); letter-spacing: 3px; }
  .ddesc { font-size: 12px; color: var(--mut); letter-spacing: 1px; margin: 7px 0 9px; min-height: 17px; }
  .ddesc b { color: var(--gold); font-weight: 700; }
  .tbtns { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .tbtns .gbtn { font-size: 15px; letter-spacing: 2px; padding: 6px 8px; }
  .tbtns .wide { grid-column: 1 / -1; font-size: 17px; letter-spacing: 4px; }
  .tlinks { display: flex; gap: 8px; margin-top: 8px; }
  .tlinks .gbtn { flex: 1; font-size: 14px; letter-spacing: 2px; min-height: 44px; }
  .tips { margin-top: 8px; font-size: 11.5px; color: #8e8574; line-height: 1.6; }
  body.land #title { flex-direction: row; align-items: center; justify-content: space-between; gap: 18px; padding: 16px calc(70px + env(safe-area-inset-right)) 16px calc(70px + env(safe-area-inset-left)); background: linear-gradient(90deg, rgba(8, 5, 3, .35) 10%, rgba(8, 5, 3, .9) 100%); }
  body.land #title .logo { flex: 1; min-width: 0; }
  body.land #title .logo .sub { letter-spacing: 3px; font-size: 10.5px; }
  body.land #title .logo h1 { font-size: clamp(34px, min(7vw, 15vh), 96px); }
  body.land .seal { font-size: clamp(24px, min(4.5vw, 8vh), 50px); }
  body.land #title .tcard { width: min(430px, 52vw); flex: none; }
  body.short .tips { display: none; }
  body.short .logo .motto { font-size: 13px; letter-spacing: 5px; margin-top: 6px; }
  body.short .tcard { padding: 9px 11px; max-height: calc(100vh - 20px); overflow: auto; }
  body.short .seg button { min-height: 44px; font-size: 13px; }
  body.short .ddesc { margin: 4px 0 6px; }
  body.short .tbtns .gbtn { min-height: 44px; }
  body.short .tlinks { margin-top: 6px; }

  .stat { display: grid; grid-template-columns: 1fr auto; gap: 5px 14px; margin: 6px auto 14px; font-size: 14px; max-width: 300px; text-align: left; }
  .stat span:nth-child(2n) { text-align: right; font-variant-numeric: tabular-nums; color: var(--gold); font-weight: 700; }
  .stbl { width: 100%; border-collapse: collapse; font-size: 13px; margin: 4px 0 12px; font-variant-numeric: tabular-nums; }
  .stbl th { font-weight: 500; color: var(--mut); font-size: 11.5px; letter-spacing: 1px; padding: 4px 2px; border-bottom: 1px solid rgba(214, 180, 110, .25); }
  .stbl td { padding: 7px 2px; border-bottom: 1px solid rgba(214, 180, 110, .1); color: var(--ink); }
  .stbl td:first-child { font-family: var(--sf); color: var(--gold); font-size: 15px; letter-spacing: 2px; text-align: left; padding-left: 6px; }
  .dline { font-size: 13px; color: var(--mut); letter-spacing: 1px; margin-bottom: 12px; line-height: 1.7; }
  .dline b { color: var(--gold); }
  .sgrid { display: grid; grid-template-columns: 1fr; gap: 6px 16px; margin: 4px 0 12px; text-align: left; }
  .srow { display: flex; align-items: center; gap: 10px; }
  .srow label { flex: 1; font-size: 13.5px; color: var(--ink); letter-spacing: 1px; }
  .srow label small { display: block; font-size: 11px; color: var(--mut); letter-spacing: 0; }
  .srow .seg { flex: none; width: 128px; }
  .srow .seg button { min-height: 40px; font-size: 13px; }
  body.short .card { padding: 10px 14px; width: min(620px, 100%); }
  body.short .card h2 { font-size: 20px; margin: 0 0 4px; }
  body.short .sgrid { grid-template-columns: 1fr 1fr; gap: 4px 18px; margin-bottom: 8px; }
  body.short .srow .seg { width: 104px; }
  body.short .stbl td { padding: 4px 2px; }
  body.short .stat { grid-template-columns: 1fr auto 1fr auto; max-width: none; margin: 4px 0 8px; gap: 3px 14px; }
  body.short .pcard .acts .gbtn { min-width: 0; padding: 6px; font-size: 14px; letter-spacing: 1px; }

  .res { font-size: 12px; letter-spacing: 6px; color: var(--mut); }
  .big { font-family: var(--sf); font-size: 46px; font-weight: 900; color: #f0cf86; letter-spacing: 12px; padding-left: 12px; margin: 2px 0 4px; text-shadow: 0 0 26px rgba(214, 180, 110, .35); }
  .big.lose { color: #c9bfae; text-shadow: none; }
  .badge { display: inline-block; font-family: var(--sf); font-size: 15px; letter-spacing: 4px; padding: 2px 12px 2px 16px; border-radius: 4px; margin: 0 0 10px; color: #f7e6d0; background: #8e2019; box-shadow: inset 0 0 0 2px #8e2019, inset 0 0 0 3px rgba(247, 230, 208, .5); }
  .badge.gold { background: #8a6a2c; box-shadow: inset 0 0 0 2px #8a6a2c, inset 0 0 0 3px rgba(247, 230, 208, .5); }
  body.short #overOv .big { font-size: 34px; }
  .spin { width: 34px; height: 34px; margin: 6px auto 12px; border-radius: 50%; border: 3px solid rgba(214, 180, 110, .2); border-top-color: var(--gold); animation: spin .9s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  #setOv, #statOv, #cfOv { z-index: 9250; } #loadOv { z-index: 9260; }
  #fx { position: fixed; inset: 0; width: 100vw; height: 100vh; z-index: 9300; pointer-events: none; }
  .kg-toast { top: 46%; padding: 9px 20px; border-radius: 8px; background: rgba(20, 15, 11, .94); border: 1px solid var(--gold); color: #f0dcae; font-family: var(--sf); font-size: 17px; font-weight: 700; letter-spacing: 2px; white-space: nowrap; box-shadow: 0 8px 26px rgba(0, 0, 0, .55); }
  @media (prefers-reduced-motion: reduce) { .cell.hint { animation: none; } }
</style>
</head>
<body>
<div id="info" class="ui glass hide"></div>
<div id="bw" class="ui hide"><div id="board" role="grid" aria-label="數獨盤面"></div><div id="veil" class="hide">暫停中</div></div>
<div id="msg" class="ui hide"><span></span></div>
<div id="tools" class="ui hide">
  <button class="tb" id="tUndo" aria-label="復原"><svg viewBox="0 0 24 24" fill="none" stroke="#d6b46e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14 4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-3"/></svg>復原</button>

  }
  // 標題背景：淡金色九宮格

      c.beginPath(); c.moveTo(x0 + k * cs, y0); c.lineTo(x0 + k * cs, y0 + sz); c.moveTo(x0, y0 + k * cs); c.lineTo(x0 + sz, y0 + k * cs); c.stroke();

  // ---------------- 遊戲流程 ----------------
  function setFromStrings(p, s) {
    for (let i = 0; i < 81; i++) { S.given[i] = +p[i]; S.sol[i] = +s[i]; S.val[i] = +p[i]; S.notes[i] = 0; }
  }
  function firstEmpty() { for (let i = 40; i < 81; i++) if (!S.val[i]) return i; for (let i = 0; i < 40; i++) if (!S.val[i]) return i; return 40; }
  function beginGame(r, diff, opts) {
    opts = opts || {};

    abandonCurrent();
    S.diff = diff; S.daily = opts.daily || null; S.seed = r.seed >>> 0;
    setFromStrings(r.puzzle, r.solution);
    S.undo = []; S.redo = []; S.time = 0; S.mistakes = 0; S.hints = 0; S.over = null; S.paused = false;
    S.challenge = !!cfg.challenge; S.noteMode = false; S.hintCell = -1; S.hintUnit = -1;
    S.sel = 40; S.counted = !opts.practice;
    if (S.counted) { stats[diff].played++; saveStats(); }
    S.screen = 'play';
    clearSay();
    showScreen();
    render();
    for (let i = 0; i < 81; i++) if (S.given[i]) cellV[i].animate([{ opacity: 0, transform: 'scale(.7)' }, { opacity: 1, transform: 'scale(1)' }], { duration: 380, delay: (RO[i] + CO[i]) * 22, easing: 'ease-out', fill: 'backwards' });
    say(S.daily ? '每日挑戰 · ' + S.daily + ' · ' + DNAME[diff] : '新局開始 · ' + DNAME[diff] + (S.challenge ? ' · 挑戰模式（錯誤上限 3 次）' : ''), 2600);
    saveGame();
  }
  function abandonCurrent() {
    const sv = store.get('sd:cur', null);

    store.set('sd:cur', null);
  }
  function startNew(diff, seed) {
    cfg.diff = diff; saveCfg();
    if (seed == null && pool[diff].length) {
      const it = pool[diff].shift(); store.set('sd:pool', pool);
      beginGame({ puzzle: it.p, solution: it.s, seed: it.seed }, diff);
      setTimeout(fillPool, 600);
      return Promise.resolve(true);
    }
    showLoad(true);
    return genAsync(wFg, diff, seed).then(r => { showLoad(false); if (r) beginGame(r, diff); setTimeout(fillPool, 600); return !!r; });
  }
  function startDaily() {
    const di = dailyInfo();
    const sv = store.get('sd:cur', null);
    if (sv && sv.daily === di.key && !sv.over) { resumeSaved(); return Promise.resolve(true); }
    showLoad(true, '正在準備今日題目…');
    return genAsync(wFg, di.diff, di.seed).then(r => { showLoad(false); if (r) beginGame(r, di.diff, { daily: di.key, practice: !!daily.done[di.key] }); return !!r; });
  }
  function showLoad(on, m) { $('loadOv').classList.toggle('hide', !on); $('loadMsg').textContent = m || '正在出題…'; }

  // ---- 動作（含復原紀錄）----
  function commit(ch) {
    // ch: [i, pv, pn, nv, nn, ...]
    for (let k = 0; k < ch.length; k += 5) { S.val[ch[k]] = ch[k + 3]; S.notes[ch[k]] = ch[k + 4]; }
    S.undo.push(ch); S.redo.length = 0;
  }
  function canPlay() { return S.screen === 'play' && !S.over && !S.paused; }
  function clearHint() { if (S.hintCell >= 0) clearSay(); S.hintCell = -1; S.hintUnit = -1; }
  function input(d) {
    if (!canPlay()) return;
    const i = S.sel;
    if (i < 0) return;
    if (S.noteMode) return toggleNote(i, d);
    setValue(i, d);
  }
  function setValue(i, d, fromHint) {
    if (!canPlay() || S.given[i]) { if (S.given[i]) { sfx('tap'); } return false; }
    if (S.val[i] === d) return false;
    const ch = [i, S.val[i], S.notes[i], d, 0];
    if (cfg.autoClear) {
      const b = 1 << (d - 1);
      for (const p of PEERS[i]) if (!S.val[p] && (S.notes[p] & b)) ch.push(p, 0, S.notes[p], 0, S.notes[p] & ~b);
    }
    if (fromHint) ch.hint = 1;
    commit(ch);
    if (S.hintCell !== i || !fromHint) clearHint();
    const ok = d === S.sol[i];
    popCell(i);
    if (!ok) {
      S.mistakes++;
      if (cfg.errCheck || S.challenge) { sfx('wrong'); shakeCell(i); KG.vibrate(40); }
      else sfx('place', d);
      if (S.challenge && S.mistakes >= 3) { render(); saveGame(); setTimeout(() => lose(), 500); return true; }
    } else {
      sfx('place', d);
      let k = 0;
      for (const u of [RO[i], 9 + CO[i], 18 + BO[i]]) {
        if (UNITS[u].every(j => S.val[j] === S.sol[j])) { sweepUnit(u, i, k * 120); k++; }
      }
      if (k) setTimeout(() => sfx('unit'), 120);
    }
    render();
    checkWin(i);
    saveGame();
    return true;
  }
  function toggleNote(i, d) {
    if (!canPlay() || S.val[i]) { if (S.val[i]) sfx('tap'); return false; }
    const nn = S.notes[i] ^ (1 << (d - 1));
    commit([i, 0, S.notes[i], 0, nn]);
    clearHint();
    sfx('note');
    render(); saveGame();
    return true;
  }
  function erase() {
    if (!canPlay()) return false;
    const i = S.sel;
    if (i < 0 || S.given[i]) return false;
    if (!S.val[i] && !S.notes[i]) return false;
    commit(S.val[i] ? [i, S.val[i], S.notes[i], 0, 0] : [i, 0, S.notes[i], 0, 0]);
    clearHint();
    sfx('erase');
    render(); saveGame();
    return true;
  }
  function undo() {
    if (!canPlay() || !S.undo.length) return false;
    const ch = S.undo.pop();
    for (let k = ch.length - 5; k >= 0; k -= 5) { S.val[ch[k]] = ch[k + 1]; S.notes[ch[k]] = ch[k + 2]; }
    S.redo.push(ch); S.sel = ch[0]; clearHint();
    sfx('undo'); render(); saveGame();
    return true;
  }
  function redo() {
    if (!canPlay() || !S.redo.length) return false;
    const ch = S.redo.pop();
    for (let k = 0; k < ch.length; k += 5) { S.val[ch[k]] = ch[k + 3]; S.notes[ch[k]] = ch[k + 4]; }
    S.undo.push(ch); S.sel = ch[0]; clearHint();
    sfx('redo'); render(); checkWin(ch[0]); saveGame();
    return true;
  }
  function autoNotes() {
    if (!canPlay()) return false;
    const cand = E.candidates(S.val), ch = [];
    for (let i = 0; i < 81; i++) if (!S.val[i] && S.notes[i] !== cand[i]) ch.push(i, 0, S.notes[i], 0, cand[i]);
    if (!ch.length) { say('筆記已是最新的候選數', 2000); return false; }
    commit(ch); clearHint();
    sfx('auto');
    for (let k = 0; k < ch.length; k += 5) cellN[ch[k]][0].parentNode.animate([{ opacity: 0 }, { opacity: 1 }], { duration: 300, delay: (RO[ch[k]] + CO[ch[k]]) * 12 });
    say('已為所有空格填入候選數', 2200);
    render(); saveGame();
    return true;
  }
  const UNAME = u => u < 9 ? '橫列' : u < 18 ? '直行' : '宮';
  function hint() {
    if (!canPlay()) return null;
    // 先處理填錯的格子
    let wrong = -1;
    if (S.sel >= 0 && S.val[S.sel] && !S.given[S.sel] && S.val[S.sel] !== S.sol[S.sel]) wrong = S.sel;
    for (let i = 0; i < 81 && wrong < 0; i++) if (S.val[i] && S.val[i] !== S.sol[i]) wrong = i;
    let i, d, text, unit = -1;
    if (wrong >= 0) {
      i = wrong; d = S.sol[i];
      text = '這一格填錯了，正確應為 <em>' + d + '</em>';
    } else {
      const h = E.hint(S.val);
      if (h && S.sol[h.i] === h.d) {
        i = h.i; d = h.d; unit = h.unit;
        const pre = h.techs.length ? '運用' + h.techs.slice(0, 2).map(t => TECH[t] || t).join('、') + '排除候選後，' : '';
        if (h.type === 'full') text = pre + '這一' + UNAME(h.unit) + '只剩 <em>' + d + '</em> 可以放';
        else if (h.type === 'hidden') text = pre + '在這一' + UNAME(h.unit) + '中，<em>' + d + '</em> 只能放在這一格';
        else text = pre + '這一格的橫列、直行與宮已排除其他數字，只剩 <em>' + d + '</em> 可以放';
      } else {
        // 需要試填或鏈推理：挑候選最少的格
        const cand = E.candidates(S.val);
        let bi = -1, bc = 10;
        for (let k = 0; k < 81; k++) if (!S.val[k]) { let c = 0; for (let b = 0; b < 9; b++) if (cand[k] >> b & 1) c++; if (c < bc) { bc = c; bi = k; } }
        if (bi < 0) return null;
        i = bi; d = S.sol[i];
        text = '此處需要鏈推理或試填才能確定：這一格是 <em>' + d + '</em>';
      }
    }
    S.hints++;
    S.sel = i;
    S.hintCell = i; S.hintUnit = unit;
    sfx('hint');
    setValue(i, d, true);
    if (S.val[i] !== d) return null;
    say(text, 0);
    render(); saveGame();
    return { i, d, text, unit };
  }
  function checkWin(last) {
    for (let i = 0; i < 81; i++) if (S.val[i] !== S.sol[i]) {
      let full = true; for (let k = 0; k < 81; k++) if (!S.val[k]) { full = false; break; }

  }
  function win(last) {

    let newBest = false, dailyNew = false;
    if (S.counted) {
      st.solved++; st.total += S.time; st.streak++; st.bestStreak = Math.max(st.bestStreak, st.streak);

      v: 1, diff: S.diff, daily: S.daily, seed: S.seed, g: Array.from(S.given).join(''), s: Array.from(S.sol).join(''), val: Array.from(S.val).join(''),

  // ---------------- 輸入 ----------------
  function cellFromPoint(x, y) {
    const el = document.elementFromPoint(x, y);
    const c = el && el.closest && el.closest('.cell');
    return c ? +c.dataset.i : -1;
  }
  boardEl.addEventListener('pointerdown', e => {
    if (!canPlay()) return;
    const i = cellFromPoint(e.clientX, e.clientY);
    if (i < 0) return;
    e.preventDefault();
    select(i);
  });
  boardEl.addEventListener('pointermove', e => {
    if (!canPlay() || !(e.buttons & 1) && e.pointerType === 'mouse') return;
    if (e.pressure === 0 && e.pointerType !== 'mouse') return;
    const i = cellFromPoint(e.clientX, e.clientY);
    if (i >= 0 && i !== S.sel) select(i);
  });
  function select(i) {
    if (S.sel === i) { render(); return; }
    S.sel = i;
    if (S.hintCell >= 0 && S.hintCell !== i) clearHint();
    sfx('tap');
    render();
  }
  padEl.addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    if (b.id === 'tErase') { erase(); return; }
    b.classList.remove('flash'); void b.offsetWidth; b.classList.add('flash');
    input(+b.dataset.d);
  });
  $('tUndo').onclick = () => undo();
  $('tRedo').onclick = () => redo();
  $('tNote').onclick = () => toggleNoteMode();
  $('tAuto').onclick = () => autoNotes();
  $('tHint').onclick = () => hint();
  $('bPause').onclick = () => togglePause();
  function toggleNoteMode() { if (!canPlay()) return; S.noteMode = !S.noteMode; sfx('ui'); say(S.noteMode ? '筆記模式：點數字加入或移除候選數' : '一般模式', 1500); render(); saveGame(); }
  function move(dr, dc) {
    let i = S.sel < 0 ? 40 : S.sel;
    const r = (RO[i] + dr + 9) % 9, c = (CO[i] + dc + 9) % 9;
    select(r * 9 + c);
  }
  addEventListener('keydown', e => {
    if (e.repeat && !/^Arrow/.test(e.key)) return;
    const k = e.key;
    if (S.screen !== 'play') return;
    const modal = !$('setOv').classList.contains('hide') || !$('cfOv').classList.contains('hide') || !$('overOv').classList.contains('hide') || !$('statOv').classList.contains('hide');
    if (modal) { if (k === 'Escape') { ['setOv', 'cfOv', 'statOv'].forEach(id => $(id).classList.add('hide')); } return; }
    if (k === 'Escape' || k === 'p' || k === 'P') { togglePause(); e.preventDefault(); return; }
    if (S.paused || S.over) return;
    const m = /^(Digit|Numpad)([1-9])$/.exec(e.code);
    if (m && !e.ctrlKey && !e.metaKey && !e.altKey) {
      const d = +m[2];
      if (e.shiftKey) toggleNote(S.sel, d); else input(d);
      e.preventDefault(); return;
    }
    if (k === 'ArrowUp') move(-1, 0); else if (k === 'ArrowDown') move(1, 0);
    else if (k === 'ArrowLeft') move(0, -1); else if (k === 'ArrowRight') move(0, 1);
    else if (k === 'Backspace' || k === 'Delete' || k === '0') erase();
    else if (k === 'n' || k === 'N') toggleNoteMode();
    else if ((k === 'z' || k === 'Z') && e.shiftKey) redo();
    else if (k === 'z' || k === 'Z') undo();
    else if (k === 'y' || k === 'Y') redo();
    else if (k === 'h' || k === 'H') hint();
    else return;
    e.preventDefault();
  });

  // 標題畫面按鈕
  bindSeg('segDiff', v => { cfg.diff = v; saveCfg(); refreshTitle(); });
  $('tNew').onclick = () => {
    sfx('ui');
    const sv = store.get('sd:cur', null);
    if (sv) confirmBox('開始新局', '目前有一局尚未完成，開始新局將放棄它，確定嗎？', () => startNew(cfg.diff));
    else startNew(cfg.diff);
  };
  $('tResume').onclick = () => { sfx('ui'); resumeSaved(); };
  $('tDaily').onclick = () => {
    sfx('ui');
    const di = dailyInfo(), sv = store.get('sd:cur', null);
    if (sv && sv.daily !== di.key) confirmBox('每日挑戰', '目前有一局尚未完成，開始每日挑戰將放棄它，確定嗎？', () => startDaily());
    else startDaily();
  };
  $('tStats').onclick = () => { sfx('ui'); openStats(); };
  $('tSet').onclick = () => { sfx('ui'); openSettings(); };
  $('setClose').onclick = () => { sfx('ui'); $('setOv').classList.add('hide'); };
  $('statClose').onclick = () => { sfx('ui'); $('statOv').classList.add('hide'); };
  $('cfNo').onclick = () => { sfx('ui'); $('cfOv').classList.add('hide'); cfYes = null; };
  $('cfYes').onclick = () => { sfx('ui'); $('cfOv').classList.add('hide'); const f = cfYes; cfYes = null; if (f) f(); };
  $('pResume').onclick = () => togglePause(false);
  $('pSet').onclick = () => { sfx('ui'); openSettings(); };
  $('pRestart').onclick = () => { sfx('ui'); confirmBox('重新開始', '清除所有填入的數字與筆記，從頭開始這一題？', () => { restartSame(); }); };
  $('pQuit').onclick = () => { sfx('ui'); showTitle(); };

  // ---------------- 計時 ----------------
  let lastTick = performance.now(), saveAcc = 0;
  setInterval(() => {
    const now = performance.now(), dt = now - lastTick; lastTick = now;
    if (S.screen === 'play' && !S.over && !S.paused && !document.hidden) {
      S.time += Math.min(dt, 1000);
      renderInfo();
      saveAcc += dt;
      if (saveAcc > 5000) { saveAcc = 0; saveGame(); }
    }
  }, 250);
  addEventListener('resize', () => layout());
  document.addEventListener('visibilitychange', () => {
    if (document.hidden && S.screen === 'play' && !S.over && !S.paused) togglePause(true);
    if (document.hidden) saveGame();
  });
  addEventListener('pagehide', () => saveGame());

  // ---------------- 測試介面 ----------------
  window.__sd = {
    get state() {
      return {
        screen: S.screen, diff: S.diff, daily: S.daily, seed: S.seed, puzzle: Array.from(S.given).join(''), solution: Array.from(S.sol).join(''),
        values: Array.from(S.val).join(''), notes: Array.from(S.notes), undo: S.undo.length, redo: S.redo.length, time: S.time,
        mistakes: S.mistakes, hints: S.hints, sel: S.sel, noteMode: S.noteMode, over: S.over, paused: S.paused, challenge: S.challenge,
        hintCell: S.hintCell, layout: Object.assign({}, L)
      };
    },
    start: (diff, seed) => startNew(diff || 'medium', seed == null ? undefined : seed >>> 0),
    startDaily,
    set(r, c, v) { S.sel = r * 9 + c; return v ? setValue(S.sel, v) : erase(); },
    note(r, c, d) { S.sel = r * 9 + c; return toggleNote(S.sel, d); },
    select: (r, c) => select(r * 9 + c),
    solve() { for (let i = 0; i < 81; i++) if (S.val[i] !== S.sol[i]) { S.sel = i; setValue(i, S.sol[i]); if (S.over) break; } return S.over; },
    generate: (diff, seed) => E.generate(diff, seed),
    uniqueCheck(p) { const g = (typeof p === 'string' ? p.split('') : p).map(Number); return E.countSolutions(g, 2); },
    grade: p => DIFFS[E.grade((typeof p === 'string' ? p.split('') : p).map(Number)) - 1],
    hint, undo, redo, erase, autoNotes, toggleNoteMode, pause: v => togglePause(v), showTitle, resume: resumeSaved,
    dailyInfo, pool: () => DIFFS.map(d => d + ':' + pool[d].length).join(' '), stats: () => stats, daily: () => daily, cfg, engine: E
  };

  // ---------------- 啟動 ----------------
  applyTheme();
  wFg = makeWorker(); wBg = makeWorker();
  layout();
  showTitle();
  setTimeout(fillPool, 800);
  setTimeout(musicTick, 1500);
})();
</script>
</body>
</html>
