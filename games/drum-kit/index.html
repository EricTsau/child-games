<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>爵士鼓教室</title>
<link rel="stylesheet" href="../../assets/common.css">
<style>
  html, body { height: 100%; overflow: hidden; background: #1b1430; overscroll-behavior: none; }
  #game {
    position: fixed; inset: 0; display: block;
    width: 100vw; height: 100vh; height: 100dvh;
    touch-action: none; -webkit-touch-callout: none;
  }
</style>
</head>
<body>
<canvas id="game" aria-label="爵士鼓教室"></canvas>
<script src="../../assets/common.js"></script>
<script src="../../assets/kg-music.js"></script>
<script>
'use strict';
const SLUG = 'drum-kit';
/* =====================================================================
 * 爵士鼓教室：自由演奏、節奏課程、錄音室
 * 鼓聲用 OfflineAudioContext 預先合成（每種鼓兩個版本輪流用），
 * 打擊時只要建立 BufferSource 並在 ctx.currentTime 立刻播放，延遲最低。
 * ===================================================================== */
const cv = document.getElementById('game');
const ctx = cv.getContext('2d');
const FONT = '"Baloo 2","PingFang TC","Noto Sans TC","Microsoft JhengHei","Heiti TC",system-ui,sans-serif';
let W = 1, H = 1, dpr = 1, U = 1, time = 0, frameNo = 0, cvRect = { left: 0, top: 0, width: 1, height: 1 };
const TAU = Math.PI * 2;
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const Ease = {
  outCubic: t => 1 - Math.pow(1 - t, 3),
  outBack: t => { const c = 1.70158, c3 = c + 1; return 1 + c3 * Math.pow(t - 1, 3) + c * Math.pow(t - 1, 2); },
  inOutSine: t => -(Math.cos(Math.PI * t) - 1) / 2
};

/* ---------- 存檔 ---------- */
const Save = {
  get(k, d) { return KG.store.get(SLUG + ':' + k, d); },
  set(k, v) { KG.store.set(SLUG + ':' + k, v); }
};
const prefs = Object.assign({ sfx: true, metro: false, track: 'rock', bpm: 100, bars: 2, quant: true, slow: false, pedalOpen: false, lmetro: true },
  Save.get('prefs', {}));
function savePrefs() { Save.set('prefs', prefs); }

/* ---------- 繪圖小工具 ---------- */
function rr(x, y, w, h, r) {
  r = Math.max(0, Math.min(r, w / 2, h / 2));
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}
function rrOn(c, x, y, w, h, r) {
  r = Math.max(0, Math.min(r, w / 2, h / 2));
  c.beginPath(); c.moveTo(x + r, y);
  c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r);
  c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath();
}
function starPath(c, x, y, R, r, rot) {
  c.beginPath();
  for (let i = 0; i < 10; i++) {
    const a = (rot || 0) + i * Math.PI / 5 - Math.PI / 2, rad = i % 2 ? r : R;
    c.lineTo(x + Math.cos(a) * rad, y + Math.sin(a) * rad);
  }
  c.closePath();
}
function shade(hex, amt) {
  const n = parseInt(hex.slice(1), 16);
  const f = v => clamp(Math.round(v + amt), 0, 255);
  return 'rgb(' + f(n >> 16) + ',' + f((n >> 8) & 255) + ',' + f(n & 255) + ')';
}
function rgba(hex, a) {
  const n = parseInt(hex.slice(1), 16);
  return 'rgba(' + (n >> 16) + ',' + ((n >> 8) & 255) + ',' + (n & 255) + ',' + a + ')';
}
function txt(s, x, y, size, fill, o) {
  o = o || {};
  ctx.font = (o.weight || '900') + ' ' + size + 'px ' + FONT;
  ctx.textAlign = o.align || 'center';
  ctx.textBaseline = o.base || 'middle';
  if (o.stroke) { ctx.lineJoin = 'round'; ctx.strokeStyle = o.stroke; ctx.lineWidth = o.sw || size * 0.22; ctx.strokeText(s, x, y); }
  ctx.fillStyle = fill; ctx.fillText(s, x, y);
}
function fitText(s, maxW, size, weight) {
  ctx.font = (weight || '900') + ' ' + size + 'px ' + FONT;
  const w = ctx.measureText(s).width;
  return w > maxW ? Math.max(8, size * maxW / w) : size;
}
function makeCanvas(w, h) {
  const c = document.createElement('canvas');
  c.width = Math.max(1, Math.ceil(w)); c.height = Math.max(1, Math.ceil(h));
  return c;
}
/** 標題字：每個字輕輕彈跳，金色漸層 */
function logo(s, cx, cy, size) {
  ctx.save();
  ctx.font = '900 ' + size + 'px ' + FONT;
  ctx.textBaseline = 'middle'; ctx.textAlign = 'center'; ctx.lineJoin = 'round';
  const chars = [...s];
  const widths = chars.map(c => ctx.measureText(c).width * 1.04);
  const total = widths.reduce((a, b) => a + b, 0);
  let x = cx - total / 2;
  const cols = ['#ffd45c', '#ff8a5b', '#ff5f8f', '#5fd3ff', '#9cf06a'];
  chars.forEach((c, i) => {
    const w = widths[i];
    const beatK = Math.max(0, 1 - ((Fx.beatPulse || 0) * 3));
    const bob = Math.sin(time * 3 + i * 0.8) * size * 0.05 - (1 - beatK) * 0;
    ctx.save();
    ctx.translate(x + w / 2, cy + bob); ctx.rotate(Math.sin(time * 2 + i) * 0.05);
    ctx.strokeStyle = 'rgba(0,0,0,0.45)'; ctx.lineWidth = size * 0.34; ctx.strokeText(c, 0, size * 0.08);
    ctx.strokeStyle = '#2a1840'; ctx.lineWidth = size * 0.3; ctx.strokeText(c, 0, 0);
    ctx.strokeStyle = '#fff'; ctx.lineWidth = size * 0.13; ctx.strokeText(c, 0, 0);
    const col = cols[i % cols.length];
    const g = ctx.createLinearGradient(0, -size / 2, 0, size / 2);
    g.addColorStop(0, shade(col, 80)); g.addColorStop(0.5, col); g.addColorStop(1, shade(col, -45));
    ctx.fillStyle = g; ctx.fillText(c, 0, 0);
    ctx.restore();
    x += w;
  });
  ctx.restore();
}

/* ---------- 粒子（固定池，不在每格配置新物件） ---------- */
const Fx = {
  pool: [], beatPulse: 0, shakeT: 0, shakeA: 0, pops: [],
  init() {
    for (let i = 0; i < 90; i++) this.pool.push({ on: false, k: 0, x: 0, y: 0, vx: 0, vy: 0, life: 0, max: 1, size: 1, col: '#fff', rot: 0, vr: 0 });
    for (let i = 0; i < 12; i++) this.pops.push({ on: false, x: 0, y: 0, s: '', col: '#fff', life: 0, size: 20 });
  },
  get() {
    for (const p of this.pool) if (!p.on) return p;
    let o = this.pool[0];
    for (const p of this.pool) if (p.life < o.life) o = p;
    return o;
  },
  ring(x, y, rx, ry, col, life) {
    const p = this.get(); p.on = true; p.k = 1; p.x = x; p.y = y; p.size = rx; p.vr = ry; p.col = col; p.life = p.max = life || 0.35;
  },
  sparks(x, y, n, col, sp) {
    n = KG.lowEnd ? Math.ceil(n / 2) : n;
    for (let i = 0; i < n; i++) {
      const p = this.get(), a = -Math.PI / 2 + (Math.random() - 0.5) * 2.6, s = (sp || 260) * (0.4 + Math.random() * 0.8) * U;
      p.on = true; p.k = 2; p.x = x; p.y = y; p.vx = Math.cos(a) * s; p.vy = Math.sin(a) * s;
      p.life = p.max = 0.45 + Math.random() * 0.3; p.size = (3 + Math.random() * 4) * U; p.col = col; p.rot = Math.random() * 6; p.vr = (Math.random() - 0.5) * 10;
    }
  },
  pop(x, y, s, col, size) {
    let o = this.pops[0];
    for (const p of this.pops) { if (!p.on) { o = p; break; } if (p.life < o.life) o = p; }
    o.on = true; o.x = x; o.y = y; o.s = s; o.col = col; o.life = 0.7; o.size = size || 22 * U; o.tag = null;
    return o;
  },
  shake(a, t) { this.shakeA = Math.max(this.shakeA * (this.shakeT > 0 ? 1 : 0), a); this.shakeT = Math.max(this.shakeT, t || 0.2); },
  update(dt) {
    for (const p of this.pool) {
      if (!p.on) continue;
      p.life -= dt; if (p.life <= 0) { p.on = false; continue; }
      if (p.k === 2) { p.vy += 700 * U * dt; p.x += p.vx * dt; p.y += p.vy * dt; p.rot += p.vr * dt; }
    }
    for (const p of this.pops) if (p.on) { p.life -= dt; p.y -= 40 * U * dt; if (p.life <= 0) p.on = false; }
    if (this.shakeT > 0) this.shakeT -= dt;
    this.beatPulse = Math.max(0, this.beatPulse - dt);
  },
  offset() {
    if (this.shakeT <= 0) return 0;
    return (Math.random() * 2 - 1) * this.shakeA * Math.min(1, this.shakeT * 6);
  },
  draw() {
    for (const p of this.pool) {
      if (!p.on) continue;
      const a = p.life / p.max;
      ctx.globalAlpha = Math.min(1, a * 1.5);
      if (p.k === 1) {
        const k = 1 - a, r = p.size * (0.5 + k * 0.9);
        ctx.strokeStyle = p.col; ctx.lineWidth = (5 * a + 1) * U;
        ctx.beginPath(); ctx.ellipse(p.x, p.y, r, r * p.vr, 0, 0, TAU); ctx.stroke();
      } else {
        ctx.fillStyle = p.col; starPath(ctx, p.x, p.y, p.size, p.size * 0.45, p.rot); ctx.fill();
      }
    }
    ctx.globalAlpha = 1;
    for (const p of this.pops) {
      if (!p.on) continue;
      const t = 0.7 - p.life, sc = t < 0.15 ? Ease.outBack(t / 0.15) : 1;
      ctx.globalAlpha = Math.min(1, p.life * 3);
      txt(p.s, p.x, p.y, p.size * sc, p.col, { stroke: 'rgba(20,10,40,0.85)', sw: p.size * 0.25 });
    }
    ctx.globalAlpha = 1;
  }
};
Fx.init();

/* ---------- 介面元件（每格重新登記） ---------- */
let uiReg = [], pressed = {}, sliderDrag = {};
const PAL = {
  gold: ['#ffe9a0', '#f6b93b', '#a8700a'], red: ['#ff9b8f', '#e8504a', '#962626'], teal: ['#9ff3e4', '#22b8a4', '#106e62'],
  blue: ['#a9d8ff', '#3d8fe8', '#1f4f96'], purple: ['#dcc6ff', '#8a63e8', '#4b2f9a'], dark: ['#5a4a7c', '#3a2c58', '#1d142e'],
  green: ['#b4f59c', '#4cc35c', '#257a33'], pink: ['#ffc0dc', '#f0609a', '#9c2c5c']
};
function drawIcon(name, x, y, s, col) {
  ctx.save(); ctx.translate(x, y);
  ctx.fillStyle = col; ctx.strokeStyle = col; ctx.lineWidth = s * 0.18; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  if (name === 'play') { ctx.beginPath(); ctx.moveTo(-s * 0.32, -s * 0.45); ctx.lineTo(s * 0.45, 0); ctx.lineTo(-s * 0.32, s * 0.45); ctx.closePath(); ctx.fill(); }
  else if (name === 'stop') { rr(-s * 0.36, -s * 0.36, s * 0.72, s * 0.72, s * 0.1); ctx.fill(); }
  else if (name === 'rec') { ctx.fillStyle = '#ff3b3b'; ctx.beginPath(); ctx.arc(0, 0, s * 0.4, 0, TAU); ctx.fill(); ctx.lineWidth = s * 0.08; ctx.strokeStyle = '#fff'; ctx.stroke(); }
  else if (name === 'pause') { rr(-s * 0.32, -s * 0.38, s * 0.22, s * 0.76, s * 0.06); ctx.fill(); rr(s * 0.1, -s * 0.38, s * 0.22, s * 0.76, s * 0.06); ctx.fill(); }
  else if (name === 'back') { ctx.beginPath(); ctx.moveTo(s * 0.2, -s * 0.38); ctx.lineTo(-s * 0.2, 0); ctx.lineTo(s * 0.2, s * 0.38); ctx.stroke(); }
  else if (name === 'undo') { ctx.beginPath(); ctx.arc(s * 0.05, s * 0.05, s * 0.32, Math.PI * 1.05, Math.PI * 2.4); ctx.stroke(); ctx.beginPath(); ctx.moveTo(-s * 0.42, -s * 0.2); ctx.lineTo(-s * 0.28, s * 0.12); ctx.lineTo(-s * 0.02, -s * 0.12); ctx.stroke(); }
  else if (name === 'layer') { for (let i = 0; i < 3; i++) { ctx.beginPath(); ctx.ellipse(0, -s * 0.22 + i * s * 0.22, s * 0.4, s * 0.15, 0, 0, TAU); ctx.stroke(); } }
  else if (name === 'note') { ctx.beginPath(); ctx.ellipse(-s * 0.14, s * 0.28, s * 0.2, s * 0.14, -0.4, 0, TAU); ctx.fill(); ctx.lineWidth = s * 0.12; ctx.beginPath(); ctx.moveTo(s * 0.04, s * 0.28); ctx.lineTo(s * 0.04, -s * 0.42); ctx.quadraticCurveTo(s * 0.3, -s * 0.28, s * 0.36, -s * 0.06); ctx.stroke(); }
  else if (name === 'metro') { ctx.beginPath(); ctx.moveTo(-s * 0.3, s * 0.42); ctx.lineTo(-s * 0.12, -s * 0.42); ctx.lineTo(s * 0.12, -s * 0.42); ctx.lineTo(s * 0.3, s * 0.42); ctx.closePath(); ctx.lineWidth = s * 0.12; ctx.stroke(); ctx.beginPath(); ctx.moveTo(0, s * 0.25); ctx.lineTo(s * 0.26, -s * 0.3); ctx.stroke(); }
  else if (name === 'save') { rr(-s * 0.36, -s * 0.36, s * 0.72, s * 0.72, s * 0.08); ctx.lineWidth = s * 0.1; ctx.stroke(); ctx.fillRect(-s * 0.18, -s * 0.36, s * 0.36, s * 0.22); ctx.fillRect(-s * 0.22, s * 0.08, s * 0.44, s * 0.2); }
  else if (name === 'trash') { ctx.lineWidth = s * 0.1; ctx.beginPath(); ctx.moveTo(-s * 0.38, -s * 0.26); ctx.lineTo(s * 0.38, -s * 0.26); ctx.moveTo(-s * 0.1, -s * 0.38); ctx.lineTo(s * 0.1, -s * 0.38); ctx.stroke(); rr(-s * 0.28, -s * 0.18, s * 0.56, s * 0.58, s * 0.08); ctx.stroke(); }
  else if (name === 'lock') { ctx.lineWidth = s * 0.14; ctx.beginPath(); ctx.arc(0, -s * 0.1, s * 0.24, Math.PI, 0); ctx.stroke(); rr(-s * 0.34, -s * 0.1, s * 0.68, s * 0.52, s * 0.1); ctx.fill(); }
  ctx.restore();
}
/** 圓角按鈕。opts: {label, icon, color, onClick, size, active, disabled, sub} */
function button(id, x, y, w, h, opts) {
  uiReg.push({ id, type: 'btn', x, y, w, h, onClick: opts.onClick, disabled: opts.disabled });
  const pal = PAL[opts.color || 'gold'];
  const isDown = pressed[id] != null;
  const lip = Math.max(3, h * 0.09);
  const s = isDown ? 0.95 : (opts.pulse ? 1 + Math.sin(time * 5) * 0.03 : 1);
  ctx.save();
  ctx.translate(x + w / 2, y + h / 2); ctx.scale(s, s);
  if (opts.disabled) ctx.globalAlpha = 0.45;
  const r = opts.radius == null ? Math.min(h / 2, 16 * U) : opts.radius;
  const yo = isDown ? lip * 0.7 : 0;
  rr(-w / 2, -h / 2 + lip + 2, w, h, r); ctx.fillStyle = 'rgba(0,0,0,0.35)'; ctx.fill();
  rr(-w / 2, -h / 2 + lip, w, h, r); ctx.fillStyle = pal[2]; ctx.fill();
  rr(-w / 2, -h / 2 + yo, w, h, r);
  const g = ctx.createLinearGradient(0, -h / 2, 0, h / 2);
  g.addColorStop(0, pal[0]); g.addColorStop(0.5, pal[1]); g.addColorStop(1, shade(pal[1], -18));
  ctx.fillStyle = g; ctx.fill();
  if (opts.active) { ctx.strokeStyle = '#fff'; ctx.lineWidth = Math.max(2.5, 3 * U); ctx.stroke(); }
  rr(-w / 2 + r * 0.5, -h / 2 + yo + h * 0.08, w - r, h * 0.3, h * 0.15); ctx.fillStyle = 'rgba(255,255,255,0.32)'; ctx.fill();
  const tc = opts.color === 'gold' ? '#4a2a00' : '#fff';
  let fs = opts.size || Math.min(h * 0.42, 22 * U);
  if (opts.icon && opts.label) {
    fs = fitText(opts.label, w - fs * 1.9, fs);
    const tw = (ctx.font = '900 ' + fs + 'px ' + FONT, ctx.measureText(opts.label).width), tot = fs * 1.15 + tw;
    drawIcon(opts.icon, -tot / 2 + fs * 0.45, yo, fs * 1.0, tc);
    txt(opts.label, -tot / 2 + fs * 1.15 + tw / 2, yo + 1, fs, tc);
  } else if (opts.icon) drawIcon(opts.icon, 0, yo, fs * 1.2, tc);
  else if (opts.label != null) {
    fs = fitText(opts.label, w - 10 * U, fs);
    txt(opts.label, 0, yo + (opts.sub ? -h * 0.13 : 1), fs, tc);
    if (opts.sub) txt(opts.sub, 0, yo + h * 0.24, fitText(opts.sub, w - 8, fs * 0.62, '700'), tc, { weight: '700' });
  }
  ctx.restore();
}
/** 滑桿 */
function slider(id, x, y, w, h, val, min, max, onChange, label) {
  uiReg.push({ id, type: 'slider', x: x - 6, y, w: w + 12, h, min, max, onChange, sx: x, sw: w });
  const cy = y + h / 2, p = (val - min) / (max - min);
  rr(x, cy - 5 * U, w, 10 * U, 5 * U); ctx.fillStyle = 'rgba(0,0,0,0.45)'; ctx.fill();
  rr(x, cy - 5 * U, Math.max(10 * U, w * p), 10 * U, 5 * U);
  const g = ctx.createLinearGradient(x, 0, x + w, 0); g.addColorStop(0, '#22b8a4'); g.addColorStop(1, '#f6b93b');
  ctx.fillStyle = g; ctx.fill();
  const kx = x + w * p, kr = Math.min(h * 0.42, 15 * U);
  ctx.fillStyle = 'rgba(0,0,0,0.35)'; ctx.beginPath(); ctx.arc(kx, cy + 2, kr, 0, TAU); ctx.fill();
  const kg = ctx.createRadialGradient(kx - kr * 0.3, cy - kr * 0.3, 1, kx, cy, kr);
  kg.addColorStop(0, '#fff'); kg.addColorStop(1, '#d9cfe8');
  ctx.fillStyle = kg; ctx.beginPath(); ctx.arc(kx, cy, kr, 0, TAU); ctx.fill();
  if (label) txt(label, kx, cy + 0.5, kr * 0.8, '#3a2c58');
}
function panel(x, y, w, h, r) {
  rr(x, y + 4, w, h, r); ctx.fillStyle = 'rgba(0,0,0,0.35)'; ctx.fill();
  rr(x, y, w, h, r);
  const g = ctx.createLinearGradient(0, y, 0, y + h);
  g.addColorStop(0, 'rgba(70,52,110,0.96)'); g.addColorStop(1, 'rgba(38,26,66,0.96)');
  ctx.fillStyle = g; ctx.fill();
  ctx.strokeStyle = 'rgba(255,220,140,0.55)'; ctx.lineWidth = 2; ctx.stroke();
}
function hitUI(x, y) {
  for (let i = uiReg.length - 1; i >= 0; i--) {
    const b = uiReg[i];
    if (!b.disabled && x >= b.x - 4 && x <= b.x + b.w + 4 && y >= b.y - 4 && y <= b.y + b.h + 8) return b;
  }
  return null;
}
/** 依序排列控制項（寬度不夠就換行） */
function flow(items, x0, y0, maxW, h, gap) {
  let x = x0, y = y0;
  const out = [];
  for (const it of items) {
    if (x > x0 && x + it.w > x0 + maxW) { x = x0; y += h + gap; }
    out.push({ x, y, w: Math.min(it.w, maxW), h });
    x += it.w + gap;
  }
  return { rects: out, bottom: y + h };
}

/* =====================================================================
 * 聲音：預先合成鼓聲（OfflineAudioContext），打擊時立刻播放
 * ===================================================================== */
const SR = 44100;
const DRUM = { ready: false, bufs: {}, rr: {}, A: null, bus: null, vbus: {}, lastOpen: null, started: 0, renderMs: 0 };
// 每種聲音的音量（已正規化到峰值 0.95）
const VOICE_GAIN = { kick: 0.95, snare: 0.78, hatC: 0.34, hatO: 0.3, pedal: 0.3, crash: 0.46, ride: 0.36, bell: 0.34,
  tom1: 0.72, tom2: 0.76, floor: 0.82, cowbell: 0.3, clap: 0.55, clickHi: 0.36, clickLo: 0.26 };
const VOICE_PAN = { kick: 0, snare: -0.18, hatC: -0.38, hatO: -0.38, pedal: -0.38, crash: -0.5, ride: 0.48, bell: 0.48,
  tom1: -0.12, tom2: 0.14, floor: 0.36, cowbell: 0.05, clap: 0.22, clickHi: 0, clickLo: 0 };
const VOICE_SEND = { kick: 0.05, snare: 0.32, hatC: 0.06, hatO: 0.1, pedal: 0.04, crash: 0.16, ride: 0.12, bell: 0.14,
  tom1: 0.26, tom2: 0.26, floor: 0.24, cowbell: 0.18, clap: 0.36, clickHi: 0, clickLo: 0 };
const TOM_HZ = { tom1: 196, tom2: 146.8, floor: 98 }; // G3、D3、G2：五度、四度，很和諧

function synth(oc) {
  const nb = oc.createBuffer(1, SR, SR), nd = nb.getChannelData(0);
  for (let i = 0; i < nd.length; i++) nd[i] = Math.random() * 2 - 1;
  const S = {
    oc,
    g(v, out) { const g = oc.createGain(); g.gain.value = v; if (out) g.connect(out); return g; },
    f(type, fr, q, out) { const b = oc.createBiquadFilter(); b.type = type; b.frequency.value = fr; b.Q.value = q || 0.7; if (out) b.connect(out); return b; },
    osc(type, fr, t0, t1, out) { const o = oc.createOscillator(); o.type = type; o.frequency.setValueAtTime(fr, t0); o.connect(out); o.start(t0); o.stop(t1); return o; },
    noise(t0, t1, out) { const s = oc.createBufferSource(); s.buffer = nb; s.loop = true; s.connect(out); s.start(t0, Math.random() * 0.9); s.stop(t1); return s; },
    /** 包絡：pts = [[時間, 值], ...]，第一點直接設定，之後用指數曲線 */

function renderAll() {
  if (!window.OfflineAudioContext) return Promise.resolve();
  const t0 = performance.now(), jobs = [];
  for (const id in VOICES) {
    const v = VOICES[id];
    DRUM.bufs[id] = [];
    for (let vi = 0; vi < v.n; vi++) {
      const oc = new OfflineAudioContext(v.stereo ? 2 : 1, Math.ceil(v.dur * SR), SR);
      v.build(synth(oc), oc.destination, vi);
      jobs.push(oc.startRendering().then(buf => {
        let pk = 0;
        for (let c = 0; c < buf.numberOfChannels; c++) { const d = buf.getChannelData(c); for (let i = 0; i < d.length; i++) { const a = d[i] < 0 ? -d[i] : d[i]; if (a > pk) pk = a; } }
        const k = pk > 0 ? 0.95 / pk : 1;
        for (let c = 0; c < buf.numberOfChannels; c++) { const d = buf.getChannelData(c); for (let i = 0; i < d.length; i++) d[i] *= k; }
        DRUM.bufs[id][vi] = buf;

    }
  }
  return Promise.all(jobs).then(() => { DRUM.ready = true; DRUM.renderMs = Math.round(performance.now() - t0); })
    .catch(() => { DRUM.ready = false; });
}

/** 建立鼓的匯流排：每種聲音有自己的聲相與殘響送出量，最後經過限幅器接到 sfxBus */
function ensureAudio() {
  if (DRUM.bus) return true;
  if (KG.isMuted() || !gestured) return false;
  const A = KG.audio(); if (!A) return false;
  if (!KG.music._nodes()) KG.sfx.noise(0.01, { vol: 0.0001 }); // 讓音樂引擎建立共用節點
  const n = KG.music._nodes(); if (!n) return false;
  DRUM.A = A;
  const lim = A.createDynamicsCompressor();
  lim.threshold.value = -9; lim.knee.value = 6; lim.ratio.value = 10; lim.attack.value = 0.001; lim.release.value = 0.12;
  lim.connect(n.sfxBus);
  const bus = A.createGain(); bus.gain.value = 0.42; bus.connect(lim);
  // 小房間殘響
  const len = Math.floor(A.sampleRate * 0.9), ir = A.createBuffer(2, len, A.sampleRate);
  for (let c = 0; c < 2; c++) {
    const d = ir.getChannelData(c);
    for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 2.6) * (i < 400 ? i / 400 : 1);
  }
  const conv = A.createConvolver(); conv.buffer = ir;
  const roomIn = A.createGain(), hp = A.createBiquadFilter(), roomOut = A.createGain();
  hp.type = 'highpass'; hp.frequency.value = 280; roomOut.gain.value = 0.3;
  roomIn.connect(hp); hp.connect(conv); conv.connect(roomOut); roomOut.connect(bus);
  for (const id in VOICE_GAIN) {
    const g = A.createGain(); let node = g;
    if (VOICE_PAN[id] && A.createStereoPanner) { const p = A.createStereoPanner(); p.pan.value = VOICE_PAN[id]; g.connect(p); node = p; }
    node.connect(bus);
    if (VOICE_SEND[id]) { const s = A.createGain(); s.gain.value = VOICE_SEND[id]; node.connect(s); s.connect(roomIn); }
    DRUM.vbus[id] = g;

}

  if (KG.isMuted() || !ensureAudio()) return -1;
  const A = DRUM.A, now = A.currentTime, t = when && when > now ? when : now;
  const list = DRUM.bufs[v];
  if (!DRUM.ready || !list || !list.length) return fallbackVoice(v, vel, t, dest);
  const i = DRUM.rr[v] = ((DRUM.rr[v] || 0) + 1) % list.length;
  const src = A.createBufferSource(); src.buffer = list[i];
  if (v.charAt(0) !== 'c' || v === 'crash' || v === 'cowbell') src.playbackRate.value = 1 + (Math.random() - 0.5) * 0.02;
  const g = A.createGain(); g.gain.value = VOICE_GAIN[v] * Math.pow(clamp(vel, 0.05, 1.1), 1.5);
  if (vel < 0.8) {
    const f = A.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = 1500 + 22000 * vel * vel; f.Q.value = 0.5;
    src.connect(f); f.connect(g);

  src.start(t);
  if (v === 'hatO') DRUM.lastOpen = { g, t };

    DRUM.lastOpen.g.gain.setTargetAtTime(0, t, 0.018); DRUM.lastOpen = null; // 閉鈸會把開鈸的聲音悶掉

function strike(pid, voice, vel, e, x, y) {
  const p = PBY[pid];
  if (pid === 'pedal') {
    prefs.pedalOpen = !prefs.pedalOpen; savePrefs();
    if (!prefs.pedalOpen) playVoice('pedal', 0.9);
    p.a.t = 0; p.a.v = 1;

  if (p.kind === 'cym' || p.kind === 'hat' || voice === 'bell') Fx.sparks(cx, cy, p.id === 'crash' ? 8 : 4, '#ffe9a0', 240);

  if (pid === 'crash') Fx.shake(2.5 * U, 0.2);

function buildNotes(L) {
  const notes = [], lanes = new Set();
  const bars = []; for (let r = 0; r < L.rep; r++) bars.push(...L.bars);
  if (L.end) bars.push(L.end);
  bars.forEach((bar, bi) => {
    for (const ln in bar) {
      const s = bar[ln];
      for (let j = 0; j < s.length; j++) {
        const c = s[j];
        if (c === '.') continue;
        lanes.add(ln);
        notes.push({ lane: ln, pid: LANES[ln], beat: 4 + bi * 4 + j * 4 / s.length, open: c === 'o', j: 0, jt: 0 });
      }
    }
  });
  notes.sort((a, b) => a.beat - b.beat);
  return { notes, lanes: LANE_ORDER.filter(l => lanes.has(l)), lastBeat: 4 + bars.length * 4 };
}
const JUDGE = { perfect: 0.05, good: 0.11, window: 0.16 };

Screens.lesson = {
  pausable: true, idx: 0,
  enter(i) {
    this.idx = i; this.L = LESSONS[i];
    const b = buildNotes(this.L);
    Object.assign(this, b, { score: 0, combo: 0, maxCombo: 0, cnt: [0, 0, 0], state: 'play', res: null, layerOn: false, lastComboT: 0, grace: -1, skipped: 0, labels: {} });
    this.bpm = Math.round(this.L.bpm * (prefs.slow ? 0.75 : 1));
    Grid.start(SONGS[this.L.song], this.bpm, { top: false });
  },
  exit() { Grid.stop(0.2); },
  click(b) {
    if (this.state !== 'play') return 0;
    if (b < 4) return b % 4 === 0 ? 2 : 1;
    if (b >= this.lastBeat) return 0;
    return prefs.lmetro ? (b % 4 === 0 ? 2 : 1) : 0;
  },
  onHit(pid, voice, vel, t) {
    if (this.state !== 'play') return;
    const tt = t - outLat();
    let best = null, bd = JUDGE.window;
    for (const n of this.notes) {
      if (n.j || n.pid !== pid) continue;
      const d = tt - Grid.timeOf(n.beat);
      if (d < -JUDGE.window) break;
      if (Math.abs(d) < bd) { bd = Math.abs(d); best = n; }
    }
    if (!best) return;
    const d = Math.abs(tt - Grid.timeOf(best.beat));
    best.jt = time;
    if (d <= JUDGE.perfect) { best.j = 1; this.cnt[0]++; this.combo++; this.score += 100 + Math.floor(this.combo / 10) * 10; }
    else { best.j = 2; this.cnt[1]++; this.combo++; this.score += 60 + Math.floor(this.combo / 10) * 5; }
    this.maxCombo = Math.max(this.maxCombo, this.combo); this.lastComboT = time;
    const lp = this.lanePos(best.lane);
    if (lp) {
      this.label(best.lane, lp, best.j === 1 ? '完美！' : '不錯！', best.j === 1 ? '#ffd45c' : '#5fd3ff', (best.j === 1 ? 22 : 19) * U);
      Fx.ring(lp[0], lp[1], this.hw.lw * 0.45, 0.5, best.j === 1 ? '#ffd45c' : '#5fd3ff', 0.3);
    }
    if (this.combo > 0 && this.combo % 10 === 0) { sfx('star', { pitch: 1 + Math.min(0.5, this.combo / 100) }); }
    if (this.combo >= 8 && !this.layerOn) { this.layerOn = true; KG.music.setLayer('top', true); }
  },
  miss(n) {
    n.j = 3; n.jt = time; this.cnt[2]++;
    if (this.combo >= 5) sfx('tick', { pitch: 0.7 });
    this.combo = 0;
    if (this.layerOn) { this.layerOn = false; KG.music.setLayer('top', false); }
    const lp = this.lanePos(n.lane);
    if (lp) this.label(n.lane, lp, '錯過', '#b9a9d6', 17 * U);
  },
  /** 每條軌道只顯示最新的判定字（舊的立刻拿掉，不會疊在一起） */
  label(lane, lp, s, col, size) {
    const old = this.labels[lane];
    if (old && old.on && old.tag === lane) old.on = false;
    const o = Fx.pop(lp[0], lp[1] - 26 * U, s, col, size); o.tag = lane;
    this.labels[lane] = o;
  },
  onResume() { this.grace = Grid.fb + 1.5; },
  lanePos(ln) {
    const i = this.lanes.indexOf(ln);
    if (i < 0 || !this.hw) return null;
    return [this.hw.x + this.hw.lw * (i + 0.5), this.hw.hitY];
  },
  update() {
    if (this.state !== 'play' || Game.paused) return;
    const nowA = audioNow() - outLat(), beat = Grid.beatAt(nowA);
    for (const p of PIECES) p.a.hint = 0;
    for (const n of this.notes) {
      if (n.j) continue;
      const dt = nowA - Grid.timeOf(n.beat);
      // 打擊是用事件發生的時間判定；畫面卡頓時，晚一點才宣告錯過，避免還在排隊的打擊被誤判
      if (dt > JUDGE.window + 0.1 + Math.min(0.25, dtFrame)) {
        if (n.beat < this.grace) { n.j = 4; n.jt = time; this.skipped++; } else this.miss(n); // 暫停後剛恢復的那一下不算錯
        continue;
      }
      const db = n.beat - beat;
      if (db > 1.2) break;
      const p = PBY[n.pid]; p.a.hint = Math.max(p.a.hint, clamp(1 - db / 1.2, 0, 1));
    }
    if (beat > this.lastBeat + 1) this.finish();
  },
  finish() {
    this.state = 'result';
    for (const p of PIECES) p.a.hint = 0;
    const N = this.notes.length - this.skipped, acc = N ? (this.cnt[0] + this.cnt[1] * 0.6) / N : 0;
    const stars = acc >= 0.92 ? 3 : acc >= 0.78 ? 2 : acc >= 0.55 ? 1 : 0;
    const st = Save.get('stars', []); const prev = st[this.idx] || 0;
    if (stars > prev) { st[this.idx] = stars; Save.set('stars', st); }
    const prevBest = KG.best(SLUG + ':l' + this.idx);
    const best = KG.best(SLUG + ':l' + this.idx, this.score);
    this.res = { acc, stars, best, newBest: this.score > 0 && (prevBest == null || this.score > prevBest), t: time };
    Grid.stop(0.4);
    if (stars > 0) { jingleClear(stars); KG.confetti(W / 2, H * 0.3, KG.lowEnd ? 60 : 110); }
    else jingleFail();
  },
  draw() {
    const wide = isWide();
    let hw;
    if (wide) {
      const hwW = Math.min(W * 0.38, 70 * U * Math.max(3, this.lanes.length));
      hw = { x: 10, y: 66, w: hwW, h: H - 74 };
      setKit(hw.x + hw.w + 10, 60, W - (hw.x + hw.w + 10) - 70, H - 64);
    } else {
      hw = { x: 10, y: 122, w: W - 20, h: Math.max(180, H * 0.47 - 122) };
      setKit(6, hw.y + hw.h + 8, W - 12, H - (hw.y + hw.h + 8) - 6);
    }
    hw.lw = hw.w / this.lanes.length; hw.hitY = hw.y + hw.h - 38 * U;
    this.hw = hw;
    drawBG();
    Kit.draw(dtFrame);
    this.drawHighway(hw);
    // 上方資訊
    const N = this.notes.length, done = this.cnt[0] + this.cnt[1] + this.cnt[2] + this.skipped;
    const hx = 70, hwid = W - 140;
    txt((this.idx + 1) + '. ' + this.L.n, W / 2, 22, fitText((this.idx + 1) + '. ' + this.L.n, hwid, 18 * U), '#fff', { stroke: 'rgba(0,0,0,0.6)', sw: 5 });
    rr(hx, 40, hwid, 9, 4.5); ctx.fillStyle = 'rgba(0,0,0,0.45)'; ctx.fill();
    rr(hx, 40, Math.max(9, hwid * (N ? done / N : 0)), 9, 4.5); ctx.fillStyle = '#5fd3ff'; ctx.fill();
    const sy = wide ? hw.y + 18 * U : 88;
    const sx = wide ? hw.x + 10 : 16;
    txt('分數 ' + this.score, sx, sy, 18 * U, '#ffe9a0', { align: 'left', stroke: 'rgba(0,0,0,0.6)', sw: 5 });
    if (this.combo >= 2) {
      const k = 1 + 0.15 * Math.max(0, 1 - (time - this.lastComboT) * 6);
      txt(this.combo + ' 連擊', wide ? hw.x + hw.w - 10 : W - 76, sy, 18 * U * k, '#ffd45c', { align: 'right', stroke: 'rgba(0,0,0,0.6)', sw: 5 });
    }
    // 開頭提示
    const beat = Grid.heard();
    if (this.state === 'play' && beat < 4.5) {
      const ty = hw.y + hw.h * 0.4;
      rr(hw.x + 10, ty - 34 * U, hw.w - 20, 68 * U, 14 * U); ctx.fillStyle = 'rgba(20,10,40,0.82)'; ctx.fill();
      txt(this.L.tip, hw.x + hw.w / 2, ty - 12 * U, fitText(this.L.tip, hw.w - 36, 16 * U), '#fff');
      const cnt = beat < 0 ? '預備…' : String(4 - Math.floor(beat));
      txt(cnt, hw.x + hw.w / 2, ty + 16 * U, 22 * U, '#ffd45c');
    }
    if (this.state === 'play') pauseBtn();
    else this.drawResult();
  },
  drawHighway(hw) {
    const lanes = this.lanes, ppb = (hw.hitY - hw.y) / 3.4;
    const beat = Grid.beatAt(audioNow() - outLat());
    rr(hw.x, hw.y, hw.w, hw.h, 14 * U); ctx.fillStyle = 'rgba(12,6,28,0.72)'; ctx.fill();
    ctx.save(); rr(hw.x, hw.y, hw.w, hw.h, 14 * U); ctx.clip();
    lanes.forEach((ln, i) => {
      const p = PBY[LANES[ln]], x = hw.x + i * hw.lw;
      const fl = p.a.v * Math.exp(-p.a.t * 8);
      const g = ctx.createLinearGradient(0, hw.y, 0, hw.hitY);
      g.addColorStop(0, rgba(p.col, 0)); g.addColorStop(1, rgba(p.col, 0.12 + fl * 0.35));
      ctx.fillStyle = g; ctx.fillRect(x + 1, hw.y, hw.lw - 2, hw.hitY - hw.y);
      if (i) { ctx.fillStyle = 'rgba(255,255,255,0.08)'; ctx.fillRect(x, hw.y, 1, hw.h); }
    });
    // 拍線
    const b0 = Math.floor(beat - 1), b1 = Math.ceil(beat + 3.6);
    for (let b = b0; b <= b1; b++) {
      const y = hw.hitY - (b - beat) * ppb;
      if (y < hw.y || y > hw.hitY) continue;
      ctx.fillStyle = b % 4 === 0 ? 'rgba(255,233,160,0.35)' : 'rgba(255,255,255,0.1)';
      ctx.fillRect(hw.x, y - (b % 4 === 0 ? 1 : 0.5), hw.w, b % 4 === 0 ? 2 : 1);
    }
    // 音符
    const nh = Math.max(10, 13 * U);
    for (const n of this.notes) {
      const y = hw.hitY - (n.beat - beat) * ppb;
      if (y < hw.y - nh) break;
      if (n.j === 4 || (n.j && time - n.jt > 0.25)) continue;
      if (n.j === 3 && y > hw.hitY + nh) continue;
      if (y > hw.y + hw.h + nh) continue;
      const i = lanes.indexOf(n.lane), p = PBY[n.pid];
      let x = hw.x + i * hw.lw + hw.lw * 0.1, w = hw.lw * 0.8, yy = y;
      ctx.globalAlpha = 1;
      if (n.j === 3) ctx.globalAlpha = 0.35;
      else if (n.j) { const k = (time - n.jt) / 0.25; ctx.globalAlpha = 1 - k; yy = hw.hitY; x -= k * 6; w += k * 12; }
      if (n.lane === 'k') { rr(x, yy - nh * 0.4, w, nh * 0.8, nh * 0.4); }
      else rr(x, yy - nh / 2, w, nh, nh / 2);
      ctx.fillStyle = n.j === 3 ? '#6a5a86' : p.col; ctx.fill();
      ctx.strokeStyle = 'rgba(255,255,255,0.85)'; ctx.lineWidth = 1.5; ctx.stroke();
      ctx.fillStyle = 'rgba(255,255,255,0.45)'; rr(x + nh * 0.4, yy - nh * 0.38, w - nh * 0.8, nh * 0.28, nh * 0.14); ctx.fill();
      if (n.open) { ctx.strokeStyle = '#1b1233'; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(x + w / 2, yy, nh * 0.28, 0, TAU); ctx.stroke(); }
    }
    ctx.globalAlpha = 1;
    ctx.restore();
    // 打擊線與按鍵
    const g = ctx.createLinearGradient(hw.x, 0, hw.x + hw.w, 0);
    g.addColorStop(0, 'rgba(255,212,92,0.2)'); g.addColorStop(0.5, 'rgba(255,240,190,0.95)'); g.addColorStop(1, 'rgba(255,212,92,0.2)');
    ctx.fillStyle = g; ctx.fillRect(hw.x + 4, hw.hitY - 2, hw.w - 8, 4);
    lanes.forEach((ln, i) => {
      const p = PBY[LANES[ln]], cx = hw.x + (i + 0.5) * hw.lw;
      const fl = p.a.v * Math.exp(-p.a.t * 10);
      ctx.fillStyle = rgba(p.col, 0.25 + fl * 0.6); ctx.strokeStyle = p.col; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.ellipse(cx, hw.hitY, Math.min(hw.lw * 0.38, 22 * U) * (1 + fl * 0.15), 9 * U, 0, 0, TAU); ctx.fill(); ctx.stroke();
      const lab = p.name, fs = fitText(lab, hw.lw - 4, 12.5 * U);
      txt(lab, cx, hw.hitY + 18 * U, fs, '#fff', { stroke: 'rgba(0,0,0,0.6)', sw: 3 });
      const key = ln === 'h' ? 'A/Q' : p.key;
      txt(key, cx, hw.hitY + 31 * U, Math.min(fs, 11 * U), p.col, { weight: '800' });
    });
  },
  drawResult() {
    const r = this.res; if (!r) return;
    const k = Ease.outBack(clamp((time - r.t) * 2.5, 0, 1));
    ctx.fillStyle = 'rgba(10,5,25,' + (0.6 * Math.min(1, (time - r.t) * 3)) + ')'; ctx.fillRect(0, 0, W, H);
    const pw = Math.min(360, W - 32), bh = Math.min(48 * U, H * 0.11), ph = Math.min(H - 72, 200 * U + bh * 2 + 8 * U);
    const px = (W - pw) / 2, py = Math.max(62, (H - ph) / 2);
    ctx.save(); ctx.translate(W / 2, py + ph / 2); ctx.scale(k, k); ctx.translate(-W / 2, -(py + ph / 2));
    panel(px, py, pw, ph, 22 * U);
    const pass = r.stars > 0;
    const compact = ph < 200 * U + bh * 2;
    let y = py + 30 * U;
    txt(pass ? '過關！' : '再試一次！', W / 2, y, 28 * U, pass ? '#ffd45c' : '#c9b8ff');
    y += 38 * U;
    for (let i = 0; i < 3; i++) {
      const on = i < r.stars, s = Ease.outBack(clamp((time - r.t) * 3 - 0.4 - i * 0.25, 0, 1));
      const sx = W / 2 + (i - 1) * 46 * U, sr = 19 * U * s * (i === 1 ? 1.15 : 1);
      if (sr <= 0) continue;
      ctx.fillStyle = on ? '#ffd45c' : 'rgba(0,0,0,0.35)'; starPath(ctx, sx, y - (i === 1 ? 4 : 0), sr, sr * 0.48, 0); ctx.fill();
      ctx.strokeStyle = on ? '#a8700a' : 'rgba(255,255,255,0.2)'; ctx.lineWidth = 2; ctx.stroke();
    }
    y += 34 * U;
    txt('分數 ' + this.score + (r.newBest ? '  新紀錄！' : ''), W / 2, y, 20 * U, '#fff');
    y += 24 * U;
    txt('最高 ' + (r.best || 0) + '　準確 ' + Math.round(r.acc * 100) + '%　最多 ' + this.maxCombo + ' 連擊', W / 2, y, fitText('最高 0000　準確 100%　最多 00 連擊', pw - 24, 14 * U, '700'), '#d8ccf0', { weight: '700' });
    y += 22 * U;
    txt('完美 ' + this.cnt[0] + '　不錯 ' + this.cnt[1] + '　錯過 ' + this.cnt[2], W / 2, y, 14 * U, '#d8ccf0', { weight: '700' });
    y += compact ? 14 * U : 22 * U;
    const gap = 8 * U, bw = pw - 40;
    button('r_again', px + 20, y, bw, bh, { label: '再試一次', color: 'gold', onClick: () => Game.go('lesson', this.idx) });
    y += bh + gap;
    const hasNext = this.idx + 1 < LESSONS.length;
    if (hasNext) button('r_next', px + 20, y, (bw - gap) / 2, bh, { label: '下一課', color: 'teal', pulse: pass, onClick: () => Game.go('lesson', this.idx + 1) });
    button('r_list', px + 20 + (hasNext ? (bw + gap) / 2 : 0), y, hasNext ? (bw - gap) / 2 : bw, bh, { label: '課程列表', color: 'purple', onClick: () => Game.go('list') });
    ctx.restore();
  }
};

/* =====================================================================
 * 錄音室：跟著伴奏錄一段 2 或 4 小節的循環，可以重播、疊錄、復原
 * ===================================================================== */
const VOICE_LIST = Object.keys(VOICE_GAIN);
const PID_LIST = PIECES.map(p => p.id);
const Rec = { state: 'idle', start: 0, bars: 2, layers: [], cur: null, overdub: false };
const recL = () => (Rec.layers.length || Rec.cur ? Rec.bars : prefs.bars) * 4;
function recSave() {
  if (!Rec.layers.length) return;
  Save.set('rec', { track: prefs.track, bpm: prefs.bpm, bars: Rec.bars,
    layers: Rec.layers.map(l => l.map(e => [PID_LIST.indexOf(e.pid), VOICE_LIST.indexOf(e.voice), Math.round(e.v * 100), Math.round(e.off * 1000)])) });
}
function recLoad() {
  const d = Save.get('rec', null);
  if (!d || !d.layers) return false;
  Rec.bars = d.bars || 2; prefs.bars = Rec.bars;
  if (TRACK_IDS.includes(d.track)) prefs.track = d.track;
  if (d.bpm) prefs.bpm = clamp(d.bpm, 60, 160);
  savePrefs();
  Rec.layers = d.layers.map(l => l.map(a => ({ pid: PID_LIST[a[0]] || 'snare', voice: VOICE_LIST[a[1]] || 'snare', v: a[2] / 100, off: a[3] / 1000, c0: 0 })));
  Rec.cur = null; Rec.overdub = false;
  return true;
}
function nextBar(minAhead) {
  const h = Grid.heard(), nb = Math.ceil(h / 4) * 4;
  return nb - h < minAhead ? nb + 4 : nb;
}
function recFinishOverdub() {
  if (Rec.cur && Rec.cur.length) { Rec.layers.push(Rec.cur); recSave(); }
  Rec.cur = null; Rec.overdub = false;
}

Screens.rec = {
  pausable: true,
  enter() { Grid.start(SONGS[prefs.track], prefs.bpm); Rec.state = 'idle'; Rec.overdub = false; Rec.cur = null; },
  exit() { if (Rec.overdub) recFinishOverdub(); Rec.state = 'idle'; Grid.stop(0.2); },
  onRestart() {
    if (Rec.state === 'count' || Rec.state === 'rec') { Rec.state = 'idle'; Rec.cur = null; KG.toast('換伴奏了，重新錄吧'); }
    else if (Rec.state === 'loop') { Rec.start = 4; Rec.layers.forEach(l => l.forEach(e => { e.c0 = 0; })); if (Rec.cur) Rec.cur.forEach(e => { e.c0 = 0; }); }
  },
  click(b) {
    if (Rec.state === 'count' && b >= Rec.start - 4 && b < Rec.start) return b % 4 === 0 ? 2 : 1;
    return prefs.metro ? (b % 4 === 0 ? 2 : 1) : 0;
  },
  onHit(pid, voice, vel, t) {
    if (!(Rec.state === 'rec' || (Rec.state === 'loop' && Rec.overdub)) || !Rec.cur) return;
    const L = Rec.bars * 4, b = Grid.beatAt(t - outLat());
    if (Rec.state === 'rec' && b < Rec.start - 0.3) return;
    let rel = (prefs.quant ? Math.round(b * 4) / 4 : b) - Rec.start;
    if (rel < 0) rel = 0;
    const k = Math.floor(rel / L), off = rel - k * L;
    if (Rec.cur.length < 500) Rec.cur.push({ pid, voice, v: vel, off, c0: k + 1 });
  },
  schedule(b0, b1) {
    if (Rec.state !== 'rec' && Rec.state !== 'loop') return;
    const L = Rec.bars * 4, s = Rec.start;
    const run = list => {
      for (const e of list) {
        const k0 = Math.floor((b0 - s - e.off) / L) + 1, k1 = Math.floor((b1 - s - e.off) / L);
        for (let k = Math.max(k0, e.c0); k <= k1; k++) {
          const t = Grid.timeOf(s + k * L + e.off);
          playVoice(e.voice, e.v, t); VisQ.push(t, e.pid, e.v, e.voice);
        }
      }
    };
    for (const l of Rec.layers) run(l);
    if (Rec.cur) run(Rec.cur);
  },
  update() {
    if (Game.paused) return;
    const h = Grid.heard(), L = Rec.bars * 4;
    if (Rec.state === 'count' && h >= Rec.start - 0.3) { Rec.state = 'rec'; sfx('select'); }
    else if (Rec.state === 'rec' && h >= Rec.start + L + 0.15) {
      if (Rec.cur && Rec.cur.length) {
        Rec.layers.push(Rec.cur); Rec.cur = null; Rec.state = 'loop'; recSave();
        sfx('correct'); KG.toast('錄好了！聽聽看');
      } else { Rec.cur = null; Rec.state = 'idle'; KG.toast('沒有錄到聲音，再試一次'); }
    }
  },
  btnRec() {
    if (Rec.state === 'count' || Rec.state === 'rec') { Rec.state = 'idle'; Rec.cur = null; sfx('back'); return; }
    if (Rec.overdub) recFinishOverdub();
    Rec.layers = []; Rec.bars = prefs.bars; Rec.cur = [];
    Rec.start = nextBar(3); Rec.state = 'count'; sfx('ui');
  },
  btnPlay() {
    if (Rec.state === 'loop') { if (Rec.overdub) recFinishOverdub(); Rec.state = 'idle'; sfx('back'); return; }
    if (!Rec.layers.length) return;
    Rec.layers.forEach(l => l.forEach(e => { e.c0 = 0; }));
    Rec.start = nextBar(0.5); Rec.state = 'loop'; sfx('select');
  },
  btnOver() {
    if (!Rec.layers.length) return;
    if (Rec.overdub) { recFinishOverdub(); sfx('back'); return; }
    if (Rec.state !== 'loop') this.btnPlay();
    Rec.overdub = true; Rec.cur = []; sfx('select'); KG.toast('疊錄：跟著重播再加一層');
  },
  btnUndo() {
    if (Rec.overdub && Rec.cur && Rec.cur.length) Rec.cur = [];
    else if (Rec.layers.length) { Rec.layers.pop(); if (!Rec.layers.length) { Rec.state = 'idle'; Rec.overdub = false; Rec.cur = null; } else recSave(); }
    sfx('back');
  },
  btnClear() { Rec.layers = []; Rec.cur = null; Rec.overdub = false; Rec.state = 'idle'; sfx('whoosh'); },
  btnLoad() {
    if (!recLoad()) return;
    Grid.start(SONGS[prefs.track], prefs.bpm);
    Rec.start = 4; Rec.state = 'loop'; sfx('unlock'); KG.toast('載入上次的錄音');
  },
  status() {
    const h = Grid.heard();
    if (Rec.state === 'count') return ['預備… ' + Math.max(1, Math.ceil(Rec.start - h)), '#ffd45c'];
    if (Rec.state === 'rec') return ['● 錄音中', '#ff6b6b'];
    if (Rec.state === 'loop') return [Rec.overdub ? '● 疊錄中（第 ' + (Rec.layers.length + 1) + ' 層）' : '▶ 重播中（' + Rec.layers.length + ' 層）', Rec.overdub ? '#ff9b8f' : '#5fd3ff'];
    return [Rec.layers.length ? '按「播放」聽，或「疊錄」再加一層' : '按「錄音」，先聽四下預備拍', '#d8ccf0'];
  },
  transport() {
    const busy = Rec.state === 'count' || Rec.state === 'rec', has = Rec.layers.length > 0;
    return [
      { id: 't_rec', label: busy ? '取消' : '錄音', icon: busy ? 'stop' : 'rec', color: 'red', on: () => this.btnRec(), pulse: Rec.state === 'idle' && !has },
      { id: 't_play', label: Rec.state === 'loop' ? '停止' : '播放', icon: Rec.state === 'loop' ? 'stop' : 'play', color: 'teal', on: () => this.btnPlay(), dis: !has || busy },
      { id: 't_od', label: '疊錄', icon: 'layer', color: Rec.overdub ? 'gold' : 'purple', on: () => this.btnOver(), dis: !has || busy },
      { id: 't_undo', label: '復原', icon: 'undo', color: 'dark', on: () => this.btnUndo(), dis: !has || busy },
      { id: 't_clear', label: '清除', icon: 'trash', color: 'dark', on: () => this.btnClear(), dis: !has || busy },
      { id: 't_load', label: '載入', icon: 'save', color: 'blue', on: () => this.btnLoad(), dis: busy || !Save.get('rec', null) }
    ];
  },
  drawTransport(x, y, w, h) {
    const items = this.transport(), gap = 6 * U, per = w >= 520 ? 6 : 3, bw = (w - gap * (per - 1)) / per;
    items.forEach((it, i) => {
      const c = i % per, r = Math.floor(i / per);
      button(it.id, x + c * (bw + gap), y + r * (h + gap), bw, h, { label: it.label, icon: it.icon, color: it.color, disabled: it.dis, pulse: it.pulse, size: Math.min(h * 0.4, 16 * U), onClick: it.on });
    });
    return y + Math.ceil(items.length / per) * (h + gap) - gap;
  },
  optChips() {
    const has = Rec.layers.length > 0 || Rec.state !== 'idle';
    const bars = chip('bars', prefs.bars + ' 小節', true, () => {
      if (has) { KG.toast('先清除錄音才能改長度'); sfx('error'); return; }
      prefs.bars = prefs.bars === 2 ? 4 : 2; savePrefs(); sfx('ui');
    });
    bars.color = 'purple';
    const q = chip('quant', '對齊拍子', prefs.quant, () => { prefs.quant = !prefs.quant; savePrefs(); sfx('ui'); });
    q.color = 'purple';
    return [metroChip(), bars, q];
  },
  drawTimeline(x, y, w, h) {
    rr(x, y, w, h, 10 * U); ctx.fillStyle = 'rgba(12,6,28,0.78)'; ctx.fill();
    ctx.strokeStyle = 'rgba(255,220,140,0.35)'; ctx.lineWidth = 1.5; ctx.stroke();
    const st = this.status();
    txt(st[0], x + 10, y + 12 * U, fitText(st[0], w * 0.7, 13 * U), st[1], { align: 'left' });
    const L = recL(), gx = x + 8, gw = w - 16, gy = y + 24 * U, gh = h - 30 * U;
    const ROWS = [['crash', 'ride', 'cowbell'], ['hihat'], ['snare', 'clap'], ['tom1', 'tom2', 'floor'], ['kick']];
    const rowOf = {}; ROWS.forEach((r, i) => r.forEach(id => { rowOf[id] = i; }));
    for (let b = 0; b <= L; b++) {
      ctx.fillStyle = b % 4 === 0 ? 'rgba(255,233,160,0.4)' : 'rgba(255,255,255,0.1)';
      ctx.fillRect(gx + gw * b / L, gy, 1, gh);
    }
    const rh = gh / ROWS.length, dot = Math.max(2, Math.min(rh * 0.38, 4 * U));
    const drawEv = (list, a) => {
      ctx.globalAlpha = a;
      for (const e of list) {
        ctx.fillStyle = PBY[e.pid].col;
        ctx.fillRect(gx + gw * e.off / L - dot / 2, gy + rh * (rowOf[e.pid] + 0.5) - dot / 2, dot, dot);
      }
    };
    Rec.layers.forEach((l, i) => drawEv(l, 0.55 + 0.45 * (i + 1) / Rec.layers.length));
    if (Rec.cur) drawEv(Rec.cur, 1);
    ctx.globalAlpha = 1;
    if (Rec.state === 'rec' || Rec.state === 'loop') {
      const h2 = Grid.heard() - Rec.start;
      if (h2 >= 0) {
        const p = (h2 % L) / L, px = gx + gw * p;
        ctx.fillStyle = Rec.state === 'rec' || Rec.overdub ? '#ff6b6b' : '#5fd3ff';
        ctx.fillRect(px - 1.5, gy - 2, 3, gh + 4);
      }
    }
  },
  draw() {
    const wide = isWide(), ch = Math.round(32 * U), th = Math.round(38 * U);
    if (wide) {
      const sw = Math.min(340, W * 0.38), kx = sw + 16;
      setKit(kx + 8, 8, W - kx - 80, H - 12);
      drawBG(); Kit.draw(dtFrame);
      panel(8, 64, sw, H - 72, 18 * U);
      tempoSlider(20, 72, sw - 24, 36);
      let y = drawChips(trackChips(), 20, 114, sw - 24, ch);
      y = drawChips(this.optChips(), 20, y + 6 * U, sw - 24, ch);
      y = this.drawTransport(20, y + 10 * U, sw - 24, th);
      const tlH = Math.min(150 * U, Math.max(56, H - 18 - (y + 10 * U)));
      this.drawTimeline(16, y + 10 * U, sw - 16, tlH);
    } else {
      const top = 62, list = trackChips().concat(this.optChips());
      const bot = flow(list, 10, top, W - 76, ch, 6 * U).bottom;
      const ty = bot + 8 * U, tb = ty + 2 * (th + 6 * U) - 6 * U, tly = tb + 8 * U, tlH = Math.min(120 * U, Math.max(64 * U, H - tly - 470));
      setKit(6, tly + tlH + 6, W - 12, H - (tly + tlH + 6) - 6);
      drawBG(); Kit.draw(dtFrame);
      tempoSlider(70, 12, W - 140, 40);
      drawChips(list, 10, top, W - 76, ch);
      this.drawTransport(10, ty, W - 20, th);
      this.drawTimeline(10, tly, W - 20, tlH);
    }
    pauseBtn();
  }
};

/* =====================================================================
 * 主迴圈、輸入、版面
 * ===================================================================== */
let dtFrame = 0.016, lastT = 0, drawMs = 0;
function resize() {
  const r = cv.getBoundingClientRect();
  cvRect = r; W = Math.max(1, r.width); H = Math.max(1, r.height);
  dpr = Math.min(2, window.devicePixelRatio || 1);
  cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
  U = clamp(Math.min(W / 390, H / 700), 0.78, 1.5);
  Kit.key = null; BG.key = '';
}
window.addEventListener('resize', resize);
window.addEventListener('orientationchange', () => setTimeout(resize, 120));
if (window.visualViewport) window.visualViewport.addEventListener('resize', resize);

function processVisQ() {
  const now = audioNow() - outLat(), q = VisQ.q;
  let w = 0;
  for (let i = 0; i < q.length; i++) {
    const e = q[i];
    if (e.t > now) { q[w++] = e; continue; }
    if (e.piece) {
      const p = PBY[e.piece]; p.a.t = 0; p.a.v = e.vel; p.a.voice = e.voice;
      if (Kit.visible) { const c = headCenter(p); Fx.ring(Kit.px(c[0]), Kit.py(c[1]), headR(p) * Kit.s * 0.6, p.kind === 'kick' ? 1 : 0.5, p.col, 0.3); }
      if (e.piece === 'kick') Fx.beatPulse = Math.max(Fx.beatPulse, 0.2);
    } else {
      Game.beatIdx = ((e.voice % 4) + 4) % 4; Game.beatT = time;
      Fx.beatPulse = Math.max(Fx.beatPulse, e.voice % 4 === 0 ? 0.16 : 0.1);
    }
  }
  q.length = w;
}

function frame(ts) {
  const dt = clamp((ts - lastT) / 1000 || 0.016, 0, 0.05);
  lastT = ts; dtFrame = dt; time += dt; frameNo++;
  Sched.tick();
  processVisQ();
  if (Game.S.update) Game.S.update(dt);
  Fx.update(dt);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  uiReg.length = 0; Kit.visible = false;
  const sh = Fx.offset();
  if (sh) ctx.translate(0, sh);
  const d0 = performance.now();
  Game.S.draw();
  drawMs = drawMs * 0.95 + (performance.now() - d0) * 0.05;
  Kit.visible = Kit.visible || false;
  Fx.draw();
  if (Game.paused) { uiReg.length = 0; ctx.setTransform(dpr, 0, 0, dpr, 0, 0); drawPause(); }
  requestAnimationFrame(frame);
}
// Kit.draw 被呼叫時代表鼓組在畫面上，可以打
const _kitDraw = Kit.draw;
Kit.draw = function (dt) { this.visible = true; _kitDraw.call(this, dt); };

/* ---------- 指標 ---------- */
function toLocal(e) { return [(e.clientX - cvRect.left) * W / cvRect.width, (e.clientY - cvRect.top) * H / cvRect.height]; }
function setSlider(b, x) { b.onChange(b.min + clamp((x - b.sx) / b.sw, 0, 1) * (b.max - b.min)); }
function kitBlocked() { return Game.paused || !Kit.visible || Game.scr === 'list' || (Game.scr === 'lesson' && Screens.lesson.state !== 'play'); }
cv.addEventListener('pointerdown', (e) => {
  e.preventDefault();
  const [x, y] = toLocal(e);
  const b = hitUI(x, y);
  if (b) {
    if (b.type === 'slider') { sliderDrag[e.pointerId] = b; setSlider(b, x); try { cv.setPointerCapture(e.pointerId); } catch (er) { /* 忽略 */ } }
    else { pressed[b.id] = e.pointerId; pressedBy[e.pointerId] = b.id; sfx('stick', { pitch: 1.25 }); }
    return;
  }
  if (kitBlocked()) return;
  const h = Kit.pick(x, y);
  if (h) strike(h.p.id, h.voice, h.vel, e, x, y);
}, { passive: false });
cv.addEventListener('pointermove', (e) => {
  const s = sliderDrag[e.pointerId];
  if (s) { const [x] = toLocal(e); setSlider(s, x); }
});
function endPointer(e, cancel) {
  if (sliderDrag[e.pointerId]) { delete sliderDrag[e.pointerId]; sfx('ui'); return; }
  const id = pressedBy[e.pointerId];
  if (id == null) return;
  delete pressedBy[e.pointerId]; delete pressed[id];
  if (cancel) return;
  const [x, y] = toLocal(e);
  const b = hitUI(x, y);
  if (b && b.id === id && b.onClick) b.onClick();
}
cv.addEventListener('pointerup', (e) => endPointer(e, false));
cv.addEventListener('pointercancel', (e) => endPointer(e, true));
cv.addEventListener('contextmenu', (e) => e.preventDefault());

/* ---------- 鍵盤 ---------- */
window.addEventListener('keydown', (e) => {
  if (e.code === 'Space' || e.code.indexOf('Arrow') === 0) e.preventDefault();
  if (e.repeat) return;
  if (e.code === 'Escape' || e.code === 'KeyP') { if (Game.paused) Game.resume(); else Game.pause(); return; }
  if (Game.paused) { if (e.code === 'Enter') Game.resume(); return; }
  if (Game.scr === 'title' && e.code === 'Enter') { Game.go('free'); return; }
  if (Game.scr === 'lesson' && Screens.lesson.state === 'result' && e.code === 'Enter') { Game.go('lesson', Screens.lesson.idx); return; }
  const m = KEYMAP[e.code];
  if (m && !kitBlocked()) strike(m[0], m[1], e.shiftKey ? 1 : 0.88, e);
});
document.addEventListener('visibilitychange', () => { if (document.hidden) Game.pause(); });

/* ---------- 測試用 ---------- */
window.__dk = {
  Game, Grid, DRUM, Rec, LESSONS, Kit, PIECES, HitLog, Screens, Sched,
  go: (n, a) => Game.go(n, a),
  frame: () => frameNo,
  drawMs: () => drawMs,
  /** 部件中心的螢幕座標（給自動測試點擊用） */
  piecePos(id) { const p = PBY[id], h = hitShape(p); return [Kit.px(h[0]) + cvRect.left, Kit.py(h[1]) + cvRect.top]; },
  auto: false
};
// 自動演奏（測試）：音符到打擊線時自動打
const _upd = Screens.lesson.update;
Screens.lesson.update = function (dt) {
  if (window.__dk.auto && this.state === 'play' && !Game.paused) {
    const now = audioNow() - outLat();
    for (const n of this.notes) {
      if (n.j) continue;
      const d = now - Grid.timeOf(n.beat);
      if (d < -0.02) break;
      if (d <= 0.09) strike(n.pid, n.pid === 'hihat' ? (n.open ? 'hatO' : 'hatC') : null, 0.9, null);
    }
  }
  _upd.call(this, dt);
};

resize();
renderAll();
Game.go('title');
requestAnimationFrame((t) => { lastT = t; frame(t); });
</script>
