<script type="module">
import * as THREE from 'three';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const $ = id => document.getElementById(id);
let renderer = null;
try {
  renderer = new THREE.WebGLRenderer({ canvas: $('gl'), antialias: true, powerPreference: 'high-performance' });
} catch (e) { renderer = null; }
if (!renderer) $('msg').textContent = '這個遊戲需要支援 3D（WebGL）的瀏覽器，請換一個瀏覽器或裝置再試試看。';
else main();

function main() {
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const lerp = (a, b, t) => a + (b - a) * t;
  const rand = (a, b) => a + Math.random() * (b - a);
  const gauss = () => (Math.random() + Math.random() + Math.random() - 1.5) / 0.75;
  const DEG = Math.PI / 180;

  /* =========================================================
   * 物理（公尺、秒）：標準羽球場 13.4 × 6.1（單打 5.18），網高 1.524（柱 1.55）
   * 羽球：重力 + 強烈的二次方空氣阻力（終端速度約 6.8 m/s），所以會急遽減速、陡峭落下
   * ========================================================= */
  const G = 9.81, KD = 0.21, DT = 1 / 240;
  const HL = 6.7, SW = 2.59, DW = 3.05, SSL = 1.98, DLS = 5.94;
  const NET_C = 1.524, NET_P = 1.55, NET_BOT = 0.76;
  const netTop = x => NET_C + (NET_P - NET_C) * Math.min(1, (x / DW) * (x / DW));
  const EV_FLOOR = 1, EV_NET = 2, EV_CORD = 3, EV_CAUGHT = 4;
  const MAXH = 3.12, REACH = 1.2;

  const mkS = () => ({ x: 0, y: 1, z: 0, vx: 0, vy: 0, vz: 0, ix: 0, iy: 0, iz: 0 });
  const copyS = (d, s) => { d.x = s.x; d.y = s.y; d.z = s.z; d.vx = s.vx; d.vy = s.vy; d.vz = s.vz; return d; };

  // 一個子步的飛行：阻力用半隱式寫法（高速殺球也穩定），速度方向不變只改大小
  function flight(b, dt) {
    const sp = Math.sqrt(b.vx * b.vx + b.vy * b.vy + b.vz * b.vz);
    const f = 1 / (1 + KD * sp * dt);
    b.vx *= f; b.vy *= f; b.vz *= f;
    b.vy -= G * dt;
    b.x += b.vx * dt; b.y += b.vy * dt; b.z += b.vz * dt;
  }
  // 子步 + 碰撞（網、網帶、地板）。用跨越 z=0 的線段插值判斷，球再快也不會穿網
  function step(b, dt, det) {
    const px = b.x, py = b.y, pz = b.z;
    flight(b, dt);
    if (pz !== 0 && (pz > 0) !== (b.z > 0)) {
      const t = pz / (pz - b.z);
      const nx = px + (b.x - px) * t, ny = py + (b.y - py) * t;
      if (Math.abs(nx) <= DW + 0.02) {
        const top = netTop(nx);
        if (ny < top + 0.03) {
          b.ix = nx; b.iy = ny; b.iz = 0;
          const back = pz > 0 ? 1 : -1;
          const vin = Math.abs(b.vz);
          if (ny > top - 0.035) {
            // 擦到網帶：可能翻過去、彈回來，偶爾卡在網上（重發）
            if (!det && vin < 9 && Math.random() < 0.12) {
              b.x = nx; b.y = top + 0.015; b.z = 0; b.vx = b.vy = b.vz = 0;
              return EV_CAUGHT;
            }
            const over = det ? ny > top - 0.008 : Math.random() < clamp(0.5 + (ny - (top - 0.008)) * 16, 0.12, 0.88);
            if (over) {
              b.vz *= 0.28; b.vx *= 0.6; b.vy = Math.abs(b.vy) * 0.12 + 0.55;
              b.y = Math.max(b.y, top + 0.035);
              if (Math.abs(b.z) < 0.03) b.z = -back * 0.03;
              return EV_CORD;
            }
          }
          b.z = back * 0.035; b.x = nx; b.y = Math.min(ny, top - 0.02);
          b.vz = -b.vz * 0.06; b.vx *= 0.3; b.vy = Math.min(b.vy, 0) * 0.2;
          return EV_NET;
        }
      }
    }
    if (b.y <= 0) {
      const t = py / Math.max(1e-6, py - b.y);
      b.ix = px + (b.x - px) * t; b.iz = pz + (b.z - pz) * t; b.iy = 0;
      b.x = b.ix; b.z = b.iz; b.y = 0;
      return EV_FLOOR;
    }
    return 0;
  }

  /* ---------- 擊球解算：用同一套物理反推初速或仰角，讓球落在目標點 ---------- */
  const SB = mkS();
  const fl = { d: 0, netY: 99, netX: 0, crossed: false, lx: 0, lz: 0, t: 0, apex: 0 };
  function simFlight(x, y, z, vx, vy, vz, ux, uz) {
    SB.x = x; SB.y = y; SB.z = z; SB.vx = vx; SB.vy = vy; SB.vz = vz;
    fl.crossed = false; fl.netY = 99; fl.apex = y;
    for (let i = 0; i < 2400; i++) {
      const px = SB.x, py = SB.y, pz = SB.z;
      flight(SB, DT);
      if (SB.y > fl.apex) fl.apex = SB.y;
      if (!fl.crossed && pz !== 0 && (pz > 0) !== (SB.z > 0)) {
        const t = pz / (pz - SB.z);
        fl.netY = py + (SB.y - py) * t; fl.netX = px + (SB.x - px) * t; fl.crossed = true;
      }
      if (SB.y <= 0) {
        const t = py / Math.max(1e-6, py - SB.y);
        fl.lx = px + (SB.x - px) * t; fl.lz = pz + (SB.z - pz) * t; fl.t = (i + t) * DT;
        fl.d = (fl.lx - x) * ux + (fl.lz - z) * uz;
        return fl;
      }
    }
    fl.lx = SB.x; fl.lz = SB.z; fl.t = 10; fl.d = (fl.lx - x) * ux + (fl.lz - z) * uz;
    return fl;
  }
  const sol = { vx: 0, vy: 0, vz: 0, speed: 0, el: 0, lx: 0, lz: 0, netY: 0, t: 0, apex: 0 };
  // from：擊球點；(tx,tz)：目標落點；el：仰角（度）；fixedV：固定球速（殺球）時改解仰角；margin：過網高度餘裕（null＝不檢查）
  function solveShot(from, tx, tz, el, fixedV, margin) {
    const dx = tx - from.x, dz = tz - from.z, D = Math.max(0.2, Math.hypot(dx, dz));
    const ux = dx / D, uz = dz / D;
    let e = el * DEG, s = fixedV || 20;
    const run = (sp, an) => simFlight(from.x, from.y, from.z, ux * sp * Math.cos(an), sp * Math.sin(an), uz * sp * Math.cos(an), ux, uz);
    const solve = () => {
      if (fixedV) {
        let lo = -1.25, hi = 0.8;
        for (let k = 0; k < 22; k++) { const m = (lo + hi) / 2; if (run(s, m).d > D) hi = m; else lo = m; }
        e = (lo + hi) / 2;
      } else {
        let lo = 0.5, hi = 160;
        for (let k = 0; k < 24; k++) { const m = (lo + hi) / 2; if (run(m, e).d > D) hi = m; else lo = m; }
        s = (lo + hi) / 2;
      }
      run(s, e);
    };
    solve();
    if (margin != null) {
      let guard = 0;
      while (fl.crossed && fl.netY < netTop(fl.netX) + margin && guard++ < 16) {
        if (fixedV) { e += 2 * DEG; run(s, e); }
        else { e += 3.5 * DEG; solve(); }
      }
    }
    sol.vx = ux * s * Math.cos(e); sol.vy = s * Math.sin(e); sol.vz = uz * s * Math.cos(e);
    sol.speed = s; sol.el = e / DEG; sol.lx = fl.lx; sol.lz = fl.lz; sol.netY = fl.netY; sol.t = fl.t; sol.apex = fl.apex;
    return sol;
  }

  /* ---------- 預測整條飛行路徑（含網、網帶），給雙方移動與電腦判斷 ---------- */
  const PN = 720;
  const PATH = { n: 0, t0: 0, x: new Float32Array(PN), y: new Float32Array(PN), z: new Float32Array(PN), t: new Float32Array(PN), lx: 0, lz: 0, lt: 0, landed: false, net: false };
  const PB = mkS();
  function computePath(src) {
    copyS(PB, src);
    PATH.n = 0; PATH.t0 = simClock; PATH.landed = false; PATH.net = false;
    for (let i = 0; i < PN * 2; i++) {
      const ev = step(PB, DT, true);
      if (ev === EV_NET) PATH.net = true;
      if ((i & 1) === 1 || ev === EV_FLOOR) {

  /* ---------- 判罰 ---------- */
  const CALLS = { in: ['界內', 'IN'], out: ['出界', 'OUT'], net: ['掛網', 'NET'], fault: ['發球失誤', 'FAULT'], let: ['重發球', 'LET'] };
  function onLand(x, z) {
    sState = 'rest';
    sLand();
    if (phase !== 'rally') return;
    const landSide = z > 0 ? 0 : 1;
    const h = rally.last;
    let inside, why;
    if (rally.serving) {
      if (landSide === h) { inside = false; why = 'fault'; }
      else { inside = serviceIn(x, z, rally.serverX, h); why = inside ? 'in' : 'fault'; }
    } else if (landSide === h) { inside = false; why = 'net'; }
    else { inside = lineIn(x, z); why = inside ? 'in' : 'out'; }
    markLanding(x, z, inside);
    lands.push({ x: +x.toFixed(2), z: +z.toFixed(2), why, h, serve: rally.serving });
    if (lands.length > 600) lands.shift();

  }
  function letCall() {
    if (phase !== 'rally') return;

    later(1.6, () => { sState = 'held'; beginServe(false); });
  }
  function pointTo(w, why) {
    if (phase !== 'rally') return;

    const hits = rally.hits;
    calls.push(why + ':' + w);
    if (mode === 'practice') return practiceResult(why);
    if (mode === 'demo') { later(1.5, () => { score[w]++; if (score[w] >= 21) { score[0] = score[1] = 0; } server = w; beginServe(false); }); return; }
    score[w]++;
    const big = lastShot.side === rally.last && (lastShot.kind === '殺球' || lastShot.kind === '跳殺');
    let title, sub, col;
    if (why === 'in') {
      if (w === 0) { title = big ? '殺球得分！' : hits >= 10 ? '漂亮的來回！' : '得分'; sub = '界內 IN'; col = '#c9ff6b'; }
      else { title = '沒接到'; sub = '界內 IN · 電腦得分'; col = '#9fc0ff'; }
    } else {
      title = CALLS[why][0]; sub = CALLS[why][1] + (w === 0 ? ' · 你得分' : ' · 電腦得分'); col = w === 0 ? '#c9ff6b' : '#ff9a8f';
    }
    showCall(title, sub, col);
    sPoint(w === 0);
    if (hits >= 8) sApplause(Math.min(1, 0.45 + hits * 0.03));
    else if (w === 0 && why === 'in') sApplause(big ? 0.7 : 0.35);
    else sApplause(0.15);
    bumpScore(w);
    server = w;      // 贏得這球的人發下一球
    if (gameOver(score[0], score[1], target, cap)) {
      games[w]++;
      gameLog.push([score[0], score[1]]);
      const matchOver = games[w] === Math.ceil(bestOf / 2);
      if (matchOver) { slowT = Math.max(slowT, 1.2); later(2.4, () => endMatch(w)); }
      else {
        later(2.6, () => {
          sApplause(0.4);
          gameNo++; score[0] = score[1] = 0; midSwap = false;
          setEnds(!endsFlipped);
          updateBoard();
          beginServe(true);
          setTimeout(() => { if (phase !== 'over' && mode !== 'demo') banner('交換場地', '第 ' + gameNo + ' 局 · ' + (server === 0 ? '你先發球' : '電腦先發球')); }, 1700);
        });
        setTimeout(() => { if (phase !== 'over' && mode !== 'demo') banner(w === 0 ? '你贏得這局' : '電腦贏得這局', '局數 ' + games[0] + ' : ' + games[1]); }, 1500);
      }
    } else {
      // 決勝局一方先到 11 分時交換場地
      const decider = bestOf > 1 && gameNo === bestOf;
      if (decider && !midSwap && Math.max(score[0], score[1]) >= Math.ceil(target / 2)) {
        midSwap = true;
        later(2.0, () => { setEnds(!endsFlipped); banner('交換場地', '決勝局 ' + Math.ceil(target / 2) + ' 分'); beginServe(false); });
      } else later(1.7, () => beginServe(false));
    }
    updateBoard();
  }
  function endMatch(w) {
    phase = 'over';

      else { if (w === 0) stats.w[level - 1]++; else stats.l[level - 1]++; }
      stats.rally = Math.max(stats.rally, longest);
      saveStats();

    }
    if (w === 0) { KG.sound('win'); KG.confetti(); sApplause(1); } else KG.sound('lose');

  }

  /* ---------- 練習：發球機 ---------- */
  function feed() {
    if (mode !== 'practice' || phase === 'over') return;
    if (practice.n >= practice.total) return endPractice();
    rally.serving = false; rally.hits = 0; rally.last = 1; rally.canHit = 0; rally.netTouched = false;
    queued = null;
    const f = P[1];
    S.x = f.x - 0.35; S.y = 0.95; S.z = f.z + 0.4;
    let tx = rand(-1.9, 1.9), tz;
    if (drill === 'smash') { tz = rand(3.0, 4.2); solveShot(S, tx, tz, 66, 0, 0.6); }
    else { tz = rand(4.9, 5.9); solveShot(S, tx, tz, 52, 0, 0.6); }
    f.swingType = 'under'; f.swingU = 0.3;
    sState = 'free';
    S.vx = sol.vx; S.vy = sol.vy; S.vz = sol.vz;
    sPock(0.4, 0.6);
    trailReset = true;
    phase = 'rally'; phaseT = 0;
    computePath(S);
    planFor(0, true);
    practice.waiting = true;
    updateBoard();
  }
  function practiceResult(why) {
    phase = 'dead';
    practice.n++;
    let ok = false;
    const L = lands[lands.length - 1];
    if (rally.last === 0 && why === 'in' && L) {
      if (drill === 'clear') ok = L.z <= -4.9;
      else if (drill === 'drop') ok = L.z >= -2.45;
      else ok = lastShot.kind === '殺球' || lastShot.kind === '跳殺';
    }
    if (ok) {
      practice.ok++; practice.streak++; practice.best = Math.max(practice.best, practice.streak);
      if (drill === 'smash') practice.fastest = Math.max(practice.fastest, lastShot.kmh);
      showCall(practice.streak >= 3 ? '連續 ' + practice.streak + ' 球！' : '好球', drill === 'smash' ? lastShot.kmh + ' km/h' : 'GOOD', '#c9ff6b');
      sPoint(true);
      if (practice.streak % 5 === 0) sApplause(0.6);
    } else {
      practice.streak = 0;
      let c;
      if (rally.last !== 0) c = ['沒接到', 'MISS'];
      else if (why === 'out') c = ['出界', 'OUT'];
      else if (why === 'net') c = ['掛網', 'NET'];
      else c = ['不在目標區', drill === 'smash' ? '要用往下滑的殺球' : drill === 'clear' ? '要打到後場黃色區' : '要落在網前黃色區'];
      showCall(c[0], c[1], '#ff9a8f');
    }
    updateBoard();
    later(ok ? 1.1 : 1.4, feed);
  }
  function endPractice() {
    phase = 'over';
    stopMusic();
    const prev = stats.drill[drill] || 0;
    if (!autoPlayer && practice.ok > prev) { stats.drill[drill] = practice.ok; saveStats(); }
    KG.best('badminton-drill-' + drill, practice.ok);
    if (practice.ok >= practice.total * 0.6) { KG.sound('win'); KG.confetti(); } else KG.sound('correct');
    showPracticeOver(prev);
  }

  /* =========================================================
   * 每個物理子步
   * ========================================================= */
  const ACC = 22;
  function inZone(p) {
    if (S.y < 0.06 || S.y > MAXH) return false;
    if (S.z * p.sg < 0.03) return false;               // 還沒過網，不能過網擊球
    return Math.hypot(S.x - p.x, S.z - p.z) <= REACH;
  }
  function leavingZone(p) {
    const dx = S.x - p.x, dz = S.z - p.z, d = Math.hypot(dx, dz) || 1;
    return (dx * S.vx + dz * S.vz) / d > 0 && d > REACH * 0.8;
  }
  // 掃掠檢查：這一個子步的線段有沒有穿過擊球範圍（球再快也不會「穿過」球拍）
  function sweptT(p) {
    const ax = S.px - p.x, az = S.pz - p.z, dx = S.x - S.px, dz = S.z - S.pz;
    const a = dx * dx + dz * dz;
    if (a < 1e-10) return -1;
    const tc = clamp(-(ax * dx + az * dz) / a, 0, 1);
    const cx = ax + dx * tc, cz = az + dz * tc;
    return cx * cx + cz * cz <= REACH * REACH ? tc : -1;
  }
  function checkHit(s) {
    if (rally.canHit !== s || sState !== 'free' || phase !== 'rally') return;
    const p = P[s];
    let tIn = 1;
    if (!inZone(p)) {
      tIn = sweptT(p);
      if (tIn < 0) return;
      const hy = S.py + (S.y - S.py) * tIn, hz = S.pz + (S.z - S.pz) * tIn;
      if (hy < 0.06 || hy > MAXH || hz * p.sg < 0.03) return;
    }
    const passed = tIn < 1;
    const snapBack = () => {
      if (!passed) return;
      S.x = S.px + (S.x - S.px) * tIn; S.y = S.py + (S.y - S.py) * tIn; S.z = S.pz + (S.z - S.pz) * tIn;
      sweptHits++;
    };
    if (isAuto(s)) {
      if (p.leave) return;
      if (rally.serving && S.z * p.sg < 0.4 && !passed) return;
      if (passed || S.y <= p.hc + 0.02 || leavingZone(p) || S.y < 0.4 || S.vy > 0 && S.y > 2.2) {
        snapBack();
        if (mode === 'practice' && s === 0 && autoPlayer) { doHit(0, drill === 'smash' ? 'smash' : drill, rand(-0.6, 0.6)); return; }
        const c = aiChoose(s);
        doHit(s, c.type, c.aim, c);
      }
    } else if (queued && simClock - queued.t <= queueWindow()) {
      const q = queued; queued = null;
      snapBack();
      doHit(0, q.type, q.aim);
    }
  }
  let sweptHits = 0;
  const queueWindow = () => (assistOn() ? 0.55 : 0.42);

  function movePlayer(p, dt) {
    let tx = p.tx, tz = p.tz;
    if (phase === 'rally' && rally.canHit === p.side && p.plan.ok) {
      if (p.reactT > 0) { p.reactT -= dt; tx = p.x; tz = p.z; }
      else { tx = p.plan.bx; tz = p.plan.bz; if (p.leave) { tx = lerp(p.x, tx, 0.6); tz = lerp(p.z, tz, 0.6); } }
    }
    if (p.side === 0 && !isAuto(0) && (phase === 'rally' || phase === 'dead')) { tx += nudge.x + nudge.kx; tz += nudge.z + nudge.kz; }
    tx = clamp(tx, -3.5, 3.5);
    tz = p.sg > 0 ? clamp(tz, 0.6, 7.6) : clamp(tz, -7.6, -0.6);
    const dx = tx - p.x, dz = tz - p.z, d = Math.hypot(dx, dz);
    let dvx = -p.vx, dvz = -p.vz;
    if (d > 0.01) {
      const want = Math.min(p.speed, Math.sqrt(2 * ACC * 0.8 * d));
      dvx = dx / d * want - p.vx; dvz = dz / d * want - p.vz;
    }
    const dm = Math.hypot(dvx, dvz), lim = ACC * dt;
    if (dm > lim) { dvx *= lim / dm; dvz *= lim / dm; }
    const sp0 = Math.hypot(p.vx, p.vz);
    p.vx += dvx; p.vz += dvz;
    p.x += p.vx * dt; p.z += p.vz * dt;
    // 急停或轉向：球鞋摩擦聲
    p.squeakT -= dt;
    if (dm > lim * 0.98 && sp0 > 2.6 && p.squeakT <= 0 && (p.vx * dvx + p.vz * dvz) < 0) squeak(p.side, 0.7);
  }
  // 球頭方向追著速度轉：擊球後球頭朝後，會在零點幾秒內翻轉成球頭朝前
  function orient(dt) {
    const sp = Math.hypot(S.vx, S.vy, S.vz), n = S.n;
    if (sp < 0.4) return;
    const tx = S.vx / sp, ty = S.vy / sp, tz = S.vz / sp;
    if (n.x * tx + n.y * ty + n.z * tz < -0.9) { n.x += -n.z * 0.3 + 0.05; n.z += n.x * 0.3; n.y += 0.25; }
    const k = Math.min(1, dt * (16 + sp * 0.6));
    n.x += (tx - n.x) * k; n.y += (ty - n.y) * k; n.z += (tz - n.z) * k;
    const l = Math.hypot(n.x, n.y, n.z) || 1; n.x /= l; n.y /= l; n.z /= l;
  }
  function tick(dt) {
    simClock += dt;
    if (sState === 'held' && (phase === 'walk' || phase === 'serve' || phase === 'swing')) heldPos(server);
    else if (sState === 'free') {
      const pz = S.z;
      S.px = S.x; S.py = S.y; S.pz = S.z;
      const ev = step(S, dt, false);
      orient(dt);
      if (ev === EV_FLOOR) onLand(S.ix, S.iz);
      else if (ev === EV_NET || ev === EV_CORD) {
        sNet(ev === EV_CORD);
        netShake = 1; rally.netTouched = true;
        computePath(S);
        if (rally.canHit >= 0 && phase === 'rally') {
          // 球被網擋下來就輪不到對方接
          if (ev === EV_NET) rally.canHit = -1;
          else planFor(rally.canHit, false);
        }
      } else if (ev === EV_CAUGHT) { sNet(true); netShake = 1; sState = 'net'; letCall(); }
      if (pz !== S.z) { checkHit(0); checkHit(1); }
      if (Math.abs(S.x) > 12 || Math.abs(S.z) > 14) sState = 'gone';
    }
    movePlayer(P[0], dt);
    if (mode !== 'practice') movePlayer(P[1], dt);
    else { P[1].x = lerp(P[1].x, 0, dt * 2); P[1].z = lerp(P[1].z, -2.6, dt * 2); P[1].vx = P[1].vz = 0; }
  }

  /* ---------- 每幀更新 ---------- */
  let acc = 0, shake = 0, shotT = 0, clock = 0, netShake = 0;
  function update(dtReal) {
    clock += dtReal;
    if (paused) return;
    let ts = timeScale;
    if (slowT > 0) { slowT -= dtReal; ts *= 0.3; }
    acc += dtReal * ts;
    let n = 0;
    while (acc >= DT && n < 60) { tick(DT); acc -= DT; n++; }
    if (n >= 60) acc = 0;
    const dts = dtReal * ts;
    phaseT += dtReal;
    if (nextFn) { nextAt -= dtReal; if (nextAt <= 0) { const f = nextFn; nextFn = null; f(); } }
    if (phase === 'walk') {
      const near = Math.hypot(P[0].x - P[0].tx, P[0].z - P[0].tz) < 0.2 && Math.hypot(P[1].x - P[1].tx, P[1].z - P[1].tz) < 0.2;
      if (near || phaseT > 2.2) readyToServe();
    } else if (phase === 'serve') {
      if (isAuto(server) && phaseT > (mode === 'demo' ? 0.8 : rand(0.9, 1.0))) {
        const L = lvlFor(server);
        const lowP = L === LV[1] ? 0.3 : L === LV[2] ? 0.6 : 0.72;
        startServe(Math.random() < lowP ? 'low' : 'high', rand(-0.6, 0.6));
      }
    } else if (phase === 'swing') {
      if (phaseT > 0.22) doServe();
    }
    // 鍵盤微調位置
    const kx = (keys.right ? 1 : 0) - (keys.left ? 1 : 0), kz = (keys.down ? 1 : 0) - (keys.up ? 1 : 0);
    nudge.kx = clamp(nudge.kx + kx * dtReal * 4, -1.6, 1.6); nudge.kz = clamp(nudge.kz + kz * dtReal * 4, -1.6, 1.6);
    if (!kx) nudge.kx *= Math.exp(-dtReal * 3);
    if (!kz) nudge.kz *= Math.exp(-dtReal * 3);
    if (!nudge.active) { nudge.x *= Math.exp(-dtReal * 2.5); nudge.z *= Math.exp(-dtReal * 2.5); }
    if (shotT > 0) { shotT -= dtReal; if (shotT <= 0) $('shot').classList.remove('on'); }
    if (bannerT > 0) { bannerT -= dtReal; if (bannerT <= 0) $('banner').classList.remove('on'); }
    shake = Math.max(0, shake - dtReal * 1.8);
    netShake = Math.max(0, netShake - dtReal * 2.5);
    for (const p of P) {
      if (p.swingU < 1.6) p.swingU += dts * (p.swingType === 'over' ? 2.6 : 2.3);
      p.lunge = Math.max(0, p.lunge - dts * 1.4);
      p.jumpT = Math.min(1, p.jumpT + dts / 0.55);
      p.hitBusy = Math.max(0, p.hitBusy - dts);
      // 準備動作：預計擊球前 0.45 秒舉拍
      let want = 0;
      if (phase === 'rally' && rally.canHit === p.side && p.plan.ok && !p.leave) {
        const tt = p.plan.t - simClock;
        if (tt < 0.5) want = 1;
      }
      if (phase === 'serve' && server === p.side) { want = 0.6; p.prepType = 'under'; }
      p.prep = lerp(p.prep, want, Math.min(1, dts * 9));
    }
  }

  /* =========================================================
   * 3D 場景
   * ========================================================= */
  let W = 0, H = 0;
  const small = Math.min(innerWidth, innerHeight) < 600;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.0;
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x0b1220);
  scene.fog = new THREE.Fog(0x0b1220, 24, 46);
  const pmrem = new THREE.PMREMGenerator(renderer);
  scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
  scene.environmentIntensity = 0.28;
  const camera = new THREE.PerspectiveCamera(45, 1, 0.1, 80);

  scene.add(new THREE.HemisphereLight(0xdfe9ff, 0x2a3326, 0.85));
  const key = new THREE.DirectionalLight(0xfff6e8, 2.1);
  key.position.set(2.5, 14, 4);
  key.target.position.set(0, 0, 0);
  key.castShadow = true;
  key.shadow.mapSize.set(small ? 1024 : 2048, small ? 1024 : 2048);
  Object.assign(key.shadow.camera, { left: -5, right: 5, top: 8.5, bottom: -8.5, near: 4, far: 26 });
  key.shadow.bias = -0.0006; key.shadow.normalBias = 0.03;
  scene.add(key, key.target);
  const fill = new THREE.DirectionalLight(0xc8dcff, 0.45);
  fill.position.set(-6, 6, 10);
  scene.add(fill);

  function makeTex(w, h, draw, repeat) {
    const c = document.createElement('canvas');
    c.width = w; c.height = h;
    draw(c.getContext('2d'), w, h);
    const t = new THREE.CanvasTexture(c);
    t.colorSpace = THREE.SRGBColorSpace;
    t.anisotropy = 8;
    if (repeat) { t.wrapS = t.wrapT = THREE.RepeatWrapping; }
    return t;
  }
  function seeded(seed) { return () => { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; }; }

  // 地板：體育館木地板（深色）＋燈光光暈
  const floorTex = makeTex(1024, 1024, (c, w, h) => {
    c.fillStyle = '#3b2c22'; c.fillRect(0, 0, w, h);
    const rnd = seeded(11);
    for (let y = 0; y < h; y += 16) {
      for (let x = (y / 16) % 2 ? -60 : 0; x < w; x += 120) {
        const v = 40 + rnd() * 25;
        c.fillStyle = 'rgb(' + (v + 28 | 0) + ',' + (v + 8 | 0) + ',' + (v - 10 | 0) + ')';
        c.fillRect(x + 1, y + 1, 118, 14);
      }
    }
    const g = c.createRadialGradient(w / 2, h / 2, 30, w / 2, h / 2, w * 0.6);
    g.addColorStop(0, 'rgba(255,245,225,.18)'); g.addColorStop(0.5, 'rgba(0,0,0,.1)'); g.addColorStop(1, 'rgba(0,0,0,.7)');
    c.fillStyle = g; c.fillRect(0, 0, w, h);
  });
  const floor = new THREE.Mesh(new THREE.PlaneGeometry(44, 44), new THREE.MeshStandardMaterial({ map: floorTex, roughness: 0.55, metalness: 0 }));
  floor.rotation.x = -Math.PI / 2;
  floor.receiveShadow = true;
  scene.add(floor);

  // 球場地墊：綠色＋白線（線寬 4 cm，線的外緣就是界線，壓線算界內）
  const MW = 9.0, ML = 16.4;
  const courtTex = makeTex(1024, 2048, (c, w, h) => {
    const sx = w / MW, sz = h / ML;
    const X = x => (x + MW / 2) * sx, Z = z => (z + ML / 2) * sz;
    c.fillStyle = '#145c45'; c.fillRect(0, 0, w, h);
    // 球場內區
    c.fillStyle = '#1d7a52'; c.fillRect(X(-DW), Z(-HL), DW * 2 * sx, HL * 2 * sz);
    const rnd = seeded(3);
    for (let i = 0; i < 26000; i++) { c.fillStyle = 'rgba(0,0,0,' + rnd() * 0.07 + ')'; c.fillRect(rnd() * w, rnd() * h, 2, 2); }
    for (let i = 0; i < 9000; i++) { c.fillStyle = 'rgba(255,255,255,' + rnd() * 0.04 + ')'; c.fillRect(rnd() * w, rnd() * h, 2, 2); }
    c.fillStyle = '#f2f5f0';
    const LW = 0.04;
    const vline = (x0, x1, z0, z1) => c.fillRect(X(x0), Z(z0), (x1 - x0) * sx, (z1 - z0) * sz);
    // 邊線（雙打外、單打內）
    vline(-DW, -DW + LW, -HL, HL); vline(DW - LW, DW, -HL, HL);
    vline(-SW, -SW + LW, -HL, HL); vline(SW - LW, SW, -HL, HL);
    // 底線、雙打長發球線
    vline(-DW, DW, -HL, -HL + LW); vline(-DW, DW, HL - LW, HL);
    vline(-DW, DW, -DLS, -DLS + LW); vline(-DW, DW, DLS - LW, DLS);
    // 短發球線
    vline(-DW, DW, -SSL - LW, -SSL); vline(-DW, DW, SSL, SSL + LW);
    // 中線

      target, cap, bestOf, endsFlipped, longest, sState, simClock: r3(simClock),
      rally: { hits: rally.hits, last: rally.last, canHit: rally.canHit, serving: rally.serving },
      shuttle: { x: r3(S.x), y: r3(S.y), z: r3(S.z), vx: r3(S.vx), vy: r3(S.vy), vz: r3(S.vz), n: [r3(S.n.x), r3(S.n.y), r3(S.n.z)] },
      players: P.map(p => ({ x: r3(p.x), z: r3(p.z), plan: p.plan.ok ? { x: r3(p.plan.x), y: r3(p.plan.y), z: r3(p.plan.z) } : null, leave: p.leave })),
      lastShot: Object.assign({}, lastShot), practice: Object.assign({}, practice), queued: queued ? Object.assign({}, queued) : null,
      quality: qLevel, drawCalls: renderer.info.render.calls, tris: renderer.info.render.triangles, fov: r3(camera.fov), timeScale, slow: slowT > 0, overlay: ov.classList.contains('on'), calls: calls.slice(-12), lands: lands.slice(-8),
      stats: JSON.parse(JSON.stringify(stats))
    }),
    start: o => startMatch(Object.assign({ auto: false }, o)),
    menu: () => showTitle(),
    step: n => { for (let i = 0; i < (n || 1); i++) { update(1 / 60); if (queued && simClock - queued.t > queueWindow()) queued = null; } },
    auto: (on, lv) => { autoPlayer = !!on; if (lv) autoLevel = lv; setParams(); },
    // 立刻以玩家身分擊球（不論距離），回傳種類與預測
    hit: (type, dir) => {
      if (sState !== 'free' && sState !== 'held') return null;
      if (phase !== 'rally') { phase = 'rally'; }
      sState = 'free'; rally.serving = false;
      const kind = doHit(0, type || 'safe', dir || 0);
      return { kind, kmh: lastShot.kmh, land: { x: r3(PATH.lx), z: r3(PATH.lz), t: r3(PATH.lt) }, net: PATH.net };
    },
    // 像玩家一樣輸入（會等球進入範圍）
    input: (type, dir) => queueShot(type, dir || 0, 'test'),
    serve: (type, dir) => {
      if (server !== 0) return null;
      for (let i = 0; i < 200 && phase === 'walk'; i++) update(1 / 60);
      if (!startServe(type === 'high' ? 'high' : 'low', dir || 0)) return null;
      for (let i = 0; i < 30 && phase === 'swing'; i++) update(1 / 60);
      return { land: { x: r3(PATH.lx), z: r3(PATH.lz) }, legal: serviceIn(PATH.lx, PATH.lz, rally.serverX, 0), net: PATH.net };
    },
    setShuttle: s => { Object.assign(S, s); sState = 'free'; },
    // 從任意位置模擬某種擊球（不改變遊戲）
    shot: (from, type, dir, side) => {
      const save = copyS(mkS(), S);
      Object.assign(S, from);
      const sd = side || 0;
      const kind = resolveKind(type, S.y, Math.abs(S.z));
      planHit(sd, kind, dir || 0, null);
      const v = Object.assign({}, sol);
      const b = mkS(); Object.assign(b, from); b.vx = v.vx; b.vy = v.vy; b.vz = v.vz;
      let ev = 0, t = 0, apex = b.y, netY = null, maxSp = 0;
      for (let i = 0; i < 2400; i++) {
        const pz = b.z, py = b.y;
        ev = step(b, DT, true); t += DT; apex = Math.max(apex, b.y);
        if (netY == null && pz !== 0 && (pz > 0) !== (b.z > 0)) netY = py + (b.y - py) * pz / (pz - b.z);
        if (ev === EV_NET || ev === EV_FLOOR) break;
      }
      copyS(S, save);
      const sp = Math.hypot(b.vx, b.vy, b.vz);
      return { kind, kmh: Math.round(v.speed * 3.6), el: r3(v.el), ev: ['', 'floor', 'net', 'cord', 'caught'][ev], land: { x: r3(b.x), z: r3(b.z) }, t: r3(t), apex: r3(apex), netY: netY == null ? null : r3(netY), endSpeed: r3(sp), descent: r3(Math.atan2(-b.vy, Math.hypot(b.vx, b.vz)) / DEG) };
    },
    sim: (s, sec) => {
      const b = Object.assign(mkS(), s), ev = [];
      for (let i = 0; i < (sec || 3) / DT; i++) { const e = step(b, DT, true); if (e) { ev.push({ e: ['', 'floor', 'net', 'cord', 'caught'][e], x: r3(b.x), y: r3(b.y), z: r3(b.z), t: r3(i * DT) }); if (e === EV_FLOOR) break; } }
      return { ev, end: { x: b.x, y: b.y, z: b.z } };
    },
    rules: {
      gameOver: (a, b, t, c) => gameOver(a, b, t || 21, c || 30),
      lineIn: (x, z) => lineIn(x, z),
      serviceIn: (x, z, serverX, side) => serviceIn(x, z, serverX, side || 0),
      courtX: (side, sc) => courtX(side, sc),
      pointTo: (w, why, keep) => { phase = 'rally'; pointTo(w, why || 'in'); if (!keep) nextFn = null; return { score: score.slice(), games: games.slice(), server, court: serveCourt(server) }; },
      setScore: (a, b, ga, gb) => { score[0] = a; score[1] = b; if (ga != null) { games[0] = ga; games[1] = gb; } updateBoard(); }
    },
    zone: () => inZone(P[0]),
    // 測試：把一顆球射向玩家（玩家固定不動），回傳是否擊中
    incoming: (st, type, freeze) => {
      phase = 'rally'; rally.serving = false; rally.last = 1; rally.canHit = 0; sState = 'free';
      Object.assign(S, st); S.px = S.x; S.py = S.y; S.pz = S.z;
      computePath(S); if (freeze) { P[0].plan.ok = false; P[0].tx = P[0].x; P[0].tz = P[0].z; P[0].vx = P[0].vz = 0; } else planFor(0, true);
      queued = { type: type || 'safe', aim: 0, t: simClock + 99 };
      const hits0 = rally.hits;
      for (let i = 0; i < 240 * 3 && phase === 'rally' && rally.last === 1; i++) { const sp = P[0].speed; if (freeze) P[0].speed = 0; tick(DT); P[0].speed = sp; }
      const hit = rally.last === 0;
      queued = null; nextFn = null;
      return { hit, swept: sweptHits, kind: lastShot.kind };
    },
    setPlayer: (x, z) => { P[0].x = P[0].tx = x; P[0].z = P[0].tz = z; P[0].vx = P[0].vz = 0; },
    // 測試：隨機發射大量球，檢查有沒有從網下或網身穿過去
    netFuzz: n => {
      let bad = 0, cross = 0, blocked = 0, cords = 0;
      const b = mkS();
      for (let k = 0; k < n; k++) {
        b.x = rand(-3, 3); b.y = rand(0.2, 3.2); b.z = rand(0.3, 6);
        const sp = rand(5, 120), el = rand(-35, 40) * DEG, az = rand(-0.4, 0.4);
        b.vx = Math.sin(az) * Math.cos(el) * sp; b.vz = -Math.cos(az) * Math.cos(el) * sp; b.vy = Math.sin(el) * sp;
        for (let i = 0; i < 2400; i++) {
          const px = b.x, py = b.y, pz = b.z;
          const ev = step(b, DT, Math.random() < 0.5);
          if (ev === EV_NET || ev === EV_CAUGHT) { blocked++; break; }
          if (ev === EV_CORD) cords++;
          if (pz > 0 && b.z <= 0 && ev !== EV_CORD) {
            const t = pz / (pz - b.z), nx = px + (b.x - px) * t, ny = py + (b.y - py) * t;
            cross++;
            if (Math.abs(nx) <= DW && ny < netTop(nx) + 0.0) bad++;
          }
          if (ev === EV_FLOOR) break;
        }
      }
      return { n, cross, blocked, cords, bad };
    },
    pause: on => togglePause(on),
    quality: () => qLevel,
    noRender: on => { noRender = !!on; },
    allCalls: () => calls.slice(),
    allLands: () => lands.slice()
  };
}
</script>
