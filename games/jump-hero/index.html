<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#7fd4ff">
<title>跳跳小勇士</title>
<link rel="stylesheet" href="../../assets/common.css">
<style>
  html, body { height: 100%; overflow: hidden; background: #29304d; overscroll-behavior: none; }
  #game { position: fixed; left: 0; top: 0; display: block; width: 100vw; height: 100vh; touch-action: none; }
  button { font-family: var(--kg-font); -webkit-tap-highlight-color: transparent; }
  .kg-btn:focus { outline: none; }
  .kg-btn:focus-visible, .lvb:focus-visible { outline: 4px solid #ffb020; outline-offset: 3px; }
  svg.ic { width: 22px; height: 22px; flex: none; display: block; }

  /* ---------- HUD ---------- */
  #hud { position: fixed; top: 10px; left: 64px; right: 64px; z-index: 8000; display: none; flex-wrap: wrap; justify-content: center; align-items: center; gap: 6px; pointer-events: none; }
  body.playing #hud { display: flex; }
  .pill { display: flex; align-items: center; gap: 4px; height: 40px; padding: 0 11px 0 8px; border-radius: 999px;
    background: linear-gradient(180deg, #fffdf8 0%, #ffeedd 100%); border: 3px solid #fff; color: #6b3a14; font-weight: 900; font-size: 18px;
    box-shadow: 0 4px 0 rgba(120,60,20,.25), 0 8px 16px rgba(60,30,10,.18); white-space: nowrap; }
  .pill b { font-variant-numeric: tabular-nums; min-width: 1.1em; text-align: center; }
  .pill.bump { animation: jhBump .28s ease; }
  .pill.hurt { animation: jhHurt .45s ease; }
  #pHP svg { width: 24px; height: 24px; transition: transform .2s; }
  #pHP svg.off { opacity: .35; filter: grayscale(1); transform: scale(.82); }
  #pSC svg { width: 22px; height: 22px; }
  #pSC svg.off { opacity: .3; filter: grayscale(1); }
  #btnPause { position: fixed; top: 66px; right: 10px; z-index: 9000; display: none; }
  body.playing #btnPause { display: grid; }
  #btnPause i { display: inline-block; width: 5px; height: 17px; border-radius: 3px; background: #6b3a14; margin: 0 2.5px; }
  #pu { position: fixed; top: 66px; left: 10px; z-index: 8000; display: none; flex-direction: column; gap: 6px; pointer-events: none; }
  body.playing #pu { display: flex; }
  .pu { display: none; align-items: center; gap: 5px; height: 34px; padding: 0 8px 0 5px; border-radius: 999px; background: rgba(255,255,255,.9); border: 3px solid #fff; box-shadow: 0 3px 0 rgba(0,0,0,.15); }
  .pu.on { display: flex; }
  .pu svg { width: 22px; height: 22px; }
  .pu .bar { width: 46px; height: 8px; border-radius: 4px; background: #e8dccc; overflow: hidden; }
  .pu .bar i { display: block; height: 100%; width: 100%; background: linear-gradient(90deg, #ffb020, #ff6a3d); transform-origin: left; }
  #bossBar { position: fixed; left: 50%; top: 60px; transform: translateX(-50%); z-index: 8000; width: min(340px, calc(100vw - 150px)); display: none; flex-direction: column; align-items: center; gap: 2px; pointer-events: none; }
  #bossBar.show { display: flex; animation: jhDrop .4s cubic-bezier(.2,1.5,.4,1); }
  #bossBar span { font-weight: 900; font-size: 15px; color: #fff; text-shadow: 0 2px 0 #5a1020, 0 0 6px #5a1020; }
  #bossBar .bar { width: 100%; height: 16px; border-radius: 10px; background: #3a1420; border: 3px solid #fff; overflow: hidden; box-shadow: 0 3px 0 rgba(0,0,0,.3); }
  #bossBar .bar i { display: block; height: 100%; width: 100%; background: linear-gradient(180deg, #ff8a8a, #e0283e); transition: width .35s ease; }
  body.port #bossBar { top: 96px; }
  body.port #banner { top: calc(var(--gh, 60vh) * 0.5); }

  /* ---------- 觸控按鈕 ---------- */
  #ctrl { position: fixed; left: 0; right: 0; bottom: 0; z-index: 7900; pointer-events: none; display: none; }
  body.playing.touch #ctrl { display: block; }
  .zone { position: absolute; bottom: 0; pointer-events: auto; touch-action: none; }
  #zL { left: 0; width: 230px; height: 150px; }
  #zR { right: 0; width: 170px; height: 160px; }
  .cb { position: absolute; border-radius: 50%; border: 3px solid rgba(255,255,255,.75); background: rgba(255,255,255,.26); box-shadow: 0 4px 12px rgba(0,0,0,.18);
    display: grid; place-items: center; transition: transform .06s, background .06s; }
  .cb svg { width: 46%; height: 46%; fill: rgba(255,255,255,.95); filter: drop-shadow(0 2px 1px rgba(0,0,0,.25)); }
  .cb.on { transform: scale(.92); background: rgba(255,255,255,.5); }
  #cbL { left: calc(14px + env(safe-area-inset-left)); bottom: calc(16px + env(safe-area-inset-bottom)); width: 84px; height: 84px; }
  #cbR { left: calc(110px + env(safe-area-inset-left)); bottom: calc(16px + env(safe-area-inset-bottom)); width: 84px; height: 84px; }
  #cbJ { right: calc(18px + env(safe-area-inset-right)); bottom: calc(18px + env(safe-area-inset-bottom)); width: 108px; height: 108px; background: rgba(255,180,80,.32); }
  #cbJ.on { background: rgba(255,180,80,.6); }
  body.port #ctrl { top: var(--gh, 60vh); background: linear-gradient(180deg, #3a4266 0%, #262c48 100%); border-top: 4px solid rgba(255,255,255,.35); pointer-events: auto; }
  body.port .zone, body.port #zL, body.port #zR { top: 0; bottom: 0; height: auto; }
  body.port #zL { width: 62%; }
  body.port #zR { width: 38%; }
  body.port #cbL, body.port #cbR { bottom: auto; top: 50%; margin-top: -48px; width: 96px; height: 96px; }
  body.port #cbL { left: 14px; }
  body.port #cbR { left: 124px; }
  body.port #cbJ { bottom: auto; top: 50%; margin-top: -60px; width: 120px; height: 120px; right: 16px; }
  @media (max-width: 360px) { body.port #cbL, body.port #cbR { width: 84px; height: 84px; margin-top: -42px; } body.port #cbR { left: 106px; } body.port #cbJ { width: 104px; height: 104px; margin-top: -52px; } }
  @media (max-width: 440px), (max-height: 440px) {
    #hud { gap: 4px; }
    .pill { height: 34px; font-size: 15px; padding: 0 8px 0 6px; gap: 3px; border-width: 2.5px; }
    .pill svg.ic { width: 18px; height: 18px; }
    #pHP svg { width: 20px; height: 20px; }
    #pSC svg { width: 18px; height: 18px; }
  }
  @media (max-width: 360px) { #hud { left: 62px; right: 62px; } .pill { padding: 0 6px 0 5px; } }
  @media (orientation: landscape) and (max-height: 440px) {
    #cbL, #cbR { width: 72px; height: 72px; bottom: calc(12px + env(safe-area-inset-bottom)); }
    #cbR { left: calc(96px + env(safe-area-inset-left)); }
    #cbJ { width: 92px; height: 92px; bottom: calc(14px + env(safe-area-inset-bottom)); }
    #zL { width: 190px; height: 120px; } #zR { width: 140px; height: 130px; }
    #bossBar { top: 52px; }
  }
  #rot { position: absolute; left: 50%; bottom: calc(10px + env(safe-area-inset-bottom)); transform: translateX(-50%); display: none; align-items: center; gap: 6px; color: rgba(255,255,255,.75); font-weight: 800; font-size: 13px; white-space: nowrap; pointer-events: none; }
  #rot svg { width: 20px; height: 20px; }
  body.port #rot { display: flex; }

  /* ---------- 畫面 ---------- */
  .scr { position: fixed; inset: 0; z-index: 9000; display: none; flex-direction: column; align-items: center; justify-content: center; padding: 64px 16px 16px; text-align: center; }
  .scr.show { display: flex; animation: jhFade .25s ease; }
  .scr.dim { background: rgba(30,20,50,.5); backdrop-filter: blur(2px); -webkit-backdrop-filter: blur(2px); }
  .logo { font-weight: 900; font-size: clamp(44px, 12vw, 92px); line-height: 1.05; letter-spacing: 2px; white-space: nowrap; margin: 0 0 4px; }
  .logo span { display: inline-block; color: var(--c); paint-order: stroke fill; -webkit-text-stroke: .15em #5a2a0c;
    text-shadow: 0 .07em 0 #5a2a0c, 0 .15em 16px rgba(60,20,0,.35); animation: jhBob 2.2s ease-in-out infinite; animation-delay: calc(var(--i) * -.2s); }
  .sub { color: #fff; font-weight: 800; font-size: clamp(15px, 4vw, 20px); margin: 4px 0 16px; line-height: 1.45; text-shadow: 0 2px 0 rgba(40,60,120,.55), 0 0 10px rgba(40,60,120,.4); }
  .acts { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
  .bigbtn { font-size: 25px !important; padding: 13px 34px !important; }
  .chip { margin-top: 14px; font-weight: 900; font-size: 16px; color: #6b3a14; background: rgba(255,255,255,.9); border-radius: 999px; padding: 5px 16px; border: 3px solid #fff; display: inline-flex; align-items: center; gap: 6px; }
  .chip svg { width: 20px; height: 20px; }
  .tipline { margin-top: 12px; color: #fff; font-weight: 700; font-size: 13.5px; line-height: 1.55; text-shadow: 0 1px 2px rgba(20,30,70,.7); }
  #titleScr { justify-content: flex-start; padding-top: max(64px, 9vh); }

  #mapScr { background: rgba(30,36,70,.55); justify-content: flex-start; padding: 10px 12px 14px; overflow-y: auto; touch-action: pan-y; }
  .map-head { flex: none; display: flex; align-items: center; justify-content: center; gap: 10px; min-height: 54px; width: 100%; padding: 0 58px; flex-wrap: wrap; }
  .map-head h2 { margin: 0; font-size: 28px; font-weight: 900; color: #fff; text-shadow: 0 3px 0 rgba(0,0,0,.3); }
  .map-head .chip { margin: 0; }
  #worlds { flex: none; display: grid; grid-template-columns: 1fr; gap: 12px; width: 100%; max-width: 980px; margin: 8px auto auto; }
  .wcard { position: relative; border: 4px solid #fff; border-radius: 24px; overflow: hidden; padding: 8px 10px 10px; box-shadow: 0 6px 0 rgba(0,0,0,.22), 0 12px 24px rgba(0,0,0,.2); }
  .wcard canvas.wbg { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 0; }
  .wcard .wt { position: relative; z-index: 1; display: flex; align-items: center; gap: 8px; font-weight: 900; font-size: 19px; color: #fff; text-shadow: 0 2px 0 rgba(0,0,0,.35); margin: 0 0 6px 4px; }
  .wcard .wt small { font-size: 13px; opacity: .9; }
  .lvrow { position: relative; z-index: 1; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
  .lvb { position: relative; border: 3px solid #fff; border-radius: 18px; background: linear-gradient(180deg, #fffdf8 0%, #ffecd6 100%); color: #6b3a14; cursor: pointer;
    box-shadow: 0 4px 0 rgba(120,60,20,.35); padding: 5px 4px 6px; display: flex; flex-direction: column; align-items: center; gap: 2px; min-height: 76px; transition: transform .1s; }
  .lvb:active { transform: translateY(3px); box-shadow: 0 1px 0 rgba(120,60,20,.35); }
  .lvb .ln { font-size: 19px; font-weight: 900; line-height: 1.1; display: flex; align-items: center; gap: 4px; }
  .lvb .ln svg { width: 20px; height: 20px; }
  .lvb .nm { font-size: 12.5px; font-weight: 800; opacity: .8; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
  .lvb .st { display: flex; gap: 1px; }
  .lvb .st svg { width: 18px; height: 18px; }
  .lvb .sc { display: flex; gap: 3px; }
  .lvb .sc i { width: 9px; height: 9px; border-radius: 50%; background: #e3d2c0; border: 1.5px solid #c8ad92; }
  .lvb .sc i.on { background: #ffd23a; border-color: #c48a00; }
  .lvb .lock { position: absolute; inset: 0; border-radius: 15px; background: rgba(90,80,100,.55); display: none; align-items: center; justify-content: center; }
  .lvb .lock svg { width: 34px; height: 34px; }
  .lvb.locked { cursor: not-allowed; }
  .lvb.locked .lock { display: flex; }
  .lvb.cur { box-shadow: 0 4px 0 rgba(120,60,20,.35), 0 0 0 4px #ffcf3a; animation: jhPulse 1.4s ease-in-out infinite; }
  @media (orientation: landscape) and (min-width: 600px) { #worlds { grid-template-columns: 1fr 1fr; } }
  @media (orientation: landscape) and (max-height: 520px) {
    .scr { padding: 8px 70px; }
    #titleScr { padding-top: 10px; justify-content: center; }
    .logo { font-size: clamp(38px, 15vh, 76px); }
    .sub { margin: 2px 0 10px; font-size: 16px; }
    #mapScr { padding: 6px 66px 10px; }
    .map-head { min-height: 46px; padding: 0; }
    .map-head h2 { font-size: 22px; }
    .wcard { padding: 4px 8px 8px; border-radius: 20px; }
    .wcard .wt { font-size: 16px; margin-bottom: 3px; }
    .lvb { min-height: 62px; padding: 3px 3px 4px; border-radius: 14px; }
    .lvb .nm { display: none; }
    .card2 { padding: 10px 16px 12px !important; }
    .card2 h2 { font-size: 26px !important; }
    .tally { margin: 4px 0 6px !important; }
    .tally div { padding: 2px 10px !important; font-size: 15px !important; }
    .stars3 svg { width: 44px !important; height: 44px !important; }
    .stars3 svg:nth-child(2) { width: 54px !important; height: 54px !important; }
    .hint { display: none; }
  }

  .card2 { width: min(430px, 100%); background: linear-gradient(180deg, #fffdf8 0%, #ffe9d2 100%); border: 5px solid #fff; border-radius: 30px; padding: 18px 18px 20px; color: #6b3a14;
    box-shadow: 0 8px 0 #d99a5e, 0 18px 40px rgba(40,20,0,.4); animation: kg-pop .38s cubic-bezier(.2,1.6,.4,1); position: relative; }
  .card2 h2 { margin: 0 0 4px; font-size: 32px; font-weight: 900; }
  .card2 p { margin: 4px 0 12px; font-size: 17px; font-weight: 800; line-height: 1.45; }
  .card2 canvas.face { width: 96px; height: 96px; display: block; margin: -6px auto 0; }
  .stars3 { display: flex; justify-content: center; gap: 8px; margin: 2px 0 4px; min-height: 60px; }
  .stars3 svg { width: 58px; height: 58px; animation: jhStar .5s cubic-bezier(.2,1.6,.4,1) both; }
  .stars3 svg:nth-child(2) { width: 70px; height: 70px; margin-top: -10px; }
  .tally { margin: 6px 0 12px; display: flex; flex-direction: column; gap: 5px; }
  .tally div { display: flex; justify-content: space-between; align-items: center; background: rgba(255,255,255,.75); border-radius: 14px; padding: 5px 12px; font-weight: 900; font-size: 17px; }
  .tally div span { display: flex; align-items: center; gap: 6px; }
  .tally div svg { width: 20px; height: 20px; }
  .tally div b { font-variant-numeric: tabular-nums; }
  .tally div.tot { background: linear-gradient(180deg, #fff3b0, #ffd76a); }
  .newrec { display: none; position: absolute; top: -18px; left: 50%; transform: translateX(-50%) rotate(-4deg); background: linear-gradient(180deg, #ffe066, #ffb020); color: #6b3a00; font-weight: 900; font-size: 18px; padding: 6px 18px; border-radius: 999px; border: 3px solid #fff; box-shadow: 0 4px 0 #c47c00; white-space: nowrap; }
  .newrec.show { display: block; }
  .hint { margin-top: 12px; font-size: 13px; font-weight: 700; opacity: .55; }
  #banner { position: fixed; left: 50%; top: max(40%, 200px); transform: translate(-50%, -50%); z-index: 8500; pointer-events: none; display: none; flex-direction: column; align-items: center; text-align: center; }
  #banner.show { display: flex; animation: jhBanner 2.1s ease both; }
  #banner .bw { font-weight: 900; font-size: 18px; color: #fff; background: rgba(40,30,60,.55); border-radius: 999px; padding: 3px 16px; margin-bottom: 4px; }
  #banner .bn { font-weight: 900; font-size: clamp(30px, 8vw, 54px); color: #fff; paint-order: stroke fill; -webkit-text-stroke: .14em #5a2a0c; text-shadow: 0 4px 0 #5a2a0c; white-space: nowrap; }

  @keyframes jhFade { from { opacity: 0; } to { opacity: 1; } }
  @keyframes jhBob { 0%, 100% { transform: translateY(0) rotate(-2deg); } 50% { transform: translateY(-.12em) rotate(2deg); } }
  @keyframes jhBump { 0% { transform: scale(1); } 40% { transform: scale(1.16); } 100% { transform: scale(1); } }
  @keyframes jhHurt { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-6px); } 50% { transform: translateX(6px); } 75% { transform: translateX(-3px); } }
  @keyframes jhStar { from { transform: scale(0) rotate(-60deg); opacity: 0; } to { transform: scale(1) rotate(0); opacity: 1; } }
  @keyframes jhDrop { from { transform: translate(-50%, -30px); opacity: 0; } to { transform: translate(-50%, 0); opacity: 1; } }
  @keyframes jhPulse { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-3px); } }
  @keyframes jhBanner { 0% { opacity: 0; transform: translate(-50%, -50%) scale(.6); } 15% { opacity: 1; transform: translate(-50%, -50%) scale(1.06); } 22% { transform: translate(-50%, -50%) scale(1); } 80% { opacity: 1; } 100% { opacity: 0; transform: translate(-50%, -62%) scale(1); } }
</style>
</head>
<body>
<canvas id="game" aria-label="跳跳小勇士遊戲畫面"></canvas>

<div id="hud">
  <div class="pill" id="pHP" title="生命值"><svg><use href="#i-heart"/></svg><svg><use href="#i-heart"/></svg><svg><use href="#i-heart"/></svg></div>
  <div class="pill" id="pLives" title="剩餘次數"><svg class="ic"><use href="#i-fox"/></svg>×<b id="vLives">3</b></div>
  <div class="pill" id="pCoins" title="金幣"><svg class="ic"><use href="#i-coin"/></svg><b id="vCoins">0</b></div>
  <div class="pill" id="pSC" title="星星幣"><svg class="off"><use href="#i-star"/></svg><svg class="off"><use href="#i-star"/></svg><svg class="off"><use href="#i-star"/></svg></div>
  <div class="pill" id="pTime" title="時間"><svg class="ic"><use href="#i-clock"/></svg><b id="vTime">0</b></div>
</div>
<div id="pu">
  <div class="pu" id="puStar"><svg><use href="#i-pstar"/></svg><div class="bar"><i></i></div></div>
  <div class="pu" id="puMag"><svg><use href="#i-magnet"/></svg><div class="bar"><i></i></div></div>
  <div class="pu" id="puShoe"><svg><use href="#i-shoe"/></svg></div>
</div>
<div id="bossBar"><span id="bossName">大野豬</span><div class="bar"><i id="bossHP"></i></div></div>
<button class="kg-fab" id="btnPause" aria-label="暫停" title="暫停 (P)"><span><i></i><i></i></span></button>
<div id="banner"><div class="bw" id="bannerW">草原</div><div class="bn" id="bannerN">1-1</div></div>

<div id="ctrl">
  <div class="zone" id="zL"><div class="cb" id="cbL"><svg viewBox="0 0 24 24"><path d="M15.5 4.5L7 12l8.5 7.5z"/></svg></div><div class="cb" id="cbR"><svg viewBox="0 0 24 24"><path d="M8.5 4.5L17 12l-8.5 7.5z"/></svg></div></div>
  <div class="zone" id="zR"><div class="cb" id="cbJ"><svg viewBox="0 0 24 24"><path d="M12 4l8 9h-5v7H9v-7H4z"/></svg></div></div>
  <div id="rot"><svg viewBox="0 0 24 24"><rect x="3" y="7" width="18" height="10" rx="2.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M7 3.5a8 8 0 0 1 10 0M17 3.5l-.2 2.6M17 3.5l-2.5.6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>橫放手機畫面更大更好玩</div>
</div>

<div class="scr show" id="titleScr">
  <div class="logo" id="logo" aria-label="跳跳小勇士"></div>
  <div class="sub">小狐狸出發冒險！<br>跳過陷阱、踩扁怪獸、打敗大魔王！</div>
  <div class="acts">
    <button class="kg-btn green bigbtn" id="btnPlay">開始</button>
    <button class="kg-btn blue bigbtn" id="btnMap">選擇關卡</button>
  </div>
  <div class="chip" id="titleStars"><svg><use href="#i-star"/></svg><span>0 / 36</span></div>
  <div class="tipline" id="titleTip">← → 移動・空白鍵 / ↑ 跳（按久跳更高）・P 暫停</div>
</div>

<div class="scr" id="mapScr">
  <div class="map-head"><h2>選擇關卡</h2><div class="chip" id="mapStars"><svg><use href="#i-star"/></svg><span>0 / 36</span></div></div>
  <div id="worlds"></div>
</div>

<div class="scr dim" id="pauseScr">
  <div class="card2">
    <h2>暫停中</h2>
    <p id="pauseInfo">1-1 草原</p>
    <div class="acts">
      <button class="kg-btn green" id="btnResume">繼續</button>
      <button class="kg-btn yellow" id="btnRestart">重新開始</button>
      <button class="kg-btn blue" id="btnMenu1">選擇關卡</button>
    </div>
    <div class="hint">按 P 或 Esc 繼續</div>
  </div>
</div>

<div class="scr dim" id="doneScr">
  <div class="card2">
    <div class="newrec" id="newRec">新紀錄！</div>
    <h2 id="doneTitle">過關了！</h2>
    <div class="stars3" id="doneStars"></div>
    <div class="tally">
      <div><span><svg><use href="#i-coin"/></svg>金幣</span><b id="tCoins">0</b></div>
      <div><span><svg><use href="#i-star"/></svg>星星幣</span><b id="tSC">0 / 3</b></div>
      <div><span><svg><use href="#i-clock"/></svg>時間</span><b id="tTime">0 秒</b></div>
      <div class="tot"><span>總分</span><b id="tScore">0</b></div>
    </div>
    <div class="acts">
      <button class="kg-btn green" id="btnNext">下一關</button>
      <button class="kg-btn yellow" id="btnAgain">再玩一次</button>
      <button class="kg-btn blue" id="btnMenu2">地圖</button>
    </div>
  </div>
</div>

<div class="scr dim" id="overScr">
  <div class="card2">
    <canvas class="face" id="overFace" width="192" height="192"></canvas>
    <h2>遊戲結束</h2>
    <p id="overMsg">別灰心，再試一次吧！</p>
    <div class="acts">

let D = 1, SD = 1, CD = 1, BD = 1;
function mkS(w, h, ax, ay, paint, dens) {
  const d = dens || SD; const c = mkCanvas(w * d, h * d), k = c.getContext('2d');
  k.scale(c.width / w, c.height / h); k.translate(ax, ay); k.lineJoin = 'round'; k.lineCap = 'round';

}
function flashOf(s) {
  const c = mkCanvas(s.c.width, s.c.height), k = c.getContext('2d');
  k.drawImage(s.c, 0, 0); k.globalCompositeOperation = 'source-atop'; k.fillStyle = 'rgba(255,255,255,.88)'; k.fillRect(0, 0, c.width, c.height);
  return { c, w: s.w, h: s.h, ax: s.ax, ay: s.ay };
}
function glowS(r, col, a) { return mkS(r * 2, r * 2, r, r, k => { k.fillStyle = rg(k, 0, 0, 0, 0, 0, r, [0, col.replace('A', a), 0.45, col.replace('A', a * 0.45), 1, col.replace('A', 0)]); k.fillRect(-r, -r, r * 2, r * 2); }, Math.min(SD, 1.5)); }
const SPR = { w: {} };

/* ---------- 小狐狸 ---------- */
const FX = { O: '#5a2810', F: '#ff8a3a', F2: '#e2641f', CR: '#fff3df', SC: '#3d9cff', SC2: '#1f6fd0', BT: '#8a4f2a' };
function limb(k, x0, y0, x1, y1, w, col) {
  k.beginPath(); k.moveTo(x0, y0); k.lineTo(x1, y1);
  k.strokeStyle = FX.O; k.lineWidth = w + 2.8; k.stroke();
  k.strokeStyle = col; k.lineWidth = w; k.stroke();
}
function drawFox(k, p) {
  const by = p.bob || 0, O = FX.O;
  k.save(); k.rotate(p.lean || 0);
  k.lineWidth = 1.5; k.strokeStyle = O;
  // 尾巴
  k.save(); k.translate(-5, -8 + by); k.rotate(0.55 + (p.tail || 0));
  ell(k, -9, 0, 10, 5.6); k.fillStyle = FX.F; k.fill();
  k.save(); ell(k, -9, 0, 10, 5.6); k.clip(); ell(k, -17.5, 0, 5.5, 7); k.fillStyle = FX.CR; k.fill(); ell(k, -7, -2.6, 6, 1.5); k.fillStyle = 'rgba(255,255,255,.3)'; k.fill(); k.restore();
  ell(k, -9, 0, 10, 5.6); k.lineWidth = 1.5; k.strokeStyle = O; k.stroke();
  k.restore();
  // 背包
  rrect(k, -10.5, -17.5 + by, 7.5, 10.5, 2.6); k.fillStyle = '#b8783e'; k.fill(); k.stroke();
  rrect(k, -11.2, -18 + by, 8.5, 4.2, 2); k.fillStyle = '#8a5228'; k.fill(); k.stroke();
  // 後腳、後手
  const hipY = -5 + by;
  limb(k, -2, hipY, p.lb[0], p.lb[1] - 1.6, 3.6, FX.F2); boot(k, p.lb[0], p.lb[1], 1);
  limb(k, -1.5, -13 + by, p.ab[0], p.ab[1] + by, 3, FX.F2); paw(k, p.ab[0], p.ab[1] + by);
  // 身體
  ell(k, 0, -10 + by, 7, 6.6); k.fillStyle = FX.F; k.fill(); k.lineWidth = 1.5; k.strokeStyle = O; k.stroke();
  ell(k, 2, -9 + by, 4.2, 4.6); k.fillStyle = FX.CR; k.fill();
  // 前腳
  limb(k, 2.5, hipY, p.lf[0], p.lf[1] - 1.6, 3.6, FX.F); boot(k, p.lf[0], p.lf[1], 0);
  // 圍巾
  const fl = p.flow || 0;
  k.lineWidth = 1.4; k.strokeStyle = O;
  k.beginPath(); k.moveTo(-4, -16.5 + by); k.quadraticCurveTo(-9 - fl, -18.5 + by - fl * 0.3, -14 - fl * 1.6, -15.5 + by + Math.sin(fl) * 1.5);
  k.lineTo(-13 - fl * 1.4, -12 + by + Math.sin(fl) * 1.2); k.quadraticCurveTo(-8, -13.5 + by, -4, -13.5 + by); k.closePath(); k.fillStyle = FX.SC2; k.fill(); k.stroke();
  rrect(k, -6.5, -18.5 + by, 14, 4.8, 2.4); k.fillStyle = FX.SC; k.fill(); k.stroke();
  k.beginPath(); k.moveTo(-4, -17.2 + by); k.lineTo(5, -17.2 + by); k.strokeStyle = 'rgba(255,255,255,.55)'; k.lineWidth = 1; k.stroke();
  // 頭
  k.save(); k.translate(1.5, -26 + by); k.rotate(p.head || 0);
  k.lineWidth = 1.5; k.strokeStyle = O;
  foxEar(k, -6, -4.5, -9.5, -17, -0.5, -8.5);
  foxEar(k, 2.5, -8, 8.5, -17.5, 9.8, -5);
  ell(k, 0, 0, 10.2, 8.6); k.fillStyle = FX.F; k.fill(); k.stroke();
  k.save(); ell(k, 0, 0, 10.2, 8.6); k.clip();
  ell(k, 4, 4.6, 8.4, 5); k.fillStyle = FX.CR; k.fill(); ell(k, -6.5, 5, 4.2, 3.2); k.fill();
  ell(k, -3, -5, 6, 2.4); k.fillStyle = 'rgba(255,255,255,.22)'; k.fill();
  k.restore();
  ell(k, 0, 0, 10.2, 8.6); k.stroke();
  // 眼睛
  const eye = p.eye || 'open';
  for (const ex of [-1.6, 5.2]) foxEye(k, ex, -1.3, eye);
  ell(k, -4.8, 2.8, 2, 1.2); k.fillStyle = 'rgba(255,100,120,.45)'; k.fill();
  ell(k, 8, 3.4, 1.5, 1); k.fill();
  ell(k, 10, 1.4, 1.9, 1.5); k.fillStyle = '#2a1a10'; k.fill(); ell(k, 9.5, 0.9, 0.6, 0.4); k.fillStyle = '#fff'; k.fill();
  const mo = p.mouth || 'smile';
  if (mo === 'smile') { k.beginPath(); k.moveTo(5.4, 4.2); k.quadraticCurveTo(7, 5.8, 8.6, 4.4); k.strokeStyle = O; k.lineWidth = 1.1; k.stroke(); }
  else if (mo === 'open') { ell(k, 7, 5, 2.1, 1.9); k.fillStyle = '#8a2424'; k.fill(); ell(k, 7, 5.9, 1.3, 0.8); k.fillStyle = '#ff7a8a'; k.fill(); }
  else { ell(k, 7, 5, 1.1, 1.3); k.fillStyle = '#5a1a1a'; k.fill(); }
  k.restore();
  // 前手

}
function foxEar(k, x1, y1, x2, y2, x3, y3) {
  tri(k, x1, y1, x2, y2, x3, y3); k.fillStyle = FX.F; k.fill();

  tri(k, lerp(x1, x2, 0.25) + 1, lerp(y1, y2, 0.25), lerp(x2, x1, 0.12) + 0.6, lerp(y2, y1, 0.18) + 1.6, lerp(x3, x2, 0.3) - 0.6, lerp(y3, y2, 0.3)); k.fillStyle = '#ffc0a0'; k.fill();
  tri(k, x1, y1, x2, y2, x3, y3); k.strokeStyle = FX.O; k.lineWidth = 1.5; k.stroke();
}
function foxEye(k, x, y, t) {
  k.strokeStyle = '#2a1a10'; k.lineWidth = 1.3;
  if (t === 'blink') { k.beginPath(); k.moveTo(x - 1.8, y); k.quadraticCurveTo(x, y + 1.7, x + 1.8, y); k.stroke(); }
  else if (t === 'happy') { k.beginPath(); k.moveTo(x - 1.9, y + 0.9); k.quadraticCurveTo(x, y - 2.4, x + 1.9, y + 0.9); k.stroke(); }
  else if (t === 'hurt') { k.beginPath(); k.moveTo(x - 1.6, y - 1.6); k.lineTo(x + 1.6, y + 1.6); k.moveTo(x + 1.6, y - 1.6); k.lineTo(x - 1.6, y + 1.6); k.stroke(); }
  else { const s = t === 'wide' ? 1.18 : 1; ell(k, x, y, 1.75 * s, 2.35 * s); k.fillStyle = '#2a1a10'; k.fill(); ell(k, x + 0.55, y - 0.9, 0.75, 0.85); k.fillStyle = '#fff'; k.fill(); }
}
function boot(k, x, y, back) { ell(k, x + 1.3, y - 2, 3.7, 2.5); k.fillStyle = back ? '#6e3c1e' : FX.BT; k.fill(); k.lineWidth = 1.3; k.strokeStyle = FX.O; k.stroke(); }
function paw(k, x, y) { ell(k, x, y, 2.1, 2.1); k.fillStyle = FX.CR; k.fill(); k.lineWidth = 1.2; k.strokeStyle = FX.O; k.stroke(); }

function buildFox() {
  const S = p => mkS(50, 52, 26, 47, k => drawFox(k, p));
  const base = { lf: [3, 0], lb: [-3, 0], af: [5.5, -9], ab: [-4, -9], eye: 'open', mouth: 'smile', flow: 1 };
  const f = {};
  f.idle = [0, -0.45, -0.8, -0.45].map((b, i) => S(Object.assign({}, base, { bob: b, tail: Math.sin(i / 4 * TAU) * 0.12, flow: 1 + Math.sin(i / 4 * TAU) * 0.4 })));
  f.blink = S(Object.assign({}, base, { bob: -0.45, eye: 'blink' }));
  f.run = [];
  for (let i = 0; i < 6; i++) {

    f.run.push(S(Object.assign({}, base, {
      lf: [2 + 5.2 * Math.cos(ph), -Math.max(0, 3.6 * Math.sin(ph))], lb: [-1 + 5.2 * Math.cos(ph + Math.PI), -Math.max(0, 3.6 * Math.sin(ph + Math.PI))],

    })));
  }
  f.jump = S(Object.assign({}, base, { lf: [6, -3.5], lb: [-4, -1], af: [7, -17], ab: [-5, -18], bob: -1, tail: 0.55, mouth: 'open', flow: 2.5, lean: -0.06 }));
  f.fall = S(Object.assign({}, base, { lf: [5, 1], lb: [-4, 1], af: [8.5, -14], ab: [-6.5, -15], tail: 0.95, eye: 'wide', mouth: 'o', flow: 4, lean: 0.04 }));
  f.hurt = S(Object.assign({}, base, { lf: [5, -1], lb: [-4, 0], af: [8, -17], ab: [-7, -6], eye: 'hurt', mouth: 'o', lean: -0.28, tail: 0.8, flow: 3 }));
  f.win = [S(Object.assign({}, base, { af: [5, -25], ab: [-3, -25], eye: 'happy', mouth: 'open', flow: 1.5 })),
    S(Object.assign({}, base, { bob: -2.2, af: [6, -26.5], ab: [-3, -26.5], lf: [4.5, -2.2], lb: [-3, -1.2], eye: 'happy', mouth: 'open', flow: 2.5, tail: 0.3 }))];

    k.lineWidth = 1.1; k.strokeStyle = '#3a6aa8';

    k.fillStyle = '#fff'; k.fill(); k.stroke();
    k.beginPath(); k.moveTo(-3, -1); k.lineTo(-10, -4); k.moveTo(-3, 1); k.lineTo(-8, 0); k.strokeStyle = '#9cc4f0'; k.stroke();
  });
  SPR.glow = [];
  for (let i = 0; i < 6; i++) SPR.glow.push(glowS(30, 'hsla(' + (i * 60) + ',100%,62%,A)', 0.85));

}
