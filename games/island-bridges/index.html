<script>
'use strict';
/* =====================================================================
 * 題目產生器與解題器（唯一解）：規則推理 + 回溯驗證
 * ===================================================================== */
function PuzzleLib() {
  'use strict';
  function rngOf(seed) {
    let a = seed >>> 0;
    return function () {
      a = (a + 0x6D2B79F5) >>> 0;
      let t = a;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  const DR = [-1, 0, 1, 0], DC = [0, 1, 0, -1];

  /** 由島嶼建立題目結構：鄰居邊、交叉表 */
  function build(w, h, isl) {
    const at = new Int16Array(w * h).fill(-1);
    isl.forEach((s, i) => { at[s.r * w + s.c] = i; });
    const edges = [], islEdges = isl.map(() => []), nb = isl.map(() => [-1, -1, -1, -1]);
    isl.forEach((s, i) => {
      for (const d of [1, 2]) {
        let r = s.r + DR[d], c = s.c + DC[d];
        while (r >= 0 && c >= 0 && r < h && c < w && at[r * w + c] < 0) { r += DR[d]; c += DC[d]; }
        if (r >= 0 && c >= 0 && r < h && c < w) {
          const j = at[r * w + c], e = edges.length;
          edges.push({ a: i, b: j, horiz: d === 1, len: Math.abs(r - s.r) + Math.abs(c - s.c) });
          islEdges[i].push(e); islEdges[j].push(e);
          nb[i][d] = e; nb[j][(d + 2) % 4] = e;
        }
      }
    });
    const cross = edges.map(() => []);
    for (let e = 0; e < edges.length; e++) {
      const E = edges[e]; if (!E.horiz) continue;
      const A = isl[E.a], B = isl[E.b], row = A.r, c0 = Math.min(A.c, B.c), c1 = Math.max(A.c, B.c);
      for (let f = 0; f < edges.length; f++) {
        const F = edges[f]; if (F.horiz) continue;
        const P = isl[F.a], Q = isl[F.b], col = P.c, r0 = Math.min(P.r, Q.r), r1 = Math.max(P.r, Q.r);
        if (col > c0 && col < c1 && row > r0 && row < r1) { cross[e].push(f); cross[f].push(e); }
      }
    }
    const cap = edges.map(E => Math.min(2, isl[E.a].n, isl[E.b].n));
    return { w, h, isl, edges, islEdges, cross, nb, cap };
  }

  /* ---------- 推理 ---------- */
  // 回傳 false = 矛盾。log(e, kind, info) 在 lo 增加時呼叫（提示用）
  function propagate(P, lo, hi, log) {
    const { isl, edges, islEdges, cross } = P, N = isl.length;
    let changed = true, guard = 0;
    while (changed) {
      changed = false;
      if (++guard > 500) break;
      // 交叉
      for (let e = 0; e < edges.length; e++) if (lo[e] > 0) for (const f of cross[e]) { if (lo[f] > 0) return false; if (hi[f] > 0) { hi[f] = 0; changed = true; } }
      // 孤立（兩島互相用完）
      if (N > 2) for (let e = 0; e < edges.length; e++) {
        if (lo[e] === hi[e] || hi[e] === 0) continue;
        const v = hi[e], E = edges[e];
        if (closesPair(P, lo, E.a, e, v) && closesPair(P, lo, E.b, e, v)) {
          hi[e] = v - 1; changed = true;
          if (lo[e] > hi[e]) return false;
        }
      }
      // 島嶼數字
      for (let i = 0; i < N; i++) {
        const n = isl[i].n, es = islEdges[i];
        let sl = 0, sh = 0;
        for (const e of es) { sl += lo[e]; sh += hi[e]; }
        if (sl > n || sh < n) return false;
        for (const e of es) {
          const nl = Math.max(lo[e], n - (sh - hi[e])), nh = Math.min(hi[e], n - (sl - lo[e]));
          if (nl > nh) return false;
          if (nh < hi[e]) { sh -= hi[e] - nh; hi[e] = nh; changed = true; }
          if (nl > lo[e]) {
            if (log) log(e, 'island', i, nl, sh - hi[e]);
            sl += nl - lo[e]; lo[e] = nl; changed = true;
            for (const f of cross[e]) { if (lo[f] > 0) return false; hi[f] = 0; }
          }
        }
      }
      if (changed) continue;
      // 連通：可能的橋必須連通；割邊必須至少一座
      const r = connectRule(P, lo, hi, log);
      if (r === false) return false;
      if (r === true) changed = true;
    }
    return true;
  }
  function closesPair(P, lo, i, e, v) {
    let s = v;
    for (const f of P.islEdges[i]) if (f !== e) { if (lo[f] > 0) return false; }
    return s === P.isl[i].n;
  }
  function connectRule(P, lo, hi, log) {
    const N = P.isl.length, { edges, islEdges } = P;
    // 已滿且封閉的群
    const comp = new Int16Array(N).fill(-1);
    for (let s = 0; s < N; s++) {
      if (comp[s] >= 0) continue;
      const st = [s]; comp[s] = s; let closed = true, cnt = 0;
      while (st.length) {
        const i = st.pop(); cnt++;
        for (const e of islEdges[i]) {
          if (hi[e] > lo[e]) closed = false;
          if (lo[e] > 0) { const j = edges[e].a === i ? edges[e].b : edges[e].a; if (comp[j] < 0) { comp[j] = s; st.push(j); } }
        }
      }
      if (closed && cnt < N) return false;
    }
    // Tarjan 割邊（hi>0 的圖）
    const disc = new Int32Array(N).fill(-1), low = new Int32Array(N);
    let tt = 0, any = false, visited = 0;
    const stack = [[0, -1, 0]];
    disc[0] = low[0] = tt++; visited++;
    const bridgesFound = [];
    while (stack.length) {
      const top = stack[stack.length - 1], u = top[0], pe = top[1];
      const es = islEdges[u];
      if (top[2] < es.length) {
        const e = es[top[2]++];
        if (hi[e] === 0 || e === pe) continue;
        const v = edges[e].a === u ? edges[e].b : edges[e].a;
        if (disc[v] < 0) { disc[v] = low[v] = tt++; visited++; stack.push([v, e, 0]); }
        else low[u] = Math.min(low[u], disc[v]);
      } else {
        stack.pop();
        if (stack.length) {
          const p = stack[stack.length - 1][0];
          low[p] = Math.min(low[p], low[u]);
          if (low[u] > disc[p]) bridgesFound.push(pe);
        }
      }
    }
    if (visited < N) return false;
    for (const e of bridgesFound) if (lo[e] === 0) {
      if (log) log(e, 'connect', -1, 1);
      lo[e] = 1; any = true;
      for (const f of P.cross[e]) { if (lo[f] > 0) return false; hi[f] = 0; }
    }
    return any ? true : null;
  }
  function initBounds(P) {
    const lo = new Int8Array(P.edges.length), hi = Int8Array.from(P.cap);
    return { lo, hi };
  }
  function solvedAll(lo, hi) { for (let e = 0; e < lo.length; e++) if (lo[e] !== hi[e]) return false; return true; }

  /** 試探一層：假設某值，若矛盾就排除。回傳 null 失敗、true 有進展、false 無進展 */
  function trialStep(P, lo, hi) {
    for (let e = 0; e < lo.length; e++) {
      if (lo[e] === hi[e]) continue;
      for (const v of [lo[e], hi[e]]) {
        const l2 = lo.slice(), h2 = hi.slice();
        l2[e] = h2[e] = v;
        if (!propagate(P, l2, h2)) {
          if (v === lo[e]) lo[e]++; else hi[e]--;
          if (!propagate(P, lo, hi)) return null;
          return true;
        }
      }
    }
    return false;
  }
  /** 邏輯解題：level 0 = 只用規則；1 = 允許一層試探。回傳 {ok, lo, hi, trials} */
  function logicSolve(P, level) {
    const { lo, hi } = initBounds(P);
    if (!propagate(P, lo, hi)) return { ok: false };
    let trials = 0;
    while (!solvedAll(lo, hi)) {
      if (level < 1) return { ok: false, lo, hi };
      const r = trialStep(P, lo, hi);
      if (r === null) return { ok: false };
      if (r === false) return { ok: false, lo, hi };
      trials++;
      if (trials > 400) return { ok: false };
    }
    return { ok: true, lo, hi, trials };
  }
  /** 回溯計算解的個數（最多 limit） */
  function countSolutions(P, limit, out) {
    let count = 0, nodes = 0;
    function rec(lo, hi) {
      if (count >= limit || ++nodes > 200000) return;
      if (!propagate(P, lo, hi)) return;
      let best = -1, bestScore = 1e9;
      for (let e = 0; e < lo.length; e++) if (lo[e] !== hi[e]) {
        const sc = hi[e] - lo[e];
        if (sc < bestScore) { bestScore = sc; best = e; if (sc === 1) break; }
      }
      if (best < 0) {
        if (connectedLo(P, lo)) { count++; if (out && count === 1) out.sol = Array.from(lo); }
        return;
      }
      for (let v = hi[best]; v >= lo[best]; v--) {
        const l2 = lo.slice(), h2 = hi.slice();
        l2[best] = h2[best] = v;
        rec(l2, h2);
      }
    }
    const b = initBounds(P);
    rec(b.lo, b.hi);
    return nodes > 200000 ? -1 : count;
  }
  function connectedLo(P, cnt) {
    const N = P.isl.length, seen = new Uint8Array(N), st = [0]; seen[0] = 1; let k = 1;
    while (st.length) {
      const i = st.pop();
      for (const e of P.islEdges[i]) if (cnt[e] > 0) {
        const j = P.edges[e].a === i ? P.edges[e].b : P.edges[e].a;
        if (!seen[j]) { seen[j] = 1; k++; st.push(j); }
      }
    }
    return k === N;
  }

  /* ---------- 出題 ---------- */
  function candidate(w, h, target, rng, dblP, extraP, maxLen) {
    const occ = new Int8Array(w * h); // 0 空、1 島、2 橫橋、3 直橋
    const isl = [], links = [];
    const r0 = Math.floor(rng() * h), c0 = Math.floor(rng() * w);
    isl.push({ r: r0, c: c0 }); occ[r0 * w + c0] = 1;
    const nearIsl = (r, c) => {
      for (let d = 0; d < 4; d++) { const rr = r + DR[d], cc = c + DC[d]; if (rr >= 0 && cc >= 0 && rr < h && cc < w && occ[rr * w + cc] === 1) return true; }
      return false;
    };
    let tries = 0;
    while (isl.length < target && tries++ < target * 80) {
      const i = Math.floor(rng() * isl.length), d = Math.floor(rng() * 4), s = isl[i];
      const L = 2 + Math.floor(rng() * (maxLen - 1));
      let ok = true;
      for (let k = 1; k < L; k++) { const r = s.r + DR[d] * k, c = s.c + DC[d] * k; if (r < 0 || c < 0 || r >= h || c >= w || occ[r * w + c]) { ok = false; break; } }
      if (!ok) continue;
      const r = s.r + DR[d] * L, c = s.c + DC[d] * L;
      if (r < 0 || c < 0 || r >= h || c >= w || occ[r * w + c] || nearIsl(r, c)) continue;
      for (let k = 1; k < L; k++) occ[(s.r + DR[d] * k) * w + s.c + DC[d] * k] = d % 2 ? 2 : 3;
      occ[r * w + c] = 1;
      isl.push({ r, c });
      links.push([i, isl.length - 1, rng() < dblP ? 2 : 1]);
    }
    if (isl.length < Math.max(3, target * 0.8)) return null;
    // 打亂島的編號順序（讓 0 號不一定是起點）—— 依位置排序
    const order = isl.map((s, i) => i).sort((a, b) => (isl[a].r * w + isl[a].c) - (isl[b].r * w + isl[b].c));
    const inv = []; order.forEach((o, k) => { inv[o] = k; });
    const isl2 = order.map(o => ({ r: isl[o].r, c: isl[o].c, n: 0 }));
    const P0 = build(w, h, isl2);
    const sol = new Int8Array(P0.edges.length);
    const findEdge = (a, b) => P0.islEdges[a].find(e => (P0.edges[e].a === a && P0.edges[e].b === b) || (P0.edges[e].a === b && P0.edges[e].b === a));
    for (const [a, b, k] of links) { const e = findEdge(inv[a], inv[b]); if (e == null) return null; sol[e] = k; }
    // 額外的橋（形成迴圈）
    const used = new Uint8Array(P0.edges.length);
    for (let e = 0; e < sol.length; e++) if (sol[e]) used[e] = 1;
    for (let e = 0; e < sol.length; e++) {
      if (sol[e] || rng() > extraP) continue;
      let bad = false;
      for (const f of P0.cross[e]) if (sol[f]) { bad = true; break; }
      if (bad) continue;
      sol[e] = rng() < dblP ? 2 : 1;
    }
    for (let e = 0; e < sol.length; e++) if (sol[e]) { isl2[P0.edges[e].a].n += sol[e]; isl2[P0.edges[e].b].n += sol[e]; }
    return { isl: isl2.map(s => ({ r: s.r, c: s.c, n: s.n })), sol };
  }

  const TIERS = [
    { name: '入門', size: 5, isl: [5, 7], dbl: 0.3, extra: 0.15, maxLen: 4, logic: 0 },
    { name: '簡單', size: 7, isl: [9, 12], dbl: 0.35, extra: 0.25, maxLen: 4, logic: 0 },
    { name: '普通', size: 9, isl: [14, 18], dbl: 0.4, extra: 0.3, maxLen: 5, logic: 0 },
    { name: '困難', size: 11, isl: [21, 26], dbl: 0.4, extra: 0.35, maxLen: 6, logic: 1 },
    { name: '專家', size: 13, isl: [29, 36], dbl: 0.45, extra: 0.4, maxLen: 7, logic: 1 }
  ];
  function tierSize(t, lv) { return t === 4 && lv >= 15 ? 15 : TIERS[t].size; }

  /** 產生唯一解題目。opts: {tier, level(0-29) 或 -1, seed} */
  function generate(opts) {
    const T = TIERS[opts.tier], lv = opts.level == null ? 15 : opts.level;
    const size = opts.size || tierSize(opts.tier, Math.max(0, lv));
    const rng = rngOf(opts.seed);
    const k = lv < 0 ? rng() : lv / 29;
    let target = Math.round(T.isl[0] + (T.isl[1] - T.isl[0]) * k);
    if (size > T.size) target = Math.round(target * (size * size) / (T.size * T.size));
    let attempts = 0, fallback = null;
    while (attempts++ < 400) {
      const cand = candidate(size, size, target, rng, T.dbl, T.extra, T.maxLen);
      if (!cand) continue;
      const P = build(size, size, cand.isl);
      const L = logicSolve(P, T.logic);
      if (L.ok && T.logic === 1 && lv >= 6 && L.trials === 0 && attempts < 40) continue;
      if (!L.ok) {
        if (!fallback && attempts > 120) {
          const out = {};
          if (countSolutions(P, 2, out) === 1) fallback = { cand, sol: out.sol, attempts };
        }
        if (fallback && attempts > 200) break;
        continue;
      }
      // 簡單的題目不要太無聊：入門以外，不要全部第一輪就推完
      const out = {};
      const n = countSolutions(P, 2, out);
      if (n !== 1) continue;
      return { w: size, h: size, isl: cand.isl, sol: Array.from(L.lo), attempts, trials: L.trials, unique: true };
    }
    if (fallback) return { w: size, h: size, isl: fallback.cand.isl, sol: fallback.sol, attempts, trials: -1, unique: true };
    return null;
  }

  /** 提示：從目前玩家狀態（cnt）推一座一定要有的橋。sol 為唯一解 */
  function hint(P, cnt, sol) {
    for (let e = 0; e < cnt.length; e++) if (cnt[e] > sol[e]) return { type: 'wrong', e, want: sol[e] };
    const lo = Int8Array.from(cnt), hi = Int8Array.from(P.cap);
    for (let e = 0; e < cnt.length; e++) if (hi[e] < lo[e]) hi[e] = lo[e];
    let found = null;
    const log = (e, kind, i, v, maxOther) => {
      if (found || v <= cnt[e]) return;
      found = { type: kind, e, island: i, want: v, maxOther: maxOther || 0, n: i >= 0 ? P.isl[i].n : 0 };
    };
    const ok = propagate(P, lo, hi, log);
    if (found && ok && found.want <= sol[found.e]) return found;
    for (let e = 0; e < lo.length; e++) if (cnt[e] < sol[e]) return { type: 'trial', e, want: cnt[e] + 1 };
    return null;
  }

  return { rngOf, build, propagate, logicSolve, countSolutions, generate, hint, TIERS, tierSize, connectedLo };
}

const Lib = PuzzleLib();

/* =====================================================================
 * 小島搭橋
 * ===================================================================== */
const SLUG = 'island-bridges';
const cv = document.getElementById('game');
const ctx = cv.getContext('2d');
const FONT = '"Baloo 2","PingFang TC","Noto Sans TC","Microsoft JhengHei","Heiti TC",system-ui,sans-serif';
let W = 400, H = 700, dpr = 1, U = 1, time = 0;
const TAU = Math.PI * 2;
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const Ease = {
  outCubic: t => 1 - Math.pow(1 - t, 3),
  inCubic: t => t * t * t,
  inOutSine: t => -(Math.cos(Math.PI * t) - 1) / 2,
  outBack: t => { const c = 1.70158, c3 = c + 1; return 1 + c3 * Math.pow(t - 1, 3) + c * Math.pow(t - 1, 2); },
  outElastic: t => (t === 0 || t === 1) ? t : Math.pow(2, -10 * t) * Math.sin((t * 10 - 0.75) * (TAU / 3)) + 1
};

/* ---------- 補間 ---------- */
let tweens = [];
function tween(obj, to, dur, ease, delay, done) {
  const tw = { obj, to, from: null, dur: dur || 0.3, ease: Ease[ease] || Ease.outCubic, t: -(delay || 0), done };
  tweens.push(tw); return tw;
}
function updateTweens(dt) {
  for (let i = 0; i < tweens.length; i++) {
    const tw = tweens[i];
    tw.t += dt;
    if (tw.t < 0) continue;
    if (!tw.from) { tw.from = {}; for (const k in tw.to) tw.from[k] = tw.obj[k]; }
    const p = Math.min(1, tw.t / tw.dur), e = tw.ease(p);
    for (const k in tw.to) tw.obj[k] = tw.from[k] + (tw.to[k] - tw.from[k]) * e;
    if (p >= 1) { tweens.splice(i, 1); i--; if (tw.done) tw.done(); }
  }
}
let shakeT = 0, shakeAmt = 0;
function shake(a, d) { shakeAmt = Math.max(shakeT > 0 ? shakeAmt : 0, a); shakeT = Math.max(shakeT, d || 0.25); }

/* ---------- 繪圖小工具 ---------- */
function circ(x, y, r) { ctx.moveTo(x + r, y); ctx.arc(x, y, r, 0, TAU); }
function rr(x, y, w, h, r, g) {
  g = g || ctx; r = Math.max(0, Math.min(r, w / 2, h / 2));
  g.beginPath(); g.moveTo(x + r, y);
  g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r);
  g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath();
}
function starPath(x, y, R, r, rot) {
  ctx.beginPath();
  for (let i = 0; i < 10; i++) { const a = (rot || 0) + i * Math.PI / 5 - Math.PI / 2, d = i % 2 ? r : R; ctx.lineTo(x + Math.cos(a) * d, y + Math.sin(a) * d); }
  ctx.closePath();
}
function shade(hex, amt) {
  const n = parseInt(hex.slice(1), 16), f = v => clamp(v + amt, 0, 255);
  return 'rgb(' + f(n >> 16) + ',' + f((n >> 8) & 255) + ',' + f(n & 255) + ')';
}
function txt(s, x, y, size, fill, o) {
  o = o || {};
  ctx.font = (o.weight || '900') + ' ' + size + 'px ' + FONT;
  ctx.textAlign = o.align || 'center'; ctx.textBaseline = 'middle'; ctx.lineJoin = 'round';
  if (o.shadow !== false && o.stroke) {
    ctx.strokeStyle = 'rgba(20,50,70,0.3)'; ctx.lineWidth = o.sw || size * 0.22; ctx.strokeText(s, x, y + size * 0.08);
  }
  if (o.stroke) { ctx.strokeStyle = o.stroke; ctx.lineWidth = o.sw || size * 0.22; ctx.strokeText(s, x, y); }
  ctx.fillStyle = fill; ctx.fillText(s, x, y);
}
function fitSize(s, size, maxW, weight) {
  ctx.font = (weight || '900') + ' ' + size + 'px ' + FONT;
  const w = ctx.measureText(s).width;
  return w > maxW ? size * maxW / w : size;
}
function wrapText(s, size, maxW) {
  ctx.font = '800 ' + size + 'px ' + FONT;
  const lines = []; let cur = '';
  for (const ch of s) {
    if (ch === '\n') { lines.push(cur); cur = ''; continue; }
    if (ctx.measureText(cur + ch).width > maxW && cur) {
      // 不要讓標點符號跑到行首
      if ('，。！？、」）；：'.includes(ch)) { lines.push(cur.slice(0, -1)); cur = cur.slice(-1) + ch; }
      else { lines.push(cur); cur = ch; }
    } else cur += ch;
  }
  if (cur) lines.push(cur);

  },

/* =====================================================================
 * 美術：海、島、橋（預先畫好的小圖）
 * ===================================================================== */
function mkCanvas(w, h) { const c = document.createElement('canvas'); c.width = Math.max(1, Math.ceil(w)); c.height = Math.max(1, Math.ceil(h)); return c; }
let seaGrad = null, wavePat = null, wavePat2 = null;
function buildSea() {
  seaGrad = ctx.createLinearGradient(0, 0, W * 0.3, H);
  seaGrad.addColorStop(0, '#5fe0de'); seaGrad.addColorStop(0.5, '#2bb5c9'); seaGrad.addColorStop(1, '#1689b4');
  const T = 220, k = dpr;
  const mk = (seed, alpha, lw) => {
    const c = mkCanvas(T * k, T * k), g = c.getContext('2d');
    g.scale(k, k);
    const rnd = Lib.rngOf(seed);
    g.strokeStyle = 'rgba(255,255,255,' + alpha + ')'; g.lineWidth = lw; g.lineCap = 'round';
    for (let i = 0; i < 16; i++) {
      const x = rnd() * T, y = rnd() * T, w = 14 + rnd() * 18;
      for (const ox of [-T, 0, T]) for (const oy of [-T, 0, T]) {
        g.beginPath(); g.moveTo(x + ox - w / 2, y + oy);
        g.quadraticCurveTo(x + ox - w / 4, y + oy - 5, x + ox, y + oy);
        g.quadraticCurveTo(x + ox + w / 4, y + oy + 5, x + ox + w / 2, y + oy); g.stroke();
      }
    }
    const p = ctx.createPattern(c, 'repeat');
    if (p && p.setTransform && window.DOMMatrix) p.setTransform(new DOMMatrix().scale(1 / k));
    return p;
  };
  wavePat = mk(11, 0.32, 2.2);
  wavePat2 = mk(29, 0.16, 1.6);
}
function drawSea(dim) {
  ctx.fillStyle = seaGrad; ctx.fillRect(0, 0, W, H);
  const T = 220;
  for (let L = 0; L < (KG.lowEnd ? 1 : 2); L++) {
    const pat = L ? wavePat2 : wavePat;
    if (!pat) continue;
    const ox = ((time * (L ? -9 : 13)) % T + T) % T, oy = ((time * (L ? 4 : 6)) % T + T) % T;
    ctx.save(); ctx.translate(ox - T, oy - T + Math.sin(time * 0.9 + L) * 3);
    ctx.fillStyle = pat; ctx.fillRect(0, 0, W + T * 2, H + T * 2);
    ctx.restore();
  }
  if (dim) { ctx.fillStyle = 'rgba(8,60,90,' + dim + ')'; ctx.fillRect(0, 0, W, H); }
}

/* 島嶼小圖：依格子大小快取 */
const spriteCache = new Map();
function islandSprites(S) {
  const key = Math.round(S * dpr * 2);

  if (sp) return sp;
  if (spriteCache.size > 3) spriteCache.clear();
  const size = S * 1.6, px = size * dpr;
  sp = { size, lit: [], dark: [], foam: null, glow: null };
  for (let v = 0; v < 4; v++) for (const lit of [false, true]) {
    const c = mkCanvas(px, px), g = c.getContext('2d');
    g.scale(dpr, dpr);
    drawIslandArt(g, size / 2, size / 2, S, v, lit);
    (lit ? sp.lit : sp.dark)[v] = c;
  }
  const fc = mkCanvas(px, px), fg = fc.getContext('2d');
  fg.scale(dpr, dpr);
  const R = S * 0.46, cx = size / 2;
  const grd = fg.createRadialGradient(cx, cx, R * 0.85, cx, cx, R * 1.32);
  grd.addColorStop(0, 'rgba(255,255,255,0)'); grd.addColorStop(0.25, 'rgba(255,255,255,0.85)'); grd.addColorStop(0.55, 'rgba(190,250,245,0.35)'); grd.addColorStop(1, 'rgba(190,250,245,0)');
  fg.fillStyle = grd; fg.beginPath(); fg.arc(cx, cx, R * 1.35, 0, TAU); fg.fill();
  sp.foam = fc;
  const gc = mkCanvas(px, px), gg = gc.getContext('2d');
  gg.scale(dpr, dpr);
  const g2 = gg.createRadialGradient(cx, cx, 0, cx, cx, size / 2);
  g2.addColorStop(0, 'rgba(255,240,150,0.85)'); g2.addColorStop(0.45, 'rgba(255,220,90,0.35)'); g2.addColorStop(1, 'rgba(255,220,90,0)');
  gg.fillStyle = g2; gg.fillRect(0, 0, size, size);

}
function drawIslandArt(g, cx, cy, S, v, lit) {
  const R = S * 0.42, side = v & 1 ? 1 : -1;
  // 淺灘
  g.fillStyle = 'rgba(150,245,230,0.6)';
  g.beginPath(); g.ellipse(cx, cy + R * 0.1, R * 1.16, R * 1.1, 0, 0, TAU); g.fill();
  // 沙灘（有點不規則）
  g.beginPath();
  for (let k = 0; k <= 24; k++) {
    const a = k / 24 * TAU, rad = R * (1 + 0.045 * Math.sin(a * 3 + v * 1.7) + 0.03 * Math.cos(a * 5 + v));
    const x = cx + Math.cos(a) * rad, y = cy + Math.sin(a) * rad * 0.96;
    if (k) g.lineTo(x, y); else g.moveTo(x, y);
  }
  g.closePath();
  const sg = g.createRadialGradient(cx - R * 0.35, cy - R * 0.4, R * 0.1, cx, cy, R * 1.1);
  sg.addColorStop(0, '#fff6d6'); sg.addColorStop(0.6, '#f9dc96'); sg.addColorStop(1, '#e9b866');
  g.fillStyle = sg; g.fill();
  g.strokeStyle = '#d29a48'; g.lineWidth = Math.max(1, S * 0.03); g.stroke();
  // 濕沙
  g.fillStyle = 'rgba(190,130,60,0.18)';
  g.beginPath(); g.ellipse(cx, cy + R * 0.55, R * 0.8, R * 0.32, 0, 0, Math.PI); g.fill();
  // 草地
  g.fillStyle = '#86d65f';
  g.beginPath(); g.ellipse(cx - side * R * 0.15, cy - R * 0.42, R * 0.62, R * 0.36, side * 0.2, 0, TAU); g.fill();
  g.fillStyle = '#6cc04a';
  g.beginPath(); g.ellipse(cx - side * R * 0.18, cy - R * 0.36, R * 0.5, R * 0.22, side * 0.2, 0, Math.PI); g.fill();
  if (S >= 22) {
    // 小房子（左上或右上）
    const hx = cx - side * R * 0.62, hy = cy - R * 0.5, hw = R * (S < 32 ? 0.6 : 0.5), hh = hw * 0.7;
    g.fillStyle = 'rgba(80,50,20,0.25)'; g.fillRect(hx - hw / 2 + 2, hy + hh * 0.15, hw, hh);
    if (lit) {
      const lg = g.createRadialGradient(hx, hy, 0, hx, hy, hw * 1.3);
      lg.addColorStop(0, 'rgba(255,230,120,0.55)'); lg.addColorStop(1, 'rgba(255,230,120,0)');
      g.fillStyle = lg; g.beginPath(); g.arc(hx, hy, hw * 1.3, 0, TAU); g.fill();
    }
    g.fillStyle = '#f1c38c'; g.strokeStyle = '#8a5428'; g.lineWidth = Math.max(1, S * 0.025);
    g.fillRect(hx - hw / 2, hy - hh * 0.2, hw, hh); g.strokeRect(hx - hw / 2, hy - hh * 0.2, hw, hh);
    // 茅草屋頂
    g.fillStyle = v & 2 ? '#d9893f' : '#e0703f';
    g.beginPath(); g.moveTo(hx - hw * 0.72, hy - hh * 0.15); g.lineTo(hx, hy - hh * 1.05); g.lineTo(hx + hw * 0.72, hy - hh * 0.15); g.closePath(); g.fill(); g.stroke();
    g.strokeStyle = 'rgba(120,60,20,0.45)'; g.lineWidth = Math.max(0.6, S * 0.012);
    g.beginPath(); g.moveTo(hx - hw * 0.35, hy - hh * 0.3); g.lineTo(hx, hy - hh * 0.85); g.moveTo(hx + hw * 0.35, hy - hh * 0.3); g.lineTo(hx, hy - hh * 0.85); g.stroke();
    // 窗戶

    g.fillRect(wx - ws / 2, wy - ws / 2, ws, ws);
    if (lit) { g.fillStyle = 'rgba(255,255,255,0.8)'; g.fillRect(wx - ws / 2, wy - ws / 2, ws * 0.4, ws * 0.4); }
    g.fillStyle = '#9a5e2e'; g.fillRect(hx + side * hw * 0.2 - hw * 0.1, hy + hh * 0.05, hw * 0.2, hh * 0.55);
  }
  if (S >= 30) {
    // 椰子樹（另一邊）
    const bx = cx + side * R * 0.55, by = cy - R * 0.2, tx = cx + side * R * 0.78, ty = cy - R * 1.12;
    g.fillStyle = 'rgba(60,90,40,0.25)'; g.beginPath(); g.ellipse(bx + R * 0.1, by + R * 0.05, R * 0.22, R * 0.08, 0, 0, TAU); g.fill();
    g.strokeStyle = '#8b5a2b'; g.lineWidth = S * 0.065; g.lineCap = 'round';
    g.beginPath(); g.moveTo(bx, by); g.quadraticCurveTo(bx - side * R * 0.2, (by + ty) / 2, tx, ty); g.stroke();
    g.strokeStyle = 'rgba(255,220,170,0.5)'; g.lineWidth = S * 0.02;
    for (let k = 1; k < 4; k++) { const t = k / 4, x = lerp(bx, tx, t) - side * R * 0.08 * Math.sin(t * Math.PI), y = lerp(by, ty, t); g.beginPath(); g.moveTo(x - S * 0.03, y); g.lineTo(x + S * 0.03, y + S * 0.01); g.stroke(); }
    const leaves = [-2.75, -2.1, -1.45, -0.85, -0.2, 0.35];
    for (let k = 0; k < leaves.length; k++) {
      const a = side > 0 ? leaves[k] : -Math.PI - leaves[k], L = R * (0.62 + (k % 2) * 0.12);

      g.quadraticCurveTo(mx - Math.sin(a) * R * 0.14, my + Math.cos(a) * R * 0.14, ex, ey);
      g.quadraticCurveTo(mx + Math.sin(a) * R * 0.04, my - Math.cos(a) * R * 0.04, tx, ty); g.fill();
    }
    g.fillStyle = '#6b3f1d';
    g.beginPath(); g.arc(tx - R * 0.05, ty + R * 0.08, R * 0.07, 0, TAU); g.arc(tx + R * 0.07, ty + R * 0.1, R * 0.065, 0, TAU); g.fill();

/* =====================================================================
 * 棋盤畫面（題目、橋、島、動畫）
 * ===================================================================== */
class BoardView {
  constructor() { this.layer = mkCanvas(2, 2); this.lg = this.layer.getContext('2d'); this.P = null; this.dirty = true; this.anim = new Map(); this.S = 30; this.bx = 0; this.by = 0; }
  set(P, cnt, sol) {
    this.P = P; this.cnt = cnt; this.sol = sol;
    this.sum = new Int16Array(P.isl.length);
    this.state = new Int8Array(P.isl.length); // 0 普通、1 滿足、2 超過
    const rnd = Lib.rngOf(P.isl.length * 97 + P.w * 13 + (P.isl[0] ? P.isl[0].r * 7 + P.isl[0].c : 0));
    this.variant = P.isl.map(() => Math.floor(rnd() * 4));
    this.pop = new Float32Array(P.isl.length);
    this.anim.clear(); this.recount(); this.dirty = true;
  }
  recount() {
    const P = this.P;
    this.sum.fill(0);
    for (let e = 0; e < P.edges.length; e++) if (this.cnt[e]) { this.sum[P.edges[e].a] += this.cnt[e]; this.sum[P.edges[e].b] += this.cnt[e]; }
    for (let i = 0; i < P.isl.length; i++) this.state[i] = this.sum[i] === P.isl[i].n ? 1 : this.sum[i] > P.isl[i].n ? 2 : 0;
  }
  layout(x, y, w, h, maxCell) {
    const P = this.P;
    const S = Math.min(w / P.w, h / P.h, maxCell || 999);
    const changed = Math.abs(S - this.S) > 0.01;
    this.S = S; this.bx = x + (w - S * P.w) / 2; this.by = y + (h - S * P.h) / 2;
    const m = S * 0.6, lw = S * P.w + m * 2, lh = S * P.h + m * 2;
    if (changed || this.layer.width !== Math.ceil(lw * dpr) || this.layer.height !== Math.ceil(lh * dpr)) {
      this.layer.width = Math.ceil(lw * dpr); this.layer.height = Math.ceil(lh * dpr);
      this.dirty = true;
    }
    this.m = m; this.lw = lw; this.lh = lh;
  }
  cx(i) { return this.bx + (this.P.isl[i].c + 0.5) * this.S; }
  cy(i) { return this.by + (this.P.isl[i].r + 0.5) * this.S; }
  badgeR() { return this.S * (this.S < 34 ? 0.36 : this.S < 50 ? 0.3 : 0.27); }
  /** 畫一條橋道（木板一片一片） */
  lane(g, x1, y1, x2, y2, off, width, prog, alpha, drop) {
    const S = this.S, dx = x2 - x1, dy = y2 - y1, len = Math.hypot(dx, dy);
    if (len < 1) return;
    const ux = dx / len, uy = dy / len, px = -uy, py = ux, rI = S * 0.36;
    const sx = x1 + ux * rI + px * off, sy = y1 + uy * rI + py * off + (drop || 0);
    const L = len - rI * 2;

    const shown = prog * nP, hw = width / 2;
    g.globalAlpha = alpha;
    // 繩子
    const re = Math.min(L, L * prog + sp * 0.4);
    g.strokeStyle = '#6b4423'; g.lineWidth = Math.max(1, S * 0.03);
    g.beginPath();
    g.moveTo(sx + px * hw * 0.92, sy + py * hw * 0.92); g.lineTo(sx + ux * re + px * hw * 0.92, sy + uy * re + py * hw * 0.92);
    g.moveTo(sx - px * hw * 0.92, sy - py * hw * 0.92); g.lineTo(sx + ux * re - px * hw * 0.92, sy + uy * re - py * hw * 0.92);
    g.stroke();

  drawEdge(g, e, c, ox, oy) {
    const E = this.P.edges[e];
    const x1 = this.cx(E.a) + ox, y1 = this.cy(E.a) + oy, x2 = this.cx(E.b) + ox, y2 = this.cy(E.b) + oy;
    const offs = this.laneOffsets(c), w = this.laneWidth(c);

  }
  render() {
    const P = this.P, g = this.lg, S = this.S;
    g.setTransform(1, 0, 0, 1, 0, 0);
    g.clearRect(0, 0, this.layer.width, this.layer.height);
    g.setTransform(dpr, 0, 0, dpr, 0, 0);
    const ox = this.m - this.bx, oy = this.m - this.by;
    // 格點
    g.fillStyle = 'rgba(255,255,255,0.22)';
    for (let r = 0; r < P.h; r++) for (let c = 0; c < P.w; c++) { g.beginPath(); g.arc(this.bx + (c + 0.5) * S + ox, this.by + (r + 0.5) * S + oy, Math.max(1.2, S * 0.045), 0, TAU); g.fill(); }
    for (let e = 0; e < P.edges.length; e++) if (this.cnt[e] && !this.anim.has(e)) this.drawEdge(g, e, this.cnt[e], ox, oy);
    const sp = islandSprites(S), br = this.badgeR();
    for (let i = 0; i < P.isl.length; i++) {
      const x = this.cx(i) + ox, y = this.cy(i) + oy, st = this.state[i];
      if (st === 1) g.drawImage(sp.glow, x - sp.size / 2, y - sp.size / 2, sp.size, sp.size);
      g.drawImage((st === 1 ? sp.lit : sp.dark)[this.variant[i]], x - sp.size / 2, y - sp.size / 2, sp.size, sp.size);
      this.badge(g, x, y + S * 0.06, br, P.isl[i].n, st);
    }
    this.dirty = false;
  }
  badge(g, x, y, r, n, st) {
    const S = this.S;
    g.fillStyle = 'rgba(90,60,20,0.3)'; g.beginPath(); g.arc(x, y + r * 0.14, r, 0, TAU); g.fill();
    g.beginPath(); g.arc(x, y, r, 0, TAU);
    g.fillStyle = st === 1 ? '#5fcf72' : st === 2 ? '#ff6b6b' : '#fffaf0'; g.fill();
    g.strokeStyle = st === 1 ? '#22803a' : st === 2 ? '#b8282e' : '#9b6a3a'; g.lineWidth = Math.max(1.5, S * 0.045); g.stroke();
    g.fillStyle = 'rgba(255,255,255,0.45)'; g.beginPath(); g.ellipse(x - r * 0.3, y - r * 0.45, r * 0.38, r * 0.2, -0.5, 0, TAU); g.fill();

  constructor() { this.list = []; }

  update(dt, view, cnt) {

      ctx.fillStyle = '#3a2a1a'; ctx.beginPath(); circ(x - s * 0.2, y - s * 0.72 - bob, s * 0.08); circ(x + s * 0.2, y - s * 0.72 - bob, s * 0.08); ctx.fill();

function boardDown(x, y, pid) {
  const S = view.S;
  let i = view.islandAt(x, y, 0.45);
  let e = -1;
  if (i < 0) e = view.edgeAt(x, y, 0.32);
  if (i < 0 && e < 0) i = view.islandAt(x, y, 0.8);
  if (i >= 0) { G.drag = { i, x0: x, y0: y, x, y, pid, edge: -1, moved: false }; return; }
  if (e >= 0) { G.drag = { bridge: e, x0: x, y0: y, pid, moved: false }; return; }
  G.drag = { none: true, x0: x, y0: y, pid };
  if (G.sel >= 0) { G.sel = -1; }
  void S;
}
/** 從島 i 往 (dx,dy) 方向找最合適的鄰居（容錯） */
function edgeToward(i, dx, dy) {
  const nb = G.P.nb[i], d = Math.hypot(dx, dy) || 1;
  const DX = [0, 1, 0, -1], DY = [-1, 0, 1, 0];
  let best = -1, bc = Math.cos(Math.PI / 3);
  for (let k = 0; k < 4; k++) {
    if (nb[k] < 0) continue;
    const c = (dx * DX[k] + dy * DY[k]) / d;
    if (c > bc) { bc = c; best = nb[k]; }
  }
  return best;
}
function boardMove(x, y) {
  const D = G.drag; if (!D || D.none) return;
  D.x = x; D.y = y;
  const dx = x - D.x0, dy = y - D.y0, dist = Math.hypot(dx, dy);
  if (dist > view.S * 0.28) D.moved = true;
  if (D.bridge != null) return;
  if (!D.moved) { D.edge = -1; return; }
  // 指到另一個島：直接吸附
  const j = view.islandAt(x, y, 0.6);
  let e = -1;
  if (j >= 0 && j !== D.i) e = G.P.islEdges[D.i].find(f => G.P.edges[f].a === j || G.P.edges[f].b === j);
  if (e == null || e < 0) e = edgeToward(D.i, dx, dy);
  if (e !== D.edge && e >= 0) sfx('pick', { pitch: 1 + G.cnt[e] * 0.12, vol: 0.6 });
  D.edge = e == null ? -1 : e;
}
function boardUp(x, y, cancel) {
  const D = G.drag; G.drag = null;
  if (!D || cancel || D.none) return;
  if (D.bridge != null) {
    if (!D.moved) { const e = D.bridge, E = G.P.edges[e]; cycleEdge(e, E.a); G.sel = -1; }
    return;
  }
  if (D.moved) {
    if (D.edge >= 0) { cycleEdge(D.edge, D.i); G.sel = -1; }
    return;
  }
  // 點一下：先選島，再點鄰居島就搭橋
  const i = D.i;
  if (G.sel >= 0 && G.sel !== i) {
    const e = G.P.islEdges[G.sel].find(f => G.P.edges[f].a === i || G.P.edges[f].b === i);
    if (e != null) { cycleEdge(e, G.sel); G.sel = -1; return; }
  }
  if (G.sel === i) { G.sel = -1; sfx('back', { vol: 0.5 }); return; }
  G.sel = i; G.cursor = i;
  sfx('pick', { pitch: SCALE[clamp(G.P.isl[i].n - 1, 0, 7)] / 600, pan: panX(view.cx(i)) });
}

const KEYDIR = { ArrowUp: 0, KeyW: 0, ArrowRight: 1, KeyD: 1, ArrowDown: 2, KeyS: 2, ArrowLeft: 3, KeyA: 3 };
let spaceArm = false;
window.addEventListener('keydown', (e) => {
  const code = e.code;
  if (code === 'Escape' || code === 'KeyP') {
    if (scene === 'play' && !G.solved) { if (overlay === 'pause') resumeGame(); else if (!overlay) pauseGame(); e.preventDefault(); return; }
    if (overlay === 'help') { overlay = null; return; }
    if (scene === 'levels' || scene === 'endless') { goTitle(); return; }
  }
  const inBoard = scene === 'play' && !overlay && !G.solved;
  if (inBoard) {
    const d = KEYDIR[code];
    if (d != null) {
      e.preventDefault(); kbdNav = true;
      if (G.cursor < 0) { G.cursor = G.sel >= 0 ? G.sel : 0; return; }
      if (e.shiftKey || spaceArm) {
        spaceArm = false;
        const ed = G.P.nb[G.cursor][d];
        if (ed >= 0) cycleEdge(ed, G.cursor); else sfx('error');
        return;
      }
      // 移到那個方向最近的島
      const P = G.P, s = P.isl[G.cursor], DR = [-1, 0, 1, 0], DC = [0, 1, 0, -1];
      let best = -1, bd = 1e9;
      for (let i = 0; i < P.isl.length; i++) {
        if (i === G.cursor) continue;
        const dr = P.isl[i].r - s.r, dc = P.isl[i].c - s.c, along = dr * DR[d] + dc * DC[d];
        if (along <= 0) continue;
        const side = Math.abs(dr * DC[d]) + Math.abs(dc * DR[d]), sc = along + side * 2;
        if (sc < bd) { bd = sc; best = i; }
      }
      if (best >= 0) { G.cursor = best; G.sel = best; sfx('tick'); }
      return;
    }
    if (code === 'Space' || code === 'Enter') { e.preventDefault(); if (G.cursor < 0) G.cursor = 0; spaceArm = !spaceArm; G.sel = G.cursor; sfx(spaceArm ? 'select' : 'back', { vol: 0.6 }); return; }
    if (code === 'KeyZ' || code === 'Backspace') { e.preventDefault(); doUndo(); return; }
    if (code === 'KeyR') { doRestart(); return; }
    if (code === 'KeyH') { doHint(); return; }
    return;
  }
  if (scene === 'play' && G.solved && !overlay && (code === 'Enter' || code === 'Space')) { G.solvedT = 99; return; }
  // 選單：方向鍵移動焦點、Enter 確定
  const d = KEYDIR[code];
  if (d != null && code.startsWith('Arrow')) { e.preventDefault(); moveFocus([0, 1, 0, -1][d], [-1, 0, 1, 0][d]); return; }
  if (code === 'Enter' || code === 'Space') {
    e.preventDefault();
    if (!activateFocus()) { kbdNav = true; const b = btnPrev.find(b => !b.disabled); if (b) focusId = b.id; }
  }
});

function logo(s, cx, cy, size) {
  const colors = ['#ffd23d', '#7ee07a', '#5ec8ff', '#ff8fb1'];
  ctx.font = '900 ' + size + 'px ' + FONT; ctx.textBaseline = 'middle'; ctx.textAlign = 'center'; ctx.lineJoin = 'round';
  const chars = [...s], ws = chars.map(c => ctx.measureText(c).width * 1.04), tot = ws.reduce((a, b) => a + b, 0);
  let x = cx - tot / 2;
  chars.forEach((c, i) => {
    const w = ws[i], bob = Math.sin(time * 2.4 + i * 0.8) * size * 0.05, rot = Math.sin(time * 1.8 + i) * 0.05;
    ctx.save(); ctx.translate(x + w / 2, cy + bob); ctx.rotate(rot);
    ctx.strokeStyle = 'rgba(10,50,70,0.35)'; ctx.lineWidth = size * 0.34; ctx.strokeText(c, 0, size * 0.09);
    ctx.strokeStyle = '#7a4a22'; ctx.lineWidth = size * 0.32; ctx.strokeText(c, 0, 0);
    ctx.strokeStyle = '#fff6dc'; ctx.lineWidth = size * 0.15; ctx.strokeText(c, 0, 0);
    const g = ctx.createLinearGradient(0, -size / 2, 0, size / 2), col = colors[i % 4];
    g.addColorStop(0, shade(col, 60)); g.addColorStop(0.55, col); g.addColorStop(1, shade(col, -40));
    ctx.fillStyle = g; ctx.fillText(c, 0, 0);
    ctx.restore(); x += w;
  });
}

  // 星星
  while (o.shown < 3 && o.t > 0.5 + o.shown * 0.35) {
    if (o.shown < o.stars) { sfx('starTone', { pitch: [1, 1.26, 1.5][o.shown] }); FX.burst(W / 2 + (o.shown - 1) * w * 0.24, b.y + 72 * U, { n: 12, colors: ['#ffe066', '#fff', '#ffb02e'], speed: 220, g: 260, size: 6 * U }); }
    o.shown++;
  }
  const sy = b.y + 34 * U + 38 * U;
  for (let i = 0; i < 3; i++) {
    const on = i < o.shown && i < o.stars, tt = o.t - (0.5 + i * 0.35);
    const k = on ? (tt < 0.4 ? Ease.outElastic(clamp(tt / 0.4, 0, 1)) : 1 + Math.sin(time * 3 + i) * 0.03) : 1;
    glossyStar(W / 2 + (i - 1) * w * 0.24, sy - (i === 1 ? 10 * U : 0), (i === 1 ? 38 : 31) * U * k, on, on ? Math.sin(time * 2 + i) * 0.08 : 0);
  }
  let ty = sy + 54 * U;
  const fs = Math.min(18 * U, w / 17);
  o.lines.forEach(l => { txt(l, W / 2, ty, fitSize(l, fs, w - 30, '800'), '#35505a', { weight: '800', shadow: false }); ty += fs * 1.55; });
  if (o.unlock) { const p = 1 + Math.sin(time * 5) * 0.04; ctx.save(); ctx.translate(W / 2, ty + 2); ctx.scale(p, p); txt(o.unlock, 0, 0, fs, '#f45f93', { stroke: '#fff', sw: 5 * U, shadow: false }); ctx.restore(); }
  const bh = Math.min(56 * U, h * 0.15), by = b.y + h - bh - 22 * U, ready = o.t > 0.45;
  const btns = [];
  btns.push({ id: 'rMenu', icon: 'menu', color: 'blue', cb: () => (G.mode === 'level' ? goLevels() : G.mode === 'endless' ? goEndless() : goTitle()) });
  if (G.mode !== 'endless') btns.push({ id: 'rRetry', icon: 'replay', color: 'yellow', cb: () => { Save.set('cur', null); startPuzzle(G.mode, G.tier, G.level, G.seed); } });
  if (G.mode !== 'daily') btns.push({ id: 'rnext', icon: 'next', label: G.mode === 'endless' ? '下一題' : '下一關', color: 'green', cb: nextPuzzle, wide: true });
  const unit = bh * 1.25, wide = Math.min(150 * U, w * 0.38), gap = 12 * U;
  const tot = btns.reduce((s, x) => s + (x.wide ? wide : unit), 0) + gap * (btns.length - 1);
  let bx = W / 2 - tot / 2;
  for (const x of btns) {
    const bw = x.wide ? wide : unit;
    button(x.id, bx, by, bw, bh, { icon: x.icon, label: x.label, color: x.color, pulse: x.wide, disabled: !ready, size: bh * 0.4, onClick: () => { sfx('select'); x.cb(); } });
    bx += bw + gap;
  }
  ctx.restore();
}
function drawLoading() {
  drawSea(0.1);
  const s = 28 * U;
  for (let k = 0; k < 3; k++) { const a = time * 4 - k * 0.6; ctx.fillStyle = '#fff'; ctx.globalAlpha = 0.5 + 0.5 * Math.sin(a); ctx.beginPath(); circ(W / 2 + (k - 1) * s, H / 2 + 30 * U, 7 * U); ctx.fill(); }
  ctx.globalAlpha = 1;
  txt('小島浮出水面中…', W / 2, H / 2 - 10 * U, 22 * U, '#fff', { stroke: '#1d6a80', sw: 6 * U });
}

/* =====================================================================
 * 主迴圈
 * ===================================================================== */
let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, Math.max(0, (now - last) / 1000));
  last = now; time += dt; sceneT += dt;
  if (shakeT > 0) shakeT -= dt;
  updateTweens(dt);
  updateSea(dt);
  Gulls.update(dt);
  FX.update(dt);
  btnPrev = btnReg; btnReg = [];
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  regOn = !overlay;
  if (scene === 'loading') {
    drawLoading();
    loadingT += dt;
    if (pendingStart && loadingT > 0.05) { const o = pendingStart; pendingStart = null; doStart(o); }
  } else if (scene === 'title') drawTitle(dt);
  else if (scene === 'levels') drawLevels();
  else if (scene === 'endless') drawEndless();
  else if (scene === 'play') {
    if (!overlay && !G.solved && !document.hidden) G.timer += dt;
    if (!overlay) {
      view.update(dt);
      if (G.blockFx && (G.blockFx.t -= dt) <= 0) G.blockFx = null;
      if (G.hintFx && (G.hintFx.t -= dt) <= 0) G.hintFx = null;
      if (G.msg && (G.msg.t -= dt) <= 0) G.msg = null;
      if (G.solved) {
        G.solvedT += dt;
        villagers.update(dt, view, G.cnt);
        if (G.solvedT > 2.6 && !overlay) showResult();
      }
    } else if (overlay === 'result') villagers.update(dt, view, G.cnt);
    drawPlay(dt);
  }
  regOn = true;
  if (overlay === 'pause') drawPause();
  else if (overlay === 'help') drawHelp();
  else if (overlay === 'result') drawResult(dt);
  requestAnimationFrame(frame);
}

/* ---------- 測試用 ---------- */
window.__ib = {
  state: () => ({ scene, overlay, mode: G.mode, tier: G.tier, level: G.level, solved: G.solved, hints: G.hints, timer: G.timer,
    islands: G.P ? G.P.isl.length : 0, edges: G.P ? G.P.edges.length : 0, cnt: G.cnt ? Array.from(G.cnt) : [], sol: G.sol ? Array.from(G.sol) : [],
    states: G.P ? Array.from(view.state) : [], music: KG.music ? KG.music.isPlaying() : null, S: view.S, msg: G.msg ? G.msg.text : null }),
  start: (mode, tier, level, seed) => { doStart({ mode: mode || 'level', tier: tier || 0, level: level || 0, seed: seed || 1 }); return window.__ib.state(); },
  islandXY: (i) => [view.cx(i), view.cy(i)],
  edge: (e) => G.P.edges[e],
  solveAllBut: (k) => { const P = G.P; let left = 0; for (let e = 0; e < P.edges.length; e++) if (G.sol[e]) left++; for (let e = 0; e < P.edges.length && left > (k || 0); e++) if (G.sol[e] && G.cnt[e] !== G.sol[e]) { setEdge(e, G.sol[e], { silentAnim: true, noUndo: false }); left--; } return window.__ib.state(); },
  hint: () => { doHint(); return G.msg && G.msg.text; },
  finishResult: () => { G.solvedT = 99; },
  buttons: () => btnPrev.map(b => ({ id: b.id, x: b.x + b.w / 2, y: b.y + b.h / 2, disabled: !!b.disabled })),
  view
};

resize();
musicMenu();
requestAnimationFrame((t) => { last = t; frame(t); });
</script>
