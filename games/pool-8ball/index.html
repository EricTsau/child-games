<style>

  #power .track { position: relative; width: 20px; height: 100%; margin: 0 auto; border-radius: 10px; background: rgba(255, 255, 255, .06); border: 1px solid rgba(255, 255, 255, .12); overflow: hidden; }

  body.land #title .logo { flex: 1; align-self: flex-start; margin-top: 40px; }
  body.land #title .tcard { width: min(400px, 52vw); }
  body.land.short .tips { display: none; }
  body.land.short .logo h1 { font-size: 44px; }

  .stat { display: grid; grid-template-columns: 1fr auto auto; gap: 4px 14px; margin: 4px auto 16px; font-size: 14px; max-width: 300px; text-align: left; }

  .res { font-size: 13px; letter-spacing: 4px; color: var(--mut); margin-bottom: 4px; }
  .pcard .row { margin-bottom: 4px; }
  .pcard .acts { flex-direction: column; margin-top: 12px; }
</style>

<script type="module">
import * as THREE from 'three';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

/*CORE-START*/
const Core = (() => {
  /* ---------- 球檯尺寸（公尺，2D 檯面座標：x 長邊、y 短邊）---------- */
  const R = 0.028575, L = 1.27, WD = 0.635, CW = 0.05, CC = 0.0845, SS = 0.066, RW = 0.115, RH = 0.047;
  const G = 9.81, MU_S = 0.2, MU_R = 0.012, MU_BB = 0.05, MU_C = 0.16, E_BB = 0.96, SPIN_DEC = 20;
  const TICK = 1 / 240, N = 16, FOOT_X = L / 2, HEAD_X = -L / 2, D2 = 4 * R * R;
  const CJ = 142 * Math.PI / 180, SJ = 104 * Math.PI / 180;
  const segs = [], cushions = [], pockets = [];
  function seg(ax, ay, bx, by) {
    const dx = bx - ax, dy = by - ay;
    return { ax, ay, bx, by, dx, dy, l2: dx * dx + dy * dy, minx: Math.min(ax, bx) - R, maxx: Math.max(ax, bx) + R, miny: Math.min(ay, by) - R, maxy: Math.max(ay, by) + R };
  }
  function addCushion(ax, ay, bx, by, ox, oy, aA, aB) {
    const ul = Math.hypot(bx - ax, by - ay), ex = (bx - ax) / ul, ey = (by - ay) / ul;
    const jAx = ex * Math.cos(aA) + ox * Math.sin(aA), jAy = ey * Math.cos(aA) + oy * Math.sin(aA);
    const jBx = -ex * Math.cos(aB) + ox * Math.sin(aB), jBy = -ey * Math.cos(aB) + oy * Math.sin(aB);
    const lA = CW / Math.sin(aA), lB = CW / Math.sin(aB);
    const A2 = [ax + jAx * lA, ay + jAy * lA], B2 = [bx + jBx * lB, by + jBy * lB];
    cushions.push({ pts: [[ax, ay], [bx, by], B2, A2], ox, oy });
    segs.push(seg(A2[0], A2[1], ax, ay), seg(ax, ay, bx, by), seg(bx, by, B2[0], B2[1]));
  }
  addCushion(SS, WD, L - CC, WD, 0, 1, SJ, CJ);
  addCushion(-(L - CC), WD, -SS, WD, 0, 1, CJ, SJ);
  addCushion(SS, -WD, L - CC, -WD, 0, -1, SJ, CJ);
  addCushion(-(L - CC), -WD, -SS, -WD, 0, -1, CJ, SJ);
  addCushion(L, -(WD - CC), L, WD - CC, 1, 0, CJ, CJ);
  addCushion(-L, -(WD - CC), -L, WD - CC, -1, 0, CJ, CJ);
  const CR = 0.05;
  for (const sx of [-1, 1]) for (const sy of [1, -1]) {
    const mx = sx * (L - CC / 2), my = sy * (WD - CC / 2), dx = sx * Math.SQRT1_2, dy = sy * Math.SQRT1_2;
    pockets.push({ corner: true, mx, my, dx, dy, cx: mx + dx * 0.085, cy: my + dy * 0.085, cr: 0.059, hx: mx + dx * 0.085, hy: my + dy * 0.085, hr: 0.062, ax: mx + dx * 0.035, ay: my + dy * 0.035 });
  }
  for (const sy of [1, -1]) {
    const my = sy * WD;
    pockets.push({ corner: false, mx: 0, my, dx: 0, dy: sy, cx: 0, cy: my + sy * 0.064, cr: 0.061, hx: 0, hy: my + sy * 0.064, hr: 0.064, ax: 0, ay: my + sy * 0.03 });
  }

  /* ---------- 世界狀態 ---------- */
  function makeWorld() {
    return { x: new Float64Array(N), y: new Float64Array(N), vx: new Float64Array(N), vy: new Float64Array(N), wx: new Float64Array(N), wy: new Float64Array(N), wz: new Float64Array(N), on: new Uint8Array(N), mv: new Uint8Array(N), t: 0 };
  }
  function copyWorld(d, s) {
    d.x.set(s.x); d.y.set(s.y); d.vx.set(s.vx); d.vy.set(s.vy); d.wx.set(s.wx); d.wy.set(s.wy); d.wz.set(s.wz); d.on.set(s.on); d.mv.set(s.mv); d.t = s.t;
    return d;
  }
  const cloneWorld = s => copyWorld(makeWorld(), s);
  function newEv() { return { first: -1, rail: false, pocketed: [], pockIdx: [], before: null, onBall: null, onRail: null, onPocket: null }; }
  function groupCounts(w) {
    let S = 0, T = 0;
    for (let i = 1; i < N; i++) if (w.on[i]) { if (i < 8) S++; else if (i > 8) T++; }
    return { S, T, e8: w.on[8] };
  }

  function capture(w, i, pi, ev) {
    w.on[i] = 0; w.mv[i] = 0;
    if (ev) { ev.pocketed.push(i); ev.pockIdx.push(pi); if (ev.onPocket) ev.onPocket(i, pi, w.vx[i], w.vy[i]); }

      if (W.on[i]) {
        const k = clamp(1 - (z - R) / 0.08, 0, 1);
        _p.set(x * 1.012, 0.0012, -y * 1.012);
        _s.setScalar(Math.max(0.0001, k * (1 + (z - R) * 3)));
        _q.identity();
        _m.compose(_p, _q, _s);
      } else { _m.makeScale(0.0001, 0.0001, 0.0001); }
      blobs.setMatrixAt(i, _m);
      _s.set(1, 1, 1);
    }
    balls.instanceMatrix.needsUpdate = true;
    blobs.instanceMatrix.needsUpdate = true;
    // 球桿
    const showCue = (phase === 'aim' && isHuman()) || (phase === 'ai' && ai && ai.stage !== 'think' && ai.stage !== 'place') || (cueAnim && cueAnim.t < 0.5);
    cue.visible = !!showCue && W.on[0] === 1;
    if (cue.visible) {
      let pull;
      if (cueAnim) { const t = cueAnim.t; pull = t < 0.06 ? lerp(cueAnim.pull, -0.012, t / 0.06) : -0.012 - Math.min(0.03, (t - 0.06) * 0.1); }
      else { pull = 0.03 + aim.power * 0.3 + (aim.power === 0 ? Math.sin(now / 1000 * 2.2) * 0.006 : 0); cuePull = pull; }
      const a = aim.angle, dx = Math.cos(a), dy = Math.sin(a);
      const ox = W.x[0] - dx * (R + 0.003 + pull), oy = W.y[0] - dy * (R + 0.003 + pull);
      const sxo = aim.sx * 0.5 * R, syo = aim.sy * 0.5 * R;
      // 右塞：桿頭打在母球右側（相對擊球方向）
      cue.position.set(ox + dy * sxo, R + syo + 0.004 + lift[0] * 0.03, -(oy - dx * sxo));
      cue.rotation.set(0, a, -0.075, 'YZX');
    }
    // 瞄準線
    const showGuide = phase === 'aim' && isHuman() && W.on[0] === 1 || (phase === 'ai' && ai && ai.stage === 'pull');
    const glen = guideLen();
    gAim.visible = gObj.visible = gCue.visible = gRef.visible = ghost.visible = false;
    RIM.visible = canPlace();
    if (RIM.visible) { RIM.position.set(W.x[0], 0.0014, -W.y[0]); RIM.material.opacity = 0.5 + Math.sin(now / 1000 * 5) * 0.3; }
    if (showGuide) {
      predict(aim.angle);
      const cx = W.x[0], cy = W.y[0];
      if (glen.mode === 'off') {
        setLine(gAim, cx, cy, cx + Math.cos(aim.angle) * 0.35, cy + Math.sin(aim.angle) * 0.35, 0.004);
      } else {
        setLine(gAim, cx, cy, pred.gx, pred.gy, 0.004);
        ghost.visible = true; ghost.position.set(pred.gx, R, -pred.gy);
        if (pred.hit >= 0) {
          const ol = glen.obj * (0.35 + 0.65 * pred.cut);
          setLine(gObj, pred.ox, pred.oy, pred.ox + pred.nx * ol, pred.oy + pred.ny * ol, 0.0055);
          const cl = glen.cue * Math.sqrt(Math.max(0, 1 - pred.cut * pred.cut));
          if (cl > 0.01) setLine(gCue, pred.gx, pred.gy, pred.gx + pred.tx * cl, pred.gy + pred.ty * cl, 0.0035);
          gObj.material.color.set(legalHit(pred.hit) ? 0xf3d58a : 0xff6a5a);
        } else {
          setLine(gRef, pred.gx, pred.gy, pred.gx + pred.rx * glen.cue, pred.gy + pred.ry * glen.cue, 0.003);
        }
      }
    }
  }
  function legalHit(i) {
    if (!game || isPractice()) return true;
    if (game.breakShot) return true;
    const t = Core.legalTargets(game, W, game.turn);
    return t.indexOf(i) >= 0;
  }
  function guideLen() {
    let g = opts.guide;
    if (game && game.mode === 'cpu' && game.diff === 'hard' && g === 'long') g = 'short';
    if (g === 'off') return { mode: 'off' };
    return g === 'short' ? { mode: 'short', obj: 0.16, cue: 0.09 } : { mode: 'long', obj: 0.6, cue: 0.32 };
  }

  /* =========================================================
   * 介面
   * ========================================================= */
  const mini = [];
  for (let id = 0; id < 16; id++) {
    const c = document.createElement('canvas'); c.width = c.height = 40;
    const x = c.getContext('2d');
    x.save(); x.beginPath(); x.arc(20, 20, 19, 0, Math.PI * 2); x.clip();
    x.fillStyle = (id > 8 || id === 0) ? '#f4f0e2' : BALL_COL[id]; x.fillRect(0, 0, 40, 40);
    if (id > 8) { x.fillStyle = BALL_COL[id]; x.fillRect(0, 10, 40, 20); }
    if (id) { x.fillStyle = '#f7f3e8'; x.beginPath(); x.arc(20, 20, 9, 0, Math.PI * 2); x.fill(); x.fillStyle = '#111'; x.font = 'bold ' + (id > 9 ? 10 : 12) + 'px Arial'; x.textAlign = 'center'; x.textBaseline = 'middle'; x.fillText(String(id), 20, 21); }
    const g = x.createRadialGradient(13, 11, 1, 20, 20, 21); g.addColorStop(0, 'rgba(255,255,255,.55)'); g.addColorStop(0.35, 'rgba(255,255,255,0)'); g.addColorStop(1, 'rgba(0,0,0,.4)');
    x.fillStyle = g; x.fillRect(0, 0, 40, 40); x.restore();
    mini.push(c.toDataURL());
  }
  const hudKeys = ['', ''];
  function updateHUD() {
    if (!game) return;
    if (isPractice()) {
      let pot = 0; for (let i = 1; i < N; i++) if (!W.on[i]) pot++;
      $('prPot').textContent = pot; $('prShots').textContent = practiceShots;
    } else {
      const fi = falling.filter(f => !f.done).map(f => f.i);
      const down = i => !W.on[i] && fi.indexOf(i) < 0;
      for (let p = 0; p < 2; p++) {
        const g = game.groups[p];
        const ids = g === 'S' ? [1, 2, 3, 4, 5, 6, 7] : g === 'T' ? [9, 10, 11, 12, 13, 14, 15] : [];
        $('pl' + p).classList.toggle('on', game.turn === p && phase !== 'over');
        $('pg' + p).textContent = g ? (g === 'S' ? '全色' : '花色') : '—';
        const k = g + ':' + ids.map(i => down(i) ? 1 : 0).join('');
        if (hudKeys[p] === k) continue;
        hudKeys[p] = k;
        const tr = $('tr' + p);
        if (!ids.length) tr.innerHTML = '<span class="empty">開放球檯</span>';
        else tr.innerHTML = ids.map(i => '<img alt="" src="' + mini[i] + '" class="' + (down(i) ? 'in' : '') + '">').join('');
      }
    }
    const ctl = phase === 'aim' && isHuman();
    $('power').classList.toggle('dis', !ctl);
    $('fine').classList.toggle('dis', !ctl);
    $('spin').classList.toggle('dis', !ctl);
  }
  let lastPow = -1;
  function updatePowerUI() {
    if (aim.power === lastPow) return;
    lastPow = aim.power;
    const tr = powEl.querySelector('.track'), h = tr.clientHeight;
    $('pFill').style.height = (aim.power * 100) + '%';
    $('pFill').style.setProperty('--th', h + 'px');
    $('pKnob').style.top = (aim.power * 100) + '%';
    $('pPct').textContent = Math.round(aim.power * 100) + '%';
  }
  const msgQ = [];
  let msgT = 0, msgCur = null;
  function showMsg(text, type) {
    if (msgCur && msgCur.text === text) return;
    if (msgQ.length && msgQ[msgQ.length - 1].text === text) return;
    msgQ.push({ text, type });
    if (msgQ.length > 4) msgQ.shift();
  }
  function msgTick(dt) {
    const b = $('banner');
    msgT -= dt;
    if (msgT <= 0) {
      if (msgCur) { b.classList.remove('show'); msgCur = null; msgT = 0.22; return; }
      const m = msgQ.shift();
      if (m) {
        msgCur = m; b.textContent = m.text; b.className = 'glass show' + (m.type === 'foul' ? ' foul' : '') + (m.type === 'big' ? ' big' : '');
        msgT = m.type === 'turn' ? 1.1 : 1.7;
        if (msgQ.length) msgT *= 0.75;
      }
    }
  }
  function setHint(t) { const h = $('hint'); h.textContent = t; h.classList.toggle('hide', !t); }

  function togglePause(force) {
    if (!game || phase === 'title') return;
    const ex = $('pauseOv');
    if (ex && force !== true) { ex.remove(); paused = false; sUI(); return; }
    if (ex) return;
    paused = true;
    const ov = document.createElement('div');
    ov.className = 'ov'; ov.id = 'pauseOv';
    ov.innerHTML = '<div class="card glass pcard"><h2>暫停</h2><p>' + (game.mode === 'cpu' ? '對戰電腦・' + ({ easy: '簡單', normal: '普通', hard: '困難' })[game.diff] : game.mode === 'pvp' ? '雙人對戰' : '自由練習') + '</p>' +
      '<div class="row"><label>瞄準線</label><div class="seg" id="pGuide"><button data-v="long">長</button><button data-v="short">短</button><button data-v="off">關</button></div></div>' +
      '<div class="row"><label>視角</label><div class="seg" id="pView"><button data-v="3d">3D 視角</button><button data-v="top">俯視</button></div></div>' +
      '<div class="acts"><button class="gbtn pri" id="pRes">繼續</button><button class="gbtn" id="pRe">重新開始</button><button class="gbtn" id="pMenu">主選單</button></div></div>';
    document.body.appendChild(ov);
    bindSeg(ov.querySelector('#pGuide'), () => opts.guide, v => { opts.guide = v; saveOpts(); });
    bindSeg(ov.querySelector('#pView'), () => view, v => { if (v !== view) toggleView(); });
    ov.querySelector('#pRes').onclick = () => togglePause();
    ov.querySelector('#pRe').onclick = () => { sUI(); startMatch(game.mode, game.diff); };
    ov.querySelector('#pMenu').onclick = () => { sUI(); toTitle(); };
  }
  function bindSeg(el, get, set) {
    const btns = [...el.querySelectorAll('button')];
    const sync = () => btns.forEach(b => b.classList.toggle('on', b.dataset.v === get()));
    btns.forEach(b => b.addEventListener('click', () => { set(b.dataset.v); sync(); sUI(); }));
    sync();
    return sync;
  }
  $('bPause').addEventListener('click', () => togglePause());
  $('bView').addEventListener('click', toggleView);
  $('viewT').textContent = view === '3d' ? '俯視' : '3D';
  $('bRack').addEventListener('click', () => { if (!isPractice() || phase === 'shoot') return; sUI(); rackFor(opts.rack); game.breakShot = opts.rack === 'std'; game.kitchen = game.breakShot; practiceShots = 0; beginTurn(true); updateHUD(); });

  // 標題
  const syncMode = bindSeg($('segMode'), () => opts.mode, v => { opts.mode = v; saveOpts(); updateTitle(); });
  bindSeg($('segDiff'), () => opts.diff, v => { opts.diff = v; saveOpts(); updateTitle(); });
  bindSeg($('segRack'), () => opts.rack, v => { opts.rack = v; saveOpts(); });
  bindSeg($('segGuide'), () => opts.guide, v => { opts.guide = v; saveOpts(); });
  void syncMode;
  function updateTitle() {
    $('rowDiff').classList.toggle('hide', opts.mode !== 'cpu');
    $('rowRack').classList.toggle('hide', opts.mode !== 'practice');
    $('tStart').textContent = opts.mode === 'practice' ? '開始練習' : '開始比賽';
    const d = stats[opts.diff];
    let rec;
    if (opts.mode === 'cpu') rec = '戰績（' + ({ easy: '簡單', normal: '普通', hard: '困難' })[opts.diff] + '）<b>' + d.w + ' 勝 ' + d.l + ' 敗</b>　目前連勝 <b>' + stats.streak + '</b>　最佳連勝 <b>' + stats.best + '</b>';
    else if (opts.mode === 'pvp') rec = '雙人對戰已進行 <b>' + stats.pvp + '</b> 局・輪流使用同一台裝置';
    else rec = '標準球型最少清檯桿數：<b>' + (stats.clear == null ? '—' : stats.clear) + '</b>';
    $('tRec').innerHTML = rec;
  }
  $('tStart').addEventListener('click', () => { sUI(); startMatch(opts.mode, opts.diff, opts.rack); });

  /* =========================================================
   * 版面、畫質、主迴圈
   * ========================================================= */
  const composer = new EffectComposer(renderer);
  composer.addPass(new RenderPass(scene, camera));
  const bloom = new UnrealBloomPass(new THREE.Vector2(256, 256), 0.35, 0.5, 0.92);
  composer.addPass(bloom);
  composer.addPass(new OutputPass());
  function resize() {
    VW = innerWidth; VH = innerHeight;
    renderer.setSize(VW, VH, false);
    composer.setSize(VW, VH);
    bloom.resolution.set(VW / 4, VH / 4);
    layoutLand = VW > VH;
    document.body.classList.toggle('land', layoutLand);
    document.body.classList.toggle('short', VH < 520);
    lastPow = -1;
  }
  window.addEventListener('resize', resize);
  const QKEY = 'quality:' + location.pathname.split('/').filter(Boolean).slice(-1)[0];
  const baseRatio = Math.min(window.devicePixelRatio || 1, small ? 1.75 : 2);
  const QLEVELS = [
    { ratio: baseRatio, bloom: true, shadow: true },
    { ratio: Math.min(baseRatio, 1.35), bloom: true, shadow: true },
    { ratio: 1, bloom: true, shadow: true },
    { ratio: 1, bloom: false, shadow: true },
    { ratio: 1, bloom: false, shadow: false },
    { ratio: 0.8, bloom: false, shadow: false }
  ];
  let qLevel = clamp(KG.store.get(QKEY, KG.lowEnd ? 2 : 0) | 0, 0, QLEVELS.length - 1);
  const perf = { last: 0, n: 0, sum: 0, cool: 2.5 };
  function applyQuality() {
    const q = QLEVELS[qLevel];
    renderer.setPixelRatio(q.ratio);
    renderer.setSize(VW, VH, false);
    composer.setPixelRatio(q.ratio);
    composer.setSize(VW, VH);
    if (renderer.shadowMap.enabled !== q.shadow) {
      renderer.shadowMap.enabled = q.shadow;
      scene.traverse(o => { if (o.material) [].concat(o.material).forEach(m => { m.needsUpdate = true; }); });
    }
  }
  function renderFrame() {
    if (QLEVELS[qLevel].bloom) composer.render(); else renderer.render(scene, camera);
    const now = performance.now(), dt = perf.last ? Math.min(0.5, (now - perf.last) / 1000) : 0;
    perf.last = now;
    if (document.hidden || qLevel >= QLEVELS.length - 1) return;
    perf.cool -= dt;
    if (perf.cool > 0) return;
    perf.sum += dt; perf.n++;
    if (perf.n >= 60) {
      if (perf.sum / perf.n > 1 / 45) {
        qLevel++;
        KG.store.set(QKEY, qLevel);
        applyQuality();
        perf.cool = 1.5;
      }
      perf.n = 0; perf.sum = 0;
    }
  }
  let last = performance.now(), first = true, hudT = 0;
  function frame(now) {
    const dt = Math.max(0, Math.min(0.05, (now - last) / 1000));
    last = now;
    update(dt);
    msgTick(dt);
    computeCamera(dt);
    sync3D(now);
    updatePowerUI();
    renderFrame();
    hudT -= dt;
    if (hudT <= 0 && game) { hudT = 0.15; updateHUD(); }
    if (first) { first = false; const m = $('msg'); if (m) m.remove(); }
    requestAnimationFrame(frame);
  }
  rackFor('std');
  resize();
  applyQuality();
  drawSpin();
  $('title').classList.remove('hide');
  updateTitle();
  requestAnimationFrame(frame);

  /* =========================================================
   * 測試用
   * ========================================================= */
  const ballList = () => { const o = []; for (let i = 0; i < N; i++) if (W.on[i]) o.push({ id: i, x: +W.x[i].toFixed(4), y: +W.y[i].toFixed(4) }); return o; };
  window.__pool = {
    core: Core,
    state: () => ({ phase, paused, view, mode: game && game.mode, diff: game && game.diff, turn: game && game.turn, groups: game && game.groups.slice(), ballInHand: game && game.ballInHand, kitchen: game && game.kitchen, breakShot: game && game.breakShot, winner: game ? game.winner : -1, winReason: game && game.winReason, shots: game && game.shots.slice(), fouls: game && game.fouls.slice(), potted: game && game.potted.slice(), lastFoul: lastRes && lastRes.foul, lastRes, aim: { ...aim }, onTable: ballList().length, balls: ballList(), moving: Core.anyMoving(W), aiStage: ai && ai.stage, q: qLevel, banner: msgCur && msgCur.text, queue: msgQ.map(m => m.text), practiceShots, overOpen: !!$('overOv') }),
    start: (mode, diff, rack) => { startMatch(mode || 'cpu', diff || 'normal', rack); return phase; },
    shoot: (angle, power, sx, sy) => takeShot(angle == null ? aim.angle : angle, power == null ? 0.5 : power, sx || 0, sy || 0),
    step: n => { for (let i = 0; i < (n || 1); i++) { update(1 / 60); msgTick(1 / 60); } return phase; },
    settle: (max, budget) => { const ob = AI_BUDGET.ms; AI_BUDGET.ms = budget || 1000; let i = 0; while (i < (max || 20000) && !(phase === 'aim' || phase === 'over' || phase === 'title')) { update(1 / 60); msgTick(1 / 60); i++; } AI_BUDGET.ms = ob; if (phase === 'over' && overTimer > 0) { overTimer = 0; showOver(); } return { phase, frames: i }; },
    setBalls: (list, o) => {
      Core.clearWorld(W);
      for (const b of list) { W.on[b.id] = 1; W.x[b.id] = b.x; W.y[b.id] = b.y; }
      o = o || {};
      if (game) { game.breakShot = !!o.breakShot; game.groups = o.groups || game.groups; if (o.turn != null) game.turn = o.turn; game.ballInHand = !!o.ballInHand; game.kitchen = !!o.kitchen; game.winner = -1; }
      falling.length = 0; ai = null;
      if (game) beginTurn(true);
      return ballList();
    },
    aiShot: () => Core.runPlan(Core.aiPlan(Core.cloneGame(game), Core.cloneWorld(W), Math.random)),
    placeCue: (x, y) => canPlace() ? tryPlace(x, y) && { x: W.x[0], y: W.y[0] } : false,
    predict: a => Object.assign({}, predict(a == null ? aim.angle : a)),
    toScreen: (x, y) => toScreen(x, y),
    tablePoint: (x, y) => tablePoint(x, y),
    view: v => { if (v && v !== view) toggleView(); camSnap = true; return view; },
    snap: () => { camSnap = true; },
    quality: n => { qLevel = clamp(n, 0, QLEVELS.length - 1); perf.cool = 1e9; applyQuality(); },
    info: () => ({ calls: renderer.info.render.calls, tris: renderer.info.render.triangles, q: qLevel }),
    setAim: (a, p) => { if (a != null) aim.angle = a; if (p != null) aim.power = p; },
    toTitle
  };
}

</script>
</body>
</html>
