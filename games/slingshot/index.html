<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>彈弓大作戰</title>
<link rel="stylesheet" href="../../assets/common.css">
<style>
  html, body { height: 100%; overflow: hidden; background: #7fd0ff; overscroll-behavior: none; }
  #game { position: fixed; inset: 0; display: block; width: 100vw; height: 100vh; height: 100dvh; touch-action: none; }
</style>
</head>
<body>
<canvas id="game" aria-label="彈弓大作戰"></canvas>
<script src="../../assets/common.js"></script>
<script id="ss-core">
/* =====================================================================
 * 彈弓大作戰：物理核心（無 DOM，瀏覽器與 Node 測試機器人共用）
 * 2D 剛體引擎：凸多邊形＋圓形、SAT 接觸點裁切、序列衝量解算（暖啟動）、
 * 島嶼睡眠、格子寬相、子彈連續碰撞、材質破壞。世界資料全部是純資料，
 * 可以用 structuredClone 複製（機器人搜尋用）。座標：公尺，y 朝上。
 * ===================================================================== */
const SSCore = (function () {
  'use strict';
  const DT = 1 / 60, IDT = 60, GRAV = -10, ITER = 10;
  const VMAX = 18.5, PULL = 1.45;
  const SLING = { x: 0, y: 2.1 };
  const MARGIN = 0.02, SLOP = 0.008, BETA = 0.2, MAXCORR = 2.5;
  const SLEEP_LIN = 0.06, SLEEP_ANG = 0.07, SLEEP_T = 0.5;
  const SETTLE_MAX = 660;
  const MATS = {
    wood: { d: 5, f: 0.62, e: 0.08, hp: 9, score: 500 },
    ice: { d: 4, f: 0.14, e: 0.08, hp: 5.5, score: 400 },
    glass: { d: 3.4, f: 0.38, e: 0.05, hp: 3.2, score: 300 },
    stone: { d: 11, f: 0.8, e: 0.03, hp: 24, score: 800 },
    rock: { d: 0, f: 0.85, e: 0.05, hp: 1e9, score: 0 },
    robot: { d: 4, f: 0.6, e: 0.15, hp: 4, score: 5000 },
    hero: { d: 9, f: 0.55, e: 0.3, hp: 1e9, score: 0 },
    tnt: { d: 3, f: 0.6, e: 0.05, hp: 2.5, score: 300 }
  };
  const HEROES = {
    tomato: { r: 0.3, ab: null, fx: {} },
    berry: { r: 0.22, ab: 'split', fx: { glass: 2.2, ice: 1.6, wood: 0.75, stone: 0.5 } },
    banana: { r: 0.27, ab: 'boomerang', fx: { wood: 1.35 } },
    chili: { r: 0.26, ab: 'boost', fx: { wood: 1.2, ice: 1.2 } },
    pine: { r: 0.31, ab: 'explode', fx: {} },
    melon: { r: 0.4, ab: 'heavy', fx: { stone: 1.7, wood: 1.15 } }
  };
  const ROBOTS = { s: { r: 0.32, hp: 3 }, m: { r: 0.4, hp: 6 }, l: { r: 0.58, hp: 13 } };
  const GX0 = -24, GY0 = -8, GW = 110, GH = 60;
  const ROBOT_PTS = 5000, SHOT_BONUS = 10000;

  /* ---------- 世界 ---------- */
  function newWorld() {
    return {
      bodies: [], statics: [], arbs: new Map(), nextId: 1, step: 0, events: [], score: 0,
      robotsAlive: 0, robotsTotal: 0, noSleep: false, noDamage: false,
      cellHead: new Int32Array(GW * GH), eNext: new Int32Array(8192), eBody: new Int32Array(8192),
      stamp: new Int32Array(2048), stampId: 0, parent: new Int32Array(2048), minSt: new Float64Array(2048),
      queue: [], shotIdx: 0, flying: false, flyStep: 0, abUsed: false, abAt: -1, active: 0, heroIds: [],
      level: -1, brokeThisShot: 0, killsThisShot: 0
    };
  }

  function polyProps(b, pts) {
    // pts: 世界座標頂點 [x0,y0,x1,y1,...]（逆時針）
    const n = pts.length / 2;
    let area = 0, cx = 0, cy = 0;
    for (let i = 0; i < n; i++) {
      const x1 = pts[i * 2], y1 = pts[i * 2 + 1], j = (i + 1) % n, x2 = pts[j * 2], y2 = pts[j * 2 + 1];
      const cr = x1 * y2 - x2 * y1;
      area += cr; cx += (x1 + x2) * cr; cy += (y1 + y2) * cr;
    }
    area *= 0.5;
    if (area < 0) { // 改成逆時針
      const rev = [];
      for (let i = n - 1; i >= 0; i--) rev.push(pts[i * 2], pts[i * 2 + 1]);
      return polyProps(b, rev);
    }
    cx /= (6 * area); cy /= (6 * area);
    b.lv = new Float64Array(n * 2); b.ln = new Float64Array(n * 2);
    b.wv = new Float64Array(n * 2); b.wn = new Float64Array(n * 2);
    let I = 0, rmax = 0;
    for (let i = 0; i < n; i++) { b.lv[i * 2] = pts[i * 2] - cx; b.lv[i * 2 + 1] = pts[i * 2 + 1] - cy; }
    for (let i = 0; i < n; i++) {
      const j = (i + 1) % n;
      const x1 = b.lv[i * 2], y1 = b.lv[i * 2 + 1], x2 = b.lv[j * 2], y2 = b.lv[j * 2 + 1];
      const ex = x2 - x1, ey = y2 - y1, l = Math.hypot(ex, ey);
      b.ln[i * 2] = ey / l; b.ln[i * 2 + 1] = -ex / l;
      const cr = x1 * y2 - x2 * y1;
      I += cr * (x1 * x1 + x1 * x2 + x2 * x2 + y1 * y1 + y1 * y2 + y2 * y2);
      rmax = Math.max(rmax, Math.hypot(x1, y1));
    }
    b.n = n; b.area = area; b.I1 = I / 12; b.x = cx; b.y = cy; b.r = rmax;
  }

  function addBody(w, o) {
    // o: {shape:'poly'|'circle', pts|r, x,y, mat, kind, static}
    const mat = MATS[o.mat];
    const b = {
      id: w.nextId++, ix: 0, kind: o.kind || 'block', mat: o.mat, shape: o.shape === 'circle' ? 1 : 0,
      x: o.x || 0, y: o.y || 0, a: o.a || 0, vx: 0, vy: 0, w: 0, m: 0, im: 0, I: 0, iI: 0,
      f: mat.f, e: mat.e, hp: 1e9, dmg: 0, crack: 0, awake: true, st: 0, alive: true, isStatic: !!o.static,
      bullet: false, hero: o.hero || null, size: o.size || null, touch: false, hit: false, heavy: false, boost: false,
      boom: 0, minx: 0, miny: 0, maxx: 0, maxy: 0, n: 0, r: 0, area: 0, lv: null, ln: null, wv: null, wn: null,
      w0: o.w0 || 0, h0: o.h0 || 0, sk: o.sk || '', lastHitStep: -99, x0: 0, y0: 0
    };
    if (b.shape === 1) {
      b.r = o.r; b.area = Math.PI * o.r * o.r; b.I1 = b.area * o.r * o.r * 0.5;
    } else polyProps(b, o.pts);
    if (b.isStatic) { b.awake = false; }
    else {
      const d = mat.d * (o.dens || 1);
      b.m = b.area * d; b.im = 1 / b.m; b.I = b.I1 * d; b.iI = 1 / b.I;
      if (o.kind === 'robot') b.hp = ROBOTS[o.size].hp;
      else if (o.kind === 'block') b.hp = mat.hp * Math.min(2.2, Math.max(0.7, Math.sqrt(b.area / 0.25)));
    }
    b.x0 = b.x; b.y0 = b.y;
    xform(b);
    if (b.isStatic) w.statics.push(b); else w.bodies.push(b);
    if (b.kind === 'robot') { w.robotsAlive++; w.robotsTotal++; }
    return b;
  }

  function xform(b) {
    if (b.shape === 1) {
      b.minx = b.x - b.r; b.maxx = b.x + b.r; b.miny = b.y - b.r; b.maxy = b.y + b.r;
      return;
    }
    const c = Math.cos(b.a), s = Math.sin(b.a), lv = b.lv, ln = b.ln, wv = b.wv, wn = b.wn;
    let x0 = 1e9, y0 = 1e9, x1 = -1e9, y1 = -1e9;
    for (let i = 0, k = b.n * 2; i < k; i += 2) {
      const lx = lv[i], ly = lv[i + 1];
      const X = b.x + c * lx - s * ly, Y = b.y + s * lx + c * ly;
      wv[i] = X; wv[i + 1] = Y;
      wn[i] = c * ln[i] - s * ln[i + 1]; wn[i + 1] = s * ln[i] + c * ln[i + 1];
      if (X < x0) x0 = X; if (X > x1) x1 = X; if (Y < y0) y0 = Y; if (Y > y1) y1 = Y;
    }
    b.minx = x0; b.miny = y0; b.maxx = x1; b.maxy = y1;
  }

  /* ---------- 窄相：接觸點 ---------- */
  const M = { nx: 0, ny: 0, count: 0, px: [0, 0], py: [0, 0], sep: [0, 0], id: [0, 0] };
  let msEdge = 0;
  function maxSep(A, B) {
    let best = -1e9, bi = 0;
    const an = A.wn, av = A.wv, bv = B.wv, nb = B.n * 2;
    for (let i = 0, k = A.n * 2; i < k; i += 2) {
      const nx = an[i], ny = an[i + 1], vx = av[i], vy = av[i + 1];
      let si = 1e9;
      for (let j = 0; j < nb; j += 2) {
        const d = nx * (bv[j] - vx) + ny * (bv[j + 1] - vy);
        if (d < si) si = d;
      }
      if (si > best) { best = si; bi = i >> 1; }
    }
    msEdge = bi;
    return best;
  }
  const CP = [0, 0, 0, 0, 0, 0]; // 裁切暫存：x0,y0,id0,x1,y1,id1
  function polyPoly(A, B, margin) {
    M.count = 0;
    const sA = maxSep(A, B); if (sA > margin) return 0;
    const eA = msEdge;
    const sB = maxSep(B, A); if (sB > margin) return 0;
    const eB = msEdge;
    let R = A, I = B, e = eA, flip = 0;
    if (sB > 0.95 * sA + 0.01) { R = B; I = A; e = eB; flip = 1; }
    const rn = R.n, i1 = e, i2 = (e + 1) % rn;
    const v1x = R.wv[i1 * 2], v1y = R.wv[i1 * 2 + 1], v2x = R.wv[i2 * 2], v2y = R.wv[i2 * 2 + 1];
    const nx = R.wn[i1 * 2], ny = R.wn[i1 * 2 + 1];
    // 入射邊
    let ie = 0, md = 1e9;
    for (let k = 0; k < I.n; k++) {
      const d = nx * I.wn[k * 2] + ny * I.wn[k * 2 + 1];
      if (d < md) { md = d; ie = k; }
    }
    const ie2 = (ie + 1) % I.n;
    let ax = I.wv[ie * 2], ay = I.wv[ie * 2 + 1], aid = ie, bx = I.wv[ie2 * 2], by = I.wv[ie2 * 2 + 1], bid = ie2;
    const tl = Math.hypot(v2x - v1x, v2y - v1y), tx = (v2x - v1x) / tl, ty = (v2y - v1y) / tl;
    // 側面 1：-t·p <= -t·v1
    let o1 = -(tx * v1x + ty * v1y);
    let da = -(tx * ax + ty * ay) - o1, db = -(tx * bx + ty * by) - o1;
    if (da > 0 && db > 0) return 0;
    if (da > 0) { const k = da / (da - db); ax = ax + (bx - ax) * k; ay = ay + (by - ay) * k; aid = 20; }
    else if (db > 0) { const k = da / (da - db); bx = ax + (bx - ax) * k; by = ay + (by - ay) * k; bid = 20; }
    const o2 = tx * v2x + ty * v2y;
    da = tx * ax + ty * ay - o2; db = tx * bx + ty * by - o2;
    if (da > 0 && db > 0) return 0;
    if (da > 0) { const k = da / (da - db); ax = ax + (bx - ax) * k; ay = ay + (by - ay) * k; aid = 21; }
    else if (db > 0) { const k = da / (da - db); bx = ax + (bx - ax) * k; by = ay + (by - ay) * k; bid = 21; }
    const base = flip * 100000 + e * 1000 + ie * 30;
    let c = 0;
    const sa = nx * (ax - v1x) + ny * (ay - v1y);
    if (sa <= margin) { M.px[c] = ax - nx * sa * 0.5; M.py[c] = ay - ny * sa * 0.5; M.sep[c] = sa; M.id[c] = base + aid; c++; }
    const sb = nx * (bx - v1x) + ny * (by - v1y);
    if (sb <= margin) { M.px[c] = bx - nx * sb * 0.5; M.py[c] = by - ny * sb * 0.5; M.sep[c] = sb; M.id[c] = base + bid + 50; c++; }
    M.count = c;
    if (flip) { M.nx = -nx; M.ny = -ny; } else { M.nx = nx; M.ny = ny; }
    return c;
  }
  // A 多邊形、B 圓；法線由 A 指向 B
  function polyCircle(A, B, margin) {
    M.count = 0;
    const cx = B.x, cy = B.y, r = B.r;
    let sep = -1e9, ei = 0;
    for (let i = 0; i < A.n; i++) {
      const s = A.wn[i * 2] * (cx - A.wv[i * 2]) + A.wn[i * 2 + 1] * (cy - A.wv[i * 2 + 1]);
      if (s > r + margin) return 0;
      if (s > sep) { sep = s; ei = i; }
    }
    const j = (ei + 1) % A.n;
    const v1x = A.wv[ei * 2], v1y = A.wv[ei * 2 + 1], v2x = A.wv[j * 2], v2y = A.wv[j * 2 + 1];
    let nx, ny, s, id;
    if (sep < 1e-6) { nx = A.wn[ei * 2]; ny = A.wn[ei * 2 + 1]; s = sep - r; id = ei; }
    else {
      const u1 = (cx - v1x) * (v2x - v1x) + (cy - v1y) * (v2y - v1y);
      const u2 = (cx - v2x) * (v1x - v2x) + (cy - v2y) * (v1y - v2y);
      if (u1 <= 0 || u2 <= 0) {
        const vx = u1 <= 0 ? v1x : v2x, vy = u1 <= 0 ? v1y : v2y;
        const d = Math.hypot(cx - vx, cy - vy);
        if (d > r + margin) return 0;
        if (d < 1e-9) return 0;
        nx = (cx - vx) / d; ny = (cy - vy) / d; s = d - r; id = 40 + (u1 <= 0 ? ei : j);
      } else { nx = A.wn[ei * 2]; ny = A.wn[ei * 2 + 1]; s = sep - r; id = ei; }
    }
    M.nx = nx; M.ny = ny; M.count = 1;
    M.px[0] = cx - nx * (r + s * 0.5); M.py[0] = cy - ny * (r + s * 0.5); M.sep[0] = s; M.id[0] = id;
    return 1;
  }
  function circleCircle(A, B, margin) {
    M.count = 0;
    const dx = B.x - A.x, dy = B.y - A.y, d = Math.hypot(dx, dy);
    if (d > A.r + B.r + margin) return 0;
    let nx = 0, ny = 1;
    if (d > 1e-9) { nx = dx / d; ny = dy / d; }
    const s = d - A.r - B.r;
    M.nx = nx; M.ny = ny; M.count = 1;
    M.px[0] = A.x + nx * (A.r + s * 0.5); M.py[0] = A.y + ny * (A.r + s * 0.5); M.sep[0] = s; M.id[0] = 0;
    return 1;
  }
  function collide(A, B, margin) {
    if (A.shape === 0 && B.shape === 0) return polyPoly(A, B, margin);
    if (A.shape === 0) return polyCircle(A, B, margin);
    return circleCircle(A, B, margin);
  }

  function newContact() { return { px: 0, py: 0, sep: 0, id: -1, rax: 0, ray: 0, rbx: 0, rby: 0, pn: 0, pt: 0, mn: 0, mt: 0, bias: 0 }; }
  function updateArb(w, A, B) {
    // 固定順序：多邊形在前；同形狀時 id 小的在前
    if (A.shape > B.shape || (A.shape === B.shape && A.id > B.id)) { const t = A; A = B; B = t; }
    const key = A.id < B.id ? A.id * 65536 + B.id : B.id * 65536 + A.id;
    const margin = MARGIN;
    const cnt = collide(A, B, margin);
    let arb = w.arbs.get(key);
    if (!cnt) { if (arb) w.arbs.delete(key); return; }
    let fresh = false;
    if (!arb) {
      arb = { a: A, b: B, key, n: 0, nx: 0, ny: 0, c: [newContact(), newContact()], f: Math.sqrt(A.f * B.f), e: Math.max(A.e, B.e), stamp: 0 };
      w.arbs.set(key, arb);
      fresh = true;
    }
    arb.stamp = w.step;
    // 暖啟動：依特徵編號保留累積衝量
    const o0 = arb.c[0], o1 = arb.c[1];
    const p0n = arb.n > 0 ? o0.pn : 0, p0t = arb.n > 0 ? o0.pt : 0, id0 = arb.n > 0 ? o0.id : -9;
    const p1n = arb.n > 1 ? o1.pn : 0, p1t = arb.n > 1 ? o1.pt : 0, id1 = arb.n > 1 ? o1.id : -9;
    const x0 = o0.px, y0 = o0.py, x1 = o1.px, y1 = o1.py, on = arb.n;
    const sameN = arb.nx * M.nx + arb.ny * M.ny > 0.95;
    let used0 = false, used1 = false;
    for (let i = 0; i < cnt; i++) {
      const c = arb.c[i], px = M.px[i], py = M.py[i];
      c.pn = 0; c.pt = 0;
      if (on > 0 && !used0 && M.id[i] === id0) { c.pn = p0n; c.pt = p0t; used0 = true; }
      else if (on > 1 && !used1 && M.id[i] === id1) { c.pn = p1n; c.pt = p1t; used1 = true; }
      else if (sameN) {
        // 特徵編號不同時（頂點剛好在裁切邊上跳動），改用位置最近的舊接觸點
        const d0 = on > 0 && !used0 ? (px - x0) * (px - x0) + (py - y0) * (py - y0) : 1e9;
        const d1 = on > 1 && !used1 ? (px - x1) * (px - x1) + (py - y1) * (py - y1) : 1e9;
        if (d0 < d1 && d0 < 0.01) { c.pn = p0n; c.pt = p0t; used0 = true; }
        else if (d1 < 0.01) { c.pn = p1n; c.pt = p1t; used1 = true; }
      }
      c.px = px; c.py = py; c.sep = M.sep[i]; c.id = M.id[i];
    }
    arb.n = cnt; arb.nx = M.nx; arb.ny = M.ny;
    if (fresh || !arb.touched) arb.touched = true;
  }

  /* ---------- 寬相：均勻格子 ---------- */
  function cellRange(b) {
    const x0 = Math.max(0, Math.min(GW - 1, Math.floor(b.minx - MARGIN - GX0)));
    const x1 = Math.max(0, Math.min(GW - 1, Math.floor(b.maxx + MARGIN - GX0)));
    const y0 = Math.max(0, Math.min(GH - 1, Math.floor(b.miny - MARGIN - GY0)));
    const y1 = Math.max(0, Math.min(GH - 1, Math.floor(b.maxy + MARGIN - GY0)));
    CR[0] = x0; CR[1] = x1; CR[2] = y0; CR[3] = y1;
  }
  const CR = [0, 0, 0, 0];
  function overlapAABB(A, B) {
    return A.minx - MARGIN <= B.maxx && B.minx - MARGIN <= A.maxx && A.miny - MARGIN <= B.maxy && B.miny - MARGIN <= A.maxy;
  }
  function broadphase(w) {
    const bodies = w.bodies, head = w.cellHead, nxt = w.eNext, eb = w.eBody;
    head.fill(-1);
    let ec = 0;
    for (let i = 0; i < bodies.length; i++) {
      const b = bodies[i]; b.ix = i;
      cellRange(b);
      for (let cx = CR[0]; cx <= CR[1]; cx++) for (let cy = CR[2]; cy <= CR[3]; cy++) {
        if (ec >= nxt.length) continue;
        const cell = cy * GW + cx;
        eb[ec] = i; nxt[ec] = head[cell]; head[cell] = ec; ec++;
      }
    }
    const stamp = w.stamp;
    for (let i = 0; i < bodies.length; i++) {
      const A = bodies[i];
      if (!A.awake) continue;
      const sid = ++w.stampId;
      cellRange(A);
      for (let cx = CR[0]; cx <= CR[1]; cx++) for (let cy = CR[2]; cy <= CR[3]; cy++) {
        for (let e = head[cy * GW + cx]; e !== -1; e = nxt[e]) {
          const j = eb[e];
          if (j === i || stamp[j] === sid) continue;
          stamp[j] = sid;
          const B = bodies[j];
          if (B.awake && j < i) continue;
          if (!overlapAABB(A, B)) continue;
          updateArb(w, A, B);
        }
      }
      for (let k = 0; k < w.statics.length; k++) {
        const S = w.statics[k];
        if (overlapAABB(A, S)) updateArb(w, S, A);
      }
    }
    // 移除過期的接觸（兩邊都在睡覺的保留）
    for (const arb of w.arbs.values()) {
      if (arb.stamp === w.step) continue;
      const aw = arb.a.awake || arb.b.awake;
      if (aw || !arb.a.alive || !arb.b.alive) w.arbs.delete(arb.key);
    }
  }

  function wake(b) { if (!b.isStatic && !b.awake) { b.awake = true; b.st = 0; } }

  /* ---------- 解算 ---------- */
  function heroFactor(hero, mat) {
    if (!hero.hero) return 1;
    let f = HEROES[hero.hero].fx[mat] || 1;
    if (hero.boost) f *= 1.5;
    if (hero.heavy) f *= 1.3;
    return f;
  }
  function damage(w, b, amt, other) {
    if (w.noDamage || !b.alive || b.isStatic || b.hp > 1e8 || amt <= 0) return;
    b.dmg += amt;
    const before = b.crack;
    const fr = b.dmg / b.hp;
    if (b.kind === 'block') {
      w.score += Math.round(Math.min(amt, b.hp) * 10);
      b.crack = fr >= 0.7 ? 2 : fr >= 0.35 ? 1 : 0;
      if (b.crack > before && fr < 1) w.events.push({ t: 'crack', b: b.id, mat: b.mat, x: b.x, y: b.y, lv: b.crack });

  txt('拉開彈弓，打倒搗蛋機器人！', W / 2, ty + ts * 0.85, Math.round(Math.min(20 * U, W / 18)), '#fff', { stroke: '#5a2d5c', sw: 6 * U });
  const bw = Math.min(260 * U, W * 0.7), bh = 64 * U;
  button('start', W / 2 - bw / 2, Math.min(H * 0.55, gy - bh - 20 * U), bw, bh, { color: 'green', icon: 'play', label: '開始遊戲', pulse: true, cb: () => { goMap(); } });
  txt('★ ' + Save.total() + ' / ' + LV.length * 3, W / 2, Math.min(H * 0.55, gy - bh - 20 * U) + bh + 30 * U, Math.round(18 * U), '#fff', { stroke: '#5a2d5c', sw: 5 * U });
}
function mapNodes(th) {
  const ns = clamp(Math.min(W / 5.6, (H - 180 * U) / 5.5), 44, 84);
  const top = 64 + 72 * U + ns * 0.2 + (W > H ? 16 * U : 0), bot = H - 30 * U - ns * 0.3;
  const land = W > H;
  const pts = [];
  for (let i = 0; i < 10; i++) {
    let x, y;
    if (land) { const row = i < 5 ? 0 : 1, c = row ? 9 - i : i; x = W * (0.14 + c * 0.18); y = lerp(top + 30 * U, bot - 50 * U, row) + Math.sin(i * 1.7) * 8 * U; }
    else { const row = Math.floor(i / 2), c = row % 2 ? 1 - (i % 2) : i % 2; x = W * (0.3 + c * 0.4) + Math.sin(i) * 10 * U; y = lerp(top + 34 * U, bot - 40 * U, row / 4); }
    pts.push([x, y]);
  }
  return pts;
}
function drawMap() {
  const th = mapWorld;
  const gy = H + 60;
  cam.z = 30; cam.x = 0;
  drawBackground(th, time * 10, H * 0.72);
  const T = THEMES[th];
  ctx.fillStyle = rgbaHex(T.soil[0], 0.85); ctx.fillRect(0, H * 0.72, W, H * 0.28);
  // 主題切換
  const stars = Save.stars();
  const tabY = 64;
  txt(T.name, W / 2, tabY + 24 * U, Math.round(28 * U), '#fff', { stroke: T.accent, sw: 8 * U });
  let wstars = 0; for (let i = 0; i < 10; i++) wstars += stars[th * 10 + i] || 0;
  txt('★ ' + wstars + ' / 30', W / 2, tabY + 58 * U, Math.round(17 * U), '#fff', { stroke: '#5a2d5c', sw: 5 * U });
  const ab = 50 * U;
  if (th > 0) button('wl', 14, tabY + 6 * U, ab, ab, { color: 'white', icon: 'left', cb: () => { mapWorld--; mapEnter = time; Music.play(mapWorld); } });
  if (th < 2) button('wr', W - 14 - ab, tabY + 6 * U, ab, ab, { color: 'white', icon: 'right', cb: () => { mapWorld++; mapEnter = time; Music.play(mapWorld); } });
  // 路徑
  const pts = mapNodes(th);
  ctx.strokeStyle = 'rgba(255,255,255,0.85)'; ctx.lineWidth = 10 * U; ctx.setLineDash([4 * U, 14 * U]); ctx.lineCap = 'round';
  ctx.beginPath(); pts.forEach((p, i) => i ? ctx.lineTo(p[0], p[1]) : ctx.moveTo(p[0], p[1])); ctx.stroke(); ctx.setLineDash([]);
  const ns = clamp(Math.min(W / 5.6, (H - 180 * U) / 5.5), 44, 84);
  pts.forEach((p, i) => {
    const li = th * 10 + i, open = Save.unlocked(li);
    const appear = clamp((time - mapEnter) * 5 - i * 0.3, 0, 1);
    if (appear <= 0) return;
    const sc = easeOutBack(appear);
    ctx.save(); ctx.translate(p[0], p[1]); ctx.scale(sc, sc); ctx.translate(-p[0], -p[1]);
    const isNext = open && !(stars[li] > 0);
    button('lv' + li, p[0] - ns / 2, p[1] - ns / 2, ns, ns, { color: open ? (i === 9 ? 'pink' : T.btn) : 'gray', radius: ns * 0.3, pulse: isNext, cb: () => { if (!open) { KG.sound('wrong'); KG.toast('先過前一關喔！'); return; } startLevel(li); } });
    if (open) {
      txt(String(i + 1), p[0], p[1] - ns * 0.08, ns * 0.42, '#fff', { stroke: 'rgba(60,30,70,0.6)', sw: ns * 0.1 });
      for (let k = 0; k < 3; k++) starShape(p[0] + (k - 1) * ns * 0.3, p[1] + ns * 0.66 - (k === 1 ? 3 : 0), ns * 0.13, k < (stars[li] || 0));
    } else icon('lock', p[0], p[1], ns * 0.42, '#6f7480');
    ctx.restore();
  });
}
function rgbaHex(hex, a) { const n = parseInt(hex.slice(1), 16); return 'rgba(' + (n >> 16) + ',' + ((n >> 8) & 255) + ',' + (n & 255) + ',' + a + ')'; }

/* ---------- 輸入 ---------- */
function ptr(e) { const r = cv.getBoundingClientRect(); return [(e.clientX - r.left) * W / r.width, (e.clientY - r.top) * H / r.height]; }
cv.addEventListener('pointerdown', (e) => {
  e.preventDefault();
  const [x, y] = ptr(e);
  const b = hitBtn(x, y);
  if (b) { pressed = { id: b.id, pid: e.pointerId }; KG.note(880, 0.05, 'sine', 0.12); return; }
  if (screen !== 'play' || overlay) return;
  if (phase === 'intro') { phase = 'aim'; cam.mode = 'aim'; return; }
  if (phase === 'fly') { doAbility(); return; }
  if (phase === 'aim' && curHero()) {
    const [sx, sy] = slingScreen();
    const grab = Math.max(110, cam.z * 3);
    if (Math.hypot(x - sx, y - sy) < grab || (x < sx + grab * 0.6 && y > sy - grab * 1.5 && x < W * 0.4)) {
      aim = { id: e.pointerId, x0: x, y0: y, a: 0, p: 0 };
      kAim.on = false;
      try { cv.setPointerCapture(e.pointerId); } catch (_) { }
      KG.note(330, 0.06, 'triangle', 0.1);
      return;
    }
    pan = { id: e.pointerId, x0: x, m0: cam.manual };
  }
});
cv.addEventListener('pointermove', (e) => {
  const [x, y] = ptr(e);
  if (aim && aim.id === e.pointerId) {
    const r = aimFromPull(x - aim.x0, y - aim.y0);
    // 不能往前拉（往右）太多：允許任何方向，但力量不足時取消
    if (Math.abs(r.p - aim.p) > 0.04) SFX.stretch(r.p);
    aim.a = clamp(r.a, -1.45, 1.5); aim.p = r.p;
  } else if (pan && pan.id === e.pointerId) {
    cam.manual = pan.m0 - (x - pan.x0) / cam.z;
  }
});
function endPtr(e, cancel) {
  const [x, y] = ptr(e);
  if (pressed && pressed.pid === e.pointerId) {
    const b = hitBtn(x, y), id = pressed.id; pressed = null;
    if (!cancel && b && b.id === id && b.cb) { KG.sound('pop'); b.cb(); }
    return;
  }
  if (aim && aim.id === e.pointerId) {
    const a = aim; aim = null;
    if (!cancel && a.p >= 0.12) fireShot(a.a, a.p);
    else KG.note(260, 0.08, 'sine', 0.1, 0, 180);
    return;
  }
  if (pan && pan.id === e.pointerId) pan = null;
}
cv.addEventListener('pointerup', (e) => endPtr(e, false));
cv.addEventListener('pointercancel', (e) => endPtr(e, true));
cv.addEventListener('contextmenu', (e) => e.preventDefault());
cv.addEventListener('wheel', (e) => { if (screen === 'play' && phase === 'aim') { cam.manual += (e.deltaY + e.deltaX) / cam.z * 0.5; e.preventDefault(); } }, { passive: false });
window.addEventListener('keydown', (e) => {
  const k = e.key;
  if (screen === 'title' && (k === 'Enter' || k === ' ')) { goMap(); e.preventDefault(); return; }
  if (screen === 'map') {
    if (k === 'ArrowLeft' && mapWorld > 0) { mapWorld--; mapEnter = time; }
    else if (k === 'ArrowRight' && mapWorld < 2) { mapWorld++; mapEnter = time; }
    else if (k === 'Enter' || k === ' ') { let li = 0; for (let i = 0; i < LV.length; i++) if (Save.unlocked(i)) li = i; startLevel(li); }
    return;
  }
  if (screen !== 'play') return;
  if (overlay === 'result') {
    if (k === 'Enter' || k === ' ') { if (result.won && levelIdx < LV.length - 1) startLevel(levelIdx + 1); else startLevel(levelIdx, true); }
    else if (k === 'Escape') goMap();
    return;
  }
  if (k === 'Escape' || k === 'p' || k === 'P') { paused = !paused; overlay = paused ? 'pause' : null; e.preventDefault(); return; }
  if (paused) return;
  if (k === 'r' || k === 'R') { startLevel(levelIdx, true); return; }
  if (phase === 'intro') { phase = 'aim'; cam.mode = 'aim'; }
  if (phase === 'aim' && curHero()) {
    const D = Math.PI / 180;
    if (k === 'ArrowUp') { kAim.on = true; kAim.a = clamp(kAim.a + 2 * D, -1.2, 1.45); e.preventDefault(); }
    else if (k === 'ArrowDown') { kAim.on = true; kAim.a = clamp(kAim.a - 2 * D, -1.2, 1.45); e.preventDefault(); }
    else if (k === 'ArrowRight') { kAim.on = true; kAim.p = clamp(kAim.p + 0.03, 0.15, 1); SFX.stretch(kAim.p); e.preventDefault(); }
    else if (k === 'ArrowLeft') { kAim.on = true; kAim.p = clamp(kAim.p - 0.03, 0.15, 1); SFX.stretch(kAim.p); e.preventDefault(); }
    else if (k === ' ' || k === 'Enter') { if (kAim.on) fireShot(kAim.a, kAim.p); else kAim.on = true; e.preventDefault(); }
  } else if (phase === 'fly' && (k === ' ' || k === 'Enter')) { doAbility(); e.preventDefault(); }
});
document.addEventListener('visibilitychange', () => { if (document.hidden && screen === 'play' && !overlay) { paused = true; overlay = 'pause'; } });

/* ---------- 版面 ---------- */
function resize() {
  const r = cv.getBoundingClientRect();
  W = Math.max(200, r.width || innerWidth); H = Math.max(200, r.height || innerHeight);
  dpr = window.devicePixelRatio || 1;
  cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
  U = clamp(Math.min(W / 420, H / 600), 0.62, 1.35);
  groundPad = W < H ? H * 0.3 : Math.max(36, H * 0.1);
  layers = null; spriteCache.clear(); spriteCount = 0;
}
window.addEventListener('resize', resize);
if (window.visualViewport) window.visualViewport.addEventListener('resize', resize);
window.addEventListener('orientationchange', () => setTimeout(resize, 120));

/* ---------- 主迴圈 ---------- */
let lastT = performance.now(), fpsAvg = 60;
function frame(now) {
  const rdt = Math.min(0.05, Math.max(0, (now - lastT) / 1000)); lastT = now;
  time += rdt;
  fpsAvg = lerp(fpsAvg, rdt > 0 ? 1 / rdt : 60, 0.05);
  Music.update(rdt);
  btnReg = [];
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  if (screen === 'title') drawTitle();
  else if (screen === 'map') drawMap();
  else if (screen === 'play' && world) {
    if (!paused) {
      if (slowmo > 0) slowmo -= rdt;
      timeScale = lerp(timeScale, slowmo > 0 ? 0.3 : 1, 1 - Math.pow(0.001, rdt));
      acc += rdt * timeScale;
      let n = 0;
      while (acc >= C.DT && n < 4) { gameStep(); acc -= C.DT; n++; }
      if (n >= 4) acc = 0;
      updateParts(rdt * timeScale);
      phaseT += rdt;
      if (hopT < 1) hopT = Math.min(1, hopT + rdt * 2.5);
      if (phase === 'intro' && phaseT > 1.6) { phase = 'aim'; cam.mode = 'aim'; }
      if (phase === 'won' && !overlay) {
        bonusT += rdt;
        if (phaseT < 0.05) { bonusAdded = 0; bonusT = 0; }
        if (bonusQ.length && bonusT > 0.45) {
          bonusT = 0; const k = bonusQ.shift(); bonusAdded++;
          const n2 = k - world.shotIdx;
          SFX.bonus(); popup(-1.3 - n2 * 0.85, 1.2, '+10000', '#ffe066', true); sparks(-1.3 - n2 * 0.85, 0.5, 10);
        }
        if (!bonusQ.length && phaseT > 1.0 + bonusAdded * 0.45) finishLevel(true);
      }
      if (phase === 'lost' && !overlay && phaseT > 1.0) finishLevel(false);
    }
    updateCamera(rdt);
    drawWorld();
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    if (slowmo > 0) { ctx.fillStyle = 'rgba(255,255,255,' + Math.min(0.12, slowmo * 0.15) + ')'; ctx.fillRect(0, 0, W, H); }
    drawHUD();
    if (overlay === 'pause') drawPause();
    else if (overlay === 'result') drawResult(rdt);
  }
  requestAnimationFrame(frame);
}

/* ---------- 測試掛鉤 ---------- */
window.__ss = {
  state() {
    return {
      screen, phase, paused, overlay, level: levelIdx, levels: LV.length,
      shotsLeft: world ? C.shotsLeft(world) : 0, robots: world ? world.robotsAlive : 0, score: world ? C.finalScore(world) : 0,
      bodies: world ? world.bodies.length : 0, awake: world ? C.awakeCount(world) : 0, hero: world ? curHero() : null,
      canAbility: world ? C.canAbility(world) : false, result: result ? { won: result.won, score: result.score, stars: result.stars } : null,
      cam: { x: cam.x, y: cam.y, z: cam.z }, W, H, fps: Math.round(fpsAvg), totalStars: Save.total()
    };
  },
  start(i) { startLevel(i || 0, true); return this.state(); },
  title() { screen = 'title'; world = null; overlay = null; },
  map(wi) { mapWorld = wi || 0; goMap(); },
  launch(angleDeg, power, abilityStep) { return fireShot(angleDeg * Math.PI / 180, power, abilityStep == null ? undefined : abilityStep); },
  ability() { return doAbility(); },
  step(n) { for (let i = 0; i < (n || 1); i++) gameStep(); return this.state(); },
  settle() { let g = 0; while (phase === 'fly' && g++ < 3000) gameStep(); return this.state(); },
  finish() { if (phase === 'won') { bonusQ = []; finishLevel(true); } else if (phase === 'lost') finishLevel(false); return this.state(); },
  replay(i) {
    startLevel(i, true);
    const s = SOL[i];
    if (!s) return { ok: false, reason: 'no solution' };
    for (const sh of s.shots) { fireShot(sh[0] * Math.PI / 180, sh[1], sh[2] < 0 ? undefined : sh[2]); this.settle(); if (phase !== 'aim') break; }
    const st = this.state();
    return { ok: world.robotsAlive === 0, robots: world.robotsAlive, score: C.finalScore(world), expect: s.score, phase };
  },
  slingScreen() { return slingScreen(); },
  pullPx() { return pullPx(); },
  solutions: SOL,
  // 物理檢查：不碰的話 30 秒都不倒；最高速子彈不穿透
  stackTest(i, seconds) {
    const w = C.newWorld(); C.buildLevel(w, LV[i]); w.noSleep = true; w.noDamage = true;
    for (let k = 0; k < (seconds || 30) * 60; k++) C.step(w);
    let md = 0; for (const b of w.bodies) md = Math.max(md, Math.hypot(b.x - b.x0, b.y - b.y0));
    return { maxDisp: md, robots: w.robotsAlive, total: w.robotsTotal };
  },
  tunnelTest() {
    const out = [];
    for (const hero of ['berry', 'tomato', 'chili']) for (const mat of ['rock', 'glass', 'stone']) {
      const w = C.newWorld();
      C.buildLevel(w, { heroes: [hero], build(B) { if (mat === 'rock') B.ledge(6, 6.2, 8); else B.rect(6.1, 0, 0.2, 6, mat, 'tw'); } });
      w.noDamage = true;
      C.launch(w, 0.08, 1);
      const b = w.bodies[w.bodies.length - 1];
      if (hero === 'chili') { const k = 34 / Math.hypot(b.vx, b.vy); b.vx *= k; b.vy *= k; }
      let crossed = false, minX = 1e9;
      let tunnelled = false;
      for (let k = 0; k < 90; k++) {
        const wasHit = b.hit;
        C.step(w);
        if (b.alive && b.x - b.r > 6.2 && b.y < 6) { crossed = true; if (!wasHit && !b.hit) tunnelled = true; }
      }
      out.push({ hero, mat, speed: hero === 'chili' ? 34 : C.VMAX, hitWall: b.hit, crossedAfterKnockingOver: crossed && !tunnelled, tunnelled });
    }
    return out;
  }
};

resize();
requestAnimationFrame((t) => { lastT = t; frame(t); });
</script>
