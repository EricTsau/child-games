<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>打字練功房</title>
<link rel="stylesheet" href="../../assets/common.css">
<style>
  html, body { height: 100%; overflow: hidden; background: #fbeedb; overscroll-behavior: none; }
  #game { position: fixed; inset: 0; display: block; width: 100vw; height: 100vh; height: 100dvh; touch-action: none; outline: none; }
  button { font-family: var(--kg-font); }
  .pn { position: fixed; inset: 0; z-index: 100; display: none; pointer-events: none; padding: 12px; padding-bottom: calc(12px + env(safe-area-inset-bottom)); }
  .pn.on { display: flex; }
  .cd { pointer-events: auto; background: #fffaf1; border: 4px solid #fff; border-radius: 24px; box-shadow: 0 6px 0 rgba(74,59,82,.15), 0 12px 28px rgba(74,59,82,.18);
        display: flex; flex-direction: column; gap: 10px; padding: 14px; max-height: 100%; min-height: 0; }
  .b { border: 0; border-radius: 16px; font-weight: 900; font-size: 17px; color: #fff; padding: 10px 14px; cursor: pointer; background: linear-gradient(#9ad8ff, #3a9ee8);
       box-shadow: 0 4px 0 #2672ad; transition: transform .08s; text-shadow: 0 1px 0 rgba(0,0,0,.12); }
  .b:active { transform: translateY(3px); box-shadow: 0 1px 0 #2672ad; }
  .b.g { background: linear-gradient(#9be8aa, #46b864); box-shadow: 0 4px 0 #2f8a48; }
  .b.p { background: linear-gradient(#ffb3c9, #e8648d); box-shadow: 0 4px 0 #c24470; }
  .b.y { background: linear-gradient(#ffe58a, #f5b82e); box-shadow: 0 4px 0 #c48a12; color: #6b4a00; text-shadow: none; }
  .b.o { background: linear-gradient(#ffc890, #f08a3c); box-shadow: 0 4px 0 #b85d1c; }
  .b.v { background: linear-gradient(#d2c2ff, #8f6cf0); box-shadow: 0 4px 0 #6447c0; }
  .b.w { background: #fff; color: #4a3b52; box-shadow: 0 4px 0 #e3d6c6; text-shadow: none; }
  .b:disabled { opacity: .45; cursor: default; }
  /* 標題選單 */
  #pTitle { align-items: flex-end; justify-content: center; }
  #pTitle .cd { width: min(520px, 100%); }
  .seg { display: flex; gap: 6px; background: #f1e4d2; border-radius: 16px; padding: 4px; }
  .seg button { flex: 1; border: 0; border-radius: 12px; padding: 8px 6px; font-size: 17px; font-weight: 900; background: transparent; color: #8a7a92; cursor: pointer; }
  .seg button.on { background: #fff; color: #4a3b52; box-shadow: 0 2px 0 #e3d6c6; }
  .seg i { font-style: normal; margin-right: 6px; color: #e8648d; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .mb { display: flex; align-items: center; gap: 10px; text-align: left; padding: 8px 12px; min-height: 58px; }
  .mb .ic { flex: none; width: 36px; height: 36px; border-radius: 12px; background: rgba(255,255,255,.38); display: grid; place-items: center; font-size: 19px; color: inherit; }
  .mb b { display: block; font-size: 18px; line-height: 1.15; }
  .mb small { display: block; font-size: 12px; font-weight: 700; opacity: .92; line-height: 1.25; }
  .mb.big { grid-column: 1 / 3; min-height: 62px; }
  .tg { display: flex; gap: 6px; }
  .tg button { flex: 1; border: 0; border-radius: 999px; padding: 7px 4px; font-weight: 900; font-size: 14px; background: #efe3d3; color: #7a6a86; cursor: pointer; }
  .tg button.on { background: #7bd88f; color: #fff; }
  @media (orientation: landscape) {
    #pTitle { justify-content: flex-end; align-items: center; padding-right: max(14px, env(safe-area-inset-right)); }
    #pTitle .cd { width: min(440px, 50vw); }
  }
  @media (orientation: landscape) and (max-height: 540px) {
    #pTitle { padding-top: 8px; padding-bottom: 8px; }
    #pTitle .cd { gap: 7px; padding: 10px; }
    .mb { min-height: 46px; padding: 5px 10px; }
    .mb.big { min-height: 48px; }
    .mb .ic { width: 30px; height: 30px; font-size: 16px; }
    .mb b { font-size: 16px; }
    .mb small { font-size: 11px; }
    .seg button { padding: 5px 6px; font-size: 16px; }
  }
  /* 列表與結算 */
  #pList, #pRace { justify-content: center; padding-top: 66px; }
  #pList .cd, #pRace .cd { width: min(560px, 100%); }
  #pRace { align-items: center; }
  #pRace .scr { flex: none; }
  .ttl { font-size: 22px; font-weight: 900; text-align: center; margin: 0; }
  .scr { flex: 1; overflow-y: auto; min-height: 0; display: flex; flex-direction: column; gap: 8px; padding: 2px 4px 6px; overscroll-behavior: contain; touch-action: pan-y; }
  .ls { display: flex; align-items: center; gap: 10px; border: 0; background: #fff; border-radius: 16px; padding: 8px 12px; box-shadow: 0 3px 0 #eadccb; cursor: pointer; text-align: left; color: #4a3b52; flex: none; }
  .ls.rec { box-shadow: 0 0 0 3px #ffd65c, 0 3px 0 #eadccb; }
  .ls .n { flex: none; width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; font-weight: 900; color: #fff; font-size: 15px; }
  .ls .tx { flex: 1; min-width: 0; }
  .ls b { display: block; font-size: 17px; }
  .ls small { display: block; font-size: 13px; color: #8a7a92; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ls em { font-style: normal; font-size: 11px; background: #ffd65c; color: #6b4a00; border-radius: 6px; padding: 1px 5px; margin-left: 6px; vertical-align: 2px; }
  .st { flex: none; display: flex; flex-direction: column; align-items: flex-end; gap: 1px; font-size: 11px; color: #8a7a92; font-weight: 700; }
  .st span { display: flex; gap: 1px; }
  .st svg, .bigst svg { width: 18px; height: 18px; }
  .foot { display: flex; gap: 10px; justify-content: center; flex: none; }
  .foot .b { flex: 1; max-width: 220px; }
  #pRes, #pPause { align-items: center; justify-content: center; z-index: 110; background: rgba(60,40,70,.28); pointer-events: auto; }
  #pRes .cd, #pPause .cd { width: min(400px, 100%); }
  .bigst { display: flex; justify-content: center; gap: 8px; }
  .bigst svg { width: 46px; height: 46px; animation: pop .5s cubic-bezier(.3,1.6,.5,1) both; }
  @keyframes pop { from { transform: scale(0) rotate(-40deg); } to { transform: none; } }
  .rows { display: grid; grid-template-columns: auto auto; gap: 4px 14px; justify-content: center; font-size: 17px; overflow-y: auto; min-height: 0; }
  .rows span:nth-child(odd) { color: #8a7a92; font-weight: 700; text-align: right; }
  .rows span:nth-child(even) { font-weight: 900; }
  .sub { text-align: center; color: #8a7a92; font-weight: 700; margin: -4px 0 0; font-size: 15px; }
  .nr { display: inline-block; background: #ff8fb1; color: #fff; border-radius: 8px; padding: 1px 8px; font-size: 14px; margin-left: 4px; }
  .pc { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .op { display: flex; align-items: center; gap: 10px; text-align: left; padding: 6px 10px; }
  .op canvas { flex: none; width: 56px; height: 56px; }
  .op b { display: block; font-size: 17px; }
  .op small { display: block; font-size: 12px; font-weight: 700; opacity: .9; }
  #pStats { align-items: flex-end; justify-content: center; }
  #pStats .cd { flex-direction: row; padding: 8px; gap: 8px; width: min(560px, 100%); }
  #pStats .b { flex: 1; font-size: 15px; padding: 9px 6px; }
  #pauseBtn { position: fixed; top: 68px; right: 10px; z-index: 105; width: 46px; height: 46px; border-radius: 50%; border: 3px solid #fff; background: linear-gradient(#fff, #ffe9f1);
              box-shadow: var(--kg-shadow); display: none; place-items: center; cursor: pointer; padding: 0; }
  #pauseBtn::before { content: ''; width: 14px; height: 16px; border-left: 5px solid #4a3b52; border-right: 5px solid #4a3b52; box-sizing: border-box; }
  @media (orientation: landscape) and (max-height: 560px) {
    #pList, #pRace { padding-top: 8px; }
    #pList .cd, #pRace .cd { width: min(560px, calc(100% - 130px)); }
    #pRes .cd, #pPause .cd { gap: 7px; padding: 10px 14px; }
    .bigst svg { width: 36px; height: 36px; }
    .rows { font-size: 15px; }
  }
</style>
</head>
<body>
<canvas id="game" aria-label="打字練功房：注音與英文打字練習"></canvas>
<button id="pauseBtn" aria-label="暫停"></button>

<div id="pTitle" class="pn"><div class="cd">
  <div class="seg" id="modeSeg"><button data-mode="zh"><i>ㄅㄆㄇ</i>注音</button><button data-mode="en"><i>ABC</i>英文</button></div>
  <div class="grid">
    <button class="b g mb big" data-go="lessons"><span class="ic">練</span><span><b>課程練習</b><small id="lsInfo">從基本列開始，一步一步學指法</small></span></button>
    <button class="b o mb" data-go="rocks"><span class="ic">石</span><span><b>打字落石</b><small>趕快打掉落石</small></span></button>
    <button class="b mb" data-go="race"><span class="ic">跑</span><span><b>打字賽跑</b><small>和兔子比快</small></span></button>
    <button class="b p mb" data-go="daily"><span class="ic">日</span><span><b>每日挑戰</b><small id="dyInfo">一分鐘衝刺</small></span></button>
    <button class="b v mb" data-go="stats"><span class="ic">弱</span><span><b>成績與弱點</b><small>哪個鍵常打錯</small></span></button>
  </div>
  <div class="tg"><button data-tog="music">音樂</button><button data-tog="sfx">音效</button><button data-tog="voice">語音</button></div>
</div></div>

<div id="pList" class="pn"><div class="cd">
  <h2 class="ttl" id="lsTitle">課程</h2>
  <div class="scr" id="lsList"></div>
  <div class="foot"><button class="b w" data-go="title">返回</button></div>
</div></div>

<div id="pRace" class="pn"><div class="cd">
  <h2 class="ttl">選一個對手</h2>
  <div class="scr"><div class="pc" id="opList"></div></div>
  <div class="foot"><button class="b w" data-go="title">返回</button></div>
</div></div>

<div id="pRes" class="pn"><div class="cd">
  <h2 class="ttl" id="rsTitle"></h2>
  <p class="sub" id="rsSub"></p>
  <div class="bigst" id="rsStars"></div>
  <div class="rows" id="rsRows"></div>
  <div class="foot" id="rsBtns"></div>
</div></div>

<div id="pPause" class="pn"><div class="cd">
  <h2 class="ttl">休息一下</h2>
  <button class="b g" data-p="resume">繼續</button>
  <button class="b y" data-p="restart">重新開始</button>
  <div class="tg"><button data-tog="music">音樂</button><button data-tog="sfx">音效</button><button data-tog="voice">語音</button></div>
  <button class="b w" data-p="quit">離開</button>
</div></div>

<div id="pStats" class="pn"><div class="cd">
  <button class="b w" id="stMode">切換</button>
  <button class="b p" id="stWeak">練習弱點</button>
  <button class="b w" data-go="title">返回</button>
</div></div>

<script src="../../assets/common.js"></script>
<script src="../../assets/kg-music.js"></script>
<script>
'use strict';
/* =====================================================================
 * 打字練功房：注音（大千式）與英文打字練習
 * 課程（指法 → 音節 → 常用詞 → 短句）、打字落石、打字賽跑、每日挑戰、弱點熱圖
 * ===================================================================== */
(function () {
const SLUG = 'typing-dojo';
const cv = document.getElementById('game');
const ctx = cv.getContext('2d');
const FONT = '"PingFang TC","Noto Sans TC","Microsoft JhengHei","Heiti TC","WenQuanYi Zen Hei",system-ui,sans-serif';
const TAU = Math.PI * 2, INK = '#3b2f4a';
const $ = id => document.getElementById(id);
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const perf = () => performance.now() / 1000;
const store = { get: (k, d) => KG.store.get(SLUG + ':' + k, d), set: (k, v) => KG.store.set(SLUG + ':' + k, v) };
let W = 390, H = 844, DPR = 1, safeB = 0;
let mode = store.get('mode', 'zh') === 'en' ? 'en' : 'zh';
let sfxOn = store.get('sfx', true) !== false, voiceOn = store.get('voice', true) !== false;

/* ---------- 亂數 ---------- */
function rngOf(seed) {
  let a = seed >>> 0;
  return function () {
    a = (a + 0x6D2B79F5) >>> 0;
    let t = a;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
const R = Math.random;
const pick = (a, r) => a[Math.floor((r || R)() * a.length)];
function shuffle(a, r) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor((r || R)() * (i + 1)); const t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
function hashStr(s) { let h = 2166136261; for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; }

/* =====================================================================
 * 鍵盤：大千式注音（台灣鍵盤上印的那一套）
 * ===================================================================== */
const ROWS = ['1234567890-', 'qwertyuiop', 'asdfghjkl;', 'zxcvbnm,./'];
const ROW_OFF = [0, 0.5, 0.75, 1.25];
// 每 4 個一組 = 鍵盤上同一直行（由上到下），注音照同樣順序
const KCOL = '1qaz2wsx3edc4rfv5tgb6yhn7ujm8ik,9ol.0p;/-';
const ZHU = 'ㄅㄆㄇㄈㄉㄊㄋㄌˇㄍㄎㄏˋㄐㄑㄒㄓㄔㄕㄖˊㄗㄘㄙ˙ㄧㄨㄩㄚㄛㄜㄝㄞㄟㄠㄡㄢㄣㄤㄥㄦ';
const TONES = 'ˊˇˋ˙';
// 手指：0 左小指 1 左無名指 2 左中指 3 左食指 4 大拇指 5 右食指 6 右中指 7 右無名指 8 右小指
const FCOL = ['#ff6f9c', '#ff9a3d', '#f2bd22', '#35bf63', '#9b7bff', '#2ea4ee', '#f2bd22', '#ff9a3d', '#ff6f9c'];
const FNAME = ['左手小指', '左手無名指', '左手中指', '左手食指', '大拇指', '右手食指', '右手中指', '右手無名指', '右手小指'];
const K2Z = {}, Z2K = { 'ˉ': ' ' }, FING = { ' ': 4 };
for (let i = 0; i < KCOL.length; i++) {
  K2Z[KCOL[i]] = ZHU[i]; Z2K[ZHU[i]] = KCOL[i];
  FING[KCOL[i]] = [0, 1, 2, 3, 3, 5, 5, 6, 7, 8, 8][i >> 2];
}
const CODE = { Space: ' ', Minus: '-', Semicolon: ';', Comma: ',', Period: '.', Slash: '/' };
for (let d = 0; d < 10; d++) CODE['Digit' + d] = '' + d;
for (const c of 'abcdefghijklmnopqrstuvwxyz') CODE['Key' + c.toUpperCase()] = c;
function mixHex(a, b, t) {
  const x = parseInt(a.slice(1), 16), y = parseInt(b.slice(1), 16);
  const f = s => Math.round(((x >> s) & 255) * (1 - t) + ((y >> s) & 255) * t);
  return 'rgb(' + f(16) + ',' + f(8) + ',' + f(0) + ')';
}
const FPAST = FCOL.map(c => mixHex(c, '#ffffff', 0.7));
const FDARK = FCOL.map(c => mixHex(c, '#3b2f4a', 0.25));
const FLIGHT = FCOL.map(c => mixHex(c, '#ffffff', 0.6));
function keyLabel(k) {
  if (k === ' ') return mode === 'zh' ? '空白（一聲）' : 'space';
  return mode === 'zh' ? K2Z[k] : (/[a-z]/.test(k) ? k.toUpperCase() : k);
}
function keyName(k) { // 給人看的鍵名
  if (k === ' ') return mode === 'zh' ? '空白鍵（一聲）' : '空白鍵';
  return mode === 'zh' ? K2Z[k] + '（' + k.toUpperCase() + '）' : k.toUpperCase();
}

/* =====================================================================
 * 內容：音節、常用詞、短句（注音照教育部字典，不用輕聲字）
 * ===================================================================== */
const SY1 = '八ㄅㄚ 媽ㄇㄚ 大ㄉㄚˋ 他ㄊㄚ 拿ㄋㄚˊ 拉ㄌㄚ 馬ㄇㄚˇ 爸ㄅㄚˋ 喝ㄏㄜ 車ㄔㄜ 貓ㄇㄠ 狗ㄍㄡˇ 好ㄏㄠˇ 手ㄕㄡˇ 山ㄕㄢ 人ㄖㄣˊ 書ㄕㄨ 五ㄨˇ 魚ㄩˊ 雨ㄩˇ 一ㄧ 吃ㄔ 四ㄙˋ 十ㄕˊ 日ㄖˋ 白ㄅㄞˊ 黑ㄏㄟ 飛ㄈㄟ 風ㄈㄥ 草ㄘㄠˇ 走ㄗㄡˇ 茶ㄔㄚˊ 冷ㄌㄥˇ 熱ㄖㄜˋ 糖ㄊㄤˊ 門ㄇㄣˊ 早ㄗㄠˇ 愛ㄞˋ 二ㄦˋ 三ㄙㄢ 南ㄋㄢˊ 北ㄅㄟˇ 藍ㄌㄢˊ 綠ㄌㄩˋ 看ㄎㄢˋ 跑ㄆㄠˇ 哭ㄎㄨ 米ㄇㄧˇ 你ㄋㄧˇ 西ㄒㄧ 七ㄑㄧ 鵝ㄜˊ 歐ㄡ 安ㄢ 高ㄍㄠ 開ㄎㄞ 來ㄌㄞˊ 去ㄑㄩˋ 布ㄅㄨˋ 怕ㄆㄚˋ'
  .split(' ').map(t => ({ w: t[0], z: [t.slice(1)] }));
const SY2 = '花ㄏㄨㄚ 牛ㄋㄧㄡˊ 鳥ㄋㄧㄠˇ 水ㄕㄨㄟˇ 火ㄏㄨㄛˇ 天ㄊㄧㄢ 心ㄒㄧㄣ 月ㄩㄝˋ 我ㄨㄛˇ 家ㄐㄧㄚ 雲ㄩㄣˊ 六ㄌㄧㄡˋ 九ㄐㄧㄡˇ 紅ㄏㄨㄥˊ 東ㄉㄨㄥ 熊ㄒㄩㄥˊ 果ㄍㄨㄛˇ 麵ㄇㄧㄢˋ 球ㄑㄧㄡˊ 笑ㄒㄧㄠˋ 跳ㄊㄧㄠˋ 聽ㄊㄧㄥ 說ㄕㄨㄛ 寫ㄒㄧㄝˇ 坐ㄗㄨㄛˋ 羊ㄧㄤˊ 光ㄍㄨㄤ 電ㄉㄧㄢˋ 星ㄒㄧㄥ 學ㄒㄩㄝˊ 船ㄔㄨㄢˊ 春ㄔㄨㄣ 秋ㄑㄧㄡ 冬ㄉㄨㄥ 夏ㄒㄧㄚˋ 雪ㄒㄩㄝˇ 窗ㄔㄨㄤ 快ㄎㄨㄞˋ 錢ㄑㄧㄢˊ 香ㄒㄧㄤ'
  .split(' ').map(t => ({ w: t[0], z: [t.slice(1)] }));

function mkZh(w, zs) {
  const it = { type: 'zh', text: w, chars: [], keys: [], cellOf: [] };
  for (let i = 0; i < w.length; i++) {
    const syms = [...zs[i]];
    if (TONES.indexOf(syms[syms.length - 1]) < 0) syms.push('ˉ'); // 一聲打空白鍵
    const c = { ch: w[i], syms, start: it.keys.length, popT: -9 };
    for (const s of syms) { it.keys.push(Z2K[s]); it.cellOf.push(i); }
    it.chars.push(c);
  }
  return it;
}

}

/* =====================================================================
 * 打字核心：一串題目，記錄正確率、速度、打錯的鍵
 * press 回傳：1 打錯 2 對 3 完成一個字（注音） 4 完成一題 5 全部完成
 * ===================================================================== */
function Typer(items) {
  this.items = items; this.i = 0; this.p = 0; this.ok = 0; this.bad = 0; this.units = 0;
  this.act = 0; this.last = 0; this.streak = 0; this.best = 0; this.heat = {}; this.total = 0; this.done = 0;
  this.itemErr = 0; this.cleanItems = 0; this.popCi = -1;
  for (const it of items) this.total += it.keys.length;
}
Typer.prototype.cur = function () { return this.items[this.i] || null; };
Typer.prototype.expect = function () { const it = this.items[this.i]; return it ? it.keys[this.p] : null; };
Typer.prototype.press = function (k, t) {
  const it = this.items[this.i];
  if (!it) return 0;
  if (this.last) this.act += Math.min(2.5, t - this.last); // 停下來想很久不算進速度
  this.last = t;
  const exp = it.keys[this.p], h = this.heat[exp] || (this.heat[exp] = [0, 0]);
  this.popCi = -1;
  if (k !== exp) { h[1]++; this.bad++; this.streak = 0; this.itemErr++; return 1; }
  h[0]++; this.ok++; this.done++; this.p++; this.streak++;
  if (this.streak > this.best) this.best = this.streak;
  let r = 2;
  if (it.type === 'zh') {
    const ci = it.cellOf[this.p - 1];
    if (this.p === it.keys.length || it.cellOf[this.p] !== ci) { it.chars[ci].popT = t; this.units++; this.popCi = ci; r = 3; }
  } else this.units++;
  if (this.p >= it.keys.length) {
    if (!this.itemErr) this.cleanItems++; else this.cleanItems = 0;
    this.itemErr = 0; this.i++; this.p = 0;
    r = this.i >= this.items.length ? 5 : 4;
  }
  return r;
};
Typer.prototype.acc = function () { const n = this.ok + this.bad; return n ? this.ok / n : 1; };
Typer.prototype.speed = function (unit) { // unit: 'wpm' 'cpm'
  if (this.ok < 3 || this.act < 1) return 0;
  const per = this.units / (this.act / 60);
  return unit === 'wpm' ? per / 5 : per;
};

  const mg = A.createGain(); mg.gain.setValueAtTime(f * 1.1, t); mg.gain.exponentialRampToValueAtTime(f * 0.04, t + 0.5);
  m.connect(mg); mg.connect(c.frequency); c.connect(lp);
  const tn = A.createOscillator(); tn.frequency.value = f * 7;
  const tg = A.createGain(); tg.gain.setValueAtTime(0.22, t); tg.gain.exponentialRampToValueAtTime(0.0001, t + 0.05);

  c.start(t); m.start(t); tn.start(t); c.stop(end); m.stop(end); tn.stop(t + 0.07);
};

    if (k === 'turtle') drawTurtle(g, 26, 46, 0.72, 0, false);
    else if (k === 'rabbit') drawRabbit(g, 28, 52, 0.5, 0, false, false);
    else if (k === 'cat') drawCat(g, 20, 50, 0.55, 0, false);
    else drawBear(g, 28, 54, 0.5, 0, { pal: GHOST, alpha: 0.8 });
    b.appendChild(c);
    const sp = document.createElement('span'); sp.innerHTML = '<b></b><small></small>';
    sp.firstChild.textContent = OPP[k].name;
    sp.lastChild.textContent = k === 'ghost' ? (gh ? '最佳 ' + gh.d.toFixed(1) + ' 秒' : '先贏一場') : OPP[k].desc;
    b.appendChild(sp);
    if (k === 'ghost' && !gh) b.disabled = true;
    b.addEventListener('click', () => { sfx('select'); raceStart(k); });
    box.appendChild(b);
  }
}
let resBtns = [];
function showResult(o) {
  $('pauseBtn').style.display = 'none';
  $('rsTitle').textContent = o.title;
  $('rsSub').innerHTML = ''; $('rsSub').textContent = o.sub || '';
  if (o.rec) { const s = document.createElement('span'); s.className = 'nr'; s.textContent = '新紀錄'; $('rsSub').appendChild(s); }
  const st = $('rsStars');
  st.innerHTML = o.stars == null ? '' : [0, 1, 2].map(i => starSvg(i < o.stars).replace('<svg', '<svg style="animation-delay:' + (0.15 + i * 0.18) + 's"')).join('');
  st.style.display = o.stars == null ? 'none' : 'flex';
  const rows = $('rsRows'); rows.textContent = '';
  for (const r of o.rows) { const a = document.createElement('span'), b = document.createElement('span'); a.textContent = r[0]; b.textContent = r[1]; rows.appendChild(a); rows.appendChild(b); }
  const bb = $('rsBtns'); bb.textContent = ''; resBtns = [];
  for (const b of o.btns) {
    const e = document.createElement('button'); e.className = 'b ' + b[1]; e.textContent = b[0];
    e.addEventListener('click', () => { sfx('ui'); b[2](); });
    bb.appendChild(e); resBtns.push(b[2]);
  }
  showPanel('pRes');
  if (o.stars) for (let i = 0; i < o.stars; i++) setTimeout(() => sfx('star', { pitch: 1 + i * 0.12 }), 500 + i * 180);
  if (o.stars === 3) setTimeout(() => KG.confetti(), 400);
}
function pauseGame() {
  if (!PLAY[scene] || paused || $('pRes').classList.contains('on')) return;
  paused = true; M.pause(); refreshToggles(); showPanel('pPause'); sfx('back');
}
function resumeGame() {
  if (!paused) return;
  paused = false; showPanel(null); M.resume(); sfx('ui');
  const t = perf();
  if (scene === 'practice') PR.T.last = t; else if (scene === 'race') RC.T.last = t; else if (scene === 'daily') DY.T.last = t;
  want();
}
function restartScene() {
  paused = false; M.resume();
  if (scene === 'practice') startLesson(PR.les, PR.weak);
  else if (scene === 'rocks') rocksStart();
  else if (scene === 'race') raceStart(RC.opp);
  else if (scene === 'daily') dailyStart();
}
function quitScene() {
  paused = false; M.resume();
  if (scene === 'practice') { saveHeat(PR.T.heat); openLessons(); }
  else { if (scene === 'rocks') { RK.stop = true; saveHeat(RK.T.heat); } goTitle(); }
}

/* ---------- 按鈕事件 ---------- */
document.addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  if (b.dataset.mode) { if (mode !== b.dataset.mode) { mode = b.dataset.mode; store.set('mode', mode); sfx('select'); refreshToggles(); refreshTitleInfo(); MW.clear(); } return; }
  if (b.dataset.tog) {
    const k = b.dataset.tog;
    if (k === 'music') M.setEnabled(!M.isEnabled());
    else if (k === 'sfx') { sfxOn = !sfxOn; store.set('sfx', sfxOn); }
    else { voiceOn = !voiceOn; store.set('voice', voiceOn); if (!voiceOn && window.speechSynthesis) speechSynthesis.cancel(); }
    refreshToggles(); sfx('ui'); return;
  }
  const go = b.dataset.go;
  if (go) {
    sfx(go === 'title' ? 'back' : 'select');
    if (go === 'title') goTitle();
    else if (go === 'lessons') openLessons();
    else if (go === 'rocks') rocksStart();
    else if (go === 'race') openRaceSel();
    else if (go === 'daily') dailyStart();
    else if (go === 'stats') openStats();
    return;
  }
  const p = b.dataset.p;
  if (p === 'resume') resumeGame(); else if (p === 'restart') { sfx('ui'); restartScene(); } else if (p === 'quit') { sfx('back'); quitScene(); }
});
$('pauseBtn').addEventListener('click', pauseGame);
$('stMode').addEventListener('click', () => { mode = mode === 'zh' ? 'en' : 'zh'; store.set('mode', mode); sfx('select'); openStats(); });
$('stWeak').addEventListener('click', () => {
  const m = store.get('heat', {})[mode] || {}, wk = worstKeys(m, 3).slice(0, 6);
  if (wk.length < 2) { sfx('error'); KG.toast('再多練習一些，才知道弱點喔！'); return; }
  sfx('select');
  startLesson({ id: 'weak', t: '弱點加強', k: 'drill', keys: wk.join('') }, true);
});

/* =====================================================================
 * 輸入：實體鍵盤（用 e.code 對應位置，不用開中文輸入法）＋觸控螢幕鍵盤
 * ===================================================================== */
const EN_OK = 'abcdefghijklmnopqrstuvwxyz ;,./';
function typingActive() {
  if (paused) return false;
  return (scene === 'practice') || (scene === 'rocks' && !RK.stop) || (scene === 'race' && RC.state === 'run') || (scene === 'daily' && DY.state === 'run');
}
function inputKey(k) {
  const t = perf();
  pressT[k] = t; pulseUntil = t + 1.6;
  sfx('key', { pitch: 0.94 + R() * 0.12, pan: keyPan(k), vol: 0.9 });
  if (scene === 'practice') onPracticeKey(k, t);
  else if (scene === 'rocks') rocksKey(k, t);
  else if (scene === 'race') raceKey(k, t);
  else if (scene === 'daily') dailyKey(k, t);
  animTo(1.7);
}
window.addEventListener('keydown', e => {
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  if (e.key === 'Escape') {
    if (paused) { resumeGame(); e.preventDefault(); } else if (PLAY[scene]) { pauseGame(); e.preventDefault(); }
    return;
  }
  if ($('pRes').classList.contains('on')) { if (e.key === 'Enter' && resBtns[0] && !e.repeat) { e.preventDefault(); resBtns[0](); } return; }
  if (!PLAY[scene] || paused) return;
  let k = null;
  if (mode === 'en' && e.key && e.key.length === 1 && EN_OK.indexOf(e.key.toLowerCase()) >= 0) k = e.key.toLowerCase();
  if (k == null) k = CODE[e.code] || null;
  if (k == null && e.key && Z2K[e.key]) k = Z2K[e.key];
  if (k == null && e.key && e.key.length === 1 && KCOL.indexOf(e.key) >= 0) k = e.key;
  if (k == null && e.key === ' ') k = ' ';
  if (k == null) return;
  e.preventDefault();
  if (e.repeat || !typingActive()) return;
  if (mode === 'en' && !KB.map[k]) return;
  inputKey(k);
});
cv.addEventListener('pointerdown', e => {
  if (!typingActive()) return;
  const r = cv.getBoundingClientRect();
  const x = (e.clientX - r.left) * W / r.width, y = (e.clientY - r.top) * H / r.height;
  const k = keyAt(x, y);
  if (k != null) { e.preventDefault(); inputKey(k); }
});

/* ---------- 版面 ---------- */
function layout() {
  if (scene === 'practice') layoutPractice();
  else if (scene === 'rocks') layoutRocks();
  else if (scene === 'race') layoutRace();
  else if (scene === 'daily') layoutDaily();
  else if (scene === 'stats') layoutStats();
  else layoutTitle();
}
function resize() {
  const r = cv.getBoundingClientRect();
  W = Math.max(280, Math.round(r.width)); H = Math.max(280, Math.round(r.height));
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
  const probe = document.createElement('div'); probe.style.cssText = 'position:fixed;bottom:0;height:env(safe-area-inset-bottom);visibility:hidden';
  document.body.appendChild(probe); safeB = Math.min(40, probe.getBoundingClientRect().height || 0); probe.remove();
  if (GA.dpr !== DPR) { gaReset(); GA.dpr = DPR; }
  for (const rk of RK.rocks) { rk.o = null; if (rk.on) renderRock(rk); }
  layout(); want();
  if (scene === 'practice') warmWin('practice', PR.T, true); else if (scene === 'race') warmWin('race', RC.T, true); else if (scene === 'daily') warmWin('daily', DY.T, true);
}
let rzT = 0;
function onResize() { clearTimeout(rzT); rzT = setTimeout(resize, 60); }
window.addEventListener('resize', onResize);
window.addEventListener('orientationchange', onResize);
if (window.visualViewport) window.visualViewport.addEventListener('resize', onResize);
document.addEventListener('visibilitychange', () => {
  if (document.hidden) { if (PLAY[scene] && !paused && !$('pRes').classList.contains('on')) pauseGame(); }
  else want();
});

/* ---------- 測試掛鉤 ---------- */
window.__td = {
  state: () => ({ scene, mode, paused, expect: scene === 'rocks' ? rocksHint() : scene === 'practice' ? PR.T.expect() : scene === 'race' ? RC.T.expect() : scene === 'daily' ? DY.T.expect() : null,
    rk: { level: RK.level, score: RK.score, hearts: RK.hearts, rocks: RK.rocks.filter(r => r.on).length, cleared: RK.cleared },
    race: { state: RC.state, op: RC.op, pp: RC.T ? RC.T.done / RC.T.total : 0 }, music: M.isPlaying(), parts: pAlive }),
  key: k => inputKey(k),
  auto: n => { for (let i = 0; i < n; i++) { const s = window.__td.state(); if (s.expect == null) break; inputKey(s.expect); } },
  level: n => { RK.level = n; RK.cleared = (n - 1) * 8; M.setTempo(1 + Math.min(0.1, (n - 1) * 0.015)); },
  spawn: n => { for (let i = 0; i < n; i++) spawnRock(); },
  drop: () => RK.rocks.forEach(r => { if (r.on) r.fy = 0.995; }),
  finish: () => { if (scene === 'practice') { const T = PR.T; while (T.cur()) { inputKey(T.expect()); } } },
  go: (s, a) => ({ title: goTitle, lessons: openLessons, rocks: rocksStart, race: () => raceStart(a || 'turtle'), daily: dailyStart, stats: openStats, lesson: () => startLesson(LESSONS[mode][a || 0]) })[s](),
  setMode: m => { mode = m; store.set('mode', m); refreshToggles(); },
  skipCount: () => { RC.cT = 0.01; DY.cT = 0.01; },
  ft: () => { const n = Math.min(ftN, 4096), a = Array.from(FT.subarray(0, n)).sort((x, y) => x - y); ftN = 0; const q = f => a[Math.min(n - 1, Math.floor(n * f))] || 0; return { n, p50: q(0.5), p95: q(0.95), max: a[n - 1] || 0 }; },
  perf: () => { const r = { avg: frameN ? frameMs / frameN : 0, max: frameMax, n: frameN }; frameMs = 0; frameMax = 0; frameN = 0; return r; },
  pause: () => pauseGame(), resume: () => resumeGame(),
  rocks: () => RK.rocks.filter(r => r.on).map(r => ({ t: r.it.text, p: r.p, fy: +r.fy.toFixed(2), lock: RK.lock === r, dying: r.dying, x: Math.round(r.x), y: Math.round(r.y) })),
  fontNow: () => { const T = scene === 'practice' ? PR.T : scene === 'race' ? RC.T : scene === 'daily' ? DY.T : null; const it = T && T.cur(); return it ? fontsFor(scene, it)[0] : null; },
  keyRect: k => { const r = KB.map[k]; return r ? { x: r.x + r.w / 2, y: r.y + r.h / 2 } : null; },
  data: { SY1, SY2, W1, W2, SEN, K2Z, Z2K, FING, LESSONS, SONGS: { SONG_MENU, SONG_LESSON, SONG_ROCKS, SONG_RACE } }
};

/* ---------- 開始 ---------- */
resize();
goTitle();
window.__tdReady = performance.now();
// 標題出現後，空閒時間先畫好會在遊戲迴圈裡出現的標語字形
for (const t of ['開始！', '超前了！', '被追過了，加油！', '兔子嚇醒了！', '兔子在睡午覺……', '哎呀，掉下來了', '小心！只剩 1 顆愛心', '村子被石頭擋住了！', '金石頭！愛心 +1', '全對！好棒']) warm({ type: 'str', text: t }, 22);
for (let d = 0; d <= 9; d++) warm({ type: 'str', text: '' + d }, 70);
})();
</script>
