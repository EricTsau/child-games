<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>英文字母樂園</title>
<link rel="stylesheet" href="../../assets/common.css">
<style>
  /* ===== 遊戲共用 UI 套件（標題、關卡、結算、特效） ===== */
  :root { --k-main: #ff7eb0; --k-dark: #7a2f57; --k-light: #fff0f6; --k-accent: #ffd34d; }
  /* ===== 遊戲共用 UI 套件（標題、關卡、結算、特效） ===== */
  :root { --k-main: #ff7eb0; --k-dark: #7a2f57; --k-light: #fff0f6; --k-accent: #ffd34d; }
  .kit-hidden-defs { position: absolute; width: 0; height: 0; overflow: hidden; }
  .kit-title {
    position: fixed; inset: 0; z-index: 8900; display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: clamp(4px, 1.6vh, 16px); padding: 64px 16px max(18px, env(safe-area-inset-bottom)); overflow: hidden;
    transition: opacity .35s ease, transform .35s ease;
  }
  .kit-title.out, .kit-screen.out { opacity: 0; transform: scale(1.06); pointer-events: none; }
  .kit-tdeco { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
  .kit-logo { position: relative; animation: kit-drop .9s cubic-bezier(.2,1.6,.4,1) both; }
  .kit-logo-svg { display: block; width: min(92vw, 600px, 75vh); height: auto; overflow: visible; filter: drop-shadow(0 8px 10px rgba(0,0,0,.18)); }
  .kit-logo-svg text { font-family: var(--kg-font); }
  .kit-lc { animation: kit-lc 2.4s ease-in-out infinite; }
  @keyframes kit-lc { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-7px); } }
  @keyframes kit-drop { from { transform: translateY(-50px) scale(.6); opacity: 0; } to { transform: none; opacity: 1; } }
  .kit-hero { position: relative; width: min(72vw, 40vh, 330px); aspect-ratio: 1; display: grid; place-items: center; animation: kit-drop 1s .15s cubic-bezier(.2,1.6,.4,1) both; }
  .kit-hero > svg, .kit-hero > canvas { width: 100%; height: 100%; overflow: visible; display: block; }
  .kit-tbtns { display: flex; gap: 14px; flex-wrap: wrap; justify-content: center; animation: kit-drop 1s .3s cubic-bezier(.2,1.6,.4,1) both; }
  .kit-tsub { font-size: 17px; font-weight: 800; color: var(--k-dark); background: rgba(255,255,255,.8); border-radius: 999px; padding: 6px 16px; text-align: center; max-width: 92vw; animation: kit-drop 1s .4s both; }
  .kit-bigbtn {
    font-family: var(--kg-font); font-weight: 900; font-size: clamp(24px, 6.5vw, 32px); color: #fff; letter-spacing: 2px;
    border: 5px solid #fff; border-radius: 999px; padding: 10px 32px 10px 18px; min-height: 72px;
    display: inline-flex; align-items: center; gap: 8px; cursor: pointer; position: relative;
    background: linear-gradient(180deg, #8ff0a4 0%, #3fbf63 55%, #2fa552 100%);
    box-shadow: 0 8px 0 #22803f, 0 14px 24px rgba(20,90,40,.35), inset 0 4px 0 rgba(255,255,255,.55);
    text-shadow: 0 3px 0 rgba(0,0,0,.22); animation: kit-pulse 1.6s ease-in-out infinite;
  }
  .kit-bigbtn svg { width: 40px; height: 40px; flex: 0 0 auto; filter: drop-shadow(0 3px 0 rgba(0,0,0,.18)); }
  .kit-bigbtn:active { transform: translateY(6px) scale(.97); box-shadow: 0 2px 0 #22803f, 0 4px 8px rgba(20,90,40,.35); animation: none; }
  .kit-bigbtn.alt { background: linear-gradient(180deg, #a6dcff 0%, #3a9ee8 60%, #2f86cc 100%); box-shadow: 0 8px 0 #2268a3, 0 14px 24px rgba(30,80,140,.35), inset 0 4px 0 rgba(255,255,255,.55); animation-delay: .4s; }
  .kit-bigbtn.alt:active { box-shadow: 0 2px 0 #2268a3; }
  .kit-bigbtn.pink { background: linear-gradient(180deg, #ffb3d1 0%, #ff6fa5 60%, #e8558d 100%); box-shadow: 0 8px 0 #b83a6c, 0 14px 24px rgba(160,40,90,.35), inset 0 4px 0 rgba(255,255,255,.55); }
  .kit-bigbtn.pink:active { box-shadow: 0 2px 0 #b83a6c; }
  .kit-bigbtn.small { font-size: 22px; min-height: 60px; padding: 8px 24px 8px 14px; }
  .kit-bigbtn.small svg { width: 30px; height: 30px; }
  @keyframes kit-pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.05); } }

  /* 關卡選擇 */
  .kit-screen {
    position: fixed; inset: 0; z-index: 8900; overflow-y: auto; overflow-x: hidden; -webkit-overflow-scrolling: touch;
    padding: 70px 14px max(20px, env(safe-area-inset-bottom)); display: flex; flex-direction: column; align-items: center;
    transition: opacity .3s ease, transform .3s ease; touch-action: pan-y;
  }
  .kit-banner {
    position: relative; display: inline-block; color: #fff; font-size: clamp(24px, 6.5vw, 32px); font-weight: 900; letter-spacing: 2px;
    padding: 8px 34px; border-radius: 16px; border: 4px solid #fff; background: linear-gradient(180deg, var(--k-main), var(--k-dark));
    box-shadow: 0 6px 0 rgba(0,0,0,.18), 0 10px 18px rgba(0,0,0,.18); text-shadow: 0 3px 0 rgba(0,0,0,.25); animation: kit-drop .6s both cubic-bezier(.2,1.6,.4,1);
  }
  .kit-banner::before, .kit-banner::after { content: ''; position: absolute; top: 14px; width: 26px; height: 100%; background: var(--k-dark); z-index: -1; border-radius: 4px; }
  .kit-banner::before { left: -18px; clip-path: polygon(0 0, 100% 0, 100% 100%, 0 100%, 40% 50%); }
  .kit-banner::after { right: -18px; clip-path: polygon(0 0, 100% 0, 60% 50%, 100% 100%, 0 100%); }
  .kit-total { margin-top: 10px; display: inline-flex; align-items: center; gap: 6px; font-size: 20px; font-weight: 900; color: var(--k-dark);
    background: rgba(255,255,255,.9); border: 3px solid #fff; border-radius: 999px; padding: 3px 14px 3px 6px; box-shadow: 0 4px 0 rgba(0,0,0,.12); }
  .kit-total svg { width: 30px; height: 30px; }
  .kit-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 14px; width: min(640px, 100%); margin: 16px auto 8px; }
  .kit-lv {
    position: relative; aspect-ratio: 1 / 1.08; border-radius: 26px; border: 5px solid #fff; cursor: pointer; font-family: var(--kg-font);
    background: linear-gradient(180deg, #fff 0%, var(--k-light) 100%); color: var(--k-dark);
    box-shadow: 0 7px 0 rgba(0,0,0,.13), 0 12px 20px rgba(0,0,0,.12);
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; padding: 4px;
    animation: kit-drop .5s both cubic-bezier(.2,1.6,.4,1); transition: transform .12s;
  }
  .kit-lv:active { transform: scale(.93); }
  .kit-lv .num {
    width: 58%; aspect-ratio: 1; border-radius: 50%; display: grid; place-items: center; font-size: clamp(26px, 7vw, 36px); font-weight: 900; color: #fff;
    background: radial-gradient(circle at 35% 28%, rgba(255,255,255,.7) 0 12%, transparent 13%), linear-gradient(180deg, var(--k-main), var(--k-dark));
    box-shadow: inset 0 -5px 0 rgba(0,0,0,.15), 0 4px 0 rgba(0,0,0,.12); text-shadow: 0 3px 0 rgba(0,0,0,.25);
  }
  .kit-lv .lname { font-size: 13px; font-weight: 800; line-height: 1.1; text-align: center; max-width: 100%; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  .kit-lv .stars { display: flex; gap: 1px; }
  .kit-lv .stars svg { width: 22px; height: 22px; }
  .kit-lv.locked { background: linear-gradient(180deg, #f2eef6, #ddd6e6); cursor: default; }
  .kit-lv.locked .num { background: linear-gradient(180deg, #cfc6da, #a99dba); }
  .kit-lv .lock { position: absolute; width: 46%; top: 16%; left: 27%; }
  .kit-lv.locked .num span { opacity: 0; }
  .kit-lv.next::after { content: ''; position: absolute; inset: -9px; border-radius: 30px; border: 4px solid var(--k-accent); animation: kit-ring 1.2s ease-in-out infinite; pointer-events: none; }
  @keyframes kit-ring { 0%, 100% { transform: scale(1); opacity: 1; } 50% { transform: scale(1.06); opacity: .5; } }
  .kit-extra { width: min(640px, 100%); }
  .kit-shelf-title { font-size: 18px; font-weight: 900; color: var(--k-dark); margin: 10px 0 6px; text-align: center; }
  .kit-shelf { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }
  .kit-item { width: 84px; border-radius: 20px; border: 4px solid #fff; background: rgba(255,255,255,.85); box-shadow: 0 5px 0 rgba(0,0,0,.12);
    display: flex; flex-direction: column; align-items: center; padding: 4px 2px; font-size: 12px; font-weight: 800; color: var(--k-dark); cursor: pointer; font-family: var(--kg-font); position: relative; }
  .kit-item svg.pv { width: 62px; height: 62px; }
  .kit-item.sel { border-color: var(--k-accent); box-shadow: 0 0 0 3px var(--k-main), 0 5px 0 rgba(0,0,0,.12); }
  .kit-item.locked { filter: grayscale(1); opacity: .6; cursor: default; }
  .kit-item .need { display: flex; align-items: center; gap: 2px; }
  .kit-item .need svg { width: 14px; height: 14px; }

  /* 結算卡 */
  .kit-ov { position: fixed; inset: 0; z-index: 9200; display: grid; place-items: center; padding: 16px; background: rgba(60,40,80,.5); backdrop-filter: blur(3px); animation: kg-fade .25s ease; overflow-y: auto; }
  .kit-rcard {
    position: relative; width: min(420px, 100%); margin-top: 30px; text-align: center; color: var(--k-dark);
    background: linear-gradient(180deg, #fff 0%, var(--k-light) 100%); border: 6px solid #fff; border-radius: 34px; padding: 50px 18px 20px;
    box-shadow: 0 10px 0 rgba(0,0,0,.12), 0 24px 44px rgba(40,20,60,.35); animation: kit-cardin .6s cubic-bezier(.2,1.5,.4,1) both;
  }
  @keyframes kit-cardin { from { transform: translateY(60px) scale(.6); opacity: 0; } to { transform: none; opacity: 1; } }
  .kit-ribbon { position: absolute; left: 50%; top: -34px; transform: translateX(-50%); width: 112%; max-width: 440px; }
  .kit-ribbon svg { width: 100%; height: auto; display: block; overflow: visible; }
  .kit-ribbon svg text { font-family: var(--kg-font); }
  .kit-rstars { display: flex; justify-content: center; align-items: flex-end; gap: 4px; margin: 0 0 6px; }
  .kit-rstar { position: relative; width: 74px; height: 74px; }
  .kit-rstar.mid { width: 96px; height: 96px; margin-bottom: 14px; }
  .kit-rstar svg { position: absolute; inset: 0; width: 100%; height: 100%; }
  .kit-rstar .on { transform: scale(0); }
  .kit-rstar.lit .on { animation: kit-starin .55s cubic-bezier(.2,1.8,.4,1) forwards; }
  @keyframes kit-starin { 0% { transform: scale(0) rotate(-90deg); } 100% { transform: scale(1) rotate(0); } }
  .kit-rhero { width: 120px; height: 120px; margin: -6px auto 2px; }
  .kit-rhero svg { width: 100%; height: 100%; overflow: visible; }
  .kit-rmsg { font-size: 19px; font-weight: 800; line-height: 1.45; margin: 4px 0 12px; }
  .kit-unlock { display: flex; align-items: center; gap: 10px; text-align: left; margin: 0 auto 14px; padding: 8px 12px; border-radius: 20px; border: 3px dashed var(--k-main);
    background: #fff; font-weight: 900; font-size: 17px; animation: kit-drop .6s 1.2s both cubic-bezier(.2,1.6,.4,1); max-width: 340px; }
  .kit-unlock .ic { width: 58px; height: 58px; flex: 0 0 auto; }
  .kit-unlock .ic svg { width: 100%; height: 100%; }
  .kit-rbtns { display: flex; justify-content: center; gap: 14px; flex-wrap: wrap; }
  .kit-rbtn { font-family: var(--kg-font); display: flex; flex-direction: column; align-items: center; gap: 4px; background: none; border: none; cursor: pointer; font-size: 15px; font-weight: 900; color: var(--k-dark); padding: 0; }
  .kit-rbtn .b { width: 70px; height: 70px; border-radius: 50%; border: 4px solid #fff; display: grid; place-items: center; transition: transform .1s; }
  .kit-rbtn .b svg { width: 38px; height: 38px; }
  .kit-rbtn:active .b { transform: translateY(4px) scale(.95); }
  .kit-rbtn.g .b { background: linear-gradient(180deg, #8ff0a4, #34b45a); box-shadow: 0 6px 0 #22803f, 0 10px 16px rgba(0,0,0,.2); }
  .kit-rbtn.y .b { background: linear-gradient(180deg, #ffe58a, #f2a91f); box-shadow: 0 6px 0 #b9790c, 0 10px 16px rgba(0,0,0,.2); }
  .kit-rbtn.b2 .b { background: linear-gradient(180deg, #a6dcff, #3a9ee8); box-shadow: 0 6px 0 #2268a3, 0 10px 16px rgba(0,0,0,.2); }
  .kit-rbtn.big .b { width: 84px; height: 84px; animation: kit-pulse 1.4s ease-in-out infinite; }

  /* HUD */
  .kit-hud { position: fixed; top: 10px; left: 50%; transform: translateX(-50%); z-index: 8000; display: flex; gap: 8px; pointer-events: none; max-width: calc(100vw - 136px); }
  .kit-chip {
    height: 48px; display: inline-flex; align-items: center; gap: 4px; padding: 0 14px 0 6px; border-radius: 999px; white-space: nowrap;
    background: var(--chip-bg, linear-gradient(180deg, #fff, #ffeef6)); border: 4px solid var(--chip-border, #fff); color: var(--k-dark);
    box-shadow: 0 5px 0 rgba(0,0,0,.15), 0 8px 14px rgba(0,0,0,.12); font-size: 20px; font-weight: 900;
  }
  .kit-chip svg { width: 32px; height: 32px; flex: 0 0 auto; }
  .kit-chip.bump { animation: kit-bump .4s cubic-bezier(.2,1.8,.4,1); }
  @keyframes kit-bump { 0% { transform: scale(1); } 40% { transform: scale(1.25); } 100% { transform: scale(1); } }
  .kit-prog { width: 74px; height: 16px; border-radius: 99px; background: rgba(0,0,0,.12); overflow: hidden; box-shadow: inset 0 2px 3px rgba(0,0,0,.15); }
  .kit-prog i { display: block; height: 100%; width: 0; border-radius: 99px; background: linear-gradient(180deg, #ffe680, #ffb21f); box-shadow: inset 0 3px 0 rgba(255,255,255,.5); transition: width .4s cubic-bezier(.2,1.4,.4,1); }

  /* 特效 */
  .kit-fx { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 9250; }
  .kit-float {
    position: fixed; z-index: 9260; pointer-events: none; font-weight: 900; font-size: 30px; color: var(--c, #fff); white-space: nowrap;
    text-shadow: 3px 0 0 var(--o, #6b3a8a), -3px 0 0 var(--o, #6b3a8a), 0 3px 0 var(--o, #6b3a8a), 0 -3px 0 var(--o, #6b3a8a), 2px 2px 0 var(--o, #6b3a8a), -2px 2px 0 var(--o, #6b3a8a), 2px -2px 0 var(--o, #6b3a8a), -2px -2px 0 var(--o, #6b3a8a), 0 6px 0 rgba(0,0,0,.2);
    animation: kit-float 1s ease-out forwards;
  }
  @keyframes kit-float { 0% { transform: translate(-50%, -50%) scale(.4); opacity: 0; } 20% { transform: translate(-50%, -80%) scale(1.25); opacity: 1; } 100% { transform: translate(-50%, -200%) scale(1); opacity: 0; } }
  .kit-callout {
    position: fixed; left: 50%; top: 38%; z-index: 9260; pointer-events: none; white-space: nowrap; letter-spacing: 3px;
    font-size: clamp(40px, 11vw, 74px); font-weight: 900; color: var(--c, #ffd23f);
    text-shadow: 4px 0 0 #fff, -4px 0 0 #fff, 0 4px 0 #fff, 0 -4px 0 #fff, 3px 3px 0 #fff, -3px 3px 0 #fff, 3px -3px 0 #fff, -3px -3px 0 #fff, 0 9px 0 var(--o, #7a2f57), 0 14px 18px rgba(0,0,0,.25);
    animation: kit-callout 1.3s forwards;
  }
  @keyframes kit-callout {
    0% { transform: translate(-50%, -50%) scale(.2) rotate(-12deg); opacity: 0; }
    22% { transform: translate(-50%, -50%) scale(1.18) rotate(3deg); opacity: 1; }
    38% { transform: translate(-50%, -50%) scale(1) rotate(-2deg); }
    80% { opacity: 1; transform: translate(-50%, -55%) scale(1) rotate(0); }
    100% { transform: translate(-50%, -90%) scale(.9); opacity: 0; }
  }
  @media (prefers-reduced-motion: reduce) { .kit-lc, .kit-bigbtn, .kit-rbtn.big .b { animation: none; } }
  .kit-ov { display: flex; flex-direction: column; align-items: center; }
  .kit-ov > * { margin: auto; }
  @media (min-height: 500px) and (max-width: 600px) { body .kit-ov { padding-top: 70px; } }
  @media (max-width: 360px) { .kit-prog { width: 46px; } .kit-chip { font-size: 18px; padding: 0 10px 0 4px; } .kit-chip svg { width: 28px; height: 28px; } .kit-rbtns { gap: 8px; } }
  @media (max-height: 600px) {
    .kit-rhero { display: none; } .kit-rcard { padding: 40px 14px 14px; margin-top: 34px; } .kit-rstar { width: 56px; height: 56px; } .kit-rstar.mid { width: 72px; height: 72px; margin-bottom: 8px; }
    .kit-rmsg { font-size: 15px; line-height: 1.3; margin: 0 0 6px; } .kit-unlock { margin-bottom: 8px; padding: 2px 10px; font-size: 14px; } .kit-unlock .ic { width: 40px; height: 40px; }
    .kit-ov { padding: 8px 16px; } .kit-rstars { margin: 0; } .kit-ribbon { max-width: 360px; top: -28px; }
    .kit-rbtn .b { width: 54px; height: 54px; } .kit-rbtn.big .b { width: 62px; height: 62px; } .kit-rbtn .b svg { width: 30px; height: 30px; } .kit-rbtn { font-size: 13px; }
    .pz-card .ow { width: 70px; height: 70px; } .pz-card { padding: 10px 16px 14px; }
  }

  /* ===== 英文字母樂園 ===== */
  :root {
    --k-main: #7b6cf6; --k-dark: #4433a8; --k-light: #f1efff; --k-accent: #ffb84d;
    --ink: #33306b; --up: #e8558d; --lo: #2f86d8; --hi: #ff8a1f;
  }
  html, body { height: 100%; overflow: hidden; }
  body { background: #e6e9ff; }
  #bg { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; }
  #bg .cl { animation: cl 64s linear infinite; }
  #bg .cl.b { animation-duration: 86s; animation-delay: -40s; }
  #bg .fl { animation: fl 7s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
  #bg .fl:nth-of-type(2n) { animation-duration: 9s; animation-delay: -3s; }
  #bg .fl:nth-of-type(3n) { animation-duration: 11s; animation-delay: -5s; }
  @keyframes cl { from { transform: translateX(-350px); } to { transform: translateX(1150px); } }
  @keyframes fl { 0%, 100% { transform: translateY(0) rotate(-6deg); } 50% { transform: translateY(-22px) rotate(6deg); } }

  #app {
    position: fixed; inset: 0; height: 100vh; height: 100dvh; display: grid; gap: 8px;
    padding: 66px max(10px, env(safe-area-inset-right)) max(10px, env(safe-area-inset-bottom)) max(10px, env(safe-area-inset-left));
    grid-template-columns: minmax(0, 1fr);
    grid-template-rows: auto minmax(0, 1fr) auto;
    grid-template-areas: "prompt" "stage" "opts";
    touch-action: none; user-select: none; -webkit-user-select: none;
  }
  #app.land {
    padding-right: max(66px, env(safe-area-inset-right)); padding-top: 62px;
    grid-template-columns: minmax(0, 1fr) minmax(280px, 44%);
    grid-template-rows: minmax(0, 1fr) auto auto minmax(0, 1fr);
    grid-template-areas: "stage ." "stage prompt" "stage opts" "stage .";
    column-gap: 14px;
  }
  #prompt { grid-area: prompt; display: flex; align-items: center; gap: 4px; margin-right: 54px; min-height: 64px; position: relative; }
  #app.land #prompt { margin-right: 0; align-self: end; }
  #tch { width: 72px; height: 72px; flex: 0 0 auto; position: relative; cursor: pointer; }
  #tch svg { width: 100%; height: 100%; overflow: visible; display: block; }
  #bubble {
    position: relative; flex: 1 1 auto; min-width: 0; background: #fff; border: 4px solid #fff; border-radius: 22px; padding: 7px 10px 7px 12px;
    box-shadow: 0 5px 0 rgba(68,51,168,.16), 0 8px 16px rgba(68,51,168,.14); color: var(--ink); font-weight: 900; font-size: clamp(17px, 4.6vw, 22px); line-height: 1.3;
    display: flex; align-items: center; gap: 8px; animation: bubIn .45s cubic-bezier(.2,1.6,.4,1);
  }
  #bubble::before { content: ''; position: absolute; left: -14px; top: 50%; margin-top: -10px; border: 10px solid transparent; border-right: 12px solid #fff; border-left: 0; }
  #bubble .txt { flex: 1 1 auto; min-width: 0; }
  #bubble .tg { display: inline-block; padding: 0 7px; border-radius: 10px; background: #ecebff; color: #4433a8; white-space: nowrap; }
  #bubble .en { display: inline-block; padding: 0 7px; border-radius: 10px; background: #fff1dc; color: #c25a00; white-space: nowrap; font-family: var(--en-font); letter-spacing: .5px; }
  @keyframes bubIn { from { transform: scale(.7); opacity: 0; } to { transform: none; opacity: 1; } }
  #sayBtn { width: 44px; height: 44px; flex: 0 0 auto; border-radius: 50%; border: 3px solid #fff; cursor: pointer; padding: 7px;
    background: linear-gradient(180deg, #a6dcff, #3a9ee8); box-shadow: 0 4px 0 #2268a3; }
  #sayBtn:active { transform: translateY(3px); box-shadow: 0 1px 0 #2268a3; }
  #sayBtn svg { width: 100%; height: 100%; display: block; }
  /* 沒有英文語音時：老師頭上的文字泡泡 */
  .vpop { position: fixed; z-index: 9240; pointer-events: none; background: #fff; color: #c25a00; border: 4px solid #ffb84d; border-radius: 20px; padding: 4px 14px;
    font-family: var(--en-font); font-weight: 900; font-size: clamp(20px, 5.4vw, 28px); white-space: nowrap; box-shadow: 0 6px 0 rgba(0,0,0,.12), 0 10px 18px rgba(0,0,0,.15);
    transform-origin: 20% 100%; animation: vpop 2.4s ease forwards; max-width: calc(100vw - 24px); overflow: hidden; text-overflow: ellipsis; }
  .vpop::after { content: ''; position: absolute; left: 22px; bottom: -14px; border: 10px solid transparent; border-top: 12px solid #ffb84d; border-bottom: 0; }
  .vpop.up::after { bottom: auto; top: -14px; border-top: 0; border-bottom: 12px solid #ffb84d; }

    box-shadow: 0 10px 0 rgba(0,0,0,.12), 0 24px 44px rgba(30,20,80,.3); animation: kit-cardin .5s cubic-bezier(.2,1.5,.4,1) both; color: var(--ink); }

  @keyframes blink { 0%, 92%, 100% { transform: scaleY(0); } 95% { transform: scaleY(1); } }

  .tch-svg .tuft { transform-box: fill-box; transform-origin: 50% 100%; animation: earW 3.4s ease-in-out infinite; }
  @keyframes earW { 0%, 80%, 100% { transform: none; } 88% { transform: rotate(-12deg); } }

  @keyframes owlBob { 0%, 100% { transform: none; } 50% { transform: translateY(-3px) scaleY(1.02); } }

  .is-happy .tch-svg .body { animation: owlJump .6s cubic-bezier(.3,1.6,.5,1) 2; }
  .is-happy .tch-svg .wingR { animation: wave .3s ease-in-out 4 alternate; }

  .kit-hero .tch-svg, .kit-rhero .tch-svg { width: 100%; height: 100%; }

<script>
/* ===== 遊戲共用 UI 套件 Kit：標題畫面、關卡選擇、結算、圖示、特效、背景音樂 ===== */
const Kit = (function () {
  'use strict';
  /* ---------- 緩動函式 ---------- */
  const E = {
    linear: t => t,
    outQuad: t => 1 - (1 - t) * (1 - t),
    outCubic: t => 1 - Math.pow(1 - t, 3),
    inOut: t => (t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2),
    outBack: t => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); },
    outElastic: t => (t === 0 ? 0 : t === 1 ? 1 : Math.pow(2, -10 * t) * Math.sin((t * 10 - 0.75) * (2 * Math.PI / 3)) + 1),
    outBounce: t => {
      const n1 = 7.5625, d1 = 2.75;
      if (t < 1 / d1) return n1 * t * t;
      if (t < 2 / d1) return n1 * (t -= 1.5 / d1) * t + 0.75;
      if (t < 2.5 / d1) return n1 * (t -= 2.25 / d1) * t + 0.9375;
      return n1 * (t -= 2.625 / d1) * t + 0.984375;
    }
  };
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const lerp = (a, b, t) => a + (b - a) * t;

  /* ---------- 顏色小工具 ---------- */
  function hex2rgb(h) { h = h.replace('#', ''); if (h.length === 3) h = h.split('').map(c => c + c).join(''); const n = parseInt(h, 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; }
  function rgb2hex(r) { return '#' + r.map(v => clamp(Math.round(v), 0, 255).toString(16).padStart(2, '0')).join(''); }
  function mix(a, b, t) { const A = hex2rgb(a), B = hex2rgb(b); return rgb2hex(A.map((v, i) => lerp(v, B[i], t))); }
  const lighten = (c, t) => mix(c, '#ffffff', t);
  const darken = (c, t) => mix(c, '#000000', t);

  /* ---------- 共用 SVG 漸層 ---------- */
  function ensureDefs() {
    if (document.getElementById('kitDefs')) return;
    const d = document.createElement('div');
    d.className = 'kit-hidden-defs';
    d.innerHTML = `<svg id="kitDefs" width="0" height="0" aria-hidden="true"><defs>
      <linearGradient id="kitStarG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff38a"/><stop offset=".55" stop-color="#ffd02e"/><stop offset="1" stop-color="#ff9f1a"/></linearGradient>
      <linearGradient id="kitLockG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffe27a"/><stop offset="1" stop-color="#e9a628"/></linearGradient>
      <linearGradient id="kitGiftG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ff9ccc"/><stop offset="1" stop-color="#e8558d"/></linearGradient>
      <linearGradient id="kitRibbonG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--k-main)"/><stop offset="1" stop-color="var(--k-dark)"/></linearGradient>
    </defs></svg>`;
    document.body.appendChild(d);
  }

  /* ---------- 圖示（全部手繪向量） ---------- */
  const STAR_D = 'M50 7 C53 7 55 9 56 12 L64 31 L85 33 C91 34 93 41 89 45 L73 59 L78 80 C79 86 73 90 68 87 L50 76 L32 87 C27 90 21 86 22 80 L27 59 L11 45 C7 41 9 34 15 33 L36 31 L44 12 C45 9 47 7 50 7 Z';
  const ICON = {
    star: (on = true) => `<svg viewBox="0 0 100 100"><path d="${STAR_D}" transform="translate(0 4)" fill="${on ? '#d9800b' : '#b9afc6'}" opacity=".55"/><path d="${STAR_D}" fill="${on ? 'url(#kitStarG)' : '#e3dcea'}" stroke="${on ? '#c46f00' : '#b4aac2'}" stroke-width="5" stroke-linejoin="round"/>${on ? '<path d="M36 34 Q44 22 54 26" stroke="#fff" stroke-width="7" fill="none" stroke-linecap="round" opacity=".85"/><circle cx="66" cy="44" r="4" fill="#fff" opacity=".7"/>' : ''}</svg>`,
    lock: () => '<svg viewBox="0 0 100 100" class="lock"><path d="M31 46 V33 a19 19 0 0 1 38 0 V46" fill="none" stroke="#8a7a99" stroke-width="11" stroke-linecap="round"/><rect x="18" y="42" width="64" height="48" rx="14" fill="url(#kitLockG)" stroke="#a46f12" stroke-width="5"/><rect x="26" y="48" width="48" height="8" rx="4" fill="#fff" opacity=".45"/><circle cx="50" cy="64" r="7" fill="#8a5a0a"/><rect x="47" y="66" width="6" height="13" rx="3" fill="#8a5a0a"/></svg>',
    play: () => '<svg viewBox="0 0 100 100"><path d="M34 20 Q30 18 30 24 V76 Q30 82 35 79 L80 54 Q85 50 80 46 Z" fill="#fff" stroke="#fff" stroke-width="6" stroke-linejoin="round"/></svg>',
    replay: () => '<svg viewBox="0 0 100 100"><path d="M74 58 A26 26 0 1 1 66 31" fill="none" stroke="#fff" stroke-width="12" stroke-linecap="round"/><path d="M56 16 L80 26 L62 44 Z" fill="#fff" stroke="#fff" stroke-width="6" stroke-linejoin="round"/></svg>',
    next: () => '<svg viewBox="0 0 100 100"><path d="M22 50 H70 M50 28 L74 50 L50 72" stroke="#fff" stroke-width="13" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>',
    back: () => '<svg viewBox="0 0 100 100"><path d="M78 50 H30 M50 28 L26 50 L50 72" stroke="#fff" stroke-width="13" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>',
    menu: () => '<svg viewBox="0 0 100 100"><g fill="#fff"><rect x="18" y="18" width="27" height="27" rx="8"/><rect x="55" y="18" width="27" height="27" rx="8"/><rect x="18" y="55" width="27" height="27" rx="8"/><rect x="55" y="55" width="27" height="27" rx="8"/></g></svg>',
    gift: () => '<svg viewBox="0 0 100 100"><path d="M50 30 C40 10 20 16 28 28 C32 33 44 32 50 30 C56 32 68 33 72 28 C80 16 60 10 50 30 Z" fill="#ffd34d" stroke="#c48a12" stroke-width="4" stroke-linejoin="round"/><rect x="14" y="30" width="72" height="20" rx="6" fill="url(#kitGiftG)" stroke="#a83a6a" stroke-width="4"/><rect x="20" y="48" width="60" height="40" rx="6" fill="url(#kitGiftG)" stroke="#a83a6a" stroke-width="4"/><rect x="44" y="30" width="12" height="58" fill="#ffd34d" stroke="#c48a12" stroke-width="3"/><rect x="24" y="52" width="10" height="20" rx="4" fill="#fff" opacity=".4"/></svg>',
    note: () => '<svg viewBox="0 0 100 100"><path d="M40 70 V24 L78 16 V60" fill="none" stroke="#fff" stroke-width="9" stroke-linejoin="round"/><ellipse cx="32" cy="72" rx="12" ry="9" fill="#fff"/><ellipse cx="70" cy="62" rx="12" ry="9" fill="#fff"/></svg>'
  };
  const starRow = (n, total = 3) => { let s = ''; for (let i = 0; i < total; i++) s += ICON.star(i < n); return s; };

  /* ---------- 標誌文字（每個字分開彈跳） ---------- */
  function logoSVG(text, colors, stroke) {
    const ch = Array.from(text);
    const step = 92, W = ch.length * step + 40;
    let s = `<svg class="kit-logo-svg" viewBox="0 0 ${W} 150" aria-label="${text}"><defs>`;
    colors.forEach((c, i) => {
      s += `<linearGradient id="kitLg${i}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${lighten(c, 0.55)}"/><stop offset=".5" stop-color="${lighten(c, 0.15)}"/><stop offset="1" stop-color="${c}"/></linearGradient>`;
    });
    s += '</defs>';
    ch.forEach((c, i) => {
      const x = 20 + i * step + step / 2, rot = (i % 2 ? 5 : -5);
      s += `<g class="kit-lc" style="animation-delay:${(i * 0.13).toFixed(2)}s"><g transform="rotate(${rot} ${x} 95)">` +
        `<text x="${x}" y="124" text-anchor="middle" font-size="90" font-weight="900" fill="${stroke}" stroke="${stroke}" stroke-width="24" stroke-linejoin="round">${c}</text>` +
        `<text x="${x}" y="114" text-anchor="middle" font-size="90" font-weight="900" fill="#fff" stroke="#fff" stroke-width="22" stroke-linejoin="round">${c}</text>` +
        `<text x="${x}" y="114" text-anchor="middle" font-size="90" font-weight="900" fill="url(#kitLg${i % colors.length})" stroke="${stroke}" stroke-width="7" stroke-linejoin="round" paint-order="stroke">${c}</text>` +
        `</g></g>`;
    });
    return s + '</svg>';
  }

  /* ---------- 背景音樂（用 KG.note 合成） ---------- */
  const Music = (function () {
    let timer = null, step = 0, song = null;
    const mf = m => 440 * Math.pow(2, (m - 69) / 12);
    function tick() {
      if (!song) return;
      const dur = 60 / song.bpm / 2;
      if (!KG.isMuted() && !document.hidden) {
        const m = song.mel[step % song.mel.length];
        if (m) KG.note(mf(m), dur * 1.5, song.wave || 'triangle', song.vol || 0.045);
        if (song.bass && step % 2 === 0) {
          const b = song.bass[(step / 2 | 0) % song.bass.length];
          if (b) KG.note(mf(b), dur * 1.9, 'sine', (song.vol || 0.045) * 1.4);
        }
        if (song.tick && step % 4 === 2) KG.note(2200, 0.03, 'square', 0.012);
      }
      step++;
      timer = setTimeout(tick, dur * 1000);
    }
    return {
      start(s) { this.stop(); song = s; step = 0; timer = setTimeout(tick, 80); },
      stop() { clearTimeout(timer); timer = null; song = null; },
      get playing() { return !!song; }
    };
  })();
  // 幾首可愛的旋律（MIDI 音高，0 = 休止，每格 = 八分音符）
  const SONGS = {
    happy: { bpm: 112, mel: [72, 0, 76, 79, 81, 79, 76, 0, 74, 0, 77, 81, 79, 0, 0, 0, 72, 74, 76, 79, 77, 76, 74, 0, 72, 0, 67, 0, 72, 0, 0, 0], bass: [48, 55, 53, 55, 48, 55, 43, 48], tick: true },
    bouncy: { bpm: 120, mel: [67, 72, 76, 72, 79, 0, 76, 0, 74, 77, 81, 77, 79, 0, 0, 0, 76, 79, 84, 79, 81, 79, 76, 0, 74, 76, 72, 0, 72, 0, 0, 0], bass: [48, 52, 53, 55, 48, 52, 50, 48], tick: true },
    gentle: { bpm: 92, mel: [76, 0, 79, 0, 84, 0, 83, 81, 79, 0, 76, 0, 77, 0, 0, 0, 74, 0, 77, 0, 81, 0, 79, 77, 76, 0, 72, 0, 74, 0, 0, 0], bass: [48, 55, 53, 50, 48, 52, 53, 55], wave: 'sine', vol: 0.05 },
    march: { bpm: 126, mel: [72, 72, 79, 79, 81, 81, 79, 0, 77, 77, 76, 76, 74, 74, 72, 0, 79, 79, 77, 77, 76, 76, 74, 0, 79, 79, 77, 77, 76, 76, 74, 0], bass: [48, 53, 48, 43, 48, 53, 55, 48], tick: true }
  };
  document.addEventListener('visibilitychange', () => { /* tick 內會檢查 document.hidden */ });

  /* ---------- 粒子特效（全螢幕畫布） ---------- */
  const FX = (function () {
    let cv = null, c = null, parts = [], running = false, last = 0;
    const DEF = ['#ff7eb0', '#ffd34d', '#7bd88f', '#6cc4ff', '#b49cff', '#ffa94d'];
    function ensure() {
      if (cv) return;
      cv = document.createElement('canvas');
      cv.className = 'kit-fx';
      document.body.appendChild(cv);
      resize();
      window.addEventListener('resize', resize);
    }
    function resize() {
      const d = window.devicePixelRatio || 1;
      cv.width = innerWidth * d; cv.height = innerHeight * d;
      c = cv.getContext('2d');
      c.setTransform(d, 0, 0, d, 0, 0);
    }
    function starPath(ctx, r) {
      ctx.beginPath();
      for (let i = 0; i < 10; i++) {
        const a = -Math.PI / 2 + i * Math.PI / 5, rr = i % 2 ? r * 0.45 : r;
        ctx.lineTo(Math.cos(a) * rr, Math.sin(a) * rr);
      }
      ctx.closePath();
    }
    function heartPath(ctx, r) {
      ctx.beginPath();
      ctx.moveTo(0, r * 0.9);
      ctx.bezierCurveTo(-r * 1.4, -r * 0.1, -r * 0.7, -r * 1.2, 0, -r * 0.45);
      ctx.bezierCurveTo(r * 0.7, -r * 1.2, r * 1.4, -r * 0.1, 0, r * 0.9);
      ctx.closePath();
    }
    function sparkPath(ctx, r) {
      ctx.beginPath();
      ctx.moveTo(0, -r); ctx.quadraticCurveTo(0, 0, r, 0); ctx.quadraticCurveTo(0, 0, 0, r);
      ctx.quadraticCurveTo(0, 0, -r, 0); ctx.quadraticCurveTo(0, 0, 0, -r); ctx.closePath();
    }
    function draw(ctx, p) {
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(p.rot);
      const s = p.size * (p.grow ? (1 + (1 - p.life) * 1.5) : (0.4 + p.life * 0.6));
      ctx.globalAlpha = Math.min(1, p.life * 1.6);
      ctx.fillStyle = p.color;
      if (p.type === 'star') { starPath(ctx, s); ctx.fill(); ctx.lineWidth = 2; ctx.strokeStyle = 'rgba(255,255,255,.8)'; ctx.stroke(); }
      else if (p.type === 'heart') { heartPath(ctx, s); ctx.fill(); }
      else if (p.type === 'spark') { sparkPath(ctx, s * 1.3); ctx.fill(); }
      else if (p.type === 'ring') { ctx.beginPath(); ctx.arc(0, 0, s, 0, Math.PI * 2); ctx.lineWidth = 4 * p.life; ctx.strokeStyle = p.color; ctx.stroke(); }
      else if (p.type === 'confetti') { ctx.fillRect(-s, -s * 0.5, s * 2, s); }
      else {
        ctx.beginPath(); ctx.arc(0, 0, s, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = 'rgba(255,255,255,.6)'; ctx.beginPath(); ctx.arc(-s * 0.3, -s * 0.3, s * 0.35, 0, Math.PI * 2); ctx.fill();
      }
      ctx.restore();
    }
    function loop(now) {
      const dt = Math.max(0, Math.min(0.05, (now - last) / 1000));
      last = now;
      c.clearRect(0, 0, innerWidth, innerHeight);
      for (let i = parts.length - 1; i >= 0; i--) {
        const p = parts[i];
        p.vy += p.g * dt; p.vx *= Math.pow(p.drag, dt); p.vy *= Math.pow(p.drag, dt);
        p.x += p.vx * dt; p.y += p.vy * dt; p.rot += p.vr * dt;
        p.life -= p.decay * dt;
        if (p.life <= 0) { parts.splice(i, 1); continue; }
        draw(c, p);
      }
      if (parts.length) requestAnimationFrame(loop);
      else { running = false; c.clearRect(0, 0, innerWidth, innerHeight); }
    }
    function burst(x, y, o) {
      o = o || {};
      ensure();
      const n = o.n || 14;
      for (let i = 0; i < n; i++) {
        const a = o.angle != null ? o.angle + KG.rand(-o.spread, o.spread) : Math.random() * Math.PI * 2;
        const sp = KG.rand(o.speed ? o.speed * 0.5 : 120, o.speed || 360);
        const types = o.types || ['star', 'circle', 'heart', 'spark'];

  const dist = (a, b) => Math.hypot(a[0] - b[0], a[1] - b[1]);

  /* =====================================================================
   * 語音：英文用 en-US、說明用 zh-TW；沒有語音時用文字泡泡
   * ===================================================================== */
  let enVoice = null, zhVoice = null, voiceEN = null, voiceZH = null, voiceList = 0;
  function refreshVoices() {
    try {
      if (!window.speechSynthesis) { voiceEN = voiceZH = false; return; }
      const v = speechSynthesis.getVoices() || [];
      voiceList = v.length;
      if (v.length) {
        enVoice = v.find(x => /^en[-_]US/i.test(x.lang)) || v.find(x => /^en/i.test(x.lang)) || null;
        zhVoice = v.find(x => /zh[-_](TW|HK)/i.test(x.lang)) || v.find(x => /^zh/i.test(x.lang)) || null;
        voiceEN = !!enVoice; voiceZH = !!zhVoice;

  refreshVoices();
  try { if (window.speechSynthesis) speechSynthesis.addEventListener('voiceschanged', refreshVoices); } catch (e) { /* 忽略 */ }
  let lastPop = null;
  function voicePop(text, zh) {
    if (lastPop) lastPop.remove();

    document.body.appendChild(el);

    if (!KG.isMuted()) { KG.note(784, 0.08, 'sine', 0.08); KG.note(988, 0.1, 'sine', 0.08, 0.08); }
  }
  /** parts: [['en', 'bee'], ['zh', '答對了']]；英文沒有語音就跳出文字泡泡 */

        u.pitch = 1.15;
        const v = l === 'en' ? enVoice : zhVoice;

  /* ---------- 1. 字母卡 ---------- */

  /* ---------- 作答（選項題） ---------- */
  function answer(i) {

  function finish() {

    KG.note(880, 0.04, 'sine', 0.06);
  });
  cv.addEventListener('pointermove', e => {
    if (!TR.ink || e.pointerId !== TR.pid) return;
    let evs = e.getCoalescedEvents ? e.getCoalescedEvents() : null;
    if (!evs || !evs.length) evs = [e];
    for (const ev of evs) { const p = ptU(ev), l = TR.ink[TR.ink.length - 1]; if (dist(p, l) > 0.5) TR.ink.push(p); }
  });
  const endInk = e => { if (!TR.ink || e.pointerId !== TR.pid) return; const pts = TR.ink; TR.ink = null; if (e.type !== 'pointercancel') evaluateStroke(pts); };
  cv.addEventListener('pointerup', endInk);
  cv.addEventListener('pointercancel', endInk);
  function traceTol() { return (isUp(TR.q.ch) ? 1 : 0.85) * (game.lv === 0 || game.lv === 3 ? 1.12 : 1); }
  function evaluateStroke(pts) {
    if (!traceActive()) return null;
    const res = checkStroke(TR.st[TR.si], pts, traceTol());
    if (res.ok) strokeOK(false); else strokeFail(res.reason, pts);
    return res;
  }
  function strokeOK(auto) {
    const s = TR.st[TR.si];
    TR.flash = { si: TR.si, t0: performance.now() };
    TR.si++; TR.fails = 0; TR.locked = false;
    KG.note(523 + TR.si * 120, 0.14, 'triangle', 0.2); KG.note(1046 + TR.si * 120, 0.12, 'sine', 0.08, 0.06);
    const r = cv.getBoundingClientRect(), e = s[s.length - 1], sc = r.width / TR.S;
    Kit.FX.burst(r.left + (TR.m + e[0] * TR.B / 100) * sc, r.top + (TR.m + e[1] * TR.B / 100) * sc, { n: 8, types: ['star', 'spark'], speed: 220 });
    if (TR.si >= TR.st.length) { if (!TR.auto) mrecL(TR.q.ch, 'tr'); right(cv); }
    else if (!auto) setBubble(`很好！第 ${TR.si + 1} 筆，從${tg('綠色圓點')}開始`);
    else setBubble(`換你寫第 ${TR.si + 1} 筆！`);
  }
  function strokeFail(reason, pts) {
    TR.fails++; TR.symFails++; game.wrong = TR.symFails;
    TR.bad = { pts, t0: performance.now() };
    KG.note(330, 0.16, 'sine', 0.12); tchMood('oops', 900); KG.vibrate(20);
    if (TR.fails >= 3) {
      TR.auto = true;
      setBubble('沒關係，貓頭鷹老師帶你寫這一筆！');
      sayZh('沒關係，我們一起寫');
      playDemo(() => strokeOK(true));
      return;
    }
    const isDot = TR.st[TR.si].length < 2;
    if (isDot) { setBubble(`這一筆是${tg('點')}，在${tg('綠色圓點')}上點一下`); sayZh('在綠色圓點上，點一下'); }
    else if (reason === 'reverse') { setBubble(`方向反了！從${tg('綠色圓點')}開始，跟著箭頭寫`); sayZh('從綠色圓點開始寫喔'); }
    else if (reason === 'tap' || reason === 'short') { setBubble(`按住手指，沿著${tg('灰色的線')}畫過去`); sayZh('按住手指，沿著線畫過去'); }
    else { setBubble(`差一點點！沿著${tg('灰色的線')}再寫一次`); sayZh('差一點點，再寫一次'); }
    playDemo();
  }

  /* =====================================================================
   * 字母歌（公共領域旋律，用 KG.note 合成）
   * ===================================================================== */
  // [歌詞, MIDI 音高, 拍數, 字母索引（-1 = 不是字母）]
  const SONG_RAW = [
    [['A', 60, 1], ['B', 60, 1], ['C', 67, 1], ['D', 67, 1], ['E', 69, 1], ['F', 69, 1], ['G', 67, 2]],
    [['H', 65, 1], ['I', 65, 1], ['J', 64, 1], ['K', 64, 1], ['L', 62, .5], ['M', 62, .5], ['N', 62, .5], ['O', 62, .5], ['P', 60, 2]],
    [['Q', 67, 1], ['R', 67, 1], ['S', 65, 2], ['T', 64, 1], ['U', 64, 1], ['V', 62, 2]],
    [['W', 67, 1], ['', 67, 1], ['', 65, 1], ['X', 65, 1], ['Y', 64, 1], ['and', 64, 1], ['Z', 62, 2]],
    [['Now', 60, 1], ['I', 60, 1], ['know', 67, 1], ['my', 67, 1], ['A', 69, 1], ['B', 69, 1], ['C\'s', 67, 2]],
    [['Next', 65, 1], ['time', 65, 1], ['won\'t', 64, 1], ['you', 64, 1], ['sing', 62, 1], ['with', 62, 1], ['me!', 60, 2]]
  ];
  const CHORDS = [[48, 48, 53, 48], [53, 48, 55, 48], [48, 53, 48, 55], [48, 53, 48, 55], [48, 48, 53, 48], [53, 48, 55, 48]];
  const SONG = [];
  (function () {
    let t = 0, lastL = -1;
    SONG_RAW.forEach((line, li) => {
      const t0 = t;
      line.forEach(([txt, m, b]) => {
        let L = -1;
        if (li < 4) { if (/^[A-Z]$/.test(txt)) lastL = L = UPPER.indexOf(txt); else if (txt === '') L = lastL; }
        const off = t - t0;
        SONG.push({ txt, m, b, t, L, line: li, bass: Number.isInteger(off) && off % 2 === 0 ? CHORDS[li][off / 2] : 0 });
        t += b;
      });
    });
  })();
  const SONG_END = SONG[SONG.length - 1].t + SONG[SONG.length - 1].b;
  const mf = m => 440 * Math.pow(2, (m - 69) / 12);
  const SG = { playing: false, t0: 0, ni: 0, cur: -1, raf: 0, beat: 0.5, done: false };
  function renderSong(q) {
    SG.done = !!q.sung;
    stage.innerHTML = `<div class="song"><div class="lyric" id="lyric">按下播放，一起唱！</div><div class="sgrid">${LETTERS.map((L, i) => `<button class="stl" data-i="${i}" aria-label="${L.U}">${glSVG(L.U, UPC)}</button>`).join('')}</div></div>`;
    stage.querySelectorAll('.stl').forEach(b => b.addEventListener('click', () => {
      const L = LETTERS[+b.dataset.i];
      KG.sound('pop'); talk([['en', `${L.name}. ${L.word}.`, `${L.U}, ${L.word}`]]);
      b.animate([{ transform: 'scale(1)' }, { transform: 'scale(1.25) rotate(-6deg)' }, { transform: 'scale(1)' }], { duration: 380, easing: 'cubic-bezier(.2,1.6,.4,1)' });
      mrecL(L.U, 'seen');
    }));
    navBtn(`${ICON_PLAY}<span>播放字母歌</span>`, 'pink go', songToggle).id = 'songBtn';
    if (SG.done) addSongDone();
    setBubble(`一起唱${tg('字母歌')}！也可以點字母聽一聽。`);
    setTimeout(() => { if (game.q === q) sayZh('按播放，一起唱字母歌！'); }, D(300));
  }
  function addSongDone() {
    if ($('songDone')) return;
    const b = navBtn(`<span>完成</span>${Kit.ICON.next()}`, 'go', () => { if (game.mode === 'play' && !game.busy) { KG.sound('pop'); game.busy = true; finish(); } });
    b.id = 'songDone';
    layout();
  }
  function songToggle() {
    if (game.mode !== 'play' || $('pauseOv')) return;
    if (SG.playing) { songStop(); KG.sound('click'); return; }
    KG.sound('click');
    if (window.speechSynthesis) try { speechSynthesis.cancel(); } catch (e) { /* 忽略 */ }
    Kit.Music.stop();
    SG.playing = true; SG.ni = 0; SG.cur = -1;
    SG.beat = window.__abcFast ? 0.01 : 0.5;
    SG.t0 = performance.now() + 200;
    stage.querySelectorAll('.stl').forEach(b => b.classList.remove('on', 'sung'));
    const btn = $('songBtn'); if (btn) { btn.innerHTML = `<svg viewBox="0 0 100 100"><use href="#ic-pause"/></svg><span>停止</span>`; btn.classList.remove('go'); }
    tchMood('happy', 1200);
    const id = ++SG.raf;
    const f = now => { if (SG.raf !== id || !SG.playing) return; songTick(now); if (SG.playing) requestAnimationFrame(f); };
    requestAnimationFrame(f);
  }
  function songTick(now) {
    const el = (now - SG.t0) / 1000, bt = SG.beat;
    if (document.hidden) { songStop(); return; }
    while (SG.ni < SONG.length && SONG[SG.ni].t * bt <= el + 0.12) {
      const n = SONG[SG.ni], delay = Math.max(0, n.t * bt - el);
      if (!window.__abcFast) {
        KG.note(mf(n.m), n.b * bt * 0.92, 'triangle', 0.2, delay);
        KG.note(mf(n.m + 12), n.b * bt * 0.5, 'sine', 0.04, delay);
        if (n.bass) { KG.note(mf(n.bass), bt * 1.9, 'sine', 0.13, delay); KG.note(mf(n.bass + 7), bt * 1.8, 'sine', 0.05, delay); }
      }
      SG.ni++;
    }
    let ci = -1;
    for (let i = 0; i < SONG.length; i++) { if (SONG[i].t * bt <= el) ci = i; else break; }
    if (ci !== SG.cur && ci >= 0) { SG.cur = ci; songShow(ci); }
    if (el > SONG_END * bt + 0.3) songEnd();
  }
  function songShow(ci) {
    const n = SONG[ci];
    const tiles = stage.querySelectorAll('.stl');
    tiles.forEach((b, i) => { b.classList.toggle('on', i === n.L); if (n.line < 4 && n.L >= 0 && i < n.L) b.classList.add('sung'); });
    if (n.line >= 4) tiles.forEach(b => { b.classList.add('sung'); });
    if (n.line === 4 && n.txt === 'A') tiles[0].classList.add('on');
    let disp = ci; while (disp > 0 && SONG[disp].txt === '' && SONG[disp - 1].line === n.line) disp--;
    const lyr = $('lyric');
    if (lyr) lyr.innerHTML = SONG.map((x, i) => x.line === n.line && x.txt ? (i === disp ? `<b>${x.txt}</b>` : x.txt) : null).filter(x => x != null).join(' ');
  }
  function songEnd() {
    SG.playing = false; SG.done = true; SG.raf++;
    if (game.q && game.q.kind === 'song') game.q.sung = true;
    stage.querySelectorAll('.stl').forEach(b => { b.classList.remove('on'); b.classList.add('sung'); });
    const btn = $('songBtn'); if (btn) btn.innerHTML = `${ICON_PLAY}<span>再唱一次</span>`;
    const lyr = $('lyric'); if (lyr) lyr.textContent = 'A B C … X Y Z!';
    Kit.FX.burst(innerWidth / 2, innerHeight * 0.4, { n: 26, types: ['star', 'spark', 'heart'], speed: 420 });
    KG.sound('sparkle'); tchMood('happy', 1600);
    setBubble(`唱得真好聽！按${tg('完成')}拿星星，或再唱一次。`);
    sayZh('唱得真好聽！');
    if (game.mode === 'play') { Kit.Music.start(Kit.SONGS.gentle); addSongDone(); }
  }
  function songStop(silent) {
    if (!SG.playing) return;
    SG.playing = false; SG.raf++;
    stage.querySelectorAll('.stl.on').forEach(b => b.classList.remove('on'));
    const btn = $('songBtn'); if (btn) btn.innerHTML = `${ICON_PLAY}<span>播放字母歌</span>`;
    if (!silent && game.mode === 'play') Kit.Music.start(Kit.SONGS.gentle);
  }

  /* =====================================================================
   * 貼紙
   * ===================================================================== */
  const STICKERS = [['小貓', 'cat', 1], ['小狗', 'dog', 3], ['兔子', 'rabbit', 6], ['章魚', 'octopus', 10], ['小豬', 'pig', 15], ['斑馬', 'zebra', 20], ['鯨魚', 'whale', 26],
    ['獅子', 'lion', 32], ['狐狸', 'fox', 40], ['風箏', 'kite', 48], ['蛋糕', 'cake', 57], ['皇后', 'queen', 66], ['月亮', 'moon', 76], ['猴子', 'monkey', 88], ['金色老師', null, 100]]
    .map(([name, pic, need]) => ({ name, pic, need }));
  const stickerSVG = s => s.pic ? picSVG(s.pic, 'pv') : tchSVG('#ffd34d').replace('class="tch-svg"', 'class="tch-svg pv"');

  /* =====================================================================
   * 選單、字母表、單字書、家長頁
   * ===================================================================== */
  function closeScreens() {
    clearTimeout(game.timer);
    endDrag();
    document.querySelectorAll('.kit-screen, .kit-ov, .kit-title').forEach(el => { el.removeAttribute('id'); el.classList.add('out'); setTimeout(() => el.remove(), 300); });
  }
  /** 在圖示裡畫一個字母：cx 中心、by 基線、size 大寫高度 */
  function gAt(ch, cx, by, size, color, sw) {
    const b = gbox(ch), sc = size / 56, mid = (b.x0 + b.x1) / 2;
    return `<g transform="translate(${f1(cx - mid * sc)} ${f1(by - 68 * sc)}) scale(${sc.toFixed(3)})"><path d="${pathD(ch, 0)}" stroke="${color}" stroke-width="${sw || 10}" fill="none" stroke-linecap="round" stroke-linejoin="round"/></g>`;
  }
  const ACT_ICON = [
    `<svg viewBox="0 0 100 100"><rect x="10" y="12" width="60" height="76" rx="12" fill="#fff" stroke="#e8558d" stroke-width="5" transform="rotate(-8 40 50)"/><rect x="28" y="12" width="62" height="78" rx="12" fill="#fff0f5" stroke="#e8558d" stroke-width="5"/>${gAt('A', 50, 66, 34, UPC)}${gAt('a', 74, 66, 34, LOC)}</svg>`,
    `<svg viewBox="0 0 100 100"><circle cx="40" cy="44" r="32" fill="#3a9ee8" stroke="#2268a3" stroke-width="5"/><use href="#ic-speaker" x="14" y="18" width="52" height="52"/><rect x="56" y="50" width="40" height="44" rx="10" fill="#fff" stroke="#2f86d8" stroke-width="4"/>${gAt('b', 76, 80, 26, LOC)}</svg>`,
    `<svg viewBox="0 0 100 100"><path d="M8 40 L28 22 L48 40 V88 H8Z" fill="#ffe9f2" stroke="#ff7eb0" stroke-width="5" stroke-linejoin="round"/>${gAt('B', 28, 76, 30, UPC)}<rect x="56" y="44" width="38" height="44" rx="10" fill="#fff3c4" stroke="#d9a520" stroke-width="4" transform="rotate(10 75 66)"/>${gAt('b', 76, 78, 26, LOC)}<path d="M52 26 Q62 14 74 22" stroke="#ff8a1f" stroke-width="5" fill="none" stroke-linecap="round"/><path d="M70 14 L76 23 L66 26" fill="none" stroke="#ff8a1f" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/></svg>`,
    `<svg viewBox="0 0 100 100"><rect x="8" y="10" width="76" height="76" rx="12" fill="#fffdf6" stroke="#f3c8b6" stroke-width="4"/><path d="M14 30 H78 M14 66 H78" stroke="#9bb6e8" stroke-width="2.5"/><path d="M14 48 H78" stroke="#9bb6e8" stroke-width="2.5" stroke-dasharray="5 5"/>${gAt('a', 40, 66, 36, '#2e9a55', 11)}<path d="M62 94 L74 60 L94 68 L82 100 Z" fill="#ffd34d" stroke="#a8640a" stroke-width="4" stroke-linejoin="round" transform="rotate(20 78 80)"/><circle cx="54" cy="46" r="6" fill="#46b864" stroke="#fff" stroke-width="2"/></svg>`,
    `<svg viewBox="0 0 100 100"><g transform="translate(26 0) scale(.45)">${PICS.cat()}</g>${[['c', 18], ['a', 50], ['t', 82]].map(([c, x], i) => `<rect x="${x - 14}" y="54" width="28" height="36" rx="8" fill="${i === 1 ? '#fff' : '#fff3c4'}" stroke="${i === 1 ? '#ffb84d' : '#d9a520'}" stroke-width="4" ${i === 1 ? 'stroke-dasharray="6 4"' : ''}/>${i === 1 ? '' : gAt(c, x, 78, 22, LOC, 11)}`).join('')}</svg>`,
    `<svg viewBox="0 0 100 100"><g transform="translate(2 22) scale(.62)">${PICS.apple()}</g><circle cx="74" cy="30" r="22" fill="#8f5bf0" stroke="#5a35b8" stroke-width="4"/><use href="#ic-speaker" x="56" y="12" width="36" height="36"/></svg>`
  ];
  const BG_MENU = 'linear-gradient(180deg, rgba(214,210,255,.95), rgba(240,238,255,.97))';

      `<button class="kit-bigbtn small" id="bookBtn" style="animation-delay:.2s"><svg viewBox="0 0 100 100"><path d="M10 26 Q30 16 50 26 Q70 16 90 26 V82 Q70 72 50 82 Q30 72 10 82Z" fill="#fff"/><path d="M50 26 V82" stroke="#3fbf63" stroke-width="5"/></svg><span>單字書</span></button>` +

  function showLevels(a) {

  function backRow(id) { return `<div class="row-btns" style="margin-top:14px"><button class="kit-bigbtn small alt" id="${id}">${Kit.ICON.back()}<span>回選單</span></button></div>`; }
  const MARK_OK = '<svg class="mk" viewBox="0 0 100 100"><circle cx="50" cy="50" r="44" fill="#46b864" stroke="#fff" stroke-width="8"/><path d="M28 52 L44 68 L74 36" fill="none" stroke="#fff" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/></svg>';

      LETTERS.map(L => `<button class="chb" data-u="${L.U}" aria-label="${L.U}">${lstate(L.U) === 2 ? MARK_OK : ''}${miniPair(L)}<span class="p">${picSVG(L.pic)}</span><span class="w">${L.word}</span></button>`).join('') + '</div></div>';

  function showCardPopup(L) {
    const old = $('cardPop'); if (old) old.remove();
    const ov = document.createElement('div');
    ov.className = 'kit-ov'; ov.id = 'cardPop';
    ov.innerHTML = `<div class="pv-card">${cardHTML(L)}<button class="pv-close" aria-label="關閉"><svg viewBox="0 0 100 100"><path d="M24 24 L76 76 M76 24 L24 76" stroke="#fff" stroke-width="16" stroke-linecap="round"/></svg></button></div>`;

    document.body.appendChild(ov);
    card.style.setProperty('--u', Math.min(card.offsetWidth, card.offsetHeight / 2) + 'px');
    const close = () => { KG.sound('click'); ov.remove(); };
    ov.querySelector('.pv-close').addEventListener('click', close);
    ov.addEventListener('click', e => { if (e.target === ov) close(); });
    card.addEventListener('click', () => { sayLetter(L); wob(card.querySelector('.pair')); });
    mrecL(L.U, 'seen');
    sayLetter(L);
  }
  function showBook(ti) {
    closeScreens();
    game.mode = 'book'; game.busy = true;
    showGame(false);
    const ov = document.createElement('div');
    ov.className = 'kit-screen'; ov.id = 'bookScreen';
    ov.style.background = BG_MENU;
    const t = THEMES[ti];
    let html = `<div class="kit-banner">單字書</div><div class="tabs">${THEMES.map((x, i) => `<button data-t="${i}" class="${i === ti ? 'on' : ''}">${x.name}</button>`).join('')}</div>`;
    html += `<div class="sec"><h3>${t.name} <small>${t.words.length} 個單字・點一下聽一聽</small></h3><div class="ch-grid">` +
      WORDS.filter(x => x.theme === ti).map(x => `<button class="chb" data-w="${x.w}" aria-label="${x.w}">${wstate(x.w) === 2 ? MARK_OK : ''}<span class="p">${picSVG(x.pic)}</span><span class="w">${x.w}</span><span class="z">${x.zh}</span></button>`).join('') + '</div></div>';
    html += backRow('bookBack');
    ov.innerHTML = html;
    ov.querySelectorAll('.tabs button').forEach(b => b.addEventListener('click', () => { KG.sound('click'); showBook(+b.dataset.t); }));
    ov.querySelectorAll('.chb').forEach(b => b.addEventListener('click', () => {
      const v = VOCAB[b.dataset.w];
      KG.sound('pop'); talk([['en', v.w + '.'], ['zh', v.zh]]); mrecW(v.w, 'seen');
      b.animate([{ transform: 'scale(1)' }, { transform: 'scale(1.12) rotate(-3deg)' }, { transform: 'scale(1)' }], { duration: 380, easing: 'cubic-bezier(.2,1.6,.4,1)' });
    }));
    ov.querySelector('#bookBack').addEventListener('click', () => { KG.sound('pop'); showActs(); });
    document.body.appendChild(ov);
  }

  function showParent() {
    closeScreens();
    game.mode = 'parent'; game.busy = true;
    showGame(false);
    const ov = document.createElement('div');
    ov.className = 'kit-screen'; ov.id = 'parentScreen';
    ov.style.background = BG_MENU;
    const ls = LETTERS.map(L => lstate(L.U)), lDone = ls.filter(x => x === 2).length, lLearn = ls.filter(x => x === 1).length;
    const ws = WORDS.map(x => wstate(x.w)), wDone = ws.filter(x => x === 2).length, wLearn = ws.filter(x => x === 1).length;
    let html = `<div class="kit-banner">家長專區</div><div class="pp-sum">` +
      `<div class="pp-box">已精熟的字母<br><b class="big">${lDone}</b> / 26　<span style="color:#c48a12">學習中 ${lLearn}</span><div class="pp-bar"><i style="width:${Math.round(lDone / 26 * 100)}%"></i></div></div>` +
      `<div class="pp-box">已精熟的單字<br><b class="big">${wDone}</b> / ${WORDS.length}　<span style="color:#c48a12">學習中 ${wLearn}</span><div class="pp-bar"><i style="width:${Math.round(wDone / WORDS.length * 100)}%"></i></div></div>` +
      `<div class="pp-box pp-acts">${ACTS.map((a, i) => `<span>${a.name}：${Kit.ICON.star(true)}${PROG[i].total} / ${a.levels.length * 3}</span>`).join('<br>')}</div></div>`;
    html += `<div class="legend"><span><i style="background:#d6f6df"></i>已精熟</span><span><i style="background:#fff3d1"></i>學習中</span><span><i style="background:#f1eff4"></i>還沒學</span></div>`;
    html += `<div class="sec"><h3>字母 <small>精熟 = 答對 2 次以上，而且自己寫過</small></h3><div class="pp-grid">` +
      LETTERS.map(L => { const m = MAST.L[L.U] || {}; const k = lstate(L.U); return `<div class="pp-t s${k}" title="${L.U}">${k === 2 ? MARK_OK : ''}${miniPair(L)}<span>對 ${m.ok || 0}・錯 ${m.miss || 0}</span><span>寫 ${m.tr || 0}</span></div>`; }).join('') + '</div></div>';
    THEMES.forEach((t, ti) => {
      const list = WORDS.filter(x => x.theme === ti);
      const dn = list.filter(x => wstate(x.w) === 2).length;
      html += `<div class="sec"><h3>單字・${t.name} <small>精熟 ${dn} / ${list.length}</small></h3><div class="pp-grid w">` +
        list.map(x => { const m = MAST.W[x.w] || {}; const k = wstate(x.w); return `<div class="pp-t s${k}">${k === 2 ? MARK_OK : ''}<span class="ww">${x.w}</span><span>${x.zh}</span><span>對 ${m.ok || 0}・錯 ${m.miss || 0}</span></div>`; }).join('') + '</div></div>';
    });
    const vEn = voiceEN === false ? '這台裝置目前沒有英文語音，英文會用文字泡泡顯示。可以在系統設定安裝「English (United States)」語音。' : '英文使用裝置內建的美式英文語音。';
    const vZh = voiceZH === false ? '沒有中文語音時，說明會只顯示在對話框。' : '說明使用中文（台灣）語音。';
    html += `<div class="pp-note">「對／錯」是孩子在聽音找字母、配對、拼單字和單字配圖的作答次數；「寫」是自己完成描寫的次數。<br>${vEn}${vZh}<br>字母念法用字母名稱（A 念 ay），自然發音透過例字學習（A, a, apple）。</div>`;
    html += `<div class="row-btns" style="margin-top:14px"><button class="kit-bigbtn small alt" id="ppBack">${Kit.ICON.back()}<span>回選單</span></button><button class="kit-bigbtn small warn" id="ppReset"><span>清除紀錄</span></button></div>`;
    ov.innerHTML = html;
    ov.querySelector('#ppBack').addEventListener('click', () => { KG.sound('pop'); showActs(); });
    const rb = ov.querySelector('#ppReset');
    let armed = false;
    rb.addEventListener('click', () => {
      if (!armed) { armed = true; KG.sound('click'); rb.querySelector('span').textContent = '再按一次確定'; setTimeout(() => { armed = false; if (rb.isConnected) rb.querySelector('span').textContent = '清除紀錄'; }, 3000); return; }
      MAST = { L: {}, W: {} }; KG.store.set(MKEY, MAST);
      ACTS.forEach((a, i) => { KG.store.set('abc:' + a.id + ':stars', []); PROG[i] = Kit.progress('abc:' + a.id, a.levels.length); });
      KG.sound('whoosh'); KG.toast('紀錄已清除');
      showParent();
    });
    document.body.appendChild(ov);
  }

  /* ---------- 暫停 ---------- */
  function pause() {
    if (game.mode !== 'play') return;
    if ($('pauseOv')) return;
    const prevBusy = game.busy;
    game.busy = true;
    TR.ink = null; endDrag(); songStop();
    KG.sound('click');
    if (window.speechSynthesis) try { speechSynthesis.cancel(); } catch (e) { /* 忽略 */ }
    const ov = document.createElement('div');
    ov.className = 'kit-ov'; ov.id = 'pauseOv';
    ov.innerHTML = `<div class="pz-card"><div class="ow">${tchSVG()}</div><h2>休息一下</h2><div class="kit-rbtns"></div></div>`;
    const bx = ov.querySelector('.kit-rbtns');
    const add = (cls, icon, text, fn) => { const el = document.createElement('button'); el.className = 'kit-rbtn ' + cls; el.innerHTML = `<div class="b">${icon}</div><span>${text}</span>`; el.addEventListener('click', () => { KG.sound('pop'); ov.remove(); fn(); }); bx.appendChild(el); };
    add('b2', Kit.ICON.menu(), '關卡', () => showLevels(game.act));
    add('y', Kit.ICON.replay(), '重來', () => startLevel(game.act, game.lv));
    add('g big', Kit.ICON.play(), '繼續', () => { game.busy = prevBusy; });
    document.body.appendChild(ov);
  }
  $('pauseBtn').addEventListener('click', pause);

  /* ---------- 鍵盤 ---------- */
  window.addEventListener('keydown', e => {
    const pop = $('cardPop');
    if (e.key === 'Escape' && pop) { pop.remove(); return; }
    if (e.key === 'Escape') { const po = $('pauseOv'); if (po) po.querySelector('.kit-rbtn.g').click(); else pause(); return; }
    if (game.mode !== 'play' || $('pauseOv') || e.ctrlKey || e.metaKey || e.altKey) return;
    const q = game.q;
    if (q.kind === 'card') {
      if (e.key === 'ArrowRight' || e.key === 'Enter') { e.preventDefault(); cardNav(1); }
      else if (e.key === 'ArrowLeft') { e.preventDefault(); cardNav(-1); }
      else if (e.key === ' ') { e.preventDefault(); replayCard(); }
      return;
    }
    if (q.kind === 'song') { if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); songToggle(); } return; }
    if (e.key === ' ') { e.preventDefault(); sayQ(); return; }
    if (q.kind === 'trace') { if (e.key === 'd' || e.key === 'Enter') playDemo(); return; }
    if (/^[1-9]$/.test(e.key)) {
      const n = +e.key - 1;
      if (q.kind === 'match' && game.sel >= 0) houseTap(n); else answer(n);
      return;
    }
    if (/^[a-zA-Z]$/.test(e.key)) {
      if (q.kind === 'pick') { const i = q.opts.indexOf(e.key) >= 0 ? q.opts.indexOf(e.key) : q.opts.findIndex(c => c.toLowerCase() === e.key.toLowerCase()); if (i >= 0) answer(i); }
      else if (q.kind === 'spell' || q.kind === 'match') { const i = q.tiles.findIndex((c, j) => c === e.key.toLowerCase() && !q.used[j]); if (i >= 0) tapTile(i); }
    }
  });
  tchBox.addEventListener('click', () => { if (game.mode === 'play') { KG.sound('boing'); sayQ(); } });
  $('sayBtn').addEventListener('click', () => { KG.sound('click'); sayQ(); });

  /* ---------- 版面（依照實際顯示的大小） ---------- */
  let laying = false;
  function layout() {
    if (laying) return;
    laying = true;
    const ar = app.getBoundingClientRect();
    const land = ar.width > ar.height * 1.15;
    app.classList.toggle('land', land);
    const n = opts.children.length, q = game.q;
    let cols = n || 1;
    if (q && q.kind === 'wpick' && n === 4 && (!land || ar.height > 560)) cols = 2;
    opts.style.setProperty('--n', cols);
    layoutStage();
    laying = false;
  }
  function layoutStage() {
    const r = stage.getBoundingClientRect();
    const w = r.width, h = r.height;
    if (w < 20 || h < 20) return;
    const card = stage.querySelector('.fcard');
    if (card) {
      const cw = Math.min(w, 760), ch = Math.min(h, 640);
      const row = cw > ch * 1.12;
      card.classList.toggle('row', row);
      card.style.width = cw + 'px'; card.style.height = ch + 'px';
      const U = row ? Math.min(cw / 2, ch) : Math.min(cw, ch / 2);
      card.style.setProperty('--u', U + 'px');
      const sl = card.querySelector('.slots');
      if (sl) {
        const np = game.q.slots.length;
        const halfW = (row ? cw / 2 : cw) - 28, halfH = (row ? ch : ch / 2) - 24;
        const slw = Math.min(U * 0.34, halfW / (np + 0.14 * (np - 1)), halfH / 1.15, 120);
        card.style.setProperty('--sl', Math.floor(slw) + 'px');
      }
    }
    const board = stage.querySelector('.board');
    if (board) {
      const n = board.children.length, gap = Math.max(6, Math.min(16, w * 0.025));
      const hw = Math.min((w - gap * (n - 1) - 8) / n, (h - 48) / 1.62, 150);
      board.style.setProperty('--hw', Math.floor(hw) + 'px');
      board.style.setProperty('--gap', gap + 'px');
    }
    const song = stage.querySelector('.song');
    if (song) {
      const lh = 56;
      let best = 0, bc = 7;
      for (const c of [4, 5, 6, 7, 9, 13]) {
        const rows = Math.ceil(26 / c), s = Math.min((w - 8 - (c - 1) * 6) / c, (h - lh - 8 - (rows - 1) * 6) / rows);
        if (s > best) { best = s; bc = c; }
      }
      song.style.setProperty('--sc', bc);
      song.style.setProperty('--st', Math.floor(Math.min(best, 96)) + 'px');
    }
    if (cv.parentNode === stage) sizeTrace(w, h);
  }
  window.addEventListener('resize', layout);
  if (window.visualViewport) visualViewport.addEventListener('resize', layout);
  window.addEventListener('orientationchange', () => setTimeout(layout, 150));
  if (window.ResizeObserver) { const ro = new ResizeObserver(() => { if (!laying) layout(); }); ro.observe(app); ro.observe(opts); ro.observe($('prompt')); }
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) { if (window.speechSynthesis) try { speechSynthesis.cancel(); } catch (e) { /* 忽略 */ } TR.ink = null; endDrag(); songStop(); }
  });

  /* ---------- 標題 ---------- */
  function boardSVG() {
    return `<svg viewBox="0 0 220 200" style="position:absolute;left:0;top:2%;width:84%;height:84%;overflow:visible">
      <path d="M40 140 L28 196 M150 140 L162 196" stroke="#8a5a2c" stroke-width="8" stroke-linecap="round"/>
      <rect x="8" y="18" width="174" height="126" rx="14" fill="#a8703c" stroke="#5e3a17" stroke-width="5"/>
      <rect x="20" y="30" width="150" height="102" rx="8" fill="#2f6b56"/>
      <path d="M30 40 Q60 36 90 42" stroke="rgba(255,255,255,.18)" stroke-width="6" stroke-linecap="round" fill="none"/>
      ${gAt('A', 50, 100, 44, '#fff', 9)}${gAt('B', 95, 100, 44, '#ffd34d', 9)}${gAt('C', 140, 100, 44, '#ff9ec4', 9)}
      ${gAt('a', 70, 124, 22, 'rgba(255,255,255,.8)', 8)}${gAt('b', 95, 124, 22, 'rgba(255,255,255,.8)', 8)}${gAt('c', 120, 124, 22, 'rgba(255,255,255,.8)', 8)}
      <rect x="120" y="134" width="30" height="8" rx="3" fill="#fff"/><rect x="62" y="132" width="26" height="10" rx="3" fill="#ff8fb1"/>
    </svg>`;
  }
  function showTitle() {
    game.mode = 'title';
    showGame(false);
    Kit.title({
      logo: '英文字母樂園', colors: ['#ff6fa5', '#7b6cf6', '#3a9ee8', '#3fbf63', '#ffb21f', '#ff7a45'], stroke: '#3b2f8f',
      bg: 'radial-gradient(circle at 50% 40%, rgba(255,255,255,.6), rgba(255,255,255,0) 60%), linear-gradient(180deg, #cfd2ff 0%, #eeeeff 55%, #fff4d9 100%)',
      hero: `<div style="position:relative;width:100%;height:100%">${boardSVG()}<div style="position:absolute;right:-10%;bottom:-6%;width:56%;height:56%">${tchSVG()}</div></div>`,
      sub: '跟貓頭鷹老師一起學 ABC！',
      buttons: [{ text: '開始', onClick: () => { talk([['zh', '英文字母樂園！我們一起來學'], ['en', 'A, B, C!']]); showActs(); } }]
    });
  }
  // 背景飄浮的字母
  (function () {
    const g = $('bgLetters');
    const spots = [['A', 60, 420, '#e8558d'], ['b', 860, 330, '#2f86d8'], ['C', 250, 640, '#2e9a55'], ['d', 700, 560, '#ff8a1f'], ['E', 470, 300, '#7b6cf6'], ['f', -120, 700, '#e8558d'], ['G', 1060, 620, '#2f86d8']];
    g.innerHTML = spots.map(([c, x, y, col]) => `<g transform="translate(${x} ${y}) scale(1.2)"><g class="fl"><path d="${pathD(c, 0)}" stroke="${col}" stroke-width="10" fill="none" stroke-linecap="round" stroke-linejoin="round"/></g></g>`).join('');
  })();

  /* ---------- 資料自我檢查 ---------- */
  function checkData() {
    const errs = [];
    if (LETTERS.length !== 26) errs.push('letter count ' + LETTERS.length);
    if (NAMES.length !== 26) errs.push('name count ' + NAMES.length);
    if (new Set(LETTERS.map(L => L.U)).size !== 26) errs.push('duplicate letters');
    LETTERS.forEach(L => {
      if (!PICS[L.pic]) errs.push(L.U + ' missing pic');
      if (L.key < 0) errs.push(L.U + ' word lacks letter');
      if (!/^[a-z]+$/.test(L.word)) errs.push(L.U + ' bad word');
      [L.U, L.l].forEach(c => { if (!STROKES[c] || !STROKES[c].length) errs.push(c + ' missing strokes'); else STROKES[c].forEach(s => s.forEach(p => { if (!(p[0] >= 0 && p[0] <= 100 && p[1] >= 0 && p[1] <= 100)) errs.push(c + ' stroke out of box'); })); });
    });
    WORDS.forEach(x => { if (!PICS[x.pic]) errs.push(x.w + ' missing pic'); if (!/^[a-z]+$/.test(x.w)) errs.push(x.w + ' bad spelling chars'); if (!x.zh) errs.push(x.w + ' no zh'); });
    if (new Set(WORDS.map(x => x.w)).size !== WORDS.length) errs.push('duplicate words');
    SPELL3.concat(SPELL4).forEach(w => { if (!VOCAB[w] || !PICS[VOCAB[w].pic]) errs.push(w + ' spell word missing'); if (new Set(w).size !== w.length) errs.push(w + ' repeated letter'); });
    SPELL3.forEach(w => { if (w.length !== 3 || !VOWELS.includes(w[1])) errs.push(w + ' not CVC'); });
    FIRSTW.forEach(w => { if (!VOCAB[w]) errs.push(w + ' first-letter word missing'); });
    Object.keys(CONF).forEach(k => { for (const c of CONF[k]) if (c === k || !LOWER.includes(c)) errs.push('conf ' + k); });
    return errs;
  }

  /* ---------- 開始 ---------- */
  Kit.ensureDefs();
  $('starIc').innerHTML = Kit.ICON.star(true);
  $('hudIc').innerHTML = `<svg viewBox="0 0 100 100"><rect x="8" y="8" width="84" height="84" rx="22" fill="#7b6cf6"/>${gAt('A', 34, 70, 40, '#fff', 11)}${gAt('a', 68, 70, 40, '#ffd34d', 11)}</svg>`;
  layout();
  showTitle();

  /* ---------- 測試掛鉤 ---------- */
  window.__abc = {
    LETTERS, WORDS, THEMES, VOCAB, STROKES, ACTS, STICKERS, SONG, SPELL3, SPELL4, CONF, PICS,
    checkData, checkStroke, buildList, pic: picSVG, gl: glSVG, word: wordSVG,
    get state() {
      const q = game.q;
      return {
        mode: game.mode, act: ACTS[game.act].id, lv: game.lv, qi: game.qi, n: game.list.length, first: game.first, wrong: game.wrong, busy: game.busy,
        kind: q && q.kind, target: q ? (q.tc || (q.v && q.v.w) || q.ch || (q.L && q.L.U) || null) : null,
        opts: q ? (q.opts || q.tiles || null) : null, ans: correctIndex(), sel: game.sel, q, stars: totalStars(), voice: { en: voiceEN, zh: voiceZH },
        trace: q && q.kind === 'trace' ? { ch: q.ch, stroke: TR.si, strokes: TR.st.length, fails: TR.fails, locked: TR.locked, S: TR.S } : null,
        match: q && q.kind === 'match' ? { pairs: q.pairs.slice(), tiles: q.tiles.slice(), done: q.done.slice(), used: q.used.slice() } : null,
        spell: q && q.kind === 'spell' ? { word: q.v.w, tiles: q.tiles.slice(), used: q.used.slice(), cur: q.cur, slots: q.slots.map(s => (s.blank && !s.done ? '_' : s.v)).join('') } : null,
        song: { playing: SG.playing, done: SG.done, cur: SG.cur }
      };
    },
    start(a, lv) { return startLevel(a, lv || 0); },
    answer, drop: dropOn, tap: tapTile, houseTap,
    correct() {
      const q = game.q; if (!q || game.mode !== 'play') return false;
      if (q.kind === 'card') { cardNav(1); return true; }
      if (q.kind === 'trace') return this.trace(TR.st[TR.si]);
      if (q.kind === 'song') { songEnd(); game.busy = true; finish(); return true; }
      if (q.kind === 'match') { const hi = q.done.findIndex(d => !d); const ti = q.tiles.findIndex((c, j) => !q.used[j] && c.toUpperCase() === q.pairs[hi]); return dropOn(ti, hi); }
      if (q.kind === 'spell') { const sl = q.slots[q.cur]; const ti = q.tiles.findIndex((c, j) => !q.used[j] && c === sl.v); return dropOn(ti, q.cur); }
      return answer(correctIndex());
    },
    next, cardNav, menu: showActs, levels: showLevels, chart: showChart, book: showBook, parent: showParent, title: showTitle, pause, popup: c => showCardPopup(LET[c]),
    song: { toggle: songToggle, stop: songStop },
    trace(points) { return evaluateStroke(points.map(p => [p[0], p[1]])); },
    strokePoints(i) { return TR.st[i == null ? TR.si : i]; },
    toScreen(u) { const r = cv.getBoundingClientRect(), sc = r.width / TR.S; return { x: r.left + (TR.m + u[0] * TR.B / 100) * sc, y: r.top + (TR.m + u[1] * TR.B / 100) * sc }; },
    mastery: () => JSON.parse(JSON.stringify(MAST)),
    setFast(b) { window.__abcFast = !!b; },
    setStars(id, arr) { const i = ACTS.findIndex(a => a.id === id); arr.forEach((s, j) => PROG[i].set(j, s)); }
  };
})();
</script>
