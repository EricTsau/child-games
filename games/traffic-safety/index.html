<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>交通安全小達人</title>
<link rel="stylesheet" href="../../assets/common.css">
<style>
  html, body { height: 100%; overflow: hidden; background: #cfeedd; overscroll-behavior: none; }
  #game { position: fixed; inset: 0; display: block; width: 100vw; height: 100vh; height: 100dvh; touch-action: none; }
  #ui { position: fixed; inset: 0; pointer-events: none; z-index: 100; font-family: var(--kg-font); color: #3b2f4a; }
  .scr { position: absolute; inset: 0; display: none; flex-direction: column; pointer-events: none; }
  .scr.on { display: flex; }
  .scr .top { padding: 66px 70px 6px; text-align: center; flex: none; }
  .scr .top h2 { margin: 0; font-size: 26px; font-weight: 900; color: #2e4a6b; text-shadow: 0 2px 0 #fff, 0 0 8px #fff; }
  .scr .top .sub { font-size: 15px; font-weight: 800; color: #4c6a5a; margin-top: 2px; text-shadow: 0 1px 0 #fff; }
  .scr .mid { flex: 1; min-height: 0; overflow-y: auto; pointer-events: auto; touch-action: pan-y; -webkit-overflow-scrolling: touch; padding: 6px 14px 14px; }
  .scr .bot { flex: none; padding: 8px 12px calc(12px + env(safe-area-inset-bottom)); display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; pointer-events: auto; }
  .btn { font-family: var(--kg-font); font-weight: 900; font-size: 18px; border: none; border-radius: 999px; padding: 11px 20px; color: #fff; cursor: pointer;
    background: linear-gradient(180deg, #8fdcff, #3a9ee8); box-shadow: 0 4px 0 #2672ad, 0 8px 14px rgba(38,114,173,.3); text-shadow: 0 1px 0 rgba(0,0,0,.18);
    transition: transform .08s; touch-action: manipulation; white-space: nowrap; }
  .btn:active { transform: translateY(3px); box-shadow: 0 1px 0 #2672ad; }
  .btn.green { background: linear-gradient(180deg, #a2eab0, #3fb35e); box-shadow: 0 4px 0 #2b8746, 0 8px 14px rgba(43,135,70,.3); }
  .btn.orange { background: linear-gradient(180deg, #ffd08a, #f39a2b); box-shadow: 0 4px 0 #c0701a, 0 8px 14px rgba(192,112,26,.3); }
  .btn.pink { background: linear-gradient(180deg, #ffb3cb, #e8648d); box-shadow: 0 4px 0 #c24470, 0 8px 14px rgba(194,68,112,.3); }
  .btn.purple { background: linear-gradient(180deg, #cdb8ff, #8a6ae0); box-shadow: 0 4px 0 #6447b8, 0 8px 14px rgba(100,71,184,.3); }
  .btn.white { background: #fff; color: #3b5b7a; text-shadow: none; box-shadow: 0 4px 0 #b8c8d8, 0 8px 14px rgba(60,90,120,.2); }
  .btn.big { font-size: 22px; padding: 14px 30px; }
  .btn.sm { font-size: 15px; padding: 8px 14px; }
  .btn[disabled] { filter: grayscale(1); opacity: .6; }
  .tog { font-family: var(--kg-font); font-weight: 900; font-size: 14px; border: 3px solid #fff; border-radius: 999px; padding: 6px 12px; cursor: pointer;
    background: #6cc070; color: #fff; box-shadow: 0 3px 0 rgba(0,0,0,.15); touch-action: manipulation; }
  .tog.off { background: #b9b2c2; }
  .menuGrid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; width: min(460px, 100%); margin: 0 auto; }
  .menuGrid .btn { width: 100%; font-size: 17px; padding: 11px 8px; }
  .menuGrid .btn.wide { grid-column: span 2; font-size: 22px; padding: 13px 8px; }
  .togRow { display: flex; gap: 8px; justify-content: center; width: 100%; flex-wrap: wrap; }
  /* 關卡卡片 */
  .lvGrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; max-width: 980px; margin: 0 auto; }
  .lv { position: relative; background: #fffdf6; border-radius: 18px; border: 3px solid #fff; box-shadow: 0 4px 0 rgba(60,80,100,.18), 0 6px 14px rgba(60,80,100,.14);
    padding: 8px 8px 8px; text-align: center; cursor: pointer; touch-action: manipulation; }
  .lv:active { transform: translateY(2px); }
  .lv canvas { width: 100%; aspect-ratio: 16 / 10; display: block; border-radius: 12px; background: #dff2e4; }
  .lv .no { position: absolute; left: 4px; top: 4px; width: 30px; height: 30px; border-radius: 50%; background: #ff8a3d; color: #fff; font-weight: 900; font-size: 16px;
    display: grid; place-items: center; border: 3px solid #fff; box-shadow: 0 2px 0 rgba(0,0,0,.15); }
  .lv .nm { font-weight: 900; font-size: 15px; margin-top: 5px; line-height: 1.25; min-height: 2.5em; display: flex; flex-direction: column; align-items: center; justify-content: center; }
  .lv .st { font-size: 0; margin-top: 2px; height: 20px; }
  .lv .st i { display: inline-block; width: 20px; height: 20px; margin: 0 1px; clip-path: polygon(50% 0, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%); background: #d9d2c8; }
  .lv .st i.on { background: #ffc531; }
  .lv.locked { filter: grayscale(.9); opacity: .55; }
  .lv.locked::after { content: ''; position: absolute; right: 8px; top: 8px; width: 24px; height: 20px; border-radius: 5px; background: #8a7f93; box-shadow: inset 0 0 0 3px #6d6276; }
  .lv.locked::before { content: ''; position: absolute; right: 13px; top: 0; width: 14px; height: 14px; border: 4px solid #8a7f93; border-bottom: none; border-radius: 10px 10px 0 0; }
  .secT { font-weight: 900; font-size: 18px; margin: 12px auto 8px; max-width: min(980px, 100%); padding: 4px 14px; border-radius: 18px; color: #fff; width: max-content; box-sizing: border-box; line-height: 1.4; }
  @media (max-width: 520px) { .secT { font-size: 15px; } }
  /* 標誌圖鑑 */
  .sgGrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(104px, 1fr)); gap: 10px; max-width: 980px; margin: 0 auto 8px; }
  .sg { background: #fffdf6; border-radius: 16px; border: 3px solid #fff; box-shadow: 0 3px 0 rgba(60,80,100,.16); padding: 6px 4px 6px; text-align: center; cursor: pointer; position: relative; touch-action: manipulation; }
  .sg canvas { width: 72px; height: 72px; display: block; margin: 0 auto; }
  .sg .nm { font-weight: 900; font-size: 14px; line-height: 1.2; margin-top: 3px; }
  .sg .ok { position: absolute; right: 5px; top: 5px; width: 18px; height: 18px; border-radius: 50%; background: #4cc26a; border: 2px solid #fff; }
  .sg .ok::after { content: ''; position: absolute; left: 5px; top: 2px; width: 4px; height: 8px; border: solid #fff; border-width: 0 3px 3px 0; transform: rotate(45deg); }
  /* 對話卡 */
  #card { position: fixed; inset: 0; z-index: 8000; display: none; align-items: center; justify-content: center; padding: 64px 14px 14px; background: rgba(40,50,70,.35); pointer-events: auto; }
  #card.on { display: flex; }
  #card.clear { background: rgba(40,50,70,.08); }
  .cbox { background: #fffdf6; border-radius: 24px; border: 4px solid #fff; box-shadow: 0 8px 0 rgba(50,60,80,.2), 0 16px 40px rgba(30,40,60,.3); width: min(440px, 100%);
    max-height: 100%; display: flex; flex-direction: column; overflow: hidden; animation: pop .28s cubic-bezier(.3,1.6,.5,1); }
  @keyframes pop { from { transform: scale(.7); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  .cbody { padding: 14px 18px 6px; overflow-y: auto; min-height: 0; flex: 1; touch-action: pan-y; text-align: center; }
  .cbody h3 { margin: 4px 0 6px; font-size: 23px; font-weight: 900; color: #2e4a6b; }
  .cbody p { margin: 6px 0; font-size: 18px; font-weight: 700; line-height: 1.5; }
  .cbody .rule { display: flex; align-items: center; gap: 10px; text-align: left; font-size: 16px; font-weight: 800; margin: 6px 0; background: #eef7ff; border-radius: 12px; padding: 6px 10px; }
  .cbody .rule canvas { width: 40px; height: 40px; flex: none; }
  .cbody canvas.pic { display: block; margin: 0 auto; }
  .cfoot { padding: 8px 14px 14px; display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; flex: none; }
  .cfoot .btn { flex: 1 1 auto; min-width: 120px; }
  .bigStars { font-size: 0; margin: 4px 0; }
  .bigStars i { display: inline-block; width: 52px; height: 52px; margin: 0 4px; clip-path: polygon(50% 0, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%); background: #d9d2c8;
    animation: starIn .5s cubic-bezier(.3,1.8,.5,1) both; }
  .bigStars i.on { background: linear-gradient(180deg, #ffe680, #ffb31f); }
  @keyframes starIn { from { transform: scale(0) rotate(-90deg); } to { transform: scale(1); } }
  .opt { display: block; width: 100%; margin: 8px 0; text-align: left; font-size: 17px; padding: 12px 16px; border-radius: 16px; white-space: normal; line-height: 1.35; }
  .optRow { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
  .sgOpt { background: #fff; border: 4px solid #e4e9f0; border-radius: 18px; padding: 6px; cursor: pointer; box-shadow: 0 4px 0 #c9d3de; touch-action: manipulation; }
  .sgOpt canvas { width: 84px; height: 84px; display: block; }
  .sgOpt.good { border-color: #4cc26a; background: #e9fbe9; }
  .sgOpt.bad { border-color: #ff8a8a; background: #fff0f0; }
  .opt.good { background: linear-gradient(180deg, #a2eab0, #3fb35e) !important; }
  .opt.bad { background: linear-gradient(180deg, #ffc0c0, #e86a6a) !important; }
  /* 遊戲中控制 */
  #hud { position: absolute; inset: 0; display: none; pointer-events: none; }
  #hud.on { display: block; }
  .pbtn { position: absolute; right: 10px; top: 60px; width: 48px; height: 48px; border-radius: 50%; border: 3px solid #fff; background: linear-gradient(180deg, #fff, #e6f2ff);
    box-shadow: 0 4px 0 rgba(50,70,100,.2); pointer-events: auto; cursor: pointer; display: grid; place-items: center; touch-action: manipulation; }
  .pbtn::before, .pbtn::after { content: ''; position: absolute; top: 13px; width: 6px; height: 16px; border-radius: 3px; background: #47607d; }
  .pbtn::before { left: 14px; } .pbtn::after { right: 14px; }
  .pad { position: absolute; left: 10px; bottom: calc(10px + env(safe-area-inset-bottom)); width: 168px; height: 168px; pointer-events: none; }
  .pad button, .acts button { position: absolute; pointer-events: auto; border: 3px solid #fff; cursor: pointer; touch-action: none; -webkit-user-select: none; user-select: none; }
  .pad button { width: 58px; height: 58px; border-radius: 16px; background: rgba(255,255,255,.82); box-shadow: 0 4px 0 rgba(40,60,90,.25); }
  .pad button.on { background: #ffe58a; transform: translateY(2px); box-shadow: 0 2px 0 rgba(40,60,90,.25); }
  .pad button::after { content: ''; position: absolute; left: 50%; top: 50%; width: 0; height: 0; border: 12px solid transparent; }
  .pad .u { left: 55px; top: 0; } .pad .u::after { border-bottom: 16px solid #47607d; border-top: 0; transform: translate(-50%, -60%); }
  .pad .d { left: 55px; top: 110px; } .pad .d::after { border-top: 16px solid #47607d; border-bottom: 0; transform: translate(-50%, -40%); }
  .pad .l { left: 0; top: 55px; } .pad .l::after { border-right: 16px solid #47607d; border-left: 0; transform: translate(-60%, -50%); }
  .pad .r { left: 110px; top: 55px; } .pad .r::after { border-left: 16px solid #47607d; border-right: 0; transform: translate(-40%, -50%); }
  .acts { position: absolute; right: 10px; bottom: calc(10px + env(safe-area-inset-bottom)); width: 170px; height: 150px; pointer-events: none; }
  .acts button { border-radius: 50%; font-family: var(--kg-font); font-weight: 900; color: #fff; font-size: 15px; line-height: 1.1; text-shadow: 0 1px 0 rgba(0,0,0,.2); }
  .acts button canvas { width: 34px; height: 34px; display: block; margin: 0 auto 1px; pointer-events: none; }
  .acts .look { right: 0; bottom: 0; width: 86px; height: 86px; background: linear-gradient(180deg, #8fdcff, #3a9ee8); box-shadow: 0 4px 0 #2672ad; }
  .acts .ctx { right: 88px; bottom: 34px; width: 78px; height: 78px; background: linear-gradient(180deg, #ffd08a, #f39a2b); box-shadow: 0 4px 0 #c0701a; display: none; }
  .acts .ctx.on { display: block; animation: wob 1s ease-in-out infinite; }
  .acts .x3 { right: 6px; bottom: 92px; width: 66px; height: 66px; background: linear-gradient(180deg, #a2eab0, #3fb35e); box-shadow: 0 4px 0 #2b8746; display: none; }
  .acts .x3.on { display: block; }
  .acts button:active { transform: translateY(3px); }
  @keyframes wob { 0%,100% { transform: scale(1); } 50% { transform: scale(1.07); } }
  .bikePad .l, .bikePad .r { top: 100px; } .bikePad .u, .bikePad .d { display: none; }
  .bikePad { height: 160px; }
  @media (max-height: 520px) {
    .scr .top { padding-top: 12px; }
    .scr .top h2 { font-size: 22px; }
    .menuGrid { grid-template-columns: repeat(4, minmax(0, 1fr)); width: min(860px, 100%); gap: 8px; }
    .menuGrid .btn, .menuGrid .btn.wide { grid-column: span 1; font-size: 16px; padding: 10px 4px; }
    .cbody h3 { font-size: 20px; } .cbody p { font-size: 16px; margin: 4px 0; }
    #card { padding-top: 12px; }
  }
  #hud.qa .pad, #hud.qa .acts { display: none; }
  @media (max-height: 520px) { .cbody canvas.pic.short { display: none; } }
  .pill { position: absolute; left: 50%; top: 12px; transform: translateX(-50%); max-width: calc(100% - 136px); background: rgba(255,255,255,.92); border-radius: 999px; padding: 5px 14px;
    font-weight: 900; font-size: 16px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; box-shadow: 0 3px 0 rgba(40,60,90,.18); border: 3px solid #fff; color: #2e4a6b; }
</style>
</head>
<body>
<canvas id="game" aria-label="交通安全小達人"></canvas>
<div id="ui">
  <div class="scr" id="sTitle">
    <div class="mid" style="pointer-events:none"></div>
    <div class="bot">
      <div class="menuGrid">
        <button class="btn green wide" data-act="map">出發去冒險</button>
        <button class="btn orange" data-act="signs">交通標誌圖鑑</button>
        <button class="btn purple" data-act="quiz">標誌小測驗</button>
        <button class="btn pink wide" data-act="bike">腳踏車小騎士</button>
      </div>
      <div class="togRow" id="titleTogs"></div>
    </div>
  </div>
  <div class="scr" id="sMap">
    <div class="top"><h2>冒險地圖</h2><div class="sub" id="mapSub"></div></div>
    <div class="mid"><div class="lvGrid" id="lvGrid"></div></div>
    <div class="bot"><button class="btn white" data-act="title">回標題</button></div>
  </div>
  <div class="scr" id="sSigns">
    <div class="top"><h2>交通標誌圖鑑</h2><div class="sub" id="signSub"></div></div>
    <div class="mid" id="signList"></div>
    <div class="bot"><button class="btn white" data-act="title">回標題</button><button class="btn purple" data-act="quiz">去測驗</button></div>
  </div>
  <div class="scr" id="sBike">
    <div class="top"><h2>腳踏車小騎士</h2><div class="sub">戴好安全帽，看懂標誌，安全騎到終點！</div></div>
    <div class="mid"><div class="lvGrid" id="bikeGrid"></div></div>
    <div class="bot"><button class="btn white" data-act="title">回標題</button></div>
  </div>
  <div class="scr" id="sQuiz">
    <div class="top"><h2 id="quizH">標誌小測驗</h2><div class="sub" id="quizSub"></div></div>
    <div class="mid" id="quizBody" style="display:flex;flex-direction:column;align-items:center"></div>
    <div class="bot"><button class="btn white" data-act="title">回標題</button></div>
  </div>
  <div id="hud">
    <div class="pill" id="pill"></div>
    <button class="pbtn" id="pauseBtn" aria-label="暫停"></button>
    <div class="pad" id="pad">
      <button class="u" data-dir="0" aria-label="上"></button>
      <button class="l" data-dir="1" aria-label="左"></button>
      <button class="r" data-dir="2" aria-label="右"></button>
      <button class="d" data-dir="3" aria-label="下"></button>
    </div>
    <div class="acts" id="acts">
      <button class="look" id="lookBtn"><canvas width="68" height="68"></canvas><span>看左右</span></button>
      <button class="ctx" id="ctxBtn"><canvas width="68" height="68"></canvas><span></span></button>
      <button class="x3" id="x3Btn"><canvas width="68" height="68"></canvas><span></span></button>
    </div>
  </div>
</div>
<div id="card"><div class="cbox"><div class="cbody" id="cbody"></div><div class="cfoot" id="cfoot"></div></div></div>
<script src="../../assets/common.js"></script>
<script src="../../assets/kg-music.js"></script>
<script>
'use strict';
/* =====================================================================
 * 交通安全小達人：跟著小安走路上學、去公園、搭公車和捷運，
 * 學會台灣的交通規則和交通標誌。另外有標誌圖鑑、小測驗、腳踏車小騎士。
 * ===================================================================== */
(function () {
const SLUG = 'traffic-safety';
const cv = document.getElementById('game');
const ctx = cv.getContext('2d');
const FONT = '"PingFang TC","Noto Sans TC","Microsoft JhengHei","Heiti TC",system-ui,sans-serif';
const TAU = Math.PI * 2;
let W = 360, H = 640, dpr = 1, time = 0;
let scene = 'title', paused = false;
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const lerp = (a, b, t) => a + (b - a) * t;
const rand = (a, b) => a + Math.random() * (b - a);
const pick = a => a[Math.floor(Math.random() * a.length)];
const $ = id => document.getElementById(id);
function hash(x, y) { let h = (x * 374761393 + y * 668265263) | 0; h = (h ^ (h >>> 13)) * 1274126177; return ((h ^ (h >>> 16)) >>> 0) / 4294967296; }

/* ---------- 存檔 ---------- */
const Save = {
  get: (k, d) => KG.store.get(SLUG + ':' + k, d),
  set: (k, v) => KG.store.set(SLUG + ':' + k, v)
};
let stars = Save.get('stars', []);
let bikeStars = Save.get('bike', []);
let learned = Save.get('learned', {});
let sfxOn = Save.get('sfx', true) !== false;
let voiceOn = Save.get('voice', true) !== false;

/* ---------- 繪圖小工具 ---------- */
function rr(c, x, y, w, h, r) {
  r = Math.max(0, Math.min(r, w / 2, h / 2));
  c.beginPath(); c.moveTo(x + r, y);
  c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r);
  c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath();
}
function circle(c, x, y, r) { c.beginPath(); c.arc(x, y, r, 0, TAU); }
function shade(hex, amt) {
  const n = parseInt(hex.slice(1), 16), f = v => clamp(v + amt, 0, 255);
  return 'rgb(' + f(n >> 16) + ',' + f((n >> 8) & 255) + ',' + f(n & 255) + ')';
}
function font(c, size, w) { c.font = (w || 900) + ' ' + Math.round(size) + 'px ' + FONT; }
function text(c, s, x, y, size, fill, o) {
  o = o || {};
  font(c, size, o.w); c.textAlign = o.align || 'center'; c.textBaseline = 'middle'; c.lineJoin = 'round';
  if (o.stroke) { c.strokeStyle = o.stroke; c.lineWidth = o.sw || size * 0.25; c.strokeText(s, x, y); }
  c.fillStyle = fill; c.fillText(s, x, y);
}
function starPath(c, x, y, R, r) {
  c.beginPath();
  for (let i = 0; i < 10; i++) { const a = i * Math.PI / 5 - Math.PI / 2, d = i % 2 ? r : R; c.lineTo(x + Math.cos(a) * d, y + Math.sin(a) * d); }
  c.closePath();
}
function drawStar(c, x, y, R, on) {
  starPath(c, x, y + R * 0.1, R, R * 0.5); c.fillStyle = 'rgba(80,60,0,.25)'; c.fill();
  starPath(c, x, y, R, R * 0.5); c.fillStyle = on ? '#ffc531' : '#ddd6cc'; c.fill();
  c.lineWidth = Math.max(1.5, R * 0.14); c.strokeStyle = on ? '#d88a00' : '#b9b0a4'; c.lineJoin = 'round'; c.stroke();
}
/** 小畫布：給 DOM 用（依 dpr 放大） */
function miniCanvas(cvs, w, h, fn) {
  const d = Math.min(2, window.devicePixelRatio || 1);
  cvs.width = Math.round(w * d); cvs.height = Math.round(h * d);
  const c = cvs.getContext('2d'); c.setTransform(d, 0, 0, d, 0, 0); c.clearRect(0, 0, w, h);
  fn(c, w, h);
  return cvs;
}

/* =====================================================================
 * 聲音
 * ===================================================================== */
const S = KG.sfx, M = KG.music;
const sfxLast = Object.create(null);
function sfx(name, o) {
  if (!sfxOn || !S) return;
  const now = performance.now();
  if (now - (sfxLast[name] || 0) < 40) return;
  sfxLast[name] = now;
  o = o || {};
  const pitch = (o.pitch || 1) * (o.exact ? 1 : 0.95 + Math.random() * 0.1);
  S.play(name, { vol: o.vol, pitch, pan: o.pan });
}
let musicBase = 0.26, musicDuck = false;
function setMusicBase(v) { musicBase = v; if (M) M.setVolume(musicDuck ? v * 0.4 : v); }
function say(t) { if (voiceOn && t) { KG.say(t, 1.0); } }
function voiceTick() {
  const sp = !!(window.speechSynthesis && window.speechSynthesis.speaking);
  if (sp !== musicDuck) { musicDuck = sp; if (M) M.setVolume(sp ? musicBase * 0.4 : musicBase); }
}

if (S) {
  S.define('ts_step', (p, s) => { s.noise(0.05, { vol: 0.12, freq: 700 * p, type: 'lowpass', q: 1 }); s.tone(150 * p, 0.05, { vol: 0.06, slide: 90 }); });

function sgCircle(c, x, y, r, bg, ring) {
  circle(c, x, y + r * 0.06, r); c.fillStyle = 'rgba(0,0,0,.18)'; c.fill();
  circle(c, x, y, r); c.fillStyle = '#fff'; c.fill();

}
function sgSlash(c, x, y, r) {
  c.save(); c.beginPath(); c.arc(x, y, r * 0.75, 0, TAU); c.clip();
  c.strokeStyle = RED; c.lineWidth = r * 0.17; c.lineCap = 'butt';
  c.beginPath(); c.moveTo(x - r * 0.6, y - r * 0.6); c.lineTo(x + r * 0.6, y + r * 0.6); c.stroke(); c.restore();
}
function sgTri(c, x, y, r, down) {
  const pts = down ? [[0, 1], [-0.95, -0.75], [0.95, -0.75]] : [[0, -1], [0.95, 0.75], [-0.95, 0.75]];
  const path = k => { c.beginPath(); pts.forEach((p, i) => { const px = x + p[0] * r * k, py = y + (p[1] * k + (down ? -0.05 : 0.08)) * r; i ? c.lineTo(px, py) : c.moveTo(px, py); }); c.closePath(); };
  c.lineJoin = 'round';
  c.save(); c.translate(0, r * 0.06); path(1); c.fillStyle = 'rgba(0,0,0,.18)'; c.lineWidth = r * 0.12; c.strokeStyle = 'rgba(0,0,0,.18)'; c.fill(); c.stroke(); c.restore();
  path(1); c.fillStyle = '#fff'; c.lineWidth = r * 0.12; c.strokeStyle = '#fff'; c.fill(); c.stroke();
  path(0.92); c.fillStyle = RED; c.fill();
  path(0.62); c.fillStyle = '#fff'; c.fill();
}

  switch (name) {
