<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>環遊世界</title>
<link rel="stylesheet" href="../../assets/common.css">
<style>
  html, body { height: 100%; overflow: hidden; background: #4fb6e6; overscroll-behavior: none; }
  #map { position: fixed; inset: 0; width: 100vw; height: 100vh; height: 100dvh; display: block; touch-action: none; z-index: 1; outline: none; }
  .ui { position: fixed; z-index: 50; }
  .hide { display: none !important; }
  .card {
    background: linear-gradient(180deg, rgba(255,255,255,0.98), rgba(255,248,236,0.98));
    border: 4px solid #fff; border-radius: 24px;
    box-shadow: 0 8px 0 rgba(40,70,110,0.14), 0 14px 30px rgba(30,70,120,0.25);
  }
  button { font-family: var(--kg-font); }
  .kg-btn.sm { font-size: 16px; padding: 9px 18px; }
  .kg-btn.gray { background: linear-gradient(180deg, #f4f4f8, #cfd3de); color: #4a3b52; text-shadow: none; box-shadow: 0 5px 0 #a3a8b6, 0 10px 18px rgba(80,90,110,0.25); }
  .pill { background: #fff; border-radius: 999px; padding: 6px 14px; font-weight: 900; box-shadow: 0 3px 0 rgba(40,70,110,0.18); font-size: 16px; white-space: nowrap; }

  /* ---------- 標題 ---------- */
  #title { inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; padding: 64px 14px 14px; pointer-events: none; }
  #title > * { pointer-events: auto; }
  .logo { font-size: clamp(38px, 9vmin, 76px); font-weight: 900; letter-spacing: 4px; line-height: 1; text-align: center; white-space: nowrap; margin: 0; }
  .logo span { display: inline-block; animation: bob 2.6s ease-in-out infinite; color: #fff;
    text-shadow: 0 3px 0 #1f6fae, 0 -2px 0 #1f6fae, 2px 0 0 #1f6fae, -2px 0 0 #1f6fae, 3px 3px 0 #1f6fae, -3px 3px 0 #1f6fae, 0 9px 0 rgba(20,70,120,0.3); }
  .logo span:nth-child(1) { color: #ffd65c; } .logo span:nth-child(2) { color: #ff9fbe; animation-delay: .2s; }
  .logo span:nth-child(3) { color: #9be8aa; animation-delay: .4s; } .logo span:nth-child(4) { color: #ffb36b; animation-delay: .6s; }
  @keyframes bob { 0%,100% { transform: translateY(0) rotate(0); } 50% { transform: translateY(-5px) rotate(-2deg); } }
  .tsub { font-size: clamp(14px, 2.6vmin, 19px); font-weight: 800; color: #fff; text-shadow: 0 2px 0 rgba(20,70,120,0.45); text-align: center; }
  .menu { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; width: 100%; max-width: 520px; }
  .mbtn { display: flex; align-items: center; gap: 10px; padding: 9px 12px; border: 3px solid #fff; border-radius: 20px; cursor: pointer;
    color: var(--kg-ink); text-align: left; transition: transform .12s; box-shadow: 0 5px 0 rgba(30,60,100,0.2), 0 8px 18px rgba(30,60,100,0.18); min-height: 64px; }
  .mbtn:active { transform: translateY(3px) scale(0.98); }
  .mbtn canvas { width: 44px; height: 44px; flex: none; }
  .mbtn b { display: block; font-size: 18px; line-height: 1.15; }
  .mbtn small { display: block; font-size: 12px; font-weight: 700; opacity: 0.78; line-height: 1.2; }
  .mbtn.big { grid-column: 1 / -1; min-height: 72px; }
  .mbtn.big b { font-size: 22px; }
  .m-journey { background: linear-gradient(180deg, #fff6c9, #ffd66b); }
  .m-flags { background: linear-gradient(180deg, #ffe3ec, #ffaecb); }
  .m-find { background: linear-gradient(180deg, #ddf8e2, #9fe3ad); }
  .m-cap { background: linear-gradient(180deg, #e3f1ff, #9fd0ff); }
  .m-pass { background: linear-gradient(180deg, #efe6ff, #c8b2ff); }
  .trow { display: flex; gap: 8px; align-items: center; justify-content: center; flex-wrap: wrap; }
  .tog { border: 3px solid #fff; border-radius: 999px; padding: 6px 12px; font-size: 14px; font-weight: 900; cursor: pointer; background: #fff; color: #4a3b52; box-shadow: 0 3px 0 rgba(30,60,100,0.2); }
  .tog.off { background: #d9dde6; color: #8a8f9c; }

  /* ---------- 共用：上方 HUD、暫停鍵 ---------- */
  #hud { top: 12px; left: 66px; right: 66px; display: flex; justify-content: center; align-items: center; gap: 6px; pointer-events: none; flex-wrap: nowrap; }
  #hud .pill { font-size: clamp(13px, 2.3vmin, 17px); padding: 6px 11px; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
  #pauseBtn { top: 66px; right: 10px; width: 48px; height: 48px; border-radius: 50%; border: 3px solid #fff; background: linear-gradient(180deg, #fff, #e3f3ff);
    box-shadow: var(--kg-shadow); cursor: pointer; display: grid; place-items: center; padding: 0; z-index: 60; }
  #pauseBtn:active { transform: scale(0.9); }
  #pauseBtn i { display: block; width: 18px; height: 18px; border-left: 6px solid #3a6f9e; border-right: 6px solid #3a6f9e; box-sizing: border-box; }

  /* ---------- 彈出卡片（下方固定按鈕，中間捲動） ---------- */
  .sheet { left: 50%; transform: translateX(-50%); top: 66px; max-height: calc(100% - 76px); width: calc(100% - 20px); max-width: 600px; display: flex; flex-direction: column; overflow: hidden; z-index: 70; }
  .sheet.short { top: auto; bottom: 10px; }
  /* 卡片不要蓋住右上的暫停鍵 */
  @media (orientation: portrait) { .sheet { top: 120px; max-height: calc(100% - 130px); } }
  @media (orientation: landscape) { .sheet { width: calc(100% - 132px); } }
  .sheet .body { flex: 0 1 auto; min-height: 0; overflow-y: auto; padding: 12px 14px 8px; -webkit-overflow-scrolling: touch; touch-action: pan-y; }
  .sheet .foot { flex: none; display: flex; gap: 10px; justify-content: center; padding: 8px 10px 12px; border-top: 2px dashed #f0dcc6; flex-wrap: wrap; }
  .pop { animation: popIn .32s cubic-bezier(.2,1.5,.4,1); }
  @keyframes popIn { from { transform: translateX(-50%) scale(.85); opacity: 0; } to { transform: translateX(-50%) scale(1); opacity: 1; } }
  .ctitle { display: flex; align-items: center; gap: 12px; }
  .ctitle canvas.flag { width: 108px; height: 72px; flex: none; }
  .ctitle h2 { margin: 0; font-size: clamp(26px, 6vmin, 36px); line-height: 1.1; }
  .chip { display: inline-block; font-size: 13px; font-weight: 900; color: #fff; border-radius: 999px; padding: 2px 10px; margin-top: 4px; }
  .lmwrap { margin: 10px 0 6px; position: relative; }
  .lmwrap canvas { width: 100%; aspect-ratio: 5 / 3; border-radius: 16px; display: block; box-shadow: inset 0 0 0 3px rgba(255,255,255,.6); }
  .lmwrap .cap { position: absolute; left: 10px; bottom: 8px; background: rgba(255,255,255,.92); border-radius: 999px; padding: 3px 12px; font-weight: 900; font-size: 15px; }
  .tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 8px 0; }
  .tile { background: #fff; border-radius: 14px; padding: 7px 10px; box-shadow: 0 2px 0 rgba(0,0,0,0.06); display: flex; gap: 8px; align-items: center; min-width: 0; }
  .tile svg { width: 26px; height: 26px; flex: none; }
  .tile small { display: block; font-size: 12px; font-weight: 800; opacity: .6; }
  .tile b { display: block; font-size: 16px; line-height: 1.2; word-break: break-word; }
  .tile.wide { grid-column: 1 / -1; }
  .fact { display: flex; gap: 8px; align-items: flex-start; background: #fff7d6; border-radius: 14px; padding: 8px 10px; margin: 6px 0; font-weight: 700; font-size: 16px; line-height: 1.45; }
  .spk { flex: none; width: 36px; height: 36px; border-radius: 50%; border: 3px solid #fff; background: #ffd65c; cursor: pointer; display: grid; place-items: center; padding: 0; box-shadow: 0 3px 0 rgba(0,0,0,.12); }
  .spk:active { transform: scale(.9); }
  .spk svg { width: 20px; height: 20px; }
  @media (min-width: 700px) and (orientation: landscape) {
    #card.sheet { max-width: 820px; }
    #card .cols { display: grid; grid-template-columns: 1.05fr 1fr; gap: 14px; align-items: start; }
  }
  @media (max-height: 460px) and (orientation: landscape) {
    #card.sheet { max-width: 820px; }
    #card .cols { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; align-items: start; }
    .ctitle canvas.flag { width: 78px; height: 52px; }
  }

  /* ---------- 題目 ---------- */
  .qtext { font-size: clamp(20px, 4.6vmin, 28px); font-weight: 900; text-align: center; margin: 4px 0 12px; line-height: 1.3; }
  .choices { display: grid; grid-template-columns: 1fr; gap: 10px; }
  .choices.img { grid-template-columns: repeat(3, 1fr); }
  .choices.four { grid-template-columns: 1fr 1fr; }
  .cho { border: 3px solid #fff; border-radius: 18px; background: linear-gradient(180deg, #ffffff, #e9f5ff); box-shadow: 0 5px 0 rgba(40,90,140,0.2);
    font-size: clamp(18px, 4vmin, 22px); font-weight: 900; color: #3b3150; padding: 12px 10px; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 6px; min-height: 56px; justify-content: center; }
  .cho:active { transform: translateY(3px); }
  .cho canvas { width: 100%; max-width: 160px; aspect-ratio: 3 / 2; border-radius: 6px; }
  .cho canvas.lm { aspect-ratio: 5 / 3; border-radius: 12px; }
  .cho span { font-size: clamp(14px, 3.4vmin, 18px); }
  .cho.ok { background: linear-gradient(180deg, #d7ffd9, #8ee39b); }
  .cho.bad { background: linear-gradient(180deg, #ffe0e0, #ffaaa6); opacity: .7; }
  .cho.dim { opacity: .45; }
  .shake { animation: shake .35s; }
  @keyframes shake { 20% { transform: translateX(-7px); } 40% { transform: translateX(6px); } 60% { transform: translateX(-4px); } 80% { transform: translateX(3px); } }

  /* ---------- 旅程選擇 ---------- */
  .tgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 10px; }
  .trip { border: 3px solid #fff; border-radius: 18px; padding: 10px 12px; cursor: pointer; text-align: left; color: #3b3150; box-shadow: 0 4px 0 rgba(0,0,0,.12); display: flex; flex-direction: column; gap: 6px; }
  .trip:active { transform: translateY(2px); }
  .trip b { font-size: 19px; }
  .trip .fl { display: flex; gap: 4px; flex-wrap: wrap; }
  .trip .fl canvas { width: 30px; height: 20px; border-radius: 3px; box-shadow: 0 0 0 1px rgba(0,0,0,.15); }
  .trip .fl canvas.got { box-shadow: 0 0 0 2px #2aa84a; }
  .trip small { font-weight: 800; opacity: .75; }
  .stars { color: #f5b400; letter-spacing: 2px; font-size: 18px; }
  .stars i { font-style: normal; color: #d8d2c6; }

  /* ---------- 蓋章 ---------- */
  #stampFx { inset: 0; display: flex; align-items: center; justify-content: center; z-index: 80; background: rgba(20,40,70,.35); }
  #stampFx .page { position: relative; width: min(86vw, 340px); padding: 18px 16px 16px; border-radius: 18px; background: #fffaf0; border: 4px solid #fff;
    box-shadow: 0 12px 30px rgba(0,0,0,.3); text-align: center; background-image: repeating-linear-gradient(0deg, transparent 0 26px, rgba(110,150,200,.12) 26px 27px); }
  #stampFx .page h3 { margin: 0 0 4px; font-size: 22px; }
  #stampFx canvas { width: 180px; height: 180px; display: block; margin: 4px auto 8px; }
  #stampFx canvas.slam { animation: slam .42s cubic-bezier(.5,0,.6,1.3) both; }
  @keyframes slam { 0% { transform: scale(2.6) rotate(-14deg); opacity: 0; } 55% { transform: scale(.92) rotate(var(--rot)); opacity: 1; } 75% { transform: scale(1.05) rotate(var(--rot)); } 100% { transform: scale(1) rotate(var(--rot)); } }
  .bump { animation: bump .3s; }
  @keyframes bump { 30% { transform: translate(2px, 4px); } 60% { transform: translate(-2px, -1px); } }

  /* ---------- 國旗配對 ---------- */
  #match { left: 10px; right: 10px; top: 66px; bottom: 10px; display: flex; flex-direction: column; gap: 8px; align-items: center; }
  #match .hint { color: #fff; font-weight: 900; text-shadow: 0 2px 0 rgba(20,70,120,.5); font-size: 16px; text-align: center; }
  .mboard { flex: 1; width: 100%; max-width: 900px; display: flex; flex-direction: column; gap: 10px; min-height: 0; }
  .mside { flex: 1; display: grid; grid-template-columns: 1fr 1fr; gap: 10px; min-height: 0; }
  .mflag, .mname { border: 4px solid #fff; border-radius: 18px; background: rgba(255,255,255,.95); box-shadow: 0 5px 0 rgba(30,60,100,.22); cursor: pointer;
    display: flex; align-items: center; justify-content: center; padding: 6px; min-height: 0; position: relative; color: #3b3150; }
  .mflag canvas { max-width: 100%; max-height: 100%; width: 100%; height: 100%; object-fit: contain; }
  .mname { font-size: clamp(20px, 4.8vmin, 30px); font-weight: 900; }
  .mflag.sel, .mname.sel { border-color: #ffb400; box-shadow: 0 0 0 4px #ffd65c, 0 5px 0 rgba(30,60,100,.22); transform: translateY(-2px); }
  .mflag.done, .mname.done { cursor: default; background: #e6f8ea; border-color: #b8ecc4; box-shadow: 0 2px 0 rgba(30,60,100,.12); }
  .mflag.done canvas { opacity: .5; }
  .mname.done { color: #93a89a; }
  .mflag .tag, .mname .tag { position: absolute; top: -10px; right: -8px; width: 28px; height: 28px; border-radius: 50%; border: 3px solid #fff; color: #fff; font-size: 14px; font-weight: 900; display: grid; place-items: center; }
  @media (orientation: landscape) { .mboard { flex-direction: row; } #match { right: 66px; left: 66px; } }
  @media (orientation: portrait) { #match { top: 120px; } }

  /* ---------- 地圖找一找 ---------- */
  #findBox { top: 64px; left: 50%; transform: translateX(-50%); display: flex; align-items: center; gap: 10px; padding: 8px 16px; max-width: calc(100% - 132px); }
  #findBox canvas { width: 54px; height: 36px; flex: none; }
  #findBox .ask { font-size: 13px; font-weight: 800; color: #4a7aa0; }
  #findBox .nm { font-size: clamp(22px, 5vmin, 32px); font-weight: 900; line-height: 1.1; color: #e8648d; white-space: nowrap; }
  #findBox .nm.pulse { animation: kgpop .35s cubic-bezier(.2,1.6,.4,1); }
  @keyframes kgpop { from { transform: scale(.7); } to { transform: scale(1); } }
  #mapHint { bottom: 12px; left: 50%; transform: translateX(-50%); color: #fff; font-weight: 900; font-size: 14px; text-shadow: 0 2px 0 rgba(20,70,120,.5); white-space: nowrap; pointer-events: none; }

  /* ---------- 首都快問快答 ---------- */
  #capq { left: 50%; transform: translateX(-50%); top: 66px; bottom: 10px; width: calc(100% - 20px); max-width: 620px; display: flex; flex-direction: column; justify-content: center; gap: 12px; }
  #capq .qcard { padding: 14px; display: flex; flex-direction: column; align-items: center; gap: 6px; }
  #capq .qcard canvas { width: 120px; height: 80px; }
  #timebar { width: 100%; height: 12px; border-radius: 999px; background: rgba(255,255,255,.5); overflow: hidden; }
  #timebar i { display: block; height: 100%; width: 100%; background: linear-gradient(90deg, #7bd88f, #ffd65c); border-radius: 999px; transform-origin: left; }
  #timebar.low i { background: linear-gradient(90deg, #ff8a6a, #ffb36b); }
  @media (max-height: 460px) and (orientation: landscape) {
    #capq { flex-direction: row; align-items: center; max-width: 820px; }
    #capq .qcard { flex: 1; }
    #capq .choices { flex: 1.2; }
    #timebar { position: absolute; top: -6px; left: 0; }
  }

  /* ---------- 護照 ---------- */
  #passport { left: 50%; transform: translateX(-50%); top: 66px; bottom: 10px; width: calc(100% - 20px); max-width: 720px; display: flex; flex-direction: column; gap: 8px; perspective: 1400px; }
  #pbook { flex: 1; min-height: 0; position: relative; }
  .ppage { position: absolute; inset: 0; border-radius: 10px 22px 22px 10px; background: #fffaf0; border: 4px solid #fff; box-shadow: -6px 0 0 #2d5a8a, 0 12px 26px rgba(0,0,0,.25);
    padding: 12px 14px; overflow-y: auto; touch-action: pan-y; transform-origin: left center; backface-visibility: hidden;
    background-image: repeating-linear-gradient(0deg, transparent 0 30px, rgba(110,150,200,.1) 30px 31px); }
  .ppage.turnL { animation: turnL .45s ease-in both; }
  .ppage.turnR { animation: turnR .45s ease-out both; }
  @keyframes turnL { from { transform: rotateY(0); } to { transform: rotateY(-100deg); opacity: .2; } }
  @keyframes turnR { from { transform: rotateY(-100deg); opacity: .2; } to { transform: rotateY(0); opacity: 1; } }
  .ppage h3 { margin: 0 0 2px; font-size: 24px; display: flex; align-items: center; gap: 8px; }
  .ppage .pn { font-size: 13px; font-weight: 800; opacity: .6; }
  .sgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 8px; margin-top: 8px; }
  .slot { display: flex; flex-direction: column; align-items: center; gap: 2px; cursor: pointer; border: none; background: none; padding: 2px; color: #3b3150; }
  .slot canvas { width: 88px; height: 88px; }
  .slot span { font-size: 13px; font-weight: 900; }
  .slot.empty span { opacity: .45; }
  .cover { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; text-align: center; height: 100%;
    background: linear-gradient(160deg, #2f6aa6, #1d4a7d) !important; color: #ffe8a3; }
  .cover h2 { margin: 0; font-size: 36px; letter-spacing: 6px; }
  .cover canvas { width: 120px; height: 120px; }
  .cover p { margin: 0; font-weight: 800; color: #fff; }
  .pnav { display: flex; gap: 10px; justify-content: center; align-items: center; flex: none; }

  /* ---------- 共用彈窗 ---------- */
  .modal { inset: 0; display: flex; align-items: center; justify-content: center; z-index: 90; background: rgba(20,40,70,.45); padding: 70px 12px 12px; }
  .modal .card { width: min(92vw, 420px); max-height: 100%; overflow-y: auto; padding: 18px 18px 16px; text-align: center; display: flex; flex-direction: column; gap: 10px; align-items: center; }
  .modal h2 { margin: 0; font-size: 28px; }
  .modal p { margin: 0; font-weight: 700; }
  .modal .btns { display: flex; flex-direction: column; gap: 10px; width: 100%; max-width: 280px; }
  .modal .row2 { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
  .bigstars { display: flex; gap: 6px; justify-content: center; }
  .bigstars svg { width: 48px; height: 48px; animation: kgpop .4s cubic-bezier(.2,1.6,.4,1) both; }

  @media (max-height: 520px) and (orientation: landscape) {
    .modal { padding-top: 58px; }
    .modal .card { padding: 10px 14px; gap: 6px; }
    .modal h2 { font-size: 22px; }
    .bigstars svg { width: 34px; height: 34px; }
    .modal .btns { flex-direction: row; max-width: 380px; }
    .modal .btns .kg-btn { flex: 1; font-size: 17px; padding: 10px 12px; }
  }
  /* 回饋文字：同時只有一個 */
  #fb { left: 50%; top: 40%; transform: translate(-50%, -50%); z-index: 85; pointer-events: none; font-size: clamp(26px, 6vmin, 40px); font-weight: 900; color: #fff; white-space: nowrap;
    text-shadow: 0 3px 0 #1f6fae, 0 -2px 0 #1f6fae, 2px 0 0 #1f6fae, -2px 0 0 #1f6fae; opacity: 0; }
  #fb.show { animation: fbIn 1.1s ease-out both; }
  #fb.good { color: #fff6a8; } #fb.bad { color: #ffd0d0; }
  @keyframes fbIn { 0% { opacity: 0; transform: translate(-50%, -30%) scale(.6); } 15% { opacity: 1; transform: translate(-50%, -50%) scale(1.1); } 30% { transform: translate(-50%, -50%) scale(1); } 80% { opacity: 1; } 100% { opacity: 0; transform: translate(-50%, -70%) scale(1); } }
  #flyMsg { top: 64px; left: 50%; transform: translateX(-50%); padding: 7px 16px; font-weight: 900; font-size: clamp(15px, 3.4vmin, 20px); white-space: nowrap; }
  .back { position: fixed; z-index: 60; }
  @media (orientation: portrait) {
    #title { justify-content: flex-end; padding-bottom: 16px; }
    .mbtn { padding: 8px 8px; gap: 8px; }
    .mbtn canvas { width: 36px; height: 36px; }
    .mbtn b { font-size: clamp(15px, 4.4vw, 18px); white-space: nowrap; }
  }
  @media (max-height: 520px) and (orientation: landscape) {
    #title { padding-top: 54px; gap: 6px; }
    .logo { font-size: clamp(30px, 8vh, 44px); }
    .tsub { font-size: 14px; }
    .menu { grid-template-columns: repeat(3, 1fr); max-width: 760px; gap: 8px; }
    .mbtn.big { grid-column: auto; }
    .mbtn.big b { font-size: 18px; }
    .mbtn { min-height: 58px; padding: 6px 10px; }
  }
</style>
</head>
<body>
<canvas id="map" tabindex="0" aria-label="世界地圖"></canvas>

<div id="hud" class="ui hide"><div class="pill" id="hudL"></div><div class="pill" id="hudR"></div></div>
<button id="pauseBtn" class="ui hide" aria-label="暫停"><i></i></button>
<div id="flyMsg" class="ui card hide"></div>

<section id="title" class="ui">
  <h1 class="logo" aria-label="環遊世界"><span>環</span><span>遊</span><span>世</span><span>界</span></h1>
  <div class="tsub">坐上小飛機，認識世界各國！</div>
  <div class="menu">
    <button class="mbtn big m-journey" data-go="journey"><canvas data-ic="plane"></canvas><span><b>環遊旅行</b><small>飛到各國探險，收集護照印章</small></span></button>

  $('pNum').textContent = `${i + 1} / ${PAGES.length}`;
  $('pPrev').disabled = i === 0; $('pNext').disabled = i === PAGES.length - 1;
  $('pPrev').style.opacity = i === 0 ? 0.45 : 1; $('pNext').style.opacity = i === PAGES.length - 1 ? 0.45 : 1;
}
function turnPage(d) {
  const n = clamp(G.page + d, 0, PAGES.length - 1); if (n === G.page) { sfx('wt_miss'); return; }
  G.page = n; sfx('wt_page', { pitch: d > 0 ? 1 : 0.9 }); renderPage(n, d);
}

/* ---------- 結果、暫停 ---------- */
let resultAgain = null, resultMenu = null;
function showResult(title, stars, msg, best, again, menu, menuText) {
  $('rTitle').textContent = title; $('rMsg').textContent = msg; $('rBest').textContent = best || '';
  $('rStars').innerHTML = [0, 1, 2].map(i => starSvg(i < stars).replace('<svg', `<svg style="animation-delay:${0.15 + i * 0.15}s"`)).join('');
  $('rMenu').textContent = menuText || '回選單';
  resultAgain = again; resultMenu = menu;
  hide('pauseBtn'); unhide('result');
  [0, 1, 2].forEach(i => { if (i < stars) setTimeout(() => sfx('wt_combo', { exact: true, pitch: 1 + i * 0.12 }), 300 + i * 150); });
}
const GAME_MODES = ['journey', 'flags', 'find', 'capital'];
function canPause() { return GAME_MODES.includes(G.mode) && $('result').classList.contains('hide'); }
function pauseGame() {
  if (G.paused || !canPause()) return;
  G.paused = true; if (M) M.pause(); engineStop(); stopSay();
  syncToggles(); unhide('pause'); sfx('wt_back');
}
function resumeGame() {
  if (!G.paused) return;
  G.paused = false; hide('pause'); if (M) M.resume(); sfx('wt_ui');
  if (flight && !flight.silent) engineStart();
}

/* ---------- 輸入：地圖拖曳、縮放、點擊 ---------- */
const ptrs = new Map(); let pinch = null, tapStart = null;
function canvasXY(e) { const r = cv.getBoundingClientRect(); return { x: (e.clientX - r.left) * (VW / Math.max(1, r.width)), y: (e.clientY - r.top) * (VH / Math.max(1, r.height)) }; }
function panAllowed() { return !G.paused && (G.mode === 'find' || G.mode === 'title' || (G.mode === 'journey' && !flight && $('card').classList.contains('hide') && $('question').classList.contains('hide') && $('stampFx').classList.contains('hide'))); }
cv.addEventListener('pointerdown', e => {
  const p = canvasXY(e); ptrs.set(e.pointerId, p);
  try { cv.setPointerCapture(e.pointerId); } catch (err) { /* 忽略 */ }
  if (ptrs.size === 1) tapStart = { x: p.x, y: p.y, t: performance.now(), moved: 0 };
  if (ptrs.size === 2) { const [a, b] = [...ptrs.values()]; pinch = { d: Math.hypot(a.x - b.x, a.y - b.y), s: cam.s }; tapStart = null; }
});
cv.addEventListener('pointermove', e => {
  if (!ptrs.has(e.pointerId)) return;
  const p = canvasXY(e), prev = ptrs.get(e.pointerId); ptrs.set(e.pointerId, p);
  if (!panAllowed()) return;
  if (ptrs.size === 1) {
    const dx = p.x - prev.x, dy = p.y - prev.y;
    if (tapStart) tapStart.moved += Math.abs(dx) + Math.abs(dy);
    if (!tapStart || tapStart.moved > 8) { camFollow = false; cam.x -= dx / cam.s; cam.y -= dy / cam.s; clampCam(cam); Object.assign(camT, cam); }
  } else if (ptrs.size === 2 && pinch) {
    const [a, b] = [...ptrs.values()]; const d = Math.hypot(a.x - b.x, a.y - b.y), mx = (a.x + b.x) / 2, my0 = (a.y + b.y) / 2;
    const wx0 = wx(mx), wy0 = wy(my0);
    cam.s = clamp(pinch.s * d / Math.max(10, pinch.d), minScale(), 40);
    cam.x = wx0 - (mx - VW / 2) / cam.s; cam.y = wy0 - (my0 - VH / 2) / cam.s; clampCam(cam); camFollow = false; Object.assign(camT, cam);
  }
});
function ptrEnd(e) {
  if (!ptrs.has(e.pointerId)) return;
  const p = ptrs.get(e.pointerId); ptrs.delete(e.pointerId);
  if (ptrs.size < 2) pinch = null;
  if (e.type === 'pointerup' && tapStart && ptrs.size === 0 && tapStart.moved <= 10 && performance.now() - tapStart.t < 700) mapTap(p.x, p.y);
  if (ptrs.size === 0) tapStart = null;
}
cv.addEventListener('pointerup', ptrEnd); cv.addEventListener('pointercancel', ptrEnd);
cv.addEventListener('wheel', e => {
  e.preventDefault(); if (!panAllowed()) return;
  const p = canvasXY(e), wx0 = wx(p.x), wy0 = wy(p.y);
  cam.s = clamp(cam.s * Math.exp(-e.deltaY * 0.0015), minScale(), 40);
  cam.x = wx0 - (p.x - VW / 2) / cam.s; cam.y = wy0 - (p.y - VH / 2) / cam.s; clampCam(cam); camFollow = false; Object.assign(camT, cam);
}, { passive: false });
function mapTap(X, Y) {
  if (G.paused) return;
  if (G.mode === 'find') { findTap(X, Y); return; }
  if (G.mode === 'title' || G.mode === 'journey') {
    // 點國家：小小的嗶聲＋名字
    let best = null, bd = 30 * 30;
    for (const d of FLAGGED) { const dx = sx(d.x) - X, dy = sy(d.y) - Y, dd = dx * dx + dy * dy; if (dd < bd) { bd = dd; best = d; } }
    sfx('wt_blip', { x: X });
    if (best) { G.tapLabel = { code: best.c, t: G.time }; } else { const k = landAt(wx(X), wy(Y)); if (k) G.tapLabel = { cont: k, x: X, y: Y, t: G.time }; else G.tapLabel = { ocean: oceanAt(wx(X), wy(Y)), x: X, y: Y, t: G.time }; }
  }
}
function drawTapLabel(c) {
  const T = G.tapLabel; if (!T || G.time - T.t > 1.6) return;
  if (T.code) { const d = BY[T.code]; labelAt(c, sx(d.x), sy(d.y) - 18, d.n, CONT[d.k].ink); }
  else if (T.cont) labelAt(c, T.x, T.y - 14, CONT[T.cont].n, CONT[T.cont].ink);
  else labelAt(c, T.x, T.y - 14, OCEANS.find(o => o.id === T.ocean).n, '#2a7ab8');
}

/* ---------- 主迴圈 ---------- */
let lastT = performance.now(), speed = 1;
function frame(now) {
  requestAnimationFrame(frame);
  let dt = Math.min(0.05, (now - lastT) / 1000); lastT = now;
  if (!G.paused) {
    dt *= speed; G.time += dt;
    for (let i = later.length - 1; i >= 0; i--) { const L = later[i]; L.t -= dt; if (L.t <= 0) { later.splice(i, 1); L.fn(); } }
    updateFlight(dt); updParts(dt);
    if (G.mode === 'flags' && $('result').classList.contains('hide')) { G.el += dt; if (Math.floor(G.el) !== G.elShown) { G.elShown = Math.floor(G.el); flagsHud(); } }
    if (G.mode === 'capital') updateCapital(dt);
    if (G.mode === 'title') titleTour(dt);
  } else dt = 0;
  if (camFollow) { const k = 1 - Math.exp(-dt * (flight ? 2.4 : 3.2)); cam.x = lerp(cam.x, camT.x, k); cam.y = lerp(cam.y, camT.y, k); cam.s = lerp(cam.s, camT.s, k); }
  if (plane.bounce > 0) plane.bounce = Math.max(0, plane.bounce - dt * 3);
  const c = ctx; c.setTransform(DPR, 0, 0, DPR, 0, 0);
  drawMap(c, G.time);
  drawRoute(c);
  drawPins(c, G.time);
  drawParts(c);
  if (plane.show && G.mode !== 'find' && G.mode !== 'flags' && G.mode !== 'capital' && G.mode !== 'passport') {
    const X = sx(plane.x), Y = sy(plane.y) - 10 - plane.alt * 26 - Math.sin(plane.bounce * Math.PI) * 6;
    const size = clamp(Math.min(VW, VH) * 0.11, 40, 70) * (1 + plane.alt * 0.25);
    drawPlane(c, X, Y, size, plane.dir, plane.tilt, G.time, plane.alt);
  }
  drawTapLabel(c);
  drawClouds(c, dt);
  drawCardFlag(dt);
}
// 標題畫面：小飛機自己在世界各地飛來飛去
function titleTour(dt) {
  if (flight) return;
  G.tourWait = (G.tourWait || 0) - dt;
  if (G.tourWait > 0) return;
  const d = KG.pick(FLAGGED.filter(o => o.c !== plane.at && Math.abs(o.x - plane.x) < 140));
  startFlight(d.c, () => { G.tourWait = 0.8; }, { silent: true });
}

/* ---------- 綁定按鈕 ---------- */
document.querySelectorAll('[data-go]').forEach(b => b.addEventListener('click', () => {
  sfx('wt_sel'); const g = b.dataset.go;
  if (g === 'journey') openTrips(); else if (g === 'flags') startFlags(); else if (g === 'find') startFind(); else if (g === 'capital') startCapital(); else if (g === 'passport') openPassport();
}));
$('tripsBack').addEventListener('click', () => { sfx('wt_back'); goTitle(); });
$('tMusic').addEventListener('click', () => toggle('music')); $('pMusic').addEventListener('click', () => toggle('music'));
$('tSfx').addEventListener('click', () => toggle('sfx')); $('pSfx').addEventListener('click', () => toggle('sfx'));
$('tVoice').addEventListener('click', () => toggle('voice')); $('pVoice').addEventListener('click', () => toggle('voice'));
$('pauseBtn').addEventListener('click', pauseGame);
$('pResume').addEventListener('click', resumeGame);
$('pMenu').addEventListener('click', () => { hide('pause'); sfx('wt_back'); goTitle(); });
$('stampNext').addEventListener('click', stampNext);
$('rAgain').addEventListener('click', () => { sfx('wt_sel'); hide('result'); if (resultAgain) resultAgain(); });
$('rMenu').addEventListener('click', () => { sfx('wt_back'); hide('result'); if (resultMenu) resultMenu(); });
$('pPrev').addEventListener('click', () => turnPage(-1)); $('pNext').addEventListener('click', () => turnPage(1));
$('pBack').addEventListener('click', () => { sfx('wt_back'); goTitle(); });
// 護照左右滑動翻頁
(() => { let sx0 = null; const b = $('pbook'); b.addEventListener('pointerdown', e => { sx0 = e.clientX; }); b.addEventListener('pointerup', e => { if (sx0 != null && Math.abs(e.clientX - sx0) > 60) turnPage(e.clientX < sx0 ? 1 : -1); sx0 = null; }); })();
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' || e.key === 'p' || e.key === 'P') { if (G.paused) resumeGame(); else pauseGame(); return; }
  if (G.paused) return;
  const n = parseInt(e.key, 10);
  if (n >= 1 && n <= 4) {
    if (!$('question').classList.contains('hide')) { const b = $('qBody').querySelectorAll('.cho')[n - 1]; if (b && !b.disabled) b.click(); }
    else if (G.mode === 'capital') { const b = $('capCho').children[n - 1]; if (b) b.click(); }
  }
  if (e.key === 'Enter' || e.key === ' ') {
    if (!$('stampFx').classList.contains('hide')) { e.preventDefault(); stampNext(); }
    else if (!$('card').classList.contains('hide')) { e.preventDefault(); const b = $('cardFoot').lastElementChild; if (b) b.click(); }
  }
  if (G.mode === 'passport' && $('card').classList.contains('hide')) { if (e.key === 'ArrowRight') turnPage(1); if (e.key === 'ArrowLeft') turnPage(-1); }
});
document.addEventListener('visibilitychange', () => { if (document.hidden) pauseGame(); });
function onResize() {
  resize();
  if (G.mode === 'title') fitWorld(true, titleIns());
  else if (G.mode === 'find' && G.fq) { const q = G.fqs[G.qi]; if (q.type === 'country') { const d = BY[q.id]; const ds = FLAGGED.filter(o => o.k === d.k); fitBox(Math.min(...ds.map(o => o.x)) - 10, Math.min(...ds.map(o => o.y)) - 8, Math.max(...ds.map(o => o.x)) + 10, Math.max(...ds.map(o => o.y)) + 8, findIns(), 14, true); } else fitWorld(true, findIns()); }
  else if (!flight) clampCam(camT);
  if (G.mode === 'flags') requestAnimationFrame(drawMatchFlags);
}
window.addEventListener('resize', onResize);
window.addEventListener('orientationchange', () => setTimeout(onResize, 120));
if (window.visualViewport) window.visualViewport.addEventListener('resize', onResize);

/* ---------- 開始 ---------- */
resize(); drawMenuIcons(); if (M) M.setVolume(MUSIC_VOL);
goTitle(); fitWorld(true, titleIns());
requestAnimationFrame(frame);

/* 測試掛鉤 */
window.__wt = {
  G, cam, plane, STAMPS, BY, COUNTRIES, TRIPS,
  speed(n) { speed = n; }, flying() { return !!flight; },
  finishFlight() { if (flight) flight.t = 0.999; },
  sx, sy, landAt, oceanAt, wx, wy,
  startTrip(i) { startTrip(TRIPS[i]); }, startFlags, startFind, startCapital, openPassport, goTitle,
  answer(ok) { if (G.mode === 'capital') { const i = G.cq.opts.findIndex(o => (o === G.cq.d) === ok); $('capCho').children[i].click(); return; } const q = G.q; const i = q.opts.findIndex(o => (o === q.ans) === ok); $('qBody').querySelectorAll('.cho')[i].click(); },
  fq() { return G.fq; }, countryXY(code) { const d = BY[code]; return [sx(d.x), sy(d.y)]; }
};

</script>
