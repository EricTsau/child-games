<script>
'use strict';
/* =====================================================================
 * 垃圾分類小尖兵：照台灣的分類方式，把垃圾丟進正確的桶子！
 * 練習模式、闖關（輸送帶）、垃圾車來了、貼紙簿
 * ===================================================================== */
(function () {
const SLUG = 'recycle-sort';
const cv = document.getElementById('game');
const ctx = cv.getContext('2d');
const FONT = '"PingFang TC","Noto Sans TC","Microsoft JhengHei","Heiti TC",system-ui,sans-serif';
let W = 360, H = 640, dpr = 1, U = 1, time = 0;
const TAU = Math.PI * 2;
const INK = '#3b2f4a';
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const lerp = (a, b, t) => a + (b - a) * t;
const rand = (a, b) => a + Math.random() * (b - a);
const Ease = {
  outCubic: t => 1 - Math.pow(1 - t, 3),
  inOutSine: t => -(Math.cos(Math.PI * t) - 1) / 2,
  outBack: t => { const c = 1.70158, c3 = c + 1; return 1 + c3 * Math.pow(t - 1, 3) + c * Math.pow(t - 1, 2); },
  outElastic: t => (t === 0 || t === 1) ? t : Math.pow(2, -10 * t) * Math.sin((t * 10 - 0.75) * (TAU / 3)) + 1,
  outBounce: t => {
    const n = 7.5625, d = 2.75;
    if (t < 1 / d) return n * t * t;
    if (t < 2 / d) return n * (t -= 1.5 / d) * t + 0.75;
    if (t < 2.5 / d) return n * (t -= 2.25 / d) * t + 0.9375;
    return n * (t -= 2.625 / d) * t + 0.984375;
  }
};

/* ---------- 補間動畫、延遲呼叫、畫面震動 ---------- */
const tweens = [];
function tween(obj, to, dur, ease, delay, done) {
  const tw = { obj, to, from: null, dur: dur || 0.3, ease: typeof ease === 'function' ? ease : (Ease[ease] || Ease.outCubic), t: -(delay || 0), done };
  tweens.push(tw);
  return tw;
}
function killTweens(obj) { for (let i = tweens.length - 1; i >= 0; i--) if (tweens[i].obj === obj) tweens.splice(i, 1); }
function updateTweens(dt) {
  for (let i = tweens.length - 1; i >= 0; i--) {
    const tw = tweens[i];
    if (!tw) continue;
    tw.t += dt;
    if (tw.t < 0) continue;
    if (!tw.from) { tw.from = {}; for (const k in tw.to) tw.from[k] = tw.obj[k]; }
    const p = Math.min(1, tw.t / tw.dur), e = tw.ease(p);
    for (const k in tw.to) tw.obj[k] = tw.from[k] + (tw.to[k] - tw.from[k]) * e;
    if (p >= 1) { const j = tweens.indexOf(tw); if (j >= 0) tweens.splice(j, 1); if (tw.done) tw.done(); }
  }
}
const timers = [];
function after(sec, fn) { timers.push({ t: sec, fn }); }
function updateTimers(dt) {
  for (let i = timers.length - 1; i >= 0; i--) {
    const tm = timers[i];
    tm.t -= dt;
    if (tm.t <= 0) { timers.splice(i, 1); tm.fn(); }
  }
}
let shakeT = 0, shakeAmt = 0, shx = 0, shy = 0;
function shake(a, d) { shakeAmt = Math.max(shakeT > 0 ? shakeAmt : 0, a); shakeT = Math.max(shakeT, d || 0.25); }

/* ---------- 繪圖小工具 ---------- */
function circ(x, y, r) { ctx.moveTo(x + r, y); ctx.arc(x, y, r, 0, TAU); }
function rr(x, y, w, h, r) {
  r = Math.max(0, Math.min(r, w / 2, h / 2));
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}
function starPath(x, y, R, r, rot) {
  ctx.beginPath();
  for (let i = 0; i < 10; i++) {
    const a = (rot || 0) + i * Math.PI / 5 - Math.PI / 2, rad = i % 2 ? r : R;
    ctx.lineTo(x + Math.cos(a) * rad, y + Math.sin(a) * rad);
  }
  ctx.closePath();
}
function heartPath(x, y, s) {
  ctx.beginPath();
  ctx.moveTo(x, y + s * 0.35);
  ctx.bezierCurveTo(x - s * 1.1, y - s * 0.35, x - s * 0.55, y - s * 1.05, x, y - s * 0.45);
  ctx.bezierCurveTo(x + s * 0.55, y - s * 1.05, x + s * 1.1, y - s * 0.35, x, y + s * 0.35);
  ctx.closePath();

function shade(hex, amt) {

  return 'rgb(' + f(n >> 16) + ',' + f((n >> 8) & 255) + ',' + f(n & 255) + ')';
}
function rgba(hex, a) {
  const n = parseInt(hex.slice(1), 16);
  return 'rgba(' + (n >> 16) + ',' + ((n >> 8) & 255) + ',' + (n & 255) + ',' + a + ')';
}
function setFont(size, weight) { ctx.font = (weight || '900') + ' ' + Math.round(size) + 'px ' + FONT; }
/** 有外框與陰影的字 */
function txt(s, x, y, size, fill, o) {
  o = o || {};
  ctx.save();
  setFont(size, o.weight);
  ctx.textAlign = o.align || 'center';
  ctx.textBaseline = 'middle';
  ctx.lineJoin = 'round';
  if (o.shadow !== false) {
    ctx.fillStyle = o.shadow || 'rgba(40,40,70,0.25)';
    if (o.stroke) { ctx.strokeStyle = ctx.fillStyle; ctx.lineWidth = o.sw || size * 0.22; ctx.strokeText(s, x, y + size * 0.09); }
    ctx.fillText(s, x, y + size * 0.09);
  }
  if (o.stroke) { ctx.strokeStyle = o.stroke; ctx.lineWidth = o.sw || size * 0.22; ctx.strokeText(s, x, y); }
  ctx.fillStyle = fill; ctx.fillText(s, x, y);
  ctx.restore();

/** 標題字：每個字會彈跳 */
function logo(s, cx, cy, size, colors) {
  ctx.save();
  setFont(size);
  ctx.textBaseline = 'middle'; ctx.textAlign = 'center'; ctx.lineJoin = 'round';
  const chars = [...s];
  let total = 0;
  const widths = chars.map(c => { const w = ctx.measureText(c).width * 1.02; total += w; return w; });
  let x = cx - total / 2;
  chars.forEach((c, i) => {
    const w = widths[i];
    const bob = Math.sin(time * 3 + i * 0.7) * size * 0.06;
    const rot = Math.sin(time * 2.2 + i) * 0.06;
    ctx.save();
    ctx.translate(x + w / 2, cy + bob); ctx.rotate(rot);
    ctx.strokeStyle = 'rgba(30,60,40,0.3)'; ctx.lineWidth = size * 0.36; ctx.strokeText(c, 0, size * 0.1);
    ctx.strokeStyle = '#2c5a3c'; ctx.lineWidth = size * 0.34; ctx.strokeText(c, 0, 0);
    ctx.strokeStyle = '#fff'; ctx.lineWidth = size * 0.17; ctx.strokeText(c, 0, 0);
    const col = colors[i % colors.length];
    const g = ctx.createLinearGradient(0, -size / 2, 0, size / 2);
    g.addColorStop(0, shade(col, 70)); g.addColorStop(0.5, col); g.addColorStop(1, shade(col, -35));
    ctx.fillStyle = g; ctx.fillText(c, 0, 0);
    ctx.globalAlpha = 0.55; ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.ellipse(-w * 0.18, -size * 0.25, size * 0.1, size * 0.05, -0.5, 0, TAU); ctx.fill();
    ctx.restore();
    x += w;
  });
  ctx.restore();
}
function glossyStar(x, y, R, on, rot) {
  ctx.save();
  ctx.lineJoin = 'round';
  if (on) {
    ctx.fillStyle = 'rgba(160,90,0,0.25)'; starPath(x, y + R * 0.12, R, R * 0.5, rot); ctx.fill();
    const g = ctx.createRadialGradient(x - R * 0.3, y - R * 0.4, R * 0.1, x, y, R * 1.1);
    g.addColorStop(0, '#fffbd0'); g.addColorStop(0.45, '#ffd93d'); g.addColorStop(1, '#f39a0c');
    ctx.fillStyle = g; ctx.strokeStyle = '#c9700a'; ctx.lineWidth = Math.max(1.5, R * 0.12);
    starPath(x, y, R, R * 0.5, rot); ctx.fill(); ctx.stroke();
    ctx.fillStyle = 'rgba(255,255,255,0.75)';
    ctx.beginPath(); ctx.ellipse(x - R * 0.25, y - R * 0.3, R * 0.22, R * 0.12, -0.6, 0, TAU); ctx.fill();
  } else {
    ctx.fillStyle = 'rgba(70,90,80,0.2)'; ctx.strokeStyle = 'rgba(70,90,80,0.35)'; ctx.lineWidth = Math.max(1.5, R * 0.1);
    starPath(x, y, R, R * 0.5, rot); ctx.fill(); ctx.stroke();
  }
  ctx.restore();
}
function flatHeart(x, y, s, on) {
  ctx.lineJoin = 'round';
  ctx.fillStyle = on ? '#ff5a86' : 'rgba(70,90,80,0.2)';
  ctx.strokeStyle = on ? '#a3163f' : 'rgba(70,90,80,0.35)';
  ctx.lineWidth = Math.max(1.5, s * 0.12);
  heartPath(x, y, s); ctx.fill(); ctx.stroke();
  if (on) { ctx.fillStyle = 'rgba(255,255,255,0.7)'; ctx.beginPath(); ctx.ellipse(x - s * 0.4, y - s * 0.45, s * 0.18, s * 0.1, -0.7, 0, TAU); ctx.fill(); }
}
function pill(x, y, w, h, col) {
  rr(x, y + 3, w, h, h / 2); ctx.fillStyle = 'rgba(30,60,40,0.18)'; ctx.fill();
  rr(x, y, w, h, h / 2); ctx.fillStyle = '#fffef8'; ctx.fill();
  ctx.strokeStyle = col; ctx.lineWidth = 3; ctx.stroke();
}
/** 自動換行（中文逐字） */
const wrapCache = new Map();
function wrapText(s, maxW, size) {
  const key = s + '|' + Math.round(maxW) + '|' + Math.round(size);
  let r = wrapCache.get(key);
  if (r) return r;
  setFont(size, '800');
  r = [];
  let line = '';
  for (const ch of s) {
    const t = line + ch;
    if (ctx.measureText(t).width > maxW && line) {
      // 標點不要放在行首
      if ('，。！？、：）」'.indexOf(ch) >= 0 && line.length > 1) { r.push(line.slice(0, -1)); line = line.slice(-1) + ch; }
      else { r.push(line); line = ch; }
    } else line = t;
  }
  if (line) r.push(line);
  if (wrapCache.size > 300) wrapCache.clear();
  wrapCache.set(key, r);

/* ---------- 按鈕（每一格畫面重新登記，支援鍵盤焦點） ---------- */
let btnReg = [], pressed = null, focusId = null, kbMode = false, mouseSeen = false;
const BTN = {
  green: ['#a6f59c', '#3fbf5c', '#24873e'], pink: ['#ffb3cc', '#f45f93', '#b8366a'], blue: ['#a8e0ff', '#3c9ff0', '#22659e'],
  yellow: ['#fff09a', '#f8b921', '#b57c0b'], purple: ['#dcc6ff', '#9b6ff2', '#5f3fae'], orange: ['#ffd0a0', '#ff8a3d', '#c1561a'],
  white: ['#ffffff', '#eef5ef', '#9fb8a6'], teal: ['#a6f0e6', '#2fb7a6', '#1c7d71']

function drawIcon(name, x, y, s, col) {

  else if (name === 'pause') { rr(-s * 0.38, -s * 0.42, s * 0.26, s * 0.84, s * 0.08); ctx.fill(); rr(s * 0.12, -s * 0.42, s * 0.26, s * 0.84, s * 0.08); ctx.fill(); }

    ctx.beginPath(); ctx.moveTo(ex + s * 0.2, ey - s * 0.05); ctx.lineTo(ex - s * 0.02, ey + s * 0.25); ctx.lineTo(ex - s * 0.25, ey - s * 0.12); ctx.closePath(); ctx.fill();
  }

  else if (name === 'back') { ctx.beginPath(); ctx.moveTo(s * 0.4, 0); ctx.lineTo(-s * 0.35, 0); ctx.moveTo(-s * 0.05, -s * 0.32); ctx.lineTo(-s * 0.38, 0); ctx.lineTo(-s * 0.05, s * 0.32); ctx.stroke(); }

    ctx.lineWidth = s * 0.16; ctx.beginPath(); ctx.arc(0, -s * 0.12, s * 0.26, Math.PI, 0); ctx.stroke();

/** 立體按鈕。o: {label, icon, color, onClick, size, pulse, disabled, def, radius} */
function button(id, x, y, w, h, o) {

  const isDown = pressed && pressed.id === id;

  rr(-w / 2, -h / 2 + lip + 3, w, h, r); ctx.fillStyle = 'rgba(30,60,40,0.2)'; ctx.fill();
  rr(-w / 2, -h / 2 + lip, w, h, r); ctx.fillStyle = pal[2]; ctx.fill();
  rr(-w / 2, -h / 2 + yo, w, h, r);

  g.addColorStop(0, pal[0]); g.addColorStop(0.55, pal[1]); g.addColorStop(1, shade(pal[1], -15));

  rr(-w / 2 + Math.min(h, w) * 0.22, -h / 2 + yo + h * 0.09, w - Math.min(h, w) * 0.44, h * 0.28, h * 0.14);
  ctx.fillStyle = 'rgba(255,255,255,0.45)'; ctx.fill();

  const tc = o.color === 'white' ? '#3d5a47' : '#fff';
  const sc = o.color === 'white' ? '#fff' : pal[2];

    setFont(fs);
    const tw = ctx.measureText(o.label).width;

    if (x >= b.x - 4 && x <= b.x + b.w + 4 && y >= b.y - 4 && y <= b.y + b.h + 8) return b;
    const dx = Math.max(b.x - x, 0, x - (b.x + b.w)), dy = Math.max(b.y - y, 0, y - (b.y + b.h));

/* ---------- 粒子（物件池，不會一直配置新物件） ---------- */
const PMAX = KG.lowEnd ? 110 : 170;
const parts = [];

const SH_STAR = 0, SH_SPARK = 1, SH_DOT = 2, SH_CONF = 3, SH_RING = 4, SH_HEART = 5;
function allocP() {
  for (let k = 0; k < PMAX; k++) {
    const p = parts[(pIdx + k) % PMAX];

  }

function burst(x, y, o) {
  const n = Math.ceil((o.n || 12) * (KG.lowEnd ? 0.6 : 1));
  const cols = o.colors || ['#ffe066', '#ff8fb1', '#7bd88f', '#6cc4ff', '#ffffff'];
  for (let i = 0; i < n; i++) {
    const p = allocP();
    const a = o.dir != null ? o.dir + (Math.random() - 0.5) * (o.spread || 1.2) : Math.random() * TAU;
    const sp = (o.speed || 220) * (0.4 + Math.random() * 0.8);
    p.on = true; p.x = x; p.y = y; p.vx = Math.cos(a) * sp; p.vy = Math.sin(a) * sp - (o.up || 0);
    p.max = o.life || 0.8; p.life = p.max * (0.7 + Math.random() * 0.5);
    p.size = (o.size || 6) * (0.6 + Math.random() * 0.7); p.color = cols[i % cols.length];
    p.shape = o.shape == null ? SH_STAR : o.shape; p.rot = Math.random() * TAU; p.vr = (Math.random() - 0.5) * 8;
    p.g = o.g == null ? 500 : o.g; p.drag = o.drag == null ? 0.97 : o.drag;

function ring(x, y, color, r, life) {
  const p = allocP();
  p.on = true; p.x = x; p.y = y; p.vx = 0; p.vy = 0; p.max = p.life = life || 0.45; p.size = r || 40; p.color = color || '#fff';
  p.shape = SH_RING; p.rot = 0; p.vr = 0; p.g = 0; p.drag = 1;

function updateParts(dt) {
  for (let i = 0; i < PMAX; i++) {
    const p = parts[i];
    if (!p.on) continue;
    p.life -= dt;
    if (p.life <= 0) { p.on = false; continue; }
    p.vy += p.g * dt;
    const d = Math.pow(p.drag, dt * 60);
    p.vx *= d; p.vy *= d;
    p.x += p.vx * dt; p.y += p.vy * dt;

}
function drawParts() {
  for (let i = 0; i < PMAX; i++) {
    const p = parts[i];
    if (!p.on) continue;
    const a = clamp(p.life / p.max, 0, 1);
    ctx.globalAlpha = Math.min(1, a * 1.6);
    const c = Math.cos(p.rot), sn = Math.sin(p.rot);
    ctx.setTransform(dpr * c, dpr * sn, -dpr * sn, dpr * c, dpr * (p.x + shx), dpr * (p.y + shy));

    ctx.fillStyle = p.color;
    if (p.shape === SH_STAR) { starPath(0, 0, s, s * 0.45, 0); ctx.fill(); }

}
function onDown(x, y, e) {

cv.addEventListener('contextmenu', (e) => e.preventDefault());
window.addEventListener('keydown', (e) => {
  const k = e.key;
  if (scene === 'play' && !Result.on) {
    if (k === 'Escape' || k === 'p' || k === 'P') { e.preventDefault(); setPaused(!paused); kbMode = true; return; }
    if (paused) {
      if (k === 'ArrowDown' || k === 'ArrowRight' || (k === 'Tab' && !e.shiftKey)) { kbMode = true; focusMove(1); e.preventDefault(); }
      else if (k === 'ArrowUp' || k === 'ArrowLeft' || (k === 'Tab' && e.shiftKey)) { kbMode = true; focusMove(-1); e.preventDefault(); }
      else if (k === 'Enter' || k === ' ') { e.preventDefault(); focusPress(); }
      return;
    }
    if (G.sub !== 'play') return;
    const n = G.bins.length;
    if (/^[1-9]$/.test(k)) { const b = G.bins[+k - 1]; if (b) { G.kbBin = +k - 1; throwItem(targetItem(), b); } return; }
    if (k === 'ArrowLeft') { kbMode = true; G.kbBin = (G.kbBin - 1 + n) % n; sfx('rs_tick'); e.preventDefault(); }
    else if (k === 'ArrowRight') { kbMode = true; G.kbBin = (G.kbBin + 1) % n; sfx('rs_tick'); e.preventDefault(); }
    else if (k === 'ArrowUp') { kbMode = true; G.kbBin = Math.max(0, G.kbBin - L.cols); sfx('rs_tick'); e.preventDefault(); }
    else if (k === 'ArrowDown') { kbMode = true; G.kbBin = Math.min(n - 1, G.kbBin + L.cols); sfx('rs_tick'); e.preventDefault(); }
    else if (k === ' ' || k === 'Enter') { kbMode = true; e.preventDefault(); throwItem(targetItem(), G.bins[G.kbBin]); }
    else if (k === 'Tab') {
      e.preventDefault(); kbMode = true;
      if (G.mode === 'practice') return;
      const list = ITEM_POOL.filter(q => q.state === 'belt' || q.state === 'spawn').sort((a, b) => b.bx - a.bx);
      if (!list.length) return;
      let i = list.indexOf(G.sel);
      if (G.sel) G.sel.sel = false;
      G.sel = list[(i + 1) % list.length]; G.sel.sel = true; say(G.sel.def.name);
    }
    else if (k === 'w' || k === 'W' || k === '?') whyNow();
    return;
  }
  if (k === 'ArrowRight' || k === 'ArrowDown' || (k === 'Tab' && !e.shiftKey)) { kbMode = true; focusMove(1); e.preventDefault(); }
  else if (k === 'ArrowLeft' || k === 'ArrowUp' || (k === 'Tab' && e.shiftKey)) { kbMode = true; focusMove(-1); e.preventDefault(); }
  else if (k === 'Enter' || k === ' ') { e.preventDefault(); kbMode = true; focusPress(); }
  else if (k === 'Escape') {
    if (scene === 'sticker' && SB.detail) SB.detail = null;
    else if (scene === 'sticker' || scene === 'levels') goTitle();
  }
});
document.addEventListener('visibilitychange', () => {
  if (document.hidden) {
    if (hum) hum.set(0, 0);
    if (scene === 'play' && !paused && !Result.on && G.sub !== 'over') setPaused(true);
  }
});

/* =====================================================================
 * 主迴圈
 * ===================================================================== */
function resize() {
  const r = cv.getBoundingClientRect();
  W = Math.max(1, r.width || innerWidth); H = Math.max(1, r.height || innerHeight);
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
  U = clamp(Math.min(W / 400, H / 700), 0.75, 1.5);
  const res = Math.round(clamp(Math.max(110, Math.min(W, H) * 0.32) * dpr, 128, KG.lowEnd ? 192 : 256));
  if (Math.abs(res - SPR_RES) > 24) { SPR_RES = res; for (const k in SPR) delete SPR[k]; for (const k in STK) delete STK[k]; for (const k in SIL) delete SIL[k]; }
  wrapCache.clear(); mascotGrad = null;
  buildBg();
  if (scene === 'play') layoutPlay();
}
window.addEventListener('resize', resize);
window.addEventListener('orientationchange', () => setTimeout(resize, 120));
if (window.visualViewport) window.visualViewport.addEventListener('resize', resize);

function step(dt) {
  time += dt; sceneT += dt;
  if (shakeT > 0) shakeT -= dt;
  if (!paused) {
    updateTweens(dt); updateTimers(dt); updateParts(dt); updatePops(dt);
    if (scene === 'play') updatePlay(dt);
  }
  Result.update(dt);
  humUpdate(dt);
}
function render() {
  btnReg = [];
  if (shakeT > 0 && !paused) { const k = shakeAmt * Math.min(1, shakeT * 4); shx = (Math.random() * 2 - 1) * k; shy = (Math.random() * 2 - 1) * k; } else { shx = 0; shy = 0; }
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  if (bgCanvas) ctx.drawImage(bgCanvas, 0, 0, W, H);
  if (scene === 'title') { drawTitle(); ctx.setTransform(dpr, 0, 0, dpr, 0, 0); drawParts(); }
  else if (scene === 'levels') drawLevels();
  else if (scene === 'sticker') drawStickers();
  else if (scene === 'play') drawPlay();
  shx = 0; shy = 0;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  if (scene === 'play' && Result.on) { btnReg = []; Result.draw(); drawParts(); }
  if (scene === 'play' && paused) { btnReg = []; drawPause(); }
}
let last = performance.now();
const perfStat = { n: 0, sum: 0, max: 0 };
function frame(now) {
  const dt = Math.min(0.05, Math.max(0, (now - last) / 1000));
  last = now;
  const t0 = performance.now();
  try { step(dt); render(); } catch (err) { console.error(err); }
  const ft = performance.now() - t0;
  perfStat.n++; perfStat.sum += ft; if (ft > perfStat.max) perfStat.max = ft;
  requestAnimationFrame(frame);
}
resize();
initTitleFloat();
playSong(SONG_TITLE);
requestAnimationFrame((t) => { last = t; frame(t); });

/* ---------- 測試用 ---------- */
function autoSort(wrong) {
  if (scene !== 'play' || G.sub !== 'play' || paused || Result.on) return false;
  const it = targetItem();
  if (!it || (it.state !== 'belt' && it.state !== 'home')) return false;
  const right = itemBin(it.def);
  const b = wrong ? G.bins.find(q => q.key !== right) : G.bins.find(q => q.key === right);
  throwItem(it, b);
  return true;
}
window.__rs = {
  state: () => ({ scene, mode: G.mode, lvl: G.lvl, sub: G.sub, paused, score: G.score, lives: G.lives, combo: G.combo, correct: G.correct, wrong: G.wrong, missed: G.missed,
    spawned: G.spawned, total: G.total, live: liveCount(), result: Result.on, stars: Result.on ? Result.o.stars : null, truckT: G.truckT, music: M ? M.isPlaying() : null,
    stickers: stickerCount(), hype: G.hype, tempo: G.tempo, bubble: bubble.text }),
  start: (mode, lvl) => startMode(mode || 'level', lvl || 0),
  go: s => { if (s === 'title') goTitle(); else if (s === 'levels') goLevels(); else if (s === 'sticker') goStickers(); },
  tick: (sec, auto) => { for (let i = 0; i < sec * 60; i++) { step(1 / 60); if (auto) autoSort(auto === 'wrong'); } },
  sortFront: ok => autoSort(!ok),
  bins: () => G.bins.map(b => ({ key: b.key, x: Math.round(b.x + b.w / 2), y: Math.round(b.y + b.h / 2) })),
  items: () => ITEM_POOL.filter(i => i.state !== 'off').map(i => ({ id: i.def.id, bin: itemBin(i.def), state: i.state, x: Math.round(i.x), y: Math.round(i.y), bx: +i.bx.toFixed(3) })),
  pause: p => setPaused(p),
  unlockAll: () => { ITEMS.forEach(d => { stickers[d.id] = stickers[d.id] || 1; }); stars = LEVELS.map(() => 3); Save.set('stars', stars); stickerDirty = true; flushStickers(); },
  detail: id => { SB.detail = ITEM_BY_ID[id]; SB.t = 1; },
  tab: i => { SB.tab = i; },
  layout: () => JSON.parse(JSON.stringify(L)),
  btns: () => btnReg.map(b => ({ id: b.id, x: Math.round(b.x + b.w / 2), y: Math.round(b.y + b.h / 2) })),
  items62: () => ITEMS.length,
  lastUp: () => lastUp,
  perf: reset => { const r = { avg: perfStat.n ? +(perfStat.sum / perfStat.n).toFixed(2) : 0, max: +perfStat.max.toFixed(1), n: perfStat.n }; if (reset) { perfStat.n = 0; perfStat.sum = 0; perfStat.max = 0; } return r; }
};
})();
</script>
