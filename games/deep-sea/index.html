<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>深海潛水艇</title>
<link rel="stylesheet" href="../../assets/common.css">
<style>
  html, body { height: 100%; overflow: hidden; background: #0d4f7a; overscroll-behavior: none; }
  #game { position: fixed; left: 0; top: 0; display: block; width: 100vw; height: 100vh; height: 100dvh; touch-action: none; }
</style>
</head>
<body>
<canvas id="game" aria-label="深海潛水艇"></canvas>
<script src="../../assets/common.js"></script>
<script src="../../assets/kg-music.js"></script>
<script>
'use strict';
(() => {
/* =====================================================================
 * 深海潛水艇：開著小潛水艇探索海底、收集珍珠、救援迷路的海洋寶寶
 * ===================================================================== */
const SLUG = 'deep-sea';
const cv = document.getElementById('game');
const ctx = cv.getContext('2d', { alpha: false }) || cv.getContext('2d');
const FONT = '"Baloo 2","PingFang TC","Noto Sans TC","Microsoft JhengHei","Heiti TC",system-ui,sans-serif';
const TAU = Math.PI * 2;
let W = 360, H = 640, dpr = 1, U = 1, time = 0;
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const lerp = (a, b, t) => a + (b - a) * t;
const Ease = {
  outCubic: t => 1 - Math.pow(1 - t, 3),
  inOutSine: t => -(Math.cos(Math.PI * t) - 1) / 2,
  outBack: t => { const c = 1.70158, c3 = c + 1; return 1 + c3 * Math.pow(t - 1, 3) + c * Math.pow(t - 1, 2); },
  outElastic: t => (t === 0 || t === 1) ? t : Math.pow(2, -10 * t) * Math.sin((t * 10 - 0.75) * (TAU / 3)) + 1
};
function mk(w, h) { const c = document.createElement('canvas'); c.width = Math.max(1, Math.ceil(w)); c.height = Math.max(1, Math.ceil(h)); return c; }
function rng(seed) { let s = (seed >>> 0) || 1; return () => { s ^= s << 13; s >>>= 0; s ^= s >>> 17; s ^= s << 5; s >>>= 0; return s / 4294967296; }; }
function hexRgb(h) { const n = parseInt(h.slice(1), 16); return [n >> 16, (n >> 8) & 255, n & 255]; }
function shade(h, a) { const c = hexRgb(h); return 'rgb(' + (clamp(c[0] + a, 0, 255) | 0) + ',' + (clamp(c[1] + a, 0, 255) | 0) + ',' + (clamp(c[2] + a, 0, 255) | 0) + ')'; }
function rgba(h, a) { const c = hexRgb(h); return 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + a + ')'; }
function mix(h1, h2, t) { const a = hexRgb(h1), b = hexRgb(h2); return '#' + a.map((v, i) => ('0' + Math.round(lerp(v, b[i], t)).toString(16)).slice(-2)).join(''); }

/* ---------- 補間、震動 ---------- */
let tweens = [];
function tween(obj, to, dur, ease, delay, done) {
  const tw = { obj, to, from: null, dur: dur || 0.3, ease: Ease[ease] || Ease.outCubic, t: -(delay || 0), done };
  tweens.push(tw); return tw;
}
function updateTweens(dt) {
  if (!tweens.length) return;
  const list = tweens.slice();
  for (const tw of list) {
    tw.t += dt; if (tw.t < 0) continue;
    if (!tw.from) { tw.from = {}; for (const k in tw.to) tw.from[k] = tw.obj[k]; }
    const p = Math.min(1, tw.t / tw.dur), e = tw.ease(p);
    for (const k in tw.to) tw.obj[k] = tw.from[k] + (tw.to[k] - tw.from[k]) * e;
    if (p >= 1) { const i = tweens.indexOf(tw); if (i >= 0) tweens.splice(i, 1); if (tw.done) tw.done(); }
  }
}
let shakeT = 0, shakeAmt = 0;
function shake(a, d) { shakeAmt = Math.max(shakeT > 0 ? shakeAmt : 0, a); shakeT = Math.max(shakeT, d || 0.3); }

/* =====================================================================
 * 繪圖小工具
 * ===================================================================== */
function circ(x, y, r, c) { c = c || ctx; c.moveTo(x + r, y); c.arc(x, y, r, 0, TAU); }
function rr(x, y, w, h, r, c) {
  c = c || ctx; r = Math.max(0, Math.min(r, w / 2, h / 2));
  c.beginPath(); c.moveTo(x + r, y); c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r);
  c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath();
}
function E(c, x, y, rx, ry, r) { c.beginPath(); c.ellipse(x, y, Math.abs(rx) + 1e-4, Math.abs(ry) + 1e-4, r || 0, 0, TAU); }
function LG(c, x0, y0, x1, y1, cols) { const g = c.createLinearGradient(x0, y0, x1, y1); cols.forEach((s, i) => g.addColorStop(i / (cols.length - 1), s)); return g; }
function RG(c, x, y, r, cols, fx, fy) { const g = c.createRadialGradient(x + (fx || 0), y + (fy || 0), r * 0.05, x, y, r); cols.forEach((s, i) => g.addColorStop(i / (cols.length - 1), s)); return g; }
function starPath(x, y, R, r, rot, c) {
  c = c || ctx; c.beginPath();
  for (let i = 0; i < 10; i++) { const a = (rot || 0) + i * Math.PI / 5 - Math.PI / 2, d = i % 2 ? r : R; c.lineTo(x + Math.cos(a) * d, y + Math.sin(a) * d); }
  c.closePath();
}
function heartPath(x, y, s, c) {
  c = c || ctx; c.beginPath(); c.moveTo(x, y + s * 0.35);
  c.bezierCurveTo(x - s * 1.1, y - s * 0.35, x - s * 0.55, y - s * 1.05, x, y - s * 0.45);
  c.bezierCurveTo(x + s * 0.55, y - s * 1.05, x + s * 1.1, y - s * 0.35, x, y + s * 0.35); c.closePath();
}
function glossyStar(x, y, R, on, rot) {
  ctx.save(); ctx.lineJoin = 'round';
  if (on) {
    ctx.fillStyle = 'rgba(0,40,80,0.25)'; starPath(x, y + R * 0.12, R, R * 0.5, rot); ctx.fill();
    const g = ctx.createRadialGradient(x - R * 0.3, y - R * 0.4, R * 0.1, x, y, R * 1.1);
    g.addColorStop(0, '#fffbd0'); g.addColorStop(0.45, '#ffd93d'); g.addColorStop(1, '#f39a0c');
    ctx.fillStyle = g; ctx.strokeStyle = '#c9700a'; ctx.lineWidth = Math.max(1.5, R * 0.12);
    starPath(x, y, R, R * 0.5, rot); ctx.fill(); ctx.stroke();
    ctx.fillStyle = 'rgba(255,255,255,0.75)'; ctx.beginPath(); ctx.ellipse(x - R * 0.25, y - R * 0.3, R * 0.22, R * 0.12, -0.6, 0, TAU); ctx.fill();
  } else {
    ctx.fillStyle = 'rgba(40,70,110,0.28)'; ctx.strokeStyle = 'rgba(40,70,110,0.45)'; ctx.lineWidth = Math.max(1.5, R * 0.1);
    starPath(x, y, R, R * 0.5, rot); ctx.fill(); ctx.stroke();
  }
  ctx.restore();
}
function glossyHeart(x, y, s, on) {
  ctx.save();
  if (on) {
    const g = ctx.createRadialGradient(x - s * 0.3, y - s * 0.5, s * 0.1, x, y - s * 0.2, s * 1.1);
    g.addColorStop(0, '#ffd0dc'); g.addColorStop(0.5, '#ff5a86'); g.addColorStop(1, '#d6245a');
    ctx.fillStyle = g; ctx.strokeStyle = '#a3163f';
  } else { ctx.fillStyle = 'rgba(40,70,110,0.25)'; ctx.strokeStyle = 'rgba(40,70,110,0.45)'; }
  ctx.lineWidth = Math.max(1.5, s * 0.12); ctx.lineJoin = 'round';
  heartPath(x, y, s); ctx.fill(); ctx.stroke();
  if (on) { ctx.fillStyle = 'rgba(255,255,255,0.7)'; ctx.beginPath(); ctx.ellipse(x - s * 0.4, y - s * 0.45, s * 0.18, s * 0.1, -0.7, 0, TAU); ctx.fill(); }
  ctx.restore();
}
/** 有外框與陰影的字 */
function txt(s, x, y, size, fill, o) {
  o = o || {};
  ctx.font = (o.weight || '900') + ' ' + size + 'px ' + FONT;
  ctx.textAlign = o.align || 'center'; ctx.textBaseline = o.base || 'middle'; ctx.lineJoin = 'round';
  if (o.alpha != null) ctx.globalAlpha = o.alpha;
  if (o.shadow !== false) {
    ctx.fillStyle = o.shadow || 'rgba(0,30,60,0.3)';
    if (o.stroke) { ctx.strokeStyle = ctx.fillStyle; ctx.lineWidth = o.sw || size * 0.22; ctx.strokeText(s, x, y + size * 0.09); }
    ctx.fillText(s, x, y + size * 0.09);
  }
  if (o.stroke) { ctx.strokeStyle = o.stroke; ctx.lineWidth = o.sw || size * 0.22; ctx.strokeText(s, x, y); }
  ctx.fillStyle = fill; ctx.fillText(s, x, y);
  if (o.alpha != null) ctx.globalAlpha = 1;
}
function wrapText(s, maxW, size) {
  ctx.font = '800 ' + size + 'px ' + FONT;
  const out = []; let line = '';
  for (const ch of s) {
    const t = line + ch;
    if (ctx.measureText(t).width > maxW && line) {
      if ('，。！？、：；」'.includes(ch)) { out.push(t); line = ''; continue; }
      out.push(line); line = ch;
    } else line = t;
  }
  if (line) out.push(line);
  return out;
}
/** 標題字：每個字彈跳 */
function logo(s, cx, cy, size, colors, outline) {
  ctx.save();
  ctx.font = '900 ' + size + 'px ' + FONT; ctx.textBaseline = 'middle'; ctx.textAlign = 'center'; ctx.lineJoin = 'round';
  const chars = [...s], widths = chars.map(c => ctx.measureText(c).width * 1.02), total = widths.reduce((a, b) => a + b, 0);
  let x = cx - total / 2;
  chars.forEach((c, i) => {
    const w = widths[i], bob = Math.sin(time * 2.4 + i * 0.7) * size * 0.06, rot = Math.sin(time * 1.8 + i) * 0.06;
    ctx.save(); ctx.translate(x + w / 2, cy + bob); ctx.rotate(rot);
    ctx.strokeStyle = 'rgba(0,25,60,0.35)'; ctx.lineWidth = size * 0.36; ctx.strokeText(c, 0, size * 0.1);
    ctx.strokeStyle = outline; ctx.lineWidth = size * 0.34; ctx.strokeText(c, 0, 0);
    ctx.strokeStyle = '#fff'; ctx.lineWidth = size * 0.17; ctx.strokeText(c, 0, 0);
    const col = colors[i % colors.length], g = ctx.createLinearGradient(0, -size / 2, 0, size / 2);
    g.addColorStop(0, shade(col, 70)); g.addColorStop(0.5, col); g.addColorStop(1, shade(col, -40));
    ctx.fillStyle = g; ctx.fillText(c, 0, 0);
    ctx.globalAlpha = 0.55; ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.ellipse(-w * 0.18, -size * 0.25, size * 0.1, size * 0.05, -0.5, 0, TAU); ctx.fill();
    ctx.restore(); x += w;
  });
  ctx.restore();
}

/* ---------- 按鈕（每一格畫面重新登記） ---------- */
let btnReg = [];
const pressedIds = new Set();
const BTN = {
  green: ['#a6f59c', '#3fbf5c', '#24873e'], teal: ['#a6f7ee', '#26bfb3', '#137a73'], blue: ['#a8e0ff', '#3c9ff0', '#22659e'],
  yellow: ['#fff09a', '#f8b921', '#b57c0b'], coral: ['#ffc6b6', '#ff7a5e', '#c0432b'], purple: ['#dcc6ff', '#9b6ff2', '#5f3fae'],
  white: ['#ffffff', '#e4f3fb', '#7fa6bf'], navy: ['#7ea6d8', '#2f5f9e', '#1a3a66']
};
function drawIcon(name, x, y, s, col) {
  ctx.save(); ctx.translate(x, y);
  ctx.fillStyle = col || '#fff'; ctx.strokeStyle = col || '#fff';
  ctx.lineWidth = s * 0.2; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  if (name === 'play') { ctx.beginPath(); ctx.moveTo(-s * 0.32, -s * 0.48); ctx.lineTo(s * 0.48, 0); ctx.lineTo(-s * 0.32, s * 0.48); ctx.closePath(); ctx.fill(); ctx.stroke(); }
  else if (name === 'next') { for (const dx of [-0.28, 0.22]) { ctx.beginPath(); ctx.moveTo(s * (dx - 0.18), -s * 0.38); ctx.lineTo(s * (dx + 0.22), 0); ctx.lineTo(s * (dx - 0.18), s * 0.38); ctx.stroke(); } }
  else if (name === 'left' || name === 'right') { const d = name === 'left' ? -1 : 1; ctx.beginPath(); ctx.moveTo(-d * s * 0.18, -s * 0.4); ctx.lineTo(d * s * 0.22, 0); ctx.lineTo(-d * s * 0.18, s * 0.4); ctx.stroke(); }
  else if (name === 'back') { ctx.beginPath(); ctx.moveTo(s * 0.4, 0); ctx.lineTo(-s * 0.35, 0); ctx.moveTo(-s * 0.05, -s * 0.32); ctx.lineTo(-s * 0.38, 0); ctx.lineTo(-s * 0.05, s * 0.32); ctx.stroke(); }
  else if (name === 'replay') {
    ctx.beginPath(); ctx.arc(0, 0, s * 0.4, -Math.PI * 0.3, Math.PI * 1.35); ctx.stroke();
    const a = -Math.PI * 0.3, ex = Math.cos(a) * s * 0.4, ey = Math.sin(a) * s * 0.4;
    ctx.beginPath(); ctx.moveTo(ex + s * 0.2, ey - s * 0.05); ctx.lineTo(ex - s * 0.02, ey + s * 0.25); ctx.lineTo(ex - s * 0.25, ey - s * 0.12); ctx.closePath(); ctx.fill();
  }
  else if (name === 'menu') { for (let i = -1; i <= 1; i += 2) for (let j = -1; j <= 1; j += 2) { rr(i * s * 0.24 - s * 0.16, j * s * 0.24 - s * 0.16, s * 0.32, s * 0.32, s * 0.08); ctx.fill(); } }
  else if (name === 'pause') { rr(-s * 0.32, -s * 0.38, s * 0.22, s * 0.76, s * 0.08); ctx.fill(); rr(s * 0.1, -s * 0.38, s * 0.22, s * 0.76, s * 0.08); ctx.fill(); }
  else if (name === 'lock') {
    ctx.lineWidth = s * 0.15; ctx.beginPath(); ctx.arc(0, -s * 0.12, s * 0.25, Math.PI, 0); ctx.stroke();
    rr(-s * 0.36, -s * 0.12, s * 0.72, s * 0.58, s * 0.12); ctx.fill();
    ctx.fillStyle = 'rgba(0,0,0,0.25)'; ctx.beginPath(); circ(0, s * 0.15, s * 0.08); ctx.fill();
  }
  else if (name === 'book') {
    ctx.lineWidth = s * 0.1;
    ctx.beginPath(); ctx.moveTo(0, -s * 0.28); ctx.quadraticCurveTo(-s * 0.25, -s * 0.42, -s * 0.48, -s * 0.32); ctx.lineTo(-s * 0.48, s * 0.36); ctx.quadraticCurveTo(-s * 0.25, s * 0.26, 0, s * 0.4);
    ctx.quadraticCurveTo(s * 0.25, s * 0.26, s * 0.48, s * 0.36); ctx.lineTo(s * 0.48, -s * 0.32); ctx.quadraticCurveTo(s * 0.25, -s * 0.42, 0, -s * 0.28); ctx.closePath(); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(0, -s * 0.28); ctx.lineTo(0, s * 0.4); ctx.stroke();
  }
  else if (name === 'speaker') {
    ctx.beginPath(); ctx.moveTo(-s * 0.42, -s * 0.15); ctx.lineTo(-s * 0.2, -s * 0.15); ctx.lineTo(s * 0.05, -s * 0.38); ctx.lineTo(s * 0.05, s * 0.38); ctx.lineTo(-s * 0.2, s * 0.15); ctx.lineTo(-s * 0.42, s * 0.15); ctx.closePath(); ctx.fill();
    ctx.lineWidth = s * 0.09; ctx.beginPath(); ctx.arc(s * 0.08, 0, s * 0.22, -0.8, 0.8); ctx.stroke(); ctx.beginPath(); ctx.arc(s * 0.08, 0, s * 0.38, -0.8, 0.8); ctx.stroke();
  }
  else if (name === 'sonar') {
    ctx.beginPath(); circ(0, 0, s * 0.1); ctx.fill(); ctx.lineWidth = s * 0.09;
    for (let k = 1; k <= 3; k++) { ctx.globalAlpha = 1 - k * 0.2; ctx.beginPath(); ctx.arc(0, 0, s * 0.16 * k + s * 0.04, 0, TAU); ctx.stroke(); }
  }
  else if (name === 'close') { ctx.beginPath(); ctx.moveTo(-s * 0.3, -s * 0.3); ctx.lineTo(s * 0.3, s * 0.3); ctx.moveTo(s * 0.3, -s * 0.3); ctx.lineTo(-s * 0.3, s * 0.3); ctx.stroke(); }
  ctx.restore();
}
/** 立體按鈕 opts: {label, icon, color, onClick, size, pulse, disabled, instant, radius} */
function button(id, x, y, w, h, opts) {
  btnReg.push({ id, x, y, w, h, onClick: opts.onClick, disabled: opts.disabled, instant: opts.instant });
  const pal = BTN[opts.color || 'green'], isDown = pressedIds.has(id);
  let s = isDown ? 0.93 : 1;
  if (opts.pulse && !isDown) s *= 1 + Math.sin(time * 5) * 0.035;
  const lip = Math.max(3, h * 0.09);
  ctx.save(); ctx.translate(x + w / 2, y + h / 2); ctx.scale(s, s);
  if (opts.disabled) ctx.globalAlpha = 0.5;
  const r = opts.radius == null ? h / 2 : opts.radius, yo = isDown ? lip * 0.6 : 0;
  rr(-w / 2, -h / 2 + lip + 3, w, h, r); ctx.fillStyle = 'rgba(0,25,55,0.25)'; ctx.fill();
  rr(-w / 2, -h / 2 + lip, w, h, r); ctx.fillStyle = pal[2]; ctx.fill();
  rr(-w / 2, -h / 2 + yo, w, h, r);
  const g = ctx.createLinearGradient(0, -h / 2, 0, h / 2);
  g.addColorStop(0, pal[0]); g.addColorStop(0.55, pal[1]); g.addColorStop(1, shade(pal[1], -15));
  ctx.fillStyle = g; ctx.fill(); ctx.strokeStyle = pal[2]; ctx.lineWidth = Math.max(2, h * 0.05); ctx.stroke();
  rr(-w / 2 + Math.min(h, w) * 0.22, -h / 2 + yo + h * 0.09, w - Math.min(h, w) * 0.44, h * 0.28, h * 0.14);
  ctx.fillStyle = 'rgba(255,255,255,0.42)'; ctx.fill();
  const fs = opts.size || h * 0.42, tc = opts.color === 'white' ? '#2f5a78' : '#fff';
  if (opts.icon && opts.label) {
    ctx.font = '900 ' + fs + 'px ' + FONT;
    const tw = ctx.measureText(opts.label).width, tot = fs * 1.15 + tw;
    drawIcon(opts.icon, -tot / 2 + fs * 0.45, yo, fs * 0.95, tc);
    txt(opts.label, -tot / 2 + fs * 1.15 + tw / 2, yo + 1, fs, tc, { stroke: opts.color === 'white' ? null : pal[2], sw: fs * 0.2, shadow: false });
  } else if (opts.icon) drawIcon(opts.icon, 0, yo, fs * 1.1, tc);
  else if (opts.label != null) txt(opts.label, 0, yo + 1, fs, tc, { stroke: opts.color === 'white' ? null : pal[2], sw: fs * 0.2, shadow: false });
  ctx.restore();
}
/** 找按鈕：先找正中，再找附近（不需要精準點擊） */
function hitBtn(x, y) {
  let best = null, bd = 26;
  for (let i = btnReg.length - 1; i >= 0; i--) {
    const b = btnReg[i]; if (b.disabled) continue;
    const dx = Math.max(b.x - x, 0, x - (b.x + b.w)), dy = Math.max(b.y - y, 0, y - (b.y + b.h + 6));
    const d = Math.hypot(dx, dy);
    if (d === 0) return b;
    if (d < bd) { bd = d; best = b; }
  }
  return best;
}
function panel(x, y, w, h, r, col, fill) {
  rr(x, y + 6, w, h, r); ctx.fillStyle = 'rgba(0,20,50,0.3)'; ctx.fill();
  rr(x, y, w, h, r);
  ctx.fillStyle = fill || LG(ctx, 0, y, 0, y + h, ['#f6fdff', '#dff3fb']); ctx.fill();
  ctx.lineWidth = Math.max(3, 5 * U); ctx.strokeStyle = col; ctx.stroke();
}

/* =====================================================================
 * 存檔
 * ===================================================================== */
const Save = { get(k, d) { return KG.store.get(SLUG + ':' + k, d); }, set(k, v) { KG.store.set(SLUG + ':' + k, v); } };
let starsArr = Save.get('stars', []);
if (!Array.isArray(starsArr)) starsArr = [];
const book = new Set(Save.get('book', []));
let sfxOn = Save.get('sfx', true) !== false;
function unlocked(i) { return i === 0 || (starsArr[i - 1] || 0) > 0; }
function totalStars() { return starsArr.reduce((a, b) => a + (b || 0), 0); }

/* =====================================================================
 * 音樂與音效（KG.music / KG.sfx）
 * ===================================================================== */
const DRUMS_SOFT = [
  { inst: 'kick', pat: 'x.......x.......', vol: 0.5 },
  { inst: 'shaker', pat: ['o.x.o.x.o.x.o.x.', 'o.x.o.x.o.x.oxxo'], vol: 0.75 },
  { inst: 'rim', pat: '....x.......x...', vol: 0.4, layer: 'drive' },
  { inst: 'hat', pat: '..x...x...x...x.', vol: 0.5, layer: 'drive' },
  { inst: 'kick', pat: '..........x.....', vol: 0.35, layer: 'drive' }
];
function songOf(o) {
  return {
    bpm: o.bpm, steps: 16, swing: 0.08, chords: o.chords, layers: { top: false, drive: false },
    tracks: [
      { inst: 'pad', chord: 'hold', vol: o.padVol || 0.85 },
      { inst: 'sub', chord: o.bass || 'R.......R...5...', vol: 0.75 },
      { inst: o.lead || 'kalimba', seq: o.mel, vol: o.leadVol || 1 },
      { inst: o.top || 'bell', arp: 'up', rate: 4, oct: 5, span: 1, vol: 0.3, layer: 'top' },
      { inst: 'marimba', arp: 'updown', rate: 2, oct: 4, span: 1, vol: 0.3, layer: 'drive' }
    ].concat(o.drums || DRUMS_SOFT)
  };
}
// 標題曲：Eb 大調，夢幻海底
const SONG_TITLE = songOf({
  bpm: 90, chords: ['Ebmaj7', 'Gm7', 'Abmaj7', 'Bb', 'Cm7', 'Gm7', 'Abmaj7', 'Bbsus4'],
  mel: ['Bb4 . Eb5 F5 G5 - - .', 'F5 . G5 F5 D5 - Bb4 .', 'Ab4 . C5 Eb5 G5 - F5 Eb5', 'F5 - - . D5 - Bb4 .',
    'C5 . Eb5 G5 Bb5 - G5 .', 'F5 . D5 Bb4 G4 - Bb4 .', 'Ab4 . C5 Eb5 F5 - Eb5 C5', 'Bb4 - - - - . . .'],
  top: 'bell'
});
SONG_TITLE.layers = { top: true, drive: false };
// 四個區域各自的變奏（越深越慢、和弦越暗，但一樣溫柔）

}

/* =====================================================================
 * 關卡執行期：地形、碰撞
 * ===================================================================== */
const T = 40, R = T * 0.62, MARGIN = 3;
const ACC = 560, DRAG = 2.3, CURF = 330;
let GW = 1, GH = 1, grid = new Uint8Array(1), curX = new Int8Array(1), curY = new Int8Array(1), curCells = [];
let LV = null; // 目前關卡的所有物件
function sol(i, j) { return (i < 0 || j < 0 || i >= GW || j >= GH) ? 1 : grid[j * GW + i]; }
const NB = [[1, 0], [0, 1], [1, 1], [-1, 1]];
let colOutX = 0, colOutY = 0;
/** 圓形與地形碰撞：地形 = 每格中心點連到相鄰實心格的「膠囊」 */
function collide(x, y, r) {
  let px = x, py = y, hit = false;
  const reach = T * 1.5 + R + r, reach2 = reach * reach, rr2 = (R + r) * (R + r);
  for (let it = 0; it < 3; it++) {
    const ci = Math.floor(px / T), cj = Math.floor(py / T);
    let any = false;
    for (let j = cj - 2; j <= cj + 2; j++) for (let i = ci - 2; i <= ci + 2; i++) {
      if (!sol(i, j)) continue;
      const ax = (i + 0.5) * T, ay = (j + 0.5) * T, qx = px - ax, qy = py - ay;
      if (qx * qx + qy * qy > reach2) continue;
      for (let n = -1; n < 4; n++) {
        let bx = ax, by = ay;
        if (n >= 0) { if (!sol(i + NB[n][0], j + NB[n][1])) continue; bx = ax + NB[n][0] * T; by = ay + NB[n][1] * T; }
        const dx = bx - ax, dy = by - ay, L = dx * dx + dy * dy;
        let t = L > 0 ? ((px - ax) * dx + (py - ay) * dy) / L : 0; t = t < 0 ? 0 : t > 1 ? 1 : t;
        const cx = ax + dx * t, cy = ay + dy * t; let ex = px - cx, ey = py - cy;
        const d2 = ex * ex + ey * ey;
        if (d2 >= rr2) continue;
        const d = Math.sqrt(d2);
        if (d < 1e-4) { ex = 0; ey = -1; } else { ex /= d; ey /= d; }
        const pen = R + r - d; px += ex * pen; py += ey * pen; any = true;
      }
    }
    if (!any) break;
    hit = true;
  }
  colOutX = px; colOutY = py;
  return hit;
}
function floorBelow(x, y, maxC) { const i = Math.floor(x / T), j = Math.floor(y / T); for (let k = 0; k <= maxC; k++) if (sol(i, j + k + 1)) return (j + k + 1 + 0.5) * T - R; return null; }
function ceilAbove(x, y, maxC) { const i = Math.floor(x / T), j = Math.floor(y / T); for (let k = 0; k <= maxC; k++) if (sol(i, j - k - 1)) return (j - k - 1 + 0.5) * T + R; return null; }

function parseLevel(idx) {
  const D = LEVELS[idx], rows = D.map;
  GH = rows.length; GW = Math.max(...rows.map(r => r.length));
  grid = new Uint8Array(GW * GH); curX = new Int8Array(GW * GH); curY = new Int8Array(GW * GH); curCells = [];
  const L = { idx, def: D, zone: D.zone, pearls: [], chests: [], gems: [], babies: [], sights: [], jellies: [], urchins: [], rocks: [], fishes: [], vents: [], airs: [], cps: [], kelps: [], decor: [], hots: [], start: { x: 2 * T, y: 2 * T }, exit: { x: 4 * T, y: 2 * T }, treasureTotal: 0, dark: D.dark || 0 };
  let bi = 0, li = 0;
  const r = rng(idx * 7919 + 17);
  for (let j = 0; j < GH; j++) for (let i = 0; i < GW; i++) {
    const ch = rows[j][i] || '#', x = (i + 0.5) * T, y = (j + 0.5) * T, k = j * GW + i;
    switch (ch) {
      case '#': grid[k] = 1; break;
      case 'W': grid[k] = 2; break;
      case 'S': L.start = { x, y }; break;
      case 'E': L.exit = { x, y }; break;
      case 'C': L.cps.push({ x, y, on: false }); break;
      case 'p': L.pearls.push({ x, y, got: false, ph: r() * TAU }); L.treasureTotal += 10; break;
      case 'T': L.chests.push({ x, y, got: false, open: 0 }); L.treasureTotal += 100; break;
      case 'h': L.gems.push({ x, y, got: false, rev: false, revT: 0, col: ['#ff5c8a', '#5cc4ff', '#7bd88f', '#b48cff', '#ffb02e'][L.gems.length % 5], ph: r() * TAU }); L.treasureTotal += 150; break;
      case 'b': L.babies.push({ kind: D.babies[bi++] || 'turtle', hx: x, hy: y, x, y, state: 'wait', ph: r() * TAU, order: 0, face: 1 }); break;
      case '*': L.sights.push({ kind: D.life[li++] || 'clownfish', hx: x, hy: y, x, y, ph: r() * TAU, face: 1 }); break;
      case 'o': L.vents.push({ x, y, t: r() * 2, open: 0 }); break;
      case 'a': L.airs.push({ x, y, taken: false, t: 0, ph: r() * TAU }); break;
      case 'J': case 'j': L.jellies.push({ bx: x, by: y, x, y, mode: ch === 'J' ? 'v' : 'h', ph: r() * TAU }); break;
      case 'U': L.urchins.push({ x, y }); break;
      case 'R': L.rocks.push({ hx: x, hy: y, x, y, vy: 0, state: 'hang', t: 0, rot: 0, a: 1 }); break;
      case 'F': L.fishes.push({ hx: x, hy: y, x, y, vx: 0, vy: 0, state: 'patrol', t: 0, face: 1, ph: r() * TAU }); break;
      case '>': curX[k] = 1; curCells.push(k); break;
      case '<': curX[k] = -1; curCells.push(k); break;
      case '^': curY[k] = -1; curCells.push(k); break;
      case 'v': curY[k] = 1; curCells.push(k); break;
      case 'k': L.kelps.push({ x: x + (r() - 0.5) * 10, y, top: y - T * 0.4, ph: r() * TAU, bend: 0 }); break;
      case 'w': L.decor.push({ x: x + (r() - 0.5) * 14, y }); break;
      case 'V': L.hots.push({ x, y }); break;
    }
  }
  // 貼到地面／天花板
  const toFloor = (o, n, key) => { const f = floorBelow(o.x, o[key || 'y'], n); if (f != null) o[key || 'y'] = f; return f != null; };
  L.chests.forEach(o => toFloor(o, 4)); L.cps.forEach(o => toFloor(o, 7)); L.vents.forEach(o => toFloor(o, 4)); L.hots.forEach(o => toFloor(o, 4));
  L.decor = L.decor.filter(o => toFloor(o, 3));
  L.kelps = L.kelps.filter(o => { const f = floorBelow(o.x, o.y, 8); if (f == null) return false; o.y = f; o.h = Math.max(T * 0.9, f - o.top); return true; });
  L.urchins.forEach(o => { const f = floorBelow(o.x, o.y, 1); if (f != null) o.y = f - 12; else { const c = ceilAbove(o.x, o.y, 1); if (c != null) o.y = c + 12; } });
  L.sights.forEach(o => { const D = DEXI[o.kind]; if (D.floor) { const f = floorBelow(o.x, o.y, 5); if (f != null) { o.hy = f - D.s * (D.base || 0.6); o.y = o.hy; } } });
  L.rocks.forEach(o => { const c = ceilAbove(o.hx, o.hy, 3); if (c != null) o.hy = c + 12; o.y = o.hy; });
  return L;
}

    button('dclose', bx2 + bw2 + 10, by2, bw2, bh2, { label: '關閉', icon: 'close', color: 'coral', size: bh2 * 0.36, onClick: () => { bookDetail = null; try { if (window.speechSynthesis) window.speechSynthesis.cancel(); } catch (e) { /* 忽略 */ } } });
    ctx.restore();
  }
}

/* =====================================================================
 * 主畫面繪製
 * ===================================================================== */
function drawPlay() {
  const L = LV, z = L.zone;
  drawBackdrop(z, cam.x, cam.y, GH * T);
  let sx = 0, sy = 0;
  if (shakeT > 0) { const k = shakeAmt * Math.min(1, shakeT * 4); sx = (Math.random() * 2 - 1) * k; sy = (Math.random() * 2 - 1) * k; }
  worldTransform(sx, sy);
  drawWorld();
  drawSonar();
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  drawCaustics(z, (cam.x - viewW / 2) * zoom, (cam.y - viewH / 2) * zoom);
  if (L.dark > 0) { drawDarkness(L.dark); ctx.setTransform(dpr, 0, 0, dpr, 0, 0); }
  updateSnow(frameDt, (cam.x - snowCam.x) * zoom, (cam.y - snowCam.y) * zoom); snowCam.x = cam.x; snowCam.y = cam.y;
  drawSnow(L.dark > 0.6 ? 'rgba(200,220,255,0.3)' : null);
  if (quality < 2) ctx.drawImage(vignC, 0, 0, W, H);
  if (L.dark > 0) { worldTransform(sx, sy); drawSonar(); ctx.setTransform(dpr, 0, 0, dpr, 0, 0); }
  drawHUD();

}
function draw() {
  btnReg = [];
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  if (scene === 'title') drawTitle();
  else if (scene === 'map') drawMap();
  else if (scene === 'book') drawBook();
  else drawPlay();
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  drawPool(fxU);
}

/* =====================================================================
 * 輸入
 * ===================================================================== */
const ptrs = new Map();
function local(e) { const r = cv.getBoundingClientRect(); return [(e.clientX - r.left) * W / (r.width || 1), (e.clientY - r.top) * H / (r.height || 1)]; }
cv.addEventListener('pointerdown', e => {
  e.preventDefault();
  const [x, y] = local(e);
  const b = hitBtn(x, y);
  if (b) {
    if (b.instant) { b.onClick(); ptrs.set(e.pointerId, { kind: 'instant', id: b.id }); pressedIds.add(b.id); }
    else { ptrs.set(e.pointerId, { kind: 'btn', id: b.id }); pressedIds.add(b.id); sfx('ds_ui', { vol: 0.6 }); }
    try { cv.setPointerCapture(e.pointerId); } catch (_) { /* 忽略 */ }
    return;
  }
  if (scene === 'book' && bookDetail) { bookDetail = null; return; }
  if (scene === 'play' && state === 'play' && !joy.on) {
    joy.on = true; joy.pid = e.pointerId; joy.ox = x; joy.oy = y; joy.dx = 0; joy.dy = 0;
    ptrs.set(e.pointerId, { kind: 'joy' });
    try { cv.setPointerCapture(e.pointerId); } catch (_) { /* 忽略 */ }
  }
});
cv.addEventListener('pointermove', e => {
  const p = ptrs.get(e.pointerId); if (!p || p.kind !== 'joy' || !joy.on) return;
  const [x, y] = local(e), jr = clamp(56 * U, 44, 64);
  let vx = x - joy.ox, vy = y - joy.oy, l = Math.hypot(vx, vy);
  if (l > jr) { joy.ox = x - vx / l * jr; joy.oy = y - vy / l * jr; vx = x - joy.ox; vy = y - joy.oy; l = jr; }
  const m = l / jr, dz = 0.12, k = m < dz ? 0 : (m - dz) / (1 - dz);
  joy.dx = l ? vx / l * k : 0; joy.dy = l ? vy / l * k : 0;
});
function endPtr(e, cancel) {
  const p = ptrs.get(e.pointerId); ptrs.delete(e.pointerId);
  if (!p) return;
  if (p.kind === 'joy') { joy.on = false; joy.dx = joy.dy = 0; return; }
  pressedIds.delete(p.id);
  if (p.kind === 'btn' && !cancel) {
    const [x, y] = local(e), b = hitBtn(x, y);
    if (b && b.id === p.id && b.onClick) b.onClick();
  }
}
cv.addEventListener('pointerup', e => endPtr(e, false));
cv.addEventListener('pointercancel', e => endPtr(e, true));
cv.addEventListener('contextmenu', e => e.preventDefault());
const KEYMAP = { ArrowLeft: 'l', a: 'l', A: 'l', ArrowRight: 'r', d: 'r', D: 'r', ArrowUp: 'u', w: 'u', W: 'u', ArrowDown: 'd', s: 'd', S: 'd' };
window.addEventListener('keydown', e => {
  const k = KEYMAP[e.key];
  if (k) { keys[k] = 1; if (scene === 'play') e.preventDefault(); }
  if (scene === 'play') {
    if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); if (state === 'play') doSonar(); else if (state === 'paused') resumeGame(); }
    if (e.key === 'Escape' || e.key === 'p' || e.key === 'P') { if (state === 'play') pauseGame(); else if (state === 'paused') resumeGame(); }
  } else if (scene === 'title' && (e.key === 'Enter' || e.key === ' ')) goMap();
  else if (scene === 'book') { if (e.key === 'ArrowLeft') bookPage = Math.max(0, bookPage - 1); if (e.key === 'ArrowRight') bookPage++; if (e.key === 'Escape') { if (bookDetail) bookDetail = null; else goTitle(); } }
  else if (scene === 'map' && e.key === 'Escape') goTitle();
});
window.addEventListener('keyup', e => { const k = KEYMAP[e.key]; if (k) keys[k] = 0; });
window.addEventListener('blur', () => { keys.l = keys.r = keys.u = keys.d = 0; });
document.addEventListener('visibilitychange', () => { if (document.hidden) { if (scene === 'play' && state === 'play') pauseGame(); setLoop(0, 0); } });

/* =====================================================================
 * 版面、主迴圈、自動畫質
 * ===================================================================== */
let resizeTimer = 0;
function resize() {
  const r = cv.getBoundingClientRect();
  W = Math.max(1, r.width || innerWidth); H = Math.max(1, r.height || innerHeight);
  dpr = Math.min(window.devicePixelRatio || 1, QDPR[quality]);
  cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
  U = clamp(Math.min(W / 400, H / 700), 0.7, 1.35);
  buildScreenCaches();
  if (scene === 'play' && LV) {
    const oz = zoom; computeZoom(); clampCam();
    clearTimeout(resizeTimer);
    if (!terr || Math.abs(zoom * dpr - terr.ts) / terr.ts > 0.25) resizeTimer = setTimeout(() => { if (scene === 'play' && LV) buildTerrain(); }, 180);
    if (oz !== zoom) sprCache.clear();
  }
}
window.addEventListener('resize', resize);
window.addEventListener('orientationchange', () => setTimeout(resize, 200));
if (window.visualViewport) window.visualViewport.addEventListener('resize', resize);
const perf = { last: 0, n: 0, sum: 0, cool: 3 };
function governor(now) {
  const dt = perf.last ? Math.min(0.5, (now - perf.last) / 1000) : 0; perf.last = now;
  if (document.hidden || quality >= 2) return;
  perf.cool -= dt; if (perf.cool > 0) return;
  perf.sum += dt; perf.n++;
  if (perf.n >= 90) {
    if (perf.sum / perf.n > 1 / 45) { quality++; KG.store.set('quality:' + SLUG, quality); sprCache.clear(); resize(); if (scene === 'play' && LV) buildTerrain(); perf.cool = 2; }
    perf.n = 0; perf.sum = 0;
  }
}
function step(dt) {
  time += dt; sceneT += dt;
  if (shakeT > 0) shakeT -= dt;
  updateTweens(dt);
  if (scene === 'play' && LV) updatePlay(dt);
  updatePool(fxU, dt);
}
let lastT = performance.now();
function frame(now) {
  const dt = Math.min(0.05, Math.max(0, (now - lastT) / 1000)); lastT = now;
  frameDt = dt;
  step(dt);
  draw();
  governor(now);
  requestAnimationFrame(frame);
}
resize();
goTitle();
requestAnimationFrame(t => { lastT = t; frame(t); });

/* ---------- 測試用 ---------- */
function reachCheck(i) {
  const keep = LV, sv = [GW, GH, grid, curX, curY, curCells]; const L = parseLevel(i);
  const step = T / 2, nx = Math.ceil(GW * 2), ny = Math.ceil(GH * 2), free = new Uint8Array(nx * ny), seen = new Uint8Array(nx * ny);
  const ok = (x, y) => !collide(x - 11, y, 14) && !collide(x + 11, y, 14);
  for (let j = 0; j < ny; j++) for (let k = 0; k < nx; k++) free[j * nx + k] = ok((k + 0.5) * step, (j + 0.5) * step) ? 1 : 0;
  const sk = Math.floor(L.start.x / step), sj = Math.floor(L.start.y / step), q = [sk, sj]; seen[sj * nx + sk] = 1;
  for (let h = 0; h < q.length; h += 2) {
    const k = q[h], j = q[h + 1];
    for (const [dx, dy] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) {
      const a = k + dx, b = j + dy; if (a < 0 || b < 0 || a >= nx || b >= ny) continue;
      const id = b * nx + a; if (seen[id] || !free[id]) continue;
      if (!ok((k + 0.5 + dx * 0.5) * step, (j + 0.5 + dy * 0.5) * step)) continue;
      seen[id] = 1; q.push(a, b);
    }
  }
  const reach = (x, y, rad) => { const k0 = Math.floor(x / step), j0 = Math.floor(y / step); for (let j = j0 - 2; j <= j0 + 2; j++) for (let k = k0 - 2; k <= k0 + 2; k++) { if (k < 0 || j < 0 || k >= nx || j >= ny || !seen[j * nx + k]) continue; if (Math.hypot((k + 0.5) * step - x, (j + 0.5) * step - y) < rad) return true; } return false; };
  const bad = [];
  if (!reach(L.exit.x, L.exit.y, 42)) bad.push('exit');
  L.pearls.forEach(p => { if (!reach(p.x, p.y, 34)) bad.push('pearl@' + Math.floor(p.x / T) + ',' + Math.floor(p.y / T)); });
  L.chests.forEach(p => { if (!reach(p.x, p.y - 14, 40)) bad.push('chest@' + Math.floor(p.x / T) + ',' + Math.floor(p.y / T)); });
  L.gems.forEach(p => { if (!reach(p.x, p.y, 36)) bad.push('gem@' + Math.floor(p.x / T) + ',' + Math.floor(p.y / T)); });
  L.babies.forEach(p => { if (!reach(p.hx, p.hy, 50)) bad.push('baby@' + Math.floor(p.hx / T) + ',' + Math.floor(p.hy / T)); });
  L.cps.forEach(p => { if (!reach(p.x, p.y - 34, 55)) bad.push('cp@' + Math.floor(p.x / T) + ',' + Math.floor(p.y / T)); });
  L.airs.forEach(p => { if (!reach(p.x, p.y, 34)) bad.push('air@' + Math.floor(p.x / T) + ',' + Math.floor(p.y / T)); });
  [GW, GH, grid, curX, curY, curCells] = sv; LV = keep;
  return { bad, start: free[sj * nx + sk] === 1 };
}
window.__ds = {
  state: () => ({ scene, state, level: LV ? LV.idx : -1, hearts, air: +air.toFixed(3), score, t: +levelT.toFixed(2), sub: { x: Math.round(sub.x), y: Math.round(sub.y), vx: Math.round(sub.vx), vy: Math.round(sub.vy) }, zoom: +zoom.toFixed(3), quality, pearls: LV ? LV.pearls.filter(p => p.got).length + '/' + LV.pearls.length : '', babies: LV ? LV.babies.map(b => b.state) : [], book: book.size, music: KG.music ? KG.music.isPlaying() : null, terr: terr ? [terr.c.width, terr.c.height, +terr.ts.toFixed(2)] : null }),
  start: i => startLevel(i || 0),
  title: () => goTitle(), map: () => goMap(), book: () => goBook('title'),
  tick: sec => { for (let i = 0; i < sec * 60; i++) step(1 / 60); },
  input: (x, y) => { testInput = x == null ? null : { x, y }; },
  tp: (x, y) => { sub.x = x; sub.y = y; sub.vx = sub.vy = 0; cam.x = x; cam.y = y; clampCam(); },
  tpTile: (i, j) => { sub.x = (i + 0.5) * T; sub.y = (j + 0.5) * T; sub.vx = sub.vy = 0; cam.x = sub.x; cam.y = sub.y; clampCam(); },
  items: () => LV ? { exit: LV.exit, babies: LV.babies.map(b => [Math.round(b.hx), Math.round(b.hy)]), gems: LV.gems.map(g => [Math.round(g.x), Math.round(g.y)]), cps: LV.cps.map(c => [Math.round(c.x), Math.round(c.y)]), fishes: LV.fishes.map(f => [Math.round(f.x), Math.round(f.y), f.state]), rocks: LV.rocks.map(r => [Math.round(r.hx), Math.round(r.hy), r.state]), hots: LV.hots.map(h => [Math.round(h.x), Math.round(h.y)]), vents: LV.vents.map(v => [Math.round(v.x), Math.round(v.y)]) } : null,
  finish: () => { if (LV) completeLevel(); },
  fail: () => { if (LV) { sub.inv = 0; hearts = 1; hurt(sub.x + 10, sub.y); } },
  sonar: () => doSonar(),
  pause: () => pauseGame(), resume: () => resumeGame(),
  unlockAll: () => { for (let i = 0; i < LEVELS.length; i++) if (!starsArr[i]) starsArr[i] = 1; Save.set('stars', starsArr); },
  discoverAll: () => { DEX.forEach(d => book.add(d.id)); Save.set('book', [...book]); },
  reach: i => reachCheck(i),
  setQuality: q => { quality = q; resize(); if (scene === 'play' && LV) buildTerrain(); },
  zoomOut: z => { zoom = z; viewW = W / zoom; viewH = H / zoom; clampCam(); },
  buttons: () => btnReg.map(b => ({ id: b.id, x: Math.round(b.x + b.w / 2), y: Math.round(b.y + b.h / 2), w: Math.round(b.w), h: Math.round(b.h) })),
  openBook: i => { bookDetail = { i, t: 1 }; },
  mapSize: () => [GW * T, GH * T],
  bench: n => { const t0 = performance.now(); for (let i = 0; i < n; i++) { step(1 / 60); draw(); } return (performance.now() - t0) / n; }
};
})();
