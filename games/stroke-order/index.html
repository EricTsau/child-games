<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>國字筆順練習</title>
<link rel="stylesheet" href="../../assets/common.css">
<style>
  :root {
    --paper: #f7f0e1; --paper2: #efe4cc; --ink: #2a2420; --ink2: #5a4d42; --red: #c8372d; --red2: #9e2a22;
    --jade: #3f8f6f; --jade2: #2c6b52; --gold: #e0a32e; --blue: #3d6fa8; --line: #e3b3a8;
    --kai: "BiauKai", "DFKai-SB", "標楷體", "TW-Kai", "Kaiti TC", "STKaiti", "KaiTi", "Noto Serif TC", "Noto Serif CJK TC", serif;
  }
  html, body { height: 100%; overflow: hidden; background: var(--paper); overscroll-behavior: none; color: var(--ink); }
  #app { position: fixed; inset: 0; width: 100vw; height: 100vh; height: 100dvh; overflow: hidden; }
  #bg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .screen { position: absolute; inset: 0; display: none; }
  .screen.on { display: block; animation: scIn .32s ease-out; }
  @keyframes scIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
  button { font-family: inherit; color: inherit; }
  .btn {
    border: none; border-radius: 18px; padding: 10px 18px; font-size: 18px; font-weight: 800; cursor: pointer;
    background: #fffaf0; color: var(--ink); box-shadow: 0 4px 0 rgba(60,40,20,.22), 0 8px 16px rgba(60,40,20,.12);
    border: 2px solid rgba(60,40,20,.12); transition: transform .1s, box-shadow .1s; white-space: nowrap;
    display: inline-flex; align-items: center; justify-content: center; gap: 6px; line-height: 1.15;
  }
  .btn:active, .btn.press { transform: translateY(3px); box-shadow: 0 1px 0 rgba(60,40,20,.22), 0 3px 8px rgba(60,40,20,.12); }
  .btn.red { background: linear-gradient(180deg, #e2554a, var(--red)); color: #fff; border-color: var(--red2); box-shadow: 0 4px 0 var(--red2), 0 8px 16px rgba(158,42,34,.3); }
  .btn.jade { background: linear-gradient(180deg, #55a985, var(--jade)); color: #fff; border-color: var(--jade2); box-shadow: 0 4px 0 var(--jade2), 0 8px 16px rgba(44,107,82,.3); }
  .btn.ink { background: linear-gradient(180deg, #4a403a, var(--ink)); color: #fff; border-color: #000; box-shadow: 0 4px 0 #000, 0 8px 16px rgba(0,0,0,.25); }
  .btn.gold { background: linear-gradient(180deg, #f3c25a, var(--gold)); color: #4a3000; border-color: #b07a12; box-shadow: 0 4px 0 #b07a12, 0 8px 16px rgba(176,122,18,.3); }
  .btn:disabled { opacity: .45; }
  .btn svg { width: 22px; height: 22px; flex: none; }
  .sideBtn {
    position: fixed; top: 62px; width: 48px; height: 48px; border-radius: 50%; z-index: 8500; display: none;
    border: 3px solid #fff; background: linear-gradient(180deg, #fffdf7, #f1e6cf); box-shadow: 0 4px 0 rgba(60,40,20,.2), 0 8px 18px rgba(60,40,20,.14);
    align-items: center; justify-content: center; cursor: pointer; padding: 0;
  }
  .sideBtn svg { width: 26px; height: 26px; }
  .sideBtn.on { display: flex; }
  .sideBtn:active { transform: scale(.92); }
  #btnBack { left: 10px; }
  #btnMenu { right: 10px; }
  .hdr { position: absolute; top: 0; left: 64px; right: 64px; height: 58px; display: flex; align-items: center; justify-content: center; gap: 8px; }
  .hdr h2 { margin: 0; font-family: var(--kai); font-size: 26px; font-weight: 900; letter-spacing: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .scroll { position: absolute; overflow-y: auto; overflow-x: hidden; -webkit-overflow-scrolling: touch; touch-action: pan-y; }
  .foot { position: absolute; left: 0; right: 0; bottom: 0; display: flex; justify-content: center; gap: 10px; padding: 10px 12px calc(12px + env(safe-area-inset-bottom)); }

  /* 標題 */
  #scTitle .logo { position: absolute; left: 0; right: 0; text-align: center; font-family: var(--kai); font-weight: 900; color: var(--ink); letter-spacing: 4px; text-shadow: 0 3px 0 rgba(200,55,45,.18); white-space: nowrap; }
  #scTitle .logo span { display: inline-block; animation: bob 3.2s ease-in-out infinite; }
  @keyframes bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }
  #scTitle .sub { position: absolute; left: 12px; right: 12px; text-align: center; color: var(--ink2); font-weight: 700; }
  #titleBoard { position: absolute; display: block; }
  #scTitle .tbtns { position: absolute; display: flex; flex-direction: column; align-items: stretch; gap: 12px; }
  #scTitle .tbtns .btn { font-size: 20px; padding: 13px 18px; }
  #scTitle .stats { position: absolute; left: 0; right: 0; text-align: center; font-weight: 800; color: var(--ink2); font-size: 15px; }
  .seal { display: inline-flex; align-items: center; justify-content: center; background: var(--red); color: #fff7ef; font-family: var(--kai); font-weight: 900; border-radius: 6px; box-shadow: inset 0 0 0 3px rgba(255,240,230,.5); }

  /* 地圖 */
  #mapInner { position: relative; }
  #mapInner > svg { position: absolute; left: 0; top: 0; pointer-events: none; }
  .node { position: absolute; width: 132px; margin-left: -66px; text-align: center; cursor: pointer; }
  .node .disc { width: 92px; height: 92px; margin: 0 auto; border-radius: 50%; background: #fffaf0; border: 5px solid; box-shadow: 0 5px 0 rgba(60,40,20,.2), 0 10px 18px rgba(60,40,20,.15); position: relative; transition: transform .12s; }
  .node:active .disc { transform: scale(.94); }
  .node canvas { width: 70px; height: 70px; position: absolute; left: 6px; top: 6px; }
  .node .nm { font-weight: 900; font-size: 18px; margin-top: 6px; font-family: var(--kai); }
  .node .st { font-size: 13px; font-weight: 800; color: var(--ink2); }
  .node .num { position: absolute; left: -6px; top: -6px; width: 28px; height: 28px; border-radius: 50%; color: #fff; font-weight: 900; font-size: 15px; display: flex; align-items: center; justify-content: center; border: 2px solid #fff; }
  .node .done { position: absolute; right: -10px; top: -8px; }

  /* 課程 */
  #grid { display: grid; gap: 12px; justify-content: center; padding: 8px 0 20px; }
  .tile { background: #fffaf0; border-radius: 16px; padding: 6px 6px 4px; text-align: center; box-shadow: 0 4px 0 rgba(60,40,20,.16), 0 6px 14px rgba(60,40,20,.1); cursor: pointer; border: 2px solid rgba(60,40,20,.08); transition: transform .1s; }
  .tile:active { transform: scale(.95); }
  .tile canvas { display: block; margin: 0 auto; }
  .tile .ts { height: 18px; display: flex; justify-content: center; gap: 1px; margin-top: 2px; }
  .tile .ts svg { width: 16px; height: 16px; }
  .lessonInfo { text-align: center; font-weight: 800; color: var(--ink2); padding: 0 12px; }

  /* 寫字 */
  #board, #qBoard { position: absolute; display: block; touch-action: none; border-radius: 10px; box-shadow: 0 6px 0 rgba(60,40,20,.14), 0 10px 26px rgba(60,40,20,.14); }
  .tabs { position: absolute; display: flex; gap: 4px; background: rgba(60,40,20,.08); border-radius: 16px; padding: 4px; }
  .tabs button { flex: 1; border: none; background: transparent; border-radius: 12px; font-weight: 900; font-size: 15px; padding: 0 2px; cursor: pointer; color: var(--ink2); white-space: nowrap; min-width: 0; }
  .tabs button.on { background: #fffaf0; color: var(--red); box-shadow: 0 2px 0 rgba(60,40,20,.16); }
  .tabs button.pulse { animation: tabPulse 1s ease-in-out infinite; }
  @keyframes tabPulse { 0%,100% { background: transparent; } 50% { background: rgba(224,163,46,.45); } }
  .navc { display: flex; align-items: center; justify-content: center; gap: 6px; width: 100%; }
  .navc .arrow { width: 40px; height: 40px; border-radius: 50%; border: none; background: rgba(255,250,240,.9); box-shadow: 0 3px 0 rgba(60,40,20,.18); cursor: pointer; display: flex; align-items: center; justify-content: center; padding: 0; flex: none; }
  .navc .arrow svg { width: 22px; height: 22px; }
  .navc .arrow:disabled { opacity: .3; }
  .navc .ttl { text-align: center; min-width: 0; overflow: hidden; }
  .navc .ttl b { font-family: var(--kai); font-size: 22px; display: block; line-height: 1.1; white-space: nowrap; }
  .navc .ttl small { font-size: 12px; font-weight: 800; color: var(--ink2); white-space: nowrap; }
  .info { position: absolute; overflow-y: auto; overflow-x: hidden; }
  .info .msg { font-weight: 900; font-size: 17px; text-align: center; min-height: 26px; margin-bottom: 6px; }
  .info .msg em { font-style: normal; color: var(--red); }
  .chips { display: flex; flex-wrap: wrap; gap: 5px; justify-content: center; }
  .chip { display: inline-flex; align-items: center; gap: 3px; padding: 3px 9px 3px 4px; border-radius: 999px; background: #fffaf0; font-weight: 800; font-size: 14px; border: 2px solid rgba(60,40,20,.1); cursor: pointer; transition: transform .15s, background .2s; }
  .chip i { font-style: normal; width: 20px; height: 20px; border-radius: 50%; background: #d8cdb9; color: #fff; font-size: 12px; display: inline-flex; align-items: center; justify-content: center; }
  .chip.done i { background: var(--ink); }
  .chip.cur { background: #fde7c4; border-color: var(--gold); transform: scale(1.08); }
  .chip.cur i { background: var(--red); }
  .chip.bad i { background: #e08a2e; }
  .ctrls { position: absolute; display: flex; gap: 8px; justify-content: center; align-items: center; flex-wrap: wrap; }
  .ctrls .btn { font-size: 16px; padding: 10px 12px; min-height: 48px; }
  .ctrls.compact .btn:not(.red):not(.jade):not(.gold) span { display: none; }
  .ctrls.compact .btn { padding: 10px 13px; }

  /* 測驗 */
  #qText { position: absolute; text-align: center; font-weight: 900; font-size: 20px; }
  #qText small { display: block; font-size: 14px; color: var(--ink2); font-weight: 800; }
  #qOpts { position: absolute; display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  #qOpts .btn { font-size: 21px; min-height: 58px; padding: 4px 8px; font-family: var(--kai); font-weight: 900; white-space: normal; line-height: 1.1; flex-direction: column; gap: 0; }
  #qOpts .btn.right { background: linear-gradient(180deg, #6cc59a, var(--jade)); color: #fff; border-color: var(--jade2); }
  #qOpts .btn.wrong { background: #e9dccb; color: #9a8b7a; animation: shakeX .35s; }
  @keyframes shakeX { 0%,100% { transform: translateX(0); } 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }
  #qTop { display: flex; align-items: center; justify-content: center; gap: 10px; font-weight: 900; }
  .pbar { width: 120px; height: 12px; border-radius: 8px; background: rgba(60,40,20,.12); overflow: hidden; }
  .pbar div { height: 100%; background: linear-gradient(90deg, var(--gold), var(--red)); border-radius: 8px; transition: width .3s; }

  /* 遮罩 */
  .overlay { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; background: rgba(42,36,32,.42); padding: 12px; }
  .overlay.on { display: flex; animation: fadeIn .2s ease-out; }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  #menu { z-index: 9000; }
  #result { z-index: 8800; }
  .card { background: var(--paper); border-radius: 24px; padding: 18px 18px 16px; width: min(380px, 100%); max-height: 100%; display: flex; flex-direction: column; box-shadow: 0 10px 0 rgba(60,40,20,.25), 0 20px 50px rgba(0,0,0,.3); border: 3px solid #fff; position: relative; animation: popIn .32s cubic-bezier(.2,1.5,.4,1); }
  @keyframes popIn { from { transform: scale(.8); opacity: 0; } to { transform: none; opacity: 1; } }
  .card h3 { margin: 0 0 8px; text-align: center; font-family: var(--kai); font-size: 26px; }
  .card .body { overflow-y: auto; min-height: 0; display: flex; flex-direction: column; gap: 9px; padding: 4px 2px; }
  .card .body .btn { box-shadow: 0 3px 0 rgba(60,40,20,.2); }
  .card .row { display: grid; grid-template-columns: 1fr 1fr; gap: 9px; }
  .card .btn { width: 100%; font-size: 17px; padding: 11px 8px; }
  .card .acts { display: flex; flex-direction: column; gap: 9px; margin-top: 10px; flex: none; }
  .card .acts .two { display: grid; grid-template-columns: 1fr 1fr; gap: 9px; }
  .stamp { width: 104px; height: 104px; margin: -4px auto 4px; font-size: 40px; line-height: 1; flex-direction: column; letter-spacing: 2px; transform: rotate(-8deg); }
  .stamp.go { animation: stampIn .45s cubic-bezier(.3,1.6,.5,1) both; }
  @keyframes stampIn { 0% { transform: scale(2.4) rotate(-20deg); opacity: 0; } 60% { opacity: 1; } 100% { transform: scale(1) rotate(-8deg); opacity: 1; } }
  .stars { display: flex; justify-content: center; gap: 8px; margin: 2px 0 6px; }
  .stars svg { width: 44px; height: 44px; }
  .stars svg.pop { animation: starPop .5s cubic-bezier(.2,1.8,.4,1) both; }
  @keyframes starPop { from { transform: scale(0) rotate(-60deg); } to { transform: none; } }
  .rtext { text-align: center; font-weight: 800; font-size: 17px; line-height: 1.5; }
  .rtext b { color: var(--red); font-size: 22px; }
  .bestTag { display: inline-block; background: var(--gold); color: #4a3000; border-radius: 8px; padding: 1px 8px; font-size: 14px; margin-left: 4px; }
  @media (max-height: 430px) {
    .card { padding: 12px 14px 12px; }
    .card h3 { font-size: 21px; margin-bottom: 4px; }
    .stamp { width: 76px; height: 76px; font-size: 28px; }
    .stars svg { width: 34px; height: 34px; }
    .card .btn { padding: 8px 6px; font-size: 16px; }
  }
</style>
</head>
<body>
<div id="app">
  <canvas id="bg"></canvas>
  <section id="scTitle" class="screen">
    <div class="logo" id="tLogo"></div>
    <div class="sub" id="tSub">跟著標準筆順，一筆一畫寫漂亮</div>
    <canvas id="titleBoard"></canvas>
    <div class="tbtns" id="tBtns">
      <button class="btn red" id="bStart" data-sfx="select">開始學寫字</button>
      <button class="btn jade" id="bQuiz" data-sfx="select">筆畫名稱考考你</button>
      <button class="btn" id="bSet" data-sfx="ui">設定</button>
    </div>
    <div class="stats" id="tStats"></div>
  </section>
  <section id="scMap" class="screen">
    <div class="hdr"><h2>學習地圖</h2></div>
    <div class="scroll" id="mapScroll"><div id="mapInner"></div></div>
  </section>
  <section id="scLesson" class="screen">
    <div class="hdr"><h2 id="lTitle"></h2></div>
    <div class="lessonInfo" id="lInfo" style="position:absolute;left:64px;right:64px;top:66px;height:36px;display:flex;align-items:center;justify-content:center"></div>
    <div class="scroll" id="lScroll"><div id="grid"></div></div>
    <div class="foot" id="lFoot"><button class="btn red" id="lGo" data-sfx="select">從第一個字開始</button></div>
  </section>
  <section id="scChar" class="screen">
    <div class="hdr" id="cHdr">
      <div class="navc">
        <button class="arrow" id="cPrev" aria-label="上一個字" data-sfx="back"><svg viewBox="0 0 24 24"><path d="M15 4 7 12l8 8" fill="none" stroke="#2a2420" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
        <div class="ttl"><b id="cTitle"></b><small id="cSub"></small></div>
        <button class="arrow" id="cNext" aria-label="下一個字" data-sfx="select"><svg viewBox="0 0 24 24"><path d="m9 4 8 8-8 8" fill="none" stroke="#2a2420" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
      </div>
    </div>
    <div class="tabs" id="cTabs">
      <button data-m="demo">看筆順</button><button data-m="trace">描描看</button><button data-m="write">自己寫</button><button data-m="card">認字卡</button>
    </div>
    <canvas id="board"></canvas>
    <div class="info" id="cInfo"><div class="msg" id="cMsg"></div><div class="chips" id="cChips"></div></div>
    <div class="ctrls" id="cCtrls"></div>
  </section>
  <section id="scQuiz" class="screen">
    <div class="hdr" id="qHdr"><h2>筆畫名稱考考你</h2></div>
    <div id="qTop" style="position:absolute"><span id="qNum"></span><div class="pbar"><div id="qBar"></div></div><span id="qScore"></span></div>
    <canvas id="qBoard"></canvas>
    <div id="qText"></div>
    <div id="qOpts"></div>
  </section>
</div>
<button class="sideBtn" id="btnBack" aria-label="返回"><svg viewBox="0 0 24 24"><path d="M14 5 7 12l7 7M8 12h11" fill="none" stroke="#2a2420" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
<button class="sideBtn" id="btnMenu" aria-label="暫停選單"><svg viewBox="0 0 24 24"><rect x="6" y="5" width="4" height="14" rx="1.5" fill="#2a2420"/><rect x="14" y="5" width="4" height="14" rx="1.5" fill="#2a2420"/></svg></button>
<div class="overlay" id="menu"><div class="card"><h3 id="mTitle">暫停一下</h3><div class="body" id="mBody"></div><div class="acts" id="mActs"></div></div></div>
<div class="overlay" id="result"><div class="card" id="rCard"></div></div>
<script src="../../assets/common.js"></script>
<script src="../../assets/kg-music.js"></script>
<script>
'use strict';
/* =====================================================================
 * 國字筆順練習：看筆順、描描看、自己寫、認字卡、筆畫名稱考考你
 * 92 個一、二年級常用字，筆順依教育部標準；全部筆畫由程式畫出（不用字型）
 * ===================================================================== */
(function () {
const SLUG = 'stroke-order';
/* =====================================================================
 * 資料：筆畫種類、字（注音、詞語、小圖、筆畫中心線）、課程
 * 筆順依教育部《常用國字標準字體筆順》；座標在 1000×1000 的格子裡（y 往下）。
 * 每一筆：「種類 x,y x,y …」，點後面加 * 代表轉折（尖角），其他點用平滑曲線連起來。
 * ===================================================================== */
const TYPES = {
  h: ['橫'], s: ['豎'], p: ['撇'], d: ['點'], n: ['捺'], t: ['提', '挑'],
  hz: ['橫折'], sz: ['豎折'], hp: ['橫撇'], pd: ['撇點'], pz: ['撇折'],
  sg: ['豎鉤'], hzg: ['橫折鉤'], sw: ['豎彎', '豎曲'], swg: ['豎彎鉤', '豎曲鉤'],
  hzwg: ['橫折彎鉤', '橫曲鉤'], xg: ['斜鉤'], wg: ['臥鉤']
};
const TYPE_ORDER = ['h', 's', 'p', 'd', 'n', 't', 'hz', 'sz', 'hp', 'pd', 'pz', 'sg', 'hzg', 'sw', 'swg', 'hzwg', 'xg', 'wg'];
function typeName(t) { return TYPES[t][0]; }
function typeLabel(t) { const a = TYPES[t]; return a[1] ? a[0] + '（' + a[1] + '）' : a[0]; }

/* 字：[注音, 詞語, 小圖, 筆畫] */
const CH = {
  '一': ['ㄧ', '一個', 'n1', 'h 140,510 860,490'],
  '二': ['ㄦˋ', '十二', 'n2', 'h 260,330 740,320 | h 140,700 860,685'],
  '三': ['ㄙㄢ', '三角形', 'n3', 'h 240,210 760,200 | h 300,480 700,472 | h 140,780 860,765'],
  '四': ['ㄙˋ', '四季', 'n4', 's 170,230 175,800 | hz 170,230 830,225* 825,800 | p 410,230 405,430 370,560 290,640 | sw 590,230 590,520 605,590 660,610 760,610 | h 175,790 825,790'],
  '五': ['ㄨˇ', '五月', 'n5', 'h 190,170 810,160 | s 470,165 440,520 | hz 290,520 720,510* 700,850 | h 110,850 890,838'],
  '六': ['ㄌㄧㄡˋ', '六月', 'n6', 'd 480,90 545,215 | h 130,330 870,320 | p 390,470 340,620 260,740 170,820 | d 610,480 700,600 800,760'],
  '七': ['ㄑㄧ', '七天', 'n7', 'h 110,470 890,400 | swg 400,110 400,700 415,800 480,850 600,860 830,855* 870,730'],
  '八': ['ㄅㄚ', '八月', 'n8', 'p 420,230 400,450 330,650 140,830 | n 590,240 630,450 730,650 880,800'],
  '九': ['ㄐㄧㄡˇ', '九九乘法', 'n9', 'p 440,110 430,420 360,660 140,860 | hzwg 160,360 600,340* 590,740 610,830 680,860 820,860* 860,740'],
  '十': ['ㄕˊ', '十分', 'n10', 'h 120,450 880,440 | s 500,100 500,920'],
  '百': ['ㄅㄞˇ', '一百', '', 'h 120,150 880,140 | p 520,150 440,320 | s 250,330 250,890 | hz 250,330 750,330* 750,890 | h 250,600 750,600 | h 250,880 750,880'],
  '千': ['ㄑㄧㄢ', '一千', '', 'p 760,90 540,190 270,240 | h 120,470 880,455 | s 500,200 500,920'],

  '人': ['ㄖㄣˊ', '大人', 'person', 'p 520,90 500,420 380,680 110,880 | n 500,380 590,600 720,770 900,880'],
  '大': ['ㄉㄚˋ', '大象', 'big', 'h 130,380 870,365 | p 510,90 495,430 370,700 110,890 | n 510,420 620,630 750,780 910,880'],
  '小': ['ㄒㄧㄠˇ', '小鳥', 'small', 'sg 500,90 500,840* 400,770 | d 310,380 270,520 190,660 | d 690,390 760,510 830,640'],

function catmull(p0, p1, p2, p3, t) {

function sampleRun(run, out) {

  if (run.length === 2) {
    const a = run[0], b = run[1], L = Math.hypot(b.x - a.x, b.y - a.y), n = Math.max(2, Math.ceil(L / 9));

    return;
  }
  for (let i = 0; i < run.length - 1; i++) {
    const p0 = run[Math.max(0, i - 1)], p1 = run[i], p2 = run[i + 1], p3 = run[Math.min(run.length - 1, i + 2)];

  else jingle(JG_TRY);

  const b = qBoard, st = q.g.strokes[q.idx];
  ensureLayer(b, 'Q' + q.ch + q.idx + penKind + b.size, g => {
    q.g.strokes.forEach((s2, i) => { if (i !== q.idx) drawStroke(g, s2, b.k, b.pad, b.pad, i < q.idx ? 'rgba(42,36,32,.55)' : 'rgba(120,100,80,.22)'); });
  });
  const c = boardBegin(b);
  Qz.t += dt;
  const d = strokeDur(st) * 1.2, cyc = d + 1.3, u = (Qz.t % cyc) / d;
  drawStroke(c, st, b.k, b.pad, b.pad, 'rgba(200,55,45,.2)');
  drawStroke(c, st, b.k, b.pad, b.pad, RED, st.L * easeStroke(clamp(u, 0, 1)));
  drawParts(b);
}
function L_quiz() {
  const land = W > H * 1.05;
  const top = $('qTop'), txt = $('qText'), opts = $('qOpts');
  const nOpt = Qz.q ? Qz.q.opts.length : 4, rows = nOpt === 3 ? 1 : 2;
  const optH = rows * 60 + (rows - 1) * 10;
  const hdr = $('qHdr');
  if (!land) {
    hdr.style.left = '64px'; hdr.style.right = '64px';
    place(top, 64, 62, W - 128, 46);
    const size = Math.min(W - 48, H - 116 - 70 - optH - 40, 460);
    sizeBoard(qBoard, size);
    const free = H - 116 - size - 70 - optH - 24;
    const y = 116 + Math.max(0, free * 0.3);
    place(qBoard.cv, (W - size) / 2, y);
    place(txt, 12, y + size + 10, W - 24, 60);
    place(opts, 16, H - optH - 18, W - 32, optH);
  } else {
    const size = Math.min(H - 20, W - 72 - 320, 640);
    sizeBoard(qBoard, size);
    const panelW = Math.min(440, W - 72 - size - 24 - 10);
    const gx = 72 + Math.max(0, (W - 72 - 10 - size - 24 - panelW) / 2);
    place(qBoard.cv, gx, (H - size) / 2);
    const px = gx + size + 24, pr = Math.max(64, W - px - panelW);
    place(top, px, 62, W - pr - px, 46);
    hdr.style.left = px + 'px'; hdr.style.right = pr + 'px'; hdr.style.width = 'auto';
    place(opts, px, H - optH - 16, panelW, optH);
    place(txt, px, Math.max(116, (116 + H - optH - 16) / 2 - 34), panelW, 60);
  }
}

/* =====================================================================
 * 結果（蓋章）
 * ===================================================================== */
let resultOpen = false;
function showResult(o) {
  resultOpen = true;
  const card = $('rCard');
  card.innerHTML = '<div class="seal stamp">' + o.stamp + '</div><h3>' + o.title + '</h3>' +
    '<div class="stars">' + [0, 1, 2].map(i => STAR_SVG(i < o.stars).replace('<svg', '<svg data-s="' + i + '"')).join('') + '</div>' +
    '<div class="rtext">' + o.text + (o.best ? '<span class="bestTag">進步了</span>' : '') + '</div><div class="acts"></div>';
  const stamp = card.querySelector('.stamp');
  stamp.style.fontSize = o.stamp.length > 2 ? '30px' : '';
  const acts = card.querySelector('.acts');
  const btns = o.btns || [];
  const main = btns.filter(b => b.cls), rest = btns.filter(b => !b.cls);
  const mk = b => { const e = document.createElement('button'); e.className = 'btn ' + (b.cls || ''); e.textContent = b.t; e.addEventListener('click', () => { sfx('select'); b.fn(); }); return e; };
  if (rest.length) { const two = document.createElement('div'); two.className = rest.length > 1 ? 'two' : ''; rest.forEach(b => two.appendChild(mk(b))); acts.appendChild(two); }
  if (main.length > 1) { const two = document.createElement('div'); two.className = 'two'; main.forEach(b => two.appendChild(mk(b))); acts.appendChild(two); }
  else main.forEach(b => acts.appendChild(mk(b)));
  $('result').classList.add('on');
  // 蓋章、星星一顆一顆出來
  setTimeout(() => { stamp.classList.add('go'); }, 60);
  setTimeout(() => { if (resultOpen) { sfx('so_stamp'); KG.vibrate(25); } }, 280);
  card.querySelectorAll('.stars svg').forEach((s, i) => {
    s.style.visibility = 'hidden';
    setTimeout(() => {
      if (!resultOpen) return;
      s.style.visibility = ''; s.classList.add('pop');
      if (i < o.stars) sfx('star', { vol: 0.7, pitch: 1 + i * 0.12, exact: true });
    }, 520 + i * 260);
  });
  if (o.stars >= 3) setTimeout(() => { if (resultOpen) KG.confetti(W / 2, H * 0.3, KG.lowEnd ? 50 : 90); }, 1300);
}
function closeResult() { if (!resultOpen) return; resultOpen = false; $('result').classList.remove('on'); }

/* =====================================================================
 * 暫停／設定選單
 * ===================================================================== */
function openMenu() {
  if (menuOpen) return;
  menuOpen = true;
  if (M) M.pause();
  if (window.speechSynthesis) window.speechSynthesis.cancel();
  if (activePtr != null) { activePtr = null; Tr.user = null; Wr.user = null; }
  buildMenu();
  $('menu').classList.add('on');
}
function closeMenu() {
  if (!menuOpen) return;
  menuOpen = false;
  $('menu').classList.remove('on');
  if (M) M.resume();
}
function buildMenu() {
  const inGame = screen !== 'title';
  $('mTitle').textContent = inGame ? '暫停一下' : '設定';
  const body = $('mBody'), acts = $('mActs');
  const tg = (label, on) => label + '：' + (on ? '開' : '關');
  body.innerHTML = '';
  const row = () => { const r = document.createElement('div'); r.className = 'row'; body.appendChild(r); return r; };
  const mk = (parent, text, cls, fn) => { const b = document.createElement('button'); b.className = 'btn ' + (cls || ''); b.textContent = text; b.addEventListener('click', fn); parent.appendChild(b); return b; };
  const r1 = row();
  mk(r1, tg('音樂', M ? M.isEnabled() : false), M && M.isEnabled() ? 'jade' : '', () => { if (M) M.setEnabled(!M.isEnabled()); sfx('ui'); buildMenu(); });
  mk(r1, tg('音效', sfxOn), sfxOn ? 'jade' : '', () => { sfxOn = !sfxOn; Save.set('sfx', sfxOn); sfx('ui'); buildMenu(); });
  const r2 = row();
  mk(r2, tg('語音', voiceOn), voiceOn ? 'jade' : '', () => { voiceOn = !voiceOn; Save.set('voice', voiceOn); sfx('ui'); if (voiceOn) say('語音開了'); else if (window.speechSynthesis) window.speechSynthesis.cancel(); buildMenu(); });
  mk(r2, '筆：' + (penKind === 'brush' ? '毛筆' : '鉛筆'), 'gold', () => { penKind = penKind === 'brush' ? 'pencil' : 'brush'; Save.set('pen', penKind); sfx('ui'); board.layerKey = ''; qBoard.layerKey = ''; titleBoard.layerKey = ''; buildMenu(); });
  const r3 = row(); r3.style.gridTemplateColumns = '1fr';
  mk(r3, '筆順速度：' + SPEEDS[speedIdx].n, '', () => { speedIdx = (speedIdx + 1) % 3; Save.set('speed', speedIdx); sfx('ui'); buildMenu(); });
  acts.innerHTML = '';
  mk(acts, inGame ? '繼續' : '關閉', 'red', () => { sfx('select'); closeMenu(); });
  if (inGame) {
    const two = document.createElement('div'); two.className = 'two'; acts.appendChild(two);
    mk(two, '學習地圖', '', () => { sfx('back'); closeMenu(); goMap(); });
    mk(two, '回到標題', '', () => { sfx('back'); closeMenu(); goTitle(); });
  }
}
$('menu').addEventListener('click', e => { if (e.target === $('menu')) { sfx('back'); closeMenu(); } });

/* =====================================================================
 * 延遲呼叫、鍵盤、分頁隱藏
 * ===================================================================== */
const timers = [];
function after(sec, fn) { timers.push({ t: sec, fn }); }
function updateTimers(dt) { for (let i = timers.length - 1; i >= 0; i--) { const tm = timers[i]; tm.t -= dt; if (tm.t <= 0) { timers.splice(i, 1); tm.fn(); } } }
window.addEventListener('keydown', e => {
  if (e.key === 'Escape') { if (menuOpen) closeMenu(); else if (resultOpen) closeResult(); else if (screen !== 'title') openMenu(); return; }
  if (menuOpen || resultOpen) return;
  if (screen === 'char') {
    if (e.key === 'ArrowRight') $('cNext').click();
    else if (e.key === 'ArrowLeft') $('cPrev').click();
    else if (/^[1-4]$/.test(e.key)) { sfx('so_page'); setMode(['demo', 'trace', 'write', 'card'][+e.key - 1]); }
    else if (e.key === ' ' && mode === 'demo') { e.preventDefault(); Object.assign(Dm, { idx: 0, t: 0, anim: false, auto: true, gap: 0.2, ended: false }); board.layerKey = ''; buildCtrls(); }
    else if (e.key === 'Enter' && mode === 'write' && !Wr.res) evalWrite();
  } else if (screen === 'quiz' && /^[1-4]$/.test(e.key)) {
    const b = $('qOpts').children[+e.key - 1]; if (b) b.click();
  } else if (screen === 'title' && e.key === 'Enter') $('bStart').click();
});
document.addEventListener('visibilitychange', () => {
  if (document.hidden && (screen === 'char' || screen === 'quiz') && !menuOpen) openMenu();
});

/* =====================================================================
 * 版面、主迴圈
 * ===================================================================== */
function layout() {
  if (screen === 'title') L_title();
  else if (screen === 'map') L_map();
  else if (screen === 'lesson') L_lesson();
  else if (screen === 'char') L_char();
  else if (screen === 'quiz') L_quiz();
}
let rzT = 0;
function resize() {
  const r = $('app').getBoundingClientRect();
  const nw = Math.max(1, r.width || innerWidth), nh = Math.max(1, r.height || innerHeight);
  const ndpr = Math.min(window.devicePixelRatio || 1, 2);
  const changed = nw !== W || nh !== H || ndpr !== dpr;
  W = nw; H = nh; dpr = ndpr;
  drawBg(); layout();
  if (changed && screen === 'map') buildMap();
  if (changed && screen === 'lesson') buildLesson();
}
function queueResize() { clearTimeout(rzT); rzT = setTimeout(resize, 60); }
window.addEventListener('resize', queueResize);
window.addEventListener('orientationchange', () => setTimeout(resize, 150));
if (window.visualViewport) window.visualViewport.addEventListener('resize', queueResize);

const perf = { n: 0, sum: 0, max: 0 };
function step(dt) {
  time += dt;
  if (!menuOpen) {
    updateTimers(dt); updateParts(dt);
    if (screen === 'char' && G) { if (mode === 'demo') updateDemo(dt); else if (mode === 'trace') updateTrace(dt); else if (mode === 'write') updateWrite(dt); }
  }
  updateBrush(dt); updateDuck();
}
function render(dt) {
  if (screen === 'title') updateTitleBoard(menuOpen ? 0 : dt);
  else if (screen === 'char' && G) {
    if (mode === 'demo') drawDemo(); else if (mode === 'trace') drawTrace(); else if (mode === 'write') drawWrite(); else drawCard();
    if (mode !== 'card') drawParts(board);
  } else if (screen === 'quiz') drawQuiz(menuOpen ? 0 : dt);
}
let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, Math.max(0, (now - last) / 1000)); last = now;
  const t0 = performance.now();
  try { step(dt); render(dt); } catch (err) { console.error(err); }
  const ft = performance.now() - t0; perf.n++; perf.sum += ft; if (ft > perf.max) perf.max = ft;
  requestAnimationFrame(frame);
}
G = null;
resize();
show('title'); updateTitle();
playSong(SONG_MAP);
requestAnimationFrame(t => { last = t; frame(t); });

/* ---------- 測試用 ---------- */
window.__so = {
  state: () => ({ screen, mode, ch: G && G.ch, lesson: curLesson, idx: curIdx, menu: menuOpen, result: resultOpen, music: M ? M.isPlaying() : null,
    demo: { idx: Dm.idx, anim: Dm.anim, auto: Dm.auto }, trace: { idx: Tr.idx, mistakes: Tr.mistakes, done: Tr.done }, write: { n: Wr.strokes.length, res: Wr.res && { score: Wr.res.score, stars: Wr.res.stars } },
    quiz: { i: Qz.i, score: Qz.score, answer: Qz.q && Qz.q.answer, opts: Qz.q && Qz.q.opts }, msg: $('cMsg').textContent, total: totalStars(), quizBest, pen: penKind, sfxOn, voiceOn }),
  openChar: (li, i) => openChar(li, i || 0),
  mode: m => setMode(m),
  quiz: () => startQuiz(),
  go: s => (s === 'title' ? goTitle() : s === 'map' ? goMap() : goLesson(s | 0)),
  /** 回傳目前要寫的那一筆在畫面上的座標（給測試用真的拖曳） */
  strokeScreen: (i, reverse) => {
    const st = G.strokes[i == null ? (mode === 'trace' ? Tr.idx : Wr.strokes.length) : i]; if (!st) return null;
    const r = board.cv.getBoundingClientRect(), sc = r.width / board.size;
    const pts = resample(st.pts, 14).map(p => ({ x: r.left + (board.pad + p.x * board.k) * sc, y: r.top + (board.pad + p.y * board.k) * sc }));
    return reverse ? pts.reverse() : pts;
  },
  boardRect: () => { const r = board.cv.getBoundingClientRect(); return { x: r.left, y: r.top, w: r.width, h: r.height }; },
  tick: sec => { for (let i = 0; i < sec * 60; i++) step(1 / 60); },
  perf: reset => { const r = { avg: perf.n ? +(perf.sum / perf.n).toFixed(2) : 0, max: +perf.max.toFixed(1), n: perf.n }; if (reset) { perf.n = 0; perf.sum = 0; perf.max = 0; } return r; },
  chars: () => ALL_CHARS.length,
  closeResult: () => closeResult()
};
})();
</script>
