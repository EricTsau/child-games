<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>小朋友遊戲樂園</title>
<meta name="description" content="30 個免費、免安裝、可愛的小朋友網頁遊戲，手機、平板、電腦都能玩。">
<meta name="theme-color" content="#ffd6e5">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎠</text></svg>">
<link rel="stylesheet" href="assets/common.css">
<style>
  body {
    min-height: 100vh;
    background:
      radial-gradient(circle at 15% 10%, rgba(255, 255, 255, 0.9) 0 60px, transparent 61px),
      radial-gradient(circle at 85% 18%, rgba(255, 255, 255, 0.8) 0 40px, transparent 41px),
      linear-gradient(180deg, #bfe8ff 0%, #ffe3ef 55%, #fff4d6 100%);
    background-attachment: fixed;
  }
  header {
    text-align: center;
    padding: 34px 16px 10px;
  }
  .logo {
    font-size: clamp(26px, 7vw, 60px);
    white-space: nowrap;
    font-weight: 900;
    margin: 0;
    color: #fff;
    letter-spacing: 2px;
    text-shadow:
      0 4px 0 var(--kg-pink-dark),
      0 8px 0 rgba(194, 68, 112, 0.35),
      0 12px 24px rgba(194, 68, 112, 0.3);
  }
  .logo .bob { display: inline-block; animation: kg-bounce 1.6s ease-in-out infinite; }
  .logo .bob:nth-child(2) { animation-delay: 0.2s; }
  .sub {
    margin: 14px 0 0;
    font-size: 18px;
    font-weight: 700;
    opacity: 0.85;
  }
  .filters {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    justify-content: center;
    padding: 18px 16px 6px;
  }
  .chip {
    font-family: var(--kg-font);
    font-size: 17px;
    font-weight: 800;
    border: 3px solid #fff;
    border-radius: 999px;
    padding: 8px 18px;
    background: rgba(255, 255, 255, 0.75);
    color: var(--kg-ink);
    cursor: pointer;
    box-shadow: 0 4px 0 rgba(74, 59, 82, 0.12);
  }
  .chip[aria-pressed="true"] { background: var(--kg-yellow); }
  main {
    max-width: 1180px;
    margin: 0 auto;
    padding: 16px 16px 60px;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
    gap: 18px;
  }
  .game {
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-decoration: none;
    color: inherit;
    background: #fff;
    border: 4px solid #fff;
    border-radius: 28px;
    padding: 14px 12px 16px;
    box-shadow: var(--kg-shadow);
    transition: transform 0.18s cubic-bezier(0.2, 1.6, 0.4, 1);
    overflow: hidden;
  }
  .game:hover, .game:focus-visible { transform: translateY(-6px) rotate(-1.5deg); outline: none; }
  .game:active { transform: scale(0.95); }
  .thumb {
    width: 100%;
    aspect-ratio: 1 / 0.82;
    border-radius: 20px;
    display: grid;
    place-items: center;
    font-size: 64px;
    position: relative;
    box-shadow: inset 0 -8px 0 rgba(0, 0, 0, 0.06);
  }
  .thumb::after {
    content: "";
    position: absolute;
    left: 12%;
    top: 10%;
    width: 30%;
    height: 14%;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.55);
    transform: rotate(-12deg);
  }
  .thumb span { filter: drop-shadow(0 6px 4px rgba(0, 0, 0, 0.18)); transition: transform 0.2s; }
  .game:hover .thumb span { transform: scale(1.12) rotate(6deg); }
  .num {
    position: absolute;
    top: 8px;
    right: 10px;
    width: 30px;
    height: 30px;
    border-radius: 50%;
    background: #fff;
    font-size: 14px;
    font-weight: 900;
    display: grid;
    place-items: center;
    box-shadow: 0 2px 0 rgba(0, 0, 0, 0.1);
    z-index: 1;
  }
  .game h3 { margin: 12px 0 4px; font-size: 20px; }
  .game p { margin: 0; font-size: 14px; line-height: 1.4; text-align: center; opacity: 0.75; }
  .tag {
    margin-top: 8px;
    font-size: 12px;
    font-weight: 800;
    padding: 3px 10px;
    border-radius: 999px;
    background: #f3ecf7;
  }
  footer { text-align: center; padding: 0 16px 40px; font-size: 14px; opacity: 0.7; }
  @media (max-width: 420px) {
    main { grid-template-columns: repeat(2, 1fr); gap: 12px; }
    .thumb { font-size: 52px; }
    .game h3 { font-size: 17px; }
    .game p { font-size: 12.5px; }
    .sub { font-size: 15px; }
  }
</style>
</head>
<body data-kg-no-buttons>
<header>
  <h1 class="logo"><span class="bob">🎠</span> 小朋友遊戲樂園 <span class="bob">🎈</span></h1>
  <p class="sub">30 個可愛小遊戲，手機、平板、電腦都能玩！</p>
</header>
<nav class="filters" id="filters" aria-label="遊戲分類"></nav>
<main id="list"></main>
<footer>點一下卡片就可以開始玩 ✨ 記得休息眼睛喔！</footer>

<script src="assets/common.js"></script>
<script>
  var GAMES = [
    ['memory-match', '動物翻翻樂', '🐶', '翻開卡片，找出一樣的動物好朋友', '益智', '#ffe0ec'],
    ['whack-a-mole', '打地鼠', '🐹', '地鼠跑出來了！快點敲一下', '反應', '#d9f5c9'],
    ['bubble-pop', '戳泡泡', '🫧', '戳破飄上來的彩色泡泡', '反應', '#d6f0ff'],
    ['fruit-catch', '接水果', '🍎', '移動籃子接住掉下來的水果', '反應', '#ffeccc'],
    ['jigsaw', '拼圖樂', '🧩', '把拼圖片拖到正確的位置', '益智', '#e6e0ff'],
    ['coloring', '塗色本', '🖍️', '幫可愛的圖畫塗上顏色', '創作', '#fff2c2'],
    ['math-monster', '數學小怪獸', '👾', '餵小怪獸吃正確的答案', '學習', '#e0ffe9'],
    ['color-mix', '調色魔法師', '🎨', '混合顏色，變出新的顏色', '學習', '#ffe0f7'],
    ['shape-sorter', '形狀配對', '🔺', '把形狀放進一樣的洞洞裡', '學習', '#ffe6d6'],
    ['caterpillar', '貪吃毛毛蟲', '🐛', '帶毛毛蟲吃葉子長長長', '反應', '#e2f7c4'],
    ['flappy-bird', '小鳥飛飛', '🐤', '點一下讓小鳥飛過水管', '反應', '#cdeeff'],
    ['dino-run', '恐龍快跑', '🦖', '跳過仙人掌，看你跑多遠', '反應', '#fff1cf'],
    ['candy-breakout', '糖果打磚塊', '🍬', '用板子把球彈去打糖果磚', '反應', '#ffd9e8'],
    ['frog-jump', '青蛙過河', '🐸', '跳上荷葉，幫青蛙回家', '反應', '#cdf3e3'],
    ['animal-piano', '動物鋼琴', '🎹', '彈奏音樂，跟著唱小星星', '創作', '#efe3ff'],
    ['counting', '數數看', '🔢', '數一數有幾個，選出正確數字', '學習', '#fff0d1'],
    ['fishing', '快樂釣魚', '🎣', '放下魚鉤，釣起海裡的魚', '反應', '#cfe9ff'],
    ['spot-difference', '找不同', '🔍', '找出兩張圖哪裡不一樣', '益智', '#e8f5d6'],
    ['mouse-maze', '老鼠找起司', '🐭', '走迷宮，帶小老鼠找到起司', '益智', '#fff4c4'],
    ['candy-match', '糖果三消', '🍭', '三個一樣排一排就消除', '益智', '#ffdff0'],
    ['tic-tac-toe', '貓狗圈圈叉', '🐱', '小貓和小狗的井字棋大戰', '益智', '#e3ecff'],
    ['slide-puzzle', '滑塊拼圖', '🔲', '滑動方塊，排回原來的圖', '益智', '#dff3ff'],
    ['dress-up', '小熊換裝', '🧸', '幫小熊穿上漂亮的衣服', '創作', '#ffe7d6'],
    ['cake-maker', '蛋糕店', '🎂', '做一個你最喜歡的蛋糕', '創作', '#ffe3ea'],
    ['space-shooter', '太空小飛船', '🚀', '駕駛飛船收集星星躲隕石', '反應', '#dcd8ff'],
    ['tower-stack', '疊疊樂', '🏗️', '對準時機，把積木疊高高', '反應', '#ffefd4'],
    ['simon-says', '跟我做', '🌈', '記住亮燈的順序再按一次', '益智', '#e2fbe8'],
    ['shadow-match', '影子配對', '👤', '把動物拖到牠的影子上', '學習', '#ececec'],
    ['garden', '小小花園', '🌻', '種種子、澆澆水，開出花朵', '創作', '#e3f9d0'],
    ['virtual-pet', '照顧小貓咪', '🐈', '餵牠吃飯、洗澡、陪牠玩', '創作', '#ffeedd']
  ];

  var CATS = ['全部', '反應', '益智', '學習', '創作'];
  var CAT_ICON = { '全部': '🌟', '反應': '⚡', '益智': '🧠', '學習': '📚', '創作': '🎨' };
  var current = KG.store.get('home:cat', '全部');
  if (CATS.indexOf(current) < 0) current = '全部';
  var filters = document.getElementById('filters');
  var list = document.getElementById('list');

  CATS.forEach(function (c) {
    var b = document.createElement('button');
    b.className = 'chip';
    b.textContent = CAT_ICON[c] + ' ' + c;
    b.dataset.cat = c;
    b.addEventListener('click', function () {
      current = c;
      KG.store.set('home:cat', c);
      KG.sound('click');
      render();
    });
    filters.appendChild(b);
  });

  function render() {
    Array.prototype.forEach.call(filters.children, function (b) {
      b.setAttribute('aria-pressed', b.dataset.cat === current ? 'true' : 'false');
    });
    list.innerHTML = '';
    GAMES.forEach(function (g, i) {
      if (current !== '全部' && g[4] !== current) return;
      var a = document.createElement('a');
      a.className = 'game';
      a.href = 'games/' + g[0] + '/';
      a.innerHTML =
        '<div class="num">' + (i + 1) + '</div>' +
        '<div class="thumb" style="background:' + g[5] + '"><span>' + g[2] + '</span></div>' +
        '<h3>' + g[1] + '</h3><p>' + g[3] + '</p>' +
        '<div class="tag">' + CAT_ICON[g[4]] + ' ' + g[4] + '</div>';
      a.addEventListener('pointerdown', function () { KG.sound('pop'); });
      list.appendChild(a);
    });
  }
  render();
</script>
</body>
</html>
