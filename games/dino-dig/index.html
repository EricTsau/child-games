<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>恐龍化石挖挖挖</title>
<link rel="stylesheet" href="../../assets/common.css">
<style>
  html, body { height: 100%; overflow: hidden; background: #f3d6a2; overscroll-behavior: none; }
  #game { position: fixed; inset: 0; display: block; width: 100vw; height: 100vh; height: 100dvh; touch-action: none; outline: none; }
  .scr { position: fixed; inset: 0; z-index: 9000; display: none; }
  .scr.on { display: flex; }
  button { font-family: var(--kg-font); }
  .kg-btn { font-size: 19px; padding: 11px 22px; }
  .kg-btn.small { font-size: 16px; padding: 9px 16px; }
  .tog { font: 800 15px var(--kg-font); border: 3px solid #e6c9a0; background: #fff; color: #6b4a2b; border-radius: 999px; padding: 7px 14px; cursor: pointer; }
  .tog.off { background: #ece6dd; color: #9b8f80; border-color: #d8cfc2; }
  .row { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }

  /* 標題 */
  #title { flex-direction: column; align-items: center; justify-content: flex-start; pointer-events: none; padding-top: max(62px, 7vh); }
  .tbox { pointer-events: auto; width: min(92vw, 440px); background: rgba(255, 250, 238, .93); border: 4px solid #fff; border-radius: 30px;
    box-shadow: 0 8px 0 rgba(120, 70, 30, .18), 0 16px 30px rgba(80, 40, 10, .2); padding: 14px 18px 16px; text-align: center; }
  .logo { margin: 0; font-size: clamp(30px, 9vw, 50px); line-height: 1.08; color: #7a3f14; letter-spacing: 2px; text-shadow: 0 3px 0 #ffd27a, 0 5px 0 rgba(0, 0, 0, .12); }
  .logo span { color: #e8692d; }
  .tsub { margin: 6px 0 2px; font-size: 15px; color: #7d5a3c; font-weight: 700; }
  .tstat { font-size: 15px; font-weight: 800; color: #8a5a20; margin: 4px 0 10px; }
  .tbtns { display: flex; flex-direction: column; gap: 10px; align-items: center; }
  .tbtns .big { font-size: 24px; padding: 13px 40px; }
  @media (orientation: landscape) and (max-height: 520px) {
    #title { padding-top: 0; justify-content: center; }
    .tbox { width: min(56vw, 460px); padding: 8px 14px 12px; }
    .logo { font-size: 32px; }
    .logo br { display: none; }
    .tsub { display: none; }
    .tstat { margin: 2px 0 6px; }
    .tbtns { gap: 7px; }
    .tbtns .big { font-size: 20px; padding: 9px 30px; }
    .kg-btn { padding: 8px 18px; font-size: 17px; }
  }

  /* 全頁面板 */
  .panel { flex-direction: column; background: linear-gradient(#fff6e2, #f6dfb6); }
  .phead { flex: none; padding: 10px 66px 6px; text-align: center; }
  .phead h2 { margin: 6px 0 0; font-size: 24px; color: #7a3f14; }
  .phead p { margin: 2px 0 0; font-size: 14px; color: #8a6a4a; font-weight: 700; }
  .pbody { flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain; touch-action: pan-y; padding: 6px 12px 16px; -webkit-overflow-scrolling: touch; }
  .pfoot { flex: none; display: flex; gap: 10px; justify-content: center; padding: 9px 12px calc(9px + env(safe-area-inset-bottom)); background: rgba(255, 238, 210, .96); border-top: 3px solid #f0d3a6; }
  @media (orientation: landscape) and (max-height: 520px) {
    .phead { padding: 6px 66px 2px; } .phead h2 { font-size: 20px; margin-top: 4px; } .phead p { display: none; }
    .pfoot { padding: 6px 12px calc(6px + env(safe-area-inset-bottom)); }
  }

  /* 挖掘地點 */
  .sites { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 12px; max-width: 1000px; margin: 0 auto; }
  .site { position: relative; background: #fff; border-radius: 22px; box-shadow: 0 5px 0 rgba(120, 70, 30, .15); overflow: hidden; border: 3px solid #fff; }
  .site .sart { display: block; width: 100%; height: 92px; }
  .sname { position: absolute; left: 12px; top: 8px; font-weight: 900; font-size: 22px; color: #fff; text-shadow: 0 2px 0 rgba(0, 0, 0, .4), 0 0 6px rgba(0, 0, 0, .3); }
  .ssub { position: absolute; left: 12px; top: 40px; font-weight: 800; font-size: 13px; color: #fff; text-shadow: 0 1px 0 rgba(0, 0, 0, .5), 0 0 4px rgba(0, 0, 0, .4); }
  .specs { display: flex; gap: 8px; padding: 8px; }
  .spec { flex: 1 1 0; min-width: 0; border: 3px solid #f0dcc0; background: #fffaf1; border-radius: 16px; padding: 4px 2px 6px; display: flex; flex-direction: column;
    align-items: center; gap: 1px; cursor: pointer; font-weight: 900; color: #5b3a1e; font-size: 15px; }
  .spec:active { transform: scale(.96); }
  .spec canvas { width: 88px; height: 58px; }
  .spec .st { color: #f2a51f; font-size: 15px; letter-spacing: 1px; line-height: 1; }
  .spec .tag { font-size: 12px; color: #fff; background: #e8692d; border-radius: 999px; padding: 1px 8px; }
  .spec .tag.g { background: #46b864; }
  .site.locked .specs { filter: grayscale(1); opacity: .45; pointer-events: none; }
  .lockmsg { position: absolute; left: 0; right: 0; bottom: 30px; text-align: center; font-weight: 900; color: #6b4a2b; font-size: 16px; }
  .lockmsg span { background: #fff3d9; border: 3px solid #f0cf96; border-radius: 999px; padding: 6px 14px; }

  /* 對話框 */
  .modal { align-items: center; justify-content: center; background: rgba(40, 25, 10, .45); padding: 10px; }
  .card { background: #fffaf0; border-radius: 26px; border: 4px solid #fff; box-shadow: 0 8px 0 rgba(120, 70, 30, .2), 0 18px 36px rgba(0, 0, 0, .25);
    width: min(94vw, 430px); max-height: 100%; display: flex; flex-direction: column; overflow: hidden; }
  .cbody { overflow-y: auto; overscroll-behavior: contain; padding: 14px 18px 6px; text-align: center; min-height: 0; flex: 1 1 auto; touch-action: pan-y; }
  .cbody h2 { margin: 2px 0 8px; color: #7a3f14; font-size: 25px; }
  .cfoot { flex: none; display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; padding: 8px 12px 14px; }
  .rstars { font-size: 44px; color: #f2a51f; letter-spacing: 4px; line-height: 1.1; text-shadow: 0 3px 0 #c97f0c; }
  .rstars .off { color: #e5d8c4; text-shadow: 0 3px 0 #cbb999; }
  .rstars span { display: inline-block; animation: pop .45s cubic-bezier(.3, 1.6, .5, 1) both; }
  @keyframes pop { from { transform: scale(0); } to { transform: scale(1); } }
  .rmsg { font-weight: 800; color: #6b4a2b; margin: 6px 0; }
  .rbones { display: grid; grid-template-columns: 1fr 1fr; gap: 4px 12px; text-align: left; font-size: 14px; font-weight: 800; color: #5b3a1e; margin: 6px 0; }
  .rb { display: flex; flex-direction: column; gap: 2px; }
  .bar { height: 9px; border-radius: 9px; background: #eadfcd; overflow: hidden; }
  .bar i { display: block; height: 100%; border-radius: 9px; }
  .rbest { font-weight: 800; color: #9b6a2a; margin: 6px 0 2px; }

  /* 小卡（介紹） */
  #fact { pointer-events: none; align-items: flex-end; justify-content: center; padding: 8px; background: transparent; }
  #fact .card { pointer-events: auto; width: min(96vw, 460px); max-height: 56%; }
  @media (orientation: landscape) {
    #fact { align-items: stretch; justify-content: flex-end; padding: 64px 8px 8px 8px; }
    #fact .card { width: min(47vw, 430px); max-height: none; height: 100%; }
  }
  .fhead { display: flex; align-items: center; justify-content: space-between; gap: 8px; text-align: left; }
  .fname { font-size: 27px; font-weight: 900; color: #7a3f14; line-height: 1.1; }
  .fen { font-size: 14px; color: #9b7a5a; font-weight: 700; font-style: italic; }
  .badge { flex: none; font-size: 14px; font-weight: 900; color: #fff; border-radius: 999px; padding: 4px 11px; background: #46b864; }
  .badge.no { background: #e8692d; }
  .fcmp { display: block; width: 100%; height: 78px; margin: 6px 0 2px; }
  .frows { text-align: left; font-size: 15px; color: #4a3324; font-weight: 700; }
  .frow { display: flex; gap: 8px; padding: 4px 0; border-bottom: 2px dashed #f0dcc0; }
  .frow b { flex: none; color: #fff; background: #c98a4b; border-radius: 8px; padding: 0 7px; font-size: 14px; height: 22px; line-height: 22px; }
  .fnote { display: none; text-align: left; margin-top: 8px; background: #fff0e3; border: 3px solid #ffc89a; border-radius: 14px; padding: 7px 10px; font-weight: 800; color: #a14a12; font-size: 15px; }
  .ffact { text-align: left; margin-top: 8px; background: #eef8ff; border: 3px solid #bfe2fb; border-radius: 14px; padding: 7px 10px; font-weight: 700; color: #2f5170; font-size: 15px; }
  .ffact b { display: block; color: #2b77b8; }

  /* 博物館下方按鈕 */
  #hallUi { top: auto; height: auto; justify-content: center; gap: 10px; padding: 8px 10px calc(10px + env(safe-area-inset-bottom)); pointer-events: none; }
  #hallUi button { pointer-events: auto; }

  /* 小百科 */
  .bintro { max-width: 900px; margin: 0 auto 12px; display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 10px; }
  .bbox { background: #fff; border-radius: 18px; padding: 10px 12px; border: 3px solid #f0dcc0; font-size: 15px; color: #4a3324; font-weight: 700; }
  .bbox h3 { margin: 0 0 4px; color: #b5541c; font-size: 18px; }
  .tline { display: flex; gap: 4px; margin-top: 6px; }
  .tline div { flex: 1; border-radius: 10px; padding: 4px; text-align: center; font-size: 13px; color: #fff; font-weight: 900; }
  .blist { max-width: 900px; margin: 0 auto; display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 10px; }
  .bent { background: #fff; border-radius: 18px; padding: 8px 10px 10px; border: 3px solid #f0dcc0; display: flex; gap: 10px; align-items: flex-start; }
  .bent canvas { flex: none; width: 110px; height: 80px; background: #fbf1df; border-radius: 12px; }
  .bent .bt { flex: 1; min-width: 0; font-size: 14px; font-weight: 700; color: #4a3324; }
  .bent .bn { font-size: 19px; font-weight: 900; color: #7a3f14; }
  .bent .bn small { font-size: 12px; color: #9b7a5a; font-style: italic; font-weight: 700; margin-left: 4px; }
  .bent .bk { display: inline-block; font-size: 12px; color: #fff; border-radius: 999px; padding: 0 8px; background: #46b864; margin: 2px 0; }
  .bent .bk.no { background: #e8692d; }
  .bent .bk.lk { background: #a99a86; }
  .bent button { margin-top: 4px; font: 800 13px var(--kg-font); border: 2px solid #bfe2fb; background: #eef8ff; color: #2b77b8; border-radius: 999px; padding: 3px 10px; cursor: pointer; }
</style>
</head>
<body>
<canvas id="game" tabindex="0" aria-label="恐龍化石挖挖挖：用工具挖出化石、拼回骨架的學習遊戲"></canvas>

<div id="title" class="scr">
  <div class="tbox">
    <h1 class="logo">恐龍化石<br><span>挖挖挖</span></h1>
    <p class="tsub">拿起工具挖化石，拼回骨架，讓恐龍活過來！</p>
    <div class="tstat" id="tStat"></div>
    <div class="tbtns">
      <button class="kg-btn green big" id="bPlay">開始挖掘</button>
      <div class="row"><button class="kg-btn yellow" id="bHall">我的博物館</button><button class="kg-btn blue" id="bBook">恐龍小百科</button></div>
      <div class="row"><button class="tog" id="tMusic"></button><button class="tog" id="tSfx"></button></div>
    </div>
  </div>
</div>

<div id="sites" class="scr panel">
  <div class="phead"><h2>選擇挖掘地點</h2><p>點一隻想挖的化石，開始挖！</p></div>
  <div class="pbody"><div class="sites" id="siteList"></div></div>
  <div class="pfoot"><button class="kg-btn blue" id="sBack">回標題</button><button class="kg-btn yellow" id="sHall">我的博物館</button></div>
</div>

<div id="book" class="scr panel">
  <div class="phead"><h2>恐龍小百科</h2><p>挖到化石、拼好骨架，就能看到完整介紹</p></div>
  <div class="pbody" id="bookBody"></div>
  <div class="pfoot"><button class="kg-btn blue" id="kBack">回去</button></div>
</div>

<div id="pause" class="scr modal">
  <div class="card">
    <div class="cbody"><h2>休息一下</h2><div class="row"><button class="tog" id="pMusic"></button><button class="tog" id="pSfx"></button></div></div>
    <div class="cfoot"><button class="kg-btn green" id="pResume">繼續</button><button class="kg-btn yellow" id="pRestart">重新挖</button><button class="kg-btn blue" id="pMenu">回選單</button></div>
  </div>
</div>

<div id="result" class="scr modal">
  <div class="card">
    <div class="cbody"><h2 id="rTitle"></h2><div class="rstars" id="rStars"></div><div class="rmsg" id="rMsg"></div><div class="rbones" id="rBones"></div><div class="rbest" id="rBest"></div></div>
    <div class="cfoot"><button class="kg-btn green" id="rLab">去實驗室拼骨架</button><button class="kg-btn yellow small" id="rAgain">重新挖</button></div>
  </div>
</div>

<div id="fact" class="scr">
  <div class="card">
    <div class="cbody">
      <div class="fhead"><div><div class="fname" id="fName"></div><div class="fen" id="fEn"></div></div><div class="badge" id="fBadge"></div></div>
      <canvas class="fcmp" id="fCmp"></canvas>
      <div class="frows">
        <div class="frow"><b>時代</b><span id="fEra"></span></div>
        <div class="frow"><b>食物</b><span id="fDiet"></span></div>
        <div class="frow"><b>大小</b><span id="fSize"></span></div>
      </div>
      <div class="fnote" id="fNot"></div>
      <div class="ffact"><b>小知識</b><span id="fFact"></span></div>
    </div>
    <div class="cfoot"><button class="kg-btn blue small" id="fSay">再聽一次</button><button class="kg-btn green" id="fGo">放進博物館</button></div>
  </div>
</div>

<div id="hallUi" class="scr"><button class="kg-btn blue" id="hBack">回選單</button><button class="kg-btn yellow" id="hBook">恐龍小百科</button></div>

<script src="../../assets/common.js"></script>
<script src="../../assets/kg-music.js"></script>
<script>
'use strict';
/* =====================================================================
 * 恐龍化石挖挖挖：在不同的挖掘地點用鏟子、刷子、小鎚、掃描器挖出化石，
 * 到博物館實驗室把骨頭拼回骨架，恐龍就會活過來介紹自己。
 * ===================================================================== */
(function () {
const SLUG = 'dino-dig';
const $ = (id) => document.getElementById(id);
const cv = $('game');
const ctx = cv.getContext('2d');
const FONT = '"PingFang TC","Noto Sans TC","Microsoft JhengHei","Heiti TC",system-ui,sans-serif';
const TAU = Math.PI * 2;
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const lerp = (a, b, t) => a + (b - a) * t;
const rnd = (a, b) => a + Math.random() * (b - a);
const easeOut = (t) => 1 - Math.pow(1 - t, 3);
const easeBack = (t) => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); };
function seeded(seed) { let a = seed >>> 0; return () => { a = (a + 0x6D2B79F5) >>> 0; let t = a; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
let W = 360, H = 640, DPR = 1, T = 0, layoutDirty = true;

const Save = { get: (k, d) => KG.store.get(SLUG + ':' + k, d), set: (k, v) => KG.store.set(SLUG + ':' + k, v) };
let prog = Save.get('prog', {}) || {};
function saveProg() { Save.set('prog', prog); }
const P_ = (id) => prog[id] || {};

/* =====================================================================
 * 聲音：探險音樂（C 小調／降 E 大調）、博物館音樂（降 B 大調）、音效
 * ===================================================================== */
let sfxOn = Save.get('sfx', true) !== false;
const lastSfx = {};
function sfx(name, o, gap) {
  if (!sfxOn || !KG.sfx) return;
  const now = performance.now();
  if (lastSfx[name] && now - lastSfx[name] < (gap || 40)) return;
  lastSfx[name] = now;
  try { KG.sfx.play(name, o); } catch (e) { /* 忽略 */ }
}
const vary = (k) => 1 + (Math.random() * 2 - 1) * (k || 0.045);
function panOf(x) { return clamp((x / W) * 2 - 1, -1, 1) * 0.6; }

if (KG.sfx) {
  const D = KG.sfx.define;
  D('scoop', (p, s) => {
    s.noise(0.17, { vol: 0.24, freq: 900 * p, sweep: 320 * p, q: 1.1 });
    s.noise(0.06, { vol: 0.1, freq: 2600 * p, q: 0.8, type: 'highpass' });
    s.tone(130 * p, 0.11, { vol: 0.15, slide: 70 });
  });
  D('crunchWarn', (p, s) => {
    [0, 0.035, 0.08].forEach((d, i) => s.noise(0.035, { vol: 0.16 - i * 0.03, freq: 2300 * p * (1 + i * 0.15), q: 4, delay: d }));
    s.tone(340 * p, 0.07, { type: 'triangle', vol: 0.08, slide: 260 * p });
  });
  D('touchBone', (p, s) => {
    s.tone(520 * p, 0.09, { type: 'triangle', vol: 0.14, slide: 430 * p });
    s.noise(0.04, { vol: 0.12, freq: 2000 * p, q: 3 });
  });
  D('boneCrack', (p, s) => {
    s.noise(0.1, { vol: 0.28, freq: 1700 * p, q: 2 });
    s.tone(600 * p, 0.12, { type: 'square', vol: 0.035, slide: 200 * p });
    [0.05, 0.09, 0.14].forEach((d) => s.noise(0.025, { vol: 0.12, freq: 3200 * p, q: 5, delay: d }));
    s.tone(160 * p, 0.12, { vol: 0.16, slide: 80 });
  });
  D('clink', (p, s) => {
    s.tone(2100 * p, 0.14, { vol: 0.08 }); s.tone(3170 * p, 0.09, { vol: 0.045 }); s.tone(4630 * p, 0.05, { vol: 0.025 });
    s.noise(0.03, { vol: 0.12, freq: 6000, q: 0.8, type: 'highpass' });
    s.tone(190 * p, 0.08, { vol: 0.14, slide: 90 });
  });
  D('rockBreak', (p, s) => {
    s.noise(0.38, { vol: 0.3, freq: 1300 * p, sweep: 160, type: 'lowpass', q: 0.8 });
    s.tone(95 * p, 0.3, { vol: 0.24, slide: 42 });
    for (let i = 0; i < 5; i++) s.noise(0.03, { vol: 0.12, freq: 1800 + i * 500, q: 4, delay: 0.04 + i * 0.045 + Math.random() * 0.02 });
  });
  D('iceBreak', (p, s) => {
    s.noise(0.3, { vol: 0.2, freq: 4200 * p, sweep: 1500, q: 1.2 });
    for (let i = 0; i < 6; i++) s.tone((2400 + i * 380) * p, 0.09, { vol: 0.04, delay: i * 0.035 });
    s.tone(140 * p, 0.18, { vol: 0.15, slide: 60 });
  });
  D('thudSoft', (p, s) => { s.noise(0.09, { vol: 0.2, freq: 420 * p, type: 'lowpass' }); s.tone(150 * p, 0.1, { vol: 0.2, slide: 65 }); });
  D('clank', (p, s) => {
    s.tone(880 * p, 0.12, { type: 'triangle', vol: 0.1, slide: 760 * p }); s.tone(1390 * p, 0.08, { vol: 0.05 });
    s.noise(0.05, { vol: 0.12, freq: 3000, q: 2 });
  });
  D('scan', (p, s) => { s.tone(1480 * p, 0.055, { type: 'square', vol: 0.035 }); s.tone(2960 * p, 0.04, { vol: 0.02 }); });
  D('scanOn', (p, s) => { s.tone(700 * p, 0.18, { type: 'triangle', vol: 0.08, slide: 1500 * p }); });
  D('empty', (p, s) => { s.tone(420 * p, 0.14, { type: 'triangle', vol: 0.09, slide: 210 * p }); s.tone(300 * p, 0.16, { type: 'triangle', vol: 0.07, delay: 0.12, slide: 160 * p }); });
  D('reveal', (p, s) => { s.tone(784 * p, 0.35, { vol: 0.11 }); s.tone(1175 * p, 0.45, { vol: 0.09, delay: 0.08 }); s.tone(1568 * p, 0.3, { vol: 0.035, delay: 0.08 }); });
  D('collect', (p, s) => {
    [622, 784, 932, 1245].forEach((f, i) => s.tone(f * p, 0.3, { vol: 0.1, delay: i * 0.06 }));
    s.noise(0.08, { vol: 0.04, freq: 7000, type: 'highpass', delay: 0.2 });
  });
  D('snapBone', (p, s) => { s.noise(0.03, { vol: 0.26, freq: 3300 * p, q: 2 }); s.tone(230 * p, 0.1, { vol: 0.22, slide: 120 * p }); s.tone(1250 * p, 0.06, { vol: 0.06, delay: 0.02 }); });
  D('pickBone', (p, s) => { s.tone(480 * p, 0.08, { type: 'triangle', vol: 0.12, slide: 720 * p }); });
  D('nope', (p, s) => { s.tone(330 * p, 0.12, { type: 'triangle', vol: 0.12, slide: 250 * p }); s.tone(262 * p, 0.16, { type: 'triangle', vol: 0.1, delay: 0.1, slide: 220 * p }); });

    const p = dig.ptr;
    if (dig.tool === 'shovel' && dig.time - dig.lastScoopT > 0.2) scoop(p.px, p.py);
    if (dig.tool === 'hammer') { dig.hamT -= dt; if (dig.hamT <= 0) { strike(p.px, p.py); dig.hamT = 0.34; } }

  // 掃描器

    if (dig.battery <= 0) { dig.battery = 0; dig.scanning = false; sfx('empty'); setMsg('掃描器沒電了，等一下會自己充電。', 2.4, '#8a4a12'); }
  } else dig.battery = Math.min(1, dig.battery + dt * 0.1);

    const on = dig.active && dig.tool === 'brush' && sfxOn && !paused && scene === 'dig';

  updateParts(g);
  if (scene === 'dig') { if (!paused) updateDig(dt); }
  else if (scene === 'lab') { if (!paused) updateLab(dt); }
  else if (scene === 'hall') updateHall(dt);
  else updateTitle(dt);
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  if (scene === 'dig') drawDig(ctx);
  else if (scene === 'lab') drawLab(ctx);
  else if (scene === 'hall') drawHall(ctx);
  else drawTitleScene(ctx);
}
function ptr(e) { const r = cv.getBoundingClientRect(); return [(e.clientX - r.left) * W / r.width, (e.clientY - r.top) * H / r.height]; }
let downId = null;
cv.addEventListener('pointerdown', (e) => {
  if (paused) return;
  const [x, y] = ptr(e); downId = e.pointerId;
  try { cv.setPointerCapture(e.pointerId); } catch (er) { /* 忽略 */ }
  if (scene === 'dig') digDown(x, y, e);
  else if (scene === 'lab') labDown(x, y, e);
  else if (scene === 'hall') hallDown(x, y);
  else if (scene === 'title') { if (y > H * 0.62) { title.A1.roarT = 0; roar(SP.trex, x, 0.6); } }
  e.preventDefault();
});
cv.addEventListener('pointermove', (e) => {
  const [x, y] = ptr(e);
  if (scene === 'dig' && !paused) { if (e.pointerType === 'mouse' || downId === e.pointerId) digMove(x, y, e); }
  else if (scene === 'lab' && downId === e.pointerId) labMove(x, y);
  else if (scene === 'hall' && downId === e.pointerId) hallMove(x, y);
});
function ptrUp(e) {
  if (downId !== e.pointerId) return;
  downId = null;
  const [x, y] = ptr(e);
  if (scene === 'dig') digUp();
  else if (scene === 'lab') labUp(x, y);
  else if (scene === 'hall') hallUp(x, y);
}
cv.addEventListener('pointerup', ptrUp);
cv.addEventListener('pointercancel', ptrUp);
cv.addEventListener('pointerleave', (e) => { if (e.pointerType === 'mouse' && scene === 'dig' && dig.ptr && !dig.active) dig.ptr = null; });
cv.addEventListener('wheel', (e) => { if (scene === 'hall') { hallWheel(e.deltaY); e.preventDefault(); } }, { passive: false });
window.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' || e.key === 'p' || e.key === 'P') {
    if (ovOn('pause')) resumeGame(); else if (ovOn('fact') && factFrom !== 'lab') closeFact(); else pauseGame();
    return;
  }
  if (scene === 'dig' && !paused) { const t = TOOLS.find((q) => q.key === e.key); if (t) selectTool(t.id); }
  if (scene === 'title' && e.key === 'Enter' && document.activeElement === document.body) goSites();
});
document.addEventListener('visibilitychange', () => {
  if (document.hidden) { pauseGame(); stopSpeak(); if (brushLoop) brushLoop.set(0, 0); }
});
const on = (id, fn) => $(id).addEventListener('click', fn);
on('bPlay', () => { sfx('select'); goSites(); });
on('bHall', () => { sfx('select'); openHall(null); });
on('bBook', () => { sfx('select'); openBook('title'); });
on('tMusic', toggleMusic); on('tSfx', toggleSfx); on('pMusic', toggleMusic); on('pSfx', toggleSfx);
on('sBack', () => { sfx('back'); goTitle(); });
on('sHall', () => { sfx('select'); openHall(null); });
on('kBack', () => { sfx('back'); if (bookFrom === 'hall') openHall(null); else goTitle(); });
on('pResume', resumeGame);
on('pRestart', () => { sfx('select'); setOv('pause', false); paused = false; startDig(dig.sp.id); });
on('pMenu', () => { sfx('back'); setOv('pause', false); paused = false; goSites(); });
on('rLab', () => { sfx('select'); setOv('result', false); startLab(dig.sp.id); });
on('rAgain', () => { sfx('select'); setOv('result', false); startDig(dig.sp.id); });
on('fSay', () => { sfx('ui'); if (factSp) speakFact(factSp); });
on('fGo', closeFact);
on('hBack', () => { sfx('back'); goSites(); });
on('hBook', () => { sfx('select'); openBook('hall'); });
// 第一次點擊後開始播音樂（引擎會等使用者操作）
resize();
goTitle();
requestAnimationFrame(frame);

/* 測試用掛鉤 */
window.__dd = {
  state: () => ({ scene, paused, tool: dig.tool, music: KG.music ? KG.music.isPlaying() : null, done: dig.done, battery: dig.battery,
    bones: dig.bones.map((bo) => ({ n: bo.b.n, state: bo.state, hp: Math.round(bo.hp), frac: +(bo.exposed / bo.total).toFixed(3), x: bo.x, y: bo.y, sx: pit.x + bo.x * pit.s, sy: pit.y + bo.y * pit.s })),
    rocks: dig.rocks.map((rk) => ({ alive: rk.alive, hp: rk.hp, sx: pit.x + rk.x * pit.s, sy: pit.y + rk.y * pit.s })),
    pit: { x: pit.x, y: pit.y, S: pit.S, s: pit.s }, tbar: tbar.map((b) => ({ id: b.id, x: b.x + b.w / 2, y: b.y + b.h / 2 })),
    lab: { state: lab.state, placed: lab.placed, pieces: lab.pieces.map((pc) => { const s = slotOf(pc); return { id: pc.b.id, placed: pc.placed, x: pc.x, y: pc.y, sx: s[0], sy: s[1] }; }) },
    hallMax: hall.max, fact: ovOn('fact'), result: ovOn('result') }),
  start: (id) => startDig(id), lab: (id) => startLab(id), hall: () => openHall(null),
  exposeAll: (except) => { dig.bones.forEach((bo, i) => { if (i === except) return; bo.cells.forEach((idx) => { if (dig.soil[idx] >= EXP) { dig.soil[idx] = 0; bo.exposed++; } }); touched.add(bo); }); markDirty(0, 0, G - 1, G - 1); checkTouched(); },
  clearSoil: () => { dig.soil.fill(0); dig.bones.forEach((bo) => { bo.exposed = bo.total; }); markDirty(0, 0, G - 1, G - 1); },
  unlockAll: () => { Save.set('unlockAll', true); },
  setProg: (p) => { prog = p; saveProg(); }
};
})();
