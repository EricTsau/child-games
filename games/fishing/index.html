      document.body.appendChild(d);
    }
    const f = on ? 'url(#gkStarG)' : '#d9d2dc', s = on ? '#d9822b' : '#b9afbf';
    return '<svg viewBox="0 0 100 100">' +
      '<path d="M50 9 61 36 90 38 67 57 75 86 50 70 25 86 33 57 10 38 39 36Z" fill="rgba(0,0,0,.12)" transform="translate(0 5)"/>' +
      '<path d="M50 9 61 36 90 38 67 57 75 86 50 70 25 86 33 57 10 38 39 36Z" fill="' + f + '" stroke="' + s + '" stroke-width="6" stroke-linejoin="round"/>' +
      (on ? '<ellipse cx="40" cy="34" rx="8" ry="4.5" fill="#fff" opacity=".7" transform="rotate(-35 40 34)"/>' : '') + '</svg>';
  }
  const LOCK_SVG = '<svg viewBox="0 0 100 100"><rect x="20" y="44" width="60" height="46" rx="12" fill="#8d7c96" stroke="#5f4f68" stroke-width="5"/><path d="M33 46V34a17 17 0 0 1 34 0v12" fill="none" stroke="#5f4f68" stroke-width="9" stroke-linecap="round"/><circle cx="50" cy="66" r="7" fill="#5f4f68"/></svg>';

  /** 高解析度畫布 */
  function hiDPI(cv) {
    const ctx = cv.getContext('2d');
    const o = { ctx, W: 0, H: 0, DPR: 1 };
    o.fit = (w, h) => {
      o.DPR = Math.min(window.devicePixelRatio || 1, 2.5);
      o.W = w; o.H = h;
      cv.width = Math.round(w * o.DPR); cv.height = Math.round(h * o.DPR);
      ctx.setTransform(o.DPR, 0, 0, o.DPR, 0, 0);
    };
    return o;
  }

  /** 防止頁面捲動（選關畫面可以捲） */
  document.addEventListener('touchmove', e => { if (!e.target.closest || !e.target.closest('.lv-scr')) e.preventDefault(); }, { passive: false });
  document.addEventListener('gesturestart', e => e.preventDefault());
  document.addEventListener('dblclick', e => e.preventDefault());

  /**
   * 標題、選關、結算畫面。
   * UI.init({ slug, title, subtitle, levels:[{label, colors}], items:[{name, need}], drawMascot(c,w,h,t), drawItem(c,i,w,h), onPlay(i), onItem(i), onMenu(), music })
   */
  const UI = {
    o: null, save: null, artT: 0, artRaf: 0, current: 0, bannerTimer: 0,
    init(o) {
      this.o = o;
      this.save = KG.store.get(o.slug + ':save', null) || { stars: [], item: 0 };
      if (!Array.isArray(this.save.stars)) this.save.stars = [];
      const mk = (cls, html) => { const d = document.createElement('div'); d.className = cls; d.innerHTML = html; document.body.appendChild(d); return d; };
      this.title = mk('scr title-scr',
        '<div class="title-wrap"><canvas class="title-art"></canvas><h1 class="logo">' + [...o.title].map((ch, i) => '<span style="animation-delay:' + (i * 0.12) + 's">' + ch + '</span>').join('') + '</h1>' +
        '<div class="subtitle">' + o.subtitle + '</div><button class="big-btn">開始</button></div>');
      this.lv = mk('scr lv-scr', '<div class="lv-head"><h2>選擇關卡</h2><div class="star-count"></div></div><div class="lv-grid"></div>' +
        (o.items && o.items.length ? '<div class="col-head">' + (o.itemsTitle || '收藏') + '</div><div class="col-row"></div>' : '') +
        '<button class="scr-btn alt lv-back">回標題</button>');
      this.res = mk('scr res-scr', '<div class="res-card"><div class="res-ribbon"></div><div class="res-stars"></div><div class="res-msg"></div><div class="res-unlock"></div><div class="res-btns"></div></div>');
      this.ban = mk('gk-banner', '<div class="t1"></div><div class="t2"></div>');
      this.title.querySelector('.big-btn').addEventListener('click', () => {
        KG.sound('pop');
        if (!this.save.started) { this.save.started = 1; this.persist(); this.play(0); }
        else this.showLevels();
      });
      this.lv.querySelector('.lv-back').addEventListener('click', () => { KG.sound('click'); this.showTitle(); });
      this.artCv = hiDPI(this.title.querySelector('.title-art'));
    },
    persist() { KG.store.set(this.o.slug + ':save', this.save); },
    total() { return this.save.stars.reduce((a, b) => a + (b || 0), 0); },
    stars(i) { return this.save.stars[i] || 0; },
    unlocked(i) { return i === 0 || this.stars(i - 1) > 0; },
    itemUnlocked(i) { return this.total() >= this.o.items[i].need; },
    item() { const i = this.save.item || 0; return this.o.items && this.o.items[i] && this.itemUnlocked(i) ? i : 0; },
    hideAll() { [this.title, this.lv, this.res].forEach(s => s.classList.remove('show')); cancelAnimationFrame(this.artRaf); this.artRaf = 0; },
    banner(t1, t2, dur) {
      const b = this.ban;
      b.querySelector('.t1').textContent = t1;
      const s2 = b.querySelector('.t2'); s2.textContent = t2 || ''; s2.style.display = t2 ? '' : 'none';
      b.classList.remove('show'); void b.offsetWidth; b.classList.add('show');
      clearTimeout(this.bannerTimer);
      this.bannerTimer = setTimeout(() => b.classList.remove('show'), (dur || 2) * 1000);
    },
    hideBanner() { clearTimeout(this.bannerTimer); this.ban.classList.remove('show'); },
    showTitle() {
      this.hideAll(); this.hideBanner();
      this.title.classList.add('show');
      if (this.o.music) Music.start(this.o.music);
      const r = this.title.querySelector('.title-art').getBoundingClientRect();
      this.artCv.fit(r.width || 260, r.height || 200);
      let last = performance.now();
      const loop = now => {
        this.artT += Math.min(0.05, (now - last) / 1000); last = now;
        const a = this.artCv;
        a.ctx.setTransform(a.DPR, 0, 0, a.DPR, 0, 0);
        a.ctx.clearRect(0, 0, a.W, a.H);
        this.o.drawMascot(a.ctx, a.W, a.H, this.artT);
        this.artRaf = requestAnimationFrame(loop);
      };
      this.artRaf = requestAnimationFrame(loop);
      if (this.o.onMenu) this.o.onMenu();
    },
    showLevels() {
      this.hideAll(); this.hideBanner();
      if (this.o.music && !Music.song) Music.start(this.o.music);
      const total = this.total(), max = this.o.levels.length * 3;
      this.lv.querySelector('.star-count').innerHTML = starSVG(true) + total + ' / ' + max;
      const grid = this.lv.querySelector('.lv-grid');
      grid.innerHTML = '';
      let nextShown = false;
      this.o.levels.forEach((L, i) => {
        const b = document.createElement('button');
        const open = this.unlocked(i), st = this.stars(i);
        b.className = 'lv-card' + (open ? '' : ' locked');
        if (open && !st && !nextShown) { b.classList.add('next'); nextShown = true; }
        b.style.animationDelay = (i * 0.04) + 's';
        if (L.colors) { b.style.setProperty('--c1', L.colors[0]); b.style.setProperty('--c2', L.colors[1]); b.style.setProperty('--c3', L.colors[2]); }
        b.innerHTML = open
          ? '<div class="n">' + (i + 1) + '</div><div class="lb">' + (L.label || '') + '</div><div class="st">' + [0, 1, 2].map(k => starSVG(k < st)).join('') + '</div>'
          : '<div class="n" style="width:44px;height:44px">' + LOCK_SVG + '</div><div class="lb">' + (L.label || '') + '</div>';
        b.addEventListener('click', () => {
          if (!open) { KG.sound('wrong'); b.classList.remove('kg-shake'); void b.offsetWidth; b.classList.add('kg-shake'); KG.toast('先過前一關喔！'); return; }
          KG.sound('pop'); this.play(i);
        });
        grid.appendChild(b);
      });
      const row = this.lv.querySelector('.col-row');
      if (row) {
        row.innerHTML = '';
        this.o.items.forEach((it, i) => {
          const d = document.createElement('button');
          const ok = this.itemUnlocked(i);
          d.className = 'col-item' + (ok ? '' : ' locked') + (this.item() === i ? ' sel' : '');
          d.innerHTML = '<canvas></canvas><div class="nm">' + (ok ? it.name : '？？？') + '</div>' + (ok ? '' : '<div class="lock">' + starSVG(true) + it.need + '</div>');
          row.appendChild(d);
          const h = hiDPI(d.querySelector('canvas'));
          h.fit(80, 64);
          this.o.drawItem(h.ctx, i, 80, 64);
          d.addEventListener('click', () => {
            if (!ok) { KG.sound('wrong'); KG.toast('還需要 ' + (it.need - total) + ' 顆星星'); return; }
            KG.sound('sparkle');
            this.save.item = i; this.persist();
            row.querySelectorAll('.col-item').forEach(x => x.classList.remove('sel'));
            d.classList.add('sel');
            if (this.o.onItem) this.o.onItem(i);
          });
        });
      }
      this.lv.classList.add('show');
      this.lv.scrollTop = 0;
      if (this.o.onMenu) this.o.onMenu();
    },
    play(i) {
      this.hideAll(); this.hideBanner();
      this.current = i;
      if (this.o.music) Music.start(this.o.music);
      this.o.onPlay(i);
    },
    /** 結算：o = { stars 1–3, title, msg } */
    result(o) {
      Music.stop();
      this.hideBanner();
      const i = this.current;
      const itemsBefore = (this.o.items || []).map((_, k) => this.itemUnlocked(k));
      if ((o.stars || 0) > this.stars(i)) { this.save.stars[i] = o.stars; this.persist(); }
      const newItem = (this.o.items || []).findIndex((_, k) => !itemsBefore[k] && this.itemUnlocked(k));
      this.hideAll();
      const r = this.res;
      r.querySelector('.res-ribbon').textContent = o.title || (o.stars >= 3 ? '太完美了！' : o.stars === 2 ? '好棒喔！' : '過關了！');
      r.querySelector('.res-stars').innerHTML = [0, 1, 2].map(k => starSVG(k < o.stars)).join('');
      [...r.querySelectorAll('.res-stars svg')].forEach((s, k) => { s.style.animationDelay = (0.35 + k * 0.28) + 's'; });
      for (let k = 0; k < o.stars; k++) setTimeout(() => Jingle.star(k), 380 + k * 280);
      r.querySelector('.res-msg').innerHTML = o.msg || '';
      const un = r.querySelector('.res-unlock');
      un.className = 'res-unlock';
      un.innerHTML = '';
      if (newItem >= 0) {
        un.innerHTML = '<canvas></canvas><span>解鎖了新' + (this.o.itemWord || '造型') + '：' + this.o.items[newItem].name + '！</span>';
        un.classList.add('show');
        const h = hiDPI(un.querySelector('canvas')); h.fit(60, 48);
        this.o.drawItem(h.ctx, newItem, 60, 48);
        setTimeout(() => Jingle.unlock(), 1000);
      }
      const btns = r.querySelector('.res-btns');
      btns.innerHTML = '';
      const add = (txt, cls, fn) => { const b = document.createElement('button'); b.className = 'scr-btn ' + cls; b.textContent = txt; b.addEventListener('click', () => { KG.sound('click'); fn(); }); btns.appendChild(b); };
      if (i + 1 < this.o.levels.length) add('下一關 ▶', 'go', () => this.play(i + 1));
      add('再玩一次', 'warm', () => this.play(i));
      add('選關卡', 'alt', () => this.showLevels());
      r.classList.add('show');
      Jingle.win();
      setTimeout(() => KG.confetti(innerWidth / 2, innerHeight * 0.3, 90), 300);
    }
  };
  /* ===================== 套件結束 ===================== */

  const cv = document.getElementById('sea');
  const view = hiDPI(cv);
  const ctx = view.ctx;
  const hud = document.getElementById('hud');
  const hudT = document.getElementById('hudT');
  const hudTs = hudT.querySelector('span');
  const hudS = document.getElementById('hudS');
  const barFill = document.getElementById('barFill');
  const barStar = document.getElementById('barStar');
  const banner = document.getElementById('banner');
  const tipEl = document.getElementById('tip');
  const FONT = getComputedStyle(document.body).fontFamily || 'sans-serif';
  const ROUND_TIME = 60;

  /* ---------- 資料 ---------- */
  // pts 分數、s 大小、depth 出現深度（0 水面～1 海底）、speed 速度、w 出現機率
  const TYPES = {
    clown: { name: '小丑魚', pts: 10, s: 48, depth: [0.05, 0.45], speed: 60, w: 4 },
    blue: { name: '藍藍魚', pts: 20, s: 56, depth: [0.25, 0.7], speed: 75, w: 3 },
    puffer: { name: '河豚', pts: 30, s: 50, depth: [0.4, 0.85], speed: 40, w: 2 },
    gold: { name: '黃金魚', pts: 50, s: 46, depth: [0.6, 0.92], speed: 110, w: 1 }
  };
  const THEMES = {
    day: { sky: ['#6cc4ff', '#dff4ff'], water: ['#5fd3f3', '#2f9bd8', '#165a99'], sun: '#ffd65c', sand: ['#f6e0a4', '#dcb56a'], rock: 'rgba(20,70,120,.35)' },
    reef: { sky: ['#5ad1e8', '#e0fbff'], water: ['#62e6e0', '#22aacb', '#0f6d93'], sun: '#ffe066', sand: ['#fde9b8', '#e9c27c'], rock: 'rgba(10,90,110,.35)' },
    sunset: { sky: ['#ff9a8b', '#ffd59e'], water: ['#ffb38a', '#7a6bd6', '#30307a'], sun: '#ff7a59', sand: ['#f3cfa0', '#c99560'], rock: 'rgba(60,40,110,.4)' },
    night: { sky: ['#1b1f4b', '#4a4590'], water: ['#3b4fa8', '#1d2a6e', '#0b1238'], sun: '#fff6c8', sand: ['#8a86b8', '#5a568a'], rock: 'rgba(5,10,40,.5)', night: true }
  };
  const LEVELS = [
    { label: '小海灣', theme: 'day', target: 120, types: ['clown', 'blue'], boots: 0, jelly: 0, intro: '把小魚釣上來吧！', colors: ['#9ad8ff', '#3a9ee8', '#2672ad'] },
    { label: '河豚來了', theme: 'day', target: 160, types: ['clown', 'blue', 'puffer'], boots: 2, jelly: 0, intro: '圓圓河豚 30 分，小心舊靴子', colors: ['#9ad8ff', '#3a9ee8', '#2672ad'] },
    { label: '珊瑚礁', theme: 'reef', target: 220, types: ['clown', 'blue', 'puffer', 'gold'], boots: 1, jelly: 0, intro: '閃亮亮的黃金魚 50 分！', colors: ['#8fefe0', '#22b0b0', '#147a7a'] },
    { label: '水母區', theme: 'reef', target: 220, types: ['clown', 'blue', 'puffer', 'gold'], boots: 1, jelly: 2, intro: '小心水母，會電電喔！', colors: ['#8fefe0', '#22b0b0', '#147a7a'] },
    { label: '海龜灣', theme: 'sunset', target: 260, types: ['clown', 'blue', 'puffer', 'gold'], boots: 1, jelly: 1, turtle: true, intro: '大海龜游過來了 80 分！', colors: ['#ffc09a', '#ff7a59', '#c4502f'] },
    { label: '海底寶藏', theme: 'sunset', target: 300, types: ['clown', 'blue', 'puffer', 'gold'], boots: 1, jelly: 2, chest: true, intro: '海底有寶箱 100 分！', colors: ['#ffc09a', '#ff7a59', '#c4502f'] },
    { label: '星光夜', theme: 'night', target: 300, types: ['clown', 'blue', 'puffer', 'gold'], boots: 1, jelly: 3, turtle: true, intro: '晚上的海，魚兒會發光！', colors: ['#b7a6ff', '#6b5ad6', '#46389e'] },
    { label: '深海挑戰', theme: 'night', target: 360, types: ['clown', 'blue', 'puffer', 'gold'], boots: 2, jelly: 3, turtle: true, chest: true, intro: '釣魚大師挑戰！', colors: ['#b7a6ff', '#6b5ad6', '#46389e'] }
  ];
  // 收藏：小貓的船和帽子
  const SKINS = [
    { name: '草帽小貓', need: 0, boat: ['#ff8a8a', '#d94a5a'], hat: 'straw', fur: ['#ffd29a', '#ffa94d'] },
    { name: '水手小貓', need: 4, boat: ['#8fd2ff', '#2a6fe0'], hat: 'sailor', fur: ['#f2f2f2', '#c9c9d6'] },
    { name: '海盜小貓', need: 9, boat: ['#8a6a5a', '#4a3530'], hat: 'pirate', fur: ['#c9c2cf', '#8f8698'] },
    { name: '公主小貓', need: 15, boat: ['#ffc2dc', '#ff7aa2'], hat: 'crown', fur: ['#fff2e0', '#ffcf9f'] },
    { name: '黃金船長', need: 21, boat: ['#fff2a8', '#f2b51c'], hat: 'captain', fur: ['#ffd29a', '#ff9f3d'] }
  ];
  const SONG = {
    bpm: 112, vol: 0.05,
    mel: [72, 0, 76, 79, 81, 79, 76, 0, 74, 0, 77, 81, 79, 77, 74, 0, 72, 0, 76, 79, 84, 83, 81, 79, 77, 76, 74, 76, 72, 0, 0, 0],
    bass: [48, 0, 55, 0, 53, 0, 57, 0, 50, 0, 57, 0, 55, 0, 47, 0, 48, 0, 55, 0, 53, 0, 52, 0, 50, 0, 55, 0, 48, 0, 43, 0]
  };

  /* ---------- 狀態 ---------- */
  let W = 0, H = 0, SC = 1, surfaceY = 0, floorY = 0;
  let seabed = document.createElement('canvas');
  let theme = THEMES.day, level = LEVELS[0], levelIndex = 0, skin = SKINS[0];
  let skyGrad = null, waterGrad = null;
  let fish = [], jellies = [], bubbles = [], weeds = [], clouds = [], skyStars = [], flyers = [];
  let boat = { x: 300, vx: 0 }, hook = { x: 0, y: 0, fish: null, stun: 0, wasIn: false };
  let holding = false, needRelease = false, pointerX = null, keyDir = 0, keyHold = false;
  let state = 'menu';          // menu / intro / play / end
  let score = 0, timeLeft = ROUND_TIME, catches = 0, streak = 0, bucketWob = 0, introT = 0, lastSec = -1;
  let time = 0;
  const cat = { mood: 'idle', moodT: 0, jump: 0 };

  /* ---------- 版面 ---------- */
  function resize() {
    W = innerWidth; H = innerHeight;
    view.fit(W, H);
    SC = clamp(Math.min(W, H) / 620, 0.72, 1.25);
    surfaceY = Math.max(200, H * 0.28);
    floorY = H - Math.max(56, H * 0.08);
    boat.x = clamp(boat.x, 90 * SC, W - 90 * SC);
    if (!hook.y) { hook.x = tipX(); hook.y = surfaceY + 20; }
    applyTheme();
    fish.forEach(f => { f.baseY = Math.min(f.baseY, floorY - 40); if (f.kind === 'boot' || f.kind === 'chest') f.y = f.baseY = floorY - 14 * SC; });
  }

  function applyTheme() {
    skyGrad = ctx.createLinearGradient(0, 0, 0, surfaceY);
    skyGrad.addColorStop(0, theme.sky[0]); skyGrad.addColorStop(1, theme.sky[1]);
    waterGrad = ctx.createLinearGradient(0, surfaceY, 0, H);
    waterGrad.addColorStop(0, theme.water[0]); waterGrad.addColorStop(0.45, theme.water[1]); waterGrad.addColorStop(1, theme.water[2]);
    buildSeabed();
    buildWeeds();
    clouds = [];
    for (let i = 0; i < 4; i++) clouds.push({ x: Math.random() * W, y: KG.rand(90, surfaceY - 60), s: KG.rand(0.45, 0.8), v: KG.rand(5, 14) });
    skyStars = [];
    for (let i = 0; i < 40; i++) skyStars.push({ x: Math.random() * W, y: Math.random() * (surfaceY - 20), r: KG.rand(0.8, 2.2), ph: Math.random() * 6 });
  }

  function buildSeabed() {
    seabed.width = cv.width; seabed.height = cv.height;
    const c = seabed.getContext('2d');
    c.setTransform(view.DPR, 0, 0, view.DPR, 0, 0);
    // 遠方岩石
    c.fillStyle = theme.rock;
    c.beginPath(); c.moveTo(0, floorY);
    for (let x = 0; x <= W; x += 30) c.lineTo(x, floorY - 46 - Math.sin(x / 110) * 28 - Math.sin(x / 47) * 10);
    c.lineTo(W, floorY); c.fill();
    // 沙地
    const g = c.createLinearGradient(0, floorY - 20, 0, H);
    g.addColorStop(0, theme.sand[0]); g.addColorStop(1, theme.sand[1]);
    c.fillStyle = g;
    c.beginPath(); c.moveTo(0, H);
    for (let x = 0; x <= W; x += 20) c.lineTo(x, floorY - Math.sin(x / 80) * 6 - Math.sin(x / 33) * 3);
    c.lineTo(W, H); c.fill();
    c.fillStyle = 'rgba(255,255,255,.35)';
    c.beginPath(); c.moveTo(0, floorY + 2);
    for (let x = 0; x <= W; x += 20) c.lineTo(x, floorY + 2 - Math.sin(x / 80) * 6 - Math.sin(x / 33) * 3);
    c.lineTo(W, floorY + 6); c.lineTo(0, floorY + 6); c.fill();
    c.fillStyle = 'rgba(120,80,40,.25)';
    for (let i = 0; i < W / 6; i++) { c.beginPath(); c.arc(Math.random() * W, KG.rand(floorY + 6, H), KG.rand(0.8, 2), 0, TAU); c.fill(); }
    // 珊瑚
    const corals = theme === THEMES.reef ? [[0.06, '#ff8fb1'], [0.24, '#ffd65c'], [0.42, '#ffa94d'], [0.62, '#c49bff'], [0.8, '#7fe0c0'], [0.95, '#ff7aa2']]
      : [[0.1, '#ff8fb1'], [0.44, '#ffa94d'], [0.72, '#c49bff'], [0.93, '#ff7aa2']];
    corals.forEach(([fx, col]) => {
      const x = W * fx, y = floorY + 4;
      c.strokeStyle = col; c.lineCap = 'round';
      const br = (x0, y0, len, ang, w, d) => {
        const x1 = x0 + Math.cos(ang) * len, y1 = y0 + Math.sin(ang) * len;
        c.lineWidth = w; c.beginPath(); c.moveTo(x0, y0); c.lineTo(x1, y1); c.stroke();
        if (d > 0) { br(x1, y1, len * 0.72, ang - 0.5, w * 0.72, d - 1); br(x1, y1, len * 0.72, ang + 0.45, w * 0.72, d - 1); }
        else { c.fillStyle = 'rgba(255,255,255,.45)'; c.beginPath(); c.arc(x1, y1, w * 0.4, 0, TAU); c.fill(); }
      };
      br(x, y, 26 * SC, -Math.PI / 2 + KG.rand(-0.2, 0.2), 9 * SC, 3);
    });
    // 貝殼與海星
    for (let i = 0; i < 6; i++) {
      const x = KG.rand(20, W - 20), y = KG.rand(floorY + 12, H - 10);
      if (i % 2) {
        Draw.starPath(c, x, y, 12 * SC, 0.45);
        c.fillStyle = '#ff9a6b'; c.fill(); c.strokeStyle = '#d96a40'; c.lineWidth = 2; c.stroke();
        c.fillStyle = '#ffd0b8'; c.beginPath(); c.arc(x, y, 2.5 * SC, 0, TAU); c.fill();
      } else {
        c.fillStyle = '#fff0f4'; c.strokeStyle = '#e48aa4'; c.lineWidth = 1.8;
        c.beginPath(); c.moveTo(x, y + 6 * SC); c.arc(x, y + 6 * SC, 11 * SC, Math.PI * 1.15, Math.PI * 1.85); c.closePath(); c.fill(); c.stroke();
        for (let k = -2; k <= 2; k++) { c.beginPath(); c.moveTo(x, y + 6 * SC); c.lineTo(x + k * 4 * SC, y - 4 * SC); c.stroke(); }
      }
    }
  }

  function buildWeeds() {
    weeds = [];
    const n = Math.round(W / 70);
    const pal = theme.night ? [['#3f9a8a', '#1f5a5a']] : [['#5fcf6a', '#2f8f45'], ['#7fdc6a', '#3d9c3a'], ['#48bfa0', '#257a66']];
    for (let i = 0; i < n; i++) {
      weeds.push({ x: (i + KG.rand(0.1, 0.9)) * W / n, h: KG.rand(70, 170) * SC * Math.min(1.3, H / 700), w: KG.rand(7, 12) * SC, ph: Math.random() * 6, back: i % 2 === 0, col: KG.pick(pal) });
    }
  }

  const boatY = () => surfaceY + Math.sin(time * 1.6) * 3;
  const tipX = () => boat.x + 64 * SC;
  const tipY = () => boatY() - 92 * SC;

  /* ---------- 生成 ---------- */
  function spawn(kind, anywhere) {
    const span = floorY - surfaceY - 60;
    if (kind === 'boot' || kind === 'chest') {
      fish.push({ kind, x: KG.rand(60, W - 60), y: floorY - 14 * SC, baseY: floorY - 14 * SC, dir: Math.random() < 0.5 ? 1 : -1, s: (kind === 'chest' ? 46 : 40) * SC, ph: Math.random() * 6, speed: kind === 'boot' ? 8 * SC : 0, amp: 0, freq: 1 });
      return;
    }
    if (kind === 'turtle') {
      const dir = Math.random() < 0.5 ? 1 : -1, s = 90 * SC;
      fish.push({ kind, dir, s, x: dir > 0 ? -s : W + s, baseY: surfaceY + 60 + span * KG.rand(0.3, 0.6), speed: 32 * SC, amp: 10 * SC, freq: 0.8, ph: 0, y: 0 });
      return;
    }
    const type = kind || KG.pick(level.types.flatMap(k => Array(TYPES[k].w).fill(k)));
    const T = TYPES[type];
    const dir = Math.random() < 0.5 ? 1 : -1;
    const s = T.s * SC * KG.rand(0.9, 1.1);
    fish.push({
      kind: type, dir, s,
      x: anywhere ? KG.rand(40, W - 40) : (dir > 0 ? -s : W + s),
      baseY: surfaceY + 40 + span * KG.rand(T.depth[0], T.depth[1]),
      speed: T.speed * SC * KG.rand(0.8, 1.2), amp: KG.rand(6, 16) * SC, freq: KG.rand(1, 2.2), ph: Math.random() * 6, y: 0
    });
  }
  function fishTarget() { return clamp(Math.round(W * (floorY - surfaceY) / 52000), 5, 10); }
  const countKind = k => fish.filter(f => f.kind === k && !f.gone).length;

  function setupLevel() {
    fish = []; jellies = []; flyers = [];
    for (let i = 0; i < fishTarget(); i++) spawn(null, true);
    for (let i = 0; i < level.jelly; i++) jellies.push({ x: W * (0.2 + 0.6 * (i + 0.5) / level.jelly) + KG.rand(-30, 30), y: KG.rand(surfaceY + 120, floorY - 120), ph: Math.random() * 6, dir: Math.random() < 0.5 ? 1 : -1, s: 44 * SC, zap: 0 });
  }

  /* ---------- 畫角色 ---------- */
  function drawFishBody(c, type, s, t, glow) {
    const wig = Math.sin(t * 10) * 0.25;
    const round = type === 'puffer';
    const pal = {
      clown: ['#ffc56b', '#ff7a1a', '#ff8a2a', '#c4501a'],
      blue: ['#8fd2ff', '#2a6fe0', '#ffd23f', '#1d4fa8'],
      puffer: ['#ffe0ea', '#ff8fb1', '#ff9fbe', '#c9577e'],
      gold: ['#fff6b8', '#f2b51c', '#ffd34d', '#b9830c']
    }[type];
    const rx = round ? s * 0.42 : s * 0.5, ry = round ? s * 0.4 : s * 0.3;
    const ol = pal[3];
    if (glow) { c.shadowColor = glow; c.shadowBlur = 18; }
    c.lineJoin = 'round';
    // 尾巴
    c.save(); c.translate(-rx * 0.85, 0); c.rotate(wig);
    c.fillStyle = pal[2]; c.strokeStyle = ol; c.lineWidth = 2.2;
    c.beginPath(); c.moveTo(4, 0); c.quadraticCurveTo(-s * 0.2, -s * 0.34, -s * 0.32, -s * 0.27); c.quadraticCurveTo(-s * 0.18, 0, -s * 0.32, s * 0.27); c.quadraticCurveTo(-s * 0.2, s * 0.34, 4, 0); c.fill(); c.stroke();
    c.restore();
    // 背鰭
    c.fillStyle = pal[2]; c.strokeStyle = ol; c.lineWidth = 2.2;
    c.beginPath(); c.moveTo(-rx * 0.5, -ry * 0.8); c.quadraticCurveTo(-rx * 0.1, -ry * 1.65 + Math.sin(t * 4) * 2, rx * 0.35, -ry * 0.85); c.fill(); c.stroke();
    // 身體
    const g = c.createLinearGradient(0, -ry, 0, ry);
    g.addColorStop(0, pal[1]); g.addColorStop(0.55, pal[0]); g.addColorStop(1, '#fffaf0');
    c.fillStyle = g;
    c.beginPath(); c.ellipse(0, 0, rx, ry, 0, 0, TAU); c.fill();
    c.shadowBlur = 0;
    c.save();
    c.beginPath(); c.ellipse(0, 0, rx, ry, 0, 0, TAU); c.clip();
    if (type === 'clown') {
      [-0.25, 0.18].forEach(fx => {
        c.fillStyle = '#4a2b30'; c.fillRect(fx * s - s * 0.085, -ry, s * 0.17, ry * 2);
        c.fillStyle = '#fff'; c.fillRect(fx * s - s * 0.06, -ry, s * 0.12, ry * 2);
      });
    } else if (type === 'blue') {
      c.fillStyle = 'rgba(20,40,110,.75)';
      c.beginPath(); c.moveTo(-rx, -ry * 0.2); c.quadraticCurveTo(-rx * 0.2, -ry * 1.1, rx * 0.5, -ry * 0.5); c.quadraticCurveTo(-rx * 0.1, -ry * 0.4, -rx, ry * 0.2); c.fill();
    } else if (type === 'puffer') {
      c.fillStyle = 'rgba(200,80,120,.35)';
      for (let i = 0; i < 7; i++) { c.beginPath(); c.arc(-rx * 0.6 + (i % 4) * rx * 0.35, -ry * 0.5 + Math.floor(i / 4) * ry * 0.4, s * 0.03, 0, TAU); c.fill(); }
    } else if (type === 'gold') {
      c.strokeStyle = 'rgba(255,255,255,.5)'; c.lineWidth = 1.5;
      for (let i = -2; i <= 1; i++) { c.beginPath(); c.arc(i * s * 0.14, 0, s * 0.12, -1.2, 1.2); c.stroke(); }
    }
    // 陰影面
    c.fillStyle = 'rgba(0,0,40,.12)';
    c.beginPath(); c.ellipse(0, ry * 0.9, rx * 1.1, ry * 0.5, 0, 0, TAU); c.fill();
    c.restore();
    c.strokeStyle = ol; c.lineWidth = 2.4;
    c.beginPath(); c.ellipse(0, 0, rx, ry, 0, 0, TAU); c.stroke();
    if (round) {
      c.fillStyle = '#ff8fb1';
      for (let i = 0; i < 9; i++) {
        const a = -Math.PI * 0.85 + i * Math.PI * 0.21;
        c.beginPath(); c.moveTo(Math.cos(a - 0.08) * rx, Math.sin(a - 0.08) * ry); c.lineTo(Math.cos(a) * rx * 1.2, Math.sin(a) * ry * 1.2); c.lineTo(Math.cos(a + 0.08) * rx, Math.sin(a + 0.08) * ry); c.fill();
      }
    }
    // 光澤
    c.fillStyle = 'rgba(255,255,255,.5)';
    c.beginPath(); c.ellipse(-rx * 0.05, -ry * 0.55, rx * 0.45, ry * 0.15, -0.08, 0, TAU); c.fill();
    c.fillStyle = 'rgba(255,255,255,.8)';
    c.beginPath(); c.arc(-rx * 0.45, -ry * 0.5, s * 0.025, 0, TAU); c.fill();
    // 胸鰭
    c.save(); c.translate(-rx * 0.05, ry * 0.25); c.rotate(0.5 + Math.sin(t * 8) * 0.3);
    c.fillStyle = pal[2]; c.strokeStyle = ol; c.lineWidth = 1.6;
    c.beginPath(); c.ellipse(-s * 0.06, 0, s * 0.1, s * 0.05, 0, 0, TAU); c.fill(); c.stroke();
    c.restore();
    // 眼睛與臉
    const blink = ((t * 0.7) % 3) > 2.88;
    Draw.eye(c, rx * 0.5, -ry * 0.15, s * 0.1, blink ? 'closed' : 'open', 0.6, 0);
    Draw.blush(c, rx * 0.3, ry * 0.3, s * 0.07);
    c.strokeStyle = '#7a3a3a'; c.lineWidth = 1.8; c.lineCap = 'round';
    c.beginPath(); c.arc(rx * 0.84, ry * 0.15, s * 0.05, 0.3, 2.4); c.stroke();
  }

  function drawBoot(c, s, t) {
    c.save();
    c.rotate(-0.15);
    const g = c.createLinearGradient(0, -s * 0.6, 0, s * 0.4);
    g.addColorStop(0, '#b57d50'); g.addColorStop(1, '#6b4426');
    c.fillStyle = g; c.strokeStyle = '#4a2e18'; c.lineWidth = 2.5; c.lineJoin = 'round';
    c.beginPath();
    c.moveTo(-s * 0.35, -s * 0.6); c.lineTo(s * 0.05, -s * 0.6); c.lineTo(s * 0.08, -s * 0.05);
    c.quadraticCurveTo(s * 0.55, -s * 0.02, s * 0.58, s * 0.22); c.lineTo(s * 0.58, s * 0.3); c.lineTo(-s * 0.38, s * 0.3); c.closePath(); c.fill(); c.stroke();
    c.fillStyle = '#4a2e18'; c.fillRect(-s * 0.4, s * 0.24, s * 1.0, s * 0.1);
    c.fillStyle = '#d6a674'; Draw.rr(c, -s * 0.2, -s * 0.22, s * 0.18, s * 0.18, 3); c.fill();
    c.strokeStyle = '#f5e1c0'; c.lineWidth = 1.5;
    for (let i = 0; i < 3; i++) { c.beginPath(); c.moveTo(-s * 0.02, -s * 0.45 + i * s * 0.12); c.lineTo(s * 0.12, -s * 0.4 + i * s * 0.12); c.stroke(); }
    c.strokeStyle = '#59c25a'; c.lineWidth = 3;
    c.beginPath(); c.moveTo(-s * 0.15, -s * 0.6); c.quadraticCurveTo(-s * 0.1 + Math.sin(t * 2) * 5, -s * 0.85, -s * 0.2, -s * 1.0); c.stroke();
    c.restore();
  }

  function drawChest(c, s, t) {
    const w = s * 1.1, h = s * 0.75;
    c.lineJoin = 'round';
    const g = c.createLinearGradient(0, -h, 0, h * 0.3);
    g.addColorStop(0, '#c98a4f'); g.addColorStop(1, '#7a4a22');
    c.fillStyle = g; c.strokeStyle = '#4a2a10'; c.lineWidth = 3;
    Draw.rr(c, -w / 2, -h * 0.45, w, h * 0.75, 6); c.fill(); c.stroke();
    c.beginPath(); c.moveTo(-w / 2, -h * 0.45); c.quadraticCurveTo(0, -h * 1.15, w / 2, -h * 0.45); c.closePath(); c.fill(); c.stroke();
    c.fillStyle = '#ffd23f'; c.strokeStyle = '#b9830c'; c.lineWidth = 2;
    [-w * 0.32, w * 0.32].forEach(x => { c.fillRect(x - 4, -h * 0.85, 8, h * 1.15); c.strokeRect(x - 4, -h * 0.85, 8, h * 1.15); });
    Draw.rr(c, -8, -h * 0.55, 16, 18, 4); c.fill(); c.stroke();
    // 閃光
    const tw = (Math.sin(t * 3) + 1) / 2;
    c.save(); c.globalAlpha = tw; c.fillStyle = '#fffbd0';
    Draw.starPath(c, w * 0.35, -h * 0.9, 7 + tw * 4, 0.3); c.fill(); c.restore();
  }

  function drawTurtle(c, s, t) {
    const fl = Math.sin(t * 3) * 0.5;
    c.lineJoin = 'round'; c.strokeStyle = '#2f6b33'; c.lineWidth = 3;
    // 鰭
    c.fillStyle = '#8ad67a';
    [[s * 0.2, -s * 0.22, -0.6 + fl], [s * 0.2, s * 0.22, 0.6 - fl], [-s * 0.3, -s * 0.18, -2.4 - fl * 0.5], [-s * 0.3, s * 0.18, 2.4 + fl * 0.5]].forEach(([x, y, a]) => {
      c.save(); c.translate(x, y); c.rotate(a); c.beginPath(); c.ellipse(s * 0.16, 0, s * 0.2, s * 0.08, 0, 0, TAU); c.fill(); c.stroke(); c.restore();
    });
    // 頭
    c.fillStyle = '#9be38a';
    c.beginPath(); c.ellipse(s * 0.5, -s * 0.02, s * 0.17, s * 0.14, 0, 0, TAU); c.fill(); c.stroke();
    Draw.eye(c, s * 0.56, -s * 0.06, s * 0.045, ((t * 0.5) % 3) > 2.85 ? 'closed' : 'open', 0.5, 0);
    Draw.blush(c, s * 0.52, s * 0.04, s * 0.035);
    c.strokeStyle = '#2f6b33'; c.lineWidth = 2;
    c.beginPath(); c.arc(s * 0.6, s * 0.02, s * 0.04, 0.2, 2.2); c.stroke();
    // 殼
    const g = c.createRadialGradient(-s * 0.05, -s * 0.15, 4, 0, 0, s * 0.45);
    g.addColorStop(0, '#c9a46a'); g.addColorStop(1, '#7a5a2a');
    c.fillStyle = g; c.strokeStyle = '#4a3515'; c.lineWidth = 3;
    c.beginPath(); c.ellipse(0, 0, s * 0.4, s * 0.3, 0, 0, TAU); c.fill(); c.stroke();
    c.strokeStyle = 'rgba(80,55,20,.6)'; c.lineWidth = 2;
    c.beginPath();
    for (let i = 0; i < 6; i++) { const a = i * TAU / 6; c.lineTo(Math.cos(a) * s * 0.15, Math.sin(a) * s * 0.12); }
    c.closePath(); c.stroke();
    c.fillStyle = 'rgba(255,255,255,.35)';
    c.beginPath(); c.ellipse(-s * 0.08, -s * 0.16, s * 0.18, s * 0.06, -0.2, 0, TAU); c.fill();
  }

  function drawJelly(c, j, t) {
    const s = j.s, p = Math.sin(t * 3 + j.ph);
    c.save(); c.translate(j.x, j.y);
    if (j.zap > 0) { c.shadowColor = '#fff59a'; c.shadowBlur = 25; }
    // 觸手
    c.strokeStyle = 'rgba(255,170,220,.8)'; c.lineWidth = 3; c.lineCap = 'round';
    for (let i = 0; i < 5; i++) {
      const x0 = (i - 2) * s * 0.16;
      c.beginPath(); c.moveTo(x0, s * 0.1);
      for (let k = 1; k <= 6; k++) c.lineTo(x0 + Math.sin(t * 4 + i + k * 0.9) * 5, s * 0.1 + k * s * 0.13);
      c.stroke();
    }
    const g = c.createRadialGradient(-s * 0.12, -s * 0.2, 2, 0, 0, s * 0.55);
    g.addColorStop(0, 'rgba(255,240,250,.95)'); g.addColorStop(1, j.zap > 0 ? 'rgba(255,240,120,.9)' : 'rgba(255,140,200,.8)');
    c.fillStyle = g; c.strokeStyle = '#d55a9a'; c.lineWidth = 2.5;
    c.beginPath(); c.ellipse(0, 0, s * (0.5 + p * 0.04), s * (0.38 - p * 0.03), 0, Math.PI, 0);
    c.quadraticCurveTo(s * 0.25, s * 0.18, 0, s * 0.1); c.quadraticCurveTo(-s * 0.25, s * 0.18, -s * 0.5, 0); c.fill(); c.stroke();
    c.shadowBlur = 0;
    c.fillStyle = 'rgba(255,255,255,.7)'; c.beginPath(); c.ellipse(-s * 0.18, -s * 0.2, s * 0.12, s * 0.06, -0.4, 0, TAU); c.fill();
    Draw.eye(c, -s * 0.13, -s * 0.06, s * 0.06, j.zap > 0 ? 'happy' : 'open');
    Draw.eye(c, s * 0.13, -s * 0.06, s * 0.06, j.zap > 0 ? 'happy' : 'open');
    Draw.blush(c, -s * 0.24, s * 0.02, s * 0.05); Draw.blush(c, s * 0.24, s * 0.02, s * 0.05);
    c.restore();
    if (j.zap > 0) {
      c.strokeStyle = '#fff59a'; c.lineWidth = 3;
      for (let i = 0; i < 4; i++) {
        const a = Math.random() * TAU; c.beginPath(); c.moveTo(j.x + Math.cos(a) * s * 0.5, j.y + Math.sin(a) * s * 0.5);
        c.lineTo(j.x + Math.cos(a) * s * 0.75 + KG.rand(-6, 6), j.y + Math.sin(a) * s * 0.75 + KG.rand(-6, 6)); c.lineTo(j.x + Math.cos(a) * s * 0.95, j.y + Math.sin(a) * s * 0.95); c.stroke();
      }
    }
  }

  function drawHat(c, kind, hy, s) {
    c.lineJoin = 'round'; c.lineWidth = 2.2 * s;
    if (kind === 'straw') {
      c.fillStyle = '#ffe17a'; c.strokeStyle = '#c9962a';
      c.beginPath(); c.ellipse(0, hy - 16 * s, 31 * s, 6.5 * s, 0, 0, TAU); c.fill(); c.stroke();
      c.beginPath(); c.ellipse(0, hy - 20 * s, 15 * s, 11 * s, 0, Math.PI, 0); c.fill(); c.stroke();
      c.fillStyle = '#ff7aa2'; c.fillRect(-15 * s, hy - 22 * s, 30 * s, 4 * s);
    } else if (kind === 'sailor') {
      c.fillStyle = '#fff'; c.strokeStyle = '#2a6fe0';
      c.beginPath(); c.ellipse(0, hy - 19 * s, 20 * s, 9 * s, 0, Math.PI, 0); c.closePath(); c.fill(); c.stroke();
      c.fillStyle = '#2a6fe0'; c.fillRect(-20 * s, hy - 20 * s, 40 * s, 5 * s);
    } else if (kind === 'pirate') {
      c.fillStyle = '#3a2a40'; c.strokeStyle = '#1a1020';
      c.beginPath(); c.moveTo(-30 * s, hy - 16 * s); c.quadraticCurveTo(0, hy - 48 * s, 30 * s, hy - 16 * s); c.quadraticCurveTo(0, hy - 24 * s, -30 * s, hy - 16 * s); c.fill(); c.stroke();
      c.fillStyle = '#fff'; c.beginPath(); c.arc(0, hy - 28 * s, 4.5 * s, 0, TAU); c.fill();
    } else if (kind === 'crown') {
      c.fillStyle = '#ffd23f'; c.strokeStyle = '#c4891a';
      c.beginPath(); c.moveTo(-16 * s, hy - 16 * s); c.lineTo(-18 * s, hy - 34 * s); c.lineTo(-8 * s, hy - 24 * s); c.lineTo(0, hy - 38 * s); c.lineTo(8 * s, hy - 24 * s); c.lineTo(18 * s, hy - 34 * s); c.lineTo(16 * s, hy - 16 * s); c.closePath(); c.fill(); c.stroke();
      c.fillStyle = '#ff5c8a'; c.beginPath(); c.arc(0, hy - 22 * s, 3 * s, 0, TAU); c.fill();
    } else if (kind === 'captain') {
      c.fillStyle = '#2a3a6e'; c.strokeStyle = '#141f45';
      Draw.rr(c, -19 * s, hy - 32 * s, 38 * s, 14 * s, 6 * s); c.fill(); c.stroke();
      c.fillStyle = '#141f45'; c.beginPath(); c.ellipse(4 * s, hy - 17 * s, 22 * s, 5 * s, 0, 0, Math.PI); c.fill();
      c.fillStyle = '#ffd23f'; Draw.starPath(c, 0, hy - 26 * s, 5 * s, 0.45); c.fill();
    }
  }

  function drawCat(c, x, y, s, sk, t, mood) {
    const jump = mood === 'happy' ? -Math.abs(Math.sin(t * 9)) * 16 * s : 0;
    c.save(); c.translate(x, y + jump);
    const ol = '#8a4a1a';
    c.lineJoin = 'round'; c.lineCap = 'round';
    // 尾巴
    c.strokeStyle = sk.fur[1]; c.lineWidth = 8 * s;
    c.beginPath(); c.moveTo(-18 * s, -16 * s); c.quadraticCurveTo(-44 * s, -20 * s, -36 * s, -48 * s + Math.sin(t * 3) * 6 * s); c.stroke();
    // 身體
    c.fillStyle = sk.fur[1]; c.strokeStyle = ol; c.lineWidth = 2.4 * s;
    c.beginPath(); c.ellipse(0, -30 * s, 22 * s, 24 * s, 0, 0, TAU); c.fill(); c.stroke();
    c.fillStyle = '#fff4e6';
    c.beginPath(); c.ellipse(0, -24 * s, 13 * s, 15 * s, 0, 0, TAU); c.fill();
    // 釣竿
    c.strokeStyle = '#8a5a35'; c.lineWidth = 4 * s;
    c.beginPath(); c.moveTo(10 * s, -30 * s); c.lineTo(64 * s, -92 * s); c.stroke();
    c.fillStyle = '#d9d9e8'; c.beginPath(); c.arc(16 * s, -38 * s, 4 * s, 0, TAU); c.fill();
    c.fillStyle = sk.fur[1]; c.strokeStyle = ol; c.lineWidth = 2 * s;
    c.beginPath(); c.arc(14 * s, -34 * s, 6 * s, 0, TAU); c.fill(); c.stroke();
    // 頭
    const tilt = mood === 'dizzy' ? Math.sin(t * 8) * 0.15 : mood === 'sad' ? 0.12 : Math.sin(t * 1.5) * 0.04;
    const hy = -66 * s;
    c.save(); c.translate(0, hy); c.rotate(tilt); c.translate(0, -hy);
    c.fillStyle = sk.fur[1]; c.strokeStyle = ol; c.lineWidth = 2.4 * s;
    [-1, 1].forEach(d => {
      c.beginPath(); c.moveTo(d * 23 * s, hy - 4 * s); c.lineTo(d * 18 * s, hy - 32 * s); c.lineTo(d * 2 * s, hy - 18 * s); c.closePath(); c.fill(); c.stroke();
    });
    c.fillStyle = '#ffc7d6';
    [-1, 1].forEach(d => { c.beginPath(); c.moveTo(d * 17 * s, hy - 10 * s); c.lineTo(d * 16 * s, hy - 25 * s); c.lineTo(d * 8 * s, hy - 16 * s); c.fill(); });
    const hg = c.createRadialGradient(-6 * s, hy - 8 * s, 2, 0, hy, 27 * s);
    hg.addColorStop(0, sk.fur[0]); hg.addColorStop(1, sk.fur[1]);
    c.fillStyle = hg;
    c.beginPath(); c.ellipse(0, hy, 25 * s, 21 * s, 0, 0, TAU); c.fill(); c.stroke();
    c.fillStyle = 'rgba(255,255,255,.45)'; c.beginPath(); c.ellipse(-10 * s, hy - 11 * s, 7 * s, 3.5 * s, -0.4, 0, TAU); c.fill();
    drawHat(c, sk.hat, hy, s);
    if (sk.hat === 'pirate') { c.fillStyle = '#1a1020'; c.beginPath(); c.arc(9 * s, hy, 5.5 * s, 0, TAU); c.fill(); c.strokeStyle = '#1a1020'; c.lineWidth = 1.5 * s; c.beginPath(); c.moveTo(-20 * s, hy - 10 * s); c.lineTo(20 * s, hy + 2 * s); c.stroke(); }
    // 臉
    const blink = (t % 3.5) > 3.35;
    const em = mood === 'happy' ? 'happy' : mood === 'dizzy' ? 'dizzy' : mood === 'sad' ? 'sad' : blink ? 'closed' : 'open';
    Draw.eye(c, -9 * s, hy, 4.4 * s, em, 0.3, 0.2);
    if (sk.hat !== 'pirate') Draw.eye(c, 9 * s, hy, 4.4 * s, em, 0.3, 0.2);
    Draw.blush(c, -15 * s, hy + 8 * s, 4.5 * s); Draw.blush(c, 15 * s, hy + 8 * s, 4.5 * s);
    c.fillStyle = '#ff7a9c'; c.beginPath(); c.moveTo(-2.5 * s, hy + 4 * s); c.lineTo(2.5 * s, hy + 4 * s); c.lineTo(0, hy + 7 * s); c.fill();
    c.strokeStyle = '#3a2440'; c.lineWidth = 1.7 * s;
    if (mood === 'happy') { c.fillStyle = '#c2416c'; c.beginPath(); c.arc(0, hy + 8 * s, 5 * s, 0, Math.PI); c.fill(); }
    else if (mood === 'sad' || mood === 'dizzy') { c.beginPath(); c.arc(0, hy + 13 * s, 4 * s, Math.PI * 1.2, Math.PI * 1.8); c.stroke(); }
    else { c.beginPath(); c.arc(-3 * s, hy + 7 * s, 3 * s, 0.2, Math.PI - 0.2); c.arc(3 * s, hy + 7 * s, 3 * s, 0.2, Math.PI - 0.2); c.stroke(); }
    c.strokeStyle = 'rgba(80,50,40,.55)'; c.lineWidth = 1 * s;
    [[-1, 5], [-1, 9], [1, 5], [1, 9]].forEach(([sd, yy]) => { c.beginPath(); c.moveTo(sd * 13 * s, hy + yy * s); c.lineTo(sd * 30 * s, hy + (yy * 2 - 8) * s); c.stroke(); });
    if (mood === 'sad') { c.fillStyle = '#7fd1ff'; c.beginPath(); c.ellipse(24 * s, hy - 10 * s, 3 * s, 5 * s, 0, 0, TAU); c.fill(); }
    c.restore();
    if (mood === 'dizzy') {
      for (let i = 0; i < 3; i++) {
        const a = t * 5 + i * TAU / 3;
        Draw.star(c, Math.cos(a) * 26 * s, hy - 30 * s + Math.sin(a) * 7 * s, 6 * s);
      }
    }
    c.restore();
  }

  function drawBoatAt(c, x, by, s, sk, t, mood, rot, bucket) {
    c.save();
    c.translate(x, by); c.rotate(rot || 0); c.translate(-x, -by);
    drawCat(c, x - 6 * s, by - 8 * s, s, sk, t, mood);
    // 小水桶
    const bw = bucket ? 1 + Math.sin(bucket * 20) * 0.1 * bucket : 1;
    c.save(); c.translate(x - 50 * s, by - 10 * s); c.scale(bw, 2 - bw);
    c.fillStyle = '#7fc8ff'; c.strokeStyle = '#2f6fa8'; c.lineWidth = 2 * s; c.lineJoin = 'round';
    c.beginPath(); c.moveTo(-12 * s, -24 * s); c.lineTo(12 * s, -24 * s); c.lineTo(8 * s, 0); c.lineTo(-8 * s, 0); c.closePath(); c.fill(); c.stroke();
    if (catches > 0) { c.fillStyle = '#ff9a3c'; c.beginPath(); c.moveTo(0, -24 * s); c.lineTo(-6 * s, -36 * s); c.lineTo(6 * s, -36 * s); c.fill(); }
    c.restore();
    // 船身
    const g = c.createLinearGradient(0, by - 14 * s, 0, by + 26 * s);
    g.addColorStop(0, sk.boat[0]); g.addColorStop(1, sk.boat[1]);
    c.fillStyle = g; c.strokeStyle = 'rgba(60,20,30,.55)'; c.lineWidth = 2.5 * s;
    c.beginPath();
    c.moveTo(x - 80 * s, by - 14 * s); c.lineTo(x + 80 * s, by - 14 * s);
    c.quadraticCurveTo(x + 70 * s, by + 24 * s, x + 40 * s, by + 26 * s);
    c.lineTo(x - 40 * s, by + 26 * s);
    c.quadraticCurveTo(x - 70 * s, by + 24 * s, x - 80 * s, by - 14 * s);
    c.fill(); c.stroke();
    c.fillStyle = 'rgba(255,255,255,.9)'; c.fillRect(x - 74 * s, by - 1 * s, 148 * s, 6 * s);
    c.fillStyle = '#8a5a35'; Draw.rr(c, x - 84 * s, by - 21 * s, 168 * s, 10 * s, 5 * s); c.fill();
    c.fillStyle = 'rgba(255,255,255,.35)'; c.fillRect(x - 78 * s, by - 20 * s, 150 * s, 2.5 * s);
    [-50, 0, 50].forEach(d => { c.fillStyle = '#fff1c4'; c.beginPath(); c.arc(x + d * s, by + 12 * s, 5 * s, 0, TAU); c.fill(); c.strokeStyle = sk.boat[1]; c.lineWidth = 2; c.stroke(); });
    c.restore();
  }

  function drawItem(c, i, w, h) {
    const sk = SKINS[i];
    const g = c.createLinearGradient(0, 0, 0, h);
    g.addColorStop(0, '#dff4ff'); g.addColorStop(1, '#8fd3f5');
    c.fillStyle = g; Draw.rr(c, 0, 0, w, h, 12); c.fill();
    c.fillStyle = '#4fb7ea'; c.fillRect(0, h * 0.78, w, h * 0.22);
    drawBoatAt(c, w * 0.48, h * 0.8, w / 260, sk, 1, 'idle', 0, 0);
  }

  function drawMascot(c, w, h, t) {
    const s = Math.min(w / 260, h / 210) * 1.15;
    const wy = h * 0.8;
    // 跳起來的魚
    const ft = (t % 3.2) / 1.2;
    if (ft < 1) {
      const fx = w * 0.82 - ft * w * 0.2, fy = wy - Math.sin(ft * Math.PI) * h * 0.45;
      c.save(); c.translate(fx, fy); c.scale(-1, 1); c.rotate(-(0.5 - ft) * 1.6); drawFishBody(c, 'clown', 40 * s, t * 2); c.restore();
      if (ft > 0.9) { c.fillStyle = 'rgba(255,255,255,.8)'; c.beginPath(); c.arc(w * 0.62, wy, 6, 0, TAU); c.fill(); }
    }
    drawBoatAt(c, w * 0.42, wy + Math.sin(t * 1.6) * 3, s, SKINS[UI.item()], t, ft < 1 && ft > 0.3 ? 'happy' : 'idle', Math.sin(t * 1.6 + 1) * 0.04, 0);
    // 船下的水波
    for (let k = 0; k < 3; k++) {
      const r = ((t * 0.5 + k / 3) % 1);
      c.strokeStyle = 'rgba(255,255,255,' + (0.8 * (1 - r)) + ')'; c.lineWidth = 3;
      c.beginPath(); c.ellipse(w * 0.42, wy + 26 * s, 90 * s * (0.8 + r * 0.6), 10 * s * (0.8 + r * 0.6), 0, 0, TAU); c.stroke();
    }
  }

  /* ---------- 場景 ---------- */
  function drawWeed(w) {
    const n = 10, pts = [];
    for (let i = 0; i <= n; i++) {
      const f = i / n;
      pts.push([w.x + Math.sin(time * 1.4 + w.ph + f * 2.5) * 14 * SC * f, floorY + 6 - w.h * f]);
    }
    const g = ctx.createLinearGradient(w.x - w.w, 0, w.x + w.w, 0);
    g.addColorStop(0, w.back ? w.col[1] : w.col[0]); g.addColorStop(1, w.col[1]);
    ctx.fillStyle = g;
    ctx.globalAlpha = w.back ? 0.7 : 1;
    ctx.beginPath();
    pts.forEach(([x, y], i) => ctx.lineTo(x - w.w * (1 - i / n), y));
    for (let i = n; i >= 0; i--) ctx.lineTo(pts[i][0] + w.w * (1 - i / n), pts[i][1]);
    ctx.fill();
    ctx.globalAlpha = 1;
  }

  function drawSky() {
    ctx.fillStyle = skyGrad; ctx.fillRect(0, 0, W, surfaceY + 20);
    if (theme.night) {
      skyStars.forEach(s => { ctx.globalAlpha = 0.5 + 0.5 * Math.sin(time * 2 + s.ph); ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, TAU); ctx.fill(); });
      ctx.globalAlpha = 1;
    }
    const sx = W - Math.min(120, W * 0.24), sy = Math.max(120, surfaceY * 0.5);
    const g = ctx.createRadialGradient(sx, sy, 6, sx, sy, 70);
    g.addColorStop(0, '#fffbe0'); g.addColorStop(0.42, theme.sun); g.addColorStop(0.48, theme.sun + '66'); g.addColorStop(1, theme.sun + '00');
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(sx, sy, 70, 0, TAU); ctx.fill();
    if (theme.night) { ctx.fillStyle = theme.sky[1]; ctx.beginPath(); ctx.arc(sx + 12, sy - 8, 26, 0, TAU); ctx.fill(); }
    clouds.forEach(cl => Draw.cloud(ctx, cl.x, cl.y, cl.s, theme.night ? 0.25 : 0.95));
  }

  function waveY(x) { return surfaceY + Math.sin(x / 60 + time * 2) * 4 + Math.sin(x / 23 - time * 3) * 1.5; }

  function drawWater() {
    ctx.fillStyle = waterGrad;
    ctx.beginPath(); ctx.moveTo(0, H);
    for (let x = 0; x <= W + 20; x += 20) ctx.lineTo(x, waveY(x));
    ctx.lineTo(W, H); ctx.fill();
    // 光束
    for (let i = 0; i < 5; i++) {
      const x = W * (0.08 + i * 0.21) + Math.sin(time * 0.4 + i) * 30;
      const a = (theme.night ? 0.04 : 0.09) + 0.05 * Math.sin(time * 0.8 + i * 1.7);
      const g = ctx.createLinearGradient(0, surfaceY, 0, floorY);
      g.addColorStop(0, 'rgba(255,255,255,' + a + ')'); g.addColorStop(1, 'rgba(255,255,255,0)');
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.moveTo(x - 20, surfaceY); ctx.lineTo(x + 20, surfaceY); ctx.lineTo(x + 110, floorY); ctx.lineTo(x + 30, floorY); ctx.fill();
    }
    // 水面波光
    ctx.strokeStyle = 'rgba(255,255,255,.75)'; ctx.lineWidth = 3;
    ctx.beginPath(); for (let x = 0; x <= W + 20; x += 20) ctx.lineTo(x, waveY(x)); ctx.stroke();
    ctx.strokeStyle = 'rgba(255,255,255,.25)'; ctx.lineWidth = 2;
    for (let i = 0; i < 8; i++) {
      const x = (i * 157 + time * 20) % (W + 60) - 30, y = surfaceY + 18 + (i % 3) * 14;
      ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x + 26, y); ctx.stroke();
    }
  }

  function drawHook() {
    const tx = tipX(), ty = tipY();
    ctx.strokeStyle = theme.night ? 'rgba(255,255,255,.6)' : 'rgba(255,255,255,.9)'; ctx.lineWidth = 1.6;
    ctx.beginPath(); ctx.moveTo(tx, ty); ctx.quadraticCurveTo((tx + hook.x) / 2 + 6, (ty + hook.y) / 2, hook.x, hook.y); ctx.stroke();
    if (hook.y > surfaceY + 10) {
      const bobY = waveY(hook.x);
      const bx = tx + (hook.x - tx) * ((bobY - ty) / Math.max(1, hook.y - ty));
      ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(bx, bobY, 6.5 * SC, 0, TAU); ctx.fill();
      ctx.fillStyle = '#ff4d6d'; ctx.beginPath(); ctx.arc(bx, bobY, 6.5 * SC, Math.PI, 0); ctx.fill();
      ctx.strokeStyle = '#9a2a40'; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.arc(bx, bobY, 6.5 * SC, 0, TAU); ctx.stroke();
    }
    const hx = hook.x, hy = hook.y;
    if (theme.night) {
      const g = ctx.createRadialGradient(hx, hy + 10, 2, hx, hy + 10, 70 * SC);
      g.addColorStop(0, 'rgba(255,250,200,.35)'); g.addColorStop(1, 'rgba(255,250,200,0)');
      ctx.fillStyle = g; ctx.beginPath(); ctx.arc(hx, hy + 10, 70 * SC, 0, TAU); ctx.fill();
    }
    ctx.strokeStyle = hook.stun > 0 ? '#fff59a' : '#d8dee8'; ctx.lineWidth = 3 * SC; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(hx, hy); ctx.lineTo(hx, hy + 12 * SC); ctx.arc(hx + 6 * SC, hy + 12 * SC, 6 * SC, Math.PI, 0, true); ctx.lineTo(hx + 12 * SC, hy + 7 * SC); ctx.stroke();
    if (!hook.fish && hook.stun <= 0) {
      ctx.strokeStyle = '#ff8fa8'; ctx.lineWidth = 4.5 * SC;
      ctx.beginPath(); ctx.moveTo(hx + 1, hy + 12 * SC);
      ctx.quadraticCurveTo(hx + 8 * SC, hy + 22 * SC + Math.sin(time * 6) * 3, hx + 14 * SC, hy + 16 * SC); ctx.stroke();
    }
  }

  function drawCritter(f, t) {
    if (f.kind === 'boot') drawBoot(ctx, f.s, t);
    else if (f.kind === 'chest') drawChest(ctx, f.s, t);
    else if (f.kind === 'turtle') drawTurtle(ctx, f.s, t);
    else drawFishBody(ctx, f.kind, f.s, t, theme.night ? (f.kind === 'gold' ? '#fff3a0' : 'rgba(180,230,255,.9)') : (f.kind === 'gold' ? 'rgba(255,230,120,.9)' : null));
  }

  /* ---------- 更新 ---------- */
  function setMood(m, dur) { cat.mood = m; cat.moodT = dur; }

  function update(dt) {
    time += dt;
    if (FX.hitStop > 0) { FX.hitStop -= dt; return; }
    Tween.update(dt);
    FX.update(dt);
    cat.moodT -= dt; if (cat.moodT <= 0) cat.mood = 'idle';
    bucketWob = Math.max(0, bucketWob - dt * 1.5);
    clouds.forEach(cl => { cl.x += cl.v * dt; if (cl.x > W + 80) cl.x = -80; });
    const active = state === 'play';

    // 船
    let want = 0;
    if (active && keyDir) want = keyDir * 250 * SC;
    else if (active && holding && pointerX != null) {
      const d = (pointerX - 64 * SC) - boat.x;
      want = Math.abs(d) < 4 ? 0 : Math.sign(d) * Math.min(270 * SC, Math.abs(d) * 4);
    }
    boat.vx += (want - boat.vx) * Math.min(1, dt * 8);
    boat.x = clamp(boat.x + boat.vx * dt, 86 * SC, W - 86 * SC);

    // 魚鉤
    const restY = surfaceY + 20;
    hook.stun = Math.max(0, hook.stun - dt);
    const down = (holding || keyHold) && !needRelease && active && !hook.fish && hook.stun <= 0;
    hook.x += (tipX() - hook.x) * Math.min(1, dt * 5);
    if (hook.fish) {
      hook.y -= (hook.fish.kind === 'chest' || hook.fish.kind === 'turtle' ? 300 : 420) * SC * dt;
      if (hook.y <= restY) { hook.y = restY; land(); }
    } else if (down) hook.y = Math.min(floorY - 18, hook.y + 240 * SC * dt);
    else hook.y = Math.max(restY, hook.y - (hook.stun > 0 ? 500 : 350) * SC * dt);
    const inWater = hook.y > surfaceY + 24;
    if (inWater && !hook.wasIn) { KG.sound('splash'); FX.burst(hook.x, surfaceY, { n: 10, shape: 'circle', colors: ['#fff', '#bdeaff'], speed: 160, up: 140, size: 3, life: 0.6, angle: -Math.PI / 2, spread: 0.9 }); FX.ring(hook.x, surfaceY + 4, 'rgba(255,255,255,.8)', 34); }
    hook.wasIn = inWater;

    // 補充魚
    if (state !== 'end') {
      const nFish = fish.filter(f => TYPES[f.kind] && !f.gone).length;
      if (nFish < fishTarget()) spawn(null, false);
      if (countKind('boot') < (state === 'menu' ? 1 : level.boots)) spawn('boot');
      if (level.chest && countKind('chest') < 1 && Math.random() < dt * 0.15) spawn('chest');
      if (level.turtle && countKind('turtle') < 1 && Math.random() < dt * 0.06) spawn('turtle');
    }
    fish.forEach(f => {
      if (f.hooked) return;
      if (f.speed) {
        f.x += f.dir * f.speed * dt;
        if (f.kind === 'boot' && (f.x < 40 || f.x > W - 40)) f.dir *= -1;
      }
      const near = inWater && !hook.fish && Math.hypot(hook.x - f.x, hook.y - f.y) < 150 * SC;
      if (near && TYPES[f.kind]) f.baseY += Math.sign(hook.y - f.baseY) * Math.min(Math.abs(hook.y - f.baseY), 38 * SC * dt);
      if (f.amp) f.y = f.baseY + Math.sin(time * f.freq + f.ph) * f.amp; else f.y = f.baseY;
      if (TYPES[f.kind] || f.kind === 'turtle') if ((f.dir > 0 && f.x > W + f.s * 1.3) || (f.dir < 0 && f.x < -f.s * 1.3)) f.gone = true;
      if (active && !hook.fish && hook.stun <= 0 && inWater) {
        let hit;
        const hx = hook.x + 6 * SC, hy = hook.y + 14 * SC;
        if (f.kind === 'boot' || f.kind === 'chest') hit = Math.abs(hx - f.x) < f.s * 0.6 + 8 && hy > f.y - f.s * 0.9;
        else { const mx = f.x + f.dir * f.s * (f.kind === 'turtle' ? 0.5 : 0.48); hit = Math.hypot(mx - hx, f.y - hy) < f.s * (f.kind === 'turtle' ? 0.35 : 0.55) + 14 * SC; }
        if (hit) bite(f);
      }
    });
    fish = fish.filter(f => !f.gone);

    // 水母
    jellies.forEach(j => {
      j.y += Math.sin(time * 0.9 + j.ph) * 22 * SC * dt;
      j.x += j.dir * 14 * SC * dt;
      if (j.x < 50 || j.x > W - 50) j.dir *= -1;
      j.y = clamp(j.y, surfaceY + 80, floorY - 80);
      j.zap = Math.max(0, j.zap - dt);
      if (active && !hook.fish && hook.stun <= 0 && Math.hypot(hook.x - j.x, hook.y + 10 - j.y) < j.s * 0.6 + 8) {
        j.zap = 0.8; hook.stun = 1.2; streak = 0;
        setMood('dizzy', 1.4);
        KG.sound('hit'); KG.vibrate(60);
        FX.shake(8, 0.35);
        FX.burst(hook.x, hook.y, { n: 12, colors: ['#fff59a', '#fff'], size: 5, speed: 220 });
        FX.text('嗶嗶！電電～', hook.x, hook.y - 30, { color: '#fff59a', stroke: '#b45a9a', size: 26 });
      }
    });

    // 泡泡
    if (Math.random() < dt * 4 && weeds.length) {
      const w = KG.pick(weeds);
      bubbles.push({ x: w.x, y: floorY, r: KG.rand(2, 6) * SC, v: KG.rand(30, 60) * SC, ph: Math.random() * 6 });
    }
    bubbles.forEach(b => { b.y -= b.v * dt; b.x += Math.sin(time * 3 + b.ph) * 0.4; });
    bubbles = bubbles.filter(b => b.y > surfaceY + 4);

    // 計時
    if (state === 'intro') {
      introT -= dt;
      if (introT <= 0) { state = 'play'; banner.classList.remove('show'); tipEl.classList.add('show'); setTimeout(() => tipEl.classList.remove('show'), 3500); }
    } else if (state === 'play') {
      timeLeft -= dt;
      const sec = Math.max(0, Math.ceil(timeLeft));
      if (sec !== lastSec) {
        lastSec = sec;
        hudTs.textContent = sec;
        if (sec <= 10 && sec > 0) { hudT.classList.remove('low'); void hudT.offsetWidth; hudT.classList.add('low'); KG.sound('tick'); }
      }
      if (timeLeft <= 0) { state = 'ending'; holding = false; keyHold = false; }
    } else if (state === 'ending' && !hook.fish && !flyers.length) {
      state = 'end';
      setTimeout(finish, 400);
    }
  }

  function bite(f) {
    f.hooked = true; hook.fish = f;
    FX.hitStop = 0.07;
    FX.shake(3, 0.15);
    if (f.kind === 'boot') { KG.sound('boing'); FX.text('咦？', hook.x, hook.y - 24, { size: 26 }); }
    else { KG.sound('pop'); KG.vibrate(30); FX.text('上鉤了！', hook.x, hook.y - 28, { size: 24, stroke: '#1f6fb2' }); FX.ring(hook.x, hook.y, '#fff', 40); }
  }

  function land() {
    const f = hook.fish;
    hook.fish = null;
    if (holding || keyHold) needRelease = true;
    f.gone = true;
    fish = fish.filter(x => x !== f);
    KG.sound('splash');
    FX.burst(hook.x, surfaceY, { n: 16, shape: 'circle', colors: ['#fff', '#bdeaff'], speed: 220, up: 160, size: 3.5, life: 0.7, angle: -Math.PI / 2, spread: 1 });
    if (f.kind === 'boot') {
      streak = 0;
      setMood('sad', 1.6);
      FX.text('哎呀！是舊靴子', hook.x, surfaceY - 60, { color: '#ffe17a', stroke: '#6b3e18', size: 26 });
      KG.say('哎呀，是舊靴子！');
      // 靴子被丟回海裡
      const b = { kind: 'boot', x: hook.x, y: surfaceY - 20, s: f.s, rot: 0, a: 1 };
      flyers.push(b);
      Tween.to(b, { x: hook.x + (hook.x > W / 2 ? -1 : 1) * 160 * SC, rot: 6 }, 0.9, 'linear');
      Tween.to(b, { y: surfaceY - 120 * SC }, 0.45, 'outQuad', 0, () => Tween.to(b, { y: surfaceY + 40 }, 0.45, 'inCubic', 0, () => { flyers = flyers.filter(x => x !== b); KG.sound('splash'); }));
      return;
    }
    const pts = f.kind === 'turtle' ? 80 : f.kind === 'chest' ? 100 : TYPES[f.kind].pts;
    const name = f.kind === 'turtle' ? '大海龜' : f.kind === 'chest' ? '寶箱' : TYPES[f.kind].name;
    streak++;
    const bonus = streak >= 2 ? Math.min(20, (streak - 1) * 5) : 0;
    score += pts + bonus; catches++;
    hudS.textContent = score;
    updateBar();
    setMood('happy', 1.2);
    const big = pts >= 50;
    KG.sound(big ? 'sparkle' : 'coin');
    if (big) { FX.shake(9, 0.4); KG.confetti(hook.x, surfaceY - 40, 60); KG.say('哇！' + name + '！'); }
    FX.text(name + ' +' + (pts + bonus), hook.x, surfaceY - 70, { tag: 'catch', color: big ? '#ffe14d' : '#fff', stroke: big ? '#b9830c' : '#1f6fb2', size: big ? 34 : 28 });
    FX.burst(hook.x, surfaceY - 30, { n: big ? 30 : 16, colors: ['#fff59a', '#ffd65c', '#ffffff', '#8fe3ff'], size: 6 });
    if (streak >= 2) {
      const words = ['好棒！', '太厲害了！', '完美！', '釣魚高手！'];
      setTimeout(() => {
        FX.text('連續 ' + streak + ' 條！' + words[Math.min(words.length - 1, streak - 2)], W / 2, surfaceY + 80, { tag: 'combo', color: '#fff', stroke: '#e8648d', size: 30, dur: 1.4 });
        Jingle.combo(streak);
      }, 250);
    }
    // 飛進水桶
    const fl = { kind: f.kind, x: hook.x, y: surfaceY - 20, s: f.s * (f.kind === 'turtle' ? 0.5 : 0.8), rot: 0, sc: 1 };
    flyers.push(fl);
    const bx = boat.x - 50 * SC, by = boatY() - 40 * SC;
    Tween.to(fl, { x: bx, rot: -TAU }, 0.6, 'inOutSine');
    Tween.to(fl, { y: surfaceY - 160 * SC }, 0.3, 'outQuad', 0, () => Tween.to(fl, { y: by, sc: 0.3 }, 0.3, 'inCubic', 0, () => {
      flyers = flyers.filter(x => x !== fl); bucketWob = 1; KG.note(900, 0.08, 'sine', 0.2);
    }));
  }

  function updateBar() {
    const max = level.target * 1.5;
    barFill.style.width = Math.min(100, score / max * 100) + '%';
  }

  /* ---------- 繪製 ---------- */
  function render() {
    const [sx, sy] = FX.offset();
    ctx.setTransform(view.DPR, 0, 0, view.DPR, sx * view.DPR, sy * view.DPR);
    drawSky();
    drawWater();
    ctx.save(); ctx.setTransform(1, 0, 0, 1, sx * view.DPR, sy * view.DPR); ctx.drawImage(seabed, 0, 0); ctx.restore();
    weeds.forEach(w => { if (w.back) drawWeed(w); });
    fish.forEach(f => {
      if (f.hooked) return;
      ctx.save(); ctx.translate(f.x, f.y);
      if (f.kind !== 'boot' && f.kind !== 'chest') { ctx.scale(f.dir, 1); ctx.rotate(Math.cos(time * f.freq + f.ph) * 0.08); }
      drawCritter(f, time + f.ph);
      ctx.restore();
    });
    jellies.forEach(j => drawJelly(ctx, j, time));
    weeds.forEach(w => { if (!w.back) drawWeed(w); });
    bubbles.forEach(b => {
      ctx.strokeStyle = 'rgba(255,255,255,.75)'; ctx.lineWidth = 1.2; ctx.fillStyle = 'rgba(255,255,255,.15)';
      ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, TAU); ctx.fill(); ctx.stroke();
      ctx.fillStyle = 'rgba(255,255,255,.85)'; ctx.beginPath(); ctx.arc(b.x - b.r * 0.35, b.y - b.r * 0.35, b.r * 0.3, 0, TAU); ctx.fill();
    });
    if (state !== 'menu') drawHook();
    if (hook.fish) {
      const f = hook.fish;
      ctx.save(); ctx.translate(hook.x + 8 * SC, hook.y + 16 * SC);
      if (f.kind === 'boot') { ctx.rotate(Math.sin(time * 6) * 0.15); ctx.translate(0, f.s * 0.6); drawBoot(ctx, f.s, time); }
      else if (f.kind === 'chest') { ctx.rotate(Math.sin(time * 5) * 0.1); ctx.translate(0, f.s * 0.6); drawChest(ctx, f.s, time); }
      else { ctx.rotate(-Math.PI / 2 + Math.sin(time * 14) * 0.25); ctx.translate(-f.s * (f.kind === 'turtle' ? 0.55 : 0.48), 0); drawCritter(f, time * 2); }
      ctx.restore();
    }
    if (state !== 'menu') drawBoatAt(ctx, boat.x, boatY(), SC, skin, time, cat.mood, Math.sin(time * 1.6 + 1) * 0.03 + boat.vx * 0.0002, bucketWob);
    flyers.forEach(f => {
      ctx.save(); ctx.translate(f.x, f.y); ctx.rotate(f.rot); ctx.scale(f.sc || 1, f.sc || 1);
      if (f.kind === 'boot') drawBoot(ctx, f.s, time); else if (f.kind === 'chest') drawChest(ctx, f.s, time); else drawCritter(f, time * 2);
      ctx.restore();
    });
    FX.draw(ctx, FONT);
    // 暗角
    const vg = ctx.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.4, W / 2, H / 2, Math.max(W, H) * 0.75);
    vg.addColorStop(0, 'rgba(0,20,60,0)'); vg.addColorStop(1, theme.night ? 'rgba(0,0,30,.45)' : 'rgba(0,30,70,.25)');
    ctx.fillStyle = vg; ctx.fillRect(-20, -20, W + 40, H + 40);
  }

  let last = performance.now();
  function frame(now) {
    const dt = Math.min(0.05, (now - last) / 1000);
    last = now;
    update(dt);
    render();
    requestAnimationFrame(frame);
  }

  /* ---------- 流程 ---------- */
  function startLevel(i) {
    levelIndex = i; level = LEVELS[i]; theme = THEMES[level.theme];
    skin = SKINS[UI.item()];
    applyTheme();
    Tween.clear(); FX.clear();
    score = 0; catches = 0; streak = 0; timeLeft = ROUND_TIME; lastSec = -1;
    hook.fish = null; hook.y = surfaceY + 20; hook.stun = 0;
    holding = false; keyHold = false;
    setupLevel();
    hudS.textContent = '0'; hudTs.textContent = ROUND_TIME; updateBar();
    barStar.style.left = (100 / 1.5) + '%';
    barStar.innerHTML = starSVG(true);
    hud.classList.add('show');
    banner.querySelector('.t1').textContent = '第 ' + (i + 1) + ' 關　' + level.label;
    banner.querySelector('.t2').textContent = level.intro + '　目標 ' + level.target + ' 分';
    banner.classList.remove('show'); void banner.offsetWidth; banner.classList.add('show');
    state = 'intro'; introT = 2.2;
    KG.say('第' + (i + 1) + '關，' + level.intro);
  }

  function finish() {
    hud.classList.remove('show');
    const stars = score >= level.target * 1.5 ? 3 : score >= level.target ? 2 : 1;
    const best = KG.best('fishing-' + levelIndex, score);
    UI.result({
      stars,
      title: stars === 3 ? '大豐收！' : stars === 2 ? '釣得真好！' : '釣魚完成！',
      msg: '釣到 ' + catches + ' 樣寶貝，得到 <b>' + score + '</b> 分<br>目標 ' + level.target + ' 分・最高 ' + best + ' 分'
    });
  }

  function toMenu() {
    state = 'menu'; hud.classList.remove('show'); banner.classList.remove('show');
    level = LEVELS[0]; theme = THEMES.day; skin = SKINS[UI.item()];
    applyTheme();
    if (!fish.length) setupLevel();
  }

  /* ---------- 輸入 ---------- */
  cv.addEventListener('pointerdown', e => {
    if (state !== 'play' && state !== 'intro') return;
    e.preventDefault();
    holding = true; pointerX = e.clientX;
    try { cv.setPointerCapture(e.pointerId); } catch (err) { /* 忽略 */ }
    if (hook.y <= surfaceY + 22 && !hook.fish) KG.sound('whoosh');
  });
  cv.addEventListener('pointermove', e => { if (holding) pointerX = e.clientX; });
  const release = () => { holding = false; needRelease = false; };
  cv.addEventListener('pointerup', release);
  cv.addEventListener('pointercancel', release);
  window.addEventListener('keydown', e => {
    if (e.key === 'ArrowLeft') keyDir = -1;
    else if (e.key === 'ArrowRight') keyDir = 1;
    else if (e.key === ' ' || e.key === 'ArrowDown') { if (state === 'play') keyHold = true; }
    else return;
    e.preventDefault();
  });
  window.addEventListener('keyup', e => {
    if ((e.key === 'ArrowLeft' && keyDir < 0) || (e.key === 'ArrowRight' && keyDir > 0)) keyDir = 0;
    if (e.key === ' ' || e.key === 'ArrowDown') { keyHold = false; needRelease = false; }
  });
  window.addEventListener('blur', () => { holding = false; keyHold = false; keyDir = 0; });
  window.addEventListener('resize', resize);

  UI.init({
    slug: 'fishing', title: '快樂釣魚', subtitle: '按住放下魚鉤，釣起海裡的寶貝！',
    levels: LEVELS, items: SKINS, itemsTitle: '小貓的船', itemWord: '小船',
    drawMascot, drawItem, music: SONG,
    onPlay: startLevel, onMenu: toMenu, onItem: i => { skin = SKINS[i]; }
  });
  boat.x = innerWidth / 2;
  resize();
  toMenu();
  requestAnimationFrame(t => { last = t; frame(t); });
  UI.showTitle();
})();
</script>
</body>
</html>
