<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>3D 玩具火車</title>
<link rel="stylesheet" href="../../assets/common.css">
<style>
  html, body { height: 100%; overflow: hidden; background: #f3e3c6; }
  #gl { position: fixed; inset: 0; width: 100vw; height: 100vh; height: 100dvh; display: block; touch-action: none; outline: none; }
  #msg { position: fixed; inset: 0; display: grid; place-items: center; padding: 24px; text-align: center; font-size: 20px; font-weight: 800; color: #7a5230; }
  .hide { display: none !important; }
  .panel { background: rgba(255, 252, 244, 0.93); border: 3px solid #fff; border-radius: 20px; box-shadow: 0 5px 0 rgba(110, 70, 30, 0.16), 0 10px 22px rgba(110, 70, 30, 0.16); }
  .ui { position: fixed; z-index: 50; }
  .tb { width: 48px; height: 48px; border-radius: 16px; border: 3px solid #fff; background: linear-gradient(180deg, #fff 0%, #fdf0dc 100%);
    box-shadow: 0 5px 0 rgba(110, 70, 30, 0.18), 0 8px 18px rgba(110, 70, 30, 0.16); font-size: 22px; line-height: 1; display: grid; place-items: center;
    cursor: pointer; color: var(--kg-ink); padding: 0; font-family: var(--kg-font); transition: transform 0.1s ease, opacity 0.2s; }
  .tb:active { transform: scale(0.9); }
  .tb:disabled { opacity: 0.38; }
  .tb.on { background: linear-gradient(180deg, #ffe58a 0%, #f5b82e 100%); }
  /* 上方：建造／開火車切換 */
  #top { top: 10px; left: 50%; transform: translateX(-50%); display: flex; gap: 4px; padding: 4px; }
  .seg { display: flex; align-items: center; gap: 4px; height: 42px; padding: 0 14px; border-radius: 14px; border: 0; background: transparent;
    font: 800 16px var(--kg-font); color: var(--kg-ink); cursor: pointer; white-space: nowrap; }
  .seg svg { width: 22px; height: 22px; }
  .seg.on { background: linear-gradient(180deg, #ffe58a 0%, #f5b82e 100%); box-shadow: inset 0 -3px 0 rgba(0, 0, 0, 0.12); }
  .seg:active { transform: scale(0.94); }
  #side { top: 62px; right: 10px; display: flex; flex-direction: column; gap: 8px; }
  #side .tb { border-radius: 50%; }
  /* 任務面板 */
  #mpanel { top: 66px; left: 50%; transform: translateX(-50%); width: min(460px, calc(100vw - 132px)); padding: 7px 10px; display: flex; flex-direction: column; gap: 4px; }
  #mpanel .mt { display: flex; align-items: center; gap: 6px; font-weight: 900; font-size: 16px; }
  #mpanel .mt b { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #mpanel .mg { font-size: 13px; line-height: 1.35; color: #6a5040; }
  #mpanel .mr { display: flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 800; color: #7a6050; }
  #mpanel .mr span { flex: 1; min-width: 0; }
  #mpanel .mr .stars { flex: 0 0 auto; }
  .mini { border: 0; border-radius: 12px; padding: 7px 11px; font: 800 14px var(--kg-font); cursor: pointer; color: #fff; background: #46b864; box-shadow: 0 3px 0 #2f8a48; white-space: nowrap; }
  .mini.y { color: #6b4a00; background: linear-gradient(180deg, #ffe58a, #f5b82e); box-shadow: 0 3px 0 #c48a12; }
  .mini.b { background: #3a9ee8; box-shadow: 0 3px 0 #2672ad; }
  .mini.p { background: #ff8fb1; box-shadow: 0 3px 0 #c24470; }
  .mini:active { transform: translateY(2px); box-shadow: none; }
  .mini:disabled { opacity: 0.45; }
  #mchk { list-style: none; margin: 0; padding: 0; font-size: 13px; font-weight: 800; display: flex; flex-direction: column; gap: 2px; }
  #mchk li { display: flex; gap: 6px; align-items: center; }
  #mchk li i { font-style: normal; width: 18px; height: 18px; border-radius: 50%; display: grid; place-items: center; font-size: 12px; color: #fff; background: #c9b8a8; flex: 0 0 auto; }
  #mchk li.ok i { background: #46b864; }
  #mchk li.no i { background: #ff7a7a; }
  /* 下方工具列 */
  #dock { left: 0; right: 0; bottom: 0; display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 0 6px calc(8px + env(safe-area-inset-bottom)); pointer-events: none; }
  #dock > * { pointer-events: auto; }
  #tools, #pact { display: flex; gap: 4px; padding: 4px; }
  .tool { display: flex; flex-direction: column; align-items: center; justify-content: center; min-width: 52px; height: 50px; border-radius: 14px; border: 0;
    background: transparent; font: 800 12px var(--kg-font); color: var(--kg-ink); gap: 2px; cursor: pointer; padding: 0 4px; white-space: nowrap; }
  .tool .ic { font-size: 20px; line-height: 1; }
  .si { display: inline-block; width: 22px; height: 22px; vertical-align: -5px; flex: 0 0 auto; }
  .si svg { width: 100%; height: 100%; display: block; overflow: visible; }
  .tb .si { width: 26px; height: 26px; }
  .tool .si { width: 24px; height: 24px; }
  .kg-btn .si { width: 22px; height: 22px; vertical-align: -4px; filter: drop-shadow(0 1px 0 rgba(0,0,0,0.15)); }
  .mini .si { width: 16px; height: 16px; vertical-align: -3px; margin-right: 2px; }
  .star { color: #f5b82e; }
  .mc small .si { width: 14px; height: 14px; vertical-align: -2px; }
  .tool.on { background: linear-gradient(180deg, #ffe58a 0%, #f5b82e 100%); box-shadow: inset 0 -3px 0 rgba(0, 0, 0, 0.12); }
  .tool:active { transform: scale(0.92); }
  .tool:disabled { opacity: 0.35; }
  .sep { width: 2px; background: #eadbc4; border-radius: 2px; margin: 6px 2px; }
  #palw { display: flex; gap: 4px; padding: 4px; max-width: min(100%, 980px); align-items: stretch; }
  #tabs { display: flex; flex-direction: column; gap: 4px; flex: 0 0 auto; }
  .tab { border: 0; border-radius: 10px; padding: 0 8px; flex: 1; font: 800 13px var(--kg-font); cursor: pointer; background: #f4e7d2; color: #7a6050; writing-mode: horizontal-tb; }
  .tab.on { background: #ff8fb1; color: #fff; }
  #pal, #ptrains { display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; touch-action: pan-x; min-width: 0; }
  #pal::-webkit-scrollbar, #ptrains::-webkit-scrollbar { display: none; }
  .pc { flex: 0 0 auto; width: 58px; height: 64px; border-radius: 14px; border: 3px solid transparent; background: #fff; display: flex; flex-direction: column;
    align-items: center; justify-content: flex-start; padding: 0; font: 800 11px var(--kg-font); color: var(--kg-ink); cursor: pointer; transition: transform 0.12s; white-space: nowrap; }
  .pc img, .pc canvas { width: 46px; height: 46px; margin-top: 1px; pointer-events: none; }
  .pc.on { border-color: #ff8fb1; box-shadow: 0 3px 0 #ffc2d4; transform: translateY(-2px); }
  .pc:disabled { opacity: 0.35; }
  #ptrains .pc { width: 70px; }
  #ptrains .pc img, #ptrains .pc canvas { width: 62px; height: 46px; }
  #pdock { display: flex; flex-direction: column; align-items: center; gap: 6px; pointer-events: none; }
  #pdock > * { pointer-events: auto; }
  #ptw { padding: 4px; max-width: 100%; display: flex; }
  /* 選取時的小工具列 */
  #ctx { left: 50%; transform: translateX(-50%); bottom: 150px; display: flex; gap: 4px; padding: 4px; }
  #ctx .tool { min-width: 58px; }
  /* 提示泡泡（只有一個，不會疊在一起） */
  #bubble { left: 50%; top: 66px; transform: translateX(-50%); padding: 8px 16px; font-weight: 800; font-size: 15px; text-align: center; pointer-events: none;
    transition: opacity 0.35s, transform 0.35s; max-width: calc(100vw - 132px); line-height: 1.4; z-index: 60; }
  #bubble.off { opacity: 0; transform: translateX(-50%) translateY(-8px); }
  #bubble.bad { background: #fff0f0; color: #c0392b; }
  /* 選單 / 視窗 */
  .ov { position: fixed; inset: 0; z-index: 9000; display: none; place-items: center; padding: 64px 12px 12px; background: rgba(90, 55, 20, 0.32); backdrop-filter: blur(3px); }
  .ov.show { display: grid; animation: kg-fade 0.2s ease; }
  .card { width: min(460px, 100%); max-height: calc(100% - 4px); overflow: auto; background: linear-gradient(180deg, #fffdf6 0%, #fbefdc 100%); border: 5px solid #fff;
    border-radius: 28px; padding: 18px 16px; text-align: center; box-shadow: 0 18px 40px rgba(90, 55, 20, 0.35); animation: kg-pop 0.35s cubic-bezier(0.2, 1.6, 0.4, 1); }
  .card h2 { margin: 2px 0 10px; font-size: 26px; }
  .card p { margin: 0 0 12px; font-size: 16px; line-height: 1.5; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .grid2 .kg-btn { font-size: 17px; padding: 11px 8px; white-space: nowrap; }
  .x { position: sticky; top: 0; float: right; width: 38px; height: 38px; border-radius: 50%; border: 0; background: #ffe1ea; font-size: 18px; cursor: pointer; color: var(--kg-ink); margin: -6px -4px 0 0; z-index: 2; }
  #title { background: linear-gradient(180deg, rgba(255, 240, 210, 0) 40%, rgba(90, 55, 20, 0.28)); backdrop-filter: none; align-items: end; padding-bottom: calc(14px + env(safe-area-inset-bottom)); }
  #title .grid2 > :last-child:nth-child(odd) { grid-column: 1 / -1; }
  .logo { font-size: 42px; font-weight: 900; letter-spacing: 2px; line-height: 1.15; margin: 4px 0 6px; }
  .logo span { display: inline-block; padding: 2px 6px; margin: 2px; border-radius: 10px; color: #fff; text-shadow: 0 2px 0 rgba(0, 0, 0, 0.2);
    box-shadow: inset 0 -5px 0 rgba(0, 0, 0, 0.15), 0 4px 0 rgba(0, 0, 0, 0.12); animation: kg-bounce 1.6s ease-in-out infinite; }
  .stat { margin-top: 12px; font-weight: 800; color: #7a6050; font-size: 15px; }
  .tog { display: flex; gap: 8px; justify-content: center; margin-top: 12px; flex-wrap: wrap; }
  .tog button { border: 3px solid #fff; border-radius: 999px; padding: 7px 14px; font: 800 15px var(--kg-font); cursor: pointer; background: #f4e7d2; color: #7a6050; box-shadow: 0 3px 0 rgba(110, 70, 30, 0.15); }
  .tog button.on { background: #7bd88f; color: #fff; }
  .mgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(118px, 1fr)); gap: 8px; text-align: left; }
  .mc { border: 3px solid #eadbc4; border-radius: 16px; background: #fff; padding: 8px; cursor: pointer; font: 800 14px var(--kg-font); color: var(--kg-ink); display: flex; flex-direction: column; gap: 2px; min-height: 74px; }
  .mc:active { transform: scale(0.96); }
  .mc small { color: #9a8070; font-size: 12px; font-weight: 700; line-height: 1.3; }
  .mc .n { display: inline-grid; place-items: center; width: 24px; height: 24px; border-radius: 50%; background: #ffb347; color: #fff; font-size: 13px; margin-right: 4px; }
  .mc.lock { opacity: 0.45; cursor: default; }
  .stars { color: #f5b82e; letter-spacing: 1px; font-size: 14px; min-height: 18px; }
  .stars .off { color: #e2d6c6; }
  .slist { display: flex; flex-direction: column; gap: 8px; text-align: left; margin-top: 10px; }
  .slot { display: flex; align-items: center; gap: 10px; background: #fff; border: 3px solid #eadbc4; border-radius: 16px; padding: 6px; }
  .slot img, .slot .ph { width: 88px; height: 66px; border-radius: 10px; background: #e9f3d8; object-fit: cover; flex: 0 0 auto; }
  .slot .info { flex: 1; min-width: 0; font-weight: 800; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .slot .info small { display: block; color: #9a8070; font-weight: 700; font-size: 12px; }
  .slot .bt { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
  .acts { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-top: 12px; }
  .acts .kg-btn { font-size: 17px; padding: 11px 18px; }
  .bigstars { font-size: 40px; letter-spacing: 6px; margin: 2px 0 8px; }
  .bigstars span { display: inline-block; animation: kg-pop 0.5s cubic-bezier(0.2, 1.6, 0.4, 1) both; color: #f5b82e; }
  .bigstars span.off { color: #e2d6c6; }
  #rnIn { width: 100%; font: 800 26px var(--kg-font); text-align: center; border: 3px solid #eadbc4; border-radius: 16px; padding: 8px; -webkit-user-select: text; user-select: text; color: var(--kg-ink); }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; margin-top: 10px; }
  .chips button { border: 2px solid #eadbc4; background: #fff; border-radius: 12px; padding: 5px 10px; font: 800 14px var(--kg-font); cursor: pointer; color: var(--kg-ink); }
  @media (max-width: 380px) { .tool { min-width: 46px; font-size: 11px; } .seg { padding: 0 10px; font-size: 15px; } .pc { width: 54px; } }
  @media (orientation: landscape) and (max-height: 560px) {
    #dock { display: contents; }
    #tools, #pact { position: fixed; z-index: 50; bottom: calc(6px + env(safe-area-inset-bottom)); left: 50%; transform: translateX(-50%); }
    .tool { height: 46px; }
    #palw { position: fixed; z-index: 50; left: calc(8px + env(safe-area-inset-left)); top: 66px; bottom: 8px; flex-direction: column; max-width: none; width: 128px; }
    #tabs { flex-direction: row; }
    .tab { padding: 6px 4px; }
    #pal { display: grid; grid-template-columns: repeat(2, 56px); grid-auto-rows: 60px; overflow-y: auto; overflow-x: hidden; align-content: start; touch-action: pan-y; gap: 4px; flex: 1; }
    .pc { width: 56px; height: 60px; } .pc img, .pc canvas { width: 42px; height: 42px; }
    #pdock { display: contents; }
    #ptw { position: fixed; z-index: 50; left: calc(8px + env(safe-area-inset-left)); top: 66px; bottom: 8px; width: 86px; }
    #ptrains { flex-direction: column; overflow-y: auto; overflow-x: hidden; touch-action: pan-y; }
    #ptrains .pc { width: 72px; height: 62px; }
    #ctx { bottom: 64px; }
    #mpanel { top: 10px; left: auto; right: 66px; transform: none; width: min(300px, calc(100vw - 480px)); max-height: calc(100vh - 80px); overflow: auto; }
    #mpanel .mg { font-size: 12px; }
    #top { left: auto; right: auto; transform: none; left: 150px; }
    .ov { padding: 10px 70px; }
    .logo { font-size: 32px; } .card { padding: 12px 14px; } .card h2 { font-size: 22px; margin-bottom: 6px; }
    #title .card { width: min(620px, 100%); }
    #title .grid2 { grid-template-columns: repeat(3, 1fr); }
    #title .grid2 > :last-child:nth-child(odd) { grid-column: auto; }
    #title { align-items: center; padding-bottom: 10px; }
    .menu .grid2 { grid-template-columns: repeat(3, 1fr); }
    .card.wide { width: min(680px, 100%); }
  }
</style>
<script type="importmap">
{ "imports": { "three": "../../assets/vendor/three/three.module.min.js", "three/addons/": "../../assets/vendor/three/addons/" } }
</script>
</head>
<body>
<div id="msg">3D 玩具火車 載入中…</div>
<canvas id="gl" tabindex="0" aria-label="3D 玩具火車畫面"></canvas>

<div id="top" class="ui panel hide">
  <button class="seg on" id="mBuild"><i class="si" data-i="hammer"></i>建造</button>
  <button class="seg" id="mPlay"><i class="si" data-i="loco"></i>開火車</button>
</div>
<div id="side" class="ui hide">
  <button class="tb" id="bMenu" title="暫停選單 (Esc)" aria-label="暫停選單"><i class="si" data-i="menu"></i></button>
  <button class="tb" id="bCam" title="重設視角 (C)" aria-label="重設視角"><i class="si" data-i="frame"></i></button>
  <button class="tb" id="bFollow" title="跟車視角 (F)" aria-label="跟車視角"><i class="si" data-i="video"></i></button>
</div>
<div id="mpanel" class="ui panel hide">
  <div class="mt"><b id="mpName">任務</b><button class="mini b" id="mpSay" aria-label="念給我聽"><i class="si" data-i="speaker"></i></button><button class="mini" id="mpCheck"><i class="si" data-i="check"></i>檢查</button></div>
  <div class="mg" id="mpGoal"></div>
  <ul id="mchk"></ul>
  <div class="mr"><span id="mpUsed">用了 0 塊</span><span class="stars" id="mpPar"></span></div>
</div>
<div id="bubble" class="ui panel off"></div>
<div id="ctx" class="ui panel hide">
  <button class="tool" id="cRot"><i class="si" data-i="rotate"></i>轉向</button>
  <button class="tool" id="cSw"><i class="si" data-i="fork"></i>切換</button>
  <button class="tool" id="cName"><i class="si" data-i="pencil"></i>改站名</button>
  <button class="tool" id="cDel"><i class="si" data-i="trash"></i>拿掉</button>
</div>
<div id="dock" class="ui hide">
  <div id="tools" class="panel">
    <button class="tool on" data-tool="place"><i class="si" data-i="place"></i>放置</button>
    <button class="tool" data-tool="move"><i class="si" data-i="move"></i>移動</button>
    <button class="tool" data-tool="erase"><i class="si" data-i="erase"></i>擦除</button>
    <button class="tool" id="bRot"><i class="si" data-i="rotate"></i>轉向</button>
    <div class="sep"></div>
    <button class="tool" id="bUndo"><i class="si" data-i="undo"></i>復原</button>
    <button class="tool" id="bRedo"><i class="si" data-i="redo"></i>重做</button>
  </div>
  <div id="palw" class="panel">
    <div id="tabs"><button class="tab on" data-tab="track">鐵軌</button><button class="tab" data-tab="scen">風景</button></div>
    <div id="pal"></div>
  </div>
  <div id="pdock" class="hide">
    <div id="pact" class="panel">
      <button class="tool" id="pHonk"><i class="si" data-i="horn"></i>鳴笛</button>
      <button class="tool" id="pSpeed"><i class="si" data-i="speed1"></i>普通</button>
      <button class="tool" id="pPause"><i class="si" data-i="stop"></i>停車</button>
      <button class="tool" id="pRev"><i class="si" data-i="reverse"></i>倒車</button>
      <button class="tool" id="pClear"><i class="si" data-i="garage"></i>收車</button>
    </div>
    <div id="ptw" class="panel"><div id="ptrains"></div></div>
  </div>
</div>

<div id="title" class="ov show"><div class="card">
  <div class="logo" id="logo"></div>
  <p>鋪木頭鐵軌、蓋小車站，<br>讓蒸汽火車、區間車和糖廠小火車跑起來！</p>
  <div class="grid2">
    <button class="kg-btn green" data-act="free"><i class="si" data-i="hammer"></i> 自由建造</button>
    <button class="kg-btn yellow" data-act="missions"><i class="si" data-i="flag"></i> 任務挑戰</button>
    <button class="kg-btn blue" data-act="saves"><i class="si" data-i="folder"></i> 我的鐵道</button>
  </div>
  <div class="tog"><button data-act="music" class="tMusic">音樂 開</button><button data-act="sfx" class="tSfx">音效 開</button></div>
  <div class="stat">任務星星 <span class="star">★</span> <b id="tStars">0</b> / 45</div>
</div></div>

<div id="menu" class="ov menu"><div class="card">
  <button class="x" data-close aria-label="關閉">✕</button>
  <h2>暫停一下</h2>
  <p id="mInfo"></p>
  <div class="grid2">
    <button class="kg-btn green" data-act="resume"><i class="si" data-i="go"></i> 繼續</button>
    <button class="kg-btn yellow fo" data-act="save"><i class="si" data-i="disk"></i> 存起來</button>
    <button class="kg-btn blue fo" data-act="saves"><i class="si" data-i="folder"></i> 我的鐵道</button>
    <button class="kg-btn fo" data-act="clear"><i class="si" data-i="trash"></i> 全部清空</button>
    <button class="kg-btn mo" data-act="restart"><i class="si" data-i="rotate"></i> 重新開始</button>
    <button class="kg-btn yellow mo" data-act="missions"><i class="si" data-i="flag"></i> 任務列表</button>
    <button class="kg-btn blue" data-act="home"><i class="si" data-i="house"></i> 回標題</button>
  </div>
  <div class="tog"><button data-act="music" class="tMusic">音樂 開</button><button data-act="sfx" class="tSfx">音效 開</button></div>
</div></div>

<div id="missions" class="ov"><div class="card wide">
  <button class="x" data-close aria-label="關閉">✕</button>
  <h2>任務挑戰</h2>
  <p>照著任務鋪鐵軌，按「檢查」看看對不對。用的鐵軌越少，星星越多！</p>
  <div class="mgrid" id="mGrid"></div>
</div></div>

<div id="saves" class="ov"><div class="card wide">
  <button class="x" data-close aria-label="關閉">✕</button>
  <h2>我的鐵道</h2>
  <p>最多可以存 8 個鐵道。</p>
  <div class="slist" id="sList"></div>
</div></div>

<div id="rename" class="ov"><div class="card">
  <h2>幫車站取名字</h2>
  <input id="rnIn" maxlength="5" autocomplete="off" aria-label="站名">
  <div class="chips" id="rnChips"></div>
  <div class="acts"><button class="kg-btn blue" id="rnNo">取消</button><button class="kg-btn green" id="rnYes">好了</button></div>
</div></div>

<div id="confirm" class="ov"><div class="card">
  <h2 id="cfTitle">確定嗎？</h2>
  <p id="cfMsg"></p>
  <div class="acts"><button class="kg-btn blue" id="cfNo">取消</button><button class="kg-btn green" id="cfYes">好</button></div>
</div></div>

<div id="done" class="ov"><div class="card">
  <div class="bigstars" id="dStars"></div>
  <h2 id="dTitle">任務完成！</h2>
  <p id="dMsg"></p>
  <div class="acts">

<script type="module">
import * as THREE from 'three';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';

const $ = (id) => document.getElementById(id);
let renderer = null;
try {
  renderer = new THREE.WebGLRenderer({ canvas: $('gl'), antialias: true, powerPreference: 'high-performance' });
} catch (e) { renderer = null; }
if (!renderer) $('msg').textContent = '這個遊戲需要支援 3D（WebGL）的瀏覽器，請換一個瀏覽器或裝置再試試看。';
else main();

function main() {
  const SLUG = 'toy-train';
  const cv = $('gl');
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const lerp = (a, b, t) => a + (b - a) * t;
  const TAU = Math.PI * 2;
  const S = 2;            // 一格的寬度
  const LH = 0.9;         // 高架一層的高度
  const RAIL = 0.16;      // 木軌上緣
  const DX = [0, 1, 0, -1], DZ = [-1, 0, 1, 0];   // 0 北 1 東 2 南 3 西
  const small = Math.min(innerWidth, innerHeight) < 560;
  const Save = { get: (k, d) => KG.store.get(SLUG + ':' + k, d), set: (k, v) => KG.store.set(SLUG + ':' + k, v) };

  /* =========================================================
   * 場景、燈光、相機
   * ========================================================= */
  const scene = new THREE.Scene();
  const BG = new THREE.Color(0xf6e5c8);
  scene.background = BG;
  scene.fog = new THREE.Fog(0xf6e5c8, 70, 160);
  const camera = new THREE.PerspectiveCamera(38, 1, 0.3, 320);
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFShadowMap;
  const hemi = new THREE.HemisphereLight(0xfff4e2, 0xa98a66, 1.7);
  scene.add(hemi);
  const sun = new THREE.DirectionalLight(0xfff1dc, 2.3);
  sun.position.set(12, 26, 9);
  sun.castShadow = true;
  sun.shadow.mapSize.set(2048, 2048);
  sun.shadow.bias = -0.0008;
  sun.shadow.normalBias = 0.03;
  scene.add(sun); scene.add(sun.target);
  function fitShadow(w, h) {
    const r = Math.hypot(w, h) * S * 0.5 + 3;
    const c = sun.shadow.camera;
    c.left = -r; c.right = r; c.top = r; c.bottom = -r; c.near = 1; c.far = 80;
    c.updateProjectionMatrix();
  }

  /* =========================================================
   * 幾何小工具：全部合併成一個有頂點顏色的網格（少 draw call）
   * ========================================================= */
  const _c = new THREE.Color();
  function P(geo, col) {
    let g = geo.index ? geo.toNonIndexed() : geo;
    if (!g.attributes.normal) g.computeVertexNormals();
    const n = g.attributes.position.count, arr = new Float32Array(n * 3);
    _c.set(col);
    for (let i = 0; i < n; i++) { arr[i * 3] = _c.r; arr[i * 3 + 1] = _c.g; arr[i * 3 + 2] = _c.b; }
    g.setAttribute('color', new THREE.BufferAttribute(arr, 3));
    return g;
  }
  function merge(parts) {
    let n = 0;
    parts.forEach(g => { n += g.attributes.position.count; });
    const pos = new Float32Array(n * 3), nor = new Float32Array(n * 3), col = new Float32Array(n * 3);
    let o = 0;
    parts.forEach(g => {
      pos.set(g.attributes.position.array, o * 3);
      nor.set(g.attributes.normal.array, o * 3);
      col.set(g.attributes.color.array, o * 3);
      o += g.attributes.position.count;
    });
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
    g.setAttribute('normal', new THREE.BufferAttribute(nor, 3));
    g.setAttribute('color', new THREE.BufferAttribute(col, 3));
    g.computeBoundingSphere(); g.computeBoundingBox();
    return g;
  }
  const box = (w, h, d, x, y, z, col) => P(new THREE.BoxGeometry(w, h, d).translate(x, y, z), col);
  const rbox = (w, h, d, x, y, z, col, r = 0.06) => P(new RoundedBoxGeometry(w, h, d, 2, Math.min(r, w / 2.1, h / 2.1, d / 2.1)).translate(x, y, z), col);
  const cyl = (rt, rb, h, x, y, z, col, seg = 12) => P(new THREE.CylinderGeometry(rt, rb, h, seg).translate(x, y, z), col);
  const cylX = (r, len, x, y, z, col, seg = 12) => P(new THREE.CylinderGeometry(r, r, len, seg).rotateZ(Math.PI / 2).translate(x, y, z), col);
  const cylZ = (r, len, x, y, z, col, seg = 12) => P(new THREE.CylinderGeometry(r, r, len, seg).rotateX(Math.PI / 2).translate(x, y, z), col);
  const sph = (r, x, y, z, col, sx = 1, sy = 1, sz = 1, ws = 10, hs = 7) => P(new THREE.SphereGeometry(r, ws, hs).scale(sx, sy, sz).translate(x, y, z), col);
  const cone = (r, h, x, y, z, col, seg = 10) => P(new THREE.ConeGeometry(r, h, seg).translate(x, y, z), col);
  const rotY = (g, a) => g.rotateY(a);
  // 自己組三角形：給一個「希望朝外」的方向，自動修正繞向
  function tris(list, col) {
    const pos = [], nor = [];
    const a = new THREE.Vector3(), b = new THREE.Vector3(), c = new THREE.Vector3(), u = new THREE.Vector3(), v = new THREE.Vector3();
    list.forEach(t => {
      a.fromArray(t[0]); b.fromArray(t[1]); c.fromArray(t[2]);
      u.subVectors(b, a); v.subVectors(c, a); u.cross(v);
      if (u.lengthSq() < 1e-12) return;
      if (t[3] && u.x * t[3][0] + u.y * t[3][1] + u.z * t[3][2] < 0) { const tmp = b.clone(); b.copy(c); c.copy(tmp); u.negate(); }
      u.normalize();
      pos.push(a.x, a.y, a.z, b.x, b.y, b.z, c.x, c.y, c.z);
      for (let k = 0; k < 3; k++) nor.push(u.x, u.y, u.z);
    });
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
    g.setAttribute('normal', new THREE.Float32BufferAttribute(nor, 3));
    return P(g, col);
  }
  const quad = (p0, p1, p2, p3, n) => [[p0, p1, p2, n], [p0, p2, p3, n]];
  // 三角屋頂（屋脊沿 x）
  function prism(w, h, d, x, y, z, col) {
    const L = [], hw = w / 2, hd = d / 2;
    L.push(...quad([x - hw, y, z + hd], [x + hw, y, z + hd], [x + hw, y + h, z], [x - hw, y + h, z], [0, hd, h]));
    L.push(...quad([x - hw, y, z - hd], [x + hw, y, z - hd], [x + hw, y + h, z], [x - hw, y + h, z], [0, hd, -h]));
    L.push([[x - hw, y, z - hd], [x - hw, y, z + hd], [x - hw, y + h, z], [-1, 0, 0]]);
    L.push([[x + hw, y, z - hd], [x + hw, y, z + hd], [x + hw, y + h, z], [1, 0, 0]]);
    L.push(...quad([x - hw, y, z - hd], [x + hw, y, z - hd], [x + hw, y, z + hd], [x - hw, y, z + hd], [0, -1, 0]));
    return tris(L, col);
  }
  // 沿著路徑長出來的帶子（木軌、凹槽、欄杆）
  function ribbon(pts, o0, o1, yT, yB, colTop, colSide, caps, absBottom) {
    const n = pts.length, top = [], side = [];
    const lat = pts.map((p, i) => {
      const a = pts[Math.max(0, i - 1)], b = pts[Math.min(n - 1, i + 1)];
      const tx = b[0] - a[0], tz = b[2] - a[2], l = Math.hypot(tx, tz) || 1;
      return [-tz / l, tx / l, tx / l, tz / l];
    });
    const at = (i, o, y) => [pts[i][0] + lat[i][0] * o, (absBottom && y === yB ? 0 : pts[i][1]) + y, pts[i][2] + lat[i][1] * o];
    for (let i = 0; i < n - 1; i++) {
      top.push(...quad(at(i, o0, yT), at(i + 1, o0, yT), at(i + 1, o1, yT), at(i, o1, yT), [0, 1, 0]));
      if (colSide != null) {
        const n0 = [-lat[i][0], 0, -lat[i][1]], n1 = [lat[i][0], 0, lat[i][1]];
        side.push(...quad(at(i, o0, yT), at(i + 1, o0, yT), at(i + 1, o0, yB), at(i, o0, yB), o0 < o1 ? n0 : n1));
        side.push(...quad(at(i, o1, yT), at(i + 1, o1, yT), at(i + 1, o1, yB), at(i, o1, yB), o0 < o1 ? n1 : n0));
      }
    }
    if (caps && colSide != null) {
      const e = [[0, -1], [n - 1, 1]];
      e.forEach(([i, s]) => side.push(...quad(at(i, o0, yT), at(i, o1, yT), at(i, o1, yB), at(i, o0, yB), [lat[i][2] * s, 0, lat[i][3] * s])));
    }
    const out = [tris(top, colTop)];
    if (side.length) out.push(tris(side, colSide));
    return out;
  }

  /* =========================================================
   * 鐵軌零件：每種零件的路徑（本地座標，格子中心為原點，半格 = 1）
   * ========================================================= */
  const T = { STR: 1, CUR: 2, SW: 3, BRI: 4, TUN: 5, CRS: 6, SLP: 7, PLAT: 8, BUF: 9 };
  const PIECES = [
    null,
    { name: '直鐵軌', paths: [[3, 1]], elev: 1 },
    { name: '彎鐵軌', paths: [[2, 1]], elev: 1 },
    { name: '岔路', paths: [[3, 1], [3, 0]], elev: 1 },
    { name: '小橋', paths: [[3, 1]] },
    { name: '山洞', paths: [[3, 1]] },
    { name: '十字軌', paths: [[3, 1], [0, 2]], elev: 1 },
    { name: '坡道', paths: [[3, 1, 0, 1]] },
    { name: '月台', paths: [[3, 1]], elev: 1 },
    { name: '終點擋', paths: [[3, -1]], elev: 1 }
  ];
  const smooth = t => t * t * (3 - 2 * t);
  function makePath(a, b, ha, hb) {
    const pts = [];
    const ep = e => [DX[e], 0, DZ[e]];
    if (b === -1) {
      const p0 = ep(a);
      for (let i = 0; i <= 2; i++) { const t = i / 2; pts.push([lerp(p0[0], -DX[a] * 0.36, t), 0, lerp(p0[2], -DZ[a] * 0.36, t)]); }
    } else if ((a + 2) % 4 === b) {
      const p0 = ep(a), p1 = ep(b), N = ha !== hb ? 14 : 2;
      for (let i = 0; i <= N; i++) { const t = i / N; pts.push([lerp(p0[0], p1[0], t), (ha + (hb - ha) * smooth(t)) * LH, lerp(p0[2], p1[2], t)]); }
    } else {
      const pa = ep(a), pb = ep(b), cx = pa[0] + pb[0], cz = pa[2] + pb[2];
      const ta = Math.atan2(pa[2] - cz, pa[0] - cx);
      let tb = Math.atan2(pb[2] - cz, pb[0] - cx), d = tb - ta;
      while (d > Math.PI) d -= TAU; while (d < -Math.PI) d += TAU;
      for (let i = 0; i <= 12; i++) { const t = ta + d * i / 12; pts.push([cx + Math.cos(t), 0, cz + Math.sin(t)]); }
    }
    return { a, b, ha: ha || 0, hb: hb || 0, pts };
  }
  const rotPt = (p, r) => { let x = p[0], z = p[2]; for (let i = 0; i < r; i++) { const t = x; x = -z; z = t; } return [x, p[1], z]; };
  const rotE = (e, r) => e < 0 ? e : (e + r) % 4;
  // PATHS[type][rot] = [{a,b,ha,hb,pts}]
  const PATHS = PIECES.map(pc => pc ? [0, 1, 2, 3].map(r => pc.paths.map(p => {
    const lp = makePath(p[0], p[1], p[2] || 0, p[3] || 0);
    return { a: rotE(lp.a, r), b: rotE(lp.b, r), ha: lp.ha, hb: lp.hb, pts: lp.pts.map(q => rotPt(q, r)) };
  })) : null);

  /* ---------- 顏色 ---------- */
  const C = {
    wood: 0xecc893, woodS: 0xd2a062, groove: 0xa06c38, woodD: 0xb8834a, red: 0xe2473b, redD: 0xb8322a, white: 0xfbf6ec, cream: 0xf3e3c2,
    black: 0x34343c, gray: 0x9a9da4, grayL: 0xcfccc4, grayD: 0x5d6068, yellow: 0xffcf3a, green: 0x5fae4a, greenD: 0x3f8a3a, leaf: 0x6cc24f,
    brown: 0x8a5a36, blue: 0x3a8fd8, teal: 0x22a8a0, skin: 0xffd2a6, hair: 0x3b2a22, pink: 0xff9fb6, orange: 0xff9a2e, brick: 0xbc5a3e, roof: 0x55606c
  };

  /* ---------- 鐵軌幾何 ---------- */
  function bed(path, dy = 0, out) {
    const pts = path.pts.map(p => [p[0], p[1] + dy, p[2]]);
    out.push(...ribbon(pts, -0.56, 0.56, RAIL, 0, C.wood, C.woodS, true, path.ha !== path.hb));
    out.push(...ribbon(pts, -0.29, -0.19, RAIL + 0.003, RAIL, C.groove, null));
    out.push(...ribbon(pts, 0.19, 0.29, RAIL + 0.003, RAIL, C.groove, null));
    return out;
  }
  function pieceGeo(type) {
    const ps = PATHS[type][0], out = [];
    if (type === T.BUF) {
      bed({ pts: [[-1, 0, 0], [0.66, 0, 0]], ha: 0, hb: 0 }, 0, out);
      out.push(rbox(0.26, 0.42, 1.0, 0.62, 0.37, 0, C.red, 0.06), box(0.27, 0.06, 1.01, 0.62, 0.5, 0, C.white));
      out.push(cylX(0.08, 0.16, 0.44, 0.42, -0.24, C.grayD), cylX(0.08, 0.16, 0.44, 0.42, 0.24, C.grayD));
      out.push(cylX(0.11, 0.04, 0.36, 0.42, -0.24, C.black), cylX(0.11, 0.04, 0.36, 0.42, 0.24, C.black));
      return merge(out);
    }
    ps.forEach((p, i) => bed(p, i * 0.004, out));
    if (type === T.SW) {
      out.push(box(0.3, 0.14, 0.24, -0.45, 0.07, 0.8, C.grayD), box(0.05, 0.36, 0.05, -0.45, 0.3, 0.8, C.black), sph(0.07, -0.45, 0.5, 0.8, C.red));
    } else if (type === T.BRI) {
      const st = ps[0].pts;
      [-1, 1].forEach(s => {
        out.push(...ribbon(st, s * 0.56, s * 0.66, 0.5, -0.06, C.red, C.redD, true));
        for (let k = -2; k <= 2; k++) out.push(box(0.08, 0.36, 0.08, k * 0.42, 0.33, s * 0.61, C.white));
        out.push(box(1.98, 0.06, 0.12, 0, 0.53, s * 0.61, C.white));
      });
      out.push(box(0.36, 0.3, 1.24, -0.82, -0.1, 0, C.grayL), box(0.36, 0.3, 1.24, 0.82, -0.1, 0, C.grayL));
    } else if (type === T.TUN) {
      out.push(P(new THREE.CylinderGeometry(1, 1, 1.7, 18, 1, false, Math.PI, Math.PI).rotateZ(-Math.PI / 2).scale(1, 1.42, 0.98), C.green));
      out.push(sph(0.5, 0.25, 1.25, -0.2, C.leaf, 1, 0.8, 1), sph(0.42, -0.35, 1.18, 0.25, C.greenD, 1, 0.8, 1), sph(0.22, 0.45, 1.05, 0.55, C.gray, 1, 0.8, 1));
      [-1, 1].forEach(s => {
        const x = s * 0.86;
        // 石頭拱門＋黑洞
        const L = [];
        const seg = 10, r0 = 0.5, r1 = 0.66;
        for (let i = 0; i < seg; i++) {
          const a0 = Math.PI * i / seg, a1 = Math.PI * (i + 1) / seg;
          L.push(...quad([x + s * 0.01, 0.62 + Math.sin(a0) * r0, Math.cos(a0) * r0], [x + s * 0.01, 0.62 + Math.sin(a1) * r0, Math.cos(a1) * r0],
            [x + s * 0.01, 0.62 + Math.sin(a1) * r1, Math.cos(a1) * r1], [x + s * 0.01, 0.62 + Math.sin(a0) * r1, Math.cos(a0) * r1], [s, 0, 0]));
        }
        L.push(...quad([x + s * 0.01, 0, -r1], [x + s * 0.01, 0.62, -r1], [x + s * 0.01, 0.62, -r0], [x + s * 0.01, 0, -r0], [s, 0, 0]));
        L.push(...quad([x + s * 0.01, 0, r0], [x + s * 0.01, 0.62, r0], [x + s * 0.01, 0.62, r1], [x + s * 0.01, 0, r1], [s, 0, 0]));
        out.push(tris(L, C.grayL));
        const H = [];
        for (let i = 0; i < seg; i++) {
          const a0 = Math.PI * i / seg, a1 = Math.PI * (i + 1) / seg;
          H.push([[x + s * 0.005, 0.62, 0], [x + s * 0.005, 0.62 + Math.sin(a0) * r0, Math.cos(a0) * r0], [x + s * 0.005, 0.62 + Math.sin(a1) * r0, Math.cos(a1) * r0], [s, 0, 0]]);
        }
        H.push(...quad([x + s * 0.005, RAIL + 0.004, -r0], [x + s * 0.005, 0.62, -r0], [x + s * 0.005, 0.62, r0], [x + s * 0.005, RAIL + 0.004, r0], [s, 0, 0]));
        out.push(tris(H, 0x1c1a22));
      });
    } else if (type === T.SLP) {
      out.push(box(0.5, 0.06, 1.12, 0.75, LH + 0.0, 0, C.woodD));
    } else if (type === T.PLAT) {
      out.push(rbox(1.96, 0.34, 0.42, 0, 0.17, -0.8, C.grayL, 0.04), box(1.96, 0.012, 0.07, 0, 0.346, -0.62, C.yellow));
      out.push(cyl(0.04, 0.04, 0.9, -0.62, 0.79, -0.86, C.greenD, 6), cyl(0.04, 0.04, 0.9, 0.62, 0.79, -0.86, C.greenD, 6));
      out.push(rbox(1.7, 0.06, 0.56, 0, 1.25, -0.84, C.teal, 0.03));
      out.push(box(0.5, 0.05, 0.16, 0, 0.5, -0.93, C.brown), box(0.05, 0.16, 0.05, -0.2, 0.42, -0.93, C.brown), box(0.05, 0.16, 0.05, 0.2, 0.42, -0.93, C.brown));
    }
    return merge(out);
  }
  const PGEO = PIECES.map((p, i) => p ? pieceGeo(i) : null);
  const pillarGeo = merge([rbox(0.5, LH, 0.5, 0, LH / 2, 0, C.woodD, 0.05), box(0.62, 0.06, 0.62, 0, LH - 0.03, 0, C.woodS)]);
  const swGeo = [0, 1].map(k => merge(ribbon(PATHS[T.SW][0][k].pts.slice(k ? 2 : 0, k ? 11 : undefined).map(p => [p[0] * (k ? 1 : 0.8), p[1], p[2]]), -0.05, 0.05, RAIL + 0.012, RAIL, 0xffd23f, null)));

  /* ---------- 風景 ---------- */
  const SC = { TREE: 1, HOUSE: 2, MOUNT: 3, RIVER: 4, COW: 5, XING: 6, STATION: 7, MINE: 8, CANE: 9, FACT: 10 };
  const SCEN = [null,
    { name: '大樹' }, { name: '小房子' }, { name: '小山' }, { name: '小河' }, { name: '乳牛' },
    { name: '平交道' }, { name: '車站' }, { name: '礦場' }, { name: '甘蔗田' }, { name: '糖廠' }];
  function scenGeo(t) {
    const o = [];
    if (t === SC.TREE) {
      o.push(cyl(0.1, 0.15, 0.8, 0, 0.4, 0, C.brown, 7), sph(0.58, 0, 1.12, 0, C.leaf), sph(0.42, 0.3, 1.38, 0.12, C.green), sph(0.4, -0.28, 1.3, -0.14, 0x7ccf5a));
      o.push(sph(0.08, 0.35, 1.05, 0.45, C.red), sph(0.07, -0.42, 1.2, 0.3, C.red));
    } else if (t === SC.HOUSE) {
      o.push(box(1.3, 0.8, 1.05, 0, 0.4, 0, C.cream), prism(1.5, 0.55, 1.3, 0, 0.8, 0, C.red));
      o.push(box(0.3, 0.5, 0.04, 0, 0.25, 0.53, C.brown), box(0.28, 0.24, 0.04, -0.42, 0.45, 0.53, C.blue), box(0.28, 0.24, 0.04, 0.42, 0.45, 0.53, C.blue));
      o.push(box(0.18, 0.4, 0.18, 0.4, 1.05, -0.2, C.brick));
    } else if (t === SC.MOUNT) {
      o.push(cone(0.98, 1.7, 0, 0.85, 0, C.green, 9), cone(0.42, 0.62, 0, 1.4, 0, 0x8ac46a, 9), sph(0.3, 0.5, 0.25, 0.45, C.gray, 1, 0.7, 1), sph(0.26, -0.55, 0.2, -0.3, C.grayL, 1, 0.7, 1));
      o.push(cone(0.55, 0.9, 0.6, 0.45, -0.5, C.greenD, 8));

  // 存檔的小縮圖：用 2D 畫出俯視的小地圖
  function thumb() {
    const c = document.createElement('canvas'); c.width = 160; c.height = 120;
    const g = c.getContext('2d');
    g.fillStyle = '#d6a873'; g.fillRect(0, 0, 160, 120);
    const cs = Math.min(150 / L.w, 110 / L.h), ox = (160 - cs * L.w) / 2, oy = (120 - cs * L.h) / 2;
    g.fillStyle = '#9fd27a'; g.fillRect(ox, oy, cs * L.w, cs * L.h);
    const SCOL = { [SC.TREE]: '#4caf50', [SC.HOUSE]: '#e2473b', [SC.MOUNT]: '#4f9a3f', [SC.COW]: '#ffffff', [SC.STATION]: '#4d5866', [SC.MINE]: '#9a8470', [SC.CANE]: '#7f9e3a', [SC.FACT]: '#bc5a3e' };
    for (let cc = 0; cc < L.t.length; cc++) {
      const x = ox + cX(cc) * cs, y = oy + cY(cc) * cs, st = sT(cc);
      if (st === SC.RIVER) { g.fillStyle = '#5cc2ec'; g.fillRect(x, y, cs + 0.5, cs + 0.5); }
      else if (st && st !== SC.XING) {
        g.fillStyle = SCOL[st] || '#888';
        if (st === SC.TREE || st === SC.COW) { g.beginPath(); g.arc(x + cs / 2, y + cs / 2, cs * (st === SC.COW ? 0.22 : 0.34), 0, TAU); g.fill(); }
        else if (st === SC.MOUNT) { g.beginPath(); g.moveTo(x + cs / 2, y + cs * 0.1); g.lineTo(x + cs * 0.92, y + cs * 0.9); g.lineTo(x + cs * 0.08, y + cs * 0.9); g.fill(); }
        else g.fillRect(x + cs * 0.15, y + cs * 0.15, cs * 0.7, cs * 0.7);
      }
    }
    g.lineCap = 'round'; g.lineWidth = Math.max(2, cs * 0.34);
    for (let cc = 0; cc < L.t.length; cc++) {
      const t = tT(cc); if (!t) continue;
      const x = ox + cX(cc) * cs + cs / 2, y = oy + cY(cc) * cs + cs / 2;
      g.strokeStyle = t === T.BRI ? '#e2473b' : t === T.TUN ? '#3f8a3a' : tLv(cc) ? '#8a5a2a' : '#b8834a';
      PATHS[t][tR(cc)].forEach(p => { g.beginPath(); p.pts.forEach((q, i) => { const px = x + q[0] * cs / 2, py = y + q[2] * cs / 2; if (i) g.lineTo(px, py); else g.moveTo(px, py); }); g.stroke(); });
    }
    return c.toDataURL('image/png');
  }

      const b = document.createElement('button'), st = mStars[i] || 0, open = unlocked(i);
      b.className = 'mc' + (open ? '' : ' lock');
      b.innerHTML = '<div><span class="n">' + (i + 1) + '</span>' + escH(m.name) + '</div><div class="stars">' + [0, 1, 2].map(k => '<span class="' + (k < st ? '' : 'off') + '">★</span>').join('') + '</div><small>' + (open ? escH(m.goal.slice(0, 18)) + (m.goal.length > 18 ? '…' : '') : siH('lock') + ' 先完成上一關') + '</small>';
      b.addEventListener('click', () => { if (!open) { sfx('deny'); return; } sfx('select'); startMission(i); });
      g.appendChild(b);
    });
  }
  function loadLayout(lay) {
    loading = true;
    L = lay; buildBoard(L.w, L.h);
    sel = -1; anims.length = 0; trains = []; people.length = 0; parked = [];
    changed();
    loading = false;
  }
  let parked = [];
  function setPhase(p, quiet) {
    if (p === phase) return;
    if (p === 'play') {
      select(-1); ghost.visible = false; moving = null;
      buildGraph();
      phase = 'play';
      trains = []; people.length = 0;
      platforms.forEach(c => { spawnWaiting(c); spawnWaiting(c); });
      const list = parked.length ? parked : (segs.length ? ['steam'] : []);
      list.forEach(k => placeTrain(k, null, true));
      parked = [];
      if (!segs.length) say('還沒有鐵軌喔，先到「建造」鋪鐵軌吧！', true, 2400);
      else say('點火車會鳴笛、點岔路換方向、點貨車裝卸貨', false, 2400);
    } else if (p === 'build') {
      parked = trains.map(t => t.kind);
      trains = []; people.length = 0; setFollow(null);
      phase = 'build';
      if (!quiet) say(mission ? '繼續鋪鐵軌，好了按「檢查」' : '選一塊鐵軌，點地墊放上去', false, 1800);
    } else phase = p;
    musicFor(phase);
    updUI(); layout(); placeBubble();
    if (p === 'play') fitTrack(false);
    if (!quiet) { jingle('mode'); }
  }
  function startFree(lay) {
    mission = null; missionIdx = -1;
    closeAllOv();
    phase = 'none';
    loadLayout(lay || decodeL(Save.get('cur', null)) || starterLayout());
    if (lay) Save.set('cur', encodeL());
    hist.length = 0; redoS.length = 0;
    pal = { cat: 'track', t: T.STR }; tool = 'place'; curRot = 0;
    buildPalette(); setTool('place');
    setPhase('build', true);
    fitTrack(true);
    say('選一塊鐵軌，點地墊放上去；按「開火車」讓火車跑！', false, 2600);
  }
  function startMission(i) {
    const m = MISSIONS[i];
    mission = m; missionIdx = i;
    closeAllOv();
    phase = 'none';
    loadLayout(missionLayout(m));
    hist.length = 0; redoS.length = 0;
    pal = { cat: 'track', t: m.allow[0] }; tool = 'place'; curRot = 0;
    buildPalette(); setTool('place');
    updMissionPanel(true);
    setPhase('build', true);
    layout(); resetCam(true);
    say('第 ' + (i + 1) + ' 關：' + m.name, false, 1600);
    jingle('mode');
  }
  function updMissionPanel(reset) {
    if (!mission) return;
    $('mpName').textContent = '第' + (missionIdx + 1) + '關 ' + mission.name;
    $('mpGoal').textContent = mission.goal;
    const used = usedPieces(), st = starsFor(mission, used);
    $('mpUsed').textContent = '用了 ' + used + ' 塊（' + mission.par + ' 塊以內 ★★★）';
    $('mpPar').innerHTML = [0, 1, 2].map(k => '<span class="' + (k < st ? '' : 'off') + '">★</span>').join('');
    if (reset || !$('mchk').children.length) $('mchk').innerHTML = mission.conds.map(cd => '<li><i>?</i>' + escH(cd.label) + '</li>').join('');
    else [...$('mchk').children].forEach(li => { li.className = ''; li.querySelector('i').textContent = '?'; });
  }
  function checkMission() {
    if (!mission) return;
    buildGraph();
    const res = mission.conds.map(evalCond);
    [...$('mchk').children].forEach((li, i) => { li.className = res[i] ? 'ok' : 'no'; li.querySelector('i').textContent = res[i] ? '✓' : '✗'; });
    layout();
    if (res.every(Boolean)) {
      const used = usedPieces(), st = starsFor(mission, used);
      if (st > (mStars[missionIdx] || 0)) { mStars[missionIdx] = st; Save.set('stars', mStars); }
      jingle('win');
      KG.confetti(); KG.vibrate(40);
      setTimeout(() => showDone(st, used), 950);
      return true;
    }
    jingle('fail');
    const k = res.indexOf(false);
    say('還差一點：' + mission.conds[k].label, true, 2400);
    const oe = openEnds();
    if (oe.length) flashBad = { c: oe[0].c, t: 0.9 };
    return false;
  }
  function showDone(st, used) {
    $('dStars').innerHTML = [0, 1, 2].map(k => '<span class="' + (k < st ? '' : 'off') + '" style="animation-delay:' + (0.15 + k * 0.15) + 's">★</span>').join('');
    $('dTitle').textContent = '任務完成！';
    $('dMsg').textContent = '用了 ' + used + ' 塊' + (st < 3 ? '，' + mission.par + ' 塊以內可以拿 3 顆星喔！' : '，最少的塊數，太厲害了！');
    $('dNext').classList.toggle('hide', missionIdx >= MISSIONS.length - 1);
    openOv('done');
  }
  $('dRun').addEventListener('click', () => {
    closeAllOv();
    const m = mission;
    parked = [];
    setPhase('play', true);
    trains.slice().forEach(removeTrain);
    const at = m.runAt ? segByCell[cid(m.runAt[0], m.runAt[1])] : null;
    const tr = placeTrain(m.run || 'steam', at ? at[0] : null, true);
    if (tr) honk(tr);
    say(m.run === 'sugar' ? '點岔路，讓糖廠小火車去甘蔗田載甘蔗！' : '火車出發囉！', false, 2600);
  });
  $('dNext').addEventListener('click', () => { sfx('select'); startMission(Math.min(MISSIONS.length - 1, missionIdx + 1)); });
  $('dList').addEventListener('click', () => { sfx('select'); closeAllOv(); renderMissions(); openOv('missions'); });
  $('mpCheck').addEventListener('click', () => { sfx('ui'); checkMission(); });
  $('mpSay').addEventListener('click', () => {
    if (!mission) return;
    const text = '第' + (missionIdx + 1) + '關，' + mission.name + '。' + mission.goal;
    if (KG.music && curSong) { KG.music.setVolume(curSong.vol * 0.3); setTimeout(() => { if (curSong) KG.music.setVolume(curSong.vol); }, 900 + text.length * 240); }
    KG.say(text);
  });

  /* ---------- 標題 ---------- */
  function goTitle() {
    mission = null; missionIdx = -1;
    closeAllOv();
    phase = 'none';
    loadLayout(starterLayout());
    setPhase('title', true);
    platforms.forEach(c => { spawnWaiting(c); spawnWaiting(c); });
    const top = segByCell[cid(5, 3)], bot = segByCell[cid(8, 8)];
    placeTrain('steam', top ? top[0] : null, true);
    placeTrain('emu', bot ? bot[0] : null, true);
    resetCam(true);
    cam.dist = camGoal.dist = fitDist() * 0.82; cam.pitch = camGoal.pitch = 0.62;
    $('tStars').textContent = totalStars();
    openOv('title');
    updUI();
  }
  function onAct(act) {
    if (act === 'free') { sfx('select'); startFree(); }
    else if (act === 'missions') { sfx('select'); if (phase !== 'title') closeAllOv(); renderMissions(); openOv('missions'); }
    else if (act === 'saves') { sfx('select'); renderSaves(); openOv('saves'); }
    else if (act === 'music') { if (KG.music) KG.music.setEnabled(!KG.music.isEnabled()); if (KG.music && KG.music.isEnabled() && paused) KG.music.pause(); sfx('ui'); updUI(); }
    else if (act === 'sfx') { sfxOn = !sfxOn; Save.set('sfx', sfxOn); sfx('ui'); updUI(); }
    else if (act === 'resume') { closeOv(); sfx('select'); }
    else if (act === 'save') { renderSaves(); openOv('saves'); sfx('select'); }
    else if (act === 'clear') confirmBox('全部清空？', '地墊上的鐵軌和風景都會拿掉（可以按復原救回來）。', () => { pushHist(); L.t.fill(0); L.s.fill(0); L.names = {}; trains.slice().forEach(removeTrain); changed(); sfx('whoosh'); closeAllOv(); });
    else if (act === 'restart') { sfx('select'); startMission(missionIdx); }
    else if (act === 'home') { sfx('back'); goTitle(); }
  }
  document.querySelectorAll('[data-act]').forEach(b => b.addEventListener('click', () => onAct(b.dataset.act)));

  /* ---------- 工具列按鈕 ---------- */
  $('mBuild').addEventListener('click', () => { if (phase !== 'build') { setPhase('build'); } });
  $('mPlay').addEventListener('click', () => { ensureLoops(); if (phase !== 'play') setPhase('play'); });
  document.querySelectorAll('.tool[data-tool]').forEach(b => b.addEventListener('click', () => { setTool(b.dataset.tool); sfx('ui', { vol: 0.7 }); if (b.dataset.tool !== 'place') say(b.dataset.tool === 'erase' ? '點一下要拿掉的東西' : '按住一塊拖到別的格子', false, 1400); }));
  $('bRot').addEventListener('click', () => rotateSel());
  $('bUndo').addEventListener('click', () => undo());
  $('bRedo').addEventListener('click', () => redo());
  document.querySelectorAll('.tab').forEach(t => t.addEventListener('click', () => {
    const cat = t.dataset.tab;
    if (cat === pal.cat) return;
    const list = cat === 'track' ? PAL_TRACK : PAL_SCEN;
    pal = { cat, t: list.find(x => allowedHere(cat, x)) || list[0] };
    buildPalette(); setTool('place'); sfx('card');
  }));
  $('cRot').addEventListener('click', () => rotateSel());
  $('cSw').addEventListener('click', () => { if (sel >= 0) { pushHist(); toggleSwitch(sel, false); updUndo(); } });
  $('cName').addEventListener('click', () => { if (sel >= 0) { sfx('ui'); openRename(sel); } });
  $('cDel').addEventListener('click', () => { if (sel >= 0) eraseAt(sel); });
  $('pHonk').addEventListener('click', () => honkAll());
  $('pRev').addEventListener('click', () => reverseAll());
  $('pSpeed').addEventListener('click', () => { speedMul = speedMul === 1 ? 1.5 : speedMul > 1.2 ? 0.6 : 1; sfx('select', { pitch: speedMul }); updLayers(); updUI(); });
  $('pPause').addEventListener('click', () => { trainsHold = !trainsHold; sfx(trainsHold ? 'back' : 'go', { vol: 0.6 }); updUI(); say(trainsHold ? '火車都停下來了' : '火車出發！', false, 1100); });
  $('pClear').addEventListener('click', () => { if (!trains.length) { sfx('deny'); return; } trains.slice().forEach(removeTrain); sfx('whoosh'); say('火車都回車庫了', false, 1200); });
  $('bMenu').addEventListener('click', () => openMenu());
  $('bCam').addEventListener('click', () => { setFollow(null); fitTrack(false); sfx('swoosh', { vol: 0.5 }); });
  $('bFollow').addEventListener('click', () => {
    if (!trains.length) { sfx('deny'); say('先放一列火車吧！', false, 1300); return; }
    const i = trains.findIndex(t => t.id === followId);
    const next = i < 0 ? trains[0] : trains[i + 1];
    setFollow(next ? next.id : null);
    sfx(next ? 'swoosh' : 'back', { vol: 0.6 });
    if (next) say('跟著' + next.def.name + '一起坐車！', false, 1300);
  });

  /* ---------- 鍵盤 ---------- */
  window.addEventListener('keydown', e => {
    if (e.target && e.target.tagName === 'INPUT') { if (e.key === 'Enter') $('rnYes').click(); return; }
    if (e.key === 'Escape') {
      const top = ovStack[ovStack.length - 1];
      if (top && top !== 'title' && top !== 'done') { closeOv(); sfx('back'); }
      else if (!top && (phase === 'build' || phase === 'play')) openMenu();
      return;
    }
    if (ovStack.length || (phase !== 'build' && phase !== 'play')) return;
    const k = e.key.toLowerCase();
    if ((e.ctrlKey || e.metaKey) && k === 'z') { e.preventDefault(); if (e.shiftKey) redo(); else undo(); return; }
    if ((e.ctrlKey || e.metaKey) && k === 'y') { e.preventDefault(); redo(); return; }
    if (k === ' ') { e.preventDefault(); setPhase(phase === 'build' ? 'play' : 'build'); return; }
    if (k === 'c') { setFollow(null); fitTrack(false); return; }
    if (phase === 'build') {
      if (k === 'r') rotateSel();
      else if ((k === 'delete' || k === 'backspace') && sel >= 0) eraseAt(sel);
      else if (k === 'e') setTool('erase');
      else if (k === 'm') setTool('move');
      else if (k === 'p') setTool('place');
      else if (/^[1-9]$/.test(k)) { const list = pal.cat === 'track' ? PAL_TRACK : PAL_SCEN; const t = list[+k - 1]; if (t) pickPal(pal.cat, t); }
    } else {
      if (k === 'h') honkAll();
      else if (k === 'b') reverseAll();
      else if (k === 'f') $('bFollow').click();
    }
  });
  document.addEventListener('visibilitychange', () => {
    if (document.hidden && (phase === 'build' || phase === 'play') && !ovStack.length) openMenu();
  });

  /* =========================================================
   * 自動畫質：太卡就一步步降低，並記住
   * ========================================================= */
  const QKEY = 'quality:toy-train';
  const baseRatio = Math.min(window.devicePixelRatio || 1, small ? 1.75 : 2);
  const QL = [
    { ratio: baseRatio, shadow: true, sm: 2048, parts: 240 },
    { ratio: Math.min(baseRatio, 1.5), shadow: true, sm: 2048, parts: 200 },
    { ratio: Math.min(baseRatio, 1.25), shadow: true, sm: 1024, parts: 160 },
    { ratio: 1, shadow: true, sm: 1024, parts: 120 },
    { ratio: 1, shadow: false, sm: 1024, parts: 100 },
    { ratio: 0.8, shadow: false, sm: 512, parts: 70 }
  ];
  let qLevel = clamp(KG.store.get(QKEY, KG.lowEnd ? 2 : 0) | 0, 0, QL.length - 1);
  const perf = { last: 0, n: 0, sum: 0, cool: 3 };
  function applyQuality() {
    const q = QL[qLevel];
    renderer.setPixelRatio(q.ratio);
    pCap = q.parts;
    if (sun.shadow.mapSize.x !== q.sm) { sun.shadow.mapSize.set(q.sm, q.sm); if (sun.shadow.map) { sun.shadow.map.dispose(); sun.shadow.map = null; } }
    if (renderer.shadowMap.enabled !== q.shadow) {
      renderer.shadowMap.enabled = q.shadow;
      scene.traverse(o => { if (o.material) [].concat(o.material).forEach(m => { m.needsUpdate = true; }); });
    }
    layout();
  }
  let lastCalls = 0;
  function renderFrame() {
    renderer.render(scene, camera);
    lastCalls = renderer.info.render.calls;
    const now = performance.now(), dt = perf.last ? Math.min(0.5, (now - perf.last) / 1000) : 0;
    perf.last = now;
    if (document.hidden || qLevel >= QL.length - 1) return;
    perf.cool -= dt;
    if (perf.cool > 0) return;
    perf.sum += dt; perf.n++;
    if (perf.n >= 60) {
      if (perf.sum / perf.n > 1 / 45) { qLevel++; KG.store.set(QKEY, qLevel); applyQuality(); perf.cool = 1.5; }
      perf.n = 0; perf.sum = 0;
    }
  }

  /* =========================================================
   * 主迴圈
   * ========================================================= */
  let last = performance.now(), first = true;
  function simStep(dt) {
    tSim += dt;
    for (const tr of trains.slice()) if (trains.includes(tr)) updTrain(tr, dt);
    for (const tr of trains) poseTrain(tr);
    bumpCheck();
    updPeople(dt);
    updScenery(dt);
  }
  function frame(now) {
    const dt = clamp((now - last) / 1000, 0, 0.05), rdt = clamp((now - last) / 1000, 0, 0.25);
    last = now;
    const run = !paused && !document.hidden;
    if (run) simStep(dt);
    if (phase === 'title' && !ptrs.size) camGoal.yaw += dt * 0.05;
    drawTrains();
    updParts(run ? dt : 0);
    updAnims(dt);
    updCamera(rdt);
    updSel(dt);
    updLoops(dt);
    renderFrame();
    if (first) { first = false; const m = $('msg'); if (m) m.remove(); }
    requestAnimationFrame(frame);
  }
  // 標題字
  $('logo').innerHTML = ['3D', '玩', '具', '火', '車'].map((ch, i) => '<span style="background:' + ['#ff8a3a', '#e2473b', '#3a9ee8', '#46b864', '#f5b82e'][i] + ';animation-delay:' + (i * 0.12) + 's">' + ch + '</span>').join('');
  makeIcons();
  buildTrainButtons();
  applyQuality();
  goTitle();
  buildPalette();
  requestAnimationFrame(frame);

  /* =========================================================
   * 測試用掛勾
   * ========================================================= */
  window.__tt = {
    state: () => ({ phase, mission: missionIdx, sel, tool, pal: Object.assign({}, pal), curRot, pieces: segsCount(), segs: segs.length, hist: hist.length, redo: redoS.length,
      trains: trains.map(t => ({ id: t.id, kind: t.kind, v: +t.v.toFixed(2), state: t.state, pax: t.pax, wait: +t.wait.toFixed(1), rev: t.rev, loads: t.cars.map(c => c.load).join('') })),
      people: people.length, follow: followId, paused, ov: ovStack.slice(), q: qLevel, draws: lastCalls, tris: renderer.info.render.triangles,
      music: KG.music ? KG.music.isPlaying() : null, stats: Object.assign({}, stats), view, stars: mStars.slice(), parts: parts.length }),
    place: (type, x, y, r, lv) => { if (!inB(x, y)) return false; const c = cid(x, y); if (!canTrack(c, type, lv || 0)) return false; pushHist(); L.t[c] = tCode(type, r || 0, lv || 0, 0); changed(); return true; },
    scen: (type, x, y, r) => { const c = cid(x, y); if (!canScen(c, type)) return false; pushHist(); L.s[c] = sCode(type, r || 0); if (type === SC.STATION) L.names[c] = '測試站'; changed(); return true; },
    at: (x, y) => { const c = cid(x, y); return { t: tT(c), r: tR(c), lv: tLv(c), sw: tSw(c), s: sT(c), sr: sR(c), name: L.names[c] || null }; },
    cellScreen: (x, y) => { const c = cid(x, y); const p = toScreen(wx(x), (tT(c) ? tLv(c) * LH : 0) + 0.15, wz(y)); return { x: Math.round(p.x), y: Math.round(p.y) }; },
    trainScreen: (i, k) => { const tr = trains[i]; if (!tr) return null; const car = tr.cars[k || 0]; const p = toScreen(car.x, car.y + 0.45, car.z); return { x: Math.round(p.x), y: Math.round(p.y) }; },
    free: (fresh) => { if (fresh) Save.set('cur', null); startFree(fresh ? newLayout(16, 12) : null); },
    title: () => goTitle(),
    mission: (i) => startMission(i),
    solve: (i) => {
      const m = MISSIONS[i == null ? missionIdx : i];
      if (missionIdx !== MISSIONS.indexOf(m)) startMission(MISSIONS.indexOf(m));
      m.sol.forEach(([t, x, y, r, lv]) => { const c = cid(x, y); if (t === 'xing') L.s[c] = sCode(SC.XING, tR(c)); else L.t[c] = tCode(t, r || 0, lv || 0, 0); });
      changed();
      return { used: usedPieces(), par: m.par, res: m.conds.map(evalCond) };
    },
    evalM: () => mission ? mission.conds.map(evalCond) : null,
    check: () => checkMission(),
    phase: (p) => setPhase(p),
    addTrain: (k, x, y) => { const at = x != null ? segByCell[cid(x, y)] : null; const tr = placeTrain(k, at ? at[0] : null, true); return tr ? tr.id : null; },
    tick: (sec) => { const n = Math.round(sec * 60); for (let i = 0; i < n; i++) simStep(1 / 60); drawTrains(); return trains.length; },
    toggle: (x, y) => toggleSwitch(cid(x, y), phase === 'play'),
    follow: (on) => setFollow(on && trains.length ? trains[0].id : null),
    followSnap: () => { fol.snap = true; },
    trackBox: () => { let a = [1e9, -1e9, 1e9, -1e9]; for (let c = 0; c < L.t.length; c++) if (L.t[c]) { const p = toScreen(wx(cX(c)), 0.2, wz(cY(c))); a = [Math.min(a[0], p.x), Math.max(a[1], p.x), Math.min(a[2], p.y), Math.max(a[3], p.y)]; } return { box: a.map(Math.round), view, cam: Object.assign({}, cam), goal: Object.assign({}, camGoal) }; },
    headType: (i) => { const tr = trains[i || 0]; return tr ? rPos(tr, tr.head - 0.3, _a).e.seg.type : null; },
    camOccluded: () => {
      // 相機到火車頭之間有沒有被別的東西擋住（用射線測所有網格）
      const tr = trains.find(t => t.id === followId); if (!tr) return null;
      const hc = tr.cars[tr.rev ? tr.cars.length - 1 : 0];
      const tgt = new THREE.Vector3(hc.x, hc.y + 0.7, hc.z), o = camera.position.clone(), d = tgt.clone().sub(o), len = d.length();
      const rc = new THREE.Raycaster(o, d.normalize(), 0.05, len - 0.9);
      const hits = rc.intersectObjects(scene.children.filter(m => m.isMesh && m.visible && m !== ghost && m !== selBox && m !== table && m !== matMesh), false);
      return hits.filter(h => !(h.object.material === tunMat && tunMat.opacity < 0.6)).map(h => (Object.keys(IMS).find(k => IMS[k].m === h.object) || 'mesh') + '@' + h.distance.toFixed(2));
    },
    camInfo: () => ({ pos: camera.position.toArray().map(v => +v.toFixed(2)), fov: camera.fov, tun: +tunMat.opacity.toFixed(2) }),
    setQuality: (l) => { qLevel = clamp(l, 0, QL.length - 1); applyQuality(); },
    open: () => openEnds().length,
    reach: (ax, ay, bx, by, via) => canReach(cid(ax, ay), cid(bx, by), via),
    loop: (tags) => findLoop(tags || []),
    encode: () => JSON.stringify(encodeL()).length,
    saves: () => getSaves().map(s => s ? { name: s.name, len: JSON.stringify(s).length } : null),
    save: (i) => saveTo(i),
    speed: (m) => { speedMul = m; updLayers(); },
    dbg: () => trains.map(t => ({ id: t.id, head: +t.head.toFixed(2), len: +t.len.toFixed(2), rl: +rLen(t).toFixed(2), endD: t.endD, stopD: t.stopD, state: t.state, v: t.v, blk: t.blockedBy, wait: t.wait, hold: trainsHold, sm: speedMul, route: t.route.map(e => e.seg.c + (e.dir > 0 ? '+' : '-')).join(',') })),
    missions: MISSIONS.length,
    T, SC
  };
}
</script>
