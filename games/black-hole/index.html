<!doctype html>
<html lang="zh-Hant-TW">

<title>黑洞大胃王</title>
<link rel="stylesheet" href="../../assets/common.css">
<style>

  #timer { min-width: 104px; padding: 3px 18px; border-radius: 999px; background: rgba(255,255,255,.95); border: 3px solid #fff; box-shadow: 0 4px 0 rgba(42,31,74,.28), 0 8px 18px rgba(0,0,0,.18);

</style>

<script type="module">
import * as THREE from 'three';

let renderer = null;
try {
  renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('gl'), antialias: !KG.lowEnd, powerPreference: 'high-performance' });
} catch (e) { renderer = null; }
if (!renderer) document.getElementById('msg').textContent = '這個遊戲需要支援 3D（WebGL）的瀏覽器，請換一個瀏覽器或裝置再試試看。';
else main();

function main() {
  const $ = id => document.getElementById(id);
  const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
  const TAU = Math.PI * 2, P2 = Math.PI / 2;
  function mulberry(seed) {
    return function () {
      seed |= 0; seed = seed + 0x6D2B79F5 | 0;
      let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }

  /* =========================================================
   * 存檔與設定
   * ========================================================= */
  const SAVE_KEY = 'black-hole:save';
  const save = Object.assign({ stars: [0, 0, 0, 0, 0], best: [0, 0, 0, 0, 0], battleWins: 0 }, KG.store.get(SAVE_KEY, {}));
  function writeSave() { KG.store.set(SAVE_KEY, save); }
  let sfxOn = KG.store.get('black-hole:sfx', true) !== false;

  /* =========================================================
   * 音樂（D dorian 放克，118 bpm）
   * ========================================================= */
  const BASS_DM = 'D2 . . D3 . D2 . C3 . D2 . F2 G2 . A2 C3';
  const BASS_G7 = 'G2 . . G3 . G2 . F3 . G2 . B2 D3 . F3 D3';
  const BASS_DMF = 'D2 . D3 . C3 . A2 . D2 . . D3 C3 A2 G2 F2';
  const BASS_G7L = 'G2 . . G3 . G2 . F3 . G2 B2 . A2 . G2 E2';
  const BASS_F = 'F2 . . F3 . F2 . E3 . F2 . A2 C3 . E3 C3';
  const BASS_C = 'C2 . . C3 . C2 . B2 . C2 . E2 G2 . B2 G2';
  const BASS_E = 'E2 . . E3 . E2 . D3 . E2 . G2 B2 . D3 B2';
  const BASS_A = 'A2 . . A3 . A2 . G3 . A2 . C#3 E3 . C#3 A2';
  const clav = (a, b) => `. . ${a} . . ${a} . . ${b} . ${a} . . ${a} . .`;
  const stab = (a, b) => `${a} - . . . . . . . . ${b} . . ${b} . .`;
  const SONG_GAME = {
    bpm: 118, steps: 16, swing: 0.06,
    chords: ['Dm7', 'G7', 'Dm7', 'G7', 'Dm7', 'G7', 'Dm7', 'G7', 'Fmaj7', 'Cmaj7', 'Em7', 'A7'],
    layers: { hype: false },
    tracks: [
      { inst: 'kick', pat: ['X.....x...X..x..', 'X.....x.X.....x.'], vol: 0.72 },
      { inst: 'snare', pat: ['....X..o.o..X...', '....X..o....X.oo'], vol: 0.65 },
      { inst: 'hat', pat: 'xoxoxoxoxoxoxoxo', vol: 0.5 },
      { inst: 'ohat', pat: '..............x.', vol: 0.4 },
      { inst: 'bass', seq: [BASS_DM, BASS_G7, BASS_DM, BASS_G7, BASS_DM, BASS_G7, BASS_DMF, BASS_G7L, BASS_F, BASS_C, BASS_E, BASS_A], vol: 0.66, legato: 0.8 },
      { inst: 'sub', chord: 'R.......R.......', vol: 0.3 },

  function Placer(half, seed) {
    const rng = mulberry(seed);
    const items = [], decals = [], zones = [], CELL = 4, N = Math.ceil(half * 2 / CELL) + 2;
    const grid = []; for (let i = 0; i < N * N; i++) grid.push([]);
    const ci = v => clamp(Math.floor((v + half) / CELL), 0, N - 1);
    function free(x, z, r, nozone) {
      if (Math.abs(x) > half - r * 0.7 || Math.abs(z) > half - r * 0.7) return false;
      if (!nozone) for (const zn of zones) if (zn(x, z, r)) return false;
      const x0 = ci(x - r - 6), x1 = ci(x + r + 6), z0 = ci(z - r - 6), z1 = ci(z + r + 6);
      for (let gx = x0; gx <= x1; gx++) for (let gz = z0; gz <= z1; gz++) for (const c of grid[gx + gz * N]) {
        const dx = c.x - x, dz = c.z - z, rr = c.r + r;
        if (dx * dx + dz * dz < rr * rr) return false;
      }
      return true;
    }
    function put(name, x, z, yaw, o) {
      o = o || {};
      const t = prep(TYPES[name]);
      const r = o.r != null ? o.r : Math.max(0.2, t.rad * 0.82);
      if (!o.force && !free(x, z, r, o.nozone)) return null;
      grid[ci(x) + ci(z) * N].push({ x, z, r });
      const it = { t, x, z, yaw: yaw == null ? rng() * TAU : yaw, home: o.home };
      items.push(it);
      return it;
    }
    function scatter(name, n, x0, z0, x1, z1, o) {
      let k = 0, tries = 0;
      while (k < n && tries < n * 40) {
        tries++;
        const x = x0 + rng() * (x1 - x0), z = z0 + rng() * (z1 - z0);
        if (o && o.test && !o.test(x, z)) continue;
        if (put(name, x, z, o && o.yaw != null ? o.yaw : null, o)) k++;
      }
      return k;
    }
    return { rng, items, decals, half, put, scatter, free, zone: f => zones.push(f), decal: d => decals.push(d) };
  }

    refreshToggles();
    showOv('ovTitle');
    hud.classList.remove('on'); $('pauseBtn').classList.remove('on');
    KG.music.play(SONG_TITLE);
  }
  function startDemo() {
    buildLevel(0, 'demo');
    demoT = 0;
  }
  $('bSolo').addEventListener('click', () => { sfx('select'); openSelect('solo'); });
  $('bBattle').addEventListener('click', () => { sfx('select'); openSelect('battle'); });
  $('bSelBack').addEventListener('click', () => { sfx('back'); openTitle(); });
  $('pauseBtn').addEventListener('click', () => { if (phase === 'play' || phase === 'count') pauseGame(); });
  $('bResume').addEventListener('click', () => { ui(); resumeGame(); });
  $('bRestart').addEventListener('click', () => { ui(); startGame(levelIdx, mode); });
  $('bQuit').addEventListener('click', () => { sfx('back'); startDemo(); openSelect(mode === 'battle' ? 'battle' : 'solo'); KG.music.play(SONG_TITLE); });

  function startGame(idx, md) {
    buildLevel(idx, md);
    phase = 'count'; countT = 3.2; lastCount = 4;
    showOv(null);
    hud.classList.add('on'); $('pauseBtn').classList.add('on');
    KG.music.play(SONG_GAME, { restart: true });
    KG.music.setTempo(1); KG.music.setLayer('hype', false);
    banner(md === 'battle' ? '對戰：' + map.name : '第 ' + (idx + 1) + ' 關：' + map.name, 1.6);
  }
  let lastCount = 4;
  function pauseGame() {
    if (phase !== 'play' && phase !== 'count') return;
    pauseFrom = phase; phase = 'pause';
    endJoy();
    KG.music.pause();
    sfx('click');
    $('bQuit').textContent = mode === 'battle' ? '換地圖' : '選擇關卡';
    $('pauseInfo').textContent = (mode === 'battle' ? '對戰・' : '第 ' + (levelIdx + 1) + ' 關・') + map.name + '　剩下 ' + Math.ceil(timeLeft) + ' 秒';
    refreshToggles();
    showOv('ovPause');
    $('pauseBtn').classList.remove('on');
  }
  function resumeGame() {
    if (phase !== 'pause') return;
    phase = pauseFrom;
    showOv(null);
    $('pauseBtn').classList.add('on');
    KG.music.resume();
    last = performance.now();
  }
  function endRound() {
    phase = 'end'; endT = 1.6; endJoy();
    KG.music.stop(0.6);
    bigText('時間到！', '#ffe066');
    sfx('go', { pitch: 0.75, vol: 0.9 });
    $('pauseBtn').classList.remove('on');
  }
  function showResult() {
    phase = 'result';
    const card = $('resCard');
    let stars = 0, html = '', isRec = false;
    if (mode === 'solo') {
      const p = Math.floor(pct());
      stars = map.stars.filter(s => p >= s).length;
      isRec = p > (save.best[levelIdx] || 0);
      save.stars[levelIdx] = Math.max(save.stars[levelIdx], stars);
      save.best[levelIdx] = Math.max(save.best[levelIdx] || 0, p);
      const bestScore = KG.best('black-hole:' + map.id, player.score);
      writeSave();
      const title = stars === 3 ? '超級大胃王！' : stars === 2 ? '吃得好飽！' : stars === 1 ? '過關了！' : '還沒吃飽…';
      html = `<h2>${title}</h2>` + (isRec && p > 0 ? '<div class="newrec">新紀錄！</div>' : '') +
        `<div class="bigstars"><div class="star"></div><div class="star"></div><div class="star"></div></div>` +
        `<div class="stats"><span>吞食率</span><b>${p}%</b><span>分數</span><b>${player.score.toLocaleString('en-US')}</b><span>最大尺寸</span><b>Lv${player.tier + 1} ${TIER_N[player.tier]}</b><span>吃掉東西</span><b>${player.ate} 個</b><span>最高分</span><b>${(bestScore || 0).toLocaleString('en-US')}</b></div>` +
        (stars === 0 ? `<p>吃到 ${map.stars[0]}% 就能拿到第一顆星！</p>` : '');
    } else {
      const order = holes.slice().sort((a, b) => b.score - a.score);
      const place = order.indexOf(player) + 1;
      stars = 4 - place;
      if (place === 1) save.battleWins++;
      const bs = KG.best('black-hole:battle', player.score);
      isRec = player.score >= bs && player.score > 0;
      writeSave();
      html = `<h2>${place === 1 ? '冠軍！' : place === 2 ? '第二名！' : '第三名'}</h2>` + `<div class="bigstars"><div class="star"></div><div class="star"></div><div class="star"></div></div>` +
        `<div class="rank">${order.map((h, i) => `<div class="${h.isPlayer ? 'me' : ''}"><em>${i + 1}</em><i style="background:${h.css}"></i>${h.name}${h.holesEaten ? `<small style="color:#9a8cc0">（吞洞 ${h.holesEaten}）</small>` : ''}<b>${h.score.toLocaleString('en-US')}</b></div>`).join('')}</div>`;
    }
    const nextOk = mode === 'solo' && levelIdx < MAPS.length - 1 && unlocked(levelIdx + 1);
    html += '<div class="btns">' + (nextOk ? '<button class="kg-btn green" id="rNext">下一關</button>' : '') +
      `<button class="kg-btn ${nextOk ? 'yellow small' : 'green'}" id="rAgain">再玩一次</button><button class="kg-btn blue small" id="rSel">${mode === 'battle' ? '換地圖' : '選擇關卡'}</button></div>`;
    card.innerHTML = html;
    card.style.animation = 'none'; void card.offsetWidth; card.style.animation = '';
    showOv('ovResult');
    hud.classList.remove('on');
    if (nextOk) $('rNext').addEventListener('click', () => { sfx('select'); startGame(levelIdx + 1, 'solo'); });
    $('rAgain').addEventListener('click', () => { sfx('select'); startGame(levelIdx, mode); });
    $('rSel').addEventListener('click', () => { sfx('back'); const md = mode; startDemo(); openSelect(md === 'battle' ? 'battle' : 'solo'); KG.music.play(SONG_TITLE); });
    // 結算音樂與星星
    if (stars > 0) jingle({ bpm: 132, inst: 'brass', vol: 0.6, bassVol: 0.45, notes: [['A4', 1], ['C5', 1], ['D5', 1], ['F5', 1], ['E5', 1], ['C5', 1], ['D5+F5+A5', 4]], bass: [['D3', 2, 0], ['A2', 2, 2], ['D3', 6, 6]] });
    else jingle({ bpm: 110, inst: 'pluck', vol: 0.8, bassVol: 0.45, notes: [['A4', 1], ['G4', 1], ['F4', 1], ['E4', 1], ['D4', 4]], bass: [['D3', 8, 0]] });
    const sEls = card.querySelectorAll('.bigstars div');
    const myRun = ++resultRun;
    for (let i = 0; i < stars; i++) setTimeout(() => {
      if (resultRun !== myRun || phase !== 'result') return;
      sEls[i].classList.add('on');
      if (sfxOn && !KG.isMuted()) { KG.sfx.play('star', { pitch: 1 + i * 0.122 }); KG.sfx.play('pop', { pitch: 1.2 + i * 0.15, vol: 0.6 }); }
    }, 1000 + i * 480);
    if (stars > 0) setTimeout(() => { if (resultRun === myRun && phase === 'result') KG.confetti(); }, 1000 + stars * 480);
    setTimeout(() => { if (resultRun === myRun && phase === 'result') KG.music.play(SONG_TITLE); }, 3600);
  }
  let resultRun = 0;

  /* =========================================================
   * 主迴圈
   * ========================================================= */
  function update(dt) {
    clock += dt;
    if (phase === 'count') {
      countT -= dt;
      const n = Math.ceil(countT);
      if (n !== lastCount && n >= 1 && n <= 3) { lastCount = n; bigText(String(n)); sfx('countdown', { pitch: 1 }); }
      if (countT <= 0) { phase = 'play'; bigText('開吃！', '#ffe066'); sfx('go'); }
    } else if (phase === 'play') {
      timeLeft -= dt;
      if (!hyped && timeLeft <= 20) { hyped = true; KG.music.setTempo(1.06); KG.music.setLayer('hype', true); banner('最後 20 秒！', 1.4); }
      const sec = Math.ceil(timeLeft);
      if (timeLeft <= 10 && sec !== lastTickSec && sec > 0) { lastTickSec = sec; sfxTick(sec); timerEl.animate([{ transform: 'scale(1.25)' }, { transform: 'scale(1)' }], { duration: 300 }); }
      if (timeLeft <= 0) { timeLeft = 0; endRound(); }
      else if (mode === 'solo' && objs.every(o => o.st !== 0)) endRound();
    } else if (phase === 'end') {
      endT -= dt;
      if (endT <= 0) showResult();
    } else if (phase === 'title' || phase === 'select') {
      demoT += dt;
      if (player.r > 5.5 || demoT > 80) startDemo();
    }
    if (phase !== 'pause' && phase !== 'result') {
      stepHoles(dt);
      stepObjects(dt);
    }
    stepParticles(dt);
    shake = Math.max(0, shake - dt * 1.6);
  }

  function resize() {
    const r = cv.getBoundingClientRect();
    W = Math.max(1, Math.round(r.width)); H = Math.max(1, Math.round(r.height));
    renderer.setSize(W, H, false);
    camera.aspect = W / H; camera.updateProjectionMatrix();
  }
  window.addEventListener('resize', resize);
  if (window.visualViewport) window.visualViewport.addEventListener('resize', resize);
  window.addEventListener('orientationchange', () => setTimeout(resize, 150));
  document.addEventListener('visibilitychange', () => { if (document.hidden && (phase === 'play' || phase === 'count')) pauseGame(); });

  /* ---------- 自動畫質 ---------- */
  const QKEY = 'quality:' + (location.pathname.split('/').filter(x => x && !/\.html?$/.test(x)).slice(-1)[0] || 'black-hole');
  const small = Math.min(innerWidth, innerHeight) < 600;
  const baseRatio = Math.min(window.devicePixelRatio || 1, small ? 1.75 : 2);
  const QLEVELS = [
    { ratio: baseRatio, shadow: true },
    { ratio: Math.min(baseRatio, 1.35), shadow: true },
    { ratio: 1, shadow: true },
    { ratio: 1, shadow: false },
    { ratio: 0.8, shadow: false }
  ];
  let qLevel = clamp(KG.store.get(QKEY, KG.lowEnd ? 2 : 0) | 0, 0, QLEVELS.length - 1);
  const perf = { last: 0, n: 0, sum: 0, cool: 3 };
  function applyQuality() {
    const q = QLEVELS[qLevel];
    renderer.setPixelRatio(q.ratio);
    renderer.setSize(W, H, false);
    if (renderer.shadowMap.enabled !== q.shadow) {
      renderer.shadowMap.enabled = q.shadow;
      scene.traverse(o => { if (o.material) [].concat(o.material).forEach(m => { m.needsUpdate = true; }); });
    }
  }
  function renderFrame() {
    for (const m of meshes) {
      if (m.userData.dirty) { m.instanceMatrix.needsUpdate = true; m.userData.dirty = false; }
      if (m.userData.cdirty) { m.instanceColor.needsUpdate = true; m.userData.cdirty = false; }
    }
    renderer.render(scene, camera);
    const now = performance.now(), dt = perf.last ? Math.min(0.5, (now - perf.last) / 1000) : 0;
    perf.last = now;
    if (document.hidden || qLevel >= QLEVELS.length - 1) return;
    perf.cool -= dt;
    if (perf.cool > 0) return;
    perf.sum += dt; perf.n++;
    if (perf.n >= 60) {
      if (perf.sum / perf.n > 1 / 45) { qLevel++; KG.store.set(QKEY, qLevel); applyQuality(); perf.cool = 1.5; }
      perf.n = 0; perf.sum = 0;
    }
  }
  let last = performance.now(), first = true;
  function frame(now) {
    const dt = Math.max(0, Math.min(0.05, (now - last) / 1000));
    last = now;
    update(dt);
    updateCamera(dt);
    syncHoles();
    renderFrame();
    stepFloats(dt);
    if (hud.classList.contains('on')) updateHud();
    if (first) { first = false; const m = $('msg'); if (m) m.remove(); }
    requestAnimationFrame(frame);
  }
  resize();
  applyQuality();
  startDemo();
  openTitle();
  requestAnimationFrame(frame);

  /* ---------- 測試用 ---------- */
  window.__bh = {
    state: () => ({ phase, mode, level: levelIdx, time: +timeLeft.toFixed(2), pct: +pct().toFixed(1), score: player.score, r: +player.r.toFixed(2), tier: player.tier, ate: player.ate,
      objs: objs.length, rest: objs.filter(o => o.st === 0).length, falling: objs.filter(o => o.st === 1 || o.st === 2).length, gold: objs.filter(o => o.gold && o.st === 0).length,
      holes: holes.map(h => ({ name: h.name, x: +h.x.toFixed(1), z: +h.z.toFixed(1), r: +h.r.toFixed(2), score: h.score, active: h.active })), music: KG.music.isPlaying(), q: qLevel, sfxOn, musicOn: KG.music.isEnabled(),
      draws: renderer.info.render.calls, tris: renderer.info.render.triangles, totalMass: Math.round(totalMass) }),
    start: (lv, battle) => startGame(lv || 0, battle ? 'battle' : 'solo'),
    skip: () => { if (phase === 'count') countT = 0.001; },
    tick: (sec, step) => { step = step || 1 / 30; const n = Math.round(sec / step); for (let i = 0; i < n; i++) update(step); updateCamera(0.5); },
    input: (x, z) => { testIn = x == null ? null : { x, z }; },
    auto: on => { autoPlayer = !!on; },
    grow: m => { player.mass += m; },
    time: t => { timeLeft = t; },
    unlockAll: () => { for (let i = 0; i < 5; i++) save.stars[i] = Math.max(save.stars[i], 1); writeSave(); },
    pause: () => pauseGame(), resume: () => resumeGame(),
    hole: () => { const s = toScreen(player.x, 0, player.z); return { x: s[0], y: s[1] }; },
    nearestGold: () => { const g = objs.find(o => o.gold && o.st === 0); return g ? { x: g.x, z: g.z } : null; },
    teleport: (x, z) => { player.x = x; player.z = z; cam.x = x; cam.z = z; },
    holeObj: i => holes[i],
    find: name => { const o = objs.find(q => q.t.name === name && q.st === 0); return o ? { x: o.x, z: o.z, s: +o.s.toFixed(2), h: +o.t.h.toFixed(2) } : null; },
    types: () => { const m = {}; for (const o of objs) { const t = o.t; m[t.name] = m[t.name] || { n: 0, s: +t.s.toFixed(2), mass: +t.mass.toFixed(1) }; m[t.name].n++; } return m; },
    sim: (lv, sec, battle, skill) => {
      buildLevel(lv, battle ? 'battle' : 'solo'); phase = 'play'; autoPlayer = true; player.skill = skill || 1;
      const n = Math.round((sec || 120) * 30); const marks = {};
      for (let i = 0; i < n; i++) { update(1 / 30); if (i % 900 === 899) marks[Math.round((i + 1) / 30)] = +pct().toFixed(1) + '%/r' + player.r.toFixed(1); }
      autoPlayer = false;
      return { pct: +pct().toFixed(1), r: +player.r.toFixed(2), score: player.score, ate: player.ate, marks, phase, holes: holes.map(h => h.name + ':' + h.score + ' r' + h.r.toFixed(1)) };
    }
  };
}
</script>
</body>
</html>
