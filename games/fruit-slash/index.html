<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#5a3a22">
<title>水果切切樂</title>
<link rel="stylesheet" href="../../assets/common.css">
<style>
  html, body { height: 100%; overflow: hidden; background: #5a3a22; overscroll-behavior: none; }
  #game {
    position: fixed; inset: 0; display: block;
    width: 100vw; height: 100vh; height: 100dvh;
    touch-action: none; cursor: crosshair;
  }
  .fs-pause {
    position: fixed; top: 66px; right: 10px; z-index: 8500;
    width: 48px; height: 48px; border-radius: 50%; border: 3px solid #fff;
    background: linear-gradient(180deg, #fff 0%, #ffe9d6 100%);
    box-shadow: 0 5px 0 rgba(60,30,10,.28), 0 10px 20px rgba(0,0,0,.25);
    display: none; place-items: center; cursor: pointer; padding: 0;
    transition: transform .12s ease;
  }
  .fs-pause:active { transform: scale(.9); }
  .fs-pause i { display: block; width: 6px; height: 20px; border-radius: 3px; background: #7a4a24; margin: 0 3px; }
  .fs-pause.show { display: flex; align-items: center; justify-content: center; }

  .fs-screen {
    position: fixed; inset: 0; z-index: 9000; display: none;
    align-items: center; justify-content: center; flex-direction: column;
    padding: 64px 16px 16px; pointer-events: none; text-align: center;
  }
  .fs-screen.show { display: flex; }
  .fs-screen.dim { background: rgba(35,18,6,.55); backdrop-filter: blur(2px); pointer-events: auto; animation: fsFade .25s ease; }
  .fs-logo { font-weight: 900; font-size: clamp(40px, 11vw, 84px); line-height: 1.05; letter-spacing: 2px; white-space: nowrap; margin: 0 0 4px; }
  .fs-logo span {
    display: inline-block; color: var(--c); paint-order: stroke fill;
    -webkit-text-stroke: .16em #4a2410;
    text-shadow: 0 .07em 0 #4a2410, 0 .14em 14px rgba(0,0,0,.35);
    animation: fsBob 2.4s ease-in-out infinite; animation-delay: calc(var(--i) * -.18s);
  }
  .fs-sub { color: #fff3dc; font-weight: 800; font-size: clamp(15px, 3.8vw, 20px); text-shadow: 0 2px 0 rgba(60,25,5,.7); margin: 4px 0 18px; }
  .fs-modes { display: flex; gap: 14px; justify-content: center; flex-wrap: wrap; pointer-events: auto; width: min(760px, 100%); }
  .fs-mode {
    font-family: var(--kg-font); color: #4a2a12; cursor: pointer;
    flex: 1 1 200px; max-width: 240px; min-width: 0;
    border: 4px solid #fff; border-radius: 26px; padding: 12px 12px 14px;
    background: linear-gradient(180deg, #fffaf0 0%, var(--bg) 100%);
    box-shadow: 0 6px 0 var(--sh), 0 12px 22px rgba(0,0,0,.35);
    display: flex; flex-direction: column; align-items: center; gap: 2px;
    transition: transform .12s ease, box-shadow .12s ease;
    animation: kg-pop .4s cubic-bezier(.2,1.6,.4,1) both; animation-delay: var(--d);
  }
  .fs-mode:hover { transform: translateY(-3px) scale(1.02); }
  .fs-mode:active { transform: translateY(4px); box-shadow: 0 2px 0 var(--sh), 0 6px 12px rgba(0,0,0,.3); }
  .fs-mode:focus-visible { outline: 4px solid #ffe066; outline-offset: 3px; }
  .fs-mode img { width: 64px; height: 64px; }
  .fs-mode b { font-size: 24px; font-weight: 900; }
  .fs-mode small { font-size: 14px; font-weight: 700; opacity: .8; line-height: 1.35; }
  .fs-mode .best { margin-top: 6px; font-size: 14px; font-weight: 900; background: rgba(255,255,255,.75); border-radius: 999px; padding: 2px 12px; }
  .fs-mode .key { display: none; }
  .fs-tip { margin-top: 16px; color: #ffe9c7; font-weight: 800; font-size: 15px; text-shadow: 0 2px 0 rgba(60,25,5,.7); }

  .fs-card {
    width: min(400px, 100%); pointer-events: auto;
    background: linear-gradient(180deg, #fffaf0 0%, #ffe8cc 100%);
    border: 5px solid #fff; border-radius: 30px; padding: 20px 20px 22px; color: #4a2a12;
    box-shadow: 0 8px 0 #b97a3f, 0 18px 40px rgba(0,0,0,.45);
    animation: kg-pop .38s cubic-bezier(.2,1.6,.4,1); position: relative;
  }
  .fs-card h2 { margin: 2px 0 6px; font-size: 32px; font-weight: 900; }
  .fs-card .mode-name { font-size: 15px; font-weight: 800; opacity: .7; }
  .fs-score { font-size: 64px; font-weight: 900; line-height: 1.05; color: #ff7a1a; -webkit-text-stroke: 2px #8a3b06; paint-order: stroke fill; text-shadow: 0 4px 0 #8a3b06; margin: 4px 0; }
  .fs-best { font-size: 18px; font-weight: 800; margin-bottom: 8px; }
  .fs-stats { display: flex; gap: 10px; justify-content: center; margin: 6px 0 16px; flex-wrap: wrap; }
  .fs-stats div { background: rgba(255,255,255,.8); border-radius: 14px; padding: 6px 12px; font-weight: 800; font-size: 15px; }
  .fs-stats b { display: block; font-size: 22px; color: #e8541a; }
  .fs-new { display: none; position: absolute; top: -18px; left: 50%; transform: translateX(-50%) rotate(-4deg);
    background: linear-gradient(180deg, #ffe066, #ffb020); color: #6b3a00; font-weight: 900; font-size: 18px;
    padding: 6px 18px; border-radius: 999px; border: 3px solid #fff; box-shadow: 0 4px 0 #c47c00; white-space: nowrap;
    animation: fsWiggle 1s ease-in-out infinite; }
  .fs-new.show { display: block; }
  .fs-card .fs-new.show + h2 { margin-top: 20px; }
  .kg-btn:focus { outline: none; }
  .kg-btn:focus-visible { outline: 4px solid #ffe066; outline-offset: 3px; }
  .fs-actions { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
  .fs-actions .kg-btn { min-width: 132px; }
  .fs-hint { margin-top: 12px; font-size: 13px; font-weight: 700; opacity: .55; }

  @media (hover: hover) and (pointer: fine) { .fs-mode .key { display: inline; opacity: .5; font-size: 12px; } }
  @media (max-width: 520px) and (orientation: portrait) {
    .fs-modes { flex-direction: column; align-items: center; gap: 10px; }
    .fs-mode { flex: none; width: min(340px, 100%); max-width: none; flex-direction: row; text-align: left; gap: 10px; padding: 8px 14px; border-radius: 22px; }
    .fs-mode img { width: 54px; height: 54px; flex: none; }
    .fs-mode .txt { display: flex; flex-direction: column; flex: 1; min-width: 0; }
    .fs-mode b { font-size: 21px; }
    .fs-mode small { font-size: 13px; }
    .fs-mode .best { margin: 0; align-self: center; white-space: nowrap; }
  }
  .fs-mode .txt { display: contents; }
  @media (max-width: 520px) and (orientation: portrait) { .fs-mode .txt { display: flex; } }
  @media (max-height: 520px) {
    .fs-screen { padding-top: 10px; padding-bottom: 8px; }
    .fs-logo { font-size: clamp(34px, 9vh, 56px); }
    .fs-sub { margin: 2px 0 10px; font-size: 15px; }
    .fs-mode { padding: 8px 10px 10px; }
    .fs-mode img { width: 44px; height: 44px; }
    .fs-mode b { font-size: 20px; }
    .fs-mode small { font-size: 12.5px; }
    .fs-tip { margin-top: 10px; font-size: 13px; }
    .fs-card { padding: 14px 18px 16px; }
    .fs-card h2 { font-size: 26px; margin: 0 0 2px; }
    .fs-score { font-size: 46px; }
    .fs-stats { margin: 4px 0 10px; }
    .fs-hint { display: none; }
  }
  @keyframes fsBob { 0%,100% { transform: translateY(0) rotate(-2deg); } 50% { transform: translateY(-7px) rotate(2deg); } }
  @keyframes fsFade { from { opacity: 0; } to { opacity: 1; } }
  @keyframes fsWiggle { 0%,100% { transform: translateX(-50%) rotate(-4deg) scale(1); } 50% { transform: translateX(-50%) rotate(3deg) scale(1.06); } }
</style>
</head>
<body>
<canvas id="game" aria-label="水果切切樂遊戲畫面"></canvas>
<button class="fs-pause" id="pauseBtn" aria-label="暫停" title="暫停 (P)"><i></i><i></i></button>

<div class="fs-screen show" id="titleScr">
  <div class="fs-logo" aria-label="水果切切樂"></div>
  <div class="fs-sub">按住滑動，切開飛起來的水果！</div>
  <div class="fs-modes">
    <button class="fs-mode" data-mode="classic" style="--bg:#ffd6c9;--sh:#c4553a;--d:.05s"><img alt=""><span class="txt"><b>經典 <span class="key">[1]</span></b><small>漏掉 3 顆就結束<br>切到炸彈直接結束</small></span><span class="best"></span></button>
    <button class="fs-mode" data-mode="timed" style="--bg:#ffe7a6;--sh:#c48a12;--d:.12s"><img alt=""><span class="txt"><b>限時 60 秒 <span class="key">[2]</span></b><small>拚手速！不怕漏接<br>炸彈扣 10 分</small></span><span class="best"></span></button>
    <button class="fs-mode" data-mode="zen" style="--bg:#d2f2c4;--sh:#4c9a3a;--d:.19s"><img alt=""><span class="txt"><b>禪模式 <span class="key">[3]</span></b><small>90 秒放鬆切<br>沒有炸彈</small></span><span class="best"></span></button>
  </div>
  <div class="fs-tip">金色楊桃 +10 分・特殊香蕉：冰凍、狂熱、雙倍</div>
</div>

<div class="fs-screen dim" id="pauseScr">
  <div class="fs-card">
    <h2>暫停中</h2>
    <div class="mode-name" id="pauseMode"></div>
    <div style="height:14px"></div>
    <div class="fs-actions">
      <button class="kg-btn green" id="btnResume">繼續</button>
      <button class="kg-btn yellow" id="btnRestart">重新開始</button>
      <button class="kg-btn blue" id="btnMenu1">換模式</button>
    </div>
    <div class="fs-hint">按 P 或 Esc 繼續</div>
  </div>
</div>

<div class="fs-screen dim" id="overScr">
  <div class="fs-card">
    <div class="fs-new" id="newRec">新紀錄！</div>
    <h2 id="overTitle">遊戲結束</h2>
    <div class="mode-name" id="overMode"></div>
    <div class="fs-score" id="overScore">0</div>
    <div class="fs-best" id="overBest">最高分 0</div>
    <div class="fs-stats">
      <div>切開<b id="stSliced">0</b></div>
      <div>最高連切<b id="stCombo">0</b></div>
      <div>金色楊桃<b id="stGold">0</b></div>
    </div>
    <div class="fs-actions">
      <button class="kg-btn green" id="btnAgain">再玩一次</button>
      <button class="kg-btn blue" id="btnMenu2">換模式</button>
    </div>
    <div class="fs-hint">Enter 再玩一次・M 換模式</div>
  </div>
</div>

<script src="../../assets/common.js"></script>
<script>
'use strict';
(function () {
const SLUG = 'fruit-slash';
// 瀏覽器規定：使用者互動後才能發聲
let userActed = false;
window.addEventListener('pointerdown', () => { userActed = true; }, { capture: true });
window.addEventListener('keydown', () => { userActed = true; }, { capture: true });
const N = (f, d, t, v, dl, sl) => { if (userActed) KG.note(f, d, t, v, dl, sl); };
const SFX = n => { if (userActed) KG.sound(n); };
const cv = document.getElementById('game');
const ctx = cv.getContext('2d');
const FONT = '"Baloo 2","PingFang TC","Noto Sans TC","Microsoft JhengHei","Heiti TC",system-ui,sans-serif';
const TAU = Math.PI * 2;
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const rnd = (a, b) => a + Math.random() * (b - a);
const outBack = t => { const c = 1.70158, c3 = c + 1; return 1 + c3 * Math.pow(t - 1, 3) + c * Math.pow(t - 1, 2); };
function mulberry(seed) { return function () { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

let W = 0, H = 0, RS = 1, SPR = 1, R0 = 34, G = 1000;
let clock = 0;           // 真實時間
let quality = KG.lowEnd ? 1 : 2;  // 2 高 1 中 0 低
const QMUL = [0.65, 0.8, 1];

/* =========================================================
 * 美術：所有水果在開始時畫一次到離屏畫布（完整 + 兩個切半）
 * ========================================================= */
function mkCanvas(w, h) { const c = document.createElement('canvas'); c.width = Math.max(1, Math.ceil(w)); c.height = Math.max(1, Math.ceil(h)); return c; }
function rg(c, x0, y0, r0, x1, y1, r1, stops) { const g = c.createRadialGradient(x0, y0, r0, x1, y1, r1); for (let i = 0; i < stops.length; i += 2) g.addColorStop(stops[i], stops[i + 1]); return g; }
function lg(c, x0, y0, x1, y1, stops) { const g = c.createLinearGradient(x0, y0, x1, y1); for (let i = 0; i < stops.length; i += 2) g.addColorStop(stops[i], stops[i + 1]); return g; }
function ell(c, x, y, rx, ry, rot) { c.beginPath(); c.ellipse(x, y, rx, ry, rot || 0, 0, TAU); }
function shine(c, x, y, rx, ry, rot, a) { c.fillStyle = 'rgba(255,255,255,' + a + ')'; ell(c, x, y, rx, ry, rot); c.fill(); }
function leaf(c, x, y, len, wid, rot, col) {
  c.save(); c.translate(x, y); c.rotate(rot);
  c.beginPath(); c.moveTo(0, 0); c.quadraticCurveTo(len * 0.5, -wid, len, 0); c.quadraticCurveTo(len * 0.5, wid, 0, 0);
  c.fillStyle = lg(c, 0, -wid, 0, wid, [0, '#9be15d', 1, col || '#2e8b3a']); c.fill();
  c.strokeStyle = 'rgba(20,70,20,.45)'; c.lineWidth = Math.max(1, wid * 0.12); c.beginPath(); c.moveTo(len * 0.08, 0); c.quadraticCurveTo(len * 0.5, -wid * 0.12, len * 0.9, 0); c.stroke();
  c.restore();
}
function rimShade(c) { // 讓輪廓有一點立體的暗邊（呼叫前已建立路徑）
  c.strokeStyle = 'rgba(40,15,0,.28)'; c.lineWidth = Math.max(1.2, R0 * 0.05); c.stroke();
}
function starPathC(c, x, y, R, r, rot) {
  c.beginPath();
  for (let i = 0; i < 10; i++) { const a = rot + i * Math.PI / 5 - Math.PI / 2, d = i % 2 ? r : R; c.lineTo(x + Math.cos(a) * d, y + Math.sin(a) * d); }
  c.closePath();
}

/* ---- 各水果的外觀 ---- */
function drawWatermelon(c, r) {
  ell(c, 0, 0, r, r * 0.84, -0.25);
  c.fillStyle = rg(c, -r * 0.35, -r * 0.4, r * 0.1, 0, 0, r * 1.05, [0, '#9fe07a', 0.5, '#3f9a3a', 1, '#1b5a20']); c.fill();
  c.save(); ell(c, 0, 0, r, r * 0.84, -0.25); c.clip();
  c.rotate(-0.25);
  c.strokeStyle = 'rgba(18,70,22,.85)'; c.lineWidth = r * 0.15; c.lineCap = 'round';
  for (let i = -4; i <= 4; i++) {
    const bx = i * r * 0.27; c.beginPath();
    for (let k = 0; k <= 12; k++) { const y = -r + k * r / 6; c.lineTo(bx + Math.sin(k * 1.7 + i) * r * 0.05 * (1 - Math.abs(i) / 6), y); }
    c.stroke();
  }
  c.restore();
  ell(c, 0, 0, r, r * 0.84, -0.25); rimShade(c);
  shine(c, -r * 0.38, -r * 0.42, r * 0.34, r * 0.15, -0.6, 0.38);
  shine(c, -r * 0.62, -r * 0.12, r * 0.07, r * 0.05, -0.6, 0.5);
}
function faceWatermelon(c) {
  c.fillStyle = '#2b7a2f'; ell(c, 0, 0, 1, 1); c.fill();
  c.fillStyle = '#d3eeaa'; ell(c, 0, 0, 0.92, 0.92); c.fill();
  c.fillStyle = '#ffe0d4'; ell(c, 0, 0, 0.86, 0.86); c.fill();
  c.fillStyle = rg(c, 0, 0, 0.05, 0, 0, 0.83, [0, '#ff7083', 0.7, '#f23b55', 1, '#e02a44']); ell(c, 0, 0, 0.82, 0.82); c.fill();
  c.fillStyle = '#2a1414';
  for (let i = 0; i < 10; i++) { const a = i * TAU / 10, d = i % 2 ? 0.5 : 0.6; ell(c, Math.cos(a) * d, Math.sin(a) * d, 0.07, 0.04, a); c.fill(); }
  c.fillStyle = 'rgba(255,255,255,.55)'; for (let i = 0; i < 10; i++) { const a = i * TAU / 10, d = i % 2 ? 0.5 : 0.6; ell(c, Math.cos(a) * d - 0.02, Math.sin(a) * d - 0.015, 0.02, 0.012, a); c.fill(); }
}
function drawOrange(c, r) {
  ell(c, 0, 0, r, r);
  c.fillStyle = rg(c, -r * 0.35, -r * 0.4, r * 0.08, 0, 0, r, [0, '#ffe08a', 0.45, '#ffa21f', 1, '#d8640a']); c.fill();
  const rand = mulberry(7);
  c.save(); ell(c, 0, 0, r, r); c.clip();
  for (let i = 0; i < 70; i++) {
    const a = rand() * TAU, d = Math.sqrt(rand()) * r * 0.95;
    c.fillStyle = rand() < 0.5 ? 'rgba(150,60,0,.16)' : 'rgba(255,240,180,.22)';
    ell(c, Math.cos(a) * d, Math.sin(a) * d, r * 0.03, r * 0.03); c.fill();
  }
  c.restore();
  ell(c, 0, 0, r, r); rimShade(c);
  c.fillStyle = '#6b8e23'; starPathC(c, 0, -r * 0.9, r * 0.1, r * 0.05, 0); c.fill();
  leaf(c, r * 0.04, -r * 0.92, r * 0.55, r * 0.17, -0.45);
  shine(c, -r * 0.38, -r * 0.42, r * 0.3, r * 0.15, -0.7, 0.45);
}
function faceOrange(c) {
  c.fillStyle = '#ff9418'; ell(c, 0, 0, 1, 1); c.fill();
  c.fillStyle = '#fff2d2'; ell(c, 0, 0, 0.9, 0.9); c.fill();
  const n = 10, st = TAU / n;
  for (let i = 0; i < n; i++) {
    const a = i * st; c.beginPath(); c.moveTo(Math.cos(a + st / 2) * 0.1, Math.sin(a + st / 2) * 0.1);
    c.arc(0, 0, 0.82, a + 0.05, a + st - 0.05); c.closePath();
    c.fillStyle = rg(c, 0, 0, 0.1, 0, 0, 0.85, [0, '#ffd27a', 0.6, '#ffaa2e', 1, '#ff9a1a']); c.fill();
  }
  c.fillStyle = '#fff6e0'; ell(c, 0, 0, 0.1, 0.1); c.fill();
}
function drawApple(c, r) {
  c.beginPath();
  c.moveTo(0, -r * 0.62);
  c.bezierCurveTo(r * 0.5, -r * 1.05, r * 1.08, -r * 0.55, r * 0.95, r * 0.1);
  c.bezierCurveTo(r * 0.85, r * 0.75, r * 0.4, r * 1.0, 0, r * 0.85);
  c.bezierCurveTo(-r * 0.4, r * 1.0, -r * 0.85, r * 0.75, -r * 0.95, r * 0.1);
  c.bezierCurveTo(-r * 1.08, -r * 0.55, -r * 0.5, -r * 1.05, 0, -r * 0.62);
  c.closePath();
  c.save();
  c.fillStyle = rg(c, -r * 0.35, -r * 0.3, r * 0.08, 0, 0, r * 1.05, [0, '#ff9a8a', 0.45, '#e8343a', 1, '#8e1414']); c.fill();
  c.clip();
  c.fillStyle = rg(c, r * 0.5, r * 0.35, 0, r * 0.5, r * 0.35, r * 0.6, [0, 'rgba(255,210,90,.45)', 1, 'rgba(255,210,90,0)']); c.fillRect(-r, -r, 2 * r, 2 * r);
  c.restore();
  rimShade(c);
  c.strokeStyle = '#6b3d1c'; c.lineWidth = r * 0.1; c.lineCap = 'round';
  c.beginPath(); c.moveTo(0, -r * 0.55); c.quadraticCurveTo(-r * 0.02, -r * 0.85, r * 0.12, -r * 1.08); c.stroke();
  leaf(c, r * 0.06, -r * 0.82, r * 0.6, r * 0.2, -0.35);
  shine(c, -r * 0.45, -r * 0.3, r * 0.22, r * 0.12, -1.0, 0.5);
}
function faceApple(c) {
  c.fillStyle = '#d32f2f'; ell(c, 0, 0, 1, 1); c.fill();
  c.fillStyle = rg(c, 0, 0, 0.1, 0, 0, 0.95, [0, '#fffbe6', 1, '#f5e3a6']); ell(c, 0, 0, 0.94, 0.94); c.fill();
  c.fillStyle = '#efd88f'; starPathC(c, 0, 0, 0.36, 0.2, 0); c.fill();
  c.fillStyle = '#5a2e12';
  for (let i = 0; i < 5; i++) { const a = i * TAU / 5 - Math.PI / 2; ell(c, Math.cos(a) * 0.2, Math.sin(a) * 0.2, 0.08, 0.045, a); c.fill(); }
}
function drawBanana(c, r, p) {
  const s = r;
  function body() {
    c.beginPath(); c.moveTo(-0.5 * s, -1.0 * s);
    c.quadraticCurveTo(1.12 * s, -0.05 * s, -0.5 * s, 1.0 * s);
    c.quadraticCurveTo(-0.08 * s, 0, -0.5 * s, -1.0 * s);
    c.closePath();
  }
  c.lineJoin = 'round';
  body(); c.fillStyle = lg(c, -0.3 * s, 0, 0.3 * s, 0, [0, p.light, 0.45, p.mid, 1, p.dark]); c.fill();
  c.strokeStyle = p.dark; c.lineWidth = s * 0.07; c.stroke();

    ctx.beginPath(); ctx.arc(0, 0, 20 + k * Math.max(W, H) * 0.45, 0, TAU); ctx.stroke();
  }
  drawTrail();
  drawTexts();
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  if (fxFreeze > 0 || (timeScale < 0.95 && state !== 'ending')) {
    ctx.globalAlpha = clamp(fxFreeze > 0 ? Math.min(1, fxFreeze * 2, (5 - fxFreeze) * 4) : (1 - timeScale), 0, 1);
    ctx.drawImage(frostSpr, 0, 0, cv.width, cv.height);
    ctx.globalAlpha = 1;
  }
  if (fxFrenzy > 0) {
    ctx.globalAlpha = 0.25 + Math.sin(clock * 12) * 0.08;
    ctx.fillStyle = rg(ctx, cv.width / 2, cv.height / 2, Math.min(cv.width, cv.height) * 0.3, cv.width / 2, cv.height / 2, Math.hypot(cv.width, cv.height) * 0.55, [0, 'rgba(255,90,20,0)', 1, 'rgba(255,90,20,.9)']);
    ctx.fillRect(0, 0, cv.width, cv.height); ctx.globalAlpha = 1;
  }
  if (flash > 0) { ctx.globalAlpha = Math.min(1, flash) * 0.85; ctx.fillStyle = flashCol; ctx.fillRect(0, 0, cv.width, cv.height); ctx.globalAlpha = 1; }
  if (state === 'play' || state === 'paused' || state === 'ending') drawHUD();
}

function bladeColor() { return fxFrenzy > 0 ? 'rgba(255,150,60,' : fxDouble > 0 ? 'rgba(210,140,255,' : fxFreeze > 0 ? 'rgba(140,220,255,' : 'rgba(150,215,255,'; }
function ribbon(wid) {
  const n = tn;
  for (let i = 0; i < n; i++) {
    const a = i > 0 ? i - 1 : 0, b = i < n - 1 ? i + 1 : n - 1;
    let dx = tx[b] - tx[a], dy = ty[b] - ty[a]; const l = Math.hypot(dx, dy) || 1; dx /= l; dy /= l;
    const age = clamp(1 - (clock - tt[i]) / TRLIFE, 0, 1);
    const w = wid * Math.pow(i / (n - 1), 0.75) * (0.35 + 0.65 * age);
    lx[i] = tx[i] - dy * w; ly[i] = ty[i] + dx * w; rx2[i] = tx[i] + dy * w; ry2[i] = ty[i] - dx * w;
  }
  ctx.beginPath(); ctx.moveTo(lx[0], ly[0]);
  for (let i = 1; i < n; i++) ctx.lineTo(lx[i], ly[i]);
  const hw = Math.hypot(lx[n - 1] - tx[n - 1], ly[n - 1] - ty[n - 1]);
  ctx.arc(tx[n - 1], ty[n - 1], hw, Math.atan2(ly[n - 1] - ty[n - 1], lx[n - 1] - tx[n - 1]), Math.atan2(ry2[n - 1] - ty[n - 1], rx2[n - 1] - tx[n - 1]), true);
  for (let i = n - 1; i >= 0; i--) ctx.lineTo(rx2[i], ry2[i]);
  ctx.closePath();
}
function drawTrail() {
  const showKb = kbOn && (state === 'play' || state === 'title') && clock - kbLastMove < 4;
  ctx.setTransform(RS, 0, 0, RS, 0, 0);
  if (tn >= 2) {
    ctx.globalCompositeOperation = 'lighter';
    ctx.fillStyle = bladeColor() + '0.35)'; ribbon(15); ctx.fill();
    ctx.fillStyle = bladeColor() + '0.6)'; ribbon(8); ctx.fill();
    ctx.globalCompositeOperation = 'source-over';
    ctx.fillStyle = '#ffffff'; ribbon(3.6); ctx.fill();
    ctx.globalCompositeOperation = 'lighter';
    const hx = tx[tn - 1], hy = ty[tn - 1]; ctx.drawImage(bladeTip, hx - 18, hy - 18, 36, 36);
    ctx.globalCompositeOperation = 'source-over';
  }
  if (showKb) {
    ctx.strokeStyle = 'rgba(255,255,255,.85)'; ctx.lineWidth = 2.5;
    ctx.beginPath(); ctx.arc(kbX, kbY, 12 + Math.sin(clock * 6) * 2, 0, TAU); ctx.stroke();
    ctx.globalCompositeOperation = 'lighter'; ctx.drawImage(bladeTip, kbX - 14, kbY - 14, 28, 28); ctx.globalCompositeOperation = 'source-over';
  }
}
function txt(s, x, y, size, fill, stroke, sw, align) {
  ctx.font = '900 ' + size + 'px ' + FONT; ctx.textAlign = align || 'center'; ctx.textBaseline = 'middle'; ctx.lineJoin = 'round';
  ctx.strokeStyle = 'rgba(40,15,0,.35)'; ctx.lineWidth = sw + 2; ctx.strokeText(s, x, y + size * 0.08);
  ctx.strokeStyle = stroke; ctx.lineWidth = sw; ctx.strokeText(s, x, y);
  ctx.fillStyle = fill; ctx.fillText(s, x, y);
}
function drawX(x, y, s, on, pop) {
  ctx.lineCap = 'round';
  const sc = 1 + pop * 0.35;
  const k = s * 0.5 * sc;
  ctx.strokeStyle = on ? '#5a0a0a' : 'rgba(40,15,0,.35)'; ctx.lineWidth = s * 0.42 * sc;
  ctx.beginPath(); ctx.moveTo(x - k, y - k); ctx.lineTo(x + k, y + k); ctx.moveTo(x + k, y - k); ctx.lineTo(x - k, y + k); ctx.stroke();
  ctx.strokeStyle = on ? '#ff3b3b' : 'rgba(255,240,220,.55)'; ctx.lineWidth = s * 0.24 * sc;
  ctx.stroke();
}
function drawTexts() {
  for (const t of texts) {
    if (!t.on) continue;
    const p = t.t / t.life, a = p > 0.7 ? 1 - (p - 0.7) / 0.3 : 1;
    const sc = t.t < 0.22 ? Math.max(0.01, outBack(t.t / 0.22)) : 1;
    ctx.globalAlpha = a;
    ctx.setTransform(RS * sc, 0, 0, RS * sc, (t.x + shx) * RS, (t.y + shy) * RS);
    if (t.miss) { drawX(0, 0, 34, true, 0); continue; }
    txt(t.s, 0, 0, t.size, t.col, t.stroke, t.size * 0.24);
    if (t.sub) txt(t.sub, 0, t.size * 0.85, t.size * 0.5, '#fff7d6', t.stroke, t.size * 0.14);
  }
  ctx.globalAlpha = 1;
}
function pill(x, y, w, h) {
  ctx.beginPath(); if (ctx.roundRect) ctx.roundRect(x, y, w, h, h / 2); else ctx.rect(x, y, w, h);
}
function drawHUD() {
  ctx.setTransform(RS, 0, 0, RS, 0, 0);
  // 分數（上方中央）
  const sc = 1 + scorePop * 0.35;
  const cx = W / 2, cy = 34;
  ctx.save(); ctx.translate(cx, cy); ctx.scale(sc, sc);
  const sStr = String(Math.round(shownScore));
  ctx.font = '900 40px ' + FONT; const tw = ctx.measureText(sStr).width;
  const icon = SPRITES.watermelon, iw = 30;
  ctx.drawImage(icon.top, -tw / 2 - iw - 8 - iw * 0.25, -iw * 0.75, iw * 1.5, iw * 1.5);
  txt(sStr, iw / 2 - 2, 0, 40, fxDouble > 0 ? '#f3d8ff' : '#fff', fxDouble > 0 ? '#5a1a9a' : '#7a3a0a', 9);
  ctx.restore();
  const best = Math.max(bestAtStart, score);
  txt('最高 ' + best, cx, 68, 15, score > bestAtStart && bestAtStart > 0 ? '#ffe46a' : '#fff1d8', '#5a2a0a', 4.5);

  // 左側：失誤或時間
  const lx0 = 14, ly0 = 84;
  if (mode === 'classic') {
    for (let i = 0; i < 3; i++) drawX(lx0 + 16 + i * 32, ly0, 22, i < misses, i === misses - 1 ? missPop : 0);
  } else {
    const tl = Math.ceil(timeLeft), low = tl <= 10 && state === 'play';
    const pulse = low ? 1 + Math.max(0, Math.sin(clock * 10)) * 0.08 : 1;
    ctx.save(); ctx.translate(lx0, ly0 - 18); ctx.scale(pulse, pulse);
    pill(0, 0, 92, 36); ctx.fillStyle = low ? 'rgba(160,20,20,.75)' : 'rgba(50,22,6,.55)'; ctx.fill();
    ctx.strokeStyle = 'rgba(255,240,220,.7)'; ctx.lineWidth = 2; ctx.stroke();
    // 時鐘
    ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(19, 18, 10, 0, TAU); ctx.fill();
    ctx.strokeStyle = low ? '#c01818' : '#7a3a0a'; ctx.lineWidth = 2.2; ctx.lineCap = 'round';
    const fr = MODES[mode].time ? 1 - timeLeft / MODES[mode].time : 0;
    ctx.beginPath(); ctx.moveTo(19, 18); ctx.lineTo(19 + Math.sin(fr * TAU) * 6.5, 18 - Math.cos(fr * TAU) * 6.5); ctx.moveTo(19, 18); ctx.lineTo(19, 13); ctx.stroke();
    txt(String(tl), 60, 19, 24, '#fff', low ? '#6a0a0a' : '#5a2a0a', 5);
    ctx.restore();
  }
  // 特效倒數條
  let by = ly0 + 28;
  const bars = [[fxFreeze, 5, '冰凍', '#7fd4ff'], [fxFrenzy, 4, '狂熱', '#ff7a3d'], [fxDouble, 6, '雙倍', '#c77dff']];
  for (const b of bars) {
    if (b[0] <= 0) continue;
    pill(lx0, by, 112, 24); ctx.fillStyle = 'rgba(40,18,4,.55)'; ctx.fill();
    pill(lx0 + 3, by + 3, Math.max(18, 106 * b[0] / b[1]), 18); ctx.fillStyle = b[3]; ctx.fill();
    txt(b[2], lx0 + 56, by + 12.5, 14, '#fff', 'rgba(30,10,0,.8)', 3.5);
    by += 30;
  }
}

/* =========================================================
 * 尺寸、品質、主迴圈
 * ========================================================= */
let lastR0 = 0, lastSPR = 0;
function resize() {
  W = innerWidth; H = innerHeight;
  const dpr = window.devicePixelRatio || 1;
  RS = Math.max(1, dpr * QMUL[quality]); if (dpr < 1) RS = dpr;
  cv.width = Math.round(W * RS); cv.height = Math.round(H * RS);
  R0 = clamp(Math.min(W, H) * 0.085, 28, 54);
  G = clamp(H * 1.55, 520, 1500);
  SPR = Math.min(2, dpr);
  if (Math.abs(R0 - lastR0) > 0.5 || SPR !== lastSPR) {
    lastR0 = R0; lastSPR = SPR; buildAll();
    for (const f of fruits) if (f.on) { f.spr = f.bomb ? null : SPRITES[f.type]; f.r = f.bomb ? bombSpr.r : TYPES[f.type].r * R0; f.hr = f.bomb ? f.r * 0.85 : f.r * (TYPES[f.type].hit || 0.92); }
    for (const h of halves) h.on = false;
  }
  partCap = Math.round(MAXP * (quality === 2 ? 1 : quality === 1 ? 0.6 : 0.4));
  buildBackground();
}
let resizeT = 0;
window.addEventListener('resize', () => { clearTimeout(resizeT); resizeT = setTimeout(resize, 80); });

const perf = { last: 0, n: 0, sum: 0, cool: 3 };
function governor() {
  const now = performance.now(), dt = perf.last ? Math.min(0.5, (now - perf.last) / 1000) : 0;
  perf.last = now;
  if (document.hidden || quality === 0 || state === 'title' && clock < 2) return;
  perf.cool -= dt; if (perf.cool > 0) return;
  if (dt > 0.2) return;
  perf.sum += dt; perf.n++;
  if (perf.n >= 90) {
    if (perf.sum / perf.n > 1 / 48) { quality--; resize(); perf.cool = 2; }
    perf.n = 0; perf.sum = 0;
  }
}
let last = performance.now();
function frame(now) {
  const dt = Math.max(0, Math.min(0.05, (now - last) / 1000)); last = now;
  if (!document.hidden) { update(dt); draw(); governor(); }
  requestAnimationFrame(frame);
}

// 標題字與模式圖示
(function () {
  const logo = document.querySelector('.fs-logo'), cols = ['#ff5a6e', '#ffa21f', '#ffe14d', '#8fd14f', '#5ec8ff'];
  [...'水果切切樂'].forEach((ch, i) => { const s = document.createElement('span'); s.textContent = ch; s.style.setProperty('--c', cols[i % cols.length]); s.style.setProperty('--i', i); logo.appendChild(s); });
})();
function makeIcons() {
  const keep = R0, keepS = SPR; R0 = 40; SPR = 2;
  const icon = (fn) => { const c = mkCanvas(128, 128), x = c.getContext('2d'); x.scale(2, 2); x.translate(32, 33); fn(x); return c.toDataURL(); };
  const imgs = document.querySelectorAll('.fs-mode img');
  imgs[0].src = icon(x => drawWatermelon(x, 26));
  imgs[1].src = icon(x => { x.translate(-4, 2); drawOrange(x, 22); x.translate(16, 10); x.fillStyle = '#fff'; x.strokeStyle = '#7a3a0a'; x.lineWidth = 3; x.beginPath(); x.arc(0, 0, 11, 0, TAU); x.fill(); x.stroke(); x.lineCap = 'round'; x.beginPath(); x.moveTo(0, 0); x.lineTo(0, -6); x.moveTo(0, 0); x.lineTo(5, 2); x.stroke(); });
  imgs[2].src = icon(x => drawPeach(x, 24));
  R0 = keep; SPR = keepS;
}

resize();
makeIcons();
refreshTitle();
Music.start(SONG_TITLE);
requestAnimationFrame(frame);

/* ---------- 測試掛勾 ---------- */
window.__fs = {
  state: () => ({ state, mode, score, misses, timeLeft: +timeLeft.toFixed(2), fruits: activeCount(), halves: halves.filter(h => h.on).length, parts: partCount, stains: stains.filter(s => s.on).length, fx: { freeze: +fxFreeze.toFixed(2), frenzy: +fxFrenzy.toFixed(2), double: +fxDouble.toFixed(2) }, quality, timeScale: +timeScale.toFixed(2), sliced, maxCombo, R0, W, H }),
  start: m => startGame(m || 'classic'),
  title: () => toTitle(),
  pause, resume,
  spawn: (type, x, y, vx, vy) => { const f = launch(type, x == null ? {} : { x, y, vx: vx || 0, vy: vy || 0 }); if (f) f.age = 1; return !!f; },
  fruitsPos: () => fruits.filter(f => f.on).map(f => ({ type: f.type, x: Math.round(f.x), y: Math.round(f.y), r: Math.round(f.r) })),
  slice: (x1, y1, x2, y2) => { tn = 0; trailPush(x1, y1); lastPX = x1; lastPY = y1; const n = 8; for (let i = 1; i <= n; i++) handlePoint(x1 + (x2 - x1) * i / n, y1 + (y2 - y1) * i / n); endSwipe(); },
  step: sec => { for (let i = 0; i < sec * 60; i++) update(1 / 60); draw(); },
  noSpawn: on => { noSpawn = !!on; },
  clear: () => { for (const f of fruits) f.on = false; queue.length = 0; },
  setScore: v => { score = v; shownScore = v; },
  setTime: v => { timeLeft = v; },
  hold: on => { hold = !!on; }
};
})();
</script>
</body>
