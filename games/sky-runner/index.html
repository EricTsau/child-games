<body>
<div id="msg">3D 極速跑酷 載入中…</div>
<canvas id="gl" aria-label="3D 極速跑酷遊戲畫面"></canvas>

<div id="hud" hidden>
  <div class="hud-top"><div id="score">0</div><div id="multB">×1</div></div>
  <div id="dist">0 m</div>
  <div id="coinsB"><span class="ci"></span><b id="coinN">0</b></div>
  <div id="pows"></div>
  <button id="pauseBtn" aria-label="暫停"><i></i><i></i></button>
  <div id="banner"></div>
  <div id="hint">← 左右滑動換跑道 →<br>↑ 往上滑跳躍　↓ 往下滑滑行</div>
  <div id="flash"></div>
</div>
<div id="cdown"></div>

<div id="title" class="ov">
  <div class="logo"><span class="l1">3D 極速跑酷</span><span class="l2">夕陽天空城 · SKY RUNNER</span></div>
  <div class="t-bot">
    <div class="t-stats"><span>最佳 <b id="tBest">0</b></span><span><span class="ci"></span> <b id="tCoins">0</b></span><span>倍率 ×<b id="tMult">1</b></span></div>
    <button class="btn big go" data-act="start">開始奔跑</button>
    <div class="row">
      <button class="btn alt" data-act="daily">每日挑戰</button>
      <button class="btn" data-act="shop">商店</button>
      <button class="btn" data-act="missions">任務</button>
    </div>
    <div class="tap">點一下畫面也能開始</div>
  </div>
</div>

<div id="shop" class="ov sheet">
  <div class="panel">
    <div class="ph"><h3>商店</h3><span class="wallet"><span class="ci"></span><b class="cN">0</b></span><button class="btn" data-act="back">返回</button></div>
    <div class="tabs"><button data-tab="char" class="on">角色造型</button><button data-tab="up">道具升級</button></div>
    <div class="list" id="shopList"></div>
  </div>
</div>

<div id="missions" class="ov sheet">
  <div class="panel">
    <div class="ph"><h3>任務</h3><span class="wallet">倍率 ×<b id="mMult">1</b></span><button class="btn" data-act="back">返回</button></div>
    <div class="mnote">完成三個任務，分數倍率永久 +1！每個任務也會送金幣。</div>
    <div class="list" id="mList"></div>
  </div>
</div>

<div id="pause" class="ov center">
  <div class="card">
    <h2>暫停</h2>
    <div class="sub" id="pInfo"></div>
    <div class="stack">
      <button class="btn big go" data-act="resume">繼續</button>
      <div class="row2"><button class="btn" data-act="restart">重新開始</button><button class="btn" data-act="menu">主選單</button></div>
    </div>
  </div>
</div>

<div id="revive" class="ov center">
  <div class="card">
    <h2>再給你一次機會！</h2>
    <div class="sub">每一局可以復活一次</div>
    <div class="ring"><svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="44" fill="none" stroke="rgba(255,255,255,.15)" stroke-width="9"/><circle id="rvArc" cx="50" cy="50" r="44" fill="none" stroke="#ffb35c" stroke-width="9" stroke-linecap="round" stroke-dasharray="276.5" stroke-dashoffset="0"/></svg><b id="rvN">5</b></div>
    <div class="stack">
      <button class="btn big go" data-act="revive">繼續跑！</button>
      <button class="btn" data-act="giveup">結束這一局</button>
    </div>
  </div>
</div>

<div id="over" class="ov center">
  <div class="card ocard">
    <div class="ocol">
    <h2 id="oTitle">撞到了！</h2>
    <div class="big" id="oScore">0</div>
    <div id="oBest" class="sub"></div>
    <div class="stats"><div>距離<b id="oDist">0</b></div><div>金幣<b id="oCoins">0</b></div><div>驚險閃避<b id="oNear">0</b></div></div>
    <div class="sub" id="oDaily"></div>
    </div>
    <div class="ocol">
    <div class="mini" id="oMis"></div>
    <div class="stack">
      <button class="btn big go" data-act="again">再跑一次</button>
      <div class="row2"><button class="btn" data-act="shop">商店</button><button class="btn" data-act="menu">主選單</button></div>
    </div>
    </div>
  </div>
</div>

<script type="module">
import * as THREE from 'three';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

let renderer = null;
try {
  renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('gl'), antialias: true, powerPreference: 'high-performance' });
} catch (e) { renderer = null; }
if (!renderer) document.getElementById('msg').textContent = '這個遊戲需要支援 3D（WebGL）的瀏覽器，請換一個瀏覽器或裝置再試試看。';
else main();

function main() {
  const $ = id => document.getElementById(id);
  const cv = $('gl');
  const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
  const lerp = (a, b, t) => a + (b - a) * t;
  const TAU = Math.PI * 2;
  function mulberry(seed) {
    return function () {
      seed |= 0; seed = seed + 0x6D2B79F5 | 0;
      let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }
  const fmt = n => Math.floor(n).toLocaleString('en-US');

  /* =========================================================
   * 存檔
   * ========================================================= */
  const SKEY = 'sky-runner:save';
  const save = Object.assign({ coins: 0, outfit: 0, owned: [0], up: {}, mult: 1, setNo: 0, ms: null, runs: 0, daily: {} }, KG.store.get(SKEY, {}));
  save.up = Object.assign({ magnet: 0, shield: 0, dbl: 0, jet: 0, sjump: 0 }, save.up);
  function persist() { KG.store.set(SKEY, save); }
  let best = KG.best('sky-runner') || 0;

  /* =========================================================
   * 規則常數
   * ========================================================= */
  const STEP = 1 / 60;
  const LW = 2.2, TILE = 4, BASE_SPEED = 13, MAX_SPEED = 30;
  const PHW = 0.32, PHD = 0.3, PH_STAND = 1.55, PH_SLIDE = 0.72;
  const TRAM_H = 2.6, MV_K = 0.45, MV_D = 55, GEN_AHEAD = 182;
  const laneX = l => (l - 1) * LW;
  const DEF = {
    hurdle: { hw: 0.9, hd: 0.12, yb: 0, yt: 0.92 },
    bar: { hw: 0.95, hd: 0.12, yb: 1.3, yt: 2.2 },
    wall: { hw: 0.88, hd: 0.65, yb: 0, yt: 2.45, stand: true },
    mtram: { hw: 0.95, hd: 4, yb: 0, yt: TRAM_H, stand: true, mv: true },
    tram: { hw: 0.95, hd: 1, yb: 0, yt: TRAM_H, stand: true },
    ramp: { hw: 0.95, hd: 1, yb: 0, yt: TRAM_H, ramp: true }
  };
  const POW = {
    magnet: { name: '金幣磁鐵', color: '#ff5d6c', base: 9, per: 2.5 },
    shield: { name: '泡泡護盾', color: '#3fc8ff', base: 10, per: 3 },
    dbl: { name: '雙倍金幣', color: '#ffb52e', base: 9, per: 2.5 },
    jet: { name: '滑翔翼', color: '#9b6bff', base: 5, per: 1.2 },
    sjump: { name: '彈跳鞋', color: '#3fcf6a', base: 9, per: 2.5 }
  };
  const POW_KEYS = Object.keys(POW);
  const powDur = k => POW[k].base + POW[k].per * save.up[k];
  const UP_COST = [250, 600, 1200, 2500, 5000];

  let fixedSpeed = 0, diffBias = 0, noPower = false, god = false;
  const speedAt = d => fixedSpeed || Math.min(MAX_SPEED, BASE_SPEED + d / 250);
  const tScale = sp => Math.pow(BASE_SPEED / sp, 0.35);
  function jumpV(sp, sup) { const T = (sup ? 1.15 : 0.66) * tScale(sp), h = sup ? 4.3 : 1.55; return 4 * h / T; }
  function jumpG(sp, sup) { const T = (sup ? 1.15 : 0.66) * tScale(sp), h = sup ? 4.3 : 1.55; return 8 * h / (T * T); }
  const slideDur = sp => 0.62 * tScale(sp);

  /* =========================================================
   * 世界資料：障礙物、坑洞、金幣、道具
   * ========================================================= */
  const obs = [];
  let obsStart = 0;
  const gapSet = new Set();
  const coins = [];
  const pups = [];
  const mvZ = (o, d) => o.mv ? o.z - MV_K * Math.max(0, d - (o.z - MV_D)) : o.z;

  function groundAt(x, d, y) {
    const l = Math.round(x / LW) + 1;
    let g = 0;
    const ti = Math.floor(d / TILE), off = d - ti * TILE;
    const hole = l >= 0 && l <= 2 && Math.abs(x - laneX(l)) < 0.8 && off > 0.3 && off < TILE - 0.3 && gapSet.has(ti * 4 + l);
    for (let i = obsStart; i < obs.length; i++) {
      const o = obs[i];
      if (o.z - o.hd > d + 40) break;
      if (o.dead) continue;
      if (o.ramp) {
        if (Math.abs(x - o.x) < o.hw && d >= o.z - o.hd && d <= o.z + o.hd) {
          const hh = o.yt * (d - (o.z - o.hd)) / (2 * o.hd);
          if (hh > g) g = hh;
        }
      } else if (o.stand && y >= o.yt - 0.55 && o.yt > g) {
        const zc = mvZ(o, d);
        if (Math.abs(x - o.x) < o.hw + 0.1 && Math.abs(d - zc) < o.hd + PHD) g = o.yt;
      }
    }
    if (hole && g < 0.01) return -99;
    return g;
  }

  function newPlayer() {
    return { dist: 0, speed: BASE_SPEED, lane: 1, prevLane: 1, laneT: 9, x: 0, y: 0, vy: 0, g: jumpG(BASE_SPEED, false), air: false, airStart: 0, coyote: 0,
      slideT: 0, dropSlide: false, holeFall: false, jumpBuf: 0, bounceCd: 0, inv: 0, t: 0, dead: null, deadO: null,
      magnet: 0, shield: 0, dbl: 0, jet: 0, sjump: 0, jumps: 0, slides: 0, lanes: 0, stumbles: 0, godHits: 0 };
  }
  let P = newPlayer();

  function doJump(Q, E) {
    const sup = Q.sjump > 0;
    Q.vy = jumpV(Q.speed, sup); Q.g = jumpG(Q.speed, sup);
    Q.air = true; Q.airStart = Q.t; Q.slideT = 0; Q.coyote = 0; Q.jumpBuf = 0; Q.dropSlide = false; Q.holeFall = false; Q.jumps++;
    if (E) E(sup ? 'sjump' : 'jump');
  }
  function applyInput(Q, dir, E) {
    if (Q.dead) return;
    if (dir === 'left' || dir === 'right') {
      const nl = Q.lane + (dir === 'left' ? -1 : 1);
      if (nl < 0 || nl > 2) { if (E) E('edge', dir); return; }
      Q.prevLane = Q.lane; Q.lane = nl; Q.laneT = 0; Q.lanes++;
      if (E) E('lane', dir);
    } else if (dir === 'up') {
      if (Q.jet > 0) return;
      if (!Q.air || Q.coyote > 0) doJump(Q, E); else Q.jumpBuf = 0.2;
    } else if (dir === 'down') {
      if (Q.jet > 0) return;
      if (Q.air) { if (Q.vy > -24) Q.vy = -24; Q.dropSlide = true; Q.jumpBuf = 0; if (E) E('drop'); }
      else { Q.slideT = slideDur(Q.speed); Q.slides++; if (E) E('slide'); }
    }
  }

  // 單步模擬（真正遊戲與 AI 預測共用同一份規則）
  function simStep(Q, dt, E) {
    if (Q.dead) return;
    Q.t += dt;
    const sp = Q.speed = speedAt(Q.dist);
    const d0 = Q.dist;
    Q.dist += sp * dt;
    const d = Q.dist;
    if (Q.inv > 0) Q.inv -= dt;
    if (Q.bounceCd > 0) Q.bounceCd -= dt;
    Q.laneT += dt;
    if (Q.magnet > 0) Q.magnet -= dt;
    if (Q.dbl > 0) Q.dbl -= dt;
    if (Q.sjump > 0) Q.sjump -= dt;
    if (Q.shield > 0) Q.shield -= dt;
    if (Q.jumpBuf > 0) Q.jumpBuf -= dt;
    if (Q.coyote > 0) Q.coyote -= dt;
    if (Q.slideT > 0) Q.slideT -= dt;
    if (Q.jet > 0) {
      Q.jet -= dt;
      if (Q.jet <= 0) { Q.jet = 0; Q.inv = Math.max(Q.inv, 1.5); Q.vy = 0; Q.air = true; Q.airStart = Q.t; Q.g = jumpG(sp, false); if (E) E('jetEnd'); }
    }
    // 左右
    const tx = laneX(Q.lane), dx = tx - Q.x, mv = 15.5 * dt;
    Q.x = Math.abs(dx) <= mv ? tx : Q.x + Math.sign(dx) * mv;
    // 上下
    if (Q.jet > 0) {
      Q.y += (5.2 - Q.y) * Math.min(1, dt * 3.5); Q.vy = 0; Q.air = true;
    } else {
      const g = groundAt(Q.x, d, Q.y);
      if (Q.air) {
        Q.vy -= Q.g * dt; Q.y += Q.vy * dt;
        if (Q.vy <= 0 && Q.y <= g && Q.y >= g - (Q.holeFall ? 0.05 : 0.9)) {
          const airT = Q.t - Q.airStart;
          Q.air = false; Q.y = g; Q.vy = 0; Q.holeFall = false;
          if (E) E('land', airT);
          if (Q.dropSlide) { Q.dropSlide = false; Q.slideT = slideDur(sp); Q.slides++; if (E) E('slide'); }
          if (Q.jumpBuf > 0) doJump(Q, E);
        }
      } else if (g > Q.y - 0.02 && g - Q.y < 0.9) {
        Q.y = g;
      } else if (g < Q.y - 0.02) {
        Q.air = true; Q.vy = 0; Q.coyote = 0.1; Q.airStart = Q.t; Q.g = jumpG(sp, false);
        // 直接走進坑洞：除非馬上跳（有一點寬限時間），否則一定掉下去
        if (g < -50) Q.holeFall = true;
      }
    }
    // 碰撞
    if (Q.jet <= 0) {
      const h = Q.slideT > 0 ? PH_SLIDE : PH_STAND;
      for (let i = obsStart; i < obs.length; i++) {
        const o = obs[i];
        if (o.z - o.hd > d + 40) break;
        if (o.dead || o.ramp) continue;
        const zc = o.mv ? mvZ(o, d) : o.z;
        const r = o.hd + PHD - 0.1;
        if (d < zc - r || d0 > zc + r + (o.mv ? sp * dt : 0)) continue;
        if (Math.abs(Q.x - o.x) >= o.hw + PHW - 0.22) continue;
        if (o.stand && Q.y >= o.yt - 0.55) continue;
        if (Q.y >= o.yt - 0.12 || Q.y + h <= o.yb + 0.12) continue;
        const zp = o.mv ? mvZ(o, d0) : zc;
        const wasZ = Math.abs(d0 - zp) < r;
        if (wasZ || (Q.laneT < 0.12 && Q.x !== laneX(Q.lane))) {
          // 側面擦撞：彈回原本的跑道，不算死亡
          if (Q.bounceCd <= 0) {
            const from = Q.lane; Q.lane = Q.prevLane; Q.prevLane = from; Q.laneT = 9; Q.bounceCd = 0.35; Q.stumbles++;
            if (E) E('stumble', o);
          }
          continue;
        }
        if (Q.inv > 0) continue;
        if (Q.shield > 0) { Q.shield = 0; Q.inv = 1; if (E) E('shield', o); continue; }
        if (Q.god) { Q.inv = 0.4; Q.godHits++; if (E) E('godhit', o); continue; }
        Q.dead = 'hit'; Q.deadO = o;
        if (E) E('hit', o);
        return;
      }
    }
    // 掉進坑洞
    if ((Q.y < -0.8 || (Q.holeFall && Q.y < -0.35 && groundAt(Q.x, d, 0) > -50)) && Q.jet <= 0) {
      if (Q.inv > 0 || Q.shield > 0 || Q.god) {
        if (Q.inv <= 0 && Q.shield > 0) Q.shield = 0;
        if (Q.god && Q.inv <= 0 && !(Q.shield > 0)) Q.godHits++;
        Q.vy = jumpV(sp, false) * 1.25; Q.g = jumpG(sp, false); Q.air = true; Q.airStart = Q.t; Q.y = Math.min(Q.y, -0.3); Q.inv = Math.max(Q.inv, 0.7); Q.holeFall = false;
        if (E) E('rescue');
      } else { Q.dead = 'fall'; if (E) E('fall'); }
    }
  }

  /* =========================================================
   * 關卡產生：手工設計的障礙組合，隨機拼接
   *  . 空  h 低柵欄(跳)  b 高橫幅(滑)  w 煙囪(換道)  g 坑洞(跳)
   *  m 迎面纜車  r 斜坡  T 停靠纜車（可跑上去）
   * ========================================================= */
  const PATS = [
    [0, ['h..']], [0, ['.h.']], [0, ['b..']], [0, ['.b.']], [0, ['hhh']], [0, ['bbb']],
    [0, ['w.w']], [0, ['ww.']], [0, ['g..']], [0, ['.g.']], [0, ['ggg']], [0, ['h..', '...', '..b']],
    [0, ['...', '...', '...', 'm..']], [0, ['w..', '...', '..w']], [0, ['r..', 'T..', 'T..', 'T..']],
    [1, ['w.h', '...', 'b.w']], [1, ['rw.', 'T..', 'T.h', 'T..']], [1, ['hbh']], [1, ['w.w', '...', 'bbb']],
    [1, ['...', '...', '...', 'm.m']], [1, ['ggg', '...', 'hhh']], [1, ['.w.', '...', 'w.w', '...', 'bbb']],
    [1, ['g.w', '...', 'w.g']], [1, ['r..', 'T.w', 'T..', 'T.b']], [1, ['.r.', '.T.', 'wT.', '.Tw']],
    [1, ['T.T', 'T.T', 'T.T']], [1, ['hgb']],
    [2, ['hwb']], [2, ['w.w', '.h.', '...', 'w.w']], [2, ['rr.', 'TT.', 'TT.', 'TTb']], [2, ['...', 'b.h', '...', 'h.b']],
    [2, ['hhh', '...', 'bbb', '...', 'hhh']], [2, ['w.b', 'w..', 'w.h']], [2, ['...', '..w', '...', '.m.']],
    [2, ['T.T', 'TbT', 'T.T']], [2, ['T.T', 'ThT', 'T.T']], [2, ['r.r', 'T.T', 'T.T', 'TwT']], [2, ['g.g', '...', '.b.', '...', 'h.h']],
    [3, ['hbw', '...', 'wbh', '...', 'bwh']], [3, ['ggg', '...', 'bbb', '...', 'ggg']], [3, ['ww.', '...', '.ww', '...', 'w.w']],
    [3, ['...', '.wh', '...', '...', 'm.w']], [3, ['b.b', '.h.', 'w.w', '.b.']], [3, ['r.w', 'T.b', 'T.h', 'T..']],
    [3, ['w.g', '...', 'g.w', '...', '.g.']], [3, ['...', '...', 'h..', 'm.m']]
  ];
  let rng = mulberry(1), genZ = 0, nextPowZ = 0, runSeed = 1, prevHard = false;
  const coinPool = [];
  function addCoin(x, y, z) {
    const c = coinPool.pop() || {};
    c.x = x; c.y = y; c.z = z; c.alive = true; c.mag = false;
    coins.push(c);
  }
  function addObs(k, lane, zc, hd) {
    const D = DEF[k];
    obs.push({ k, lane, x: laneX(lane), z: zc, hd: hd || D.hd, hw: D.hw, yb: D.yb, yt: D.yt, stand: !!D.stand, mv: !!D.mv, ramp: !!D.ramp, dead: false, passed: false, seed: (zc * 7.3 + lane) % 1 });
  }
  function genReset(seed) {
    rng = mulberry(seed); runSeed = seed;
    for (const c of coins) coinPool.push(c);
    obs.length = 0; obsStart = 0; gapSet.clear(); coins.length = 0; pups.length = 0;
    genZ = 24; prevHard = true; nextPowZ = 200 + rng() * 140;
    for (let z = 14; z < 32; z += 2) addCoin(0, 0.75, z);
  }
  function genPattern() {
    const sp = speedAt(genZ), L = Math.max(5.5, sp * 0.37);
    const diff = Math.min(3, genZ / 800 + diffBias);
    let total = 0;
    const lvl = Math.floor(diff);
    for (const p of PATS) if (p[0] <= diff + 0.25) total += p[0] >= lvl ? 3 : 1;
    let r = rng() * total, pat = PATS[0];
    for (const p of PATS) { if (p[0] > diff + 0.25) continue; r -= p[0] >= lvl ? 3 : 1; if (r < 0) { pat = p; break; } }
    let rows = pat[1];
    if (rng() < 0.5) rows = rows.map(s => s.split('').reverse().join(''));
    // 兩組障礙之間的空白：前一組或這一組比較複雜時多留一點反應時間
    const first = rows[0];
    let gapRows = diff < 1 ? 2 : 1;
    if (prevHard || /[Trm]/.test(first) || (/w/.test(first) && /[hb]/.test(first))) gapRows = 2;
    if (rng() < 0.2) gapRows++;
    const zg = genZ;
    genZ += gapRows * L;
    const z0 = genZ;
    let hasT = false, hasM = false;
    // 金幣路線：避開煙囪與迎面纜車的跑道
    const laneScore = [0, 0, 0];
    for (const row of rows) for (let l = 0; l < 3; l++) {
      const c = row[l];
      if (c === 'w' || c === 'm') laneScore[l] -= 10;
      if (c === 'r') laneScore[l] += 1.5;
      if (c === 'm') hasM = true;
      if (c === 'T') hasT = true;
    }
    for (let l = 0; l < 3; l++) if (rows.some(rw => rw[l] === 'T') && !rows.some(rw => rw[l] === 'r')) laneScore[l] -= 10;
    let cl = Math.floor(rng() * 3);

    const ramps = [null, null, null];

        else if (c === 'b') addObs('bar', l, zc);
        else if (c === 'w') addObs('wall', l, zc);
        else if (c === 'm') addObs('mtram', l, zc);
        else if (c === 'g') gapSet.add(Math.floor(zc / TILE) * 4 + l);
        else if (c === 'r') { const a = zs + 0.6, b = zs + L + 0.05; addObs('ramp', l, (a + b) / 2, (b - a) / 2); ramps[l] = [a, b]; }
        else if (c === 'T' && (i === 0 || rows[i - 1][l] !== 'T')) {
          let e = i;
          while (e + 1 < rows.length && rows[e + 1][l] === 'T') e++;
          const a = zs + (i > 0 && rows[i - 1][l] === 'r' ? 0 : 0.6), b = z0 + (e + 1) * L - 0.6;
          addObs('tram', l, (a + b) / 2, (b - a) / 2);
        }
      }
      if (coinOn) {
        const c = rows[i][cl];
        if (c !== 'w' && c !== 'm') {
          for (let z = zs + 0.95; z < zs + L - 0.2; z += 1.9) {
            let y = 0.75;
            if (c === 'h' || c === 'g') { const u = (z - zc) / (jd / 2); y = 0.75 + 1.25 * Math.max(0, 1 - u * u); }
            else if (c === 'b') y = 0.42;
            else if (c === 'T') y = TRAM_H + 0.75;
            else if (c === 'r' && ramps[cl]) y = 0.75 + TRAM_H * clamp((z - ramps[cl][0]) / (ramps[cl][1] - ramps[cl][0]), 0, 1);
            addCoin(laneX(cl), y, z);
          }
        }
      }
    }
    prevHard = hasT || hasM || /[hgw]/.test(rows[rows.length - 1]);
    if (coinOn) for (let z = zg + L * 0.5; z < z0 - 0.5; z += 1.9) addCoin(laneX(cl), 0.75, z);
    if (!noPower && zg >= nextPowZ) {
      const types = ['magnet', 'magnet', 'shield', 'shield', 'dbl', 'dbl', 'jet', 'sjump', 'sjump'];
      const k = types[Math.floor(rng() * types.length)];
      let l = Math.floor(rng() * 3); if (l === cl) l = (l + 1 + Math.floor(rng() * 2)) % 3;
      pups.push({ k, x: laneX(l), y: 1.05, z: zg + L * 0.5, alive: true });
      nextPowZ = zg + 360 + rng() * 300;
    }
    genZ = z0 + rows.length * L;
  }
  function genUntil(z) { while (genZ < z) genPattern(); }

  /* =========================================================
   * AI（測試與自動驗證用）：往前預測幾種操作，挑不會撞的
   * ========================================================= */
  const ACTS = [null, 'left', 'right', 'up', 'down'];
  const botQ = newPlayer();
  const BOT_T = [0, 0.15, 0.4];
  function botDecide() {
    let bestS = -1e9, bestA = null;
    const st0 = P.stumbles;
    for (let i = 0; i < 125; i++) {
      const a = [ACTS[i % 5], ACTS[Math.floor(i / 5) % 5], ACTS[Math.floor(i / 25)]];
      Object.assign(botQ, P);
      let t = 0, k = 0;
      while (t < 1.45 && !botQ.dead) {
        while (k < 3 && t >= BOT_T[k] - 1e-6) { if (a[k]) applyInput(botQ, a[k], null); k++; }
        simStep(botQ, STEP, null);
        t += STEP;
      }
      let s = botQ.dead ? t - 100 : 0;
      s -= (a[0] ? 0.05 : 0) + (a[1] ? 0.03 : 0) + (a[2] ? 0.02 : 0) + (botQ.stumbles - st0) * 0.5 + (botQ.lane !== 1 ? 0.01 : 0);
      if (s > bestS) { bestS = s; bestA = a[0]; }
    }
    return bestA;
  }

  /* =========================================================
   * 3D 場景
   * ========================================================= */
  let W = 1, H = 1;
  const small = Math.min(innerWidth, innerHeight) < 600;
  renderer.toneMapping = THREE.NeutralToneMapping;
  renderer.toneMappingExposure = 1.0;
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  const scene = new THREE.Scene();
  const FOG = new THREE.Color('#f2a58f');
  scene.fog = new THREE.Fog(FOG, 34, 182);
  scene.background = FOG.clone();
  const pmrem = new THREE.PMREMGenerator(renderer);
  scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
  scene.environmentIntensity = 0.35;
  const camera = new THREE.PerspectiveCamera(60, 1, 0.1, 700);
  scene.add(new THREE.HemisphereLight(0xffe0c8, 0x8a5aa0, 1.25));
  const keyL = new THREE.DirectionalLight(0xfff0dc, 1.7);
  keyL.position.set(-5, 9, 8);
  const SUN = new THREE.Vector3(0.55, 0.13, -0.82).normalize();
  const rimL = new THREE.DirectionalLight(0xff9a5a, 1.6);
  rimL.position.copy(SUN).multiplyScalar(30);
  scene.add(keyL, rimL);

  function canvasTex(w, h, draw, repeat) {
    const c = document.createElement('canvas'); c.width = w; c.height = h;
    draw(c.getContext('2d'), w, h);
    const t = new THREE.CanvasTexture(c);
    t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 4;

    return t;
  }
  const R = mulberry(99);

  /* ---------- 天空 ---------- */
  const skyMat = new THREE.ShaderMaterial({
    uniforms: {
      top: { value: new THREE.Color('#3a2f7a') }, mid: { value: new THREE.Color('#d0679a') }, hor: { value: new THREE.Color('#ffb27e') },
      low: { value: new THREE.Color('#f2a58f') }, sunC: { value: new THREE.Color('#fff2c8') }, sunDir: { value: SUN }
    },
    vertexShader: 'varying vec3 vD; void main(){ vD = normalize(position); vec4 p = projectionMatrix * modelViewMatrix * vec4(position,1.); gl_Position = p.xyww; }',
    fragmentShader: `uniform vec3 top, mid, hor, low, sunC, sunDir; varying vec3 vD;
      void main(){ vec3 d = normalize(vD); float h = d.y; vec3 c;
        if (h > 0.0) { c = mix(hor, mid, smoothstep(0.0, 0.22, h)); c = mix(c, top, smoothstep(0.22, 0.75, h)); }
        else c = mix(hor, low, smoothstep(0.0, -0.06, h));
        float s = max(dot(d, sunDir), 0.0);
        c += sunC * (smoothstep(0.9965, 0.9978, s) * 2.2 + pow(s, 40.0) * 0.45 + pow(s, 6.0) * 0.18);
        gl_FragColor = vec4(c, 1.0);
        #include <tonemapping_fragment>
        #include <colorspace_fragment>
      }`,
    side: THREE.BackSide, depthWrite: false, fog: false
  });
  const sky = new THREE.Mesh(new THREE.SphereGeometry(500, 32, 16), skyMat);
  sky.renderOrder = -10;
  scene.add(sky);

  /* ---------- 雲海 ---------- */
  const cloudTex = canvasTex(256, 256, (g, w, h) => {

  function gameStep(dt) {
    if (botOn && stepN % 6 === 0) { const a = botDecide(); if (a) applyInput(P, a, onEvent); }

    while (obsStart < obs.length && obs[obsStart].z + obs[obsStart].hd < P.dist - 30) obsStart++;

    score += (P.dist - prevD) * runMult;

    lastRoof = onRoof;

    for (let i = obsStart; i < obs.length; i++) {
      const o = obs[i];

      if (o.passed || o.ramp || o.dead) continue;
      const zc = mvZ(o, d);
      if (zc + o.hd < d - PHD) {
        o.passed = true;
        let near = false;
        if ((o.k === 'wall' || o.k === 'mtram') && Math.abs(P.x - o.x) > 1.0 && runT - laneSeen[o.lane] < 0.32) near = true;
        if (o.k === 'hurdle' && Math.abs(P.x - o.x) < 0.9 && P.y < o.yt + 0.45 && P.y > o.yt - 0.12) near = true;
        if (near && !P.dead) {
          nearRun++; score += 50 * runMult; mEvent('near', 1);

        }
      }
    }
    // 金幣
    const h = P.slideT > 0 ? PH_SLIDE : PH_STAND;
    if (coinStreakT > 0) { coinStreakT -= dt; if (coinStreakT <= 0) coinStreak = 0; }
    const magR = P.magnet > 0 ? 10 : 0;
    let dead = 0;
    for (let i = 0; i < coins.length; i++) {
      const c = coins[i];
      if (!c.alive) { dead++; continue; }
      const dz = c.z - d;
      if (dz < -4) { c.alive = false; dead++; continue; }
      if (dz > 20) continue;
      if (magR && dz < magR && dz > -1 && !c.mag) c.mag = true;
      if (c.mag) {
        const k = Math.min(1, dt * 11);
        c.x += (P.x - c.x) * k; c.y += (P.y + 0.9 - c.y) * k; c.z += (d - c.z) * k;
      }

        }
      }
    }
    if (dead > 80) {
      let j = 0;
      for (let i = 0; i < coins.length; i++) { const c = coins[i]; if (c.alive) coins[j++] = c; else coinPool.push(c); }
      coins.length = j;
    }

      if (!u.alive) continue;
      const dz = u.z - d;

  window.__sr = {
    state: () => ({ phase, menu, score: Math.floor(score), dist: +P.dist.toFixed(2), speed: +P.speed.toFixed(2), lane: P.lane, x: +P.x.toFixed(2), y: +P.y.toFixed(2), vy: +P.vy.toFixed(2),
      air: P.air, slide: P.slideT > 0, dead: P.dead, coins: coinsRun, near: nearRun, mult: runMult, revived, inv: +P.inv.toFixed(2), stumbles: P.stumbles, godHits: P.godHits,
      pow: { magnet: +P.magnet.toFixed(1), shield: +P.shield.toFixed(1), dbl: +P.dbl.toFixed(1), jet: +P.jet.toFixed(1), sjump: +P.sjump.toFixed(1) }, quality: qLevel, saveCoins: save.coins, best }),
    start: opts => startRun(Object.assign({ noHint: true }, opts || {})),
    step: n => { for (let i = 0; i < (n || 1); i++) { if (phase === 'play') gameStep(STEP); else update(STEP); } return window.__sr.state(); },
    input: dir => { if (phase === 'play') applyInput(P, dir, onEvent); },
    god: on => { god = !!on; P.god = god; },
    bot: on => { botOn = !!on; },
    power: k => givePower(k),
    coins: n => { save.coins += n; persist(); refreshTitle(); },
    title: () => toTitle(),
    freeze: on => { frozen = !!on; },
    settle: n => { for (let i = 0; i < (n || 40); i++) { clock += 0.05; sync3D(0.05); } },
    near: () => { const d = P.dist; const out = []; for (let i = obsStart; i < obs.length; i++) { const o = obs[i]; if (o.z - o.hd > d + 60) break; if (o.dead) continue; const zc = mvZ(o, d); if (zc + o.hd < d - 2) continue; out.push({ k: o.k, lane: o.lane, z: +(zc - d).toFixed(2), hd: o.hd }); } return out; },
    gaps: () => [...gapSet].map(k => [Math.floor(k / 4) * TILE, k % 4]).filter(g => g[0] > P.dist - 4 && g[0] < P.dist + 60),
    place: (k, lane, ahead, hd) => { addObs(k, lane, P.dist + ahead, hd); obs.sort((a, b) => (a.z - a.hd) - (b.z - b.hd)); obsStart = 0; },
    placeGap: (lane, ahead) => { gapSet.add(Math.floor((P.dist + ahead) / TILE) * 4 + lane); },
    clear: () => { for (const o of obs) o.dead = true; gapSet.clear(); },
    // 無畫面快速驗證：AI 連續跑 seconds 秒（不畫圖）
    botRun: opts => {
      opts = opts || {};
      silent = true; trackSilent = false;
      const t0 = performance.now();
      startRun(Object.assign({ bot: true, god: false, noHint: true }, opts));
      const steps = Math.round((opts.seconds || 300) / STEP);
      let i = 0;
      for (; i < steps && phase === 'play'; i++) gameStep(STEP);
      const res = { seconds: +(i * STEP).toFixed(1), dist: Math.round(P.dist), speed: +P.speed.toFixed(1), dead: P.dead, deadAt: P.deadO ? P.deadO.k + '@lane' + P.deadO.lane : null, stumbles: P.stumbles, coins: coinsRun, jumps: P.jumps, slides: P.slides, lanes: P.lanes, obs: obs.length + obsStart, ms: Math.round(performance.now() - t0) };
      if (P.dead) { res.ctx = window.__sr.near(); res.gaps = window.__sr.gaps(); res.y = P.y; res.x = P.x; }
      silent = false; botOn = false; phase = 'play'; P.dead = null;
      toTitle();
      return res;
    }
  };
}
</script>
