<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>接水管</title>
<link rel="stylesheet" href="../../assets/common.css">
<style>
  :root { --water: #3db5ff; --deep: #1f6fb8; --leaf: #2f7a4a; --cream: #fffaf0; }
  html, body { height: 100%; overflow: hidden; background: #8fd18a; overscroll-behavior: none; }
  #cv { position: fixed; inset: 0; display: block; width: 100vw; height: 100vh; height: 100dvh; touch-action: none; }
  .screen { position: fixed; inset: 0; z-index: 8500; display: none; color: #234; }
  .screen.on { display: flex; }
  .btn {
    font-family: var(--kg-font); font-size: 19px; font-weight: 800; letter-spacing: 1px; color: #23573a;
    border: 3px solid #fff; border-radius: 999px; padding: 11px 26px; cursor: pointer; background: linear-gradient(180deg, #ffffff, #e9f8e6);
    box-shadow: 0 5px 0 rgba(35, 87, 58, 0.25), 0 10px 20px rgba(20, 60, 40, 0.18); transition: transform .1s ease, box-shadow .1s ease; touch-action: manipulation;
  }
  .btn:active { transform: translateY(3px); box-shadow: 0 2px 0 rgba(35, 87, 58, 0.25), 0 4px 10px rgba(20, 60, 40, 0.18); }
  .btn.primary { color: #fff; background: linear-gradient(180deg, #7fd3ff, #2a8fe0); text-shadow: 0 2px 0 rgba(0,0,0,0.15); box-shadow: 0 5px 0 #1d66a8, 0 10px 22px rgba(29, 102, 168, 0.35); }
  .btn.pink { color: #fff; background: linear-gradient(180deg, #ffb0d2, #f0679f); text-shadow: 0 2px 0 rgba(0,0,0,0.15); box-shadow: 0 5px 0 #b8487a, 0 10px 22px rgba(184, 72, 122, 0.3); }
  .btn.small { font-size: 16px; padding: 8px 16px; }
  .btn:disabled { opacity: .5; }

  /* 標題 */
  #title { flex-direction: column; align-items: center; padding: max(64px, env(safe-area-inset-top)) 18px max(18px, env(safe-area-inset-bottom)); }
  #title .logo { margin: 0; font-size: clamp(54px, 14vw, 96px); font-weight: 900; letter-spacing: 8px; line-height: 1; color: #fff;
    -webkit-text-stroke: 3px #1f6fb8; paint-order: stroke fill; text-shadow: 0 6px 0 #1f6fb8, 0 12px 24px rgba(20, 70, 120, 0.35); }
  #title .tag { margin: 12px 0 0; font-size: 16px; font-weight: 800; color: #1f5135; text-align: center; background: rgba(255,255,255,0.7); padding: 5px 14px; border-radius: 99px; }
  #tSpace { flex: 1; width: 100%; min-height: 150px; }
  #title .panel { display: flex; flex-direction: column; align-items: center; gap: 10px; width: 100%; max-width: 340px; }
  #title .panel .btn { width: 100%; max-width: 280px; }
  #title .row2 { display: flex; gap: 10px; width: 100%; max-width: 280px; }
  #title .row2 .btn { flex: 1; padding-left: 6px; padding-right: 6px; font-size: 17px; }
  #title .tstat { font-size: 15px; font-weight: 800; color: #1f5135; display: flex; gap: 12px; background: rgba(255,255,255,0.7); padding: 4px 14px; border-radius: 99px; }
  .toggle { display: flex; align-items: center; gap: 10px; font-size: 15px; font-weight: 800; cursor: pointer; color: #1f5135; }
  .toggle input { appearance: none; -webkit-appearance: none; width: 46px; height: 26px; border-radius: 99px; background: rgba(0,0,0,0.18);
    position: relative; cursor: pointer; transition: background .2s; margin: 0; flex: none; }
  .toggle input::after { content: ''; position: absolute; left: 3px; top: 3px; width: 20px; height: 20px; border-radius: 50%; background: #fff; transition: left .2s; box-shadow: 0 1px 3px rgba(0,0,0,.3); }
  .toggle input:checked { background: #2a8fe0; }
  .toggle input:checked::after { left: 23px; }
  #title .head { display: flex; flex-direction: column; align-items: center; }
  #title .col { display: contents; }
  @media (orientation: landscape) and (max-height: 560px) {
    #title { padding: 60px 20px 12px; }
    #title.on { display: grid; grid-template-columns: 1fr minmax(300px, 1fr); grid-template-rows: 1fr auto auto 1fr; column-gap: 12px; }
    #title .head { grid-column: 2; grid-row: 2; }
    #title .col { display: flex; flex-direction: column; align-items: center; grid-column: 2; grid-row: 3; margin-top: 12px; }
    #tSpace { grid-column: 1; grid-row: 1 / 5; height: 100%; min-height: 0; }
    #title .logo { font-size: 56px; }
    #title .tag { font-size: 14px; margin-top: 8px; }
    #title .panel { gap: 7px; }
    #title .panel .btn { padding: 8px 20px; font-size: 17px; }
  }

  /* 關卡地圖 */
  #map { flex-direction: column; align-items: center; padding-top: max(10px, env(safe-area-inset-top)); }
  .mhead { height: 56px; display: flex; align-items: center; justify-content: flex-end; gap: 8px; width: 100%; padding: 0 66px 0 150px; flex: none; }
  .mhead .mt { font-size: 21px; font-weight: 900; letter-spacing: 2px; color: #fff; text-shadow: 0 2px 0 #2f7a4a; white-space: nowrap; }
  .pill { background: rgba(255,255,255,0.88); border: 2px solid #fff; border-radius: 99px; padding: 4px 12px; font-size: 15px; font-weight: 800; white-space: nowrap; color: #234; box-shadow: 0 3px 0 rgba(0,0,0,0.08); }
  #backBtn { position: fixed; left: 66px; top: 14px; z-index: 8600; padding: 8px 14px; font-size: 15px; display: none; }
  #backBtn.on { display: block; }
  @media (max-width: 380px) { .mhead .mt { display: none; } }
  .chips { display: flex; gap: 8px; padding: 6px 12px 6px; overflow-x: auto; max-width: 100%; scrollbar-width: none; flex: none; }
  .chips::-webkit-scrollbar { display: none; }
  .chip { flex: none; display: flex; flex-direction: column; align-items: center; min-width: 76px; padding: 6px 10px; border-radius: 16px; cursor: pointer;
    font-family: var(--kg-font); color: #234; border: 2px solid #fff; background: rgba(255,255,255,0.6); }
  .chip b { font-size: 15px; } .chip small { font-size: 12px; font-weight: 800; color: #b8860b; }
  .chip.sel { background: #fff; box-shadow: 0 0 0 3px #2a8fe0; }
  .chip.lock { opacity: .55; }
  .chinfo { font-size: 15px; font-weight: 800; color: #1f5135; padding: 4px 14px; margin: 2px 12px; text-align: center; flex: none; background: rgba(255,255,255,0.65); border-radius: 14px; }
  .gridwrap { flex: 1; width: 100%; overflow-y: auto; touch-action: pan-y; -webkit-overflow-scrolling: touch; padding: 10px 12px max(16px, env(safe-area-inset-bottom)); }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(64px, 1fr)); gap: 10px; max-width: 720px; margin: 0 auto; }
  .lv { position: relative; aspect-ratio: 0.92; border-radius: 18px; border: 3px solid #fff; background: linear-gradient(180deg, #fffdf6, #f3e3c0);
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; cursor: pointer; color: #6b4a1f;
    font-family: var(--kg-font); transition: transform .12s; animation: lvIn .35s ease both; box-shadow: 0 4px 0 rgba(107, 74, 31, 0.25); padding: 0; }
  .lv:active { transform: scale(0.94); }
  .lv .n { font-size: 22px; font-weight: 900; line-height: 1; }
  .lv .st { font-size: 14px; letter-spacing: 1px; color: #d9d0bf; line-height: 1; }
  .lv .st i { font-style: normal; color: #f5b400; }
  .lv.lock { opacity: .5; cursor: default; background: #ddd; color: #888; }
  .lv.next { box-shadow: 0 0 0 3px #2a8fe0, 0 4px 0 rgba(107, 74, 31, 0.25); animation: lvIn .35s ease both, nextPulse 1.4s ease-in-out infinite .4s; }
  @keyframes nextPulse { 50% { transform: scale(1.06); } }
  @keyframes lvIn { from { opacity: 0; transform: translateY(10px) scale(.9); } to { opacity: 1; transform: none; } }

  /* 遊戲 HUD */
  #hud { position: fixed; top: 14px; left: 50%; transform: translateX(-50%); z-index: 8000; display: none; align-items: center; gap: 6px;
    max-width: calc(100vw - 136px); pointer-events: none; }
  #hud.on { display: flex; }
  #hud .pill { font-size: 15px; padding: 7px 11px; overflow: hidden; text-overflow: ellipsis; }
  #hudName { min-width: 0; }
  #hudMoves { flex: none; font-variant-numeric: tabular-nums; }
  @media (max-width: 370px) { #hud .pill { font-size: 13px; padding: 6px 8px; } }
  .fab { position: fixed; z-index: 8000; width: 48px; height: 48px; border-radius: 50%; display: none; place-items: center; cursor: pointer;
    border: 3px solid #fff; background: linear-gradient(180deg, #fff, #e6f6ff); color: #1f6fb8; padding: 0; touch-action: manipulation; box-shadow: var(--kg-shadow); }
  .fab.on { display: grid; }
  .fab svg { width: 22px; height: 22px; }
  #pauseBtn { right: 10px; top: 68px; }
  #tools { position: fixed; z-index: 8000; left: 50%; transform: translateX(-50%); bottom: max(12px, env(safe-area-inset-bottom)); display: none; gap: 14px; }
  #tools.on { display: flex; }
  .tool { position: relative; width: 78px; height: 62px; border-radius: 20px; border: 3px solid #fff; background: linear-gradient(180deg, #fff, #e9f8e6);
    color: #23573a; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; cursor: pointer; font-family: var(--kg-font);
    font-size: 13px; font-weight: 800; touch-action: manipulation; transition: transform .1s; padding: 0; box-shadow: 0 4px 0 rgba(35,87,58,.25); }
  .tool:active { transform: scale(0.92); }
  .tool svg { width: 26px; height: 26px; }
  .tool .badge { position: absolute; right: -7px; top: -7px; min-width: 24px; height: 24px; border-radius: 12px; background: #ffcf3f; color: #5a3d00;
    font-size: 13px; line-height: 20px; text-align: center; padding: 0 5px; border: 2px solid #fff; font-variant-numeric: tabular-nums; }
  .tool.dim { opacity: .6; }
  @media (orientation: landscape) and (max-height: 560px) {
    #hud { left: 10px; top: 68px; transform: none; flex-direction: column; align-items: stretch; max-width: 128px; }
    #hud .pill { font-size: 13px; padding: 6px 9px; white-space: normal; text-align: center; }
    #tools { left: auto; right: 10px; top: 124px; bottom: auto; transform: none; flex-direction: column; gap: 8px; }
    .tool { width: 60px; height: 52px; font-size: 12px; }
    .tool svg { width: 22px; height: 22px; }
  }
  #tip { position: fixed; z-index: 7900; left: 50%; transform: translateX(-50%); bottom: 88px; color: #fff; font-size: 15px; font-weight: 800;
    background: rgba(25, 70, 45, 0.82); padding: 8px 16px; border-radius: 99px; pointer-events: none; opacity: 0; transition: opacity .4s; text-align: center; max-width: 92vw; }
  #tip.on { opacity: 1; }
  @media (orientation: landscape) and (max-height: 560px) { #tip { bottom: 8px; font-size: 13px; padding: 6px 12px; } }

  /* 對話框 */
  .modal { position: fixed; inset: 0; z-index: 8800; display: none; place-items: center; padding: 16px; background: rgba(20, 50, 35, 0.45);
    backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px); }
  .modal.on { display: grid; animation: kg-fade .25s ease; }
  .card { width: min(350px, 100%); border-radius: 28px; padding: 20px 20px 18px; color: #234; text-align: center; background: linear-gradient(180deg, #fffdf6, #f1fbef);
    border: 4px solid #fff; box-shadow: 0 20px 60px rgba(0,0,0,0.3); animation: kg-pop .35s cubic-bezier(.2,1.4,.4,1); max-height: 100%; overflow-y: auto; }
  .card h2 { margin: 0 0 4px; font-size: 28px; letter-spacing: 3px; color: #1f6fb8; }
  .card p { margin: 6px 0; font-weight: 700; }
  .card .acts { display: flex; flex-direction: column; gap: 10px; margin-top: 12px; align-items: stretch; }
  .card .row { display: flex; gap: 10px; } .card .row .btn { flex: 1; padding-left: 8px; padding-right: 8px; }
  .rstars { display: flex; justify-content: center; gap: 8px; margin: 6px 0 2px; }
  .rstars svg { width: 54px; height: 54px; transform: scale(0); }
  .rstars svg.pop { animation: starPop .45s cubic-bezier(.2,1.6,.4,1) forwards; }
  .rstars svg:nth-child(2) { margin-top: -12px; }
  @keyframes starPop { from { transform: scale(0) rotate(-40deg); } to { transform: scale(1) rotate(0); } }
  .rnote { font-size: 14px; color: #c27c00; min-height: 1em; }
  .sizes { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 10px 0; }
  .sz { font-family: var(--kg-font); font-weight: 800; font-size: 16px; padding: 10px 6px; border-radius: 16px; border: 3px solid #fff; background: #e9f3ff; color: #1f5a8f; cursor: pointer; }
  .sz small { display: block; font-size: 12px; opacity: .8; }
  .sz.sel { background: #2a8fe0; color: #fff; }
  @media (orientation: landscape) and (max-height: 430px) {
    .card { padding: 12px 16px; } .card h2 { font-size: 22px; } .rstars svg { width: 40px; height: 40px; } .card .acts { gap: 7px; margin-top: 8px; }
    .card .btn { padding-top: 7px; padding-bottom: 7px; }
    .sizes { grid-template-columns: repeat(4, 1fr); margin: 6px 0; } .sz { padding: 6px 4px; } .card p { margin: 3px 0; }
  }
</style>
</head>
<body>
<canvas id="cv"></canvas>

<div id="title" class="screen on">
  <div class="head">
    <h1 class="logo">接水管</h1>
    <p class="tag">轉一轉水管，讓水流到每一朵花！</p>
  </div>
  <div id="tSpace"></div>
  <div class="col">
    <div class="panel">
      <button class="btn primary" id="bPlay">開始遊戲</button>
      <button class="btn" id="bCont" style="display:none">繼續上次</button>
      <div class="row2">
        <button class="btn pink" id="bDaily">每日挑戰</button>
        <button class="btn" id="bRand">隨機模式</button>
      </div>
      <label class="toggle"><input type="checkbox" id="perfectT"> 完美規則（不能漏水）</label>
      <div class="tstat"><span id="tStars">★ 0</span><span id="tDaily"></span></div>
    </div>
  </div>
</div>

<div id="map" class="screen">
  <div class="mhead"><span class="mt">選擇關卡</span><span class="pill" id="mStars">★ 0</span></div>
  <div class="chips" id="chips"></div>
  <div class="chinfo" id="chinfo"></div>
  <div class="gridwrap"><div class="grid" id="grid"></div></div>
</div>
<button class="btn small" id="backBtn">‹ 返回</button>

<div id="hud"><span class="pill" id="hudName">1-1</span><span class="pill" id="hudMoves">步數 0</span></div>
<button class="fab" id="pauseBtn" aria-label="暫停"><svg viewBox="0 0 24 24"><rect x="6" y="5" width="4" height="14" rx="1.5" fill="currentColor"/><rect x="14" y="5" width="4" height="14" rx="1.5" fill="currentColor"/></svg></button>
<div id="tools">
  <button class="tool" id="tHint"><svg viewBox="0 0 24 24"><path d="M12 2.5c-3.6 0-6.3 2.7-6.3 6.1 0 2.3 1.2 3.8 2.4 5 .7.7 1.1 1.4 1.1 2.3V17h5.6v-1.1c0-.9.4-1.6 1.1-2.3 1.2-1.2 2.4-2.7 2.4-5 0-3.4-2.7-6.1-6.3-6.1z" fill="#ffcf3f" stroke="#c48a12" stroke-width="1.4"/><rect x="9" y="18" width="6" height="2.6" rx="1.2" fill="#8a9aa8"/></svg>提示<span class="badge" id="hintN">3</span></button>
  <button class="tool" id="tReset"><svg viewBox="0 0 24 24" fill="none" stroke="#2a8fe0" stroke-width="2.6" stroke-linecap="round"><path d="M5 12a7 7 0 1 0 2.2-5.1"/><path d="M5 3.5v4.4h4.4"/></svg>重來</button>
</div>
<div id="tip"></div>

<div class="modal" id="mPause"><div class="card">
  <h2>休息一下</h2><p id="pInfo"></p>
  <label class="toggle" style="justify-content:center;margin:8px 0"><input type="checkbox" id="perfectP"> 完美規則（不能漏水）</label>
  <div class="acts">
    <button class="btn primary" id="pResume">繼續</button>
    <div class="row"><button class="btn" id="pRestart">重新開始</button><button class="btn" id="pMap">關卡地圖</button></div>
    <button class="btn small" id="pTitle">回標題</button>
  </div>
</div></div>

<div class="modal" id="mWin"><div class="card">
  <h2 id="wTitle">太棒了！</h2>
  <div class="rstars" id="wStars"></div>
  <p id="wInfo"></p>
  <p class="rnote" id="wNote"></p>
  <div class="acts">
    <button class="btn primary" id="wNext">下一關</button>
    <div class="row"><button class="btn" id="wAgain">再玩一次</button><button class="btn" id="wMap">關卡地圖</button></div>
  </div>
</div></div>

<div class="modal" id="mRand"><div class="card">
  <h2>隨機模式</h2><p>選一個大小，無限挑戰！</p>
  <div class="sizes" id="sizes"></div>
  <label class="toggle" style="justify-content:center;margin:4px 0 6px"><input type="checkbox" id="spT" checked> 加入特殊水管</label>
  <p class="rnote" id="rBest"></p>
  <div class="acts"><button class="btn primary" id="rGo">開始</button><button class="btn small" id="rBack">返回</button></div>
</div></div>

<script src="../../assets/common.js"></script>
<script>
'use strict';
(function () {
/* ================= 基本常數 ================= */
const SLUG = 'pipe-connect';
const DX = [0, 1, 0, -1], DY = [-1, 0, 1, 0];
const PIPE = 0, SRC = 1, SINK = 2, BRIDGE = 3, VALVE = 4, PORTAL = 5;
const FLOWER = 0, POND = 1, HOUSE = 2;
const WATER = ['#3db5ff', '#ff5fa8', '#a07a52'];
const WATER_HI = ['#d4f1ff', '#ffe0ef', '#e2c9a8'];
const PETALS = ['#ff7eb3', '#ffd23f', '#b48cff', '#ff8a5c', '#ff5c7a'];
const PORTAL_COL = ['#9b6bff', '#18b8a8', '#ff9a3c'];
const CH = [
  { name: '花園小徑', desc: '點水管轉動，讓水流到每一朵花', a: [5, 5], b: [6, 7] },
  { name: '鎖頭水管', desc: '有鎖頭的水管轉不動，可以當作線索', a: [6, 6], b: [7, 8] },
  { name: '天橋交會', desc: '天橋讓兩條水路交叉、各走各的', a: [6, 7], b: [8, 9] },
  { name: '單向閥門', desc: '閥門只讓水朝箭頭的方向流', a: [7, 7], b: [8, 10] },
  { name: '雙色水流', desc: '藍水和粉紅水各自澆花，不能混在一起', a: [7, 8], b: [9, 11] },
  { name: '神奇傳送', desc: '水流進傳送口，會從同色的另一個冒出來', a: [8, 9], b: [10, 12] }
];
const PER = 25, NLV = CH.length * PER;
const RSIZES = [[5, 5, '小'], [7, 7, '中'], [8, 10, '大'], [10, 12, '超大']];
const HINT_MAX = 3, HINT_RECH = 6 * 60 * 1000;

const rm = (m, k) => { k &= 3; while (k--) m = ((m << 1) | (m >> 3)) & 15; return m; };
const pc = m => (m & 1) + ((m >> 1) & 1) + ((m >> 2) & 1) + ((m >> 3) & 1);
const CANON = [1, 5, 3, 7, 15];
function canon(m) {
  for (const s of CANON) if (pc(s) === pc(m)) for (let r = 0; r < 4; r++) if (rm(s, r) === m) return [s, r];
  return [1, 0];
}
function mulberry(a) {
  return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
}
function hashStr(s) { let h = 2166136261; for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; }

const store = {
  get(k, d) { return KG.store.get(SLUG + ':' + k, d); },
  set(k, v) { KG.store.set(SLUG + ':' + k, v); }
};

/* ================= 水流判定 ================= */
function rotatable(c) { return !c.lock && (c.k === PIPE || c.k === VALVE || c.k === PORTAL); }
function cellMask(c) { return rm(c.s, c.r); }
function groupFor(c, p) {
  if (c.k === BRIDGE) return (p & 1) ? 1 : 0;
  return (rm(c.s, c.r) & (1 << p)) ? 0 : -1;
}
function nodeMask(c, g) { return c.k === BRIDGE ? (g ? 10 : 5) : rm(c.s, c.r); }
function sig(c, r) { return c.k === VALVE ? r : rm(c.s, r); }

function flow(L, perfect) {
  const N = L.N, C = L.cells, nn = N * 2, W = L.W, H = L.H;
  const owner = new Int8Array(nn).fill(-1), entry = new Int8Array(nn).fill(-3), par = new Int32Array(nn).fill(-1);
  const order = [], leaks = [], leakSet = new Set();
  const vis = new Uint8Array(nn), q = new Int32Array(nn);
  for (let c = 0; c < L.srcs.length; c++) {
    vis.fill(0);
    let qh = 0, qt = 0;
    const s = L.srcs[c] * 2;
    const mark = (n, e, p) => {
      vis[n] = 1; q[qt++] = n;
      if (owner[n] < 0) { owner[n] = c; entry[n] = e; par[n] = p; order.push(n); }
      else if (owner[n] !== c) owner[n] = 2;
    };
    mark(s, -2, -1);
    while (qh < qt) {
      const n = q[qh++], i = n >> 1, cell = C[i], m = nodeMask(cell, n & 1);
      if (cell.k === PORTAL) { const pn = cell.pair * 2; if (!vis[pn]) mark(pn, -1, n); }
      const x = i % W, y = (i / W) | 0;
      for (let d = 0; d < 4; d++) {

    if (b > 0.02) { ctx.fillStyle = mixed ? '#a07a52' : '#4cc0ff'; ctx.globalAlpha = Math.min(1, b * 1.2); ctx.beginPath(); ctx.ellipse(0, s * 0.08, s * 0.32 * b, s * 0.2 * b, 0, 0, 6.283); ctx.fill(); ctx.globalAlpha = 1; }
    // 魚
    let fx = 0, fy = s * 0.1, fr = 0;
    if (b > 0.9) { const ph = (time * 0.6 + i * 0.37) % 2.4; if (ph < 0.8) { const t = ph / 0.8; fx = (t - 0.5) * s * 0.36; fy = s * 0.08 - Math.sin(t * Math.PI) * s * 0.42; fr = (t - 0.5) * 2.4; } else { fx = Math.sin(time * 1.5 + i) * s * 0.12; } }
    else { fr = Math.sin(time * 14) * 0.5 * (1 - b); }
    ctx.save(); ctx.translate(fx, fy); ctx.rotate(fr);
    ctx.fillStyle = '#ff8a3c'; ctx.beginPath(); ctx.ellipse(0, 0, s * 0.11, s * 0.065, 0, 0, 6.283); ctx.fill();
    ctx.beginPath(); ctx.moveTo(-s * 0.08, 0); ctx.lineTo(-s * 0.17, -s * 0.06); ctx.lineTo(-s * 0.17, s * 0.06); ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#222'; ctx.beginPath(); ctx.arc(s * 0.055, -s * 0.015, s * 0.018, 0, 6.283); ctx.fill();
    ctx.restore();
  } else {
    // 小屋
    ctx.fillStyle = '#fff3d6'; ctx.fillRect(-s * 0.24, -s * 0.06, s * 0.48, s * 0.4);
    ctx.fillStyle = '#e2574c'; ctx.beginPath(); ctx.moveTo(-s * 0.33, -s * 0.04); ctx.lineTo(0, -s * 0.34); ctx.lineTo(s * 0.33, -s * 0.04); ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#9b5a34'; ctx.fillRect(-s * 0.06, s * 0.12, s * 0.12, s * 0.22);
    const glow = b;
    ctx.fillStyle = glow > 0.3 ? 'rgba(255,214,90,' + (0.5 + 0.5 * glow) + ')' : '#5d6b7a';
    ctx.fillRect(-s * 0.2, s * 0.0, s * 0.1, s * 0.09); ctx.fillRect(s * 0.1, s * 0.0, s * 0.1, s * 0.09);
    if (glow > 0.5) { ctx.fillStyle = 'rgba(255,230,140,' + (0.25 * glow) + ')'; ctx.beginPath(); ctx.arc(0, s * 0.05, s * 0.42, 0, 6.283); ctx.fill(); }
    ctx.fillStyle = '#8a8f99'; ctx.fillRect(s * 0.12, -s * 0.3, s * 0.07, s * 0.14);
    if (glow > 0.5) { ctx.fillStyle = 'rgba(255,255,255,0.7)'; for (let k = 0; k < 2; k++) { const t = (time * 0.7 + k * 0.5) % 1; ctx.beginPath(); ctx.arc(s * 0.155 + Math.sin(t * 6) * s * 0.03, -s * 0.33 - t * s * 0.2, s * 0.04 * (1 - t * 0.5), 0, 6.283); ctx.fill(); } }
  }
  if (L.ncol > 1) { // 顏色標記
    ctx.fillStyle = WATER[c.c]; ctx.strokeStyle = '#fff'; ctx.lineWidth = Math.max(1, s * 0.03);
    const bx = s * 0.3, by = -s * 0.3, r = s * 0.09;
    ctx.beginPath(); ctx.moveTo(bx, by - r * 1.6); ctx.quadraticCurveTo(bx + r, by - r * 0.2, bx + r, by + r * 0.2); ctx.arc(bx, by + r * 0.2, r, 0, Math.PI); ctx.quadraticCurveTo(bx - r, by - r * 0.2, bx, by - r * 1.6); ctx.fill(); ctx.stroke();
  }
  if (mixed) { ctx.fillStyle = '#e74c3c'; ctx.font = 'bold ' + Math.round(s * 0.3) + 'px sans-serif'; ctx.textAlign = 'center'; ctx.fillText('!', -s * 0.3, -s * 0.18); }
  ctx.restore();
}
function drawSource(i, k) {
  const s = T, happy = state === 'won' || (F && F.solved && winPending);
  upright(i);
  const bob = Math.sin(time * 2.2 + k) * s * 0.02 + (happy ? -Math.abs(Math.sin(time * 9)) * s * 0.06 : 0);
  ctx.translate(0, bob);
  // 腳
  ctx.strokeStyle = '#8a5a2e'; ctx.lineWidth = Math.max(1.5, s * 0.05); ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(-s * 0.18, s * 0.05); ctx.lineTo(-s * 0.24, s * 0.4); ctx.moveTo(s * 0.18, s * 0.05); ctx.lineTo(s * 0.24, s * 0.4); ctx.moveTo(-s * 0.21, s * 0.25); ctx.lineTo(s * 0.21, s * 0.25); ctx.stroke();
  // 水桶
  const col = WATER[k], dk = k ? '#c23c7c' : '#1f6fb8';
  ctx.fillStyle = dk; rr(ctx, -s * 0.33, -s * 0.33, s * 0.66, s * 0.48, s * 0.18); ctx.fill();
  ctx.fillStyle = col; rr(ctx, -s * 0.3, -s * 0.3, s * 0.6, s * 0.42, s * 0.16); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,0.35)'; rr(ctx, -s * 0.24, -s * 0.27, s * 0.2, s * 0.08, s * 0.04); ctx.fill();
  // 屋頂
  ctx.fillStyle = dk; ctx.beginPath(); ctx.moveTo(-s * 0.36, -s * 0.3); ctx.quadraticCurveTo(0, -s * 0.55, s * 0.36, -s * 0.3); ctx.closePath(); ctx.fill();
  // 臉
  const blink = (time + k * 1.3) % 3.5 < 0.12;
  ctx.fillStyle = '#20324a';
  if (happy) { ctx.lineWidth = Math.max(1.2, s * 0.035); ctx.strokeStyle = '#20324a'; ctx.beginPath(); ctx.arc(-s * 0.11, -s * 0.08, s * 0.05, Math.PI, 0); ctx.moveTo(s * 0.16, -s * 0.08); ctx.arc(s * 0.11, -s * 0.08, s * 0.05, Math.PI, 0); ctx.stroke(); }
  else if (blink) { ctx.fillRect(-s * 0.15, -s * 0.09, s * 0.08, s * 0.02); ctx.fillRect(s * 0.07, -s * 0.09, s * 0.08, s * 0.02); }
  else { ctx.beginPath(); ctx.arc(-s * 0.11, -s * 0.08, s * 0.045, 0, 6.283); ctx.arc(s * 0.11, -s * 0.08, s * 0.045, 0, 6.283); ctx.fill(); ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(-s * 0.1, -s * 0.095, s * 0.016, 0, 6.283); ctx.arc(s * 0.12, -s * 0.095, s * 0.016, 0, 6.283); ctx.fill(); }
  ctx.fillStyle = 'rgba(255,130,160,0.6)'; ctx.beginPath(); ctx.arc(-s * 0.2, -s * 0.01, s * 0.04, 0, 6.283); ctx.arc(s * 0.2, -s * 0.01, s * 0.04, 0, 6.283); ctx.fill();
  ctx.strokeStyle = '#20324a'; ctx.lineWidth = Math.max(1.2, s * 0.03); ctx.beginPath(); ctx.arc(0, -s * 0.03, happy ? s * 0.08 : s * 0.05, 0.2, Math.PI - 0.2); ctx.stroke();
  // 水滴
  ctx.fillStyle = '#fff'; const dy = -s * 0.5 + Math.sin(time * 3) * s * 0.02;
  ctx.beginPath(); ctx.moveTo(0, dy - s * 0.09); ctx.quadraticCurveTo(s * 0.07, dy, 0, dy + s * 0.05); ctx.quadraticCurveTo(-s * 0.07, dy, 0, dy - s * 0.09); ctx.fill();
  ctx.restore();
}
function drawParts() {
  for (let i = 0; i < PMAX; i++) {
    const p = parts[i]; if (!p.on) continue;
    const a = p.life / p.max;
    ctx.globalAlpha = Math.min(1, a * 1.5);
    ctx.fillStyle = p.col;
    if (p.type === 1) { const s = p.s * (0.5 + a); ctx.fillRect(p.x - s / 2, p.y - s * 1.5, s, s * 3); ctx.fillRect(p.x - s * 1.5, p.y - s / 2, s * 3, s); }
    else if (p.type === 2) { ctx.beginPath(); ctx.ellipse(p.x, p.y, p.s * 1.4, p.s * 0.8, p.life * 6, 0, 6.283); ctx.fill(); }
    else { ctx.beginPath(); ctx.arc(p.x, p.y, p.s * (p.type === 3 ? 1 : a), 0, 6.283); ctx.fill(); }
  }
  ctx.globalAlpha = 1;
}

/* ================= 主迴圈 ================= */
let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  if (!document.hidden) {
    if (state !== 'paused') update(dt);
    draw();
  }
  requestAnimationFrame(frame);
}

/* ================= 測試介面 ================= */
function makeCustom(def) {
  const W = def.W, H = def.H, N = W * H;
  const cells = [];
  for (let i = 0; i < N; i++) { const d = def.cells[i] || {}; cells.push({ k: d.k || 0, s: d.s == null ? 0 : d.s, r: d.r || 0, sol: d.r || 0, lock: false, c: d.c || 0, st: 0, pt: 0, pair: d.pair == null ? -1 : d.pair }); }
  const srcs = [], sinks = [];
  cells.forEach((c, i) => { if (c.k === SRC) srcs[c.c] = i; if (c.k === SINK) sinks.push(i); });
  return { W, H, N, cells, srcs, sinks, ncol: srcs.length };
}
window.__pc = {
  K: { PIPE, SRC, SINK, BRIDGE, VALVE, PORTAL },
  NLV,
  state: () => ({ state, spec, moves, par: L ? L.par : 0, minRot: L ? L.minRot : 0, W: L ? L.W : 0, H: L ? L.H : 0, rot: brot, T, solved: F ? F.solved : false, reached: F ? F.reached : 0, total: F ? F.total : 0, leaks: F ? F.leaks.length : 0, mixed: F ? F.mixed : false, perfect, hints: hintState().n }),
  start: (i) => { startLevel(typeof i === 'object' ? i : { mode: 'lv', i }, false); return __pc.state(); },
  rotate: (x, y, dir) => rotateCell(y * L.W + x, dir || 1),
  solve: (i) => {
    if (i != null) startLevel(typeof i === 'object' ? i : { mode: 'lv', i }, false);
    for (let k = 0; k < L.N; k++) { const c = L.cells[k]; if (rotatable(c) && sig(c, c.r) !== sig(c, c.sol)) { const d = (c.sol - c.r + 4) & 3; c.r = c.sol; rv[k] += d; moves++; } }
    layerDirty = true; recompute(); saveCur();
    return __pc.state();
  },
  connected: () => { const f = flow(L, perfect); return { solved: f.solved, reached: f.reached, total: f.total, leaks: f.leaks.length, mixed: f.mixed }; },
  cells: () => L.cells.map(c => ({ k: c.k, s: c.s, r: c.r, sol: c.sol, lock: c.lock, c: c.c })),
  tileClient: (x, y) => { const i = y * L.W + x, p = cellCenterDisp(i), r = cv.getBoundingClientRect(); return { x: r.left + p[0] * r.width / VW, y: r.top + p[1] * r.height / VH }; },
  firstWrong: () => { for (let i = 0; i < L.N; i++) { const c = L.cells[i]; if (rotatable(c) && sig(c, c.r) !== sig(c, c.sol)) return { x: i % L.W, y: (i / L.W) | 0, r: c.r, sol: c.sol }; } return null; },
  verifyLevel: (sp) => {
    const L1 = makeLevel(typeof sp === 'object' ? sp : { mode: 'lv', i: sp });
    const start = flow(L1, false);
    const saved = L1.cells.map(c => c.r);
    L1.cells.forEach(c => c.r = c.sol);
    const a = flow(L1, false), b = flow(L1, true);
    L1.cells.forEach((c, i) => c.r = saved[i]);
    const kinds = [0, 0, 0, 0, 0, 0]; L1.cells.forEach(c => kinds[c.k]++);
    return { W: L1.W, H: L1.H, solNormal: a.solved, solPerfect: b.solved, startSolved: start.solved, sinks: L1.sinks.length, par: L1.par, minRot: L1.minRot, kinds, ncol: L1.ncol, locked: L1.cells.filter(c => c.lock).length, attempts: L1.attempts };
  },
  flowOf: (def, perf) => { const L1 = makeCustom(def); const f = flow(L1, !!perf); return { solved: f.solved, reached: f.reached, total: f.total, leaks: f.leaks.length, mixed: f.mixed, owner: Array.from(f.owner) }; },
  hint: () => useHint(),
  pause: pauseGame, resume: resumeGame, setPerfect, goMap, goTitle,
  setHints: (n) => store.set('hints', { n, t: Date.now() })
};

goTitle();
requestAnimationFrame(frame);
})();
