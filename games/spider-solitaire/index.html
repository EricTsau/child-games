<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>蜘蛛接龍 Spider Solitaire</title>
<link rel="stylesheet" href="../../assets/common.css">
<style>
  :root { --gold: #d6b46e; --gold2: #a8813f; --ink: #f2ead9; --mut: #b9ad96; --panel: rgba(12, 14, 20, .84); --line: rgba(214, 180, 110, .5);
    --pf: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", "Heiti TC", system-ui, sans-serif;
    --sf: "BiauKai", "DFKai-SB", "標楷體", "Kaiti TC", "STKaiti", "KaiTi", "Noto Serif TC", "Source Han Serif TC", "Songti TC", "PMingLiU", serif;
    --nf: Georgia, "Times New Roman", "Noto Serif", serif; }
  html, body { height: 100%; overflow: hidden; background: #0b1020; color: var(--ink); font-family: var(--pf); touch-action: none; }
  #cv { position: fixed; inset: 0; width: 100vw; height: 100vh; height: 100dvh; display: block; touch-action: none; }
  #probe { position: fixed; left: 0; bottom: 0; width: 1px; height: 0; padding-bottom: env(safe-area-inset-bottom); pointer-events: none; visibility: hidden; }
  .hide { display: none !important; }
  button { font-family: var(--pf); -webkit-user-select: none; user-select: none; color: inherit; }
  .kg-fab { background: rgba(14, 16, 24, .84); border: 1.5px solid var(--line); box-shadow: 0 4px 14px rgba(0, 0, 0, .5); font-size: 20px; }
  .kg-fab:hover { border-color: var(--gold); }
  .glass { background: var(--panel); border: 1px solid var(--line); box-shadow: 0 6px 22px rgba(0, 0, 0, .45); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); }

  #bPause { position: fixed; z-index: 60; right: 10px; top: 66px; width: 48px; height: 48px; padding: 0; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; }
  #bPause svg { width: 20px; height: 20px; }
  #bPause:active { transform: translateY(1px); border-color: var(--gold); }

  #info { position: fixed; z-index: 50; display: flex; align-items: center; justify-content: space-around; gap: 4px; border-radius: 10px; padding: 0 8px; white-space: nowrap; overflow: hidden; pointer-events: none; }
  #info span { display: flex; flex-direction: column; align-items: center; line-height: 1.12; min-width: 0; }
  #info i { font-style: normal; font-size: 10.5px; letter-spacing: 2px; color: var(--mut); }
  #info b { font-family: var(--nf); font-variant-numeric: tabular-nums; font-size: 16px; color: var(--ink); font-weight: 700; letter-spacing: .5px; }
  #info b.gd { color: var(--gold); }
  #info .sep { width: 1px; height: 22px; background: rgba(214, 180, 110, .28); flex: none; }
  #info.vert { flex-direction: column; justify-content: center; padding: 4px 10px; gap: 1px; }
  #info.vert span { flex-direction: row; justify-content: space-between; width: 100%; }
  #info.vert .sep { display: none; }
  #info.vert b { font-size: 14.5px; }

  #bar { position: fixed; z-index: 50; display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
  .tb { position: relative; border-radius: 10px; border: 1px solid var(--line); background: linear-gradient(180deg, rgba(34, 38, 50, .95), rgba(13, 15, 22, .95)); color: var(--ink); font-size: 13px; font-weight: 700; letter-spacing: 1px; cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; box-shadow: 0 4px 12px rgba(0, 0, 0, .45), inset 0 1px 0 rgba(255, 255, 255, .06); touch-action: manipulation; transition: transform .08s, opacity .2s, border-color .2s; padding: 0 2px; min-width: 0; }
  .tb span { white-space: nowrap; overflow: hidden; }
  .tb .cnt { position: absolute; top: 3px; right: 4px; min-width: 17px; height: 17px; border-radius: 9px; background: var(--gold); color: #1d1408; font: 700 11px/17px var(--nf); font-style: normal; text-align: center; padding: 0 3px; }
  #bar.side .tb .cnt { top: -6px; right: -5px; }
  .tb svg { width: 20px; height: 20px; flex: none; }
  .tb:active { transform: translateY(1px); border-color: var(--gold); }
  .tb:disabled { opacity: .32; cursor: default; }
  .tb.glow { border-color: #f0d79c; background: linear-gradient(180deg, #e4c47f, #b68c45); color: #1d1408; animation: tbG 1.3s ease-in-out infinite; }
  .tb.glow svg * { stroke: #1d1408 !important; }
  @keyframes tbG { 50% { box-shadow: 0 0 0 4px rgba(240, 215, 156, .25), 0 4px 18px rgba(214, 180, 110, .55); } }
  #bar.side { grid-template-columns: 1fr 1fr; }
  #bar.side .tb { flex-direction: row; gap: 4px; font-size: 12.5px; letter-spacing: 1px; }
  #bar.side .tb svg { width: 16px; height: 16px; }
  #bar.side #bAuto { grid-column: 1 / -1; }
  body.tiny .tb { font-size: 11.5px; letter-spacing: 0; }
  body.tiny .tb svg { width: 18px; height: 18px; }

  #msg { position: fixed; z-index: 70; left: 50%; transform: translate(-50%, 8px); padding: 8px 16px; border-radius: 20px; font-size: 14px; line-height: 1.45; letter-spacing: .5px; color: var(--ink); text-align: center; width: max-content; opacity: 0; transition: opacity .25s, transform .25s; pointer-events: none; max-width: calc(100vw - 24px); }
  #msg small { color: var(--mut); font-size: 11.5px; white-space: nowrap; }
  #msg.on { opacity: 1; transform: translate(-50%, 0); }
  #msg b { color: var(--gold); font-family: var(--nf); }
  #msg .r { color: #ff8f86; }
  #busy { position: fixed; z-index: 9250; left: 50%; top: 50%; transform: translate(-50%, -50%); padding: 14px 20px; border-radius: 12px; font-size: 15px; letter-spacing: 3px; display: flex; flex-direction: column; align-items: center; gap: 10px; min-width: 220px; }
  #busy .row { display: flex; align-items: center; gap: 10px; white-space: nowrap; }
  #busy i { width: 16px; height: 16px; border-radius: 50%; border: 2px solid rgba(214, 180, 110, .3); border-top-color: var(--gold); animation: spin .8s linear infinite; }
  #busy button { font-size: 13px; letter-spacing: 1px; padding: 6px 12px; border-radius: 8px; border: 1px solid var(--line); background: rgba(255, 255, 255, .05); cursor: pointer; min-height: 38px; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .ov { position: fixed; inset: 0; z-index: 9200; display: flex; align-items: center; justify-content: center; padding: 16px; background: rgba(4, 6, 12, .62); animation: kg-fade .25s ease; }
  .card { background: rgba(13, 15, 22, .96) !important; width: min(440px, 100%); max-height: calc(100% - 8px); overflow: auto; border-radius: 14px; padding: 20px 18px 16px; text-align: center; color: var(--ink); animation: cardIn .35s cubic-bezier(.2, .9, .3, 1); }
  @keyframes cardIn { from { transform: translateY(14px) scale(.97); opacity: 0; } }
  .card h2 { margin: 0 0 8px; font-family: var(--sf); font-size: 25px; letter-spacing: 6px; padding-left: 6px; color: var(--gold); font-weight: 800; }
  .card p { margin: 0 0 12px; font-size: 14px; line-height: 1.6; color: var(--mut); }
  .gbtn { font-family: var(--pf); font-size: 15.5px; font-weight: 800; letter-spacing: 3px; min-height: 46px; padding: 8px 16px; border-radius: 9px; cursor: pointer; border: 1px solid var(--line); background: rgba(255, 255, 255, .04); color: var(--ink); transition: transform .1s, background .2s, border-color .2s; touch-action: manipulation; }
  .gbtn:hover { border-color: var(--gold); }
  .gbtn:active { transform: translateY(1px); }
  .gbtn.pri { background: linear-gradient(180deg, #e4c47f, #b68c45); color: #1d1408; border-color: #f0d79c; box-shadow: 0 6px 16px rgba(180, 140, 70, .3); }
  .gbtn small { display: block; font-size: 11px; letter-spacing: 1px; font-weight: 500; opacity: .8; margin-top: 1px; }
  .acts { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
  .acts .gbtn { flex: 1; min-width: 120px; }
  .acts.col { flex-direction: column; }

  #title { background: linear-gradient(180deg, rgba(4, 6, 14, .55) 0%, rgba(4, 6, 14, .12) 30%, rgba(4, 6, 14, .25) 58%, rgba(4, 6, 14, .88) 100%); flex-direction: column; justify-content: space-between; padding: 66px 16px calc(16px + env(safe-area-inset-bottom)); }
  .logo { text-align: center; pointer-events: none; }
  .logo .sub { font-size: 11px; letter-spacing: 6px; color: var(--gold); opacity: .9; white-space: nowrap; font-family: var(--nf); }
  .logo h1 { margin: 6px 0 0; font-family: var(--sf); font-size: clamp(46px, 14vw, 88px); font-weight: 900; letter-spacing: .18em; padding-left: .18em; color: #f6efe0; text-shadow: 0 2px 0 rgba(0, 0, 0, .5), 0 0 30px rgba(214, 180, 110, .25); line-height: 1.1; white-space: nowrap; }
  .logo .motto { margin-top: 8px; font-size: 13px; letter-spacing: 5px; padding-left: 5px; color: #d9c9a8; white-space: nowrap; }
  .tcard { width: min(430px, 100%); border-radius: 14px; padding: 14px 14px 12px; }
  .seg { display: flex; border: 1px solid var(--line); border-radius: 9px; overflow: hidden; }
  .seg button { flex: 1; min-height: 42px; padding: 6px 2px; background: transparent; color: var(--mut); border: 0; border-left: 1px solid rgba(214, 180, 110, .25); font-size: 14px; font-weight: 700; letter-spacing: 1px; cursor: pointer; touch-action: manipulation; }
  .seg button:first-child { border-left: 0; }
  .seg button.on { background: rgba(214, 180, 110, .18); color: var(--ink); box-shadow: inset 0 -2px 0 var(--gold); }
  .seg button svg { width: 13px; height: 13px; vertical-align: -1px; margin-left: 1px; }
  .tbtns { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 10px; }
  .tbtns .gbtn { font-size: 15px; letter-spacing: 2px; padding: 6px 8px; }
  .tbtns .wide { grid-column: 1 / -1; font-size: 17px; letter-spacing: 5px; }
  .rec { margin-top: 9px; font-size: 12px; color: var(--mut); letter-spacing: 1px; line-height: 1.6; }
  .rec b { color: var(--gold); font-weight: 700; font-family: var(--nf); }
  .tips { margin-top: 4px; font-size: 11px; color: #85806f; line-height: 1.55; }
  body.land #title { flex-direction: row; align-items: center; justify-content: space-between; gap: 18px; padding: 16px calc(70px + env(safe-area-inset-right)) 16px calc(70px + env(safe-area-inset-left)); background: linear-gradient(90deg, rgba(4, 6, 14, .25) 10%, rgba(4, 6, 14, .88) 100%); }
  body.land #title .logo { flex: 1; min-width: 0; align-self: flex-start; margin-top: 4vh; }
  body.land #title .logo h1 { font-size: clamp(34px, min(6.4vw, 14vh), 92px); }
  body.land #title .logo .sub { font-size: 10.5px; letter-spacing: 4px; }
  body.land #title .tcard { width: min(400px, 46vw); flex: none; }
  body.short #title .logo { margin-top: 0; }
  body.short .tips { display: none; }
  body.short .tcard { padding: 10px 12px; max-height: calc(100vh - 20px); overflow: auto; }
  body.short .tbtns { margin-top: 7px; gap: 6px; }
  body.short .tbtns .gbtn { min-height: 40px; }
  body.short .rec { margin-top: 5px; }

  .frow { display: flex; align-items: center; gap: 10px; margin-bottom: 7px; }
  .frow label { flex: none; width: 66px; font-size: 13px; color: var(--mut); letter-spacing: 1px; text-align: left; }
  .frow .seg { flex: 1; }
  .backs { flex: 1; display: flex; gap: 8px; justify-content: space-between; }
  .backs button { flex: 1; height: 42px; border-radius: 6px; border: 2px solid transparent; cursor: pointer; padding: 0; box-shadow: inset 0 0 0 2px #f4efe3, inset 0 0 0 3px rgba(214, 180, 110, .6); }
  .backs button.on { border-color: var(--gold); box-shadow: inset 0 0 0 2px #f4efe3, inset 0 0 0 3px rgba(214, 180, 110, .6), 0 0 0 2px rgba(214, 180, 110, .35); }
  .note { font-size: 11.5px; color: #8e8574; margin: 2px 0 10px; letter-spacing: .5px; }
  .stat { display: grid; grid-template-columns: 1fr auto; gap: 6px 14px; margin: 8px auto 14px; font-size: 14px; max-width: 300px; text-align: left; }
  .stat span:nth-child(2n) { text-align: right; font-variant-numeric: tabular-nums; color: var(--gold); font-weight: 700; font-family: var(--nf); }
  .stat .nb { color: #f6d98d; font-size: 11px; font-family: var(--pf); margin-left: 4px; font-style: normal; }
  .big { font-family: var(--sf); font-size: 38px; font-weight: 900; color: var(--gold); letter-spacing: 8px; padding-left: 8px; margin: 2px 0 2px; }
  .sub2 { font-size: 12px; letter-spacing: 4px; color: var(--mut); }
  body.short .card { padding: 10px 14px; width: min(560px, 100%); }
  body.short .card h2 { font-size: 20px; margin: 0 0 4px; }
  body.short .stat { grid-template-columns: 1fr auto 1fr auto; max-width: none; font-size: 13px; margin: 4px 0 8px; gap: 3px 12px; }
  body.short .frow { margin-bottom: 4px; }
  body.short .seg button { min-height: 34px; font-size: 13px; }
  body.short .backs button { height: 32px; }
  body.short .big { font-size: 28px; }
  body.short .acts.col { flex-direction: row; flex-wrap: wrap; }
  body.short .acts.col .gbtn { min-width: 30%; min-height: 40px; padding: 6px 6px; font-size: 14px; letter-spacing: 1px; }
  body.short #setOv .card { width: min(780px, 100%); }
  body.short .sgrid { display: grid; grid-template-columns: 1fr 1fr; column-gap: 16px; }
  body.short .sgrid .note { grid-column: 1 / -1; margin: 0 0 6px; }
  body.short .sgrid .frow label { width: 58px; font-size: 12px; }
  .dinfo { font-size: 12px; color: var(--mut); letter-spacing: 1px; margin-bottom: 10px; }
  .dinfo b { color: var(--gold); font-family: var(--nf); }
</style>
</head>
<body>
<canvas id="cv" aria-label="蜘蛛接龍牌桌"></canvas>
<div id="probe"></div>
<div id="info" class="glass hide">
  <span><i>時間</i><b id="iTime">0:00</b></span><em class="sep"></em>
  <span><i>步數</i><b id="iMoves">0</b></span><em class="sep"></em>
  <span><i>分數</i><b id="iScore" class="gd">500</b></span>
</div>
<button id="bPause" class="glass hide" aria-label="暫停"><svg viewBox="0 0 24 24"><rect x="6" y="5" width="4" height="14" rx="1" fill="#f2ead9"/><rect x="14" y="5" width="4" height="14" rx="1" fill="#f2ead9"/></svg></button>
<div id="bar" class="hide">
  <button class="tb" id="bNew"><svg viewBox="0 0 24 24" fill="none" stroke="#d6b46e" stroke-width="1.8" stroke-linejoin="round"><rect x="4" y="6" width="10" height="14" rx="1.6"/><path d="M9 4.2 10.6 3.7a1.6 1.6 0 0 1 2 1.1l3.3 12.3"/><path d="M19 4v5M16.5 6.5h5" stroke-linecap="round"/></svg><span>新局</span></button>
  <button class="tb" id="bUndo"><svg viewBox="0 0 24 24" fill="none" stroke="#d6b46e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg><span>復原</span></button>
  <button class="tb" id="bHint"><svg viewBox="0 0 24 24" fill="none" stroke="#d6b46e" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18h6M10 21h4"/><path d="M12 3a6 6 0 0 0-3.6 10.8c.6.5 1 1.2 1 2V16h5.2v-.2c0-.8.4-1.5 1-2A6 6 0 0 0 12 3Z"/></svg><span>提示</span></button>
  <button class="tb" id="bDeal"><svg viewBox="0 0 24 24" fill="none" stroke="#d6b46e" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="9" width="7" height="11" rx="1.3"/><rect x="14" y="9" width="7" height="11" rx="1.3"/><path d="M12 2.5v5M9.8 5.4 12 7.6l2.2-2.2"/></svg><span>發牌</span><em class="cnt" id="bDealN">5</em></button>
  <button class="tb" id="bAuto" disabled><svg viewBox="0 0 24 24" fill="none" stroke="#d6b46e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 13 6-6 6 6"/><path d="m6 19 6-6 6 6"/></svg><span>自動</span></button>
</div>
<div id="msg" class="glass"></div>
<div id="busy" class="glass hide"><div class="row"><i></i><span id="busyT">洗牌中</span></div><button id="busyRnd" class="hide">直接開始隨機牌局</button></div>

<div id="title" class="ov hide">
  <div class="logo">
    <div class="sub">SPIDER SOLITAIRE</div>
    <h1>蜘蛛接龍</h1>
    <div class="motto">同花色 K 到 A · 收齊八組</div>
  </div>
  <div class="tcard glass">
    <div class="seg" id="tSuits"><button data-v="1">單色 ♠</button><button data-v="2">雙色 ♠♥</button><button data-v="4">四色</button></div>
    <div class="tbtns">
      <button class="gbtn pri wide" id="tNew">開始新局</button>
      <button class="gbtn wide hide" id="tCont">繼續<small id="tContS"></small></button>
      <button class="gbtn wide" id="tDaily">每日挑戰<small id="tDailyS"></small></button>
      <button class="gbtn" id="tStats">統計</button>
      <button class="gbtn" id="tSet">設定</button>
    </div>
    <div class="rec" id="tRec"></div>
    <div class="tips">點一下牌自動移動・拖曳移動整串同花色牌・點牌庫發牌<br>鍵盤：D 發牌・Z 復原・H 提示・A 自動完成・P 暫停</div>
  </div>
</div>

<div id="pauseOv" class="ov hide">
  <div class="card glass">
    <h2>暫停</h2>
    <div class="dinfo" id="pInfo"></div>
    <div class="acts col">
      <button class="gbtn pri" id="pResume">繼續</button>
      <button class="gbtn" id="pRestart">重玩本局</button>
      <button class="gbtn" id="pNew">新局</button>
      <button class="gbtn" id="pSet">設定</button>
      <button class="gbtn" id="pStats">統計</button>
      <button class="gbtn" id="pTitle">回到標題</button>
    </div>
  </div>
</div>

<div id="setOv" class="ov hide">
  <div class="card glass">
    <h2>設定</h2>
    <div class="sgrid">
    <div class="frow"><label>花色</label><div class="seg" id="sSuits"><button data-v="1">單色</button><button data-v="2">雙色</button><button data-v="4">四色</button></div></div>
    <div class="frow"><label>發牌</label><div class="seg" id="sDeal"><button data-v="solvable">保證有解</button><button data-v="random">隨機牌局</button></div></div>
    <div class="note">花色與發牌方式於下一局生效。四色牌局若在時限內找不到有解牌局，會改用隨機牌局並提示。</div>
    <div class="frow"><label>空列發牌</label><div class="seg" id="sEmpty"><button data-v="0">禁止（標準）</button><button data-v="1">允許</button></div></div>
    <div class="frow"><label>牌背</label><div class="backs" id="sBack"></div></div>
    <div class="frow"><label>音效</label><div class="seg" id="sSound"><button data-v="1">開</button><button data-v="0">關</button></div></div>
    <div class="frow"><label>背景音樂</label><div class="seg" id="sMusic"><button data-v="1">開</button><button data-v="0">關</button></div></div>
    </div>
    <div class="acts" style="margin-top:10px"><button class="gbtn pri" id="sClose">完成</button></div>
  </div>
</div>

<div id="statOv" class="ov hide">
  <div class="card glass">
    <h2>統計</h2>
    <div class="seg" id="stTab"><button data-v="1">單色</button><button data-v="2">雙色</button><button data-v="4">四色</button></div>
    <div class="stat" id="stGrid"></div>
    <div class="acts"><button class="gbtn" id="stReset">重設統計</button><button class="gbtn pri" id="stClose">關閉</button></div>
  </div>
</div>

<div id="confOv" class="ov hide">
  <div class="card glass">
    <h2 id="cTitle">開新局？</h2>
    <p id="cText">目前的牌局將視為未完成。</p>
    <div class="acts"><button class="gbtn" id="cNo">取消</button><button class="gbtn pri" id="cYes">確定</button></div>
  </div>
</div>

<div id="winOv" class="ov hide" style="background:rgba(4,6,12,.4)">
  <div class="card glass">
    <div class="sub2" id="wSub">牌局完成</div>
    <div class="big">恭喜過關</div>
    <div class="stat" id="wStats"></div>
    <div class="acts"><button class="gbtn pri" id="wAgain">再來一局</button><button class="gbtn" id="wTitle">回到標題</button></div>
  </div>
</div>

<script src="../../assets/common.js"></script>
<script>
/*SOLVER-START*/
function SSolverFactory() {
  'use strict';
  // 牌值 v = 點數*4 + 花色（點數 0=A … 12=K；花色 0♠ 1♥ 2♦ 3♣）。同花色差一級 = 相差 4
  function mulberry(a) {
    return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
  }
  function valOf(u, suits) { const r = u % 13, k = (u / 13) | 0; const s = suits === 1 ? 0 : suits === 2 ? (k & 1) : (k & 3); return r * 4 + s; }
  function deal(seed, suits) {
    const rnd = mulberry(seed >>> 0), d = [];
    for (let i = 0; i < 104; i++) d.push(i);
    for (let i = 103; i > 0; i--) { const j = Math.floor(rnd() * (i + 1)); const t = d[i]; d[i] = d[j]; d[j] = t; }
    const tab = [];

    if (hintFx) { hintFx.t += dt; act = true; if (hintFx.t > 4) hintFx = null; }
    if (emptyFx) { emptyFx.t += dt; act = true; if (emptyFx.t > 1.6) emptyFx = null; }
    if (winFx && !winFx.done) { stepCascade(dt); act = true; if (winFx.done) showWin(); }
    if (phase === 'title') act = true;
    if (phase === 'play' && G && !paused && G.counted && !G.won && !document.hidden) {
      G.elapsed += dt;
      const s = Math.floor(G.elapsed);
      if (s !== lastSec) { lastSec = s; $('iTime').textContent = fmtTime(s); }
      saveT += dt; if (saveT > 5) { saveT = 0; saveGame(); }
    }
    if (act) dirty = Math.max(dirty, 1);
  }
  function frame(now) {
    const dt = Math.min(0.05, Math.max(0, (now - (lastT || now)) / 1000));
    lastT = now;
    update(dt);
    if (dirty > 0) { render(now); dirty--; }
    requestAnimationFrame(frame);
  }

  /* =========================================================
   * 輸入：寬鬆的點擊與拖曳判定
   * ========================================================= */
  let down = null, drag = null;
  const snapR = () => Math.max(16, LY.w * 0.5);
  function hitRects() {
    const R = [], w = LY.w, h = LY.h;
    const s = stockRect();
    R.push({ x: s.x, y: s.y, w: s.w, h: s.h, loc: 's', p: -1, idx: -1 });
    for (let p = 0; p < 10; p++) {
      const a = G.tab[p];
      if (!a.length) { R.push({ x: LY.t[p].x, y: LY.t[p].y, w, h, loc: 't', p, idx: -1 }); continue; }
      for (let i = 0; i < a.length; i++) {
        const q = tabPos(p, i), nb = i < a.length - 1 ? tabPos(p, i + 1).y : q.y + h + h * 0.35;
        R.push({ x: q.x, y: q.y, w, h: Math.max(1, nb - q.y), loc: 't', p, idx: i });
      }
    }
    return R;
  }
  function rectDist(r, x, y) {
    const dx = Math.max(r.x - x, 0, x - (r.x + r.w)), dy = Math.max(r.y - y, 0, y - (r.y + r.h));
    return Math.hypot(dx, dy);
  }
  function hitTest(x, y) {
    const R = hitRects();
    for (let i = R.length - 1; i >= 0; i--) if (rectDist(R[i], x, y) === 0) return R[i];
    let best = null, bd = snapR() + 0.001;
    for (const r of R) { const d = rectDist(r, x, y); if (d < bd) { bd = d; best = r; } }
    return best;
  }
  function destinations(p, idx) {
    const out = [];
    for (let q = 0; q < 10; q++) if (legal(p, idx, q)) out.push(q);
    return out;
  }
  // 點牌時的目標排序：同花色優先，其次空列，再來其他花色
  function rankDest(p, idx, opts) {
    const c = V(G.tab[p][idx]), n = G.tab[p].length - idx;
    const sc = q => {
      const b = G.tab[q];
      if (!b.length) return idx === 0 ? -100 : 200 - Math.abs(q - p) * 0.1;
      const t = V(b[b.length - 1]);
      if (su(t) === su(c)) {
        const len = b.length - runStart(q);
        return (len + n >= 13 ? 1000 : 300) + len * 2 - Math.abs(q - p) * 0.1;
      }
      return 100 - Math.abs(q - p) * 0.1;
    };
    return opts.filter(q => sc(q) > -50).sort((a, b) => sc(b) - sc(a));
  }
  function wiggle(cards) { for (const c of cards) VS[c].shake = 0.35; SFX.bad(); dirty = 3; }
  // 點牌自動移動；重複點同一張牌會輪流嘗試其他位置
  function smartMove(p, idx) {
    if (!canPick(p, idx)) return null;
    const c = G.tab[p][idx], now = performance.now();
    const opts = rankDest(p, idx, destinations(p, idx));
    let tried;
    if (tapCyc && tapCyc.card === c && tapCyc.at === p && now - tapCyc.t < 5000) tried = tapCyc.tried.slice();
    else tried = [p];
    let cand = opts.filter(o => !tried.includes(o));
    if (!cand.length && opts.length) { tried = [p]; cand = opts.filter(o => o !== p); }
    if (!cand.length) { wiggle(G.tab[p].slice(idx)); tapCyc = null; return null; }
    const q = cand[0];
    if (!commitMove(p, idx, q)) return null;
    tried.push(q);
    tapCyc = { card: c, at: q, tried, t: now };
    return q;
  }
  function tapAt(x, y) {
    if (!G || G.won) return;
    const h = hitTest(x, y);
    if (!h) return;
    if (h.loc === 's') { commitDeal(); return; }
    if (h.idx < 0) return;
    const p = h.p, a = G.tab[p];
    let idx = h.idx;
    if (idx < G.down[p]) { if (idx === G.down[p] - 1 && y > tabPos(p, idx).y + LY.dn * 0.5) idx = G.down[p]; else return; }
    const rs = runStart(p);
    if (idx < rs) { wiggle(a.slice(idx)); showMsg('只能移動<b>同花色</b>、依序相連的牌'); return; }
    smartMove(p, idx);
  }
  function bestTarget() {
    const v0 = VS[drag.cards[0]], w = LY.w, g = LY.g;
    let best = null, bs = w * 0.25;
    for (const q of drag.opts) {
      const tx = LY.t[q].x;
      const ov = Math.max(0, Math.min(v0.lx + w, tx + w + g) - Math.max(v0.lx, tx - g));
      const s = ov + (drag.px >= tx - g && drag.px <= tx + w + g ? w : 0);
      if (s > bs) { bs = s; best = q; }
    }
    return best;
  }
  function ptr(e) { const r = cv.getBoundingClientRect(); return { x: (e.clientX - r.left) * W / (r.width || W), y: (e.clientY - r.top) * H / (r.height || H) }; }
  cv.addEventListener('pointerdown', e => {
    if (phase !== 'play' || paused || !G) return;
    if (winFx) { if (!$('winOv').classList.contains('hide')) return; showWin(); return; }
    if (busy || down) return;
    e.preventDefault();
    try { cv.setPointerCapture(e.pointerId); } catch (er) { /* 忽略 */ }
    const p = ptr(e);
    down = { id: e.pointerId, x: p.x, y: p.y, touch: e.pointerType !== 'mouse', hit: hitTest(p.x, p.y), moved: 0 };
  });
  cv.addEventListener('pointermove', e => {
    if (!down || e.pointerId !== down.id) return;
    const p = ptr(e);
    const dist = Math.hypot(p.x - down.x, p.y - down.y);
    down.moved = Math.max(down.moved, dist);
    if (!drag) {
      const th = down.touch ? 12 : 6, h = down.hit;
      if (dist < th || !h || h.loc !== 't' || h.idx < 0) return;
      if (!canPick(h.p, h.idx)) return;
      const cards = G.tab[h.p].slice(h.idx);
      drag = { p: h.p, idx: h.idx, cards, opts: destinations(h.p, h.idx), active: true, target: null, px: p.x, py: p.y, base: cards.map(c => ({ dx: VS[c].tx - down.x, dy: VS[c].ty - down.y })) };
      for (const c of cards) { const v = VS[c]; v.drag = true; v.anim = false; v.next = null; v.x = v.tx; v.y = v.ty; }
      hintFx = null;
      SFX.flick();
    }
    drag.px = p.x; drag.py = p.y;
    drag.cards.forEach((c, i) => { const v = VS[c]; v.lx = p.x + drag.base[i].dx; v.ly = p.y + drag.base[i].dy; });
    drag.target = bestTarget();
    dirty = 3;
  });
  function endPointer(e, cancel) {
    if (!down || e.pointerId !== down.id) return;
    const d = down; down = null;
    if (drag) {
      const g = drag;
      const tgt = cancel ? null : bestTarget();
      drag = null;
      for (const c of g.cards) VS[c].drag = false;
      if (tgt != null && commitMove(g.p, g.idx, tgt)) { tapCyc = null; return; }
      if (!cancel && d.moved < 40) { returnCards(g.cards); tapAt(d.x, d.y); return; }
      returnCards(g.cards); SFX.bad();
      return;
    }
    if (!cancel) tapAt(d.x, d.y);
  }
  cv.addEventListener('pointerup', e => endPointer(e, false));
  cv.addEventListener('pointercancel', e => endPointer(e, true));
  cv.addEventListener('contextmenu', e => e.preventDefault());

  window.addEventListener('keydown', e => {
    if (phase !== 'play' || !G) return;
    const k = e.key.toLowerCase();
    if (k === 'escape' || k === 'p') { togglePause(!paused); e.preventDefault(); return; }
    if (paused || busy) return;
    if (k === ' ' || k === 'd') { commitDeal(); e.preventDefault(); }
    else if (k === 'z' || k === 'backspace' || k === 'u') { undo(); e.preventDefault(); }
    else if (k === 'h') hint();
    else if (k === 'a') { if (autoComplete() === false) SFX.bad(); }
    else if (k === 'n') askNew();
  });

  /* =========================================================
   * 介面
   * ========================================================= */
  let msgTimer = 0;
  function showMsg(html, ms) {
    const m = $('msg');
    m.innerHTML = html; m.classList.add('on');
    clearTimeout(msgTimer);
    msgTimer = setTimeout(() => m.classList.remove('on'), ms || 1800);
  }
  function setBusy(t, cancel) {
    $('busy').classList.toggle('hide', !t);
    $('busyRnd').classList.toggle('hide', !cancel);
    if (t) $('busyT').textContent = t;
  }
  function showHUD(on) {
    ['info', 'bar', 'bPause'].forEach(id => $(id).classList.toggle('hide', !on));
    $('title').classList.toggle('hide', on);
  }
  function updateHUD() {
    if (!G) return;
    $('iTime').textContent = fmtTime(G.elapsed);
    $('iMoves').textContent = G.moves;
    $('iScore').textContent = G.score;
    $('bUndo').disabled = !hist.length || G.won;
    const av = autoAvailable();
    $('bAuto').disabled = !av;
    $('bAuto').classList.toggle('glow', av);
    $('bHint').disabled = G.won;
    const ng = stockGroups();
    $('bDeal').disabled = !ng || G.won;
    $('bDealN').textContent = ng; $('bDealN').classList.toggle('hide', !ng);
  }
  const segSyncs = [];
  function syncAllSegs() { segSyncs.forEach(f => f()); }
  function seg(id, get, set) {
    const el = $(id);
    const sync1 = () => el.querySelectorAll('button').forEach(b => b.classList.toggle('on', b.dataset.v === String(get())));
    el.addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; set(b.dataset.v); SFX.click(); syncAllSegs(); });
    segSyncs.push(sync1);
  }
  let statTab = 1;
  seg('tSuits', () => settings.suits, v => { settings.suits = +v; saveSettings(); updateTitle(); if (settings.deal === 'solvable') pregen(settings.suits); });
  seg('sSuits', () => settings.suits, v => { settings.suits = +v; saveSettings(); if (settings.deal === 'solvable') pregen(settings.suits); });
  seg('sDeal', () => settings.deal, v => { settings.deal = v; saveSettings(); });
  seg('sEmpty', () => settings.emptyDeal ? 1 : 0, v => { settings.emptyDeal = v === '1'; saveSettings(); hintList = null; if (G) updateHUD(); });
  seg('sSound', () => KG.isMuted() ? 0 : 1, v => { KG.setMuted(v === '0'); });
  seg('sMusic', () => settings.music ? 1 : 0, v => { settings.music = v === '1'; saveSettings(); });
  seg('stTab', () => statTab, v => { statTab = +v; renderStats(); });
  const backs = $('sBack');
  BACKS.forEach((b, i) => {
    const bt = document.createElement('button');
    bt.style.background = 'linear-gradient(135deg,' + b.a + ',' + b.b + ')';
    bt.title = b.n; bt.setAttribute('aria-label', '牌背' + b.n);
    bt.addEventListener('click', () => { settings.back = i; saveSettings(); spriteCache.clear(); dirty = 3; SFX.click(); syncBacks(); });
    backs.appendChild(bt);
  });
  function syncBacks() { backs.querySelectorAll('button').forEach((b, i) => b.classList.toggle('on', i === settings.back)); }
  document.addEventListener('click', e => { if (e.target.closest && e.target.closest('.kg-mute')) setTimeout(syncAllSegs, 0); });

  function updateTitle() {
    const s = stats['s' + settings.suits];
    const save = KG.store.get('spider:save', null);
    $('tCont').classList.toggle('hide', !save || !save.g);
    if (save && save.g) $('tContS').textContent = SUITN[save.g.suits] + ' · ' + save.g.moves + ' 步 · 已收 ' + save.g.found.length + '/8 · ' + fmtTime(save.g.elapsed || 0);
    const dk = todayKey(), dd = dailyRec[dk + '-' + settings.suits];
    $('tDailyS').textContent = dk.slice(0, 4) + '/' + dk.slice(4, 6) + '/' + dk.slice(6) + ' · ' + SUITN[settings.suits] + (dd ? ' · 已完成 ' + dd.score + ' 分' : ' · 尚未完成');
    const best = KG.best('spider-s' + settings.suits);
    $('tRec').innerHTML = '已玩 <b>' + s.played + '</b> 局 · 勝率 <b>' + (s.played ? Math.round(100 * s.won / s.played) : 0) + '%</b> · 最高分 <b>' + (best == null ? '--' : best) + '</b> · 連勝 <b>' + s.streak + '</b>';
    syncAllSegs();
  }
  function showTitle(on) {
    if (on) {
      phase = 'title'; paused = false;
      ['info', 'bar', 'bPause'].forEach(id => $(id).classList.add('hide'));
      ['pauseOv', 'winOv'].forEach(id => $(id).classList.add('hide'));
      $('title').classList.remove('hide');
      trailOn = false; winFx = null; clearLater();
      updateTitle();
      titleAnchor = null;
      dirty = 3;
    } else $('title').classList.add('hide');
  }
  function togglePause(v) {
    if (phase !== 'play') return;
    paused = v;
    $('pauseOv').classList.toggle('hide', !v);
    if (v && G) {
      $('pInfo').innerHTML = (G.kind === 'daily' ? '每日挑戰 <b>' + G.daily.slice(4, 6) + '/' + G.daily.slice(6) + '</b> · ' : '') + SUITN[G.suits] + ' · ' + (G.kind === 'random' ? '隨機牌局' : '保證有解') + ' · 已收 <b>' + G.found.length + '/8</b> · 牌局 <b>#' + G.seed + '</b>';
      saveGame();
    }
    SFX.click();
  }
  function renderStats() {
    const s = stats['s' + statTab];
    const rows = [
      ['已玩局數', s.played], ['勝局', s.won], ['勝率', s.played ? Math.round(100 * s.won / s.played) + '%' : '--'],
      ['最佳時間', s.bestTime ? fmtTime(s.bestTime) : '--'], ['最少步數', s.fewest || '--'], ['最高分數', s.bestScore == null ? '--' : s.bestScore],
      ['目前連勝', s.streak], ['最長連勝', s.bestStreak], ['每日挑戰完成', stats.daily || 0]
    ];
    $('stGrid').innerHTML = rows.map(r => '<span>' + r[0] + '</span><span>' + r[1] + '</span>').join('');
    syncAllSegs();
  }
  let resetArm = false;
  function openStats() { statTab = G && phase === 'play' ? G.suits : settings.suits; resetArm = false; $('stReset').textContent = '重設統計'; renderStats(); $('statOv').classList.remove('hide'); }
  function openSettings() { syncAllSegs(); syncBacks(); $('setOv').classList.remove('hide'); }
  let confirmFn = null;
  function confirmBox(title, text, yes, fn) { $('cTitle').textContent = title; $('cText').textContent = text; $('cYes').textContent = yes; confirmFn = fn; $('confOv').classList.remove('hide'); }
  function askNew() {
    if (G && G.counted && !G.won && hist.length) confirmBox('開新局？', '目前的牌局將視為未完成，連勝紀錄會中斷。', '開新局', () => newGame());
    else newGame();
  }
  const on = (id, fn) => $(id).addEventListener('click', fn);
  on('tNew', () => { SFX.click(); newGame(); });
  on('tCont', () => { SFX.click(); resumeGame(); });
  on('tDaily', () => { SFX.click(); newGame('daily'); });
  on('tStats', () => { SFX.click(); openStats(); });
  on('tSet', () => { SFX.click(); openSettings(); });
  on('busyRnd', () => { SFX.click(); genTok++; setBusy(null); startGame((Math.random() * 4294967295) >>> 0, 'random'); });
  on('bPause', () => togglePause(true));
  on('pResume', () => togglePause(false));
  on('pRestart', () => { togglePause(false); confirmBox('重玩本局？', '回到這一局的開頭重新發牌。', '重玩', restartDeal); });
  on('pNew', () => { togglePause(false); askNew(); });
  on('pSet', () => { SFX.click(); openSettings(); });
  on('pStats', () => { SFX.click(); openStats(); });
  on('pTitle', () => { paused = false; $('pauseOv').classList.add('hide'); saveGame(); showTitle(true); });
  on('sClose', () => { SFX.click(); $('setOv').classList.add('hide'); if (phase === 'title') updateTitle(); });
  on('stClose', () => { SFX.click(); $('statOv').classList.add('hide'); });
  on('stReset', () => {
    if (!resetArm) { resetArm = true; $('stReset').textContent = '再按一次確認'; return; }
    stats['s' + statTab] = ST0(); saveStats(); resetArm = false; $('stReset').textContent = '重設統計'; renderStats();
  });
  on('cNo', () => { SFX.click(); $('confOv').classList.add('hide'); confirmFn = null; });
  on('cYes', () => { SFX.click(); $('confOv').classList.add('hide'); const f = confirmFn; confirmFn = null; if (f) f(); });
  on('wAgain', () => { SFX.click(); hideWin(); newGame(); });
  on('wTitle', () => { SFX.click(); hideWin(); showTitle(true); });
  on('bNew', () => { SFX.click(); askNew(); });
  on('bUndo', () => undo());
  on('bHint', () => hint());
  on('bDeal', () => { if (!busy && !paused) commitDeal(); });
  on('bAuto', () => { if (!autoComplete()) SFX.bad(); });
  document.addEventListener('visibilitychange', () => { if (document.hidden && phase === 'play' && !paused && G && !G.won) togglePause(true); });
  let lay = 0;
  const relayout = () => { cancelAnimationFrame(lay); lay = requestAnimationFrame(() => layout()); };
  window.addEventListener('resize', relayout);
  window.addEventListener('orientationchange', () => setTimeout(relayout, 120));
  if (window.visualViewport) window.visualViewport.addEventListener('resize', relayout);

  /* =========================================================
   * 測試介面
   * ========================================================= */
  window.__sp = {
    state() {
      if (!G) return { phase };
      return Object.assign(JSON.parse(JSON.stringify({ tab: G.tab, down: G.down, stock: G.stock, found: G.found })), {
        names: G.tab.map(a => a.map(cname)), vals: G.tab.map(a => a.map(V)), runStart: G.tab.map((a, p) => runStart(p)),
        suits: G.suits, score: G.score, moves: G.moves, seed: G.seed, kind: G.kind, won: G.won, elapsed: G.elapsed,
        deals: stockGroups(), completed: G.found.length, phase, paused, busy, hist: hist.length, auto: autoAvailable(), ver
      });
    },
    start(o) {
      o = o || {};
      if (o.suits) settings.suits = o.suits;
      if (o.emptyDeal != null) settings.emptyDeal = !!o.emptyDeal;
      if (o.seed != null) { abandonCurrent(); startGame(o.seed >>> 0, o.kind || 'random', null, settings.suits); return this.state(); }
      return newGame(o.kind).then(() => this.state());
    },
    load(o) {
      setVals(o.suits || 1);
      G = { tab: o.tab.map(a => a.slice()), down: o.down.slice(), stock: (o.stock || []).slice(), found: (o.found || []).map(a => a.slice()), suits: o.suits || 1, score: o.score == null ? 500 : o.score, moves: 0, seed: 0, kind: 'random', daily: null, elapsed: 0, counted: false, won: false };
      resetFx(); phase = 'play'; paused = false; showHUD(true);
      for (const v of VS) { v.x = v.tx = v.fx = -500; v.y = v.ty = v.fy = -500; v.anim = false; v.face = false; v.ft = null; v.fto = false; }
      sync({ instant: true }); afterChange(); return this.state();
    },
    move(from, idx, to) { return commitMove(from, idx, to); },
    deal() { return commitDeal(); },
    legal(from, idx, to) { return legal(from, idx, to); },
    canDeal() { return !dealBlock(); },
    autoMove(p, idx) { return smartMove(p, idx); },
    tap(x, y) { tapAt(x, y); return this.state(); },
    hint() { return hint(); },
    undo() { return undo(); },
    solve(timeMs) { const r = KS.solveAny(KS.mk(gameForSolver()), G.suits, { timeMs: timeMs || 6000, allowEmpty: settings.emptyDeal, seed: G.seed ^ 0x5bd1 }); return { ok: r.ok, nodes: r.nodes, ms: r.ms, moves: r.moves }; },
    solveAsync(timeMs) { return wcall({ cmd: 'solve', g: gameForSolver(), opt: { timeMs: timeMs || 4000, allowEmpty: settings.emptyDeal } }); },
    gen(suits) { return wcall({ cmd: 'gen', base: (Math.random() * 4294967295) >>> 0, suits: suits || 1, opt: {} }); },
    playSolution(gap) { const r = this.solve(); if (!r.ok) return false; return playMoves(r.moves, gap == null ? 0.02 : gap); },
    autoComplete() { return autoComplete(); },
    setInstant(v) { instant = !!v; },
    settle() { for (const v of VS) { if (v.anim || v.next) { if (v.next) { v.tx = v.next.x; v.ty = v.next.y; v.next = null; } v.anim = false; v.x = v.tx; v.y = v.ty; } if (v.ft != null) { v.ft = null; v.face = v.fto; } v.shake = 0; } busy = false; dirty = 3; },
    animating() { return animating(); },
    rect(p, i) { if (!G) return null; if (p === 'stock') return stockRect(); const a = G.tab[p]; if (i == null || !a.length) return colRect(p); const q = tabPos(p, i); const nb = i < a.length - 1 ? tabPos(p, i + 1).y : q.y + LY.h; return { x: q.x, y: q.y, w: LY.w, h: nb - q.y }; },
    layout() { return JSON.parse(JSON.stringify(LY)); },
    settings, stats: () => stats, showWin, togglePause, toTitle: () => showTitle(true), ui: { askNew, openStats, openSettings }
  };

  layout();
  syncAllSegs();
  showTitle(true);
  if (settings.deal === 'solvable') setTimeout(() => pregen(settings.suits), 600);
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
