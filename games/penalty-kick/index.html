<html lang="zh-Hant-TW">

<title>3D 足球 PK</title>
<link rel="stylesheet" href="../../assets/common.css">
<style>

  #sb .r1 { display: flex; align-items: center; gap: 8px; background: linear-gradient(180deg, rgba(14, 28, 64, .92), rgba(6, 14, 34, .92)); border: 1px solid rgba(255, 255, 255, .14); border-radius: 12px; padding: 4px 10px; box-shadow: 0 6px 16px rgba(0, 0, 0, .35); max-width: 100%; }

  #bars::before, #bars::after { content: ""; position: absolute; left: 0; right: 0; height: 9vh; background: #000; transition: transform .35s ease; }
  #bars::before { top: 0; transform: translateY(-100%); }
  #bars::after { bottom: 0; transform: translateY(100%); }
  #bars.on::before, #bars.on::after { transform: none; }
  #bars span { position: absolute; left: 0; right: 0; bottom: calc(9vh + 10px); text-align: center; font-size: 13px; letter-spacing: 3px; color: rgba(255, 255, 255, .9); font-weight: 800; opacity: 0; transition: opacity .3s; text-shadow: 0 1px 4px #000; }

  .lv.lock { opacity: .4; cursor: not-allowed; }
  .lv.cur { border-color: var(--acc); }

  table.st { width: 100%; border-collapse: collapse; font-size: 14px; }

  .bt i { width: 9px; height: 9px; border-radius: 50%; flex: none; border: 1px solid rgba(255, 255, 255, .6); }
  .bt.w { color: #fff; font-weight: 900; }
  .bt.l { opacity: .45; text-decoration: line-through; }
  .bt.me { color: var(--acc); }
  .bt em { margin-left: auto; font-style: normal; font-size: 11px; color: var(--gold); }
  .champ { text-align: center; margin-top: 4px; font-size: 13px; color: var(--gold); font-weight: 800; }
  @media (max-height: 560px) and (min-width: 600px) {
    .ov { padding: 10px 70px; }

    .logo h1 { font-size: 28px; }
    .modes { grid-template-columns: repeat(4, 1fr); }

    .chip { font-size: 15px; }
    #sb .tn { font-size: 12px; }
    #sc { font-size: 19px; min-width: 46px; }
    .team { font-size: 12px; }
  }
</style>

  const D2R = Math.PI / 180;
  function camTarget() {

    }, 2600);
  }

  // ---- 挑戰
  function startChallenge(i) {
    closeOv(); clearScene();
    const c = CH[i];
    S.mode = 'challenge'; S.ch = c; S.chi = i; S.p2 = false;
    S.balls = c.balls; S.used = 0; S.goals = 0; S.saves = 0; S.woods = 0;
    S.A = sel.team; S.B = (sel.team + 1 + (i % 7)) % 8; if (S.B === S.A) S.B = (S.A + 1) % 8;
    ui.classList.remove('off');
    const bp = c.ball || [0, SPOT];
    placeBall(bp[0], bp[1]);
    if (c.rings) c.rings.forEach(r => RINGS.push(makeRing(r[0], r[1], r[2], r[3], r[4])));
    K.homeX = 0;
    if (c.wall) setupWall(c.wall, S.B);
    banner('挑戰 ' + (i + 1), c.n);
    SFX.whistle(0.4, 0.1);
    chSetupKick();
    camSnap();
  }
  function chSetupKick() {
    const c = S.ch;
    const bp = c.ball || [0, SPOT];
    placeBall(bp[0], bp[1]);
    if (c.wall) { poseWall(-1); S.wallT = -1; }
    keeperIdle();
    if (c.type === 'save') {
      setKit(kicker, S.B, false); setKit(keeper, S.A, true);
      K.vis = true;
      setupKeep(c.shooter);
    } else {
      setKit(kicker, S.A, false); setKit(keeper, S.B, true);
      K.vis = c.keeper >= 0;
      setupShot(c.keeper);
    }
    updateSB();
  }
  function chAfterKick(o) {
    const c = S.ch, goal = o === 'goal';
    S.used++;
    if (c.type === 'save') { if (!goal) S.saves++; }
    else if (goal) S.goals++;
    if (EV.wood) S.woods++;
    S.resultDur = goal ? 2.0 : 1.7;
    if (c.type === 'rings' && EV.ringHits) S.resultDur = 1.6;
    updateSB();
  }
  function chStatus() {
    const c = S.ch, left = c.balls - S.used;
    if (c.type === 'rings') {
      const hit = RINGS.filter(r => r.hit).length;
      if (hit === RINGS.length) return { done: true, win: true, stars: S.used <= RINGS.length ? 3 : S.used <= RINGS.length + 1 ? 2 : 1 };
      if (left <= 0) return { done: true, win: false };
    } else if (c.type === 'fk') {
      if (S.goals > 0) return { done: true, win: true, stars: S.used === 1 ? 3 : S.used === 2 ? 2 : 1 };
      if (left <= 0) return { done: true, win: false };
    } else {
      const v = c.type === 'save' ? S.saves : c.type === 'wood' ? S.woods : S.goals;
      const st = v >= c.s[2] ? 3 : v >= c.s[1] ? 2 : v >= c.s[0] ? 1 : 0;
      if (st === 3 || left <= 0) return { done: true, win: st > 0, stars: st };
      if (v + left < c.s[0]) return { done: true, win: false };
    }
    return { done: false };
  }
  function chNext() {
    const st = chStatus();
    if (!st.done) { chSetupKick(); return; }
    S.phase = 'over';
    hideHint();
    const c = S.ch, i = S.chi;
    const prev = stats.chStars[i] || 0;
    if (st.win) { stats.chStars[i] = Math.max(prev, st.stars); saveStats(); KG.sound('win'); if (st.stars >= 2) KG.confetti(); }
    else KG.sound('lose');
    const stars = '<div class="stars">' + [0, 1, 2].map(k => '<span class="' + (st.win && k < st.stars ? 'on' : '') + '" style="animation-delay:' + (0.15 + k * 0.15) + 's">★</span>').join('') + '</div>';
    const val = c.type === 'rings' ? '射穿 ' + RINGS.filter(r => r.hit).length + ' / ' + RINGS.length + ' 個圓環' : c.type === 'fk' ? (S.goals ? '第 ' + S.used + ' 球破門' : '沒有破門') : c.type === 'save' ? '守住 ' + S.saves + ' 球' : c.type === 'wood' ? '中柱 ' + S.woods + ' 次' : '進了 ' + S.goals + ' 球';
    const next = st.win && i < CH.length - 1;
    openOv('<div class="card"><h2>' + (st.win ? '挑戰成功！' : '挑戰失敗') + '</h2><p class="sub">第 ' + (i + 1) + ' 關 · ' + c.n + '</p>' + stars +
      '<div class="rec">' + val + '</div><p class="sub">' + starRule(c) + '</p>' +
      '<div class="row2">' + (next ? '<button class="btn" data-act="go-ch" data-v="' + (i + 1) + '" data-primary>下一關</button><button class="btn ghost" data-act="go-ch" data-v="' + i + '">重試</button>'
        : '<button class="btn" data-act="go-ch" data-v="' + i + '" data-primary>再試一次</button>') +
      '</div><button class="btn ghost wide" data-act="m-ch">關卡列表</button></div>', true);
  }
  function starRule(c) {
    if (c.type === 'rings') return '★★★：用 ' + c.rings.length + ' 球內完成　★★：' + (c.rings.length + 1) + ' 球內';
    if (c.type === 'fk') return '★★★：第一球就進　★★：第二球進';
    const u = c.type === 'save' ? '守住' : c.type === 'wood' ? '中柱' : '進球';
    return '★ ' + u + ' ' + c.s[0] + '　★★ ' + c.s[1] + '　★★★ ' + c.s[2];

  function dotHtml(arr, cur, from) {
    const n = Math.max(5, arr.length + (cur ? 1 : 0));
    let h = '<div class="dots">';
    for (let i = from || 0; i < n; i++) {
      if (i < arr.length) h += '<span class="dot ' + (arr[i] ? 'g' : 'm') + '">' + (arr[i] ? '✓' : '✕') + '</span>';
      else h += '<span class="dot' + (cur && i === arr.length ? ' cur' : '') + '"></span>';
    }
    return h + '</div>';
  }
  function kitSvg(t, size) {
    const T = TEAMS[t], s = size || 26;
    return '<svg class="kit" width="' + s + '" height="' + s + '" viewBox="0 0 40 40"><path d="M13 4 L5 9 L2 18 L9 20 L10 36 L30 36 L31 20 L38 18 L35 9 L27 4 Q20 9 13 4 Z" fill="' + T.shirt + '" stroke="rgba(0,0,0,.35)" stroke-width="1.5"/><path d="M13 4 Q20 9 27 4" stroke="' + T.trim + '" stroke-width="3" fill="none"/><path d="M10 30 H30" stroke="' + T.trim + '" stroke-width="2.5"/></svg>';
  }
  function updateSB() {
    const r1 = $('sbr1'), r2 = $('sbr2');
    if (S.mode === 'challenge') {
      const c = S.ch;
      r1.innerHTML = '<span class="tn"><b style="color:var(--gold)">第 ' + (S.chi + 1) + ' 關</b></span><span class="tn"><b>' + c.n + '</b></span>';
      let h = '';
      if (c.type === 'rings') h = RINGS.map(r => '<span class="dot ' + (r.hit ? 'g' : '') + '">' + (r.hit ? '✓' : '') + '</span>').join('');
      else for (let i = 0; i < c.balls; i++) h += '<span class="dot' + (i === S.used ? ' cur' : '') + '"></span>';
      r2.innerHTML = '<div class="dots">' + h + '</div>';
      const left = c.balls - S.used;
      const goalTxt = c.type === 'rings' ? '射穿所有圓環' : c.type === 'fk' ? '自由球破門' : c.type === 'save' ? '守住 ' + c.s[0] + ' 球（已守住 ' + S.saves + '）' : c.type === 'wood' ? '中柱 ' + c.s[0] + ' 次（已中 ' + S.woods + '）' : '進 ' + c.s[0] + ' 球（已進 ' + S.goals + '）';
      $('sub').innerHTML = goalTxt + ' · 剩 <b>' + left + '</b> 球';
      return;
    }
    const me = S.p2 ? '' : 'A';
    const nm = (t, side) => '<i style="background:' + TEAMS[t].shirt + '"></i><b>' + (S.p2 ? (side === 'A' ? 'P1 ' : 'P2 ') : '') + TEAMS[t].s + '</b>';
    r1.innerHTML = '<span class="tn ' + (me === 'A' ? 'me' : '') + '">' + nm(S.A, 'A') + '</span><span id="sc">' + cnt(S.ka) + ' : ' + cnt(S.kb) + '</span><span class="tn">' + nm(S.B, 'B') + '</span>';
    const live = S.phase === 'aim' || S.phase === 'run' || S.phase === 'pass' || S.phase === 'pick';
    const from = Math.max(0, Math.max(S.ka.length, S.kb.length) + (S.ka.length === S.kb.length ? 1 : 0) - 5);
    r2.innerHTML = dotHtml(S.ka, live && S.who === 'A', from) + '<span class="sep"></span>' + dotHtml(S.kb, live && S.who === 'B', from);

    const sd = rd > 5 ? '驟死賽' : '第 ' + rd + ' 輪';
    let role;
    if (S.p2) role = (S.who === 'A' ? 'P1 ' : 'P2 ') + '射門';

    $('sub').innerHTML = md + sd + ' · ' + role;
  }

      const left = RUN - S.runT;
      const r = 18 + left * 46;
      const inWin = left < 0.38;
      hx.strokeStyle = inWin ? 'rgba(200,240,74,.95)' : 'rgba(255,255,255,.45)'; hx.lineWidth = inWin ? 4 : 2.5;
      hx.beginPath(); hx.arc(b.x, b.y, r, 0, TAU); hx.stroke();
      hx.strokeStyle = 'rgba(255,255,255,.3)'; hx.lineWidth = 2; hx.beginPath(); hx.arc(b.x, b.y, 18, 0, TAU); hx.stroke();
      if (inWin) { hx.fillStyle = '#c8f04a'; hx.font = '900 15px sans-serif'; hx.textAlign = 'center'; hx.fillText('就是現在！', b.x, b.y - r - 8); }
    }
    if (S.phase === 'flight' && easyKeep && !S.userShoots && S.mode !== '2p' && S.flightT < 0.6 && S.pred) {
      const r = proj(S.pred.x, S.pred.y, 0);
      hx.strokeStyle = 'rgba(255,212,71,' + (0.55 - S.flightT * 0.8) + ')'; hx.lineWidth = 3;
      hx.beginPath(); hx.arc(r.x, r.y, 20, 0, TAU); hx.stroke();
    }
    if (S.phase === 'pick') {
      const g = goalRect();
      hx.setLineDash([8, 8]); hx.strokeStyle = 'rgba(200,240,74,' + (0.5 + 0.3 * Math.sin(clock * 5)) + ')'; hx.lineWidth = 2.5;
      hx.strokeRect(g.x0, g.y0, g.x1 - g.x0, g.y1 - g.y0); hx.setLineDash([]);
    }
  }

  /* =========================================================
   * 主迴圈
   * ========================================================= */
  let acc = 0;
  const dq = new THREE.Quaternion(), wv = new THREE.Vector3();
  function update(dt) {
    clock += dt;
    ui.classList.toggle('idle', S.phase === 'over' || S.phase === 'trophy' || S.phase === 'pass');
    crowdTick(dt);
    if (S.phase === 'pause') return;
    crowdU.uTime.value = clock;
    crowdU.uJump.value = Math.max(0, crowdU.uJump.value - dt * 0.33);
    shake = Math.max(0, shake - dt * 2.4);
    adTex.offset.x = (clock * 0.025) % 1;
    for (const r of RINGS) {
      if (r.amp) r.cx = r.bx + r.amp * Math.sin(clock * r.freq + r.ph);
      r.g.position.x = r.cx;
      if (r.hit) {
        r.hitT += dt;
        const s = 1 + Math.min(0.35, r.hitT * 1.2);
        r.g.scale.set(s, s, 1);
        r.mat.opacity = Math.max(0.18, 1 - r.hitT * 2); r.mat.color.set(0x7dff9a); r.dm.opacity = 0.04;
      } else { r.g.scale.set(1, 1, 1); r.mat.opacity = 0.85 + 0.15 * Math.sin(clock * 5); }
    }
    if (S.phase === 'replay') {
      if (RP) updateReplay(dt);
      poseKeeper(); poseKicker(dt * 0.32); updateNet(dt * 0.32); updateParts(dt * 0.32);
      return;
    }
    if (S.phase === 'aim') {
      S.aimT += dt;
      if (keys.l) KB.x -= dt * 3; if (keys.r) KB.x += dt * 3; if (keys.u) KB.y += dt * 2; if (keys.d) KB.y -= dt * 2;
      KB.x = clamp(KB.x, -4.8, 4.8); KB.y = clamp(KB.y, 0.1, 3.2);
      if (KB.charge) KB.power = clamp(0.15 + (performance.now() - KB.t0) / 1000 * 0.95, 0.15, 1.45);
    }
    if (S.phase === 'run') {
      S.runT += dt;
      if (KA.mode === 'stand' && S.runT >= 0) { KA.mode = 'run'; KA.t = 0; }
      if (S.runT >= RUN) oppKick();
    }
    if (B.live) {
      acc += dt;
      let n = 0;
      while (acc >= HS && n < 160) { physStep(HS); acc -= HS; n++; }
      if (n >= 160) acc = 0;
      EV.woodCool -= dt;
      if (B.caught) {
        const f = keeper; f.torso.getWorldPosition(tmpA);
        B.x = tmpA.x; B.y = tmpA.y + 0.3; B.z = tmpA.z + 0.22;
      } else {
        const w = Math.hypot(B.wx, B.wy, B.wz);
        if (w > 0.01) { wv.set(B.wx / w, B.wy / w, B.wz / w); dq.setFromAxisAngle(wv, w * dt); B.q.premultiply(dq); }
      }
    }
    if (S.phase === 'flight') {
      S.flightT += dt;
      recFrame();
      judge();
      if (S.outcome) { S.resultT += dt; if (S.resultT >= S.resultDur) afterResult(); }
    }
    if (S.wallT >= 0) { S.wallT += dt; poseWall(S.wallT); }
    updateKeeper(dt);
    poseKeeper();
    poseKicker(dt);
    updateNet(dt);
    updateParts(dt);
    if (S.phase === 'trophy') { trophy.rotation.y += dt * 0.8; trophy.position.y = 1.0 + Math.sin(clock * 1.5) * 0.06; }
  }
  function sync3D() {
    ballMesh.visible = B.y > -0.5;
    ballMesh.position.set(B.x, B.y, B.z);
    ballMesh.quaternion.copy(B.q);
    blob.visible = ballMesh.visible;
    blob.position.set(B.x, 0.012, B.z);
    const s = 1 + Math.max(0, B.y - R) * 0.35;
    blob.scale.set(s, s, 1);
    blob.material.opacity = clamp(1 - (B.y - R) * 0.25, 0.15, 1);
  }

  /* ---------- 大小與自動畫質 ---------- */
  const QKEY = 'quality:' + location.pathname.split('/').filter(Boolean).slice(-1)[0];
  const baseRatio = Math.min(window.devicePixelRatio || 1, small ? 1.75 : 2);
  const QLEVELS = [
    { ratio: baseRatio, shadow: true, crowd: 1 },
    { ratio: Math.min(baseRatio, 1.4), shadow: true, crowd: 1 },
    { ratio: Math.min(baseRatio, 1.1), shadow: true, crowd: 0.8 },
    { ratio: 1, shadow: false, crowd: 0.6 },
    { ratio: 0.8, shadow: false, crowd: 0.45 }
  ];
  let qLevel = clamp(KG.store.get(QKEY, KG.lowEnd ? 2 : 0) | 0, 0, QLEVELS.length - 1);
  const perf = { last: 0, n: 0, sum: 0, cool: 2.5 };
  function resize() {
    const r = glc.getBoundingClientRect();
    W = Math.max(1, r.width); H = Math.max(1, r.height);
    renderer.setSize(W, H, false);
    const dpr = Math.min(2, window.devicePixelRatio || 1);
    hud.width = Math.round(W * dpr); hud.height = Math.round(H * dpr);
    cam.aspect = W / H; cam.updateProjectionMatrix();
  }
  function applyQuality() {
    const q = QLEVELS[qLevel];
    renderer.setPixelRatio(q.ratio);
    renderer.setSize(W, H, false);
    if (renderer.shadowMap.enabled !== q.shadow) {
      renderer.shadowMap.enabled = q.shadow;
      scene.traverse(o => { if (o.material) [].concat(o.material).forEach(m => { m.needsUpdate = true; }); });
    }
    crowdMeshes.forEach(m => { m.count = Math.floor(m.userData.full * q.crowd); });
  }
  function renderFrame() {
    renderer.render(scene, cam);
    const now = performance.now(), dt = perf.last ? Math.min(0.5, (now - perf.last) / 1000) : 0;
    perf.last = now;
    if (document.hidden || qLevel >= QLEVELS.length - 1) return;
    perf.cool -= dt;
    if (perf.cool > 0) return;
    perf.sum += dt; perf.n++;
    if (perf.n >= 60) {
      if (perf.sum / perf.n > 1 / 45) {
        qLevel++;
        KG.store.set(QKEY, qLevel);
        applyQuality();
        perf.cool = 1.5;
      }
      perf.n = 0; perf.sum = 0;
    }
  }
  window.addEventListener('resize', resize);
  if (window.visualViewport) window.visualViewport.addEventListener('resize', resize);
  window.addEventListener('orientationchange', () => setTimeout(resize, 120));

  let last = performance.now(), first = true;
  function frame(now) {
    const dt = Math.max(0, Math.min(0.05, (now - last) / 1000));
    last = now;
    update(dt);
    sync3D();
    updateCamera(dt);
    renderFrame();
    drawHud();
    if (first) { first = false; const m = $('msg'); if (m) m.remove(); }
    requestAnimationFrame(frame);
  }
  resize();
  applyQuality();
  toMenu();
  camSnap();
  requestAnimationFrame(frame);

  /* =========================================================
   * 測試用掛勾
   * ========================================================= */
  const DIRS = { L: [-2.8, 1.0], R: [2.8, 1.0], C: [0, 1.1], UL: [-2.9, 2.0], UR: [2.9, 2.0], DL: [-2.8, 0.35], DR: [2.8, 0.35], U: [0, 2.1], D: [0, 0.4] };
  window.__pk = {
    state: () => ({
      phase: S.phase, mode: S.mode, lv: S.lv, A: S.A, B: S.B, first: S.first, ka: S.ka.slice(), kb: S.kb.slice(), who: S.who, userShoots: S.userShoots, outcome: S.outcome,
      decided: S.decided, ball: { x: B.x, y: B.y, z: B.z, vx: B.vx, vy: B.vy, vz: B.vz, live: B.live, caught: B.caught, inGoal: B.inGoal },
      keeper: { x: K.x, hy: K.hy, lean: K.lean, dive: !!K.dive, pend: !!K.pend, vis: K.vis }, ev: Object.assign({}, EV), lastShot: S.lastShot, oppPlan: S.oppPlan,
      ch: S.chi, used: S.used, balls: S.ch ? S.ch.balls : 0, goals: S.goals, saves: S.saves, woods: S.woods, rings: RINGS.map(r => ({ x: r.cx, y: r.cy, r: r.r, hit: r.hit, bx: r.bx, amp: r.amp, freq: r.freq, ph: r.ph })), clock,
      tour: S.tour ? { round: S.tour.round, out: S.tour.out, r: S.tour.r.map(a => a.slice()), team: S.tour.team } : null,
      stars: stats.chStars.slice(), stats: Object.assign({}, stats), quality: qLevel, overlay: !ov.classList.contains('hidden'), cam: CAM.mode, ball0: { x: BALL0.x, z: BALL0.z }, dove: S.dove,
      wall: WSH.filter(s => s.part === 'body').map(s => ({ x: s.ax, z: s.az }))
    }),
    start: o => {
      o = o || {};
      if (o.mode === 'challenge') startChallenge(o.level || 0);
      else if (o.mode === 'tour') { toMenu(); startTour(o.team == null ? sel.team : o.team, o.lv == null ? 1 : o.lv); }
      else if (o.mode === '2p') startMatch({ mode: '2p', A: o.A == null ? 0 : o.A, B: o.B == null ? 1 : o.B, p2: true, first: o.first });
      else startMatch({ mode: 'classic', A: o.team == null ? sel.team : o.team, B: o.opp == null ? (sel.team + 1) % 8 : o.opp, lv: o.lv == null ? 1 : o.lv, first: o.first });
    },
    kick: p => userKick(Object.assign({ x: 0, y: 1.2, power: 0.85, curl: 0 }, p || {})),
    dive: d => { const t = typeof d === 'string' ? DIRS[d] : [d.x, d.y]; return userDive(t[0], t[1]); },
    step: n => { for (let i = 0; i < (n || 1); i++) { update(1 / 60); sync3D(); } updateCamera(1 / 60); },
    stepUntil: (fn, max) => { let i = 0; while (i < (max || 3000) && !fn(window.__pk.state())) { update(1 / 60); i++; } sync3D(); updateCamera(1 / 60); return i; },
    sim: o => {
      // 純物理測試：不影響比分（呼叫前請在選單或 aim 狀態）
      o = o || {};
      placeBall(o.bx == null ? 0 : o.bx, o.bz == null ? SPOT : o.bz);
      const shot = shotFromParams(BALL0.x, BALL0.z, Object.assign({ exact: true }, o));
      if (o.vx != null) { shot.vx = o.vx; shot.vy = o.vy; shot.vz = o.vz; shot.wx = o.wx || 0; shot.wy = o.wy || 0; shot.wz = 0; }
      B.vx = shot.vx; B.vy = shot.vy; B.vz = shot.vz; B.wx = shot.wx; B.wy = shot.wy; B.wz = shot.wz;
      const keepK = KSH.slice(); if (!o.keeper) KSH.length = 0;
      const hook = physHook; physHook = null;
      let t = 0, maxZneg = 0, minX = 99, maxX = -99, behindBack = false, out = null;
      let wt = 0;
      while (t < (o.T || 3)) {
        if (wallN && t >= wt) { poseWall(t); wt += 1 / 60; }
        physStep(HS); t += HS;
        if (B.z < maxZneg) maxZneg = B.z;
        if (B.inGoal) { const bz = NBOT + (NTOP - NBOT) * clamp(B.y / GH, 0, 1); if (B.z < bz - 0.6 || Math.abs(B.x) > HW + 0.6 || B.y > GH + 0.6) behindBack = true; }
        minX = Math.min(minX, B.x); maxX = Math.max(maxX, B.x);
      }
      out = { speed: shot.speed, goal: EV.goal, crossed: EV.crossed, cx: EV.cx, cy: EV.cy, wood: EV.wood, bar: EV.bar, minWood: EV.minWood, maxPen: EV.maxPen, final: { x: B.x, y: B.y, z: B.z }, minZ: maxZneg, minX, maxX, escaped: behindBack, inGoal: B.inGoal, keeper: EV.keeper, wall: EV.wall };
      physHook = hook; KSH.length = 0; keepK.forEach(s => KSH.push(s));
      placeBall(BALL0.x, BALL0.z);
      if (wallN) poseWall(-1);
      return out;
    },
    pred: (x, y, power, curl, bx, bz) => { const s = shotFromParams(bx == null ? 0 : bx, bz == null ? SPOT : bz, { x, y, power, curl, exact: true }); flyTo(bx == null ? 0 : bx, R, bz == null ? SPOT : bz, s.vx, s.vy, s.vz, s.wx, s.wy, s.wz, 0, FT); return { x: FT.x, y: FT.y, t: FT.t, ok: FT.ok, speed: s.speed }; },
    forceOpp: p => { S.forceOpp = p; },
    aiKeeper: on => { S.aiKeeper = !!on; },
    next: () => { const b = ov.querySelector('[data-primary]'); if (b) { b.click(); return true; } return false; },
    skip: () => { if (S.phase === 'replay') endReplay(); else if (S.phase === 'flight' && S.outcome) S.resultT = S.resultDur; },
    menu: () => toMenu(),
    unlockAll: () => { for (let i = 0; i < CH.length; i++) if (!stats.chStars[i]) stats.chStars[i] = 0; },
    screen: (x, y, z) => { const p = proj(x, y, z); return { x: p.x, y: p.y }; },
    goalRect: () => goalRect(),
    pause: () => togglePause(),
    bench: n => { const gl = renderer.getContext(); renderer.render(scene, cam); gl.finish(); const t = performance.now(); for (let i = 0; i < (n || 5); i++) renderer.render(scene, cam); gl.finish(); return (performance.now() - t) / (n || 5); },
    kshapes: () => KSH.map(s => ({ a: [s.ax, s.ay, s.az].map(v => +v.toFixed(2)), b: [s.bx, s.by, s.bz].map(v => +v.toFixed(2)), r: s.r, p: s.part })),
    hud: () => { drawHud(); return S.phase; },
    info: () => ({ calls: renderer.info.render.calls, tris: renderer.info.render.triangles, q: qLevel }),
    dbg: (k, v) => { if (k === 'crowd') crowdMeshes.forEach(m => { m.visible = v; }); if (k === 'shadow') { renderer.shadowMap.enabled = v; } if (k === 'q') { qLevel = v; applyQuality(); } if (k === 'stands') stands.visible = v; if (k === 'net') NETP.forEach(n => { n.mesh.visible = v; }); if (k === 'gov') perf.cool = v ? 1 : 1e9; if (k === 'shadowR') { renderer.shadowMap.enabled = v; scene.traverse(o => { if (o.material) [].concat(o.material).forEach(m => { m.needsUpdate = true; }); }); } if (k === 'figs') { keeper.root.visible = v; kicker.root.visible = v; } }
  };
}
</script>
