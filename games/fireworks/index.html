<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>煙火音樂秀</title>
<link rel="stylesheet" href="../../assets/common.css">
<style>
  html, body { height: 100%; overflow: hidden; background: #050818; overscroll-behavior: none; color: #fff; }
  #sky { position: fixed; inset: 0; width: 100vw; height: 100vh; height: 100dvh; display: block; touch-action: none; }
  .hide { display: none !important; }
  button { font-family: var(--kg-font); }

  /* ---------- 標題 ---------- */
  #titleUI { position: fixed; inset: 0; z-index: 8000; display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 70px 16px calc(18px + env(safe-area-inset-bottom)); pointer-events: none; gap: 10px; }
  #titleUI h1 { margin: 0; font-size: clamp(40px, 12vw, 76px); font-weight: 900; letter-spacing: 4px; line-height: 1.1;
    background: linear-gradient(180deg, #fff6c8 0%, #ffd25a 40%, #ff8a5c 75%, #ff5fa8 100%); -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 0 12px rgba(255, 170, 90, 0.55)) drop-shadow(0 4px 0 rgba(60, 20, 70, 0.8)); animation: tfloat 3s ease-in-out infinite; }
  @keyframes tfloat { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
  #titleUI .sub { font-size: clamp(14px, 4vw, 19px); font-weight: 800; color: #dfe4ff; text-shadow: 0 2px 6px #000; text-align: center; margin-bottom: 4px; }
  .tbtns { display: grid; grid-template-columns: 1fr; gap: 10px; width: min(330px, 92vw); pointer-events: auto; }
  .tbtns .kg-btn { font-size: 20px; padding: 12px 10px; width: 100%; white-space: nowrap; }
  .tgl { display: flex; gap: 10px; pointer-events: auto; margin-top: 4px; }
  .tgl button { border: 2px solid rgba(255,255,255,0.35); background: rgba(10,14,40,0.75); color: #fff; font-size: 15px; font-weight: 800;
    padding: 7px 14px; border-radius: 999px; cursor: pointer; }
  .tgl button.on { background: rgba(80, 200, 120, 0.4); border-color: #9be8aa; }
  @media (orientation: landscape) and (max-height: 560px) {
    #titleUI { padding-top: 12px; gap: 6px; }
    #titleUI h1 { font-size: clamp(34px, 9vh, 56px); }
    .tbtns { grid-template-columns: 1fr 1fr; width: min(560px, 80vw); gap: 8px; }
    .tbtns .kg-btn { font-size: 17px; padding: 10px 8px; }
  }

  /* ---------- 上方 ---------- */
  #top { position: fixed; top: 12px; left: 66px; right: 66px; z-index: 8200; display: flex; justify-content: center; pointer-events: none; }
  #top > * { pointer-events: auto; }
  .chip { border: 2px solid rgba(255,255,255,0.35); background: rgba(10,14,40,0.78); color: #fff; font-size: 16px; font-weight: 800;
    padding: 8px 16px; border-radius: 999px; cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
  .chip.label { cursor: default; }
  #pauseBtn { position: fixed; right: 10px; top: 62px; z-index: 8300; width: 48px; height: 48px; border-radius: 50%; border: 3px solid #fff;
    background: linear-gradient(180deg, #fff 0%, #e9ecff 100%); box-shadow: var(--kg-shadow); font-size: 20px; font-weight: 900; color: #3a3f7a; cursor: pointer;
    display: grid; place-items: center; padding: 0; }
  #msg { position: fixed; left: 50%; top: 64px; z-index: 8400; transform: translateX(-50%); pointer-events: none; padding: 8px 20px; border-radius: 999px;
    background: rgba(255, 214, 92, 0.95); color: #4a2c00; font-size: 17px; font-weight: 900; opacity: 0;
    max-width: calc(100% - 136px); width: max-content; text-align: center; line-height: 1.35; }
  #msg.show { animation: msgpop 1.8s ease forwards; }
  @keyframes msgpop { 0% { opacity: 0; transform: translate(-50%, 10px) scale(0.8); } 12% { opacity: 1; transform: translate(-50%, 0) scale(1.06); }
    20% { transform: translate(-50%, 0) scale(1); } 80% { opacity: 1; } 100% { opacity: 0; transform: translate(-50%, -8px); } }

  /* ---------- 下方工具列 ---------- */
  #dock { position: fixed; left: 0; right: 0; bottom: 0; z-index: 8100; padding: 6px 8px calc(6px + env(safe-area-inset-bottom));
    background: linear-gradient(180deg, rgba(10, 12, 36, 0.62) 0%, rgba(5, 6, 20, 0.94) 40%); border-top: 1px solid rgba(255,255,255,0.14); }
  .pickrow { display: flex; flex-direction: column; gap: 6px; }
  .types { display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; }
  .tbtn { height: 50px; border-radius: 12px; background: rgba(255,255,255,0.07); border: 2px solid transparent; color: #e8ebff; font-size: 12px; font-weight: 800;
    display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 0; cursor: pointer; min-width: 0; }
  .tbtn canvas { width: 30px; height: 30px; display: block; }
  .tbtn.on { border-color: #ffd65c; background: rgba(255, 214, 92, 0.2); color: #fff; }
  .colors { display: flex; gap: 5px; justify-content: center; flex-wrap: nowrap; }
  .sw { width: 30px; height: 30px; flex: 0 0 auto; border-radius: 50%; border: 3px solid rgba(255,255,255,0.22); cursor: pointer; padding: 0; }
  .sw.on { border-color: #fff; transform: scale(1.12); box-shadow: 0 0 10px rgba(255,255,255,0.6); }
  .sw.rb { background: conic-gradient(#ff465a, #ff9a3c, #ffd450, #5af082, #46e1ff, #5a78ff, #b46eff, #ff78d7, #ff465a); }
  #words { display: flex; gap: 6px; overflow-x: auto; padding: 2px 0; scrollbar-width: none; }
  #words::-webkit-scrollbar { display: none; }
  #words button { flex: 0 0 auto; border: 2px solid rgba(255,255,255,0.3); background: rgba(255,255,255,0.08); color: #fff; font-size: 15px; font-weight: 800;
    padding: 5px 12px; border-radius: 999px; cursor: pointer; }
  #words button.on { background: rgba(255, 120, 215, 0.35); border-color: #ff9fdc; }
  @media (min-aspect-ratio: 1/1) {
    .pickrow { flex-direction: row; align-items: center; }
    .types { flex: 1; grid-template-columns: repeat(10, 1fr); }
    .colors { flex: 0 0 auto; }
  }
  @media (min-aspect-ratio: 1/1) and (max-height: 560px) {
    .tbtn { height: 46px; }
    .colors { display: grid; grid-template-columns: repeat(5, 24px); gap: 3px; }
    .sw { width: 24px; height: 24px; border-width: 2px; }
  }

  /* ---------- 編排 ---------- */
  #editor { margin-top: 6px; }
  .tlwrap { display: flex; border-radius: 10px; overflow: hidden; background: rgba(0,0,0,0.35); border: 1px solid rgba(255,255,255,0.12); }
  .lanes { flex: 0 0 26px; display: flex; flex-direction: column; font-size: 12px; font-weight: 900; color: #c8ceff; background: rgba(255,255,255,0.06); }
  .lanes div { display: flex; align-items: center; justify-content: center; }
  #tlScroll { flex: 1; overflow-x: auto; overflow-y: hidden; position: relative; touch-action: pan-x; scrollbar-width: thin; }
  #tlCanvas { display: block; cursor: pointer; }
  #playhead { position: absolute; top: 0; bottom: 0; width: 3px; margin-left: -1px; background: #fff; box-shadow: 0 0 8px #ffd65c; pointer-events: none; left: 0; }
  .ctl { display: grid; grid-template-columns: 1.5fr 1fr 1fr 1fr 1fr 1fr; gap: 5px; margin-top: 6px; }
  @media (max-width: 560px) { .ctl { grid-template-columns: 1fr 1fr 1fr; } }
  .ctl button { min-width: 0; border: 2px solid rgba(255,255,255,0.28); background: rgba(255,255,255,0.09); color: #fff; font-size: 14px; font-weight: 800;
    padding: 8px 2px; border-radius: 12px; cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ctl button.on { background: rgba(80, 200, 120, 0.45); border-color: #9be8aa; }
  .ctl button.warn { background: rgba(255, 90, 110, 0.5); border-color: #ff9aa8; }

  /* 橫式矮螢幕的編排模式：工具列縮成一列，多留天空 */
  body.edshort #dock { padding: 4px 8px calc(4px + env(safe-area-inset-bottom)); }
  body.edshort .pickrow { flex-direction: row; align-items: center; gap: 8px; overflow-x: auto; scrollbar-width: none; }
  body.edshort .pickrow::-webkit-scrollbar { display: none; }
  body.edshort .types { display: flex; flex: 0 0 auto; gap: 3px; }
  body.edshort .tbtn { flex: 0 0 auto; width: 42px; height: 34px; font-size: 0; border-radius: 10px; }
  body.edshort .tbtn canvas { width: 26px; height: 26px; }
  body.edshort .colors { display: flex; flex: 0 0 auto; gap: 3px; }
  body.edshort .sw { width: 24px; height: 24px; border-width: 2px; }
  body.edshort #words { margin-top: 4px; }
  body.edshort #words button { font-size: 13px; padding: 3px 10px; }
  body.edshort #editor { margin-top: 4px; }
  body.edshort .lanes { font-size: 11px; }
  body.edshort .ctl { margin-top: 4px; }
  body.edshort .ctl button { padding: 6px 2px; }

  /* ---------- 表演 ---------- */
  #showBar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 8100; display: flex; align-items: center; gap: 10px;
    padding: 8px 14px calc(10px + env(safe-area-inset-bottom)); background: linear-gradient(180deg, rgba(5,6,20,0) 0%, rgba(5,6,20,0.85) 60%); }
  .prog { flex: 1; height: 12px; border-radius: 6px; background: rgba(255,255,255,0.15); overflow: hidden; position: relative; }
  .prog i { position: absolute; left: 0; top: 0; bottom: 0; width: 0; background: linear-gradient(90deg, #ffd65c, #ff7ad9); border-radius: 6px; }
  #secName { font-size: 15px; font-weight: 900; min-width: 3.5em; text-align: center; color: #ffe9a8; }
  #stopBtn { border: 2px solid rgba(255,255,255,0.4); background: rgba(255, 90, 110, 0.55); color: #fff; font-size: 16px; font-weight: 900; padding: 8px 16px; border-radius: 999px; cursor: pointer; }

  /* ---------- 視窗 ---------- */
  #modal { position: fixed; inset: 0; z-index: 9000; display: grid; place-items: center; padding: 16px; background: rgba(3, 4, 16, 0.6); }
  .card { width: min(420px, 100%); max-height: calc(100% - 8px); overflow-y: auto; background: linear-gradient(180deg, #232861 0%, #141838 100%);
    border: 3px solid rgba(255,255,255,0.25); border-radius: 26px; padding: 18px 18px 20px; text-align: center; color: #fff;
    box-shadow: 0 18px 40px rgba(0,0,0,0.5); animation: kg-pop 0.3s cubic-bezier(0.2, 1.5, 0.4, 1); }
  .card h2 { margin: 2px 0 8px; font-size: 26px; }
  .card p { margin: 0 0 14px; font-size: 16px; line-height: 1.5; color: #dfe3ff; }
  .card .acts { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
  .card .acts .kg-btn { font-size: 18px; padding: 10px 20px; }
  .card .big { font-size: 46px; line-height: 1.1; }
  .slist { display: flex; flex-direction: column; gap: 8px; margin-bottom: 14px; text-align: left; }
  .sitem { display: flex; align-items: center; gap: 8px; background: rgba(255,255,255,0.08); border-radius: 14px; padding: 8px 10px; }
  .sitem .nm { flex: 1; min-width: 0; font-weight: 800; font-size: 16px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .sitem .nm small { display: block; font-size: 12px; color: #b9c0f0; font-weight: 700; }
  .sitem button { border: 2px solid rgba(255,255,255,0.3); background: rgba(255,255,255,0.1); color: #fff; font-size: 14px; font-weight: 800; padding: 6px 9px; border-radius: 10px; cursor: pointer; white-space: nowrap; }
  .sitem button.warn { background: rgba(255, 90, 110, 0.6); }
  .songs { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 14px; }
  .songs button { border: 2px solid rgba(255,255,255,0.3); background: rgba(255,255,255,0.08); color: #fff; font-size: 17px; font-weight: 900; padding: 14px 6px; border-radius: 16px; cursor: pointer; }
  .songs button small { display: block; font-size: 12px; color: #c8ceff; font-weight: 700; margin-top: 2px; }
  .card input { width: 100%; font-size: 24px; font-weight: 800; padding: 10px 12px; border-radius: 12px; border: 2px solid #8f9bff; background: #0d1030; color: #fff; text-align: center; margin-bottom: 14px; font-family: var(--kg-font); }
  @media (max-height: 460px) { .card { padding: 10px 14px 12px; } .card h2 { font-size: 21px; margin-bottom: 4px; } .card p { margin-bottom: 8px; } .card .big { font-size: 32px; } .songs button { padding: 8px 6px; } }
</style>
</head>
<body>
<canvas id="sky" aria-label="煙火音樂秀"></canvas>

<div id="titleUI">
  <h1>煙火音樂秀</h1>
  <div class="sub">點天空放煙火，跟著音樂變成一場表演！</div>
  <div class="tbtns">
    <button class="kg-btn green" id="bFree">🎆 自由放煙火</button>
    <button class="kg-btn blue" id="bEdit">🎼 煙火秀編排</button>
    <button class="kg-btn yellow" id="bMine">📼 我的煙火秀</button>
    <button class="kg-btn" id="bAuto">✨ 自動煙火秀</button>
  </div>
  <div class="tgl"><button id="tMusic"></button><button id="tSfx"></button></div>
</div>

<div id="top" class="hide"><button class="chip" id="songBtn"></button><div class="chip label hide" id="topLabel"></div></div>
<button id="pauseBtn" class="hide" aria-label="暫停">❚❚</button>
<div id="msg"></div>

<div id="dock" class="hide">
  <div class="pickrow"><div class="types" id="types"></div><div class="colors" id="colors"></div></div>
  <div id="words" class="hide"></div>
  <div id="editor" class="hide">
    <div class="tlwrap">
      <div class="lanes" id="lanes"><div>&nbsp;</div><div>高</div><div>中</div><div>低</div></div>
      <div id="tlScroll"><canvas id="tlCanvas"></canvas><div id="playhead"></div></div>
    </div>
    <div class="ctl">
      <button class="song" id="eSong"></button>
      <button id="ePrev">▶ 預覽</button>
      <button id="ePlay">🎆 整場</button>
      <button id="eAuto">✨ 自動</button>
      <button id="eClear">🗑 清空</button>
      <button id="eSave">💾 儲存</button>
    </div>
  </div>
</div>

<div id="showBar" class="hide"><div id="secName"></div><div class="prog"><i id="progFill"></i></div><button id="stopBtn">⏹ 停止</button></div>
<div id="modal" class="hide"><div class="card" id="card"></div></div>

<script src="../../assets/common.js"></script>
<script src="../../assets/kg-music.js"></script>
<script>
'use strict';
/* =====================================================================
 * 煙火音樂秀：點天空放煙火，每一發都會配上跟著音樂拍子的音符；
 * 也可以在時間軸上編排一整場煙火秀、存起來、自動產生表演。
 * ===================================================================== */
(function () {
const SLUG = 'fireworks';
const M = KG.music, S = KG.sfx;
const TAU = Math.PI * 2;
const FONT = '"PingFang TC","Noto Sans TC","Microsoft JhengHei","Heiti TC","WenQuanYi Zen Hei",system-ui,sans-serif';
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const lerp = (a, b, t) => a + (b - a) * t;
const rand = (a, b) => a + Math.random() * (b - a);
const $ = id => document.getElementById(id);
const Save = { get: (k, d) => KG.store.get(SLUG + ':' + k, d), set: (k, v) => KG.store.set(SLUG + ':' + k, v) };
function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

/* =====================================================================
 * 顏色與煙火種類
 * ===================================================================== */
const PAL = [
  { n: '紅', c: [255, 70, 90] }, { n: '橙', c: [255, 154, 60] }, { n: '金', c: [255, 212, 80] }, { n: '綠', c: [90, 240, 130] },
  { n: '青', c: [70, 225, 255] }, { n: '藍', c: [90, 120, 255] }, { n: '紫', c: [180, 110, 255] }, { n: '粉', c: [255, 120, 215] }, { n: '白', c: [240, 244, 255] }
];
const RAINBOW = 9, EMBER = 9, HOT = 10;   // 顏色選項 9 = 彩虹；粒子顏色 9 = 金色火星、10 = 白熱
const SPR_COLS = PAL.map(p => p.c).concat([[255, 190, 110], [255, 255, 255]]);
const TYPES = [
  { id: 'peony', n: '牡丹' }, { id: 'chrys', n: '菊花' }, { id: 'willow', n: '柳樹' }, { id: 'ring', n: '圓環' }, { id: 'heart', n: '愛心' },
  { id: 'star', n: '星星' }, { id: 'cross', n: '分裂' }, { id: 'glitter', n: '閃光' }, { id: 'smile', n: '笑臉' }, { id: 'text', n: '文字' }
];
const T_PEONY = 0, T_CHRYS = 1, T_WILLOW = 2, T_RING = 3, T_HEART = 4, T_STAR = 5, T_CROSS = 6, T_GLITTER = 7, T_SMILE = 8, T_TEXT = 9;
const WORDS = ['新年快樂', '生日快樂', '我愛你', '加油', '好棒', '平安', '台灣', '謝謝'];

/* =====================================================================
 * 音樂（全部原創）
 * ===================================================================== */
const NN = ['C', 'C#', 'D', 'D#', 'E', 'F', 'F#', 'G', 'G#', 'A', 'A#', 'B'];
const PCN = { C: 0, D: 2, E: 4, F: 5, G: 7, A: 9, B: 11 };
function midiOf(n) { const m = /^([A-G])([#b]?)(-?\d)$/.exec(n); if (!m) return null; return 12 * (+m[3] + 1) + PCN[m[1]] + (m[2] === '#' ? 1 : m[2] === 'b' ? -1 : 0); }
function nameOf(m) { return NN[m % 12] + (Math.floor(m / 12) - 1); }
const hz = m => 440 * Math.pow(2, (m - 69) / 12);
const QUAL = { '': [0, 4, 7], m: [0, 3, 7], '7': [0, 4, 7, 10], maj7: [0, 4, 7, 11], m7: [0, 3, 7, 10], sus2: [0, 2, 7], sus4: [0, 5, 7], dim: [0, 3, 6] };
function chordInfo(s) {
  const m = /^([A-G])([#b]?)(.*)$/.exec(s);
  const r = (PCN[m[1]] + (m[2] === '#' ? 1 : m[2] === 'b' ? -1 : 0) + 12) % 12;
  return { root: r, iv: QUAL[m[3]] || QUAL[''] };
}
const SCALE = { major: [0, 2, 4, 5, 7, 9, 11], minor: [0, 2, 3, 5, 7, 8, 10] };
/** 對拍用的「隱形樂器」：每一拍告訴遊戲目前在第幾小節第幾拍、音訊時間是多少 */
function beaconTrack(bars) {
  const seq = [];
  for (let b = 0; b < bars; b++) { const t = []; for (let k = 0; k < 4; k++) t.push(nameOf(24 + b * 4 + k)); seq.push(t.join(' ')); }
  return { inst: 'fwbeacon', seq };
}
/** 跟和弦走的對位旋律（第 5 八度，三音、五音） */
function counter(chords) {
  return chords.map(ch => { const c = chordInfo(ch); return nameOf(72 + (c.root + c.iv[1]) % 12) + ' - - - ' + nameOf(72 + (c.root + c.iv[2]) % 12) + ' - - -'; });
}
const CRASH4 = ['X...............', '................', '................', '................'];

// 1. 熱鬧新年：D 大調五聲音階，132 BPM
const CH_FEST = ['D', 'G', 'A', 'D', 'Bm', 'G', 'A', 'D', 'G', 'A', 'F#m', 'Bm', 'G', 'A', 'D', 'D'];
const MEL_FEST = [
  'D5 - E5 F#5 A5 - F#5 E5', 'D5 - B4 - D5 E5 - .', 'E5 F#5 A5 - B5 A5 F#5 E5', 'F#5 - - - D5 . . .',
  'B4 - D5 - F#5 - E5 D5', 'B4 - D5 E5 D5 - B4 .', 'A4 - B4 D5 E5 - F#5 E5', 'D5 - - - . . . .',
  'D5 - B4 D5 E5 - D5 B4', 'E5 - F#5 E5 A4 - . .', 'F#5 - A5 F#5 E5 - F#5 .', 'D5 - B4 - F#5 - - .',
  'B4 D5 E5 - D5 B4 A4 B4', 'E5 - A5 - F#5 E5 D5 E5', 'F#5 - E5 D5 E5 - A5 -', 'D5 - - - - - . .'
];
// 2. 星空夢境：降 E 大調，76 BPM
const CH_DREAM = ['Ebmaj7', 'Gm7', 'Abmaj7', 'Bb', 'Cm7', 'Gm7', 'Abmaj7', 'Bbsus4', 'Abmaj7', 'Bb', 'Gm7', 'Cm7', 'Fm7', 'Bb', 'Ebmaj7', 'Ebmaj7'];
const MEL_DREAM = [
  'G5 - - Bb5 - - G5 F5', 'D5 - - - F5 - G5 -', 'Eb5 - C5 - Eb5 - G5 -', 'F5 - - - - - . .',
  'G5 - - C5 - - Eb5 F5', 'D5 - - Bb4 - - D5 -', 'C5 - Eb5 - Ab5 - G5 -', 'F5 - - - Eb5 - D5 -',
  'Eb5 - - G5 - - Ab5 -', 'Bb5 - - - F5 - D5 -', 'G5 - F5 - D5 - Bb4 -', 'C5 - - - Eb5 - G5 -',
  'Ab5 - - G5 F5 - Eb5 -', 'D5 - - - F5 - - -', 'G5 - - - Bb4 - D5 -', 'Eb5 - - - - - - .'
];
// 3. 勇敢進行曲：降 B 大調，108 BPM
const CH_MARCH = ['Bb', 'F', 'Bb', 'Eb', 'Bb', 'F7', 'Bb', 'F', 'Eb', 'Bb', 'Cm', 'F', 'Bb', 'Eb', 'F7', 'Bb'];

  if (e.target && e.target.tagName === 'INPUT') return;
  if (e.key === 'Escape') {
    if (modalOpen && !paused) { closeModal(); ui('back'); return; }
    if (scene !== 'title') setPaused(!paused);
    return;
  }
  if (paused || modalOpen) return;
  if ((scene === 'free' || scene === 'edit') && /^[0-9]$/.test(e.key)) { selectType((+e.key + 9) % 10); return; }
  if (e.key === ' ' && (scene === 'free' || scene === 'title')) {
    e.preventDefault();
    skyTap(rand(W * 0.15, W * 0.85), rand(L.topY, L.maxY), scene === 'title' ? { type: Math.floor(Math.random() * 9), col: RAINBOW } : null);
  }
});
document.addEventListener('visibilitychange', () => { if (document.hidden && scene !== 'title' && !paused) setPaused(true); });

/* =====================================================================
 * 音樂隨煙火變化
 * ===================================================================== */
function updateMusicLayers(dt) {
  activity *= Math.exp(-dt / 4);
  if (scene === 'title') return;
  const want = {
    l1: layerState.l1 ? activity > 0.6 : activity > 1.3,
    l2: layerState.l2 ? activity > 2 : activity > 3.2,
    l3: layerState.l3 ? activity > 4.5 : activity > 6.5
  };
  for (const k in want) if (want[k] !== layerState[k]) { layerState[k] = want[k]; M.setLayer(k, want[k]); }
  if (scene === 'free') {
    if (fwTempo === 1 && activity > 11) setTempoFW(1.06);
    else if (fwTempo !== 1 && activity < 6) setTempoFW(1);
  }
  wowCool -= dt;
  if (scene === 'free' && activity > 9 && wowCool <= 0) { wowCool = 14; setTimeout(() => crowdWow(0.75), 700); }
}
/** 標題畫面：每兩拍自動放一發 */
let titleNext = 0;
function updateTitle() {
  if (scene !== 'title' || modalOpen) return;
  const p = posAt(gt + RISE);
  if (titleNext - p > 3) titleNext = p;
  if (p >= titleNext) {
    const pos = Math.ceil(p * 2) / 2;
    titleNext = pos + 0.5 + (Math.random() < 0.3 ? 0.5 : 0);
    if (pos - posAt(gt) > 2) { titleNext = posAt(gt + RISE); return; }
    launch({ x: rand(W * 0.12, W * 0.88), y: rand(L.topY, L.maxY), pos, type: Math.floor(Math.random() * 9), col: Math.random() < 0.3 ? RAINBOW : Math.floor(Math.random() * 9), quiet: true });
  }
}

/* =====================================================================
 * 主迴圈
 * ===================================================================== */
function step(dt) {
  if (paused) return;
  gt += dt;
  for (let i = flashes.length - 1; i >= 0; i--) { flashes[i].a -= dt * 2.6; if (flashes[i].a <= 0) flashes.splice(i, 1); }
  seqUpdate();
  updateTitle();
  updateRockets(dt);
  updateParticles(dt);
  updateMusicLayers(dt);
  if (scene === 'show') updateShow(dt);
  updatePlayhead();
  if (scene === 'free') { idleT += dt; hintT += dt; }
}
function drawHint() {
  if (scene !== 'free' || modalOpen) return;
  const show1 = stats.taps === 0 || idleT > 8;
  if (!show1) return;
  const a = 0.55 + 0.35 * Math.sin(gt * 3);
  ctx.globalAlpha = a; ctx.fillStyle = '#fff'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.font = '900 ' + Math.round(clamp(W * 0.055, 18, 30)) + 'px ' + FONT;
  ctx.fillText('點一下天空，放煙火！', W / 2, L.waterY * 0.42);
  ctx.font = '800 ' + Math.round(clamp(W * 0.035, 13, 18)) + 'px ' + FONT;
  ctx.fillText('很多手指一起點，可以一次放很多發', W / 2, L.waterY * 0.42 + clamp(W * 0.065, 24, 40));
  ctx.globalAlpha = 1;
}
let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, Math.max(0, (now - last) / 1000));
  last = now;
  const t0 = performance.now();
  try {
    updateAudioOffset();
    step(dt);
    if (!paused) updateFx(dt);
    drawScene();
    drawHint();
  } catch (err) { console.error(err); }
  governor(performance.now() - t0, dt);
  requestAnimationFrame(frame);
}
function relayout() { layout(); }
window.addEventListener('resize', relayout);
window.addEventListener('orientationchange', () => setTimeout(relayout, 150));
if (window.visualViewport) window.visualViewport.addEventListener('resize', relayout);
if (window.ResizeObserver) new ResizeObserver(() => layout()).observe($('dock'));

buildPicker();
refreshToggles();
setScene('title');
playSong(TITLE_SONG);
requestAnimationFrame(t => { last = t; frame(t); });

/* ---------- 測試用 ---------- */
function checkSongs() {
  const out = [];
  SONGS.concat([TITLE_SONG]).forEach(s => {
    const root = (PCN[s.key[0]] + (s.key[1] === 'b' ? -1 : 0) + 12) % 12, sc = SCALE[s.scale].map(v => (v + root) % 12);
    s.mel.forEach((bar, bi) => bar.split(/\s+/).forEach(tok => {
      if (tok === '.' || tok === '-') return;
      const m = midiOf(tok); if (m == null) { out.push(s.name + ' bad ' + tok); return; }
      const ch = chordInfo(s.chords[bi]), pcs = ch.iv.map(v => (ch.root + v) % 12);
      if (sc.indexOf(m % 12) < 0 && pcs.indexOf(m % 12) < 0) out.push(s.name + ' bar' + (bi + 1) + ' ' + tok);
      if (m < 55 || m > 84) out.push(s.name + ' range ' + tok);
    }));
    s.chords.forEach(c => { const ch = chordInfo(c); ch.iv.forEach(v => { if (sc.indexOf((ch.root + v) % 12) < 0) out.push(s.name + ' chord ' + c); }); });
    if (s.tracks) s.tracks.forEach(tr => { if (tr.seq && tr.inst !== 'fwbeacon') tr.seq.forEach(bar => { const n = bar.split(/\s+/).length; if (n !== 8) out.push(s.name + ' tokens ' + n); }); });
  });
  return out;
}
window.__fw = {
  state: () => ({ scene, paused, modal: modalOpen, parts: nActive, rockets: rockets.length, q, music: M.isPlaying(), layers: Object.assign({}, layerState),
    activity: +activity.toFixed(2), pos: +posAt(gt).toFixed(3), barDur: +grid.barDur.toFixed(3), beacons: stats.beacons, bursts: stats.bursts, taps: stats.taps,
    audioOk: audioOffOk, song: curSong().name, tempo: fwTempo, ed: ed ? { n: ed.ev.length, song: ed.song, preview: ed.preview, name: ed.name } : null,
    show: sh ? { count: sh.count, finale: sh.finale, ended: sh.ended, p: +(posAt(gt) - seq.startP).toFixed(2) } : null, saved: getShows().length, L: { waterY: L.waterY, R: Math.round(L.R), skyB: Math.round(L.skyB) } }),
  tick: sec => { for (let i = 0; i < sec * 60; i++) { step(1 / 60); updateFx(1 / 60); } },
  fire: (type, x, y, col) => skyTap(x == null ? W / 2 : x, y == null ? L.waterY * 0.4 : y, { type: type || 0, col: col == null ? RAINBOW : col }),
  perf: reset => { const r = { avg: perf.n ? +(perf.sum / perf.n).toFixed(2) : 0, max: +perf.max.toFixed(1), n: perf.n, q }; if (reset) { perf.n = 0; perf.sum = 0; perf.max = 0; } return r; },
  setQ: n => setQuality(n),
  auto: si => startShow({ name: '自動煙火秀', song: si || 0, ev: autoShow(si || 0, 7), word: SONGS[si || 0].word }, 'auto'),
  autoEv: si => autoShow(si || 0, 7).length,
  checkSongs,
  pause: p => setPaused(p),
  go: s => { if (s === 'title') goTitle(); else if (s === 'free') goFree(); else if (s === 'edit') goEdit(); },
  slotTimes: () => { const out = []; for (const r of rockets) out.push(+((r.pos * 8) % 1).toFixed(4)); return out; }
};
})();
</script>
