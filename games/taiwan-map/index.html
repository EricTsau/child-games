<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>台灣地圖拼圖</title>
<link rel="stylesheet" href="../../assets/common.css">
<style>
  html, body { height: 100%; overflow: hidden; background: #8fd3f4; overscroll-behavior: none; }
  #game { position: fixed; inset: 0; width: 100vw; height: 100vh; height: 100dvh; display: block; touch-action: none; z-index: 1; }
  .ui { position: fixed; z-index: 50; display: none; }
  body[data-screen="title"] .s-title,
  body[data-screen="puzzle"] .s-puzzle,
  body[data-screen="find"] .s-find,
  body[data-screen="explore"] .s-explore,
  body[data-screen="quiz"] .s-quiz,
  body[data-screen="puzzle"] .s-game, body[data-screen="find"] .s-game,
  body[data-screen="explore"] .s-game, body[data-screen="quiz"] .s-game { display: flex; }
  .card {
    background: linear-gradient(180deg, rgba(255,255,255,0.97), rgba(255,247,236,0.97));
    border: 4px solid #fff; border-radius: 26px;
    box-shadow: 0 8px 0 rgba(74,59,82,0.13), 0 14px 30px rgba(40,80,120,0.22);
  }
  /* 標題 */
  #title { flex-direction: column; align-items: center; justify-content: center; gap: 1.6vmin; padding: 12px 14px; }
  .logo { font-size: clamp(28px, 6.4vmin, 50px); font-weight: 900; letter-spacing: 2px; line-height: 1.1; text-align: center; white-space: nowrap; }
  .logo span { display: inline-block; animation: bob 2.4s ease-in-out infinite; color: #fff;
    -webkit-text-stroke: 0; text-shadow: 0 3px 0 #2f7fb8, 0 -2px 0 #2f7fb8, 2px 0 0 #2f7fb8, -2px 0 0 #2f7fb8, 0 7px 0 rgba(47,127,184,0.35); }
  .logo span:nth-child(5n+1) { color: #ffd65c; } .logo span:nth-child(5n+2) { color: #ff9fbe; }
  .logo span:nth-child(5n+3) { color: #9be8aa; } .logo span:nth-child(5n+4) { color: #9ad8ff; } .logo span:nth-child(5n) { color: #ffb36b; }
  @keyframes bob { 0%,100% { transform: translateY(0) rotate(0); } 50% { transform: translateY(-4px) rotate(-2deg); } }
  .sub { font-size: clamp(14px, 2.6vmin, 19px); font-weight: 800; color: #4a7aa0; }
  .acts { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; width: 100%; max-width: 440px; }
  .act { display: flex; align-items: center; gap: 8px; padding: 8px 10px; border: 3px solid #fff; border-radius: 20px; cursor: pointer;
    font-family: var(--kg-font); color: var(--kg-ink); text-align: left; transition: transform .12s; box-shadow: 0 5px 0 rgba(74,59,82,0.16); }
  .act:active { transform: translateY(3px) scale(0.98); }
  .act canvas { width: 46px; height: 46px; flex: none; }
  .act b { display: block; font-size: 19px; }
  .act small { display: block; font-size: 12px; font-weight: 700; opacity: 0.75; }
  .act .st { font-size: 12px; color: #e39b00; font-weight: 900; }
  .act[data-act="puzzle"] { background: linear-gradient(180deg, #fff3c4, #ffd977); }
  .act[data-act="find"] { background: linear-gradient(180deg, #d8f6ff, #95dbff); }
  .act[data-act="explore"] { background: linear-gradient(180deg, #e3fbe3, #a7e8a9); }
  .act[data-act="quiz"] { background: linear-gradient(180deg, #ffe3ee, #ffb0cb); }
  .trow { display: flex; gap: 12px; align-items: center; justify-content: center; flex-wrap: wrap; }
  .pill { background: #fff; border-radius: 999px; padding: 6px 14px; font-weight: 900; box-shadow: 0 3px 0 rgba(74,59,82,0.15); font-size: 16px; }
  .kg-btn.sm { font-size: 16px; padding: 9px 18px; }
  /* HUD */
  #hud { justify-content: center; align-items: center; gap: 8px; pointer-events: none; }
  #hud .pill { font-size: clamp(14px, 2.4vmin, 18px); padding: 6px 12px; white-space: nowrap; }
  .rbtn { width: 48px; height: 48px; border-radius: 50%; border: 3px solid #fff; background: linear-gradient(180deg, #fff, #e8f6ff);
    box-shadow: var(--kg-shadow); cursor: pointer; align-items: center; justify-content: center; padding: 0; z-index: 60; }
  .rbtn:active { transform: scale(0.9); }
  .rbtn canvas { width: 30px; height: 30px; pointer-events: none; }
  /* 找找看提示 */
  #prompt { flex-direction: column; align-items: center; justify-content: center; padding: 6px 10px; text-align: center; }
  #prompt .ask { font-size: 14px; font-weight: 800; color: #4a7aa0; }
  #prompt .nm { font-size: clamp(24px, 5vmin, 36px); font-weight: 900; line-height: 1.15; color: #e8648d; }
  #prompt .nm.pulse { animation: kg-pop .35s cubic-bezier(.2,1.6,.4,1); }
  #prompt .row { display: flex; gap: 8px; align-items: center; margin-top: 4px; }
  #dots { display: flex; gap: 4px; flex-wrap: wrap; justify-content: center; }
  #dots i { width: 10px; height: 10px; border-radius: 50%; background: #e2dbe8; display: block; }
  #dots i.ok { background: #46b864; } #dots i.meh { background: #f5b82e; } #dots i.cur { background: #6cc4ff; transform: scale(1.3); }
  /* 認識縣市 */
  #info { flex-direction: column; padding: 10px 12px; gap: 6px; overflow: hidden; }
  .ihead { display: flex; align-items: center; gap: 8px; }
  .ihead .nav { width: 42px; height: 42px; border-radius: 50%; border: 3px solid #fff; background: #ffe58a; font-size: 22px; font-weight: 900;
    color: #6b4a00; box-shadow: 0 4px 0 #c48a12; cursor: pointer; flex: none; font-family: var(--kg-font); }
  .ihead .nav:active { transform: translateY(3px); box-shadow: 0 1px 0 #c48a12; }
  .ihead .mid { flex: 1; text-align: center; min-width: 0; }
  .iname { font-size: clamp(24px, 4.6vmin, 34px); font-weight: 900; line-height: 1.1; }
  .itype { display: inline-block; font-size: 13px; font-weight: 900; padding: 2px 10px; border-radius: 999px; background: #6cc4ff; color: #fff; margin-top: 2px; }
  .isum { font-size: clamp(14px, 2.4vmin, 17px); font-weight: 700; text-align: center; color: #5b4a66; line-height: 1.35; }
  .facts { display: flex; flex-direction: column; justify-content: center; gap: 8px; flex: 1; min-height: 0; }
  .fact { display: flex; align-items: center; gap: 8px; background: #fff; border-radius: 16px; padding: 4px 8px; box-shadow: 0 3px 0 rgba(74,59,82,0.10); flex: 0 1 auto; min-height: 0; max-height: 96px; }
  .fact canvas { width: 48px; height: 48px; flex: none; }
  .fact b { font-size: 16px; display: block; }
  .fact b em { font-style: normal; font-size: 11px; padding: 1px 7px; border-radius: 999px; color: #fff; margin-right: 5px; vertical-align: 2px; }
  .fact p { margin: 1px 0 0; font-size: 13.5px; line-height: 1.3; color: #5b4a66; font-weight: 600; }
  .ihint { text-align: center; font-weight: 800; color: #4a7aa0; font-size: 17px; margin: auto; padding: 10px; line-height: 1.6; }
  /* 小測驗 */
  #quiz { flex-direction: column; padding: 10px 12px; gap: 8px; }
  .qtop { display: flex; justify-content: space-between; align-items: center; font-weight: 900; color: #4a7aa0; font-size: 15px; }
  .qtext { font-size: clamp(18px, 3.4vmin, 24px); font-weight: 900; text-align: center; line-height: 1.3; min-height: 2.4em; display: grid; place-items: center; }
  .opts { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; flex: 1; min-height: 0; }
  .opt { font-family: var(--kg-font); font-size: clamp(18px, 3.4vmin, 24px); font-weight: 900; color: var(--kg-ink); border: 3px solid #fff; border-radius: 18px;
    background: linear-gradient(180deg, #ffffff, #e9f5ff); box-shadow: 0 5px 0 #9fc7e6; cursor: pointer; padding: 4px; }
  .opt:active { transform: translateY(3px); box-shadow: 0 2px 0 #9fc7e6; }
  .opt.ok { background: linear-gradient(180deg, #c9f7d1, #7ddc93); box-shadow: 0 5px 0 #2f8a48; }
  .opt.bad { background: linear-gradient(180deg, #ffd3d3, #ff9a9a); box-shadow: 0 5px 0 #c24444; animation: kg-shake .4s; }
  .opt[disabled] { cursor: default; }
  .qfeed { text-align: center; font-weight: 800; min-height: 1.4em; font-size: 16px; color: #2f8a48; }
  /* 覆蓋畫面 */
  .ov { position: fixed; inset: 0; z-index: 200; display: none; place-items: center; padding: 16px; background: rgba(40, 70, 100, 0.42); }
  .ov.show { display: grid; animation: kg-fade .2s ease; }
  .ov .card { width: min(440px, 100%); max-height: calc(100% - 8px); overflow: auto; padding: 18px 16px; text-align: center; animation: kg-pop .35s cubic-bezier(.2,1.6,.4,1); }
  .ov h2 { margin: 2px 0 8px; font-size: clamp(22px, 4.4vmin, 30px); }
  .ov p { margin: 4px 0 10px; font-size: 17px; font-weight: 700; }
  .btns { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-top: 10px; }
  .lvls { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .lvl { font-family: var(--kg-font); border: 3px solid #fff; border-radius: 18px; padding: 8px 6px; cursor: pointer; color: var(--kg-ink);
    box-shadow: 0 5px 0 rgba(74,59,82,0.16); background: linear-gradient(180deg, #fff, #fff1c9); }
  .lvl:active { transform: translateY(3px); }
  .lvl b { display: block; font-size: 19px; } .lvl small { display: block; font-size: 12.5px; font-weight: 700; opacity: .8; }
  .lvl .st { display: block; margin-top: 3px; height: 18px; }
  .lvl .bt { display: block; font-size: 12px; font-weight: 800; color: #2672ad; min-height: 15px; }
  .stars { display: flex; justify-content: center; gap: 6px; margin: 4px 0 6px; }
  .stars svg { width: 46px; height: 46px; animation: kg-pop .5s cubic-bezier(.2,1.6,.4,1) both; }
  .stk-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(72px, 1fr)); gap: 6px; }
  .stk { background: #fff; border-radius: 14px; padding: 4px 2px; font-size: 12.5px; font-weight: 800; box-shadow: 0 2px 0 rgba(74,59,82,0.12); }
  .stk canvas { width: 60px; height: 60px; display: block; margin: 0 auto; }
  .stk.off { opacity: 0.55; }
  .newstk { display: flex; gap: 4px; justify-content: center; flex-wrap: wrap; margin: 4px 0; }
  .newstk canvas { width: 44px; height: 44px; }
  h3 { margin: 10px 0 6px; font-size: 18px; }
</style>
</head>
<body data-screen="title">
<canvas id="game" aria-label="台灣地圖"></canvas>

<div id="title" class="ui s-title card">
  <div class="logo" aria-label="台灣地圖拼圖"><span>台</span><span>灣</span><span>地</span><span>圖</span><span>拼</span><span>圖</span></div>
  <div class="sub">一起認識臺灣的 22 個縣市！</div>
  <div class="acts">
    <button class="act" data-act="puzzle"><canvas data-ico="act_puzzle"></canvas><span><b>拼圖</b><small>把縣市拼回去</small><span class="st"></span></span></button>
    <button class="act" data-act="find"><canvas data-ico="act_find"></canvas><span><b>找找看</b><small>聽名字，點地圖</small><span class="st"></span></span></button>
    <button class="act" data-act="explore"><canvas data-ico="act_book"></canvas><span><b>認識縣市</b><small>美食、景點、特產</small><span class="st"></span></span></button>
    <button class="act" data-act="quiz"><canvas data-ico="act_quiz"></canvas><span><b>小測驗</b><small>地理考考你</small><span class="st"></span></span></button>
  </div>
  <div class="trow"><button id="btnStickers" class="kg-btn yellow sm">貼紙簿</button><span class="pill" id="starTotal"></span></div>
</div>

<div id="hud" class="ui s-game"><span class="pill" id="hudA"></span><span class="pill" id="hudB"></span></div>
<button id="pauseBtn" class="ui s-game rbtn" aria-label="暫停"><canvas data-ico="ui_pause"></canvas></button>
<button id="hintBtn" class="ui s-puzzle rbtn" aria-label="提示"><canvas data-ico="ui_hint"></canvas></button>

<div id="prompt" class="ui s-find card">
  <div class="ask">請在地圖上找出</div>
  <div class="nm" id="findName">臺北市</div>
  <div class="row"><button id="sayBtn" class="kg-btn blue sm">再聽一次</button></div>
  <div id="dots" style="margin-top:6px"></div>
</div>

<div id="info" class="ui s-explore card">
  <div class="ihint" id="ihint">點一下地圖上的縣市，<br>看看那裡有什麼好玩、好吃的！</div>
  <div class="ihead" id="ihead" style="display:none">
    <button class="nav" id="prevC" aria-label="上一個">‹</button>
    <div class="mid"><div class="iname" id="iname"></div><span class="itype" id="itype"></span></div>
    <button class="nav" id="nextC" aria-label="下一個">›</button>
  </div>
  <div class="isum" id="isum"></div>
  <div class="facts" id="facts"></div>
</div>

<div id="quiz" class="ui s-quiz card">
  <div class="qtop"><span id="qnum"></span><span id="qscore"></span></div>
  <div class="qtext" id="qtext"></div>
  <div class="opts" id="opts"></div>
  <div class="qfeed" id="qfeed"></div>
</div>

<div id="levels" class="ov"><div class="card">
  <h2>選擇拼圖難度</h2>
  <div class="lvls" id="lvls"></div>
  <div class="btns"><button class="kg-btn blue sm" id="lvBack">返回</button></div>
</div></div>

<div id="pauseOv" class="ov"><div class="card">
  <h2>休息一下</h2>
  <p>準備好再繼續喔！</p>
  <div class="btns" style="flex-direction:column;align-items:center">
    <button class="kg-btn green" id="pResume">繼續</button>
    <button class="kg-btn yellow sm" id="pRestart">重新開始</button>
    <button class="kg-btn blue sm" id="pMenu">回選單</button>
  </div>
</div></div>

<div id="resultOv" class="ov"><div class="card">
  <h2 id="rTitle">完成了！</h2>
  <div class="stars" id="rStars"></div>
  <p id="rMsg"></p>
  <div id="rNew"></div>
  <div class="btns"><button class="kg-btn green" id="rAgain">再玩一次</button><button class="kg-btn blue" id="rMenu">回選單</button></div>
</div></div>

<div id="stickerOv" class="ov"><div class="card" style="width:min(560px,100%)">
  <h2>我的貼紙簿</h2>
  <p id="stkCount" style="margin:0 0 6px"></p>
  <div class="stk-grid" id="stkGrid"></div>
  <h3>獎章</h3>
  <div class="stk-grid" id="badgeGrid"></div>
  <div class="btns"><button class="kg-btn blue sm" id="stkBack">返回</button></div>
</div></div>

<script src="../../assets/common.js"></script>
<script>
'use strict';
const SLUG = 'taiwan-map';
const cv = document.getElementById('game');
const ctx = cv.getContext('2d');
const TAU = Math.PI * 2;
const FONT = '"Baloo 2","PingFang TC","Noto Sans TC","Microsoft JhengHei","Heiti TC",system-ui,sans-serif';
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const $ = id => document.getElementById(id);
const Ease = {
  outCubic: t => 1 - Math.pow(1 - t, 3),
  inOutSine: t => -(Math.cos(Math.PI * t) - 1) / 2,
  outBack: t => { const c = 1.70158, c3 = c + 1; return 1 + c3 * Math.pow(t - 1, 3) + c * Math.pow(t - 1, 2); }
};
let tweens = [];
function tween(obj, to, dur, ease, delay, done) {
  const tw = { obj, to, from: null, dur: dur || 0.3, ease: Ease[ease] || Ease.outCubic, t: -(delay || 0), done };
  tweens.push(tw); return tw;
}
function killTweens(obj) { tweens = tweens.filter(t => t.obj !== obj); }
function updateTweens(dt) {
  if (!tweens.length) return;
  const list = tweens.slice();
  for (const tw of list) {
    tw.t += dt;
    if (tw.t < 0) continue;
    if (!tw.from) { tw.from = {}; for (const k in tw.to) tw.from[k] = tw.obj[k]; }
    const p = Math.min(1, tw.t / tw.dur), e = tw.ease(p);
    for (const k in tw.to) tw.obj[k] = tw.from[k] + (tw.to[k] - tw.from[k]) * e;
    if (p >= 1) { const i = tweens.indexOf(tw); if (i >= 0) tweens.splice(i, 1); if (tw.done) tw.done(); }
  }
}

  tyNtpC: [121.31, 25.135],

  khHlTt: [121.02, 23.35], cyTnKh: [120.58, 23.22], khTtPt: [120.84, 22.92]

// 邊界弧線：[起點, 中間點..., 終點]；起終點用共用頂點名稱，鄰居共用同一條弧線，所以一定密合
const GA = {
  // 海岸線（沿著本島順時針）
  c_nwt1: ['tyNtpC', [[121.37, 25.16], [121.41, 25.18], [121.45, 25.22], [121.50, 25.27], [121.54, 25.30], [121.58, 25.28], [121.64, 25.22]], 'ntpKlW'],

  // 陸上縣市界

/* ---------- 粒子（物件池） ---------- */

function layoutTray() {
  const t = LY.tray; if (!t) return;
  const slots = [];
  if (portrait) {
    const n = clamp(Math.floor((t.w - 8) / 86), 3, 6), sw = (t.w - 8) / n;
    for (let i = 0; i < n; i++) slots.push({ x: t.x + 4 + sw * i, y: t.y + 4, w: sw, h: t.h - 8 });
  } else {
    const cols = t.w >= 300 ? 3 : 2, sw = (t.w - 8) / cols;
    const rows = clamp(Math.floor((t.h - 8) / Math.min(sw, 118)), 1, 4), sh = (t.h - 8) / rows;
    for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++) slots.push({ x: t.x + 4 + c * sw, y: t.y + 4 + r * sh, w: sw, h: sh });
  }
  const old = pz.slots;
  pz.slots = slots.map(s => ({ ...s, id: null }));
  // 版面改變時，把原本托盤裡的片放回去
  const inTray = [];
  if (old) old.forEach(s => { if (s.id && pz.pieces[s.id] && pz.pieces[s.id].st === 'tray') inTray.push(s.id); });
  for (const id of IDS) { const p = pz.pieces[id]; if (p && p.st === 'tray' && inTray.indexOf(id) < 0) inTray.push(id); }
  inTray.forEach((id, i) => {
    if (i < pz.slots.length) { pz.slots[i].id = id; const p = pz.pieces[id]; p.slot = i; setTrayPos(p, true); }
    else { const p = pz.pieces[id]; p.st = 'queue'; p.slot = -1; pz.queue.unshift(id); }
  });

}
function slotScale(id, s) {
  const k = C[id], d = Math.max(k.bx[2] - k.bx[0], k.bx[3] - k.bx[1]) * S;

}
function setTrayPos(p, snap) {
  const s = pz.slots[p.slot]; if (!s) return;
  const tx = s.x + s.w / 2, ty = s.y + (s.h - 16) / 2, ts = slotScale(p.id, s);

}

function dropPiece(id, x, y) {

/** 點地圖：回傳點到的縣市（給目標縣市額外的寬容範圍） */
function resolveTap(x, y, prefer) {
  const [mx, my] = toMap(x, y);
  const R = 24;
  if (prefer) { const d = inCounty(prefer, mx, my) ? 0 : segDist(C[prefer].segs, mx, my) * S; if (d <= R) return prefer; }
  let best = null, bd = 1e9;
  for (const id of IDS) {
    if (inCounty(id, mx, my)) {
      // 被包住的小縣市（臺北市、嘉義市）優先
      return (id === 'nwt' && inCounty('tpe', mx, my)) ? 'tpe' : (id === 'cyq' && inCounty('cyi', mx, my)) ? 'cyi' : id;
    }
    const d = segDist(C[id].segs, mx, my) * S;

  }

  if (!id) { KG.sound('splash'); burst(x, y, 6, ['#ffffff', '#bfeaff'], 80); return null; }
  if (id === target) {
    const firstTry = fd.wrong === 0;
    if (firstTry) fd.first++;

    addSticker(id);

function makeQuestion(kind) {

  } else if (kind === 'adj') {

    q = { kind, x, text: '哪一個縣市和「' + C[x].name + '」連在一起（相鄰）？', ans: a, pool: IDS.filter(id => id !== x && TADJ[x].indexOf(id) < 0 && ISLANDS.indexOf(id) < 0) };

      const id = order[kbCursor];
      if (s === 'explore') selectCounty(id);
      else { const [x, y] = toScr(C[id].lab[0], C[id].lab[1]); findTap(x, y); }
    }
    return;
  }
  if (s === 'quiz') {
    const i = '1234'.indexOf(k);
    if (i >= 0) answerQuiz(i);
    else if (k === 'Enter' && qz.answered) nextQuestion();
  }
});

/* ---------- 按鈕 ---------- */
function openAct(a) {
  KG.sound('click');
  if (a === 'puzzle') openLevels(); else start(a, 1);
}
document.querySelectorAll('.act').forEach(b => b.addEventListener('click', () => openAct(b.dataset.act)));
function openLevels() {
  const st = getStars(), box = $('lvls'); box.innerHTML = '';
  LV.forEach((lv, i) => {
    const b = document.createElement('button'); b.className = 'lvl';
    const n = st['puzzle' + (i + 1)] || 0, bt = bestTime(i + 1);
    let stars = ''; for (let j = 0; j < 3; j++) stars += '<span style="display:inline-block;width:18px;height:18px">' + starSvg(j < n, j).replace('<svg ', '<svg style="width:18px;height:18px;animation:none" ') + '</span>';
    b.innerHTML = '<b>' + (i + 1) + '. ' + lv.name + '</b><small>' + lv.desc + '</small><span class="st">' + stars + '</span><span class="bt">' + (bt != null ? '最佳 ' + fmtTime(bt) : '') + '</span>';
    b.addEventListener('click', () => { KG.sound('click'); hideOv('levels'); start('puzzle', i + 1); });
    box.appendChild(b);
  });
  showOv('levels');
}
$('lvBack').addEventListener('click', () => { KG.sound('click'); hideOv('levels'); });
$('btnStickers').addEventListener('click', () => { KG.sound('click'); openStickers(); });
$('stkBack').addEventListener('click', () => { KG.sound('click'); hideOv('stickerOv'); });
$('pauseBtn').addEventListener('click', () => { KG.sound('click'); pause(); });
$('pResume').addEventListener('click', () => { KG.sound('click'); resume(); });
$('pRestart').addEventListener('click', () => { KG.sound('click'); hideOv('pauseOv'); restart(); });
$('pMenu').addEventListener('click', () => { KG.sound('click'); goTitle(); });
$('rAgain').addEventListener('click', () => { KG.sound('click'); hideOv('resultOv'); restart(); });
$('rMenu').addEventListener('click', () => { KG.sound('click'); goTitle(); });
$('sayBtn').addEventListener('click', () => { if (fd.list[fd.idx]) say(C[fd.list[fd.idx]].name + '在哪裡？'); });
$('hintBtn').addEventListener('click', () => {
  if (state.screen !== 'puzzle' || pz.done) return;
  KG.sound('sparkle');
  const id = (pz.drag && pz.drag.id) || (pz.slots.find(s => s.id) || {}).id;
  if (id) { pz.hintId = id; pz.hintT = 2.5; pz.hints++; if (pz.level === 4) pz.elapsed += 5; }
});
$('prevC').addEventListener('click', () => cycleCounty(-1));
$('nextC').addEventListener('click', () => cycleCounty(1));
document.querySelectorAll('canvas[data-ico]').forEach(c => iconCanvas(c, c.dataset.ico, c.closest('.rbtn') ? 30 : 46));

/* ---------- 視窗事件 ---------- */
let rzT = 0;
function onResize() { clearTimeout(rzT); rzT = setTimeout(layout, 60); }
window.addEventListener('resize', onResize);
window.addEventListener('orientationchange', onResize);
if (window.visualViewport) window.visualViewport.addEventListener('resize', onResize);
document.addEventListener('visibilitychange', () => { if (document.hidden) pause(); });

/* ---------- 測試用 ---------- */
function validate() {
  const got = computeAdjacency(), want = TADJ, missing = [], extra = [];
  for (const id of IDS) {
    for (const n of want[id]) if (got[id].indexOf(n) < 0 && id < n) missing.push(id + '-' + n);
    for (const n of got[id]) if (want[id].indexOf(n) < 0 && id < n) extra.push(id + '-' + n);
  }
  // 格點檢查：陸地上每一點都只屬於一個縣市
  let overlap = 0, gap = 0, land = 0;
  const step = 0.006;
  for (let y = 0; y < MH; y += step) for (let x = 0; x < MW; x += step) {
    if (!pipCtx.isPointInPath(LAND, x, y)) continue;
    land++;
    let n = 0; for (const id of IDS) if (inCounty(id, x, y)) n++;
    if (n > 1) overlap++; else if (n === 0) gap++;
  }
  return { adjOk: !missing.length && !extra.length, missing, extra, overlapPts: overlap, gapPts: gap, landPts: land };
}
function rasterCheck(px) {
  px = px || 300;
  const w = Math.ceil(MW * px), h = Math.ceil(MH * px);
  const a = document.createElement('canvas'); a.width = w; a.height = h;
  const b = document.createElement('canvas'); b.width = w; b.height = h;
  const ca = a.getContext('2d'), cb = b.getContext('2d');
  ca.setTransform(px, 0, 0, px, 0, 0); cb.setTransform(px, 0, 0, px, 0, 0);
  ca.fillStyle = '#fff'; ca.fill(LAND);
  cb.globalCompositeOperation = 'lighter'; cb.fillStyle = 'rgb(100,0,0)';
  for (const id of IDS) cb.fill(C[id].path, 'evenodd');
  const da = ca.getImageData(0, 0, w, h).data, db = cb.getImageData(0, 0, w, h).data;
  let landPx = 0, gapPx = 0, overlapPx = 0;
  for (let i = 0; i < da.length; i += 4) {
    if (da[i + 3] < 255) continue;
    landPx++;
    const r = db[i];
    if (r < 50) gapPx++;
    else if (r > 150) overlapPx++;
  }
  return { w, h, landPx, gapPx, overlapPx };
}
window.__tw2 = {
  ids: IDS.slice(),
  meta: id => ({ name: C[id].name, type: C[id].type }),
  state: () => ({
    screen: state.screen, act: state.act, level: state.level, paused: state.paused, portrait, S, W, H,
    placed: IDS.filter(id => pz.pieces[id] && pz.pieces[id].st === 'placed'),
    tray: pz.slots ? pz.slots.map(s => s.id) : [], drag: pz.drag ? pz.drag.id : null, mistakes: pz.mistakes, elapsed: pz.elapsed, done: pz.done,
    find: { target: fd.list[fd.idx], idx: fd.idx, first: fd.first, done: fd.done },
    explore: { sel: ex.sel },
    quiz: qz.q ? { idx: qz.idx, kind: qz.q.kind, text: qz.q.text, x: qz.q.x, ans: qz.q.ans, opts: qz.q.opts.slice(), answer: qz.q.answer, score: qz.score, answered: qz.answered } : null,
    result: $('resultOv').classList.contains('show')
  }),
  start: (a, l) => { hideOv('resultOv'); start(a, l); return true; },
  title: goTitle,
  target: id => { const [x, y] = pieceTarget(id); return { x: x + cvL, y: y + cvT }; },
  trayPos: id => { const p = pz.pieces[id]; return p && p.st === 'tray' ? { x: p.x + cvL, y: p.y + cvT } : null; },
  lift: type => lift(type || 'touch'),
  piecePos: id => { const p = pz.pieces[id]; return p ? { x: p.x + cvL, y: p.y + cvT, st: p.st } : null; },
  placePiece: (id, x, y) => { const p = pz.pieces[id]; if (!p || p.st === 'placed') return false; if (p.st === 'tray') { const s = pz.slots[p.slot]; if (s) s.id = null; } else if (p.st === 'queue') pz.queue.splice(pz.queue.indexOf(id), 1); p.st = 'drag'; p.slot = -1; return dropPiece(id, x - cvL, y - cvT); },
  solve: () => { for (const id of IDS) { const p = pz.pieces[id]; if (p.st !== 'placed') { const t = __tw2.target(id); __tw2.placePiece(id, t.x, t.y); } } },
  countyPoint: id => { const [x, y] = toScr(C[id].lab[0], C[id].lab[1]); return { x: x + cvL, y: y + cvT }; },
  tapCounty: id => { const [x, y] = toScr(C[id].lab[0], C[id].lab[1]); return mapTap(x, y); },
  tapAt: (x, y) => mapTap(x - cvL, y - cvT),
  answer: i => answerQuiz(i),
  next: () => nextQuestion(),
  adjacency: () => computeAdjacency(),
  trueAdjacency: () => trueAdjacency(),
  validate, rasterCheck,
  addTime: s => { pz.elapsed += s; }
};

goTitle();
requestAnimationFrame(frame);
</script>
