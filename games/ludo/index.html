<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>飛行棋</title>
<link rel="stylesheet" href="../../assets/common.css">
<style>
  html, body { height: 100%; overflow: hidden; background: #8fd3ff; overscroll-behavior: none; }
  #cv { position: fixed; inset: 0; display: block; width: 100vw; height: 100vh; height: 100dvh; touch-action: none; }
  #pauseBtn {
    position: fixed; top: 66px; right: 10px; z-index: 9200; width: 48px; height: 48px; border-radius: 50%;
    border: 3px solid #fff; background: linear-gradient(180deg, #fff 0%, #dff1ff 100%); box-shadow: var(--kg-shadow);
    display: none; align-items: center; justify-content: center; cursor: pointer; padding: 0; transition: transform .12s ease;
  }
  #pauseBtn:active { transform: scale(.9); }
  #pauseBtn i { display: block; width: 6px; height: 18px; margin: 0 3px; border-radius: 3px; background: #2f73b8; }
  #pauseBtn.on { display: flex; }

  #ui { position: fixed; inset: 0; z-index: 9000; pointer-events: none; }
  .scr { position: absolute; inset: 0; display: none; align-items: center; justify-content: center; padding: 66px 12px 12px; pointer-events: none; }
  .scr.on { display: flex; }
  .card {
    pointer-events: auto; width: min(470px, 100%); max-height: 100%; overflow-y: auto; -webkit-overflow-scrolling: touch; overscroll-behavior: contain;
    background: linear-gradient(180deg, #ffffff 0%, #eef8ff 100%); border: 5px solid #fff; border-radius: 28px;
    box-shadow: 0 18px 40px rgba(25, 80, 140, .35); padding: 16px 14px 18px; text-align: center; color: #2b4a6b;
    animation: kg-pop .35s cubic-bezier(.2, 1.6, .4, 1); touch-action: pan-y;
  }
  .card h2 { margin: 2px 0 10px; font-size: 27px; color: #23609e; letter-spacing: 2px; }
  .card h3 { margin: 14px 0 6px; font-size: 18px; color: #2f73b8; text-align: left; }
  .lbl { font-weight: 800; font-size: 17px; }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 8px 10px; margin: 9px 2px; flex-wrap: wrap; text-align: left; }
  .row .desc { display: block; font-size: 13px; font-weight: 600; color: #6a86a3; margin-top: 2px; }
  .seg { display: inline-flex; background: #dcedfb; border-radius: 999px; padding: 3px; gap: 2px; flex-wrap: nowrap; }
  .seg button { border: 0; background: transparent; font: 800 15px var(--kg-font); color: #4a6c8f; padding: 6px 11px; border-radius: 999px; cursor: pointer; min-height: 36px; white-space: nowrap; }
  .seg button.on { background: linear-gradient(180deg, #6cc2ff, #2e8be6); color: #fff; box-shadow: 0 3px 0 #1f64a8; }
  .btnrow { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-top: 14px; }
  .kg-btn.sm { font-size: 17px; padding: 10px 18px; }
  .prow {
    display: grid; grid-template-columns: 52px minmax(0, 1fr) auto; gap: 6px 8px; align-items: center; text-align: left;
    padding: 8px; border-radius: 20px; background: var(--pl); border: 3px solid var(--pc); margin: 8px 0;
  }
  .prow .pcol { width: 52px; height: 52px; border-radius: 50%; border: 3px solid #fff; background: var(--pc); padding: 0; grid-row: span 2; cursor: pointer; box-shadow: 0 3px 0 var(--pd); position: relative; }
  .prow .pcol canvas { width: 100%; height: 100%; display: block; border-radius: 50%; }
  .prow .pcol::after { content: '換色'; white-space: nowrap; position: absolute; left: 50%; bottom: -8px; transform: translateX(-50%); font: 800 10px var(--kg-font); color: #fff; background: var(--pd); border-radius: 8px; padding: 0 5px; }
  .prow input { width: 100%; min-width: 0; font: 800 17px var(--kg-font); border: 2px solid #fff; border-radius: 12px; padding: 6px 8px; background: #fff; color: #333; }
  .prow .rn { border: 0; border-radius: 12px; background: #fff; font: 800 14px var(--kg-font); color: var(--pd); padding: 8px 10px; cursor: pointer; min-height: 36px; }
  .prow .opts { grid-column: 2 / 4; display: flex; gap: 6px; flex-wrap: wrap; }
  .prow .seg { background: rgba(255,255,255,.7); }
  .prow .seg button { font-size: 14px; padding: 5px 8px; min-height: 32px; }
  .sticky { position: sticky; bottom: -18px; margin: 10px -14px -18px; padding: 10px 8px 14px; background: linear-gradient(180deg, rgba(238,248,255,0) 0%, #eef8ff 30%); }
  .tmenu { pointer-events: auto; display: flex; flex-direction: column; gap: 12px; align-items: center; animation: kg-pop .4s cubic-bezier(.2, 1.6, .4, 1); }
  .tmenu .kg-btn { min-width: 230px; }
  .tmenu .mini { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
  .chipbtn { border: 3px solid #fff; border-radius: 999px; background: rgba(255,255,255,.88); font: 800 15px var(--kg-font); color: #2f5f8f; padding: 7px 14px; cursor: pointer; box-shadow: 0 4px 0 rgba(30,80,140,.2); min-height: 40px; }
  .stat { background: rgba(255,255,255,.85); border-radius: 999px; padding: 5px 14px; font-weight: 800; font-size: 14px; color: #3d6a96; }
  #sTitle { align-items: flex-start; }
  #sOver { align-items: flex-end; padding-bottom: 18px; }
  @media (min-aspect-ratio: 13/10) { #sOver { align-items: center; justify-content: flex-end; padding: 60px 24px 12px; } #sOver .btnrow { flex-direction: column-reverse; } }
  #sOver .btnrow { pointer-events: auto; margin: 0; }
  .hitem { display: flex; gap: 10px; align-items: center; text-align: left; margin: 10px 0; padding: 8px; background: #fff; border-radius: 18px; box-shadow: 0 3px 0 #d3e7f7; }
  .hitem canvas { width: 128px; height: 84px; flex: 0 0 auto; border-radius: 12px; }
  .hitem b { color: #23609e; font-size: 16px; }
  .hitem p { margin: 2px 0 0; font-size: 14px; line-height: 1.45; color: #46627e; }
  @media (max-width: 360px) { .hitem canvas { width: 100px; height: 66px; } .seg button { padding: 6px 8px; font-size: 14px; } }
  @media (orientation: landscape) and (max-height: 540px) {
    .scr { padding: 8px 66px; }
    .tmenu { flex-direction: row; flex-wrap: wrap; justify-content: center; max-width: 560px; }
    .tmenu .kg-btn { min-width: 170px; }
    #sSetup .card { width: min(760px, 100%); }
    #plist { display: grid; grid-template-columns: 1fr 1fr; gap: 0 10px; }
    .prow { margin: 5px 0; }
  }
</style>
</head>
<body>
<canvas id="cv" aria-label="飛行棋遊戲畫面"></canvas>
<button id="pauseBtn" aria-label="暫停"><i></i><i></i></button>
<div id="ui">
  <div class="scr" id="sTitle">
    <div class="tmenu">
      <button class="kg-btn green" id="bPlay">開始遊戲</button>
      <button class="kg-btn blue sm" id="bHelp">遊戲說明</button>
      <button class="kg-btn yellow sm" id="bRules">規則設定</button>
      <div class="mini"><button class="chipbtn" id="tMusic1"></button><button class="chipbtn" id="tSfx1"></button></div>
      <div class="stat" id="statLine"></div>
    </div>
  </div>
  <div class="scr" id="sSetup">
    <div class="card">
      <h2>準備起飛</h2>
      <div class="row"><span class="lbl">玩家人數</span><div class="seg" id="segN"><button data-v="2">2 人</button><button data-v="3">3 人</button><button data-v="4">4 人</button></div></div>
      <div id="plist"></div>
      <div class="row"><span class="lbl">遊戲速度</span><div class="seg" id="segSpd"><button data-v="0">慢</button><button data-v="1">普通</button><button data-v="2">快</button></div></div>
      <div class="row"><span class="lbl">只有一步時自動走</span><div class="seg" id="segAuto"><button data-v="1">開</button><button data-v="0">關</button></div></div>
      <div class="btnrow sticky"><button class="kg-btn blue sm" id="bSetupBack">返回</button><button class="kg-btn green" id="bGo">出發！</button></div>
    </div>
  </div>
  <div class="scr" id="sRules">
    <div class="card">
      <h2>規則設定</h2>
      <div id="rlist"></div>
      <div class="btnrow"><button class="kg-btn yellow sm" id="bRulesReset">恢復預設</button><button class="kg-btn green sm" id="bRulesBack">完成</button></div>
    </div>
  </div>
  <div class="scr" id="sHelp">
    <div class="card">
      <h2>怎麼玩</h2>
      <div id="hlist"></div>
      <div class="btnrow"><button class="kg-btn green sm" id="bHelpBack">知道了！</button></div>
    </div>
  </div>
  <div class="scr" id="sPause">
    <div class="card">
      <h2>暫停一下</h2>
      <div class="row"><span class="lbl">音樂</span><div class="seg" id="segMusic"><button data-v="1">開</button><button data-v="0">關</button></div></div>
      <div class="row"><span class="lbl">音效</span><div class="seg" id="segSfx"><button data-v="1">開</button><button data-v="0">關</button></div></div>
      <div class="row"><span class="lbl">遊戲速度</span><div class="seg" id="segSpd2"><button data-v="0">慢</button><button data-v="1">普通</button><button data-v="2">快</button></div></div>
      <div class="row"><span class="lbl">只有一步時自動走</span><div class="seg" id="segAuto2"><button data-v="1">開</button><button data-v="0">關</button></div></div>
      <div class="btnrow">
        <button class="kg-btn green" id="bResume">繼續</button>
      </div>
      <div class="btnrow">
        <button class="kg-btn blue sm" id="bHelp2">遊戲說明</button>
        <button class="kg-btn yellow sm" id="bRestart">重新開始</button>
        <button class="kg-btn sm" id="bQuit">回主選單</button>
      </div>
    </div>
  </div>
  <div class="scr" id="sOver">
    <div class="btnrow"><button class="kg-btn blue sm" id="bMenu">主選單</button><button class="kg-btn green" id="bAgain">再玩一次</button></div>
  </div>
</div>
<script src="../../assets/common.js"></script>
<script src="../../assets/kg-music.js"></script>
<script>
'use strict';
/* =====================================================================
 * 飛行棋：2～4 人（可混搭真人與電腦），經典台灣／中國飛行棋規則。
 * 棋盤座標：15×15 格，(x, y) 以「格」為單位；格子 (c, r) 的中心是 (c+.5, r+.5)。
 * 座位（顏色）0 紅（左上）、1 黃（右上）、2 藍（右下）、3 綠（左下），順時針輪流。
 * 每架飛機的位置 k：-2 機場、-1 起飛點、0～50 外圈跑道、51～55 終點跑道、56 抵達終點。
 * ===================================================================== */
const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
const FONT = '"Baloo 2","PingFang TC","Noto Sans TC","Microsoft JhengHei","Heiti TC",system-ui,sans-serif';
const TAU = Math.PI * 2;
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const Ease = {
  outCubic: t => 1 - Math.pow(1 - t, 3),
  inOutSine: t => -(Math.cos(Math.PI * t) - 1) / 2,
  inOutCubic: t => t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2,
  outBack: t => { const c = 1.70158, c3 = c + 1; return 1 + c3 * Math.pow(t - 1, 3) + c * Math.pow(t - 1, 2); },
  outBounce: t => {
    const n = 7.5625, d = 2.75;
    if (t < 1 / d) return n * t * t;
    if (t < 2 / d) return n * (t -= 1.5 / d) * t + 0.75;
    if (t < 2.5 / d) return n * (t -= 2.25 / d) * t + 0.9375;
    return n * (t -= 2.625 / d) * t + 0.984375;
  }
};
let W = 360, H = 640, dpr = 1, U = 1, time = 0;

const COLORS = [
  { name: '紅', c: '#ff5b6e', d: '#d13650', l: '#ffd9df', dd: '#8f1f33', hi: '#ff9aa7' },
  { name: '黃', c: '#ffc431', d: '#db9300', l: '#fff1c4', dd: '#8a5c00', hi: '#ffe08a' },
  { name: '藍', c: '#3ea3ff', d: '#1f72c9', l: '#d4ebff', dd: '#174a85', hi: '#94cdff' },
  { name: '綠', c: '#3fcf77', d: '#21964f', l: '#d1f6de', dd: '#17633a', hi: '#93e8b3' }
];
const NAMES = ['小紅機長', '黃小鴨', '藍天鷹', '綠豆機師', '泡泡', '雲朵', '小星星', '噗噗', '咻咻', '阿飛', '小翅膀', '棉花糖',
  '跳跳', '嘟嘟', '胖胖鴿', '彩虹', '小火箭', '米粒', '布丁', '小海豚', '蜜蜂嗡', '果凍', '飛飛', '小風箏', '麻糬', '豆花'];
const LV_NAMES = ['簡單', '普通', '困難'];

/* ---------- 棋盤幾何 ---------- */
function rotC(c, r, n) { for (let i = 0; i < n; i++) { const t = c; c = 14 - r; r = t; } return [c, r]; }
function rotP(x, y, n) { for (let i = 0; i < n; i++) { const t = x; x = 15 - y; y = t; } return [x, y]; }
const Q0 = [[0, 6], [1, 6], [2, 6], [3, 6], [4, 6], [5, 6], [6, 5], [6, 4], [6, 3], [6, 2], [6, 1], [6, 0], [7, 0]];
const RING = [];
for (let q = 0; q < 4; q++) for (const [c, r] of Q0) RING.push(rotC(c, r, q));
const HOMEC = [0, 1, 2, 3].map(s => [1, 2, 3, 4, 5].map(c => rotC(c, 7, s)));
const START = [0, 1, 2, 3].map(s => 1 + 13 * s);
const FLY_FROM = 18, FLY_TO = 30, LAST = 50, FIN = 56;
const ownerOf = idx => ((idx % 4) + 1) % 4; // 這格是哪個顏色
const HANGAR0 = [[1.6, 1.6], [3.6, 1.6], [1.6, 3.6], [3.6, 3.6]];
const TAKEOFF0 = [0.55, 5.45];
const FINISH0 = [[6.42, 7.08], [6.42, 7.92], [6.92, 7.28], [6.92, 7.72]];

function absOf(s, k) { return (k >= 0 && k <= LAST) ? (START[s] + k) % 52 : -1; }
function isOwnCol(k) { return k >= 0 && k <= LAST && (k & 3) === 2; }
/** 位置 → 棋盤座標（格單位） */
function cellXY(s, k, i) {
  if (k === -2) return rotP(HANGAR0[i][0], HANGAR0[i][1], s);
  if (k === -1) return rotP(TAKEOFF0[0], TAKEOFF0[1], s);
  if (k >= 0 && k <= LAST) { const c = RING[absOf(s, k)]; return [c[0] + 0.5, c[1] + 0.5]; }
  if (k > LAST && k < FIN) { const c = HOMEC[s][k - 51]; return [c[0] + 0.5, c[1] + 0.5]; }
  return rotP(FINISH0[i || 0][0], FINISH0[i || 0][1], s);
}
function headingAt(s, k, i) {
  const [x, y] = cellXY(s, k, i);
  let nx, ny;
  if (k === -2 || k === FIN) { nx = 7.5; ny = 7.5; }
  else if (k === -1) [nx, ny] = cellXY(s, 0, 0);
  else if (k === 55) { nx = 7.5; ny = 7.5; }
  else [nx, ny] = cellXY(s, k + 1, 0);
  return Math.atan2(ny - y, nx - x);
}

/* ---------- 規則與設定 ---------- */
const DEF_RULES = { takeoff: '6', sixAgain: true, tripleSix: true, block: false, bounce: true, crossCapture: true, endMode: 'full' };
let R = Object.assign({}, DEF_RULES, KG.store.get('ludo:rules', {}));
const RULE_DEFS = [
  { key: 'takeoff', name: '起飛點數', desc: '擲到幾點可以從機場起飛', opts: [['6', '只有 6'], ['56', '5 或 6'], ['even', '雙數']] },
  { key: 'sixAgain', name: '擲到 6 再擲一次', desc: '6 點可以多擲一次骰子', opts: [[true, '開'], [false, '關']] },
  { key: 'tripleSix', name: '連續三個 6', desc: '連擲三次 6，剛剛走的飛機要回機場', opts: [[true, '開'], [false, '關']] },
  { key: 'block', name: '疊機擋路', desc: '同色兩架以上停在同一格，別人不能經過或停下', opts: [[true, '開'], [false, '關']] },
  { key: 'bounce', name: '終點反彈', desc: '點數超過終點時往回退（關：不能走）', opts: [[true, '開'], [false, '關']] },
  { key: 'crossCapture', name: '飛越擊落', desc: '沿虛線飛行時，擊落停在被穿越終點跑道上的對手', opts: [[true, '開'], [false, '關']] },
  { key: 'endMode', name: '比賽結束', desc: '第一名產生就結束，或排出所有名次', opts: [['full', '排完名次'], ['first', '第一名就結束']] }
];
const DEF_SETUP = {
  n: 2, speed: 1, auto: true,
  players: [{ color: 0, name: '小紅機長', ai: 0, lv: 1 }, { color: 2, name: '藍天鷹', ai: 1, lv: 1 },
    { color: 1, name: '黃小鴨', ai: 1, lv: 1 }, { color: 3, name: '綠豆機師', ai: 1, lv: 1 }]
};
let SETUP = (() => {
  const s = KG.store.get('ludo:setup', null);
  if (!s || !Array.isArray(s.players) || s.players.length !== 4) return JSON.parse(JSON.stringify(DEF_SETUP));
  const cols = s.players.map(p => p.color);
  if (new Set(cols).size !== 4) return JSON.parse(JSON.stringify(DEF_SETUP));
  return Object.assign(JSON.parse(JSON.stringify(DEF_SETUP)), s);
})();
let sfxOn = KG.store.get('ludo:sfx', true) !== false;
const SPEEDS = [1.45, 1, 0.55];
let STATS = Object.assign({ games: 0, wins: 0, caps: 0 }, KG.store.get('ludo:stats', {}));

/* =====================================================================
 * 規則引擎（純函式，給遊戲、電腦思考、快速模擬共用）
 * ===================================================================== */
function canTakeoff(roll, r) { return r.takeoff === '6' ? roll === 6 : r.takeoff === '56' ? roll >= 5 : roll % 2 === 0; }
function blockedFor(P, s, a) {
  for (let q = 0; q < 4; q++) {
    if (q === s || !P[q]) continue;
    let n = 0;
    for (let j = 0; j < 4; j++) if (absOf(q, P[q][j]) === a) n++;
    if (n >= 2) return true;
  }
  return false;
}
function captureAt(P, s, a, out) {
  for (let q = 0; q < 4; q++) {
    if (q === s || !P[q]) continue;
    for (let j = 0; j < 4; j++) if (absOf(q, P[q][j]) === a) { P[q][j] = -2; out.push([q, j]); }
  }
}
function cloneP(P) { return [P[0] && P[0].slice(), P[1] && P[1].slice(), P[2] && P[2].slice(), P[3] && P[3].slice()]; }
/** 模擬一步：回傳 null（不能走）或 { P, ev, vic, kind } */
function simMove(P, s, i, roll, r) {
  const k = P[s][i];
  if (k === FIN) return null;
  if (k === -2) {
    if (!canTakeoff(roll, r)) return null;
    const Q = cloneP(P); Q[s][i] = -1;
    return { P: Q, ev: [{ t: 'takeoff' }], vic: [], s, i, to: -1 };
  }
  const path = [];
  let bounced = -1;
  if (k === -1) { for (let x = 0; x < roll; x++) path.push(x); }
  else {
    const t = k + roll;
    if (t > FIN) {
      if (!r.bounce) return null;
      for (let x = k + 1; x <= FIN; x++) path.push(x);
      bounced = path.length;
      for (let x = 1; x <= t - FIN; x++) path.push(FIN - x);
    } else for (let x = k + 1; x <= t; x++) path.push(x);
  }
  if (r.block) for (const x of path) if (x <= LAST && blockedFor(P, s, absOf(s, x))) return null;
  const Q = cloneP(P), ev = [], vic = [];
  path.forEach((x, n) => { if (n === bounced) ev.push({ t: 'bounce' }); ev.push({ t: 'hop', k: x }); });
  let land = path[path.length - 1];
  Q[s][i] = land;
  if (land === FIN) { ev.push({ t: 'home' }); return { P: Q, ev, vic, s, i, to: land }; }
  if (land <= LAST) {
    const cap = (at) => { const v = []; captureAt(Q, s, absOf(s, at), v); if (v.length) { ev.push({ t: 'cap', v, k: at }); vic.push(...v); } };
    const fly = () => {
      if (r.block && blockedFor(Q, s, absOf(s, FLY_TO))) return false;
      const cross = [];
      const o = (s + 2) % 4;
      if (r.crossCapture && Q[o]) for (let j = 0; j < 4; j++) if (Q[o][j] === 55) { Q[o][j] = -2; cross.push([o, j]); }
      ev.push({ t: 'fly', from: FLY_FROM, to: FLY_TO, cross });
      vic.push(...cross);
      Q[s][i] = land = FLY_TO; cap(FLY_TO);
      return true;
    };
    const jump = (from) => {
      const to = from + 4;
      if (r.block && blockedFor(Q, s, absOf(s, to))) return false;
      ev.push({ t: 'jump', from, to });
      Q[s][i] = land = to; cap(to);
      return true;
    };
    cap(land);
    if (isOwnCol(land) && land !== LAST) {
      if (land === FLY_FROM) { if (fly()) jump(FLY_TO); }
      else if (jump(land) && land === FLY_FROM) fly();
    }
  }
  return { P: Q, ev, vic, s, i, to: Q[s][i] };
}
function legalMoves(P, s, roll, r) {
  const out = [];
  for (let i = 0; i < 4; i++) { const res = simMove(P, s, i, roll, r); if (res) out.push({ i, res }); }
  return out;
}

/* ---------- 電腦思考 ---------- */

/* ---------- 暫停 ---------- */
function togglePause() {
  if (phase !== 'play') return;
  G.paused = !G.paused;
  if (G.paused) { KG.music.pause(); refreshToggles(); showScreen('sPause'); sfx('back'); }
  else { KG.music.resume(); showScreen(null); sfx('select'); }
}
$('pauseBtn').onclick = () => togglePause();
$('bResume').onclick = () => togglePause();
$('bHelp2').onclick = () => { sfx('ui'); openHelp('sPause'); };
$('bRestart').onclick = () => { sfx('select'); KG.music.resume(); newGame(); };
$('bQuit').onclick = () => { sfx('back'); KG.music.resume(); goTitle(); };
$('bAgain').onclick = () => { sfx('select'); newGame(); };
$('bMenu').onclick = () => { sfx('back'); goTitle(); };

/* =====================================================================
 * 測試用掛勾
 * ===================================================================== */
window.__ludo = {
  get G() { return G; }, get phase() { return phase; }, get R() { return R; }, get L() { return L; },
  setRules(o) { Object.assign(R, o); },
  setup(o) { Object.assign(SETUP, o); },
  start() { newGame(); },
  forceDice(...v) { G.forced.push(...v); },
  turbo(on) { G.turbo = !!on; },
  roll() { doRoll(); },
  choose(n) { if (G.st === 'choose') execMove(G.moves[n]); },
  setPos(s, arr) { G.P[s] = arr.slice(); for (let i = 0; i < 4; i++) { const [x, y] = cellXY(s, arr[i], i); VIS[s][i].x = x; VIS[s][i].y = y; } },
  sim: simMove, legal: (P, s, r) => legalMoves(P, s, r, R), cellXY, absOf,
  pause: togglePause,
  bench(n, lvA, lvB, seats) {
    // 兩種電腦等級對打 n 局，回傳 A 的勝率
    seats = seats || [0, 2];
    let winA = 0;
    for (let g = 0; g < n; g++) {
      const P = [null, null, null, null], pl = [];
      seats.forEach((s, j) => { P[s] = [-2, -2, -2, -2]; pl[s] = { lv: j === 0 ? lvA : lvB }; });
      const first = seats[g % seats.length];
      const order = headlessFinish(P, first, pl, Object.assign({}, R, { endMode: 'full' }), []);
      if (order[0] === seats[0]) winA++;
    }
    return winA / n;
  }
};

/* ---------- 開始 ---------- */
resize();
resetVis();
goTitle();
requestAnimationFrame(t => { lastT = t; frame(t); });
