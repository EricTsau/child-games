<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>尋寶找找看</title>
<link rel="stylesheet" href="../../assets/common.css">
<style>
html,body{height:100%;overflow:hidden;background:#fdf1dc;overscroll-behavior:none}
body{font-family:"PingFang TC","Noto Sans TC","Microsoft JhengHei","Heiti TC",system-ui,sans-serif;color:#4a3b52}
#stage{position:fixed;inset:0;overflow:hidden;background:#f3e2c4}
.pane{position:absolute;overflow:hidden;background:#e9d6b4;border-radius:14px;display:none}
.pane canvas{position:absolute;left:0;top:0;transform-origin:0 0;will-change:transform;opacity:0;transition:opacity .35s}
.pane canvas.on{opacity:1}
#ov,#ui{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block}#ui{pointer-events:none}
.scr{position:fixed;inset:0;z-index:100;display:flex;flex-direction:column;align-items:center;overflow:hidden}
.hide{display:none!important}
#title{background:radial-gradient(ellipse at 50% 30%,#fff7e3 0%,#ffe2b0 60%,#f7c98a 100%)}
#tcv{position:absolute;inset:0;width:100%;height:100%;opacity:0;transition:opacity .6s}
#tcv.on{opacity:1}
.tbox{position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(6px,1.6vh,14px);height:100%;width:100%;padding:64px 16px 14px}
.logo{display:flex;align-items:center;gap:8px}
.logo h1{margin:0;font-size:clamp(34px,8.6vmin,64px);font-weight:900;letter-spacing:2px;color:#ff7a45;-webkit-text-stroke:2px #fff;paint-order:stroke fill;text-shadow:0 4px 0 #b9532a,0 8px 16px rgba(120,60,20,.35);white-space:nowrap}
.logo h1 span{display:inline-block;animation:bob 2.4s ease-in-out infinite}
.logo h1 span:nth-child(2){animation-delay:.15s;color:#3fb27f}.logo h1 span:nth-child(3){animation-delay:.3s;color:#4e9cff}
.logo h1 span:nth-child(4){animation-delay:.45s;color:#ffb21e}.logo h1 span:nth-child(5){animation-delay:.6s;color:#c06cf0}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
#mascot{width:clamp(70px,15vmin,120px);height:clamp(70px,15vmin,120px);animation:peek 3s ease-in-out infinite}
@keyframes peek{0%,100%{transform:rotate(-6deg)}50%{transform:rotate(6deg) translateY(-4px)}}
.sub{margin:0;font-size:clamp(14px,2.4vmin,19px);font-weight:800;color:#8a5a2b;background:rgba(255,255,255,.75);padding:4px 14px;border-radius:99px}
.modes{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;width:min(560px,100%)}
.mb{border:0;border-radius:20px;padding:10px 10px 10px 8px;display:flex;align-items:center;gap:8px;font:inherit;font-weight:900;font-size:clamp(16px,2.9vmin,22px);color:#fff;cursor:pointer;text-align:left;box-shadow:0 5px 0 rgba(0,0,0,.18),0 8px 16px rgba(80,40,0,.18);transition:transform .1s;min-height:58px}
.mb:active{transform:translateY(3px)}
.mb canvas{width:42px;height:42px;flex:none;background:rgba(255,255,255,.85);border-radius:14px}
.mb small{display:block;font-size:12px;font-weight:700;opacity:.92}
.m1{background:linear-gradient(#ff9a6b,#f0663a)}.m2{background:linear-gradient(#5fd0a0,#2fa774)}.m3{background:linear-gradient(#7fb6ff,#4a7fe8)}.m4{background:linear-gradient(#ffcd57,#f0a21e)}
.tg{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.tb{border:2px solid #fff;background:rgba(255,255,255,.85);color:#6b4a2b;border-radius:99px;padding:6px 12px;font:inherit;font-weight:800;font-size:14px;cursor:pointer;min-height:36px}
.tb.off{color:#a99;background:rgba(240,230,220,.85)}
.info{font-size:13px;font-weight:800;color:#8a5a2b;min-height:18px;text-align:center}
#map{background:linear-gradient(#ffe9c6,#ffd49a)}
.mhead{flex:none;width:100%;display:flex;align-items:center;justify-content:center;padding:14px 64px 6px;min-height:64px}
.mhead h2{margin:0;font-size:clamp(20px,4vmin,28px);font-weight:900;color:#8a4a1b}
.mbody{flex:1;overflow-y:auto;width:100%;padding:6px 14px 16px;-webkit-overflow-scrolling:touch}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;max-width:980px;margin:0 auto}
.card{position:relative;border:0;background:#fff;border-radius:18px;padding:8px;display:flex;flex-direction:column;align-items:center;gap:2px;font:inherit;cursor:pointer;box-shadow:0 4px 0 rgba(150,90,30,.25);color:#5a3b1b}
.card canvas{width:72px;height:72px}
.card b{font-size:17px}.card i{font-style:normal;font-size:16px;color:#f5a623;letter-spacing:2px}
.card.lock{opacity:.55;filter:grayscale(.8)}
.card.lock::after{content:"🔒";position:absolute;top:6px;right:8px;font-size:18px}
.card .n{position:absolute;top:6px;left:9px;font-weight:900;color:#c9a57a;font-size:14px}
.mfoot{flex:none;padding:8px 0 14px}
#modal{position:fixed;inset:0;z-index:200;display:flex;align-items:center;justify-content:center;background:rgba(60,35,20,.45);padding:64px 16px 16px}
.box{background:#fffaf0;border-radius:24px;padding:16px 18px;width:min(420px,100%);max-height:100%;display:flex;flex-direction:column;align-items:center;gap:8px;box-shadow:0 10px 0 rgba(120,70,20,.25);text-align:center;animation:pop .3s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{from{transform:scale(.7);opacity:0}to{transform:scale(1);opacity:1}}
.box h3{margin:0;font-size:24px;font-weight:900;color:#e0682e}
.box p{margin:0;font-weight:700;color:#6b4a2b;font-size:16px;line-height:1.45}
.box .scroll{overflow-y:auto;width:100%;display:flex;flex-direction:column;align-items:center;gap:8px;min-height:0}
.box canvas.pic{width:96px;height:96px}
.stars{font-size:44px;letter-spacing:4px;height:54px;color:#e7dccb}
.stars span{display:inline-block;transform:scale(0);transition:transform .35s cubic-bezier(.2,1.8,.4,1),color .2s}
.stars span.on{transform:scale(1)}.stars span.got{color:#ffc21e;text-shadow:0 3px 0 #d58a00}
.btns{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;flex:none;padding-top:4px}
.btns .kg-btn{font-size:18px;padding:10px 20px}
.stat{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.stat div{background:#fff1d6;border-radius:12px;padding:4px 10px;font-weight:800;color:#8a5a2b;font-size:15px}
@media (max-height:520px){#modal{padding:8px 16px}.box{padding:10px 14px;gap:5px}.box canvas.pic{display:none}.box h3{font-size:20px}.stars{font-size:32px;height:40px}.box p{font-size:14px}.btns .kg-btn{font-size:16px;padding:8px 16px}}
.newrec{color:#fff;background:#ff6f61;border-radius:99px;padding:2px 12px;font-weight:900;font-size:14px}
</style>
</head>

<div id="stage">
  <div class="pane" id="paneA"><canvas id="scA"></canvas></div>
  <div class="pane" id="paneB"><canvas id="scB"></canvas></div>
  <canvas id="ui"></canvas>
  <canvas id="ov" aria-label="尋寶找找看遊戲畫面"></canvas>
</div>
<section id="title" class="scr">
  <canvas id="tcv"></canvas>
  <div class="tbox">
    <div class="logo"><canvas id="mascot" width="240" height="240"></canvas><h1><span>尋</span><span>寶</span><span>找</span><span>找</span><span>看</span></h1></div>
    <p class="sub">東西藏在哪裡？拿起放大鏡一起找！</p>
    <div class="modes">
      <button class="mb m1" data-mode="story"><canvas data-ic="magnifier"></canvas><span>故事模式<small>十個地方闖關</small></span></button>
      <button class="mb m2" data-mode="time"><canvas data-ic="alarm"></canvas><span>限時挑戰<small>時間內找越多越好</small></span></button>
      <button class="mb m3" data-mode="diff"><canvas data-ic="glasses"></canvas><span>找不同<small>兩張圖找出 7 處</small></span></button>
      <button class="mb m4" data-mode="daily"><canvas data-ic="trophy"></canvas><span>每日場景<small id="dailyInfo">每天一個新挑戰</small></span></button>
    </div>
    <div class="tg">
      <button class="tb" id="tMusic">音樂 開</button>
      <button class="tb" id="tSfx">音效 開</button>
      <button class="tb" id="tList">清單 圖示</button>
      <button class="tb" id="tVoice">語音 開</button>
    </div>
    <div class="info" id="tInfo"></div>
  </div>
</section>
<section id="map" class="scr hide">
  <div class="mhead"><h2 id="mapTitle">故事模式</h2></div>
  <div class="mbody"><div class="grid" id="mapGrid"></div></div>
  <div class="mfoot"><button class="kg-btn blue" id="mapBack">回標題</button></div>
</section>
<div id="modal" class="hide"><div class="box" id="mbox"></div></div>
<script src="../../assets/common.js"></script>

  gen: (si, asp) => { const t0 = performance.now(); const d = genScene(si, 12345, asp || 0.6, AREA, 12, false); return { ms: +(performance.now() - t0).toFixed(1), items: d.items.length, targets: d.targets.length, minVis: Math.min(...d.targets.map(t => t.vis)) }; },
  pause: p => (p ? setPaused(true) : resume()),
  time: s => { GS.limit = s; },
  bench: n => { const f = FLY[0]; f.on = true; f.d = OB.teddy; f.it = GS.data.targets[0]; f.x0 = 100; f.y0 = 300; f.x1 = 300; f.y1 = 700; f.s0 = 40; f.s1 = 50; f.r0 = 0.2; f.t = 0.3; burst(200, 400, 14); showLabel('泰迪熊！', 200, 300, '#3fb26a'); const t0 = performance.now(); let mx = 0; for (let i = 0; i < n; i++) { const a = performance.now(); f.t = 0.2 + (i % 40) / 80; render(false, 0); mx = Math.max(mx, performance.now() - a); } const fx = (performance.now() - t0) / n; const t1 = performance.now(); for (let i = 0; i < 20; i++) render(true, 0); const full = (performance.now() - t1) / 20; const t2 = performance.now(); for (let i = 0; i < 20; i++) render(false, 1 | 4); const part = (performance.now() - t2) / 20; f.on = false; return { fx: +fx.toFixed(2), fxMax: +mx.toFixed(1), fullUI: +full.toFixed(2), hudCells: +part.toFixed(2) }; },
  sc: () => ({ Rs: SC.Rs, w: cvA.width, h: cvA.height, jobs: SC.jobs.length, slow: SC.slow.splice(0) })
};
window.__hsPools = { P_MISC, P_NMFOOD, P_NMHANG, P_NMGAME, P_NMGROUND, P_PRODUCE, P_MKBACK, P_MKHANG, P_MKGROUND, P_TPHANG, P_TPBACK, P_TPFRONT, P_TPYARD, P_STSHELF, P_STFRIDGE, P_STFLOOR, P_CLDESK, P_CLTRAY, P_CLFLOOR, P_CLBACK, P_LVCAB, P_LVWALL, P_LVSOFA, P_LVFLOOR, P_BCSKY, P_BCSEA, P_BCSAND, P_ZOSKY, P_ZOPEN, P_ZOPATH, P_ZOGRASS, P_LBSHELF, P_LBTABLE, P_LBFLOOR, P_TYHANG, P_TYSHELF, P_TYFLOOR };
})();
