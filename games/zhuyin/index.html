<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>注音小學堂</title>
<link rel="stylesheet" href="../../assets/common.css">
<style>
  /* ===== 遊戲共用 UI 套件（標題、關卡、結算、特效） ===== */
  :root { --k-main: #ff7eb0; --k-dark: #7a2f57; --k-light: #fff0f6; --k-accent: #ffd34d; }
  .kit-hidden-defs { position: absolute; width: 0; height: 0; overflow: hidden; }
  .kit-title {
    position: fixed; inset: 0; z-index: 8900; display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: clamp(4px, 1.6vh, 16px); padding: 64px 16px max(18px, env(safe-area-inset-bottom)); overflow: hidden;
    transition: opacity .35s ease, transform .35s ease;
  }
  .kit-title.out, .kit-screen.out { opacity: 0; transform: scale(1.06); pointer-events: none; }
  .kit-tdeco { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
  .kit-logo { position: relative; animation: kit-drop .9s cubic-bezier(.2,1.6,.4,1) both; }
  .kit-logo-svg { display: block; width: min(92vw, 600px, 75vh); height: auto; overflow: visible; filter: drop-shadow(0 8px 10px rgba(0,0,0,.18)); }
  .kit-logo-svg text { font-family: var(--kg-font); }
  .kit-lc { animation: kit-lc 2.4s ease-in-out infinite; }
  @keyframes kit-lc { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-7px); } }
  @keyframes kit-drop { from { transform: translateY(-50px) scale(.6); opacity: 0; } to { transform: none; opacity: 1; } }
  .kit-hero { position: relative; width: min(72vw, 40vh, 330px); aspect-ratio: 1; display: grid; place-items: center; animation: kit-drop 1s .15s cubic-bezier(.2,1.6,.4,1) both; }
  .kit-hero > svg, .kit-hero > canvas { width: 100%; height: 100%; overflow: visible; display: block; }
  .kit-tbtns { display: flex; gap: 14px; flex-wrap: wrap; justify-content: center; animation: kit-drop 1s .3s cubic-bezier(.2,1.6,.4,1) both; }
  .kit-tsub { font-size: 17px; font-weight: 800; color: var(--k-dark); background: rgba(255,255,255,.8); border-radius: 999px; padding: 6px 16px; text-align: center; max-width: 92vw; animation: kit-drop 1s .4s both; }
  .kit-bigbtn {
    font-family: var(--kg-font); font-weight: 900; font-size: clamp(24px, 6.5vw, 32px); color: #fff; letter-spacing: 2px;
    border: 5px solid #fff; border-radius: 999px; padding: 10px 32px 10px 18px; min-height: 72px;
    display: inline-flex; align-items: center; gap: 8px; cursor: pointer; position: relative;
    background: linear-gradient(180deg, #8ff0a4 0%, #3fbf63 55%, #2fa552 100%);
    box-shadow: 0 8px 0 #22803f, 0 14px 24px rgba(20,90,40,.35), inset 0 4px 0 rgba(255,255,255,.55);
    text-shadow: 0 3px 0 rgba(0,0,0,.22); animation: kit-pulse 1.6s ease-in-out infinite;
  }
  .kit-bigbtn svg { width: 40px; height: 40px; flex: 0 0 auto; filter: drop-shadow(0 3px 0 rgba(0,0,0,.18)); }
  .kit-bigbtn:active { transform: translateY(6px) scale(.97); box-shadow: 0 2px 0 #22803f, 0 4px 8px rgba(20,90,40,.35); animation: none; }
  .kit-bigbtn.alt { background: linear-gradient(180deg, #a6dcff 0%, #3a9ee8 60%, #2f86cc 100%); box-shadow: 0 8px 0 #2268a3, 0 14px 24px rgba(30,80,140,.35), inset 0 4px 0 rgba(255,255,255,.55); animation-delay: .4s; }
  .kit-bigbtn.alt:active { box-shadow: 0 2px 0 #2268a3; }
  .kit-bigbtn.pink { background: linear-gradient(180deg, #ffb3d1 0%, #ff6fa5 60%, #e8558d 100%); box-shadow: 0 8px 0 #b83a6c, 0 14px 24px rgba(160,40,90,.35), inset 0 4px 0 rgba(255,255,255,.55); }
  .kit-bigbtn.pink:active { box-shadow: 0 2px 0 #b83a6c; }
  .kit-bigbtn.small { font-size: 22px; min-height: 60px; padding: 8px 24px 8px 14px; }
  .kit-bigbtn.small svg { width: 30px; height: 30px; }
  @keyframes kit-pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.05); } }

  /* 關卡選擇 */
  .kit-screen {
    position: fixed; inset: 0; z-index: 8900; overflow-y: auto; overflow-x: hidden; -webkit-overflow-scrolling: touch;
    padding: 70px 14px max(20px, env(safe-area-inset-bottom)); display: flex; flex-direction: column; align-items: center;
    transition: opacity .3s ease, transform .3s ease; touch-action: pan-y;
  }
  .kit-banner {
    position: relative; display: inline-block; color: #fff; font-size: clamp(24px, 6.5vw, 32px); font-weight: 900; letter-spacing: 2px;
    padding: 8px 34px; border-radius: 16px; border: 4px solid #fff; background: linear-gradient(180deg, var(--k-main), var(--k-dark));
    box-shadow: 0 6px 0 rgba(0,0,0,.18), 0 10px 18px rgba(0,0,0,.18); text-shadow: 0 3px 0 rgba(0,0,0,.25); animation: kit-drop .6s both cubic-bezier(.2,1.6,.4,1);
  }
  .kit-banner::before, .kit-banner::after { content: ''; position: absolute; top: 14px; width: 26px; height: 100%; background: var(--k-dark); z-index: -1; border-radius: 4px; }
  .kit-banner::before { left: -18px; clip-path: polygon(0 0, 100% 0, 100% 100%, 0 100%, 40% 50%); }
  .kit-banner::after { right: -18px; clip-path: polygon(0 0, 100% 0, 60% 50%, 100% 100%, 0 100%); }
  .kit-total { margin-top: 10px; display: inline-flex; align-items: center; gap: 6px; font-size: 20px; font-weight: 900; color: var(--k-dark);
    background: rgba(255,255,255,.9); border: 3px solid #fff; border-radius: 999px; padding: 3px 14px 3px 6px; box-shadow: 0 4px 0 rgba(0,0,0,.12); }
  .kit-total svg { width: 30px; height: 30px; }
  .kit-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 14px; width: min(640px, 100%); margin: 16px auto 8px; }
  .kit-lv {
    position: relative; aspect-ratio: 1 / 1.08; border-radius: 26px; border: 5px solid #fff; cursor: pointer; font-family: var(--kg-font);
    background: linear-gradient(180deg, #fff 0%, var(--k-light) 100%); color: var(--k-dark);
    box-shadow: 0 7px 0 rgba(0,0,0,.13), 0 12px 20px rgba(0,0,0,.12);
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; padding: 4px;
    animation: kit-drop .5s both cubic-bezier(.2,1.6,.4,1); transition: transform .12s;
  }
  .kit-lv:active { transform: scale(.93); }
  .kit-lv .num {
    width: 58%; aspect-ratio: 1; border-radius: 50%; display: grid; place-items: center; font-size: clamp(26px, 7vw, 36px); font-weight: 900; color: #fff;
    background: radial-gradient(circle at 35% 28%, rgba(255,255,255,.7) 0 12%, transparent 13%), linear-gradient(180deg, var(--k-main), var(--k-dark));
    box-shadow: inset 0 -5px 0 rgba(0,0,0,.15), 0 4px 0 rgba(0,0,0,.12); text-shadow: 0 3px 0 rgba(0,0,0,.25);
  }
  .kit-lv .lname { font-size: 13px; font-weight: 800; line-height: 1.1; text-align: center; max-width: 100%; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  .kit-lv .stars { display: flex; gap: 1px; }
  .kit-lv .stars svg { width: 22px; height: 22px; }
  .kit-lv.locked { background: linear-gradient(180deg, #f2eef6, #ddd6e6); cursor: default; }
  .kit-lv.locked .num { background: linear-gradient(180deg, #cfc6da, #a99dba); }
  .kit-lv .lock { position: absolute; width: 46%; top: 16%; left: 27%; }
  .kit-lv.locked .num span { opacity: 0; }
  .kit-lv.next::after { content: ''; position: absolute; inset: -9px; border-radius: 30px; border: 4px solid var(--k-accent); animation: kit-ring 1.2s ease-in-out infinite; pointer-events: none; }
  @keyframes kit-ring { 0%, 100% { transform: scale(1); opacity: 1; } 50% { transform: scale(1.06); opacity: .5; } }
  .kit-extra { width: min(640px, 100%); }
  .kit-shelf-title { font-size: 18px; font-weight: 900; color: var(--k-dark); margin: 10px 0 6px; text-align: center; }
  .kit-shelf { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }
  .kit-item { width: 84px; border-radius: 20px; border: 4px solid #fff; background: rgba(255,255,255,.85); box-shadow: 0 5px 0 rgba(0,0,0,.12);
    display: flex; flex-direction: column; align-items: center; padding: 4px 2px; font-size: 12px; font-weight: 800; color: var(--k-dark); cursor: pointer; font-family: var(--kg-font); position: relative; }
  .kit-item svg.pv { width: 62px; height: 62px; }
  .kit-item.sel { border-color: var(--k-accent); box-shadow: 0 0 0 3px var(--k-main), 0 5px 0 rgba(0,0,0,.12); }
  .kit-item.locked { filter: grayscale(1); opacity: .6; cursor: default; }
  .kit-item .need { display: flex; align-items: center; gap: 2px; }
  .kit-item .need svg { width: 14px; height: 14px; }

  /* 結算卡 */
  .kit-ov { position: fixed; inset: 0; z-index: 9200; display: grid; place-items: center; padding: 16px; background: rgba(60,40,80,.5); backdrop-filter: blur(3px); animation: kg-fade .25s ease; overflow-y: auto; }
  .kit-rcard {
    position: relative; width: min(420px, 100%); margin-top: 30px; text-align: center; color: var(--k-dark);
    background: linear-gradient(180deg, #fff 0%, var(--k-light) 100%); border: 6px solid #fff; border-radius: 34px; padding: 50px 18px 20px;
    box-shadow: 0 10px 0 rgba(0,0,0,.12), 0 24px 44px rgba(40,20,60,.35); animation: kit-cardin .6s cubic-bezier(.2,1.5,.4,1) both;
  }
  @keyframes kit-cardin { from { transform: translateY(60px) scale(.6); opacity: 0; } to { transform: none; opacity: 1; } }
  .kit-ribbon { position: absolute; left: 50%; top: -34px; transform: translateX(-50%); width: 112%; max-width: 440px; }
  .kit-ribbon svg { width: 100%; height: auto; display: block; overflow: visible; }
  .kit-ribbon svg text { font-family: var(--kg-font); }
  .kit-rstars { display: flex; justify-content: center; align-items: flex-end; gap: 4px; margin: 0 0 6px; }
  .kit-rstar { position: relative; width: 74px; height: 74px; }
  .kit-rstar.mid { width: 96px; height: 96px; margin-bottom: 14px; }
  .kit-rstar svg { position: absolute; inset: 0; width: 100%; height: 100%; }
  .kit-rstar .on { transform: scale(0); }
  .kit-rstar.lit .on { animation: kit-starin .55s cubic-bezier(.2,1.8,.4,1) forwards; }
  @keyframes kit-starin { 0% { transform: scale(0) rotate(-90deg); } 100% { transform: scale(1) rotate(0); } }
  .kit-rhero { width: 120px; height: 120px; margin: -6px auto 2px; }
  .kit-rhero svg { width: 100%; height: 100%; overflow: visible; }
  .kit-rmsg { font-size: 19px; font-weight: 800; line-height: 1.45; margin: 4px 0 12px; }
  .kit-unlock { display: flex; align-items: center; gap: 10px; text-align: left; margin: 0 auto 14px; padding: 8px 12px; border-radius: 20px; border: 3px dashed var(--k-main);
    background: #fff; font-weight: 900; font-size: 17px; animation: kit-drop .6s 1.2s both cubic-bezier(.2,1.6,.4,1); max-width: 340px; }
  .kit-unlock .ic { width: 58px; height: 58px; flex: 0 0 auto; }
  .kit-unlock .ic svg { width: 100%; height: 100%; }
  .kit-rbtns { display: flex; justify-content: center; gap: 14px; flex-wrap: wrap; }
  .kit-rbtn { font-family: var(--kg-font); display: flex; flex-direction: column; align-items: center; gap: 4px; background: none; border: none; cursor: pointer; font-size: 15px; font-weight: 900; color: var(--k-dark); padding: 0; }
  .kit-rbtn .b { width: 70px; height: 70px; border-radius: 50%; border: 4px solid #fff; display: grid; place-items: center; transition: transform .1s; }
  .kit-rbtn .b svg { width: 38px; height: 38px; }
  .kit-rbtn:active .b { transform: translateY(4px) scale(.95); }
  .kit-rbtn.g .b { background: linear-gradient(180deg, #8ff0a4, #34b45a); box-shadow: 0 6px 0 #22803f, 0 10px 16px rgba(0,0,0,.2); }
  .kit-rbtn.y .b { background: linear-gradient(180deg, #ffe58a, #f2a91f); box-shadow: 0 6px 0 #b9790c, 0 10px 16px rgba(0,0,0,.2); }
  .kit-rbtn.b2 .b { background: linear-gradient(180deg, #a6dcff, #3a9ee8); box-shadow: 0 6px 0 #2268a3, 0 10px 16px rgba(0,0,0,.2); }
  .kit-rbtn.big .b { width: 84px; height: 84px; animation: kit-pulse 1.4s ease-in-out infinite; }

  /* HUD */
  .kit-hud { position: fixed; top: 10px; left: 50%; transform: translateX(-50%); z-index: 8000; display: flex; gap: 8px; pointer-events: none; max-width: calc(100vw - 136px); }
  .kit-chip {
    height: 48px; display: inline-flex; align-items: center; gap: 4px; padding: 0 14px 0 6px; border-radius: 999px; white-space: nowrap;
    background: var(--chip-bg, linear-gradient(180deg, #fff, #ffeef6)); border: 4px solid var(--chip-border, #fff); color: var(--k-dark);
    box-shadow: 0 5px 0 rgba(0,0,0,.15), 0 8px 14px rgba(0,0,0,.12); font-size: 20px; font-weight: 900;
  }
  .kit-chip svg { width: 32px; height: 32px; flex: 0 0 auto; }
  .kit-chip.bump { animation: kit-bump .4s cubic-bezier(.2,1.8,.4,1); }
  @keyframes kit-bump { 0% { transform: scale(1); } 40% { transform: scale(1.25); } 100% { transform: scale(1); } }
  .kit-prog { width: 74px; height: 16px; border-radius: 99px; background: rgba(0,0,0,.12); overflow: hidden; box-shadow: inset 0 2px 3px rgba(0,0,0,.15); }
  .kit-prog i { display: block; height: 100%; width: 0; border-radius: 99px; background: linear-gradient(180deg, #ffe680, #ffb21f); box-shadow: inset 0 3px 0 rgba(255,255,255,.5); transition: width .4s cubic-bezier(.2,1.4,.4,1); }

  /* 特效 */
  .kit-fx { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 9250; }
  .kit-float {
    position: fixed; z-index: 9260; pointer-events: none; font-weight: 900; font-size: 30px; color: var(--c, #fff); white-space: nowrap;
    text-shadow: 3px 0 0 var(--o, #6b3a8a), -3px 0 0 var(--o, #6b3a8a), 0 3px 0 var(--o, #6b3a8a), 0 -3px 0 var(--o, #6b3a8a), 2px 2px 0 var(--o, #6b3a8a), -2px 2px 0 var(--o, #6b3a8a), 2px -2px 0 var(--o, #6b3a8a), -2px -2px 0 var(--o, #6b3a8a), 0 6px 0 rgba(0,0,0,.2);
    animation: kit-float 1s ease-out forwards;
  }
  @keyframes kit-float { 0% { transform: translate(-50%, -50%) scale(.4); opacity: 0; } 20% { transform: translate(-50%, -80%) scale(1.25); opacity: 1; } 100% { transform: translate(-50%, -200%) scale(1); opacity: 0; } }
  .kit-callout {
    position: fixed; left: 50%; top: 38%; z-index: 9260; pointer-events: none; white-space: nowrap; letter-spacing: 3px;
    font-size: clamp(40px, 11vw, 74px); font-weight: 900; color: var(--c, #ffd23f);
    text-shadow: 4px 0 0 #fff, -4px 0 0 #fff, 0 4px 0 #fff, 0 -4px 0 #fff, 3px 3px 0 #fff, -3px 3px 0 #fff, 3px -3px 0 #fff, -3px -3px 0 #fff, 0 9px 0 var(--o, #7a2f57), 0 14px 18px rgba(0,0,0,.25);
    animation: kit-callout 1.3s forwards;
  }
  @keyframes kit-callout {
    0% { transform: translate(-50%, -50%) scale(.2) rotate(-12deg); opacity: 0; }
    22% { transform: translate(-50%, -50%) scale(1.18) rotate(3deg); opacity: 1; }
    38% { transform: translate(-50%, -50%) scale(1) rotate(-2deg); }
    80% { opacity: 1; transform: translate(-50%, -55%) scale(1) rotate(0); }
    100% { transform: translate(-50%, -90%) scale(.9); opacity: 0; }
  }
  @media (prefers-reduced-motion: reduce) { .kit-lc, .kit-bigbtn, .kit-rbtn.big .b { animation: none; } }
  .kit-ov { display: flex; flex-direction: column; align-items: center; }
  .kit-ov > * { margin: auto; }
  @media (min-height: 500px) and (max-width: 600px) { body .kit-ov { padding-top: 70px; } }
  @media (max-width: 360px) { .kit-prog { width: 46px; } .kit-chip { font-size: 18px; padding: 0 10px 0 4px; } .kit-chip svg { width: 28px; height: 28px; } .kit-rbtns { gap: 8px; } }
  @media (max-height: 600px) {
    .kit-rhero { display: none; } .kit-rcard { padding: 40px 14px 14px; margin-top: 34px; } .kit-rstar { width: 56px; height: 56px; } .kit-rstar.mid { width: 72px; height: 72px; margin-bottom: 8px; }
    .kit-rmsg { font-size: 15px; line-height: 1.3; margin: 0 0 6px; } .kit-unlock { margin-bottom: 8px; padding: 2px 10px; font-size: 14px; } .kit-unlock .ic { width: 40px; height: 40px; }
    .kit-ov { padding: 8px 16px; } .kit-rstars { margin: 0; } .kit-ribbon { max-width: 360px; top: -28px; }
    .kit-rbtn .b { width: 54px; height: 54px; } .kit-rbtn.big .b { width: 62px; height: 62px; } .kit-rbtn .b svg { width: 30px; height: 30px; } .kit-rbtn { font-size: 13px; }
    .pz-card .ow { width: 70px; height: 70px; } .pz-card { padding: 10px 16px 14px; }
  }

  /* ===== 注音小學堂 ===== */
  :root {
    --k-main: #36b3a0; --k-dark: #1e6c63; --k-light: #e8fbf5; --k-accent: #ffb84d;
    --zy-font: "BiauKai", "DFKai-SB", "標楷體", "TW-Kai", "Kaiti TC", "STKaiti", "PingFang TC", "Noto Sans TC", "Noto Sans CJK TC", "Microsoft JhengHei", "WenQuanYi Zen Hei", "Heiti TC", sans-serif;
    --g0: #e8558d; --g0l: #fff0f5; --g1: #2f86d8; --g1l: #eaf5ff; --g2: #2e9a55; --g2l: #eafaee; --ink: #24524b;
  }
  html, body { height: 100%; overflow: hidden; }
  body { background: #dff5ee; }
  .g0 { --gc: var(--g0); --gl: var(--g0l); } .g1 { --gc: var(--g1); --gl: var(--g1l); } .g2 { --gc: var(--g2); --gl: var(--g2l); }
  #bg { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; }
  #bg .cl { animation: cl 64s linear infinite; }
  #bg .cl.b { animation-duration: 86s; animation-delay: -40s; }
  #bg .fl { font-family: var(--zy-font); animation: fl 7s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
  #bg .fl:nth-of-type(2n) { animation-duration: 9s; animation-delay: -3s; }
  #bg .fl:nth-of-type(3n) { animation-duration: 11s; animation-delay: -5s; }
  @keyframes cl { from { transform: translateX(-350px); } to { transform: translateX(1150px); } }
  @keyframes fl { 0%, 100% { transform: translateY(0) rotate(-6deg); } 50% { transform: translateY(-22px) rotate(6deg); } }

  #app {
    position: fixed; inset: 0; height: 100vh; height: 100dvh; display: grid; gap: 8px;
    padding: 66px max(10px, env(safe-area-inset-right)) max(10px, env(safe-area-inset-bottom)) max(10px, env(safe-area-inset-left));
    grid-template-columns: minmax(0, 1fr);
    grid-template-rows: auto minmax(0, 1fr) auto;
    grid-template-areas: "prompt" "stage" "opts";
    touch-action: none;
  }
  #app.land {
    padding-right: max(66px, env(safe-area-inset-right)); padding-top: 62px;
    grid-template-columns: minmax(0, 1fr) minmax(280px, 44%);
    grid-template-rows: minmax(0, 1fr) auto auto minmax(0, 1fr);
    grid-template-areas: "stage ." "stage prompt" "stage opts" "stage .";
    column-gap: 14px;
  }
  #prompt { grid-area: prompt; display: flex; align-items: center; gap: 4px; margin-right: 54px; min-height: 64px; }
  #app.land #prompt { margin-right: 0; align-self: end; }
  #tch { width: 72px; height: 72px; flex: 0 0 auto; position: relative; cursor: pointer; }
  #tch svg { width: 100%; height: 100%; overflow: visible; display: block; }
  #bubble {
    position: relative; flex: 1 1 auto; min-width: 0; background: #fff; border: 4px solid #fff; border-radius: 22px; padding: 7px 10px 7px 12px;
    box-shadow: 0 5px 0 rgba(30,108,99,.16), 0 8px 16px rgba(30,108,99,.14); color: var(--ink); font-weight: 900; font-size: clamp(17px, 4.6vw, 22px); line-height: 1.3;
    display: flex; align-items: center; gap: 8px; animation: bubIn .45s cubic-bezier(.2,1.6,.4,1);
  }
  #bubble::before { content: ''; position: absolute; left: -14px; top: 50%; margin-top: -10px; border: 10px solid transparent; border-right: 12px solid #fff; border-left: 0; }
  #bubble .txt { flex: 1 1 auto; min-width: 0; }
  #bubble .tg { display: inline-block; padding: 0 7px; border-radius: 10px; background: #e3f7f1; color: #1e6c63; white-space: nowrap; }
  #bubble .zb { font-family: var(--zy-font); font-weight: 400; font-size: 1.25em; color: var(--gc, #1e6c63); line-height: 1; padding: 0 2px; }
  #bubble .nov { display: inline-block; font-size: 12px; font-weight: 800; color: #9a8a7a; background: #f4efe8; border-radius: 8px; padding: 0 6px; margin-left: 4px; vertical-align: middle; }
  @keyframes bubIn { from { transform: scale(.7); opacity: 0; } to { transform: none; opacity: 1; } }
  #sayBtn { width: 44px; height: 44px; flex: 0 0 auto; border-radius: 50%; border: 3px solid #fff; cursor: pointer; padding: 7px;
    background: linear-gradient(180deg, #a6dcff, #3a9ee8); box-shadow: 0 4px 0 #2268a3; }
  #sayBtn:active { transform: translateY(3px); box-shadow: 0 1px 0 #2268a3; }
  #sayBtn svg { width: 100%; height: 100%; display: block; }

  #stage { grid-area: stage; position: relative; min-height: 0; min-width: 0; display: grid; place-items: center; touch-action: none; }
  #stage.pop .fcard, #stage.pop canvas { animation: stPop .55s cubic-bezier(.2,1.6,.4,1); }
  #stage.no .fcard, #stage.no canvas { animation: stNo .45s ease; }

  /* 卡片 */

  .glyph { font-family: var(--zy-font); font-size: calc(var(--u) * .6); line-height: 1; color: var(--gc, var(--ink)); text-shadow: 0 .03em 0 rgba(0,0,0,.1); cursor: pointer; }

  .gtag { position: absolute; top: 8px; left: 10px; font-size: 15px; font-weight: 900; color: #fff; background: var(--gc, #36b3a0); border-radius: 99px; padding: 2px 10px; box-shadow: 0 3px 0 rgba(0,0,0,.12); }
  .cnum { position: absolute; top: 8px; right: 10px; font-size: 14px; font-weight: 900; color: #6d8f88; background: rgba(255,255,255,.85); border-radius: 99px; padding: 2px 9px; }

    box-shadow: 0 7px 0 #2268a3, 0 12px 20px rgba(30,80,140,.3); animation: spkPulse 1.6s ease-in-out infinite; }

  /* 拼音格子 */

  .plus { font-size: calc(var(--sl) * .36); color: #9bbab4; font-weight: 900; }

  .spword { display: flex; align-items: center; gap: 4px; }

  /* 選項 */
  #opts { grid-area: opts; display: grid; gap: 10px; grid-template-columns: repeat(var(--n, 3), minmax(0, 1fr)); width: min(620px, 100%); justify-self: center; align-self: center; }
  #app.land #opts { align-self: start; width: 100%; }
  .opt {
    font-family: var(--kg-font); position: relative; cursor: pointer; border: 5px solid #fff; border-radius: 22px; padding: 4px; min-height: 80px;
    background: linear-gradient(180deg, #fff 0%, #effaf6 100%); color: var(--ink); box-shadow: 0 6px 0 rgba(30,108,99,.2), 0 10px 16px rgba(30,108,99,.14);
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 0; animation: optIn .45s cubic-bezier(.2,1.6,.4,1) both; transition: transform .1s;
  }

  .opt .ct { width: 58px; height: 24px; }

  .opt .key { position: absolute; top: 3px; left: 8px; font-size: 12px; font-weight: 900; color: #a9cbc4; }
  .opt.ok { border-color: #46b864; background: linear-gradient(180deg, #eaffef, #c9f5d4); animation: okPop .5s cubic-bezier(.2,1.8,.4,1); }
  .opt.bad { border-color: #ffc4c4; background: linear-gradient(180deg, #f4eeee, #e9e1e1); box-shadow: 0 3px 0 rgba(30,108,99,.12); animation: badShake .4s ease; }
  .opt.bad .zg, .opt.bad .tm, .opt.bad .lb { color: #c3b3b3; } .opt.bad .ct { opacity: .35; }
  .opt.hint { border-color: #ffd34d; animation: hintGlow 1s ease-in-out infinite; }
  @keyframes hintGlow { 0%, 100% { box-shadow: 0 6px 0 rgba(30,108,99,.2), 0 0 0 0 rgba(255,211,77,.9); } 50% { box-shadow: 0 6px 0 rgba(30,108,99,.2), 0 0 0 10px rgba(255,211,77,0); transform: scale(1.05); } }
  @keyframes optIn { from { transform: translateY(30px) scale(.7); opacity: 0; } to { transform: none; opacity: 1; } }
  @keyframes okPop { 0% { transform: scale(1); } 40% { transform: scale(1.12); } 100% { transform: scale(1); } }
  @keyframes badShake { 0%, 100% { transform: none; } 25% { transform: translateX(-8px) rotate(-3deg); } 75% { transform: translateX(8px) rotate(3deg); } }
  .navb { font-family: var(--kg-font); font-weight: 900; font-size: 20px; color: #fff; cursor: pointer; min-height: 64px; border: 5px solid #fff; border-radius: 999px;
    background: linear-gradient(180deg, #8ff0a4 0%, #3fbf63 55%, #2fa552 100%); box-shadow: 0 7px 0 #22803f, 0 12px 20px rgba(20,90,40,.3), inset 0 4px 0 rgba(255,255,255,.5);
    text-shadow: 0 2px 0 rgba(0,0,0,.2); display: flex; align-items: center; justify-content: center; gap: 4px; padding: 0 8px; white-space: nowrap; animation: optIn .45s cubic-bezier(.2,1.6,.4,1) both; }

  .navb.blue:active { box-shadow: 0 2px 0 #2268a3; }
  .navb.yel { background: linear-gradient(180deg, #ffe58a, #f2a91f); box-shadow: 0 7px 0 #b9790c, 0 12px 20px rgba(150,100,10,.3), inset 0 4px 0 rgba(255,255,255,.5); }
  .navb.yel:active { box-shadow: 0 2px 0 #b9790c; }

  .navb.go { animation: optIn .45s cubic-bezier(.2,1.6,.4,1) both, kit-pulse 1.4s 0.5s ease-in-out infinite; }

  /* 描寫畫布 */

  /* 活動選單 */

    background: linear-gradient(180deg, #fff 0%, var(--c2, #e8fbf5) 100%); box-shadow: 0 7px 0 rgba(0,0,0,.13), 0 12px 20px rgba(0,0,0,.12);

  /* 注音表、家長頁 */

  .chb { font-family: var(--kg-font); border: 4px solid #fff; border-radius: 18px; background: linear-gradient(180deg, #fff, var(--gl)); box-shadow: 0 4px 0 rgba(0,0,0,.1); cursor: pointer;
    display: flex; flex-direction: column; align-items: center; padding: 2px 2px 4px; position: relative; }

  .chb .w { font-size: 12px; font-weight: 900; color: #5f7d77; }

<script>
/* ===== 遊戲共用 UI 套件 Kit：標題畫面、關卡選擇、結算、圖示、特效、背景音樂 ===== */
const Kit = (function () {
  'use strict';
  /* ---------- 緩動函式 ---------- */
  const E = {
    linear: t => t,
    outQuad: t => 1 - (1 - t) * (1 - t),
    outCubic: t => 1 - Math.pow(1 - t, 3),
    inOut: t => (t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2),
    outBack: t => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); },
    outElastic: t => (t === 0 ? 0 : t === 1 ? 1 : Math.pow(2, -10 * t) * Math.sin((t * 10 - 0.75) * (2 * Math.PI / 3)) + 1),
    outBounce: t => {
      const n1 = 7.5625, d1 = 2.75;
      if (t < 1 / d1) return n1 * t * t;
      if (t < 2 / d1) return n1 * (t -= 1.5 / d1) * t + 0.75;
      if (t < 2.5 / d1) return n1 * (t -= 2.25 / d1) * t + 0.9375;
      return n1 * (t -= 2.625 / d1) * t + 0.984375;
    }
  };
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const lerp = (a, b, t) => a + (b - a) * t;

  /* ---------- 顏色小工具 ---------- */
  function hex2rgb(h) { h = h.replace('#', ''); if (h.length === 3) h = h.split('').map(c => c + c).join(''); const n = parseInt(h, 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; }
  function rgb2hex(r) { return '#' + r.map(v => clamp(Math.round(v), 0, 255).toString(16).padStart(2, '0')).join(''); }
  function mix(a, b, t) { const A = hex2rgb(a), B = hex2rgb(b); return rgb2hex(A.map((v, i) => lerp(v, B[i], t))); }
  const lighten = (c, t) => mix(c, '#ffffff', t);
  const darken = (c, t) => mix(c, '#000000', t);

  /* ---------- 共用 SVG 漸層 ---------- */
  function ensureDefs() {
    if (document.getElementById('kitDefs')) return;
    const d = document.createElement('div');
    d.className = 'kit-hidden-defs';
    d.innerHTML = `<svg id="kitDefs" width="0" height="0" aria-hidden="true"><defs>
      <linearGradient id="kitStarG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff38a"/><stop offset=".55" stop-color="#ffd02e"/><stop offset="1" stop-color="#ff9f1a"/></linearGradient>
      <linearGradient id="kitLockG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffe27a"/><stop offset="1" stop-color="#e9a628"/></linearGradient>
      <linearGradient id="kitGiftG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ff9ccc"/><stop offset="1" stop-color="#e8558d"/></linearGradient>
      <linearGradient id="kitRibbonG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--k-main)"/><stop offset="1" stop-color="var(--k-dark)"/></linearGradient>
    </defs></svg>`;
    document.body.appendChild(d);
  }

  /* ---------- 圖示（全部手繪向量） ---------- */
  const STAR_D = 'M50 7 C53 7 55 9 56 12 L64 31 L85 33 C91 34 93 41 89 45 L73 59 L78 80 C79 86 73 90 68 87 L50 76 L32 87 C27 90 21 86 22 80 L27 59 L11 45 C7 41 9 34 15 33 L36 31 L44 12 C45 9 47 7 50 7 Z';
  const ICON = {
    star: (on = true) => `<svg viewBox="0 0 100 100"><path d="${STAR_D}" transform="translate(0 4)" fill="${on ? '#d9800b' : '#b9afc6'}" opacity=".55"/><path d="${STAR_D}" fill="${on ? 'url(#kitStarG)' : '#e3dcea'}" stroke="${on ? '#c46f00' : '#b4aac2'}" stroke-width="5" stroke-linejoin="round"/>${on ? '<path d="M36 34 Q44 22 54 26" stroke="#fff" stroke-width="7" fill="none" stroke-linecap="round" opacity=".85"/><circle cx="66" cy="44" r="4" fill="#fff" opacity=".7"/>' : ''}</svg>`,
    lock: () => '<svg viewBox="0 0 100 100" class="lock"><path d="M31 46 V33 a19 19 0 0 1 38 0 V46" fill="none" stroke="#8a7a99" stroke-width="11" stroke-linecap="round"/><rect x="18" y="42" width="64" height="48" rx="14" fill="url(#kitLockG)" stroke="#a46f12" stroke-width="5"/><rect x="26" y="48" width="48" height="8" rx="4" fill="#fff" opacity=".45"/><circle cx="50" cy="64" r="7" fill="#8a5a0a"/><rect x="47" y="66" width="6" height="13" rx="3" fill="#8a5a0a"/></svg>',
    play: () => '<svg viewBox="0 0 100 100"><path d="M34 20 Q30 18 30 24 V76 Q30 82 35 79 L80 54 Q85 50 80 46 Z" fill="#fff" stroke="#fff" stroke-width="6" stroke-linejoin="round"/></svg>',
    replay: () => '<svg viewBox="0 0 100 100"><path d="M74 58 A26 26 0 1 1 66 31" fill="none" stroke="#fff" stroke-width="12" stroke-linecap="round"/><path d="M56 16 L80 26 L62 44 Z" fill="#fff" stroke="#fff" stroke-width="6" stroke-linejoin="round"/></svg>',
    next: () => '<svg viewBox="0 0 100 100"><path d="M22 50 H70 M50 28 L74 50 L50 72" stroke="#fff" stroke-width="13" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>',
    back: () => '<svg viewBox="0 0 100 100"><path d="M78 50 H30 M50 28 L26 50 L50 72" stroke="#fff" stroke-width="13" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>',
    menu: () => '<svg viewBox="0 0 100 100"><g fill="#fff"><rect x="18" y="18" width="27" height="27" rx="8"/><rect x="55" y="18" width="27" height="27" rx="8"/><rect x="18" y="55" width="27" height="27" rx="8"/><rect x="55" y="55" width="27" height="27" rx="8"/></g></svg>',
    gift: () => '<svg viewBox="0 0 100 100"><path d="M50 30 C40 10 20 16 28 28 C32 33 44 32 50 30 C56 32 68 33 72 28 C80 16 60 10 50 30 Z" fill="#ffd34d" stroke="#c48a12" stroke-width="4" stroke-linejoin="round"/><rect x="14" y="30" width="72" height="20" rx="6" fill="url(#kitGiftG)" stroke="#a83a6a" stroke-width="4"/><rect x="20" y="48" width="60" height="40" rx="6" fill="url(#kitGiftG)" stroke="#a83a6a" stroke-width="4"/><rect x="44" y="30" width="12" height="58" fill="#ffd34d" stroke="#c48a12" stroke-width="3"/><rect x="24" y="52" width="10" height="20" rx="4" fill="#fff" opacity=".4"/></svg>',
    note: () => '<svg viewBox="0 0 100 100"><path d="M40 70 V24 L78 16 V60" fill="none" stroke="#fff" stroke-width="9" stroke-linejoin="round"/><ellipse cx="32" cy="72" rx="12" ry="9" fill="#fff"/><ellipse cx="70" cy="62" rx="12" ry="9" fill="#fff"/></svg>'
  };
  const starRow = (n, total = 3) => { let s = ''; for (let i = 0; i < total; i++) s += ICON.star(i < n); return s; };

  /* ---------- 標誌文字（每個字分開彈跳） ---------- */
  function logoSVG(text, colors, stroke) {
    const ch = Array.from(text);
    const step = 92, W = ch.length * step + 40;
    let s = `<svg class="kit-logo-svg" viewBox="0 0 ${W} 150" aria-label="${text}"><defs>`;
    colors.forEach((c, i) => {
      s += `<linearGradient id="kitLg${i}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${lighten(c, 0.55)}"/><stop offset=".5" stop-color="${lighten(c, 0.15)}"/><stop offset="1" stop-color="${c}"/></linearGradient>`;
    });
    s += '</defs>';
    ch.forEach((c, i) => {
      const x = 20 + i * step + step / 2, rot = (i % 2 ? 5 : -5);
      s += `<g class="kit-lc" style="animation-delay:${(i * 0.13).toFixed(2)}s"><g transform="rotate(${rot} ${x} 95)">` +
        `<text x="${x}" y="124" text-anchor="middle" font-size="90" font-weight="900" fill="${stroke}" stroke="${stroke}" stroke-width="24" stroke-linejoin="round">${c}</text>` +
        `<text x="${x}" y="114" text-anchor="middle" font-size="90" font-weight="900" fill="#fff" stroke="#fff" stroke-width="22" stroke-linejoin="round">${c}</text>` +
        `<text x="${x}" y="114" text-anchor="middle" font-size="90" font-weight="900" fill="url(#kitLg${i % colors.length})" stroke="${stroke}" stroke-width="7" stroke-linejoin="round" paint-order="stroke">${c}</text>` +
        `</g></g>`;
    });
    return s + '</svg>';
  }

  /* ---------- 背景音樂（用 KG.note 合成） ---------- */
  const Music = (function () {
    let timer = null, step = 0, song = null;
    const mf = m => 440 * Math.pow(2, (m - 69) / 12);
    function tick() {
      if (!song) return;
      const dur = 60 / song.bpm / 2;
      if (!KG.isMuted() && !document.hidden) {
        const m = song.mel[step % song.mel.length];
        if (m) KG.note(mf(m), dur * 1.5, song.wave || 'triangle', song.vol || 0.045);
        if (song.bass && step % 2 === 0) {
          const b = song.bass[(step / 2 | 0) % song.bass.length];
          if (b) KG.note(mf(b), dur * 1.9, 'sine', (song.vol || 0.045) * 1.4);
        }
        if (song.tick && step % 4 === 2) KG.note(2200, 0.03, 'square', 0.012);
      }
      step++;
      timer = setTimeout(tick, dur * 1000);
    }
    return {
      start(s) { this.stop(); song = s; step = 0; timer = setTimeout(tick, 80); },
      stop() { clearTimeout(timer); timer = null; song = null; },
      get playing() { return !!song; }
    };
  })();
  // 幾首可愛的旋律（MIDI 音高，0 = 休止，每格 = 八分音符）
  const SONGS = {
    happy: { bpm: 112, mel: [72, 0, 76, 79, 81, 79, 76, 0, 74, 0, 77, 81, 79, 0, 0, 0, 72, 74, 76, 79, 77, 76, 74, 0, 72, 0, 67, 0, 72, 0, 0, 0], bass: [48, 55, 53, 55, 48, 55, 43, 48], tick: true },
    bouncy: { bpm: 120, mel: [67, 72, 76, 72, 79, 0, 76, 0, 74, 77, 81, 77, 79, 0, 0, 0, 76, 79, 84, 79, 81, 79, 76, 0, 74, 76, 72, 0, 72, 0, 0, 0], bass: [48, 52, 53, 55, 48, 52, 50, 48], tick: true },
    gentle: { bpm: 92, mel: [76, 0, 79, 0, 84, 0, 83, 81, 79, 0, 76, 0, 77, 0, 0, 0, 74, 0, 77, 0, 81, 0, 79, 77, 76, 0, 72, 0, 74, 0, 0, 0], bass: [48, 55, 53, 50, 48, 52, 53, 55], wave: 'sine', vol: 0.05 },
    march: { bpm: 126, mel: [72, 72, 79, 79, 81, 81, 79, 0, 77, 77, 76, 76, 74, 74, 72, 0, 79, 79, 77, 77, 76, 76, 74, 0, 79, 79, 77, 77, 76, 76, 74, 0], bass: [48, 53, 48, 43, 48, 53, 55, 48], tick: true }
  };
  document.addEventListener('visibilitychange', () => { /* tick 內會檢查 document.hidden */ });

  /* ---------- 粒子特效（全螢幕畫布） ---------- */
  const FX = (function () {
    let cv = null, c = null, parts = [], running = false, last = 0;
    const DEF = ['#ff7eb0', '#ffd34d', '#7bd88f', '#6cc4ff', '#b49cff', '#ffa94d'];
    function ensure() {
      if (cv) return;
      cv = document.createElement('canvas');
      cv.className = 'kit-fx';
      document.body.appendChild(cv);
      resize();
      window.addEventListener('resize', resize);
    }
    function resize() {
      const d = window.devicePixelRatio || 1;
      cv.width = innerWidth * d; cv.height = innerHeight * d;
      c = cv.getContext('2d');
      c.setTransform(d, 0, 0, d, 0, 0);
    }
    function starPath(ctx, r) {
      ctx.beginPath();
      for (let i = 0; i < 10; i++) {
        const a = -Math.PI / 2 + i * Math.PI / 5, rr = i % 2 ? r * 0.45 : r;
        ctx.lineTo(Math.cos(a) * rr, Math.sin(a) * rr);
      }
      ctx.closePath();
    }
    function heartPath(ctx, r) {
      ctx.beginPath();
      ctx.moveTo(0, r * 0.9);
      ctx.bezierCurveTo(-r * 1.4, -r * 0.1, -r * 0.7, -r * 1.2, 0, -r * 0.45);
      ctx.bezierCurveTo(r * 0.7, -r * 1.2, r * 1.4, -r * 0.1, 0, r * 0.9);
      ctx.closePath();
    }
    function sparkPath(ctx, r) {
      ctx.beginPath();
      ctx.moveTo(0, -r); ctx.quadraticCurveTo(0, 0, r, 0); ctx.quadraticCurveTo(0, 0, 0, r);
      ctx.quadraticCurveTo(0, 0, -r, 0); ctx.quadraticCurveTo(0, 0, 0, -r); ctx.closePath();
    }
    function draw(ctx, p) {
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(p.rot);
      const s = p.size * (p.grow ? (1 + (1 - p.life) * 1.5) : (0.4 + p.life * 0.6));
      ctx.globalAlpha = Math.min(1, p.life * 1.6);
      ctx.fillStyle = p.color;
      if (p.type === 'star') { starPath(ctx, s); ctx.fill(); ctx.lineWidth = 2; ctx.strokeStyle = 'rgba(255,255,255,.8)'; ctx.stroke(); }
      else if (p.type === 'heart') { heartPath(ctx, s); ctx.fill(); }
      else if (p.type === 'spark') { sparkPath(ctx, s * 1.3); ctx.fill(); }
      else if (p.type === 'ring') { ctx.beginPath(); ctx.arc(0, 0, s, 0, Math.PI * 2); ctx.lineWidth = 4 * p.life; ctx.strokeStyle = p.color; ctx.stroke(); }
      else if (p.type === 'confetti') { ctx.fillRect(-s, -s * 0.5, s * 2, s); }
      else {
        ctx.beginPath(); ctx.arc(0, 0, s, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = 'rgba(255,255,255,.6)'; ctx.beginPath(); ctx.arc(-s * 0.3, -s * 0.3, s * 0.35, 0, Math.PI * 2); ctx.fill();
      }
      ctx.restore();
    }
    function loop(now) {
      const dt = Math.max(0, Math.min(0.05, (now - last) / 1000));
      last = now;
      c.clearRect(0, 0, innerWidth, innerHeight);
      for (let i = parts.length - 1; i >= 0; i--) {
        const p = parts[i];
        p.vy += p.g * dt; p.vx *= Math.pow(p.drag, dt); p.vy *= Math.pow(p.drag, dt);
        p.x += p.vx * dt; p.y += p.vy * dt; p.rot += p.vr * dt;
        p.life -= p.decay * dt;
        if (p.life <= 0) { parts.splice(i, 1); continue; }
        draw(c, p);
      }
      if (parts.length) requestAnimationFrame(loop);
      else { running = false; c.clearRect(0, 0, innerWidth, innerHeight); }
    }
    function burst(x, y, o) {
      o = o || {};
      ensure();
      const n = o.n || 14;
      for (let i = 0; i < n; i++) {
        const a = o.angle != null ? o.angle + KG.rand(-o.spread, o.spread) : Math.random() * Math.PI * 2;
        const sp = KG.rand(o.speed ? o.speed * 0.5 : 120, o.speed || 360);
        const types = o.types || ['star', 'circle', 'heart', 'spark'];
        parts.push({
          x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - (o.up || 80),
          g: o.gravity != null ? o.gravity : 500, drag: o.drag || 0.4,
          size: KG.rand(o.size ? o.size * 0.6 : 5, o.size || 11), rot: Math.random() * 6, vr: KG.rand(-6, 6),
          color: KG.pick(o.colors || DEF), type: KG.pick(types), life: 1, decay: o.decay || KG.rand(0.9, 1.4), grow: o.grow
        });
      }
      if (parts.length > 500) parts.splice(0, parts.length - 500);
      if (!running) { running = true; last = performance.now(); requestAnimationFrame(loop); }
    }
    function ring(x, y, color) { burst(x, y, { n: 1, types: ['ring'], speed: 1, up: 0, gravity: 0, size: 30, grow: true, colors: [color || '#fff'], decay: 2 }); }
    return { burst, ring, starPath, heartPath, sparkPath };
  })();

  function floatText(x, y, text, color, outline) {
    const el = document.createElement('div');
    el.className = 'kit-float';
    el.textContent = text;
    el.style.left = x + 'px'; el.style.top = y + 'px';
    if (color) el.style.setProperty('--c', color);
    if (outline) el.style.setProperty('--o', outline);
    document.body.appendChild(el);
    setTimeout(() => el.remove(), 1050);
  }
  let lastCallout = null;
  function callout(text, color, outline) {
    if (lastCallout) lastCallout.remove();
    const el = document.createElement('div');
    el.className = 'kit-callout';
    el.textContent = text;
    if (color) el.style.setProperty('--c', color);
    if (outline) el.style.setProperty('--o', outline);
    document.body.appendChild(el);
    lastCallout = el;
    setTimeout(() => { el.remove(); if (lastCallout === el) lastCallout = null; }, 1350);
  }
  const PRAISE = ['好棒！', '太厲害了！', '完美！', '超讚的！', '你好聰明！', '好厲害！'];
  function shake(el, mag, dur) {
    if (!el || !el.animate) return;
    mag = mag || 8;
    const k = [];
    for (let i = 0; i < 8; i++) k.push({ transform: `translate(${KG.rand(-mag, mag).toFixed(1)}px, ${KG.rand(-mag, mag).toFixed(1)}px)` });
    k.push({ transform: 'translate(0,0)' });
    el.animate(k, { duration: dur || 380, easing: 'ease-out' });
  }
  function bump(el) { if (!el) return; el.classList.remove('bump'); void el.offsetWidth; el.classList.add('bump'); }

  /* ---------- 存檔：每關星星 ---------- */
  function progress(key, count) {
    const k = key + ':stars';
    let arr = KG.store.get(k, []);
    if (!Array.isArray(arr)) arr = [];
    while (arr.length < count) arr.push(0);
    return {
      stars: arr,
      get total() { return arr.reduce((a, b) => a + (b || 0), 0); },
      unlocked(i) { return i === 0 || (arr[i - 1] || 0) > 0; },
      set(i, s) { const old = arr[i] || 0; if (s > old) { arr[i] = s; KG.store.set(k, arr); } return s > old; }
    };
  }

  /* ---------- 標題畫面 ---------- */
  function title(o) {
    ensureDefs();
    const ov = document.createElement('div');

    const slots = p.map((c, i) => ({ v: c, cat: INITIALS.includes(c) ? 'i' : (MEDIALS.includes(c) && i < p.length - 1) ? 'm' : 'f' }));
    slots.push({ v: t, cat: 't' });
    const n = lv <= 2 ? 3 : 4;
    slots.forEach(sl => {
      if (sl.cat === 't') sl.blank = lv >= 3;
      else if (lv === 0) sl.blank = sl.cat === 'i';
      else if (lv === 1) sl.blank = sl.cat === 'f';
      else sl.blank = true;
      if (!sl.blank) return;
      if (sl.cat === 't') sl.opts = KG.shuffle([1, 2, 3, 4]);
      else if (sl.cat === 'i') sl.opts = symOpts(sl.v, INITIALS, n, lv >= 3);
      else if (sl.cat === 'm') sl.opts = symOpts(sl.v, MEDIALS, 3, true);
      else sl.opts = symOpts(sl.v, MEDIALS.includes(sl.v) ? MEDIALS + FINALS : FINALS, n, lv >= 3);
    });
    return { kind: 'spell', word, slots, cur: slots.findIndex(s => s.blank) };
  }
  function genTones(lv) {
    const out = [];
    if (lv === 4) {
      const neu = KG.shuffle(TONE_WORDS.filter(x => sylParts(x[2]).t === 5)).slice(0, 4);
      const oth = KG.shuffle(TONE_WORDS.filter(x => sylParts(x[2]).t !== 5)).slice(0, 4);
      KG.shuffle(neu.concat(oth)).forEach(([w, z1, z2]) => {
        const { t } = sylParts(z2);
        out.push({ kind: 'tone', ch: w[1], word: w, zy: [z1, z2], tone: t, opts: [1, 2, 3, 4, 5], showZy: true });
      });
      return out;
    }
    const allowed = lv === 0 ? [1, 4] : lv === 1 ? [1, 2, 4] : [1, 2, 3, 4];
    const fams = targets(TONE_FAM.map((_, i) => i), 8).map(i => TONE_FAM[i]);
    let prevT = 0;
    fams.forEach(f => {
      let t, g = 0;
      do { t = KG.pick(allowed); } while (t === prevT && g++ < 5);
      prevT = t;
      out.push({ kind: 'tone', ch: f[t], syl: f[0], fam: f, tone: t, opts: allowed.slice(), showZy: lv < 3 });

  }

  /* =====================================================================
   * 描寫：筆畫比對（寬鬆）
   * ===================================================================== */
  const dist = (a, b) => Math.hypot(a[0] - b[0], a[1] - b[1]);
  function polyLen(p) { let L = 0; for (let i = 1; i < p.length; i++) L += dist(p[i - 1], p[i]); return L; }
  function resample(p, n) {
    const L = polyLen(p);
    if (L === 0) return Array.from({ length: n }, () => p[0].slice());
    const out = [p[0].slice()], step = L / (n - 1);
    let acc = 0, i = 1, prev = p[0];
    while (out.length < n - 1 && i < p.length) {
      const d = dist(prev, p[i]);
      if (acc + d >= step && d > 0) {
        const t = (step - acc) / d;
        const q = [prev[0] + (p[i][0] - prev[0]) * t, prev[1] + (p[i][1] - prev[1]) * t];
        out.push(q); prev = q; acc = 0;

    t = Math.max(0, Math.min(1, t));
    return Math.hypot(p[0] - a[0] - t * dx, p[1] - a[1] - t * dy);

  /** 檢查一筆：起點、終點、貼著筆畫、蓋住整條、不能亂塗。座標都是 0–100 */
  function checkStroke(stroke, pts, tol) {
    tol = tol || 1;
    if (!pts || pts.length < 2) return { ok: false, reason: 'tap' };
    const L = polyLen(stroke), ul = polyLen(pts);
    if (ul < Math.min(8, L * 0.3)) return { ok: false, reason: 'short' };
    const N = 40, R = resample(pts, N), S = resample(stroke, N);
    let mean = 0, max = 0;
    for (const p of R) { const d = distPoly(p, stroke); mean += d; if (d > max) max = d; }
    mean /= N;
    let cov = 0;
    for (const p of S) if (distPoly(p, R) < 15 * tol) cov++;
    cov /= N;
    const ratio = ul / Math.max(L, 1);
    const m = { mean: +mean.toFixed(1), max: +max.toFixed(1), cov: +cov.toFixed(2), ratio: +ratio.toFixed(2) };
    if (mean > 11 * tol || max > 30 * tol || cov < 0.72 || ratio > 2.3 || ratio < 0.45) return Object.assign({ ok: false, reason: 'off' }, m);
    const sd = dist(R[0], S[0]), ed = dist(R[N - 1], S[N - 1]);
    if (sd > 24 * tol || ed > 24 * tol) {
      if (dist(R[0], S[N - 1]) < 24 * tol && dist(R[N - 1], S[0]) < 24 * tol) return Object.assign({ ok: false, reason: 'reverse' }, m);
      return Object.assign({ ok: false, reason: 'off' }, m);
    }
    return Object.assign({ ok: true }, m);
  }

  /* =====================================================================

  let voiceOK = null;

    if (e.key === 'Escape' || e.key === 'p') { const po = $('pauseOv'); if (po) po.querySelector('.kit-rbtn.g').click(); else pause(); return; }
    if (game.mode !== 'play' || $('pauseOv')) return;
    const q = game.q;
    if (q.kind === 'card') {
      if (e.key === 'ArrowRight' || e.key === 'Enter') { e.preventDefault(); cardNav(1); }
      else if (e.key === 'ArrowLeft') { e.preventDefault(); cardNav(-1); }
      else if (e.key === ' ') { e.preventDefault(); replayCard(); }
      return;
    }
    if (/^[1-5]$/.test(e.key) && q.kind !== 'trace') { answer(+e.key - 1); return; }

  // 點到按鈕之間的空隙：自動選最近的按鈕
  opts.addEventListener('click', e => {
    if (e.target !== opts) return;
    let best = null, bd = 46;
    for (const b of opts.children) {
      const r = b.getBoundingClientRect();
      const dx = Math.max(r.left - e.clientX, 0, e.clientX - r.right), dy = Math.max(r.top - e.clientY, 0, e.clientY - r.bottom);
      const d = Math.hypot(dx, dy);
      if (d < bd) { bd = d; best = b; }
    }
    if (best) best.click();
  });

  /* ---------- 版面（依照實際顯示的大小） ---------- */
  let laying = false;
  function layout() {
    if (laying) return;
    laying = true;
    const ar = app.getBoundingClientRect();

    layoutStage();
    laying = false;

  function layoutStage() {
    const r = stage.getBoundingClientRect();
    const w = r.width, h = r.height;
    if (w < 20 || h < 20) return;
    const card = stage.querySelector('.fcard');
    if (card) {
      const cw = Math.min(w, 760), ch = Math.min(h, 640);
      const row = cw > ch * 1.12;
      card.classList.toggle('row', row);
      card.style.width = cw + 'px'; card.style.height = ch + 'px';

        const q = game.q, np = q.slots.length - 1;

        card.style.setProperty('--sl', Math.floor(slw) + 'px');
      }
    }
    if (cv.parentNode === stage) sizeTrace(w, h);

  /* ---------- 資料自我檢查 ---------- */
  function checkData() {
    const errs = [];
    if (SYMS.length !== 37) errs.push('symbol count ' + SYMS.length);
    if (INITIALS.length !== 21 || MEDIALS.length !== 3 || FINALS.length !== 13) errs.push('group sizes');
    if (INITIALS !== 'ㄅㄆㄇㄈㄉㄊㄋㄌㄍㄎㄏㄐㄑㄒㄓㄔㄕㄖㄗㄘㄙ' || MEDIALS !== 'ㄧㄨㄩ' || FINALS !== 'ㄚㄛㄜㄝㄞㄟㄠㄡㄢㄣㄤㄥㄦ') errs.push('group members');
    if (new Set(SYMS.map(x => x.s)).size !== 37) errs.push('duplicate symbols');
    const okChar = c => ALL.includes(c) || 'ˊˇˋ˙'.includes(c);
    SYMS.forEach(x => {
      if (Array.from(x.w).length !== x.zy.length) errs.push(x.s + ' word/zhuyin length');
      if (!sylParts(x.zy[x.k]).p.includes(x.s)) errs.push(x.s + ' key syllable lacks symbol');
      x.zy.forEach(z => { for (const c of z) if (!okChar(c)) errs.push(x.s + ' bad char ' + c); const t = Array.from(z).filter(c => 'ˊˇˋ˙'.includes(c)); if (t.length > 1) errs.push(x.s + ' two tones'); });
      if (!PICS[x.pic]) errs.push(x.s + ' missing pic');
      if (!STROKES[x.s] || !STROKES[x.s].length) errs.push(x.s + ' missing strokes');
    });
    WORDS.forEach(w => { if (!PICS[w.pic]) errs.push(w.w + ' missing pic'); for (const c of w.zy) if (!okChar(c)) errs.push(w.w + ' bad char'); });
    TONE_FAM.forEach(f => { if (f.length !== 5) errs.push('family ' + f[0]); });
    return errs;
  }

  /* ---------- 開始 ---------- */
  Kit.ensureDefs();
  $('starIc').innerHTML = Kit.ICON.star(true);
  layout();
  showTitle();

  /* ---------- 測試掛鉤 ---------- */
  window.__zy = {
    SYMS, SYM, STROKES, CONF, TONE_FAM, TONE_WORDS, WORDS, ACTS, STICKERS, TONES,
    checkData, checkStroke, sylParts, buildList, pic: picSVG, PICS,
    get state() {
      const q = game.q;
      return {
        mode: game.mode, act: ACTS[game.act].id, lv: game.lv, qi: game.qi, n: game.list.length, first: game.first, wrong: game.wrong, busy: game.busy,
        kind: q && q.kind, sym: q && q.sym ? q.sym.s : null, opts: q ? (q.kind === 'spell' ? (q.slots[q.cur] || {}).opts : q.opts) : null,
        ans: correctIndex(), q, stars: totalStars(), voice: voiceOK,
        trace: q && q.kind === 'trace' ? { sym: q.sym.s, stroke: TR.si, strokes: TR.st.length, fails: TR.fails, locked: TR.locked, S: TR.S } : null
      };
    },
    start(a, lv) { return startLevel(a, lv || 0); },
    answer, correct() { const q = game.q; if (!q) return false; if (q.kind === 'card') { cardNav(1); return true; } if (q.kind === 'trace') return this.trace(TR.st[TR.si]); return answer(correctIndex()); },
    next, cardNav, menu: showActs, levels: showLevels, chart: showChart, parent: showParent, title: showTitle, pause, popup: s => showCardPopup(SYM[s]),
    trace(points) { return evaluateStroke(points.map(p => [p[0], p[1]])); },
    strokePoints(i) { return TR.st[i == null ? TR.si : i]; },
    toScreen(u) { const r = cv.getBoundingClientRect(), sc = r.width / TR.S; return { x: r.left + (TR.m + u[0] * TR.B / 100) * sc, y: r.top + (TR.m + u[1] * TR.B / 100) * sc }; },
    mastery: () => JSON.parse(JSON.stringify(MAST)),
    setFast(b) { window.__zyFast = !!b; },
    setStars(id, arr) { const i = ACTS.findIndex(a => a.id === id); arr.forEach((s, j) => PROG[i].set(j, s)); }
  };
})();
</script>
