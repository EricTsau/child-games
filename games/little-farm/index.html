<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>小小農夫</title>
<link rel="stylesheet" href="../../assets/common.css">
<style>
  html, body { height: 100%; overflow: hidden; background: #5c9a46; overscroll-behavior: none; }
  body { position: fixed; inset: 0; touch-action: none; }
  #cv { position: fixed; left: 0; top: 0; width: 100%; height: 100%; display: block; touch-action: none; background: #5c9a46; }
  button { font-family: var(--kg-font); }
  .hide { display: none !important; }

  /* ---------- 上方資訊 ---------- */
  #hud { position: fixed; top: 8px; left: 64px; right: 64px; z-index: 8000; display: flex; justify-content: center; align-items: center;
    gap: 6px; flex-wrap: wrap; pointer-events: none; }
  .chip { pointer-events: auto; background: rgba(255, 251, 240, .95); border: 2px solid #fff; border-radius: 17px;
    box-shadow: 0 3px 0 rgba(90, 60, 30, .2); padding: 0 10px; display: flex; align-items: center; gap: 5px;
    font-weight: 800; font-size: 15px; color: #5a3d22; height: 34px; white-space: nowrap; cursor: pointer; }
  .chip img { width: 22px; height: 22px; display: block; }
  .chip .sub { font-size: 12px; color: #9a7a55; font-weight: 700; }
  #xpBar { width: 46px; height: 8px; border-radius: 4px; background: #eadcc4; overflow: hidden; }
  #xpFill { height: 100%; width: 0; background: linear-gradient(90deg, #7bd88f, #3fb36a); border-radius: 4px; transition: width .4s; }
  #goalPill { position: fixed; left: 50%; transform: translateX(-50%); z-index: 7900; max-width: calc(100% - 128px);
    background: rgba(90, 61, 34, .82); color: #fff8e6; font-size: 13px; font-weight: 700; padding: 5px 12px; border-radius: 14px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; cursor: pointer; pointer-events: auto; }
  #goalPill b { color: #ffd65c; }

  .fab2 { position: fixed; z-index: 8100; width: 44px; height: 44px; border-radius: 50%; border: 3px solid #fff;
    background: linear-gradient(180deg, #fffaf0, #ffe9c7); box-shadow: 0 4px 0 rgba(90, 60, 30, .25); display: grid; place-items: center;
    cursor: pointer; padding: 0; }
  .fab2 img { width: 28px; height: 28px; }
  .fab2:active { transform: scale(.92); }
  #pauseBtn { right: 12px; top: 64px; }
  .sideBtn { position: fixed; left: 8px; z-index: 8100; height: 40px; border-radius: 20px; border: 3px solid #fff; padding: 0 12px 0 6px;
    display: flex; align-items: center; gap: 4px; font-weight: 800; font-size: 14px; color: #fff; cursor: pointer;
    box-shadow: 0 4px 0 rgba(40, 30, 60, .3); }
  .sideBtn img { width: 26px; height: 26px; }
  #sleepBtn { top: 66px; background: linear-gradient(180deg, #7d82d8, #4f55a8); }
  #netBtn { top: 112px; background: linear-gradient(180deg, #ff9c6b, #e0673a); animation: pulse 1.2s infinite; }
  @keyframes pulse { 50% { transform: scale(1.06); } }

  /* ---------- 下方工具列 ---------- */
  #bar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 8000; display: flex; justify-content: center; align-items: flex-end;
    gap: 6px 10px; padding: 6px 6px calc(6px + env(safe-area-inset-bottom)); pointer-events: none; flex-wrap: wrap; }
  .grp { display: flex; gap: 3px; pointer-events: auto; background: rgba(255, 249, 234, .96); border: 2px solid #fff; border-radius: 18px;
    padding: 3px; box-shadow: 0 4px 0 rgba(90, 60, 30, .22), 0 8px 18px rgba(60, 40, 20, .2); }
  .tb { width: 52px; height: 54px; border: none; border-radius: 14px; background: transparent; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 1px; font-weight: 800; font-size: 11px; color: #6b4a2b; position: relative;
    cursor: pointer; padding: 0; }
  .tb img { width: 32px; height: 32px; display: block; pointer-events: none; }
  .tb.on { background: linear-gradient(180deg, #ffe58a, #ffc93c); box-shadow: inset 0 -3px 0 #e0a92a; }
  .tb.lock { opacity: .38; }
  .tb:active { transform: translateY(2px); }
  .badge { position: absolute; top: 1px; right: 3px; background: #e8648d; color: #fff; border-radius: 9px; font-size: 11px; min-width: 18px;
    height: 18px; padding: 0 4px; line-height: 18px; text-align: center; }
  @media (max-width: 440px) { .tb { width: 46px; } .tb img { width: 30px; height: 30px; } }

  #seedBar { position: fixed; left: 50%; transform: translateX(-50%); z-index: 8050; max-width: calc(100% - 16px); display: flex; gap: 4px;
    overflow-x: auto; background: rgba(255, 249, 234, .97); border: 2px solid #fff; border-radius: 16px; padding: 4px;
    box-shadow: 0 4px 0 rgba(90, 60, 30, .2); scrollbar-width: none; touch-action: pan-x; }
  #seedBar::-webkit-scrollbar { display: none; }
  .sd { flex: 0 0 auto; width: 60px; border: 2px solid transparent; border-radius: 12px; background: #fff; padding: 2px 0 3px; display: flex;
    flex-direction: column; align-items: center; font-weight: 800; font-size: 11px; color: #6b4a2b; cursor: pointer; position: relative; }
  .sd img { width: 30px; height: 30px; }
  .sd .p { color: #b07a12; font-size: 11px; }
  .sd.on { border-color: #f0a92a; background: #fff3c4; }
  .sd .dot { position: absolute; top: 3px; right: 4px; width: 8px; height: 8px; border-radius: 50%; background: #48b866; }
  .sd .dot.off { background: #c9b9a0; }

  #notice { position: fixed; left: 50%; transform: translate(-50%, 10px); z-index: 8200; max-width: min(92%, 520px); background: rgba(255, 251, 240, .97);
    color: #5a3d22; border: 2px solid #fff; border-radius: 16px; padding: 8px 16px; font-weight: 800; font-size: 15px; text-align: center;
    box-shadow: 0 4px 0 rgba(90, 60, 30, .2), 0 8px 20px rgba(60, 40, 20, .22); opacity: 0; transition: opacity .25s, transform .25s; pointer-events: none; }
  #notice.show { opacity: 1; transform: translate(-50%, 0); }
  #notice.warn { background: #fff0e0; color: #a1471a; }
  #banner { position: fixed; left: 50%; top: 30%; transform: translate(-50%, -50%) scale(.6); z-index: 8300; pointer-events: none; opacity: 0;
    background: linear-gradient(180deg, #fff6d8, #ffe39a); border: 4px solid #fff; border-radius: 22px; padding: 14px 26px; text-align: center;
    box-shadow: 0 6px 0 rgba(150, 90, 20, .3), 0 14px 30px rgba(60, 40, 20, .3); transition: opacity .3s, transform .35s cubic-bezier(.3, 1.6, .5, 1); }
  #banner.show { opacity: 1; transform: translate(-50%, -50%) scale(1); }
  #banner h3 { margin: 0; font-size: 26px; color: #c0392b; }
  #banner p { margin: 4px 0 0; font-size: 15px; font-weight: 700; color: #6b4a2b; max-width: 300px; }

  /* ---------- 面板 ---------- */
  .ov { position: fixed; inset: 0; z-index: 9000; background: rgba(40, 28, 16, .48); display: flex; align-items: center; justify-content: center;
    padding: 64px 10px 10px; }
  .card { width: 100%; max-width: 560px; max-height: 100%; display: flex; flex-direction: column; background: #fff9ec; border: 4px solid #fff;
    border-radius: 22px; box-shadow: 0 8px 0 rgba(90, 60, 30, .25), 0 18px 40px rgba(30, 20, 10, .35); overflow: hidden; animation: kg-pop .22s ease; }
  .card .hd { display: flex; align-items: center; gap: 8px; padding: 8px 10px 6px 14px; background: linear-gradient(180deg, #ffe7a8, #ffd47a); }
  .card .hd h2 { margin: 0; font-size: 20px; color: #6b3d12; flex: 1; display: flex; align-items: center; gap: 6px; }
  .card .hd h2 img { width: 30px; height: 30px; }
  .xbtn { width: 40px; height: 40px; border-radius: 50%; border: 3px solid #fff; background: #f08a5d; color: #fff; font-size: 22px; font-weight: 900;
    cursor: pointer; line-height: 1; box-shadow: 0 3px 0 rgba(150, 60, 20, .35); padding: 0; }
  .tabs { display: flex; gap: 4px; padding: 6px 10px 0; background: #ffe9b8; overflow-x: auto; flex: 0 0 auto; }
  .tab { border: none; border-radius: 12px 12px 0 0; padding: 7px 12px; font-weight: 800; font-size: 14px; background: #f5d9a0; color: #8a6136; cursor: pointer; white-space: nowrap; }
  .tab.on { background: #fff9ec; color: #6b3d12; }
  .card .bd { flex: 1 1 auto; overflow-y: auto; padding: 10px; touch-action: pan-y; -webkit-overflow-scrolling: touch; min-height: 60px; }
  .card .ft { flex: 0 0 auto; padding: 8px 10px; display: flex; gap: 8px; justify-content: center; align-items: center; border-top: 2px dashed #f0dcb8;
    font-weight: 800; color: #6b4a2b; flex-wrap: wrap; }
  .row { display: flex; align-items: center; gap: 8px; background: #fff; border-radius: 14px; padding: 6px 8px; margin-bottom: 6px;
    box-shadow: 0 2px 0 rgba(160, 120, 70, .18); }
  .row > img { width: 44px; height: 44px; flex: 0 0 auto; }
  .row .info { flex: 1; min-width: 0; }
  .row .nm { font-weight: 800; font-size: 16px; color: #5a3d22; }
  .row .ds { font-size: 12.5px; color: #8c6a45; font-weight: 600; line-height: 1.35; }
  .row.dim { opacity: .55; }
  .row.done { background: #ecf9e8; }
  .row.cur { outline: 3px solid #ffd65c; }
  .b { border: none; border-radius: 12px; padding: 8px 12px; font-weight: 800; font-size: 14px; color: #fff; cursor: pointer; white-space: nowrap;
    background: linear-gradient(180deg, #7fd88f, #3fae5f); box-shadow: 0 3px 0 #2f8a48; }
  .b:active { transform: translateY(2px); box-shadow: 0 1px 0 #2f8a48; }
  .b.y { background: linear-gradient(180deg, #ffe58a, #f5b82e); color: #6b4a00; box-shadow: 0 3px 0 #c48a12; }
  .b.bl { background: linear-gradient(180deg, #9ad8ff, #3a9ee8); box-shadow: 0 3px 0 #2672ad; }
  .b.gr { background: #d8ccb8; box-shadow: 0 3px 0 #b3a58e; color: #fff; }
  .b.big { font-size: 18px; padding: 11px 22px; border-radius: 16px; }
  .price { font-weight: 900; color: #b07a12; }
  .up { color: #2f9a4f; font-size: 12px; font-weight: 800; }
  .dn { color: #c0563a; font-size: 12px; font-weight: 800; }
  .fest { color: #d0392b; font-size: 12px; font-weight: 900; }
  .prog { height: 9px; border-radius: 5px; background: #eee0c8; overflow: hidden; margin-top: 3px; }
  .prog i { display: block; height: 100%; background: linear-gradient(90deg, #ffd65c, #f5a623); }
  .empty { text-align: center; color: #9a7a55; font-weight: 700; padding: 18px 8px; line-height: 1.6; }
  .cal { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; margin-bottom: 10px; }
  .cal .h { text-align: center; font-size: 12px; font-weight: 800; color: #9a7a55; }
  .cal .d { background: #fff; border-radius: 10px; min-height: 44px; padding: 2px; text-align: center; font-size: 12px; font-weight: 800; color: #6b4a2b;
    display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1.15; }
  .cal .d.today { outline: 3px solid #f5a623; background: #fff3c4; }
  .cal .d.past { opacity: .5; }
  .cal .d .f { color: #d0392b; font-size: 10.5px; }
  .seasonT { font-weight: 900; color: #6b3d12; margin: 6px 2px 4px; display: flex; align-items: center; gap: 6px; }
  .seasonT img { width: 22px; height: 22px; }

  /* ---------- 標題／暫停 ---------- */
  #title { background: radial-gradient(ellipse at 50% 30%, rgba(255, 246, 214, .25), rgba(30, 50, 20, .35)); }
  #title .card { max-width: 440px; text-align: center; background: linear-gradient(180deg, #fffaf0, #fff1d6); }
  #logo { display: block; margin: 6px auto 0; width: 300px; max-width: 100%; height: auto; }
  #title .tagline { margin: 2px 10px 8px; font-weight: 700; color: #8a6136; font-size: 15px; }
  .menu { display: flex; flex-direction: column; gap: 9px; align-items: center; padding: 4px 16px 14px; }
  .menu .b.big { width: min(260px, 100%); }
  .toggles { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
  .toggles .b { min-width: 110px; }
  #title .bestline { font-size: 13px; color: #9a7a55; font-weight: 700; }
  #fade { position: fixed; inset: 0; z-index: 8900; background: #1c1d3a; opacity: 0; pointer-events: none; transition: opacity .6s;
    display: flex; flex-direction: column; align-items: center; justify-content: center; color: #fff6d8; text-align: center; }
  #fade.on { opacity: 1; pointer-events: auto; }
  #fade h3 { margin: 0; font-size: 30px; }
  #fade p { margin: 6px 0 0; font-size: 16px; font-weight: 700; opacity: .85; }
  .help p { margin: 4px 2px 10px; line-height: 1.6; font-weight: 600; color: #6b4a2b; font-size: 14.5px; }
  .help b { color: #b0541a; }
  @media (max-height: 460px) {
    .ov { padding-top: 8px; padding-left: 70px; padding-right: 70px; }
    #logo { width: 210px; }
    #title .tagline { margin-bottom: 2px; font-size: 13px; }
    .menu { gap: 6px; padding-bottom: 8px; }
    .b.big { padding: 8px 18px; font-size: 16px; }
    .tb { height: 50px; }
  }
</style>
</head>
<body>
<canvas id="cv" aria-label="小小農夫的農場"></canvas>

<div id="hud" class="hide">
  <div class="chip" id="cDate" title="農民曆"><img id="iSeason" alt=""><span id="tDate"></span><img id="iWeather" alt=""><span id="tTime"></span></div>
  <div class="chip" id="cMoney" title="錢"><img id="iCoin" alt=""><span id="tMoney"></span></div>
  <div class="chip" id="cLevel" title="等級"><img id="iStar" alt=""><span id="tLv"></span><div id="xpBar"><div id="xpFill"></div></div></div>
</div>
<div id="goalPill" class="hide"></div>
<button id="pauseBtn" class="fab2 hide" aria-label="暫停"><img id="iPause" alt=""></button>
<button id="sleepBtn" class="sideBtn hide" aria-label="回家睡覺"><img id="iMoon" alt="">睡覺</button>
<button id="netBtn" class="sideBtn hide" aria-label="架防颱網"><img id="iNet" alt=""><span id="netTxt">架防颱網</span></button>
<div id="seedBar" class="hide"></div>
<div id="bar" class="hide">
  <div class="grp" id="gPanels"></div>
  <div class="grp" id="gTools"></div>
</div>
<div id="notice"></div>
<div id="banner"><h3 id="bnT"></h3><p id="bnP"></p></div>

<div id="panel" class="ov hide">
  <div class="card" id="pCard">
    <div class="hd"><h2 id="pTitle"></h2><button class="xbtn" id="pClose" aria-label="關閉">×</button></div>
    <div class="tabs hide" id="pTabs"></div>
    <div class="bd" id="pBody"></div>
    <div class="ft hide" id="pFoot"></div>
  </div>
</div>

<div id="title" class="ov">
  <div class="card">
    <canvas id="logo" width="600" height="300"></canvas>
    <div class="tagline">翻土、播種、澆水、養雞鴨，把收成賣到農會！</div>
    <div class="menu">
      <button class="b big" id="btnPlay">開始種田</button>
      <button class="b big y hide" id="btnNew">開一塊新農場</button>
      <div class="toggles">
        <button class="b bl" id="tMusic">音樂 開</button>
        <button class="b bl" id="tSfx">音效 開</button>
        <button class="b y" id="tHelp">怎麼玩</button>
      </div>
      <div class="bestline" id="bestLine"></div>
    </div>
  </div>
</div>

<div id="pause" class="ov hide">
  <div class="card" style="max-width:360px;text-align:center">
    <div class="hd"><h2>休息一下</h2></div>
    <div class="menu" style="padding-top:14px">
      <button class="b big" id="pResume">繼續種田</button>
      <div class="toggles">
        <button class="b bl" id="pMusic">音樂 開</button>
        <button class="b bl" id="pSfx">音效 開</button>
      </div>
      <button class="b y" id="pHelp">怎麼玩</button>
      <button class="b gr" id="pTitleBtn">回標題（自動存檔）</button>
    </div>
  </div>
</div>
<div id="fade"><h3 id="fadeT"></h3><p id="fadeP"></p></div>

<script src="../../assets/common.js"></script>
<script src="../../assets/kg-music.js"></script>
<script>
'use strict';
/* =====================================================================
 * 小小農夫：台灣鄉下的小農場
 * 畫面：一張世界快取畫布（地面＋田地），只重畫有變化的格子；動物、粒子、天氣每幀畫。
 * ===================================================================== */
const SLUG = 'little-farm';
const $ = id => document.getElementById(id);
const cv = $('cv'), ctx = cv.getContext('2d');
const LOW = !!KG.lowEnd;
const CT = LOW ? 56 : 72;            // 快取裡每格幾像素
const WW = 24, WH = 18;              // 世界大小（格）
const TAU = Math.PI * 2;
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const rnd = (a, b) => a + Math.random() * (b - a);
const rndi = (a, b) => Math.floor(a + Math.random() * (b - a + 1));
const FONT = '"PingFang TC","Noto Sans TC","Microsoft JhengHei","Heiti TC",system-ui,sans-serif';

/* ---------- 資料 ---------- */
const SEASONS = ['春', '夏', '秋', '冬'];
const SEASON_ID = ['spring', 'summer', 'autumn', 'winter'];
const WEEK = ['一', '二', '三', '四', '五', '六', '日'];
// ss：四季合不合適（1 合適、0 長得慢）；water：幾天要澆一次水；regrow：果樹／茶樹採完幾天再結果
const CROPS = [
  { id: 'cabbage', n: '高麗菜', lv: 1, seed: 12, days: 3, price: 30, xp: 4, water: 1, ss: [1, 0, 1, 1], yld: 1, pitch: 1.0 },
  { id: 'rice', n: '稻米', lv: 1, seed: 8, days: 4, price: 16, xp: 4, water: 1, ss: [1, 1, 1, 0], yld: 2, pitch: 1.15 },
  { id: 'potato', n: '地瓜', lv: 2, seed: 10, days: 4, price: 28, xp: 4, water: 2, ss: [1, 1, 1, 1], yld: 1, pitch: 0.8 },
  { id: 'bamboo', n: '竹筍', lv: 2, seed: 16, days: 3, price: 38, xp: 5, water: 1, ss: [1, 1, 0, 0], yld: 1, pitch: 0.9 },
  { id: 'melon', n: '西瓜', lv: 3, seed: 30, days: 6, price: 110, xp: 12, water: 1, ss: [0, 1, 0, 0], yld: 1, pitch: 0.7 },
  { id: 'tea', n: '茶葉', lv: 4, seed: 50, days: 5, price: 24, xp: 6, water: 2, ss: [1, 0, 1, 1], yld: 2, regrow: 2, pitch: 1.3, kind: 'bush' },
  { id: 'pine', n: '鳳梨', lv: 5, seed: 40, days: 7, price: 150, xp: 15, water: 2, ss: [1, 1, 0, 0], yld: 1, pitch: 0.85 },
  { id: 'pomelo', n: '柚子', lv: 5, seed: 120, days: 8, price: 50, xp: 10, water: 2, ss: [0, 0, 1, 0], yld: 2, regrow: 3, pitch: 0.75, kind: 'tree' },
  { id: 'banana', n: '香蕉', lv: 6, seed: 90, days: 6, price: 36, xp: 9, water: 1, ss: [0, 1, 1, 0], yld: 3, regrow: 3, pitch: 1.05, kind: 'tree' },
  { id: 'mango', n: '芒果', lv: 7, seed: 140, days: 8, price: 65, xp: 12, water: 2, ss: [0, 1, 0, 0], yld: 2, regrow: 4, pitch: 0.95, kind: 'tree' }
];
const CROP_IX = {}; CROPS.forEach((c, i) => { CROP_IX[c.id] = i; });
const ANIMALS = [
  { id: 'chicken', n: '雞', lv: 1, cost: 60, feed: 2, prod: 'egg', xp: 2, snd: 'cluck' },
  { id: 'duck', n: '鴨', lv: 2, cost: 100, feed: 3, prod: 'degg', xp: 3, snd: 'quack' },
  { id: 'goose', n: '鵝', lv: 3, cost: 160, feed: 4, prod: 'gegg', xp: 4, snd: 'honk' },
  { id: 'cow', n: '牛', lv: 4, cost: 400, feed: 8, prod: 'milk', xp: 6, snd: 'moo' }
];
const AN_IX = {}; ANIMALS.forEach((a, i) => { AN_IX[a.id] = i; });
const MAX_ANIMALS = 10;
const ITEMS = {};
CROPS.forEach(c => { ITEMS[c.id] = { n: c.n, price: c.price, xp: c.xp }; });
Object.assign(ITEMS, {
  egg: { n: '雞蛋', price: 12, xp: 2, from: 'chicken' }, degg: { n: '鴨蛋', price: 18, xp: 3, from: 'duck' },
  gegg: { n: '鵝蛋', price: 30, xp: 4, from: 'goose' }, milk: { n: '牛奶', price: 55, xp: 6, from: 'cow' }
});
const ITEM_ORDER = ['cabbage', 'rice', 'potato', 'bamboo', 'melon', 'tea', 'pine', 'pomelo', 'banana', 'mango', 'egg', 'degg', 'gegg', 'milk'];
const FIELDS = [[6, 4], [8, 5], [10, 6], [12, 8]];
const FX0 = 2, FY0 = 6;              // 田地左上角
const GH = { x: 2, y: 15, w: 6, h: 2 }; // 溫室
const UPG = [
  { id: 'field1', n: '擴大田地', lv: 2, cost: 400, d: '田地變成 8×5，可以種 40 格', icon: 'field' },
  { id: 'net', n: '防颱網', lv: 2, cost: 250, d: '颱風要來時架起來，作物不會被吹壞（可以一直用）', icon: 'net' },

  if ((se === 1 || se === 2) && dw >= 1 && dw <= 5 && S.weather !== 'typhoon' && day > 8 && Math.random() < 0.13) return 'typhoon';
  const rp = [0.28, 0.22, 0.14, 0.2][se], r = Math.random();

      const cr = CROPS[t.cr], ok = t.w || (cr.water >= 2 && t.dd < 1);
      if (ok) t.g = Math.min(cr.days, t.g + ((t.gh || cr.ss[se]) ? 1 : 0.5));
    }
    if (t.w) t.dd = 0; else t.dd++;

  });
  const wasTyphoon = S.weather === 'typhoon';
  S.day++; S.time = 0;

  if (S.weather === 'typhoon') S.st.typhoons = (S.st.typhoons || 0) + 1;
  const wet = S.weather === 'rain' || S.weather === 'typhoon';

    sfx(def.snd); J.buy(); stat('buy'); goalCheckSoon = true; markSave(); renderPanel(); return;
  }
  if (a === 'buyupg') { buyUpgrade(id); return; }
  if (a === 'buydecor') {
    const dc = DECOR.find(x => x.id === id);
    if (S.money < dc.cost) { notice('錢不夠喔，再多賺一點吧！', true); sfx('error'); return; }
    addMoney(-dc.cost); S.decor[id] = 1; addXP(10); J.buy(); stat('decor');
    if (id === 'dog') makeDog();
    requestGround(); markSave(); closePanel();
    const p = id === 'lantern' ? [8, 4] : DECOR_POS[id];
    camTarget = { x: p[0] - view.w / cam.s / 2, y: p[1] - 1 - view.h / cam.s / 2 };
    notice(dc.n + '擺好了！'); return;
  }
  if (a === 'remove') { const t = panelArg; t.cr = -1; t.g = 0; dirty(t); sfx('hoe'); burst(t, 'clod', 6); closePanel(); markSave(); return; }
  if (a === 'sleep') { closePanel(); goSleep(); }
}
function buyUpgrade(id) {
  const u = UPG.find(x => x.id === id);
  if (S.money < u.cost) { notice('錢不夠喔，再多賺一點吧！', true); sfx('error'); return; }
  addMoney(-u.cost); S.upg[id] = 1; addXP(20); J.buy(); sfx('unlock'); stat('upg');
  let look = null;
  if (id.startsWith('field')) { S.field = Math.min(3, S.field + 1); refreshActiveTiles(); requestGround(); look = [FX0 + FIELDS[S.field][0] / 2, FY0 + FIELDS[S.field][1] / 2]; }
  if (id === 'greenhouse') { refreshActiveTiles(); requestGround(); look = [GH.x + 3, GH.y + 1]; }
  if (id === 'sprinkler') { requestGround(); }
  if (id === 'tractor') { updateTools(); look = [17.3, 15]; }
  if (id === 'net') updateSideButtons();
  markSave(); closePanel();
  notice(u.n + '買好了！' + (id === 'net' ? '颱風要來時按左邊的「架防颱網」' : id === 'tractor' ? '選「拖拉機」點一排田，就會整排收成' : ''));
  if (look) camTarget = { x: look[0] - view.w / cam.s / 2, y: look[1] - view.h / cam.s / 2 };
}
function makeDog() { dog = { t: 'dog', x: 21.4, y: 3.95, tx: 21.4, ty: 3.95, wait: 1, dir: false, fr: 0, ft: 0, hop: 0, moving: false }; }

/* ---------- 暫停、標題 ---------- */
function pauseGame() {
  if (scene !== 'play' || paused || fading) return;

}

  if (!paused) return;

}
function refreshToggles() {

  ['tMusic', 'pMusic'].forEach(id => { $(id).textContent = '音樂 ' + (m ? '開' : '關'); $(id).classList.toggle('gr', !m); });
  ['tSfx', 'pSfx'].forEach(id => { $(id).textContent = '音效 ' + (sfxOn ? '開' : '關'); $(id).classList.toggle('gr', !sfxOn); });
}
function toggleMusic() { if (!KG.music) return; KG.music.setEnabled(!KG.music.isEnabled()); refreshToggles(); sfx('ui'); }
function toggleSfx() { sfxOn = !sfxOn; KG.store.set(SLUG + ':sfx', sfxOn); if (!sfxOn) ambStopAll(); else { sfx('ui'); ambienceForWeather(); } refreshToggles(); }
$('tMusic').onclick = toggleMusic; $('pMusic').onclick = toggleMusic;
$('tSfx').onclick = toggleSfx; $('pSfx').onclick = toggleSfx;
$('pauseBtn').onclick = pauseGame;
$('pResume').onclick = resumeGame;
$('pHelp').onclick = () => { resumeGame(); openPanel('help'); };
$('tHelp').onclick = () => { $('title').classList.add('hide'); showHelpFromTitle(); };

$('sleepBtn').onclick = () => goSleep();
$('netBtn').onclick = () => deployNet();
$('cDate').onclick = () => openPanel('calendar');
$('cLevel').onclick = () => openPanel('goals');
$('cMoney').onclick = () => openPanel('market');
$('goalPill').onclick = () => openPanel('goals');
function showHelpFromTitle() {
  // 標題畫面上的說明：借用面板
  panelOpen = 'help';
  $('panel').classList.remove('hide'); $('pTitle').innerHTML = img('help') + '怎麼玩'; setTabs(null); foot(null); $('pBody').innerHTML = HELP_HTML; $('pBody').scrollTop = 0;
  $('pClose').onclick = () => { $('pClose').onclick = closePanel; panelOpen = null; $('panel').classList.add('hide'); $('title').classList.remove('hide'); sfx('back'); kick(); };

}
document.addEventListener('visibilitychange', () => {
  if (document.hidden) { if (scene === 'play') { if (!paused && !panelOpen && !fading) pauseGame(); saveNow(); } }
  else kick();
});
window.addEventListener('pagehide', () => { if (scene === 'play') saveNow(); });

function showGameUI(on) {
  ['hud', 'bar', 'pauseBtn', 'goalPill'].forEach(id => $(id).classList.toggle('hide', !on));
  if (!on) { $('seedBar').classList.add('hide'); $('sleepBtn').classList.add('hide'); $('netBtn').classList.add('hide'); }
}
function groundSig() { return S.field + '|' + Object.keys(S.decor).filter(k => S.decor[k]).sort().join(',') + '|' + (S.upg.sprinkler ? 1 : 0) + (S.upg.greenhouse ? 1 : 0) + '|' + season(); }
let builtSig = '';
const _req = requestGround;
requestGround = function (cb) { builtSig = groundSig(); _req(cb); };
function startGame(fresh) {
  if (fresh) {
    S = newSave(); S.fore = rollWeather(2);
    ITEM_ORDER.forEach(id => { S.pm[id] = rnd(0.9, 1.1); S.ppm[id] = S.pm[id]; });
  }
  applyTilesFromSave();
  animals = S.animals.map(a => spawnAnimal(a.t, a.fed, a.rdy));
  if (fresh) { S.orders = []; const o = makeOrder(); if (o) { o.item = 'cabbage'; o.q = 4; o.reward = 160; o.xp = 20; o.due = 5; S.orders.push(o); } }
  dog = null; if (S.decor.dog) makeDog();
  curTool = S.tool && S.tool !== 'tractor' ? S.tool : 'hoe';
  scene = 'play'; paused = false; fading = false;
  $('title').classList.add('hide');
  buildBars(); showGameUI(true); selectTool(curTool, true);
  layout(); fitField();
  if (groundSig() !== builtSig) requestGround(); else rebuildWorld();
  hudDirty = true; updateHUD(); updateBadges(); updateSideButtons();
  layout(); fitField();
  if (fresh) { notice('歡迎來到小小農場！先選「鋤頭」，在田上點一點翻土'); saveNow(); }
  else notice('歡迎回來！今天是' + dateText());
  sfx('rooster');
  startDay(null);
  kick();
}
function goTitle() {
  endStroke(); scene = 'title'; panelOpen = null; $('panel').classList.add('hide');
  showGameUI(false); ambStopAll(); tractor = null;
  if (KG.music) KG.music.resume();
  playSong(SONG_TITLE);
  setupTitle(); $('title').classList.remove('hide');
  cam.s = Math.max(minS(), Math.min(maxS(), Math.min(view.w, view.h) / 7)); clampCam();

}
let newConfirm = false;
function setupTitle() {
  const sv = loadSave();
  newConfirm = false;
  $('btnPlay').textContent = sv ? '繼續種田（第 ' + sv.day + ' 天）' : '開始種田';
  $('btnNew').classList.toggle('hide', !sv); $('btnNew').textContent = '開一塊新農場';
  $('bestLine').textContent = sv ? 'Lv ' + sv.lv + '・$' + sv.money.toLocaleString('en-US') + '・' + SEASONS[Math.floor(((sv.day - 1) % 28) / 7)] + '天' : '';
  refreshToggles();
}
$('btnPlay').onclick = () => { const sv = loadSave(); if (sv) { S = sv; startGame(false); } else startGame(true); };
$('btnNew').onclick = () => {
  if (!newConfirm) { newConfirm = true; $('btnNew').textContent = '再按一次：重新開始（舊農場會不見）'; sfx('soft'); return; }
  startGame(true);
};

/* ---------- 標題圖 ---------- */
function drawLogo() {
  const g = $('logo').getContext('2d');

  ell(g, 300, 266, 286, 30, '#a6df80'); ell(g, 420, 272, 170, 20, '#8fd36b');
  // 小農夫
  g.save(); g.translate(108, 250);
  shadow(g, 0, 8, 46, 9);
  rr(g, -26, -78, 52, 56, 16); g.fillStyle = '#4a86c5'; g.fill();
  rr(g, -18, -70, 36, 26, 6); g.fillStyle = '#5c9ad6'; g.fill(); circ(g, -12, -66, 3, '#f2c84b'); circ(g, 12, -66, 3, '#f2c84b');
  rr(g, -22, -26, 16, 30, 6); g.fillStyle = '#3a6fa8'; g.fill(); rr(g, 6, -26, 16, 30, 6); g.fill();
  ell(g, -14, 6, 12, 6, '#6b4a2b'); ell(g, 14, 6, 12, 6, '#6b4a2b');
  g.save(); g.translate(38, -60); g.rotate(0.35); rr(g, -4, -60, 8, 100, 4); g.fillStyle = '#b27b45'; g.fill(); poly(g, [-4, -60, -34, -66, -32, -50, -4, -48], '#9aa5ad'); g.restore();
  circ(g, 30, -58, 9, '#ffd9b0');
  circ(g, 0, -110, 36, '#ffd9b0');
  circ(g, -14, -108, 4.5, '#3a2a20'); circ(g, 14, -108, 4.5, '#3a2a20'); circ(g, -12.5, -110, 1.6, '#fff'); circ(g, 15.5, -110, 1.6, '#fff');
  ell(g, -22, -96, 7, 4.5, 'rgba(255,120,120,.45)'); ell(g, 22, -96, 7, 4.5, 'rgba(255,120,120,.45)');
  g.beginPath(); g.arc(0, -98, 9, 0.25, Math.PI - 0.25); g.strokeStyle = '#8a4b2a'; g.lineWidth = 3.5; g.lineCap = 'round'; g.stroke(); g.lineCap = 'butt';
  poly(g, [-62, -128, 0, -176, 62, -128], '#f0d48f'); poly(g, [-62, -128, 62, -128, 54, -120, -54, -120], '#c9a560');
  for (let i = 0; i < 6; i++) line(g, -50 + i * 20, -128, 0, -174, 'rgba(160,120,50,.35)', 2);
  line(g, -26, -124, -20, -92, '#d6453a', 2.5); line(g, 26, -124, 20, -92, '#d6453a', 2.5);
  g.restore();
  // 小雞
  g.save(); g.translate(540, 246); g.scale(1.4, 1.4); g.translate(-32, -50); drawAnimal(g, 'chicken', 0); g.restore();
  // 芽
  for (const [x, y] of [[236, 262], [300, 270], [372, 262], [440, 272]]) { line(g, x, y, x, y - 14, '#4f9e3c', 3); leaf(g, x, y - 12, 14, 7, -1, '#6cc35a'); leaf(g, x, y - 12, 14, 7, 1, '#5cad48'); }
  // 字
  g.font = '900 96px ' + FONT; g.textAlign = 'center'; g.textBaseline = 'middle'; g.lineJoin = 'round';
  g.lineWidth = 22; g.strokeStyle = '#ffffff'; g.strokeText('小小農夫', 352, 150);
  g.fillStyle = '#3f8f3a'; g.fillText('小小農夫', 352, 156);
  g.fillStyle = grad(g, 0, 100, 0, 200, [0, '#ffcf5a', 1, '#f08a2e']); g.fillText('小小農夫', 352, 150);
  g.font = '800 26px ' + FONT; g.lineWidth = 8; g.strokeText('台灣鄉下的小農場', 352, 222); g.fillStyle = '#8a5a2e'; g.fillText('台灣鄉下的小農場', 352, 222);
}

/* =====================================================================
 * 主迴圈
 * ===================================================================== */
let raf = 0, last = 0;
const perfBuf = new Float32Array(600); let perfN = 0;
function wantLoop() { return !paused && !panelOpen && !document.hidden; }
function kick() { if (!raf && wantLoop()) { last = performance.now(); raf = requestAnimationFrame(frame); } }
function frame(now) {
  raf = 0;
  if (!wantLoop()) { if (needDraw) render(); return; }
  const dt = Math.min(0.05, Math.max(0, (now - last) / 1000)); last = now;
  const t0 = performance.now();
  update(dt); const t1 = performance.now(); render();
  const t2 = performance.now();
  perfBuf[perfN % 600] = t2 - t0; perfN++;
  if (t2 - t0 > 12 && window.__farm && window.__farm.spikes.length < 60) window.__farm.spikes.push([Math.round(t1 - t0), Math.round(t2 - t1), window.__farm.lastEv || '']);
  raf = requestAnimationFrame(frame);
}
function onResize() { layout(); if (scene === 'title') clampCam(); needDraw = true; if (!raf) render(); }
window.addEventListener('resize', onResize);
if (window.ResizeObserver) { const ro = new ResizeObserver(() => { if (scene === 'play') layout(); }); ro.observe($('hud')); ro.observe($('bar')); }
window.addEventListener('orientationchange', () => setTimeout(onResize, 120));
if (window.visualViewport) window.visualViewport.addEventListener('resize', onResize);

/* ---------- 測試掛鉤 ---------- */
window.__farm = {
  get S() { return S; }, get scene() { return scene; }, tiles: TILES, get animals() { return animals; }, cam, view,
  ready: () => worldReady && !buildQ,
  tileScreen: (c, r) => ({ x: (c + 0.5 - cam.x) * cam.s, y: (r + 0.5 - cam.y) * cam.s }),
  worldScreen: (x, y) => ({ x: (x - cam.x) * cam.s, y: (y - cam.y) * cam.s }),
  skip: min => { S.time = Math.min(1079, S.time + min); hudDirty = true; },
  sleep: () => goSleep(), newDay: () => { const i = newDay(); rebuildWorld(); startDay(i); },
  setWeather: w => { S.weather = w; pickMusic(); ambienceForWeather(); updateSideButtons(); },
  give: (m, lv) => { S.money += m || 0; if (lv) S.lv = lv; hudDirty = true; buildSeedBar(); },
  tool: id => selectTool(id), music: () => KG.music && KG.music.isPlaying(), panel: () => panelOpen,
  perfReset: () => { perfN = 0; },
  perf: () => { const n = Math.min(perfN, 600); let s = 0, mx = 0; for (let i = 0; i < n; i++) { s += perfBuf[i]; if (perfBuf[i] > mx) mx = perfBuf[i]; } return { n, avg: n ? s / n : 0, max: mx }; },
  fitField: () => fitField(),
  debugMax: () => {
    S.field = 3; UPG.forEach(u => { S.upg[u.id] = 1; }); DECOR.forEach(d => { S.decor[d.id] = 1; }); S.lv = 8; S.money += 5000;
    refreshActiveTiles();
    TILES.forEach((t, i) => { if (t.on) { t.s = 1; t.cr = i % CROPS.length; t.g = i % 3 === 0 ? CROPS[t.cr].days : CROPS[t.cr].days * 0.6; t.w = i % 2; } });
    animals = []; for (let i = 0; i < MAX_ANIMALS; i++) animals.push(spawnAnimal(ANIMALS[i % 4].id, i % 2, i % 3 === 0));
    makeDog(); updateTools(); buildSeedBar(); requestGround(); hudDirty = true;
  },
  longTasks: [], spikes: [], phases: []
};
try { new PerformanceObserver(l => { for (const e of l.getEntries()) if (window.__farm.longTasks.length < 200) window.__farm.longTasks.push(Math.round(e.duration)); }).observe({ entryTypes: ['longtask'] }); } catch (e) { /* 忽略 */ }

/* ---------- 開始 ---------- */
S = loadSave() || newSave();
applyTilesFromSave();
animals = S.animals.map(a => spawnAnimal(a.t, a.fed, a.rdy));
if (S.decor.dog) makeDog();
makeFx();
drawLogo();
setupTitle();
layout();
cam.s = Math.max(minS(), Math.min(maxS(), Math.min(view.w, view.h) / 7));
requestAnimationFrame(() => { requestGround(); queueWarm(); kick(); });
playSong(SONG_TITLE);
