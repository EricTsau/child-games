<script>
'use strict';
const SLUG = 'bubble-tea-shop';
/* =====================================================================
 * 小引擎：畫布、補間、粒子、按鈕、音樂
 * ===================================================================== */
const cv = document.getElementById('game');
let ctx = cv.getContext('2d');
const mainCtx = ctx;
function ctxSwap(c) { ctx = c; }
const FONT = '"Baloo 2","PingFang TC","Noto Sans TC","Microsoft JhengHei","Heiti TC",system-ui,sans-serif';
let W = 0, H = 0, dpr = 1, U = 1, time = 0;

const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const TAU = Math.PI * 2;
const Ease = {
  outCubic: t => 1 - Math.pow(1 - t, 3),
  inCubic: t => t * t * t,
  inOutSine: t => -(Math.cos(Math.PI * t) - 1) / 2,
  outBack: t => { const c = 1.70158, c3 = c + 1; return 1 + c3 * Math.pow(t - 1, 3) + c * Math.pow(t - 1, 2); },
  outElastic: t => (t === 0 || t === 1) ? t : Math.pow(2, -10 * t) * Math.sin((t * 10 - 0.75) * (TAU / 3)) + 1,
  outBounce: t => {
    const n = 7.5625, d = 2.75;
    if (t < 1 / d) return n * t * t;
    if (t < 2 / d) return n * (t -= 1.5 / d) * t + 0.75;
    if (t < 2.5 / d) return n * (t -= 2.25 / d) * t + 0.9375;
    return n * (t -= 2.625 / d) * t + 0.984375;
  }
};

let tweens = [];
function tween(obj, to, dur, ease, delay, done) {
  const tw = { obj, to, from: null, dur: dur || 0.3, ease: typeof ease === 'function' ? ease : (Ease[ease] || Ease.outCubic), t: -(delay || 0), done };
  tweens.push(tw);
  return tw;
}
function killTweens(obj) { tweens = tweens.filter(t => t.obj !== obj); }
function updateTweens(dt) {
  if (!tweens.length) return;
  const list = tweens.slice();
  for (const tw of list) {
    tw.t += dt;
    if (tw.t < 0) continue;
    if (!tw.from) { tw.from = {}; for (const k in tw.to) tw.from[k] = tw.obj[k]; }
    const p = Math.min(1, tw.t / tw.dur), e = tw.ease(p);
    for (const k in tw.to) tw.obj[k] = tw.from[k] + (tw.to[k] - tw.from[k]) * e;
    if (p >= 1) {
      const i = tweens.indexOf(tw);
      if (i >= 0) tweens.splice(i, 1);
      if (tw.done) tw.done();
    }
  }
}

let shakeT = 0, shakeAmt = 0;
function shake(amt, dur) { shakeAmt = Math.max(shakeT > 0 ? shakeAmt : 0, amt); shakeT = Math.max(shakeT, dur || 0.3); }

function circ(x, y, r) { ctx.moveTo(x + r, y); ctx.arc(x, y, r, 0, TAU); }
function rr(x, y, w, h, r) {
  r = Math.max(0, Math.min(r, w / 2, h / 2));
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}
function starPath(x, y, R, r, rot) {
  ctx.beginPath();
  for (let i = 0; i < 10; i++) {
    const a = (rot || 0) + i * Math.PI / 5 - Math.PI / 2, rad = i % 2 ? r : R;
    ctx.lineTo(x + Math.cos(a) * rad, y + Math.sin(a) * rad);
  }

}
function heartPath(x, y, s) {
  ctx.beginPath();

  ctx.bezierCurveTo(x - s * 1.1, y - s * 0.35, x - s * 0.55, y - s * 1.05, x, y - s * 0.45);
  ctx.bezierCurveTo(x + s * 0.55, y - s * 1.05, x + s * 1.1, y - s * 0.35, x, y + s * 0.35);
  ctx.closePath();
}
function shade(hex, amt) {
  const n = parseInt(hex.slice(1), 16);
  const f = v => clamp(v + amt, 0, 255);
  return 'rgb(' + f(n >> 16) + ',' + f((n >> 8) & 255) + ',' + f(n & 255) + ')';
}
function rgba(hex, a) {
  const n = parseInt(hex.slice(1), 16);
  return 'rgba(' + (n >> 16) + ',' + ((n >> 8) & 255) + ',' + (n & 255) + ',' + a + ')';
}
function glossyStar(x, y, R, on, rot) {
  ctx.save();
  ctx.lineJoin = 'round';
  if (on) {
    ctx.fillStyle = 'rgba(160,90,0,0.25)'; starPath(x, y + R * 0.12, R, R * 0.5, rot); ctx.fill();
    const g = ctx.createRadialGradient(x - R * 0.3, y - R * 0.4, R * 0.1, x, y, R * 1.1);
    g.addColorStop(0, '#fffbd0'); g.addColorStop(0.45, '#ffd93d'); g.addColorStop(1, '#f39a0c');
    ctx.fillStyle = g; ctx.strokeStyle = '#c9700a'; ctx.lineWidth = Math.max(1.5, R * 0.12);
    starPath(x, y, R, R * 0.5, rot); ctx.fill(); ctx.stroke();
    ctx.fillStyle = 'rgba(255,255,255,0.75)';
    ctx.beginPath(); ctx.ellipse(x - R * 0.25, y - R * 0.3, R * 0.22, R * 0.12, -0.6, 0, TAU); ctx.fill();
  } else {
    ctx.fillStyle = 'rgba(110,70,60,0.18)'; ctx.strokeStyle = 'rgba(110,70,60,0.32)'; ctx.lineWidth = Math.max(1.5, R * 0.1);
    starPath(x, y, R, R * 0.5, rot); ctx.fill(); ctx.stroke();
  }
  ctx.restore();
}
function txt(s, x, y, size, fill, o) {
  o = o || {};
  ctx.save();
  ctx.font = (o.weight || '900') + ' ' + size + 'px ' + FONT;
  ctx.textAlign = o.align || 'center';
  ctx.textBaseline = o.base || 'middle';
  ctx.lineJoin = 'round';
  if (o.shadow !== false) {
    ctx.fillStyle = o.shadow || 'rgba(80,40,20,0.28)';
    if (o.stroke) { ctx.strokeStyle = ctx.fillStyle; ctx.lineWidth = o.sw || size * 0.22; ctx.strokeText(s, x, y + size * 0.09); }
    ctx.fillText(s, x, y + size * 0.09);
  }
  if (o.stroke) { ctx.strokeStyle = o.stroke; ctx.lineWidth = o.sw || size * 0.22; ctx.strokeText(s, x, y); }
  ctx.fillStyle = fill; ctx.fillText(s, x, y);
  ctx.restore();
}
/** 文字太寬就縮小 */
function fitSize(s, maxW, size, weight) {
  ctx.font = (weight || '900') + ' ' + size + 'px ' + FONT;
  const w = ctx.measureText(s).width;
  return w > maxW ? size * maxW / w : size;
}
function logo(s, cx, cy, size, colors, outline) {
  ctx.save();
  ctx.font = '900 ' + size + 'px ' + FONT;
  ctx.textBaseline = 'middle'; ctx.textAlign = 'center'; ctx.lineJoin = 'round';
  const chars = [...s];
  const widths = chars.map(c => ctx.measureText(c).width * 1.04);
  const total = widths.reduce((a, b) => a + b, 0);
  let x = cx - total / 2;
  chars.forEach((c, i) => {
    const w = widths[i];
    const bob = Math.sin(time * 3 + i * 0.7) * size * 0.06;
    const rot = Math.sin(time * 2.2 + i) * 0.06;
    ctx.save();
    ctx.translate(x + w / 2, cy + bob); ctx.rotate(rot);
    ctx.strokeStyle = 'rgba(80,40,20,0.3)'; ctx.lineWidth = size * 0.36;
    ctx.strokeText(c, 0, size * 0.1);
    ctx.strokeStyle = outline || '#6b3a1f'; ctx.lineWidth = size * 0.34; ctx.strokeText(c, 0, 0);
    ctx.strokeStyle = '#fff'; ctx.lineWidth = size * 0.17; ctx.strokeText(c, 0, 0);
    const col = colors[i % colors.length];
    const g = ctx.createLinearGradient(0, -size / 2, 0, size / 2);
    g.addColorStop(0, shade(col, 70)); g.addColorStop(0.5, col); g.addColorStop(1, shade(col, -35));
    ctx.fillStyle = g; ctx.fillText(c, 0, 0);
    ctx.restore();
    x += w;
  });
  ctx.restore();
}
function progressBar(x, y, w, h, p, col) {
  rr(x, y, w, h, h / 2); ctx.fillStyle = 'rgba(255,255,255,0.9)'; ctx.fill();
  ctx.strokeStyle = 'rgba(110,60,40,0.45)'; ctx.lineWidth = 1.5; ctx.stroke();
  if (p > 0) {
    rr(x + 2, y + 2, Math.max(h - 4, (w - 4) * clamp(p, 0, 1)), h - 4, (h - 4) / 2);
    ctx.fillStyle = col; ctx.fill();
  }
}
function pill(x, y, w, h, col) {
  rr(x, y + 3, w, h, h / 2); ctx.fillStyle = 'rgba(110,60,40,0.2)'; ctx.fill();
  rr(x, y, w, h, h / 2); ctx.fillStyle = '#fffaf2'; ctx.fill();
  ctx.strokeStyle = col; ctx.lineWidth = 2.5; ctx.stroke();
}
function coinIcon(x, y, r) {
  ctx.beginPath(); circ(x, y + r * 0.15, r); ctx.fillStyle = '#c98a10'; ctx.fill();
  ctx.beginPath(); circ(x, y, r); ctx.fillStyle = '#ffd34d'; ctx.fill();
  ctx.lineWidth = Math.max(1, r * 0.16); ctx.strokeStyle = '#e0a21a'; ctx.stroke();
  ctx.beginPath(); circ(x, y, r * 0.6); ctx.strokeStyle = '#f0b52a'; ctx.lineWidth = Math.max(1, r * 0.12); ctx.stroke();
  ctx.fillStyle = 'rgba(255,255,255,0.7)'; ctx.beginPath(); ctx.ellipse(x - r * 0.35, y - r * 0.35, r * 0.25, r * 0.15, -0.7, 0, TAU); ctx.fill();

/* ---------- 粒子（有上限，重複使用物件） ---------- */
const FX_MAX = 220;
class FX {
  constructor() { this.list = []; this.pool = []; }
  _get() { if (this.list.length >= FX_MAX) return null; const p = this.pool.pop() || {}; this.list.push(p); return p; }
  burst(x, y, o) {
    o = o || {};
    const n = o.n || 14, cols = o.colors || ['#ffe066', '#ff8fb1', '#7bd88f', '#6cc4ff', '#ffffff'];
    for (let i = 0; i < n; i++) {
      const p = this._get(); if (!p) return;
      const a = o.dir != null ? o.dir + (Math.random() - 0.5) * (o.spread || 1.2) : Math.random() * TAU;
      const sp = (o.speed || 220) * (0.4 + Math.random() * 0.8);
      p.x = x; p.y = y; p.vx = Math.cos(a) * sp; p.vy = Math.sin(a) * sp - (o.up || 0);
      p.max = o.life || 0.8; p.life = p.max * (0.7 + Math.random() * 0.5);
      p.size = (o.size || 7) * (0.6 + Math.random() * 0.7); p.color = cols[i % cols.length];
      p.shape = o.shape || 'star'; p.rot = Math.random() * TAU; p.vr = (Math.random() - 0.5) * 8;
      p.g = o.g == null ? 500 : o.g; p.drag = o.drag == null ? 0.97 : o.drag; p.s = ''; p.pop = 0;
    }
  }
  text(x, y, s, o) {
    o = o || {};
    const p = this._get(); if (!p) return;
    p.shape = 'text'; p.x = x; p.y = y; p.vx = 0; p.vy = o.vy || -70; p.s = s; p.color = o.color || '#fff'; p.size = o.size || 24;
    p.stroke = o.stroke || '#6b3a1f'; p.life = p.max = o.life || 1.1; p.g = 0; p.drag = 1; p.rot = 0; p.vr = 0; p.pop = 0;
  }
  ring(x, y, color, r, life) {
    const p = this._get(); if (!p) return;
    p.shape = 'ring'; p.x = x; p.y = y; p.vx = 0; p.vy = 0; p.color = color || '#fff'; p.size = r || 40;
    p.life = p.max = life || 0.5; p.g = 0; p.drag = 1; p.rot = 0; p.vr = 0; p.pop = 0;
  }
  update(dt) {
    const L2 = this.list;
    let j = 0;
    for (let i = 0; i < L2.length; i++) {
      const p = L2[i];
      p.life -= dt;
      if (p.life <= 0) { this.pool.push(p); continue; }
      p.vy += p.g * dt;
      const d = Math.pow(p.drag, dt * 60);
      p.vx *= d; p.vy *= d;
      p.x += p.vx * dt; p.y += p.vy * dt;

      L2[j++] = p;
    }

  }

    for (const p of this.list) {
      const a = clamp(p.life / p.max, 0, 1);
      ctx.save();
      ctx.globalAlpha = p.shape === 'text' ? Math.min(1, a * 2) : Math.min(1, a * 1.6);
      ctx.translate(p.x, p.y); ctx.rotate(p.rot);
      const s = p.size;
      if (p.shape === 'star') { ctx.fillStyle = p.color; starPath(0, 0, s, s * 0.45, 0); ctx.fill(); }
      else if (p.shape === 'heart') { ctx.fillStyle = p.color; heartPath(0, 0, s); ctx.fill(); }
      else if (p.shape === 'circle') { ctx.fillStyle = p.color; ctx.beginPath(); circ(0, 0, s * a + 1); ctx.fill(); }
      else if (p.shape === 'bubble') { ctx.strokeStyle = p.color; ctx.lineWidth = 2; ctx.beginPath(); circ(0, 0, s); ctx.stroke(); }
      else if (p.shape === 'drop') { ctx.fillStyle = p.color; ctx.beginPath(); circ(0, 0, s * 0.6); ctx.fill(); }
      else if (p.shape === 'ring') { const k = 1 - a; ctx.strokeStyle = p.color; ctx.lineWidth = 6 * a + 1; ctx.beginPath(); circ(0, 0, s * (0.3 + k)); ctx.stroke(); }

const fx = new FX();

/* ---------- 畫在畫布上的按鈕 ---------- */
let btnReg = [], pressed = null;
const BTN = {
  green: ['#a6f59c', '#3fbf5c', '#24873e'], pink: ['#ffb3cc', '#f45f93', '#b8366a'], blue: ['#a8e0ff', '#3c9ff0', '#22659e'],
  yellow: ['#fff09a', '#f8b921', '#b57c0b'], purple: ['#dcc6ff', '#9b6ff2', '#5f3fae'], orange: ['#ffd0a0', '#ff8a3d', '#c1561a'],
  white: ['#ffffff', '#f6ece4', '#c4a594'], brown: ['#e9c39b', '#b9773f', '#7a4a22']
};
function drawIcon(name, x, y, s, col) {
  ctx.save(); ctx.translate(x, y);
  ctx.fillStyle = col || '#fff'; ctx.strokeStyle = col || '#fff';
  ctx.lineWidth = s * 0.22; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  if (name === 'play') { ctx.beginPath(); ctx.moveTo(-s * 0.35, -s * 0.5); ctx.lineTo(s * 0.5, 0); ctx.lineTo(-s * 0.35, s * 0.5); ctx.closePath(); ctx.fill(); ctx.stroke(); }
  else if (name === 'pause') { rr(-s * 0.38, -s * 0.45, s * 0.26, s * 0.9, s * 0.08); ctx.fill(); rr(s * 0.12, -s * 0.45, s * 0.26, s * 0.9, s * 0.08); ctx.fill(); }
  else if (name === 'replay') {
    ctx.beginPath(); ctx.arc(0, 0, s * 0.42, -Math.PI * 0.3, Math.PI * 1.35); ctx.stroke();
    const a = -Math.PI * 0.3, ex = Math.cos(a) * s * 0.42, ey = Math.sin(a) * s * 0.42;
    ctx.beginPath(); ctx.moveTo(ex + s * 0.2, ey - s * 0.05); ctx.lineTo(ex - s * 0.02, ey + s * 0.25); ctx.lineTo(ex - s * 0.25, ey - s * 0.12); ctx.closePath(); ctx.fill();
  }
  else if (name === 'menu') { for (let i = -1; i <= 1; i += 2) for (let j = -1; j <= 1; j += 2) { rr(i * s * 0.25 - s * 0.17, j * s * 0.25 - s * 0.17, s * 0.34, s * 0.34, s * 0.08); ctx.fill(); } }
  else if (name === 'lock') {
    ctx.lineWidth = s * 0.16; ctx.beginPath(); ctx.arc(0, -s * 0.12, s * 0.26, Math.PI, 0); ctx.stroke();
    rr(-s * 0.38, -s * 0.12, s * 0.76, s * 0.6, s * 0.12); ctx.fill();
  }
  else if (name === 'back') { ctx.beginPath(); ctx.moveTo(s * 0.3, -s * 0.42); ctx.lineTo(-s * 0.2, 0); ctx.lineTo(s * 0.3, s * 0.42); ctx.stroke(); }
  ctx.restore();
}
/** 立體按鈕。opts: {label, icon, color, onClick, size, pulse, disabled, radius} */
function button(id, x, y, w, h, opts) {
  btnReg.push({ id, x, y, w, h, onClick: opts.onClick, disabled: opts.disabled });
  const pal = BTN[opts.color || 'green'];
  const isDown = pressed && pressed.id === id;
  let s = isDown ? 0.93 : 1;
  if (opts.pulse && !isDown) s *= 1 + Math.sin(time * 5) * 0.035;
  const lip = Math.max(3, Math.min(7, h * 0.1));
  ctx.save();
  ctx.translate(x + w / 2, y + h / 2); ctx.scale(s, s);
  if (opts.disabled) ctx.globalAlpha = 0.5;
  const r = opts.radius == null ? h / 2 : opts.radius;
  const yo = isDown ? lip * 0.6 : 0;
  rr(-w / 2, -h / 2 + lip + 3, w, h, r); ctx.fillStyle = 'rgba(110,60,40,0.2)'; ctx.fill();
  rr(-w / 2, -h / 2 + lip, w, h, r); ctx.fillStyle = pal[2]; ctx.fill();
  rr(-w / 2, -h / 2 + yo, w, h, r); ctx.fillStyle = pal[1]; ctx.fill();
  ctx.strokeStyle = pal[2]; ctx.lineWidth = Math.max(2, Math.min(4, h * 0.05)); ctx.stroke();
  rr(-w / 2 + Math.min(r, h * 0.3), -h / 2 + yo + h * 0.08, w - Math.min(r, h * 0.3) * 2, h * 0.34, h * 0.15);
  ctx.fillStyle = rgba('#ffffff', 0.35); ctx.fill();
  const fs = opts.size || h * 0.42;
  const tc = opts.color === 'white' ? '#7a4a32' : '#fff';
  if (opts.icon && opts.label) {
    ctx.font = '900 ' + fs + 'px ' + FONT;
    const tw = ctx.measureText(opts.label).width;
    const tot = fs * 1.1 + tw;
    drawIcon(opts.icon, -tot / 2 + fs * 0.45, yo, fs * 0.9, tc);
    txt(opts.label, -tot / 2 + fs * 1.1 + tw / 2, yo + 1, fs, tc, { stroke: pal[2], sw: fs * 0.2, shadow: false });
  } else if (opts.icon) drawIcon(opts.icon, 0, yo, fs * 1.1, tc);
  else if (opts.label != null) {
    const f2 = fitSize(opts.label, w - 16, fs);
    txt(opts.label, 0, yo + 1, f2, tc, { stroke: opts.color === 'white' ? null : pal[2], sw: f2 * 0.2, shadow: false });

}
function hitBtn(x, y) {
  for (let i = btnReg.length - 1; i >= 0; i--) {
    const b = btnReg[i];
    if (!b.disabled && x >= b.x - 6 && x <= b.x + b.w + 6 && y >= b.y - 6 && y <= b.y + b.h + 8) return b;
  }
  return null;

/* ---------- 背景音樂 ---------- */
let userActed = false;
window.addEventListener('pointerdown', () => { userActed = true; }, { capture: true });
window.addEventListener('keydown', () => { userActed = true; }, { capture: true });
const NOTE_IDX = { C: 0, D: 2, E: 4, F: 5, G: 7, A: 9, B: 11 };
function nf(name) {
  const m = /^([A-G])(#|b)?(\d)$/.exec(name);
  if (!m) return 0;
  const n = NOTE_IDX[m[1]] + (m[2] === '#' ? 1 : m[2] === 'b' ? -1 : 0) + (parseInt(m[3], 10) + 1) * 12;
  return 440 * Math.pow(2, (n - 69) / 12);
}
const Music = {
  on: false, song: null, step: 0, next: 0,
  start(song) {
    if (this.song && this.song.src === song) return;
    this.song = { src: song, bpm: song.bpm, mel: song.mel.trim().split(/\s+/), bass: (song.bass || '').trim().split(/\s+/), vol: song.vol || 1, wave: song.wave || 'triangle' };
    this.on = true; this.step = 0; this.next = 0.15;
  },
  update(dt) {
    if (!this.on || !this.song || !userActed) return;
    this.next -= dt;
    if (this.next < -0.3) this.next = 0;
    const s = this.song, beat = 60 / s.bpm / 2;
    while (this.next <= 0) {
      if (!KG.isMuted() && !document.hidden) {
        const i = this.step % s.mel.length, tok = s.mel[i];
        if (tok !== '-' && tok !== '.') {
          let len = 1;
          while (s.mel[(i + len) % s.mel.length] === '-' && len < 8) len++;
          const f = nf(tok);
          KG.note(f, beat * len * 0.9, s.wave, 0.045 * s.vol);
          KG.note(f * 2, beat * len * 0.4, 'sine', 0.012 * s.vol);
        }
        if (s.bass.length > 1) {
          const bi = this.step % s.bass.length, bt = s.bass[bi];
          if (bt !== '-' && bt !== '.') KG.note(nf(bt), beat * 1.6, 'sine', 0.07 * s.vol);
        }
        if (this.step % 4 === 2) KG.note(2400, 0.03, 'square', 0.008 * s.vol);
      }
      this.step++;
      this.next += beat;
    }
  }
};
const SONG_PLAY = {

function teasFor(day) { return TEAS.filter(t => t.day <= day); }
function topsFor(day) { return TOPS.filter(t => t.day <= day); }
function priceOf(o) {
  let p = o.size === 'L' ? 45 : 35;
  p += o.tops.length * 10;
  if (o.tea === 'fresh' || o.tea === 'fruit') p += 5;
  return p;
}
function normTops(a) { return a.slice().sort(); }
/** 比對訂單與飲料。回傳 {ok, wrong:[欄位]} */
function checkOrder(order, drink) {
  const wrong = [];
  if (!drink) return { ok: false, wrong: ['size', 'tea', 'tops', 'ice', 'sugar', 'sealed'] };
  if (order.size !== drink.size) wrong.push('size');
  if (order.tea !== drink.tea) wrong.push('tea');
  const a = normTops(order.tops), b = normTops(drink.tops || []);
  if (a.length !== b.length || a.some((v, i) => v !== b[i])) wrong.push('tops');
  if (order.ice !== drink.ice) wrong.push('ice');
  if (order.sugar !== drink.sugar) wrong.push('sugar');
  if (!drink.sealed) wrong.push('sealed');
  return { ok: wrong.length === 0, wrong };
}
function pickW(arr, wfn) {
  let tot = 0; for (const a of arr) tot += wfn(a);
  let r = Math.random() * tot;
  for (const a of arr) { r -= wfn(a); if (r <= 0) return a; }
  return arr[arr.length - 1];
}
function genOrder(day, free) {
  const d = free ? MAXDAY : day;
  const teas = teasFor(d), tops = topsFor(d);
  const tea = pickW(teas, t => (t.day === d ? 3 : 1) + (t.day > d - 5 ? 0.6 : 0)).id;
  let nt = 0;
  const r = Math.random();
  if (d <= 2) nt = r < 0.55 ? 1 : 0;
  else if (d <= 8) nt = r < 0.2 ? 0 : r < 0.75 ? 1 : 2;
  else nt = r < 0.1 ? 0 : r < 0.55 ? 1 : 2;
  const chosen = [];
  while (chosen.length < Math.min(nt, tops.length)) {
    const t = pickW(tops, x => (x.day === d ? 3 : 1) + (x.id === 'pearl' ? 1.2 : 0)).id;
    if (!chosen.includes(t)) chosen.push(t);
  }
  const ices = d <= 2 ? ['reg', 'none'] : ['reg', 'less', 'none'];
  const sugars = d <= 2 ? ['full', 'half'] : d <= 5 ? ['full', 'half', 'zero'] : ['full', 'half', 'low', 'zero'];
  return { size: Math.random() < 0.5 ? 'M' : 'L', tea, tops: chosen, ice: KG.pick(ices), sugar: KG.pick(sugars) };
}
function dayCfg(d) {
  return {
    n: Math.min(25, 4 + Math.round(d * 0.7)),
    interval: Math.max(4.2, 12 - d * 0.27),
    patience: Math.max(28, 62 - d * 1.15)
  };
}
const GOAL_TYPES = ['tea', 'combo', 'top', 'noangry', 'tips', 'earn'];
function makeGoal(day, orders) {
  const n = orders.length;
  let type = day === 1 ? 'earn' : GOAL_TYPES[(day * 5 + 1) % GOAL_TYPES.length];
  const g = { type, prog: 0, need: 1, done: false, text: '' };
  if (type === 'tea') {
    const teas = teasFor(day);
    const t = teas[(day * 3) % teas.length];
    g.need = Math.max(2, Math.round(n * 0.3)); g.id = t.id;
    let have = orders.filter(o => o.tea === t.id).length;
    for (let i = 0; i < n && have < g.need + 1; i++) if (orders[i].tea !== t.id) { orders[i].tea = t.id; have++; }
    g.text = '賣出 ' + g.need + ' 杯' + t.name;
  } else if (type === 'top') {
    const tops = topsFor(day);
    const t = tops[(day * 2) % tops.length];
    g.need = Math.max(2, Math.round(n * 0.3)); g.id = t.id;
    let have = orders.filter(o => o.tops.includes(t.id)).length;
    for (let i = n - 1; i >= 0 && have < g.need + 1; i--) {
      const o = orders[i];
      if (o.tops.includes(t.id)) continue;
      if (o.tops.length >= 2) o.tops.pop();
      o.tops.push(t.id); have++;
    }
    g.text = '賣出 ' + g.need + ' 杯加' + t.name + '的飲料';
  } else if (type === 'combo') {
    g.need = Math.min(n - 1, 3 + Math.floor(day / 7));
    g.text = '快速做對，達成 ' + g.need + ' 連擊';
  } else if (type === 'noangry') {
    g.text = '沒有客人生氣離開';
  } else if (type === 'tips') {
    g.need = Math.round(n * 6 / 5) * 5;
    g.text = '小費收到 ' + g.need + ' 元';
  } else {
    g.need = Math.round(orders.reduce((s, o) => s + priceOf(o), 0) * 0.9 / 10) * 10;
    g.text = '今天賺到 ' + g.need + ' 元';
  }
  return g;
}

  const ch = L.counterY - L.custTop;
  L.bw = Math.min(L.slotW - 8, 180);

  L.cupH = Math.min((L.cupBottom - wy) * 0.8, lw * 0.36);
  L.cupX = lw * 0.42;
  L.potR = Math.min(lw * 0.105, wh * 0.28);

function stationItems() {

function layoutPanel() {
  const P = L.panel, it = stationItems();
  const rows = [[['size', '① 杯子'], ['ice', '④ 冰塊']], [['tea', '② 倒茶']], [['top', '③ 加料（最多兩種）']], [['sugar', '⑤ 甜度']]];
  const hdr = clamp(P.h * 0.055, 12, 17);
  const rowH = Math.min((P.h - 8) / 4, 124);
  if (L.land && rowH * 4 + 12 < P.h) { const nh = rowH * 4 + 12; P.y += (P.h - nh) / 2; P.h = nh; }
  const top = P.y + (P.h - rowH * 4) / 2;
  L.btns = []; L.groups = []; L.hdr = hdr;
  rows.forEach((row, r) => {
    const hy = top + r * rowH;
    const bh = Math.min(rowH - hdr - 9, 92);
    const by = hy + hdr + 6;
    let n = 0; row.forEach(g => { n += it[g[0]].length; });
    const ggap = 16, gap = 5;
    const avail = P.w - 12 - ggap * (row.length - 1) - gap * (n - row.length);
    const bw = Math.min(avail / n, bh * 1.45, 118);
    const tot = bw * n + gap * (n - row.length) + ggap * (row.length - 1);
    let x = P.x + (P.w - tot) / 2;
    row.forEach(g => {
      const items = it[g[0]];
      L.groups.push({ kind: g[0], label: g[1], x, y: hy + 2, w: items.length * bw + (items.length - 1) * gap });

        x += bw + gap;
      });
      x += ggap - gap;
    });
  });
}

  const n = Math.max(6, Math.round(w / 44)), sw = w / n;

    ctx.beginPath();
    ctx.moveTo(x0 + i * sw, y); ctx.lineTo(x0 + (i + 1) * sw, y); ctx.lineTo(x0 + (i + 1) * sw, y + h);

}

  ctx.fillStyle = '#8fd48a'; ctx.beginPath(); ctx.ellipse(lw * 0.3, wy + wh, lw * 0.35, wh * 0.32, 0, 0, TAU); ctx.ellipse(lw * 0.8, wy + wh * 1.05, lw * 0.3, wh * 0.36, 0, 0, TAU); ctx.fill();

  if (!(S.stars[G.day - 1] >= stars)) S.stars[G.day - 1] = stars;

/* ---------- 每格更新 ---------- */
function updatePlay(dt) {
  const d = G.drink;
  d.popT += dt;
  if (d.tea && d.fill < 1) d.fill = Math.min(1, d.fill + dt * 1.7);
  for (let i = 0; i < d.topT.length; i++) d.topT[i] += dt;
  d.iceT += dt; d.sugarT += dt;
  for (const k in btnAnim) { if (btnAnim[k] > 0) { btnAnim[k] += dt; if (btnAnim[k] > 0.3) btnAnim[k] = 0; } }
  if (G.trashT > 0) { G.trashT += dt; if (G.trashT > 0.5) G.trashT = 0; }
  if (G.msg) { G.msg.t += dt; if (G.msg.t > 2.2) G.msg = null; }
  if (G.goalFlash > 0) G.goalFlash -= dt;
  // 顧客動畫（暫停或開頭也會動）
  const all = G.slots.concat(G.leaving);
  for (const c of all) {
    if (!c) continue;
    c.anim += dt; c.blinkT -= dt; if (c.blinkT < 0) c.blinkT = 2 + Math.random() * 3;
  }
  if (G.phase === 'result') { updateResult(dt); return; }
  if (G.phase !== 'run' && G.phase !== 'ending') return;
  if (G.paused) return;
  G.time += dt;
  // 封口
  if (d.sealing) {
    const s = d.sealing; s.t += dt;
    const p = s.t / s.dur;
    if (!s.thunk && p >= 0.5) {
      s.thunk = true; d.sealed = true; Sfx.thunk(); shake(3, 0.12); KG.vibrate(25);
      fx.burst(L.sealX, L.cupBottom - L.cupH - 4, { n: 10, colors: ['#ffb3c6', '#fff', '#ffe066'], shape: 'star', size: 5, speed: 160, g: 200 });
    }
    if (p >= 1) { d.sealing = null; KG.note(1175, 0.12, 'sine', 0.12); }
  }
  // 珍珠鍋
  const p = G.pot;
  if (p.cooking) {
    p.t += dt; p.bt -= dt;
    if (p.bt <= 0) { p.bt = 0.35 + Math.random() * 0.3; Sfx.bubble(); fx.burst(L.potX + (Math.random() - 0.5) * L.potR, L.potY - L.potR * 0.6, { n: 1, colors: ['#ffffff'], shape: 'steam', size: L.potR * 0.25, speed: 30, g: -80, life: 1 }); }
    if (p.t >= p.dur) {
      p.cooking = false; p.n = p.cap; p.t = 0;
      KG.sound('sparkle'); say('珍珠煮好了！');
      fx.burst(L.potX, L.potY - L.potR * 0.5, { n: 12, colors: ['#ffe066', '#fff', '#5a3a26'], shape: 'star', size: 5, speed: 180, g: 200 });
    }
  }
  // 來客
  if (G.phase === 'run') {
    const more = G.mode === 'free' || G.queue.length > 0;
    if (more) {
      G.spawnT -= dt;
      if (G.spawnT <= 0 && freeSlot() >= 0) {
        spawnCustomer();
        G.spawnT = G.mode === 'free' ? 2.5 : G.cfg.interval * (0.85 + Math.random() * 0.3);
      }
    }
  }
  const sp = Math.max(260, L.left.w * 0.9);
  for (let i = 0; i < L.slots; i++) {
    const c = G.slots[i];
    if (!c) continue;
    if (c.state === 'in') {
      const tx = L.slotX[i];
      c.x += c.dir * sp * dt;
      if ((c.dir > 0 && c.x >= tx) || (c.dir < 0 && c.x <= tx)) { c.x = tx; c.state = 'wait'; c.bubbleT = 0.001; Sfx.bell(); }
    } else if (c.state === 'wait') {
      c.bubbleT += dt;
      if (G.mode !== 'free') {
        c.pat -= dt;
        const f = c.pat / c.patMax;
        c.mood = f > 0.6 ? 'happy' : f > 0.3 ? 'ok' : 'worried';
        if (c.pat <= 0) customerLeavesAngry(i);
      }
    }
  }
  for (let j = G.leaving.length - 1; j >= 0; j--) {
    const c = G.leaving[j];
    if (c.react) {
      c.react.t += dt;
      if (c.react.t > 1.0) { c.state = 'out'; c.react = null; c.dir = c.x < L.left.w / 2 ? -1 : 1; }
    } else {
      c.x += c.dir * sp * dt;
      if (c.x < -80 || c.x > L.left.w + 80) G.leaving.splice(j, 1);
    }
  }
  // 飛向錢包的金幣
  const tx = L.coinPill ? L.coinPill.x : W / 2, ty = L.coinPill ? L.coinPill.y : 30;
  for (let j = G.flyers.length - 1; j >= 0; j--) {
    const f = G.flyers[j];
    f.t += dt * 1.6;
    if (f.t >= 1) { G.coinShown += f.v; G.flyers.splice(j, 1); Sfx.coin(); }
  }
  checkGoalLive();
  // 收店
  if (G.mode === 'day') {
    if (G.phase === 'run' && G.queue.length === 0 && G.slots.every(s => !s) && G.leaving.length === 0) { G.phase = 'ending'; G.endT = 1.0; }
    if (G.phase === 'ending') { G.endT -= dt; if (G.endT <= 0) { G.coinShown = G.earned; G.flyers.length = 0; finishDay(); } }
  }
}
function updateResult(dt) {
  const R = G.result;
  R.t += dt;
  while (R.shown < 3 && R.t > 0.6 + R.shown * 0.38) {
    if (R.shown < R.stars) {
      KG.note(660 * Math.pow(1.26, R.shown), 0.25, 'triangle', 0.2);
      const pp = resultStarPos(R.shown);
      fx.burst(pp[0], pp[1], { n: 14, colors: ['#ffe066', '#fff', '#ffb02e'], speed: 240, g: 300, size: 6 });
    }
    R.shown++;
  }
}

function hudLayout(items) {
  // items: [{w}] → 自動排成一或兩列
  const left = 66, right = W - 120;
  let x = left, y = 12, row = 0;
  const tot = items.reduce((s, it) => s + it.w + 8, -8);
  if (tot <= right - left) x = left + (right - left - tot) / 2;
  for (const it of items) {
    if (x + it.w > (row === 0 ? right : W - 10) && row === 0) { row = 1; y = 62; x = 10; }
    it.x = x; it.y = y; x += it.w + 8;
  }
  if (row === 1) {
    const r1 = items.filter(it => it.y === 62);
    const w1 = r1.reduce((s, it) => s + it.w + 8, -8);
    let xx = (W - w1) / 2;

}

function stationAt(x, y) {

  for (const b of L.btns) {
    if (x >= b.x - 3 && x <= b.x + b.w + 3 && y >= b.y - 3 && y <= b.y + b.h + 3) return b;
    const dx = Math.max(b.x - x, 0, x - b.x - b.w), dy = Math.max(b.y - y, 0, y - b.y - b.h);

  let best = -1, bd = Infinity;
  for (let i = 0; i < L.slots; i++) {
    const c = G.slots[i];
    if (!c || c.state !== 'wait') continue;
    const d = Math.abs(x - L.slotX[i]);

  }

}
function playDown(x, y) {

    if (b) pressStation(b.kind, b.id);

  U = clamp(Math.min(W / 400, H / 700), 0.75, 1.4);
  layout();
  if (G) for (let i = 0; i < L.slots; i++) { const c = G.slots[i]; if (c && c.state !== 'in') c.x = L.slotX[i]; }
}
window.addEventListener('resize', resizeCanvas);
window.addEventListener('orientationchange', () => setTimeout(resizeCanvas, 150));
if (window.visualViewport) window.visualViewport.addEventListener('resize', resizeCanvas);

function tick(dt) {
  sceneT += dt;
  if (shakeT > 0) shakeT -= dt;
  updateTweens(dt);
  fx.update(dt);
  if (scene === 'play' && G) updatePlay(dt);
}
let lastFrame = performance.now();
function frame(now) {
  const dt = Math.min(0.05, Math.max(0, (now - lastFrame) / 1000));
  lastFrame = now;
  time += dt;
  if (!document.hidden) {
    tick(dt);
    Music.update(dt);
    btnReg = [];
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, W, H);
    if (scene === 'title') drawTitle();
    else if (scene === 'days') drawDays();
    else if (scene === 'shop') drawShop();
    else if (scene === 'play' && G) drawPlay();
    if (scene !== 'play') fx.draw();
  }
  requestAnimationFrame(frame);
}

/* ---------- 測試用接口 ---------- */
window.__bt = {
  state() {
    const o = { scene, coins: Save.data.coins, stars: Save.data.stars.slice(), up: Object.assign({}, Save.data.up), decor: Object.assign({}, Save.data.decor) };
    if (G) Object.assign(o, {
      mode: G.mode, day: G.day, phase: G.phase, paused: G.paused, served: G.served, correct: G.correct, wrong: G.wrong, angry: G.angry,
      earned: G.earned, tips: G.tips, combo: G.combo, maxCombo: G.maxCombo, total: G.total, queue: G.queue ? G.queue.length : null,
      goal: G.goal ? { type: G.goal.type, text: G.goal.text, done: G.goal.done, prog: goalProgress() } : null,
      pot: { n: G.pot.n, cap: G.pot.cap, cooking: G.pot.cooking },
      drink: { size: G.drink.size, tea: G.drink.tea, tops: G.drink.tops.slice(), ice: G.drink.ice, sugar: G.drink.sugar, sealed: G.drink.sealed, sealing: !!G.drink.sealing },
      customers: G.slots.map(c => c ? { state: c.state, order: JSON.parse(JSON.stringify(c.order)), pat: c.pat, patMax: c.patMax, kind: c.look.kind } : null),
      result: G.result ? { stars: G.result.stars } : null
    });
    return o;
  },
  start(day) { startDay(day); G.phase = 'run'; return true; },
  startFree() { return startFree(); },
  scene(s) { goScene(s); return scene; },
  press: pressStation, seal: pressSeal, trash: trashDrink, cook: cookPearls, serve, buy: buyUpgrade,
  /** 依訂單一步步做飲料並開始封口；回傳是否成功 */
  make(order) {
    if (!G || G.phase !== 'run') return false;
    if (G.drink.size) trashDrink();
    if (!pressStation('size', order.size)) return false;
    if (!pressStation('tea', order.tea)) return false;
    for (const t of order.tops) if (!pressStation('top', t)) return false;
    if (!pressStation('ice', order.ice)) return false;
    if (!pressStation('sugar', order.sugar)) return false;
    return pressSeal();
  },
  step(n) { for (let i = 0; i < (n || 1); i++) tick(1 / 60); return this.state(); },
  check: checkOrder, price: priceOf, gen: genOrder, dayCfg, makeGoal,
  setCoins(v) { Save.data.coins = v; Save.save(); },
  reset() { KG.store.set(SLUG + ':save', null); Save.load(); },
  layout() { return { land: L.land, panel: L.panel, btns: L.btns.map(b => ({ kind: b.kind, id: b.id, x: b.x, y: b.y, w: b.w, h: b.h })), cup: { x: L.cupX, bottom: L.cupBottom, h: L.cupH }, seal: sealGeom(), pot: { x: L.potX, y: L.potY, r: L.potR }, trash: { x: L.trashX, y: L.trashY, r: L.trashR }, slotX: L.slotX.slice(), counterY: L.counterY, custTop: L.custTop, by: L.by, bh: L.bh }; },
  btns() { return btnReg.map(b => ({ id: b.id, x: b.x, y: b.y, w: b.w, h: b.h, disabled: !!b.disabled })); },
  finish() { if (G && G.mode === 'day') { G.queue.length = 0; G.slots.fill(null); G.leaving.length = 0; } }
};

resizeCanvas();
Music.start(SONG_MENU);
requestAnimationFrame((t) => { lastFrame = t; frame(t); });
</script>
