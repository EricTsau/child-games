<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<link rel="stylesheet" href="../../assets/common.css">
<style>
  html, body { height: 100%; overflow: hidden; background: #05060c; }
  canvas { position: fixed; left: 0; top: 0; width: 100%; height: 100%; display: block; }
  #gl { pointer-events: none; }
  #ui { touch-action: none; z-index: 10; }
  #msg { position: fixed; inset: 0; display: grid; place-items: center; padding: 24px; text-align: center; color: #ffcf9a; font-size: 20px; font-weight: 800; z-index: 5; }

<script type="importmap">
{ "imports": { "three": "../../assets/vendor/three/three.module.min.js", "three/addons/": "../../assets/vendor/three/addons/" } }

<body>
<div id="msg">STREET HOOPS 載入中…</div>
<canvas id="gl"></canvas>
<canvas id="ui" aria-label="3D 街頭投籃遊戲畫面"></canvas>
<script src="../../assets/common.js"></script>
<script type="module">
import * as THREE from 'three';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

let renderer = null;
try {
  renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('gl'), antialias: true, powerPreference: 'high-performance' });
} catch (e) { renderer = null; }
if (!renderer) document.getElementById('msg').textContent = '這個遊戲需要支援 3D（WebGL）的瀏覽器，請換一個瀏覽器或裝置再試試看。';
else main();

function main() {
  const cv = document.getElementById('ui');
  const ctx = cv.getContext('2d');
  const FONT = "'Rajdhani','Baloo 2','PingFang TC','Noto Sans TC','Microsoft JhengHei',sans-serif";
  const font = (w, s) => w + ' ' + s + 'px ' + FONT;
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const lerp = (a, b, t) => a + (b - a) * t;
  const TAU = Math.PI * 2, DEG = Math.PI / 180;
  const rand = (a, b) => a + Math.random() * (b - a);

  /* =========================================================
   * 物理常數（公尺、秒；y 往上，籃框在原點正上方，球員在 +z 方向）
   * ========================================================= */
  const G = 9.81, BR = 0.12, RIM_Y = 3.05, RIM_R = 0.2286, RIM_T = 0.0095;
  const LAUNCH_ANG = 55 * DEG, RELEASE_Y = 2.05;
  const FX = 8.4, FZB = -3.0, FZF = 11.5, CEIL = 14;
  const RAMP = { x: 1.25, z0: -1.3, z1: 1.9, h0: 0.55, h1: 0.03 };
  const SUB = 1 / 480;
  const I_K = 1.5 / (BR * BR); // 空心球 I = 2/3 m r²
  // 與籃架一起移動的方塊（相對籃框 x）
  const BOXES = [
    { cx: 0, cy: 3.425, cz: -0.404, hx: 0.9, hy: 0.525, hz: 0.025, kind: 'board' },
    { cx: 0, cy: 4.12, cz: -0.43, hx: 0.46, hy: 0.16, hz: 0.06, kind: 'led' },
    { cx: 0, cy: 3.3, cz: -0.94, hx: 0.07, hy: 0.07, hz: 0.5, kind: 'pole' },
    { cx: 0, cy: 2.0, cz: -1.48, hx: 0.1, hy: 2.0, hz: 0.1, kind: 'pole' },
    { cx: 0, cy: 3.03, cz: -0.31, hx: 0.06, hy: 0.025, hz: 0.07, kind: 'rim' }
  ];

  function spotAt(r, a, name) { return { x: r * Math.sin(a * DEG), z: r * Math.cos(a * DEG), name }; }
  const ARCADE_SPOT = spotAt(4.2, 0, '罰球線');
  const CH_SPOTS = [spotAt(6.1, -72, '左底角'), spotAt(6.1, -38, '左側'), spotAt(6.1, 0, '弧頂'), spotAt(6.1, 38, '右側'), spotAt(6.1, 72, '右底角')];
  const FREE_SPOTS = [
    spotAt(4.2, 0, '罰球線'), spotAt(3.0, 0, '禁區'), spotAt(4.0, -45, '左側 45°'), spotAt(4.0, 45, '右側 45°'),
    spotAt(4.8, -72, '左底線'), spotAt(4.8, 72, '右底線'), spotAt(6.1, 0, '弧頂三分'), spotAt(6.1, 50, '右側三分'), spotAt(6.1, -50, '左側三分')
  ];
  const CPU_LV = [{ name: '新手', p: 0.36 }, { name: '高手', p: 0.58 }, { name: '大師', p: 0.8 }];
  const ARC_TARGETS = [30, 70, 120, 180, 250, 330, 420];

  /* =========================================================
   * 存檔
   * ========================================================= */
  const settings = Object.assign({ assist: true, cpu: 1 }, KG.store.get('basketball:settings', {}));
  function saveSettings() { KG.store.set('basketball:settings', settings); }
  const bests = { arcade: KG.best('basketball:arcade') || 0, streak: KG.best('basketball:streak') || 0, challenge: KG.best('basketball:challenge') || 0 };
  let horseWins = KG.store.get('basketball:horseWins', 0) | 0;

  /* =========================================================
   * 音效（自己的 AudioContext，尊重靜音）
   * ========================================================= */
  let AC = null, noiseBuf = null, master = null;
  function ac() {
    if (KG.isMuted()) return null;
    if (!AC) {
      try {
        AC = new (window.AudioContext || window.webkitAudioContext)();
        master = AC.createGain(); master.gain.value = 0.85; master.connect(AC.destination);
        const len = AC.sampleRate * 2;
        noiseBuf = AC.createBuffer(1, len, AC.sampleRate);
        const d = noiseBuf.getChannelData(0);
        for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
      } catch (e) { AC = null; return null; }
    }
    if (AC.state === 'suspended') AC.resume();
    return AC;
  }
  window.addEventListener('pointerdown', () => { ac(); }, { capture: true });
  window.addEventListener('keydown', () => { ac(); }, { capture: true });
  function nz(dur, vol, freq, q, delay, fEnd, type) {
    const a = ac(); if (!a) return;
    const t = a.currentTime + (delay || 0);
    const s = a.createBufferSource(); s.buffer = noiseBuf;
    const f = a.createBiquadFilter(); f.type = type || 'bandpass'; f.Q.value = q || 1;
    f.frequency.setValueAtTime(freq, t);
    if (fEnd) f.frequency.exponentialRampToValueAtTime(fEnd, t + dur);
    const g = a.createGain();
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + Math.min(0.02, dur * 0.2)); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    s.connect(f); f.connect(g); g.connect(master);
    s.start(t, Math.random() * 1.2); s.stop(t + dur + 0.05);
  }
  function tone(freq, dur, type, vol, delay, slide) {
    const a = ac(); if (!a) return;
    const t = a.currentTime + (delay || 0);
    const o = a.createOscillator(), g = a.createGain();
    o.type = type || 'sine'; o.frequency.setValueAtTime(freq, t);
    if (slide) o.frequency.exponentialRampToValueAtTime(slide, t + dur);
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.005); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(master); o.start(t); o.stop(t + dur + 0.05);
  }
  const sfx = {
    shoot() { nz(0.22, 0.1, 900, 0.7, 0, 2600); },
    swish() { nz(0.34, 0.32, 5200, 0.9, 0, 2400); nz(0.2, 0.12, 8000, 1.5, 0.04, 5000, 'highpass'); },
    rim(i) { const v = clamp(i / 5, 0.15, 1); tone(587, 0.32, 'triangle', 0.16 * v); tone(1396, 0.22, 'square', 0.045 * v); tone(2211, 0.16, 'sine', 0.07 * v); nz(0.05, 0.2 * v, 3200, 2); },
    board(i) { const v = clamp(i / 6, 0.15, 1); nz(0.14, 0.32 * v, 420, 1.2); tone(120, 0.14, 'sine', 0.22 * v, 0, 80); },
    bounce(i) { const v = clamp(i / 6, 0.08, 1); tone(95, 0.16, 'sine', 0.4 * v, 0, 48); nz(0.05, 0.12 * v, 900, 1.5); },
    fence(i) { const v = clamp(i / 6, 0.1, 1); nz(0.25, 0.2 * v, 2400, 3); tone(330, 0.2, 'square', 0.03 * v); },
    cheer(n) {
      const a = ac(); if (!a) return;
      const dur = 1.4 + n * 0.4, vol = 0.07 + n * 0.03;
      [700, 1300, 2300].forEach((f, i) => nz(dur, vol * (1 - i * 0.25), f, 0.6, i * 0.05));
      for (let i = 0; i < 2 + n; i++) tone(rand(1400, 2400), 0.25, 'sine', 0.035, rand(0.1, dur * 0.6), rand(1800, 2900));
    },
    buzzer() { tone(196, 0.9, 'sawtooth', 0.12); tone(199, 0.9, 'square', 0.07); },
    fire() { [392, 523, 659, 784, 1047].forEach((f, i) => tone(f, 0.16, 'square', 0.05, i * 0.05)); nz(0.6, 0.18, 600, 0.5, 0, 2400); },
    fizz() { tone(440, 0.4, 'triangle', 0.08, 0, 180); },
    tick() { tone(1500, 0.05, 'square', 0.05); },
    bonus() { [784, 988, 1175, 1568].forEach((f, i) => tone(f, 0.14, 'triangle', 0.1, i * 0.07)); },
    letter() { tone(220, 0.25, 'sawtooth', 0.08); tone(165, 0.35, 'sawtooth', 0.08, 0.18); },
    click() { tone(880, 0.06, 'triangle', 0.1); }
  };

  /* ---------- 背景音樂：慢速嘻哈律動（KG.note） ---------- */
  const BASS = [55, 55, 65.41, 49, 55, 55, 73.42, 61.74];
  const CHORD = [[220, 261.6, 329.6], [220, 261.6, 329.6], [196, 246.9, 293.7], [174.6, 220, 261.6]];
  let musicTimer = 0, mStep = 0;
  function startMusic() {
    if (musicTimer) return;
    musicTimer = setInterval(() => {
      if (KG.isMuted() || document.hidden || phase !== 'play') return;
      const s = mStep % 16, bar = Math.floor(mStep / 16) % 4;
      if (s === 0 || s === 7 || s === 10) KG.note(120, 0.18, 'sine', 0.22, 0, 42);
      if (s === 4 || s === 12) nz(0.14, 0.09, 1800, 0.8);
      if (s % 2 === 0) nz(0.03, 0.035, 8000, 1, 0, 0, 'highpass');
      if (s % 4 === 0 || s === 14) KG.note(BASS[(bar * 2 + (s >= 8 ? 1 : 0)) % 8], 0.3, 'triangle', 0.09);
      if (s === 2 || s === 11) CHORD[bar].forEach((f, i) => KG.note(f * 2, 0.22, 'sine', 0.018, i * 0.012));
      mStep++;
    }, 160);
  }

  /* =========================================================
   * 3D 場景
   * ========================================================= */
  let W = 1, H = 1;
  const small = Math.min(innerWidth, innerHeight) < 600;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.05;
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x070814);
  scene.fog = new THREE.Fog(0x0a0b1c, 22, 70);
  const pmrem = new THREE.PMREMGenerator(renderer);
  scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
  scene.environmentIntensity = 0.18;
  const camera = new THREE.PerspectiveCamera(55, 1, 0.05, 160);
  camera.position.set(0, 2.6, 7);

  scene.add(new THREE.HemisphereLight(0x5a6cb8, 0x1a1210, 0.55));
  const flood = new THREE.SpotLight(0xfff1dc, 260, 30, 0.62, 0.55, 1.6);
  flood.position.set(2.5, 9.5, 6.5);
  flood.target.position.set(0, 1.2, 0.5);
  flood.castShadow = true;
  flood.shadow.mapSize.set(small ? 1024 : 2048, small ? 1024 : 2048);
  flood.shadow.camera.near = 3; flood.shadow.camera.far = 22;
  flood.shadow.bias = -0.0002; flood.shadow.normalBias = 0.02;
  scene.add(flood, flood.target);
  const rimL1 = new THREE.SpotLight(0xff4fb8, 90, 22, 0.7, 0.7, 1.4);
  rimL1.position.set(-8, 6.5, -2.6); rimL1.target.position.set(0, 2.5, 1);
  const rimL2 = new THREE.SpotLight(0x40d8ff, 90, 22, 0.7, 0.7, 1.4);
  rimL2.position.set(8, 6.5, -2.6); rimL2.target.position.set(0, 2.5, 1);
  scene.add(rimL1, rimL1.target, rimL2, rimL2.target);

  function makeTex(w, h, draw, srgb) {
    const c = document.createElement('canvas');
    c.width = w; c.height = h;
    draw(c.getContext('2d'), w, h, c);
    const t = new THREE.CanvasTexture(c);
    if (srgb !== false) t.colorSpace = THREE.SRGBColorSpace;
    t.anisotropy = 4;
    return t;
  }
  function mulberry(seed) {
    return function () {
      seed |= 0; seed = seed + 0x6D2B79F5 | 0;
      let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }

  /* ---------- 球場地面 ---------- */
  const CX0 = -12, CZ0 = -6, CS = 24; // 地面範圍
  const courtTex = makeTex(KG.lowEnd ? 1024 : 2048, KG.lowEnd ? 1024 : 2048, (c, w, h) => {
    const rnd = mulberry(7);
    const k = w / CS;
    const X = x => (x - CX0) * k, Z = z => (z - CZ0) * k;
    c.fillStyle = '#25272d'; c.fillRect(0, 0, w, h);
    // 柏油顆粒
    for (let i = 0; i < w * h / 60; i++) {
      const v = 30 + rnd() * 40 | 0;
      c.fillStyle = 'rgba(' + v + ',' + v + ',' + (v + 6) + ',' + (0.25 + rnd() * 0.5) + ')';
      c.fillRect(rnd() * w, rnd() * h, 1 + rnd() * 2.2, 1 + rnd() * 2.2);
    }
    // 球場底色
    c.fillStyle = 'rgba(30,58,92,.55)';
    c.fillRect(X(-7.5), Z(-1.575), 15 * k, 14 * k);
    // 禁區（深紅）
    c.fillStyle = 'rgba(150,34,48,.75)';
    c.fillRect(X(-2.45), Z(-1.575), 4.9 * k, 5.8 * k);
    // 補丁與裂縫
    for (let i = 0; i < 26; i++) {
      c.fillStyle = 'rgba(0,0,0,' + (0.06 + rnd() * 0.1) + ')';
      c.beginPath(); c.ellipse(rnd() * w, rnd() * h, 20 + rnd() * 90, 14 + rnd() * 50, rnd() * 3, 0, TAU); c.fill();
    }
    c.strokeStyle = 'rgba(8,8,10,.6)'; c.lineWidth = 1.5;
    for (let i = 0; i < 18; i++) {
      let x = rnd() * w, y = rnd() * h;
      c.beginPath(); c.moveTo(x, y);
      for (let j = 0; j < 8; j++) { x += (rnd() - 0.5) * 60; y += (rnd() - 0.5) * 60; c.lineTo(x, y); }
      c.stroke();
    }
    // 白線（略為斑駁）
    c.strokeStyle = 'rgba(236,236,226,.9)'; c.lineWidth = 0.05 * k;
    c.strokeRect(X(-7.5), Z(-1.575), 15 * k, 14 * k);
    c.strokeRect(X(-2.45), Z(-1.575), 4.9 * k, 5.8 * k);
    c.beginPath(); c.arc(X(0), Z(4.225), 1.8 * k, 0, TAU); c.stroke();
    c.beginPath(); c.arc(X(0), Z(0), 1.25 * k, 0, Math.PI); c.stroke();
    // 三分線（街頭場：半徑 6 公尺）
    const R3 = 6.0, side = 6.6;
    const a0 = Math.acos(side / R3 > 1 ? 1 : side / R3);
    c.beginPath(); c.arc(X(0), Z(0), R3 * k, a0, Math.PI - a0); c.stroke();
    c.beginPath(); c.moveTo(X(-6.6), Z(-1.575)); c.lineTo(X(-6.6), Z(0)); c.moveTo(X(6.6), Z(-1.575)); c.lineTo(X(6.6), Z(0)); c.stroke();
    // 中場線
    c.beginPath(); c.moveTo(X(-7.5), Z(12.425)); c.lineTo(X(7.5), Z(12.425)); c.stroke();
    // 磨損
    for (let i = 0; i < 1600; i++) { c.fillStyle = 'rgba(37,39,45,' + (0.3 + rnd() * 0.6) + ')'; c.fillRect(rnd() * w, rnd() * h, 2 + rnd() * 5, 1 + rnd() * 3); }
    // 噴漆字
    c.save(); c.translate(X(0), Z(7.6)); c.rotate(0);
    c.font = '900 ' + (1.3 * k) + 'px ' + FONT; c.textAlign = 'center'; c.textBaseline = 'middle';
    c.fillStyle = 'rgba(255,140,40,.22)'; c.fillText('STREET HOOPS', 0, 0);
    c.restore();
  });
  courtTex.wrapS = courtTex.wrapT = THREE.ClampToEdgeWrapping;
  const ground = new THREE.Mesh(new THREE.PlaneGeometry(CS, CS), new THREE.MeshStandardMaterial({ map: courtTex, roughness: 0.78, metalness: 0.0, envMapIntensity: 0.6 }));
  ground.rotation.x = -Math.PI / 2;
  ground.position.set(CX0 + CS / 2, 0, CZ0 + CS / 2);
  ground.receiveShadow = true;
  scene.add(ground);
  // 遠處地面
  const farGround = new THREE.Mesh(new THREE.PlaneGeometry(200, 200), new THREE.MeshBasicMaterial({ color: 0x0b0c12 }));
  farGround.rotation.x = -Math.PI / 2; farGround.position.y = -0.01;
  scene.add(farGround);

  /* ---------- 天空與城市 ---------- */
  const skyTex = makeTex(2048, 640, (c, w, h) => {
    const rnd = mulberry(31);
    const g = c.createLinearGradient(0, 0, 0, h);
    g.addColorStop(0, '#03040c'); g.addColorStop(0.55, '#0d0f2a'); g.addColorStop(0.82, '#2a1440'); g.addColorStop(1, '#3a1838');
    c.fillStyle = g; c.fillRect(0, 0, w, h);
    for (let i = 0; i < 260; i++) { c.fillStyle = 'rgba(255,255,255,' + rnd() * 0.7 + ')'; c.fillRect(rnd() * w, rnd() * h * 0.5, 1.4, 1.4); }
    // 月亮
    const mg = c.createRadialGradient(w * 0.78, h * 0.18, 0, w * 0.78, h * 0.18, 70);
    mg.addColorStop(0, 'rgba(255,245,220,1)'); mg.addColorStop(0.35, 'rgba(255,240,210,.95)'); mg.addColorStop(0.4, 'rgba(255,230,200,.25)'); mg.addColorStop(1, 'rgba(255,220,200,0)');
    c.fillStyle = mg; c.beginPath(); c.arc(w * 0.78, h * 0.18, 70, 0, TAU); c.fill();
    // 兩層大樓
    for (let layer = 0; layer < 2; layer++) {
      let x = -20;
      while (x < w) {
        const bw = 50 + rnd() * 120, bh = (layer ? 120 : 200) + rnd() * (layer ? 200 : 260);
        const y = h - bh;
        c.fillStyle = layer ? '#080812' : '#0f1022';
        c.fillRect(x, y, bw, bh);
        if (rnd() < 0.2) { c.fillRect(x + bw * 0.4, y - 30, 4, 30); c.fillStyle = '#ff3355'; c.fillRect(x + bw * 0.4 - 1, y - 32, 6, 4); }
        for (let wy = y + 8; wy < h - 6; wy += 9) {
          for (let wx = x + 4; wx < x + bw - 5; wx += 7) {
            const r = rnd();
            if (r < (layer ? 0.32 : 0.22)) {
              c.fillStyle = r < 0.06 ? 'rgba(120,200,255,.8)' : r < 0.1 ? 'rgba(255,120,200,.7)' : 'rgba(255,210,140,' + (0.45 + rnd() * 0.5) + ')';
              c.fillRect(wx, wy, 3, 5);
            }
          }
        }
        x += bw + rnd() * 10;
      }
    }
  });
  const sky = new THREE.Mesh(new THREE.PlaneGeometry(190, 60), new THREE.MeshBasicMaterial({ map: skyTex, fog: false }));
  sky.position.set(0, 24, -48);
  scene.add(sky);
  const skyL = sky.clone(); skyL.position.set(-60, 24, 10); skyL.rotation.y = Math.PI / 2.4; scene.add(skyL);
  const skyR = sky.clone(); skyR.position.set(60, 24, 10); skyR.rotation.y = -Math.PI / 2.4; scene.add(skyR);

  /* ---------- 鐵絲網圍欄 ---------- */
  const fenceTex = makeTex(128, 128, (c, w, h) => {
    c.clearRect(0, 0, w, h);
    c.strokeStyle = 'rgba(190,200,215,.85)'; c.lineWidth = 3;
    c.beginPath(); c.moveTo(0, 0); c.lineTo(w, h); c.moveTo(w, 0); c.lineTo(0, h);
    c.moveTo(-w / 2, h / 2); c.lineTo(w / 2, -h / 2); c.stroke();
  });
  fenceTex.wrapS = fenceTex.wrapT = THREE.RepeatWrapping;
  const fenceMat = new THREE.MeshStandardMaterial({ map: fenceTex, transparent: true, alphaTest: 0.25, side: THREE.DoubleSide, roughness: 0.4, metalness: 0.8, depthWrite: false });
  const FH = 5.2;
  function fencePlane(len, x, z, ry) {
    const t = fenceTex.clone(); t.needsUpdate = true; t.repeat.set(len / 0.28, FH / 0.28);
    const m = new THREE.Mesh(new THREE.PlaneGeometry(len, FH), fenceMat.clone());
    m.material.map = t;
    m.position.set(x, FH / 2, z); m.rotation.y = ry;
    scene.add(m);
  }
  fencePlane(FX * 2, 0, FZB, 0);
  fencePlane(FZF - FZB, -FX, (FZF + FZB) / 2, Math.PI / 2);
  fencePlane(FZF - FZB, FX, (FZF + FZB) / 2, -Math.PI / 2);
  // 圍欄柱子
  const postPos = [];

  /* =========================================================
   * 鏡頭
   * ========================================================= */
  const cam = { p: new THREE.Vector3(0, 2.6, 7), l: new THREE.Vector3(0, 2.8, 0), fov: 55 };
  const camT = { p: new THREE.Vector3(), l: new THREE.Vector3(), fov: 55 };
  function camTarget(s, out) {
    const aspect = W / H, port = aspect < 0.85;
    const dx = -s.x, dz = -s.z, d = Math.hypot(dx, dz), ux = dx / d, uz = dz / d;
    const back = port ? 2.0 + (0.85 - aspect) * 1.2 : 2.15;
    const cy = RELEASE_Y + (port ? 0.55 : 0.42);
    const lx = s.x + ux * 0.35, lz = s.z + uz * 0.35;
    out.p.set(lx - ux * back, cy, lz - uz * back);
    // 讓「手上的球」到「計分板頂端」剛好塞進畫面（上方留給 HUD）
    const aBall = Math.atan2(RELEASE_Y - 0.18 - BR - 0.02 - cy, back);
    const aTop = Math.atan2(4.36 - cy, back + d - 0.35 + 0.4);
    const topF = port ? 0.16 : aspect > 1.6 ? 0.2 : 0.17, botF = port ? 0.1 : 0.04;
    const fov = clamp((aTop - aBall) / (1 - topF - botF), 36 * DEG, 80 * DEG);
    const pitch = aTop - fov * (0.5 - topF);
    out.l.set(out.p.x + ux * Math.cos(pitch) * 5, cy + Math.sin(pitch) * 5, out.p.z + uz * Math.cos(pitch) * 5);
    out.fov = fov / DEG;
  }
  function snapCamera() { camTarget(spot, camT); cam.p.copy(camT.p); cam.l.copy(camT.l); cam.fov = camT.fov; }
  function updateCamera(dt) {
    if (phase === 'title') {
      const a = Math.sin(clock * 0.12) * 0.5;
      camT.p.set(Math.sin(a) * 6.2, 2.4 + Math.sin(clock * 0.2) * 0.2, Math.cos(a) * 6.2);
      camT.l.set(0, 2.5, 0);
      camT.fov = W / H < 0.85 ? 66 : 50;
    } else camTarget(spot, camT);
    const k = 1 - Math.exp(-dt * (phase === 'title' ? 1.5 : 4));
    cam.p.lerp(camT.p, k); cam.l.lerp(camT.l, k); cam.fov = lerp(cam.fov, camT.fov, k);
    nudge = Math.max(0, nudge - dt * 2.5);
    shake = Math.max(0, shake - dt);
    const sh = shake * 0.05;
    camera.position.set(cam.p.x + (Math.random() - 0.5) * sh, cam.p.y + (Math.random() - 0.5) * sh - nudge * 0.03, cam.p.z + nudge * 0.06);
    camera.lookAt(cam.l.x, cam.l.y + nudge * 0.04, cam.l.z);

    camera.updateMatrixWorld();

  /* =========================================================
   * 主更新
   * ========================================================= */
  function update(dt) {
    clock += dt; stateT += dt;
    if (phase === 'pause') return;
    if (banner) { banner.t += dt; if (banner.t > 2.4) banner = null; }
    // 籃框移動
    if (hoop.amp > 0) {
      hoop.t += dt;
      const nx = Math.sin(hoop.t * hoop.spd) * hoop.amp;
      hoop.vx = (nx - hoop.x) / Math.max(dt, 1e-4); hoop.x = nx;
    } else { hoop.vx = 0; hoop.x = lerp(hoop.x, 0, Math.min(1, dt * 3)); }
    hoopG.position.x = hoop.x;
    if (phase === 'play') {
      if (wait) { wait.t -= dt; if (wait.t <= 0) { const f = wait.fn; wait = null; f(); } }
      if (mode === 'arcade' || mode === 'challenge') {
        if (timeLeft > 0 && !ending) {
          const before = Math.ceil(timeLeft);
          timeLeft = Math.max(0, timeLeft - dt);
          if (Math.ceil(timeLeft) !== before && timeLeft <= 5 && timeLeft > 0) sfx.tick();
          if (timeLeft <= 0) { sfx.buzzer(); ending = 0.0001; showBanner('時間到！', '', '#ff5a5a'); }
        }
      }
      if (mode === 'challenge') {
        if (ch.moving > 0) { ch.moving -= dt; if (ch.moving <= 0.6 && ch.rack !== ch.nextRack) { ch.rack = ch.nextRack; setSpot(CH_SPOTS[ch.rack]); showBanner('第 ' + (ch.rack + 1) + ' 個位置', CH_SPOTS[ch.rack].name, '#ffb43a'); } }
        if (ch.idx >= 25 && !ending) ending = 0.0001;
      }
      if (ending) {
        ending += dt;
        if ((balls.every(b => b.resolved) && ending > 1.2) || ending > 4) finish();
      }
      readyCD = Math.max(0, readyCD - dt);
      // 鍵盤
      if (aim.l) aim.yaw = clamp(aim.yaw + dt * 9 * DEG, -14 * DEG, 14 * DEG);
      if (aim.r) aim.yaw = clamp(aim.yaw - dt * 9 * DEG, -14 * DEG, 14 * DEG);
      if (charge) {
        charge.m += charge.dir * dt / 0.85;
        if (charge.m >= 1) { charge.m = 1; charge.dir = -1; }
        if (charge.m <= 0) { charge.m = 0; charge.dir = 1; }
      }
    }
    if (phase === 'title') {
      demoT -= dt;
      if (demoT <= 0 && balls.length < 4) {
        demoT = 1.6;
        const s = FREE_SPOTS[Math.floor(Math.random() * FREE_SPOTS.length)];
        const from = new THREE.Vector3(s.x * 0.92, RELEASE_Y, s.z * 0.92);
        idealVel(from, 0, 0, _iv);
        rotYaw(_iv, rand(-1.2, 1.2) * DEG).multiplyScalar(1 + rand(-0.03, 0.03));
        launch(_iv.x, _iv.y, _iv.z, 'demo', { from });
      }
    }
    physics(dt);
    updateNet(Math.min(dt, 1 / 30));
    updateParticles(dt);
    for (let i = floats.length - 1; i >= 0; i--) { floats[i].life -= dt; if (floats[i].life <= 0) floats.splice(i, 1); }
    // 準備好的球
    if (phase === 'play' && canShoot()) readyShown = true;
    if (phase === 'play' && (readyShown || charge) && (canShoot() || charge)) {
      readyMesh.visible = true;
      readyMesh.material = (mode === 'challenge' && ch.idx % 5 === 4) ? moneyMat : mult > 1 ? fireMat : ballMat;
      const bob = Math.sin(clock * 3) * 0.012;
      let ox = 0, oy = 0;
      if (swipe && swipe.pts.length > 1) { const l = swipe.pts[swipe.pts.length - 1]; ox = clamp((l.x - swipe.x0) / W, -0.3, 0.3) * 0.35; oy = clamp((swipe.y0 - l.y) / H, 0, 0.4) * 0.3; }
      if (charge) oy = -charge.m * 0.08;
      const dx = -spot.x, dz = -spot.z, d = Math.hypot(dx, dz);
      readyMesh.position.set(L.x + (dz / d) * -ox - dx / d * 0.05, L.y - 0.18 + bob + oy, L.z + (dx / d) * ox - dz / d * 0.05);
      readyMesh.rotation.y += dt * 0.6;
      readyMesh.scale.setScalar(Math.min(1, readyMesh.scale.x + dt * 5));
      if (mult > 1 && Math.random() < 0.7) emit(readyMesh.position.x + rand(-0.08, 0.08), readyMesh.position.y + 0.05, readyMesh.position.z + rand(-0.08, 0.08), rand(-0.1, 0.1), rand(0.4, 0.9), rand(-0.1, 0.1), 0.35, 1, 0.6, 0.15, 0.13, -1);

    else if (mode === 'horse') drawLED('YOU', HORSE.slice(0, hs.letters.p) || '-', 'CPU', HORSE.slice(0, hs.letters.c) || '-');
  }

    { ratio: Math.min(baseRatio, 1.35), bloom: true, shadow: true },
    { ratio: 1, bloom: true, shadow: true },
    { ratio: 1, bloom: false, shadow: true },
    { ratio: 0.8, bloom: false, shadow: false }
  ];
  let qLevel = clamp(KG.store.get(QKEY, KG.lowEnd ? 2 : 0) | 0, 0, QLEVELS.length - 1);
  const perf = { last: 0, n: 0, sum: 0, cool: 2.5 };
  function resize() {
    rect = cv.getBoundingClientRect();
    W = Math.max(1, Math.round(rect.width)); H = Math.max(1, Math.round(rect.height));
    const dpr = Math.min(2, window.devicePixelRatio || 1);
    cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    camera.aspect = W / H;
    camera.updateProjectionMatrix();
    applyQuality();
    if (phase !== 'title') snapCamera();
  }
  function applyQuality() {
    const q = QLEVELS[qLevel];
    renderer.setPixelRatio(q.ratio);
    renderer.setSize(W, H, false);
    composer.setPixelRatio(q.ratio);
    composer.setSize(W, H);
    bloom.resolution.set(W / 3, H / 3);
    if (renderer.shadowMap.enabled !== q.shadow) {
      renderer.shadowMap.enabled = q.shadow;
      scene.traverse(o => { if (o.material) [].concat(o.material).forEach(m => { m.needsUpdate = true; }); });
    }
  }
  function renderFrame() {
    pMat.uniforms.uScale.value = renderer.getPixelRatio() * H / (2 * Math.tan(camera.fov * DEG / 2));
    if (QLEVELS[qLevel].bloom) composer.render(); else renderer.render(scene, camera);
    const now = performance.now(), dt = perf.last ? Math.min(0.5, (now - perf.last) / 1000) : 0;
    perf.last = now;
    if (document.hidden || qLevel >= QLEVELS.length - 1 || noGovernor) return;
    perf.cool -= dt;
    if (perf.cool > 0) return;
    perf.sum += dt; perf.n++;
    if (perf.n >= 60) {
      if (perf.sum / perf.n > 1 / 45) { qLevel++; KG.store.set(QKEY, qLevel); applyQuality(); perf.cool = 1.5; }
      perf.n = 0; perf.sum = 0;
    }
  }
  let noGovernor = false, noRender = false;
  window.addEventListener('resize', resize);
  if (window.visualViewport) window.visualViewport.addEventListener('resize', resize);
  window.addEventListener('orientationchange', () => setTimeout(resize, 120));

  let last = performance.now(), first = true;
  function frame(now) {
    const dt = Math.max(0, Math.min(0.05, (now - last) / 1000));
    last = now;
    update(dt);
    if (!noRender) renderFrame();
    drawHUD();
    if (first) { first = false; const m = document.getElementById('msg'); if (m) m.remove(); }
    requestAnimationFrame(frame);
  }
  netInit();
  resize();
  snapCamera();
  drawLED('HOME', '88', 'TIME', '24');
  requestAnimationFrame(frame);

  /* =========================================================
   * 測試介面
   * ========================================================= */
  window.__bb = {
    state: () => ({
      phase, mode, score, timeLeft: +timeLeft.toFixed(2), streak, mult, stage, makes, attempts, balls: balls.length, canShoot: canShoot(),
      hoopX: +hoop.x.toFixed(3), spot: spot.name, quality: qLevel, W, H,
      horse: hs ? { turn: hs.turn, role: hs.role, letters: Object.assign({}, hs.letters), pending: hs.pending } : null,
      challenge: ch ? { idx: ch.idx, rack: ch.rack, resolved: ch.resolved } : null,
      bests: Object.assign({}, bests)
    }),
    start: opts => { opts = opts || {}; startGame(opts.mode || 'arcade', opts); },
    menu: () => toMenu(),
    shoot: (vx, vy, vz) => { const b = launch(vx, vy, vz, 'p'); if (b) attempts++; return !!b; },
    shootAt: (target, power, yawDeg) => {
      const tx = target && target.x != null ? target.x : hoop.x, tz = target && target.z != null ? target.z : 0;
      idealVel(L, tx, tz, _iv);
      rotYaw(_iv, (yawDeg || 0) * DEG).multiplyScalar(power == null ? 1 : power);
      const b = launch(_iv.x, _iv.y, _iv.z, 'p'); if (b) attempts++;
      return !!b;
    },
    playerShot: (fr, yawDeg) => !!playerShot(fr, (yawDeg || 0) * DEG),
    ideal: () => { idealVel(L, hoop.x, 0, _iv); return [_iv.x, _iv.y, _iv.z]; },
    step: sec => { const n = Math.round(sec * 60); for (let i = 0; i < n; i++) update(1 / 60); },
    balls: () => balls.map(b => [+b.p.x.toFixed(2), +b.p.y.toFixed(2), +b.p.z.toFixed(2), b.scored, b.resolved]),
    events: () => events.slice(),
    clearEvents: () => { events.length = 0; },
    extent: () => Object.assign({}, extent),
    resetExtent: () => { extent.x = 0; extent.yMax = 0; extent.yMin = 9; extent.zMin = 0; extent.zMax = 0; },
    setHoop: (amp, spd) => { hoop.amp = amp; hoop.spd = spd || 1; },
    setSpot: i => { setSpot(FREE_SPOTS[i] || ARCADE_SPOT); snapCamera(); },
    spots: () => FREE_SPOTS.map(s => s.name),
    hits: () => HITS.map(h => ({ id: h.id, x: Math.round(h.x + h.w / 2), y: Math.round(h.y + h.h / 2) })),
    ballScreen: () => { const p = readyMesh.visible ? readyMesh.position : L; const s = toScreen(p.x, p.y, p.z); return [Math.round(s[0]), Math.round(s[1])]; },
    hoopScreen: () => { const s = toScreen(hoop.x, RIM_Y, 0); return [Math.round(s[0]), Math.round(s[1])]; },
    lastSwipe: () => lastSwipe,
    lastShot: () => lastResult,
    netLowest: () => { let m = 9; for (let i = 0; i < NL * NN; i++) m = Math.min(m, netP[i * 3 + 1]); return m; },
    governor: on => { noGovernor = !on; },
    render: on => { noRender = !on; },
    finish: () => finish()
  };
}
</script>
</body>
