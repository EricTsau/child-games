<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>小小礦工</title>
<link rel="stylesheet" href="../../assets/common.css">
<style>
  html, body { height: 100%; overflow: hidden; background: #6b4a2f; overscroll-behavior: none; }
  #game {
    position: fixed; inset: 0; display: block;
    width: 100vw; height: 100vh; height: 100dvh;
    touch-action: none; outline: none;
  }
</style>
</head>
<body>
<canvas id="game" tabindex="0" aria-label="小小礦工：甩動鉤子挖寶物的遊戲"></canvas>
<script src="../../assets/common.js"></script>
<script src="../../assets/kg-music.js"></script>
<script>
'use strict';
/* =====================================================================
 * 小小礦工：台灣黑熊「阿熊」和石虎「小虎」轉動絞盤，
 * 甩出鉤子抓金塊、鑽石、玉石、古錢幣、珍珠！
 * 單人無限關卡、雙人同一台裝置合作、關卡之間的藍鵲雜貨店。
 * ===================================================================== */
(function () {
const SLUG = 'mini-miner';
const cv = document.getElementById('game');
const ctx = cv.getContext('2d');
const FONT = '"PingFang TC","Noto Sans TC","Microsoft JhengHei","Heiti TC",system-ui,sans-serif';
let W = 360, H = 640, dpr = 1, time = 0;
const TAU = Math.PI * 2;
const INK = '#3d2a1c';
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const lerp = (a, b, t) => a + (b - a) * t;
const rand = (a, b) => a + Math.random() * (b - a);
const randi = (a, b) => Math.floor(a + Math.random() * (b - a + 1));
const pick = arr => arr[Math.floor(Math.random() * arr.length)];
const fmt = n => '$' + Math.round(n).toLocaleString('en-US');
const Ease = {
  outCubic: t => 1 - Math.pow(1 - t, 3),
  outBack: t => { const c = 1.70158, c3 = c + 1; return 1 + c3 * Math.pow(t - 1, 3) + c * Math.pow(t - 1, 2); },
  outElastic: t => (t === 0 || t === 1) ? t : Math.pow(2, -10 * t) * Math.sin((t * 10 - 0.75) * (TAU / 3)) + 1
};
const Save = {
  get: (k, d) => KG.store.get(SLUG + ':' + k, d),
  set: (k, v) => KG.store.set(SLUG + ':' + k, v)
};

/* ---------- 畫面震動 ---------- */
let shakeT = 0, shakeAmt = 0, shx = 0, shy = 0;
function shake(a, d) { shakeAmt = Math.max(shakeT > 0 ? shakeAmt : 0, a); shakeT = Math.max(shakeT, d || 0.3); }

/* ---------- 繪圖小工具 ---------- */
function circ(x, y, r) { ctx.moveTo(x + r, y); ctx.arc(x, y, r, 0, TAU); }
function rr(x, y, w, h, r, g) {
  g = g || ctx;
  r = Math.max(0, Math.min(r, w / 2, h / 2));
  g.beginPath();
  g.moveTo(x + r, y);
  g.arcTo(x + w, y, x + w, y + h, r);
  g.arcTo(x + w, y + h, x, y + h, r);
  g.arcTo(x, y + h, x, y, r);
  g.arcTo(x, y, x + w, y, r);
  g.closePath();
}
function starPath(x, y, R, r, rot, g) {
  g = g || ctx;
  g.beginPath();
  for (let i = 0; i < 10; i++) {
    const a = (rot || 0) + i * Math.PI / 5 - Math.PI / 2, rad = i % 2 ? r : R;
    g.lineTo(x + Math.cos(a) * rad, y + Math.sin(a) * rad);
  }
  g.closePath();
}
function sparkPath(x, y, s, g) {
  g = g || ctx;
  g.beginPath(); g.moveTo(x, y - s); g.quadraticCurveTo(x, y, x + s, y); g.quadraticCurveTo(x, y, x, y + s);
  g.quadraticCurveTo(x, y, x - s, y); g.quadraticCurveTo(x, y, x, y - s); g.closePath();
}
function shade(hex, amt) {
  const n = parseInt(hex.slice(1), 16);
  const f = v => clamp(v + amt, 0, 255);
  return 'rgb(' + f(n >> 16) + ',' + f((n >> 8) & 255) + ',' + f(n & 255) + ')';
}
function rgba(hex, a) {
  const n = parseInt(hex.slice(1), 16);
  return 'rgba(' + (n >> 16) + ',' + ((n >> 8) & 255) + ',' + (n & 255) + ',' + a + ')';
}
function setFont(size, weight, g) { (g || ctx).font = (weight || '900') + ' ' + Math.round(size) + 'px ' + FONT; }
/** 有外框的字 */
function txt(s, x, y, size, fill, o) {
  o = o || {};
  ctx.save();
  setFont(size, o.weight);
  ctx.textAlign = o.align || 'center';
  ctx.textBaseline = 'middle';
  ctx.lineJoin = 'round';
  if (o.shadow !== false) {
    ctx.fillStyle = o.shadow || 'rgba(40,20,10,0.3)';
    if (o.stroke) { ctx.strokeStyle = ctx.fillStyle; ctx.lineWidth = o.sw || size * 0.22; ctx.strokeText(s, x, y + size * 0.09); }
    ctx.fillText(s, x, y + size * 0.09);
  }
  if (o.stroke) { ctx.strokeStyle = o.stroke; ctx.lineWidth = o.sw || size * 0.22; ctx.strokeText(s, x, y); }
  ctx.fillStyle = fill; ctx.fillText(s, x, y);
  ctx.restore();
}
function textW(s, size, weight) { setFont(size, weight); return ctx.measureText(s).width; }
/** 讓文字塞進寬度：回傳字級 */
function fitSize(s, maxW, size, weight) { const w = textW(s, size, weight); return w > maxW ? size * maxW / w : size; }
/** 標題字：每個字會彈跳 */
function logo(s, cx, cy, size, colors) {
  ctx.save();
  setFont(size);
  ctx.textBaseline = 'middle'; ctx.textAlign = 'center'; ctx.lineJoin = 'round';
  const chars = [...s];
  let total = 0;
  const widths = chars.map(c => { const w = ctx.measureText(c).width * 1.04; total += w; return w; });
  let x = cx - total / 2;
  chars.forEach((c, i) => {
    const w = widths[i];
    const bob = Math.sin(time * 3 + i * 0.8) * size * 0.06;
    const rot = Math.sin(time * 2.1 + i * 1.3) * 0.06;
    ctx.save();
    ctx.translate(x + w / 2, cy + bob); ctx.rotate(rot);
    ctx.strokeStyle = 'rgba(40,20,5,0.35)'; ctx.lineWidth = size * 0.36; ctx.strokeText(c, 0, size * 0.1);
    ctx.strokeStyle = '#5a3412'; ctx.lineWidth = size * 0.34; ctx.strokeText(c, 0, 0);
    ctx.strokeStyle = '#fff6dc'; ctx.lineWidth = size * 0.16; ctx.strokeText(c, 0, 0);
    const col = colors[i % colors.length];
    const g = ctx.createLinearGradient(0, -size / 2, 0, size / 2);
    g.addColorStop(0, shade(col, 80)); g.addColorStop(0.5, col); g.addColorStop(1, shade(col, -45));
    ctx.fillStyle = g; ctx.fillText(c, 0, 0);
    ctx.globalAlpha = 0.6; ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.ellipse(-w * 0.18, -size * 0.25, size * 0.1, size * 0.05, -0.5, 0, TAU); ctx.fill();
    ctx.restore();
    x += w;
  });
  ctx.restore();
  return total;
}

/* ---------- 按鈕（每一格畫面重新登記，支援鍵盤焦點） ---------- */
let btnReg = [], pressed = null, focusId = null, kbMode = false;
const BTN = {
  green: ['#b6f59c', '#4cbf4f', '#2a8433'], gold: ['#fff1a0', '#f6b928', '#a86e09'], blue: ['#b0e2ff', '#3f9ce8', '#235f9a'],
  red: ['#ffb7a8', '#ee5a45', '#a6301f'], wood: ['#f2c98f', '#c58a4a', '#7b4d22'], white: ['#ffffff', '#f3ead9', '#a8906c'],
  purple: ['#dcc6ff', '#9b6ff2', '#5f3fae'], teal: ['#a6f0e6', '#2fb7a6', '#1c7d71']
};
function drawIcon(name, x, y, s, col) {
  ctx.save(); ctx.translate(x, y);
  ctx.fillStyle = col || '#fff'; ctx.strokeStyle = col || '#fff';
  ctx.lineWidth = s * 0.2; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  if (name === 'play') { ctx.beginPath(); ctx.moveTo(-s * 0.32, -s * 0.45); ctx.lineTo(s * 0.45, 0); ctx.lineTo(-s * 0.32, s * 0.45); ctx.closePath(); ctx.fill(); ctx.stroke(); }
  else if (name === 'pause') { rr(-s * 0.38, -s * 0.42, s * 0.26, s * 0.84, s * 0.08); ctx.fill(); rr(s * 0.12, -s * 0.42, s * 0.26, s * 0.84, s * 0.08); ctx.fill(); }
  else if (name === 'replay') {
    ctx.beginPath(); ctx.arc(0, 0, s * 0.42, -Math.PI * 0.3, Math.PI * 1.35); ctx.stroke();
    const a = -Math.PI * 0.3, ex = Math.cos(a) * s * 0.42, ey = Math.sin(a) * s * 0.42;
    ctx.beginPath(); ctx.moveTo(ex + s * 0.2, ey - s * 0.05); ctx.lineTo(ex - s * 0.02, ey + s * 0.25); ctx.lineTo(ex - s * 0.25, ey - s * 0.12); ctx.closePath(); ctx.fill();
  }
  else if (name === 'menu') { for (let i = -1; i <= 1; i += 2) for (let j = -1; j <= 1; j += 2) { rr(i * s * 0.25 - s * 0.17, j * s * 0.25 - s * 0.17, s * 0.34, s * 0.34, s * 0.08); ctx.fill(); } }
  else if (name === 'cart') {
    ctx.lineWidth = s * 0.14;
    ctx.beginPath(); ctx.moveTo(-s * 0.5, -s * 0.38); ctx.lineTo(-s * 0.32, -s * 0.38); ctx.lineTo(-s * 0.18, s * 0.18); ctx.lineTo(s * 0.4, s * 0.18); ctx.lineTo(s * 0.5, -s * 0.22); ctx.lineTo(-s * 0.26, -s * 0.22); ctx.stroke();
    ctx.beginPath(); circ(-s * 0.12, s * 0.38, s * 0.09); circ(s * 0.32, s * 0.38, s * 0.09); ctx.fill();
  }
  else if (name === 'check') { ctx.beginPath(); ctx.moveTo(-s * 0.38, 0); ctx.lineTo(-s * 0.1, s * 0.3); ctx.lineTo(s * 0.42, -s * 0.32); ctx.stroke(); }
  ctx.restore();
}
/** 立體按鈕。o: {label, icon, color, onClick, size, pulse, disabled, def, radius} */
function button(id, x, y, w, h, o) {
  btnReg.push({ id, x, y, w, h, onClick: o.onClick, disabled: o.disabled, def: o.def, silent: o.silent });
  const pal = BTN[o.color || 'green'];
  const isDown = pressed && pressed.id === id;
  let s = isDown ? 0.93 : 1;
  if (o.pulse && !isDown) s *= 1 + Math.sin(time * 5) * 0.035;
  const lip = Math.max(3, h * 0.1);
  ctx.save();
  ctx.translate(x + w / 2, y + h / 2); ctx.scale(s, s);
  if (o.disabled) ctx.globalAlpha = 0.55;
  const r = o.radius == null ? h / 2 : o.radius;
  const yo = isDown ? lip * 0.6 : 0;
  rr(-w / 2, -h / 2 + lip + 3, w, h, r); ctx.fillStyle = 'rgba(40,20,5,0.25)'; ctx.fill();
  rr(-w / 2, -h / 2 + lip, w, h, r); ctx.fillStyle = pal[2]; ctx.fill();
  rr(-w / 2, -h / 2 + yo, w, h, r);
  const g = ctx.createLinearGradient(0, -h / 2, 0, h / 2);
  g.addColorStop(0, pal[0]); g.addColorStop(0.55, pal[1]); g.addColorStop(1, shade(pal[1], -15));
  ctx.fillStyle = g; ctx.fill();
  ctx.strokeStyle = pal[2]; ctx.lineWidth = Math.max(2, h * 0.05); ctx.stroke();
  rr(-w / 2 + Math.min(h, w) * 0.22, -h / 2 + yo + h * 0.09, w - Math.min(h, w) * 0.44, h * 0.26, h * 0.13);
  ctx.fillStyle = 'rgba(255,255,255,0.42)'; ctx.fill();
  let fs = o.size || h * 0.42;
  const tc = o.color === 'white' ? '#5a3b1e' : '#fff';
  const sc = o.color === 'white' ? '#fff' : pal[2];
  if (o.icon && o.label) {
    fs = Math.min(fs, (w - fs * 1.6) / Math.max(1, textW(o.label, 1)));
    setFont(fs);
    const tw = ctx.measureText(o.label).width;
    const tot = fs * 1.15 + tw;
    drawIcon(o.icon, -tot / 2 + fs * 0.45, yo, fs * 0.9, tc);
    txt(o.label, -tot / 2 + fs * 1.15 + tw / 2, yo + 1, fs, tc, { stroke: sc, sw: fs * 0.2, shadow: false });
  } else if (o.icon) drawIcon(o.icon, 0, yo, fs * 1.1, tc);
  else if (o.label != null) {
    fs = Math.min(fs, (w - 14) / Math.max(1, textW(o.label, 1)));
    txt(o.label, 0, yo + 1, fs, tc, { stroke: sc, sw: fs * 0.2, shadow: false });
  }
  ctx.restore();
  if (kbMode && focusId === id) {
    rr(x - 5, y - 5, w + 10, h + lip + 10, r + 5);
    ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 4; ctx.setLineDash([9, 6]); ctx.lineDashOffset = -time * 30; ctx.stroke(); ctx.setLineDash([]);
  }
}
/** 不畫出來、只登記可點區域 */
function hotspot(id, x, y, w, h, onClick, silent) { btnReg.push({ id, x, y, w, h, onClick, silent }); }
function hitBtn(x, y) {
  let best = null, bd = 14;
  for (let i = btnReg.length - 1; i >= 0; i--) {
    const b = btnReg[i];
    if (b.disabled) continue;
    if (b.exact) { if (x >= b.x && x <= b.x + b.w && y >= b.y && y <= b.y + b.h) return b; continue; }
    if (x >= b.x - 4 && x <= b.x + b.w + 4 && y >= b.y - 4 && y <= b.y + b.h + 8) return b;
    const dx = Math.max(b.x - x, 0, x - (b.x + b.w)), dy = Math.max(b.y - y, 0, y - (b.y + b.h));
    const d = Math.hypot(dx, dy);
    if (d < bd) { bd = d; best = b; }
  }
  return best;
}
function focusMove(dir) {
  const list = btnReg.filter(b => !b.disabled && b.onClick && !b.silent);
  if (!list.length) return;
  let i = list.findIndex(b => b.id === focusId);
  i = i < 0 ? (dir > 0 ? 0 : list.length - 1) : (i + dir + list.length) % list.length;
  focusId = list[i].id;
  sfx('click', { vol: 0.6 });
}
function focusPress() {
  const b = btnReg.find(q => q.id === focusId && !q.disabled) || btnReg.find(q => q.def && !q.disabled);
  if (b && b.onClick) { sfx('ui'); b.onClick(); }
}

/* ---------- 粒子（物件池） ---------- */
const PMAX = KG.lowEnd ? 120 : 190;
const parts = [];
for (let i = 0; i < PMAX; i++) parts.push({ on: false, x: 0, y: 0, vx: 0, vy: 0, life: 0, max: 1, size: 1, color: '#fff', shape: 0, rot: 0, vr: 0, g: 0, drag: 1, tx: 0, ty: 0 });
let pIdx = 0;
const SH_STAR = 0, SH_SPARK = 1, SH_DOT = 2, SH_CONF = 3, SH_RING = 4, SH_CHUNK = 5, SH_SMOKE = 6, SH_COIN = 7;
function allocP() {
  for (let k = 0; k < PMAX; k++) {
    const p = parts[(pIdx + k) % PMAX];
    if (!p.on) { pIdx = (pIdx + k + 1) % PMAX; return p; }
  }
  const p = parts[pIdx]; pIdx = (pIdx + 1) % PMAX; return p;
}
function burst(x, y, o) {
  const n = Math.ceil((o.n || 12) * (KG.lowEnd ? 0.6 : 1));
  const cols = o.colors || ['#ffe066', '#fff4b8', '#ffb02e', '#ffffff'];
  for (let i = 0; i < n; i++) {
    const p = allocP();
    const a = o.dir != null ? o.dir + (Math.random() - 0.5) * (o.spread || 1.2) : Math.random() * TAU;
    const sp = (o.speed || 220) * (0.35 + Math.random() * 0.8);
    p.on = true; p.x = x + (o.jit ? rand(-o.jit, o.jit) : 0); p.y = y + (o.jit ? rand(-o.jit, o.jit) : 0);
    p.vx = Math.cos(a) * sp; p.vy = Math.sin(a) * sp - (o.up || 0);
    p.max = o.life || 0.8; p.life = p.max * (0.7 + Math.random() * 0.5);
    p.size = (o.size || 6) * (0.6 + Math.random() * 0.7); p.color = cols[i % cols.length];
    p.shape = o.shape == null ? SH_STAR : o.shape; p.rot = Math.random() * TAU; p.vr = (Math.random() - 0.5) * 8;
    p.g = o.g == null ? 500 : o.g; p.drag = o.drag == null ? 0.97 : o.drag;
  }
}
function ring(x, y, color, r, life) {
  const p = allocP();
  p.on = true; p.x = x; p.y = y; p.vx = 0; p.vy = 0; p.max = p.life = life || 0.45; p.size = r || 40; p.color = color || '#fff';
  p.shape = SH_RING; p.rot = 0; p.vr = 0; p.g = 0; p.drag = 1;
}
/** 金幣飛向畫面上方的錢 */
function coinFly(x, y, n, tx, ty) {
  for (let i = 0; i < n; i++) {
    const p = allocP();
    p.on = true; p.x = x + rand(-10, 10); p.y = y + rand(-6, 6); p.vx = rand(-140, 140); p.vy = rand(-260, -120);
    p.max = p.life = 0.75 + i * 0.05; p.size = 7; p.color = '#ffd23f'; p.shape = SH_COIN; p.rot = 0; p.vr = 0; p.g = 0; p.drag = 0.9;
    p.tx = tx; p.ty = ty;
  }
}
function updateParts(dt) {
  for (let i = 0; i < PMAX; i++) {
    const p = parts[i];
    if (!p.on) continue;
    p.life -= dt;
    if (p.life <= 0) { p.on = false; continue; }
    if (p.shape === SH_COIN) {
      const k = 1 - p.life / p.max;
      if (k > 0.3) { const f = Math.min(1, (k - 0.3) * 4 * dt * 10); p.x = lerp(p.x, p.tx, f); p.y = lerp(p.y, p.ty, f); }
      else { p.x += p.vx * dt; p.y += p.vy * dt; p.vx *= 0.9; p.vy *= 0.9; }
      continue;
    }
    p.vy += p.g * dt;
    const d = Math.pow(p.drag, dt * 60);
    p.vx *= d; p.vy *= d;
    p.x += p.vx * dt; p.y += p.vy * dt;
    p.rot += p.vr * dt;
  }
}
function drawParts() {
  for (let i = 0; i < PMAX; i++) {
    const p = parts[i];
    if (!p.on) continue;
    const a = clamp(p.life / p.max, 0, 1);
    ctx.globalAlpha = p.shape === SH_SMOKE ? a * 0.5 : Math.min(1, a * 1.8);
    const c = Math.cos(p.rot), sn = Math.sin(p.rot);
    ctx.setTransform(dpr * c, dpr * sn, -dpr * sn, dpr * c, dpr * (p.x + shx), dpr * (p.y + shy));
    const s = p.size;
    ctx.fillStyle = p.color;
    if (p.shape === SH_STAR) { starPath(0, 0, s, s * 0.45, 0); ctx.fill(); }
    else if (p.shape === SH_SPARK) { sparkPath(0, 0, s); ctx.fill(); }
    else if (p.shape === SH_DOT) { ctx.beginPath(); circ(0, 0, s * a + 1); ctx.fill(); }
    else if (p.shape === SH_CONF) ctx.fillRect(-s / 2, -s / 3, s, s * 0.66);
    else if (p.shape === SH_CHUNK) { ctx.beginPath(); ctx.moveTo(-s, -s * 0.5); ctx.lineTo(s * 0.4, -s); ctx.lineTo(s, s * 0.3); ctx.lineTo(-s * 0.2, s); ctx.closePath(); ctx.fill(); }
    else if (p.shape === SH_SMOKE) { ctx.beginPath(); circ(0, 0, s * (1.6 - a * 0.6)); ctx.fill(); }
    else if (p.shape === SH_COIN) {
      ctx.setTransform(dpr, 0, 0, dpr, dpr * (p.x + shx), dpr * (p.y + shy));
      const sq = Math.abs(Math.cos(time * 9 + i));
      ctx.fillStyle = '#b07a0c'; ctx.beginPath(); ctx.ellipse(0, 1, s * Math.max(0.25, sq), s, 0, 0, TAU); ctx.fill();
      ctx.fillStyle = '#ffd84a'; ctx.beginPath(); ctx.ellipse(0, 0, s * Math.max(0.25, sq), s, 0, 0, TAU); ctx.fill();
    }
    else if (p.shape === SH_RING) { ctx.strokeStyle = p.color; ctx.lineWidth = 6 * a + 1; ctx.beginPath(); circ(0, 0, s * (0.3 + (1 - a))); ctx.stroke(); }
  }
  ctx.globalAlpha = 1;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
function clearParts() { for (const p of parts) p.on = false; }

/* ---------- 跳出來的字：每個玩家一格，新的會取代舊的，不會疊在一起 ---------- */
const POPS = [0, 1].map(() => ({ on: false, x: 0, y: 0, s: '', size: 22, color: '#fff', stroke: '#6b3d00', t: 0, life: 1.1 }));
function popText(slot, x, y, s, o) {
  o = o || {};
  const p = POPS[slot];
  p.on = true; p.x = x; p.y = y; p.s = s; p.size = o.size || 24; p.color = o.color || '#ffe14d'; p.stroke = o.stroke || '#6b3d00';
  p.t = 0; p.life = o.life || 1.15;
}
function updatePops(dt) { for (const p of POPS) if (p.on) { p.t += dt; p.y -= 9 * dt; if (p.t >= p.life) p.on = false; } }
function drawPops() {
  for (const p of POPS) {
    if (!p.on) continue;
    const k = p.t < 0.25 ? Ease.outBack(p.t / 0.25) : 1;
    ctx.globalAlpha = clamp((p.life - p.t) * 4, 0, 1);
    ctx.save(); ctx.translate(p.x, p.y); ctx.scale(k, k);
    const sz = fitSize(p.s, W * 0.44, p.size);
    txt(p.s, 0, 0, sz, p.color, { stroke: p.stroke, sw: sz * 0.28 });
    ctx.restore();
  }
  ctx.globalAlpha = 1;
}
/* 畫面中央的橫幅（一次一個） */
const banner = { on: false, s: '', sub: '', t: 0, life: 1.6, color: '#ffe14d' };
function showBanner(s, sub, o) { o = o || {}; banner.on = true; banner.s = s; banner.sub = sub || ''; banner.t = 0; banner.life = o.life || 1.6; banner.color = o.color || '#ffe14d'; }
function drawBanner() {
  if (!banner.on) return;
  const b = banner, k = b.t < 0.3 ? Ease.outBack(b.t / 0.3) : 1;
  const a = clamp((b.life - b.t) * 3, 0, 1);
  const cy = L.gy + (H - L.gy) * 0.38;
  ctx.globalAlpha = a;
  ctx.save(); ctx.translate(W / 2, cy); ctx.scale(k, k);
  const size = fitSize(b.s, W * 0.8, Math.min(46, W * 0.1));
  txt(b.s, 0, 0, size, b.color, { stroke: '#4a2608', sw: size * 0.26 });
  if (b.sub) { const s2 = fitSize(b.sub, W * 0.86, size * 0.45); txt(b.sub, 0, size * 0.85, s2, '#fff', { stroke: '#4a2608', sw: s2 * 0.3 }); }
  ctx.restore();
  ctx.globalAlpha = 1;
}

function rayHit(p) {
  const pv = L.piv[p.i];
  for (let d = restLen(p); d < 40; d += 0.2) {
    const x = pv.x + Math.sin(p.ang) * d * L.u, y = pv.y + Math.cos(p.ang) * d * L.u;
    if (x < 0 || x > W || y > H) return null;
    const it = hitTest(x, y);
    if (it) return it;
  }
  return null;
}
function demoUpdate(dt) {
  for (const p of players) {
    if (p.state !== 'swing') continue;
    p.autoT -= dt;
    if (p.autoT > 0) continue;
    const it = rayHit(p);
    if (it && it.kind !== 'tnt' && (it.kind !== 'rock' || Math.random() < 0.05)) {
      p.state = 'out'; p.throwT = 0.28; p.autoT = rand(1.2, 2.6);
      sfx('mm_shoot', { pan: panOf(L.piv[p.i].x), vol: 0.35 });

}

  perf: reset => { const r = { avg: perfStat.n ? +(perfStat.sum / perfStat.n).toFixed(2) : 0, max: +perfStat.max.toFixed(1), n: perfStat.n }; if (reset) { perfStat.n = 0; perfStat.sum = 0; perfStat.max = 0; } return r; }
};
})();
</script>
