<script type="module">
import * as THREE from 'three';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

let renderer = null;
try {
  renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('gl'), antialias: true, powerPreference: 'high-performance' });
} catch (e) {
  renderer = null;
}
if (!renderer) document.getElementById('msg').textContent = '這個遊戲需要支援 3D（WebGL）的瀏覽器，請換一個瀏覽器或裝置再試試看。';
else main();

function main() {
  const $ = id => document.getElementById(id);
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const lerp = (a, b, t) => a + (b - a) * t;
  const rand = (a, b) => a + Math.random() * (b - a);
  const smooth = t => t * t * (3 - 2 * t);
  const TAU = Math.PI * 2;

  /* =========================================================
   * 娃娃種類（單位：公分，臉朝 +z，y 往上）
   * ========================================================= */
  const S = 0.01;
  const GEO = {
    sph: new THREE.SphereGeometry(1, 18, 13),
    sphS: new THREE.SphereGeometry(1, 10, 7),
    cone: new THREE.ConeGeometry(1, 1, 14, 1),
    cyl: new THREE.CylinderGeometry(1, 1, 1, 14),
    arc: new THREE.TorusGeometry(1, 0.17, 5, 12, Math.PI)
  };
  const ZV = new THREE.Vector3(0, 0, 1);
  const qZ = d => new THREE.Quaternion().setFromUnitVectors(ZV, d.clone().normalize());
  class Builder {
    constructor() { this.items = []; }
    add(g, color, x, y, z, sx, sy, sz, rot, keep) { this.items.push({ g, color, x, y, z, sx, sy, sz, rot, keep: !!keep }); return this; }
    E(color, x, y, z, sx, sy, sz, rot, keep) { return this.add(GEO.sph, color, x, y, z, sx, sy, sz, rot, keep); }
    build() {
      let nv = 0, ni = 0;
      for (const it of this.items) { nv += it.g.attributes.position.count; ni += it.g.index.count; }
      const pos = new Float32Array(nv * 3), nor = new Float32Array(nv * 3), col = new Float32Array(nv * 3), keep = new Uint8Array(nv);
      const idx = nv > 65535 ? new Uint32Array(ni) : new Uint16Array(ni);
      const m = new THREE.Matrix4(), nm = new THREE.Matrix3(), q = new THREE.Quaternion(), e = new THREE.Euler(), v = new THREE.Vector3(), sc = new THREE.Vector3(), c = new THREE.Color();
      let vo = 0, io = 0;
      for (const it of this.items) {
        if (it.rot && it.rot.isQuaternion) q.copy(it.rot);
        else if (it.rot) q.setFromEuler(e.set(it.rot[0], it.rot[1], it.rot[2]));
        else q.identity();
        m.compose(v.set(it.x * S, it.y * S, it.z * S), q, sc.set(it.sx * S, it.sy * S, it.sz * S));
        nm.getNormalMatrix(m);
        c.setHex(it.color);
        const P = it.g.attributes.position, N = it.g.attributes.normal, I = it.g.index;
        for (let i = 0; i < P.count; i++) {
          v.fromBufferAttribute(P, i).applyMatrix4(m);
          pos[(vo + i) * 3] = v.x; pos[(vo + i) * 3 + 1] = v.y; pos[(vo + i) * 3 + 2] = v.z;
          v.fromBufferAttribute(N, i).applyMatrix3(nm).normalize();
          nor[(vo + i) * 3] = v.x; nor[(vo + i) * 3 + 1] = v.y; nor[(vo + i) * 3 + 2] = v.z;
          col[(vo + i) * 3] = c.r; col[(vo + i) * 3 + 1] = c.g; col[(vo + i) * 3 + 2] = c.b;
          keep[vo + i] = it.keep ? 1 : 0;
        }
        for (let i = 0; i < I.count; i++) idx[io + i] = I.getX(i) + vo;
        vo += P.count; io += I.count;
      }
      const g = new THREE.BufferGeometry();
      g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
      g.setAttribute('normal', new THREE.BufferAttribute(nor, 3));
      g.setAttribute('color', new THREE.BufferAttribute(col, 3));
      g.setIndex(new THREE.BufferAttribute(idx, 1));
      g.computeBoundingSphere();
      g.userData.keep = keep;
      return g;
    }
  }
  const INK = 0x2a1a2a, BLUSH = 0xff8fb0;
  // 在球面上放五官：a、b 是水平／垂直位置（-1~1）
  function surf(cx, cy, cz, R, a, b, k) {
    const d = new THREE.Vector3(a, b, Math.sqrt(Math.max(0.03, 1 - a * a - b * b))).normalize();
    return { x: cx + d.x * R * k, y: cy + d.y * R * k, z: cz + d.z * R * k, q: qZ(d) };
  }

        if (c.slip && c.slip.stage === 'carry' && 1 - d / c.carry0 >= c.slip.at) doSlip();
        if (d < 0.004 && Math.hypot(c.vx, c.vz) < 0.02) { c.phase = 'release'; c.t = 0; }
        break;
      }
      case 'release': {
        if (c.t > 0.35) { openAll(2.2); if (c.held.length) { releaseHeld(); KG.note(700, 0.06, 'square', 0.04); } }
        if (c.t > 1.7) endPlay();
        break;
      }
    }
    // 天車移動（有加速度，讓夾子會晃）
    const ax = clamp(tvx - c.vx, -accel * dt, accel * dt), az = clamp(tvz - c.vz, -accel * dt, accel * dt);
    c.vx += ax; c.vz += az;
    c.x = clamp(c.x + c.vx * dt, -RX, RX); c.z = clamp(c.z + c.vz * dt, -RZ, RZ);
    if (c.x <= -RX || c.x >= RX) c.vx = 0;
    if (c.z <= -RZ || c.z >= RZ) c.vz = 0;
    const accX = dt > 0 ? ax / dt : 0, accZ = dt > 0 ? az / dt : 0;

    const moving = Math.hypot(c.vx, c.vz) > 0.03 || c.phase === 'drop' || (c.phase === 'lift' && c.t > 0.3 && c.y < TOPY);

      humT -= dt;

  /* ---------- 輸入 ---------- */
  const joy = $('joy'), knob = $('knob');

    step: n => { for (let i = 0; i < (n || 1); i++) update(1 / 60); bodies.forEach(syncBody); return claw.phase; },
    setCoins: n => { save.coins = n; persist(); updateHUD(true); },
    spawn: (kind, x, z, gold, y) => { const ki = typeof kind === 'number' ? kind : Math.max(0, KINDS.findIndex(k => k.id === kind)); return spawnBody(ki, !!gold, x == null ? 0.1 : x, y == null ? 0.6 : y, z == null ? 0 : z, randQuat()).id; },
    reset: (m, count) => { if (m != null) { machine = m; M = MACHINES[m]; applyTheme(M); } releaseHeld(); claw.phase = 'idle'; buildPile(M, count); },
    closeCard: () => { closePrize(); const n = $('nocoin'); if (n) n.remove(); },
    physicsStats: () => {
      let awake = 0, maxV = 0, outside = 0, minY = 9, maxY = -9; const outList = [];
      for (const b of bodies) if (!b.asleep) awake++;
      for (const p of parts) {
        const v = Math.hypot(p.vx, p.vy, p.vz); if (v > maxV) maxV = v;
        if (!isFinite(p.x + p.y + p.z)) outside++;
        else if (Math.abs(p.x) > HW + 0.002 || Math.abs(p.z) > HD + 0.002 || p.y > CEIL + 0.002 || (p.y < p.r - 0.01 && !(p.x < HX1 && p.z > HZ0))) { outside++; outList.push([p.x, p.y, p.z, p.r, p.b.held, p.b.asleep, claw.phase].map(v => typeof v === 'number' ? +v.toFixed(3) : v)); }
        minY = Math.min(minY, p.y); maxY = Math.max(maxY, p.y);
      }
      return { bodies: bodies.length, particles: parts.length, awake, sleeping: bodies.length - awake, held: claw.held.length, maxSpeed: +maxV.toFixed(3), nan: stats.nan, outside, minY: +minY.toFixed(3), maxY: +maxY.toFixed(3), slips: stats.slips || 0, wins: stats.wins || 0, outList };
    },
    bodies: () => bodies.map(b => { bodyCOM(b, _c); return { id: b.id, kind: KINDS[b.kind].id, gold: b.gold, x: +_c.x.toFixed(3), y: +_c.y.toFixed(3), z: +_c.z.toFixed(3), asleep: b.asleep }; }),
    bestTarget: () => {
      // 找一隻上面沒被壓住、不靠牆的娃娃
      let best = null, bs = -1e9;
      for (const b of bodies) {
        bodyCOM(b, _c);
        if (Math.abs(_c.x) > RX || Math.abs(_c.z) > RZ) continue;
        if (_c.x < HX1 + 0.08 && _c.z > HZ0 - 0.08) continue;
        let cover = 0;
        for (const p of parts) if (p.b !== b && Math.hypot(p.x - _c.x, p.z - _c.z) < 0.09 && p.y > _c.y + 0.03) cover++;
        const s = _c.y - cover * 0.2 - Math.hypot(_c.x - 0.0, _c.z) * 0.05;
        if (s > bs) { bs = s; best = { id: b.id, x: _c.x, z: _c.z, y: _c.y }; }
      }
      return best;
    },
    view: m => { viewMode = m || (viewMode === 'front' ? 'side' : 'front'); viewBlend = viewMode === 'side' ? 1 : 0; },
    tune: o => { Object.assign(M, o); return { strength: M.strength, loosen: M.loosen }; },
    quality: n => { qLevel = clamp(n, 0, QLEVELS.length - 1); perf.cool = 1e9; applyQuality(); },
    parts: () => bodies.map(b => ({ id: b.id, asleep: b.asleep, sleepT: +b.sleepT.toFixed(2), ps: b.ps.map(p => [p.x, p.y, p.z, p.r, p.vx, p.vy, p.vz].map(v => +v.toFixed(3))) })),
    joy: (x, y) => { input.jx = x; input.jy = y; },
    camAt: (p, t) => { camOverride = p ? [p, t] : null; },
    cam: () => ({ camFit, rect, pos: camera.position.toArray().map(v => +v.toFixed(3)) }),
    info: () => ({ calls: renderer.info.render.calls, tris: renderer.info.render.triangles })
  };
}
</script>
