<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>夜市大亨</title>
<link rel="stylesheet" href="../../assets/common.css">
<style>
  :root {
    --ink: #2b2231; --paper: #fbf6ee; --paper2: #f2e9dc; --line: #e2d4c1; --muted: #7b6d77;
    --red: #cf4a2c; --red2: #a83820; --gold: #e2a93b; --teal: #2a8a84; --navy: #141a2e; --green: #3c8f57;
    --ui: "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", "Heiti TC", system-ui, sans-serif;
  }
  html, body { height: 100%; overflow: hidden; background: #141a2e; overscroll-behavior: none; }
  body { font-family: var(--ui); font-size: 14px; color: var(--ink); }
  #cv { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; outline: none; }
  button { font-family: var(--ui); color: inherit; }
  .hide { display: none !important; }

  /* ---------- 上方資訊 ---------- */
  #hud { position: fixed; top: 8px; left: 64px; right: 64px; z-index: 50; display: flex; flex-wrap: wrap; justify-content: center; gap: 5px; pointer-events: none; }
  .chip { pointer-events: auto; background: rgba(18, 22, 38, 0.82); color: #f7eddc; border: 1px solid rgba(255, 214, 150, 0.22);
    border-radius: 12px; height: 32px; padding: 0 10px; font-size: 13px; display: flex; align-items: center; gap: 6px; white-space: nowrap; }
  .chip b { font-weight: 700; color: #ffd98a; }
  .chip .sm { font-size: 11px; opacity: 0.75; }
  .chip.mk { padding: 0 2px; }
  .chip.mk button { background: none; border: 0; color: #ffd98a; width: 28px; height: 30px; font-size: 13px; cursor: pointer; padding: 0; }
  .chip.mk button:disabled { opacity: 0.25; }
  .chip.mk .mkname { cursor: pointer; padding: 0 2px; display: flex; gap: 5px; align-items: center; }
  .chip.ev { color: #ffe2b8; }
  .chip.ev.bad { background: rgba(70, 30, 34, 0.86); }
  .chip.ev.good { background: rgba(28, 58, 44, 0.86); }
  .stars { color: #ffcc55; letter-spacing: -1px; font-size: 12px; }

  /* ---------- 右側按鈕 ---------- */
  #pauseBtn { position: fixed; right: 11px; top: 84px; width: 46px; height: 46px; z-index: 60; border-radius: 14px; border: 1px solid rgba(255, 214, 150, 0.3);
    background: rgba(18, 22, 38, 0.85); color: #ffe7bd; font-size: 18px; font-weight: 800; cursor: pointer; display: grid; place-items: center; }
  #pauseBtn svg { width: 20px; height: 20px; }

  /* ---------- 下方工具列 ---------- */
  #bar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 70; display: flex; align-items: flex-end; justify-content: center; gap: 6px;
    padding: 18px 8px calc(8px + env(safe-area-inset-bottom)); background: linear-gradient(rgba(12, 14, 26, 0), rgba(12, 14, 26, 0.9) 42%); pointer-events: none; }
  #bar > * { pointer-events: auto; }
  .tb { width: 54px; height: 52px; border-radius: 14px; border: 1px solid rgba(255, 214, 150, 0.2); background: rgba(30, 34, 54, 0.92); color: #f3e6cf;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-size: 11px; cursor: pointer; position: relative; padding: 0; }
  .tb svg { width: 20px; height: 20px; }
  .tb .dot { position: absolute; top: 5px; right: 8px; width: 8px; height: 8px; border-radius: 50%; background: #ff6a4a; }
  .primary { white-space: nowrap; height: 52px; min-width: 120px; padding: 0 16px; border-radius: 16px; border: 0; cursor: pointer; font-size: 16px; font-weight: 800; color: #fff;
    background: linear-gradient(180deg, #e8653f, #b93b20); box-shadow: 0 4px 0 #7f2512, 0 8px 18px rgba(0, 0, 0, 0.35); display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1.15; }
  .primary small { font-size: 11px; font-weight: 600; opacity: 0.85; }
  .primary:active { transform: translateY(3px); box-shadow: 0 1px 0 #7f2512; }
  .seg { display: flex; background: rgba(30, 34, 54, 0.94); border-radius: 14px; border: 1px solid rgba(255, 214, 150, 0.2); overflow: hidden; height: 46px; }
  .seg button { width: 50px; border: 0; background: none; color: #e9dcc5; font-size: 15px; font-weight: 800; cursor: pointer; }
  .seg button.on { background: #e2a93b; color: #2b1d0d; }
  .nstat { background: rgba(30, 34, 54, 0.94); border-radius: 14px; border: 1px solid rgba(255, 214, 150, 0.2); color: #f3e6cf; height: 46px; padding: 0 12px;
    display: flex; flex-direction: column; justify-content: center; font-size: 12px; line-height: 1.35; min-width: 118px; }
  .nstat b { color: #ffd98a; }

  /* ---------- 底部面板 ---------- */
  #sheet { position: fixed; left: 50%; bottom: 0; width: min(100%, 560px); max-height: 62%; z-index: 200; background: var(--paper); border-radius: 20px 20px 0 0;
    box-shadow: 0 -10px 40px rgba(0, 0, 0, 0.45); display: flex; flex-direction: column; transform: translate(-50%, 105%); transition: transform 0.22s ease; visibility: hidden; }
  #sheet.open { transform: translate(-50%, 0); visibility: visible; }
  .sh-head { display: flex; align-items: center; gap: 10px; padding: 10px 12px 8px 16px; border-bottom: 1px solid var(--line); flex: none; }
  .sh-head .grab { position: absolute; left: 50%; top: 5px; width: 40px; height: 4px; margin-left: -20px; border-radius: 2px; background: #d8c9b4; }
  .sh-title { flex: 1; min-width: 0; }
  .sh-title h3 { margin: 0; font-size: 17px; line-height: 1.25; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .sh-title .sub { font-size: 12px; color: var(--muted); }
  .xbtn { width: 38px; height: 38px; border-radius: 12px; border: 1px solid var(--line); background: #fff; font-size: 18px; cursor: pointer; flex: none; color: var(--ink); }
  .sh-body { overflow-y: auto; padding: 10px 14px calc(16px + env(safe-area-inset-bottom)); -webkit-overflow-scrolling: touch; overscroll-behavior: contain; }
  @media (orientation: landscape) and (max-height: 600px) {
    #sheet { left: auto; right: 0; top: 0; bottom: 0; max-height: none; width: min(400px, 52%); border-radius: 20px 0 0 20px; transform: translateX(105%); }
    #sheet.open { transform: none; }
    .sh-head { padding-right: 66px; }
    .sh-head .grab { display: none; }
  }
  .sec { margin: 4px 0 12px; }
  .sec h4 { margin: 0 0 6px; font-size: 13px; color: var(--muted); font-weight: 700; display: flex; justify-content: space-between; align-items: baseline; }
  .row { display: flex; align-items: center; gap: 8px; padding: 7px 0; border-bottom: 1px dashed var(--line); }
  .row:last-child { border-bottom: 0; }
  .row .grow { flex: 1; min-width: 0; }
  .row .t { font-weight: 700; font-size: 14px; }
  .row .d { font-size: 12px; color: var(--muted); line-height: 1.35; }
  .btn { height: 36px; padding: 0 12px; border-radius: 11px; border: 0; cursor: pointer; font-size: 13px; font-weight: 700; background: var(--teal); color: #fff; white-space: nowrap; flex: none; }
  .btn.red { background: var(--red); }
  .btn.gold { background: var(--gold); color: #2b1d0d; }
  .btn.ghost { background: #fff; color: var(--ink); border: 1px solid var(--line); }
  .btn:disabled { background: #d9d0c4; color: #8c8079; cursor: default; }
  .stats3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
  .stat { background: var(--paper2); border-radius: 12px; padding: 7px 8px; }
  .stat .k { font-size: 11px; color: var(--muted); }
  .stat .v { font-size: 15px; font-weight: 800; }
  .price { display: flex; align-items: center; gap: 10px; background: var(--paper2); border-radius: 14px; padding: 8px; }
  .price .pb { width: 44px; height: 44px; border-radius: 12px; border: 1px solid var(--line); background: #fff; font-size: 22px; font-weight: 800; cursor: pointer; color: var(--ink); }
  .price .pv { flex: 1; text-align: center; }
  .price .pv .big { font-size: 22px; font-weight: 800; }
  .meter { height: 6px; border-radius: 3px; background: #e5dacb; overflow: hidden; margin-top: 4px; }
  .meter i { display: block; height: 100%; background: var(--teal); }
  .tag { display: inline-block; font-size: 11px; padding: 2px 7px; border-radius: 8px; background: #e9f3ef; color: #24695f; margin: 2px 3px 0 0; }
  .tag.neg { background: #f8e6e1; color: #a0391f; }
  .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
  .bcard { border: 1px solid var(--line); background: #fff; border-radius: 14px; padding: 8px; display: flex; gap: 8px; cursor: pointer; text-align: left; align-items: flex-start; }
  .bcard img { width: 42px; height: 42px; flex: none; border-radius: 10px; background: #2a2433; }
  .bcard .t { font-weight: 800; font-size: 14px; }
  .bcard .d { font-size: 11px; color: var(--muted); line-height: 1.35; }
  .bcard .c { font-size: 12px; font-weight: 800; color: var(--red2); }
  .bcard.lock { opacity: 0.5; cursor: default; }
  .bcard.poor .c { color: #9b8f88; }
  .note { font-size: 12px; color: var(--muted); line-height: 1.5; }
  .warn { background: #fff1e6; border: 1px solid #f2c9a8; color: #8a3a14; border-radius: 12px; padding: 8px 10px; font-size: 12px; margin-bottom: 10px; }
  .lvl { font-size: 11px; color: var(--muted); }
  .pips { color: var(--gold); letter-spacing: 1px; }

  /* ---------- 置中卡片 ---------- */
  #modal { position: fixed; inset: 0; z-index: 300; display: none; align-items: center; justify-content: center; padding: 12px; background: rgba(8, 10, 20, 0.58); }
  #modal.show { display: flex; }
  @media (max-width: 700px) { #modal { padding-top: 66px; } }
  #modal.clear { background: linear-gradient(rgba(8, 10, 20, 0.15), rgba(8, 10, 20, 0.55)); }
  .card { background: var(--paper); border-radius: 22px; width: 100%; max-width: 540px; max-height: 100%; display: flex; flex-direction: column; overflow: hidden; box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5); }
  .card-head { padding: 14px 18px 8px; flex: none; }
  .card-head h2 { margin: 0; font-size: 20px; }
  .card-head .sub { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .card-body { overflow-y: auto; padding: 4px 18px 12px; -webkit-overflow-scrolling: touch; overscroll-behavior: contain; }
  .card-foot { flex: none; display: flex; gap: 8px; padding: 10px 14px calc(12px + env(safe-area-inset-bottom)); border-top: 1px solid var(--line); flex-wrap: wrap; }
  .card-foot .btn { flex: 1; height: 46px; font-size: 15px; }
  .fin { width: 100%; border-collapse: collapse; font-size: 13px; }
  .fin td { padding: 4px 0; border-bottom: 1px dashed var(--line); }
  .fin td:last-child { text-align: right; font-weight: 700; font-variant-numeric: tabular-nums; }
  .fin tr.total td { border-bottom: 0; font-size: 16px; padding-top: 7px; }
  .pos { color: #2d7a48; } .negc { color: #b6381c; }
  .quote { background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 7px 10px; margin-bottom: 6px; font-size: 13px; }
  .quote .who { font-size: 11px; color: var(--muted); }
  .chartbox { background: #1d2236; border-radius: 14px; padding: 6px; }
  .chartbox canvas { width: 100%; height: 150px; display: block; }

  /* 標題畫面 */
  .title { background: rgba(16, 19, 34, 0.86); color: #f6ead6; border: 1px solid rgba(255, 210, 140, 0.25); border-radius: 26px; width: 100%; max-width: 460px;
    padding: 20px 20px 16px; text-align: center; box-shadow: 0 24px 70px rgba(0, 0, 0, 0.55); max-height: 100%; overflow-y: auto; }
  .title h1 { margin: 0; font-size: 44px; letter-spacing: 6px; color: #ffd27a; text-shadow: 0 3px 0 #9c3a1c, 0 0 24px rgba(255, 150, 60, 0.45); font-weight: 900; }
  .title .tag2 { font-size: 13px; color: #e8cfa8; margin: 4px 0 14px; letter-spacing: 1px; }
  .title .tbtns { display: grid; gap: 8px; }
  .title .tbtns .btn { height: 46px; font-size: 16px; }
  .title .mini { display: flex; gap: 8px; margin-top: 10px; }
  .title .mini .btn { flex: 1; height: 38px; background: rgba(255, 255, 255, 0.08); color: #f3e3c8; border: 1px solid rgba(255, 220, 160, 0.25); }
  .title .mini .btn.on { background: rgba(42, 138, 132, 0.85); }
  .title .rec { font-size: 12px; color: #cdb898; margin-top: 10px; }
  @media (orientation: landscape) and (max-height: 520px) {
    .title { max-width: 720px; display: grid; grid-template-columns: 1fr 1fr; gap: 6px 18px; text-align: left; padding: 16px 18px; align-items: center; }
    .title h1 { font-size: 38px; }
    .title .tbtns { grid-row: span 3; }
    .title .mini, .title .rec { grid-column: 1; }
    .title .tag2 { margin-bottom: 0; }
  }
  .help h4 { margin: 12px 0 4px; font-size: 14px; color: var(--red2); }
  .help p, .help li { font-size: 13px; line-height: 1.6; margin: 0; }
  .help ul { padding-left: 18px; margin: 0; }
  .menu-list { display: grid; gap: 8px; padding: 6px 0 4px; }
  .menu-list .btn { height: 46px; font-size: 15px; }
  .two { display: flex; gap: 8px; }
  .two .btn { flex: 1; }

  /* 訊息橫幅（一次只顯示一則） */
  #banner { position: fixed; left: 50%; top: 92px; transform: translate(-50%, -12px); z-index: 250; max-width: min(92vw, 520px); background: rgba(24, 20, 34, 0.94); color: #fff3df;
    border: 1px solid rgba(255, 205, 120, 0.45); border-radius: 14px; padding: 9px 14px; font-size: 14px; line-height: 1.4; opacity: 0; pointer-events: none; transition: opacity 0.2s, transform 0.2s; text-align: center; }
  #banner.show { opacity: 1; transform: translate(-50%, 0); }
  #banner.good { border-color: rgba(120, 220, 160, 0.6); }
  #banner.bad { border-color: rgba(255, 120, 100, 0.7); }
  #banner small { display: block; font-size: 12px; opacity: 0.8; }
</style>
</head>
<body>
<canvas id="cv" tabindex="0" aria-label="夜市大亨：經營夜市攤位的模擬遊戲"></canvas>

<div id="hud" class="hide">
  <div class="chip mk"><button id="mkPrev" aria-label="上一個夜市">◀</button><span class="mkname" id="mkName"></span><button id="mkNext" aria-label="下一個夜市">▶</button></div>
  <div class="chip" id="hTime"></div>
  <div class="chip" id="hCash"></div>
  <div class="chip ev" id="hEv"></div>
</div>
<button id="pauseBtn" class="hide" aria-label="暫停／選單"></button>

<div id="bar" class="hide"></div>

<div id="sheet" role="dialog" aria-modal="false">
  <div class="sh-head"><span class="grab"></span><div class="sh-title"><h3 id="shTitle"></h3><div class="sub" id="shSub"></div></div><button class="xbtn" id="shClose" aria-label="關閉">✕</button></div>
  <div class="sh-body" id="shBody"></div>
</div>

<div id="modal"></div>
<div id="banner"></div>

<script src="../../assets/common.js"></script>
<script src="../../assets/kg-music.js"></script>
<script>
'use strict';
/* =====================================================================
 * 夜市大亨：小工具與遊戲資料
 * ===================================================================== */
const SLUG = 'market-tycoon';
const $ = (id) => document.getElementById(id);
const clamp = (x, a, b) => (x < a ? a : x > b ? b : x);
const rand = (a, b) => a + Math.random() * (b - a);
const ri = (a, b) => Math.floor(a + Math.random() * (b - a + 1));
const pick = (a) => a[Math.floor(Math.random() * a.length)];
const esc = (s) => String(s).replace(/[&<>"]/g, (ch) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[ch]));

/** 金額：一萬以下用逗號，一萬以上用「萬」 */
function fmt(n) {
  n = Math.round(n);
  const sign = n < 0 ? '−' : '';
  n = Math.abs(n);
  if (n >= 10000) {
    const v = n / 10000;
    let s = v >= 100 ? v.toFixed(0) : v >= 10 ? v.toFixed(1) : v.toFixed(2);
    if (s.indexOf('.') >= 0) s = s.replace(/0+$/, '').replace(/\.$/, '');
    return sign + 'NT$' + s + '萬';
  }
  return sign + 'NT$' + n.toLocaleString('en-US');
}
function fmtFull(n) { n = Math.round(n); return (n < 0 ? '−' : '') + 'NT$' + Math.abs(n).toLocaleString('en-US'); }
function starStr(r) {
  const full = clamp(Math.round(r), 0, 5);
  return '★★★★★'.slice(0, full) + '☆☆☆☆☆'.slice(0, 5 - full);
}

const NIGHT_LEN = 180;      // 一晚（1× 速度）幾秒
const GATE = 0.75;          // 街道兩端牌樓的長度（格）
const MAX_STAFF = 3;
const QCAP = [0, 4, 6, 8];  // 排隊空間等級 → 可排人數
const EQ_SPD = [0, 1, 1.3, 1.6, 1.9];
const CATS = { fried: '炸物', drink: '飲料', dessert: '甜品', grill: '燒烤', savory: '小吃', snack: '點心', game: '遊戲' };
const FOODCAT = { fried: 1, grill: 1, savory: 1, snack: 1 };

/* 攤位種類：build 建造費、ref 建議售價、cost 每份食材、time 每份出餐秒數 */
const TYPES = {
  jipai:   { n: '雞排', shop: '金脆雞排', cat: 'fried', build: 6000, ref: 80, cost: 34, time: 3.2, col: '#d9822b', col2: '#f6e3c4', desc: '大片酥脆，學生和上班族都愛。' },
  boba:    { n: '珍奶', shop: '黑糖波波', cat: 'drink', build: 7000, ref: 60, cost: 20, time: 2.3, col: '#7c5338', col2: '#f2e4d2', desc: '飲料攤：放在炸物旁邊互相加成。' },
  stinky:  { n: '臭豆腐', shop: '巷口臭豆腐', cat: 'fried', build: 6500, ref: 70, cost: 24, time: 3.4, col: '#5f8a4a', col2: '#eef2df', desc: '酥炸外皮配台式泡菜，香氣會招客。' },
  sausage: { n: '大腸包小腸', shop: '炭烤大腸包', cat: 'grill', build: 7500, ref: 70, cost: 28, time: 3.4, col: '#b3473a', col2: '#f7e2da', desc: '炭火現烤，觀光客必點。' },
  corn:    { n: '烤玉米', shop: '炭香烤玉米', cat: 'grill', build: 5500, ref: 90, cost: 36, time: 4.0, col: '#d6a42a', col2: '#fbf0cf', desc: '刷醬慢烤，出餐慢但客單價高。' },
  ballsy:  { n: '地瓜球', shop: 'ＱＱ地瓜球', cat: 'snack', build: 4500, ref: 40, cost: 12, time: 2.5, col: '#d97a3a', col2: '#fbe7d4', desc: '便宜快速，小朋友和學生最愛。' },
  douhua:  { n: '豆花', shop: '古早味豆花', cat: 'dessert', build: 5000, ref: 45, cost: 14, time: 2.0, col: '#b49a6e', col2: '#f6efe0', desc: '甜品：吃完鹹的會想來一碗。' },
  oyster:  { n: '蚵仔煎', shop: '海口蚵仔煎', cat: 'savory', build: 9000, ref: 80, cost: 33, time: 4.2, col: '#3f739f', col2: '#e2edf6', desc: '經典台式小吃，長輩和觀光客最捧場。', req: 'menu1' },
  saltchk: { n: '鹹酥雞', shop: '香酥鹹酥雞', cat: 'fried', build: 10000, ref: 110, cost: 46, time: 3.8, col: '#c2502e', col2: '#f8e2d6', desc: '客單價最高的炸物，配飲料最對味。', req: 'menu1' },
  aiyu:    { n: '檸檬愛玉', shop: '青檸愛玉', cat: 'drink', build: 4800, ref: 50, cost: 14, time: 1.9, col: '#7fae45', col2: '#eef6df', desc: '清爽解膩，悶熱的晚上特別好賣。', req: 'menu1' },
  balloon: { n: '射氣球', shop: '神準射氣球', cat: 'game', build: 8000, ref: 60, cost: 14, time: 5.0, col: '#cc4a78', col2: '#fbe3ec', desc: '遊戲攤：家庭和情侶最愛，不怕吃飽。', req: 'menu2' },
  claw:    { n: '夾娃娃', shop: '好運夾娃娃', cat: 'game', build: 12000, ref: 20, cost: 6, time: 2.6, col: '#6c55c0', col2: '#ebe6fb', desc: '自助機台不用顧攤；客人常會連玩好幾次。', req: 'menu2', noStaff: true },
  seat:    { n: '座位區', fac: true, build: 3000, col: '#57708a', desc: '附近兩格內買了吃的客人會坐下來吃：滿意度提高、少丟垃圾。' },
  trash:   { n: '垃圾桶站', fac: true, build: 1500, col: '#4c7d5d', desc: '一般垃圾、資源回收、廚餘分類桶：附近兩格的地面會保持乾淨。' },
  light:   { n: '燈籠架', fac: true, build: 2500, col: '#b23a2a', desc: '左右相鄰的攤位更顯眼（吸客 +12%），也讓客人心情更好。' }
};
const STALL_IDS = ['jipai', 'boba', 'stinky', 'sausage', 'corn', 'ballsy', 'douhua', 'oyster', 'saltchk', 'aiyu', 'balloon', 'claw'];
const FAC_IDS = ['seat', 'trash', 'light'];

function wageOf(skill) { return Math.round((400 + 200 * skill) / 10) * 10; }
function newStall(type) {
  const T = TYPES[type];
  if (T.fac) return { type, inv: T.build };
  return { type, price: T.ref, q: 1, eq: 1, ql: 1, staff: [], inv: T.build, rating: 3, life: 0, lifeRev: 0 };
}
function makeStaff(skill, name) {
  const w = Math.round(wageOf(skill) * rand(0.92, 1.08) / 10) * 10;
  return { id: G.sid++, name: name || pick(NAMES), skill, wage: w, xp: 0 };
}
function refreshCands() {
  G.cands = [];
  const used = new Set();
  allStaff().forEach((s) => used.add(s.name));
  for (let i = 0; i < 4; i++) {
    const r = Math.random();
    const sk = r < 0.3 ? 1 : r < 0.64 ? 2 : r < 0.86 ? 3 : r < 0.97 ? 4 : 5;
    let nm = pick(NAMES), guard = 0;
    while (used.has(nm) && guard++ < 20) nm = pick(NAMES);
    used.add(nm);
    G.cands.push(makeStaff(sk, nm));
  }
}

/* ---------- 查詢 ---------- */
function eachStall(fn) {
  G.markets.forEach((mk, m) => { if (!mk.open) return; mk.lots.forEach((s, k) => { if (s && !TYPES[s.type].fac) fn(s, m, k); }); });
}
function stallCount() { let n = 0; eachStall(() => n++); return n; }
function allStaff() { const a = []; if (G) eachStall((s) => s.staff.forEach((p) => a.push(p))); return a; }
function staffCount() { return allStaff().length; }
function assets() { let a = 0; G.markets.forEach((mk) => mk.lots.forEach((s) => { if (s) a += s.inv; })); return a; }
function netWorth() { return G.cash - G.loan + assets() * 0.6; }
function loanLimit() { return Math.floor((60000 + assets() * 0.4) / 10000) * 10000; }
function has(r) { return !!(G && G.research[r]); }
function qMax() { return has('master') ? 5 : 4; }
function nightWages() { let w = 0; eachStall((s) => s.staff.forEach((p) => { w += p.wage; })); return w; }
function weeklyRent() { let r = 0; G.markets.forEach((mk, m) => { if (!mk.open) return; mk.lots.forEach((s) => { if (s) r += MARKETS[m].rent; }); }); return r; }
function isRentNight(n) { return n % 7 === 0; }
function unlockedType(id) { const T = TYPES[id]; return !T.req || has(T.req); }

function unitCost(s) {
  const T = TYPES[s.type];
  let c = T.cost * (1 + 0.08 * (s.q - 1));
  if (has('bulk')) c *= 0.92;
  if (has('farm')) c *= 0.9;
  if (G.ev && G.ev.id === 'spike' && G.ev.cat === T.cat) c *= has('farm') ? 1.25 : 1.5;
  return c;
}
function staffFactor(s) {
  const T = TYPES[s.type];
  if (T.noStaff) return 1 + 0.15 * s.staff.length;
  if (!s.staff.length) return 0;
  const sk = s.staff.map((p) => p.skill).sort((a, b) => b - a), w = [1, 0.65, 0.45];
  let f = 0;
  sk.forEach((v, i) => { f += w[i] * (0.55 + 0.15 * v); });
  return f;
}
function serviceTime(s) {
  const f = staffFactor(s);
  if (!f) return Infinity;
  return TYPES[s.type].time / (EQ_SPD[s.eq] * f * (has('pay') ? 1.12 : 1));
}
function fairPrice(m, s) { return TYPES[s.type].ref * MARKETS[m].tol * (0.85 + 0.15 * s.q); }
function qcap(s) { return QCAP[s.ql] + (has('ticket') ? 1 : 0); }
function upCost(s, what) {
  const b = TYPES[s.type].build;
  if (what === 'q') return s.q >= qMax() ? 0 : Math.round(b * [0, 0.45, 0.8, 1.25, 1.8][s.q] / 100) * 100;
  if (what === 'eq') return s.eq >= 4 ? 0 : Math.round(b * [0, 0.55, 0.95, 1.5][s.eq] / 100) * 100;
  if (what === 'ql') return s.ql >= 3 ? 0 : [0, 1500, 4000][s.ql];
  return 0;
}
function priceFeel(m, s) {
  const r = s.price / fairPrice(m, s);
  if (r < 0.8) return ['很便宜', '#2d7a48'];
  if (r < 0.97) return ['划算', '#2d7a48'];
  if (r <= 1.08) return ['合理', '#2a6f8a'];
  if (r <= 1.25) return ['偏貴', '#b66a12'];
  return ['太貴', '#b6381c'];
}

/* ---------- 相鄰關係（加成） ---------- */
function lotSide(m, k) { return k < MARKETS[m].per ? 0 : 1; }
function lotIdx(m, k) { return k % MARKETS[m].per; }
function neighbors(m, k, range) {
  const n = MARKETS[m].per, side = lotSide(m, k), i = lotIdx(m, k), out = [];
  for (let sd = 0; sd < 2; sd++) for (let d = -range; d <= range; d++) {
    const j = i + d;
    if (j < 0 || j >= n) continue;
    if (sd === side && d === 0) continue;
    if (sd !== side && Math.abs(d) > Math.max(0, range - 1)) continue; // 對面只算正對面（範圍 2 時也算斜對面）
    out.push(sd * n + j);
  }
  return out;
}
const DRINKISH = { drink: 1, dessert: 1 };
let SYN = [];  // SYN[m][k] = { mult, sat, tags:[], lit, seats:[], trash }
function recalcSyn() {
  SYN = G.markets.map((mk, m) => mk.lots.map((s, k) => {
    const o = { mult: 1, sat: 0, tags: [], lit: false, seats: [], trash: false };
    if (!s) return o;
    let bonus = 0;
    neighbors(m, k, 1).forEach((j) => {
      const t = mk.lots[j];
      if (!t) return;
      if (t.type === 'light') o.lit = true;
      if (TYPES[t.type].fac || TYPES[s.type].fac) return;
      const a = TYPES[s.type].cat, b = TYPES[t.type].cat;
      if ((DRINKISH[a] && FOODCAT[b]) || (FOODCAT[a] && DRINKISH[b])) { bonus += 0.15; o.tags.push(['+15% 旁邊有' + CATS[b] + '（' + TYPES[t.type].n + '）', 1]); }
      else if (t.type === s.type) { bonus -= 0.15; o.tags.push(['−15% 同類競爭（' + TYPES[t.type].n + '）', 0]); }
    });
    neighbors(m, k, 2).forEach((j) => {
      const t = mk.lots[j];
      if (!t) return;
      if (t.type === 'seat') o.seats.push(j);
      if (t.type === 'trash') o.trash = true;
    });
    bonus = clamp(bonus, -0.3, 0.3);
    if (o.lit) { bonus += 0.12; o.sat += 0.25; o.tags.push(['+12% 燈籠照明', 1]); }
    if (o.seats.length && !TYPES[s.type].fac && TYPES[s.type].cat !== 'game') o.tags.push(['座位區：客人可以坐著吃', 1]);
    if (o.trash) o.tags.push(['垃圾桶在附近：地面乾淨', 1]);
    o.mult = 1 + bonus;
    return o;
  }));
}

/** 白天蓋好或拆掉攤位後：重建座位、垃圾桶資料，但保留建造動畫 */

function profile(x, late) {
  if (x > 0.97) return 0;
  let p = 0.3 + 1.6 * Math.exp(-Math.pow((x - 0.45) / 0.22, 2));

}
(function () { let s = 0; for (let i = 0; i < 400; i++) s += profile((i + 0.5) / 400, false); PNORM = s / 400; })();

function expectedCrowd(m) {

function spawnCust(m, special) {

  if (special) gk = special === 'infl' ? 'couple' : 'worker';
  const g = GROUPS[gk];

  c.u = c.dir > 0 ? -0.2 : lenU(m) + 0.2; c.lane = 1.5 + rand(-0.17, 0.17); c.v = c.lane;

  for (const cat in CATS) c.desire[cat] = rand(0.45, 1.1);

  c.seat = -1; c.seatI = -1; c.t = 0; c.special = special || null; c.plan = null; c.sats = null; c.food = null; c.lastCat = null;

function removeCust(R, idx) {

function moveTo(c, tu, tv, sp, dt) {

function slotPos(m, k, idx) {

function score(c, m, k, s) {

function review(m, k, stars, reason, w, c) {

function serve(m, k, c) {

function setupSpecials() {

/* ---------- 每一小步 ---------- */
function stepMarket(m, dt) {
  const R = RT[m], mk = G.markets[m], n = MARKETS[m].per, L = lenU(m);
  const closed = closing >= 0 || (G.demo && false);
  // 生客人
  if (!closed && (mk.open || G.demo)) {
    const N = G.demo ? G.demoCrowd[m] : expectedCrowd(m);
    const late = !G.demo && EVENTS[G.ev.id].late;
    const x = G.demo ? 0.45 : clockX;
    R.acc += N * profile(x, late) / PNORM / NIGHT_LEN * dt;
    while (R.acc >= 1) { R.acc -= 1; spawnCust(m); }
  }
  // 出餐
  for (let k = 0; k < mk.lots.length; k++) {
    const s = mk.lots[k];
    if (!s || TYPES[s.type].fac) continue;
    const st = R.st[k];
    st.flT += dt;
    if (st.busy > 0) st.busy -= dt;
    const h = st.queue[0];
    if (h && h.arrived) {
      st.prog += dt / serviceTime(s);
      st.busy = 0.4;
      if (st.prog >= 1) serve(m, k, h);
    }
  }
  // 客人
  for (let i = R.cust.length - 1; i >= 0; i--) {
    const c = R.cust[i];
    if (c.emoT > 0) { c.emoT -= dt; if (c.emoT <= 0) c.emo = 0; }
    switch (c.state) {
      case 'walk': {
        let sp = c.spd;
        if (closed) { sp *= 1.8; if (!c.leaving) { c.leaving = true; c.dir = c.u < L / 2 ? -1 : 1; } }
        if (c.special && c.plan && c.plan.length && !closed) {
          const k = c.plan[0], tu = GATE + lotIdx(m, k) + 0.5;
          c.dir = tu > c.u ? 1 : -1;
          if (Math.abs(tu - c.u) < 0.08) { c.plan.shift(); joinQueue(c, m, k, true); break; }
        } else if (c.special && c.plan && !c.plan.length && !c.leaving) { c.leaving = true; c.dir = c.u < L / 2 ? -1 : 1; }
        c.u += c.dir * sp * dt;
        c.v += (c.lane - c.v) * Math.min(1, dt * 2);
        c.ph += dt * 9;
        if (c.eat > 0) { c.eat -= dt; if (c.eat <= 0) { dropLitter(c, m); c.food = null; } }
        if (!closed && !c.special) {
          const f = c.u - GATE, li = Math.floor(f), fr = f - li;
          if (li !== c.lastI && li >= 0 && li < n && fr > 0.12 && fr < 0.88) { c.lastI = li; consider(c, m, li); }
        }
        if (c.u < -0.3 || c.u > L + 0.3) {
          if (!c.turned && !closed && !c.special && c.budget > 50 && Math.random() < 0.35) { c.turned = true; c.dir = -c.dir; c.lastI = -99; c.lane = 1.5 + rand(-0.17, 0.17); }
          else removeCust(R, i);
        }
        break;
      }
      case 'queue': {
        const st = R.st[c.k], idx = st.queue.indexOf(c);
        slotPos(m, c.k, idx);
        c.arrived = moveTo(c, TU, TV, 0.55, dt) && idx === 0;
        if (!(idx === 0 && c.arrived)) {
          c.wait += dt;
          if (c.wait > c.pat) { leaveQueue(c, m, true); break; }
        }
        if (closing > 5 && !(idx === 0 && c.arrived)) leaveQueue(c, m, false);
        break;
      }
      case 'toSeat': {
        seatPos(m, c.seat, c.seatI);
        if (moveTo(c, TU, TV, 0.45, dt)) { c.state = 'sit'; c.t = rand(5, 8); }
        break;
      }
      case 'sit': {
        c.t -= dt;
        if (c.t <= 0 || closing > 4) {
          const arr = R.seats[c.seat]; if (arr) arr[c.seatI] = null;
          c.seat = -1; c.food = null; c.state = 'back'; c.tu = c.u; c.tv = c.lane;
          if (!R.trashU[clamp(Math.floor(c.u - GATE), 0, n - 1)] && Math.random() < 0.08 && R.litter.length < 90) R.litter.push({ u: c.u, v: c.v > 1.5 ? 1.92 : 1.08, r: Math.random() });
        }
        break;
      }
      case 'back': {
        if (moveTo(c, c.u, c.lane, 0.45, dt)) { c.state = 'walk'; c.lastI = Math.floor(c.u - GATE); }
        break;
      }
    }
  }
  // 清潔
  R.cleanT += dt;
  if (R.cleanT >= 1) {
    R.cleanT -= 1;
    mk.lots.forEach((s, k) => {
      if (!s || s.type !== 'trash' || !R.litter.length) return;
      const uc = GATE + lotIdx(m, k) + 0.5;
      for (let j = 0; j < R.litter.length; j++) if (Math.abs(R.litter[j].u - uc) < 2.5 && Math.random() < 0.6) { R.litter.splice(j, 1); break; }
    });
    if (R.litter.length && Math.random() < (has('clean') ? 0.6 : 0.2)) R.litter.splice(Math.floor(Math.random() * R.litter.length), 1);
  }
}

function anyCustomers() { return RT.some((R) => R.cust.length > 0); }

const cv = $('cv'), ctx = cv.getContext('2d');
let W = 800, H = 600, DPR = 1;
let VR = { x: 0, y: 0, w: 800, h: 600 };   // 夜市可以用的區域
let VW = null;                                // 目前夜市的座標換算
let SX = 0, SY = 0;

function viewM() { return G ? G.view : 0; }
function geom(m) {
  const n = MARKETS[m].per, Lw = n + 2 * GATE;
  const port = VR.h > VR.w * 1.05;
  const along = port ? VR.h : VR.w, across = port ? VR.w : VR.h;
  let sA = along / Lw, sC = across / 3;
  sC = Math.min(sC, sA * 1.5); sA = Math.min(sA, sC * 1.35);
  const oA = (along - Lw * sA) / 2, oC = (across - 3 * sC) / 2;
  VW = { m, n, Lw, sA, sC, port, ox: VR.x + (port ? oC : oA), oy: VR.y + (port ? oA : oC) };
  VW.pr = clamp(Math.min(sA, sC) * 0.06, 3, 9);
}
function w2s(u, v) {
  if (VW.port) { SX = VW.ox + v * VW.sC; SY = VW.oy + u * VW.sA; }

function goalsSheet() {

function marketsSheet() {
  let h = '';

  MARKETS.forEach((M, m) => {

    else {

      const why = !prevOk ? '先進駐' + MARKETS[m - 1].short : !repOk ? '聲望不足' : !cashOk ? '現金不足' : '';
      btn = '<button class="btn gold" data-a="unlock" data-m="' + m + '"' + (why || G.phase === 'night' ? ' disabled' : '') + '>' + (why || '進駐 ' + fmt(M.cost)) + '</button>';

/* ---------- 動作 ---------- */
function act(a, d) {
  const m = G.view, k = sheetArg;
  const night = G.phase === 'night';
  switch (a) {
    case 'price': {
      const s = G.markets[m].lots[k], T = TYPES[s.type];
      const lo = Math.max(5, Math.round(T.ref * 0.5 / 5) * 5), hi = Math.round(T.ref * 2.2 / 5) * 5;
      const np = clamp(s.price + (+d.d), lo, hi);
      if (np === s.price) { sfx('error'); return; }
      s.price = np; sfx('tickp', { pitch: clamp(0.75 + np / T.ref * 0.3, 0.7, 1.5) });
      break;
    }
    case 'up': {
      const s = G.markets[m].lots[k], cost = upCost(s, d.w);
      if (night || !cost || G.cash < cost) { sfx('error'); return; }
      G.cash -= cost; s.inv += cost; s[d.w]++;
      sfxAt('upgrade', k);
      sparkleLot(k);
      lotVer++;
      banner(TYPES[s.type].shop + ' 升級完成', { q: '品質 Lv' + s.q, eq: '設備 Lv' + s.eq, ql: '排隊空間 ' + qcap(s) + ' 人' }[d.w], 'good');
      break;
    }
    case 'hire': {
      const s = G.markets[m].lots[k], p = G.cands[+d.i];
      if (!p || s.staff.length >= MAX_STAFF) { sfx('error'); return; }
      s.staff.push(p); G.cands.splice(+d.i, 1);
      sfx('hire', { pitch: vary(0.04) }); lotVer++;
      break;
    }
    case 'fire': {
      const s = G.markets[m].lots[k], i = s.staff.findIndex((p) => p.id === +d.id);
      if (i < 0) return;
      s.staff.splice(i, 1); sfx('fire', { pitch: vary(0.04) }); lotVer++;
      break;
    }
    case 'build': buildAt(m, k, d.t); return;
    case 'demolish': {
      if (night) return;
      if (confirmK !== k) { confirmK = k; sfx('alert', { vol: 0.6 }); renderSheet(); return; }
      const s = G.markets[m].lots[k];
      G.cash += Math.round(s.inv * 0.5);
      G.markets[m].lots[k] = null;
      sfxAt('demolish', k); lotVer++; refreshRT();
      const lr = lotRect(k); for (let i = 0; i < 12; i++) addPart(lr[0] + lr[2] * Math.random(), lr[1] + lr[3] * Math.random(), rand(-40, 40), rand(-80, -20), rand(0.5, 0.9), '#8a7a6a', rand(3, 6), 'conf');
      closeSheet(true); saveGame();
      return;
    }
    case 'res': {
      const r = RES_BY[d.id];
      if (has(r.id) || G.cash < r.cost || (r.req && !has(r.req))) { sfx('error'); return; }
      G.cash -= r.cost; G.research[r.id] = 1;
      sfx('levelup'); banner('研發完成：' + r.n, r.desc, 'good');
      lotVer++;
      break;
    }
    case 'borrow': {
      if (G.loan + 20000 > loanLimit()) { sfx('error'); return; }
      G.loan += 20000; G.cash += 20000; sfx('coins');
      break;
    }
    case 'repay': {
      const v = Math.min(+d.v, G.loan, G.cash);
      if (v <= 0) { sfx('error'); return; }
      G.loan -= v; G.cash -= v; sfx('coins', { pitch: 0.85 });
      break;
    }
    case 'viewm': setView(+d.m); closeSheet(true); return;
    case 'unlock': unlockMarket(+d.m); return;
  }
  renderSheet();
  updateHUD();
  if (G.phase === 'plan') { checkGoals(true); saveGame(); renderBar(); }
}
function sparkleLot(k) {
  if (!VW) return;
  const lr = lotRect(k);
  for (let i = 0; i < 16; i++) addPart(lr[0] + lr[2] / 2, lr[1] + lr[3] / 2, rand(-120, 120), rand(-200, -60), rand(0.6, 1), pick(['#ffe07a', '#fff4c4', '#ffb35a']), rand(2.5, 4.5), 'conf');
}
function buildAt(m, k, type) {
  const T = TYPES[type];
  if (G.phase !== 'plan' || G.markets[m].lots[k] || G.cash < T.build || !unlockedType(type)) { sfx('error'); return; }
  G.cash -= T.build;
  G.markets[m].lots[k] = newStall(type);
  lotVer++; refreshRT();
  RT[m].st[k].fx = 0;
  if (!T.fac && !T.noStaff) { openSheet('stall', k); banner(T.shop + ' 開張了！', '記得雇用員工才能營業', 'good'); }
  else { closeSheet(true); banner(T.n + ' 完工！', T.fac ? T.desc : '自助機台，不用員工', 'good'); }
  selK = k;
  checkGoals(true); saveGame(); updateHUD(); renderBar();
}
function unlockMarket(m) {
  const M = MARKETS[m], mk = G.markets[m];
  const maxRep = Math.max.apply(null, G.markets.filter((x) => x.open).map((x) => x.rep));
  if (mk.open || G.phase !== 'plan' || !G.markets[m - 1].open || maxRep < M.needRep || G.cash < M.cost) { sfx('error'); return; }
  G.cash -= M.cost; mk.open = true; mk.rep = 2.5;
  lotVer++; refreshRT();
  J.unlock(); banner('進駐「' + M.n + '」！', M.desc, 'good');
  setView(m); closeSheet(true);
  checkGoals(true); saveGame(); updateHUD(); renderBar();
}
function setView(m) {
  m = clamp(m, 0, 2);
  if (m === G.view) return;
  G.view = m; selK = -1;
  if (sheetKind === 'stall' || sheetKind === 'build' || sheetKind === 'fac') closeSheet(true);
  sfx('swoosh', { pitch: vary(0.05), vol: 0.6 });
  updateHUD();
}
$('mkPrev').addEventListener('click', () => setView(G.view - 1));
$('mkNext').addEventListener('click', () => setView(G.view + 1));
$('mkName').addEventListener('click', () => { if (sheetKind === 'markets') closeSheet(); else openSheet('markets'); });

/* ---------- 目標 ---------- */
function goalMet(i) { const [a, b] = GOALS[i].f(); return a >= b - 1e-9; }
function checkGoals(live) {
  if (G.mode !== 'campaign' || G.demo) return [];
  const got = [];
  while (G.goal < GOALS.length && goalMet(G.goal)) {
    const g = GOALS[G.goal];
    G.cash += g.reward; got.push(g); G.goal++;
    if (G.goal >= GOALS.length && !G.won) { G.won = true; G.wonNight = live ? G.night : G.night - 1; KG.best(SLUG + '-nights', live ? G.night : G.night - 1, true); }
  }
  if (live && got.length) {
    J.goal(); KG.confetti(W / 2, H * 0.35, 90);
    got.forEach((g) => banner('目標達成：' + g.n, g.reward ? '獎金 ' + fmt(g.reward) : '你成為夜市大亨了！', 'good'));
    if (G.won && got.some((g) => !g.reward)) { G.seenWin = true; setTimeout(() => { J.victory(); showModal('victory'); }, 900); }
  }
  return got;
}

function drawChart() {

  const w = b.width, h = b.height, hist = G.history.slice(-14);

  const padL = 46, padB = 18, padT = 8, padR = 6;

  const raw = (hi - lo) / 3, mag = Math.pow(10, Math.floor(Math.log10(raw))), stp = [1, 2, 2.5, 5, 10].map((x) => x * mag).find((x) => x >= raw);

function rollEvent(n) {

  const list = Object.keys(EVENTS).filter((id) => (EVENTS[id].min || 0) <= n);
  let tot = 0; list.forEach((id) => { tot += EVENTS[id].w * (id === 'influencer' && has('influ') ? 2 : 1); });
  let r = Math.random() * tot, id = 'clear';
  for (const x of list) { r -= EVENTS[x].w * (x === 'influencer' && has('influ') ? 2 : 1); if (r <= 0) { id = x; break; } }
  const ev = { id };

function tap(px, py) {
  if (scene !== 'game' || modalKind) return;

  const x = px - r.left, y = py - r.top;
  geom(G.view);
  const mk = G.markets[G.view];
  if (!mk.open) { openSheet('markets'); return; }
  let best = -1, bd = 1e9;
  for (let k = 0; k < mk.lots.length; k++) {
    const lr = lotRect(k);
    const dx = Math.max(lr[0] - x, 0, x - (lr[0] + lr[2])), dy = Math.max(lr[1] - y, 0, y - (lr[1] + lr[3]));
    const dd = Math.hypot(dx, dy) - (dx === 0 && dy === 0 ? 1000 - Math.hypot(x - lr[0] - lr[2] / 2, y - lr[1] - lr[3] / 2) : 0);
    if (dd < bd) { bd = dd; best = k; }
  }
  const lim = Math.min(VW.sA, VW.sC) * 0.35;
  if (best < 0 || bd > lim) { if (sheetKind) closeSheet(); return; }
  const s = mk.lots[best];
  if (selK === best && sheetKind && (sheetKind === 'stall' || sheetKind === 'build' || sheetKind === 'fac')) { closeSheet(); return; }
  selK = best;
  if (!s) openSheet('build', best);

    const vis = m === viewM();
    [0.05, 0.35, 0.65].forEach((t) => { if (p < t && st.fx >= t && vis) { sfxAt('hammer', k, { pitch: vary(0.06) }); const lr = lotRect(k); for (let i = 0; i < 5; i++) addPart(lr[0] + lr[2] * rand(0.3, 0.7), lr[1] + lr[3] * 0.7, rand(-50, 50), rand(-90, -30), rand(0.4, 0.7), '#b9a58c', rand(2, 4), 'conf'); } });
    if (p < 1.3 && st.fx >= 1.3 && vis) { sfxAt('ribbon', k); const lr = lotRect(k); burst(lr[0] + lr[2] / 2, lr[1] + lr[3] / 2, 22, ['#ff5a4a', '#ffd25a', '#ffffff', '#5ad1ff']); }
    if (st.fx > 1.9) st.fx = -1;
  }));
}
function frame(now) {
  requestAnimationFrame(frame);
  const dt = Math.min(0.1, Math.max(0, (now - lastT) / 1000));
  lastT = now; tNow += dt;
  fpsAvg = fpsAvg * 0.95 + dt * 1000 * 0.05;
  fpsOK = fpsAvg < 30;
  if (needLayout) layout();
  if (!G) return;
  const running = scene === 'title' ? true : (G.phase === 'night' && !paused && !(modalKind && modalKind !== 'title'));
  if (running) {
    let sim = dt * (scene === 'title' ? 1 : speed);
    while (sim > 1e-6) {
      const h = Math.min(0.05, sim); sim -= h;
      if (G.demo) stepMarket(1, h); else stepNight(h);
    }
  }
  updFx(dt);
  stepParts(dt);
  updateLoops(dt);
  updateMusic(dt);
  updBanner(dt);
  if (scene === 'game') {
    hudT -= dt;
    if (hudT <= 0) { hudT = 0.12; updateHUD(); if (sheetKind === 'stall' && G.phase === 'night') liveStall(); }
  }
  render(dt);
}
/* 營業中面板只更新數字，不重畫整個面板（不打斷點擊） */
let liveT = 0;
function liveStall() {
  liveT++;
  if (liveT % 4) return;
  const s = G.markets[G.view].lots[sheetArg];
  if (!s) { closeSheet(true); return; }
  const st = RT[G.view].st[sheetArg], v = shBody.querySelectorAll('.stats3 .stat .v');
  if (v.length === 3 && st) { v[0].innerHTML = '<span class="stars">★</span>' + s.rating.toFixed(1); v[1].textContent = st.sales + ' 份'; v[2].textContent = fmt(st.rev); }
}

/* ---------- 測試掛鉤 ---------- */
window.__mt = {
  get G() { return G; }, get RT() { return RT; }, get NS() { return NS; }, get scene() { return scene; }, get modal() { return modalKind; }, get sheet() { return sheetKind; },
  get clock() { return clockX; }, get paused() { return paused; },
  ff(sec) { const n = Math.ceil(sec / 0.05); for (let i = 0; i < n && G.phase === 'night'; i++) stepNight(0.05); },
  music() { return KG.music ? KG.music.isPlaying() : null; },
  lotXY(k) { geom(G.view); const lr = lotRect(k); return [lr[0] + lr[2] / 2, lr[1] + lr[3] / 2]; },
  newGame(mode) { newGame(mode || 'campaign'); enterGame(true); },
  startNight, endNight, setSpeed, rollEvent, checkGoals, netWorth, expectedCrowd, cash(v) { G.cash = v; updateHUD(); },
  setEvent(id, cat) { G.ev = { id, cat }; renderBar(); updateHUD(); }
};

/* ---------- 開始 ---------- */
toTitle();
layout();
requestAnimationFrame(frame);

</script>
