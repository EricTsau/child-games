<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>成語大挑戰</title>
<link rel="stylesheet" href="../../assets/common.css">
<style>
  :root {
    --paper: #f3ead6; --paper2: #e9dcc0; --card: #fbf6ea; --card2: #f6eedb; --line: #d8c6a2; --line2: #c4ad80;
    --ink: #2d241e; --ink2: #5b4a3b; --mute: #8a7862; --red: #b23a2e; --red2: #d0553f; --red3: #7f2219;
    --gold: #b8893a; --jade: #3d7a64; --jade2: #5d9c82; --jade3: #285646;
    --serif: "TW-Kai", "BiauKai", "DFKai-SB", "Kaiti TC", "STKaiti", "KaiTi", "AR PL UKai TW", "Noto Serif TC", "Songti TC", "PMingLiU", "MingLiU", serif;
    --sans: "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", "Heiti TC", system-ui, sans-serif;
    --safe-b: env(safe-area-inset-bottom, 0px);
  }
  html, body { height: 100%; overflow: hidden; background: var(--paper); overscroll-behavior: none; }
  body { font-family: var(--sans); color: var(--ink); }
  button { font-family: inherit; color: inherit; }
  #bg { position: fixed; inset: 0; width: 100vw; height: 100vh; height: 100dvh; z-index: 0; display: block; }
  #fx { position: fixed; inset: 0; width: 100vw; height: 100vh; height: 100dvh; z-index: 9050; pointer-events: none; display: block; }
  /* 共用按鈕換成紙墨風 */
  .kg-fab { background: radial-gradient(circle at 35% 30%, #fffaf0, #eadbb8) !important; border-color: #fffaf0 !important; box-shadow: 0 4px 0 rgba(90,60,30,.25), 0 8px 18px rgba(90,60,30,.18) !important; }

  .screen { position: fixed; inset: 0; z-index: 10; display: none; flex-direction: column; }
  .screen.on { display: flex; animation: scrIn .32s cubic-bezier(.2,.8,.3,1); }
  @keyframes scrIn { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
  .scroll { flex: 1; overflow-y: auto; overflow-x: hidden; -webkit-overflow-scrolling: touch; touch-action: pan-y; padding: 66px 16px calc(24px + var(--safe-b)); }
  .wrap { max-width: 780px; margin: 0 auto; }
  .topbar { position: fixed; top: 10px; left: 66px; right: 66px; height: 48px; display: flex; align-items: center; gap: 10px; z-index: 30; pointer-events: none; }
  .topbar > * { pointer-events: auto; }
  .back { height: 44px; padding: 0 14px 0 10px; border-radius: 999px; border: 2px solid var(--line); background: var(--card); font-size: 17px; font-weight: 700; color: var(--ink2); display: inline-flex; align-items: center; gap: 4px; cursor: pointer; box-shadow: 0 3px 0 var(--line); }
  .back:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--line); }
  .back svg { width: 18px; height: 18px; }
  .ttl { font-family: var(--serif); font-size: clamp(20px, 5vw, 26px); font-weight: 700; letter-spacing: .12em; color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-shadow: 0 1px 0 #fff8; }

  /* 按鈕 */
  .btn { font-family: var(--serif); font-size: 21px; font-weight: 700; letter-spacing: .14em; color: #fff7e8; min-height: 52px; padding: 10px 26px; border-radius: 14px; border: none; cursor: pointer;
    background: linear-gradient(180deg, #c9483a, var(--red) 60%, #9c2f24); box-shadow: 0 5px 0 var(--red3), 0 10px 20px rgba(127,34,25,.25), inset 0 1px 0 rgba(255,255,255,.3);
    display: inline-flex; align-items: center; justify-content: center; gap: 8px; transition: transform .08s; }
  .btn:active { transform: translateY(4px); box-shadow: 0 1px 0 var(--red3), 0 3px 8px rgba(127,34,25,.25); }
  .btn.jade { background: linear-gradient(180deg, #4f9178, var(--jade) 60%, #2f634f); box-shadow: 0 5px 0 var(--jade3), 0 10px 20px rgba(40,86,70,.25), inset 0 1px 0 rgba(255,255,255,.3); }
  .btn.jade:active { box-shadow: 0 1px 0 var(--jade3); }
  .btn.ghost { color: var(--ink); background: linear-gradient(180deg, #fffaf0, var(--card2)); box-shadow: 0 4px 0 var(--line2), 0 8px 14px rgba(90,60,30,.12); border: 1.5px solid var(--line); }
  .btn.ghost:active { box-shadow: 0 1px 0 var(--line2); }
  .btn.small { font-size: 17px; min-height: 44px; padding: 6px 16px; letter-spacing: .08em; }
  .btn svg { width: 22px; height: 22px; flex: none; }
  .btn[disabled] { opacity: .45; pointer-events: none; }

  /* 卷軸卡片 */
  .scard { position: relative; background: linear-gradient(180deg, #fffbf1, var(--card) 70%, #f4ead4); border: 1px solid var(--line); border-radius: 8px; box-shadow: 0 10px 26px rgba(80,55,25,.16); }
  .scard.rods::before, .scard.rods::after { content: ''; position: absolute; left: -9px; right: -9px; height: 12px; border-radius: 6px; background: linear-gradient(180deg, #8a5d38, #4f331d); box-shadow: 0 2px 4px rgba(0,0,0,.25); }
  .scard.rods::before { top: -7px; } .scard.rods::after { bottom: -7px; }

  /* 標題畫面 */
  #s-title { align-items: center; justify-content: center; text-align: center; padding: 64px 16px calc(16px + var(--safe-b)); gap: clamp(8px, 2.4vh, 22px); }
  .logo { position: relative; padding: clamp(18px, 4vh, 34px) clamp(26px, 7vw, 54px); animation: drop .8s cubic-bezier(.2,1.4,.4,1) both; }
  .logo h1 { margin: 0; font-family: var(--serif); font-size: clamp(42px, 13vw, 84px); letter-spacing: .12em; line-height: 1.1; color: var(--ink); text-shadow: 2px 3px 0 rgba(120,90,50,.18); white-space: nowrap; }
  .logo .sub { font-family: var(--serif); font-size: clamp(15px, 4vw, 19px); color: var(--ink2); letter-spacing: .3em; margin-top: 6px; }
  .seal { display: inline-grid; grid-template-columns: 1fr 1fr; place-items: center; background: var(--red); color: #fbeee0; font-family: var(--serif); font-weight: 700; border-radius: 6px; box-shadow: inset 0 0 0 3px var(--red), inset 0 0 0 5px #f2d9c6; }
  .logo .seal { position: absolute; right: -6px; bottom: -10px; width: 58px; height: 58px; font-size: 22px; line-height: 1; padding: 6px; transform: rotate(-8deg); animation: stamp .5s .7s cubic-bezier(.2,1.6,.4,1) both; }
  @keyframes stamp { from { transform: scale(2.4) rotate(-20deg); opacity: 0; } to { transform: scale(1) rotate(-8deg); opacity: 1; } }
  @keyframes drop { from { transform: translateY(-30px) scale(.9); opacity: 0; } to { transform: none; opacity: 1; } }
  .tbtns { display: flex; flex-direction: column; gap: 14px; width: min(320px, 86vw); animation: drop .8s .2s both; }
  .tbtns .row { display: flex; gap: 10px; } .tbtns .row .btn { flex: 1; padding: 6px 8px; }
  .tprog { font-size: 15px; color: var(--ink2); background: rgba(255,250,238,.75); border: 1px solid var(--line); border-radius: 999px; padding: 6px 16px; animation: drop .8s .35s both; }
  .titlepic { width: min(300px, 70vw); animation: drop .8s .1s both; }
  .titlepic svg { width: 100%; height: auto; display: block; }

  /* 主選單 */
  .sect { font-family: var(--serif); font-size: 20px; letter-spacing: .2em; color: var(--ink2); margin: 18px 4px 10px; display: flex; align-items: center; gap: 10px; }
  .sect::after { content: ''; flex: 1; height: 1px; background: linear-gradient(90deg, var(--line2), transparent); }
  .acts { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 14px; }
  .act { text-align: left; cursor: pointer; padding: 14px 14px 12px; border-radius: 12px; border: 1.5px solid var(--line); background: linear-gradient(180deg, #fffbf1, var(--card2)); box-shadow: 0 5px 0 var(--line2), 0 10px 18px rgba(90,60,30,.1); display: flex; flex-direction: column; gap: 6px; min-height: 150px; transition: transform .08s; }
  .act:active { transform: translateY(3px); box-shadow: 0 2px 0 var(--line2); }
  .act svg { width: 54px; height: 54px; }
  .act b { font-family: var(--serif); font-size: 22px; letter-spacing: .1em; }
  .act small { color: var(--mute); font-size: 13.5px; line-height: 1.4; flex: 1; }
  .act .st { font-size: 14px; color: var(--gold); font-weight: 700; display: flex; align-items: center; gap: 4px; }
  .act .st svg, .lv .stars svg { width: 15px; height: 15px; }
  .more { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; }
  .more .act { min-height: 0; flex-direction: row; align-items: center; gap: 12px; }
  .more .act svg { width: 40px; height: 40px; flex: none; }
  .more .act div { display: flex; flex-direction: column; gap: 2px; }
  .more .act b { font-size: 19px; }
  .daily { display: flex; align-items: center; gap: 14px; padding: 14px 16px; cursor: pointer; border-radius: 12px; border: none; color: #fff7e8; text-align: left; width: 100%;
    background: linear-gradient(120deg, #9c2f24, var(--red) 50%, #c9583a); box-shadow: 0 5px 0 var(--red3), 0 12px 22px rgba(127,34,25,.22); }
  .daily:active { transform: translateY(3px); box-shadow: 0 2px 0 var(--red3); }
  .daily .dseal { width: 54px; height: 54px; flex: none; border: 2px solid #f6dcc8; border-radius: 8px; display: grid; place-items: center; font-family: var(--serif); font-size: 24px; line-height: 1.05; text-align: center; }
  .daily b { font-family: var(--serif); font-size: 22px; letter-spacing: .14em; display: block; }
  .daily small { opacity: .9; font-size: 14px; }

  /* 關卡選擇 */
  .lvhead { text-align: center; margin: 6px 0 16px; }
  .lvhead p { color: var(--ink2); margin: 6px 0 0; font-size: 16px; }
  .lvgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(92px, 1fr)); gap: 12px; }
  .lv { aspect-ratio: 1; border-radius: 12px; cursor: pointer; border: 1.5px solid var(--line); background: linear-gradient(180deg, #fffbf1, var(--card2)); box-shadow: 0 5px 0 var(--line2); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; padding: 6px; }
  .lv:active { transform: translateY(3px); box-shadow: 0 2px 0 var(--line2); }
  .lv .n { font-family: var(--serif); font-size: 30px; font-weight: 700; line-height: 1; }
  .lv .k { font-size: 12px; color: var(--mute); }
  .lv .stars { display: flex; gap: 1px; }
  .lv.lock { opacity: .55; background: #e8dcc2; cursor: default; }
  .lv.lock .n { color: var(--mute); }
  .lv.cur { border-color: var(--red); box-shadow: 0 5px 0 var(--red3), 0 0 0 3px rgba(178,58,46,.18); animation: pulse 1.8s ease-in-out infinite; }
  @keyframes pulse { 50% { transform: scale(1.04); } }
  .lvset { display: flex; justify-content: center; margin-top: 18px; gap: 10px; flex-wrap: wrap; }

  /* 遊戲畫面 */
  #s-play { touch-action: none; }
  .phead { position: fixed; top: 10px; left: 66px; right: 66px; height: 48px; display: flex; align-items: center; justify-content: center; gap: 10px; z-index: 30; pointer-events: none; }
  .phead .pt { font-family: var(--serif); font-size: clamp(17px, 4.4vw, 22px); font-weight: 700; letter-spacing: .08em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .pill { background: rgba(255,251,240,.92); border: 1.5px solid var(--line); border-radius: 999px; padding: 4px 12px; font-size: 16px; font-weight: 800; color: var(--ink2); white-space: nowrap; box-shadow: 0 2px 0 var(--line); }
  .pill.score { color: var(--red); min-width: 64px; text-align: center; }
  .pill.bump { animation: bump .35s ease; }
  @keyframes bump { 40% { transform: scale(1.25); } }
  #pauseBtn { position: fixed; top: 68px; right: 10px; width: 48px; height: 48px; border-radius: 50%; z-index: 40; border: 3px solid #fffaf0; cursor: pointer; display: grid; place-items: center;
    background: radial-gradient(circle at 35% 30%, #fffaf0, #eadbb8); box-shadow: 0 4px 0 rgba(90,60,30,.25), 0 8px 18px rgba(90,60,30,.18); }
  #pauseBtn svg { width: 22px; height: 22px; }
  #pauseBtn:active { transform: scale(.9); }
  .pmain { position: absolute; top: 64px; left: 0; right: 0; bottom: 0; padding: 4px 14px calc(12px + var(--safe-b)); display: flex; flex-direction: column; gap: 10px; max-width: 820px; margin: 0 auto; }
  .prog { height: 48px; flex: none; display: flex; align-items: center; gap: 8px; padding-right: 54px; }
  .dots { flex: 1; display: flex; gap: 5px; align-items: center; min-width: 0; }
  .dot { flex: 1; max-width: 34px; height: 8px; border-radius: 4px; background: rgba(140,110,70,.18); transition: background .3s; }
  .dot.done { background: var(--jade2); } .dot.miss { background: #d9a36a; } .dot.now { background: var(--ink2); }
  .combo { font-family: var(--serif); font-size: 16px; color: var(--red); font-weight: 700; white-space: nowrap; opacity: 0; transition: opacity .2s; }
  .combo.on { opacity: 1; animation: bump .35s; }
  .timer { width: 40px; height: 40px; flex: none; display: none; }
  .timer.on { display: block; }
  .stage { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 12px; }
  .qbox { flex: 1 1 auto; min-height: 0; position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 16px 14px; text-align: center; margin: 8px 6px 4px; }
  .abox { flex: none; position: relative; min-height: 120px; display: flex; flex-direction: column; justify-content: center; }
  .qlabel { font-size: 14px; letter-spacing: .3em; color: var(--mute); margin-bottom: 8px; display: flex; align-items: center; gap: 8px; }
  .qlabel::before, .qlabel::after { content: ''; width: 26px; height: 1px; background: var(--line2); }
  .qtext { font-family: var(--serif); font-size: clamp(19px, 4.8vw, 26px); line-height: 1.6; color: var(--ink); max-width: 30em; }
  .qtext .bl { display: inline-block; min-width: 4.2em; border-bottom: 2.5px solid var(--red); color: var(--red); letter-spacing: .1em; margin: 0 2px; }
  .qhint { font-size: 16.5px; color: var(--ink2); margin-top: 14px; line-height: 1.55; max-width: 26em; text-align: left; }
  .qhint + .qhint { margin-top: 6px; }
  .qhint b { display: inline-block; font-size: 12.5px; color: #fff; background: var(--jade); border-radius: 4px; padding: 0 6px; margin-right: 6px; font-weight: 600; vertical-align: 1px; }
  .qhint.ex b { background: var(--gold); }
  .qhint u { text-decoration: none; color: var(--red); font-weight: 700; }
  .chars { display: flex; gap: clamp(6px, 2vw, 12px); justify-content: center; }
  .ch { --s: clamp(56px, 19vw, 92px); width: var(--s); height: var(--s); display: grid; place-items: center; font-family: var(--serif); font-size: calc(var(--s) * .66); font-weight: 700; line-height: 1; color: var(--ink); border-radius: 6px; position: relative;
    background: linear-gradient(90deg, transparent calc(50% - .6px), rgba(178,58,46,.22) calc(50% - .6px), rgba(178,58,46,.22) calc(50% + .6px), transparent calc(50% + .6px)),
      linear-gradient(0deg, transparent calc(50% - .6px), rgba(178,58,46,.22) calc(50% - .6px), rgba(178,58,46,.22) calc(50% + .6px), transparent calc(50% + .6px)), #fffaf0;
    border: 2px solid #c9a978; box-shadow: 0 3px 0 rgba(160,120,70,.25); }
  .ch.blank { border: 2.5px dashed var(--red2); color: transparent; }
  .ch.blank.nowb { animation: glow 1.2s ease-in-out infinite; }
  @keyframes glow { 50% { box-shadow: 0 0 0 5px rgba(208,85,63,.18), 0 3px 0 rgba(160,120,70,.25); } }
  .ch.got { color: var(--jade3); border-style: solid; border-color: var(--jade2); animation: pop .4s cubic-bezier(.2,1.6,.4,1); }
  .ch.reveal { color: var(--red); border-style: solid; }
  @keyframes pop { from { transform: scale(.5); } to { transform: none; } }
  .ch.hl { color: var(--red); }
  .ch.hl::after { content: ''; position: absolute; inset: 4px; border: 2px solid var(--red2); border-radius: 50%; opacity: .6; }
  .pic { width: min(100%, 420px); max-height: 100%; display: flex; flex-direction: column; align-items: center; gap: 10px; min-height: 0; }
  .pic .frame { width: 100%; flex: 1 1 auto; min-height: 0; display: flex; align-items: center; justify-content: center; }
  .pic svg { width: 100%; height: 100%; max-height: 260px; display: block; border-radius: 6px; border: 6px solid #fffaf0; box-shadow: 0 0 0 1.5px var(--line2), 0 8px 18px rgba(80,55,25,.18); background: #f6eedb; }
  .pic .chars .ch { --s: clamp(42px, 12vw, 58px); }
  .trail { display: flex; flex-wrap: wrap; gap: 6px 4px; justify-content: center; align-items: center; margin-bottom: 12px; max-width: 100%; }
  .trail span { font-family: var(--serif); font-size: 16px; padding: 3px 10px; border-radius: 999px; background: rgba(61,122,100,.1); color: var(--jade3); border: 1px solid rgba(61,122,100,.25); white-space: nowrap; }
  .trail i { color: var(--mute); font-style: normal; font-size: 14px; }
  .linkhint { margin-top: 14px; font-size: 16px; color: var(--ink2); }
  .linkhint b { font-family: var(--serif); font-size: 24px; color: var(--red); margin: 0 3px; }
  /* 選項 */
  .opts { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .opt { position: relative; min-height: 64px; padding: 8px 6px; border-radius: 12px; cursor: pointer; border: 1.5px solid var(--line); background: linear-gradient(180deg, #fffcf4, var(--card2)); box-shadow: 0 5px 0 var(--line2), 0 8px 14px rgba(90,60,30,.1);
    font-family: var(--serif); font-size: clamp(22px, 6vw, 30px); font-weight: 700; letter-spacing: .12em; color: var(--ink); transition: transform .08s, opacity .2s; }
  .opt:active { transform: translateY(3px); box-shadow: 0 2px 0 var(--line2); }
  .opt .kb { position: absolute; left: 7px; top: 5px; font-family: var(--sans); font-size: 11px; color: var(--mute); letter-spacing: 0; font-weight: 600; }
  .opt.bad { background: #efe2d0; color: #a89478; text-decoration: line-through; text-decoration-color: var(--red); box-shadow: 0 2px 0 var(--line2); transform: translateY(3px); pointer-events: none; animation: shake .4s; }
  .opt.good { background: linear-gradient(180deg, #5d9c82, var(--jade)); color: #fffaf0; border-color: var(--jade3); box-shadow: 0 5px 0 var(--jade3); animation: pop .35s; }
  .opt.dim { opacity: .4; pointer-events: none; }
  @keyframes shake { 0%, 100% { translate: 0; } 20%, 60% { translate: -7px 0; } 40%, 80% { translate: 7px 0; } }
  .tiles { display: flex; flex-wrap: wrap; justify-content: center; gap: clamp(8px, 2.4vw, 14px); }
  .tile { --s: clamp(54px, 15.5vw, 74px); width: var(--s); height: var(--s); border-radius: 10px; cursor: pointer; position: relative; font-family: var(--serif); font-size: calc(var(--s) * .6); font-weight: 700; color: var(--ink);
    border: 1.5px solid #c9a978; background: linear-gradient(180deg, #fffcf3, #f1e3c4); box-shadow: 0 5px 0 #b8996a, 0 8px 12px rgba(90,60,30,.15); display: grid; place-items: center; transition: transform .08s, opacity .2s; }
  .tile:active { transform: translateY(3px); box-shadow: 0 2px 0 #b8996a; }
  .tile.bad { background: #ead6c4; color: #b59b84; box-shadow: 0 2px 0 #c9b090; transform: translateY(3px); pointer-events: none; animation: shake .4s; }
  .tile.used { visibility: hidden; }
  .tile .kb { position: absolute; left: 5px; top: 3px; font-family: var(--sans); font-size: 10px; color: var(--mute); font-weight: 600; }
  /* 拼圖 */
  .grid { display: grid; gap: 4px; grid-auto-rows: var(--cs); flex: none; align-content: start; }
  .cell { width: var(--cs); height: var(--cs); }
  .cell.on { border-radius: 6px; display: grid; place-items: center; font-family: var(--serif); font-size: calc(var(--cs) * .62); font-weight: 700; cursor: pointer; position: relative;
    background: linear-gradient(90deg, transparent calc(50% - .5px), rgba(178,58,46,.2) calc(50% - .5px), rgba(178,58,46,.2) calc(50% + .5px), transparent calc(50% + .5px)),
      linear-gradient(0deg, transparent calc(50% - .5px), rgba(178,58,46,.2) calc(50% - .5px), rgba(178,58,46,.2) calc(50% + .5px), transparent calc(50% + .5px)), #fffaf0;
    border: 2px solid #c9a978; box-shadow: 0 2px 0 rgba(160,120,70,.25); }
  .cell.given { background: #efe3c8; color: var(--ink); cursor: default; }
  .cell.vac { border-style: dashed; border-color: var(--red2); }
  .cell.sel { border-style: solid; border-color: var(--red); box-shadow: 0 0 0 4px rgba(208,85,63,.25); animation: glow 1.2s ease-in-out infinite; }
  .cell.put { color: var(--ink2); background-color: #fff6e0; animation: pop .3s cubic-bezier(.2,1.6,.4,1); }
  .cell.wrong { color: var(--red); animation: shake .4s; }
  .cell.ok { color: var(--jade3); border-color: var(--jade2); }
  /* 解說 */
  .explain { padding: 14px 16px 16px; animation: rise .35s cubic-bezier(.2,1.2,.4,1); }
  @keyframes rise { from { transform: translateY(20px); opacity: 0; } to { transform: none; opacity: 1; } }
  .explain .ew { font-family: var(--serif); font-size: clamp(26px, 7vw, 34px); font-weight: 700; letter-spacing: .16em; color: var(--ink); display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .explain .ew .tag { font-family: var(--sans); font-size: 12px; letter-spacing: 0; color: #fff; background: var(--jade); border-radius: 999px; padding: 2px 8px; font-weight: 700; }
  .explain .ew .tag.t2 { background: var(--gold); } .explain .ew .tag.t3 { background: var(--red); }
  .explain .em { margin: 6px 0 4px; font-size: 17px; line-height: 1.55; color: var(--ink); }
  .explain .ex { font-size: 15.5px; line-height: 1.55; color: var(--ink2); }

<script>

 */

守株待兔|不主動努力，只想靠運氣得到成果。|想考好成績就要用功，守株待兔是等不到好運的。|1|動故

馬到成功|一開始行動就順利成功。|祝你比賽馬到成功，抱個獎盃回來！|1|動

    for (const x of cand) {
      if (tiles.length >= 4 + extra) break;

  /* ---------- 成語拼圖（小型交叉格） ---------- */
  function placeWord(w, r, c, dir) { return [0, 1, 2, 3].map(k => ({ r: dir ? r + k : r, c: dir ? c : c + k, ch: [...w][k] })); }
  function layoutOK(words) {
    const map = new Map();
    for (let wi = 0; wi < words.length; wi++) {
      for (const cell of words[wi].cells) {
        const key = cell.r + ',' + cell.c;
        if (map.has(key)) {
          const e = map.get(key);
          if (e.ch !== cell.ch) return false;
          e.ws.push(wi);
        } else map.set(key, { ch: cell.ch, ws: [wi] });
      }
    }
    // 不同成語的格子不能「肩並肩」相鄰（除了交叉點本身）
    for (const [key, e] of map) {
      const [r, c] = key.split(',').map(Number);
      for (const [dr, dc] of [[0, 1], [1, 0]]) {
        const k2 = (r + dr) + ',' + (c + dc);
        if (!map.has(k2)) continue;
        const e2 = map.get(k2);
        const shareWord = e.ws.some(w => e2.ws.includes(w));
        if (!shareWord) return false;
        // 兩格相鄰且同屬某成語時，方向必須一致
        const w = e.ws.find(x => e2.ws.includes(x));
        if ((words[w].dir === 1) !== (dr === 1)) return false;
      }
    }
    // 交叉點數量 = 成語數 - 1（樹狀，不形成多餘交叉）
    let cross = 0; for (const e of map.values()) if (e.ws.length > 1) cross++;

  }
  function solveCount(cellsArr, words, tray, limit) {
    // cellsArr: [{key, ch, given}] ; tray: 字的多重集合
    const givenAt = new Map(cellsArr.filter(x => x.given).map(x => [x.key, x.ch]));
    const bag = {};
    tray.forEach(t => { bag[t] = (bag[t] || 0) + 1; });
    const slots = words.map(wd => wd.cells.map(c => c.r + ',' + c.c));
    const cands = slots.map(keys => IDS.filter(x => keys.every((k, i) => givenAt.has(k) ? givenAt.get(k) === x.c[i] : bag[x.c[i]] > 0)));
    const assign = new Map();
    let count = 0;
    const sols = [];
    const rec = (si) => {
      if (count >= limit) return;
      if (si === slots.length) { count++; sols.push(slots.map(keys => keys.map(k => givenAt.get(k) || assign.get(k)).join(''))); return; }
      const keys = slots[si];
      for (const x of cands[si]) {
        const placed = [];
        let ok = true;
        for (let i = 0; i < 4; i++) {
          const k = keys[i];
          if (givenAt.has(k)) continue;
          if (assign.has(k)) { if (assign.get(k) !== x.c[i]) { ok = false; break; } continue; }
          if (!(bag[x.c[i]] > 0)) { ok = false; break; }
          bag[x.c[i]]--; assign.set(k, x.c[i]); placed.push(k);
        }
        if (ok) rec(si + 1);
        for (const k of placed) { bag[assign.get(k)]++; assign.delete(k); }

            const ch = base.cells[i].ch;
            for (const x of IDS) {

              for (let j = 0; j < 4; j++) {
                if (x.c[j] !== ch) continue;
                const dir = base.dir ? 0 : 1;
                const r = dir ? base.cells[i].r - j : base.cells[i].r;
                const c = dir ? base.cells[i].c : base.cells[i].c - j;

        }

        let placed = false;

      if (maxR - minR > 6 || maxC - minC > 6) continue;

      const cells = [];
      for (const [k, e] of map) { const [r, c] = k.split(',').map(Number); cells.push({ r: r - minR, c: c - minC, key: (r - minR) + ',' + (c - minC), ch: e.ch, ws: e.ws, given: false }); }

      const order = shuffle(cells);

        const own = order.filter(c => c.ws.length === 1 && c.ws[0] === wi);

      });

      const answerChars = cells.filter(c => !c.given).map(c => c.ch);

  /* ---------- 關卡設定 ---------- */

    chain: { name: '接龍', full: '成語接龍', levels: 10, desc: '上一個成語的最後一個字，就是下一個成語的開頭。' },
    puzzle: { name: '拼圖', full: '成語拼圖', levels: 10, desc: '把字磚放進交叉格子，拼出兩三個成語。' },
    picture: { name: '看圖', full: '看圖猜成語', levels: 6, desc: '看看圖畫在說什麼，猜出對應的成語。' }
  };
  function genLevel(act, level, opt) {

    const qs = [];
    if (act === 'fill') {
      const two = level > 6;
      pickDistinct(pool, 8).forEach(o => qs.push(genFill(o, two ? 2 : 1, two ? 6 : (level > 3 ? 5 : 4))));
    } else if (act === 'meaning') {
      pickDistinct(pool, 8).forEach((o, k) => qs.push(genMeaning(o, pool, level >= 4 && k % 3 === 2 ? 'example' : 'meaning', level >= 7)));
    } else if (act === 'chain') {

      const ch = genChain(len, !!opt.homo, pool);

    } else if (act === 'puzzle') {

      const per = 8;

      const start = ((level - 1) * per) % order.length;
      const list = [];
      for (let k = 0; k < per; k++) list.push(order[(start + k) % order.length]);

      qs.push(genMeaning(picked[1], pool, 'meaning', false));
      qs.push(genPicChoice(pics[0]));
      const c1 = genChain(2, homo, pool); qs.push(c1.qs[0]);
      qs.push(genFill(picked[2], 2, 6));
      qs.push(genMeaning(picked[3], pool, 'example', true));
      qs.push(genPicBuild(pics[1], 3));
      qs.push(genFill(picked[4], 1, 5));
      qs.push(genMeaning(picked[5], pool, 'meaning', true));

    });
  }
  function genReview(words) {

    shuffle(words).slice(0, 10).forEach((w, k) => {

  }

  /* ---------- 資料完整性檢查 ---------- */

      if (f1.tiles.length !== (r % 2 ? 6 : 4)) errs.push('填字磚數量錯誤：' + o.w);

      if (mq.options.length !== 4 || mq.options[mq.correct] !== o.w) errs.push('選意思題錯誤：' + o.w);

function drawBg() {
  const r = bg.getBoundingClientRect();
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const W = Math.max(1, r.width), H = Math.max(1, r.height);
  bg.width = Math.round(W * dpr); bg.height = Math.round(H * dpr);
  const c = bg.getContext('2d');
  c.setTransform(dpr, 0, 0, dpr, 0, 0);
  const gr = c.createLinearGradient(0, 0, 0, H);
  gr.addColorStop(0, '#f6efdf'); gr.addColorStop(1, '#ecdfc3');
  c.fillStyle = gr; c.fillRect(0, 0, W, H);
  // 紙纖維
  const pc = document.createElement('canvas'); pc.width = pc.height = 160;
  const p = pc.getContext('2d');
  let seed = 7; const rr = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  for (let i = 0; i < 420; i++) { p.fillStyle = `rgba(${120 + rr() * 60 | 0},${90 + rr() * 40 | 0},50,${0.03 + rr() * 0.05})`; p.fillRect(rr() * 160, rr() * 160, 1 + rr() * 1.5, 1 + rr() * 1.5); }
  p.strokeStyle = 'rgba(140,110,70,.06)'; p.lineWidth = 0.8;
  for (let i = 0; i < 22; i++) { const x = rr() * 160, y = rr() * 160; p.beginPath(); p.moveTo(x, y); p.quadraticCurveTo(x + rr() * 20 - 10, y + rr() * 20 - 10, x + rr() * 30 - 15, y + rr() * 30 - 15); p.stroke(); }
  c.fillStyle = c.createPattern(pc, 'repeat'); c.fillRect(0, 0, W, H);
  // 遠山（水墨）
  const base = H;
  const mount = (y0, amp, col, sd) => {
    let s2 = sd; const r2 = () => (s2 = (s2 * 48271) % 2147483647) / 2147483647;
    c.beginPath(); c.moveTo(0, base);
    let x = 0, y = y0;
    c.lineTo(0, y);
    while (x < W + 40) { const nx = x + 40 + r2() * 80; const ny = y0 - r2() * amp; c.quadraticCurveTo((x + nx) / 2, ny - amp * 0.5 * r2(), nx, y0 - r2() * amp * 0.4); x = nx; y = ny; }
    c.lineTo(W, base); c.closePath();
    const g2 = c.createLinearGradient(0, y0 - amp, 0, base);
    g2.addColorStop(0, col); g2.addColorStop(1, 'rgba(236,223,195,0)');
    c.fillStyle = g2; c.fill();
  };
  mount(H * 0.78, H * 0.16, 'rgba(110,120,110,.16)', 11);
  mount(H * 0.86, H * 0.12, 'rgba(70,80,72,.18)', 29);
  // 紅日
  c.fillStyle = 'rgba(190,70,50,.12)';
  c.beginPath(); c.arc(W * 0.82, H * 0.2, Math.min(W, H) * 0.09, 0, Math.PI * 2); c.fill();
}

/* ---------- 特效：花瓣與墨點（物件池） ---------- */
const FX = (() => {
  const cv = $('#fx'), c = cv.getContext('2d');
  let W = 1, H = 1, dpr = 1, alive = 0, dirty = false;
  const MAX = 160, P = [];
  for (let i = 0; i < MAX; i++) P.push({ on: false });
  const sprite = (draw, s) => { const o = document.createElement('canvas'); o.width = o.height = s; draw(o.getContext('2d'), s); return o; };
  const SPR = {
    petal: sprite((g, s) => { g.translate(s / 2, s / 2); for (let i = 0; i < 5; i++) { g.rotate(Math.PI * 2 / 5); g.fillStyle = 'rgba(244,190,196,.95)'; g.beginPath(); g.ellipse(0, -s * 0.2, s * 0.15, s * 0.22, 0, 0, Math.PI * 2); g.fill(); } g.fillStyle = '#e9a23b'; g.beginPath(); g.arc(0, 0, s * 0.08, 0, 7); g.fill(); }, 40),
    petal2: sprite((g, s) => { g.translate(s / 2, s / 2); g.fillStyle = 'rgba(214,92,84,.9)'; g.beginPath(); g.ellipse(0, 0, s * 0.18, s * 0.34, 0.4, 0, Math.PI * 2); g.fill(); }, 32),
    ink: sprite((g, s) => { const gr = g.createRadialGradient(s / 2, s / 2, 0, s / 2, s / 2, s / 2); gr.addColorStop(0, 'rgba(40,32,26,.85)'); gr.addColorStop(0.6, 'rgba(40,32,26,.5)'); gr.addColorStop(1, 'rgba(40,32,26,0)'); g.fillStyle = gr; g.fillRect(0, 0, s, s); }, 32),
    gold: sprite((g, s) => { const gr = g.createRadialGradient(s / 2, s / 2, 0, s / 2, s / 2, s / 2); gr.addColorStop(0, 'rgba(255,240,180,1)'); gr.addColorStop(0.4, 'rgba(230,180,70,.7)'); gr.addColorStop(1, 'rgba(230,180,70,0)'); g.fillStyle = gr; g.fillRect(0, 0, s, s); }, 32)
  };
  function resize() {
    const r = cv.getBoundingClientRect();
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = Math.max(1, r.width); H = Math.max(1, r.height);
    cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
  }
  function spawn(o) {
    for (const p of P) if (!p.on) { Object.assign(p, o, { on: true, t: 0 }); alive++; return p; }
    return null;
  }
  function burst(x, y, n, kind) {
    for (let i = 0; i < n; i++) {
      const a = Math.random() * Math.PI * 2, sp = 80 + Math.random() * 240;
      spawn({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 120, g: kind === 'ink' ? 380 : 260, life: 0.7 + Math.random() * 0.7, s: (kind === 'ink' ? 8 : 14) + Math.random() * 14, rot: Math.random() * 6, vr: (Math.random() - 0.5) * 8, spr: kind === 'mix' ? (i % 3 === 0 ? 'gold' : (i % 2 ? 'petal' : 'petal2')) : kind, drag: 0.97 });
    }
  }
  function rain(n) {
    for (let i = 0; i < n; i++) spawn({ x: Math.random() * W, y: -20 - Math.random() * H * 0.5, vx: (Math.random() - 0.5) * 40, vy: 60 + Math.random() * 90, g: 20, life: 3.2 + Math.random() * 1.5, s: 14 + Math.random() * 14, rot: Math.random() * 6, vr: (Math.random() - 0.5) * 3, spr: i % 4 === 0 ? 'petal2' : 'petal', drag: 1, sway: Math.random() * 6 });
  }
  function update(dt) {
    if (!alive && !dirty) return;
    c.setTransform(dpr, 0, 0, dpr, 0, 0);
    c.clearRect(0, 0, W, H);
    dirty = false;
    for (const p of P) {
      if (!p.on) continue;
      p.t += dt;
      if (p.t >= p.life || p.y > H + 40) { p.on = false; alive--; continue; }
      p.vx *= p.drag; p.vy = p.vy * p.drag + p.g * dt;
      p.x += (p.vx + (p.sway ? Math.sin(p.t * 2 + p.sway) * 30 : 0)) * dt; p.y += p.vy * dt; p.rot += p.vr * dt;
      const a = Math.min(1, (p.life - p.t) / 0.4);
      c.globalAlpha = a;
      c.setTransform(dpr * Math.cos(p.rot), dpr * Math.sin(p.rot), -dpr * Math.sin(p.rot), dpr * Math.cos(p.rot), p.x * dpr, p.y * dpr);
      c.drawImage(SPR[p.spr], -p.s / 2, -p.s / 2, p.s, p.s);
      dirty = true;
    }
    c.globalAlpha = 1;
  }
  return { resize, burst, rain, update, count: () => alive };
})();

/* ---------- 背景音樂（五聲音階，輕柔） ---------- */
const Music = (() => {
  const SC = [293.66, 329.63, 392.0, 440.0, 493.88, 587.33, 659.25, 783.99];
  const MEL = [4, 3, 2, -1, 3, 2, 0, -1, 1, 2, 4, 5, 4, -1, -1, -1, 5, 6, 5, 4, 3, -1, 2, 3, 4, -1, 2, 1, 0, -1, -1, -1];
  const BASS = [146.83, 196.0, 220.0, 196.0];
  let i = 0, acc = 0, on = false;
  const beat = 0.42;
  return {
    setOn(v) { on = v; if (!v) acc = 0; },
    update(dt) {
      if (!on || !S.set.music || KG.isMuted() || document.hidden) return;
      acc -= dt;
      if (acc > 0) return;
      acc += beat;
      if (acc < -1) acc = beat;
      const n = MEL[i % MEL.length];
      if (n >= 0) { KG.note(SC[n], 0.9, 'triangle', 0.045); KG.note(SC[n] * 2, 0.35, 'sine', 0.012); }
      if (i % 8 === 0) KG.note(BASS[(i / 8 | 0) % 4], 2.6, 'sine', 0.05);
      i++;
    }
  };
})();
const SFX = {
  tap: () => KG.note(880, 0.06, 'triangle', 0.12),
  pluck: (k) => { const f = [587.33, 659.25, 783.99, 880, 987.77][k % 5]; KG.note(f, 0.5, 'triangle', 0.2); KG.note(f * 2, 0.18, 'sine', 0.06); },
  good: () => { [587.33, 739.99, 880, 1174.66].forEach((f, i) => KG.note(f, 0.45, 'triangle', 0.17, i * 0.07)); },
  bad: () => { KG.note(196, 0.22, 'triangle', 0.18, 0, 150); KG.note(160, 0.25, 'sine', 0.14, 0.08, 120); },
  stamp: () => { KG.note(110, 0.18, 'sine', 0.35, 0, 60); KG.sound('hit'); },
  win: () => { [523.25, 587.33, 659.25, 783.99, 880, 1046.5].forEach((f, i) => KG.note(f, 0.5, 'triangle', 0.18, i * 0.1)); KG.note(1318.5, 0.9, 'sine', 0.12, 0.65); },
  page: () => KG.sound('whoosh')
};

/* ===================== 遊玩 ===================== */
let G = null;
const TIME = { choice: 20, fill: 25, build: 30, puzzle: 80 };
function startGame(mode, act, level) {
  let qs;
  if (mode === 'level') qs = CORE.genLevel(act, level, { homo: S.set.homo });
  else if (mode === 'daily') qs = CORE.genDaily(today(), S.set.homo);
  else if (mode === 'review') qs = CORE.genReview(Object.keys(S.wrong).filter(w => CORE.BY.has(w)));
  if (!qs || !qs.length) { KG.toast('沒有題目'); return null; }
  G = { mode, act, level, qs, qi: 0, score: 0, mistakes: 0, combo: 0, maxCombo: 0, learned: [], newOnes: [], qMiss: 0, phase: 'ask', time: 0, tmax: 0, paused: false, results: [] };
  const name = mode === 'daily' ? '每日挑戰' : (mode === 'review' ? '錯題複習' : `${CORE.ACTS[act].name} · 第${CN_NUM[level]}關`);

  $('#pCombo').classList.remove('on'); $('#pCombo').textContent = '';

}

$('#pauseBtn').addEventListener('click', () => { SFX.tap(); pause(true); });
$('#bResume').addEventListener('click', () => { SFX.tap(); pause(false); });
$('#bRestart').addEventListener('click', () => { SFX.tap(); const g = G; closeModal('m-pause'); startGame(g.mode, g.act, g.level); });
$('#bQuit').addEventListener('click', () => { SFX.tap(); quitGame(); });
$('#m-result').addEventListener('click', (e) => {
  if (e.target.closest('#rNext')) { SFX.tap(); const g = G; startGame('level', g.act, g.level + 1); }
  else if (e.target.closest('#rAgain')) { SFX.tap(); const g = G; startGame(g.mode, g.act, g.level); }
  else if (e.target.closest('#rBack')) { SFX.tap(); quitGame(); }
});
$('#m-card').addEventListener('click', (e) => { if (e.target.id === 'm-card') closeModal('m-card'); });
$('#bReset').addEventListener('click', () => {
  $('#cfT').textContent = '清除紀錄？'; $('#cfP').textContent = '星星、成語本、錯題和統計都會清除，無法復原。';
  openModal('m-confirm');
});
$('#cfNo').addEventListener('click', () => closeModal('m-confirm'));
$('#cfYes').addEventListener('click', () => {
  S.prog = {}; S.book = {}; S.wrong = {}; S.stats = { answered: 0, first: 0, miss: 0, levels: 0, maxCombo: 0, streak: 0, lastDaily: '', daily: {} };
  ['prog', 'book', 'wrong', 'stats'].forEach(save);
  closeModal('m-confirm'); renderStats(); KG.toast('已清除');
});
bindToggles($('#s-levels')); bindToggles($('#s-stats')); bindToggles($('#m-pause'));

/* 觸控：點到空白處時，自動對準附近的按鈕（不需要點得很準） */
$('#s-play').addEventListener('pointerdown', (e) => {
  if (anyModal() || e.target.closest('.tap, button')) return;
  const x = e.clientX, y = e.clientY;
  let best = null, bd = 34;
  for (const el of $$('#s-play .tap')) {
    if (el.classList.contains('used') || el.classList.contains('bad') || el.classList.contains('dim')) continue;
    const r = el.getBoundingClientRect();
    if (!r.width) continue;
    const dx = Math.max(r.left - x, 0, x - r.right), dy = Math.max(r.top - y, 0, y - r.bottom);
    const d = Math.hypot(dx, dy);
    if (d < bd) { bd = d; best = el; }
  }
  if (best) { e.preventDefault(); best.click(); }
});
document.addEventListener('keydown', (e) => {
  if (e.repeat) return;
  const k = e.key;
  if ($('#m-card').classList.contains('on')) { if (k === 'Escape' || k === 'Enter') closeModal('m-card'); return; }
  if ($('#m-confirm').classList.contains('on')) { if (k === 'Escape') closeModal('m-confirm'); return; }
  if (screen === 'play' && G) {
    if ($('#m-pause').classList.contains('on')) { if (k === 'Escape' || k === 'p' || k === 'P' || k === 'Enter') pause(false); return; }
    if ($('#m-result').classList.contains('on')) { if (k === 'Enter') { const b = $('#rNext') || $('#rAgain'); b.click(); } else if (k === 'Escape') quitGame(); return; }
    if (k === 'Escape' || k === 'p' || k === 'P') { pause(true); e.preventDefault(); return; }
    if (G.phase === 'explain' && (k === 'Enter' || k === ' ')) { nextQ(); e.preventDefault(); return; }
    if (/^[1-9]$/.test(k)) { answer(+k - 1); e.preventDefault(); return; }
    const q = curQ();
    if (q && q.type === 'puzzle' && G.phase === 'ask' && (k === 'Backspace' || k === 'Delete') && q.sel) { tapCell(q.sel); e.preventDefault(); }
    return;
  }
  if (k === 'Escape') {
    if (screen === 'levels') show('hub');
    else if (screen !== 'title') goBack(screen === 'hub' ? 'title' : 'prev');
  }
  if (screen === 'title' && (k === 'Enter' || k === ' ')) { show('hub'); e.preventDefault(); }
});
document.addEventListener('visibilitychange', () => { if (document.hidden && screen === 'play' && G && !G.paused && G.phase !== 'done') pause(true); });

/* ---------- 版面 ---------- */
function relayout() { drawBg(); FX.resize(); if (screen === 'play') layoutPlay(); }
window.addEventListener('resize', relayout);
window.addEventListener('orientationchange', () => setTimeout(relayout, 200));
if (window.visualViewport) window.visualViewport.addEventListener('resize', relayout);

/* ---------- 主迴圈 ---------- */
let lastT = performance.now();
function loop(now) {
  const dt = Math.min(0.05, (now - lastT) / 1000); lastT = now;
  FX.update(dt);
  Music.setOn(!(screen === 'play' && G && G.paused));
  Music.update(dt);
  if (G && screen === 'play' && !G.paused && G.tmax && G.phase === 'ask' && !anyModal()) {
    G.time -= dt * (FAST ? 20 : 1);
    const f = clamp(G.time / G.tmax, 0, 1);
    $('#pTimerArc').setAttribute('stroke-dashoffset', (100.5 * (1 - f)).toFixed(1));
    $('#pTimerArc').setAttribute('stroke', f < 0.25 ? '#d0553f' : '#3d7a64');
    $('#pTimerTxt').textContent = Math.ceil(Math.max(0, G.time));
    if (G.time <= 0) timeUp();
  }
  requestAnimationFrame(loop);
}

/* ---------- 測試用介面 ---------- */
window.__iq = {
  get state() {
    const q = G && curQ();
    return { screen, mode: G && G.mode, act: G && G.act, level: G && G.level, qi: G ? G.qi : -1, qn: G ? G.qs.length : 0, phase: G && G.phase, paused: !!(G && G.paused), score: G ? G.score : 0, mistakes: G ? G.mistakes : 0, combo: G ? G.combo : 0, stars: G && G.stars, type: q && q.type, sub: q && q.sub, w: q && q.w, book: bookCount(), wrong: Object.keys(S.wrong).length, modal: $$('.modal.on').map(m => m.id) };
  },
  start(act, level) { return startGame('level', act || 'fill', level || 1) ? this.state : null; },
  daily() { startGame('daily'); return this.state; },
  review() { startGame('review'); return this.state; },
  current() { const q = curQ(); return q ? JSON.parse(JSON.stringify(q)) : null; },
  answer(i) { return answer(i); },
  cell(key) { tapCell(key); return this.state; },
  next() { return nextQ(); },
  correctMoves() {
    // 回傳這一題正確的作答順序（給測試用）
    const q = curQ(); if (!q) return [];
    if (q.type === 'choice') return [q.correct];
    const o = CORE.BY.get(q.w);
    if (q.type === 'fill') return q.blanks.map(p => q.tiles.indexOf(o.c[p]));
    if (q.type === 'build') { const used = new Set(); return o.c.map(ch => { const i = q.tiles.findIndex((t, k) => t === ch && !used.has(k)); used.add(i); return i; }); }
    if (q.type === 'puzzle') { const used = new Set(); return q.cells.filter(c => !c.given).map(c => { const i = q.tray.findIndex((t, k) => t === c.ch && !used.has(k)); used.add(i); return { cell: c.key, tile: i }; }); }
    return [];
  },
  solve() {
    const q = curQ(); if (!q || G.phase !== 'ask') return false;
    const mv = this.correctMoves();
    if (q.type === 'puzzle') { for (const m of mv) { if (G.phase !== 'ask') break; q.sel = m.cell; tapTray(m.tile); } }
    else for (const i of mv) answer(i);
    return true;
  },
  wrongMove() {
    const q = curQ(); if (!q) return -1;
    if (q.type === 'choice') return q.correct === 0 ? 1 : 0;
    const o = CORE.BY.get(q.w);
    if (q.type === 'fill') return q.tiles.findIndex(t => !q.blanks.some(p => o.c[p] === t));
    if (q.type === 'build') return q.tiles.findIndex(t => !o.c.includes(t));
    return -1;
  },
  data() { return CORE.IDS.map(o => ({ w: o.w, m: o.m, e: o.e, lv: o.lv, th: o.th.map(t => CORE.THEME_NAMES[t]) })); },
  chain(len, homo) { const c = CORE.genChain(len || 6, !!homo); return { path: c.path, valid: CORE.validChain(c.path, !!homo), qs: c.qs.length }; },
  puzzle(n) { return CORE.genPuzzle(n || 3, 3, 1, CORE.IDS); },
  integrity(r) { return CORE.integrity(r || 200); },
  pictures() { return CORE.PICS.slice(); },
  settings(o) { if (o) { Object.assign(S.set, o); save('set'); } return Object.assign({}, S.set); },
  pause(on) { pause(on !== false); return this.state; },
  show(n) { show(n); return screen; },
  levels(a) { renderLevels(a); return screen; },
  setFast(b) { FAST = !!b; },
  fx() { return FX.count(); }
};

/* ---------- 開始 ---------- */
relayout();
show('title');
requestAnimationFrame(loop);
</script>
</body>
