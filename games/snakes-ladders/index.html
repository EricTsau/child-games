<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>蛇梯棋</title>
<link rel="stylesheet" href="../../assets/common.css">
<style>
  html, body { height: 100%; overflow: hidden; background: #6fc46a; overscroll-behavior: none; }
  #cv { position: fixed; inset: 0; display: block; width: 100vw; height: 100vh; height: 100dvh; touch-action: none; }
  #pauseBtn {
    position: fixed; top: 66px; right: 10px; z-index: 9200; width: 48px; height: 48px; border-radius: 50%;
    border: 3px solid #fff; background: linear-gradient(180deg, #fff 0%, #e6f7dd 100%); box-shadow: var(--kg-shadow);
    display: none; align-items: center; justify-content: center; cursor: pointer; padding: 0; transition: transform .12s ease;
  }
  #pauseBtn:active { transform: scale(.9); }
  #pauseBtn i { display: block; width: 6px; height: 18px; margin: 0 3px; border-radius: 3px; background: #3c8a3a; }
  #pauseBtn.on { display: flex; }

  #ui { position: fixed; inset: 0; z-index: 9000; pointer-events: none; }
  .scr { position: absolute; inset: 0; display: none; align-items: center; justify-content: center; padding: 66px 12px 12px; pointer-events: none; }
  .scr.on { display: flex; }
  .card {
    pointer-events: auto; width: min(480px, 100%); max-height: 100%; overflow-y: auto; -webkit-overflow-scrolling: touch; overscroll-behavior: contain;
    background: linear-gradient(180deg, #ffffff 0%, #fff8e8 100%); border: 5px solid #fff; border-radius: 28px;
    box-shadow: 0 18px 40px rgba(40, 90, 30, .35); padding: 16px 14px 18px; text-align: center; color: #3b4a2b;
    animation: kg-pop .35s cubic-bezier(.2, 1.6, .4, 1); touch-action: pan-y;
  }
  .card h2 { margin: 2px 0 10px; font-size: 27px; color: #2f7a3b; letter-spacing: 2px; }
  .card h3 { margin: 14px 0 6px; font-size: 18px; color: #3c8a3a; text-align: left; }
  .lbl { font-weight: 800; font-size: 17px; }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 8px 10px; margin: 9px 2px; flex-wrap: wrap; text-align: left; }
  .rrow { flex-wrap: nowrap; }
  .rrow > span { flex: 1 1 auto; min-width: 0; }
  .rrow .seg { flex: none; }
  .row .desc { display: block; font-size: 13px; font-weight: 600; color: #7b8a62; margin-top: 2px; }
  .seg { display: inline-flex; background: #e5f2d8; border-radius: 999px; padding: 3px; gap: 2px; flex-wrap: nowrap; }
  .seg button { border: 0; background: transparent; font: 800 15px var(--kg-font); color: #557047; padding: 6px 11px; border-radius: 999px; cursor: pointer; min-height: 36px; white-space: nowrap; }
  .seg button.on { background: linear-gradient(180deg, #8edc6f, #45a83d); color: #fff; box-shadow: 0 3px 0 #2f7a2b; }
  .btnrow { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-top: 14px; }
  .kg-btn.sm { font-size: 17px; padding: 10px 18px; }
  .prow {
    display: grid; grid-template-columns: 56px minmax(0, 1fr) auto; gap: 6px 8px; align-items: center; text-align: left;
    padding: 7px 8px; border-radius: 20px; background: var(--pl); border: 3px solid var(--pc); margin: 7px 0;
  }
  .prow .pa { width: 56px; height: 56px; border-radius: 50%; border: 3px solid #fff; background: #fff; padding: 0; cursor: pointer; box-shadow: 0 3px 0 var(--pd); position: relative; }
  .prow .pa canvas { width: 100%; height: 100%; display: block; border-radius: 50%; }
  .prow .pa::after { content: '換動物'; white-space: nowrap; position: absolute; left: 50%; bottom: -9px; transform: translateX(-50%); font: 800 10px var(--kg-font); color: #fff; background: var(--pd); border-radius: 8px; padding: 0 5px; }
  .prow input { width: 100%; min-width: 0; font: 800 17px var(--kg-font); border: 2px solid #fff; border-radius: 12px; padding: 6px 8px; background: #fff; color: #333; }
  .prow .seg { background: rgba(255,255,255,.75); }
  .prow .seg button { font-size: 14px; padding: 5px 9px; min-height: 34px; }
  .boards { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px; margin: 4px 0 6px; }
  .boards button { border: 3px solid #fff; border-radius: 14px; background: #fff; padding: 3px 3px 2px; cursor: pointer; box-shadow: 0 3px 0 #d9e6c8; font: 800 13px var(--kg-font); color: #4b5e38; }
  .boards button canvas { width: 100%; aspect-ratio: 1; display: block; border-radius: 9px; }
  .boards button.on { border-color: #45a83d; box-shadow: 0 0 0 3px #b8eaa0, 0 3px 0 #2f7a2b; color: #2f7a3b; }
  .sticky { position: sticky; bottom: -18px; margin: 10px -14px -18px; padding: 10px 8px 14px; background: linear-gradient(180deg, rgba(255,248,232,0) 0%, #fff8e8 30%); }
  .tmenu { pointer-events: auto; display: flex; flex-direction: column; gap: 12px; align-items: center; animation: kg-pop .4s cubic-bezier(.2, 1.6, .4, 1); }
  .tmenu .kg-btn { min-width: 220px; }
  .tmenu .mini { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
  .chipbtn { border: 3px solid #fff; border-radius: 999px; background: rgba(255,255,255,.9); font: 800 15px var(--kg-font); color: #3c6a2f; padding: 7px 14px; cursor: pointer; box-shadow: 0 4px 0 rgba(30,80,20,.2); min-height: 40px; }
  .stat { background: rgba(255,255,255,.88); border-radius: 999px; padding: 5px 14px; font-weight: 800; font-size: 14px; color: #3c6a2f; }
  #sTitle { align-items: flex-start; }
  #sOver { align-items: flex-end; padding-bottom: 18px; }
  #sOver .btnrow { pointer-events: auto; margin: 0; }
  @media (min-aspect-ratio: 13/10) { #sOver { align-items: center; justify-content: flex-end; padding: 60px 24px 12px; } #sOver .btnrow { flex-direction: column-reverse; } }
  .hitem { display: flex; gap: 10px; align-items: center; text-align: left; margin: 9px 0; padding: 8px; background: #fff; border-radius: 18px; box-shadow: 0 3px 0 #e3ecd4; }
  .hitem canvas { width: 64px; height: 64px; flex: 0 0 auto; border-radius: 12px; }
  .hitem b { color: #2f7a3b; font-size: 16px; }
  .hitem p { margin: 2px 0 0; font-size: 14px; line-height: 1.45; color: #4f5d40; }
  /* 問題卡、小知識卡：放在下方，不要整個蓋住棋盤 */
  #sMath, #sFact { align-items: flex-end; padding-bottom: 14px; }
  .qcard { width: min(440px, 100%); padding: 12px 14px 14px; }
  .qcard .who { display: flex; align-items: center; justify-content: center; gap: 8px; font-weight: 800; font-size: 16px; color: #5b6b47; }
  .qcard .who canvas { width: 40px; height: 40px; }
  .qcard .q { font-size: 38px; font-weight: 900; color: #2f5d8a; margin: 4px 0 2px; letter-spacing: 1px; }
  .choices { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 8px; }
  .choices button { font: 900 30px var(--kg-font); border: 4px solid #fff; border-radius: 20px; padding: 10px 0; cursor: pointer; color: #fff;
    background: linear-gradient(180deg, #8cc8ff, #3d8fe0); box-shadow: 0 5px 0 #2a6cb0; min-height: 64px; }
  .choices button:nth-child(2) { background: linear-gradient(180deg, #ffc27a, #f08a2c); box-shadow: 0 5px 0 #b8611a; }
  .choices button:nth-child(3) { background: linear-gradient(180deg, #c7a6ff, #8a5be0); box-shadow: 0 5px 0 #6338ad; }
  .choices button:active { transform: translateY(3px); }
  .choices button.no { opacity: .35; animation: shakeX .35s; pointer-events: none; }
  .choices button.yes { background: linear-gradient(180deg, #9be8aa, #46b864); box-shadow: 0 5px 0 #2f8a48; }
  @keyframes shakeX { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-7px); } 75% { transform: translateX(7px); } }
  .fact { display: flex; gap: 12px; align-items: center; text-align: left; }
  .fact canvas { width: 76px; height: 76px; flex: 0 0 auto; }
  .fact h2 { margin: 0 0 4px; font-size: 22px; text-align: left; }
  .fact p { margin: 0; font-size: 18px; line-height: 1.5; font-weight: 700; color: #3f4a33; }
  .fbar { height: 6px; border-radius: 3px; background: #e4ecd6; margin-top: 10px; overflow: hidden; }
  .fbar i { display: block; height: 100%; width: 0; background: #7ccf5e; }
  @media (max-width: 360px) { .seg button { padding: 6px 8px; font-size: 14px; } .qcard .q { font-size: 32px; } .fact p { font-size: 16px; } }
  @media (orientation: landscape) and (max-height: 540px) {
    .scr { padding: 8px 66px; }
    .tmenu { flex-direction: row; flex-wrap: wrap; justify-content: center; max-width: 560px; }
    .tmenu .kg-btn { min-width: 170px; }
    #sSetup .card { width: min(780px, 100%); }
    #plist { display: grid; grid-template-columns: 1fr 1fr; gap: 0 10px; }
    .prow { margin: 4px 0; }
    #sMath, #sFact { padding-bottom: 8px; }
    .qcard { width: min(520px, 100%); padding: 8px 12px 10px; }
    .qcard .q { font-size: 30px; margin: 0; }
    .choices button { min-height: 52px; padding: 4px 0; font-size: 26px; }
    .fact canvas { width: 60px; height: 60px; }
    .fact p { font-size: 16px; }
  }
</style>
</head>
<body>
<canvas id="cv" aria-label="蛇梯棋遊戲畫面"></canvas>
<button id="pauseBtn" aria-label="暫停"><i></i><i></i></button>
<div id="ui">
  <div class="scr" id="sTitle">
    <div class="tmenu">
      <button class="kg-btn green" id="bPlay">開始遊戲</button>
      <button class="kg-btn blue sm" id="bHelp">遊戲說明</button>
      <div class="mini"><button class="chipbtn" id="tMusic1"></button><button class="chipbtn" id="tSfx1"></button></div>
      <div class="stat" id="statLine"></div>
    </div>
  </div>
  <div class="scr" id="sSetup">
    <div class="card">
      <h2>準備出發</h2>
      <div class="row"><span class="lbl">玩家人數</span><div class="seg" id="segN"><button data-v="2">2 人</button><button data-v="3">3 人</button><button data-v="4">4 人</button></div></div>
      <div id="plist"></div>
      <h3>選棋盤</h3>
      <div class="boards" id="boards"></div>
      <h3>玩法</h3>
      <div id="rlist"></div>
      <div class="btnrow sticky"><button class="kg-btn blue sm" id="bSetupBack">返回</button><button class="kg-btn green" id="bGo">出發！</button></div>
    </div>
  </div>
  <div class="scr" id="sHelp">
    <div class="card">
      <h2>怎麼玩</h2>
      <div id="hlist"></div>
      <div class="btnrow"><button class="kg-btn green sm" id="bHelpBack">知道了！</button></div>
    </div>
  </div>
  <div class="scr" id="sPause">
    <div class="card">
      <h2>暫停一下</h2>
      <div class="row"><span class="lbl">音樂</span><div class="seg" id="segMusic"><button data-v="1">開</button><button data-v="0">關</button></div></div>
      <div class="row"><span class="lbl">音效</span><div class="seg" id="segSfx"><button data-v="1">開</button><button data-v="0">關</button></div></div>
      <div class="row"><span class="lbl">語音（數數、小知識）</span><div class="seg" id="segVoice"><button data-v="1">開</button><button data-v="0">關</button></div></div>
      <div class="row"><span class="lbl">遊戲速度</span><div class="seg" id="segSpd2"><button data-v="0">慢</button><button data-v="1">普通</button><button data-v="2">快</button></div></div>
      <div class="btnrow"><button class="kg-btn green" id="bResume">繼續</button></div>
      <div class="btnrow">
        <button class="kg-btn blue sm" id="bHelp2">遊戲說明</button>
        <button class="kg-btn yellow sm" id="bRestart">重新開始</button>
        <button class="kg-btn sm" id="bQuit">回主選單</button>
      </div>
    </div>
  </div>
  <div class="scr" id="sMath">
    <div class="card qcard">
      <div class="who"><canvas id="mathAv" width="80" height="80"></canvas><span id="mathWho"></span></div>
      <div class="q" id="mathQ"></div>
      <div class="choices" id="mathC"><button></button><button></button><button></button></div>
    </div>
  </div>
  <div class="scr" id="sFact">
    <div class="card qcard">
      <div class="fact"><canvas id="factIc" width="152" height="152"></canvas><div><h2 id="factT">小知識</h2><p id="factP"></p></div></div>
      <div class="fbar" id="fbar"><i id="fbarI"></i></div>
      <div class="btnrow" style="margin-top:10px"><button class="kg-btn green sm" id="bFact">知道了！</button></div>
    </div>
  </div>
  <div class="scr" id="sOver">
    <div class="btnrow"><button class="kg-btn blue sm" id="bMenu">主選單</button><button class="kg-btn green" id="bAgain">再玩一次</button></div>
  </div>
</div>
<script src="../../assets/common.js"></script>
<script src="../../assets/kg-music.js"></script>
<script>
'use strict';
/* =====================================================================
 * 蛇梯棋：2～4 人（真人、電腦可以混搭），10×10 棋盤，1～100 蛇行編號。
 * 格子座標以「格」為單位：第 n 格中心 cellXY(n)；棋盤畫布上 1 格 = L.cs 像素。
 * 鏡頭（手機）：棋子移動時放大跟著棋子走。
 * ===================================================================== */
const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
const FONT = '"Baloo 2","PingFang TC","Noto Sans TC","Microsoft JhengHei","Heiti TC",system-ui,sans-serif';
const TAU = Math.PI * 2;
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const Ease = {
  outCubic: t => 1 - Math.pow(1 - t, 3),
  inOutSine: t => -(Math.cos(Math.PI * t) - 1) / 2,
  inQuad: t => t * t,
  outBack: t => { const c = 1.70158, c3 = c + 1; return 1 + c3 * Math.pow(t - 1, 3) + c * Math.pow(t - 1, 2); }
};
let W = 360, H = 640, dpr = 1, U = 1, time = 0;
function rng(seed) {
  let a = seed >>> 0;
  return () => { a = (a + 0x6D2B79F5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
}

  txt(g, winner.name + ' 贏了！', cx, ty, ts, '#ffe066', { stroke: '#a3501b', sw: ts * 0.2 });
  let line2 = '共 ' + G.round + ' 輪・' + winner.name + ' 擲了 ' + winner.turns + ' 回合';
  txt(g, line2, cx, ty + ts * 0.95, clamp(ts * 0.42, 13, 19), '#fff', { stroke: 'rgba(0,0,0,.4)', sw: 4, flat: true });
  if (o.record) txt(g, '新紀錄！最快 ' + winner.turns + ' 回合到終點', cx, ty + ts * 1.65, clamp(ts * 0.42, 13, 19), '#ffe066', { stroke: 'rgba(0,0,0,.45)', sw: 4, flat: true });
  for (const [rank, side] of slots) {
    const idx = o.order[rank];
    if (idx == null) continue;
    const p = G.pl[idx], h = hts[rank] * Ease.outBack(clamp((o.t - rank * 0.15) / 0.5, 0, 1));
    const x = cx + side * bw * 1.05;
    const col = PCOL[p.seat];
    g.fillStyle = col.d; rr(g, x - bw / 2, baseY - h, bw, h + 6, 10); g.fill();
    g.fillStyle = col.c; rr(g, x - bw / 2, baseY - h, bw, Math.max(0, h - 6), 10); g.fill();
    g.fillStyle = 'rgba(255,255,255,.25)'; g.fillRect(x - bw / 2 + 6, baseY - h + 6, bw * 0.12, Math.max(0, h - 18));
    if (h > bw * 0.3) txt(g, String(rank + 1), x, baseY - h / 2, bw * 0.38, '#fff', { stroke: col.d, sw: 6, flat: true });
    const ps = bw * 0.95, jump = rank === 0 ? Math.abs(Math.sin(o.t * 4)) * bw * 0.12 : 0;
    if (o.t > rank * 0.15 + 0.3) {
      g.drawImage(podSpr[idx], x - ps / 2, baseY - h - ps * 0.86 - jump, ps, ps);
      if (rank === 0) drawCrown(g, x, baseY - h - ps * 0.95 - jump, bw * 0.3);
      const nm = fitText(g, p.name, bw * 1.0, clamp(bw * 0.17, 12, 18), '900');
      txt(g, nm, x, baseY + 20, clamp(bw * 0.17, 12, 18), '#fff', { stroke: 'rgba(0,0,0,.45)', sw: 4, flat: true });
      txt(g, '第 ' + p.pos + ' 格', x, baseY + 40, clamp(bw * 0.13, 11, 15), '#fff', { weight: '700', stroke: 'rgba(0,0,0,.4)', sw: 3, flat: true });
    }
  }
  if (o.order.length > 3) {
    const idx = o.order[3], p = G.pl[idx], x = cx + bw * 2.1, s = bw * 0.6;
    if (x + s / 2 < W - 6) {
      g.drawImage(podSpr[idx], x - s / 2, baseY - s * 0.86, s, s);
      txt(g, '4・' + p.name, x, baseY + 20, clamp(bw * 0.14, 11, 15), '#fff', { stroke: 'rgba(0,0,0,.45)', sw: 3, flat: true });
    }
  }
  // 小統計
  const st = G.pl.map(p => p.name + '：梯子 ' + p.ladders + '・' + (G.slides ? '溜滑梯 ' : '蛇 ') + p.snakes + (R.math && !p.ai ? '・答對 ' + p.math : ''));
  const fs = clamp(W * 0.034, 11, 15);
  if (!land && baseY + 66 + st.length * fs * 1.4 < H - 92) {
    st.forEach((s, i) => txt(g, fitText(g, s, W - 30, fs, '700'), cx, baseY + 66 + i * fs * 1.4, fs, '#fff', { weight: '700', stroke: 'rgba(0,0,0,.35)', sw: 3, flat: true }));
  }
}
function drawCrown(g, x, y, s) {
  g.save(); g.translate(x, y);
  g.fillStyle = '#ffd43b'; g.strokeStyle = '#c99a00'; g.lineWidth = s * 0.08;
  g.beginPath(); g.moveTo(-s, s * 0.3); g.lineTo(-s, -s * 0.4); g.lineTo(-s * 0.5, 0); g.lineTo(0, -s * 0.6); g.lineTo(s * 0.5, 0); g.lineTo(s, -s * 0.4); g.lineTo(s, s * 0.3); g.closePath(); g.fill(); g.stroke();
  circ(g, 0, s * 0.05, s * 0.13, '#ff6b8a');
  g.restore();
}

/* ---------- 主迴圈 ---------- */
let lastT = performance.now();
function frame(now) {
  const dt = Math.min(0.05, Math.max(0, (now - lastT) / 1000));
  lastT = now; time += dt;
  if (shakeT > 0) shakeT -= dt;
  updateDuck();
  const paused = phase === 'play' && G.paused;
  if (!paused) {
    updateParts(dt);
    if (phase === 'play') {
      updateTimers(dt); Dice.update(dt); updateAnim(dt);
      if (G.turbo) for (let n = 0; n < 40 && G.anim; n++) updateAnim(0.05);
      if (G.st === 'fact' && G.factDur) {
        G.factT += dt;
        $('fbarI').style.width = Math.min(100, G.factT / G.factDur * 100) + '%';
        if (G.factT >= G.factDur) closeFact();
      }
    }
    updateCam(dt);
  }
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  const ti = G.pl.length && phase !== 'title' ? G.ti : SETUP.theme;
  if (bgTheme !== ti) { bgTheme = ti; bgCv = buildBg(ti); }
  ctx.drawImage(bgCv, 0, 0, W, H);
  drawAmbient(ctx, ti, paused ? 0 : dt);
  if (phase === 'play' || phase === 'over') {
    if (phase === 'over') ctx.globalAlpha = 0.45;
    drawBoard(ctx, paused ? 0 : dt);
    ctx.globalAlpha = 1;
    if (phase === 'play') {
      drawChips(ctx); drawTray(ctx); drawHud(ctx); drawBanner(ctx, paused ? 0 : dt);
    } else {
      drawOver(ctx, dt);
    }
    drawParts(ctx, 'screen');
  } else if (phase === 'title') {
    drawTitle(ctx, dt);
  } else {
    ctx.fillStyle = 'rgba(255,255,255,.1)'; ctx.fillRect(0, 0, W, H);
  }
  requestAnimationFrame(frame);
}

/* =====================================================================
 * 選單（DOM）
 * ===================================================================== */
function $(id) { return document.getElementById(id); }
let curScreen = null, helpReturn = 'sTitle';
function showScreen(id) {
  document.querySelectorAll('.scr').forEach(el => el.classList.toggle('on', el.id === id));
  curScreen = id;
}
function segSet(el, val) { el.querySelectorAll('button').forEach(b => b.classList.toggle('on', b.dataset.v === String(val))); }
function segBind(el, fn) { el.addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; sfx('select'); fn(b.dataset.v); }); }
function refreshToggles() {
  const m = KG.music.isEnabled();
  $('tMusic1').textContent = '音樂：' + (m ? '開' : '關');
  $('tSfx1').textContent = '音效：' + (sfxOn ? '開' : '關');
  segSet($('segMusic'), m ? 1 : 0); segSet($('segSfx'), sfxOn ? 1 : 0); segSet($('segVoice'), R.voice ? 1 : 0);
  segSet($('segSpd2'), SETUP.speed);
  const best = KG.best('snakes-ladders-turns');
  $('statLine').textContent = '對戰 ' + STATS.games + ' 場・真人勝 ' + STATS.wins + ' 場' + (best != null ? '・最快 ' + best + ' 回合' : '');
}
function setMusic(on) { KG.music.setEnabled(on); refreshToggles(); }
function setSfx(on) { sfxOn = !!on; KG.store.set('snakes:sfx', sfxOn); refreshToggles(); if (sfxOn) sfx('ui'); }
function saveSetup() { KG.store.set('snakes:setup', SETUP); }
function saveRules() { KG.store.set('snakes:rules', R); }
$('tMusic1').onclick = () => { setMusic(!KG.music.isEnabled()); sfx('ui'); };
$('tSfx1').onclick = () => setSfx(!sfxOn);
segBind($('segMusic'), v => setMusic(v === '1'));
segBind($('segSfx'), v => setSfx(v === '1'));
segBind($('segVoice'), v => { R.voice = v === '1'; saveRules(); refreshToggles(); if (!R.voice) try { window.speechSynthesis.cancel(); } catch (e) { /* 忽略 */ } });
segBind($('segSpd2'), v => { SETUP.speed = +v; G.spd = SPEEDS[SETUP.speed]; saveSetup(); refreshToggles(); });

function goTitle() {
  phase = 'title'; G.paused = false; timers = []; G.anim = null; G.pl = []; G.st = 'idle';
  $('pauseBtn').classList.remove('on');
  for (const p of parts) p.on = false;
  banner = null;
  layout(); ensureArt();
  refreshToggles(); showScreen('sTitle');
  KG.music.setTempo(1);
  playSong(SONG_MENU);
}
$('bPlay').onclick = () => { sfx('select'); openSetup(); };
$('bHelp').onclick = () => { sfx('ui'); openHelp('sTitle'); };

/* ---------- 玩家與棋盤設定 ---------- */
function openSetup() { phase = 'setup'; renderSetup(); showScreen('sSetup'); }
let boardThumbs = null;
function renderSetup() {
  segSet($('segN'), SETUP.n);
  const box = $('plist'); box.innerHTML = '';
  SETUP.players.slice(0, SETUP.n).forEach((p, n) => {
    const col = PCOL[n];
    const row = document.createElement('div');
    row.className = 'prow';
    row.style.setProperty('--pc', col.c); row.style.setProperty('--pl', col.l); row.style.setProperty('--pd', col.d);
    row.innerHTML = '<button class="pa" aria-label="換動物"><canvas width="112" height="112"></canvas></button>' +
      '<input class="pname" maxlength="6" aria-label="名字">' +
      '<div class="seg ptype"><button data-v="0">真人</button><button data-v="1">電腦</button></div>';
    const cvs = row.querySelector('canvas');
    const paint = () => { const g = cvs.getContext('2d'); g.clearRect(0, 0, 112, 112); g.fillStyle = col.l; g.fillRect(0, 0, 112, 112); g.drawImage(buildPawn(p.animal, col, 112), 0, 4, 112, 112); };
    paint();
    const inp = row.querySelector('input');
    inp.value = p.name;
    inp.addEventListener('input', () => { p.name = inp.value.slice(0, 6); saveSetup(); });
    row.querySelector('.pa').addEventListener('click', () => {
      const used = SETUP.players.slice(0, SETUP.n).map(q => q.animal);
      let a = p.animal;
      for (let k = 0; k < ANIMALS.length; k++) { a = (a + 1) % ANIMALS.length; if (used.indexOf(a) < 0) break; }
      const oldName = ANIMALS[p.animal].name;
      p.animal = a;
      if (!p.name || p.name === oldName) { p.name = ANIMALS[a].name; inp.value = p.name; }
      paint(); saveSetup(); sfx('pop'); hopBlip(a, 0);
    });
    const seg = row.querySelector('.ptype');
    segSet(seg, p.ai ? 1 : 0);
    segBind(seg, v => { p.ai = +v; segSet(seg, p.ai ? 1 : 0); saveSetup(); });
    box.appendChild(row);
  });
  // 棋盤
  const bb = $('boards');
  if (!bb.children.length) {
    THEMES.forEach((th, i) => {
      const b = document.createElement('button');
      b.dataset.v = i;
      b.innerHTML = '<canvas width="120" height="120"></canvas><span>' + th.name.slice(0, 2) + '</span>';
      b.addEventListener('click', () => { SETUP.theme = i; saveSetup(); renderBoards(); sfx('select'); bgTheme = -1; });
      bb.appendChild(b);
    });
  }
  renderBoards();
  // 規則
  const rl = $('rlist'); rl.innerHTML = '';
  RULE_DEFS.forEach(d => {
    const row = document.createElement('div'); row.className = 'row rrow';
    row.innerHTML = '<span><span class="lbl">' + d.name + '</span><span class="desc">' + d.desc + '</span></span><div class="seg"><button data-v="1">開</button><button data-v="0">關</button></div>';
    const seg = row.querySelector('.seg');
    segSet(seg, R[d.key] ? 1 : 0);
    segBind(seg, v => { R[d.key] = v === '1'; segSet(seg, R[d.key] ? 1 : 0); saveRules(); if (d.key === 'slides') renderBoards(); });
    rl.appendChild(row);
  });
}
function renderBoards() {
  const bb = $('boards');
  [...bb.children].forEach((b, i) => {
    b.classList.toggle('on', i === SETUP.theme);
    const c = b.querySelector('canvas'), g = c.getContext('2d');
    const key = i + ':' + useSlides(THEMES[i]);
    if (c.dataset.k !== key) { c.dataset.k = key; g.clearRect(0, 0, 120, 120); g.drawImage(buildBoard(i, 240, useSlides(THEMES[i]), true), 0, 0, 120, 120); }
  });
}
segBind($('segN'), v => { SETUP.n = +v; saveSetup(); renderSetup(); });
$('bSetupBack').onclick = () => { sfx('back'); goTitle(); };
$('bGo').onclick = () => {
  // 名字不能空白
  SETUP.players.forEach(p => { if (!String(p.name || '').trim()) p.name = ANIMALS[p.animal].name; });
  saveSetup(); sfx('go'); newGame();
};

/* ---------- 說明 ---------- */
const HELP = [
  ['die', '擲骰子', '輪到你時，點骰子或「擲骰子！」按鈕（鍵盤按空白鍵）。棋子會一格一格往前跳，一邊跳一邊數。'],
  ['ladder', '爬梯子', '停在梯子的下面，就能一路爬上去！'],
  ['snake', '蛇與溜滑梯', '停在蛇頭（或溜滑梯頂端），就會溜到下面去。「溜滑梯版」把蛇換成可愛的溜滑梯。'],
  ['bulb', '小知識格', '停在亮亮的燈泡格，會出現一張小知識卡，還會念給你聽。'],
  ['math', '數學模式', '走之前先算算看：「現在的格子＋擲到的點數」會到第幾格？選對了才出發。'],
  ['flag', '終點', '最先走到第 100 格的人贏！開啟「剛好走到 100」時，點數太多會往回彈。']
];
function drawHelpIcon(g, kind) {
  const s = 128; g.clearRect(0, 0, s, s);
  const th = THEMES[SETUP.theme];
  g.fillStyle = th.tiles[0]; rr(g, 0, 0, s, s, 20); g.fill();
  if (kind === 'die') drawDie(g, s / 2, s / 2, s * 0.26, targetQ(5));
  else if (kind === 'ladder') { const c = s * 0.36; g.save(); g.translate(s / 2, s / 2); g.rotate(0.35); g.translate(-1.5 * c, -8.5 * c); drawLadder(g, 2, 22, c, th.ladder); g.restore(); }
  else if (kind === 'snake') {
    const c = s * 0.24; g.save(); g.translate(s / 2 - 3 * c, s / 2 - 8.5 * c);
    if (useSlides(th)) drawSlide(g, curvePath(24, 3, 'slide', 9), c, SLIDE_COLS[1]); else drawSnake(g, curvePath(24, 3, 'snake', 9), c, th.snakeCols[0], th.pattern);
    g.restore();
  }
  else if (kind === 'bulb') drawBulb(g, s / 2, s / 2, s * 0.3);
  else if (kind === 'math') { txt(g, '3+4', s / 2, s * 0.4, s * 0.3, '#2f5d8a'); txt(g, '=7', s / 2, s * 0.72, s * 0.3, '#2f9e44'); }
  else if (kind === 'flag') { drawFlag(g, s * 0.38, s * 0.5, s * 0.6); txt(g, '100', s * 0.62, s * 0.78, s * 0.24, '#7a4a00', { stroke: '#fff', flat: true, sw: 5 }); }
}
function openHelp(ret) {
  helpReturn = ret;
  const box = $('hlist'); box.innerHTML = '';
  HELP.forEach(([k, t, d]) => {
    const it = document.createElement('div'); it.className = 'hitem';
    it.innerHTML = '<canvas width="128" height="128"></canvas><div><b>' + t + '</b><p>' + d + '</p></div>';
    drawHelpIcon(it.querySelector('canvas').getContext('2d'), k);
    box.appendChild(it);
  });
  showScreen('sHelp');
}
$('bHelpBack').onclick = () => { sfx('back'); showScreen(helpReturn); };

/* ---------- 問題卡、小知識卡 ---------- */
$('mathC').addEventListener('click', e => { const b = e.target.closest('button'); if (b) answerMath(+b.dataset.v); });
$('bFact').onclick = () => closeFact();

/* ---------- 暫停 ---------- */
function togglePause() {
  if (phase !== 'play') return;
  G.paused = !G.paused;
  if (G.paused) {
    KG.music.pause(); refreshToggles(); showScreen('sPause'); sfx('back');
    try { if (window.speechSynthesis) window.speechSynthesis.cancel(); } catch (e) { /* 忽略 */ }
  } else {
    KG.music.resume();
    showScreen(G.st === 'math' ? 'sMath' : G.st === 'fact' ? 'sFact' : null);
    sfx('select');
  }
}
$('pauseBtn').onclick = () => togglePause();
$('bResume').onclick = () => togglePause();
$('bHelp2').onclick = () => { sfx('ui'); openHelp('sPause'); };
$('bRestart').onclick = () => { sfx('select'); KG.music.resume(); newGame(); };
$('bQuit').onclick = () => { sfx('back'); KG.music.resume(); goTitle(); };
$('bAgain').onclick = () => { sfx('select'); newGame(); };
$('bMenu').onclick = () => { sfx('back'); goTitle(); };

/* =====================================================================
 * 測試用掛勾
 * ===================================================================== */
window.__sl = {
  get G() { return G; }, get phase() { return phase; }, get R() { return R; }, get L() { return L; }, get cam() { return cam; },
  setRules(o) { Object.assign(R, o); },
  setup(o) { Object.assign(SETUP, o); },
  start() { newGame(); },
  forceDice(...v) { G.forced.push(...v); },
  turbo(on) { G.turbo = !!on; },
  roll() { doRoll(); },
  setPos(i, n) { G.pl[i].pos = n; restAll(true); updateTension(); },
  answer(v) { answerMath(v); },
  closeFact, togglePause, THEMES, cellXY,
  validate() {
    const errs = [];
    THEMES.forEach(th => {
      const starts = {}, ends = {};
      th.ladders.forEach(([a, b]) => { if (!(a < b)) errs.push(th.id + ' ladder ' + a); starts[a] = (starts[a] || 0) + 1; ends[b] = 1; });
      th.snakes.forEach(([a, b]) => { if (!(a > b)) errs.push(th.id + ' snake ' + a); starts[a] = (starts[a] || 0) + 1; ends[b] = 1; });
      for (const k in starts) { if (starts[k] > 1) errs.push(th.id + ' dup ' + k); if (ends[k]) errs.push(th.id + ' chain ' + k); if (+k === 1 || +k === 100) errs.push(th.id + ' edge ' + k); }
      th.facts.forEach(f => { if (starts[f] || ends[f] || f === 1 || f === 100) errs.push(th.id + ' fact ' + f); });
      if (th.factText.length < th.facts.length) errs.push(th.id + ' facts text');
    });
    return errs;
  }
};

/* ---------- 開始 ---------- */
resize();
goTitle();
requestAnimationFrame(t => { lastT = t; frame(t); });
</script>
