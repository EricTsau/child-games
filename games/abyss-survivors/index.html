<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>深淵倖存者</title>
<link rel="stylesheet" href="../../assets/common.css">
<style>
  :root {
    --ab-gold: #d9b25f; --ab-gold2: #f3d58a; --ab-gold-dim: #8a6d33; --ab-ink: #e9e2d0; --ab-dim: #a99f8a;
    --ab-bg: rgba(14, 10, 18, .92); --ab-panel: linear-gradient(180deg, rgba(34, 26, 38, .96), rgba(16, 12, 20, .96));
    --ab-red: #d8463a; --ab-blue: #5aa8ff; --ab-font: "Noto Serif TC", "Songti TC", "PMingLiU", "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", serif;
    --ab-sans: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
  }
  html, body { height: 100%; overflow: hidden; background: #07060a; color: var(--ab-ink); font-family: var(--ab-sans); }
  canvas.layer { position: fixed; inset: 0; width: 100vw; height: 100vh; height: 100dvh; display: block; }
  #gl, #c2d, #fx { pointer-events: none; }
  #fx { z-index: 3; }
  #touch { position: fixed; inset: 0; z-index: 5; touch-action: none; }
  #msg { position: fixed; inset: 0; display: grid; place-items: center; color: var(--ab-gold); font: 700 20px var(--ab-font); z-index: 1; }

  /* ---------- HUD ---------- */
  #hud { position: fixed; inset: 0; z-index: 10; pointer-events: none; display: none; font-family: var(--ab-sans); }
  #hud.on { display: block; }
  #xpbar { position: absolute; left: 0; right: 0; top: 0; height: 7px; background: rgba(0,0,0,.6); border-bottom: 1px solid rgba(217,178,95,.45); }
  #xpfill { height: 100%; width: 0; background: linear-gradient(90deg, #3a6cff, #7ad0ff); box-shadow: 0 0 8px #4a90ff; transition: width .12s linear; }
  #topc { position: absolute; top: 10px; left: 66px; right: 66px; text-align: center; }
  #timer { font: 800 26px/1 var(--ab-font); color: #fff; text-shadow: 0 2px 0 #000, 0 0 12px rgba(217,178,95,.6); letter-spacing: 1px; }
  #timer.warn { color: #ff7a6a; }
  #subinfo { margin-top: 4px; font-size: 12px; color: var(--ab-dim); display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; text-shadow: 0 1px 0 #000; }
  #subinfo b { color: var(--ab-ink); }
  #boss { position: absolute; top: 58px; left: 50%; transform: translateX(-50%); width: min(460px, calc(100% - 140px)); display: none; }
  #boss.on { display: block; }
  @media (max-width: 700px) { #boss { top: auto; bottom: max(34px, env(safe-area-inset-bottom)); left: 14px; right: 118px; width: auto; transform: none; } }
  #bossname { text-align: center; font: 700 13px var(--ab-font); color: #ffb0a0; text-shadow: 0 1px 0 #000; margin-bottom: 3px; }
  #bossbar { height: 10px; border: 1px solid var(--ab-gold-dim); background: rgba(0,0,0,.7); border-radius: 3px; overflow: hidden; }
  #bossfill { height: 100%; width: 100%; background: linear-gradient(90deg, #8a1010, #e04030); transition: width .15s; }
  #lefthud { position: absolute; left: 10px; top: 66px; width: 168px; }
  #hpwrap { position: relative; height: 16px; border: 1px solid var(--ab-gold-dim); background: rgba(0,0,0,.7); border-radius: 4px; overflow: hidden; }
  #hpfill { position: absolute; left: 0; top: 0; bottom: 0; width: 100%; background: linear-gradient(180deg, #e0504a, #8a1a1a); transition: width .1s; }
  #shfill { position: absolute; left: 0; top: 0; height: 4px; width: 0; background: #cfe8ff; }
  #hptext { position: absolute; inset: 0; font-size: 11px; line-height: 16px; text-align: center; color: #fff; font-weight: 700; text-shadow: 0 1px 1px #000; }
  #lvl { margin-top: 4px; font: 700 12px var(--ab-font); color: var(--ab-gold2); text-shadow: 0 1px 0 #000; display: flex; justify-content: space-between; }
  .slots { display: flex; gap: 3px; margin-top: 4px; flex-wrap: wrap; }
  .slot { position: relative; width: 25px; height: 25px; border-radius: 5px; background: rgba(0,0,0,.55); border: 1px solid rgba(217,178,95,.35); }
  .slot svg { width: 100%; height: 100%; display: block; }
  .slot i { position: absolute; right: -2px; bottom: -3px; font: 800 9px/1 var(--ab-sans); font-style: normal; color: #fff; background: #000; border: 1px solid var(--ab-gold-dim); border-radius: 4px; padding: 1px 2px; }
  .slot i.max { color: #ffd84a; }
  #buffs { margin-top: 4px; display: flex; gap: 4px; flex-wrap: wrap; font-size: 10px; }
  #buffs span { background: rgba(0,0,0,.6); border-radius: 4px; padding: 1px 4px; border: 1px solid currentColor; }
  #pausebtn { position: absolute; right: 10px; top: 66px; width: 44px; height: 44px; border-radius: 50%; pointer-events: auto; cursor: pointer;
    background: rgba(18,12,22,.8); border: 2px solid var(--ab-gold-dim); display: grid; place-items: center; touch-action: manipulation; }
  #pausebtn::before, #pausebtn::after { content: ''; position: absolute; top: 13px; width: 5px; height: 16px; background: var(--ab-gold2); border-radius: 1px; }
  #pausebtn::before { left: 14px; } #pausebtn::after { right: 14px; }
  #dashbtn { position: absolute; right: max(18px, env(safe-area-inset-right)); bottom: max(22px, env(safe-area-inset-bottom)); width: 86px; height: 86px; border-radius: 50%;
    pointer-events: auto; touch-action: none; background: radial-gradient(circle at 50% 40%, rgba(60,44,70,.9), rgba(16,10,20,.9)); border: 2px solid var(--ab-gold-dim); display: grid; place-items: center; }
  #dashbtn svg.ring { position: absolute; inset: -4px; width: calc(100% + 8px); height: calc(100% + 8px); transform: rotate(-90deg); }
  #dashbtn .lab { font: 800 15px var(--ab-font); color: var(--ab-gold2); text-shadow: 0 1px 0 #000; }
  #dashbtn .ch { position: absolute; bottom: 10px; font-size: 11px; color: #cfe8ff; }
  #dashbtn.cool .lab { opacity: .45; }
  #dashbtn:active { transform: scale(.94); }
  body.nodash #dashbtn { display: none; }
  #stick { position: fixed; z-index: 11; width: 120px; height: 120px; margin: -60px 0 0 -60px; border-radius: 50%; display: none; pointer-events: none;
    border: 2px solid rgba(217,178,95,.45); background: radial-gradient(circle, rgba(217,178,95,.08), rgba(0,0,0,.25)); }
  #knob { position: absolute; left: 50%; top: 50%; width: 52px; height: 52px; margin: -26px 0 0 -26px; border-radius: 50%; background: radial-gradient(circle at 40% 35%, #f3d58a, #8a6d33); box-shadow: 0 0 12px rgba(217,178,95,.6); }
  #hint { position: absolute; bottom: 120px; left: 0; right: 0; text-align: center; font-size: 13px; color: rgba(233,226,208,.7); text-shadow: 0 1px 0 #000; transition: opacity .6s; }

  /* ---------- menus ---------- */
  #menu { position: fixed; inset: 0; z-index: 50; display: none; overflow-y: auto; overflow-x: hidden; -webkit-overflow-scrolling: touch; }
  #menu.on { display: block; }
  #menu.dim { background: rgba(6,4,8,.84); }
  .scr { min-height: 100%; padding: 66px 12px 24px; display: flex; flex-direction: column; align-items: center; gap: 12px; }
  .scr.center { justify-content: center; }
  .panel { width: min(560px, 100%); background: var(--ab-panel); border: 1px solid var(--ab-gold-dim); border-radius: 12px; padding: 14px;
    box-shadow: 0 0 0 1px rgba(0,0,0,.6), 0 12px 40px rgba(0,0,0,.6), inset 0 0 30px rgba(217,178,95,.06); position: relative; }
  .panel.wide { width: min(860px, 100%); }
  .panel::before, .panel::after { content: ''; position: absolute; width: 14px; height: 14px; border: 2px solid var(--ab-gold); }
  .panel::before { left: -2px; top: -2px; border-right: 0; border-bottom: 0; border-radius: 8px 0 0 0; }
  .panel::after { right: -2px; bottom: -2px; border-left: 0; border-top: 0; border-radius: 0 0 8px 0; }
  h1.logo { margin: 0; font: 900 clamp(38px, 11vw, 64px)/1.05 var(--ab-font); letter-spacing: 6px; text-align: center; color: #f3d58a;
    background: linear-gradient(180deg, #fff3cf, #d9b25f 55%, #7a5524); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
    filter: drop-shadow(0 3px 0 #000) drop-shadow(0 0 18px rgba(217,120,60,.45)); }
  .sub { text-align: center; color: var(--ab-dim); font: 600 13px var(--ab-font); letter-spacing: 4px; margin-top: 4px; }
  h2 { margin: 0 0 10px; font: 800 22px var(--ab-font); color: var(--ab-gold2); text-align: center; letter-spacing: 2px; text-shadow: 0 2px 0 #000; }
  h3 { margin: 8px 0 6px; font: 700 15px var(--ab-font); color: var(--ab-gold); }
  .btn { font: 800 17px var(--ab-font); color: #f8ecd0; padding: 11px 18px; border-radius: 8px; border: 1px solid var(--ab-gold); cursor: pointer; letter-spacing: 1px;
    background: linear-gradient(180deg, #5a3a26, #2a1a14); box-shadow: inset 0 1px 0 rgba(255,220,150,.3), 0 3px 0 #000; text-shadow: 0 1px 0 #000; touch-action: manipulation; min-height: 44px; }
  .btn:active { transform: translateY(2px); box-shadow: inset 0 1px 0 rgba(255,220,150,.3), 0 1px 0 #000; }
  .btn.primary { background: linear-gradient(180deg, #a8402a, #5a160e); border-color: #f3b06a; }
  .btn.dark { background: linear-gradient(180deg, #2c2432, #16101a); border-color: var(--ab-gold-dim); }
  .btn.small { font-size: 14px; padding: 7px 10px; min-height: 36px; }
  .btn[disabled] { opacity: .4; cursor: default; filter: grayscale(.6); }
  .btn.sel { outline: 2px solid #ffd84a; outline-offset: 1px; }
  .col { display: flex; flex-direction: column; gap: 10px; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
  .gold { color: #ffd84a; font-weight: 800; }
  .muted { color: var(--ab-dim); font-size: 13px; }
  .goldbar { display: flex; justify-content: center; gap: 6px; align-items: center; font: 800 16px var(--ab-font); color: #ffd84a; }
  .goldbar svg { width: 20px; height: 20px; }
  .ico { width: 44px; height: 44px; flex: none; border-radius: 8px; overflow: hidden; }
  .ico svg { width: 100%; height: 100%; display: block; }

  /* hero / stage cards */
  .grid { display: grid; gap: 8px; grid-template-columns: repeat(auto-fill, minmax(128px, 1fr)); width: 100%; }
  .hcard .ico { width: 38px; height: 38px; }
  @media (max-width: 360px) { .hcard .nm { font-size: 13.5px; } .hcard { gap: 6px; padding: 6px; } }
  .hcard { border: 1px solid #3a2e40; border-radius: 10px; padding: 7px; background: rgba(0,0,0,.35); cursor: pointer; display: flex; gap: 8px; align-items: center; min-height: 64px; }
  .hcard.sel { border-color: var(--ab-gold); box-shadow: 0 0 0 1px var(--ab-gold), 0 0 16px rgba(217,178,95,.3); }
  .hcard.locked { opacity: .55; }
  .hcard .nm { font: 800 15px var(--ab-font); color: var(--ab-ink); white-space: nowrap; }
  .hcard .ds { font-size: 11px; color: var(--ab-dim); }
  .detail { border-top: 1px solid #3a2e40; margin-top: 10px; padding-top: 10px; font-size: 13px; line-height: 1.5; }
  .statrow { display: grid; grid-template-columns: 56px 1fr 40px; gap: 6px; align-items: center; font-size: 12px; margin: 2px 0; }
  .statrow .bar { height: 7px; background: #241c28; border-radius: 4px; overflow: hidden; }
  .statrow .bar b { display: block; height: 100%; background: linear-gradient(90deg, #8a6d33, #f3d58a); }
  .diffs { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
  .diffs .btn { padding: 8px 4px; font-size: 15px; }

  /* choice cards */
  .cards { display: grid; gap: 10px; width: min(880px, 100%); grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); }
  .card { position: relative; border-radius: 12px; padding: 12px 10px; background: linear-gradient(180deg, rgba(40,30,44,.97), rgba(14,10,18,.97)); cursor: pointer;
    border: 2px solid var(--rc, #888); box-shadow: 0 0 18px -4px var(--rc, #888), inset 0 0 22px -10px var(--rc, #888); display: flex; flex-direction: column; align-items: center; gap: 6px; text-align: center;
    animation: cardin .35s cubic-bezier(.2,1.4,.4,1) both; touch-action: manipulation; }
  .card:active { transform: scale(.97); }
  .card .ico { width: 56px; height: 56px; }
  .card .nm { font: 800 17px var(--ab-font); color: #fff; }
  .card .lv { font-size: 12px; color: var(--rc); font-weight: 800; }
  .card .ds { font-size: 13px; color: #d8cfbf; line-height: 1.4; }
  .card .tag { position: absolute; top: 6px; right: 8px; font-size: 11px; font-weight: 800; color: var(--rc); }
  .card.banishing { border-style: dashed; animation: wob .5s infinite alternate; }
  @keyframes cardin { from { opacity: 0; transform: translateY(18px) scale(.9); } to { opacity: 1; transform: none; } }
  @keyframes wob { from { transform: rotate(-1deg); } to { transform: rotate(1deg); } }
  @media (max-width: 600px) {
    .cards { grid-template-columns: 1fr; gap: 8px; }
    .card { flex-direction: row; text-align: left; padding: 9px 10px; align-items: center; }
    .card .ico { width: 48px; height: 48px; }
    .card .txt { flex: 1; min-width: 0; }
  }
  @media (max-height: 460px) and (min-width: 601px) {
    .scr { padding-top: 12px; padding-left: 70px; padding-right: 70px; }
    .card { padding: 8px; gap: 3px; }
    .card .ico { width: 42px; height: 42px; }
    .card .ds { font-size: 12px; }
    h2 { margin-bottom: 4px; font-size: 19px; }
  }

  /* build / stats */
  .build { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 6px; }
  .bitem { display: flex; align-items: center; gap: 6px; background: rgba(0,0,0,.3); border-radius: 8px; padding: 4px; font-size: 12px; }
  .bitem .ico { width: 34px; height: 34px; }
  .stats { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 2px 10px; font-size: 12px; }
  .stats div { display: flex; justify-content: space-between; border-bottom: 1px dotted #3a2e40; padding: 2px 0; }
  .stats b { color: var(--ab-gold2); }
  table.dmg { width: 100%; border-collapse: collapse; font-size: 13px; }
  table.dmg td { padding: 3px 4px; border-bottom: 1px solid #2a2230; }
  table.dmg td:last-child { text-align: right; color: var(--ab-gold2); }
  .bigstat { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; text-align: center; }
  .bigstat div { background: rgba(0,0,0,.35); border-radius: 8px; padding: 6px 2px; font-size: 11px; color: var(--ab-dim); }
  .bigstat b { display: block; font: 800 18px var(--ab-font); color: #fff; }

  /* items */
  .inv { display: grid; grid-template-columns: repeat(auto-fill, minmax(42px, 1fr)); gap: 5px; }
  .it { position: relative; aspect-ratio: 1; border-radius: 8px; border: 2px solid var(--rc, #444); background: rgba(0,0,0,.45); cursor: pointer; padding: 2px; }
  .it svg { width: 100%; height: 100%; display: block; }
  .it.empty { border: 1px dashed #3a2e40; cursor: default; }
  .it.eq::after { content: 'E'; position: absolute; left: 2px; top: 1px; font: 800 10px var(--ab-sans); color: #ffd84a; }
  .it.sel { box-shadow: 0 0 0 2px #fff; }
  .it .new { position: absolute; right: 1px; top: 0; font-size: 9px; color: #ff6a5a; font-weight: 800; }
  .eqslots { display: grid; grid-template-columns: repeat(5, minmax(0, 76px)); justify-content: center; gap: 8px; }
  .eqslots .lab { text-align: center; font-size: 11px; color: var(--ab-dim); margin-top: 2px; }
  .itemdet { font-size: 13px; line-height: 1.55; }
  .itemdet .nm { font: 800 16px var(--ab-font); }
  .itemdet .aff { color: #cfe0ff; }
  .itemdet .leg { color: #ffb060; }
  .itemdet .up { color: #7ae07a; } .itemdet .down { color: #ff7a6a; }
  .cmp { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .cmp > div { background: rgba(0,0,0,.3); border-radius: 8px; padding: 8px; border: 1px solid #2c2432; }
  .loot { display: grid; grid-template-columns: repeat(auto-fill, minmax(64px, 1fr)); gap: 8px; }
  .loot .it { animation: flip .5s cubic-bezier(.2,1.3,.4,1) both; }
  .loot .it.legendary { box-shadow: 0 0 16px #ff9a2a; }
  @keyframes flip { from { transform: rotateY(90deg) scale(.6); opacity: 0; } to { transform: none; opacity: 1; } }

  /* talents */
  .tal { display: grid; grid-template-columns: 40px 1fr auto; gap: 8px; align-items: center; padding: 6px; border-bottom: 1px solid #2a2230; }
  .tal .ico { width: 40px; height: 40px; }
  .tal .nm { font: 800 14px var(--ab-font); }
  .tal .pips { display: flex; gap: 2px; margin-top: 3px; flex-wrap: wrap; }
  .tal .pips i { width: 9px; height: 5px; background: #2a2230; border-radius: 1px; }
  .tal .pips i.on { background: #ffd84a; }
  .tabs { display: flex; gap: 6px; justify-content: center; }
  .set { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 8px; padding: 8px 2px; border-bottom: 1px solid #2a2230; font-size: 15px; }
  .seg { display: flex; gap: 3px; flex-wrap: wrap; justify-content: flex-end; }
  .seg .btn { padding: 6px 9px; font-size: 13px; min-height: 34px; }

  /* ---------- sheet layout (header / scrolling body / pinned footer) ---------- */
  #menu.sheetmode { overflow: hidden; }
  .sw { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: flex-end;
    padding: 64px 10px 0; pointer-events: none; }
  .sw > .sheet { pointer-events: auto; }
  .sheet { position: relative; width: min(600px, 100%); max-height: 100%; min-height: 0; display: flex; flex-direction: column;
    background: var(--ab-panel); border: 1px solid var(--ab-gold-dim); border-bottom: 0; border-radius: 14px 14px 0 0;
    box-shadow: 0 0 0 1px rgba(0,0,0,.6), 0 -6px 18px rgba(0,0,0,.5); }
  .sheet::before { content: ''; position: absolute; left: 14px; right: 14px; top: -1px; height: 2px; background: linear-gradient(90deg, transparent, var(--ab-gold), transparent); }
  .shead { flex: none; padding: 10px 12px 6px; }
  .shead h2 { margin: 0 0 6px; }
  .sbody { flex: 1 1 auto; min-height: 0; overflow-y: auto; overflow-x: hidden; padding: 4px 12px 10px; -webkit-overflow-scrolling: touch; overscroll-behavior: contain; display: flex; flex-direction: column; }
  .sbody > * { flex: none; }
  .sfoot { flex: none; display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; padding: 8px 12px max(10px, env(safe-area-inset-bottom)); border-top: 1px solid #3a2e40; background: rgba(10,7,12,.55); }
  .sfoot .btn { flex: 1 1 0; min-width: 0; padding-left: 8px; padding-right: 8px; white-space: nowrap; }
  .sfoot .btn.grow { flex-grow: 2; }
  .sfoot .btn.wide { flex-basis: 100%; }
  .sw.dock .sheet { max-height: min(100%, 60vh); max-height: min(100%, 60dvh); }
  .sw.full .sheet { flex: 1 1 auto; }
  .sw.center { justify-content: center; padding-bottom: 12px; }
  .sw.center .sheet { width: min(400px, 100%); border-bottom: 1px solid var(--ab-gold-dim); border-radius: 14px; }
  .sw.bare { justify-content: center; padding-bottom: 8px; }
  .sw.bare .sheet { width: min(880px, 100%); flex: 0 1 auto; background: none; border: 0; box-shadow: none; }
  .sw.bare .sheet::before { display: none; }
  .sw.bare .sfoot { background: none; border: 0; }
  .sw.side .sheet { width: min(420px, 100%); }
  .sw.side .shead { text-align: center; }
  .sw.side .sbody { gap: 8px; }
  .sw.side .logo { font-size: clamp(34px, min(11vw, 9vh), 60px); }
  @media (min-aspect-ratio: 1/1) {
    .sw { padding: 10px 66px 0; }
    .sw.dock, .sw.side { align-items: flex-end; justify-content: center; padding-bottom: 10px; }
    .sw.dock .sheet, .sw.side .sheet { max-height: 100%; flex: 0 1 auto; border-bottom: 1px solid var(--ab-gold-dim); border-radius: 14px; }
    .sw.dock .sheet { width: min(58%, 720px); }
    .sw.side .sheet { width: min(44%, 460px); }
    .sw.full .sheet { width: min(720px, 100%); }
  }
  /* hero tiles: one row of five */
  .tiles { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
  .htile { position: relative; border: 1px solid #3a2e40; border-radius: 9px; background: rgba(0,0,0,.35); padding: 5px 2px 4px; text-align: center; cursor: pointer; min-width: 0; touch-action: manipulation; }
  .htile .ico { width: min(46px, 100%); height: auto; aspect-ratio: 1; margin: 0 auto; position: relative; overflow: visible; }
  .htile .nm { font: 700 11.5px var(--ab-font); margin-top: 3px; line-height: 1.15; color: var(--ab-ink); word-break: keep-all; overflow-wrap: anywhere; }
  .htile.sel { border-color: var(--ab-gold); box-shadow: 0 0 0 1px var(--ab-gold), 0 0 14px rgba(217,178,95,.35); }
  .htile.locked .ico svg { filter: grayscale(1) brightness(.55); }
  .htile.locked .nm { color: var(--ab-dim); }
  .htile .lk { position: absolute; right: -4px; bottom: -4px; font-size: 14px; }
  .detail.d2 { border: 0; margin: 0; padding: 0; }
  .dhead { display: flex; flex-direction: column; gap: 2px; margin-bottom: 6px; }
  .dhead b { font: 800 18px var(--ab-font); }
  .wline { display: flex; gap: 8px; align-items: center; margin: 6px 0; font-size: 13px; }
  .wline .ico { width: 34px; height: 34px; }
  .trait { color: #f3d58a; font-size: 13px; margin-bottom: 6px; line-height: 1.45; }
  .stats2 { display: grid; grid-template-columns: 1fr 1fr; gap: 1px 14px; }
  .stats2 .statrow { grid-template-columns: 30px 1fr 38px; margin: 1px 0; }
  /* stage tiles */
  .stiles { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  .scard { border: 1px solid #3a2e40; border-left: 4px solid var(--ac); border-radius: 9px; background: rgba(0,0,0,.35); padding: 6px 8px; cursor: pointer; min-width: 0; touch-action: manipulation; }
