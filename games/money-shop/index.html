<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>認識錢幣</title>
<link rel="stylesheet" href="../../assets/common.css">
<style>

  #game {
    position: fixed; inset: 0; display: block;

</style>
</head>
<body>
<canvas id="game" aria-label="認識錢幣"></canvas>
<script src="../../assets/common.js"></script>
<script src="../../assets/kg-music.js"></script>
<script>
'use strict';
/* =====================================================================
 * 認識錢幣：給小朋友認識新臺幣（1、5、10、50 元硬幣，100、500、1000 元紙鈔）
 * 認識錢幣頁＋五個小遊戲（數一數、湊湊看、開店囉、比比看、存錢筒），每個 6 關。
 * 所有圖案都用程式畫（不是真的鈔票圖樣），聲音用 kg-music.js 合成。
 * ===================================================================== */
const SLUG = 'money-shop';
const cv = document.getElementById('game');
let ctx = cv.getContext('2d');
const FONT = '"Baloo 2","PingFang TC","Noto Sans TC","Microsoft JhengHei","Heiti TC",system-ui,sans-serif';
let W = 0, H = 0, dpr = 1, U = 1, UO = 1, time = 0;

/* ---------- 數學與緩動 ---------- */
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const TAU = Math.PI * 2;
const Ease = {
  outCubic: t => 1 - Math.pow(1 - t, 3),
  inOutSine: t => -(Math.cos(Math.PI * t) - 1) / 2,
  outBack: t => { const c = 1.70158, c3 = c + 1; return 1 + c3 * Math.pow(t - 1, 3) + c * Math.pow(t - 1, 2); },
  outElastic: t => (t === 0 || t === 1) ? t : Math.pow(2, -10 * t) * Math.sin((t * 10 - 0.75) * (TAU / 3)) + 1
};
const sum = a => { let s = 0; for (const v of a) s += v; return s; };
const inRect = (x, y, r, pad) => r && x >= r.x - (pad || 0) && x <= r.x + r.w + (pad || 0) && y >= r.y - (pad || 0) && y <= r.y + r.h + (pad || 0);

/* ---------- 補間動畫 ---------- */
let tweens = [];
function tween(obj, to, dur, ease, delay, done) {
  const tw = { obj, to, from: null, dur: dur || 0.3, ease: typeof ease === 'function' ? ease : (Ease[ease] || Ease.outCubic), t: -(delay || 0), done };
  tweens.push(tw);
  return tw;
}
function updateTweens(dt) {
  if (!tweens.length) return;
  const list = tweens.slice();
  for (const tw of list) {
    tw.t += dt;
    if (tw.t < 0) continue;
    if (!tw.from) { tw.from = {}; for (const k in tw.to) tw.from[k] = tw.obj[k]; }
    const p = Math.min(1, tw.t / tw.dur), e = tw.ease(p);
    for (const k in tw.to) tw.obj[k] = tw.from[k] + (tw.to[k] - tw.from[k]) * e;
    if (p >= 1) { const i = tweens.indexOf(tw); if (i >= 0) tweens.splice(i, 1); if (tw.done) tw.done(); }
  }
}

/* ---------- 畫面震動 ---------- */
let shakeT = 0, shakeAmt = 0;
function shake(amt, dur) { shakeAmt = amt; shakeT = Math.max(shakeT, dur || 0.25); }

/* ---------- 繪圖小工具 ---------- */
function circ(x, y, r) { ctx.moveTo(x + r, y); ctx.arc(x, y, r, 0, TAU); }
function rr(x, y, w, h, r) {
  r = Math.max(0, Math.min(r, w / 2, h / 2));
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}
function starPath(x, y, R, r, rot) {
  ctx.beginPath();
  for (let i = 0; i < 10; i++) {
    const a = (rot || 0) + i * Math.PI / 5 - Math.PI / 2, rad = i % 2 ? r : R;
    ctx.lineTo(x + Math.cos(a) * rad, y + Math.sin(a) * rad);
  }
  ctx.closePath();
}
function heartPath(x, y, s) {
  ctx.beginPath();
  ctx.moveTo(x, y + s * 0.35);
  ctx.bezierCurveTo(x - s * 1.1, y - s * 0.35, x - s * 0.55, y - s * 1.05, x, y - s * 0.45);
  ctx.bezierCurveTo(x + s * 0.55, y - s * 1.05, x + s * 1.1, y - s * 0.35, x, y + s * 0.35);
  ctx.closePath();
}
function shade(hex, amt) {
  const n = parseInt(hex.slice(1), 16);
  const f = v => clamp(v + amt, 0, 255);
  return 'rgb(' + f(n >> 16) + ',' + f((n >> 8) & 255) + ',' + f(n & 255) + ')';
}
function rgba(hex, a) {
  const n = parseInt(hex.slice(1), 16);
  return 'rgba(' + (n >> 16) + ',' + ((n >> 8) & 255) + ',' + (n & 255) + ',' + a + ')';
}
function glossyStar(x, y, R, on, rot) {
  ctx.save();
  ctx.lineJoin = 'round';
  if (on) {
    ctx.fillStyle = 'rgba(160,90,0,0.25)'; starPath(x, y + R * 0.12, R, R * 0.5, rot); ctx.fill();
    const g = ctx.createRadialGradient(x - R * 0.3, y - R * 0.4, R * 0.1, x, y, R * 1.1);
    g.addColorStop(0, '#fffbd0'); g.addColorStop(0.45, '#ffd93d'); g.addColorStop(1, '#f39a0c');
    ctx.fillStyle = g; ctx.strokeStyle = '#c9700a'; ctx.lineWidth = Math.max(1.5, R * 0.12);
    starPath(x, y, R, R * 0.5, rot); ctx.fill(); ctx.stroke();
    ctx.fillStyle = 'rgba(255,255,255,0.75)';
    ctx.beginPath(); ctx.ellipse(x - R * 0.25, y - R * 0.3, R * 0.22, R * 0.12, -0.6, 0, TAU); ctx.fill();
  } else {
    ctx.fillStyle = 'rgba(90,70,110,0.22)'; ctx.strokeStyle = 'rgba(90,70,110,0.35)'; ctx.lineWidth = Math.max(1.5, R * 0.1);
    starPath(x, y, R, R * 0.5, rot); ctx.fill(); ctx.stroke();
  }
  ctx.restore();
}
/** 有外框與陰影的字 */
function txt(s, x, y, size, fill, o) {
  o = o || {};
  ctx.save();
  ctx.font = (o.weight || '900') + ' ' + size + 'px ' + FONT;
  ctx.textAlign = o.align || 'center';
  ctx.textBaseline = o.base || 'middle';
  ctx.lineJoin = 'round';
  if (o.shadow !== false) {
    ctx.fillStyle = o.shadow || 'rgba(60,30,70,0.28)';
    if (o.stroke) { ctx.strokeStyle = ctx.fillStyle; ctx.lineWidth = o.sw || size * 0.22; ctx.strokeText(s, x, y + size * 0.09); }
    ctx.fillText(s, x, y + size * 0.09);
  }
  if (o.stroke) { ctx.strokeStyle = o.stroke; ctx.lineWidth = o.sw || size * 0.22; ctx.strokeText(s, x, y); }
  ctx.fillStyle = fill; ctx.fillText(s, x, y);
  ctx.restore();
}
/** 量字：超過寬度就縮小 */
function fitSize(s, maxW, size, weight) {
  ctx.font = (weight || '900') + ' ' + size + 'px ' + FONT;
  const w = ctx.measureText(s).width;
  return w > maxW ? Math.max(9, size * maxW / w) : size;
}
const PUNCT = '，。！？、：）」';
function wrapLines(s, maxW, size, weight) {
  ctx.font = (weight || '800') + ' ' + size + 'px ' + FONT;
  const lines = []; let cur = '';
  for (const ch of s) {
    const t = cur + ch;
    if (ctx.measureText(t).width > maxW && cur && PUNCT.indexOf(ch) < 0) { lines.push(cur); cur = ch; } else cur = t;
  }
  if (cur) lines.push(cur);
  return lines;
}
/** 遊戲標題字：每個字會彈跳 */
function logo(s, cx, cy, size, colors, outline) {
  ctx.save();
  ctx.font = '900 ' + size + 'px ' + FONT;
  ctx.textBaseline = 'middle'; ctx.textAlign = 'center'; ctx.lineJoin = 'round';
  const chars = [...s];
  const widths = chars.map(c => ctx.measureText(c).width * 1.04);
  const total = widths.reduce((a, b) => a + b, 0);
  let x = cx - total / 2;
  chars.forEach((c, i) => {
    const w = widths[i];
    const bob = Math.sin(time * 3 + i * 0.7) * size * 0.06;
    const rot = Math.sin(time * 2.2 + i) * 0.06;
    ctx.save();
    ctx.translate(x + w / 2, cy + bob); ctx.rotate(rot);
    ctx.strokeStyle = 'rgba(60,30,70,0.3)'; ctx.lineWidth = size * 0.36;
    ctx.strokeText(c, 0, size * 0.1);
    ctx.strokeStyle = outline || '#6b3a12'; ctx.lineWidth = size * 0.34; ctx.strokeText(c, 0, 0);
    ctx.strokeStyle = '#fff'; ctx.lineWidth = size * 0.17; ctx.strokeText(c, 0, 0);
    const col = colors[i % colors.length];
    const g = ctx.createLinearGradient(0, -size / 2, 0, size / 2);
    g.addColorStop(0, shade(col, 70)); g.addColorStop(0.5, col); g.addColorStop(1, shade(col, -35));
    ctx.fillStyle = g; ctx.fillText(c, 0, 0);
    ctx.globalAlpha = 0.55; ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.ellipse(-w * 0.18, -size * 0.25, size * 0.1, size * 0.05, -0.5, 0, TAU); ctx.fill();
    ctx.restore();
    x += w;
  });
  ctx.restore();
}
function hudPanel(x, y, w, h, col, r) {
  rr(x, y + 4, w, h, r == null ? h / 2 : r); ctx.fillStyle = 'rgba(60,30,70,0.18)'; ctx.fill();
  rr(x, y, w, h, r == null ? h / 2 : r);
  ctx.fillStyle = '#fffdf8'; ctx.fill();
  ctx.strokeStyle = col; ctx.lineWidth = 3; ctx.stroke();
}
function progressBar(x, y, w, h, p, col) {
  rr(x, y + 3, w, h, h / 2); ctx.fillStyle = 'rgba(60,30,70,0.2)'; ctx.fill();
  rr(x, y, w, h, h / 2); ctx.fillStyle = '#fff'; ctx.fill();
  ctx.strokeStyle = shade(col, -60); ctx.lineWidth = 2.5; ctx.stroke();
  if (p > 0) {
    const pw = Math.max(h - 6, (w - 6) * clamp(p, 0, 1));
    rr(x + 3, y + 3, pw, h - 6, (h - 6) / 2);
    ctx.fillStyle = col; ctx.fill();
    rr(x + 3 + h * 0.3, y + 4.5, Math.max(0, pw - h * 0.6), (h - 6) * 0.3, 3); ctx.fillStyle = 'rgba(255,255,255,0.55)'; ctx.fill();
  }
}
/** 把東西畫進離屏畫布 */
function paintTo(canvas, fn) {
  const old = ctx;
  ctx = canvas.getContext('2d');
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  try { fn(); } finally { ctx = old; }
}

/* ---------- 粒子（有上限） ---------- */
const MAX_FX = 220;
class FX {
  constructor() { this.list = []; }
  burst(x, y, o) {
    o = o || {};
    const n = Math.min(o.n || 14, MAX_FX - this.list.length), cols = o.colors || ['#ffe066', '#ff8fb1', '#7bd88f', '#6cc4ff', '#ffffff'];
    for (let i = 0; i < n; i++) {
      const a = o.dir != null ? o.dir + (Math.random() - 0.5) * (o.spread || 1.2) : Math.random() * TAU;
      const sp = (o.speed || 220) * (0.4 + Math.random() * 0.8);
      this.list.push({
        x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - (o.up || 0),
        life: (o.life || 0.8) * (0.7 + Math.random() * 0.5), max: o.life || 0.8,
        size: (o.size || 7) * (0.6 + Math.random() * 0.7), color: cols[i % cols.length],
        shape: o.shape || 'star', rot: Math.random() * TAU, vr: (Math.random() - 0.5) * 8,
        g: o.g == null ? 500 : o.g, drag: o.drag == null ? 0.97 : o.drag
      });
    }
  }
  text(x, y, s, o) {
    o = o || {};
    if (this.list.length >= MAX_FX) return;
    this.list.push({ shape: 'text', x, y, vx: 0, vy: o.vy || -70, s, color: o.color || '#fff', size: o.size || 26,
      stroke: o.stroke || '#6b3a12', life: o.life || 1, max: o.life || 1, g: 0, drag: 1, rot: 0, vr: 0, pop: 0 });
  }
  ring(x, y, color, r, life) {
    if (this.list.length >= MAX_FX) return;
    this.list.push({ shape: 'ring', x, y, vx: 0, vy: 0, color: color || '#fff', size: r || 40, life: life || 0.5, max: life || 0.5, g: 0, drag: 1, rot: 0, vr: 0 });
  }
  update(dt) {
    const L = this.list;
    let j = 0;
    for (let i = 0; i < L.length; i++) {
      const p = L[i];
      p.life -= dt;
      if (p.life <= 0) continue;
      p.vy += p.g * dt;
      const d = Math.pow(p.drag, dt * 60);
      p.vx *= d; p.vy *= d;
      p.x += p.vx * dt; p.y += p.vy * dt;
      p.rot += p.vr * dt;
      if (p.pop != null) p.pop += dt;
      L[j++] = p;
    }
    L.length = j;
  }
  draw() {
    for (const p of this.list) {
      const a = clamp(p.life / p.max, 0, 1);
      ctx.save();
      ctx.globalAlpha = p.shape === 'text' ? Math.min(1, a * 2) : Math.min(1, a * 1.6);
      ctx.translate(p.x, p.y); ctx.rotate(p.rot);
      const s = p.size;
      if (p.shape === 'star') { ctx.fillStyle = p.color; starPath(0, 0, s, s * 0.45, 0); ctx.fill(); }
      else if (p.shape === 'sparkle') {
        ctx.fillStyle = p.color; ctx.beginPath();
        ctx.moveTo(0, -s); ctx.quadraticCurveTo(0, 0, s, 0); ctx.quadraticCurveTo(0, 0, 0, s); ctx.quadraticCurveTo(0, 0, -s, 0); ctx.quadraticCurveTo(0, 0, 0, -s); ctx.fill();
      }
      else if (p.shape === 'heart') { ctx.fillStyle = p.color; heartPath(0, 0, s); ctx.fill(); }
      else if (p.shape === 'circle') { ctx.fillStyle = p.color; ctx.beginPath(); circ(0, 0, s * a + 1); ctx.fill(); }
      else if (p.shape === 'ring') { const k = 1 - a; ctx.strokeStyle = p.color; ctx.lineWidth = 6 * a + 1; ctx.beginPath(); circ(0, 0, s * (0.3 + k)); ctx.stroke(); }
      else if (p.shape === 'text') {
        const sc = p.pop < 0.25 ? Ease.outBack(p.pop / 0.25) : 1;
        ctx.scale(sc, sc);
        txt(p.s, 0, 0, p.size, p.color, { stroke: p.stroke, sw: p.size * 0.28 });
      }
      ctx.restore();
    }
  }
}
const fx = new FX();

/* ---------- 按鈕（每一格畫面重新登記） ---------- */
let btnReg = [], pressed = null;
const BTN = {
  green: ['#a6f59c', '#3fbf5c', '#24873e'], pink: ['#ffb3cc', '#f45f93', '#b8366a'], blue: ['#a8e0ff', '#3c9ff0', '#22659e'],
  yellow: ['#fff09a', '#f8b921', '#b57c0b'], purple: ['#dcc6ff', '#9b6ff2', '#5f3fae'], orange: ['#ffd0a0', '#ff8a3d', '#c1561a'],
  white: ['#ffffff', '#f3e9f7', '#b9a2c8']
};
function drawIcon(name, x, y, s, col) {
  ctx.save(); ctx.translate(x, y);
  ctx.fillStyle = col || '#fff'; ctx.strokeStyle = col || '#fff';
  ctx.lineWidth = s * 0.2; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  if (name === 'play') { ctx.beginPath(); ctx.moveTo(-s * 0.35, -s * 0.5); ctx.lineTo(s * 0.5, 0); ctx.lineTo(-s * 0.35, s * 0.5); ctx.closePath(); ctx.fill(); ctx.stroke(); }
  else if (name === 'next' || name === 'prev') {
    if (name === 'prev') ctx.scale(-1, 1);
    ctx.beginPath(); ctx.moveTo(-s * 0.15, -s * 0.42); ctx.lineTo(s * 0.3, 0); ctx.lineTo(-s * 0.15, s * 0.42); ctx.stroke();
  }
  else if (name === 'back') {
    ctx.beginPath(); ctx.moveTo(s * 0.42, 0); ctx.lineTo(-s * 0.38, 0); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(-s * 0.05, -s * 0.36); ctx.lineTo(-s * 0.42, 0); ctx.lineTo(-s * 0.05, s * 0.36); ctx.stroke();
  }
  else if (name === 'pause') { rr(-s * 0.36, -s * 0.4, s * 0.24, s * 0.8, s * 0.08); ctx.fill(); rr(s * 0.12, -s * 0.4, s * 0.24, s * 0.8, s * 0.08); ctx.fill(); }
  else if (name === 'close') { ctx.beginPath(); ctx.moveTo(-s * 0.32, -s * 0.32); ctx.lineTo(s * 0.32, s * 0.32); ctx.moveTo(s * 0.32, -s * 0.32); ctx.lineTo(-s * 0.32, s * 0.32); ctx.stroke(); }
  else if (name === 'replay') {
    ctx.beginPath(); ctx.arc(0, 0, s * 0.42, -Math.PI * 0.3, Math.PI * 1.35); ctx.stroke();
    const a = -Math.PI * 0.3, ex = Math.cos(a) * s * 0.42, ey = Math.sin(a) * s * 0.42;
    ctx.beginPath(); ctx.moveTo(ex + s * 0.2, ey - s * 0.05); ctx.lineTo(ex - s * 0.02, ey + s * 0.25); ctx.lineTo(ex - s * 0.25, ey - s * 0.12); ctx.closePath(); ctx.fill();
  }
  else if (name === 'menu') { for (let i = -1; i <= 1; i += 2) for (let j = -1; j <= 1; j += 2) { rr(i * s * 0.25 - s * 0.17, j * s * 0.25 - s * 0.17, s * 0.34, s * 0.34, s * 0.08); ctx.fill(); } }
  else if (name === 'lock') {
    ctx.lineWidth = s * 0.16; ctx.beginPath(); ctx.arc(0, -s * 0.12, s * 0.26, Math.PI, 0); ctx.stroke();
    rr(-s * 0.38, -s * 0.12, s * 0.76, s * 0.6, s * 0.12); ctx.fill();
    ctx.fillStyle = 'rgba(0,0,0,0.25)'; ctx.beginPath(); circ(0, s * 0.15, s * 0.08); ctx.fill();
  }
  else if (name === 'speaker') {
    ctx.beginPath(); ctx.moveTo(-s * 0.45, -s * 0.16); ctx.lineTo(-s * 0.22, -s * 0.16); ctx.lineTo(s * 0.05, -s * 0.4); ctx.lineTo(s * 0.05, s * 0.4); ctx.lineTo(-s * 0.22, s * 0.16); ctx.lineTo(-s * 0.45, s * 0.16); ctx.closePath(); ctx.fill();
    ctx.lineWidth = s * 0.1;
    ctx.beginPath(); ctx.arc(s * 0.12, 0, s * 0.22, -0.9, 0.9); ctx.stroke();
    ctx.beginPath(); ctx.arc(s * 0.12, 0, s * 0.4, -0.9, 0.9); ctx.stroke();
  }
  ctx.restore();
}
/** 立體按鈕。opts: {label, icon, color, onClick, size, pulse, disabled, radius} */
function button(id, x, y, w, h, opts) {
  btnReg.push({ id, x, y, w, h, onClick: opts.onClick, disabled: opts.disabled });
  const pal = BTN[opts.color || 'green'];
  const isDown = pressed && pressed.id === id;
  let s = isDown ? 0.93 : 1;
  if (opts.pulse && !isDown) s *= 1 + Math.sin(time * 5) * 0.035;
  const lip = Math.max(4, Math.min(8, h * 0.1));
  ctx.save();
  ctx.translate(x + w / 2, y + h / 2); ctx.scale(s, s);
  if (opts.disabled) ctx.globalAlpha = opts.dimAlpha || 0.5;
  const r = opts.radius == null ? h / 2 : opts.radius;
  const yo = isDown ? lip * 0.6 : 0;
  rr(-w / 2, -h / 2 + lip + 3, w, h, r); ctx.fillStyle = 'rgba(60,30,70,0.2)'; ctx.fill();
  rr(-w / 2, -h / 2 + lip, w, h, r); ctx.fillStyle = pal[2]; ctx.fill();
  rr(-w / 2, -h / 2 + yo, w, h, r);
  const g = ctx.createLinearGradient(0, -h / 2, 0, h / 2);
  g.addColorStop(0, pal[0]); g.addColorStop(0.55, pal[1]); g.addColorStop(1, shade(pal[1], -15));
  ctx.fillStyle = g; ctx.fill();
  ctx.strokeStyle = pal[2]; ctx.lineWidth = Math.max(2, Math.min(4, h * 0.05)); ctx.stroke();
  rr(-w / 2 + Math.min(h, w) * 0.2, -h / 2 + yo + h * 0.08, w - Math.min(h, w) * 0.4, Math.min(h * 0.28, 22), Math.min(h * 0.14, 11));
  ctx.fillStyle = 'rgba(255,255,255,0.4)'; ctx.fill();
  const fs = opts.size || h * 0.42;
  const tc = opts.color === 'white' ? '#6a4a7a' : '#fff';
  if (opts.icon && opts.label) {
    ctx.font = '900 ' + fs + 'px ' + FONT;
    const tw = ctx.measureText(opts.label).width;
    const tot = fs * 1.15 + tw;
    drawIcon(opts.icon, -tot / 2 + fs * 0.45, yo, fs * 0.9, tc);
    txt(opts.label, -tot / 2 + fs * 1.15 + tw / 2, yo + 1, fs, tc, { stroke: pal[2], sw: fs * 0.2, shadow: false });
  } else if (opts.icon) drawIcon(opts.icon, 0, yo, fs * 1.1, tc);
  else if (opts.label != null && opts.label !== '') {
    const f2 = fitSize(opts.label, w * 0.86, fs);
    txt(opts.label, 0, yo + 1, f2, tc, { stroke: pal[2], sw: f2 * 0.2, shadow: false });
  }

  return yo;
}
/** 圓形小按鈕（返回、暫停），和共用的 🏠/🔊 同風格 */
function fab(id, cx, cy, icon, onClick) {
  const r = 24;
  btnReg.push({ id, x: cx - r, y: cy - r, w: r * 2, h: r * 2, onClick });
  const down = pressed && pressed.id === id;
  ctx.save(); ctx.translate(cx, cy); if (down) ctx.scale(0.9, 0.9);
  ctx.fillStyle = 'rgba(74,59,82,0.18)'; ctx.beginPath(); ctx.arc(0, 6, r, 0, TAU); ctx.fill();

/* =====================================================================
 * 遊戲 4：比比看（哪個錢包比較多）
 * ===================================================================== */
const CMP_LV = [
  { d: [1], k: [1, 5], trick: 0 },
  { d: [1, 5], k: [1, 5], trick: 0.5 },
  { d: [1, 5, 10], k: [1, 5], trick: 0.55 },
  { d: [1, 5, 10, 50], k: [1, 6], trick: 0.6 },
  { d: [10, 50, 100], k: [1, 6], trick: 0.6 },
  { d: [50, 100, 500, 1000], k: [1, 6], trick: 0.6 }
];
function pick1(spec) { const k = KG.randInt(spec.k[0], spec.k[1]), a = []; for (let i = 0; i < k; i++) a.push(KG.pick(spec.d)); return a; }
const CompareGame = {
  id: 'compare', rounds: 6,
  round(lv) {
    const spec = CMP_LV[lv], s = getSkill('compare');
    const wantTrick = Math.random() < spec.trick * (0.6 + s * 0.6);
    let a, b;
    for (let tries = 0; tries < 600; tries++) {
      a = pick1(spec); b = pick1(spec);
      const ta = sum(a), tb = sum(b);
      if (ta === tb) continue;
      if (wantTrick && tries < 400 && !(a.length !== b.length && (a.length > b.length) !== (ta > tb))) continue;
      const ratio = Math.min(ta, tb) / Math.max(ta, tb);
      if (tries < 300 && ratio < lerp(0, 0.55, s) && lv > 0) continue;
      break;
    }
    a.sort((x, y) => y - x); b.sort((x, y) => y - x);
    const mk = vals => vals.map(v => ({ v, x: 0, y: 0, jx: (Math.random() - 0.5) * 0.25, jy: (Math.random() - 0.5) * 0.25, rot: (Math.random() - 0.5) * (isBill(v) ? 0.15 : 0.4) }));
    P.data = { spec, purses: [{ items: mk(a), total: sum(a), col: '#ff8fb1' }, { items: mk(b), total: sum(b), col: '#6cc4ff' }], reveal: false, win: -1, wrong: -1 };
    setPrompt('哪一個比較多？', '比比看，哪一個錢包的錢比較多？');
  },
  layout() {
    const c = contentRect(), D = P.data, land = W > H;
    const gap = 16 * U;
    D.purses.forEach((p, i) => {
      let r;
      if (land) { const w = (c.w - gap) / 2; r = { x: c.x + i * (w + gap), y: c.y + 6, w, h: c.h - 46 * U }; }
      else { const h = (c.h - gap - 72 * U) / 2; r = { x: c.x + 6, y: c.y + i * (h + gap + 36 * U), w: c.w - 12, h }; }
      p.r = r;
      const inner = { x: r.x + r.w * 0.08, y: r.y + r.h * 0.22, w: r.w * 0.84, h: r.h * 0.7 };
      p.M = gridLayout(p.items, inner, { maxM: 46 * U });
      p.labelY = r.y + r.h + 20 * U;
    });
  },
  paintBg() {
    const g = ctx.createLinearGradient(0, 0, 0, H); g.addColorStop(0, '#f1eaff'); g.addColorStop(1, '#ddd0ff');
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
    dotPattern('#ffffff', 0.5);
  },
  update() {},
  choose(i) {
    const D = P.data;
    if (P.phase !== 'ask') return;
    const p = D.purses[i], o = D.purses[1 - i];
    P.idle = 0;
    if (p.total > o.total) {
      D.win = i; D.reveal = true; roundWon();
      fx.burst(p.r.x + p.r.w / 2, p.r.y + p.r.h / 2, { n: 22, colors: ['#ffe066', '#fff', '#ff8fb1'], speed: 260, size: 7 * U, g: 250 });
      say('答對了！這邊有' + p.total + '元，比較多！');
    } else {
      if (D.wrong === i) { sfx('boop'); return; }
      D.wrong = i; D.reveal = true; mistake(); shake(5, 0.25);
      say('這邊有' + p.total + '元，那邊有' + o.total + '元。哪一個比較多呢？');
    }
  },
  hint() { P.data.reveal = true; const D = P.data; say('這邊有' + D.purses[0].total + '元，那邊有' + D.purses[1].total + '元。'); },
  draw() {
    const D = P.data;
    D.purses.forEach((p, i) => {

      const sc = ap * (won ? 1 + Math.sin(P.t * 10) * 0.02 * Math.max(0, 2 - P.t) : 1);
      ctx.save(); ctx.translate(r.x + r.w / 2, r.y + r.h / 2); ctx.scale(sc, sc); ctx.translate(-(r.x + r.w / 2), -(r.y + r.h / 2));

      drawPurse(r, p.col, D.win === i);
      for (const it of p.items) drawMoney(it.v, it.x, it.y, p.M, it.rot, 1);
      ctx.restore();
      if (D.reveal) {

        const w = ctx.measureText(s).width + 34 * U, h = 34 * U;
        hudPanel(r.x + r.w / 2 - w / 2, p.labelY - h / 2, w, h, D.win === i ? '#3fbf5c' : shade(p.col, -40));
        txt(s, r.x + r.w / 2, p.labelY + 1, fs, '#4a3b52', { shadow: false });
      }
    });
    // 中間的「?」或大於符號
    const a = D.purses[0].r, b = D.purses[1].r, land = W > H;
    const mx = land ? (a.x + a.w + b.x) / 2 : a.x + a.w / 2, my = land ? a.y + a.h / 2 : (a.y + a.h + D.purses[0].labelY + 18 * U + b.y) / 2 - 6 * U;
    if (land && D.win >= 0) { ctx.fillStyle = '#fff'; ctx.beginPath(); circ(mx, my, 22); ctx.fill(); ctx.strokeStyle = '#9b6ff2'; ctx.lineWidth = 3; ctx.stroke(); txt(D.win === 0 ? '>' : '<', mx, my, 28, '#9b6ff2', { shadow: false }); }
  },
  down(x, y) {
    const D = P.data;
    let best = -1, bd = 1e9;
    D.purses.forEach((p, i) => { const r = p.r, dx = Math.max(r.x - x, 0, x - r.x - r.w), dy = Math.max(r.y - y, 0, y - r.y - r.h), d = Math.hypot(dx, dy); if (d < 40 && d < bd) { bd = d; best = i; } });
    if (best >= 0) { this.choose(best); return true; }
    return false;
  },
  key(k) {
    if (k === '1' || k === 'ArrowLeft' || k === 'ArrowUp') this.choose(0);
    else if (k === '2' || k === 'ArrowRight' || k === 'ArrowDown') this.choose(1);
  },
  solve() { const D = P.data; this.choose(D.purses[0].total > D.purses[1].total ? 0 : 1); }
};

    this.t += 1 / 60;
    ctx.fillStyle = 'rgba(50,25,70,0.5)'; ctx.fillRect(0, 0, W, H);
    btnReg.push({ id: 'lclose-bg', x: 0, y: 0, w: W, h: H, onClick: () => { this.sel = -1; sfx('back'); } });
    const cw = Math.min(W - 32, land ? Math.max(620 * U, 560) : 440 * U), ch = Math.min(H - (land ? 24 : 120), land ? Math.max(340 * U, 330) : 520 * U);
    const x = (W - cw) / 2, y = (H - ch) / 2 + (land ? 0 : 20);
    const ap = Ease.outBack(clamp(this.t * 4, 0, 1));
    ctx.save(); ctx.translate(W / 2, y + ch / 2); ctx.scale(ap, ap); ctx.translate(-W / 2, -(y + ch / 2));
    btnReg.push({ id: 'lcard', x, y, w: cw, h: ch, onClick: () => {} });
    rr(x, y + 8, cw, ch, 28 * U); ctx.fillStyle = 'rgba(60,30,70,0.3)'; ctx.fill();
    rr(x, y, cw, ch, 28 * U); ctx.fillStyle = '#fffdf6'; ctx.fill(); ctx.strokeStyle = isBill(v) ? m.base : m.cols[2]; ctx.lineWidth = 6; ctx.stroke();
    const flip = Math.abs(Math.cos(Math.min(1, this.t * 1.6) * Math.PI * 2)) * 0.6 + 0.4 * Math.min(1, this.t * 1.6);
    let mx, my, tx, ty, tw;
    if (land) { mx = x + cw * 0.27; my = y + ch * 0.42; tx = x + cw * 0.5; ty = y + ch * 0.12; tw = cw * 0.46; }
    else { mx = W / 2; my = y + ch * 0.22; tx = x + 20 * U; ty = y + ch * 0.42; tw = cw - 40 * U; }
    const big = isBill(v) ? Math.min((land ? cw * 0.4 : cw * 0.72) / 3.6, ch * 0.4 / 1.75) : Math.min(land ? cw * 0.2 : cw * 0.22, ch * 0.18 * (land ? 1.6 : 1));
    ctx.save(); ctx.translate(mx, my); ctx.scale(Math.max(0.05, flip), 1);
    drawMoney(v, 0, 0, big, 0, 1);
    ctx.restore();
    // 名稱、說明
    const nfs = Math.min(44, ch * 0.11);
    txt(m.name, tx + tw / 2, ty + nfs * 0.6, nfs, '#fff', { stroke: isBill(v) ? m.dark : m.cols[3], sw: nfs * 0.24 });
    const ffs = Math.min(21, ch * 0.06);
    const lines = wrapLines(m.fact, tw, ffs);
    let ly = ty + nfs * 1.5 + ffs * 0.4;
    for (const l of lines) { txt(l, tx + tw / 2, ly, ffs, '#4a3b52', { shadow: false, weight: '800' }); ly += ffs * 1.45; }
    // 換算
    if (m.ex) {
      const ev = m.ex[0], n = m.ex[1];
      let eM = Math.min(ch * 0.065, 24);
      const rowOf = M => { const dd = moneyDims(ev, M), sv = moneyDims(v, isBill(v) ? M * 0.8 : M); return sv.w + 26 * U + (isBill(ev) ? dd.w * 0.62 : dd.w * 1.05) * (n - 1) + dd.w; };
      const rw0 = rowOf(eM); if (rw0 > tw) eM *= tw / rw0;
      const dd = moneyDims(ev, eM), step = isBill(ev) ? dd.w * 0.62 : dd.w * 1.05;
      const sv = moneyDims(v, isBill(v) ? eM * 0.8 : eM);
      const rowW = sv.w + 26 * U + step * (n - 1) + dd.w;
      let ex = tx + tw / 2 - rowW / 2, ey = ly + Math.max(dd.h, sv.h) / 2 + 4;
      drawMoney(v, ex + sv.w / 2, ey, isBill(v) ? eM * 0.8 : eM, 0, 1); ex += sv.w;
      txt('=', ex + 13 * U, ey, 24 * U, '#f45f93', { shadow: false }); ex += 26 * U;
      for (let k = 0; k < n; k++) drawMoney(ev, ex + dd.w / 2 + k * step, ey + (isBill(ev) ? k * 2 : 0), eM, 0, 1);
    }
    // 按鈕
    const bh = Math.min(52 * U, ch * 0.14), by = y + ch - bh - 16 * U, bw = Math.min(64 * U, cw * 0.2);
    button('lprev', x + 16 * U, by, bw, bh, { icon: 'prev', color: 'white', size: bh * 0.42, onClick: () => this.open((this.sel + 6) % 7) });
    button('lsay', W / 2 - bw * 0.9, by, bw * 1.8, bh, { icon: 'speaker', label: '再聽', color: 'blue', size: bh * 0.38, onClick: () => say(m.say) });
    button('lnext', x + cw - 16 * U - bw, by, bw, bh, { icon: 'next', color: 'green', size: bh * 0.42, onClick: () => this.open((this.sel + 1) % 7) });
    ctx.restore();
    fab('lclose', Math.min(x + cw - 6, W - 30), Math.max(y + 6, 30), 'close', () => { this.sel = -1; sfx('back'); });
  },
  down(x, y) {
    if (this.sel >= 0) return;
    let best = -1, bd = 1e9;
    this.items.forEach((it, i) => { const d = moneyDims(it.v, it.M), dist = Math.hypot(x - it.x, y - it.y); if (dist < Math.max(d.w, d.h) * 0.6 + 20 && dist < bd) { bd = dist; best = i; } });
    if (best >= 0) { this.open(best); return true; }
    return false;
  }
};

/* =====================================================================
 * 主畫面繪製
 * ===================================================================== */
function drawPlay() {
  const A = P.act;
  drawBg('play-' + A.id + '-' + W + 'x' + H, () => A.paintBg());
  let sx = 0, sy = 0;
  if (shakeT > 0) { const k = shakeAmt * Math.min(1, shakeT * 4); sx = (Math.random() * 2 - 1) * k; sy = (Math.random() * 2 - 1) * k; }
  ctx.save(); ctx.translate(sx, sy);
  A.draw();
  drawFlyers();
  drawDrag();
  ctx.restore();
  drawHud();
}

/* =====================================================================
 * 輸入
 * ===================================================================== */
function toLocal(e) { const r = cv.getBoundingClientRect(); return [(e.clientX - r.left) * W / r.width, (e.clientY - r.top) * H / r.height]; }
cv.addEventListener('pointerdown', (e) => {
  e.preventDefault();
  const [x, y] = toLocal(e);
  const b = hitBtn(x, y);
  if (b) { pressed = { id: b.id, pid: e.pointerId }; sfx('click', { vol: 0.8 }); return; }
  let handled = false;
  if (!paused && !Result.on) {
    if (scene === 'play' && P.act && P.act.down) { handled = !!P.act.down(x, y, e); if (handled && drag) { try { cv.setPointerCapture(e.pointerId); } catch (err) { /* 忽略 */ } } }
    else if (scene === 'learn') handled = !!Learn.down(x, y);
  }
  if (!handled) {
    const nb = hitBtnNear(x, y);
    if (nb) { pressed = { id: nb.id, pid: e.pointerId }; sfx('click', { vol: 0.8 }); }
  }
});
cv.addEventListener('pointermove', (e) => {
  if (!drag || drag.pid !== e.pointerId) return;
  const [x, y] = toLocal(e);
  if (scene === 'play' && P.act.move) P.act.move(x, y);
});
function endPointer(e, cancel) {
  const [x, y] = toLocal(e);
  if (pressed && pressed.pid === e.pointerId) {
    const b = hitBtn(x, y) || hitBtnNear(x, y), id = pressed.id;
    pressed = null;
    if (!cancel && b && b.id === id && b.onClick) b.onClick();
    return;
  }
  if (drag && drag.pid === e.pointerId && scene === 'play' && P.act.up) {
    if (cancel) { drag.moved = true; P.act.up(-9999, -9999); } else P.act.up(x, y);
  }
}
cv.addEventListener('pointerup', (e) => endPointer(e, false));
cv.addEventListener('pointercancel', (e) => endPointer(e, true));
cv.addEventListener('contextmenu', (e) => e.preventDefault());
window.addEventListener('keydown', (e) => {
  const k = e.key;
  if (k === ' ' || k.startsWith('Arrow') || k === 'Backspace') e.preventDefault();
  if (scene === 'title') { if (k === 'Enter' || k === ' ') { say('一起來認識錢幣吧！選一個遊戲。'); goHub(); } return; }
  if (scene === 'hub') {
    if (k >= '1' && k <= '6') { const a = ACTS[+k - 1]; say(a.say); if (a.id === 'learn') goLearn(); else goLevels(a.id); }
    else if (k === 'Escape') scene = 'title';
    return;
  }
  if (scene === 'levels') {
    if (k >= '1' && k <= '6') { const i = +k - 1, st = starsOf(curLevelsAct); if (i === 0 || st[i - 1] > 0) startLevel(curLevelsAct, i); }
    else if (k === 'Escape' || k === 'Backspace') goHub();
    return;
  }
  if (scene === 'learn') {
    if (Learn.sel >= 0) {
      if (k === 'Escape') Learn.sel = -1;
      else if (k === 'ArrowRight') Learn.open((Learn.sel + 1) % 7);
      else if (k === 'ArrowLeft') Learn.open((Learn.sel + 6) % 7);
      else if (k === ' ' || k === 'Enter') say(MINFO[Learn.items[Learn.sel].v].say);
    } else if (k >= '1' && k <= '7') Learn.open(+k - 1);
    else if (k === 'Escape' || k === 'Backspace') goHub();
    return;
  }
  if (scene === 'play') {
    if (Result.on) { if (k === 'Enter' || k === ' ') Result.primary(); else if (k === 'Escape') { Result.hide(); goLevels(P.act.id); } return; }
    if (k === 'Escape' || k === 'p' || k === 'P') { setPaused(!paused); return; }
    if (paused) { if (k === 'Enter' || k === ' ') setPaused(false); return; }
    if (k === 's' || k === 'S') { if (P.voice) say(P.voice); return; }
    if (P.act.key) P.act.key(k);
  }
});
document.addEventListener('visibilitychange', () => {
  if (document.hidden && scene === 'play' && !Result.on && !paused) setPaused(true);
  if (document.hidden && window.speechSynthesis) window.speechSynthesis.cancel();
});

/* =====================================================================
 * 主迴圈
 * ===================================================================== */
function resize() {
  const r = cv.getBoundingClientRect();
  const nw = Math.max(1, r.width), nh = Math.max(1, r.height), nd = window.devicePixelRatio || 1;
  if (nw === W && nh === H && nd === dpr) return;
  W = nw; H = nh; dpr = nd;
  cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
  U = clamp(Math.min(W / 420, H / 600), 0.66, 1.35);
  UO = clamp(Math.min(W / 420, H / 480), 0.78, 1.35);
  bgKey = ''; spriteCache.clear();
  if (scene === 'play' && P.act && P.data) { P.act.layout(); }
  Learn.layout();
}
window.addEventListener('resize', resize);
window.addEventListener('orientationchange', () => setTimeout(resize, 120));
if (window.visualViewport) window.visualViewport.addEventListener('resize', resize);

let lastFrame = performance.now();
function frame(now) {
  const dt = Math.min(0.05, Math.max(0, (now - lastFrame) / 1000));
  lastFrame = now;
  resize();
  time += dt; sceneT += dt;
  if (shakeT > 0) shakeT -= dt;
  updateDuck();
  if (!paused) {
    updateTweens(dt);
    fx.update(dt);
    updateFlyers(dt);
    Result.update(dt);
    if (scene === 'play' && P.act && Result.on) P.act.update(dt);
    else if (scene === 'play' && P.act) {
      P.t += dt;
      if (P.phase === 'ask') P.idle += dt;
      P.act.update(dt);
      if (P.phase === 'ask' && P.idle > 11 && !P.idleHinted && P.act.hint) { P.idleHinted = true; P.idle = 0; P.act.hint(); }
      if (P.phase === 'won' && P.t > (P.act.wonDelay || 1.9)) {
        P.round++;
        if (P.round >= P.rounds) finishLevel(); else newRound();
      }
    }
  }
  btnReg = [];
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  if (scene === 'title') drawTitle();
  else if (scene === 'hub') drawHub();
  else if (scene === 'levels') drawLevels();
  else if (scene === 'learn') Learn.draw();
  else if (scene === 'play') {
    drawPlay();
    fx.draw();
    Result.draw();
    if (paused) drawPause();
  }
  if (scene !== 'play') fx.draw();
  requestAnimationFrame(frame);
}
resize();
Learn.layout();
playSong(SONG_TITLE);
requestAnimationFrame((t) => { lastFrame = t; frame(t); });

/* ---------- 測試用 ---------- */
window.__money = {
  scene: () => scene,
  state: () => ({ scene, act: P.act && P.act.id, lv: P.lv, round: P.round, phase: P.phase, pen: P.pen, paused, result: Result.on, prompt: P.prompt }),
  data: () => P.data,
  start: (id, lv) => startLevel(id, lv || 0),
  hub: () => goHub(),
  levels: (id) => goLevels(id),
  learn: () => goLearn(),
  learnOpen: (i) => Learn.open(i),
  solve: () => { if (P.act && P.act.solve) P.act.solve(); },
  skip: (n) => { for (let i = 0; i < (n || 1); i++) { if (P.act && P.act.solve) P.act.solve(); P.t = 99; if (P.phase === 'won') { P.round++; if (P.round >= P.rounds) finishLevel(); else newRound(); } } },
  pause: (on) => setPaused(on),
  srcPos: () => P.data && P.data.pp ? P.data.pp.srcPos.map(s => ({ v: s.v, x: s.x, y: s.y })) : null,
  trayRect: () => P.data && P.data.pp ? P.data.pp.trayR : null,
  ducked: () => duckOn,
  say: (t) => say(t),
  sfxOn: () => sfxOn
};
</script>
</body>
