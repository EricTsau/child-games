<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>小熊換裝</title>
<link rel="stylesheet" href="../../assets/common.css">
<style>
  html, body { height: 100%; overflow: hidden; }
  body {
    height: 100vh; height: 100dvh;
    background:
      radial-gradient(circle, rgba(255,255,255,.6) 3px, transparent 4px) 0 0 / 30px 30px,
      radial-gradient(circle, rgba(255,255,255,.35) 2px, transparent 3px) 15px 15px / 30px 30px,
      linear-gradient(180deg, #ffe2cf 0%, #ffd1e2 100%);
  }
  #wrap { position: absolute; inset: 0; display: grid; grid-template-rows: 1fr auto; padding: 66px 10px max(8px, env(safe-area-inset-bottom)); gap: 8px; }
  #stage { position: relative; min-height: 0; display: grid; place-items: center; touch-action: none; }
  #frame { position: relative; width: 320px; height: 400px; border-radius: 28px; overflow: hidden; border: 7px solid #fff;
    box-shadow: 0 10px 0 rgba(200,120,100,.25), 0 18px 34px rgba(160,90,90,.3); background: #fff; }
  #scene { display: block; width: 100%; height: 100%; touch-action: none; }
  #bear { transform-origin: 200px 472px; animation: sway 3.2s ease-in-out infinite alternate; cursor: pointer; }
  #bear.jump { animation: jump .55s cubic-bezier(.3,1.6,.5,1); }
  @keyframes sway { from { transform: rotate(-2.2deg); } to { transform: rotate(2.2deg); } }
  @keyframes jump { 0% { transform: translateY(0) scale(1,1); } 30% { transform: translateY(6px) scale(1.06,.93); } 60% { transform: translateY(-26px) scale(.96,1.05); } 100% { transform: translateY(0); } }
  .eye { transform-box: fill-box; transform-origin: center; animation: blink 4.6s infinite; }
  @keyframes blink { 0%, 93%, 100% { transform: scaleY(1); } 96% { transform: scaleY(.08); } }
  .pop { transform-box: fill-box; transform-origin: center; animation: itemPop .5s cubic-bezier(.2,1.7,.4,1); }
  @keyframes itemPop { 0% { transform: scale(.5) translateY(-20px); opacity: .2; } 60% { transform: scale(1.08, .95); } 100% { transform: scale(1); opacity: 1; } }
  .spk { transform-box: fill-box; transform-origin: center; animation: spk .9s ease-out forwards; }
  @keyframes spk { 0% { transform: scale(0) rotate(0); opacity: 1; } 60% { transform: scale(1.2) rotate(90deg); opacity: 1; } 100% { transform: scale(.4) rotate(180deg); opacity: 0; } }
  .balloon { transform-box: fill-box; transform-origin: 50% 100%; animation: bob 2.4s ease-in-out infinite alternate; }
  @keyframes bob { from { transform: rotate(-4deg); } to { transform: rotate(4deg); } }
  .twinkle { animation: tw 1.8s ease-in-out infinite alternate; }
  @keyframes tw { from { opacity: .3; } to { opacity: 1; } }

  .fab { position: absolute; z-index: 5; width: 62px; height: 62px; border-radius: 50%; border: 4px solid #fff; display: grid; place-items: center; cursor: pointer; padding: 0;
    box-shadow: 0 5px 0 rgba(0,0,0,.15), 0 8px 14px rgba(0,0,0,.2); transition: transform .12s cubic-bezier(.3,1.8,.5,1); }
  .fab:active { transform: scale(.88); }
  .fab svg { width: 34px; height: 34px; }
  #bRand { left: 8px; bottom: 8px; background: linear-gradient(180deg, #ffe58a, #f5b82e); }
  #bPhoto { right: 8px; bottom: 8px; background: linear-gradient(180deg, #9ad8ff, #3a9ee8); }
  #bDone { position: absolute; z-index: 5; left: 50%; bottom: 10px; transform: translateX(-50%); font-size: 20px; padding: 6px 20px; min-height: 56px; letter-spacing: 1px; }
  #bDone.ready { animation: donePulse 1.1s ease-in-out infinite; }
  @keyframes donePulse { 0%,100% { transform: translateX(-50%) scale(1); } 50% { transform: translateX(-50%) scale(1.1); } }
  #bDone:active { transform: translateX(-50%) translateY(4px) scale(.95); }
  #flash { position: fixed; inset: 0; background: #fff; opacity: 0; pointer-events: none; z-index: 9200; }
  #flash.on { animation: flash .6s ease-out; }
  @keyframes flash { 0% { opacity: .95; } 100% { opacity: 0; } }

  /* 任務對話框 */
  #req { position: absolute; z-index: 4; left: 8px; right: 8px; top: 8px; display: flex; align-items: center; gap: 6px; padding: 6px 8px 6px 12px; border-radius: 20px;
    background: rgba(255,255,255,.94); border: 3px solid #ffb3cc; box-shadow: 0 5px 0 rgba(200,90,130,.2); animation: kg-pop .4s cubic-bezier(.2,1.6,.4,1); }
  #req::after { content: ""; position: absolute; left: 50%; bottom: -12px; border: 9px solid transparent; border-top-color: #ffb3cc; transform: translateX(-50%); }
  #req .t { font-weight: 900; font-size: 16px; color: #c2406e; flex: 1; line-height: 1.2; }
  #req .need { position: relative; width: 46px; height: 46px; flex: none; border-radius: 14px; background: #fff3f8; border: 2px solid #ffd6e4; }
  #req .need svg.it { width: 100%; height: 100%; }
  #req .need .ck { position: absolute; right: -6px; bottom: -6px; width: 24px; height: 24px; transform: scale(0); transition: transform .3s cubic-bezier(.3,1.8,.5,1); }
  #req .need.ok { border-color: #7bd88f; background: #eaffef; }
  #req .need.ok .ck { transform: scale(1); }

  #panel { background: rgba(255,255,255,.8); border: 4px solid #fff; border-radius: 26px; box-shadow: 0 6px 0 rgba(200,120,100,.18), 0 10px 18px rgba(160,90,90,.15); padding: 8px; display: flex; flex-direction: column; gap: 8px; min-width: 0; }
  #tabs { display: grid; grid-template-columns: repeat(6, 1fr); gap: 5px; }
  .tab { min-height: 60px; border: none; border-radius: 16px; background: #fff3e9; font-family: var(--kg-font); color: #8a4a3a; font-size: 13px; font-weight: 900; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 0; cursor: pointer; padding: 2px; box-shadow: inset 0 -4px 0 rgba(200,140,100,.22); transition: transform .15s cubic-bezier(.3,1.8,.5,1); }
  .tab svg { width: 34px; height: 30px; }
  .tab.on { background: linear-gradient(180deg, #ffc4d8, #ff8fb1); color: #fff; box-shadow: inset 0 -4px 0 rgba(180,60,100,.3); transform: translateY(-3px); }
  #items { display: flex; gap: 8px; overflow-x: auto; overflow-y: hidden; padding: 4px 2px 6px; touch-action: pan-x; scrollbar-width: thin; }
  .item { position: relative; flex: none; width: 78px; height: 78px; border-radius: 20px; border: 4px solid #fff; background: radial-gradient(circle at 40% 30%, #fff, #ffeef3); box-shadow: 0 4px 0 rgba(200,120,150,.25); cursor: pointer; padding: 3px; display: grid; place-items: center; transition: transform .15s cubic-bezier(.3,1.8,.5,1); }
  .item:active { transform: scale(.9); }
  .item svg { width: 100%; height: 100%; }
  .item.on { border-color: #ff8fb1; background: radial-gradient(circle at 40% 30%, #fff, #ffd6e4); transform: translateY(-3px); }
  .item.locked > svg { filter: grayscale(1) brightness(1.1); opacity: .45; }
  .item .lk { position: absolute; inset: 14px; } .item .lk svg { width: 100%; height: 100%; }
  .item .needs { position: absolute; bottom: -2px; left: 50%; transform: translateX(-50%); font-size: 12px; font-weight: 900; background: #ffd23f; color: #7a4a00; border-radius: 99px; padding: 0 6px; white-space: nowrap; }
  .item .want { position: absolute; top: -6px; right: -6px; width: 24px; height: 24px; animation: gkPulse 1s infinite; }

  #photoCard img { width: 100%; max-height: 50vh; object-fit: contain; border-radius: 16px; box-shadow: 0 6px 16px rgba(0,0,0,.2); margin-bottom: 14px; }
  .skins { position: relative; display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; align-items: center; background: rgba(255,255,255,.75); padding: 6px 12px; border-radius: 22px; border: 3px solid #fff; }
  .skins b { color: #c2406e; }
  .skin { position: relative; width: 56px; height: 56px; border-radius: 50%; border: 4px solid #fff; background: #fff6ee; cursor: pointer; padding: 2px; box-shadow: 0 4px 0 rgba(0,0,0,.12); }
  .skin svg { width: 100%; height: 100%; }
  .skin.on { border-color: #ffb020; transform: scale(1.1); }
  .skin .lk { position: absolute; inset: 9px; } .skin .lk svg { width: 100%; height: 100%; }
  .skin .nd { position: absolute; bottom: -8px; left: 50%; transform: translateX(-50%); font-size: 12px; font-weight: 900; background: #ffd23f; color: #7a4a00; border-radius: 99px; padding: 0 6px; }
  @media (max-width: 440px) { .skins b { flex-basis: 100%; } .skin { width: 52px; height: 52px; } }

  @media (orientation: landscape) and (max-height: 600px), (min-aspect-ratio: 5/4) {
    #wrap { grid-template-rows: 1fr; grid-template-columns: 1fr minmax(280px, 42%); padding: 66px 12px 10px; }
    #panel { overflow: hidden; max-height: 100%; }
    #items { flex-wrap: wrap; overflow-y: auto; overflow-x: hidden; touch-action: pan-y; align-content: flex-start; }
    .item { width: 72px; height: 72px; }
    #req .t { font-size: 14px; } #req .need { width: 40px; height: 40px; }
  }
</style>
</head>
<body>
<div id="wrap" hidden>
  <div id="stage">
    <div id="frame">
      <svg id="scene" viewBox="0 0 400 500" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <radialGradient id="fur" cx="40%" cy="35%" r="75%"><stop offset="0" stop-color="#ddA56c"/><stop offset=".55" stop-color="#bd7f48"/><stop offset="1" stop-color="#94592d"/></radialGradient>
          <radialGradient id="furL" cx="45%" cy="35%" r="70%"><stop offset="0" stop-color="#fff1dc"/><stop offset="1" stop-color="#efcc9c"/></radialGradient>
          <radialGradient id="shine" cx="35%" cy="30%" r="70%"><stop offset="0" stop-color="#fff" stop-opacity=".55"/><stop offset=".5" stop-color="#fff" stop-opacity="0"/></radialGradient>
          <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff2a0"/><stop offset=".5" stop-color="#ffcf3f"/><stop offset="1" stop-color="#e09b12"/></linearGradient>
          <linearGradient id="jeans" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7fb6f2"/><stop offset="1" stop-color="#3f7fcf"/></linearGradient>
          <linearGradient id="pinkG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffc4d8"/><stop offset="1" stop-color="#ff86ad"/></linearGradient>
          <linearGradient id="redG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ff8a8a"/><stop offset="1" stop-color="#e2434f"/></linearGradient>
          <linearGradient id="greenG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#a6e8a0"/><stop offset="1" stop-color="#4fb86a"/></linearGradient>
          <linearGradient id="yellowG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff09a"/><stop offset="1" stop-color="#ffc531"/></linearGradient>
          <linearGradient id="strawG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffeab0"/><stop offset="1" stop-color="#e8bf6a"/></linearGradient>
          <pattern id="stripe" width="20" height="20" patternUnits="userSpaceOnUse"><rect width="20" height="20" fill="#eaf6ff"/><rect width="20" height="9" fill="#6cb8ff"/></pattern>
          <pattern id="plaid" width="24" height="24" patternUnits="userSpaceOnUse"><rect width="24" height="24" fill="#e2434f"/><rect width="24" height="8" y="8" fill="#ffd65c" opacity=".55"/><rect width="8" height="24" x="8" fill="#ffd65c" opacity=".55"/><rect width="24" height="2" y="20" fill="#7a1f2a" opacity=".5"/></pattern>
          <pattern id="dots" width="40" height="40" patternUnits="userSpaceOnUse"><rect width="40" height="40" fill="#fff4cf"/><circle cx="10" cy="10" r="4" fill="#ffd0dc"/><circle cx="30" cy="30" r="4" fill="#cfe9ff"/></pattern>
          <pattern id="candy" width="40" height="40" patternUnits="userSpaceOnUse" patternTransform="rotate(30)"><rect width="40" height="40" fill="#ffe0ec"/><rect width="16" height="40" fill="#ffc7db"/></pattern>
          <pattern id="planks" width="80" height="26" patternUnits="userSpaceOnUse"><rect width="80" height="26" fill="#d9a46b"/><rect width="80" height="2" y="24" fill="#b47d45"/><rect width="2" height="26" x="50" fill="#b47d45"/></pattern>
        </defs>
        <g id="L-bg"></g>
        <ellipse cx="200" cy="474" rx="120" ry="16" fill="rgba(60,30,30,.18)"/>
        <g id="bear">
          <!-- 腳 -->
          <ellipse cx="160" cy="425" rx="34" ry="44" fill="url(#fur)"/>
          <ellipse cx="240" cy="425" rx="34" ry="44" fill="url(#fur)"/>
          <ellipse cx="158" cy="456" rx="27" ry="14" fill="url(#furL)"/>
          <ellipse cx="242" cy="456" rx="27" ry="14" fill="url(#furL)"/>
          <circle cx="158" cy="456" r="7" fill="#e8a08c"/><circle cx="242" cy="456" r="7" fill="#e8a08c"/>
          <g id="L-shoes"></g>
          <!-- 身體 -->
          <ellipse cx="200" cy="345" rx="88" ry="92" fill="url(#fur)"/>
          <ellipse cx="200" cy="362" rx="58" ry="62" fill="url(#furL)"/>
          <ellipse cx="200" cy="330" rx="70" ry="60" fill="url(#shine)"/>
          <g id="L-pants"></g>
          <g id="L-top"></g>
          <!-- 手 -->
          <ellipse cx="118" cy="335" rx="27" ry="55" transform="rotate(28 118 335)" fill="url(#fur)"/>
          <ellipse cx="282" cy="335" rx="27" ry="55" transform="rotate(-28 282 335)" fill="url(#fur)"/>
          <circle cx="96" cy="378" r="19" fill="url(#furL)"/><circle cx="304" cy="378" r="19" fill="url(#furL)"/>
          <g id="L-sleeves"></g>
          <!-- 頭 -->
          <g id="head">
            <circle cx="115" cy="108" r="40" fill="url(#fur)"/><circle cx="285" cy="108" r="40" fill="url(#fur)"/>
            <circle cx="117" cy="111" r="23" fill="#f3b5a3"/><circle cx="283" cy="111" r="23" fill="#f3b5a3"/>
            <ellipse cx="200" cy="190" rx="110" ry="100" fill="url(#fur)"/>
            <ellipse cx="185" cy="150" rx="75" ry="50" fill="url(#shine)"/>
            <path d="M188 92 Q192 80 196 92 M200 90 Q205 77 209 91 M212 93 Q218 84 220 95" stroke="#94592d" stroke-width="4" fill="none" stroke-linecap="round"/>
            <ellipse cx="200" cy="234" rx="47" ry="35" fill="url(#furL)"/>
            <g class="eye"><ellipse cx="156" cy="186" rx="11" ry="14" fill="#3b2420"/><circle cx="160" cy="180" r="4.5" fill="#fff"/><circle cx="153" cy="192" r="2" fill="#fff" opacity=".7"/></g>
            <g class="eye"><ellipse cx="244" cy="186" rx="11" ry="14" fill="#3b2420"/><circle cx="248" cy="180" r="4.5" fill="#fff"/><circle cx="241" cy="192" r="2" fill="#fff" opacity=".7"/></g>
            <ellipse cx="126" cy="228" rx="17" ry="10" fill="#ff8fa3" opacity=".5"/><ellipse cx="274" cy="228" rx="17" ry="10" fill="#ff8fa3" opacity=".5"/>
            <ellipse cx="200" cy="216" rx="16" ry="11" fill="#4a2c20"/><ellipse cx="195" cy="212" rx="5" ry="3" fill="#fff" opacity=".6"/>
            <path d="M200 227 L200 238 M184 239 Q200 254 216 239" stroke="#4a2c20" stroke-width="4" fill="none" stroke-linecap="round"/>

      <div id="req" hidden></div>
      <button class="fab" id="bRand" aria-label="隨機換裝"></button>
      <button class="fab" id="bPhoto" aria-label="拍照"></button>

  <div id="panel">

<script src="../../assets/common.js"></script>
<script id="gk-kit">
/* ===== GK 遊戲小工具（標題畫面、關卡選擇、獎勵畫面、特效、背景音樂）===== */
const GK = (function () {
  'use strict';
  const GK = {};
  // ---------- 緩動 ----------
  GK.ease = {
    outCubic: t => 1 - Math.pow(1 - t, 3),
    inOutSine: t => -(Math.cos(Math.PI * t) - 1) / 2,
    outBack: t => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); },
    outElastic: t => t === 0 ? 0 : t === 1 ? 1 : Math.pow(2, -10 * t) * Math.sin((t * 10 - 0.75) * (2 * Math.PI) / 3) + 1,
  };
  GK.lerp = (a, b, t) => a + (b - a) * t;
  GK.clamp = (v, a, b) => Math.max(a, Math.min(b, v));

  // ---------- 樣式 ----------
  const css = `
  [hidden] { display: none !important; }
  .gk-screen { position: fixed; inset: 0; z-index: 8900; display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 14px; padding: 70px 16px 24px; overflow: hidden; animation: kg-fade .3s ease; text-align: center; }
  .gk-screen.out { animation: gkOut .28s ease forwards; }
  @keyframes gkOut { to { opacity: 0; transform: scale(1.04); } }
  .gk-rays { position: absolute; left: 50%; top: 42%; width: 260vmax; height: 260vmax; margin: -130vmax 0 0 -130vmax; pointer-events: none;
    background: repeating-conic-gradient(rgba(255,255,255,.16) 0 10deg, rgba(255,255,255,0) 10deg 20deg); animation: gkSpin 40s linear infinite; }
  @keyframes gkSpin { to { transform: rotate(360deg); } }
  .gk-logo { position: relative; font-size: clamp(38px, 11vw, 76px); font-weight: 900; line-height: 1.05; letter-spacing: 2px; color: #fff; margin: 0;
    -webkit-text-stroke: 0; paint-order: stroke fill; }
  .gk-logo span { display: inline-block; animation: gkLetter .7s cubic-bezier(.2,1.8,.4,1) both, gkWave 2.4s ease-in-out infinite;
    text-shadow: 0 4px 0 var(--gk-dark,#c24470), 0 7px 0 var(--gk-dark,#c24470), 0 12px 16px rgba(0,0,0,.25);
    -webkit-text-stroke: 7px var(--gk-dark,#c24470); paint-order: stroke fill; }
  @keyframes gkLetter { from { transform: translateY(-80px) scale(.3); opacity: 0; } }
  @keyframes gkWave { 0%,100% { translate: 0 0; } 50% { translate: 0 -6px; } }
  .gk-sub { position: relative; font-size: 18px; font-weight: 800; color: var(--gk-dark,#c24470); background: rgba(255,255,255,.85);
    padding: 6px 18px; border-radius: 999px; box-shadow: 0 4px 0 rgba(0,0,0,.08); }
  .gk-art { position: relative; width: min(78vw, 46vh, 360px); aspect-ratio: 1; flex: none; }
  .gk-art > svg, .gk-art > canvas { width: 100%; height: 100%; display: block; overflow: visible; }
  .gk-row { position: relative; display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }
  .gk-btn { position: relative; font-family: var(--kg-font); font-weight: 900; color: #fff; border: 4px solid #fff; border-radius: 999px; cursor: pointer;
    font-size: 24px; padding: 12px 34px; min-height: 60px; letter-spacing: 2px;
    background: linear-gradient(180deg, #9cf08f 0%, #4cc75a 55%, #33a845 100%);
    box-shadow: 0 6px 0 #23803a, 0 12px 20px rgba(0,0,0,.25), inset 0 3px 0 rgba(255,255,255,.5);
    text-shadow: 0 2px 0 rgba(0,0,0,.2); transition: transform .12s cubic-bezier(.3,1.8,.5,1); }
  .gk-btn::after { content: ""; position: absolute; left: 14%; right: 14%; top: 6px; height: 34%; border-radius: 999px; background: rgba(255,255,255,.35); pointer-events: none; }
  .gk-btn:active { transform: translateY(4px) scale(.95); box-shadow: 0 2px 0 #23803a, 0 4px 8px rgba(0,0,0,.25); }
  .gk-btn.big { font-size: 30px; padding: 14px 52px; animation: gkPulse 1.4s ease-in-out infinite; }
  @keyframes gkPulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.07); } }
  .gk-btn.blue { background: linear-gradient(180deg, #9ee0ff 0%, #44a8f0 60%, #2f8ad6 100%); box-shadow: 0 6px 0 #1f64a8, 0 12px 20px rgba(0,0,0,.25), inset 0 3px 0 rgba(255,255,255,.5); }
  .gk-btn.pink { background: linear-gradient(180deg, #ffb3cc 0%, #ff6f9e 60%, #e8507f 100%); box-shadow: 0 6px 0 #b8325e, 0 12px 20px rgba(0,0,0,.25), inset 0 3px 0 rgba(255,255,255,.5); }
  .gk-btn.orange { background: linear-gradient(180deg, #ffd88a 0%, #ffa53a 60%, #f08a1c 100%); box-shadow: 0 6px 0 #b86010, 0 12px 20px rgba(0,0,0,.25), inset 0 3px 0 rgba(255,255,255,.5); }
  .gk-btn.small { font-size: 18px; padding: 8px 20px; min-height: 56px; }
  .gk-btn svg { width: 1.2em; height: 1.2em; vertical-align: -0.2em; }
  .gk-title2 { position: relative; font-size: clamp(28px, 8vw, 44px); font-weight: 900; color: #fff; margin: 0;
    -webkit-text-stroke: 6px var(--gk-dark,#c24470); paint-order: stroke fill; text-shadow: 0 5px 0 var(--gk-dark,#c24470), 0 10px 14px rgba(0,0,0,.2); }
  .gk-grid { position: relative; display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 14px; width: min(560px, 100%);
    max-height: calc(100% - 150px); overflow-y: auto; padding: 8px 6px 14px; touch-action: pan-y; }
  .gk-card { position: relative; border: 4px solid #fff; border-radius: 24px; padding: 8px 6px 6px; cursor: pointer; font-family: var(--kg-font);
    background: linear-gradient(180deg, #fff 0%, #fff3f8 100%); box-shadow: 0 6px 0 rgba(0,0,0,.12), 0 10px 18px rgba(0,0,0,.15);
    display: flex; flex-direction: column; align-items: center; gap: 4px; color: var(--kg-ink); animation: kg-pop .4s cubic-bezier(.2,1.6,.4,1) both;
    transition: transform .12s; min-height: 112px; }
  .gk-card:active { transform: scale(.93); }
  .gk-card .num { font-size: 30px; font-weight: 900; color: #fff; -webkit-text-stroke: 5px var(--gk-dark,#c24470); paint-order: stroke fill; line-height: 1.1; }

  function showTitle() {
    $('wrap').hidden = true;
    resetOutfit({ hat: 1, top: 1, pants: 1, shoes: 2, acc: 4 });
    GK.music.play(GK.songs.happy);
    GK.title({
      title: '小熊換裝', sub: '幫小熊穿上漂亮的衣服！', bg: BG, theme: THEME, art: bearArt(),
      buttons: [
        { text: '任務', cls: 'big', icon: 'play', onClick: showLevels },
        { text: '自由打扮', cls: 'blue small', onClick: () => { resetOutfit(); startFree(); } },
      ],
    });
    document.querySelector('.gk-art').classList.add('kg-bounce');
  }

  function showLevels() {
    $('wrap').hidden = true;
    GK.music.play(GK.songs.happy);
    const pics = MISSIONS.map(M => {
      const k = Object.keys(M.need).filter(k => k !== 'bg')[0], cat = catOf(k);
      return `<div style="width:100%;height:100%;background:radial-gradient(circle,#fff,#ffe1ec)">${itemSVG(cat, cat.items[M.need[k]])}</div>`;
    });
    const el = GK.levels({
      title: '換裝任務', game: GAME, count: MISSIONS.length, bg: BG, theme: THEME,
      labels: MISSIONS.map(m => m.name), pics, onPick: startMission, onBack: showTitle,
    });
    const total = GK.save.total(GAME);
    const row = document.createElement('div'); row.className = 'skins';
    row.innerHTML = '<b>熊熊毛色</b>';
    FURS.forEach((F, i) => {
      const locked = total < F.need;
      const b = document.createElement('button');
      b.className = 'skin' + (i === fur ? ' on' : '');
      b.setAttribute('aria-label', F.name);
      b.innerHTML = furSwatch(F).replace('style="width:44px;height:44px"', '') + (locked ? `<div class="lk">${GK.lockSVG()}</div><div class="nd">★${F.need}</div>` : '');
      b.addEventListener('click', () => {
        if (locked) { KG.sound('wrong'); KG.toast('要 ' + F.need + ' 顆星星才能解鎖'); return; }
        fur = i; KG.store.set(GAME + ':fur', i); applyFur(); KG.sound('pop');
        row.querySelectorAll('.skin').forEach((s, k) => s.classList.toggle('on', k === i));
        const r = b.getBoundingClientRect(); GK.burst(r.left + r.width / 2, r.top + r.height / 2, { type: 'heart', count: 10 });
      });
      row.appendChild(b);
    });
    el.insertBefore(row, el.querySelector('.gk-row'));
  }

  document.addEventListener('touchmove', e => { if (!e.target.closest('#items, .gk-grid')) e.preventDefault(); }, { passive: false });
  document.addEventListener('gesturestart', e => e.preventDefault());
  // 讓畫框維持 4:5
  function fitFrame() {
    const st = $('stage'), w = st.clientWidth, h = st.clientHeight;
    if (!w || !h) return;
    const fw = Math.min(w, h * 0.8);
    $('frame').style.width = fw + 'px'; $('frame').style.height = fw * 1.25 + 'px';
  }
  window.addEventListener('resize', fitFrame);
  new ResizeObserver(fitFrame).observe($('stage'));
  applyFur();
  showTitle();
})();
</script>
</body>
</html>
