<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>3D 射飛鏢</title>
<link rel="stylesheet" href="../../assets/common.css">
<style>
  :root { --gold: #d9b26a; --gold2: #a9823d; --ink: #f3ead8; --mut: #b7aa92; --panel: rgba(17, 13, 10, .86); --line: rgba(217, 178, 106, .5); --red: #e0503f; --grn: #4fae6a; --pf: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", "Heiti TC", system-ui, sans-serif; --sf: Georgia, "Times New Roman", "Noto Serif TC", serif; }
  html, body { height: 100%; overflow: hidden; background: #120c08; color: var(--ink); font-family: var(--pf); touch-action: none; }
  #gl { position: fixed; inset: 0; width: 100vw; height: 100vh; height: 100dvh; display: block; touch-action: none; cursor: grab; }
  #gl:active { cursor: grabbing; }
  #msg { position: fixed; inset: 0; display: grid; place-items: center; padding: 24px; text-align: center; color: var(--gold); font-size: 18px; letter-spacing: 2px; }
  .hide { display: none !important; }
  button { font-family: var(--pf); }
  .kg-fab { background: rgba(20, 15, 11, .85); border: 1.5px solid var(--line); box-shadow: 0 4px 14px rgba(0, 0, 0, .5); font-size: 20px; }
  .kg-fab:hover { border-color: var(--gold); }
  .glass { background: var(--panel); border: 1px solid var(--line); box-shadow: 0 6px 22px rgba(0, 0, 0, .45); }

  #hud { position: fixed; inset: 0; pointer-events: none; z-index: 50; }
  #hud .ui { pointer-events: auto; }
  #col { position: fixed; top: 8px; left: 50%; transform: translateX(-50%); width: min(330px, calc(100vw - 128px)); display: flex; flex-direction: column; gap: 5px; }
  #sb { display: flex; gap: 5px; }
  .pc { flex: 1; min-width: 0; padding: 4px 8px 5px; border-radius: 10px; opacity: .62; transition: opacity .25s, box-shadow .25s, border-color .25s; position: relative; overflow: hidden; }
  .pc.on { opacity: 1; border-color: var(--gold); box-shadow: 0 0 0 1px var(--gold), 0 0 16px rgba(217, 178, 106, .3), 0 6px 22px rgba(0, 0, 0, .45); }
  .pc .nm { display: flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 700; letter-spacing: 1px; white-space: nowrap; }
  .pc .nm b { flex: 1; overflow: hidden; text-overflow: ellipsis; }
  .pc .nm i:empty { display: none; }
  .pc .nm i { font-style: normal; font-size: 10.5px; color: var(--gold); border: 1px solid var(--line); border-radius: 4px; padding: 0 4px; line-height: 15px; }
  .pc .dot { width: 6px; height: 6px; border-radius: 50%; background: #4a4036; flex: none; }
  .pc.on .dot { background: var(--gold); box-shadow: 0 0 8px var(--gold); }
  .pc .big { font-family: var(--sf); font-size: 34px; font-weight: 700; line-height: 1.02; letter-spacing: 1px; color: #fbf3e2; font-variant-numeric: tabular-nums; }
  .pc .big small { font-size: 13px; color: var(--mut); font-family: var(--pf); letter-spacing: 1px; margin-right: 4px; font-weight: 400; }
  .pc .sub { font-size: 11px; color: var(--mut); letter-spacing: .5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .pc .bar { position: absolute; left: 0; bottom: 0; height: 2px; background: var(--gold); width: 0; transition: width .4s; }
  #cr { border-radius: 10px; padding: 4px 8px; font-size: 13px; }
  #cr table { width: 100%; border-collapse: collapse; }
  #cr td { text-align: center; height: 17px; padding: 0; }
  #cr td.n { color: var(--gold); font-family: var(--sf); font-weight: 700; width: 36%; font-size: 14px; }
  #cr tr.cl td.n { color: #6d6253; text-decoration: line-through; }
  #cr svg { width: 15px; height: 15px; display: block; margin: 0 auto; }
  #info { border-radius: 10px; padding: 5px 9px; font-size: 12.5px; letter-spacing: .5px; }
  #info .l1 { display: flex; align-items: center; gap: 6px; white-space: nowrap; }
  #info .l1 .tt { flex: 1; color: var(--mut); overflow: hidden; text-overflow: ellipsis; }
  #info .l1 .tt b { color: var(--ink); font-size: 15px; font-family: var(--sf); }
  .chips { display: flex; gap: 4px; }
  .chip { min-width: 34px; height: 20px; padding: 0 4px; border-radius: 5px; border: 1px solid rgba(217, 178, 106, .35); font-size: 11.5px; font-weight: 700; display: grid; place-items: center; color: var(--mut); }
  .chip.f { color: #1a120a; background: linear-gradient(180deg, #e9cd8e, #b8914c); border-color: #f0d79c; }
  .chip.x { color: #ffd6cf; background: rgba(224, 80, 63, .35); border-color: var(--red); }
  #co { margin-top: 3px; font-size: 12px; color: var(--gold); letter-spacing: 1px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-height: 16px; }
  #co.dim { color: var(--mut); }
  #co b { color: #fff3d6; font-family: var(--sf); font-size: 13.5px; letter-spacing: 1.5px; }

  .rbtn { position: fixed; height: 40px; min-width: 40px; padding: 0 12px; border-radius: 8px; color: var(--ink); font-size: 14px; font-weight: 700; cursor: pointer; display: flex; align-items: center; justify-content: center; }
  .rbtn svg { width: 18px; height: 18px; }
  #bPause { right: 10px; top: 66px; width: 48px; height: 48px; padding: 0; border-radius: 50%; }
  #hint { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(14px + env(safe-area-inset-bottom)); padding: 6px 14px; border-radius: 8px; font-size: 12.5px; color: var(--ink); white-space: nowrap; letter-spacing: 1px; transition: opacity .4s; max-width: calc(100vw - 24px); overflow: hidden; text-overflow: ellipsis; }
  #hint.fade { opacity: 0; }
  #think { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(52px + env(safe-area-inset-bottom)); padding: 5px 14px; border-radius: 8px; font-size: 12.5px; letter-spacing: 2px; color: var(--gold); }
  #think i { display: inline-block; width: 5px; height: 5px; border-radius: 50%; background: var(--gold); margin-left: 5px; animation: thk 1s infinite; }
  #think i:nth-child(2) { animation-delay: .2s; } #think i:nth-child(3) { animation-delay: .4s; }
  @keyframes thk { 0%, 100% { opacity: .2; } 50% { opacity: 1; } }

  body.land #col { left: calc(10px + env(safe-area-inset-left)); top: 66px; transform: none; width: 232px; }
  body.land.short #col { top: 64px; }
  body.land #hint { left: auto; right: calc(12px + env(safe-area-inset-right)); transform: none; bottom: calc(10px + env(safe-area-inset-bottom)); max-width: 46vw; white-space: normal; text-align: right; font-size: 12px; }
  body.land #think { left: auto; right: calc(12px + env(safe-area-inset-right)); transform: none; bottom: calc(60px + env(safe-area-inset-bottom)); }
  body.land .pc .big { font-size: 30px; }

  /* 準星、彈出分數、大字 */
  #ret { position: fixed; left: 0; top: 0; width: 26px; height: 26px; margin: -13px 0 0 -13px; pointer-events: none; z-index: 45; opacity: 0; transition: opacity .15s; }
  #ret.on { opacity: 1; }
  #ret::before, #ret::after { content: ""; position: absolute; background: rgba(255, 240, 200, .95); box-shadow: 0 0 4px rgba(0, 0, 0, .9); }
  #ret::before { left: 12px; top: 0; width: 2px; height: 26px; }
  #ret::after { top: 12px; left: 0; height: 2px; width: 26px; }
  #ret span { position: absolute; inset: 4px; border: 2px solid rgba(255, 210, 120, .95); border-radius: 50%; box-shadow: 0 0 6px rgba(0, 0, 0, .8), inset 0 0 4px rgba(0, 0, 0, .6); }
  #ret.k span { border-color: rgba(120, 220, 255, .95); }
  .pop { position: fixed; left: 0; top: 0; z-index: 46; pointer-events: none; transform: translate(-50%, -100%); text-align: center; font-family: var(--sf); font-weight: 700; color: #fff6df; text-shadow: 0 2px 6px rgba(0, 0, 0, .95), 0 0 2px #000; opacity: 0; white-space: nowrap; }
  .pop .a { font-size: 13px; letter-spacing: 2px; color: var(--gold); font-family: var(--pf); }
  .pop .b { font-size: 26px; line-height: 1; }
  .pop.go { animation: popA 1.05s ease-out forwards; }
  .pop.t .b { color: #ff8a73; } .pop.d .b { color: #8fe0a2; } .pop.bull .b { color: #ff6b5b; font-size: 32px; } .pop.m .b { color: #b9ad97; font-size: 20px; }
  @keyframes popA { 0% { opacity: 0; transform: translate(-50%, -60%) scale(.6); } 15% { opacity: 1; transform: translate(-50%, -110%) scale(1.12); } 30% { transform: translate(-50%, -110%) scale(1); } 75% { opacity: 1; } 100% { opacity: 0; transform: translate(-50%, -190%) scale(1); } }
  #call { position: fixed; left: 50%; top: 42%; z-index: 47; pointer-events: none; transform: translate(-50%, -50%); text-align: center; width: 96vw; opacity: 0; }
  #call .c1 { font-family: var(--sf); font-weight: 700; font-size: clamp(30px, 9vw, 64px); letter-spacing: .06em; color: #fff3d6; text-shadow: 0 3px 0 rgba(0, 0, 0, .55), 0 0 26px rgba(217, 178, 106, .55), 0 0 2px #000; line-height: 1.05; }
  #call .c2 { margin-top: 6px; font-size: clamp(13px, 3.6vw, 18px); letter-spacing: .35em; color: var(--gold); text-shadow: 0 2px 6px #000; font-weight: 700; }
  #call.go { animation: callA 1.9s cubic-bezier(.2, .9, .3, 1) forwards; }
  #call.big .c1 { font-size: clamp(20px, 5.6vw, 60px); color: #ffe7a8; white-space: nowrap; }
  #call.big .c0 { font-family: var(--sf); font-weight: 700; font-size: clamp(80px, 30vw, 190px); line-height: .9; color: #fff; text-shadow: 0 4px 0 #6b4b16, 0 0 40px rgba(255, 196, 80, .8); }
  #call.big.go { animation: callB 3s cubic-bezier(.2, .9, .3, 1) forwards; }
  #call.bad .c1 { color: #ffcfc6; text-shadow: 0 3px 0 rgba(0, 0, 0, .55), 0 0 26px rgba(224, 80, 63, .7); }
  #call .c0 { display: none; }
  #call.big .c0 { display: block; }
  @keyframes callA { 0% { opacity: 0; transform: translate(-50%, -50%) scale(1.6); letter-spacing: .3em; } 14% { opacity: 1; transform: translate(-50%, -50%) scale(1); } 78% { opacity: 1; transform: translate(-50%, -50%) scale(1.03); } 100% { opacity: 0; transform: translate(-50%, -54%) scale(1.04); } }
  @keyframes callB { 0% { opacity: 0; transform: translate(-50%, -50%) scale(2.2); } 10% { opacity: 1; transform: translate(-50%, -50%) scale(.94); } 16% { transform: translate(-50%, -50%) scale(1.02); } 85% { opacity: 1; transform: translate(-50%, -50%) scale(1.06); } 100% { opacity: 0; transform: translate(-50%, -50%) scale(1.1); } }
  #flash { position: fixed; inset: 0; pointer-events: none; z-index: 44; background: radial-gradient(circle at 50% 45%, rgba(255, 214, 140, .45), rgba(255, 214, 140, 0) 65%); opacity: 0; }
  #flash.go { animation: fl .9s ease-out; }
  @keyframes fl { 0% { opacity: 1; } 100% { opacity: 0; } }

  /* 遮罩與卡片 */
  .ov { position: fixed; inset: 0; z-index: 9200; display: flex; align-items: center; justify-content: center; padding: 16px; background: rgba(8, 5, 3, .66); animation: kg-fade .25s ease; }
  .card { background: rgba(20, 15, 11, .95) !important; width: min(430px, 100%); max-height: calc(100% - 8px); overflow: auto; border-radius: 14px; padding: 20px 18px 16px; text-align: center; color: var(--ink); }
  .card h2 { margin: 0 0 6px; font-size: 25px; letter-spacing: 4px; color: var(--gold); font-weight: 800; font-family: var(--sf); }
  .card p { margin: 0 0 12px; font-size: 14.5px; line-height: 1.6; color: var(--mut); }
  .gbtn { font-family: var(--pf); font-size: 16px; font-weight: 800; letter-spacing: 3px; padding: 12px 16px; border-radius: 9px; cursor: pointer; border: 1px solid var(--line); background: rgba(255, 255, 255, .04); color: var(--ink); transition: transform .1s, background .2s, border-color .2s; }
  .gbtn:hover { border-color: var(--gold); }
  .gbtn:active { transform: translateY(1px); }
  .gbtn.pri { background: linear-gradient(180deg, #e7c886, #b48b46); color: #1d1408; border-color: #f0d79c; box-shadow: 0 6px 16px rgba(180, 140, 70, .3); }
  .acts { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
  .acts .gbtn { flex: 1; min-width: 120px; }

  #title { background: linear-gradient(180deg, rgba(10, 6, 3, .72) 0%, rgba(10, 6, 3, .12) 26%, rgba(10, 6, 3, .12) 44%, rgba(10, 6, 3, .9) 100%); flex-direction: column; justify-content: space-between; padding: 60px 14px calc(14px + env(safe-area-inset-bottom)); }
  .logo { text-align: center; pointer-events: none; }
  .logo .sub { font-size: 12px; letter-spacing: 8px; color: var(--gold); opacity: .9; }
  .logo h1 { margin: 6px 0 0; font-family: var(--sf); font-size: clamp(38px, 11vw, 64px); font-weight: 700; letter-spacing: 8px; color: #f7eedb; text-shadow: 0 2px 0 rgba(0, 0, 0, .55), 0 0 30px rgba(217, 178, 106, .3); }
  .logo .eb { display: inline-block; margin-top: 6px; font-family: var(--sf); font-size: 15px; font-weight: 700; letter-spacing: 9px; padding: 3px 4px 3px 13px; color: #1a120a; background: linear-gradient(90deg, #b48b46, #edd195, #b48b46); border-radius: 3px; }
  .tcard { width: min(430px, 100%); border-radius: 14px; padding: 12px 12px 10px; }
  .seg { display: flex; border: 1px solid var(--line); border-radius: 9px; overflow: hidden; margin-bottom: 7px; }
  .seg button { flex: 1; padding: 8px 2px; background: transparent; color: var(--mut); border: 0; border-left: 1px solid rgba(217, 178, 106, .22); font-size: 13.5px; font-weight: 700; letter-spacing: .5px; cursor: pointer; white-space: nowrap; }
  .seg button:first-child { border-left: 0; }
  .seg button.on { background: rgba(217, 178, 106, .18); color: var(--ink); box-shadow: inset 0 -2px 0 var(--gold); }
  .seg.big button { font-size: 14.5px; padding: 10px 2px; }
  .row { display: flex; align-items: center; gap: 8px; }
  .row label { flex: none; width: 40px; font-size: 12.5px; color: var(--mut); letter-spacing: 1px; text-align: left; }
  .row .seg { flex: 1; }
  .row.off { opacity: .35; pointer-events: none; }
  .tcard .gbtn.pri { width: 100%; margin-top: 2px; font-size: 18px; }
  .rec { margin-top: 8px; font-size: 11.5px; color: var(--mut); letter-spacing: .5px; line-height: 1.7; }
  .rec b { color: var(--gold); font-weight: 700; }
  .tips { margin-top: 4px; font-size: 11.5px; color: #8f8370; line-height: 1.55; }
  body.land #title { flex-direction: row; align-items: center; justify-content: space-between; padding: 64px calc(16px + env(safe-area-inset-right)) 10px calc(70px + env(safe-area-inset-left)); background: linear-gradient(90deg, rgba(10, 6, 3, .2) 30%, rgba(10, 6, 3, .88) 100%); }
  body.land #title .logo { flex: 1; align-self: flex-start; margin-top: -50px; }
  body.land.short #title .logo h1 { font-size: 34px; margin-top: 2px; }
  body.land.short #title .logo .eb { font-size: 12px; margin-top: 2px; }
  body.land #title .tcard { width: min(420px, 54vw); max-height: 100%; overflow: auto; }
  body.land.short .tips { display: none; }
  body.land.short .logo h1 { font-size: 40px; }
  body.land.short .tcard { padding: 8px 10px; }
  body.land.short .seg { margin-bottom: 5px; }
  body.land.short .seg button { padding: 6px 2px; }
  body.land.short .seg.big button { padding: 7px 2px; }
  body.land.short .rec { margin-top: 4px; line-height: 1.5; }
  body.land.short .tcard .gbtn.pri { padding: 9px; }

  .stat { display: grid; grid-template-columns: 1fr auto auto; gap: 4px 14px; margin: 4px auto 14px; font-size: 14px; max-width: 320px; text-align: left; }
  .stat .h { color: var(--gold); font-size: 12px; letter-spacing: 1px; text-align: right; }
  .stat span:nth-child(3n+2), .stat span:nth-child(3n) { text-align: right; font-variant-numeric: tabular-nums; }
  .res { font-size: 13px; letter-spacing: 4px; color: var(--mut); margin-bottom: 4px; }
  .nb { color: var(--gold); font-size: 12px; letter-spacing: 2px; margin: -4px 0 10px; }
  .pcard .acts { flex-direction: column; margin-top: 12px; }
</style>

<body>
<div id="msg">3D 射飛鏢 載入中…</div>
<canvas id="gl" aria-label="射飛鏢遊戲畫面"></canvas>
<div id="flash"></div>
<div id="ret"><span></span></div>
<div class="pop"><div class="a"></div><div class="b"></div></div>
<div class="pop"><div class="a"></div><div class="b"></div></div>
<div class="pop"><div class="a"></div><div class="b"></div></div>
<div id="call"><div class="c0">180</div><div class="c1"></div><div class="c2"></div></div>
<div id="hud" class="hide">
  <div id="col">
    <div id="sb">
      <div class="pc glass" id="pc0"><div class="nm"><span class="dot"></span><b id="pn0">你</b><i id="pl0">0</i></div><div class="big" id="pr0">501</div><div class="sub" id="ps0">平均 0.0</div><div class="bar" id="pb0"></div></div>
      <div class="pc glass" id="pc1"><div class="nm"><span class="dot"></span><b id="pn1">電腦</b><i id="pl1">0</i></div><div class="big" id="pr1">501</div><div class="sub" id="ps1">平均 0.0</div><div class="bar" id="pb1"></div></div>
    </div>
    <div id="cr" class="glass hide"><table id="crt"></table></div>
    <div id="info" class="glass">
      <div class="l1"><span class="tt" id="tt">第 1 輪</span><span class="chips"><span class="chip" id="ch0">·</span><span class="chip" id="ch1">·</span><span class="chip" id="ch2">·</span></span></div>
      <div id="co" class="dim"></div>
    </div>
  </div>
  <button id="bPause" class="rbtn glass ui" aria-label="暫停"><svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg></button>
  <div id="think" class="glass hide">電腦瞄準中<i></i><i></i><i></i></div>
  <div id="hint" class="glass">從螢幕下方往上快速滑動擲鏢</div>
</div>

<div id="title" class="ov hide">
  <div class="logo">
    <div class="sub">PUB · DARTS · 3D</div>
    <h1>射飛鏢</h1>
    <div class="eb">DARTS</div>
  </div>
  <div class="tcard glass">
    <div class="seg big" id="sMode">
      <button data-v="501" class="on">501</button><button data-v="301">301</button><button data-v="atc">繞圈</button><button data-v="cricket">米字</button><button data-v="practice">練習</button>
    </div>
    <div class="row" id="rOpp"><label>對手</label><div class="seg" id="sOpp"><button data-v="cpu" class="on">電腦</button><button data-v="pvp">雙人輪流</button></div></div>
    <div class="row" id="rLv"><label>電腦</label><div class="seg" id="sLv"><button data-v="0">業餘</button><button data-v="1" class="on">社團</button><button data-v="2">職業</button></div></div>
    <div class="row" id="rLegs"><label>局數</label><div class="seg" id="sLegs"><button data-v="1" class="on">一局決勝</button><button data-v="2">三戰兩勝</button></div></div>
    <div class="row"><label>輔助</label><div class="seg" id="sAs"><button data-v="0">簡單</button><button data-v="1" class="on">標準</button><button data-v="2">專家</button></div></div>
    <button class="gbtn pri" id="bStart">開始比賽</button>
    <div class="rec" id="rec"></div>
    <div class="tips" id="tips"></div>
  </div>

    <button class="gbtn" id="bMenu">回到標題</button>
  </div>

<script type="module">
import * as THREE from 'three';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

let renderer = null;
try {
  renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('gl'), antialias: true, powerPreference: 'high-performance' });
} catch (e) { renderer = null; }
if (!renderer) document.getElementById('msg').textContent = '這個遊戲需要支援 3D（WebGL）的瀏覽器，請換一個瀏覽器或裝置再試試看。';
else main();

function main() {
  const $ = id => document.getElementById(id);
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const lerp = (a, b, t) => a + (b - a) * t;
  const DEG = Math.PI / 180;

  /* =========================================================
   * 鏢靶規格（單位 mm，以紅心為原點，x 向右、y 向上）
   * ========================================================= */
  const ORDER = [20, 1, 18, 4, 13, 6, 10, 15, 2, 17, 3, 19, 7, 16, 8, 11, 14, 9, 12, 5];
  const IDX = {}; ORDER.forEach((n, i) => { IDX[n] = i; });
  const R_BULL = 6.35, R_OBULL = 15.9, R_T1 = 99, R_T2 = 107, R_D1 = 162, R_D2 = 170, R_BOARD = 225.5;
  const RINGS = [R_BULL, R_OBULL, R_T1, R_T2, R_D1, R_D2];

  /** 計分：回傳 { n: 數字(25=紅心)、m: 倍數、v: 分數、label } */
  function scoreAt(x, y) {
    const r = Math.hypot(x, y);
    if (r <= R_BULL) return { n: 25, m: 2, v: 50, label: 'BULL' };
    if (r <= R_OBULL) return { n: 25, m: 1, v: 25, label: '25' };
    if (r > R_D2) return { n: 0, m: 0, v: 0, label: 'MISS' };
    let a = Math.atan2(x, y) / DEG;
    a = ((a + 9) % 360 + 360) % 360;
    const n = ORDER[Math.floor(a / 18) % 20];
    if (r >= R_T1 && r <= R_T2) return { n, m: 3, v: n * 3, label: 'T' + n };
    if (r >= R_D1) return { n, m: 2, v: n * 2, label: 'D' + n };
    return { n, m: 1, v: n, label: String(n) };
  }
  /** 到最近鋼絲的距離（mm） */
  function wireDist(x, y) {
    const r = Math.hypot(x, y);
    let d = Infinity;
    for (const R of RINGS) d = Math.min(d, Math.abs(r - R));
    if (r > R_OBULL - 1 && r < R_D2 + 1) {
      let a = Math.atan2(x, y) / DEG;
      a = ((a + 9) % 18 + 18) % 18; // 與最近的分隔線角度差
      const da = Math.min(a, 18 - a) * DEG;
      d = Math.min(d, r * Math.sin(da));
    }
    return d;
  }
  /** 瞄準某一區的中心點 */
  function aimPoint(n, m, rOverride) {
    if (n === 25) return m === 2 ? { x: 0, y: 0 } : { x: 0, y: 10.5 };
    const r = rOverride || (m === 3 ? 103 : m === 2 ? 166 : 134);
    const a = IDX[n] * 18 * DEG;
    return { x: r * Math.sin(a), y: r * Math.cos(a) };
  }

  /* ---------- 收鏢建議（演算法產生，≤170） ---------- */
  const DARTS = [];
  for (let n = 1; n <= 20; n++) { DARTS.push({ n, m: 1, v: n }); DARTS.push({ n, m: 2, v: 2 * n }); DARTS.push({ n, m: 3, v: 3 * n }); }
  DARTS.push({ n: 25, m: 1, v: 25 }); DARTS.push({ n: 25, m: 2, v: 50 });
  const DBL_PREF = { 20: 0, 16: 0, 8: 0.15, 10: 0.1, 18: 0.3, 12: 0.25, 4: 0.45, 6: 0.5, 14: 0.4, 2: 0.6, 25: 1.0, 1: 1.6 };
  function dartCost(d) {
    if (d.n === 25) return d.m === 2 ? 3.4 : 2.6;
    if (d.m === 1) return 1 + (d.n < 10 ? 0.05 : 0);
    if (d.m === 3) return 2 + (20 - d.n) * 0.03;
    return 3.2;
  }
  const finCost = d => (DBL_PREF[d.n] != null ? DBL_PREF[d.n] : 0.8);
  const CO = [null, {}, {}, {}]; // CO[darts][rem] = { cost, route }
  for (let rem = 2; rem <= 170; rem++) {
    for (const d of DARTS) if (d.m === 2 && d.v === rem) { const c = finCost(d); if (!CO[1][rem] || c < CO[1][rem].cost) CO[1][rem] = { cost: c, route: [d] }; }
  }
  for (const k of [2, 3]) {
    for (let rem = 2; rem <= 170; rem++) {
      let best = CO[k - 1][rem] || null;
      for (const d of DARTS) {
        const left = rem - d.v;
        if (left < 2) continue;
        const sub = CO[k - 1][left];
        if (!sub) continue;
        const c = dartCost(d) + sub.cost + 10 * (k - 1);
        if (!best || c < best.cost) best = { cost: c, route: [d].concat(sub.route) };
      }
      if (best) CO[k][rem] = best;
    }
  }
  function checkout(rem, darts) {
    if (darts < 1 || rem > 170 || rem < 2) return null;
    const e = CO[Math.min(3, darts)][rem];
    return e ? e.route : null;
  }
  const dLabel = d => d.n === 25 ? (d.m === 2 ? 'BULL' : '25') : (d.m === 3 ? 'T' : d.m === 2 ? 'D' : 'S') + d.n;

  /* ---------- 亂數 ---------- */
  function mulberry(seed) {
    return function () {
      seed |= 0; seed = seed + 0x6D2B79F5 | 0;
      let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }
  let rnd = Math.random;
  function gauss() { let u = 0; while (!u) u = rnd(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * rnd()); }

  /* =========================================================
   * 設定與紀錄
   * ========================================================= */
  const LV_NAME = ['業餘', '社團', '職業'];
  const LV_SIGMA = [27, 16, 8.2];          // 電腦每一鏢的散佈（mm）
  const LV_FINISH = [1, 0.92, 0.8];
  const AS_NAME = ['簡單', '標準', '專家'];
  const AS_SIGMA = [3, 6.5, 10];            // 玩家基本散佈
  const MODE_NAME = { 501: '501', 301: '301', atc: '繞圈 Around the Clock', cricket: '米字 Cricket', practice: '自由練習' };
  const SKEY = 'darts:stats';
  const stats = Object.assign({ bestAvg: 0, hiCo: 0, n180: 0, wins: [0, 0, 0], played: [0, 0, 0], matches: 0 }, KG.store.get(SKEY, {}));
  const opts = Object.assign({ mode: '501', opp: 'cpu', level: 1, legs: 1, assist: 1 }, KG.store.get('darts:opts', {}));
  function saveStats() { KG.store.set(SKEY, stats); }

  /* =========================================================
   * 比賽狀態
   * ========================================================= */
  const CR_NUMS = [20, 19, 18, 17, 16, 15, 25];
  let players = [], cur = 0, starter = 0, legNo = 1, round = 1;
  let phase = 'title'; // title | aim | flight | settle | turnEnd | pull | legEnd | over
  let phaseT = 0, paused = false, aiT = 0, autoHuman = false, autoLevel = 2;
  let turn = { darts: [], start: 0, score: 0, bust: false, win: false, marks: 0 };
  let matchWinner = -1, lastCall = '';

  function newPlayer(name, human, level) {
    return { name, human, level, rem: 0, legs: 0, darts: 0, pts: 0, hiTurn: 0, hiCo: 0, n180: 0, target: 1, marks: {}, crPts: 0, mk: 0, rounds: 0, form: 1, legDarts: 0, bestLeg: 0 };
  }
  const isX01 = () => opts.mode === '501' || opts.mode === '301';
  function resetLeg() {
    const start = opts.mode === '301' ? 301 : 501;
    players.forEach(p => {
      p.rem = start; p.target = 1; p.crPts = 0; p.legDarts = 0;
      CR_NUMS.forEach(n => { p.marks[n] = 0; });
    });
    cur = starter; round = 1;
    turn = { darts: [], start: players[cur].rem, score: 0, bust: false, win: false, marks: 0 };
    darts.forEach(d => { d.state = 'off'; d.g.visible = false; });
    phase = 'aim'; phaseT = 0; aiT = 0.9;
    players.forEach(p => { p.form = 0.9 + rnd() * 0.2; });
  }
  function startMatch(o) {
    if (o) Object.assign(opts, o);
    KG.store.set('darts:opts', { mode: opts.mode, opp: opts.opp, level: opts.level, legs: opts.legs, assist: opts.assist });
    if (opts.seed != null) rnd = mulberry(opts.seed); else rnd = Math.random;
    const practice = opts.mode === 'practice';
    if (practice) players = [newPlayer('你', true, 0)];
    else if (opts.opp === 'pvp') players = [newPlayer('玩家 1', true, 0), newPlayer('玩家 2', true, 0)];
    else players = [newPlayer('你', true, 0), newPlayer('電腦・' + LV_NAME[opts.level], false, opts.level)];
    starter = 0; legNo = 1; matchWinner = -1; paused = false;
    resetLeg();
    buildHud();
    $('title').classList.add('hide'); $('over').classList.add('hide'); $('pause').classList.add('hide');
    $('hud').classList.remove('hide');
    layout();
    updateHud(); drawChalk();
    hintShow();
    startMusic();
    KG.sound('click');
  }

  /* ---------- 規則：每一鏢 ---------- */
  function applyDart(res) {
    const p = players[cur], o = players[1 - cur];
    turn.darts.push(res);
    p.darts++; p.legDarts++;
    let ev = null;
    if (isX01()) {
      const nr = p.rem - res.v;
      const dbl = res.m === 2;
      if (nr < 0 || nr === 1 || (nr === 0 && !dbl)) {
        turn.bust = true;
        p.rem = turn.start;
        turn.score = 0;
        ev = 'bust';
      } else {
        p.rem = nr;
        turn.score += res.v;
        if (nr === 0) { turn.win = true; ev = 'win'; }
      }
    } else if (opts.mode === 'cricket') {
      if (CR_NUMS.includes(res.n) && res.m > 0) {
        const before = p.marks[res.n];
        const after = before + res.m;
        p.marks[res.n] = after;
        const extra = Math.max(0, after - Math.max(3, before));
        const useful = Math.min(res.m, Math.max(0, 3 - before)) + (o && o.marks[res.n] < 3 ? extra : 0);
        if (o && o.marks[res.n] < 3 && extra > 0) { p.crPts += extra * res.n; turn.score += extra * res.n; }
        turn.marks += useful; p.mk += useful;
        if (before < 3 && after >= 3) ev = 'close';
      }
      const allClosed = CR_NUMS.every(n => p.marks[n] >= 3);
      if (allClosed && (!o || p.crPts >= o.crPts)) { turn.win = true; ev = 'win'; }
    } else if (opts.mode === 'atc') {
      const tg = p.target;
      if (tg <= 20 ? res.n === tg : res.n === 25) {
        p.target++;
        turn.score++;
        ev = 'adv';
        if (p.target > 21) { turn.win = true; ev = 'win'; }
      }
    } else {
      turn.score += res.v;
    }
    return ev;
  }
  function endTurnStats() {
    const p = players[cur];
    p.rounds++;
    if (isX01() || opts.mode === 'practice') {
      p.pts += turn.score;
      if (turn.score > p.hiTurn) p.hiTurn = turn.score;
      if (turn.score === 180) { p.n180++; if (p.human) { stats.n180++; saveStats(); } }
    }
  }

  /* =========================================================
   * 電腦對手
   * ========================================================= */
  function aiTarget(p) {
    const o = players[1 - cur];
    const left = 3 - turn.darts.length;
    if (isX01()) {
      const r = checkout(p.rem, left);
      if (r) return aimPoint(r[0].n, r[0].m);
      if (p.rem <= 110) {
        // 沒辦法這輪收鏢：留一個好收的分數
        let best = null;
        for (const d of DARTS) {
          if (d.m === 2) continue;
          const lf = p.rem - d.v;
          if (lf < 2) continue;
          const nx = CO[3][lf] || null;
          const c = dartCost(d) + (nx ? nx.cost : 40);
          if (!best || c < best.c) best = { c, d };
        }
        if (best) return aimPoint(best.d.n, best.d.m);
      }
      return aimPoint(20, 3);
    }
    if (opts.mode === 'cricket') {
      const open = CR_NUMS.filter(n => p.marks[n] < 3);
      const scoreOn = CR_NUMS.filter(n => p.marks[n] >= 3 && o && o.marks[n] < 3);
      let n;
      if (o && o.crPts > p.crPts && scoreOn.length) n = scoreOn[0];
      else if (open.length) n = open[0];
      else n = scoreOn[0] || 20;
      return n === 25 ? aimPoint(25, 2) : aimPoint(n, 3);
    }
    if (opts.mode === 'atc') {
      const tg = p.target;
      return tg > 20 ? aimPoint(25, 2) : aimPoint(tg, 1, 112);
    }
    return aimPoint(20, 3);
  }
  function aiThrow(level) {
    const p = players[cur];
    const t = aiTarget(p);
    // 收鏢時（瞄雙倍或紅心）高手會更專注
    const fin = isX01() && (Math.abs(Math.hypot(t.x, t.y) - 166) < 1 || Math.hypot(t.x, t.y) < 1);
    const s = LV_SIGMA[level] * p.form * (fin ? LV_FINISH[level] : 1);
    throwDart(t.x + gauss() * s, t.y + gauss() * s, { aim: t });
  }

  /* =========================================================
   * 音效（自己的雜訊音源 + KG.note）
   * ========================================================= */
  let actx = null, nbuf = null;
  function ac() {
    if (KG.isMuted()) return null;
    if (!actx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return null;
      try { actx = new AC(); } catch (e) { return null; }
      nbuf = actx.createBuffer(1, actx.sampleRate * 2, actx.sampleRate);
      const d = nbuf.getChannelData(0);
      for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    }
    if (actx.state === 'suspended') actx.resume();
    return actx;
  }
  window.addEventListener('pointerdown', () => { ac(); }, { once: true, capture: true });
  function noiseHit(dur, vol, type, freq, q, delay, attack) {
    const a = ac(); if (!a) return;
    const t = a.currentTime + (delay || 0);
    const src = a.createBufferSource(); src.buffer = nbuf;
    const f = a.createBiquadFilter(); f.type = type; f.frequency.value = freq; f.Q.value = q || 1;
    const g = a.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + (attack || 0.004));
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    src.connect(f); f.connect(g); g.connect(a.destination);
    src.start(t, Math.random() * 1.5); src.stop(t + dur + 0.05);
  }
  const sfx = {
    whoosh() { noiseHit(0.22, 0.12, 'bandpass', 1500, 0.8, 0, 0.08); },
    thud(big) {
      noiseHit(0.07, 0.5, 'lowpass', 900, 0.7);
      noiseHit(0.04, 0.25, 'bandpass', 2600, 2);
      KG.note(big ? 120 : 150, 0.12, 'sine', 0.32, 0, 55);
      if (big) KG.note(70, 0.25, 'sine', 0.25, 0.02, 40);
    },
    clank() {
      [2310, 3170, 4420].forEach((f, i) => KG.note(f, 0.18 - i * 0.03, 'triangle', 0.08, 0, f * 0.97));
      KG.note(1480, 0.1, 'square', 0.04);
      noiseHit(0.06, 0.3, 'highpass', 3500, 1);
    },
    fall() { noiseHit(0.06, 0.2, 'lowpass', 600, 1, 0.35); KG.note(520, 0.08, 'triangle', 0.05, 0.36); },
    pull() { noiseHit(0.1, 0.12, 'bandpass', 700, 1.5); noiseHit(0.1, 0.1, 'bandpass', 800, 1.5, 0.09); noiseHit(0.1, 0.1, 'bandpass', 650, 1.5, 0.17); },
    crowd(len, vol) {
      const a = ac(); if (!a) return;
      const t = a.currentTime;
      const src = a.createBufferSource(); src.buffer = nbuf; src.loop = true;
      const f = a.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = 900; f.Q.value = 0.6;
      const g = a.createGain();
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(vol || 0.22, t + 0.25);
      g.gain.setValueAtTime(vol || 0.22, t + len * 0.5);
      g.gain.exponentialRampToValueAtTime(0.0001, t + len);
      const lfo = a.createOscillator(), lg = a.createGain();
      lfo.frequency.value = 7; lg.gain.value = 250;
      lfo.connect(lg); lg.connect(f.frequency);
      src.connect(f); f.connect(g); g.connect(a.destination);
      src.start(t); src.stop(t + len + 0.1); lfo.start(t); lfo.stop(t + len + 0.1);
    },
    chime() { [784, 988, 1175].forEach((f, i) => KG.note(f, 0.3, 'sine', 0.1, i * 0.07)); },
    bust() { KG.note(196, 0.25, 'triangle', 0.14, 0, 150); KG.note(147, 0.35, 'triangle', 0.14, 0.15, 110); }
  };
  function sayEn(text) {
    if (KG.isMuted() || !window.speechSynthesis) return;
    try {
      const u = new SpeechSynthesisUtterance(text);
      u.lang = 'en-GB'; u.rate = 0.82; u.pitch = 0.7;
      const v = speechSynthesis.getVoices().find(x => /en[-_]GB/i.test(x.lang));
      if (v) u.voice = v;
      speechSynthesis.cancel(); speechSynthesis.speak(u);
    } catch (e) { /* 忽略 */ }
  }

  /* ---------- 背景音樂：慵懶的酒吧爵士 ---------- */
  // F 大調 I–vi–ii–V 走路貝斯 + 電鋼琴和弦
  const CH = [
    { bass: [87.3, 110, 130.8, 146.8], chord: [220, 261.6, 329.6, 349.2] },
    { bass: [146.8, 130.8, 110, 98], chord: [220, 261.6, 293.7, 349.2] },
    { bass: [98, 116.5, 130.8, 146.8], chord: [233.1, 293.7, 349.2, 392] },
    { bass: [130.8, 123.5, 116.5, 110], chord: [233.1, 293.7, 329.6, 392] }
  ];
  const MEL = [0, 523.3, 0, 440, 0, 0, 392, 0, 349.2, 0, 0, 0, 440, 0, 392, 0, 0, 466.2, 0, 440, 0, 392, 0, 0, 392, 0, 349.2, 0, 329.6, 0, 0, 0];
  let musicTimer = 0, mStep = 0;
  function startMusic() {
    if (musicTimer) return;
    musicTimer = setInterval(() => {
      if (KG.isMuted() || document.hidden || paused || phase === 'title') return;
      const bar = Math.floor(mStep / 8) % 4, s = mStep % 8, c = CH[bar];
      if (s % 2 === 0) KG.note(c.bass[s / 2] / 2 * 2, 0.36, 'triangle', 0.075);
      if (s === 2 || s === 6) c.chord.forEach((f, i) => KG.note(f, 0.32, 'sine', 0.017, i * 0.012));
      if (s === 3) c.chord.forEach((f, i) => KG.note(f, 0.14, 'sine', 0.012, i * 0.01));
      const m = MEL[mStep % 32];
      if (m && Math.floor(mStep / 32) % 2 === 1) KG.note(m, 0.42, 'sine', 0.03);
      mStep++;
    }, 300);
  }
  function stopMusic() { clearInterval(musicTimer); musicTimer = 0; }

  /* =========================================================
   * 3D 場景
   * ========================================================= */
  const BY = 1.73;            // 紅心離地高度
  const OCHE = 2.37;          // 投擲線距離
  const EYE = 1.6;
  let W = innerWidth, H = innerHeight;
  const small = Math.min(W, H) < 600;
  const low = KG.lowEnd;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.05;
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x0d0805);
  const pmrem = new THREE.PMREMGenerator(renderer);
  scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
  scene.environmentIntensity = 0.32;
  const camera = new THREE.PerspectiveCamera(30, 1, 0.03, 30);
  const baseCam = new THREE.PerspectiveCamera(30, 1, 0.03, 30);
  const maxAniso = Math.min(8, renderer.capabilities.getMaxAnisotropy());

  function canvasTex(w, h, draw, srgb) {
    const c = document.createElement('canvas');
    c.width = w; c.height = h;
    draw(c.getContext('2d'), w, h);
    const t = new THREE.CanvasTexture(c);
    if (srgb !== false) t.colorSpace = THREE.SRGBColorSpace;
    t.anisotropy = maxAniso;
    return t;
  }

  /* ---------- 燈光：溫暖的酒吧燈 ---------- */
  scene.add(new THREE.HemisphereLight(0xffd9b0, 0x2a1a10, 0.42));
  const spot = new THREE.SpotLight(0xffe2b8, 14, 6, 0.5, 0.65, 1.6);
  spot.position.set(0, 2.75, 1.05);
  spot.target.position.set(0, BY - 0.02, 0);
  spot.castShadow = true;
  spot.shadow.mapSize.set(low ? 1024 : 2048, low ? 1024 : 2048);
  spot.shadow.camera.near = 0.4; spot.shadow.camera.far = 4;
  spot.shadow.bias = -0.0002; spot.shadow.normalBias = 0.004;
  spot.shadow.radius = 3;
  scene.add(spot, spot.target);
  const fill = new THREE.DirectionalLight(0xffc999, 0.35);
  fill.position.set(-1, 2.2, 3);
  scene.add(fill);
  const sconces = [];
  for (const sx of [-1.05, 1.05]) {
    const L = new THREE.PointLight(0xffa35a, 1.1, 3.2, 1.8);
    L.position.set(sx, 2.12, 0.08);
    scene.add(L);
    sconces.push(L);
  }

  /* ---------- 牆：深色紅磚 ---------- */
  const brickCanvasDraw = (bump) => (c, w, h) => {
    const r = mulberry(bump ? 7 : 7);
    c.fillStyle = bump ? '#2a2a2a' : '#3b2a21'; c.fillRect(0, 0, w, h);
    const bw = 128, bh = 42, gap = 5;
    for (let row = 0; row * bh < h; row++) {
      const off = row % 2 ? bw / 2 : 0;
      for (let col = -1; col * bw < w + bw; col++) {
        const x = col * bw + off + gap / 2, y = row * bh + gap / 2;
        const v = r();
        if (bump) { c.fillStyle = 'rgb(' + (170 + v * 40 | 0) + ',' + (170 + v * 40 | 0) + ',' + (170 + v * 40 | 0) + ')'; }
        else { const R = 92 + v * 40, G = 42 + v * 18, B = 30 + v * 12; c.fillStyle = 'rgb(' + (R | 0) + ',' + (G | 0) + ',' + (B | 0) + ')'; }
        c.fillRect(x, y, bw - gap, bh - gap);
        // 磚面斑點
        for (let k = 0; k < 26; k++) {
          c.fillStyle = bump ? (r() < 0.5 ? 'rgba(0,0,0,.25)' : 'rgba(255,255,255,.15)') : (r() < 0.5 ? 'rgba(20,8,4,.22)' : 'rgba(180,120,90,.12)');
          c.fillRect(x + r() * (bw - gap), y + r() * (bh - gap), 2 + r() * 6, 1 + r() * 3);
        }
      }
    }

      if (land) { left = 64; right = W * 0.5; top = H < 520 ? H * 0.4 : H * 0.3; bottom = H - 12; }

    } else {
      const r = $('col').getBoundingClientRect();
      top = r.bottom + 10; bottom = H - Math.max(110, H * 0.17);

    const Rfit = 0.236;

  /** 分析滑動 → 落點（mm）。live=true 時用於簡單模式的預測準星 */
  function analyzeSwipe(live) {
    const n = swipe.n;
    if (n < 2) return null;
    const a = SP[0], b = SP[n - 1];
    const dx = b.x - a.x, dy = b.y - a.y;
    const len = Math.hypot(dx, dy);
    const minLen = Math.max(24, Math.min(W, H) * 0.06);
    if (dy > -minLen * (live ? 0.5 : 1)) return null;
    // 放手前約 70ms 的速度（用 event.timeStamp，畫面卡頓不影響力道）
    let k = n - 1;
    while (k > 0 && b.t - SP[k].t < 70) k--;
    const dtR = Math.max(10, b.t - SP[k].t) / 1000;
    let vx = (b.x - SP[k].x) / dtR, vy = (b.y - SP[k].y) / dtR;
    const dtA = Math.max(16, b.t - a.t) / 1000;
    const ax = dx / dtA, ay = dy / dtA;
    if (vy > -50) { vx = ax; vy = ay; }
    const up = Math.max(0, -(0.7 * vy + 0.3 * ay));
    const ref = clamp(Math.min(W, H), 300, 600);
    const S = up / ref;
    if (S < 0.25) return null;
    // 方向：整體方向與放手方向混合，延伸到靶心高度
    const sx = 0.5 * dx / len + 0.5 * vx / (Math.hypot(vx, vy) || 1);
    const sy = 0.5 * dy / len + 0.5 * vy / (Math.hypot(vx, vy) || 1);
    const slope = sx / Math.min(-0.2, sy);

        d.age += dt;
        d.vel.y -= GRAV * dt;
        d.g.position.addScaledVector(d.vel, dt);
        tmpE.set(d.rv.x * dt, d.rv.y * dt, d.rv.z * dt); tmpQ.setFromEuler(tmpE); d.g.quaternion.multiply(tmpQ);
        if (d.age > 1.2) { d.state = 'off'; d.g.visible = false; }
      } else if (d.state === 'pull') {
        d.age += dt;
        d.g.position.z += dt * 0.9; d.g.position.y += dt * 0.05;
        if (d.age > 0.4) { d.state = 'off'; d.g.visible = false; }
      }
    }
    if (cz.follow && phase !== 'flight') { cz.followK = Math.max(0, cz.followK - rdt * 2.5); if (cz.followK <= 0) cz.follow = null; }
    if (cz.tk > 0) { cz.hold -= rdt; if (cz.hold <= 0) cz.tk = 0; }
    if (cz.k < 0.02 && cz.tk === 0) cz.deep = 0;
    updateParticles(dt);

    // 手上的飛鏢
    if (phase === 'aim' && players[cur]) {
      const d = curDart();
      if (d.state !== 'held') { d.state = 'held'; setFlightColor(d); d.g.visible = true; held.sway = rnd() * 10; }
      let hx, hy;
      if (held.active) { hx = lerp(held.sx, held.x, 0.35); hy = Math.max(held.y, H * 0.76); }
      else { const dh = defaultHold(); hx = dh.x; hy = dh.y; }
      holdAt(hx, hy, lay.holdD, d.g.position);
      d.g.position.y += Math.sin(clock * 1.6 + held.sway) * 0.0025;
      tmpV.set(lookBase.x + (kb.x || 0) / 1000 * 0.3, BY, 0).sub(d.g.position).normalize();
      d.g.quaternion.setFromUnitVectors(Z_NEG, tmpV);
      tmpE.set(0.3, -0.12 + 0.04 * Math.sin(clock * 0.9), 0.78); tmpQ.setFromEuler(tmpE); d.g.quaternion.multiply(tmpQ);
    }

    // 狀態機
    if (phase === 'aim') {
      const p = players[cur];
      if (!p.human || autoHuman) {
        setThink(!autoHuman);
        aiT -= dt;
        if (aiT <= 0) aiThrow(p.human ? autoLevel : p.level);
      }
    } else if (phase === 'settle') {
      phaseT -= rdt * (timeScale < 0.9 ? 0.6 : 1);
      if (phaseT <= 0) afterSettle();
    } else if (phase === 'turnEnd') {
      phaseT -= dt;
      if (phaseT <= 0) {
        phase = 'pull'; phaseT = 0.45;
        darts.forEach(d => { if (d.state === 'stuck' || d.state === 'held') { d.state = 'pull'; d.age = 0; } });
        if (darts.some(d => d.state === 'pull')) sfx.pull();
      }
    } else if (phase === 'pull') {
      phaseT -= dt;
      if (phaseT <= 0) nextPlayer();
    } else if (phase === 'legEnd') {
      phaseT -= dt;
      if (phaseT <= 0) { if (matchWinner >= 0) matchOver(); else nextLeg(); }
    }
  }

  /* ---------- 自動畫質：太卡就一步步降低（解析度 → 影子），並記住 ---------- */
  const QKEY = 'quality:' + location.pathname.split('/').filter(Boolean).slice(-1)[0];
  const baseRatio = Math.min(window.devicePixelRatio || 1, small ? 1.75 : 2);
  const QLEVELS = [
    { ratio: baseRatio, shadow: true },
    { ratio: Math.min(baseRatio, 1.35), shadow: true },
    { ratio: 1, shadow: true },
    { ratio: 1, shadow: false },
    { ratio: 0.8, shadow: false }
  ];
  let qLevel = clamp(KG.store.get(QKEY, KG.lowEnd ? 2 : 0) | 0, 0, QLEVELS.length - 1);
  const perf = { last: 0, n: 0, sum: 0, cool: 2.5 };
  function applyQuality() {
    const q = QLEVELS[qLevel];
    renderer.setPixelRatio(q.ratio);
    renderer.setSize(W, H, false);
    if (renderer.shadowMap.enabled !== q.shadow) {
      renderer.shadowMap.enabled = q.shadow;
      scene.traverse(o => { if (o.material) [].concat(o.material).forEach(m => { m.needsUpdate = true; }); });
    }
  }
  let noRender = false;
  function renderFrame() {
    if (noRender) return;
    renderer.render(scene, camera);
    const now = performance.now(), dt = perf.last ? Math.min(0.5, (now - perf.last) / 1000) : 0;
    perf.last = now;
    if (document.hidden || qLevel >= QLEVELS.length - 1) return;
    perf.cool -= dt;
    if (perf.cool > 0) return;
    perf.sum += dt; perf.n++;
    if (perf.n >= 60 || (perf.n >= 8 && perf.sum > 1.2)) {
      if (perf.sum / perf.n > 1 / 45) {
        qLevel++;
        KG.store.set(QKEY, qLevel);
        applyQuality();
        perf.cool = 1.5;
      }
      perf.n = 0; perf.sum = 0;
    }
  }
  let last = performance.now(), first = true;
  function frame(now) {
    const dt = Math.max(0, Math.min(0.05, (now - last) / 1000));
    last = now;
    update(dt);
    updateCamera(dt);
    renderFrame();
    if (first) { first = false; const m = $('msg'); if (m) m.remove(); }
    requestAnimationFrame(frame);
  }
  layout();
  applyQuality();
  showTitle();
  requestAnimationFrame(frame);

  /* =========================================================
   * 測試介面
   * ========================================================= */
  window.__dt = {
    state: () => ({
      phase, paused, mode: opts.mode, cur, round, legNo, timeScale: +timeScale.toFixed(2), quality: qLevel, call: lastCall, winner: matchWinner,
      turn: { darts: turn.darts.map(r => r.label), score: turn.score, bust: turn.bust, start: turn.start },
      players: players.map(p => ({ name: p.name, rem: p.rem, legs: p.legs, darts: p.darts, avg: +avgOf(p).toFixed(2), target: p.target, crPts: p.crPts, marks: Object.assign({}, p.marks), hiCo: p.hiCo, n180: p.n180, hiTurn: p.hiTurn })),
      layout: { cx: Math.round(lay.cx), cy: Math.round(lay.cy), rpx: Math.round(lay.rpx), land: lay.land },
      stats: JSON.parse(JSON.stringify(stats))
    }),
    start: o => startMatch(Object.assign({ seed: null }, o || {})),
    title: () => showTitle(),
    throwAt: (x, y, o) => throwDart(x, y, Object.assign({ exact: true }, o || {})),
    scoreAt: (x, y) => scoreAt(x, y),
    wireDist: (x, y) => wireDist(x, y),
    checkout: (r, d) => { const c = checkout(r, d == null ? 3 : d); return c ? c.map(dLabel) : null; },
    aimPoint: (n, m) => aimPoint(n, m),
    setRem: (i, r) => { players[i].rem = r; if (i === cur) turn.start = r; updateHud(); },
    setMarks: (i, m) => { Object.assign(players[i].marks, m); updateHud(); },
    setTarget: (i, t) => { players[i].target = t; updateHud(); },
    auto: (on, lv) => { autoHuman = !!on; if (lv != null) autoLevel = lv; },
    fast: on => { fastMode = !!on; },
    pause: on => togglePause(on),
    render: on => { noRender = !on; },
    zoom: (x, y, sec) => { cz.x = x; cz.y = y; cz.tk = 1; cz.deep = 1; cz.hold = sec || 3; },
    swipe: () => ({ n: swipe.n, r: analyzeSwipe(false) }),
    step: sec => { const n = Math.round(sec * 60); for (let i = 0; i < n; i++) { update(1 / 60); if (phase === 'over') break; } updateCamera(1 / 60); return phase; },
    simulate: (level, n) => { // 電腦平均：對 T20 投 n 鏢
      let t = 0; const a = aimPoint(20, 3);
      for (let i = 0; i < n; i++) t += scoreAt(a.x + gauss() * LV_SIGMA[level], a.y + gauss() * LV_SIGMA[level]).v;
      return t / n * 3;
    }
  };
}
</script>
