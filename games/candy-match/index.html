<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>糖果三消</title>
<link rel="stylesheet" href="../../assets/common.css">
<style>
  /* ===== 共用遊戲介面（標題、選關、結算） ===== */
  html, body { height: 100%; overflow: hidden; touch-action: none; }
  .gk-canvas { position: fixed; inset: 0; width: 100vw; height: 100vh; height: 100dvh; display: block; touch-action: none; }
  .scr {
    position: fixed; inset: 0; z-index: 8500; display: none;
    align-items: center; justify-content: center; flex-direction: column;
    padding: 70px 14px calc(18px + env(safe-area-inset-bottom));
  }
  .scr.show { display: flex; animation: kg-fade .3s ease; }
  .title-scr { background: radial-gradient(ellipse at 50% 45%, rgba(255,255,255,.25) 0%, rgba(255,255,255,0) 55%, var(--vig, rgba(40,20,60,.35)) 100%); }
  .title-wrap { display: flex; flex-direction: column; align-items: center; gap: 6px; text-align: center; }
  .title-art { width: min(300px, 70vw, 34vh); height: min(240px, 56vw, 27vh); }
  .logo {
    margin: 0; font-size: clamp(46px, 13vw, 88px); font-weight: 900; line-height: 1.1; color: var(--logo, #fff);
    letter-spacing: 2px; white-space: nowrap;
    --o: var(--outline, #c2416c); --o2: var(--outline2, rgba(120, 30, 70, .55));
    text-shadow: 0 -4px 0 var(--o), 0 4px 0 var(--o), -4px 0 0 var(--o), 4px 0 0 var(--o),
      -3px -3px 0 var(--o), 3px -3px 0 var(--o), -3px 3px 0 var(--o), 3px 3px 0 var(--o),
      0 10px 0 var(--o), 4px 9px 0 var(--o), -4px 9px 0 var(--o), 0 16px 18px var(--o2);
  }
  .logo span { display: inline-block; animation: gk-bob 1.8s ease-in-out infinite; }
  .subtitle {
    margin-top: 10px; font-size: clamp(16px, 4.4vw, 20px); font-weight: 800; color: var(--ink, #4a3b52);
    background: rgba(255,255,255,.88); border-radius: 999px; padding: 6px 18px; box-shadow: var(--kg-shadow);
  }
  .big-btn {
    margin-top: 16px; font-family: var(--kg-font); font-size: clamp(28px, 8vw, 38px); font-weight: 900; color: #fff;
    min-width: 200px; padding: 14px 40px 16px; border: 5px solid #fff; border-radius: 999px; cursor: pointer;
    background: linear-gradient(180deg, var(--b1, #9be8aa) 0%, var(--b2, #3fb35f) 100%);
    box-shadow: 0 7px 0 var(--b3, #2a8746), 0 14px 26px rgba(0,0,0,.25), inset 0 6px 0 rgba(255,255,255,.35);
    text-shadow: 0 3px 0 rgba(0,0,0,.2); animation: gk-breathe 1.6s ease-in-out infinite;
    transition: transform .1s ease;
  }
  .big-btn:active { transform: translateY(5px) scale(.97); animation: none; }
  .scr-btn {
    font-family: var(--kg-font); font-size: 20px; font-weight: 900; color: #fff; cursor: pointer;
    min-height: 56px; padding: 10px 22px; border: 4px solid #fff; border-radius: 999px;
    background: linear-gradient(180deg, var(--b1, #9be8aa), var(--b2, #3fb35f));
    box-shadow: 0 5px 0 var(--b3, #2a8746), 0 10px 18px rgba(0,0,0,.2), inset 0 4px 0 rgba(255,255,255,.35);
    text-shadow: 0 2px 0 rgba(0,0,0,.18); transition: transform .1s ease;
  }
  .scr-btn.alt { --b1: #9ad8ff; --b2: #3a9ee8; --b3: #2672ad; }
  .scr-btn.warm { --b1: #ffd27a; --b2: #f39a1e; --b3: #c0700c; }
  .scr-btn.go { --b1: #9be8aa; --b2: #3fb35f; --b3: #2a8746; }
  .scr-btn:active { transform: translateY(4px) scale(.96); }
  @keyframes gk-bob { 0%, 100% { transform: translateY(0) rotate(-2deg); } 50% { transform: translateY(-8px) rotate(2deg); } }
  @keyframes gk-breathe { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.06); } }
  @keyframes gk-in { from { transform: scale(.3) translateY(30px); opacity: 0; } to { transform: none; opacity: 1; } }
  /* 置中的橫幅要保留 translate(-50%, -50%)，否則動畫結束後會往右偏 */
  @keyframes gk-in-c { from { transform: translate(-50%, -50%) scale(.3); opacity: 0; } to { transform: translate(-50%, -50%); opacity: 1; } }
  @keyframes gk-star { 0% { transform: scale(0) rotate(-120deg); opacity: 0; } 70% { transform: scale(1.3) rotate(10deg); opacity: 1; } 100% { transform: scale(1) rotate(0); } }

  /* 選關 */
  .lv-scr { background: var(--lvbg, linear-gradient(180deg, rgba(255,240,248,.95), rgba(255,250,235,.97))); justify-content: flex-start; overflow-y: auto; touch-action: pan-y; }
  .lv-head { display: flex; align-items: center; justify-content: center; gap: 12px; flex-wrap: wrap; margin: 0 0 14px; }
  .lv-head h2 { margin: 0; font-size: clamp(26px, 7vw, 36px); color: var(--ink, #4a3b52); }
  .star-count { display: inline-flex; align-items: center; gap: 4px; font-size: 22px; font-weight: 900; background: #fff; border-radius: 999px; padding: 4px 14px 4px 8px; box-shadow: var(--kg-shadow); }
  .star-count svg { width: 30px; height: 30px; }
  .lv-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(92px, 1fr)); gap: 16px 14px; width: min(640px, 100%); padding: 8px; }
  .lv-card {
    position: relative; aspect-ratio: 1 / 1.08; border: 4px solid #fff; border-radius: 26px; cursor: pointer; padding: 6px 4px;
    background: linear-gradient(180deg, var(--c1, #ffb3cc), var(--c2, #ff7aa2));
    box-shadow: 0 6px 0 var(--c3, #d4517c), 0 12px 20px rgba(0,0,0,.18), inset 0 5px 0 rgba(255,255,255,.35);
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
    font-family: var(--kg-font); color: #fff; animation: gk-in .45s cubic-bezier(.2,1.5,.4,1) both; transition: transform .1s ease;
  }
  .lv-card:active { transform: translateY(4px) scale(.96); }
  .lv-card .n { font-size: 38px; font-weight: 900; line-height: 1; text-shadow: 0 3px 0 rgba(0,0,0,.2); }
  .lv-card .lb { font-size: 13px; font-weight: 800; opacity: .95; white-space: nowrap; text-shadow: 0 1px 0 rgba(0,0,0,.2); }
  .lv-card .st { display: flex; gap: 1px; }
  .lv-card .st svg { width: 22px; height: 22px; }
  .lv-card.locked { filter: grayscale(.85) brightness(1.05); opacity: .7; cursor: default; }
  .lv-card.next::after { content: ''; position: absolute; inset: -9px; border-radius: 32px; border: 4px dashed var(--nextc, rgba(255,160,40,.95)); animation: gk-breathe 1.2s ease-in-out infinite; pointer-events: none; }
  .col-head { margin: 22px 0 10px; font-size: 22px; font-weight: 900; color: var(--ink, #4a3b52); }
  .col-row { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; width: min(640px, 100%); padding-bottom: 10px; }
  .col-item {
    position: relative; width: 96px; border: 4px solid #fff; border-radius: 22px; background: #fff; cursor: pointer; padding: 4px 4px 6px;
    box-shadow: 0 5px 0 rgba(74,59,82,.15), 0 10px 18px rgba(0,0,0,.12); font-family: var(--kg-font); text-align: center; transition: transform .1s ease;
  }
  .col-item:active { transform: scale(.95); }
  .col-item canvas { width: 80px; height: 64px; display: block; margin: 0 auto; }
  .col-item .nm { font-size: 13px; font-weight: 800; color: var(--ink, #4a3b52); white-space: nowrap; }
  .col-item.sel { border-color: var(--sel, #ffcf3d); box-shadow: 0 0 0 4px var(--sel, #ffcf3d), 0 10px 18px rgba(0,0,0,.18); }
  .col-item.locked canvas { filter: brightness(0) opacity(.22); }
  .col-item .lock { position: absolute; top: 20px; left: 0; right: 0; font-size: 16px; font-weight: 900; color: #6b5a74; display: flex; align-items: center; justify-content: center; gap: 2px; }
  .col-item .lock svg { width: 22px; height: 22px; }
  .lv-back { margin-top: 18px; }

  /* 結算 */
  .res-scr { background: rgba(50, 30, 70, .45); backdrop-filter: blur(3px); }
  .res-card {
    position: relative; width: min(400px, 100%); text-align: center; padding: 46px 20px 22px;
    background: linear-gradient(180deg, #fff 0%, var(--card2, #fff1f6) 100%); border: 6px solid #fff; border-radius: 34px;
    box-shadow: 0 18px 44px rgba(40,20,60,.4), inset 0 -8px 0 rgba(0,0,0,.04); animation: gk-in .5s cubic-bezier(.2,1.5,.4,1) both;
  }
  .res-ribbon {
    position: absolute; left: 50%; top: -28px; transform: translateX(-50%); white-space: nowrap;
    font-size: 30px; font-weight: 900; color: #fff; padding: 8px 34px 10px; border-radius: 18px;
    background: linear-gradient(180deg, var(--r1, #ff9fbe), var(--r2, #e8648d)); border: 4px solid #fff;
    box-shadow: 0 6px 0 var(--r3, #b9406a), 0 10px 20px rgba(0,0,0,.2); text-shadow: 0 3px 0 rgba(0,0,0,.18);
  }
  .res-stars { display: flex; justify-content: center; align-items: flex-end; gap: 4px; margin: 6px 0 8px; position: relative; }
  .res-stars svg { width: 78px; height: 78px; animation: gk-star .6s cubic-bezier(.2,1.5,.4,1) both; }
  .res-stars svg:nth-child(2) { width: 96px; height: 96px; margin-bottom: 14px; }
  .res-msg { font-size: 19px; font-weight: 800; line-height: 1.5; margin: 4px 0 10px; color: var(--ink, #4a3b52); }
  .res-unlock { display: none; margin: 0 auto 12px; padding: 8px 12px; border-radius: 18px; background: linear-gradient(180deg, #fff7c9, #ffe68a); border: 3px dashed #f5b82e; font-size: 17px; font-weight: 900; color: #8a5a00; align-items: center; justify-content: center; gap: 8px; }
  .res-unlock.show { display: flex; animation: gk-in .5s .9s cubic-bezier(.2,1.5,.4,1) both; }
  .res-unlock canvas { width: 60px; height: 48px; flex: none; }
  .res-btns { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }

  /* 遊戲中的小按鈕 */
  .gk-round {
    pointer-events: auto; width: 48px; height: 48px; border-radius: 50%; border: 3px solid #fff; cursor: pointer; font-size: 22px; line-height: 1;
    display: grid; place-items: center; background: linear-gradient(180deg, #fff, #ffe9f1); box-shadow: var(--kg-shadow); color: var(--ink, #4a3b52); font-family: var(--kg-font); font-weight: 900;
  }
  .gk-round:active { transform: scale(.9); }
  .gk-round svg { width: 26px; height: 26px; }
  .gk-banner { position: fixed; left: 50%; top: 40%; transform: translate(-50%, -50%); z-index: 8200; display: none; text-align: center; pointer-events: none; width: max-content; max-width: 96vw; }
  .gk-banner.show { display: block; animation: gk-in-c .5s cubic-bezier(.2,1.5,.4,1) both; }
  .gk-banner .t1 { font-size: clamp(32px, 9.5vw, 56px); font-weight: 900; color: #fff; --o: var(--outline, #c2416c);
    text-shadow: 0 -3px 0 var(--o), 0 3px 0 var(--o), -3px 0 0 var(--o), 3px 0 0 var(--o), -2px -2px 0 var(--o), 2px -2px 0 var(--o), -2px 2px 0 var(--o), 2px 2px 0 var(--o), 0 8px 0 var(--o), 0 12px 16px rgba(0,0,0,.3); white-space: nowrap; }
  .gk-banner .t2 { display: inline-block; margin-top: 10px; font-size: clamp(16px, 4.4vw, 22px); font-weight: 900; color: var(--ink, #4a3b52); background: #fffdf3; border: 3px solid var(--b1, #ffd27a); border-radius: 999px; padding: 6px 18px; box-shadow: var(--kg-shadow); }
  body { background: #ffd6ea; --outline: #d8407f; --outline2: rgba(140, 20, 80, .45); --b1: #ff9fc6; --b2: #ff4f93; --b3: #c22a6a;
    --r1: #ff9fc6; --r2: #ff4f93; --r3: #c22a6a; --card2: #fff0f7; --vig: rgba(120, 30, 90, .35);
    --lvbg: linear-gradient(180deg, rgba(255,226,240,.96), rgba(255,245,226,.97)); }
  /* 糖果風 HUD */
  .chud { width: max-content; position: fixed; top: 10px; left: 50%; transform: translateX(-50%); z-index: 8000; display: none; gap: 8px; align-items: center; justify-content: center; flex-wrap: wrap; max-width: calc(100vw - 128px); pointer-events: none; }
  .chud.show { display: flex; }
  .chud.side { left: 12px; top: 74px; transform: none; flex-direction: column; max-width: 190px; align-items: stretch; }
  .moves {
    width: 64px; height: 64px; border-radius: 50%; flex: none; display: flex; flex-direction: column; align-items: center; justify-content: center; color: #fff;
    background: radial-gradient(circle at 35% 30%, #fff 0 8%, transparent 9%), repeating-conic-gradient(from 0deg, #ff6aa8 0 20deg, #ff93c1 20deg 40deg);
    border: 4px solid #fff; box-shadow: 0 5px 0 #c22a6a, 0 8px 16px rgba(150,20,80,.3); text-shadow: 0 2px 0 #b0205e, 0 0 6px #c22a6a;
  }
  .chud.side .moves { align-self: center; width: 76px; height: 76px; }
  .moves small { font-size: 12px; font-weight: 900; line-height: 1; }
  .moves b { font-size: 26px; line-height: 1; }
  .moves.low { animation: kg-shake .4s ease; }
  .goalbox {
    display: flex; align-items: center; gap: 8px; padding: 6px 12px; min-height: 56px; border-radius: 22px; background: rgba(255,255,255,.93);
    border: 4px solid #fff; box-shadow: 0 5px 0 rgba(194,42,106,.35), 0 8px 16px rgba(150,20,80,.18); font-weight: 900; color: #7a2350;
  }
  .chud.side .goalbox { flex-direction: column; align-items: stretch; }
  .gchip { display: flex; align-items: center; gap: 4px; font-size: 20px; white-space: nowrap; }
  .gchip canvas { width: 34px; height: 34px; }
  .gchip.done { color: #2a9a4a; }
  .gscore { display: flex; flex-direction: column; gap: 3px; min-width: 130px; }
  .gscore .row { display: flex; justify-content: space-between; align-items: baseline; font-size: 13px; }
  .gscore .row b { font-size: 21px; }
  .sbar { position: relative; height: 14px; border-radius: 10px; background: #f3d6e4; box-shadow: inset 0 2px 3px rgba(0,0,0,.18); }
  .sbar i { position: absolute; left: 0; top: 0; bottom: 0; width: 0; border-radius: 10px; transition: width .35s cubic-bezier(.2,1.5,.4,1);
    background: repeating-linear-gradient(-45deg, #ff6aa8 0 7px, #ffb3d4 7px 14px); box-shadow: inset 0 3px 0 rgba(255,255,255,.45); }
  .smallscore { font-size: 13px; color: #a2577e; white-space: nowrap; }
  .hintbtn { pointer-events: auto; }
  #shuffleMsg { display: none; }
</style>
</head>
<body>
<canvas id="cv" class="gk-canvas"></canvas>
<div class="chud" id="hud">
  <div class="moves" id="moves"><small>步數</small><b id="mv">20</b></div>
  <div class="goalbox" id="goal"></div>
</div>
<script src="../../assets/common.js"></script>
<script>
'use strict';
(() => {
  /* ===================== 共用遊戲套件（每個遊戲內嵌一份） ===================== */
  const TAU = Math.PI * 2;
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const lerp = (a, b, t) => a + (b - a) * t;
  const Ease = {
    linear: t => t,
    outQuad: t => 1 - (1 - t) * (1 - t),
    outCubic: t => 1 - Math.pow(1 - t, 3),
    inCubic: t => t * t * t,
    inQuad: t => t * t,
    inOutSine: t => -(Math.cos(Math.PI * t) - 1) / 2,
    outBack: t => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); },
    outElastic: t => t === 0 ? 0 : t === 1 ? 1 : Math.pow(2, -10 * t) * Math.sin((t * 10 - 0.75) * TAU / 3) + 1,
    outBounce: t => {
      const n1 = 7.5625, d1 = 2.75;
      if (t < 1 / d1) return n1 * t * t;
      if (t < 2 / d1) return n1 * (t -= 1.5 / d1) * t + 0.75;
      if (t < 2.5 / d1) return n1 * (t -= 2.25 / d1) * t + 0.9375;
      return n1 * (t -= 2.625 / d1) * t + 0.984375;
    }
  };

  /** 補間動畫：Tween.to(物件, {屬性: 目標}, 秒, 緩動, 延遲, 完成時) */
  const Tween = {
    list: [],
    to(obj, props, dur, ease, delay, done) {
      const tw = { obj, props, dur: Math.max(0.001, dur), ease: typeof ease === 'function' ? ease : (Ease[ease] || Ease.outCubic), t: -(delay || 0), from: null, done };
      this.list.push(tw);
      return tw;
    },
    update(dt) {
      const list = this.list.slice();
      for (let i = 0; i < list.length; i++) {
        const tw = list[i];
        if (tw.dead) continue;
        tw.t += dt;
        if (tw.t < 0) continue;
        if (!tw.from) { tw.from = {}; for (const k in tw.props) tw.from[k] = tw.obj[k]; }
        const k = Math.min(1, tw.t / tw.dur), e = tw.ease(k);
        for (const p in tw.props) tw.obj[p] = tw.from[p] + (tw.props[p] - tw.from[p]) * e;
        if (k >= 1) { tw.dead = true; if (tw.done) tw.done(); }
      }
      this.list = this.list.filter(t => !t.dead);
    },
    kill(obj, prop) { this.list.forEach(t => { if (t.obj === obj && (!prop || prop in t.props)) t.dead = true; }); },
    clear() { this.list.forEach(t => { t.dead = true; }); this.list = []; },
    busy(obj) { return this.list.some(t => !t.dead && (!obj || t.obj === obj)); }
  };

  /** 畫圖小工具 */
  const Draw = {
    rr(c, x, y, w, h, r) { c.beginPath(); c.roundRect(x, y, w, h, r); },
    starPath(c, x, y, r, inner, rot) {
      c.beginPath();
      for (let i = 0; i < 10; i++) {
        const rr = i % 2 ? r * (inner || 0.5) : r, a = (rot || 0) - Math.PI / 2 + i * Math.PI / 5;
        c.lineTo(x + Math.cos(a) * rr, y + Math.sin(a) * rr);
      }
      c.closePath();
    },
    heartPath(c, x, y, s) {
      c.beginPath();
      c.moveTo(x, y + s * 0.35);
      c.bezierCurveTo(x - s * 0.1, y + s * 0.25, x - s * 0.55, y + s * 0.02, x - s * 0.5, y - s * 0.22);
      c.bezierCurveTo(x - s * 0.45, y - s * 0.5, x - s * 0.08, y - s * 0.5, x, y - s * 0.25);
      c.bezierCurveTo(x + s * 0.08, y - s * 0.5, x + s * 0.45, y - s * 0.5, x + s * 0.5, y - s * 0.22);
      c.bezierCurveTo(x + s * 0.55, y + s * 0.02, x + s * 0.1, y + s * 0.25, x, y + s * 0.35);
      c.closePath();
    },
    /** 有光澤的星星 */
    star(c, x, y, r, on) {
      Draw.starPath(c, x, y + r * 0.08, r, 0.52);
      c.fillStyle = 'rgba(120,70,0,.25)'; c.fill();
      Draw.starPath(c, x, y, r, 0.52);
      const g = c.createLinearGradient(0, y - r, 0, y + r);
      if (on !== false) { g.addColorStop(0, '#fff3a0'); g.addColorStop(0.5, '#ffd23f'); g.addColorStop(1, '#f59e0b'); }
      else { g.addColorStop(0, '#eee'); g.addColorStop(1, '#bbb'); }
      c.fillStyle = g; c.fill();
      c.lineWidth = Math.max(1.5, r * 0.12); c.strokeStyle = on !== false ? '#d9822b' : '#999'; c.lineJoin = 'round'; c.stroke();
      c.fillStyle = 'rgba(255,255,255,.6)';
      c.beginPath(); c.ellipse(x - r * 0.2, y - r * 0.28, r * 0.18, r * 0.1, -0.6, 0, TAU); c.fill();
    },
    /** 可愛大眼睛。mode: open / happy / closed / sad / dizzy */
    eye(c, x, y, r, mode, lookX, lookY, ink) {
      ink = ink || '#3a2440';
      if (mode === 'happy') {
        c.strokeStyle = ink; c.lineWidth = r * 0.45; c.lineCap = 'round';
        c.beginPath(); c.arc(x, y + r * 0.35, r * 0.75, Math.PI * 1.15, Math.PI * 1.85); c.stroke();
        return;
      }
      if (mode === 'closed') {
        c.strokeStyle = ink; c.lineWidth = r * 0.4; c.lineCap = 'round';
        c.beginPath(); c.arc(x, y - r * 0.2, r * 0.7, Math.PI * 0.15, Math.PI * 0.85); c.stroke();
        return;
      }
      if (mode === 'dizzy') {
        c.strokeStyle = ink; c.lineWidth = r * 0.3; c.lineCap = 'round';
        c.beginPath();
        for (let a = 0; a < TAU * 1.6; a += 0.3) { const rr = r * 0.9 * a / (TAU * 1.6); c.lineTo(x + Math.cos(a) * rr, y + Math.sin(a) * rr); }
        c.stroke();
        return;
      }
      c.fillStyle = ink;
      c.beginPath(); c.ellipse(x, y, r * 0.86, r, 0, 0, TAU); c.fill();
      const lx = (lookX || 0) * r * 0.2, ly = (lookY || 0) * r * 0.2;
      c.fillStyle = '#fff';
      c.beginPath(); c.arc(x - r * 0.3 + lx, y - r * 0.38 + ly, r * 0.36, 0, TAU); c.fill();
      c.beginPath(); c.arc(x + r * 0.3 + lx, y + r * 0.35 + ly, r * 0.16, 0, TAU); c.fill();
      if (mode === 'sad') {
        c.strokeStyle = ink; c.lineWidth = r * 0.25; c.lineCap = 'round';
        c.beginPath(); c.moveTo(x - r * 0.8, y - r * 1.5); c.lineTo(x + r * 0.6, y - r * 1.2); c.stroke();
      }
    },
    blush(c, x, y, r, a) {
      c.fillStyle = 'rgba(255,105,140,' + (a == null ? 0.45 : a) + ')';
      c.beginPath(); c.ellipse(x, y, r, r * 0.62, 0, 0, TAU); c.fill();
    },
    shadow(c, x, y, rx, ry, a) {
      c.save(); c.translate(x, y); c.scale(1, ry / rx);
      const g = c.createRadialGradient(0, 0, 0, 0, 0, rx);
      g.addColorStop(0, 'rgba(30,20,50,' + (a == null ? 0.3 : a) + ')'); g.addColorStop(1, 'rgba(30,20,50,0)');
      c.fillStyle = g; c.beginPath(); c.arc(0, 0, rx, 0, TAU); c.fill(); c.restore();
    },
    /** 雲朵 */
    cloud(c, x, y, s, a) {
      c.save(); c.translate(x, y); c.scale(s, s);
      c.globalAlpha *= (a == null ? 1 : a);
      c.fillStyle = 'rgba(150,180,220,.35)';
      c.beginPath(); c.ellipse(4, 26, 64, 10, 0, 0, TAU); c.fill();
      const g = c.createLinearGradient(0, -34, 0, 30);
      g.addColorStop(0, '#ffffff'); g.addColorStop(1, '#e3efff');
      c.fillStyle = g;
      c.beginPath();
      [[-38, 10, 22], [-14, -4, 30], [16, -8, 28], [42, 8, 20], [2, 12, 26]].forEach(([a1, b, r]) => { c.moveTo(a1 + r, b); c.arc(a1, b, r, 0, TAU); });
      c.fill();
      c.fillStyle = 'rgba(255,255,255,.9)';
      c.beginPath(); c.ellipse(-16, -16, 14, 6, -0.3, 0, TAU); c.fill();
      c.restore();
    }
  };

  /** 粒子特效、浮動文字、畫面震動 */
  const FX = {
    parts: [], texts: [], rings: [], shakeT: 0, shakeMag: 0, hitStop: 0,
    burst(x, y, o) {
      o = o || {};
      const n = o.n || 14;
      for (let i = 0; i < n; i++) {
        const a = o.angle != null ? o.angle + KG.rand(-(o.spread || 0.6), o.spread || 0.6) : Math.random() * TAU;
        const v = KG.rand(o.speedMin || 80, o.speed || 260);
        this.parts.push({
          x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - (o.up == null ? 60 : o.up), g: o.gravity == null ? 420 : o.gravity,
          life: 1, decay: 1 / (o.life || 0.9) * KG.rand(0.8, 1.2), r: KG.rand(o.size || 6, (o.size || 6) * 1.7),
          rot: Math.random() * TAU, vr: KG.rand(-6, 6), shape: o.shape || 'star', c: KG.pick(o.colors || ['#ffd23f', '#ff8fb1', '#7fd1ff', '#9be27f', '#fff'])
        });
      }
    },
    ring(x, y, color, size) { this.rings.push({ x, y, r: 4, max: size || 60, life: 1, color: color || '#fff' }); },
    text(str, x, y, o) {
      o = o || {};
      if (o.tag) this.texts = this.texts.filter(t => t.tag !== o.tag);
      this.texts.push({ tag: o.tag, str, x, y, vy: o.vy == null ? -70 : o.vy, life: 1, dur: o.dur || 1.1, size: o.size || 30, color: o.color || '#fff', stroke: o.stroke || '#c2416c', scale: 0 });
    },
    shake(mag, t) { this.shakeMag = Math.max(this.shakeMag, mag); this.shakeT = Math.max(this.shakeT, t || 0.3); },
    update(dt) {
      this.parts.forEach(p => { p.vy += p.g * dt; p.x += p.vx * dt; p.y += p.vy * dt; p.vx *= 0.99; p.rot += p.vr * dt; p.life -= p.decay * dt; });
      this.parts = this.parts.filter(p => p.life > 0);
      this.rings.forEach(r => { r.life -= dt * 2.2; r.r = lerp(r.max, 4, Math.max(0, r.life)); });
      this.rings = this.rings.filter(r => r.life > 0);
      this.texts.forEach(t => { t.life -= dt / t.dur; t.y += t.vy * dt; t.vy *= 0.97; t.scale = Math.min(1, t.scale + dt * 5); });
      this.texts = this.texts.filter(t => t.life > 0);
      this.shakeT = Math.max(0, this.shakeT - dt);
      if (this.shakeT <= 0) this.shakeMag = 0;
    },
    offset() {
      if (this.shakeT <= 0) return [0, 0];
      const m = this.shakeMag * Math.min(1, this.shakeT * 4);
      return [KG.rand(-m, m), KG.rand(-m, m)];
    },
    draw(c, font) {
      this.rings.forEach(r => {
        c.globalAlpha = Math.max(0, r.life); c.strokeStyle = r.color; c.lineWidth = 5 * r.life + 1;
        c.beginPath(); c.arc(r.x, r.y, r.r, 0, TAU); c.stroke();
      });
      this.parts.forEach(p => {
        c.globalAlpha = Math.min(1, p.life * 1.6);
        c.fillStyle = p.c;
        c.save(); c.translate(p.x, p.y); c.rotate(p.rot);
        if (p.shape === 'star') { Draw.starPath(c, 0, 0, p.r, 0.45); c.fill(); }
        else if (p.shape === 'heart') { Draw.heartPath(c, 0, 0, p.r * 2); c.fill(); }
        else if (p.shape === 'confetti') { c.fillRect(-p.r * 0.6, -p.r * 0.3, p.r * 1.2, p.r * 0.6); }
        else { c.beginPath(); c.arc(0, 0, p.r * 0.7, 0, TAU); c.fill(); }
        c.restore();
      });
      c.globalAlpha = 1;
      this.texts.forEach(t => {
        const s = Ease.outBack(Math.min(1, t.scale));
        c.save(); c.translate(t.x, t.y); c.scale(s, s);
        c.globalAlpha = Math.min(1, t.life * 3);
        c.font = '900 ' + t.size + 'px ' + (font || 'sans-serif');
        c.textAlign = 'center'; c.textBaseline = 'middle'; c.lineJoin = 'round';
        c.lineWidth = t.size * 0.28; c.strokeStyle = t.stroke; c.strokeText(t.str, 0, 0);
        c.fillStyle = t.color; c.fillText(t.str, 0, 0);
        c.restore();
      });
      c.globalAlpha = 1;
    },
    clear() { this.parts = []; this.texts = []; this.rings = []; this.shakeT = 0; this.hitStop = 0; }
  };

  /** 背景音樂：用 KG.note 合成的循環小旋律（靜音時不發聲） */
  const Music = {
    timer: null, song: null, step: 0, next: 0,
    midi(m) { return 440 * Math.pow(2, (m - 69) / 12); },
    start(song) {
      this.stop();
      this.song = song; this.step = 0; this.next = performance.now() + 120;
      this.timer = setInterval(() => this.tick(), 50);
    },
    stop() { if (this.timer) clearInterval(this.timer); this.timer = null; this.song = null; },
    tick() {
      const s = this.song; if (!s) return;
      const now = performance.now();
      if (document.hidden || KG.isMuted() || !Music.unlocked) { this.next = now + 100; return; }
      const beat = 60000 / s.bpm / 2; // 八分音符
      if (this.next < now - 500) this.next = now;
      while (this.next < now + 160) {
        const delay = Math.max(0, (this.next - now) / 1000);
        const m = s.mel[this.step % s.mel.length];
        if (m) KG.note(this.midi(m), beat / 1000 * (s.legato || 0.9), s.wave || 'triangle', s.vol || 0.05, delay);
        if (s.bass) {
          const b = s.bass[this.step % s.bass.length];
          if (b) KG.note(this.midi(b), beat / 1000 * 1.6, 'sine', (s.vol || 0.05) * 1.2, delay);
        }
        this.step++;
        this.next += beat;
      }
    }
  };

  // 使用者第一次互動後才開始發聲（瀏覽器自動播放規則）
  ['pointerdown', 'keydown'].forEach(ev => window.addEventListener(ev, () => { Music.unlocked = true; }, { once: true, capture: true }));

  /** 小段音效 */
  const Jingle = {
    win() { [72, 76, 79, 84, 79, 84, 88].forEach((m, i) => KG.note(Music.midi(m), 0.2, 'triangle', 0.18, i * 0.11)); },
    star(i) { KG.note(Music.midi(76 + i * 4), 0.25, 'triangle', 0.22); KG.note(Music.midi(88 + i * 4), 0.3, 'sine', 0.12, 0.08); },
    unlock() { [79, 83, 86, 91].forEach((m, i) => KG.note(Music.midi(m), 0.18, 'sine', 0.18, i * 0.08)); },
    combo(n) { KG.note(Music.midi(72 + Math.min(n, 10) * 2), 0.15, 'triangle', 0.2); KG.note(Music.midi(79 + Math.min(n, 10) * 2), 0.2, 'triangle', 0.16, 0.07); },
    step(i) { KG.note(Music.midi(67 + (i % 8) * 2), 0.1, 'triangle', 0.16); }
  };

  const LOCK_SVG = '<svg viewBox="0 0 100 100"><rect x="20" y="44" width="60" height="46" rx="12" fill="#8d7c96" stroke="#5f4f68" stroke-width="5"/><path d="M33 46V34a17 17 0 0 1 34 0v12" fill="none" stroke="#5f4f68" stroke-width="9" stroke-linecap="round"/><circle cx="50" cy="66" r="7" fill="#5f4f68"/></svg>';

  /** 高解析度畫布 */
  function hiDPI(cv) {
    const ctx = cv.getContext('2d');
    const o = { ctx, W: 0, H: 0, DPR: 1 };
    o.fit = (w, h) => {
      o.DPR = Math.min(window.devicePixelRatio || 1, 2.5);
      o.W = w; o.H = h;
      cv.width = Math.round(w * o.DPR); cv.height = Math.round(h * o.DPR);
      ctx.setTransform(o.DPR, 0, 0, o.DPR, 0, 0);
    };
    return o;
  }

  /** 防止頁面捲動（選關畫面可以捲） */
  document.addEventListener('touchmove', e => { if (!e.target.closest || !e.target.closest('.lv-scr')) e.preventDefault(); }, { passive: false });
  document.addEventListener('gesturestart', e => e.preventDefault());
  document.addEventListener('dblclick', e => e.preventDefault());

  /**
   * 標題、選關、結算畫面。
   * UI.init({ slug, title, subtitle, levels:[{label, colors}], items:[{name, need}], drawMascot(c,w,h,t), drawItem(c,i,w,h), onPlay(i), onItem(i), onMenu(), music })
   */
  const UI = {
    o: null, save: null, artT: 0, artRaf: 0, current: 0, bannerTimer: 0,
    init(o) {
      this.o = o;
      this.save = KG.store.get(o.slug + ':save', null) || { stars: [], item: 0 };
      if (!Array.isArray(this.save.stars)) this.save.stars = [];
      const mk = (cls, html) => { const d = document.createElement('div'); d.className = cls; d.innerHTML = html; document.body.appendChild(d); return d; };
      this.title = mk('scr title-scr',
        '<div class="title-wrap"><canvas class="title-art"></canvas><h1 class="logo">' + [...o.title].map((ch, i) => '<span style="animation-delay:' + (i * 0.12) + 's">' + ch + '</span>').join('') + '</h1>' +
        '<div class="subtitle">' + o.subtitle + '</div><button class="big-btn">開始</button></div>');
      this.lv = mk('scr lv-scr', '<div class="lv-head"><h2>選擇關卡</h2><div class="star-count"></div></div><div class="lv-grid"></div>' +
        (o.items && o.items.length ? '<div class="col-head">' + (o.itemsTitle || '收藏') + '</div><div class="col-row"></div>' : '') +
        '<button class="scr-btn alt lv-back">回標題</button>');
      this.res = mk('scr res-scr', '<div class="res-card"><div class="res-ribbon"></div><div class="res-stars"></div><div class="res-msg"></div><div class="res-unlock"></div><div class="res-btns"></div></div>');
      this.ban = mk('gk-banner', '<div class="t1"></div><div class="t2"></div>');
      this.title.querySelector('.big-btn').addEventListener('click', () => {
        KG.sound('pop');
        if (!this.save.started) { this.save.started = 1; this.persist(); this.play(0); }
        else this.showLevels();
      });
      this.lv.querySelector('.lv-back').addEventListener('click', () => { KG.sound('click'); this.showTitle(); });
      this.artCv = hiDPI(this.title.querySelector('.title-art'));
    },
    persist() { KG.store.set(this.o.slug + ':save', this.save); },
    total() { return this.save.stars.reduce((a, b) => a + (b || 0), 0); },
    stars(i) { return this.save.stars[i] || 0; },
    unlocked(i) { return i === 0 || this.stars(i - 1) > 0; },
    itemUnlocked(i) { return this.total() >= this.o.items[i].need; },
    item() { const i = this.save.item || 0; return this.o.items && this.o.items[i] && this.itemUnlocked(i) ? i : 0; },
    hideAll() { [this.title, this.lv, this.res].forEach(s => s.classList.remove('show')); cancelAnimationFrame(this.artRaf); this.artRaf = 0; },
    banner(t1, t2, dur) {
      const b = this.ban;
      b.querySelector('.t1').textContent = t1;
      const s2 = b.querySelector('.t2'); s2.textContent = t2 || ''; s2.style.display = t2 ? '' : 'none';
      b.classList.remove('show'); void b.offsetWidth; b.classList.add('show');
      clearTimeout(this.bannerTimer);
      this.bannerTimer = setTimeout(() => b.classList.remove('show'), (dur || 2) * 1000);
    },
    hideBanner() { clearTimeout(this.bannerTimer); this.ban.classList.remove('show'); },
    showTitle() {
      this.hideAll(); this.hideBanner();
      this.title.classList.add('show');
      if (this.o.music) Music.start(this.o.music);
      const r = this.title.querySelector('.title-art').getBoundingClientRect();
      this.artCv.fit(r.width || 260, r.height || 200);
      let last = performance.now();
      const loop = now => {
        this.artT += Math.max(0, Math.min(0.05, (now - last) / 1000)); last = now;
        const a = this.artCv;
        a.ctx.setTransform(a.DPR, 0, 0, a.DPR, 0, 0);
        a.ctx.clearRect(0, 0, a.W, a.H);
        this.o.drawMascot(a.ctx, a.W, a.H, this.artT);
        this.artRaf = requestAnimationFrame(loop);
      };
      this.artRaf = requestAnimationFrame(loop);
      if (this.o.onMenu) this.o.onMenu();
    },
    showLevels() {
      this.hideAll(); this.hideBanner();
      if (this.o.music && !Music.song) Music.start(this.o.music);
      const total = this.total(), max = this.o.levels.length * 3;
      this.lv.querySelector('.star-count').innerHTML = starSVG(true) + total + ' / ' + max;
      const grid = this.lv.querySelector('.lv-grid');
      grid.innerHTML = '';
      let nextShown = false;
      this.o.levels.forEach((L, i) => {
        const b = document.createElement('button');
        const open = this.unlocked(i), st = this.stars(i);
        b.className = 'lv-card' + (open ? '' : ' locked');
        if (open && !st && !nextShown) { b.classList.add('next'); nextShown = true; }
        b.style.animationDelay = (i * 0.04) + 's';
        if (L.colors) { b.style.setProperty('--c1', L.colors[0]); b.style.setProperty('--c2', L.colors[1]); b.style.setProperty('--c3', L.colors[2]); }
        b.innerHTML = open
          ? '<div class="n">' + (i + 1) + '</div><div class="lb">' + (L.label || '') + '</div><div class="st">' + [0, 1, 2].map(k => starSVG(k < st)).join('') + '</div>'
          : '<div class="n" style="width:44px;height:44px">' + LOCK_SVG + '</div><div class="lb">' + (L.label || '') + '</div>';
        b.addEventListener('click', () => {
          if (!open) { KG.sound('wrong'); b.classList.remove('kg-shake'); void b.offsetWidth; b.classList.add('kg-shake'); KG.toast('先過前一關喔！'); return; }
          KG.sound('pop'); this.play(i);
        });
        grid.appendChild(b);
      });

      if (row) {
        row.innerHTML = '';

          d.innerHTML = '<canvas></canvas><div class="nm">' + (ok ? it.name : '？？？') + '</div>' + (ok ? '' : '<div class="lock">' + starSVG(true) + it.need + '</div>');
          row.appendChild(d);
          const h = hiDPI(d.querySelector('canvas'));
          h.fit(80, 64);
          this.o.drawItem(h.ctx, i, 80, 64);
          d.addEventListener('click', () => {
            if (!ok) { KG.sound('wrong'); KG.toast('還需要 ' + (it.need - total) + ' 顆星星'); return; }

    },
    /** 結算：o = { stars 1–3, title, msg } */
    result(o) {
      Music.stop();
      this.hideBanner();
      const i = this.current;
      const itemsBefore = (this.o.items || []).map((_, k) => this.itemUnlocked(k));
      if ((o.stars || 0) > this.stars(i)) { this.save.stars[i] = o.stars; this.persist(); }
      const newItem = (this.o.items || []).findIndex((_, k) => !itemsBefore[k] && this.itemUnlocked(k));
      this.hideAll();
      const r = this.res;
      r.querySelector('.res-ribbon').textContent = o.title || (o.stars >= 3 ? '太完美了！' : o.stars === 2 ? '好棒喔！' : '過關了！');
      r.querySelector('.res-stars').innerHTML = [0, 1, 2].map(k => starSVG(k < o.stars)).join('');
      [...r.querySelectorAll('.res-stars svg')].forEach((s, k) => { s.style.animationDelay = (0.35 + k * 0.28) + 's'; });
      for (let k = 0; k < o.stars; k++) setTimeout(() => Jingle.star(k), 380 + k * 280);

      un.innerHTML = '';

        un.innerHTML = '<canvas></canvas><span>解鎖了新' + (this.o.itemWord || '造型') + '：' + this.o.items[newItem].name + '！</span>';

      if (i + 1 < this.o.levels.length) add('下一關 ▶', 'go', () => this.play(i + 1));
      add('再玩一次', 'warm', () => this.play(i));

  const JELLY_ROWS = r => r === 0 || r === 1 || r === N - 2 || r === N - 1;
  const LEVELS = [
    { label: '甜甜開始', moves: 20, colors: 5, goal: { type: 'score', n: 800 }, tip: '三個一樣排一排就消除！' },

  /* ---------- 版面 ---------- */
  function layout() {
    W = innerWidth; H = innerHeight;
    view.fit(W, H);
    side = W > H * 1.25 && W >= 600;
    hud.classList.toggle('side', side);
    if (side) {
      const hudW = 200;
      board = Math.min(H - 24, W - hudW * 2 - 20, 700);
      bx = Math.round((W - board) / 2); by = Math.round((H - board) / 2);
      if (bx < hudW + 12) bx = hudW + 12;
    } else {
      const top = hud.classList.contains('show') ? hud.getBoundingClientRect().bottom + 12 : 90;
      const bearSpace = H - top > W * 1.35 ? 110 : 0;
      board = Math.min(W - 16, H - top - 16 - bearSpace, 640);
      bx = Math.round((W - board) / 2);
      by = Math.round(top + Math.max(0, (H - top - board - bearSpace) * 0.4));
    }
    cs = board / N;
    sprites.clear();
    drawBG();
