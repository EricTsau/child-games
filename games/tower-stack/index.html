<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>疊疊樂</title>
<link rel="stylesheet" href="../../assets/common.css">
<style>
  html, body { height: 100%; overflow: hidden; background: #7fd0ff; }
  body { height: 100vh; height: 100dvh; touch-action: none; }
  #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: pointer; }

  /* ===== 共用介面元件（標題、按鈕、選關、結算） ===== */
  .scr {
    position: fixed; inset: 0; z-index: 7000;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: clamp(10px, 2.4vh, 22px); padding: 72px 16px 24px; text-align: center;
    touch-action: none;
  }
  .scr[hidden] { display: none; }
  .scr.dim { background: radial-gradient(ellipse at center, rgba(40, 20, 70, 0.15), rgba(40, 20, 70, 0.5)); animation: kg-fade .25s ease; }
  .logo { display: flex; justify-content: center; font-size: clamp(56px, 17vw, 120px); font-weight: 900; line-height: 1.05; letter-spacing: 0.02em; }
  .logo span {
    display: inline-block; color: var(--c);
    -webkit-text-stroke: 0.14em #fff; paint-order: stroke fill;
    text-shadow: 0 0.07em 0 var(--d), 0 0.12em 0.18em rgba(60, 30, 70, 0.35);
    animation: lgIn .7s cubic-bezier(.2, 1.7, .4, 1) both, lgBob 2.4s ease-in-out infinite;
  }
  @keyframes lgIn { from { transform: translateY(-80px) scale(.3); opacity: 0; } to { transform: none; opacity: 1; } }
  @keyframes lgBob { 0%, 100% { transform: translateY(0) rotate(-3deg); } 50% { transform: translateY(-8px) rotate(3deg); } }
  .tag {
    font-size: clamp(16px, 4.4vw, 22px); font-weight: 900; color: #6b3f12;
    background: linear-gradient(180deg, #fff7d6, #ffe09a); border: 3px solid #fff; border-radius: 999px;
    padding: 6px 18px; box-shadow: 0 4px 0 #e0a640, 0 8px 16px rgba(0, 0, 0, .15);
  }
  .cbtn {
    --b1: #9cf07a; --b2: #3fbf4c; --b3: #2a8f37;
    position: relative; font: 900 clamp(22px, 6.4vw, 32px)/1 var(--kg-font); color: #fff;
    padding: 0.55em 1.5em 0.6em; border: 4px solid #fff; border-radius: 999px; cursor: pointer;
    background: linear-gradient(180deg, var(--b1), var(--b2));
    box-shadow: 0 7px 0 var(--b3), 0 14px 24px rgba(30, 30, 60, 0.28);
    text-shadow: 0 3px 0 rgba(0, 0, 0, 0.18); transition: transform .1s, box-shadow .1s;
    min-height: 56px; touch-action: manipulation;
  }
  .cbtn::before { content: ''; position: absolute; left: 14%; right: 14%; top: 7%; height: 36%; border-radius: 999px; background: linear-gradient(rgba(255, 255, 255, .75), rgba(255, 255, 255, 0)); pointer-events: none; }
  .cbtn:active { transform: translateY(5px) scale(.97); box-shadow: 0 2px 0 var(--b3), 0 6px 12px rgba(30, 30, 60, .25); }
  .cbtn.pulse { animation: pulse 1.3s ease-in-out infinite; }
  .cbtn.blue { --b1: #8ad6ff; --b2: #3d9df0; --b3: #2470b8; }
  .cbtn.pink { --b1: #ffb0cc; --b2: #f26a9b; --b3: #c2426f; }
  .cbtn.small { font-size: 19px; padding: 0.5em 1.1em; min-height: 52px; }
  @keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.07); } }
  .panel {
    width: min(560px, 100%); max-height: calc(100% - 10px); overflow: auto;
    background: linear-gradient(180deg, rgba(255, 255, 255, .96), rgba(255, 244, 230, .96));
    border: 5px solid #fff; border-radius: 30px; padding: 18px 14px 20px;
    box-shadow: 0 10px 0 rgba(150, 90, 40, .25), 0 20px 40px rgba(40, 20, 60, .3);
    animation: kg-pop .4s cubic-bezier(.2, 1.6, .4, 1);
  }
  .panel h2 { margin: 2px 0 12px; font-size: 28px; color: #7a4a1c; }
  .lvls { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 12px; }
  .lv {
    position: relative; border: 4px solid #fff; border-radius: 24px; padding: 10px 4px 8px; cursor: pointer;
    background: linear-gradient(180deg, var(--l1, #ffe7a8), var(--l2, #ffbf5c));
    box-shadow: 0 6px 0 var(--l3, #d48a2a), 0 10px 16px rgba(0, 0, 0, .15);
    font-family: var(--kg-font); color: #fff; min-height: 104px; transition: transform .1s;
    animation: kg-pop .45s cubic-bezier(.2, 1.6, .4, 1) both;
  }
  .lv:active { transform: translateY(4px); box-shadow: 0 2px 0 var(--l3, #d48a2a); }
  .lv b { display: block; font-size: 34px; line-height: 1; text-shadow: 0 3px 0 rgba(0, 0, 0, .2); }
  .lv small { display: block; font-size: 13px; font-weight: 800; margin: 3px 0 4px; color: rgba(255, 255, 255, .95); text-shadow: 0 1px 0 rgba(0, 0, 0, .25); }
  .lv.locked { filter: grayscale(.9) brightness(1.05); cursor: default; }
  .lv .lock { display: grid; place-items: center; height: 34px; margin-bottom: 0; }
  .lv .lock svg { width: 34px; height: 34px; }
  .stars-row { display: flex; justify-content: center; gap: 2px; }
  .st { display: block; }
  .st path { fill: #e6dccf; stroke: #c9b8a6; }
  .st.on path { fill: url(#gStar); stroke: #d98a00; }
  .skins { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-top: 14px; }
  .skin {
    position: relative; width: 74px; height: 74px; border-radius: 20px; border: 4px solid #fff; cursor: pointer; padding: 0;
    background: linear-gradient(180deg, #e9f6ff, #c6e6ff); box-shadow: 0 5px 0 #8fbfe0; display: grid; place-items: center;
  }
  .skin.sel { outline: 4px solid #ff8fb1; outline-offset: 1px; transform: scale(1.06); }
  .skin.locked canvas { filter: grayscale(1) opacity(.45); }
  .skin .need { position: absolute; bottom: -2px; right: -6px; display: flex; align-items: center; gap: 1px; font: 900 13px var(--kg-font); color: #7a4a1c; background: #fff; border-radius: 999px; padding: 1px 6px 1px 3px; box-shadow: 0 2px 4px rgba(0,0,0,.2); }
  .row { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; align-items: center; }
  .total { display: inline-flex; align-items: center; gap: 4px; font-weight: 900; font-size: 20px; color: #7a4a1c; }

  /* 結算卡 */
  .result { position: relative; width: min(400px, 100%); padding-top: 34px; overflow: visible; margin-top: 20px; }
  .ribbon {
    position: absolute; left: 50%; top: -26px; transform: translateX(-50%); white-space: nowrap;
    font-size: 28px; font-weight: 900; color: #fff; padding: 8px 34px 10px;
    background: linear-gradient(180deg, #ff9fc0, #f2668f); border-radius: 14px; border: 4px solid #fff;
    box-shadow: 0 6px 0 #c2426f, 0 10px 18px rgba(0, 0, 0, .2); text-shadow: 0 2px 0 rgba(0, 0, 0, .2);
  }
  .bigstars { display: flex; justify-content: center; gap: 6px; margin: 4px 0 8px; }
  .bigstars svg { width: 70px; height: 70px; animation: starIn .5s cubic-bezier(.2, 1.8, .4, 1) both; }
  .bigstars svg:nth-child(2) { width: 86px; height: 86px; margin-top: -12px; }
  @keyframes starIn { from { transform: scale(0) rotate(-120deg); opacity: 0; } to { transform: none; opacity: 1; } }
  .result p { font-size: 19px; font-weight: 800; margin: 4px 0 14px; color: #6a4a5a; }
  .unlock { display: inline-flex; align-items: center; gap: 8px; margin: -4px 0 12px; padding: 6px 14px; background: #fff3c4; border-radius: 999px; font-weight: 900; color: #a0620a; animation: kg-pop .5s .9s both; }

  /* HUD：木頭招牌 */
  .hud {
    position: fixed; top: 10px; left: 50%; transform: translateX(-50%); z-index: 8000; pointer-events: none;
    width: min(250px, calc(100vw - 136px)); padding: 6px 10px 8px;
    background: linear-gradient(180deg, #e9b57a, #c98a4c); border: 3px solid #8a5a2e; border-radius: 16px;
    box-shadow: inset 0 2px 0 rgba(255, 255, 255, .45), inset 0 -3px 0 rgba(0, 0, 0, .12), 0 6px 12px rgba(60, 30, 10, .3);
    color: #fff; font-weight: 900;
  }
  .hud[hidden] { display: none; }
  .hud::before, .hud::after { content: ''; position: absolute; top: 7px; width: 6px; height: 6px; border-radius: 50%; background: #8a5a2e; box-shadow: inset 0 1px 0 rgba(255,255,255,.4); }
  .hud::before { left: 7px; } .hud::after { right: 7px; }
  .hud .top { display: flex; justify-content: space-between; align-items: center; font-size: 17px; text-shadow: 0 2px 0 #7a4a1c; padding: 0 6px; }
  .hearts { display: flex; gap: 1px; }
  .hearts svg { width: 22px; height: 22px; transition: transform .3s, filter .3s; }
  .hearts svg.off { filter: grayscale(1) opacity(.45); transform: scale(.8); }
  .bar { position: relative; margin-top: 5px; height: 16px; border-radius: 999px; background: #7a4a1c; box-shadow: inset 0 2px 3px rgba(0, 0, 0, .35); overflow: hidden; }
  .bar i {
    position: absolute; left: 0; top: 0; bottom: 0; width: 0; border-radius: 999px; transition: width .35s cubic-bezier(.2, 1.4, .4, 1);
    background: repeating-linear-gradient(-45deg, #ff8fb1 0 8px, #ffb3cc 8px 16px);
    box-shadow: inset 0 3px 0 rgba(255, 255, 255, .45);
  }
  .bar span { position: absolute; inset: 0; display: grid; place-items: center; font-size: 12px; text-shadow: 0 1px 0 #7a4a1c; }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <linearGradient id="gStar" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff2a0"/><stop offset=".55" stop-color="#ffd23a"/><stop offset="1" stop-color="#ffab1a"/></linearGradient>
    <linearGradient id="gHeart" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffb0c8"/><stop offset="1" stop-color="#f0446f"/></linearGradient>
  </defs>
</svg>
<canvas id="game" aria-label="疊疊樂遊戲畫面"></canvas>

<div class="hud" id="hud" hidden>
  <div class="top"><span id="hudLv">第 1 關</span><span class="hearts" id="hearts"></span></div>
  <div class="bar"><i id="barFill"></i><span id="barTxt">0 / 6</span></div>
</div>

<!-- 標題畫面 -->
<section class="scr" id="title">
  <div style="flex:1"></div>
  <div class="logo" id="logo"></div>
  <div class="tag">對準時機，把積木疊高高！</div>
  <div style="flex:2.2"></div>
  <button class="cbtn pulse" id="btnStart">開始玩</button>
  <div style="flex:.2"></div>
</section>

<!-- 選關畫面 -->
<section class="scr dim" id="select" hidden>
  <div class="panel">
    <h2>選擇關卡</h2>
    <div class="row" style="margin:-4px 0 12px"><span class="total" id="totalStars"></span></div>
    <div class="lvls" id="lvls"></div>
    <h2 style="margin-top:16px;font-size:22px">積木造型</h2>
    <div class="skins" id="skins"></div>
  </div>
</section>

<!-- 結算畫面 -->
<section class="scr dim" id="resultScr" hidden>
  <div class="panel result">
    <div class="ribbon" id="resTitle">過關啦！</div>
    <canvas id="resPet" width="200" height="120" style="width:160px;height:96px"></canvas>
    <div class="bigstars" id="resStars"></div>
    <p id="resMsg"></p>
    <div id="resUnlock"></div>
    <div class="row" id="resBtns"></div>
  </div>
</section>

<script src="../../assets/common.js"></script>
<script>
'use strict';
(function () {
  const cv = document.getElementById('game');
  const ctx = cv.getContext('2d');
  const $ = id => document.getElementById(id);

  /* ======================= 資料 ======================= */
  const BASE_W = 5;
  const PALETTE = [
    { a: '#ffc2d8', b: '#f06a9b', line: '#c94a7a' },
    { a: '#ffdcae', b: '#f7993c', line: '#c8701f' },
    { a: '#fff6b0', b: '#f4c63e', line: '#c49a1c' },
    { a: '#c8f5c0', b: '#5cc46a', line: '#3a9a4a' },
    { a: '#c4eaff', b: '#4aa8ec', line: '#2c7fc0' },
    { a: '#e4d6ff', b: '#9a78f0', line: '#7354c9' }
  ];
  const SCALE = [523, 587, 659, 784, 880, 1047, 1175, 1319];
  // 關卡：目標層數、移動方式、速度、天空起始高度、地面主題
  const LEVELS = [
    { name: '青青草原', target: 6, mode: 'slide', speed: 2.0, sky: 0, ground: 'meadow', col: ['#c9f59a', '#6cc94a', '#3f9a2f'] },
    { name: '花花山丘', target: 8, mode: 'slide', speed: 2.5, sky: 8, ground: 'flower', col: ['#ffd0e4', '#ff86b3', '#d2557f'] },
    { name: '搖搖吊車', target: 10, mode: 'swing', speed: 1.7, sky: 14, ground: 'meadow', col: ['#ffe7a8', '#ffbf5c', '#d48a2a'] },
    { name: '夕陽海邊', target: 12, mode: 'slide', speed: 3.0, sky: 25, ground: 'sea', col: ['#ffd1b0', '#ff9a66', '#d0683a'] },
    { name: '星星夜空', target: 14, mode: 'swing', speed: 2.1, sky: 44, ground: 'flower', col: ['#cbbcff', '#8c6cf0', '#5e43c2'] },
    { name: '月亮冒險', target: 16, mode: 'mix', speed: 3.0, sky: 60, ground: 'moon', col: ['#b9d6ff', '#5a86e0', '#3a5cae'] }
  ];
  const ENDLESS = { name: '無限挑戰', target: Infinity, mode: 'mix', speed: 2.2, sky: 0, ground: 'meadow', endless: true };
  const SKINS = [
    { id: 'jelly', name: '果凍寶寶', need: 0 },
    { id: 'crate', name: '小貓木箱', need: 3 },
    { id: 'cake', name: '熊熊蛋糕', need: 7 },
    { id: 'candy', name: '兔兔糖果', need: 12 }
  ];

  const save = KG.store.get('tower-stack:save', null) || { stars: [], skin: 0 };
  const totalStars = () => save.stars.reduce((a, b) => a + (b || 0), 0);
  const persist = () => KG.store.set('tower-stack:save', save);

  /* ======================= 版面 ======================= */
  let W = 0, H = 0, U = 40, groundY = 0;
  function resize() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2.5);
    W = innerWidth; H = innerHeight;
    cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    U = Math.max(28, Math.min(W / 8.2, H / 15, 62));
    groundY = H - Math.max(60, H * 0.12);
  }
  window.addEventListener('resize', resize);
  resize();

  const sY = y => groundY - (y - camY) * U;
  const sX = x => W / 2 + x * U;
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const lerp = (a, b, k) => a + (b - a) * k;
  const easeOutBack = k => { const c = 1.7; return 1 + (c + 1) * Math.pow(k - 1, 3) + c * Math.pow(k - 1, 2); };
  function range() { return clamp(W / 2 / U - 0.2, 2.4, 6.5); }

  function rr(g, x, y, w, h, r) {
    r = Math.max(0, Math.min(r, w / 2, h / 2));
    g.beginPath();
    g.moveTo(x + r, y);
    g.arcTo(x + w, y, x + w, y + h, r);
    g.arcTo(x + w, y + h, x, y + h, r);
    g.arcTo(x, y + h, x, y, r);
    g.arcTo(x, y, x + w, y, r);
    g.closePath();
  }

  /* ======================= 背景音樂 ======================= */
  const NOTE = n => 440 * Math.pow(2, (n - 69) / 12);  // MIDI → Hz
  const BGM = (function () {
    // C 大調輕快小曲（每格八分音符）
    const mel = [76, 0, 79, 76, 72, 0, 74, 76, 77, 0, 81, 77, 74, 0, 76, 77, 79, 0, 76, 72, 74, 0, 71, 74, 72, 0, 76, 79, 84, 0, 0, 0];
    const bass = [48, 55, 53, 48, 55, 55, 48, 48];
    let timer = null, step = 0;
    function tick() {
      if (KG.isMuted() || document.hidden) { step++; return; }
      const m = mel[step % mel.length];
      if (m) KG.note(NOTE(m), 0.2, 'triangle', 0.05);
      if (step % 4 === 0) KG.note(NOTE(bass[(step / 4 | 0) % bass.length]), 0.38, 'sine', 0.08);
      if (step % 2 === 1) KG.note(NOTE(bass[(step / 4 | 0) % bass.length] + 19), 0.08, 'sine', 0.025);
      step++;
    }
    return {
      start() { if (!timer) { step = 0; timer = setInterval(tick, 210); } },
      stop() { clearInterval(timer); timer = null; }
    };
  })();

  /* ======================= 遊戲狀態 ======================= */
  let state = 'title';       // title / select / play / clear / fail / result
  let level = LEVELS[0], levelIdx = 0;
  let stack = [], cur = null, debris = [], sparks = [], pops = [];
  let camY = 0, score = 0, perfects = 0, combo = 0, lives = 3, t = 0, shake = 0, freeze = 0, demoTimer = 0;

  // 天空中的裝飾（全部手繪）
  const clouds = [];
  for (let y = 2.5; y < 140; y += KG.rand(2.6, 4.2)) clouds.push({ y, x: Math.random(), s: KG.rand(0.7, 1.4), v: KG.rand(0.006, 0.018) });
  const deco = [
    { y: 5, k: 'bird', v: 0.05, c: '#ffd34a' }, { y: 9, k: 'balloon', v: 0.012, c: '#ff6f9a' },
    { y: 13, k: 'bird', v: -0.04, c: '#7cc8ff' }, { y: 18, k: 'hot', v: 0.01 },
    { y: 23, k: 'balloon', v: -0.015, c: '#8fd86a' }, { y: 29, k: 'bird', v: 0.045, c: '#ff9a5c' },
    { y: 35, k: 'hot', v: -0.012 }, { y: 46, k: 'planet', v: 0.006, c: '#ffb36b' },
    { y: 56, k: 'shoot', v: 0.09 }, { y: 64, k: 'planet', v: -0.005, c: '#9fd0ff' },
    { y: 74, k: 'shoot', v: -0.08 }, { y: 82, k: 'planet', v: 0.007, c: '#ff8fc0' },
    { y: 95, k: 'shoot', v: 0.1 }, { y: 108, k: 'planet', v: 0.004, c: '#b9f08a' }
  ].map(d => Object.assign(d, { x: Math.random() }));
  const stars = [];
  for (let i = 0; i < 150; i++) stars.push({ x: Math.random(), y: Math.random(), r: KG.rand(0.6, 2.1), p: Math.random() * 6 });

  /* ======================= 天空顏色 ======================= */
  const SKY = [
    [0, [127, 208, 255], [222, 244, 255]],
    [16, [150, 200, 255], [255, 236, 210]],
    [28, [255, 150, 160], [255, 214, 158]],
    [40, [110, 85, 170], [255, 140, 160]],
    [52, [24, 28, 82], [80, 60, 150]],
    [70, [8, 12, 46], [30, 30, 92]]
  ];
  function skyAt(h) {
    for (let i = 0; i < SKY.length - 1; i++) {
      const a = SKY[i], b = SKY[i + 1];
      if (h <= b[0]) {
        const k = clamp((h - a[0]) / (b[0] - a[0]), 0, 1);
        return [a[1].map((v, j) => lerp(v, b[1][j], k)), a[2].map((v, j) => lerp(v, b[2][j], k))];
      }
    }
    const l = SKY[SKY.length - 1];
    return [l[1], l[2]];
  }
  const rgb = (c, a) => `rgba(${c[0] | 0},${c[1] | 0},${c[2] | 0},${a == null ? 1 : a})`;
  const skyH = () => level.sky + camY * 0.75;

  /* ======================= 遊戲流程 ======================= */
  function reset(lv) {
    level = lv;
    stack = [{ x: 0, y: 0, w: BASE_W, base: true }];
    debris = []; sparks = []; pops = [];
    camY = 0; score = 0; perfects = 0; combo = 0; lives = 3;
    spawn();
    updHud();
  }

  function startLevel(i) {
    levelIdx = i;
    reset(i < 0 ? ENDLESS : LEVELS[i]);
    state = 'play';
    showScreen(null);
    $('hud').hidden = false;
    BGM.start();
    pops.push({ text: level.endless ? '無限挑戰！' : `第 ${i + 1} 關`, x: 0, y: 3.2, life: 1.6, col: '#ff8a3d' });
    KG.sound('whoosh');
  }

  function spawn() {
    const top = stack[stack.length - 1];
    const n = stack.length;
    let c;
    do { c = KG.randInt(0, PALETTE.length - 1); } while (c === top.c);
    let mode = level.mode;
    if (mode === 'mix') mode = n % 2 ? 'swing' : 'slide';
    const dir = n % 2 ? 1 : -1;
    cur = {
      x: -dir * range(), y: n + 2.4, w: top.w, n, c, dir, mode,
      phase: dir > 0 ? -Math.PI / 2 : Math.PI / 2,
      skin: state === 'play' ? SKINS[save.skin].id : 'jelly',
      ear: KG.pick(['round', 'cat', 'none', 'bunny']), seed: Math.random() * 10,
      falling: false, vy: 0, enter: 0, rot: 0
    };
  }

  function speed() {
    const base = state === 'play' ? level.speed : 2.4;
    const ramp = level.endless ? Math.min(3.5, (cur.n - 1) * 0.1) : (cur.n - 1) * 0.05;
    return base + ramp;
  }

  function drop() {
    if (state !== 'play' || !cur || cur.falling || freeze > 0) return;
    cur.falling = true; cur.vy = -2;
    KG.sound('whoosh');
  }

  const PRAISE = ['好棒！', '太厲害了！', '完美！', '超級棒！', '哇～讚！'];
  function land() {
    const top = stack[stack.length - 1];
    const dx = cur.x - top.x;
    const tol = 0.18;
    cur.rot = 0;
    if (Math.abs(dx) <= tol) {
      cur.x = top.x;
      combo++; perfects++;
      cur.w = Math.min(BASE_W, cur.w + 0.22 + Math.min(combo, 4) * 0.04);
      cur.happy = 1.4;
      KG.sound('sparkle');
      const txt = combo > 1 ? `${PRAISE[Math.min(combo - 1, PRAISE.length - 1)]} ×${combo}` : '完美！';
      pops.push({ text: txt, x: cur.x, y: cur.n + 1.7, life: 1.3, col: '#ff5f95' });
      freeze = 0.07;
      for (let i = 0; i < 26; i++) {
        const side = i % 2 ? 1 : -1;
        sparks.push({ x: cur.x + side * cur.w / 2, y: cur.n + Math.random(), vx: side * KG.rand(1, 4.5), vy: KG.rand(-1, 4.5), life: 1, col: KG.pick(['#fff6a0', '#ffffff', '#ffd1e6', '#b9f3ff']), s: KG.rand(3, 8), rot: Math.random() * 6 });
      }
    } else {
      const cL = cur.x - cur.w / 2, cR = cur.x + cur.w / 2;
      const tL = top.x - top.w / 2, tR = top.x + top.w / 2;
      const oL = Math.max(cL, tL), oR = Math.min(cR, tR);
      if (oR - oL <= 0.04) { miss(dx); return; }
      combo = 0;
      const sign = Math.sign(dx);
      const pL = sign > 0 ? oR : cL, pR = sign > 0 ? cR : oL;
      debris.push({ x: (pL + pR) / 2, y: cur.n, w: pR - pL, c: cur.c, skin: cur.skin, ear: 'none', seed: cur.seed, vx: sign * KG.rand(1, 2.2), vy: 2, rot: 0, vr: sign * KG.rand(2, 4) });
      cur.x = (oL + oR) / 2; cur.w = oR - oL;
      KG.sound('hit');
      shake = 0.15;
    }
    cur.squash = 1;
    cur.falling = false;
    stack.push(cur);
    score++;
    pops.push({ text: '+1', x: cur.x + cur.w / 2 + 0.4, y: cur.n + 0.6, life: 0.9, col: '#ffffff', small: true });
    KG.note(SCALE[(score - 1) % SCALE.length], 0.18, 'triangle', 0.18, 0.02);
    for (let i = 0; i < 10; i++) sparks.push({ x: cur.x + KG.rand(-cur.w / 2, cur.w / 2), y: cur.n, vx: KG.rand(-1.5, 1.5), vy: KG.rand(0.3, 1.6), life: 0.6, col: 'rgba(255,255,255,0.9)', s: KG.rand(3, 6), puff: true });
    shake = Math.max(shake, 0.1);
    updHud();
    if (score >= level.target) { levelClear(); return; }
    if (level.endless && score % 10 === 0) { pops.push({ text: `${score} 層！好高！`, x: 0, y: cur.n + 2.6, life: 1.6, col: '#ff8a3d' }); KG.say(`好棒，${score} 層了`); }
    spawn();
  }

  function miss(dx) {
    const sign = Math.sign(dx) || 1;
    debris.push(Object.assign(cur, { vx: sign * 2.5, vy: 1, rot: 0, vr: sign * 3, falling: false }));
    cur = null;
    combo = 0;
    lives--;
    shake = 0.3;
    KG.sound('boing');
    KG.vibrate(40);
    updHud(true);
    if (lives > 0) {
      pops.push({ text: '沒關係！再試一次', x: 0, y: stack.length + 1.8, life: 1.6, col: '#7a6cff' });
      setTimeout(() => { if (state === 'play' && !cur) spawn(); }, 900);
      return;
    }
    state = 'fail';
    setTimeout(() => showResult(false), 1400);
  }

  function levelClear() {
    cur = null;
    state = 'clear';
    KG.sound('win');
    // 整座塔一起開心地跳
    stack.forEach((b, i) => { b.cheer = -i * 0.06; b.happy = 3; });
    const r = sY(stack.length);
    KG.confetti(W / 2, clamp(r, 80, H * 0.6), 140);
    pops.push({ text: '過關啦！', x: 0, y: stack.length + 1.8, life: 2.2, col: '#ff5f95', big: true });
    setTimeout(() => showResult(true), 2000);
  }

  function starsFor() {
    let s = 1;
    if (lives === 3) s++;
    if (perfects >= Math.ceil(level.target / 3)) s++;
    return s;
  }

  /* ======================= 介面 ======================= */
  const STAR_PATH = 'M12 1.8l3 6.4 7 .8-5.2 4.8 1.4 6.9L12 17.2l-6.2 3.5 1.4-6.9L2 9l7-.8z';
  const starSvg = (on, size) => `<svg class="st ${on ? 'on' : ''}" viewBox="0 0 24 24" width="${size}" height="${size}"><path d="${STAR_PATH}" stroke-width="1.6" stroke-linejoin="round"/><path d="M8.5 7.5l2-.3" stroke="#fff" stroke-width="1.6" stroke-linecap="round" opacity="${on ? .8 : 0}"/></svg>`;
  const heartSvg = on => `<svg viewBox="0 0 24 24" class="${on ? '' : 'off'}"><path d="M12 21s-8-5.2-8-11a4.6 4.6 0 0 1 8-3 4.6 4.6 0 0 1 8 3c0 5.8-8 11-8 11z" fill="url(#gHeart)" stroke="#c22f5c" stroke-width="1.5"/><ellipse cx="8" cy="8.5" rx="2" ry="1.3" fill="#fff" opacity=".7" transform="rotate(-30 8 8.5)"/></svg>`;
  const lockSvg = '<svg viewBox="0 0 40 40" width="40" height="40"><rect x="8" y="17" width="24" height="18" rx="5" fill="#b9a99a" stroke="#7d6b5c" stroke-width="2.5"/><path d="M13 17v-4a7 7 0 0 1 14 0v4" fill="none" stroke="#7d6b5c" stroke-width="3.5"/><circle cx="20" cy="25" r="2.6" fill="#7d6b5c"/></svg>';

  function updHud(hurt) {
    $('hudLv').textContent = level.endless ? '無限挑戰' : `第 ${levelIdx + 1} 關`;
    let h = '';
    for (let i = 0; i < 3; i++) h += heartSvg(i < lives);
    $('hearts').innerHTML = h;
    if (hurt) { const el = $('hud'); el.classList.remove('kg-shake'); void el.offsetWidth; el.classList.add('kg-shake'); }
    if (level.endless) {
      const best = KG.best('tower-stack') || 0;
      $('barFill').style.width = clamp(score / Math.max(10, best || 10), 0, 1) * 100 + '%';
      $('barTxt').textContent = `${score} 層 ・ 最高 ${Math.max(best, score)}`;
    } else {
      $('barFill').style.width = clamp(score / level.target, 0, 1) * 100 + '%';
      $('barTxt').textContent = `${score} / ${level.target}`;
    }
  }

  function showScreen(id) {
    ['title', 'select', 'resultScr'].forEach(s => { $(s).hidden = s !== id; });
  }

  // 標題字
  (function buildLogo() {
    const cols = [['#ff7fa8', '#c2426f'], ['#ffb347', '#c87a12'], ['#5cc8ff', '#2a7fc0']];
    $('logo').innerHTML = '疊疊樂'.split('').map((ch, i) => `<span style="--c:${cols[i][0]};--d:${cols[i][1]};animation-delay:${i * 0.12}s,${0.7 + i * 0.25}s">${ch}</span>`).join('');
  })();

  function buildSelect() {
    const total = totalStars();
    $('totalStars').innerHTML = starSvg(true, 28) + ` ${total} / ${LEVELS.length * 3}`;
    const box = $('lvls');
    box.innerHTML = '';
    LEVELS.forEach((lv, i) => {
      const unlocked = i === 0 || (save.stars[i - 1] || 0) > 0;
      const b = document.createElement('button');
      b.className = 'lv' + (unlocked ? '' : ' locked');
      b.style.cssText = `--l1:${lv.col[0]};--l2:${lv.col[1]};--l3:${lv.col[2]};animation-delay:${i * 0.05}s`;
      const s = save.stars[i] || 0;
      b.innerHTML = (unlocked ? `<b>${i + 1}</b>` : `<div class="lock">${lockSvg}</div>`) + `<small>${lv.name}</small><div class="stars-row">${[0, 1, 2].map(k => starSvg(k < s, 22)).join('')}</div>`;
      b.addEventListener('click', () => {
        if (!unlocked) { KG.sound('wrong'); b.classList.remove('kg-shake'); void b.offsetWidth; b.classList.add('kg-shake'); return; }
        KG.sound('pop'); startLevel(i);
      });
      box.appendChild(b);
    });
    // 無限模式：過了第 3 關才開放
    const endOk = (save.stars[2] || 0) > 0;
    const e = document.createElement('button');
    e.className = 'lv' + (endOk ? '' : ' locked');
    e.style.cssText = '--l1:#ffd6f0;--l2:#c78cff;--l3:#8c55c8;animation-delay:.3s';
    e.innerHTML = (endOk ? '<b style="font-size:30px">∞</b>' : `<div class="lock">${lockSvg}</div>`) + `<small>無限挑戰</small><div class="stars-row" style="font-size:13px;font-weight:900">最高 ${KG.best('tower-stack') || 0}</div>`;
    e.addEventListener('click', () => {
      if (!endOk) { KG.toast('過了第 3 關就能玩！'); KG.sound('wrong'); return; }
      KG.sound('pop'); startLevel(-1);
    });
    box.appendChild(e);
    // 造型
    const sk = $('skins');
    sk.innerHTML = '';
    SKINS.forEach((s, i) => {
      const ok = total >= s.need;
      const b = document.createElement('button');
      b.className = 'skin' + (save.skin === i ? ' sel' : '') + (ok ? '' : ' locked');
      b.title = s.name;
      const c = document.createElement('canvas');
      c.width = 132; c.height = 120; c.style.width = '58px'; c.style.height = '53px';
      const g = c.getContext('2d');
      g.scale(2, 2);
      drawBlockAt(g, { w: 1, c: (i * 2 + 1) % PALETTE.length, skin: s.id, ear: s.id === 'jelly' ? 'cat' : '', seed: i }, 33, 36, 50, 30, 'smile', 0);
      b.appendChild(c);
      if (!ok) b.insertAdjacentHTML('beforeend', `<span class="need">${starSvg(true, 14)}${s.need}</span>`);
      b.addEventListener('click', () => {
        if (!ok) { KG.toast(`收集 ${s.need} 顆星星就能解鎖！`); KG.sound('wrong'); return; }
        save.skin = i; persist(); KG.sound('pop'); buildSelect();
      });
      sk.appendChild(b);
    });
  }

  let resAnim = 0;
  function showResult(win) {
    state = 'result';
    BGM.stop();
    $('hud').hidden = true;
    const box = $('resBtns');
    box.innerHTML = '';
    let starsN = 0, unlockHtml = '';
    if (level.endless) {
      const best = KG.best('tower-stack', score);
      starsN = score >= 25 ? 3 : score >= 12 ? 2 : 1;
      $('resTitle').textContent = score >= best ? '新紀錄！' : '好高的塔！';
      $('resMsg').textContent = `疊了 ${score} 層！最高紀錄 ${best} 層`;
      win = true;
    } else if (win) {
      const before = totalStars();
      starsN = starsFor();
      save.stars[levelIdx] = Math.max(save.stars[levelIdx] || 0, starsN);
      persist();
      const after = totalStars();
      const newSkin = SKINS.find(s => s.need > before && s.need <= after);
      if (newSkin) unlockHtml = `<div class="unlock">🎁 解鎖新造型：${newSkin.name}！</div>`;
      $('resTitle').textContent = starsN === 3 ? '超級完美！' : '過關啦！';
      $('resMsg').textContent = `疊了 ${score} 層，完美 ${perfects} 次！`;
    } else {
      $('resTitle').textContent = '差一點點！';
      $('resMsg').textContent = `疊了 ${score} 層，再試一次就會成功喔！`;
    }
    $('resUnlock').innerHTML = unlockHtml;
    $('resStars').innerHTML = [0, 1, 2].map(k => starSvg(k < starsN, 70)).join('');
    [...$('resStars').children].forEach((s, k) => { s.style.animationDelay = (0.25 + k * 0.25) + 's'; if (k < starsN) setTimeout(() => KG.note(880 + k * 220, 0.18, 'triangle', 0.2), 250 + k * 250); });
    const mk = (txt, cls, fn) => { const b = document.createElement('button'); b.className = 'cbtn small ' + cls; b.textContent = txt; b.addEventListener('click', () => { KG.sound('click'); fn(); }); box.appendChild(b); };
    if (win && !level.endless && levelIdx < LEVELS.length - 1) mk('下一關', '', () => startLevel(levelIdx + 1));
    mk(win ? '再玩一次' : '再試一次', win && !level.endless && levelIdx < LEVELS.length - 1 ? 'blue' : '', () => startLevel(levelIdx));
    mk('選關卡', 'pink', openSelect);
    showScreen('resultScr');
    if (win) { KG.sound('win'); KG.confetti(); } else KG.sound('lose');
    // 結算卡上的吉祥物積木
    const rc = $('resPet'), rg = rc.getContext('2d');
    const mood = win ? 'happy' : 'sad';
    cancelAnimationFrame(resAnim);
    const t0 = performance.now();
    (function anim(now) {
      if (state !== 'result') return;
      const k = (now - t0) / 1000;
      rg.setTransform(1, 0, 0, 1, 0, 0);
      rg.clearRect(0, 0, 200, 120);
      const hop = win ? Math.abs(Math.sin(k * 4)) * 14 : 0;
      rg.fillStyle = 'rgba(80,40,60,0.15)';
      rg.beginPath(); rg.ellipse(100, 108, 56 - hop, 7, 0, 0, Math.PI * 2); rg.fill();
      drawBlockAt(rg, { w: 1, c: 0, skin: SKINS[save.skin].id, ear: 'cat', seed: 2 }, 100, 76 - hop, 120, 54, mood, win ? 0 : Math.sin(k * 3) * 0.06, win ? Math.max(0, 1 - Math.abs(Math.sin(k * 4)) * 4) * 0.6 : 0);
      resAnim = requestAnimationFrame(anim);
    })(t0);
  }

  function openSelect() {
    state = 'select';
    $('hud').hidden = true;
    BGM.start();
    buildSelect();
    showScreen('select');
    reset(LEVELS[0]);
  }

  $('btnStart').addEventListener('click', () => { KG.sound('click'); openSelect(); });

  /* ======================= 更新 ======================= */
  function update(dt) {
    t += dt;
    if (freeze > 0) { freeze -= dt; return; }   // 小小停頓（打擊感）
    if (cur) {
      if (!cur.falling) {
        if (cur.mode === 'swing') {
          cur.phase += dt * speed() * 0.85;
          cur.x = Math.sin(cur.phase) * range();
          cur.rot = Math.cos(cur.phase) * 0.0 + Math.sin(cur.phase) * 0.12;
        } else {
          const R = range();
          cur.x += cur.dir * speed() * dt;
          if (cur.x > R) { cur.x = R; cur.dir = -1; }
          if (cur.x < -R) { cur.x = -R; cur.dir = 1; }
        }
        cur.enter = Math.min(1, cur.enter + dt * 3);
        // 標題/選單的示範自動遊玩
        if (state !== 'play') {
          demoTimer -= dt;
          const top = stack[stack.length - 1];
          if (demoTimer <= 0 && Math.abs(cur.x - top.x) < 0.12 && cur.enter >= 1) { cur.falling = true; cur.vy = -2; }
        }
      } else {
        cur.rot *= Math.pow(0.001, dt);
        cur.vy -= 48 * dt;
        cur.y += cur.vy * dt;
        if (cur.y <= cur.n) {
          cur.y = cur.n;
          if (state === 'play') land(); else demoLand();
        }
      }
    }
    stack.forEach(b => {
      if (b.squash) b.squash = Math.max(0, b.squash - dt * 5);
      if (b.happy) b.happy = Math.max(0, b.happy - dt);
      if (b.cheer != null) { b.cheer += dt; if (b.cheer > 1.6) b.cheer = null; }
    });
    for (let i = debris.length - 1; i >= 0; i--) {
      const d = debris[i];
      d.vy -= 26 * dt; d.x += d.vx * dt; d.y += d.vy * dt; d.rot += d.vr * dt;
      if (sY(d.y) > H + 300) debris.splice(i, 1);
    }
    for (let i = sparks.length - 1; i >= 0; i--) {
      const s = sparks[i];
      s.vy -= (s.puff ? 0 : 6) * dt; s.x += s.vx * dt; s.y += s.vy * dt; s.life -= dt * (s.puff ? 1.6 : 1.1);
      if (s.rot != null) s.rot += dt * 4;
      if (s.life <= 0) sparks.splice(i, 1);
    }
    for (let i = pops.length - 1; i >= 0; i--) { pops[i].y += dt * 0.8; pops[i].life -= dt; if (pops[i].life <= 0) pops.splice(i, 1); }
    const n = stack.length;
    const target = Math.max(0, n - (groundY - H * 0.56) / U);
    camY += (target - camY) * Math.min(1, dt * 3.5);
    shake = Math.max(0, shake - dt);
  }

  function demoLand() {
    cur.falling = false; cur.squash = 1; cur.rot = 0;
    stack.push(cur);
    for (let i = 0; i < 8; i++) sparks.push({ x: cur.x + KG.rand(-cur.w / 2, cur.w / 2), y: cur.n, vx: KG.rand(-1.5, 1.5), vy: KG.rand(0.3, 1.6), life: 0.6, col: 'rgba(255,255,255,0.9)', s: KG.rand(3, 6), puff: true });
    demoTimer = KG.rand(0.3, 1.2);
    if (stack.length > 7) { stack.forEach((b, i) => { b.cheer = -i * 0.06; b.happy = 2; }); setTimeout(() => { if (state === 'title' || state === 'select') reset(LEVELS[0]); }, 1600); cur = null; return; }
    spawn();
  }

  /* ======================= 繪圖：背景 ======================= */
  function drawSky() {
    const h = skyH();
    const [top, bot] = skyAt(h);
    const g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, rgb(top)); g.addColorStop(1, rgb(bot));
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
    // 光芒
    const night = clamp((h - 36) / 16, 0, 1);
    if (night < 1) {
      ctx.save(); ctx.globalAlpha = 0.12 * (1 - night);
      ctx.translate(W * 0.8, H * 0.12);
      ctx.rotate(t * 0.03);
      ctx.fillStyle = '#ffffff';
      for (let i = 0; i < 10; i++) { ctx.rotate(Math.PI / 5); ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(Math.max(W, H), -60); ctx.lineTo(Math.max(W, H), 60); ctx.fill(); }
      ctx.restore();
    }
    if (night > 0) {
      stars.forEach(s => {
        const yy = ((s.y * H + camY * U * 0.08) % H + H) % H;
        ctx.globalAlpha = night * (0.55 + 0.45 * Math.sin(t * 2 + s.p));
        ctx.fillStyle = '#fffbe6';
        if (s.r > 1.8) sparkle(ctx, s.x * W, yy, s.r * 2.2, 0);
        else { ctx.beginPath(); ctx.arc(s.x * W, yy, s.r, 0, Math.PI * 2); ctx.fill(); }
      });
      ctx.globalAlpha = 1;
    }
    const sk = clamp(h / 34, 0, 1);
    const sunA = 1 - clamp((h - 34) / 8, 0, 1);
    if (sunA > 0) {
      const sx = W * 0.8, sy = H * 0.16 + sk * H * 0.62, r = Math.min(W, H) * (0.07 + sk * 0.04);
      ctx.globalAlpha = sunA;
      const gl = ctx.createRadialGradient(sx, sy, r * 0.3, sx, sy, r * 2.6);
      gl.addColorStop(0, sk > 0.6 ? 'rgba(255,170,90,0.6)' : 'rgba(255,246,170,0.7)'); gl.addColorStop(1, 'rgba(255,240,170,0)');
      ctx.fillStyle = gl; ctx.beginPath(); ctx.arc(sx, sy, r * 2.6, 0, Math.PI * 2); ctx.fill();
      const sg = ctx.createRadialGradient(sx - r * 0.3, sy - r * 0.3, r * 0.1, sx, sy, r);
      sg.addColorStop(0, '#fffbe0'); sg.addColorStop(1, sk > 0.6 ? '#ff9a4a' : '#ffd84a');
      ctx.fillStyle = sg; ctx.beginPath(); ctx.arc(sx, sy, r, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = 'rgba(160,90,20,0.75)';
      const bl = (t % 4) < 0.12;
      if (bl) { ctx.fillRect(sx - r * 0.4, sy - r * 0.12, r * 0.2, r * 0.05); ctx.fillRect(sx + r * 0.2, sy - r * 0.12, r * 0.2, r * 0.05); }
      else { ctx.beginPath(); ctx.arc(sx - r * 0.3, sy - r * 0.1, r * 0.09, 0, Math.PI * 2); ctx.arc(sx + r * 0.3, sy - r * 0.1, r * 0.09, 0, Math.PI * 2); ctx.fill(); }
      ctx.fillStyle = 'rgba(255,120,120,0.45)';
      ctx.beginPath(); ctx.ellipse(sx - r * 0.5, sy + r * 0.15, r * 0.14, r * 0.08, 0, 0, Math.PI * 2); ctx.ellipse(sx + r * 0.5, sy + r * 0.15, r * 0.14, r * 0.08, 0, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = 'rgba(160,90,20,0.75)'; ctx.lineWidth = r * 0.07; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.arc(sx, sy + r * 0.05, r * 0.28, 0.2 * Math.PI, 0.8 * Math.PI); ctx.stroke();
      ctx.globalAlpha = 1;
    }
    const mk = clamp((h - 38) / 16, 0, 1);
    if (mk > 0) {
      const mx = W * 0.2, my = H * 0.85 - mk * H * 0.62, r = Math.min(W, H) * 0.07;
      ctx.globalAlpha = mk;
      const gl = ctx.createRadialGradient(mx, my, r * 0.5, mx, my, r * 2.8);
      gl.addColorStop(0, 'rgba(255,250,210,0.4)'); gl.addColorStop(1, 'rgba(255,250,210,0)');
      ctx.fillStyle = gl; ctx.beginPath(); ctx.arc(mx, my, r * 2.8, 0, Math.PI * 2); ctx.fill();
      const mg = ctx.createRadialGradient(mx - r * 0.3, my - r * 0.3, r * 0.1, mx, my, r);
      mg.addColorStop(0, '#fffdf0'); mg.addColorStop(1, '#ffe48a');
      ctx.fillStyle = mg; ctx.beginPath(); ctx.arc(mx, my, r, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = 'rgba(220,180,90,0.35)';
      [[-0.35, -0.2, 0.18], [0.3, 0.25, 0.14], [0.1, -0.45, 0.1]].forEach(([a, b, c]) => { ctx.beginPath(); ctx.arc(mx + a * r, my + b * r, c * r, 0, Math.PI * 2); ctx.fill(); });
      // 睡覺的月亮臉
      ctx.strokeStyle = 'rgba(150,110,40,0.8)'; ctx.lineWidth = r * 0.06; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.arc(mx - r * 0.3, my, r * 0.12, 0.1 * Math.PI, 0.9 * Math.PI); ctx.stroke();
      ctx.beginPath(); ctx.arc(mx + r * 0.3, my, r * 0.12, 0.1 * Math.PI, 0.9 * Math.PI); ctx.stroke();
      ctx.beginPath(); ctx.arc(mx, my + r * 0.25, r * 0.1, 0.15 * Math.PI, 0.85 * Math.PI); ctx.stroke();
      ctx.globalAlpha = 1;
    }
  }

  function sparkle(g, x, y, r, rot) {

  /* ======================= 繪圖：積木角色 ======================= */

  // 在任意畫布上畫一個積木角色（cx,cy 為中心）

    // 陰影
    g.save();
    g.shadowColor = 'rgba(60,40,80,0.28)'; g.shadowBlur = 8; g.shadowOffsetY = 3;
    let grad = g.createLinearGradient(0, -h / 2, 0, h / 2);
    if (skin === 'crate') { grad.addColorStop(0, '#f5cf8e'); grad.addColorStop(1, '#cf8e4c'); }
    else if (skin === 'cake') { grad.addColorStop(0, '#ffe6b8'); grad.addColorStop(1, '#e8ad66'); }
    else { grad.addColorStop(0, p.a); grad.addColorStop(1, p.b); }
    g.fillStyle = grad; rr(g, -w / 2, -h / 2, w, h, skin === 'crate' ? r * 0.5 : r); g.fill();
    g.restore();
    g.save(); rr(g, -w / 2, -h / 2, w, h, skin === 'crate' ? r * 0.5 : r); g.clip();
    if (skin === 'crate') {
      g.strokeStyle = 'rgba(140,80,30,0.35)'; g.lineWidth = 2;
      for (let y = -h / 2 + h / 3; y < h / 2; y += h / 3) { g.beginPath(); g.moveTo(-w / 2, y); g.lineTo(w / 2, y); g.stroke(); }
      g.fillStyle = p.b; g.globalAlpha = 0.85;
      g.fillRect(-w / 2, -h / 2, Math.min(w * 0.12, h * 0.35), h); g.fillRect(w / 2 - Math.min(w * 0.12, h * 0.35), -h / 2, Math.min(w * 0.12, h * 0.35), h);
      g.globalAlpha = 1;
    } else if (skin === 'cake') {
      g.fillStyle = p.a;
      g.beginPath(); g.moveTo(-w / 2, -h / 2);
      g.lineTo(w / 2, -h / 2); g.lineTo(w / 2, -h * 0.1);
      const drips = Math.max(3, Math.round(w / (h * 0.5)));
      for (let i = drips; i >= 0; i--) {
        const x = -w / 2 + w * i / drips;
        g.quadraticCurveTo(x + w / drips / 2, -h * (i % 2 ? 0.0 : -0.12), x, -h * 0.1);
      }
      g.closePath(); g.fill();
      g.fillStyle = '#fff'; g.globalAlpha = 0.5; g.fillRect(-w / 2, -h / 2, w, h * 0.12); g.globalAlpha = 1;
      const sp = ['#ff6f9a', '#5cc8ff', '#ffd34a', '#7bd88f'];
      for (let i = 0; i < w / 12; i++) { g.fillStyle = sp[i % 4]; g.save(); g.translate(-w / 2 + 8 + i * 12, -h * 0.32 + (i % 2) * h * 0.1); g.rotate(i); g.fillRect(-3, -1.2, 6, 2.4); g.restore(); }
    } else if (skin === 'candy') {
      g.fillStyle = 'rgba(255,255,255,0.45)';
      for (let x = -w / 2 - h; x < w / 2 + h; x += h * 0.7) { g.beginPath(); g.moveTo(x, h / 2); g.lineTo(x + h * 0.3, h / 2); g.lineTo(x + h * 0.3 + h, -h / 2); g.lineTo(x + h, -h / 2); g.fill(); }
    } else {
      // 果凍裡的小泡泡
      g.fillStyle = 'rgba(255,255,255,0.25)';
      for (let i = 0; i < w / 18; i++) { g.beginPath(); g.arc(-w / 2 + 10 + ((i * 37 + b.seed * 50) % Math.max(1, w - 20)), h * 0.25 - (i % 3) * h * 0.08, h * 0.05 + (i % 2) * h * 0.03, 0, Math.PI * 2); g.fill(); }
    }
    g.restore();
    g.lineWidth = 2.2; g.strokeStyle = skin === 'crate' ? '#9a5d2a' : skin === 'cake' ? '#b8743a' : p.line;
    rr(g, -w / 2, -h / 2, w, h, skin === 'crate' ? r * 0.5 : r); g.stroke();
    // 亮面
    g.fillStyle = 'rgba(255,255,255,0.55)';
    if (w > r * 1.6) { rr(g, -w / 2 + r * 0.7, -h / 2 + h * 0.09, w - r * 1.4, h * 0.15, h * 0.08); g.fill(); }
    g.fillStyle = 'rgba(255,255,255,0.8)'; g.beginPath(); g.arc(-w / 2 + r * 0.55, -h / 2 + h * 0.2, h * 0.05, 0, Math.PI * 2); g.fill();
    g.fillStyle = 'rgba(0,0,0,0.07)'; rr(g, -w / 2 + 3, h * 0.24, w - 6, h * 0.2, h * 0.1); g.fill();
    if (w > h * 0.9) {
      g.save(); if (skin === 'cake') g.translate(0, h * 0.1);
      drawFace(g, w, h, mood, b.seed || 0, skin === 'crate');
      g.restore();
    }
    g.restore();
  }

  function drawBlock(b, mood, rot) {
    let hop = 0;
    if (b.cheer != null && b.cheer > 0) hop = Math.sin(clamp(b.cheer / 0.5, 0, 1) * Math.PI) * 0.35 * U;
    drawBlockAt(ctx, b, sX(b.x), sY(b.y + 0.5) - hop, b.w * U, U * 0.97, mood, rot, b.squash);
  }

  function drawRope(c) {
    // 吊車的繩子與掛鉤
    const bx = sX(c.x), by = sY(c.y + 1) + (c.falling ? 0 : Math.sin(t * 5) * 0.06 * U);
    const px = c.mode === 'swing' ? W / 2 : bx;
    const py = -10;
    ctx.strokeStyle = '#7a5a3a'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(px, py); ctx.lineTo(bx, by - U * 0.45); ctx.stroke();
    ctx.fillStyle = '#ffcf4a'; ctx.strokeStyle = '#b58614'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(bx, by - U * 0.45, U * 0.14, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    if (c.mode === 'swing') { ctx.fillStyle = '#ff8fb1'; ctx.beginPath(); ctx.arc(px, 0, 12, 0, Math.PI * 2); ctx.fill(); }
  }

  function render() {
    ctx.save();
    if (shake > 0) ctx.translate(Math.sin(t * 70) * shake * 8, Math.sin(t * 90) * shake * 12);
    drawSky();
    drawBackdrop();
    debris.forEach(d => drawBlock(d, 'dizzy', d.rot));
    drawGround();
    for (let i = 0; i < stack.length; i++) {
      const b = stack[i];
      const y = sY(b.y);
      if (y < -U * 2 || y - U > H + U) continue;
      if (b.base) drawBase(b); else drawBlock(b, b.happy > 0 ? 'happy' : 'smile', 0);
    }
    if (cur) {
      if (!cur.falling) {
        drawRope(cur);
        if (state === 'play') {
          ctx.fillStyle = 'rgba(255,255,255,0.22)';
          rr(ctx, sX(cur.x) - cur.w * U / 2, sY(cur.n + 1), cur.w * U, U, U * 0.3); ctx.fill();
          ctx.strokeStyle = 'rgba(255,255,255,0.75)'; ctx.setLineDash([6, 6]); ctx.lineWidth = 2; ctx.stroke(); ctx.setLineDash([]);
        }
      }
      const bob = cur.falling ? 0 : Math.sin(t * 5) * 0.06;
      ctx.save(); ctx.translate(0, bob * U);
      ctx.globalAlpha = 0.3 + cur.enter * 0.7;
      drawBlock(cur, 'excited', cur.rot);
      ctx.restore(); ctx.globalAlpha = 1;
    }
    sparks.forEach(s => {
      ctx.globalAlpha = Math.max(0, s.life);
      ctx.fillStyle = s.col;
      if (s.puff) { ctx.beginPath(); ctx.arc(sX(s.x), sY(s.y), s.s * (2 - s.life), 0, Math.PI * 2); ctx.fill(); }
      else sparkle(ctx, sX(s.x), sY(s.y), s.s * 1.4, s.rot);
    });
    ctx.globalAlpha = 1;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    const font = getComputedStyle(document.body).fontFamily;
    pops.forEach(p => {
      const life0 = p.big ? 2.2 : 1.3;
      const k = clamp(p.life / life0, 0, 1);
      const intro = clamp((1 - k) * life0 / 0.25, 0, 1);
      const sc = (p.small ? 0.6 : p.big ? 1.5 : 1) * easeOutBack(intro);
      ctx.save();
      ctx.translate(clamp(sX(p.x), 90, W - 90), sY(p.y)); ctx.scale(sc, sc);
      ctx.rotate(Math.sin(t * 6 + p.y) * 0.05);
      ctx.globalAlpha = Math.min(1, k * 3);
      ctx.font = `900 ${Math.round(U * 0.75)}px ${font}`;
      ctx.lineJoin = 'round';
      ctx.lineWidth = 9; ctx.strokeStyle = p.small ? 'rgba(80,40,90,0.6)' : '#ffffff'; ctx.strokeText(p.text, 0, 0);
      ctx.fillStyle = p.col || '#ff5f95'; ctx.fillText(p.text, 0, 0);
      ctx.restore();
    });
    if (state === 'play' && score === 0 && cur && !cur.falling && levelIdx === 0) {
      ctx.globalAlpha = 0.75 + Math.sin(t * 5) * 0.25;
      ctx.font = `900 ${Math.round(Math.max(18, U * 0.5))}px ${font}`;
      ctx.lineWidth = 6; ctx.strokeStyle = 'rgba(255,255,255,0.95)';
      const ty = Math.min(H - 30, sY(0) + U * 1.2);
      ctx.strokeText('點一下放下積木！', W / 2, ty);
      ctx.fillStyle = '#4a3b52'; ctx.fillText('點一下放下積木！', W / 2, ty);
      ctx.globalAlpha = 1;
    }
    // 暗角
    const vg = ctx.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.45, W / 2, H / 2, Math.max(W, H) * 0.8);
    vg.addColorStop(0, 'rgba(40,20,60,0)'); vg.addColorStop(1, 'rgba(40,20,60,0.22)');
    ctx.fillStyle = vg; ctx.fillRect(-20, -20, W + 40, H + 40);
    ctx.restore();
  }

  /* ======================= 主迴圈 ======================= */
  let last = performance.now();
  function loop(now) {
    const dt = Math.max(0, Math.min(0.05, (now - last) / 1000));
    last = now;
    update(dt);
    render();
    requestAnimationFrame(loop);
  }

  cv.addEventListener('pointerdown', e => { e.preventDefault(); drop(); });
  window.addEventListener('keydown', e => {
    if ((e.code === 'Space' || e.code === 'Enter' || e.code === 'ArrowDown') && state === 'play') { e.preventDefault(); drop(); }
  });
  document.addEventListener('contextmenu', e => e.preventDefault());
  document.addEventListener('visibilitychange', () => { if (document.hidden) BGM.stop(); else if (state === 'play' || state === 'select') BGM.start(); });

  // 測試用的唯讀狀態
  window.__tower = () => ({ state, score, cur: cur && { x: cur.x, falling: cur.falling }, top: stack[stack.length - 1].x });

  reset(LEVELS[0]);
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
