<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>影子配對</title>
<link rel="stylesheet" href="../../assets/common.css">
<style>
  html, body { height: 100%; overflow: hidden; }
  body {
    height: 100vh; height: 100dvh; touch-action: none;
    --sky1: #8fd8ff; --sky2: #e4f7ff; --g1: #9be37e; --g2: #58b84f; --sun: #ffd84a;
    background: linear-gradient(180deg, var(--sky1) 0%, var(--sky2) 62%, var(--g1) 62%, var(--g2) 100%);
  }
  body.scene-beach { --sky1: #6fd0ff; --sky2: #fff1d6; --g1: #ffe3a3; --g2: #f2c46a; }
  body.scene-night { --sky1: #1d2260; --sky2: #5b4b9a; --g1: #4f9a6a; --g2: #2c6a48; --sun: #fff3b0; }

  /* ===== 背景 ===== */
  .bg { position: fixed; inset: 0; pointer-events: none; overflow: hidden; }
  .sun { position: absolute; left: 6%; top: 9%; width: 16vmin; height: 16vmin; border-radius: 50%;
    background: radial-gradient(circle at 38% 35%, #fffbe0, var(--sun) 60%, #ffb02e);
    box-shadow: 0 0 40px 18px rgba(255, 230, 120, .55); }
  .scene-night .sun { background: radial-gradient(circle at 38% 35%, #fffef0, #fff1b0 60%, #e8d27a); box-shadow: 0 0 40px 14px rgba(255, 250, 200, .35); }
  .rays { position: absolute; left: calc(6% + 8vmin); top: calc(9% + 8vmin); width: 80vmin; height: 80vmin; transform: translate(-50%, -50%);
    background: repeating-conic-gradient(rgba(255, 255, 255, .22) 0 8deg, transparent 8deg 22deg); border-radius: 50%;
    -webkit-mask: radial-gradient(circle, #000 0 30%, transparent 70%); mask: radial-gradient(circle, #000 0 30%, transparent 70%);
    animation: spin 40s linear infinite; }
  .scene-night .rays { opacity: .25; }
  @keyframes spin { to { transform: translate(-50%, -50%) rotate(360deg); } }
  .cloud { position: absolute; width: 140px; height: 46px; background: #fff; border-radius: 40px; opacity: .92; animation: drift linear infinite; }
  .cloud::before, .cloud::after { content: ''; position: absolute; background: #fff; border-radius: 50%; }
  .cloud::before { width: 64px; height: 64px; left: 20px; top: -30px; } .cloud::after { width: 48px; height: 48px; left: 70px; top: -20px; }
  .scene-night .cloud { opacity: .25; }
  @keyframes drift { from { transform: translateX(-220px) scale(var(--sc, 1)); } to { transform: translateX(calc(100vw + 220px)) scale(var(--sc, 1)); } }
  .stars-bg { position: absolute; inset: 0 0 40% 0; display: none;
    background-image: radial-gradient(2px 2px at 20% 30%, #fff, transparent), radial-gradient(2px 2px at 60% 15%, #fff, transparent), radial-gradient(1.5px 1.5px at 80% 40%, #fff, transparent),
      radial-gradient(2px 2px at 35% 55%, #fff, transparent), radial-gradient(1.5px 1.5px at 90% 10%, #fff, transparent), radial-gradient(2px 2px at 45% 25%, #fff, transparent); }
  .scene-night .stars-bg { display: block; animation: kg-fade 2s ease-in-out infinite alternate; }
  .hill { position: absolute; bottom: 30%; width: 70%; height: 30%; border-radius: 50%; background: linear-gradient(#b8ecaa, #8fd88a); }
  .scene-beach .hill { background: linear-gradient(#7fd6ff, #3aa8e8); border-radius: 0; width: 100%; left: 0 !important; height: 8%; bottom: 38%; }
  .scene-night .hill { background: linear-gradient(#3f7a5e, #2c5a48); }
  .tufts { position: absolute; left: 0; right: 0; bottom: 0; height: 40%;
    background: radial-gradient(ellipse 8px 14px at 10% 20%, rgba(255,255,255,.18), transparent), radial-gradient(ellipse 8px 14px at 30% 50%, rgba(255,255,255,.18), transparent),
      radial-gradient(ellipse 8px 14px at 70% 30%, rgba(255,255,255,.18), transparent), radial-gradient(ellipse 8px 14px at 88% 70%, rgba(255,255,255,.18), transparent); }
  .flower { position: absolute; width: 18px; height: 18px; border-radius: 50%; background: radial-gradient(circle, #ffd34a 0 30%, var(--c) 32%); box-shadow: 0 0 0 3px var(--c); }

  /* ===== 曬衣繩上的影子布幕 + 野餐墊 ===== */
  .sheet { position: absolute; border-radius: 8px 8px 22px 22px;
    background: radial-gradient(ellipse at 30% 20%, #fffdf3, #fff3d6 60%, #f3dfb4),
                repeating-linear-gradient(90deg, rgba(0, 0, 0, .025) 0 24px, rgba(255, 255, 255, .06) 24px 48px);
    background-blend-mode: multiply;
    box-shadow: 0 14px 30px rgba(60, 40, 20, .25), inset 0 -10px 20px rgba(200, 150, 80, .15); }
  .sheet::after { content: ''; position: absolute; inset: 0; border-radius: inherit; pointer-events: none;
    background: linear-gradient(115deg, rgba(255, 255, 255, .45) 0 18%, transparent 30% 60%, rgba(255, 255, 255, .25) 70%, transparent 85%); }
  .rope { position: absolute; height: 4px; background: #a8703f; border-radius: 4px; box-shadow: 0 2px 0 rgba(0, 0, 0, .15); }
  .pin { position: absolute; width: 12px; height: 30px; border-radius: 4px; background: linear-gradient(90deg, #ff8fb1, #f2668f); box-shadow: inset 0 0 0 2px #c2426f, 0 3px 4px rgba(0, 0, 0, .2); }
  .blanket { position: absolute; border-radius: 26px;
    background:
      repeating-linear-gradient(0deg, rgba(255, 120, 160, .38) 0 22px, transparent 22px 44px),
      repeating-linear-gradient(90deg, rgba(255, 120, 160, .38) 0 22px, transparent 22px 44px), #fffaf4;
    border: 5px solid #fff; box-shadow: 0 10px 0 rgba(200, 80, 120, .35), 0 18px 30px rgba(60, 40, 20, .25); }
  .blanket::after { content: ''; position: absolute; inset: 0; border-radius: 20px; background: linear-gradient(180deg, rgba(255, 255, 255, .35), transparent 30%); pointer-events: none; }

  /* ===== 物件與影子 ===== */
  #field { position: fixed; inset: 0; touch-action: none; }
  #field[hidden] { display: none; }
  .item, .shadow { position: absolute; left: 0; top: 0; will-change: transform; }
  .item { cursor: grab; touch-action: none; z-index: 5; }
  .item svg { width: 100%; height: 100%; display: block; filter: drop-shadow(0 8px 4px rgba(60, 40, 40, .28)); animation: bob 2.2s ease-in-out infinite; animation-delay: var(--dl, 0s); pointer-events: none; }
  @keyframes bob { 0%, 100% { transform: translateY(0) rotate(-2deg); } 50% { transform: translateY(-6%) rotate(2deg); } }
  .item.drag { z-index: 50; cursor: grabbing; }
  .item.drag svg { animation: none; transform: scale(1.18) rotate(-6deg); filter: drop-shadow(0 18px 10px rgba(60, 40, 40, .3)); transition: transform .15s; }
  .item.ret { transition: transform .45s cubic-bezier(.3, 1.6, .5, 1); }
  .item.snap { transition: transform .25s ease-out; }
  .item.wiggle svg { animation: kg-wiggle .5s ease; }
  .shadow { z-index: 2; }
  .shadow svg { width: 100%; height: 100%; display: block; filter: brightness(0) opacity(.62) blur(.4px); transition: filter .5s, transform .3s; }
  .scene-night .shadow svg { filter: brightness(0) opacity(.7); }
  .shadow::before { content: ''; position: absolute; inset: -10%; border-radius: 50%; background: radial-gradient(circle, rgba(255, 240, 160, .9), transparent 65%); opacity: 0; transition: opacity .2s; }
  .shadow.hover::before { opacity: 1; }
  .shadow.hover svg { transform: scale(1.1); }
  .shadow.hint svg { animation: hintp 1s ease-in-out infinite; }
  @keyframes hintp { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.12); } }
  .shadow.hint::before { opacity: .8; animation: kg-fade 1s ease-in-out infinite alternate; }
  .shadow.no svg { animation: kg-shake .4s ease; }
  .shadow.done svg { filter: drop-shadow(0 6px 4px rgba(60, 40, 40, .25)); animation: donePop .6s cubic-bezier(.2, 1.8, .4, 1); }
  @keyframes donePop { 0% { transform: scale(.7); } 60% { transform: scale(1.2) rotate(6deg); } 100% { transform: scale(1); } }
  .shadow .name { position: absolute; left: 50%; bottom: -8px; transform: translateX(-50%) scale(0); white-space: nowrap;
    font-size: clamp(14px, 3.6vw, 19px); font-weight: 900; color: #fff; background: linear-gradient(180deg, #ff9fc0, #f2668f);
    border: 3px solid #fff; border-radius: 999px; padding: 2px 12px; box-shadow: 0 3px 6px rgba(0, 0, 0, .2); transition: transform .4s cubic-bezier(.2, 1.8, .4, 1) .2s; }
  .shadow.done .name { transform: translateX(-50%) scale(1); }

  /* ===== 共用介面元件 ===== */
  .scr { position: fixed; inset: 0; z-index: 7000; display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: clamp(10px, 2.4vh, 22px); padding: 72px 16px 24px; text-align: center; touch-action: none; }
  .scr[hidden] { display: none; }
  .scr.dim { background: radial-gradient(ellipse at center, rgba(40, 20, 70, .15), rgba(40, 20, 70, .5)); animation: kg-fade .25s ease; }
  .logo { display: flex; justify-content: center; font-size: clamp(50px, 15vw, 110px); font-weight: 900; line-height: 1.05; letter-spacing: .02em; }
  .logo span { display: inline-block; color: var(--c); -webkit-text-stroke: .14em #fff; paint-order: stroke fill;
    text-shadow: 0 .07em 0 var(--d), 0 .12em .2em rgba(60, 30, 70, .35); animation: lgIn .7s cubic-bezier(.2, 1.7, .4, 1) both, lgBob 2.4s ease-in-out infinite; }
  @keyframes lgIn { from { transform: translateY(-80px) scale(.3); opacity: 0; } to { transform: none; opacity: 1; } }
  @keyframes lgBob { 0%, 100% { transform: translateY(0) rotate(-3deg); } 50% { transform: translateY(-8px) rotate(3deg); } }
  .tag { font-size: clamp(16px, 4.4vw, 22px); font-weight: 900; color: #6a3a6a; background: linear-gradient(180deg, #fff, #ffe9f2);
    border: 3px solid #fff; border-radius: 999px; padding: 6px 18px; box-shadow: 0 4px 0 #ffb3cc, 0 8px 16px rgba(0, 0, 0, .15); }
  .cbtn { --b1: #9cf07a; --b2: #3fbf4c; --b3: #2a8f37; position: relative; font: 900 clamp(22px, 6.4vw, 32px)/1 var(--kg-font); color: #fff;
    padding: .55em 1.5em .6em; border: 4px solid #fff; border-radius: 999px; cursor: pointer; background: linear-gradient(180deg, var(--b1), var(--b2));
    box-shadow: 0 7px 0 var(--b3), 0 14px 24px rgba(30, 30, 60, .28); text-shadow: 0 3px 0 rgba(0, 0, 0, .18); transition: transform .1s, box-shadow .1s; min-height: 56px; touch-action: manipulation; }
  .cbtn::before { content: ''; position: absolute; left: 14%; right: 14%; top: 7%; height: 36%; border-radius: 999px; background: linear-gradient(rgba(255, 255, 255, .75), rgba(255, 255, 255, 0)); pointer-events: none; }
  .cbtn:active { transform: translateY(5px) scale(.97); box-shadow: 0 2px 0 var(--b3), 0 6px 12px rgba(30, 30, 60, .25); }
  .cbtn.pulse { animation: pulse 1.3s ease-in-out infinite; }
  .cbtn.blue { --b1: #8ad6ff; --b2: #3d9df0; --b3: #2470b8; }
  .cbtn.pink { --b1: #ffb0cc; --b2: #f26a9b; --b3: #c2426f; }
  .cbtn.yellow { --b1: #ffe58a; --b2: #f5b82e; --b3: #c48a12; }
  .cbtn.small { font-size: 19px; padding: .5em 1.1em; min-height: 52px; }
  @keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.07); } }
  .panel { width: min(560px, 100%); max-height: calc(100% - 10px); overflow: auto; background: linear-gradient(180deg, rgba(255, 255, 255, .97), rgba(255, 240, 246, .97));
    border: 5px solid #fff; border-radius: 30px; padding: 18px 14px 20px; box-shadow: 0 10px 0 rgba(200, 80, 120, .25), 0 20px 40px rgba(40, 20, 60, .3);
    animation: kg-pop .4s cubic-bezier(.2, 1.6, .4, 1); }
  .panel h2 { margin: 2px 0 12px; font-size: 28px; color: #8a3a5a; }
  .lvls { display: grid; grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); gap: 12px; }
  .lv { position: relative; border: 4px solid #fff; border-radius: 24px; padding: 8px 4px 8px; cursor: pointer; background: linear-gradient(180deg, var(--l1), var(--l2));
    box-shadow: 0 6px 0 var(--l3), 0 10px 16px rgba(0, 0, 0, .15); font-family: var(--kg-font); color: #fff; min-height: 112px; transition: transform .1s;
    animation: kg-pop .45s cubic-bezier(.2, 1.6, .4, 1) both; }
  .lv:active { transform: translateY(4px); box-shadow: 0 2px 0 var(--l3); }
  .lv .ic { width: 50px; height: 50px; margin: 0 auto; display: block; }
  .lv .ic svg { width: 100%; height: 100%; filter: drop-shadow(0 3px 2px rgba(0, 0, 0, .2)); }
  .lv .num { position: absolute; left: 6px; top: 4px; font-size: 18px; font-weight: 900; text-shadow: 0 2px 0 rgba(0, 0, 0, .25); }
  .lv small { display: block; font-size: 13px; font-weight: 800; margin: 2px 0 3px; text-shadow: 0 1px 0 rgba(0, 0, 0, .25); }
  .lv.locked { filter: grayscale(.9) brightness(1.05); cursor: default; }
  .lv.locked .ic svg { filter: brightness(0) opacity(.4); }
  .stars-row { display: flex; justify-content: center; gap: 2px; }
  .st path:first-child { fill: #e6dccf; stroke: #c9b8a6; }
  .st.on path:first-child { fill: url(#gStar); stroke: #d98a00; }
  .row { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; align-items: center; }
  .total { display: inline-flex; align-items: center; gap: 4px; font-weight: 900; font-size: 20px; color: #8a3a5a; }
  .scenes { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
  .scn { position: relative; width: 84px; height: 62px; border-radius: 16px; border: 4px solid #fff; cursor: pointer; padding: 0; box-shadow: 0 5px 0 rgba(0, 0, 0, .15); overflow: visible;
    font: 900 12px var(--kg-font); color: #fff; text-shadow: 0 1px 2px rgba(0, 0, 0, .5); display: flex; align-items: flex-end; justify-content: center; padding-bottom: 3px; }
  .scn.sel { outline: 4px solid #ff8fb1; outline-offset: 1px; transform: scale(1.06); }
  .scn.locked { filter: grayscale(.85); }
  .scn .need { position: absolute; top: -8px; right: -8px; display: flex; align-items: center; gap: 1px; font: 900 13px var(--kg-font); color: #8a3a5a; text-shadow: none; background: #fff; border-radius: 999px; padding: 1px 6px 1px 3px; box-shadow: 0 2px 4px rgba(0, 0, 0, .2); }
  .book { display: grid; grid-template-columns: repeat(auto-fill, minmax(70px, 1fr)); gap: 10px; }
  .stk { position: relative; background: #fff; border-radius: 18px; padding: 6px; box-shadow: 0 4px 0 #ffd0e0, 0 6px 10px rgba(0, 0, 0, .08); cursor: pointer; border: none; }
  .stk svg { width: 100%; height: auto; display: block; }
  .stk.no svg { filter: brightness(0) opacity(.18); }
  .stk span { display: block; font: 900 13px var(--kg-font); color: #8a3a5a; }
  .result { position: relative; width: min(400px, 100%); padding-top: 48px; overflow: visible; margin-top: 20px; }
  .ribbon { position: absolute; left: 50%; top: -26px; transform: translateX(-50%); white-space: nowrap; font-size: 28px; font-weight: 900; color: #fff; padding: 8px 34px 10px;
    background: linear-gradient(180deg, #ff9fc0, #f2668f); border-radius: 14px; border: 4px solid #fff; box-shadow: 0 6px 0 #c2426f, 0 10px 18px rgba(0, 0, 0, .2); text-shadow: 0 2px 0 rgba(0, 0, 0, .2); }
  .bigstars { display: flex; justify-content: center; gap: 6px; margin: 4px 0 8px; }
  .bigstars svg { width: 70px; height: 70px; animation: starIn .5s cubic-bezier(.2, 1.8, .4, 1) both; }
  .bigstars svg:nth-child(2) { width: 86px; height: 86px; margin-top: -12px; }
  @keyframes starIn { from { transform: scale(0) rotate(-120deg); opacity: 0; } to { transform: none; opacity: 1; } }
  .result p { font-size: 19px; font-weight: 800; margin: 4px 0 14px; color: #6a4a5a; }
  .unlock { display: inline-flex; align-items: center; gap: 8px; margin: -4px 0 12px; padding: 6px 14px; background: #fff3c4; border-radius: 999px; font-weight: 900; color: #a0620a; animation: kg-pop .5s .9s both; }
  .resItems { display: flex; justify-content: center; flex-wrap: wrap; gap: 2px; margin-top: 10px; }
  .resItems svg { width: 52px; height: 52px; animation: hop .8s ease-in-out infinite; }
  .resItems svg:nth-child(2n) { animation-delay: .25s; } .resItems svg:nth-child(3n) { animation-delay: .5s; }
  @keyframes hop { 0%, 100% { transform: translateY(0) scale(1, 1); } 30% { transform: translateY(-10px) scale(.96, 1.05); } 60% { transform: translateY(0) scale(1.06, .94); } }

  /* 標題動畫：物件飛進影子 */
  .demo { position: relative; width: min(300px, 74vw); height: min(150px, 37vw); }
  .demo .d-sh, .demo .d-it { position: absolute; top: 0; width: 50%; height: 100%; }
  .demo .d-sh { right: 0; filter: brightness(0) opacity(.55); }
  .demo .d-it { left: 0; animation: fly 3.2s ease-in-out infinite; filter: drop-shadow(0 8px 5px rgba(0, 0, 0, .25)); }
  .demo svg { width: 100%; height: 100%; }
  @keyframes fly { 0%, 15% { transform: translate(0, 0) rotate(-8deg); } 45% { transform: translate(50%, -30%) rotate(10deg) scale(1.1); } 65%, 85% { transform: translate(100%, 0) rotate(0); } 100% { transform: translate(0, 0) rotate(-8deg); } }

  /* HUD：粉紅布條 */
  .hud { position: fixed; top: 10px; left: 50%; transform: translateX(-50%); z-index: 8000; pointer-events: none;
    width: min(250px, calc(100vw - 136px)); padding: 5px 10px 7px; border-radius: 18px; text-align: center; color: #fff; font-weight: 900;
    background: linear-gradient(180deg, #ff9fc0, #f2668f); border: 3px solid #fff; box-shadow: 0 5px 0 #c2426f, 0 8px 14px rgba(0, 0, 0, .2); }
  .hud[hidden] { display: none; }
  .hud .t { font-size: 17px; text-shadow: 0 2px 0 #c2426f; }
  .pips { display: flex; justify-content: center; gap: 5px; margin-top: 3px; }
  .pips i { width: 16px; height: 16px; border-radius: 50%; background: rgba(120, 20, 60, .35); box-shadow: inset 0 2px 2px rgba(0, 0, 0, .2); transition: background .3s, transform .3s; }
  .pips i.on { background: radial-gradient(circle at 35% 30%, #fff8c0, #ffd23a 60%, #f0a010); transform: scale(1.15); box-shadow: 0 0 6px #fff3a0; }
  #fx { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 7600; }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs id="defs">
    <linearGradient id="gStar" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff2a0"/><stop offset=".55" stop-color="#ffd23a"/><stop offset="1" stop-color="#ffab1a"/></linearGradient>
    <clipPath id="cp-balloon"><path d="M50 6 C 80 6, 92 30, 84 48 C 78 60, 64 66, 60 70 H 40 C 36 66, 22 60, 16 48 C 8 30, 20 6, 50 6Z"/></clipPath>
    <clipPath id="cp-pine"><ellipse cx="50" cy="66" rx="27" ry="30"/></clipPath>
  </defs>
</svg>

<div class="bg" aria-hidden="true">
  <div class="stars-bg"></div>
  <div class="rays"></div>
  <div class="sun"></div>
  <div class="cloud" style="top:8%;animation-duration:55s;animation-delay:-12s"></div>
  <div class="cloud" style="top:22%;animation-duration:70s;animation-delay:-45s;--sc:.7"></div>
  <div class="hill" style="left:-20%"></div>
  <div class="hill" style="left:50%;bottom:28%"></div>
  <div class="tufts"></div>
  <div class="flower" style="left:6%;bottom:5%;--c:#ff8fb1"></div>
  <div class="flower" style="left:92%;bottom:9%;--c:#b49cff"></div>
  <div class="flower" style="left:48%;bottom:2%;--c:#fff"></div>
</div>

<div id="field" hidden></div>

<div class="hud" id="hud" hidden>
  <div class="t" id="hudLv">動物朋友</div>
  <div class="pips" id="pips"></div>
</div>

<section class="scr" id="title">
  <div style="flex:1"></div>
  <div class="logo" id="logo"></div>
  <div class="tag">把東西拖到牠的影子上！</div>
  <div class="demo" id="demo"></div>
  <div style="flex:1"></div>
  <button class="cbtn pulse" id="btnStart">開始玩</button>
  <div style="flex:.3"></div>
</section>

<section class="scr dim" id="select" hidden>
  <div class="panel">
    <h2>選擇關卡</h2>
    <div class="row" style="margin:-4px 0 12px"><span class="total" id="totalStars"></span><button class="cbtn small yellow" id="btnBook" style="font-size:16px;min-height:44px;padding:.4em 1em">貼紙簿</button></div>
    <div class="lvls" id="lvls"></div>
    <h2 style="margin-top:16px;font-size:22px">場景</h2>
    <div class="scenes" id="scenes"></div>
  </div>
</section>

<section class="scr dim" id="bookScr" hidden>
  <div class="panel">
    <h2>我的貼紙簿</h2>
    <p style="margin:-6px 0 12px;font-weight:800;color:#8a3a5a" id="bookCount"></p>
    <div class="book" id="book"></div>
    <div class="row" style="margin-top:16px"><button class="cbtn small pink" id="bookBack">返回</button></div>
  </div>
</section>

<section class="scr dim" id="resultScr" hidden>
  <div class="panel result">
    <div class="ribbon" id="resTitle">過關啦！</div>
    <div class="resItems" id="resItems"></div>
    <div class="bigstars" id="resStars"></div>
    <p id="resMsg"></p>
    <div id="resUnlock"></div>
    <div class="row" id="resBtns"></div>
  </div>
</section>
<canvas id="fx"></canvas>

<script src="../../assets/common.js"></script>
<script>
'use strict';
(function () {
  const $ = id => document.getElementById(id);
  const INK = '#4a2a3a';
  const O = `stroke="${INK}" stroke-width="3" stroke-linejoin="round"`;

  /* ======================= 漸層（一次產生） ======================= */

  const ITEMS = {

    sea: [['fish', '小魚'], ['whale', '鯨魚'], ['octopus', '章魚'], ['crab', '螃蟹'], ['starfish', '海星'], ['turtle', '烏龜']],

  const NAME = {};
  Object.values(ITEMS).forEach(list => list.forEach(([id, n]) => { NAME[id] = n; }));
  const svgOf = id => `<svg viewBox="0 0 100 100">${ART[id]()}</svg>`;

  /* ======================= 關卡與存檔 ======================= */
  const LEVELS = [
    { theme: 'animal', n: 4, decoy: 0, name: '動物朋友', icon: 'cat', col: ['#ffd0e4', '#ff86b3', '#d2557f'] },
    { theme: 'fruit', n: 4, decoy: 0, name: '香香水果', icon: 'apple', col: ['#ffd6c0', '#ff8a6a', '#d0583a'] },
    { theme: 'sea', n: 4, decoy: 0, name: '海洋世界', icon: 'fish', col: ['#cfeaff', '#58b2f0', '#2f82c2'] },
    { theme: 'vehicle', n: 4, decoy: 0, name: '交通工具', icon: 'car', col: ['#fff1b0', '#ffc93d', '#d69a12'] },
    { theme: 'animal', n: 5, decoy: 1, name: '動物派對', icon: 'bunny', col: ['#e6dbff', '#a283f2', '#7559c9'] },
    { theme: 'fruit', n: 5, decoy: 1, name: '水果籃', icon: 'strawberry', col: ['#ffd0d8', '#f0607a', '#c0384f'] },
    { theme: 'sea', n: 6, decoy: 1, name: '深海探險', icon: 'octopus', col: ['#c9f5e8', '#3cc4a0', '#1f8a6e'] },
    { theme: 'vehicle', n: 6, decoy: 1, name: '出發囉！', icon: 'rocket', col: ['#ffe0cc', '#ff9d66', '#d6703a'] }
  ];
  const SCENES = [
    { id: 'yard', name: '後院', need: 0, bg: 'linear-gradient(#8fd8ff 60%, #7bd36a 60%)' },
    { id: 'beach', name: '海灘', need: 6, bg: 'linear-gradient(#6fd0ff 50%, #3aa8e8 50% 62%, #ffe3a3 62%)' },
    { id: 'night', name: '星空', need: 12, bg: 'radial-gradient(circle at 70% 25%, #fff3b0 0 8%, transparent 9%), linear-gradient(#1d2260 60%, #3f8a5a 60%)' }
  ];
  const save = KG.store.get('shadow-match:save', null) || { stars: [], found: {}, scene: 0 };
  save.found = save.found || {};
  const persist = () => KG.store.set('shadow-match:save', save);
  const totalStars = () => save.stars.reduce((a, b) => a + (b || 0), 0);
  function applyScene() { document.body.className = 'scene-' + SCENES[save.scene || 0].id; }
  applyScene();

  /* ======================= 特效層 ======================= */
  const FX = (function () {
    const c = $('fx'), g = c.getContext('2d');
    let parts = [], texts = [], running = false, last = 0, W = 0, H = 0;
    function size() { const d = Math.min(devicePixelRatio || 1, 2.5); W = innerWidth; H = innerHeight; c.width = W * d; c.height = H * d; g.setTransform(d, 0, 0, d, 0, 0); }
    size(); addEventListener('resize', size);
    function star(r) { g.beginPath(); for (let i = 0; i < 10; i++) { const a = -Math.PI / 2 + i * Math.PI / 5, q = i % 2 ? r * 0.45 : r; g.lineTo(Math.cos(a) * q, Math.sin(a) * q); } g.closePath(); g.fill(); }
    function heart(r) { g.beginPath(); g.moveTo(0, r * 0.9); g.bezierCurveTo(-r * 1.6, -r * 0.2, -r * 0.6, -r * 1.3, 0, -r * 0.4); g.bezierCurveTo(r * 0.6, -r * 1.3, r * 1.6, -r * 0.2, 0, r * 0.9); g.fill(); }
    function frame(now) {
      const dt = Math.max(0, Math.min(0.05, (now - last) / 1000)); last = now;
      g.clearRect(0, 0, W, H);
      parts = parts.filter(p => (p.life -= dt / p.dur) > 0);
      parts.forEach(p => {
        p.vy += p.grav * dt; p.x += p.vx * dt; p.y += p.vy * dt; p.rot += p.vr * dt;
        g.save(); g.translate(p.x, p.y); g.rotate(p.rot);
        const sc = p.life > 0.85 ? (1 - p.life) / 0.15 : 1;
        g.scale(sc, sc); g.globalAlpha = Math.min(1, p.life * 2.5); g.fillStyle = p.col;
        if (p.k === 'star') star(p.r); else if (p.k === 'heart') heart(p.r); else { g.beginPath(); g.arc(0, 0, p.r * 0.6, 0, Math.PI * 2); g.fill(); }
        g.restore();
      });
      texts = texts.filter(t => (t.life -= dt / t.dur) > 0);
      texts.forEach(t => {
        const k = 1 - t.life, intro = Math.min(1, k / 0.18);
        const eb = 1 + 2.7 * Math.pow(intro - 1, 3) + 1.7 * Math.pow(intro - 1, 2);
        g.save(); g.translate(t.x, t.y - k * 50); g.scale(eb, eb); g.rotate(Math.sin(k * 10) * 0.04);
        g.globalAlpha = Math.min(1, t.life * 3);
        g.font = `900 ${t.size}px ${getComputedStyle(document.body).fontFamily}`;
        g.textAlign = 'center'; g.textBaseline = 'middle'; g.lineJoin = 'round';
        g.lineWidth = t.size * 0.22; g.strokeStyle = '#fff'; g.strokeText(t.s, 0, 0);
        g.fillStyle = t.col; g.fillText(t.s, 0, 0);
        g.restore();
      });
      if (parts.length || texts.length) requestAnimationFrame(frame); else { running = false; g.clearRect(0, 0, W, H); }
    }
    function kick() { if (!running) { running = true; last = performance.now(); requestAnimationFrame(frame); } }
    return {
      burst(x, y, n, kinds, cols, speed) {
        for (let i = 0; i < n; i++) {
          const a = Math.random() * Math.PI * 2, sp = (speed || 260) * (0.4 + Math.random() * 0.8);
          parts.push({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 120, grav: 420, rot: Math.random() * 6, vr: (Math.random() - 0.5) * 8,
            r: 6 + Math.random() * 9, k: KG.pick(kinds), col: KG.pick(cols), life: 1, dur: 0.9 + Math.random() * 0.6 });
        }
        kick();
      },
      text(x, y, s, col, size) { texts.push({ x: Math.max(110, Math.min(innerWidth - 110, x)), y, s, col: col || '#ff5f95', size: size || 40, life: 1, dur: 1.3 }); kick(); }
    };
  })();

  /* ======================= 背景音樂 ======================= */
  const NOTE = n => 440 * Math.pow(2, (n - 69) / 12);
  const BGM = (function () {
    const mel = [77, 0, 81, 0, 84, 81, 79, 0, 77, 0, 74, 77, 79, 0, 0, 0, 81, 0, 84, 0, 86, 84, 81, 0, 79, 81, 77, 74, 77, 0, 0, 0];
    const bass = [53, 50, 46, 48, 53, 50, 48, 53];
    let timer = null, step = 0;
    function tick() {
      if (KG.isMuted() || document.hidden) { step++; return; }
      const m = mel[step % mel.length];
      if (m) KG.note(NOTE(m), 0.24, 'sine', 0.06);
      if (step % 4 === 0) KG.note(NOTE(bass[(step / 4 | 0) % bass.length]), 0.45, 'triangle', 0.06);
      if (step % 4 === 2) KG.note(NOTE(bass[(step / 4 | 0) % bass.length] + 7), 0.15, 'sine', 0.03);
      step++;
    }
    return { start() { if (!timer) { step = 0; timer = setInterval(tick, 240); } }, stop() { clearInterval(timer); timer = null; } };
  })();

  /* ======================= 介面 ======================= */
  const STAR_PATH = 'M12 1.8l3 6.4 7 .8-5.2 4.8 1.4 6.9L12 17.2l-6.2 3.5 1.4-6.9L2 9l7-.8z';
  const starSvg = (on, size) => `<svg class="st ${on ? 'on' : ''}" viewBox="0 0 24 24" width="${size}" height="${size}"><path d="${STAR_PATH}" stroke-width="1.6" stroke-linejoin="round"/><path d="M8.5 7.5l2-.3" stroke="#fff" stroke-width="1.6" stroke-linecap="round" opacity="${on ? .8 : 0}"/></svg>`;
  (function () {
    const cols = [['#ff7fa8', '#c2426f'], ['#ffb347', '#c87a12'], ['#5cc8ff', '#2a7fc0'], ['#9b7bff', '#5e43c2']];
    $('logo').innerHTML = '影子配對'.split('').map((ch, i) => `<span style="--c:${cols[i][0]};--d:${cols[i][1]};animation-delay:${i * 0.1}s,${0.7 + i * 0.25}s">${ch}</span>`).join('');
    $('demo').innerHTML = `<div class="d-sh">${svgOf('cat')}</div><div class="d-it">${svgOf('cat')}</div>`;
  })();

  let state = 'title';
  function show(id) {
    ['title', 'select', 'resultScr', 'bookScr'].forEach(s => { $(s).hidden = s !== id; });
    $('field').hidden = state !== 'play';
    $('hud').hidden = state !== 'play';
  }

  /* ======================= 遊戲 ======================= */
  const field = $('field');
  let lvIdx = 0, L = LEVELS[0], items = [], shadows = [], S = 100, matched = 0, mistakes = 0, streak = 0, drag = null, deco = [];

  function startLevel(i) {
    lvIdx = i; L = LEVELS[i];
    state = 'play';
    show(null);
    BGM.start();
    const pool = KG.shuffle(ITEMS[L.theme]);
    const chosen = pool.slice(0, L.n);
    const decoys = pool.slice(L.n, L.n + L.decoy);
    field.innerHTML = '';
    // 布幕、曬衣繩、野餐墊
    deco = { sheet: el('div', 'sheet'), rope: el('div', 'rope'), pins: [el('div', 'pin'), el('div', 'pin'), el('div', 'pin')], blanket: el('div', 'blanket') };
    const shOrder = KG.shuffle(chosen.concat(decoys));
    shadows = shOrder.map(([id]) => {
      const d = el('div', 'shadow');
      d.innerHTML = svgOf(id) + `<span class="name">${NAME[id]}</span>`;
      return { id, el: d, done: false };
    });
    items = KG.shuffle(chosen).map(([id], k) => {
      const d = el('div', 'item');
      d.innerHTML = svgOf(id);
      d.style.setProperty('--dl', (-k * 0.37) + 's');
      d.setAttribute('aria-label', NAME[id]);
      const it = { id, el: d, done: false, x: 0, y: 0, hx: 0, hy: 0, rot: KG.rand(-8, 8), wrong: 0 };
      d._it = it;
      return it;
    });
    matched = 0; mistakes = 0; streak = 0; drag = null;
    layout(true);
    updHud();
    // 進場動畫
    items.forEach((it, k) => {
      it.x = it.hx; it.y = innerHeight + S;
      place(it);
      setTimeout(() => { it.el.classList.add('ret'); it.x = it.hx; it.y = it.hy; place(it); }, 120 + k * 90);
    });
    $('hudLv').textContent = `${lvIdx + 1}. ${L.name}`;
    setTimeout(() => KG.say('把東西拖到影子上'), 500);
  }
  function el(tag, cls) { const d = document.createElement(tag); d.className = cls; field.appendChild(d); return d; }

  function grid(rect, n) {
    let best = { cell: 0, cols: 1, rows: n };
    for (let cols = 1; cols <= n; cols++) {
      const rows = Math.ceil(n / cols);
      const cell = Math.min(rect.w / cols, rect.h / rows);
      if (cell > best.cell) best = { cell, cols, rows };
    }
    return best;
  }
  function cellsIn(rect, n, g) {
    const out = [];
    const gw = g.cols * g.cell, gh = g.rows * g.cell;
    const ox = rect.x + (rect.w - gw) / 2, oy = rect.y + (rect.h - gh) / 2;
    for (let i = 0; i < n; i++) {
      const r = Math.floor(i / g.cols), c = i % g.cols;
      const inRow = Math.min(g.cols, n - r * g.cols);
      const rowOff = (g.cols - inRow) * g.cell / 2;
      out.push([ox + rowOff + c * g.cell + g.cell / 2, oy + r * g.cell + g.cell / 2]);
    }
    return out;
  }

  function layout(first) {
    if (!deco.sheet) return;
    const W = innerWidth, H = innerHeight, pad = 14, top = 86;
    const portrait = H >= W * 1.05;
    let sheet, tray;
    if (portrait) {
      const sh = (H - top - pad) * 0.52;
      sheet = { x: pad, y: top + 10, w: W - pad * 2, h: sh };
      tray = { x: pad, y: top + 10 + sh + 18, w: W - pad * 2, h: H - (top + 10 + sh + 18) - pad };
    } else {
      const tw = (W - pad * 3) * 0.42;
      tray = { x: pad, y: top + 6, w: tw, h: H - top - 6 - pad };
      sheet = { x: pad * 2 + tw, y: top + 6, w: W - pad * 3 - tw, h: H - top - 6 - pad };
    }
    const inner = (r, m) => ({ x: r.x + m, y: r.y + m + 10, w: r.w - m * 2, h: r.h - m * 2 - 10 });
    const gS = grid(inner(sheet, 10), shadows.length), gT = grid(inner(tray, 12), items.length);
    S = Math.max(56, Math.min(gS.cell, gT.cell, 190) * 0.82);
    const box = (d, r) => Object.assign(d.style, { left: r.x + 'px', top: r.y + 'px', width: r.w + 'px', height: r.h + 'px' });
    box(deco.sheet, sheet); box(deco.blanket, tray);
    Object.assign(deco.rope.style, { left: '0px', width: W + 'px', top: (sheet.y - 2) + 'px', transform: `rotate(${portrait ? 0 : -1}deg)` });
    deco.pins.forEach((p, i) => Object.assign(p.style, { left: (sheet.x + sheet.w * (0.12 + i * 0.38)) + 'px', top: (sheet.y - 12) + 'px' }));
    cellsIn(inner(sheet, 10), shadows.length, gS).forEach(([x, y], i) => {
      const s = shadows[i];
      s.x = x; s.y = y - 6;
      Object.assign(s.el.style, { width: S + 'px', height: S + 'px', transform: `translate(${x - S / 2}px, ${s.y - S / 2}px)` });
    });
    const cells = cellsIn(inner(tray, 12), items.length, gT);
    items.forEach((it, i) => {
      it.hx = cells[i][0] + KG.rand(-0.05, 0.05) * S; it.hy = cells[i][1] + KG.rand(-0.04, 0.04) * S;
      it.el.style.width = S + 'px'; it.el.style.height = S + 'px';
      if (!first && !it.done && drag?.it !== it) { it.x = it.hx; it.y = it.hy; place(it); }
    });
  }
  addEventListener('resize', () => { if (state === 'play') layout(false); });

  function place(it, extra) {
    it.el.style.transform = `translate(${it.x - S / 2}px, ${it.y - S / 2}px) rotate(${it.rot}deg)${extra || ''}`;
  }

  function updHud() {
    $('pips').innerHTML = items.map((_, i) => `<i class="${i < matched ? 'on' : ''}"></i>`).join('');
  }

  function nearestShadow(x, y) {
    let best = null, bd = S * 0.75;
    shadows.forEach(s => {
      if (s.done) return;
      const d = Math.hypot(s.x - x, s.y - y);
      if (d < bd) { bd = d; best = s; }
    });
    return best;
  }

  field.addEventListener('pointerdown', e => {
    if (state !== 'play' || drag) return;
    const d = e.target.closest('.item');
    if (!d || !d._it || d._it.done) return;
    e.preventDefault();
    const it = d._it;
    try { d.setPointerCapture(e.pointerId); } catch (err) { /* 忽略 */ }
    drag = { it, pid: e.pointerId, sx: e.clientX, sy: e.clientY, ox: it.x - e.clientX, oy: it.y - e.clientY, moved: false, hover: null };
    d.classList.remove('ret', 'snap');
    d.classList.add('drag');
    KG.sound('pop');
  });
  addEventListener('pointermove', e => {
    if (!drag || e.pointerId !== drag.pid) return;
    const it = drag.it;
    if (Math.hypot(e.clientX - drag.sx, e.clientY - drag.sy) > 8) drag.moved = true;
    it.x = e.clientX + drag.ox; it.y = e.clientY + drag.oy - (drag.moved ? 0 : 0);
    place(it);
    const h = nearestShadow(it.x, it.y);
    if (h !== drag.hover) {
      if (drag.hover) drag.hover.el.classList.remove('hover');
      if (h) { h.el.classList.add('hover'); KG.sound('tick'); }
      drag.hover = h;
    }
  });
  function endDrag(e) {
    if (!drag || e.pointerId !== drag.pid) return;
    const { it, hover, moved } = drag;
    drag = null;
    it.el.classList.remove('drag');
    if (hover) hover.el.classList.remove('hover');
    if (!moved) {
      // 點一下：念出名字
      it.el.classList.remove('wiggle'); void it.el.offsetWidth; it.el.classList.add('wiggle');
      KG.say(NAME[it.id]);
      goHome(it);
      return;
    }
    if (!hover) { goHome(it); return; }
    if (hover.id === it.id) correct(it, hover);
    else wrong(it, hover);
  }
  addEventListener('pointerup', endDrag);
  addEventListener('pointercancel', endDrag);

  function goHome(it) {
    it.el.classList.add('ret');
    it.x = it.hx; it.y = it.hy;

  const PRAISE = ['好棒！', '答對了！', '太厲害了！', '完美！', '真聰明！'];
  function correct(it, sh) {
    it.done = true; sh.done = true;
    it.el.classList.add('snap');
    it.x = sh.x; it.y = sh.y; it.rot = 0;
    place(it, ' scale(1.05)');
    matched++; streak++;
    sh.el.classList.remove('hint');
    setTimeout(() => {
      it.el.style.display = 'none';
      sh.el.classList.add('done');

      FX.text(sh.x, sh.y - S * 0.65, streak >= 3 ? PRAISE[Math.min(streak, 4)] : PRAISE[KG.randInt(0, 1)], '#ff5f95', Math.max(30, S * 0.32));
      KG.sound('correct');
      setTimeout(() => KG.say(NAME[it.id]), 250);
      if (!save.found[it.id]) { save.found[it.id] = true; persist(); }
      updHud();
      if (matched === items.length) setTimeout(levelClear, 1300);
    }, 260);
  }

  function wrong(it, sh) {
    mistakes++; streak = 0; it.wrong++;
    sh.el.classList.remove('no'); void sh.el.offsetWidth; sh.el.classList.add('no');
    KG.sound('boing');
    KG.vibrate(30);
    FX.text(sh.x, sh.y - S * 0.6, '不是這個喔～', '#7a6cff', Math.max(24, S * 0.24));
    goHome(it);
    if (it.wrong >= 2) {

      const target = shadows.find(s => s.id === it.id);
      if (target) target.el.classList.add('hint');
    }
  }

  function levelClear() {
    state = 'result';
    BGM.stop();
    const starsN = mistakes === 0 ? 3 : mistakes <= 2 ? 2 : 1;
    const before = totalStars();
    save.stars[lvIdx] = Math.max(save.stars[lvIdx] || 0, starsN);
    persist();
    const after = totalStars();
    const ns = SCENES.find(s => s.need > before && s.need <= after);
    show('resultScr');
    $('resTitle').textContent = starsN === 3 ? '超級完美！' : '過關啦！';
    $('resMsg').textContent = mistakes === 0 ? '全部都配對正確，好厲害！' : `找到全部的影子了！`;
    $('resUnlock').innerHTML = ns ? `<div class="unlock">🎁 解鎖新場景：${ns.name}！</div>` : '';
    $('resItems').innerHTML = items.map(it => svgOf(it.id)).join('');
    $('resStars').innerHTML = [0, 1, 2].map(k => starSvg(k < starsN, 70)).join('');
    [...$('resStars').children].forEach((s, k) => { s.style.animationDelay = (0.25 + k * 0.25) + 's'; if (k < starsN) setTimeout(() => KG.note(880 + k * 220, 0.18, 'triangle', 0.2), 250 + k * 250); });
    KG.sound('win'); KG.confetti();
    const box = $('resBtns'); box.innerHTML = '';
    const mk = (txt, cls, fn) => { const b = document.createElement('button'); b.className = 'cbtn small ' + cls; b.textContent = txt; b.addEventListener('click', () => { KG.sound('click'); fn(); }); box.appendChild(b); };
    const hasNext = lvIdx < LEVELS.length - 1;
    if (hasNext) mk('下一關', '', () => startLevel(lvIdx + 1));
    mk('再玩一次', hasNext ? 'blue' : '', () => startLevel(lvIdx));
    mk('選關卡', 'pink', openSelect);
  }

  function openSelect() {
    state = 'select';
    show('select');
    BGM.start();
    const total = totalStars();
    $('totalStars').innerHTML = starSvg(true, 28) + ` ${total} / ${LEVELS.length * 3}`;
    const box = $('lvls'); box.innerHTML = '';
    LEVELS.forEach((lv, i) => {
      const ok = i === 0 || (save.stars[i - 1] || 0) > 0;
      const s = save.stars[i] || 0;
      const b = document.createElement('button');
      b.className = 'lv' + (ok ? '' : ' locked');
      b.style.cssText = `--l1:${lv.col[0]};--l2:${lv.col[1]};--l3:${lv.col[2]};animation-delay:${i * 0.05}s`;
      b.innerHTML = `<span class="num">${i + 1}</span><span class="ic">${svgOf(lv.icon)}</span><small>${lv.name}</small><div class="stars-row">${[0, 1, 2].map(k => starSvg(k < s, 20)).join('')}</div>`;
      b.addEventListener('click', () => {
        if (!ok) { KG.sound('wrong'); b.classList.remove('kg-shake'); void b.offsetWidth; b.classList.add('kg-shake'); KG.toast('先過前一關喔！'); return; }
        KG.sound('pop'); startLevel(i);
      });
      box.appendChild(b);
    });
    const sc = $('scenes'); sc.innerHTML = '';
    SCENES.forEach((s, i) => {
      const ok = total >= s.need;
      const b = document.createElement('button');
      b.className = 'scn' + ((save.scene || 0) === i ? ' sel' : '') + (ok ? '' : ' locked');
      b.style.background = s.bg;
      b.innerHTML = s.name + (ok ? '' : `<span class="need">${starSvg(true, 14)}${s.need}</span>`);
      b.addEventListener('click', () => {
        if (!ok) { KG.toast(`收集 ${s.need} 顆星星就能解鎖！`); KG.sound('wrong'); return; }
        save.scene = i; persist(); applyScene(); KG.sound('pop'); openSelect();
      });
      sc.appendChild(b);
    });
  }

  function openBook() {
    state = 'book';
    show('bookScr');
    const all = Object.values(ITEMS).flat();
    const got = all.filter(([id]) => save.found[id]).length;
    $('bookCount').textContent = `已收集 ${got} / ${all.length} 張貼紙`;
    const b = $('book'); b.innerHTML = '';
    all.forEach(([id, n]) => {
      const has = !!save.found[id];
      const d = document.createElement('button');
      d.className = 'stk' + (has ? '' : ' no');
      d.innerHTML = svgOf(id) + `<span>${has ? n : '？'}</span>`;
      d.addEventListener('click', () => { if (has) { KG.say(n); KG.sound('pop'); d.classList.remove('kg-wiggle'); void d.offsetWidth; d.classList.add('kg-wiggle'); } else KG.sound('tick'); });
      b.appendChild(d);
    });
  }

  $('btnStart').addEventListener('click', () => { KG.sound('click'); openSelect(); });
  $('btnBook').addEventListener('click', () => { KG.sound('click'); openBook(); });
  $('bookBack').addEventListener('click', () => { KG.sound('click'); openSelect(); });
  document.addEventListener('contextmenu', e => e.preventDefault());
  document.addEventListener('visibilitychange', () => { if (document.hidden) BGM.stop(); else if (state !== 'title') BGM.start(); });

  window.__shadow = () => ({ state, items: items.map(i => ({ id: i.id, x: i.x, y: i.y, done: i.done })), shadows: shadows.map(s => ({ id: s.id, x: s.x, y: s.y, done: s.done })) });
  show('title');
})();
</script>
</body>
</html>
