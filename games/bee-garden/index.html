<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>蜜蜂採蜜</title>
<link rel="stylesheet" href="../../assets/common.css">
<style>
  html, body { height: 100%; overflow: hidden; background: #fdf3d6; overscroll-behavior: none; }
  #game {
    position: fixed; inset: 0; display: block;
    width: 100vw; height: 100vh; height: 100dvh;
    touch-action: none; cursor: default;
  }
</style>
</head>
<body>
<canvas id="game" aria-label="蜜蜂採蜜"></canvas>
<script src="../../assets/common.js"></script>
<script src="../../assets/kg-music.js"></script>
<script>
'use strict';
/* =====================================================================
 * 蜜蜂採蜜：當一隻小蜜蜂，在花園裡吸花蜜、幫同色的花授粉、把花蜜帶回蜂巢。
 * 15 關（春天花園、夏日果園、秋天山坡）、星星、蜂巢小屋（裝飾與蜜蜂造型）、每關一張小知識卡。
 * ===================================================================== */
(function () {
const SLUG = 'bee-garden';
const cv = document.getElementById('game');
const ctx = cv.getContext('2d');
const FONT = '"PingFang TC","Noto Sans TC","Microsoft JhengHei","Heiti TC",system-ui,sans-serif';
let W = 360, H = 640, dpr = 1, U = 1, time = 0;
const TAU = Math.PI * 2;
const INK = '#5a3a14';
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const lerp = (a, b, t) => a + (b - a) * t;
const rand = (a, b) => a + Math.random() * (b - a);
const Ease = {
  outCubic: t => 1 - Math.pow(1 - t, 3),
  inOutSine: t => -(Math.cos(Math.PI * t) - 1) / 2,
  outBack: t => { const c = 1.70158, c3 = c + 1; return 1 + c3 * Math.pow(t - 1, 3) + c * Math.pow(t - 1, 2); },
  outElastic: t => (t === 0 || t === 1) ? t : Math.pow(2, -10 * t) * Math.sin((t * 10 - 0.75) * (TAU / 3)) + 1
};
function mulberry(a) {
  return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
}

/* ---------- 補間動畫、延遲呼叫、畫面震動 ---------- */
const tweens = [];
function tween(obj, to, dur, ease, delay, done) {
  const tw = { obj, to, from: null, dur: dur || 0.3, ease: typeof ease === 'function' ? ease : (Ease[ease] || Ease.outCubic), t: -(delay || 0), done };
  tweens.push(tw);
  return tw;
}
function killTweens(obj) { for (let i = tweens.length - 1; i >= 0; i--) if (tweens[i].obj === obj) tweens.splice(i, 1); }
function updateTweens(dt) {
  for (let i = tweens.length - 1; i >= 0; i--) {
    const tw = tweens[i];
    if (!tw) continue;
    tw.t += dt;
    if (tw.t < 0) continue;
    if (!tw.from) { tw.from = {}; for (const k in tw.to) tw.from[k] = tw.obj[k]; }
    const p = Math.min(1, tw.t / tw.dur), e = tw.ease(p);
    for (const k in tw.to) tw.obj[k] = tw.from[k] + (tw.to[k] - tw.from[k]) * e;
    if (p >= 1) { const j = tweens.indexOf(tw); if (j >= 0) tweens.splice(j, 1); if (tw.done) tw.done(); }
  }
}
const timers = [];
function after(sec, fn) { timers.push({ t: sec, fn }); }
function updateTimers(dt) {
  for (let i = timers.length - 1; i >= 0; i--) {
    const tm = timers[i];
    tm.t -= dt;
    if (tm.t <= 0) { timers.splice(i, 1); tm.fn(); }
  }
}
let shakeT = 0, shakeAmt = 0;
function shake(a, d) { shakeAmt = Math.max(shakeT > 0 ? shakeAmt : 0, a); shakeT = Math.max(shakeT, d || 0.25); }

/* ---------- 繪圖小工具 ---------- */
function circ(x, y, r) { ctx.moveTo(x + r, y); ctx.arc(x, y, r, 0, TAU); }
function rr(x, y, w, h, r) {
  r = Math.max(0, Math.min(r, w / 2, h / 2));
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}
function starPath(x, y, R, r, rot) {
  ctx.beginPath();
  for (let i = 0; i < 10; i++) {
    const a = (rot || 0) + i * Math.PI / 5 - Math.PI / 2, rad = i % 2 ? r : R;
    ctx.lineTo(x + Math.cos(a) * rad, y + Math.sin(a) * rad);
  }
  ctx.closePath();
}
function hexPath(x, y, r) {
  ctx.beginPath();
  for (let i = 0; i < 6; i++) { const a = i * Math.PI / 3 + Math.PI / 6; ctx.lineTo(x + Math.cos(a) * r, y + Math.sin(a) * r); }
  ctx.closePath();
}
function heartPath(x, y, s) {
  ctx.beginPath();
  ctx.moveTo(x, y + s * 0.35);
  ctx.bezierCurveTo(x - s * 1.1, y - s * 0.35, x - s * 0.55, y - s * 1.05, x, y - s * 0.45);
  ctx.bezierCurveTo(x + s * 0.55, y - s * 1.05, x + s * 1.1, y - s * 0.35, x, y + s * 0.35);
  ctx.closePath();
}
function dropPath(x, y, s) {
  ctx.beginPath();
  ctx.moveTo(x, y - s);
  ctx.bezierCurveTo(x + s * 0.2, y - s * 0.5, x + s * 0.75, y - s * 0.05, x + s * 0.75, y + s * 0.3);
  ctx.arc(x, y + s * 0.3, s * 0.75, 0, Math.PI);
  ctx.bezierCurveTo(x - s * 0.75, y - s * 0.05, x - s * 0.2, y - s * 0.5, x, y - s);
  ctx.closePath();
}
function shade(hex, amt) {
  const n = parseInt(hex.slice(1), 16);
  const f = v => clamp(v + amt, 0, 255);
  return 'rgb(' + f(n >> 16) + ',' + f((n >> 8) & 255) + ',' + f(n & 255) + ')';
}
function rgba(hex, a) {
  const n = parseInt(hex.slice(1), 16);
  return 'rgba(' + (n >> 16) + ',' + ((n >> 8) & 255) + ',' + (n & 255) + ',' + a + ')';
}
function mix(h1, h2, t) {
  const a = parseInt(h1.slice(1), 16), b = parseInt(h2.slice(1), 16);
  const r = Math.round(lerp(a >> 16, b >> 16, t)), g = Math.round(lerp((a >> 8) & 255, (b >> 8) & 255, t)), bl = Math.round(lerp(a & 255, b & 255, t));
  return '#' + ((1 << 24) + (r << 16) + (g << 8) + bl).toString(16).slice(1);
}
function setFont(size, weight) { ctx.font = (weight || '900') + ' ' + Math.round(size) + 'px ' + FONT; }
/** 有外框與陰影的字 */
function txt(s, x, y, size, fill, o) {
  o = o || {};
  ctx.save();
  setFont(size, o.weight);
  ctx.textAlign = o.align || 'center';
  ctx.textBaseline = 'middle';
  ctx.lineJoin = 'round';
  if (o.shadow !== false) {
    ctx.fillStyle = o.shadow || 'rgba(90,50,10,0.25)';
    if (o.stroke) { ctx.strokeStyle = ctx.fillStyle; ctx.lineWidth = o.sw || size * 0.22; ctx.strokeText(s, x, y + size * 0.09); }
    ctx.fillText(s, x, y + size * 0.09);
  }
  if (o.stroke) { ctx.strokeStyle = o.stroke; ctx.lineWidth = o.sw || size * 0.22; ctx.strokeText(s, x, y); }
  ctx.fillStyle = fill; ctx.fillText(s, x, y);
  ctx.restore();
}
/** 標題字：每個字會彈跳，蜂蜜色 */
function logo(s, cx, cy, size) {
  ctx.save();
  setFont(size);
  ctx.textBaseline = 'middle'; ctx.textAlign = 'center'; ctx.lineJoin = 'round';
  const chars = [...s];
  let total = 0;
  const widths = chars.map(c => { const w = ctx.measureText(c).width * 1.04; total += w; return w; });
  let x = cx - total / 2;
  const cols = ['#ffc83d', '#ffa62b', '#ffc83d', '#ff9f43'];
  chars.forEach((c, i) => {
    const w = widths[i];
    const bob = Math.sin(time * 2.6 + i * 0.8) * size * 0.06;
    const rot = Math.sin(time * 1.9 + i) * 0.05;
    ctx.save();
    ctx.translate(x + w / 2, cy + bob); ctx.rotate(rot);
    ctx.strokeStyle = 'rgba(110,60,0,0.3)'; ctx.lineWidth = size * 0.36; ctx.strokeText(c, 0, size * 0.1);
    ctx.strokeStyle = '#7a4a0c'; ctx.lineWidth = size * 0.34; ctx.strokeText(c, 0, 0);
    ctx.strokeStyle = '#fff8e0'; ctx.lineWidth = size * 0.17; ctx.strokeText(c, 0, 0);
    const col = cols[i % cols.length];
    const g = ctx.createLinearGradient(0, -size / 2, 0, size / 2);
    g.addColorStop(0, shade(col, 70)); g.addColorStop(0.5, col); g.addColorStop(1, shade(col, -40));
    ctx.fillStyle = g; ctx.fillText(c, 0, 0);
    // 蜂蜜滴
    const dp = (time * 0.35 + i * 0.27) % 1;
    ctx.fillStyle = '#ffb21e';
    ctx.globalAlpha = dp < 0.85 ? 1 : (1 - dp) / 0.15;
    dropPath(w * 0.12, size * 0.45 + dp * size * 0.35, size * 0.07 + dp * size * 0.03); ctx.fill();
    ctx.globalAlpha = 0.55; ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.ellipse(-w * 0.18, -size * 0.25, size * 0.1, size * 0.05, -0.5, 0, TAU); ctx.fill();
    ctx.restore();
    x += w;
  });
  ctx.restore();
}
function glossyStar(x, y, R, on, rot) {
  ctx.save();
  ctx.lineJoin = 'round';
  if (on) {
    ctx.fillStyle = 'rgba(160,90,0,0.25)'; starPath(x, y + R * 0.12, R, R * 0.5, rot); ctx.fill();
    const g = ctx.createRadialGradient(x - R * 0.3, y - R * 0.4, R * 0.1, x, y, R * 1.1);
    g.addColorStop(0, '#fffbd0'); g.addColorStop(0.45, '#ffd93d'); g.addColorStop(1, '#f39a0c');
    ctx.fillStyle = g; ctx.strokeStyle = '#c9700a'; ctx.lineWidth = Math.max(1.5, R * 0.12);
    starPath(x, y, R, R * 0.5, rot); ctx.fill(); ctx.stroke();
    ctx.fillStyle = 'rgba(255,255,255,0.75)';
    ctx.beginPath(); ctx.ellipse(x - R * 0.25, y - R * 0.3, R * 0.22, R * 0.12, -0.6, 0, TAU); ctx.fill();
  } else {
    ctx.fillStyle = 'rgba(120,90,40,0.18)'; ctx.strokeStyle = 'rgba(120,90,40,0.35)'; ctx.lineWidth = Math.max(1.5, R * 0.1);
    starPath(x, y, R, R * 0.5, rot); ctx.fill(); ctx.stroke();
  }
  ctx.restore();
}
function honeyDrop(x, y, s, on) {
  ctx.save();
  dropPath(x, y, s);
  if (on) {
    const g = ctx.createLinearGradient(x, y - s, x, y + s);
    g.addColorStop(0, '#ffe27a'); g.addColorStop(1, '#f59a0b');
    ctx.fillStyle = g; ctx.fill();
    ctx.strokeStyle = '#b36a05'; ctx.lineWidth = Math.max(1.2, s * 0.16); ctx.stroke();
    ctx.fillStyle = 'rgba(255,255,255,0.7)'; ctx.beginPath(); ctx.ellipse(x - s * 0.25, y + s * 0.1, s * 0.15, s * 0.24, 0.3, 0, TAU); ctx.fill();
  } else {
    ctx.fillStyle = 'rgba(160,110,40,0.16)'; ctx.fill();
    ctx.strokeStyle = 'rgba(160,110,40,0.4)'; ctx.lineWidth = Math.max(1, s * 0.13); ctx.stroke();
  }
  ctx.restore();
}
/** 蜂巢格子圖示：p = 0~1 蜂蜜高度 */
function honeyHex(x, y, r, p) {
  ctx.save();
  hexPath(x, y, r); ctx.fillStyle = '#fff6d8'; ctx.fill();
  ctx.save(); hexPath(x, y, r); ctx.clip();
  const top = y + r - p * 2 * r;
  ctx.fillStyle = '#ffb627'; ctx.fillRect(x - r, top + Math.sin(time * 4) * 1.2, r * 2, r * 2);
  ctx.fillStyle = 'rgba(255,255,255,0.35)'; ctx.fillRect(x - r, top + Math.sin(time * 4) * 1.2, r * 2, r * 0.2);
  ctx.restore();
  hexPath(x, y, r); ctx.strokeStyle = '#a8650a'; ctx.lineWidth = Math.max(1.5, r * 0.16); ctx.stroke();
  ctx.restore();
}
function pill(x, y, w, h, col, bg) {
  rr(x, y + 3, w, h, h / 2); ctx.fillStyle = 'rgba(90,60,20,0.16)'; ctx.fill();
  rr(x, y, w, h, h / 2); ctx.fillStyle = bg || 'rgba(255,253,244,0.94)'; ctx.fill();
  ctx.strokeStyle = col; ctx.lineWidth = 3; ctx.stroke();
}
/** 自動換行（中文逐字） */
const wrapCache = new Map();
function wrapText(s, maxW, size) {
  const key = s + '|' + Math.round(maxW) + '|' + Math.round(size);
  let r = wrapCache.get(key);
  if (r) return r;
  setFont(size, '800');
  r = [];
  let line = '';
  for (const ch of s) {
    const t = line + ch;
    if (ctx.measureText(t).width > maxW && line) {
      if ('，。！？、：）」'.indexOf(ch) >= 0 && line.length > 1) { r.push(line.slice(0, -1)); line = line.slice(-1) + ch; }
      else { r.push(line); line = ch; }
    } else line = t;
  }
  if (line) r.push(line);
  if (wrapCache.size > 300) wrapCache.clear();
  wrapCache.set(key, r);
  return r;
}

/* ---------- 按鈕（每一格畫面重新登記，支援鍵盤焦點） ---------- */
let btnReg = [], pressed = null, focusId = null, kbMode = false;
const BTN = {
  green: ['#b6f5a6', '#52c25e', '#2f8a3c'], pink: ['#ffc0d6', '#f56f9e', '#b8406e'], blue: ['#b0e2ff', '#4aa6ef', '#2768a3'],
  honey: ['#fff09a', '#f9b522', '#b0730a'], purple: ['#e0ccff', '#a07cf0', '#62449f'], orange: ['#ffd6a8', '#ff9a4d', '#c0601e'],
  white: ['#ffffff', '#fff6e2', '#c9a46a']
};
function drawIcon(name, x, y, s, col) {
  ctx.save(); ctx.translate(x, y);
  ctx.fillStyle = col || '#fff'; ctx.strokeStyle = col || '#fff';
  ctx.lineWidth = s * 0.2; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  if (name === 'play') { ctx.beginPath(); ctx.moveTo(-s * 0.32, -s * 0.45); ctx.lineTo(s * 0.45, 0); ctx.lineTo(-s * 0.32, s * 0.45); ctx.closePath(); ctx.fill(); ctx.stroke(); }
  else if (name === 'pause') { rr(-s * 0.38, -s * 0.42, s * 0.26, s * 0.84, s * 0.08); ctx.fill(); rr(s * 0.12, -s * 0.42, s * 0.26, s * 0.84, s * 0.08); ctx.fill(); }
  else if (name === 'replay') {
    ctx.beginPath(); ctx.arc(0, 0, s * 0.42, -Math.PI * 0.3, Math.PI * 1.35); ctx.stroke();
    const a = -Math.PI * 0.3, ex = Math.cos(a) * s * 0.42, ey = Math.sin(a) * s * 0.42;
    ctx.beginPath(); ctx.moveTo(ex + s * 0.2, ey - s * 0.05); ctx.lineTo(ex - s * 0.02, ey + s * 0.25); ctx.lineTo(ex - s * 0.25, ey - s * 0.12); ctx.closePath(); ctx.fill();
  }
  else if (name === 'menu') { for (let i = -1; i <= 1; i += 2) for (let j = -1; j <= 1; j += 2) { rr(i * s * 0.25 - s * 0.17, j * s * 0.25 - s * 0.17, s * 0.34, s * 0.34, s * 0.08); ctx.fill(); } }
  else if (name === 'back') { ctx.beginPath(); ctx.moveTo(s * 0.4, 0); ctx.lineTo(-s * 0.35, 0); ctx.moveTo(-s * 0.05, -s * 0.32); ctx.lineTo(-s * 0.38, 0); ctx.lineTo(-s * 0.05, s * 0.32); ctx.stroke(); }
  else if (name === 'lock') {
    ctx.lineWidth = s * 0.16; ctx.beginPath(); ctx.arc(0, -s * 0.12, s * 0.26, Math.PI, 0); ctx.stroke();
    rr(-s * 0.38, -s * 0.12, s * 0.76, s * 0.6, s * 0.12); ctx.fill();
    ctx.fillStyle = 'rgba(0,0,0,0.25)'; ctx.beginPath(); circ(0, s * 0.15, s * 0.08); ctx.fill();
  }
  else if (name === 'speaker') {
    ctx.beginPath(); ctx.moveTo(-s * 0.45, -s * 0.16); ctx.lineTo(-s * 0.22, -s * 0.16); ctx.lineTo(s * 0.05, -s * 0.4); ctx.lineTo(s * 0.05, s * 0.4); ctx.lineTo(-s * 0.22, s * 0.16); ctx.lineTo(-s * 0.45, s * 0.16); ctx.closePath(); ctx.fill();
    ctx.lineWidth = s * 0.12;
    ctx.beginPath(); ctx.arc(s * 0.08, 0, s * 0.22, -0.9, 0.9); ctx.stroke();
    ctx.beginPath(); ctx.arc(s * 0.08, 0, s * 0.4, -0.9, 0.9); ctx.stroke();
  }
  else if (name === 'hive') {
    for (let i = 0; i < 4; i++) { const w = s * (0.5 + Math.sin((i + 0.5) / 4 * Math.PI) * 0.45); rr(-w / 2, -s * 0.45 + i * s * 0.22, w, s * 0.24, s * 0.12); ctx.fill(); }
    ctx.fillStyle = 'rgba(0,0,0,0.35)'; ctx.beginPath(); ctx.ellipse(0, s * 0.3, s * 0.12, s * 0.09, 0, 0, TAU); ctx.fill();
  }
  else if (name === 'check') { ctx.lineWidth = s * 0.22; ctx.beginPath(); ctx.moveTo(-s * 0.36, 0); ctx.lineTo(-s * 0.08, s * 0.28); ctx.lineTo(s * 0.4, -s * 0.3); ctx.stroke(); }
  ctx.restore();
}
/** 立體按鈕。o: {label, icon, color, onClick, size, pulse, disabled, def, radius} */
function button(id, x, y, w, h, o) {
  btnReg.push({ id, x, y, w, h, onClick: o.onClick, disabled: o.disabled, def: o.def, silent: o.silent });
  const pal = BTN[o.color || 'honey'];
  const isDown = pressed && pressed.id === id;
  let s = isDown ? 0.93 : 1;
  if (o.pulse && !isDown) s *= 1 + Math.sin(time * 5) * 0.03;
  const lip = Math.max(4, h * 0.1);
  ctx.save();
  ctx.translate(x + w / 2, y + h / 2); ctx.scale(s, s);
  if (o.disabled) ctx.globalAlpha = 0.55;
  const r = o.radius == null ? h / 2 : o.radius;
  const yo = isDown ? lip * 0.6 : 0;
  rr(-w / 2, -h / 2 + lip + 3, w, h, r); ctx.fillStyle = 'rgba(90,60,20,0.2)'; ctx.fill();
  rr(-w / 2, -h / 2 + lip, w, h, r); ctx.fillStyle = pal[2]; ctx.fill();
  rr(-w / 2, -h / 2 + yo, w, h, r);
  const g = ctx.createLinearGradient(0, -h / 2, 0, h / 2);
  g.addColorStop(0, pal[0]); g.addColorStop(0.55, pal[1]); g.addColorStop(1, shade(pal[1], -15));
  ctx.fillStyle = g; ctx.fill();
  ctx.strokeStyle = pal[2]; ctx.lineWidth = Math.max(2, h * 0.05); ctx.stroke();
  rr(-w / 2 + Math.min(h, w) * 0.22, -h / 2 + yo + h * 0.09, w - Math.min(h, w) * 0.44, h * 0.28, h * 0.14);
  ctx.fillStyle = 'rgba(255,255,255,0.45)'; ctx.fill();
  const fs = o.size || h * 0.42;
  const tc = o.color === 'white' ? '#7a4f12' : '#fff';
  const sc = o.color === 'white' ? '#fff' : pal[2];
  if (o.icon && o.label) {
    setFont(fs);
    const tw = ctx.measureText(o.label).width;
    const tot = fs * 1.15 + tw;
    drawIcon(o.icon, -tot / 2 + fs * 0.45, yo, fs * 0.9, tc);
    txt(o.label, -tot / 2 + fs * 1.15 + tw / 2, yo + 1, fs, tc, { stroke: sc, sw: fs * 0.2, shadow: false });
  } else if (o.icon) drawIcon(o.icon, 0, yo, fs * 1.1, tc);
  else if (o.label != null) txt(o.label, 0, yo + 1, fs, tc, { stroke: sc, sw: fs * 0.2, shadow: false });

    rr(x - 5, y - 5, w + 10, h + lip + 10, r + 5);
    ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 4; ctx.setLineDash([9, 6]); ctx.lineDashOffset = -time * 30; ctx.stroke(); ctx.setLineDash([]);
  }
}
function hotspot(id, x, y, w, h, onClick, o) { btnReg.push(Object.assign({ id, x, y, w, h, onClick }, o || {})); }
function hitBtn(x, y) {
  let best = null, bd = 14;
  for (let i = btnReg.length - 1; i >= 0; i--) {
    const b = btnReg[i];
    if (b.disabled) continue;
    if (x >= b.x - 4 && x <= b.x + b.w + 4 && y >= b.y - 4 && y <= b.y + b.h + 8) return b;
    const dx = Math.max(b.x - x, 0, x - (b.x + b.w)), dy = Math.max(b.y - y, 0, y - (b.y + b.h));
    const d = Math.hypot(dx, dy);
    if (d < bd) { bd = d; best = b; }
  }
  return best;
}
function focusMove(dir) {
  const list = btnReg.filter(b => !b.disabled && !b.noFocus);
  if (!list.length) return;
  let i = list.findIndex(b => b.id === focusId);
  i = i < 0 ? (dir > 0 ? 0 : list.length - 1) : (i + dir + list.length) % list.length;
  focusId = list[i].id;
  sfx('click', { vol: 0.6 });
}
function focusPress() {
  const b = btnReg.find(q => q.id === focusId && !q.disabled) || btnReg.find(q => q.def && !q.disabled);
  if (b && b.onClick) { sfx('ui'); b.onClick(); }
}

/* ---------- 粒子（物件池）：world = 世界座標，否則是螢幕座標 ---------- */
const PMAX = KG.lowEnd ? 140 : 220;
const parts = [];
for (let i = 0; i < PMAX; i++) parts.push({ on: false, world: true, x: 0, y: 0, vx: 0, vy: 0, life: 0, max: 1, size: 1, color: '#fff', shape: 0, rot: 0, vr: 0, g: 0, drag: 1 });
let pIdx = 0;
const SH_STAR = 0, SH_SPARK = 1, SH_DOT = 2, SH_PETAL = 3, SH_RING = 4, SH_DROP = 5, SH_LEAF = 6, SH_HEART = 7;
function allocP() {
  for (let k = 0; k < PMAX; k++) {
    const p = parts[(pIdx + k) % PMAX];
    if (!p.on) { pIdx = (pIdx + k + 1) % PMAX; return p; }
  }
  const p = parts[pIdx]; pIdx = (pIdx + 1) % PMAX; return p;
}
/** 一團粒子。o: {n, colors, speed, g, size, shape, life, world, up, drag} */
function burst(x, y, o) {
  o = o || {};
  const n = o.n || 12;
  for (let i = 0; i < n; i++) {
    const p = allocP();
    const a = o.angle != null ? o.angle + rand(-(o.spread || 0.6), o.spread || 0.6) : rand(0, TAU);
    const sp = (o.speed || 150) * rand(0.35, 1);
    p.on = true; p.world = o.world !== false; p.x = x + rand(-(o.jx || 0), o.jx || 0); p.y = y + rand(-(o.jy || 0), o.jy || 0);
    p.vx = Math.cos(a) * sp; p.vy = Math.sin(a) * sp - (o.up || 0);
    p.life = 0; p.max = (o.life || 0.8) * rand(0.7, 1.2); p.size = (o.size || 6) * rand(0.6, 1.2);
    p.color = o.colors ? o.colors[i % o.colors.length] : '#ffd93d';
    p.shape = o.shape != null ? o.shape : SH_STAR; p.rot = rand(0, TAU); p.vr = rand(-6, 6); p.g = o.g == null ? 200 : o.g; p.drag = o.drag || 0.985;
  }
}
function ring(x, y, color, r, life, world) {
  const p = allocP();
  p.on = true; p.world = world !== false; p.x = x; p.y = y; p.vx = 0; p.vy = 0; p.life = 0; p.max = life || 0.5; p.size = r || 40; p.color = color; p.shape = SH_RING; p.g = 0; p.drag = 1;
}
function updateParts(dt) {
  for (const p of parts) {
    if (!p.on) continue;
    p.life += dt;
    if (p.life >= p.max) { p.on = false; continue; }
    p.vy += p.g * dt; p.vx *= p.drag; p.vy *= p.drag;
    if (p.shape === SH_PETAL || p.shape === SH_LEAF) { p.vx += Math.sin(time * 2 + p.rot) * 20 * dt; }
    p.x += p.vx * dt; p.y += p.vy * dt; p.rot += p.vr * dt;
  }
}
function drawParts(world) {
  for (const p of parts) {
    if (!p.on || p.world !== world) continue;
    const k = p.life / p.max;
    ctx.globalAlpha = k > 0.7 ? (1 - k) / 0.3 : 1;
    if (p.shape === SH_RING) {
      ctx.strokeStyle = p.color; ctx.lineWidth = 4 * (1 - k) + 1;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.size * Ease.outCubic(k), 0, TAU); ctx.stroke();
      continue;
    }
    ctx.fillStyle = p.color;
    const s = p.size * (p.shape === SH_SPARK ? (1 - k) : 1);
    if (p.shape === SH_STAR) { starPath(p.x, p.y, s, s * 0.45, p.rot); ctx.fill(); }
    else if (p.shape === SH_SPARK) { ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot); ctx.fillRect(-s, -s * 0.18, s * 2, s * 0.36); ctx.fillRect(-s * 0.18, -s, s * 0.36, s * 2); ctx.restore(); }
    else if (p.shape === SH_DOT) { ctx.beginPath(); circ(p.x, p.y, s); ctx.fill(); }
    else if (p.shape === SH_PETAL) { ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot); ctx.beginPath(); ctx.ellipse(0, 0, s, s * 0.55, 0, 0, TAU); ctx.fill(); ctx.restore(); }
    else if (p.shape === SH_LEAF) { ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot); ctx.beginPath(); ctx.moveTo(-s, 0); ctx.quadraticCurveTo(0, -s * 0.8, s, 0); ctx.quadraticCurveTo(0, s * 0.8, -s, 0); ctx.fill(); ctx.restore(); }
    else if (p.shape === SH_DROP) { dropPath(p.x, p.y, s); ctx.fill(); }
    else if (p.shape === SH_HEART) { heartPath(p.x, p.y, s); ctx.fill(); }
  }
  ctx.globalAlpha = 1;
}

const sfxLast = Object.create(null);
/** 播放音效：同一種音效 40ms 內只播一次、音高隨機 ±4% */
function sfx(name, o) {
  if (!sfxOn || !S) return;

  const pitch = ((o && o.pitch) || 1) * (o && o.exact ? 1 : 0.96 + Math.random() * 0.08);
  S.play(name, { vol: o ? o.vol : undefined, pitch, pan: o ? o.pan : undefined });
}

/* 講話時把音樂調小，講完再恢復 */
let duckTimer = null;
function say(t) {
  if (!voiceOn || !t) return;
  KG.say(t, 1.0);
  if (!M || !window.speechSynthesis) return;
  M.setVolume(MUSIC_VOL * 0.4);
  const t0 = performance.now();
  if (duckTimer) clearInterval(duckTimer);
  duckTimer = setInterval(() => {
    const sp = window.speechSynthesis.speaking || window.speechSynthesis.pending;
    if ((!sp && performance.now() - t0 > 400) || performance.now() - t0 > 12000) { clearInterval(duckTimer); duckTimer = null; M.setVolume(MUSIC_VOL); }
  }, 200);
}
function stopSay() { if (window.speechSynthesis) window.speechSynthesis.cancel(); }

function buildLevel(i) {
  const d = LEVELS[i], rnd = mulberry(4021 + i * 7919);
  const w = d.w;
  G.lvl = i; G.def = d; G.season = SEASONS[d.s]; G.w = w;
  G.flowers = []; G.webs = []; G.hornets = []; G.clouds = []; G.frogs = []; G.decor = []; G.drops = [];
  G.honey = 0; G.fruits = 0; G.hits = 0; G.delivered = 0; G.done = false; G.t = 0; G.endT = 0;
  G.firstSip = false; G.firstPollen = false; G.stretch = false; G.danger = false;
  const hiveX = d.hive === 'mid' ? Math.round(w / 2) : 150;
  G.hive = { x: hiveX, y: 252, ex: hiveX, ey: 282, wob: 0, fill: 0 };
  // 先放危險物的位置（彼此分開、離蜂巢遠一點）
  const taken = [];
  function pickX(minHive, sep) {
    for (let k = 0; k < 60; k++) {
      const x = 260 + rnd() * (w - 420);
      if (Math.abs(x - hiveX) < minHive) continue;
      if (taken.some(t => Math.abs(t - x) < sep)) continue;
      taken.push(x); return x;
    }
    const x = clamp(hiveX + (rnd() < 0.5 ? -1 : 1) * (minHive + 80), 200, w - 200); taken.push(x); return x;
  }
  const ponds = [];
  for (let k = 0; k < (d.frog || 0); k++) {
    const x = pickX(330, 330);
    ponds.push(x);
    G.frogs.push({ x, y: GROUND - 6, state: 'idle', t: 0, cd: 1.5, tx: 0, ty: 0, len: 0, blink: rand(1, 4) });
  }
  for (let k = 0; k < (d.hornet || 0); k++) {
    const x = pickX(380, 360);
    G.hornets.push({ cx: x, x0: x - 180, x1: x + 180, yb: 150 + rnd() * 70, x, y: 170, vx: 0, vy: 0, state: 'patrol', t: rnd() * 10, st: 0, face: 1, warn: 0, cd: 0 });
  }
  for (let k = 0; k < (d.rain || 0); k++) {
    const x = pickX(420, 300);
    G.clouds.push({ cx: x, x, y: 74, dir: rnd() < 0.5 ? -1 : 1, phase: 'dry', t: 1 + rnd() * 2.5, spawn: 0, dark: 0 });
  }
  // 花：平均分布，避開蜂巢和池塘
  const spots = [];
  const minX = 90, maxX = w - 80;
  for (let x = minX; x <= maxX; x += 14) {
    if (Math.abs(x - hiveX) < 95) continue;
    if (ponds.some(p => Math.abs(p - x) < 120)) continue;
    spots.push(x);
  }
  const n = d.n;
  const gapBase = (spots.length - 1) / Math.max(1, n - 1);
  let colorsList = [];
  for (let k = 0; k < n; k++) colorsList.push(d.col[Math.floor(k / 2) % d.col.length]);
  for (let k = colorsList.length - 1; k > 0; k--) { const j = Math.floor(rnd() * (k + 1)); const t = colorsList[k]; colorsList[k] = colorsList[j]; colorsList[j] = t; }
  for (let k = 0; k < n; k++) {
    const si = clamp(Math.round(k * gapBase + (rnd() - 0.5) * gapBase * 0.4), 0, spots.length - 1);
    const x = spots[si];
    const kinds = G.season.kinds;
    G.flowers.push({
      id: k, x, h: 130 + rnd() * 130, c: colorsList[k], kind: kinds[Math.floor(rnd() * kinds.length)],
      size: 22 + rnd() * 6, petals: 5 + Math.floor(rnd() * 3), ph: rnd() * TAU, nectar: true, regen: 0, fruit: false, grow: 0,
      cool: 0, hx: x, hy: 0, bob: 0, glow: 0, pulse: 0, lean: (rnd() - 0.5) * 0.12
    });
  }
  // 蜘蛛網：放在兩朵花中間，高度避開花朵
  if (d.web) {
    const fl = G.flowers.slice().sort((a, b) => a.x - b.x);
    const gaps = [];
    for (let k = 0; k < fl.length - 1; k++) {
      const mx = (fl[k].x + fl[k + 1].x) / 2;
      if (Math.abs(mx - hiveX) < 220 || fl[k + 1].x - fl[k].x < 70) continue;
      gaps.push({ mx, a: fl[k], b: fl[k + 1] });
    }
    for (let k = gaps.length - 1; k > 0; k--) { const j = Math.floor(rnd() * (k + 1)); const t = gaps[k]; gaps[k] = gaps[j]; gaps[j] = t; }
    let placed = 0;
    for (const g of gaps) {
      if (placed >= d.web) break;
      if (G.webs.some(wb => Math.abs(wb.x - g.mx) < 260)) continue;
      const ys = [];
      for (let y = 120; y <= 380; y += 10) {
        const ok = G.flowers.every(f => Math.abs(f.x - g.mx) > 120 || Math.abs((GROUND - f.h) - y) > 92 || Math.abs(f.x - g.mx) > 95);
        if (ok) ys.push(y);
      }
      if (!ys.length) continue;
      G.webs.push({ x: g.mx, y: ys[Math.floor(rnd() * ys.length)], r: 42, cool: 0, ph: rnd() * TAU, wob: 0 });
      placed++;
    }
  }
  // 裝飾：草叢、石頭、蘑菇、向日葵、籬笆
  for (let x = 40; x < w; x += 70 + rnd() * 90) {
    if (ponds.some(p => Math.abs(p - x) < 110)) continue;
    const r = rnd();
    let type = r < 0.45 ? 'bush' : r < 0.65 ? 'stone' : r < 0.82 ? (d.s === 2 ? 'mush' : d.s === 1 ? 'hay' : 'tulipbed') : 'fence';
    G.decor.push({ type, x, s: 0.8 + rnd() * 0.5, ph: rnd() * TAU });
  }
  G.wind = d.wind ? { state: 'calm', t: 3, dir: 1, k: 0 } : null;
  G.par = Math.round(25 + d.nectar * 5 + d.fruit * 6 + w / 70);
  // 蜜蜂從蜂巢出發
  Object.assign(bee, { x: hiveX + 40, y: 240, vx: 0, vy: 0, face: 1, nectar: 0, pollen: -1, from: -1, stuck: 0, stuckWeb: null, inv: 0, sipF: null, sipP: 0, flap: 0, tilt: 0, squash: 1, depT: 0, wob: 0 });
  for (const p of parts) p.on = false;
  banner.t = banner.dur = 9; banner.prio = 0; beePop.t = 9;
}

function toWorld(sx, sy) { return [sx / SC + camX, sy / SC + camY]; }

function updateCamera(snap, dt) {
  viewW = W / SC; viewH = H / SC;
  let cx = camX;
  const bx = bee.x + bee.vx * 0.35;
  if (snap) cx = bee.x - viewW * 0.4;
  if (bx - cx < viewW * 0.36) cx = bx - viewW * 0.36;
  if (bx - cx > viewW * 0.64) cx = bx - viewW * 0.64;
  if (G.w <= viewW) cx = (G.w - viewW) / 2;
  else cx = clamp(cx, 0, G.w - viewW);
  camX = snap ? cx : lerp(camX, cx, Math.min(1, (dt || 0.016) * 6));
  if (G.w > viewW) camX = clamp(camX, 0, G.w - viewW);
  if (viewH >= WH) camY = WH - viewH;
  else {
    const cy = clamp(bee.y - viewH * 0.45, 0, WH - viewH);
    camY = snap ? cy : lerp(camY, cy, Math.min(1, (dt || 0.016) * 5));
  }
}

    for (const f of G.flowers) { if (f.fruit) continue; const d = Math.hypot(f.hx - tx, f.hy - ty); if (d < bd) { bd = d; best = f; } }
    if (best) { tx = best.hx; ty = best.hy - 4; }
    else if (Math.hypot(G.hive.ex - tx, G.hive.ey - ty) < 70) { tx = G.hive.ex; ty = G.hive.ey; }
    target = [tx, ty];
    const dx = tx - bee.x, dy = ty - bee.y, d = Math.hypot(dx, dy);
    if (d > 3) { const sp = Math.min(MAXV, d * 3.4); dvx = dx / d * sp; dvy = dy / d * sp; }

    if (w) { bee.x = lerp(bee.x, w.x, Math.min(1, dt * 6)); bee.y = lerp(bee.y, w.y, Math.min(1, dt * 6)); }
    bee.vx = 0; bee.vy = 0; bee.wob += dt * 30;
    if (bee.stuck <= 0) {
      bee.stuck = 0; bee.stuckWeb = null;
      if (w) { w.cool = 2.2; bee.vy = 160; }

    }
    return;
  }
  const k = Math.min(1, dt * 4.2);
  bee.vx += (dvx - bee.vx) * k; bee.vy += (dvy - bee.vy) * k;
  bee.x += bee.vx * dt; bee.y += bee.vy * dt;
  if (G.wind && G.wind.k > 0.01) bee.x += G.wind.dir * G.wind.k * 95 * dt;
  if (bee.x < 24) { bee.x = 24; bee.vx = Math.max(0, bee.vx); }
  if (bee.x > G.w - 24) { bee.x = G.w - 24; bee.vx = Math.min(0, bee.vx); }
  if (bee.y < 34) { bee.y = 34; bee.vy = Math.max(0, bee.vy); }
  if (bee.y > GROUND - 22) { bee.y = GROUND - 22; bee.vy = Math.min(0, bee.vy); }
  if (Math.abs(bee.vx) > 25) bee.face = bee.vx > 0 ? 1 : -1;

}

function updateSip(dt) {
  if (bee.stuck > 0 || G.done) { bee.sipP = 0; bee.sipF = null; return; }
  let best = null, bd = SIP_R;
  for (const f of G.flowers) {
    if (!visitable(f)) continue;
    const d = Math.hypot(f.hx - bee.x, f.hy - 4 - bee.y);
    if (d < bd) { bd = d; best = f; }
  }
  const sp = Math.hypot(bee.vx, bee.vy);
  if (best && sp < 280) {
    if (bee.sipF !== best) { bee.sipF = best; bee.sipP = 0; }
    bee.sipP += dt / SIP_TIME;
    // 輕輕被花吸過去
    bee.x = lerp(bee.x, best.hx, Math.min(1, dt * 3)); bee.y = lerp(bee.y, best.hy - 4, Math.min(1, dt * 3));
    bee.sipTick -= dt;

    if (bee.sipP >= 1) { visit(best); bee.sipP = 0; bee.sipF = null; }
  } else {
    bee.sipP = Math.max(0, bee.sipP - dt * 3);
    if (bee.sipP <= 0) bee.sipF = null;
  }
}

function updateHive(dt) {
  const h = G.hive;
  h.wob = Math.max(0, h.wob - dt * 3);
  const d = Math.hypot(bee.x - h.ex, bee.y - h.ey);
  if (d < 54 && bee.nectar > 0 && bee.stuck <= 0 && !G.done) {
    bee.depT -= dt;
    bee.x = lerp(bee.x, h.ex, Math.min(1, dt * 3)); bee.y = lerp(bee.y, h.ey, Math.min(1, dt * 3));
    if (bee.depT <= 0) {
      bee.depT = 0.24;
      bee.nectar--; G.honey++; G.delivered++;
      h.wob = 1;
      sfx('bee_plop', { pitch: 1 + Math.min(10, G.honey) * 0.05, exact: true, pan: panW(h.ex) });
      burst(h.ex, h.ey - 6, { n: 5, colors: ['#ffd84a', '#ffb627'], shape: SH_DROP, speed: 90, g: 300, size: 4, life: 0.6, up: 80 });
      showPop('+1 蜂蜜', '#ffe27a', '#a8650a');
      if (G.honey === G.def.nectar) {
        if (G.fruits < G.def.fruit) { showBanner('蜂蜜收集完成！再去授粉吧', 2.6, 2, '#a8650a'); jingleGoal(); }
      } else if (G.tutorial === 2 && G.honey === 1) { showBanner('就是這樣！再去採更多花蜜', 3, 1); G.tutorial = 3; }
    }

}

function updateHazards(dt) {
  // 蜘蛛網
  for (const w of G.webs) {
    w.cool = Math.max(0, w.cool - dt); w.wob = Math.max(0, w.wob - dt * 1.5);
    if (bee.stuck <= 0 && bee.inv <= 0 && w.cool <= 0 && !G.done && Math.hypot(bee.x - w.x, bee.y - w.y) < w.r * 0.78 + 10) {
      hitBee(w.x, w.y, 'web');
      bee.stuck = 1.3; bee.stuckWeb = w; bee.inv = 2.8; w.wob = 1;

    }
  }
  // 虎頭蜂
  let danger = false;
  for (const h of G.hornets) {
    h.t += dt; h.st += dt; h.warn = Math.max(0, h.warn - dt);
    const dx = bee.x - h.x, dy = bee.y - h.y, d = Math.hypot(dx, dy) || 1;
    if (h.state === 'patrol') {

      const ox = h.x;
      h.x = lerp(h.x, tx, Math.min(1, dt * 2)); h.y = lerp(h.y, ty, Math.min(1, dt * 2));
      if (Math.abs(h.x - ox) > 0.05) h.face = h.x > ox ? 1 : -1;

        h.state = 'alert'; h.st = 0; h.warn = 1;
        if (onScreen(h.x)) sfx('bee_hornet', { pan: panW(h.x), gap: 600 });
        showBanner('虎頭蜂生氣了！快飛走', 1.6, 2, '#c0601e');
      }
    } else if (h.state === 'alert') {
      h.face = dx > 0 ? 1 : -1;
      if (h.st > 0.8) { h.state = 'chase'; h.st = 0; }
    } else if (h.state === 'chase') {

  if (wd) {
    wd.t -= dt;
    if (wd.state === 'calm') { wd.k = Math.max(0, wd.k - dt * 0.8); if (wd.t <= 0) { wd.state = 'gust'; wd.t = 2.8; wd.dir = Math.random() < 0.5 ? -1 : 1; sfx('bee_gust', { pan: wd.dir * 0.5 }); } }
    else { wd.k = Math.min(1, wd.k + dt * 1.2); if (wd.t <= 0) { wd.state = 'calm'; wd.t = 4 + Math.random() * 2.5; } if (Math.random() < dt * 8) spawnWindLeaf(wd.dir); }
  }
}
function spawnDrop(c) { if (G.drops.length < 80) G.drops.push({ x: c.x + rand(-70, 70), y: c.y + 22, vy: rand(300, 360) }); }
function spawnWindLeaf(dir) {
  const p = allocP();
  const s = G.season;
  p.on = true; p.world = false; p.x = dir > 0 ? -10 : W + 10; p.y = rand(H * 0.15, H * 0.8);
  p.vx = dir * rand(260, 380); p.vy = rand(-30, 30); p.life = 0; p.max = 3; p.size = rand(5, 8);
  p.color = s.fall[Math.floor(Math.random() * s.fall.length)]; p.shape = s.fallShape === SH_DOT ? SH_PETAL : s.fallShape; p.rot = rand(0, TAU); p.vr = rand(-6, 6); p.g = 10; p.drag = 1;
}

function updateFlowers(dt) {
  const wk = G.wind ? G.wind.k * G.wind.dir : 0;
  for (const f of G.flowers) {
    f.cool = Math.max(0, f.cool - dt);
    f.pulse = Math.max(0, f.pulse - dt * 1.5);
    if (!f.nectar && !f.fruit) { f.regen -= dt; if (f.regen <= 0) { f.nectar = true; if (onScreen(f.hx, 0)) burst(f.hx, f.hy, { n: 4, colors: ['#fff6a8'], shape: SH_SPARK, speed: 40, g: 0, size: 5, life: 0.5 }); } }
    const sway = Math.sin(time * 1.5 + f.ph) * 5 * (f.h / 220) + wk * 14 * (f.h / 220) + Math.sin(time * 3.1 + f.ph) * wk * 3;
    f.hx = f.x + sway + f.lean * f.h;
    f.hy = GROUND - f.h + Math.abs(sway) * 0.15;
    const want = bee.pollen === f.c && bee.from !== f.id && !f.fruit ? 1 : 0;

}
function updateAmbient(dt) {

  for (const b of butterflies) {
    b.t += dt;
    if (b.y === 0) { b.x = camX + Math.random() * viewW; b.y = rand(120, GROUND - 120); b.vx = rand(-30, 30); }
    else if (b.x < camX - 140) { b.x = camX + viewW + 60; b.y = rand(120, GROUND - 120); }
    else if (b.x > camX + viewW + 140) { b.x = camX - 60; b.y = rand(120, GROUND - 120); }
    b.vx += Math.sin(b.t * 0.7 + b.ph) * 20 * dt; b.vy = Math.sin(b.t * 1.9 + b.ph) * 30 + Math.cos(b.t * 0.6) * 12;

  const rate = KG.lowEnd ? 0.9 : 1.6;
  while (ambT > 1 / rate) {
    ambT -= 1 / rate;
    const s = G.season, p = allocP();
    p.on = true; p.world = false; p.x = rand(-20, W + 20); p.y = -10; p.vx = rand(-15, 25); p.vy = rand(25, 45);
    p.life = 0; p.max = (H + 40) / 35; p.size = s.fallShape === SH_DOT ? rand(1.5, 3) : rand(4, 6.5);
    p.color = s.fall[Math.floor(Math.random() * s.fall.length)]; p.shape = s.fallShape; p.rot = rand(0, TAU); p.vr = rand(-2, 2); p.g = 0; p.drag = 1;

function updatePlay(dt) {
  updateFlowers(dt);
  updateAmbient(dt);
  if (G.sub === 'card') { G.cardT += dt; updateCamera(false, dt); return; }
  if (G.sub === 'play') G.t += dt;
  bee.inv = Math.max(0, bee.inv - dt);
  bee.squash = lerp(bee.squash, 1, Math.min(1, dt * 6));
  bee.flap += dt * (34 + Math.hypot(bee.vx, bee.vy) * 0.04);
  if (beePop.t < 9) beePop.t += dt;
  if (G.sub === 'done') {
    G.endT += dt;
    // 開心地繞圈圈
    bee.vx = Math.cos(G.endT * 4) * 140; bee.vy = Math.sin(G.endT * 4) * 140;
    bee.x += bee.vx * dt; bee.y = clamp(bee.y + bee.vy * dt, 60, GROUND - 40);
    bee.face = bee.vx > 0 ? 1 : -1;
    updateCamera(false, dt);
    if (G.endT > 1.8 && !Result.on) finishLevel();
    if (buzz) buzz.set(0, 0);
    return;
  }
  updateBee(dt);
  updateCamera(false, dt);
  updateSip(dt);
  updateHive(dt);
  updateHazards(dt);
  // 音樂跟著遊戲變化
  const d = G.def;
  const prog = (Math.min(G.honey, d.nectar) + Math.min(G.fruits, d.fruit)) / (d.nectar + d.fruit);
  if (!G.stretch && prog >= 0.75) { G.stretch = true; if (M) { M.setTempo(1.06); M.setLayer('top', true); } }
  const busy = bee.nectar > 0;
  if (busy !== layerState.busy) { layerState.busy = busy; if (M) M.setLayer('busy', busy); }
  if (G.danger !== layerState.danger) { layerState.danger = G.danger; if (M) M.setLayer('danger', G.danger); }
  // 翅膀聲（音效重新打開時再接上）
  if (!buzz && sfxOn) startBuzz();
  if (buzz) {
    G.buzzT = (G.buzzT || 0) - dt;
    if (G.buzzT <= 0) {
      G.buzzT = 0.07;
      const sp = clamp(Math.hypot(bee.vx, bee.vy) / MAXV, 0, 1);
      if (bee.stuck > 0) buzz.set(0.32, 0.05); else buzz.set(0.04 + sp * 0.2, 0.018 + sp * 0.04);
    }
  }
  if (!G.done && G.honey >= d.nectar && G.fruits >= d.fruit) {
    G.done = true; G.sub = 'done'; G.endT = 0;
    jingleClear();
    showBanner('過關了！', 3, 3, '#3f8a2a');
    const [sx, sy] = toScreen(bee.x, bee.y);
    burst(sx, sy, { n: 30, colors: ['#ffd84a', '#ff9dd2', '#69b6ff', '#b6f5a6', '#ffffff'], shape: SH_STAR, speed: 320, g: 260, size: 8, life: 1.4, world: false });
    if (M) M.setLayer('danger', false);
  }
}

function finishLevel() {
  const d = G.def, i = G.lvl;
  let st = 1;
  if (G.t <= G.par) st++;
  if (G.hits === 0) st++;
  const earned = G.delivered + G.fruits * 2 + st * 5;
  const first = !(stars[i] > 0);
  honeyBank += earned; honeyTotal += G.delivered;
  stars[i] = Math.max(stars[i] || 0, st);
  const prevBest = bestTime[i];
  if (!prevBest || G.t < prevBest) bestTime[i] = Math.round(G.t * 10) / 10;
  saveAll();
  stopBuzz();
  Result.show({ stars: st, earned, time: G.t, par: G.par, hits: G.hits, fruits: G.fruits, honey: G.delivered, first, last: i === LEVELS.length - 1 });
  after(2.6, () => { if (Result.on) playSong(SONG_TITLE); });
}

function setPaused(p) {
  if (scene !== 'play' || Result.on || p === paused || G.sub === 'done') return;
  paused = p;
  if (p) {
    if (M) M.pause();
    if (buzz) buzz.set(0, 0);
    ptr.active = false; keys.l = keys.r = keys.u = keys.d = 0;
    focusId = null;
    stopSay();
  } else if (M) M.resume();

}

/* ---------- 結算 ---------- */
const Result = {
  on: false, t: 0, o: null, shown: 0, panel: { s: 0 },
  show(o) { this.on = true; this.t = 0; this.o = o; this.shown = 0; this.panel.s = 0; killTweens(this.panel); tween(this.panel, { s: 1 }, 0.5, 'outBack'); focusId = null; },
  hide() { this.on = false; },
  update(dt) {
    if (!this.on) return;
    this.t += dt;
    while (this.shown < 3 && this.t > 0.7 + this.shown * 0.38) {
      if (this.shown < this.o.stars) {
        sfx('star', { pitch: 1 + this.shown * 0.12, exact: true });
        const p = this.starPos(this.shown);
        burst(p[0], p[1], { n: 14, colors: ['#ffe066', '#fff', '#ffb02e'], speed: 240, g: 300, size: 7, world: false });
      }
      this.shown++;
    }
  },
  geom() { const pw = Math.min(W - 32, 420), ph = Math.min(H - 76, 400); return { x: (W - pw) / 2, y: Math.max(58, (H - ph) / 2 + 14), w: pw, h: ph }; },
  starPos(i) { const g = this.geom(); return [W / 2 + (i - 1) * g.w * 0.22, g.y + g.h * 0.2 - (i === 1 ? 10 : 0)]; },
  draw() {
    if (!this.on) return;
    const o = this.o, g = this.geom(), k = g.h / 400;
    ctx.fillStyle = 'rgba(70,45,10,' + (0.45 * Math.min(1, this.t * 3)) + ')'; ctx.fillRect(0, 0, W, H);
    const s = this.panel.s;
    ctx.save();
    ctx.translate(W / 2, g.y + g.h / 2); ctx.scale(s, s); ctx.translate(-W / 2, -(g.y + g.h / 2));
    ctx.save(); ctx.translate(W / 2, g.y + g.h * 0.2); ctx.rotate(time * 0.4);
    ctx.fillStyle = 'rgba(255,230,150,0.22)';
    for (let i = 0; i < 12; i++) { ctx.rotate(TAU / 12); ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(-26, g.w * 0.7); ctx.lineTo(26, g.w * 0.7); ctx.fill(); }
    ctx.restore();
    rr(g.x, g.y + 10, g.w, g.h, 30); ctx.fillStyle = 'rgba(90,50,10,0.3)'; ctx.fill();
    rr(g.x, g.y, g.w, g.h, 30); ctx.fillStyle = '#fffaf0'; ctx.fill(); ctx.lineWidth = 7; ctx.strokeStyle = '#f0a020'; ctx.stroke();
    const title = o.last && o.first ? '全部完成了！' : (o.stars === 3 ? '太完美了！' : '過關了！');
    const bw = g.w * 0.8, bh = 48 * k, by = g.y - bh * 0.5;
    rr(W / 2 - bw / 2, by, bw, bh, 14); ctx.fillStyle = '#f9b522'; ctx.fill(); ctx.strokeStyle = '#b0730a'; ctx.lineWidth = 3; ctx.stroke();
    txt(title, W / 2, by + bh / 2 + 1, Math.min(26 * k, bw / 7), '#fff', { stroke: '#a0600a', sw: 6 });
    for (let i = 0; i < 3; i++) {
      const p = this.starPos(i), on = i < this.shown && i < o.stars;
      let kk = 1;
      if (on) { const tt = this.t - (0.7 + i * 0.38); kk = tt < 0.4 ? Ease.outElastic(clamp(tt / 0.4, 0, 1)) : 1 + Math.sin(time * 3 + i) * 0.03; }
      glossyStar(p[0], p[1], (i === 1 ? 40 : 33) * k * (on ? kk : 1), on, on ? Math.sin(time * 2 + i) * 0.08 : 0);
    }
    // 三顆星的條件
    const lf = Math.min(17 * k, (g.w - 40) / 14);
    const rows = [['完成任務', true], ['在 ' + fmtTime(o.par) + ' 內完成（用了 ' + fmtTime(o.time) + '）', o.time <= o.par], ['沒有被碰到', o.hits === 0]];
    let ty = g.y + g.h * 0.38;
    const lx = g.x + Math.max(24, g.w * 0.08);
    for (const [label, ok] of rows) {
      ctx.fillStyle = ok ? '#52c25e' : 'rgba(120,90,40,0.2)'; ctx.beginPath(); circ(lx + 10, ty, 10); ctx.fill();
      if (ok) drawIcon('check', lx + 10, ty, 12, '#fff');
      txt(label, lx + 28, ty + 1, lf, ok ? INK : 'rgba(90,58,20,0.55)', { align: 'left', shadow: false, weight: '800' });
      ty += lf * 1.75;
    }
    ty += 4;
    honeyDrop(W / 2 - 54 * k, ty, 10 * k, true);
    txt('蜂蜜 +' + o.earned, W / 2 + 6 * k, ty + 1, 21 * k, '#b06a00', { stroke: '#fff', sw: 5, shadow: false });

      txt(it.name, tx, y + ch * 0.34, nf, INK, { align: 'left', shadow: false, weight: '800' });
      if (own) txt(status, tx, y + ch * 0.7, nf * 0.82, active ? '#3f8a2a' : '#a0804a', { align: 'left', shadow: false, weight: '700' });
      else {
        honeyDrop(tx + 6, y + ch * 0.68, 6.5, true);
        txt(String(it.price), tx + 18, y + ch * 0.7, nf, honeyBank >= it.price ? '#a0600a' : '#c0a080', { align: 'left', shadow: false });
      }
    }
  });
  const bh = 46;
  button('hBack', 16, H - bh - 14, Math.min(130, W * 0.32), bh, { label: '返回', icon: 'back', color: 'white', size: 18, onClick: () => { if (hiveFrom === 'title') goTitle(); else goMap(); } });
  if (wide) drawBanner(H * 0.42, W * 0.25, W * 0.45 - 40); else drawBanner(sy + sh * 0.35);
}

/* =====================================================================
 * 輸入
 * ===================================================================== */
function toLocal(e) {
  const r = cv.getBoundingClientRect();
  return [(e.clientX - r.left) * W / (r.width || W), (e.clientY - r.top) * H / (r.height || H)];
}
function canSteer() { return scene === 'play' && G.sub === 'play' && !paused && !Result.on; }
cv.addEventListener('pointerdown', (e) => {
  e.preventDefault();
  kbMode = false;
  const [x, y] = toLocal(e);
  const b = hitBtn(x, y);
  if (b) { pressed = { id: b.id, pid: e.pointerId }; if (!b.silent) sfx('click', { vol: 0.7 }); return; }
  if (canSteer()) {
    ptr.active = true; ptr.sx = x; ptr.sy = y; ptr.touch = e.pointerType !== 'mouse'; ptr.id = e.pointerId;
    try { cv.setPointerCapture(e.pointerId); } catch (er) { /* 忽略 */ }
  }
});
cv.addEventListener('pointermove', (e) => {
  if (!canSteer()) return;
  const [x, y] = toLocal(e);
  if (e.pointerType === 'mouse') { if (!pressed) { ptr.active = true; ptr.touch = false; ptr.sx = x; ptr.sy = y; ptr.id = e.pointerId; } }
  else if (ptr.active && ptr.id === e.pointerId) { ptr.sx = x; ptr.sy = y; }
});
function endPointer(e, cancel) {
  const [x, y] = toLocal(e);
  if (pressed && pressed.pid === e.pointerId) {
    const b = hitBtn(x, y), id = pressed.id;
    pressed = null;
    if (!cancel && b && b.id === id && b.onClick) { sfx('ui', { vol: 0.8 }); b.onClick(); }
    return;
  }
  if (ptr.id === e.pointerId && ptr.touch) ptr.active = false;
}
cv.addEventListener('pointerup', (e) => endPointer(e, false));
cv.addEventListener('pointercancel', (e) => endPointer(e, true));
cv.addEventListener('pointerleave', (e) => { if (e.pointerType === 'mouse') ptr.active = false; });
cv.addEventListener('contextmenu', (e) => e.preventDefault());
const KEYMAP = { ArrowLeft: 'l', ArrowRight: 'r', ArrowUp: 'u', ArrowDown: 'd', a: 'l', d: 'r', w: 'u', s: 'd', A: 'l', D: 'r', W: 'u', S: 'd' };
window.addEventListener('keydown', (e) => {
  const k = e.key;
  if (scene === 'play' && !Result.on) {
    if (G.sub === 'card') {
      if (k === 'Enter' || k === ' ') { e.preventDefault(); beginPlay(); return; }
    } else if (G.sub === 'play') {
      if (k === 'Escape' || k === 'p' || k === 'P') { e.preventDefault(); setPaused(!paused); kbMode = true; return; }
      if (!paused && KEYMAP[k]) { keys[KEYMAP[k]] = 1; e.preventDefault(); ptr.active = false; return; }
    }
    if (!paused && G.sub !== 'card') return;
  }
  if (k === 'ArrowRight' || k === 'ArrowDown' || (k === 'Tab' && !e.shiftKey)) { kbMode = true; focusMove(1); e.preventDefault(); }
  else if (k === 'ArrowLeft' || k === 'ArrowUp' || (k === 'Tab' && e.shiftKey)) { kbMode = true; focusMove(-1); e.preventDefault(); }
  else if (k === 'Enter' || k === ' ') { e.preventDefault(); kbMode = true; focusPress(); }
  else if (k === 'Escape') { if (scene === 'map') goTitle(); else if (scene === 'hive') { if (hiveFrom === 'title') goTitle(); else goMap(); } }
});
window.addEventListener('keyup', (e) => { if (KEYMAP[e.key]) keys[KEYMAP[e.key]] = 0; });
window.addEventListener('blur', () => { keys.l = keys.r = keys.u = keys.d = 0; });
document.addEventListener('visibilitychange', () => {
  if (document.hidden) {
    if (buzz) buzz.set(0, 0);
    if (scene === 'play' && G.sub === 'play' && !paused && !Result.on) setPaused(true);
  }
});

/* =====================================================================
 * 主迴圈
 * ===================================================================== */
function resize() {
  const r = cv.getBoundingClientRect();
  W = Math.max(1, r.width || innerWidth); H = Math.max(1, r.height || innerHeight);
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
  U = clamp(Math.min(W / 400, H / 700), 0.75, 1.5);
  SC = Math.min(H / 500, W / 300);
  for (const k in gradCache) delete gradCache[k];
  wrapCache.clear();
  updateCamera(true);
}
window.addEventListener('resize', resize);
window.addEventListener('orientationchange', () => setTimeout(resize, 120));
if (window.visualViewport) window.visualViewport.addEventListener('resize', resize);

function step(dt) {
  time += dt; sceneT += dt;
  if (shakeT > 0) shakeT -= dt;
  if (!paused) {
    updateTweens(dt); updateTimers(dt); updateParts(dt);
    if (banner.t < banner.dur) banner.t += dt;
    if (scene === 'play') updatePlay(dt);
    else if (scene === 'title') updateTitle(dt);
    else if (Math.random() < dt * 1.2) {
      const p = allocP();
      p.on = true; p.world = false; p.x = rand(0, W); p.y = -10; p.vx = rand(-10, 20); p.vy = rand(25, 40); p.life = 0; p.max = H / 30;
      p.size = rand(4, 6); p.color = SEASONS[0].fall[Math.floor(Math.random() * 3)]; p.shape = SH_PETAL; p.rot = rand(0, TAU); p.vr = rand(-2, 2); p.g = 0; p.drag = 1;
    }
  }
  Result.update(dt);
}
function render() {
  btnReg = [];
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  if (scene === 'title') drawTitle();
  else if (scene === 'map') drawMap();
  else if (scene === 'hive') drawHiveScene();
  else if (scene === 'play') drawPlay();
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  if (scene === 'play' && Result.on) { btnReg = []; Result.draw(); drawParts(false); }
  if (scene === 'play' && paused) { btnReg = []; drawPause(); }
}
let last = performance.now();
const perfStat = { n: 0, sum: 0, max: 0 };
function frame(now) {
  const dt = Math.min(0.05, Math.max(0, (now - last) / 1000));
  last = now;
  const t0 = performance.now();
  try { step(dt); render(); } catch (err) { console.error(err); }
  const ft = performance.now() - t0;
  perfStat.n++; perfStat.sum += ft; if (ft > perfStat.max) perfStat.max = ft;
  requestAnimationFrame(frame);
}
resize();
demoInit();
playSong(SONG_TITLE);
requestAnimationFrame((t) => { last = t; frame(t); });

/* ---------- 測試用 ---------- */
function autoTarget() {
  const d = G.def;
  const needHoney = d.nectar - G.honey;
  if (bee.nectar >= CAP || (bee.nectar > 0 && bee.nectar >= needHoney)) return [G.hive.ex, G.hive.ey];
  if (G.fruits < d.fruit && bee.pollen >= 0) {
    let best = null, bd = 1e9;
    for (const f of G.flowers) { if (f.fruit || f.c !== bee.pollen || f.id === bee.from || f.cool > 0) continue; const dd = Math.abs(f.x - bee.x); if (dd < bd) { bd = dd; best = f; } }
    if (best) return [best.hx, best.hy - 4];
  }
  let best = null, bd = 1e9;
  for (const f of G.flowers) {
    if (!visitable(f)) continue;
    if (needHoney <= 0 && !(G.fruits < d.fruit)) continue;
    if (!f.nectar && G.fruits >= d.fruit) continue;
    const pairs = G.flowers.filter(q => q.c === f.c && !q.fruit).length;
    const dd = Math.abs(f.x - bee.x) + Math.abs(f.hy - bee.y) * 0.3 + (G.fruits < d.fruit && pairs < 2 ? 600 : 0);
    if (dd < bd) { bd = dd; best = f; }
  }
  if (best) return [best.hx, best.hy - 4];
  if (bee.nectar > 0) return [G.hive.ex, G.hive.ey];
  return [bee.x, bee.y];
}
function autopilot() {
  if (!canSteer()) return;
  const [tx, ty] = autoTarget();
  const [sx, sy] = toScreen(tx, ty);
  ptr.active = true; ptr.touch = false; ptr.sx = sx; ptr.sy = sy;
}
window.__bee = {
  state: () => ({
    scene, lvl: G.lvl, sub: G.sub, paused, honey: G.honey, fruits: G.fruits, goal: [G.def.nectar, G.def.fruit], nectar: bee.nectar, pollen: bee.pollen,
    hits: G.hits, t: +G.t.toFixed(1), par: G.par, result: Result.on, stars: Result.on ? Result.o.stars : null, music: M ? M.isPlaying() : null,
    bee: [Math.round(bee.x), Math.round(bee.y)], cam: [Math.round(camX), Math.round(camY)], SC: +SC.toFixed(3), banner: banner.t < banner.dur ? banner.text : '',
    honeyBank, honeyTotal, outfit, totalStars: totalStars(), danger: G.danger, buzz: !!buzz, sipP: +bee.sipP.toFixed(2)
  }),
  start: i => startLevel(i || 0),
  begin: () => beginPlay(),
  go: s => { if (s === 'title') goTitle(); else if (s === 'map') goMap(); else if (s === 'hive') { hiveFrom = 'map'; goHive(); } },
  tick: (sec, auto) => { for (let i = 0; i < sec * 60; i++) { if (auto) autopilot(); step(1 / 60); } if (auto) ptr.active = false; },
  autoTarget: () => { const [x, y] = autoTarget(); const [sx, sy] = toScreen(x, y); return { x: Math.round(sx), y: Math.round(sy) }; },
  flowers: () => G.flowers.map(f => { const [sx, sy] = toScreen(f.hx, f.hy); return { id: f.id, c: f.c, x: Math.round(sx), y: Math.round(sy), nectar: f.nectar, fruit: f.fruit, wx: Math.round(f.x) }; }),
  hive: () => { const [sx, sy] = toScreen(G.hive.ex, G.hive.ey); return { x: Math.round(sx), y: Math.round(sy) }; },
  hazards: () => ({ webs: G.webs.map(w => [Math.round(w.x), w.y]), hornets: G.hornets.map(h => [Math.round(h.x), Math.round(h.y), h.state]), frogs: G.frogs.map(f => [Math.round(f.x), f.state]), clouds: G.clouds.map(c => [Math.round(c.x), c.phase]), wind: G.wind ? G.wind.state : null }),
  setBee: (x, y) => { bee.x = x; bee.y = y; bee.vx = 0; bee.vy = 0; updateCamera(true); },
  give: (n) => { honeyBank += n; saveAll(); },
  unlockAll: () => { for (let i = 0; i < LEVELS.length; i++) stars[i] = Math.max(stars[i] || 0, 2); saveAll(); },
  reset: () => { stars = []; honeyBank = 0; honeyTotal = 0; owned = { none: 1 }; outfit = 'none'; decoOn = {}; bestTime = []; saveAll(); },
  shopTab: t => { shopTab = t; },
  pause: p => setPaused(p),
  btns: () => btnReg.map(b => ({ id: b.id, x: Math.round(b.x + b.w / 2), y: Math.round(b.y + b.h / 2) })),
  levels: () => LEVELS.length,
  perf: reset => { const r = { avg: perfStat.n ? +(perfStat.sum / perfStat.n).toFixed(2) : 0, max: +perfStat.max.toFixed(1), n: perfStat.n }; if (reset) { perfStat.n = 0; perfStat.sum = 0; perfStat.max = 0; } return r; }
};
})();
</script>
