<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>貓狗圈圈叉</title>
<link rel="stylesheet" href="../../assets/common.css">
<style>
  html, body { height: 100%; overflow: hidden; }
  body { height: 100vh; height: 100dvh; touch-action: none; position: relative; background: #bfe6ff; }
  #scene { position: absolute; inset: 0; width: 100%; height: 100%; }
  .drift { animation: drift linear infinite; }
  @keyframes drift { from { transform: translateX(-200px); } to { transform: translateX(1400px); } }
  .sway { transform-box: fill-box; transform-origin: 50% 100%; animation: swayA 3s ease-in-out infinite alternate; }
  @keyframes swayA { from { transform: rotate(-4deg); } to { transform: rotate(4deg); } }
  .twk { animation: twk 1.6s ease-in-out infinite alternate; }
  @keyframes twk { from { opacity: .25; } to { opacity: 1; } }
  .fall { animation: fall linear infinite; }
  @keyframes fall { from { transform: translateY(-40px); } to { transform: translateY(900px); } }

  /* 木頭招牌 HUD */
  #sign { position: fixed; top: 10px; left: 50%; transform: translateX(-50%); z-index: 8000; pointer-events: none;
    padding: 8px 22px 10px; border-radius: 16px; font-size: 20px; font-weight: 900; color: #fff7e6; white-space: nowrap;
    background: repeating-linear-gradient(90deg, rgba(120,60,20,.12) 0 3px, transparent 3px 16px), linear-gradient(180deg, #d99a5c, #b06e35);
    border: 3px solid #8a5326; box-shadow: 0 5px 0 #6f4019, 0 10px 16px rgba(0,0,0,.25), inset 0 2px 0 rgba(255,255,255,.35);
    text-shadow: 0 2px 0 #6f4019; display: flex; align-items: center; gap: 8px; }
  #sign::before, #sign::after { content: ""; position: absolute; top: 50%; width: 8px; height: 8px; margin-top: -4px; border-radius: 50%; background: #6f4019; box-shadow: inset 0 1px 0 rgba(255,255,255,.4); }
  #sign::before { left: 8px; } #sign::after { right: 8px; }

  #app { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; padding: 68px 12px 12px; }
  #versus { display: flex; align-items: center; justify-content: center; gap: 8px; width: min(100%, 520px); }
  .avatar { flex: 1; max-width: 200px; display: flex; flex-direction: column; align-items: center; position: relative; padding: 4px 6px 8px; border-radius: 24px;
    background: rgba(255,255,255,.7); border: 4px solid #fff; box-shadow: 0 6px 0 rgba(0,0,0,.08), 0 10px 18px rgba(0,0,0,.12); transition: transform .25s cubic-bezier(.3,1.7,.5,1), box-shadow .25s; }
  .avatar.turn { transform: scale(1.06); box-shadow: 0 0 0 5px #ffd23f, 0 10px 18px rgba(0,0,0,.18); }
  .avatar .pic { width: min(96px, 22vw); aspect-ratio: 1; animation: breathe 2.6s ease-in-out infinite; transform-origin: 50% 90%; }
  .avatar .pic svg { width: 100%; height: 100%; overflow: visible; }
  .avatar.happy .pic { animation: hop .6s cubic-bezier(.3,1.6,.5,1) 2; }
  .avatar.sad .pic { animation: wobble .5s ease 2; }
  @keyframes breathe { 0%,100% { transform: scale(1, 1); } 50% { transform: scale(1.03, .97); } }
  @keyframes hop { 0% { transform: scale(1,1); } 25% { transform: scale(1.15,.85); } 55% { transform: translateY(-22px) scale(.92,1.1); } 100% { transform: translateY(0) scale(1,1); } }
  @keyframes wobble { 0%,100% { transform: rotate(0); } 25% { transform: rotate(-8deg); } 75% { transform: rotate(8deg); } }
  .avatar .name { font-weight: 900; font-size: 16px; color: #fff; background: var(--nc, #ff8a3d); border-radius: 999px; padding: 1px 12px; margin-top: -4px; box-shadow: 0 3px 0 rgba(0,0,0,.15); white-space: nowrap; }
  .pips { display: flex; gap: 4px; margin-top: 4px; min-height: 26px; align-items: center; font-weight: 900; font-size: 20px; }
  .pips svg { width: 24px; height: 24px; }
  .vs { font-size: 34px; font-weight: 900; color: #fff; -webkit-text-stroke: 6px #e8507f; paint-order: stroke fill; text-shadow: 0 4px 0 #e8507f; animation: gkPulse 1.2s ease-in-out infinite; }

  .cloth {
    --bs: min(86vw, calc(100dvh - 330px), 440px);
    width: calc(var(--bs) + 30px); height: calc(var(--bs) + 30px); padding: 15px; border-radius: 26px; flex: none;
    background: repeating-linear-gradient(0deg, rgba(255,255,255,.55) 0 16px, transparent 16px 32px), repeating-linear-gradient(90deg, rgba(255,255,255,.55) 0 16px, transparent 16px 32px), var(--cloth, #f0627b);
    box-shadow: 0 14px 30px rgba(40,60,30,.35), inset 0 0 0 4px rgba(255,255,255,.4); transform: rotate(-1.5deg);
  }
  @supports not (height: 100dvh) { .cloth { --bs: min(86vw, calc(100vh - 330px), 440px); } }
  .board { position: relative; width: 100%; height: 100%; transform: rotate(1.5deg); border-radius: 22px; padding: 4%;
    background: repeating-linear-gradient(92deg, rgba(120,60,20,.07) 0 3px, transparent 3px 14px), linear-gradient(160deg, #e5b27a 0%, #c98b4e 55%, #b3763d 100%);
    box-shadow: 0 8px 0 #8a5527, 0 14px 22px rgba(0,0,0,.25), inset 0 3px 0 rgba(255,255,255,.35);
    display: grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(3, 1fr); gap: 4%; }
  .cell { position: relative; border: none; padding: 0; cursor: pointer; border-radius: 18%;
    background: radial-gradient(circle at 35% 30%, #fff6e6 0%, #f6dcb4 60%, #edc995 100%);
    box-shadow: inset 0 -5px 0 rgba(150,90,40,.25), inset 0 3px 0 rgba(255,255,255,.7), 0 3px 4px rgba(90,50,20,.25); transition: transform .15s cubic-bezier(.3,1.8,.5,1); }
  .cell:active:not(.filled) { transform: scale(.9); }
  .cell.filled { cursor: default; }
  .cell svg.piece { position: absolute; inset: 7%; width: 86%; height: 86%; overflow: visible; animation: pop .5s cubic-bezier(.2,1.8,.4,1) both; filter: drop-shadow(0 5px 3px rgba(90,50,20,.3)); }
  .cell.win svg.piece { animation: pop .5s cubic-bezier(.2,1.8,.4,1) both, happy .5s ease-in-out .5s infinite alternate; }
  .cell.dim svg.piece { opacity: .55; filter: grayscale(.4); transition: opacity .4s; }
  @keyframes pop { 0% { transform: scale(0) rotate(-30deg); } 60% { transform: scale(1.15, .9); } 100% { transform: scale(1) rotate(0); } }
  @keyframes happy { from { transform: translateY(0) rotate(-6deg) scale(1); } to { transform: translateY(-9%) rotate(6deg) scale(1.06); } }
  .board.shake { animation: gkShake .4s ease; }
  .eye { animation: blink 4s infinite; transform-box: fill-box; transform-origin: center; }
  @keyframes blink { 0%, 92%, 100% { transform: scaleY(1); } 95% { transform: scaleY(.1); } }
  .tear { animation: tear 1s ease-in infinite; }
  @keyframes tear { from { transform: translateY(0); opacity: 1; } to { transform: translateY(14px); opacity: 0; } }
  svg.line { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; overflow: visible; z-index: 2; }
  svg.line line { stroke-linecap: round; stroke-dasharray: 600; stroke-dashoffset: 600; animation: draw .55s ease-out forwards; }
  @keyframes draw { to { stroke-dashoffset: 0; } }

  #status { font-size: 20px; font-weight: 900; color: #6b3a1a; background: rgba(255,255,255,.88); border: 3px solid #fff; border-radius: 999px; padding: 6px 20px; box-shadow: 0 4px 0 rgba(0,0,0,.1); min-height: 44px; display: flex; align-items: center; }
  .think span { display: inline-block; animation: kg-bounce .8s ease-in-out infinite; }
  .think span:nth-child(2) { animation-delay: .15s; } .think span:nth-child(3) { animation-delay: .3s; }

  .skins { position: relative; display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; align-items: center; background: rgba(255,255,255,.7); padding: 6px 12px; border-radius: 22px; border: 3px solid #fff; }
  .skins b { font-size: 16px; color: #8a4a1a; }
  @media (max-width: 520px) { .skins b { flex-basis: 100%; } .skin { width: 54px; height: 54px; } }
  .skin { position: relative; width: 58px; height: 58px; border-radius: 50%; border: 4px solid #fff; background: radial-gradient(circle at 40% 30%, #fff, #ffe9d6); cursor: pointer; padding: 2px; box-shadow: 0 4px 0 rgba(0,0,0,.12); }
  .skin svg { width: 100%; height: 100%; }
  .skin.on { border-color: #ffb020; transform: scale(1.1); }
  .skin.locked svg.f { filter: grayscale(1) brightness(.6); opacity: .5; }
  .skin .lk { position: absolute; inset: 10px; }
  .skin .need { position: absolute; bottom: -8px; left: 50%; transform: translateX(-50%); font-size: 12px; font-weight: 900; background: #ffd23f; color: #7a4a00; border-radius: 99px; padding: 0 6px; white-space: nowrap; }

  @media (orientation: landscape) and (max-height: 600px) {
    #app { flex-direction: row; padding: 64px 14px 10px; gap: 14px; }
    .cloth { --bs: min(calc(100dvh - 104px), 52vw, 440px); }
    #versus { display: contents; }
    .avatar { flex: none; width: 150px; }
    .vs { display: none; }
    #catCard { order: 0; } .cloth { order: 1; } #dogCard { order: 2; }
    #status { position: fixed; bottom: 8px; left: 12px; font-size: 15px; min-height: 36px; padding: 2px 16px; z-index: 5; }
  }
</style>
</head>
<body>
<svg id="scene" viewBox="0 0 1000 1000" preserveAspectRatio="xMidYMid slice" aria-hidden="true"></svg>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs id="defs"></defs></svg>
<div id="sign" hidden></div>
<div id="app" hidden>
  <div id="versus">
    <div class="avatar" id="catCard" style="--nc:#ff8a3d"><div class="pic"></div><div class="name">你</div><div class="pips"></div></div>
    <div class="vs">VS</div>
    <div class="avatar" id="dogCard" style="--nc:#8a5a3c"><div class="pic"></div><div class="name"></div><div class="pips"></div></div>
  </div>
  <div class="cloth"><div class="board" id="board"></div></div>
  <div id="status"></div>
</div>

<script src="../../assets/common.js"></script>
<script id="gk-kit">
/* ===== GK 遊戲小工具（標題畫面、關卡選擇、獎勵畫面、特效、背景音樂）===== */
const GK = (function () {
  'use strict';
  const GK = {};
  // ---------- 緩動 ----------
  GK.ease = {
    outCubic: t => 1 - Math.pow(1 - t, 3),
    inOutSine: t => -(Math.cos(Math.PI * t) - 1) / 2,
    outBack: t => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); },
    outElastic: t => t === 0 ? 0 : t === 1 ? 1 : Math.pow(2, -10 * t) * Math.sin((t * 10 - 0.75) * (2 * Math.PI) / 3) + 1,
  };
  GK.lerp = (a, b, t) => a + (b - a) * t;
  GK.clamp = (v, a, b) => Math.max(a, Math.min(b, v));

  // ---------- 樣式 ----------
  const css = `
  [hidden] { display: none !important; }
  .gk-screen { position: fixed; inset: 0; z-index: 8900; display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 14px; padding: 70px 16px 24px; overflow: hidden; animation: kg-fade .3s ease; text-align: center; }
  .gk-screen.out { animation: gkOut .28s ease forwards; }
  @keyframes gkOut { to { opacity: 0; transform: scale(1.04); } }
  .gk-rays { position: absolute; left: 50%; top: 42%; width: 260vmax; height: 260vmax; margin: -130vmax 0 0 -130vmax; pointer-events: none;
    background: repeating-conic-gradient(rgba(255,255,255,.16) 0 10deg, rgba(255,255,255,0) 10deg 20deg); animation: gkSpin 40s linear infinite; }
  @keyframes gkSpin { to { transform: rotate(360deg); } }
  .gk-logo { position: relative; font-size: clamp(38px, 11vw, 76px); font-weight: 900; line-height: 1.05; letter-spacing: 2px; color: #fff; margin: 0;
    -webkit-text-stroke: 0; paint-order: stroke fill; }
  .gk-logo span { display: inline-block; animation: gkLetter .7s cubic-bezier(.2,1.8,.4,1) both, gkWave 2.4s ease-in-out infinite;
    text-shadow: 0 4px 0 var(--gk-dark,#c24470), 0 7px 0 var(--gk-dark,#c24470), 0 12px 16px rgba(0,0,0,.25);
    -webkit-text-stroke: 7px var(--gk-dark,#c24470); paint-order: stroke fill; }
  @keyframes gkLetter { from { transform: translateY(-80px) scale(.3); opacity: 0; } }
  @keyframes gkWave { 0%,100% { translate: 0 0; } 50% { translate: 0 -6px; } }
  .gk-sub { position: relative; font-size: 18px; font-weight: 800; color: var(--gk-dark,#c24470); background: rgba(255,255,255,.85);
    padding: 6px 18px; border-radius: 999px; box-shadow: 0 4px 0 rgba(0,0,0,.08); }
  .gk-art { position: relative; width: min(78vw, 46vh, 360px); aspect-ratio: 1; flex: none; }
  .gk-art > svg, .gk-art > canvas { width: 100%; height: 100%; display: block; overflow: visible; }
  .gk-row { position: relative; display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }
  .gk-btn { position: relative; font-family: var(--kg-font); font-weight: 900; color: #fff; border: 4px solid #fff; border-radius: 999px; cursor: pointer;
    font-size: 24px; padding: 12px 34px; min-height: 60px; letter-spacing: 2px;
    background: linear-gradient(180deg, #9cf08f 0%, #4cc75a 55%, #33a845 100%);
    box-shadow: 0 6px 0 #23803a, 0 12px 20px rgba(0,0,0,.25), inset 0 3px 0 rgba(255,255,255,.5);
    text-shadow: 0 2px 0 rgba(0,0,0,.2); transition: transform .12s cubic-bezier(.3,1.8,.5,1); }
  .gk-btn::after { content: ""; position: absolute; left: 14%; right: 14%; top: 6px; height: 34%; border-radius: 999px; background: rgba(255,255,255,.35); pointer-events: none; }
  .gk-btn:active { transform: translateY(4px) scale(.95); box-shadow: 0 2px 0 #23803a, 0 4px 8px rgba(0,0,0,.25); }
  .gk-btn.big { font-size: 30px; padding: 14px 52px; animation: gkPulse 1.4s ease-in-out infinite; }
  @keyframes gkPulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.07); } }
  .gk-btn.blue { background: linear-gradient(180deg, #9ee0ff 0%, #44a8f0 60%, #2f8ad6 100%); box-shadow: 0 6px 0 #1f64a8, 0 12px 20px rgba(0,0,0,.25), inset 0 3px 0 rgba(255,255,255,.5); }
  .gk-btn.pink { background: linear-gradient(180deg, #ffb3cc 0%, #ff6f9e 60%, #e8507f 100%); box-shadow: 0 6px 0 #b8325e, 0 12px 20px rgba(0,0,0,.25), inset 0 3px 0 rgba(255,255,255,.5); }
  .gk-btn.orange { background: linear-gradient(180deg, #ffd88a 0%, #ffa53a 60%, #f08a1c 100%); box-shadow: 0 6px 0 #b86010, 0 12px 20px rgba(0,0,0,.25), inset 0 3px 0 rgba(255,255,255,.5); }
  .gk-btn.small { font-size: 18px; padding: 8px 20px; min-height: 56px; }
  .gk-btn svg { width: 1.2em; height: 1.2em; vertical-align: -0.2em; }
  .gk-title2 { position: relative; font-size: clamp(28px, 8vw, 44px); font-weight: 900; color: #fff; margin: 0;
    -webkit-text-stroke: 6px var(--gk-dark,#c24470); paint-order: stroke fill; text-shadow: 0 5px 0 var(--gk-dark,#c24470), 0 10px 14px rgba(0,0,0,.2); }
  .gk-grid { position: relative; display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 14px; width: min(560px, 100%);
    max-height: calc(100% - 150px); overflow-y: auto; padding: 8px 6px 14px; touch-action: pan-y; }
  .gk-card { position: relative; border: 4px solid #fff; border-radius: 24px; padding: 8px 6px 6px; cursor: pointer; font-family: var(--kg-font);
    background: linear-gradient(180deg, #fff 0%, #fff3f8 100%); box-shadow: 0 6px 0 rgba(0,0,0,.12), 0 10px 18px rgba(0,0,0,.15);
    display: flex; flex-direction: column; align-items: center; gap: 4px; color: var(--kg-ink); animation: kg-pop .4s cubic-bezier(.2,1.6,.4,1) both;
    transition: transform .12s; min-height: 112px; }
  .gk-card:active { transform: scale(.93); }
  .gk-card .num { font-size: 30px; font-weight: 900; color: #fff; -webkit-text-stroke: 5px var(--gk-dark,#c24470); paint-order: stroke fill; line-height: 1.1; }
  .gk-card .pic { flex: none; width: 100%; aspect-ratio: 1.25; border-radius: 14px; overflow: hidden; display: grid; place-items: center; }
  .gk-card .pic > * { width: 100%; height: 100%; }
  .gk-card .lbl { font-size: 14px; font-weight: 800; }
  .gk-card.locked { filter: grayscale(.85); opacity: .75; cursor: default; }
  .gk-card .lock { position: absolute; inset: 0; display: grid; place-items: center; }
  .gk-card .lock svg { width: 46px; height: 46px; filter: drop-shadow(0 3px 2px rgba(0,0,0,.3)); }
  .gk-stars { display: flex; gap: 2px; justify-content: center; }
  .gk-stars svg { width: 24px; height: 24px; }
  .gk-total { position: relative; display: inline-flex; align-items: center; gap: 6px; font-size: 22px; font-weight: 900; background: rgba(255,255,255,.9);
    padding: 4px 16px 4px 8px; border-radius: 999px; border: 3px solid #fff; box-shadow: 0 4px 0 rgba(0,0,0,.1); color: var(--kg-ink); }
  .gk-total svg { width: 32px; height: 32px; }
  .gk-panel { position: relative; width: min(420px, 100%); background: linear-gradient(180deg, #fff 0%, #fff5f9 100%); border: 6px solid #fff; border-radius: 34px;
    padding: 64px 20px 22px; box-shadow: 0 14px 0 rgba(0,0,0,.08), 0 24px 40px rgba(0,0,0,.3); animation: kg-pop .45s cubic-bezier(.2,1.6,.4,1); }
  .gk-ribbon { position: absolute; left: 50%; top: -30px; transform: translateX(-50%); width: calc(100% + 28px); max-width: 96vw; padding: 12px 10px 16px; font-size: 30px; font-weight: 900; color: #fff;
    background: linear-gradient(180deg, var(--gk-light,#ff9fbe), var(--gk-mid,#ff6f9e)); border-radius: 18px; box-shadow: 0 6px 0 var(--gk-dark,#c24470), 0 10px 18px rgba(0,0,0,.2);
    -webkit-text-stroke: 5px var(--gk-dark,#c24470); paint-order: stroke fill; white-space: nowrap; }
  .gk-bigstars { display: flex; justify-content: center; align-items: flex-end; gap: 6px; margin: 2px 0 8px; }
  .gk-bigstars svg { width: 76px; height: 76px; animation: gkStar .55s cubic-bezier(.2,1.9,.4,1) both; filter: drop-shadow(0 5px 3px rgba(0,0,0,.18)); }
  .gk-bigstars svg:nth-child(2) { width: 96px; height: 96px; transform-origin: center; }
  @keyframes gkStar { from { transform: scale(0) rotate(-120deg); opacity: 0; } }
  .gk-msg { font-size: 20px; font-weight: 800; margin: 4px 0 10px; line-height: 1.45; color: var(--kg-ink); }
  .gk-unlock { margin: 0 0 14px; padding: 8px 12px; border-radius: 18px; background: linear-gradient(180deg, #fff6c8, #ffe58a); font-weight: 900; font-size: 18px;
    color: #8a5a00; animation: gkPulse 1.2s ease-in-out infinite; display: flex; align-items: center; justify-content: center; gap: 8px; }
  .gk-unlock svg { width: 40px; height: 40px; }
  #gk-fx { position: fixed; inset: 0; pointer-events: none; z-index: 9650; }
  .gk-float { position: fixed; z-index: 9660; pointer-events: none; font-weight: 900; font-size: 30px; color: #fff; white-space: nowrap;
    -webkit-text-stroke: 5px var(--c, #e8648d); paint-order: stroke fill; transform: translate(-50%, -50%); animation: gkFloat 1s ease-out forwards; }
  @keyframes gkFloat { 0% { transform: translate(-50%, -20%) scale(.4); opacity: 0; } 20% { transform: translate(-50%, -60%) scale(1.25); opacity: 1; }
    35% { transform: translate(-50%, -70%) scale(1); } 100% { transform: translate(-50%, -190%) scale(1); opacity: 0; } }
  .gk-callout { position: fixed; left: 50%; top: 38%; z-index: 9660; pointer-events: none; font-size: clamp(40px, 12vw, 72px); font-weight: 900; color: #fff6a8;
    -webkit-text-stroke: 8px var(--c, #e8648d); paint-order: stroke fill; text-shadow: 0 6px 0 var(--c, #e8648d), 0 12px 20px rgba(0,0,0,.25); white-space: nowrap;
    animation: gkCall 1.3s cubic-bezier(.2,1.6,.4,1) forwards; }
  @keyframes gkCall { 0% { transform: translate(-50%, -50%) scale(0) rotate(-12deg); } 25% { transform: translate(-50%, -50%) scale(1.15) rotate(3deg); }
    40% { transform: translate(-50%, -50%) scale(1) rotate(0); opacity: 1; } 80% { opacity: 1; } 100% { transform: translate(-50%, -80%) scale(1.05); opacity: 0; } }
  .gk-shake { animation: gkShake .4s ease; }
  @keyframes gkShake { 0%,100% { translate: 0 0; } 15% { translate: -9px 4px; } 30% { translate: 8px -5px; } 45% { translate: -6px 3px; } 60% { translate: 5px -2px; } 80% { translate: -2px 1px; } }
  .gk-rart { width: 120px; height: 120px; margin: 0 auto 6px; display: grid; place-items: center; }
  .gk-rart > img, .gk-rart > svg, .gk-rart > div { max-width: 120px; max-height: 120px; }
  .gk-head { position: relative; display: flex; flex-direction: column; align-items: center; gap: 8px; }
  @media (max-height: 560px) {
    .gk-head { flex-direction: row; gap: 14px; }
    .gk-rart { width: 74px; height: 74px; }
    .gk-rart > img, .gk-rart > svg, .gk-rart > div { max-width: 74px; max-height: 74px; }
    .gk-panel { padding: 40px 16px 14px; }
    .gk-bigstars svg { width: 50px; height: 50px; } .gk-bigstars svg:nth-child(2) { width: 62px; height: 62px; }
    .gk-ribbon { font-size: 24px; padding: 8px 10px 10px; top: -24px; }
    .gk-msg { font-size: 16px; margin: 2px 0 6px; }
    .gk-unlock { margin-bottom: 8px; padding: 4px 10px; }
    .gk-title2 { font-size: 28px; }
    .gk-total { font-size: 18px; } .gk-total svg { width: 26px; height: 26px; }
    .gk-grid { display: flex; overflow-x: auto; overflow-y: hidden; max-height: none; width: 100%; touch-action: pan-x; flex: none; padding: 6px 10px 10px; }
    .gk-grid .gk-card { flex: 0 0 108px; min-height: 0; }
    .gk-grid .gk-card .pic { height: 54px; aspect-ratio: auto; }
    .gk-lv > .gk-row:last-child { position: absolute; left: 14px; bottom: 12px; }
 .gk-art { width: min(40vw, 38vh, 260px); } .gk-screen { gap: 8px; padding-top: 60px; } .gk-logo { font-size: clamp(30px, 8vh, 56px); } }
  `;
  const st = document.createElement('style'); st.textContent = css; document.head.appendChild(st);

  // ---------- 圖示（自己畫的 SVG） ----------
  GK.starSVG = (on = true, id = '') => {
    const g = 'gks' + (on ? 'a' : 'b') + Math.random().toString(36).slice(2, 7);
    return `<svg viewBox="0 0 100 100" ${id}><defs><linearGradient id="${g}" x1="0" y1="0" x2="0" y2="1">${on
      ? '<stop offset="0" stop-color="#fff59a"/><stop offset=".55" stop-color="#ffd23f"/><stop offset="1" stop-color="#f7a21b"/>'
      : '<stop offset="0" stop-color="#eee6ee"/><stop offset="1" stop-color="#cfc3d3"/>'}</linearGradient></defs>
      <path d="M50 6 L62 36 L94 38 L69 58 L78 90 L50 72 L22 90 L31 58 L6 38 L38 36 Z" fill="url(#${g})" stroke="${on ? '#d9800f' : '#b3a5b8'}" stroke-width="6" stroke-linejoin="round"/>
      <path d="M50 18 L57 38 L40 40 Z" fill="#fff" opacity="${on ? .7 : .4}"/>${on ? '<circle cx="40" cy="56" r="4" fill="#7a3d00"/><circle cx="60" cy="56" r="4" fill="#7a3d00"/><path d="M44 65 Q50 70 56 65" stroke="#7a3d00" stroke-width="3" fill="none" stroke-linecap="round"/>' : ''}</svg>`;
  };
  GK.lockSVG = () => `<svg viewBox="0 0 60 60"><path d="M18 28 V20 a12 12 0 0 1 24 0 V28" stroke="#8a7a96" stroke-width="7" fill="none"/>
    <rect x="10" y="26" width="40" height="30" rx="8" fill="#ffd23f" stroke="#c7860f" stroke-width="4"/><circle cx="30" cy="39" r="5" fill="#8a5a00"/><rect x="28" y="40" width="4" height="9" rx="2" fill="#8a5a00"/>
    <rect x="15" y="30" width="10" height="5" rx="2.5" fill="#fff" opacity=".6"/></svg>`;
  GK.heartSVG = (on = true) => `<svg viewBox="0 0 60 56"><path d="M30 52 C8 38 2 26 6 16 C10 6 24 4 30 14 C36 4 50 6 54 16 C58 26 52 38 30 52Z" fill="${on ? '#ff5c7f' : '#e5d9e2'}" stroke="${on ? '#c42d55' : '#c4b6c0'}" stroke-width="4" stroke-linejoin="round"/>
    <ellipse cx="18" cy="18" rx="6" ry="4" fill="#fff" opacity=".7" transform="rotate(-30 18 18)"/></svg>`;
  GK.icons = {
    play: '<svg viewBox="0 0 40 40"><path d="M12 7 L33 20 L12 33 Z" fill="#fff" stroke="rgba(0,0,0,.15)" stroke-width="2" stroke-linejoin="round"/></svg>',
    replay: '<svg viewBox="0 0 40 40"><path d="M30 14 A12 12 0 1 0 32 24" stroke="#fff" stroke-width="6" fill="none" stroke-linecap="round"/><path d="M24 6 L34 14 L22 18 Z" fill="#fff"/></svg>',
    menu: '<svg viewBox="0 0 40 40"><rect x="6" y="6" width="12" height="12" rx="3" fill="#fff"/><rect x="22" y="6" width="12" height="12" rx="3" fill="#fff"/><rect x="6" y="22" width="12" height="12" rx="3" fill="#fff"/><rect x="22" y="22" width="12" height="12" rx="3" fill="#fff"/></svg>',
    next: '<svg viewBox="0 0 40 40"><path d="M8 8 L24 20 L8 32 Z M20 8 L36 20 L20 32 Z" fill="#fff" stroke-linejoin="round"/></svg>',
  };
  GK.starsRow = n => '<div class="gk-stars">' + [0, 1, 2].map(i => GK.starSVG(i < n)).join('') + '</div>';

  // ---------- 存檔 ----------
  GK.save = {
    stars: (game) => KG.store.get(game + ':stars', []),
    setStars: (game, lvl, s) => { const a = GK.save.stars(game); if (!(a[lvl] >= s)) { a[lvl] = s; KG.store.set(game + ':stars', a); } return a; },
    total: (game) => GK.save.stars(game).reduce((t, v) => t + (v || 0), 0),
  };

  // ---------- 畫面 ----------
  let curScreen = null;
  GK.closeScreen = () => { if (curScreen) { const s = curScreen; curScreen = null; s.classList.add('out'); setTimeout(() => s.remove(), 280); } };
  function screen(bg, theme) {
    GK.closeScreen();
    const el = document.createElement('div');
    el.className = 'gk-screen';
    el.style.background = bg;
    if (theme) { el.style.setProperty('--gk-dark', theme.dark); el.style.setProperty('--gk-mid', theme.mid || theme.dark); el.style.setProperty('--gk-light', theme.light || '#fff'); }
    el.innerHTML = '<div class="gk-rays"></div>';
    document.body.appendChild(el);
    curScreen = el;
    return el;
  }
  function btn(b) {
    const e = document.createElement('button');
    e.className = 'gk-btn ' + (b.cls || '');
    e.innerHTML = (b.icon ? GK.icons[b.icon] + ' ' : '') + b.text;
    e.addEventListener('click', () => { KG.sound('click'); b.onClick && b.onClick(); });
    return e;
  }
  /** 標題畫面 opts: {title, sub, art(html), bg, theme:{dark,mid,light}, buttons:[{text,cls,icon,onClick}]} */
  GK.title = (o) => {
    const el = screen(o.bg, o.theme);
    const logo = document.createElement('h1');
    logo.className = 'gk-logo';
    logo.innerHTML = [...o.title].map((ch, i) => `<span style="animation-delay:${i * 0.08}s, ${i * 0.15}s">${ch}</span>`).join('');
    const art = document.createElement('div'); art.className = 'gk-art'; art.innerHTML = o.art || '';
    el.appendChild(art); el.appendChild(logo);
    if (o.sub) { const s = document.createElement('div'); s.className = 'gk-sub'; s.textContent = o.sub; el.appendChild(s); }
    const row = document.createElement('div'); row.className = 'gk-row';
    o.buttons.forEach(b => row.appendChild(btn(b)));
    el.appendChild(row);
    return el;
  };
  /** 關卡選擇 opts: {title, bg, theme, count, game, labels[], pics[] (html), need[i] (需要的星星), onPick(i), onBack, extra} */
  GK.levels = (o) => {
    const el = screen(o.bg, o.theme);
    const stars = GK.save.stars(o.game), total = GK.save.total(o.game);
    el.classList.add('gk-lv');
    el.insertAdjacentHTML('beforeend', `<div class="gk-head"><h2 class="gk-title2">${o.title}</h2><div class="gk-total">${GK.starSVG(true)} ${total}</div></div>`);
    const grid = document.createElement('div'); grid.className = 'gk-grid';
    for (let i = 0; i < o.count; i++) {
      const need = o.need ? o.need[i] || 0 : 0;
      const locked = (i > 0 && !(stars[i - 1] > 0) && !o.allOpen) || total < need;
      const c = document.createElement('button');
      c.className = 'gk-card' + (locked ? ' locked' : '');
      c.style.animationDelay = (i * 0.04) + 's';
      c.innerHTML = (o.pics ? `<div class="pic">${o.pics[i]}</div>` : '') + `<div class="num">${i + 1}</div>` +
        (o.labels ? `<div class="lbl">${o.labels[i]}</div>` : '') + GK.starsRow(stars[i] || 0) +
        (locked ? `<div class="lock">${GK.lockSVG()}</div>` : '');
      c.addEventListener('click', () => {
        if (locked) { KG.sound('wrong'); c.classList.remove('kg-shake'); void c.offsetWidth; c.classList.add('kg-shake'); if (need > total) KG.toast('需要 ' + need + ' 顆星星'); return; }
        KG.sound('pop'); o.onPick(i);
      });
      grid.appendChild(c);
    }
    el.appendChild(grid);
    const row = document.createElement('div'); row.className = 'gk-row';
    if (o.onBack) row.appendChild(btn({ text: '返回', cls: 'blue small', onClick: o.onBack }));
    (o.buttons || []).forEach(b => row.appendChild(btn(b)));
    el.appendChild(row);
    return el;
  };
  /** 獎勵畫面 opts: {stars, title, message, unlock:{art,text}, bg, theme, onNext, onReplay, onMenu} */
  GK.reward = (o) => {
    const el = screen(o.bg || 'rgba(60,40,80,.55)', o.theme);
    el.style.backdropFilter = 'blur(4px)';
    const p = document.createElement('div'); p.className = 'gk-panel';
    const praise = o.title || ['加油！', '好棒！', '太厲害了！', '完美！'][o.stars || 0];
    p.innerHTML = `<div class="gk-ribbon">${praise}</div>` +
      (o.stars != null ? `<div class="gk-bigstars">${[0, 1, 2].map(i => GK.starSVG(i < o.stars).replace('<svg', `<svg style="animation-delay:${0.3 + i * 0.28}s"`)).join('')}</div>` : '') +
      (o.art ? `<div class="gk-rart">${o.art}</div>` : '') +
      `<div class="gk-msg">${o.message || ''}</div>` +
      (o.unlock ? `<div class="gk-unlock">${o.unlock.art || GK.lockSVG()}<span>${o.unlock.text}</span></div>` : '');
    const row = document.createElement('div'); row.className = 'gk-row';
    if (o.onMenu) row.appendChild(btn({ text: '', icon: 'menu', cls: 'blue small', onClick: o.onMenu }));
    if (o.onReplay) row.appendChild(btn({ text: '', icon: 'replay', cls: 'orange small', onClick: o.onReplay }));
    if (o.onNext) row.appendChild(btn({ text: o.nextText || '下一關', icon: 'next', cls: 'small', onClick: o.onNext }));
    p.appendChild(row);
    el.appendChild(p);
    // 星星一顆顆出現
    for (let i = 0; i < (o.stars || 0); i++) {
      setTimeout(() => {
        KG.note([784, 988, 1319][i], 0.25, 'triangle', 0.22);
        const s = p.querySelectorAll('.gk-bigstars svg')[i];
        if (s) { const r = s.getBoundingClientRect(); GK.burst(r.left + r.width / 2, r.top + r.height / 2, { type: 'star', count: 14 }); }
      }, 450 + i * 280);
    }
    if (o.stars > 0) setTimeout(() => { KG.sound('win'); KG.confetti(innerWidth / 2, innerHeight * .3, 90); }, 450 + o.stars * 280);
    else KG.sound('correct');
    return el;
  };

  // ---------- 粒子特效 ----------
  let fx = null, fctx = null, parts = [], running = false;
  function ensureFx() {
    if (fx) return;
    fx = document.createElement('canvas'); fx.id = 'gk-fx'; document.body.appendChild(fx);
    fctx = fx.getContext('2d');
    const rs = () => { const d = Math.min(devicePixelRatio || 1, 2); fx.width = innerWidth * d; fx.height = innerHeight * d; fctx.setTransform(d, 0, 0, d, 0, 0); };
    rs(); addEventListener('resize', rs);
  }
  const COLORS = ['#ff6f9e', '#ffd23f', '#6fd36a', '#5ab8ff', '#b48cff', '#ff9a3c'];
  function starPath(c, r) { c.beginPath(); for (let i = 0; i < 10; i++) { const rr = i % 2 ? r * .45 : r, a = i / 10 * Math.PI * 2 - Math.PI / 2; c.lineTo(Math.cos(a) * rr, Math.sin(a) * rr); } c.closePath(); }
  function heartPath(c, r) { c.beginPath(); c.moveTo(0, r * .9); c.bezierCurveTo(-r * 1.4, -r * .1, -r * .7, -r * 1.2, 0, -r * .4); c.bezierCurveTo(r * .7, -r * 1.2, r * 1.4, -r * .1, 0, r * .9); c.closePath(); }
  /** 粒子爆發 type: star | heart | confetti | spark | dust | bubble */
  GK.burst = (x, y, o = {}) => {
    ensureFx();
    const n = o.count || 16, type = o.type || 'star', cols = o.colors || COLORS;
    for (let i = 0; i < n; i++) {
      const a = Math.random() * Math.PI * 2, sp = (o.speed || 1) * (type === 'dust' ? KG.rand(40, 120) : KG.rand(120, 380));
      parts.push({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - (type === 'dust' ? 20 : 120), g: type === 'bubble' ? -60 : type === 'dust' ? 40 : 600,
        r: (o.size || 1) * (type === 'confetti' ? KG.rand(4, 8) : type === 'dust' ? KG.rand(6, 14) : KG.rand(6, 13)), rot: Math.random() * 6, vr: KG.rand(-8, 8),
        life: 0, max: KG.rand(.6, 1.1) * (o.life || 1), type, c: type === 'dust' ? (o.colors ? KG.pick(o.colors) : 'rgba(255,255,255,.9)') : KG.pick(cols) });
    }
    if (!running) { running = true; last = performance.now(); requestAnimationFrame(tick); }
  };
  let last = 0;
  function tick(now) {
    const dt = Math.min(.05, (now - last) / 1000); last = now;
    fctx.clearRect(0, 0, innerWidth, innerHeight);
    parts = parts.filter(p => (p.life += dt) < p.max);
    for (const p of parts) {
      p.vy += p.g * dt; p.vx *= (1 - 1.5 * dt); p.x += p.vx * dt; p.y += p.vy * dt; p.rot += p.vr * dt;
      const k = 1 - p.life / p.max;
      fctx.save(); fctx.translate(p.x, p.y); fctx.rotate(p.rot); fctx.globalAlpha = Math.min(1, k * 2);
      const s = p.type === 'dust' ? (1 + p.life * 2) : (0.4 + 0.6 * Math.min(1, p.life * 6));
      fctx.scale(s, s);
      fctx.fillStyle = p.c;
      if (p.type === 'star' || p.type === 'spark') { starPath(fctx, p.r); fctx.fill(); fctx.strokeStyle = 'rgba(255,255,255,.8)'; fctx.lineWidth = 2; fctx.stroke(); }
      else if (p.type === 'heart') { heartPath(fctx, p.r); fctx.fill(); }
      else if (p.type === 'confetti') { fctx.fillRect(-p.r, -p.r * .5, p.r * 2, p.r); }
      else if (p.type === 'bubble') { fctx.beginPath(); fctx.arc(0, 0, p.r, 0, 7); fctx.strokeStyle = 'rgba(255,255,255,.9)'; fctx.lineWidth = 2; fctx.stroke(); }
      else { fctx.beginPath(); fctx.arc(0, 0, p.r, 0, 7); fctx.fill(); }
      fctx.restore();
    }
    if (parts.length) requestAnimationFrame(tick); else { running = false; fctx.clearRect(0, 0, innerWidth, innerHeight); }
  }
  /** 飄字 +10 */
  GK.float = (x, y, text, color) => {
    const e = document.createElement('div'); e.className = 'gk-float'; e.textContent = text;
    e.style.left = x + 'px'; e.style.top = y + 'px'; if (color) e.style.setProperty('--c', color);
    document.body.appendChild(e); setTimeout(() => e.remove(), 1000);
  };
  /** 大字稱讚 */
  GK.callout = (text, color) => {
    document.querySelectorAll('.gk-callout').forEach(e => e.remove());
    const e = document.createElement('div'); e.className = 'gk-callout'; e.textContent = text;
    if (color) e.style.setProperty('--c', color);
    document.body.appendChild(e); setTimeout(() => e.remove(), 1300);
  };
  GK.praise = () => KG.pick(['好棒！', '太厲害了！', '完美！', '好聰明！', '讚喔！']);
  GK.shake = (el) => { el = el || document.body; el.classList.remove('gk-shake'); void el.offsetWidth; el.classList.add('gk-shake'); };

  // ---------- 背景音樂 ----------
  // song: { bpm, mel: [midi|0, beats, ...], bass: [midi|0, beats, ...], wave, vol }
  const mtof = m => 440 * Math.pow(2, (m - 69) / 12);
  GK.music = (function () {
    let song = null, timer = null, tracks = [], unlocked = false;
    // 瀏覽器要求使用者先互動才能出聲
    const unlock = () => { unlocked = true; };
    addEventListener('pointerdown', unlock, { once: true, capture: true });
    addEventListener('keydown', unlock, { once: true, capture: true });
    function sched() {
      if (!song) return;
      const now = performance.now() / 1000;
      if (!unlocked || document.hidden || KG.isMuted()) { tracks.forEach(tr => { tr.next = Math.max(tr.next, now); }); return; }
      const beat = 60 / song.bpm;
      tracks.forEach(tr => {
        while (tr.next < now + 0.35) {
          const m = tr.notes[tr.i], b = tr.notes[tr.i + 1];
          const d = Math.max(0, tr.next - now);
          if (m) KG.note(mtof(m), b * beat * tr.len, tr.wave, tr.vol, d);
          tr.next += b * beat;
          tr.i = (tr.i + 2) % tr.notes.length;
        }
      });
    }
    return {
      play(s) {
        if (song === s && timer) return;
        this.stop(); song = s;
        const now = performance.now() / 1000 + 0.05;
        tracks = [{ notes: s.mel, wave: s.wave || 'triangle', vol: s.vol || 0.07, len: 0.85, i: 0, next: now }];
        if (s.bass) tracks.push({ notes: s.bass, wave: 'sine', vol: (s.vol || 0.07) * 1.3, len: 0.9, i: 0, next: now });
        timer = setInterval(sched, 90); sched();
      },
      stop() { clearInterval(timer); timer = null; song = null; },
    };
  })();
  // 預設的開心旋律（C 大調）
  GK.songs = {
    happy: { bpm: 112, mel: [72, 1, 76, 1, 79, 1, 76, 1, 77, 1, 81, 1, 79, 2, 76, 1, 79, 1, 84, 1, 79, 1, 77, 1, 74, 1, 72, 2],
      bass: [48, 2, 55, 2, 53, 2, 55, 2, 48, 2, 55, 2, 50, 2, 48, 2] },
    calm: { bpm: 92, mel: [76, 1, 79, 1, 81, 2, 79, 1, 76, 1, 74, 2, 72, 1, 74, 1, 76, 1, 79, 1, 76, 4],
      bass: [48, 4, 45, 4, 41, 4, 43, 4] },
    space: { bpm: 128, wave: 'square', vol: 0.04, mel: [72, .5, 0, .5, 79, .5, 76, .5, 84, 1, 79, 1, 74, .5, 0, .5, 77, .5, 74, .5, 81, 1, 77, 1],
      bass: [36, 1, 48, 1, 36, 1, 48, 1, 38, 1, 50, 1, 38, 1, 50, 1] },
  };
  return GK;
})();
</script>
<script>
'use strict';
(function () {

  const CATS = [
    { id: 'orange', name: '橘子貓', need: 0, base: '#ffb45c', light: '#ffe2b8', dark: '#c8661a', stripe: '#ea8a2a', inner: '#ffb3c4', eye: '#3b2a35' },
    { id: 'white', name: '雪球貓', need: 5, base: '#fffaf4', light: '#ffffff', dark: '#b8a49a', stripe: null, inner: '#ffb3c4', eye: '#4a7bd0' },
    { id: 'gray', name: '灰灰貓', need: 10, base: '#a9b6c8', light: '#e2e8f2', dark: '#56637a', stripe: '#8492a8', inner: '#f3b3c4', eye: '#3b2a35' },
    { id: 'calico', name: '三花貓', need: 15, base: '#fff8ef', light: '#ffffff', dark: '#a8866a', stripe: null, patch: true, inner: '#ffb3c4', eye: '#3b2a35' },
    { id: 'black', name: '小黑貓', need: 21, base: '#544c66', light: '#7a7290', dark: '#2a2535', stripe: null, inner: '#d58aa8', eye: '#9be35a' },
  ];
  const DOGS = [
    { name: '小米', base: '#e9cba6', light: '#fff4e4', dark: '#a87650', ear: 'flop', earC: '#8a5a3c', patch: '#c7966c', miss: .85 },
    { name: '小柴', base: '#f5a54a', light: '#fff4e2', dark: '#b86a1c', ear: 'point', earC: '#f5a54a', mask: true, miss: .7 },
    { name: '斑斑', base: '#ffffff', light: '#ffffff', dark: '#9a9aa8', ear: 'flop', earC: '#3a3545', spots: true, miss: .58 },
    { name: '可可', base: '#9a6440', light: '#d8a983', dark: '#5e3a20', ear: 'flop', earC: '#6e4428', miss: .48 },
    { name: '捲捲', base: '#fff5f8', light: '#ffffff', dark: '#c8a4b4', ear: 'curl', earC: '#ffe0ea', curls: true, miss: .4 },
    { name: '長長', base: '#c46a34', light: '#e9a273', dark: '#7e3c15', ear: 'long', earC: '#8e4518', miss: .33 },
    { name: '哈哈', base: '#8d99ad', light: '#ffffff', dark: '#4e586c', ear: 'point', earC: '#8d99ad', mask: true, blue: true, miss: .26 },
    { name: '金金', base: '#f2c46a', light: '#fff0c8', dark: '#b58225', ear: 'flop', earC: '#e0a748', miss: .18 },
    { name: '狗狗王', base: '#e9cba6', light: '#fff4e4', dark: '#a87650', ear: 'flop', earC: '#8a5a3c', crown: true, patch: '#c7966c', miss: .12 },
  ];
  const SCENES = ['garden', 'garden', 'beach', 'beach', 'snow', 'snow', 'night', 'night', 'night'];

  // 共用漸層
  let defs = '';
  const rg = (id, a, b, c) => `<radialGradient id="${id}" cx="38%" cy="32%" r="75%"><stop offset="0" stop-color="${a}"/><stop offset=".6" stop-color="${b}"/><stop offset="1" stop-color="${c}"/></radialGradient>`;
  CATS.forEach(c => { defs += rg('gc-' + c.id, c.light, c.base, shade(c.base, -.18)); });
  DOGS.forEach((d, i) => { defs += rg('gd-' + i, d.light, d.base, shade(d.base, -.2)); defs += rg('ge-' + i, shade(d.earC, .15), d.earC, shade(d.earC, -.25)); });
  defs += rg('gMuz', '#ffffff', '#fffaf3', '#f0dcc6') + '<linearGradient id="gGold" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff2a0"/><stop offset=".5" stop-color="#ffcf3f"/><stop offset="1" stop-color="#e09b12"/></linearGradient>';
  $('defs').innerHTML = defs;

  function shade(hex, k) {
    const n = parseInt(hex.slice(1), 16); let r = n >> 16, g = (n >> 8) & 255, b = n & 255;
    const f = v => Math.round(k < 0 ? v * (1 + k) : v + (255 - v) * k);
    return '#' + ((1 << 24) | (f(r) << 16) | (f(g) << 8) | f(b)).toString(16).slice(1);
  }

  // ---------- 臉 ----------
  function eyes(mood, x1, x2, y, col) {
    if (mood === 'happy') return `<path d="M${x1 - 7} ${y + 2} Q${x1} ${y - 8} ${x1 + 7} ${y + 2} M${x2 - 7} ${y + 2} Q${x2} ${y - 8} ${x2 + 7} ${y + 2}" stroke="#3b2a35" stroke-width="3.6" fill="none" stroke-linecap="round"/>`;

    if (d.patch) s += `<ellipse cx="64" cy="49" rx="11" ry="13" fill="${d.patch}" opacity=".7"/>`;
    if (d.spots) s += `<circle cx="30" cy="40" r="5" fill="#3a3545"/><circle cx="70" cy="34" r="4" fill="#3a3545"/><circle cx="74" cy="66" r="3.5" fill="#3a3545"/><circle cx="26" cy="64" r="3" fill="#3a3545"/>`;
    s += `<ellipse cx="50" cy="71" rx="19" ry="14" fill="url(#gMuz)"/>

      ${mood === 'idle' ? `<path d="M50 68 L50 72 M42 72 Q50 78 58 72" stroke="${o}" stroke-width="2.2" fill="none" stroke-linecap="round"/><path d="M46 75 Q50 85 54 75 Z" fill="#ff7f9c" stroke="#e25476" stroke-width="1"/>` : mouth(mood, 71, o)}
      <path d="M24 38 Q32 24 48 21" stroke="#fff" stroke-width="3.5" fill="none" stroke-linecap="round" opacity=".5"/>`;
    if (d.crown) s += `<path d="M32 22 L34 4 L42 14 L50 0 L58 14 L66 4 L68 22 Z" fill="url(#gGold)" stroke="#c7860f" stroke-width="2.5" stroke-linejoin="round"/><circle cx="50" cy="16" r="3" fill="#ff5c8a"/>`;
    return s;
  }
  const pieceSVG = (kind, idx, mood = 'idle') => `<svg class="piece" viewBox="0 0 100 100">${kind === 'X' ? catFace(CATS[idx], mood) : dogFace(idx, mood)}</svg>`;
  // 半身像
  function bust(kind, idx, mood = 'idle') {
    const c = kind === 'X' ? CATS[idx] : DOGS[idx];

      <path d="M44 86 Q60 96 76 86" stroke="${kind === 'X' ? '#ff6f9a' : '#5ab8ff'}" stroke-width="6" fill="none" stroke-linecap="round"/>
      <circle cx="60" cy="95" r="5" fill="url(#gGold)" stroke="#c7860f" stroke-width="1.5"/>

  }

  // ---------- 場景背景 ----------
  function sceneSVG(kind) {
    const cloud = (x, y, s, d) => `<g class="drift" style="animation-duration:${d}s;animation-delay:-${(x / 10) | 0}s"><g transform="translate(${x} ${y}) scale(${s})" fill="#fff" opacity=".95"><circle cx="0" cy="10" r="30"/><circle cx="34" cy="-6" r="40"/><circle cx="72" cy="10" r="30"/><rect x="0" y="10" width="72" height="30" rx="15"/></g></g>`;
    const tuft = (x, y, c) => `<path class="sway" d="M${x} ${y} q-6 -22 -14 -26 q12 6 14 18 q2 -20 10 -30 q-4 18 -2 30 q6 -14 16 -18 q-10 10 -12 26z" fill="${c}"/>`;
    const fl = (x, y, c) => `<g class="sway"><path d="M${x} ${y} L${x} ${y - 34}" stroke="#4aa84f" stroke-width="5"/>${[0, 1, 2, 3, 4].map(k => { const a = k / 5 * 6.283; return `<circle cx="${x + Math.cos(a) * 10}" cy="${y - 38 + Math.sin(a) * 10}" r="9" fill="${c}"/>`; }).join('')}<circle cx="${x}" cy="${y - 38}" r="7" fill="#ffd23f"/></g>`;
    if (kind === 'garden') return `<defs><linearGradient id="sk" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7cc8ff"/><stop offset=".6" stop-color="#cdeeff"/><stop offset="1" stop-color="#eaffd8"/></linearGradient>
        <linearGradient id="h1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#a6e58a"/><stop offset="1" stop-color="#6cc25e"/></linearGradient><linearGradient id="h2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8fd47a"/><stop offset="1" stop-color="#4fae4f"/></linearGradient>
        <radialGradient id="vg" cx="50%" cy="50%" r="70%"><stop offset=".6" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#2a4a20" stop-opacity=".25"/></radialGradient></defs>
      <rect width="1000" height="1000" fill="url(#sk)"/><circle cx="830" cy="140" r="70" fill="#fff3a0"/><circle cx="830" cy="140" r="110" fill="#fff3a0" opacity=".3"/>
      ${cloud(100, 150, 1.2, 60)}${cloud(500, 90, .9, 80)}${cloud(300, 260, .7, 70)}
      <path d="M0 620 Q200 500 420 600 Q650 480 1000 590 L1000 1000 L0 1000Z" fill="url(#h1)"/>
      <g fill="#4fae4f"><circle cx="120" cy="560" r="60"/><circle cx="170" cy="530" r="50"/><rect x="138" y="580" width="16" height="70" fill="#8a5a3c"/><circle cx="880" cy="540" r="66"/><circle cx="830" cy="560" r="50"/><rect x="858" y="580" width="16" height="70" fill="#8a5a3c"/></g>
      <path d="M0 740 Q500 640 1000 740 L1000 1000 L0 1000Z" fill="url(#h2)"/>
      ${tuft(80, 880, '#3f9a45')}${tuft(900, 900, '#3f9a45')}${tuft(500, 960, '#3f9a45')}${tuft(260, 820, '#5cbf55')}${tuft(720, 810, '#5cbf55')}
      ${fl(60, 960, '#ff9fbe')}${fl(950, 980, '#b48cff')}${fl(150, 820, '#fff')}${fl(860, 830, '#ff8fb1')}${fl(400, 990, '#ffa94d')}
      <rect width="1000" height="1000" fill="url(#vg)"/>`;
    if (kind === 'beach') return `<defs><linearGradient id="sk" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5ab8ff"/><stop offset="1" stop-color="#d4f0ff"/></linearGradient>
        <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3fc0e8"/><stop offset="1" stop-color="#1a86c8"/></linearGradient><linearGradient id="sand" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffe8b0"/><stop offset="1" stop-color="#f2c878"/></linearGradient></defs>
      <rect width="1000" height="1000" fill="url(#sk)"/><circle cx="160" cy="150" r="70" fill="#fff3a0"/>
      ${cloud(600, 130, 1, 70)}${cloud(200, 260, .7, 90)}
      <rect y="470" width="1000" height="250" fill="url(#sea)"/>
      <g stroke="#fff" stroke-width="6" fill="none" stroke-linecap="round" opacity=".7"><path class="drift" style="animation-duration:30s" d="M0 530 q30 -14 60 0 M300 600 q30 -14 60 0 M600 520 q30 -14 60 0"/></g>

      <rect width="1000" height="1000" fill="url(#sk)"/>${cloud(150, 140, 1, 80)}${cloud(650, 200, .8, 70)}
      <path d="M0 620 Q250 520 500 610 Q750 520 1000 600 L1000 1000 L0 1000Z" fill="#f4f9ff"/>
      ${[[120, 600], [220, 640], [820, 590], [900, 640]].map(([x, y]) => `<g><path d="M${x} ${y - 160} L${x - 60} ${y} L${x + 60} ${y}Z" fill="#3f9a6a"/><path d="M${x} ${y - 160} L${x - 30} ${y - 80} L${x + 30} ${y - 80}Z" fill="#fff"/><rect x="${x - 8}" y="${y}" width="16" height="30" fill="#8a5a3c"/></g>`).join('')}
      <path d="M0 760 Q500 680 1000 760 L1000 1000 L0 1000Z" fill="#ffffff"/>
      <g transform="translate(860 860)"><circle cy="0" r="50" fill="#fff" stroke="#d6e4f5" stroke-width="4"/><circle cy="-70" r="36" fill="#fff" stroke="#d6e4f5" stroke-width="4"/><path d="M0 -66 l26 6 l-26 6z" fill="#ff8a3d"/><circle cx="-12" cy="-80" r="4"/><circle cx="12" cy="-80" r="4"/><path d="M-30 -42 Q0 -30 30 -42" stroke="#e2434f" stroke-width="10" fill="none" stroke-linecap="round"/></g>

    return `<defs><linearGradient id="sk" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#232a6b"/><stop offset=".7" stop-color="#6a5ab0"/><stop offset="1" stop-color="#b58ad8"/></linearGradient></defs>
      <rect width="1000" height="1000" fill="url(#sk)"/>
      ${Array.from({ length: 40 }, (_, k) => `<circle class="twk" style="animation-delay:-${k * .37}s" cx="${(k * 137) % 1000}" cy="${(k * 71) % 600}" r="${2 + k % 3}" fill="#fff"/>`).join('')}
      <circle cx="800" cy="160" r="70" fill="#fff6c8"/><circle cx="830" cy="140" r="64" fill="#2c3170"/>
      <path d="M0 700 Q250 600 500 680 Q750 600 1000 680 L1000 1000 L0 1000Z" fill="#3d4a8e"/><path d="M0 800 Q500 720 1000 800 L1000 1000 L0 1000Z" fill="#4e5ca8"/>
      ${[[150, 820], [420, 860], [700, 830], [880, 880]].map(([x, y], k) => `<circle class="twk" style="animation-delay:-${k * .5}s" cx="${x}" cy="${y}" r="6" fill="#d8ff6a"/><circle class="twk" style="animation-delay:-${k * .5}s" cx="${x}" cy="${y}" r="16" fill="#d8ff6a" opacity=".25"/>`).join('')}`;
  }

  // ---------- 遊戲狀態 ----------
  const LINES = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
  const boardEl = $('board'), statusEl = $('status');
  const cells = [];
  let grid, turn, over = true, busy = false, timers = [];
  let mode = 'level', level = 0, dogIdx = 0, skin = KG.store.get(GAME + ':skin', 0), round = 0;
  let wins = { X: 0, O: 0, D: 0 }, lost = 0;

  for (let i = 0; i < 9; i++) {
    const b = document.createElement('button');
    b.className = 'cell'; b.setAttribute('aria-label', '格子 ' + (i + 1));
    b.addEventListener('pointerdown', e => { e.preventDefault(); onTap(i); });
    boardEl.appendChild(b); cells.push(b);
  }
  const later = (fn, ms) => { const t = setTimeout(fn, ms); timers.push(t); };
  const clearTimers = () => { timers.forEach(clearTimeout); timers = []; };
  const totalStars = () => GK.save.total(GAME);
  if (!(CATS[skin] && totalStars() >= CATS[skin].need)) skin = 0;

  function setAvatar(kind, mood) {
    const card = kind === 'X' ? $('catCard') : $('dogCard');
    card.querySelector('.pic').innerHTML = kind === 'X' ? bust('X', skin, mood) : bust('O', dogIdx, mood);
    card.classList.remove('happy', 'sad'); void card.offsetWidth;
    if (mood !== 'idle') card.classList.add(mood);
  }
  function renderPips() {
    const need = 2;
    const pip = (n) => mode === 'two' ? `<span>${n}</span>` : Array.from({ length: need }, (_, i) => GK.starSVG(i < n)).join('');
    $('catCard').querySelector('.pips').innerHTML = pip(wins.X);
    $('dogCard').querySelector('.pips').innerHTML = pip(wins.O);
    $('catCard').classList.toggle('turn', !over && turn === 'X');
    $('dogCard').classList.toggle('turn', !over && turn === 'O');
  }
  function setStatus(h) { statusEl.innerHTML = h; }
  function winnerOf(g) {
    for (const l of LINES) if (g[l[0]] && g[l[0]] === g[l[1]] && g[l[0]] === g[l[2]]) return { p: g[l[0]], line: l };
    if (g.every(Boolean)) return { p: 'D' };
    return null;
  }

  function startMatch(m, lv) {
    mode = m; level = lv || 0;
    dogIdx = mode === 'two' ? 0 : level;
    wins = { X: 0, O: 0, D: 0 }; lost = 0; round = 0;
    const scene = mode === 'two' ? 'garden' : SCENES[level];
    $('scene').innerHTML = sceneSVG(scene);
    document.body.style.setProperty('--cloth', { garden: '#f0627b', beach: '#4aa8e8', snow: '#7c8cff', night: '#b06ad8' }[scene]);
    $('sign').hidden = false; $('app').hidden = false;
    $('sign').innerHTML = mode === 'two' ? '兩人對戰' : `第 ${level + 1} 關 · ${DOGS[dogIdx].name}`;
    $('dogCard').querySelector('.name').textContent = mode === 'two' ? '朋友' : DOGS[dogIdx].name;
    $('catCard').querySelector('.name').textContent = mode === 'two' ? '小貓' : '你';
    GK.closeScreen();
    GK.music.play(GK.songs.happy);
    setAvatar('X', 'idle'); setAvatar('O', 'idle');
    newRound();
  }

  function newRound() {
    clearTimers();
    grid = Array(9).fill(null); over = false; busy = false;
    cells.forEach(c => { c.innerHTML = ''; c.className = 'cell'; });
    const old = boardEl.querySelector('svg.line'); if (old) old.remove();
    // 前三關小朋友永遠先下；之後輪流先手
    turn = (mode === 'level' && level < 3) ? 'X' : (round % 2 ? 'O' : 'X');
    round++;
    showTurn();
    if (mode === 'level' && turn === 'O') aiTurn();
  }

  function showTurn() {
    renderPips();
    if (mode === 'level' && turn === 'O') setStatus(`<span class="think">${DOGS[dogIdx].name}想一想<span>.</span><span>.</span><span>.</span></span>`);
    else if (mode === 'two') setStatus(turn === 'X' ? '輪到小貓囉！' : '輪到小狗囉！');
    else setStatus('輪到你囉！點一個格子');
  }

  function place(i, p) {
    grid[i] = p;
    const c = cells[i];
    c.innerHTML = p === 'X' ? pieceSVG('X', skin) : pieceSVG('O', dogIdx);
    c.classList.add('filled');
    const r = c.getBoundingClientRect();
    GK.burst(r.left + r.width / 2, r.top + r.height / 2, { type: p === 'X' ? 'star' : 'heart', count: 8, speed: .6, colors: p === 'X' ? ['#ffd23f', '#ffa53a', '#fff'] : ['#ff8fb1', '#ffc0d4', '#fff'] });
    if (p === 'X') { KG.note(784, .1, 'triangle', .22); KG.note(1046, .14, 'triangle', .18, .07); }
    else { KG.note(392, .1, 'sine', .3); KG.note(523, .14, 'sine', .25, .07); }
  }

  function onTap(i) {
    if (over || busy || grid[i]) return;
    if (mode === 'level' && turn !== 'X') return;
    place(i, turn);
    afterMove();
  }
  function afterMove() {
    const w = winnerOf(grid);
    if (w) return endRound(w);
    turn = turn === 'X' ? 'O' : 'X';
    showTurn();
    if (mode === 'level' && turn === 'O') aiTurn();
  }
  function aiTurn() {
    busy = true;
    later(() => { busy = false; place(aiMove(), 'O'); afterMove(); }, 700);
  }

  // ---------- 電腦 ----------
  function minimax(g, p, depth) {
    const w = winnerOf(g);
    if (w) return w.p === 'O' ? 10 - depth : w.p === 'X' ? depth - 10 : 0;
    let best = p === 'O' ? -99 : 99;
    for (let i = 0; i < 9; i++) if (!g[i]) {
      g[i] = p; const s = minimax(g, p === 'O' ? 'X' : 'O', depth + 1); g[i] = null;
      best = p === 'O' ? Math.max(best, s) : Math.min(best, s);
    }
    return best;
  }
  function aiMove() {
    const free = grid.map((v, i) => v ? -1 : i).filter(i => i >= 0);
    // 關卡越後面越少失誤，前面幾關讓小朋友容易贏
    if (Math.random() < DOGS[dogIdx].miss) return KG.pick(free);
    let best = -99, picks = [];
    for (const i of free) {
      grid[i] = 'O'; const s = minimax(grid, 'X', 1); grid[i] = null;
      if (s > best) { best = s; picks = [i]; } else if (s === best) picks.push(i);
    }
    return KG.pick(picks);
  }

  // ---------- 一局結束 ----------
  function drawLine(l, p) {
    const b = boardEl.getBoundingClientRect();
    const pos = i => { const r = cells[i].getBoundingClientRect(); return [r.left - b.left + r.width / 2, r.top - b.top + r.height / 2]; };
    const a = pos(l[0]), z = pos(l[2]);
    const dx = z[0] - a[0], dy = z[1] - a[1], len = Math.hypot(dx, dy), ex = dx / len * 22, ey = dy / len * 22, s = boardEl.clientWidth / 300;
    const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
    svg.setAttribute('class', 'line');
    const col = p === 'X' ? '#ff8a3d' : '#8a5a3c';
    const ln = (c, w) => `<line x1="${a[0] - ex}" y1="${a[1] - ey}" x2="${z[0] + ex}" y2="${z[1] + ey}" stroke="${c}" stroke-width="${w * s}"/>`;
    svg.innerHTML = ln('rgba(0,0,0,.15)', 26) + ln('#fff', 22) + ln(col, 12) + ln('rgba(255,255,255,.6)', 3);
    boardEl.appendChild(svg);
    // 沿線冒星星
    l.forEach((i, k) => later(() => { const r = cells[i].getBoundingClientRect(); GK.burst(r.left + r.width / 2, r.top + r.height / 2, { type: 'star', count: 12 }); KG.note(880 + k * 220, .12, 'triangle', .2); }, 150 + k * 140));
  }

  function endRound(w) {
    over = true;
    if (w.p !== 'D') wins[w.p]++; else wins.D++;
    renderPips();
    if (w.p === 'D') {
      KG.sound('boing'); setStatus('平手！再來一次'); GK.callout('平手！', '#5ab8ff');
      cells.forEach(c => c.classList.add('dim'));
    } else {
      w.line.forEach(i => cells[i].classList.add('win'));
      cells.forEach((c, i) => { if (!w.line.includes(i)) c.classList.add('dim'); });
      drawLine(w.line, w.p);
      const loser = w.p === 'X' ? 'O' : 'X';
      setAvatar(w.p, 'happy'); setAvatar(loser, 'sad');
      w.line.forEach(i => { const sv = cells[i].querySelector('svg'); if (sv) sv.outerHTML = pieceSVG(w.p, w.p === 'X' ? skin : dogIdx, 'happy'); });
      w.line.forEach(i => cells[i].querySelector('svg').style.animation = 'happy .5s ease-in-out infinite alternate');
      if (mode === 'two') { GK.callout(w.p === 'X' ? '小貓贏了！' : '小狗贏了！', w.p === 'X' ? '#ff8a3d' : '#8a5a3c'); KG.sound('sparkle'); }
      else if (w.p === 'X') { GK.callout(GK.praise(), '#ff8a3d'); KG.sound('sparkle'); KG.say('好棒！'); }
      else { lost++; GK.callout('差一點！', '#8a5a3c'); KG.sound('wrong'); boardEl.classList.remove('shake'); void boardEl.offsetWidth; boardEl.classList.add('shake'); }
      setStatus(w.p === 'X' ? (mode === 'two' ? '小貓連成一條線！' : '你連成一條線了！') : (mode === 'two' ? '小狗連成一條線！' : DOGS[dogIdx].name + '連成一條線'));
    }
    later(() => {
      setAvatar('X', 'idle'); setAvatar('O', 'idle');
      if (mode === 'level' && (wins.X >= 2 || wins.O >= 2)) return endMatch();
      newRound();
    }, 2000);
  }

  function endMatch() {
    GK.music.stop();
    if (wins.X >= 2) {
      const before = totalStars();
      const stars = Math.max(1, 3 - lost);
      GK.save.setStars(GAME, level, stars);
      const after = totalStars();
      const nu = CATS.find(c => c.need > before && c.need <= after);
      GK.reward({
        stars, theme: { dark: '#c8661a', mid: '#ff9a3c', light: '#ffc98a' },
        message: `你打敗了${DOGS[dogIdx].name}！`,
        art: bust('O', dogIdx, 'happy'),
        unlock: nu ? { art: `<svg viewBox="0 0 100 100" style="width:44px;height:44px">${catFace(nu, 'happy')}</svg>`, text: '新的小貓：' + nu.name + '！' } : null,
        onMenu: showLevels, onReplay: () => startMatch('level', level),
        onNext: level < DOGS.length - 1 ? () => startMatch('level', level + 1) : null,
      });
      KG.say(stars === 3 ? '太厲害了！' : '好棒！你贏了！');
    } else {
      GK.reward({
        stars: 0, title: '差一點點！', theme: { dark: '#8a5a3c', mid: '#c7966c', light: '#e9cba6' },
        message: '再試一次，一定會贏！', art: bust('O', dogIdx, 'happy'),
        onMenu: showLevels, onReplay: () => startMatch('level', level),
      });
    }
  }

  // ---------- 畫面 ----------
  const TITLE_BG = 'radial-gradient(circle at 50% 35%, #fff4c2 0%, #ffd27a 40%, #ff9f68 100%)';
  const THEME = { dark: '#c8661a', mid: '#ff9a3c', light: '#ffc98a' };
  function hideGame() { clearTimers(); over = true; $('app').hidden = true; $('sign').hidden = true; }

  function showTitle() {
    hideGame();
    $('scene').innerHTML = sceneSVG('garden');
    GK.music.play(GK.songs.happy);
    GK.title({
      title: '貓狗圈圈叉', sub: '先連成一條線就贏囉！', bg: TITLE_BG, theme: THEME,
      art: `<svg viewBox="0 0 240 220">
        <ellipse cx="120" cy="206" rx="110" ry="12" fill="rgba(120,60,20,.2)"/>
        <g transform="translate(70 98) rotate(-8)"><rect x="-10" y="-10" width="120" height="110" rx="18" fill="#c98b4e" stroke="#8a5527" stroke-width="4"/>
          ${[0, 1, 2].map(r => [0, 1, 2].map(c => `<rect x="${c * 34}" y="${r * 30}" width="30" height="26" rx="7" fill="#f6dcb4"/>`).join('')).join('')}</g>
        <g style="animation: hop 1.6s ease-in-out infinite; transform-origin: 60px 200px">${`<g transform="translate(0 70) scale(1.1)">${bust('X', skin, 'happy').replace(/^<svg[^>]*>|<\/svg>$/g, '')}</g>`}</g>
        <g style="animation: hop 1.6s ease-in-out .8s infinite; transform-origin: 180px 200px">${`<g transform="translate(108 70) scale(1.1)">${bust('O', 0, 'idle').replace(/^<svg[^>]*>|<\/svg>$/g, '')}</g>`}</g>
        <path d="M120 40 l6 14 l15 1 l-12 9 l4 15 l-13 -8 l-13 8 l4 -15 l-12 -9 l15 -1z" fill="#ffd23f" stroke="#d9800f" stroke-width="3" stroke-linejoin="round" style="animation: gkPulse 1s infinite; transform-origin: 120px 60px"/>
      </svg>`,
      buttons: [
        { text: '開始', cls: 'big', icon: 'play', onClick: showLevels },
        { text: '兩人玩', cls: 'blue small', onClick: () => startMatch('two') },
      ],
    });
  }

  function showLevels() {
    hideGame();
    GK.music.play(GK.songs.happy);
    const el = GK.levels({
      title: '選一隻狗狗', game: GAME, count: DOGS.length, bg: TITLE_BG, theme: THEME,
      labels: DOGS.map(d => d.name),
      pics: DOGS.map((d, i) => `<svg viewBox="0 0 100 100" style="background:radial-gradient(circle at 50% 40%,#fff,#ffe6c8)">${dogFace(i, 'idle')}</svg>`),
      onPick: i => startMatch('level', i), onBack: showTitle,
    });
    // 小貓造型（用星星解鎖）
    const total = totalStars();
    const row = document.createElement('div'); row.className = 'skins';
    row.innerHTML = '<b>我的小貓</b>';
    CATS.forEach((c, i) => {
      const locked = total < c.need;
      const b = document.createElement('button');
      b.className = 'skin' + (i === skin ? ' on' : '') + (locked ? ' locked' : '');
      b.setAttribute('aria-label', c.name);
      b.innerHTML = `<svg class="f" viewBox="0 0 100 100">${catFace(c, 'idle')}</svg>` + (locked ? `<div class="lk">${GK.lockSVG()}</div><div class="need">★${c.need}</div>` : '');
      b.addEventListener('click', () => {
        if (locked) { KG.sound('wrong'); KG.toast('要 ' + c.need + ' 顆星星才能解鎖'); return; }
        skin = i; KG.store.set(GAME + ':skin', i); KG.sound('pop');
        row.querySelectorAll('.skin').forEach((s, k) => s.classList.toggle('on', k === i));
        const r = b.getBoundingClientRect(); GK.burst(r.left + r.width / 2, r.top + r.height / 2, { type: 'heart', count: 10 });
      });
      row.appendChild(b);
    });
    el.insertBefore(row, el.querySelector('.gk-row'));
  }

  document.addEventListener('touchmove', e => { if (!e.target.closest('.gk-grid')) e.preventDefault(); }, { passive: false });
  document.addEventListener('gesturestart', e => e.preventDefault());
  showTitle();
})();
</script>
</body>
</html>
