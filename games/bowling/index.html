  /* 計分板 */

  .btot { display: grid; place-items: center; background: rgba(60, 232, 255, .12); border-radius: 4px; font-size: var(--totf, 16px); font-weight: 900; color: var(--gd); text-shadow: 0 0 10px rgba(255, 212, 71, .4); }

  .binfo { font-size: 12.5px; color: var(--mut); margin-bottom: 8px; min-height: 18px; letter-spacing: .5px; }
  .binfo b { color: var(--ink); }
  .tcard .gbtn.pri { width: 100%; font-size: 18px; letter-spacing: 4px; }
  .rec { margin-top: 8px; font-size: 12px; color: var(--mut); letter-spacing: 1px; line-height: 1.6; }

  .tips { margin-top: 4px; font-size: 11px; color: #7d86a8; line-height: 1.55; }
  body.land #title { flex-direction: row; align-items: center; justify-content: space-between; gap: 16px; padding: 12px calc(16px + env(safe-area-inset-right)) 12px calc(16px + env(safe-area-inset-left)); background: linear-gradient(90deg, rgba(5, 5, 16, .55) 0%, rgba(5, 5, 16, .15) 40%, rgba(5, 5, 16, .88) 100%); }

  .res { list-style: none; margin: 4px 0 12px; padding: 0; text-align: left; }

<script type="module">
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

/*CORE-START*/
const Core = (() => {
  /* ---------- 球道尺寸（公尺）：x 橫向（右為正）、y 沿球道往球瓶、z 往上 ---------- */
  const G = 9.81, H = 1 / 1000;
  const HW = 0.5271, GUT = 0.235, KICK = HW + GUT, GUT_D = 0.07;
  const HEAD_Y = 18.288, SP = 0.3048, ROW = SP * Math.sqrt(3) / 2;
  const PIT_Y = HEAD_Y + 3 * ROW + 0.30, BACK_Y = PIT_Y + 0.85, CEIL = 1.25;
  const OIL = 12.2, OIL_W = 2.2, MU_OIL = 0.012, MU_DRY = 0.2;
  const BR = 0.1085;
  const PIN_H = 0.381, PIN_M = 1.53, PIN_COM = 0.145, PIN_IT = 0.0165, PIN_IA = 0.0013, PIN_BR = 0.226;
  const SPH_H = [0.034, 0.09, 0.135, 0.19, 0.26, 0.335], SPH_R = [0.032, 0.057, 0.0595, 0.045, 0.026, 0.032];
  const NS = SPH_H.length, SPH_Z = SPH_H.map(h => h - PIN_COM);
  const RING_N = 8, RING_R = 0.0258, RING = [];
  for (let k = 0; k < RING_N; k++) { const a = k / RING_N * Math.PI * 2; RING.push([Math.cos(a) * RING_R, Math.sin(a) * RING_R, -PIN_COM]); }
  const PIN_XY = [[0, 0], [-SP / 2, ROW], [SP / 2, ROW], [-SP, 2 * ROW], [0, 2 * ROW], [SP, 2 * ROW], [-1.5 * SP, 3 * ROW], [-SP / 2, 3 * ROW], [SP / 2, 3 * ROW], [1.5 * SP, 3 * ROW]].map(p => [p[0], HEAD_Y + p[1]]);
  const COS_STAND = Math.cos(12 * Math.PI / 180);

  /* ---------- 球的種類（物理參數）：lb 重量、rg 慣性半徑比、fric 表面摩擦、rev 轉速倍率 ---------- */
  const BALLS = [
    { id: 'blue', lb: 12, rg: 0.36, fric: 1.0, rev: 1.0, spd: 1.03 },
    { id: 'red', lb: 14, rg: 0.35, fric: 1.05, rev: 1.0, spd: 1.0 },
    { id: 'mint', lb: 10, rg: 0.37, fric: 0.95, rev: 1.08, spd: 1.07 },
    { id: 'violet', lb: 15, rg: 0.34, fric: 1.12, rev: 1.05, spd: 0.99 },
    { id: 'gold', lb: 16, rg: 0.34, fric: 1.08, rev: 1.0, spd: 0.97 },
    { id: 'aurora', lb: 15, rg: 0.33, fric: 1.22, rev: 1.12, spd: 1.0 },
    { id: 'onyx', lb: 16, rg: 0.33, fric: 1.18, rev: 1.08, spd: 0.99 }
  ];
  BALLS.forEach(b => { b.m = b.lb * 0.4536; });

  const deckZ = t => t < 0.35 ? DECK_UP : t < 0.75 ? lerp(DECK_UP, DECK_DN, ease(seg01(t, 0.35, 0.75))) : t < 1.1 ? lerp(DECK_DN, DECK_UP, ease(seg01(t, 0.75, 1.1))) : t < 2.15 ? DECK_UP : t < 2.55 ? lerp(DECK_UP, DECK_DN, ease(seg01(t, 2.15, 2.55))) : lerp(DECK_DN, DECK_UP, ease(seg01(t, 2.55, 2.85)));
  const PX = {};
  function sync3D(dt) {
    tNow += dt;
    // 球瓶
    for (let i = 0; i < 10; i++) {
      pinXform(i, PX);
      if (!PX.vis) { _m.compose(_p.set(0, -5, 0), _q.identity(), ZERO_S); pins.setMatrixAt(i, _m); pinsM.setMatrixAt(i, _m); continue; }
      _qc.set(PX.qx, PX.qy, PX.qz, PX.qw);
      _q3.copy(QM).multiply(_qc).multiply(QMi);
      setV(_p, PX.x, PX.y, PX.z);
      _m.compose(_p, _q3, ONE_S); pins.setMatrixAt(i, _m);
      const onLane = PX.z > PIN_COM - 0.2 && Math.abs(PX.x) < HW && PX.y < PIT_Y;
      _m.compose(_p, _q3, onLane ? ONE_S : ZERO_S); pinsM.setMatrixAt(i, _m);
    }
    pins.instanceMatrix.needsUpdate = true; pinsM.instanceMatrix.needsUpdate = true;
    if (sweep) setSweepVis(barZ(sweep.t), barY(sweep.t), deckZ(sweep.t)); else setSweepVis(SW_BAR_UP, SW_BAR_Y, DECK_UP);
    // 球
    const b = W.ball;
    let bx, by, bz = BR, show = true;
    if (phase === 'aim' || phase === 'title' || phase === 'over' || (phase === 'sweep' && sweep && sweep.t > 2.2)) {
      bx = phase === 'title' ? 0.12 : aim.pos; by = AIM_Y;
      ballVis = Math.min(1, ballVis + dt * 3);
      ball.scale.setScalar(Math.max(0.01, ballVis));
      ballQ.setFromAxisAngle(_v.set(0, 1, 0), 0.6);
    } else {
      ball.scale.setScalar(1);
      bx = b.x; by = b.y;
      if (b.st === 2) bz = BR - 0.075;
      if (b.st === 3 || b.st === 0) { show = b.y < PIT_Y + 0.3 && b.st === 3; bz = BR - Math.min(0.5, (b.y - PIT_Y) * 2); if (!show) bx = 99; }
      // 旋轉
      const wx = b.wx, wy = b.wz, wz = -b.wy, wl = Math.hypot(wx, wy, wz) * dt * (isAI() ? (ff ? 5 : 1.6) : quick ? 3 : 1);
      if (wl > 1e-6 && b.st !== 3) { _q.setFromAxisAngle(_v.set(wx, wy, wz).normalize(), wl); ballQ.premultiply(_q); }
    }
    ball.visible = ballM.visible = show && bx !== 99;
    setV(ball.position, bx, by, bz); ball.quaternion.copy(ballQ);
    ballM.position.copy(ball.position); ballM.quaternion.copy(ballQ); ballM.scale.copy(ball.scale);
    ballM.visible = ball.visible && bz > BR - 0.01 && Math.abs(bx) < HW;
    blob.visible = ball.visible && bz > 0;
    setV(blob.position, bx, by, b.st === 2 && phase === 'roll' ? -0.07 : 0.003);
    blob.material.opacity = ball.scale.x;
    // 軌跡
    if (phase === 'roll' && (b.st === 1 || b.st === 2)) {
      const L = trailPts.length;
      if (L < 2 || Math.hypot(b.x - trailPts[L - 2], b.y - trailPts[L - 1]) > 0.12) { trailPts.push(b.x, b.y); if (trailPts.length > 120) trailPts.splice(0, 2); }
      const tp = trailPts.slice(); tp.push(b.x, b.y);
      setRibbon(trail, tp, tp.length / 2, 0.045, (i, n) => Math.pow(i / n, 1.8) * 0.2);
      trail.visible = true;
    } else if (trail.visible && phase !== 'roll') {
      trail.visible = phase === 'result';
    }
    // 瞄準線
    const showAim = game && phase === 'aim' && !isAI() && !paused;
    if (showAim && aim.dirty) {
      aim.dirty = false;
      const sp = powerToSpeed(aim.power);
      const r = Core.predict(aim.pos, sp, aim.angle, aim.spin, Core.BALLS[curP().ball], 0.2, HEAD_Y - 0.2);
      const pts = [aim.pos, AIM_Y + 0.25].concat(r.pts);
      setRibbon(aimLine, pts, pts.length / 2, 0.035, (i, n) => { const y = pts[i * 2 + 1]; return (i % 4 < 2 ? 0.55 : 0.18) * Math.max(0, 1 - y / 15) * 0.9; });
      const a0 = Math.atan2(r.pts.length > 4 ? r.pts[4] - r.pts[0] : aim.angle, r.pts.length > 4 ? r.pts[5] - r.pts[1] : 1);
      setV(aimArrow.position, aim.pos + Math.sin(a0) * 1.4, 1.4, 0.008);
      aimArrow.rotation.set(0, -a0, 0);
    }
    aimLine.visible = aimArrow.visible = !!showAim;
    if (showAim) { const pulse = 0.4 + 0.2 * Math.sin(tNow * 4); aimArrow.material.opacity = pulse; }
    // 遮板特效
    if (maskFx.t > 0) {
      maskFx.t -= dt;
      myMaskMat.emissiveIntensity = 0.9 + (Math.sin(tNow * 18) > 0 ? 1.4 : 0.1);
      if (maskFx.t <= 0) { myMaskMat.emissiveIntensity = 0.9; drawMyMask(); }
    }
    tickParts(dt);
  }

  /* ---------- 攝影機 ---------- */
  const camPos = new THREE.Vector3(), camLook = new THREE.Vector3(), tPos = new THREE.Vector3(), tLook = new THREE.Vector3();
  let camInit = false, camK = 3;
  function deckDist() {
    const hf = 2 * Math.atan(Math.tan(camera.fov * Math.PI / 360) * camera.aspect);
    return clamp(0.95 / Math.tan(hf / 2), 2.3, 4.6);
  }
  function computeCamera(dt) {
    const port = VW < VH, asp = VW / VH;
    const b = W.ball;
    camK = 3;
    if (phase === 'title') {
      const t = tNow * 0.12;
      setV(tPos, Math.sin(t) * 0.9, HEAD_Y - (port ? 4.2 : 3.0) + Math.cos(t * 0.7) * 0.5, port ? 0.75 : 0.55);
      setV(tLook, port ? 0 : 0.85, HEAD_Y + 0.4, port ? 0.42 : 0.5);
      camK = 1.2;
    } else if (phase === 'aim' || phase === 'over' || (phase === 'roll' && b.y < 0.6)) {
      const x = aim.pos;
      if (port) { setV(tPos, x * 0.35, -3.0, 2.2); setV(tLook, x * 0.1, 2.3, 0); }
      else { setV(tPos, x * 0.45, -2.25, 1.02); setV(tLook, x * 0.12, 3.2, 0); }
      camK = phase === 'aim' && aimT < 1.2 ? 2.2 : 5;
    } else if (phase === 'roll' && b.y < HEAD_Y - 6.5 && (b.st === 1 || b.st === 2)) {
      const lead = port ? 7 : 6;
      setV(tPos, b.x * 0.55, b.y - (port ? 3.0 : 2.8), port ? 1.5 : 1.0);
      setV(tLook, b.x * 0.4, b.y + lead, 0.1);
      camK = 4;
    } else {
      const d = deckDist();
      setV(tPos, 0, HEAD_Y - d, port ? 1.05 : 0.85);
      setV(tLook, 0, HEAD_Y + 0.5, port ? 0.18 : 0.25);
      camK = phase === 'roll' ? 2.6 : 3;
    }
    if (!camInit) { camPos.copy(tPos); camLook.copy(tLook); camInit = true; }
    const k = 1 - Math.exp(-camK * dt);
    camPos.lerp(tPos, k); camLook.lerp(tLook, k);
    camera.position.copy(camPos);
    if (shake > 0) { camera.position.x += (Math.random() - 0.5) * shake; camera.position.y += (Math.random() - 0.5) * shake; shake = Math.max(0, shake - dt * 0.12); }
    camera.lookAt(camLook);
  }

  /* =========================================================
   * 版面、畫質、主迴圈
   * ========================================================= */
  const composer = new EffectComposer(renderer);
  composer.addPass(new RenderPass(scene, camera));
  const bloom = new UnrealBloomPass(new THREE.Vector2(256, 256), 0.38, 0.45, 0.9);
  composer.addPass(bloom);
  composer.addPass(new OutputPass());
  function resize() {
    VW = innerWidth; VH = innerHeight;
    renderer.setSize(VW, VH, false);
    composer.setSize(VW, VH);
    bloom.resolution.set(VW / 4, VH / 4);
    const asp = VW / VH;
    camera.aspect = asp;
    camera.fov = asp < 0.75 ? 60 : asp < 1.2 ? 54 : 50;
    camera.updateProjectionMatrix();
    document.body.classList.toggle('land', VW > VH);
    document.body.classList.toggle('port', VW <= VH && VW < 700);
    document.body.classList.toggle('short', VH < 520);
    fx.width = VW; fx.height = VH;
    if (game) { $('board').style.setProperty('--nmw', game.players.length > 1 ? (VW < 700 ? '52px' : '86px') : (VW < 700 ? '30px' : '44px')); layoutHUD(); }
  }
  window.addEventListener('resize', resize);
  const QKEY = 'quality:' + location.pathname.split('/').filter(Boolean).slice(-1)[0];
  const baseRatio = Math.min(window.devicePixelRatio || 1, small ? 1.75 : 2);
  const QLEVELS = [
    { ratio: baseRatio, bloom: true, shadow: true },
    { ratio: Math.min(baseRatio, 1.35), bloom: true, shadow: true },
    { ratio: 1, bloom: true, shadow: true },
    { ratio: 1, bloom: false, shadow: true },
    { ratio: 1, bloom: false, shadow: false },
    { ratio: 0.8, bloom: false, shadow: false }
  ];
  let qLevel = clamp(KG.store.get(QKEY, KG.lowEnd ? 2 : 0) | 0, 0, QLEVELS.length - 1);
  const perf = { last: 0, n: 0, sum: 0, cool: 2.5 };
  function applyQuality() {
    const q = QLEVELS[qLevel];
    renderer.setPixelRatio(q.ratio);
    renderer.setSize(VW, VH, false);
    composer.setPixelRatio(q.ratio);
    composer.setSize(VW, VH);
    if (renderer.shadowMap.enabled !== q.shadow) {
      renderer.shadowMap.enabled = q.shadow;
      scene.traverse(o => { if (o.material) [].concat(o.material).forEach(m => { m.needsUpdate = true; }); });
    }
  }
  function renderFrame() {
    if (QLEVELS[qLevel].bloom) composer.render(); else renderer.render(scene, camera);
    const now = performance.now(), dt = perf.last ? Math.min(0.5, (now - perf.last) / 1000) : 0;
    perf.last = now;
    if (document.hidden || qLevel >= QLEVELS.length - 1) return;
    perf.cool -= dt;
    if (perf.cool > 0) return;
    perf.sum += dt; perf.n++;
    if (perf.n >= 60) {
      if (perf.sum / perf.n > 1 / 45) {
        qLevel++;
        KG.store.set(QKEY, qLevel);
        applyQuality();
        perf.cool = 1.5;
      }
      perf.n = 0; perf.sum = 0;
    }
  }
  function drawFx(dt) {
    if (trailFade <= 0 && !fx._dirty) return;
    fxc.clearRect(0, 0, VW, VH);
    fx._dirty = false;
    if (trailFade <= 0 || swipeTrail.length < 2) return;
    if (!ges) trailFade -= dt * 2.5;
    fx._dirty = true;
    fxc.lineCap = 'round'; fxc.lineJoin = 'round';
    const n = swipeTrail.length;
    for (let pass = 0; pass < 2; pass++) {
      fxc.beginPath();
      for (let i = Math.max(0, n - 40); i < n; i++) { const p = swipeTrail[i]; if (i === Math.max(0, n - 40)) fxc.moveTo(p.x, p.y); else fxc.lineTo(p.x, p.y); }
      fxc.strokeStyle = pass ? 'rgba(255,255,255,' + (0.7 * trailFade) + ')' : 'rgba(60,232,255,' + (0.25 * trailFade) + ')';
      fxc.lineWidth = pass ? 3 : 12;
      fxc.stroke();
    }
  }
  function updAimInfo(dt) {
    const el = $('aimInfo');
    aim.show -= dt;
    const on = phase === 'aim' && !isAI() && (aim.show > 0 || !!charge || (ges && ges.mode === 'swipe'));
    el.classList.toggle('show', on);
    document.body.classList.toggle('aiming', on);
    if (on) {
      $('pFill').style.width = Math.round(aim.power * 100) + '%';
      const s = aim.spin;
      $('spinT').textContent = Math.abs(s) < 0.05 ? '直球' : (s < 0 ? '左勾 ' : '右勾 ') + Math.round(Math.abs(s) * 100) + '%';
    }
  }
  let last = performance.now(), first = true, hudT = 0;
  function frame(now) {
    const dt = Math.max(0, Math.min(0.05, (now - last) / 1000));
    last = now;
    update(dt);
    if (hintHold > 0) { hintHold -= dt; if (hintHold <= 0) updateHUD(); }
    rumble(Math.hypot(W.ball.vx, W.ball.vy), game && phase === 'roll' && (W.ball.st === 1 || W.ball.st === 2));
    musicTick();
    const sdt = paused ? 0 : dt;
    sync3D(sdt);
    computeCamera(dt);
    renderFrame();
    drawFx(dt);
    updAimInfo(dt);
    hudT -= dt;
    if (hudT <= 0 && game) { hudT = 0.2; updateHUD(); }
    if (first) { first = false; const m = $('msg'); if (m) m.remove(); }
    requestAnimationFrame(frame);
  }
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) { rumbleStop(); if (game && phase !== 'over' && !paused) togglePause(true); }
    last = performance.now();
  });
  resize();
  applyQuality();
  $('title').classList.remove('hide');
  updateTitle();
  drawMonitor();
  requestAnimationFrame(frame);

  /* =========================================================
   * 測試用
   * ========================================================= */
  const pinList = () => W.pins.map(p => ({ i: p.i + 1, x: +p.x.toFixed(4), y: +p.y.toFixed(4), z: +p.z.toFixed(4), st: p.st, standing: Core.isStanding(p), tilt: +(Math.acos(clamp(p.az, -1, 1)) * 180 / Math.PI).toFixed(1) }));
  function stepFrames(n) { for (let i = 0; i < (n || 1); i++) { update(1 / 60); sync3D(1 / 60); } }
  window.__bw = {
    core: Core,
    state: () => ({ phase, paused, ff, quick, mode: game && game.mode, cur: game && game.cur, player: game && curP().name, ai: game ? isAI() : false, status: game && Core.status(curP().rolls), standing: Core.standCount(W), ball: { st: W.ball.st, x: +W.ball.x.toFixed(3), y: +W.ball.y.toFixed(3) }, aim: { ...aim }, last: lastResult, lastThrow, q: qLevel, throws: game && game.throws, overOpen: !!document.querySelector('.ov.dyn') }),
    start: o => { startGame(o || {}); return window.__bw.state(); },
    throw: (pos, speed, angle, spin) => doThrow(pos == null ? aim.pos : pos, speed == null ? 8 : speed, angle || 0, spin || 0),
    step: n => { stepFrames(n); return phase; },
    settle: (max) => { let i = 0; const m = max || 30000; do { update(1 / 60); i++; } while (i < m && game && !(phase === 'aim' && !isAI()) && phase !== 'over'); sync3D(0); return { phase, frames: i }; },
    settleThrow: () => { let i = 0; while (i < 20000 && phase === 'roll') { update(1 / 60); i++; } return { phase, frames: i, last: lastResult }; },
    pins: pinList,
    score: () => game ? game.players.map(p => ({ name: p.name, rolls: p.rolls.slice(), frames: Core.score(p.rolls), marks: Core.marks(p.rolls), total: Core.total(p.rolls), status: Core.status(p.rolls) })) : null,
    setAim: (pos, angle, spin, power) => { if (pos != null) aim.pos = pos; if (angle != null) aim.angle = angle; if (spin != null) aim.spin = spin; if (power != null) aim.power = power; aim.dirty = true; },
    toScreen: (x, y, z) => toScreen(x, y, z),
    ballScreen: () => toScreen(aim.pos, AIM_Y, BR),
    quality: n => { qLevel = clamp(n, 0, QLEVELS.length - 1); perf.cool = 1e9; applyQuality(); },
    info: () => ({ calls: renderer.info.render.calls, tris: renderer.info.render.triangles, q: qLevel }),
    snapCam: () => { camInit = false; },
    ff: v => { ff = !!v; },
    toTitle,
    pause: v => togglePause(v)
  };
}
</script>
</body>
</html>
