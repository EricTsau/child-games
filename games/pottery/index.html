<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>3D 陶藝工作室</title>
<link rel="stylesheet" href="../../assets/common.css">
<style>
  :root { --ink: #3d2a1e; --terra: #d8622c; --cream: #fff7ea; }
  html, body { height: 100%; overflow: hidden; background: #2a1c14; color: var(--ink); }
  #gl { position: fixed; inset: 0; width: 100vw; height: 100vh; height: 100dvh; display: block; touch-action: none; }
  #msg { position: fixed; inset: 0; display: grid; place-items: center; padding: 24px; text-align: center; color: #f3e2c8; font-size: 20px; font-weight: 800; z-index: 1; }
  .hide { display: none !important; }
  button { font-family: var(--kg-font); }

  .btn { border: 0; border-radius: 16px; padding: 10px 16px; font-size: 18px; font-weight: 900; color: #fff; cursor: pointer; box-shadow: 0 4px 0 rgba(0,0,0,.25); text-shadow: 0 1px 0 rgba(0,0,0,.25); transition: transform .08s, box-shadow .08s; white-space: nowrap; }
  .btn:active { transform: translateY(3px); box-shadow: 0 1px 0 rgba(0,0,0,.25); }
  .b-orange { background: linear-gradient(180deg, #f7a25e, #d8622c); }
  .b-teal { background: linear-gradient(180deg, #5cc1b4, #2c8a80); }
  .b-wood { background: linear-gradient(180deg, #a8774e, #734626); }
  .b-red { background: linear-gradient(180deg, #f0785a, #c13b28); }
  .b-cream { background: linear-gradient(180deg, #fffaf0, #efe0c6); color: var(--ink); text-shadow: none; }

  /* ---------- 標題 ---------- */
  #title { position: fixed; inset: 0; z-index: 50; display: flex; flex-direction: column; justify-content: space-between; align-items: center; padding: 62px 16px calc(14px + env(safe-area-inset-bottom)); pointer-events: none; }
  #title > * { pointer-events: auto; }
  .logo { text-align: center; }
  .l1 { font-size: clamp(34px, 9.5vw, 62px); font-weight: 900; color: #fff4e0; letter-spacing: 2px; line-height: 1.05; text-shadow: 0 3px 0 #b5562a, 0 6px 0 #6b3317, 0 10px 18px rgba(0,0,0,.45); }
  .l2 { display: inline-block; margin-top: 10px; font-size: clamp(14px, 3.8vw, 19px); font-weight: 900; color: #fff; background: rgba(60,35,20,.75); border: 2px solid rgba(255,240,220,.8); border-radius: 999px; padding: 4px 14px; letter-spacing: 3px; }
  .tmenu { width: min(360px, 100%); display: flex; flex-direction: column; gap: 9px; }
  .big { display: flex; flex-direction: column; align-items: center; padding: 8px 14px 9px; border-radius: 20px; }
  .big b { font-size: 22px; line-height: 1.15; }
  .big small { font-size: 13px; font-weight: 700; opacity: .92; }
  .tstat { text-align: center; color: #fff; font-size: 14px; font-weight: 800; text-shadow: 0 1px 4px rgba(0,0,0,.8); }
  .trow { display: flex; gap: 8px; justify-content: center; }
  .tog { font-weight: 900; font-size: 15px; border: 2px solid rgba(255,255,255,.85); border-radius: 999px; padding: 6px 14px; background: rgba(60,35,20,.75); color: #fff; cursor: pointer; white-space: nowrap; }
  .tog i { font-style: normal; color: #9dffa8; margin-left: 4px; }
  .tog.off i { color: #ffa1a1; }

  /* ---------- 遊戲中上方卡片 ---------- */
  #card { position: fixed; top: 8px; left: 50%; transform: translateX(-50%); z-index: 40; width: min(380px, calc(100vw - 132px)); display: flex; align-items: center; gap: 8px; background: rgba(255,248,236,.95); border: 3px solid #fff; border-radius: 18px; padding: 4px 8px; box-shadow: 0 4px 0 rgba(60,30,10,.25); }
  #sil { width: 50px; height: 50px; flex: none; background: #f1e4cf; border-radius: 12px; }
  .ci { flex: 1; min-width: 0; }
  #cName { font-weight: 900; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #cSteps { font-size: 12px; font-weight: 800; color: #b09a86; white-space: nowrap; }
  #cSteps span.on { color: var(--terra); }
  #cSteps span.done { color: #4a9a6a; }
  #cSim { flex: none; text-align: center; min-width: 52px; }
  #cSim b { display: block; font-size: 22px; line-height: 1; }
  #cSim small { font-size: 11px; font-weight: 800; color: #8a7562; }
  #hint { position: fixed; left: 50%; top: 76px; transform: translateX(-50%); z-index: 45; background: rgba(50,30,18,.88); color: #fff; font-weight: 900; font-size: 16px; padding: 7px 16px; border-radius: 999px; white-space: nowrap; opacity: 0; transition: opacity .25s; pointer-events: none; max-width: calc(100vw - 24px); overflow: hidden; text-overflow: ellipsis; }
  #hint.on { opacity: 1; }
  #hint.warn { background: rgba(190,50,30,.92); }
  #hint.good { background: rgba(40,140,90,.92); }
  #pauseBtn { position: fixed; right: 12px; top: 62px; width: 44px; height: 44px; border-radius: 50%; border: 3px solid #fff; background: rgba(70,40,20,.7); z-index: 60; display: grid; place-items: center; cursor: pointer; box-shadow: 0 4px 0 rgba(0,0,0,.25); padding: 0; }
  #pauseBtn i { display: block; width: 14px; height: 16px; border-left: 5px solid #fff; border-right: 5px solid #fff; }

  /* ---------- 工具列 ---------- */
  .bar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 40; padding: 0 8px calc(8px + env(safe-area-inset-bottom)); pointer-events: none; }
  .bin { pointer-events: auto; width: min(720px, 100%); margin: 0 auto; display: flex; flex-direction: column; gap: 8px; background: rgba(255,247,234,.95); border: 3px solid #fff; border-radius: 20px; padding: 8px; box-shadow: 0 6px 20px rgba(30,12,0,.35); }
  .bscroll { display: flex; flex-direction: column; gap: 8px; min-height: 0; }
  .bacts { display: flex; gap: 8px; flex: none; }
  .bacts .main { flex: 1; }
  .tools { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
  .tools.t5 { grid-template-columns: repeat(5, 1fr); }
  .tool { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; border: 2px solid #e8d6bd; background: #fff; border-radius: 14px; padding: 4px 2px 3px; font-weight: 900; font-size: 13px; color: #6b4a33; cursor: pointer; min-width: 0; white-space: nowrap; }
  .tool svg, .tool canvas { width: 26px; height: 26px; flex: none; }
  .tool.sel { border-color: var(--terra); background: #fff0e0; box-shadow: 0 3px 0 var(--terra); color: #c04f1c; }
  .tool.tg.on { border-color: #2c8a80; background: #e6f6f3; color: #1f6d64; }
  .tool.act { background: #fdf3e4; }
  .speed { display: flex; align-items: center; gap: 8px; font-weight: 900; font-size: 14px; color: #6b4a33; }
  .speed input { flex: 1; accent-color: var(--terra); height: 28px; min-width: 0; }
  .speed b { min-width: 30px; text-align: right; font-variant-numeric: tabular-nums; }
  .sw { display: grid; grid-template-columns: repeat(12, 1fr); gap: 4px; }
  .sw button { aspect-ratio: 1; border-radius: 50%; border: 3px solid #fff; box-shadow: 0 0 0 1px #d9c6ad; padding: 0; cursor: pointer; min-width: 0; max-width: 40px; justify-self: center; width: 100%; }
  .sw button.sel { box-shadow: 0 0 0 3px var(--terra); transform: scale(1.1); }
  .grow { display: flex; gap: 6px; align-items: center; justify-content: space-between; }
  .mini { border: 2px solid #e8d6bd; background: #fff; border-radius: 12px; padding: 6px 10px; font-weight: 900; font-size: 14px; color: #6b4a33; cursor: pointer; white-space: nowrap; }
  .mini i { font-style: normal; color: var(--terra); }
  .seg { display: inline-flex; background: #efe2cf; border-radius: 12px; padding: 3px; gap: 2px; }
  .seg button { border: 0; background: transparent; border-radius: 9px; padding: 5px 11px; font-weight: 900; font-size: 14px; color: #8a6a50; cursor: pointer; }
  .seg button.sel { background: var(--terra); color: #fff; }
  .tip { display: none; font-size: 13px; font-weight: 700; line-height: 1.6; color: #7a5a43; background: #fdf3e4; border-radius: 12px; padding: 6px 10px; }
  .tip b { color: var(--terra); }
  .seg .lab { padding: 5px 4px 5px 6px; font-weight: 900; font-size: 13px; color: #8a6a50; align-self: center; }

  /* ---------- 窯 ---------- */
  #kilnUI { position: fixed; left: 50%; bottom: calc(14px + env(safe-area-inset-bottom)); transform: translateX(-50%); z-index: 40; display: flex; align-items: center; gap: 10px; background: rgba(40,20,10,.82); color: #fff; border: 3px solid rgba(255,220,180,.85); border-radius: 999px; padding: 6px 6px 6px 16px; font-weight: 900; white-space: nowrap; }
  .therm { width: 90px; height: 12px; border-radius: 6px; background: rgba(255,255,255,.2); overflow: hidden; }
  .therm i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, #ffd36a, #ff7a2a, #ff3a1a); }
  #tempV { min-width: 76px; font-size: 18px; font-variant-numeric: tabular-nums; }

  /* ---------- 作品架 ---------- */
  #galTop { position: fixed; top: 10px; left: 50%; transform: translateX(-50%); z-index: 40; background: rgba(255,248,236,.95); border: 3px solid #fff; border-radius: 999px; padding: 6px 18px; font-weight: 900; font-size: 17px; box-shadow: 0 4px 0 rgba(60,30,10,.25); white-space: nowrap; max-width: calc(100vw - 132px); overflow: hidden; text-overflow: ellipsis; }
  .bbar { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(10px + env(safe-area-inset-bottom)); z-index: 40; display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; width: max-content; max-width: calc(100vw - 16px); }
  .gnote { width: 100%; text-align: center; color: #fff; font-weight: 800; font-size: 14px; text-shadow: 0 1px 4px rgba(0,0,0,.85); }

  /* ---------- 對話框 ---------- */
  .modal { position: fixed; inset: 0; z-index: 9100; display: grid; place-items: center; padding: 14px; background: rgba(40,22,10,.45); }
  .modal.sheet { background: transparent; place-items: end center; pointer-events: none; padding-bottom: calc(10px + env(safe-area-inset-bottom)); }
  .mcard { pointer-events: auto; width: min(430px, 100%); max-height: calc(100dvh - 28px); display: flex; flex-direction: column; background: linear-gradient(180deg, #fffaf2, #fbefdc); border: 4px solid #fff; border-radius: 26px; box-shadow: 0 14px 40px rgba(30,12,0,.45); padding: 14px 14px 12px; animation: pop .3s cubic-bezier(.2,1.5,.4,1); }
  .modal.sheet .mcard { max-height: 54dvh; }
  .mbody { overflow-y: auto; min-height: 0; flex: 1 1 auto; text-align: center; -webkit-overflow-scrolling: touch; }
  .macts { flex: none; display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-top: 10px; }
  .macts .btn { flex: 1 1 auto; font-size: 17px; padding: 10px 12px; }
  @keyframes pop { from { transform: scale(.85); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  .mt { font-size: 24px; font-weight: 900; margin: 2px 0 6px; }
  .mp { font-size: 16px; line-height: 1.55; margin: 0 0 8px; font-weight: 700; color: #5a4433; }
  .who { display: flex; align-items: center; gap: 10px; text-align: left; }
  .who canvas { width: 68px; height: 68px; flex: none; }
  .bubble { position: relative; flex: 1; background: #fff; border: 2px solid #ecd9bf; border-radius: 16px; padding: 8px 12px; font-weight: 800; font-size: 15px; line-height: 1.45; }
  .bubble::before { content: ''; position: absolute; left: -9px; top: 22px; border: 8px solid transparent; border-right-color: #ecd9bf; border-left: 0; }
  .ord { display: flex; align-items: center; gap: 12px; justify-content: center; margin: 10px 0 4px; }
  .ord canvas { width: 120px; height: 120px; background: #f1e4cf; border-radius: 16px; flex: none; }
  .ord .oi { text-align: left; font-weight: 800; font-size: 15px; line-height: 1.6; }
  .ord .oi b { font-size: 22px; color: var(--terra); }
  .chip { display: inline-block; background: #fff0e0; border: 2px solid #f2c9a4; border-radius: 999px; padding: 1px 10px; font-size: 14px; font-weight: 900; color: #b5501f; }
  .stars { display: flex; gap: 6px; justify-content: center; margin: 6px 0; }
  .stars s { width: 34px; height: 34px; display: block; clip-path: polygon(50% 0, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%); background: #e6d8c4; animation: pop .35s cubic-bezier(.2,1.6,.4,1) backwards; }
  .stars s.on { background: linear-gradient(180deg, #ffe066, #f5a623); }
  .rgrid { display: flex; gap: 8px; justify-content: center; margin: 6px 0; }
  .rgrid div { background: #fff; border: 2px solid #ecd9bf; border-radius: 14px; padding: 4px 14px; min-width: 96px; }
  .rgrid small { display: block; font-size: 12px; font-weight: 800; color: #8a7562; }
  .rgrid b { font-size: 22px; font-variant-numeric: tabular-nums; }
  .ok { color: #2f8a55; font-weight: 900; }
  .no { color: #b5501f; font-weight: 900; }
  .help { text-align: left; }
  .help h4 { margin: 10px 0 2px; font-size: 17px; color: var(--terra); }
  .help p { margin: 0; font-size: 15px; line-height: 1.55; font-weight: 700; }
  .ptogs { display: flex; gap: 8px; justify-content: center; margin: 8px 0 2px; }
  .ptogs .tog { background: #6b4a33; }

  @media (orientation: landscape) and (max-height: 540px) {
    #title { flex-direction: row; align-items: flex-end; justify-content: space-between; padding: 60px 16px 10px; }
    #title .logo { align-self: flex-start; text-align: left; }
    .l1 { font-size: 40px; }
    .tmenu { width: 290px; gap: 6px; }
    .big { padding: 5px 12px 6px; }
    .big b { font-size: 19px; }
    #card { padding: 3px 8px; top: 6px; }
    #sil { width: 42px; height: 42px; }
    #cSim b { font-size: 20px; }
    .bar { left: 8px; right: auto; top: 62px; bottom: 0; width: 272px; padding: 0 0 calc(8px + env(safe-area-inset-bottom)); }
    .bar .bin { height: 100%; width: 100%; }
    .bar .bscroll { flex: 1; overflow-y: auto; }
    .tip { display: block; }
    .tools { gap: 4px; }
    .tool { font-size: 11px; padding: 3px 1px 2px; border-radius: 12px; }
    .tool svg, .tool canvas { width: 22px; height: 22px; }
    .sw { grid-template-columns: repeat(6, 1fr); gap: 4px 6px; }
    .sw button { max-width: 29px; border-width: 2px; }
    .seg button { padding: 4px 9px; }
    .mini { padding: 5px 8px; }
    .seg .lab { display: none; }
    .bin { gap: 6px; }
    .bscroll { gap: 6px; }
    .grow { flex-wrap: wrap; justify-content: flex-start; }
    .modal.sheet { place-items: center end; padding: 56px 10px 8px; }
    .modal.sheet .mcard { width: 340px; max-height: calc(100dvh - 64px); }
    .modal.sheet .mcard { padding: 10px 12px 10px; }
    .modal.sheet .who canvas { width: 46px; height: 46px; }
    .modal.sheet .bubble { font-size: 14px; padding: 5px 10px; }
    .modal.sheet .bubble::before { top: 14px; }
    .modal.sheet .stars { margin: 3px 0; }
    .modal.sheet .stars s { width: 24px; height: 24px; }
    .modal.sheet .rgrid { margin: 3px 0; }
    .modal.sheet .rgrid b { font-size: 18px; }
    .modal.sheet .mp { font-size: 14px; margin-bottom: 3px; line-height: 1.4; }
    .modal.sheet .mt { font-size: 20px; }
    .modal.sheet .macts { margin-top: 6px; gap: 6px; }
    .modal.sheet .macts .btn { font-size: 15px; padding: 8px 10px; }
    .ord canvas { width: 92px; height: 92px; }
  }
</style>
<script type="importmap">
{ "imports": { "three": "../../assets/vendor/three/three.module.min.js", "three/addons/": "../../assets/vendor/three/addons/" } }
</script>

<body>
<div id="msg">陶藝工作室準備中…</div>
<canvas id="gl" aria-label="3D 陶藝工作室遊戲畫面"></canvas>

<div id="title" class="hide">
  <div class="logo" id="logo"><div class="l1">3D 陶藝工作室</div><div class="l2">拉坯・上釉・進窯燒</div></div>
  <div class="tmenu" id="tmenu">
    <div class="tstat" id="tStat"></div>
    <button class="btn big b-orange" id="bOrders"><b>接訂單</b><small>照客人要的形狀做陶器</small></button>
    <button class="btn big b-teal" id="bFree"><b>自由創作</b><small>想做什麼就做什麼</small></button>
    <button class="btn big b-wood" id="bGallery"><b>作品架</b><small id="gCount">0 / 12 件作品</small></button>
    <div class="trow"><button class="tog" id="tHelp">玩法</button><button class="tog" id="tMusic">音樂<i>開</i></button><button class="tog" id="tSfx">音效<i>開</i></button></div>
  </div>
</div>

<div id="card" class="hide"><canvas id="sil" width="104" height="104"></canvas><div class="ci"><div id="cName">自由創作</div><div id="cSteps"><span data-s="throw">拉坯</span> › <span data-s="glaze">上釉</span> › <span data-s="kiln">燒窯</span></div></div><div id="cSim"><b id="simV">--</b><small>相似度</small></div></div>
<div id="hint"></div>
<button id="pauseBtn" class="hide" aria-label="暫停"><i></i></button>

<div id="barThrow" class="bar hide"><div class="bin">
  <div class="bscroll">
    <div class="tools" id="throwTools">
      <button class="tool sel" data-tool="hand"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 12V6a1.5 1.5 0 0 1 3 0v5m0-6V4a1.5 1.5 0 0 1 3 0v7m0-5.5a1.5 1.5 0 0 1 3 0V12m0-3.5a1.5 1.5 0 0 1 3 0V15c0 3.5-2.5 6.5-6.5 6.5S7 19.5 5.5 17L3.6 13.6c-.7-1.3.9-2.6 2-1.5L7 14"/></svg><span>推拉</span></button>
      <button class="tool" data-tool="sponge"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="7" width="18" height="11" rx="4"/><circle cx="8" cy="11" r="1.2" fill="currentColor"/><circle cx="13" cy="14.5" r="1.2" fill="currentColor"/><circle cx="16.5" cy="10.5" r="1.2" fill="currentColor"/></svg><span>抹平</span></button>
      <button class="tool" data-tool="lift"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v18M7 8l5-5 5 5M7 16l5 5 5-5"/></svg><span>拉高</span></button>
      <button class="tool tg on" id="bGhost"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg><span>提示</span></button>
    </div>
    <label class="speed"><span>轉速</span><input type="range" id="spd" min="0" max="100" value="60" aria-label="轉盤速度"><b id="spdV">60</b></label>
    <div class="tip"><b>推拉</b>：手指往內推變細、往外拉變寬<br><b>頂端</b>：上下拖可以拉高、壓低<br><b>抹平</b>：用海綿抹順表面<br>牆壁太薄會塌掉，慢慢來！</div>
  </div>
  <div class="bacts"><button class="btn b-wood" id="bReset">重來</button><button class="btn b-orange main" id="bToGlaze">完成，去上釉 ▶</button></div>
</div></div>

<div id="barGlaze" class="bar hide"><div class="bin">
  <div class="bscroll">
    <div class="tools t5" id="patTools"></div>
    <div class="sw" id="sw"></div>
    <div class="grow"><div class="seg" id="sizeSeg"><span class="lab">大小</span><button data-s="0">小</button><button data-s="1" class="sel">中</button><button data-s="2">大</button></div><button class="mini" id="bSpin">轉盤<i>轉</i></button><button class="mini" id="bView">俯視</button></div>
  </div>
  <div class="bacts"><button class="btn b-red main" id="bKiln">送進窯裡燒 ▶</button></div>
</div></div>

<div id="kilnUI" class="hide"><div class="therm"><i id="thermBar"></i></div><b id="tempV">20°C</b><button class="tog" id="bSkip">快轉 ▶▶</button></div>

<div id="galTop" class="hide"></div>
<div id="galBar" class="bbar hide"></div>

<div id="modal" class="modal hide"><div class="mcard"><div class="mbody" id="mbody"></div><div class="macts" id="macts"></div></div></div>

<script src="../../assets/common.js"></script>
<script src="../../assets/kg-music.js"></script>
<script type="module">
import * as THREE from 'three';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const $ = id => document.getElementById(id);
let renderer = null;
try {
  renderer = new THREE.WebGLRenderer({ canvas: $('gl'), antialias: true, powerPreference: 'high-performance' });
} catch (e) { renderer = null; }
if (!renderer) $('msg').textContent = '這個遊戲需要支援 3D（WebGL）的瀏覽器，請換一個瀏覽器或裝置再試試看。';
else main();

function main() {
  const SLUG = 'pottery';
  const TAU = Math.PI * 2;
  const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
  const lerp = (a, b, t) => a + (b - a) * t;
  const rnd = (a, b) => a + Math.random() * (b - a);
  const ease = t => t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
  const V3 = THREE.Vector3;
  function mulberry(seed) {
    return function () {
      seed |= 0; seed = seed + 0x6D2B79F5 | 0;
      let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }

    if (e.key === 'Escape' || e.key === 'p' || e.key === 'P') { if (paused) setPaused(false); else setPaused(true); return; }
    if (paused) return;
    if (phase === 'throw') {
      if (e.key === '1') $('throwTools').querySelector('[data-tool=hand]').click();
      else if (e.key === '2') $('throwTools').querySelector('[data-tool=sponge]').click();
      else if (e.key === '3') $('throwTools').querySelector('[data-tool=lift]').click();
      else if (e.key === 'ArrowUp') { setSpeed(speed + 0.1); sfx('tick'); e.preventDefault(); }
      else if (e.key === 'ArrowDown') { setSpeed(speed - 0.1); sfx('tick'); e.preventDefault(); }
    } else if (phase === 'glaze') {
      if ((e.key === 'z' || e.key === 'Z') && (e.ctrlKey || e.metaKey)) { undo(); e.preventDefault(); }
    }
  });
  document.addEventListener('visibilitychange', () => { if (document.hidden && (phase === 'throw' || phase === 'glaze' || phase === 'kiln')) setPaused(true); });
  function onResize() { resize(); }
  window.addEventListener('resize', onResize);
  window.addEventListener('orientationchange', () => setTimeout(onResize, 120));
  if (window.visualViewport) window.visualViewport.addEventListener('resize', onResize);
  LS.addEventListener && LS.addEventListener('change', () => setTimeout(onResize, 30));

  function resize() {
    const r = cv.getBoundingClientRect();
    SW = Math.max(1, Math.round(r.width)); SH = Math.max(1, Math.round(r.height));
    renderer.setSize(SW, SH, false);
    cam.aspect = SW / SH; cam.updateProjectionMatrix();
    invalidate(); reframe(true);
  }

  /* =========================================================
   * 自動畫質：太卡就一步步降低（解析度 → 陶器細緻度 → 灰塵）
   * ========================================================= */
  const QKEY = 'quality:' + SLUG;
  const baseRatio = Math.min(window.devicePixelRatio || 1, 2);
  const QL = [
    { ratio: baseRatio, seg: 64, dust: true }, { ratio: Math.min(baseRatio, 1.5), seg: 64, dust: true },
    { ratio: Math.min(baseRatio, 1.2), seg: 48, dust: true }, { ratio: 1, seg: 40, dust: false }, { ratio: 0.8, seg: 32, dust: false }
  ];
  let qLevel = clamp(KG.store.get(QKEY, KG.lowEnd ? 2 : 0) | 0, 0, QL.length - 1);
  const perf = { last: 0, n: 0, sum: 0, cool: 3 };
  let fpsAvg = 60;
  function applyQuality() {
    const q = QL[qLevel];
    renderer.setPixelRatio(q.ratio); renderer.setSize(SW, SH, false);
    if (q.seg !== SEG) { SEG = q.seg; potMesh.geometry.dispose(); potMesh.geometry = makeLatheGeo(SEG); refreshPotGeo(); if (phase === 'glaze' || phase === 'kiln' || phase === 'result') finalizeBounds(); }
    dust.pts.visible = q.dust;
  }
  function governor() {
    const now = performance.now(), dt = perf.last ? Math.min(0.5, (now - perf.last) / 1000) : 0; perf.last = now;
    if (dt > 0) fpsAvg = lerp(fpsAvg, 1 / dt, 0.05);
    if (document.hidden || paused || qLevel >= QL.length - 1) return;
    perf.cool -= dt; if (perf.cool > 0) return;
    perf.sum += dt; perf.n++;
    if (perf.n >= 60) {
      if (perf.sum / perf.n > 1 / 45) { qLevel++; KG.store.set(QKEY, qLevel); applyQuality(); perf.cool = 2; }
      perf.n = 0; perf.sum = 0;
    }
  }

  /* =========================================================
   * 主迴圈
   * ========================================================= */
  function update(dt) {
    clock += dt;
    let rate = 0;
    if (phase === 'throw') rate = speed * 2.0;
    else if (phase === 'glaze') rate = glazeSpin ? 0.22 : 0;
    else if (phase === 'title' || phase === 'intro') rate = 0.22;
    else if (phase === 'result') rate = 0.18;
    else if (phase === 'kiln') rate = kiln && kiln.t > 9.4 ? 0.2 : 0;
    spinBoost *= Math.exp(-dt * 2);
    wheelAng += (rate * TAU + spinBoost) * dt;
    wheelHead.rotation.y = wheelAng;
    if (phase !== 'gallery') potMesh.rotation.y = wheelAng;
    // 濕陶土轉的時候會微微晃動，牆壁太薄晃得更厲害
    if (phase === 'throw' && !flop) {
      const thin = clamp((0.13 - minW) / 0.07, 0, 1), wob = (0.006 + thin * 0.035) * speed;
      potMesh.position.set(Math.sin(wheelAng * 1.0) * wob, 0, Math.cos(wheelAng * 1.0) * wob);
      potMesh.rotation.z = Math.sin(wheelAng) * thin * 0.02 * speed;
    }
    if (phase === 'throw') { if (flop) flopTick(dt); else throwTick(dt); }
    else if (phase === 'glaze') glazeTick(dt, false);
    else if (phase === 'kiln' && kiln) kilnTick(dt);
    if (phase === 'gallery' && galFocus >= 0 && shelfItems[galFocus] && !ptr.down) shelfItems[galFocus].mesh.rotation.y += dt * 0.4;
    // 轉盤馬達聲
    const motorOn = (phase === 'throw' && speed >= 0.08) || (phase === 'glaze' && glazeSpin) || phase === 'result';
    setLoop('motor', clamp(rate / 2, 0, 1) * 0.6, motorOn ? 0.035 + rate * 0.01 : 0);
    if (phase !== 'throw') { setLoop('clay', 0, 0); setLoop('sponge', 0, 0); }
    if (phase !== 'kiln') setLoop('fire', 0, 0);
    // 影子陶器輕輕閃
    if (ghost.visible) ghostMat.opacity = 0.45 + Math.sin(clock * 3) * 0.12;
    blob.visible = potMesh.visible && potMesh.position.distanceTo(P0) < 0.5;
    if (potDirty) refreshPotGeo();
    const mr = maxR(prof); blob.scale.set(mr * 2.6, mr * 2.6, 1);
    if (hintT > 0) { hintT -= dt; if (hintT <= 0) $('hint').classList.remove('on'); }
    shake = Math.max(0, shake - dt * 2.5);
  }
  let last = performance.now(), first = true, noRender = false;
  function frame(now) {
    const dt = Math.max(0, Math.min(0.05, (now - last) / 1000)); last = now;
    if (!paused) update(dt);
    updatePoints(sparks, paused ? 0 : dt); updatePoints(drops, paused ? 0 : dt);
    if (dust.pts.visible || QL[qLevel].dust) { updateDust(paused ? 0 : dt, clock); dust.pts.visible = QL[qLevel].dust; }
    flushLoops(dt);
    updateCam(dt);
    if (!noRender) { renderer.render(scene, cam); governor(); }
    if (first) { first = false; const m = $('msg'); if (m) m.remove(); }
    requestAnimationFrame(frame);
  }

  /* ---------- 開始 ---------- */
  resize();
  applyQuality();
  loadDemo();
  refreshPat();
  phase = 'title'; setUI(); updateTitle(); playSong(MENU_SONG); reframe(true);
  requestAnimationFrame(frame);

  /* ---------- 測試掛鉤 ---------- */
  window.__pot = {
    state: () => ({ phase, mode, paused, H: +prof.H.toFixed(3), maxR: +maxR(prof).toFixed(3), minW: +minW.toFixed(3), sim: simNow, ops: paint.ops.length, base: paint.base,
      gallery: gallery.length, music: KG.music ? KG.music.isPlaying() : null, song: KG.music && KG.music.current() === GAME_SONG ? 'game' : KG.music && KG.music.current() === MENU_SONG ? 'menu' : KG.music && KG.music.current() === KILN_SONG ? 'kiln' : null,
      calls: renderer.info.render.calls, tris: renderer.info.render.triangles, q: qLevel, fps: Math.round(fpsAvg), potState, flop: !!flop, kilnT: kiln ? +kiln.t.toFixed(2) : null, modal: modalOpen, result: lastResult, tool, pTool, speed }),
    order: () => order ? { key: order.key, H: tgtH(order), sc: order.sc, req: order.req && order.req.text } : null,
    shapeToTarget: f => { if (!order) return; prof.H = tgtH(order) * (f || 1); for (let i = 0; i < N; i++) { prof.r[i] = tgtR(order, i / (N - 1)) * (f || 1); prof.w[i] = 0.25; } potDirty = true; },
    setProfile: (key, sc) => setProfileFromShape(key, sc),
    thin: () => { for (let i = 30; i < 34; i++) prof.w[i] = 0.05; },
    potScreen: (t) => { const v = new V3(0, prof.H * (t == null ? 0.5 : t), 0).project(cam); return { x: (v.x + 1) / 2 * SW, y: (1 - v.y) / 2 * SH }; },
    sideScreen: (t, rf) => { const y = prof.H * (t == null ? 0.5 : t), r = rAtY(prof, y) * (rf || 1); const n = new V3(cam.position.x, 0, cam.position.z).normalize(); const v = new V3(n.z * r, y, -n.x * r).project(cam); return { x: (v.x + 1) / 2 * SW, y: (1 - v.y) / 2 * SH }; },
    slotScreen: i => { const it = shelfItems[i]; if (!it) return null; const p = it.mesh.position.clone(); p.y += it.h / 2; p.project(cam); return { x: (p.x + 1) / 2 * SW, y: (1 - p.y) / 2 * SH }; },
    fastKiln: () => { if (kiln) kiln.fast = 30; },
    tick: sec => { for (let i = 0; i < sec * 60; i++) update(1 / 60); },
    photo: () => lastPhoto ? lastPhoto.toDataURL('image/png').length : 0,
    quality: () => qLevel,
    noRender: on => { noRender = !!on; },
    settle: () => { invalidate(); reframe(true); updateCam(0.016); }
  };
}
</script>
</body>
</html>
