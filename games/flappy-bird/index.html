<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>小鳥飛飛</title>
<link rel="stylesheet" href="../../assets/common.css">
<style>
  html, body { height: 100%; overflow: hidden; background: #bfe8ff; overscroll-behavior: none; }
  #game {
    position: fixed; inset: 0; display: block;
    width: 100vw; height: 100vh; height: 100dvh;
    touch-action: none;
  }
</style>
</head>
<body>
<canvas id="game" aria-label="小鳥飛飛"></canvas>
<script src="../../assets/common.js"></script>
<script>
'use strict';
const SLUG = 'flappy-bird';
/* =====================================================================
 * 小引擎（每個遊戲內嵌一份）：畫布、補間動畫、粒子、按鈕、音樂、
 * 標題字、關卡選擇、結算畫面。遊戲本體只要實作 Game.* 即可。
 * ===================================================================== */
const cv = document.getElementById('game');
const ctx = cv.getContext('2d');
const FONT = '"Baloo 2","PingFang TC","Noto Sans TC","Microsoft JhengHei","Heiti TC",system-ui,sans-serif';
let W = 0, H = 0, dpr = 1, U = 1, time = 0;

const Game = {
  onResize() {}, onDown() {}, onMove() {}, onUp() {}, onKey() {},
  update() {}, draw() {}
};

/* ---------- 數學與緩動 ---------- */
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const TAU = Math.PI * 2;
const Ease = {
  linear: t => t,
  outCubic: t => 1 - Math.pow(1 - t, 3),
  inCubic: t => t * t * t,
  inOutSine: t => -(Math.cos(Math.PI * t) - 1) / 2,
  outBack: t => { const c = 1.70158, c3 = c + 1; return 1 + c3 * Math.pow(t - 1, 3) + c * Math.pow(t - 1, 2); },
  outElastic: t => (t === 0 || t === 1) ? t : Math.pow(2, -10 * t) * Math.sin((t * 10 - 0.75) * (TAU / 3)) + 1,
  outBounce: t => {
    const n = 7.5625, d = 2.75;
    if (t < 1 / d) return n * t * t;
    if (t < 2 / d) return n * (t -= 1.5 / d) * t + 0.75;
    if (t < 2.5 / d) return n * (t -= 2.25 / d) * t + 0.9375;
    return n * (t -= 2.625 / d) * t + 0.984375;
  }
};

/* ---------- 補間動畫 ---------- */
let tweens = [];
function tween(obj, to, dur, ease, delay, done) {
  const tw = { obj, to, from: null, dur: dur || 0.3, ease: typeof ease === 'function' ? ease : (Ease[ease] || Ease.outCubic), t: -(delay || 0), done };
  tweens.push(tw);
  return tw;
}
function killTweens(obj) { tweens = tweens.filter(t => t.obj !== obj); }
function updateTweens(dt) {
  const list = tweens.slice();
  for (const tw of list) {
    tw.t += dt;
    if (tw.t < 0) continue;
    if (!tw.from) { tw.from = {}; for (const k in tw.to) tw.from[k] = tw.obj[k]; }
    const p = Math.min(1, tw.t / tw.dur), e = tw.ease(p);
    for (const k in tw.to) tw.obj[k] = tw.from[k] + (tw.to[k] - tw.from[k]) * e;
    if (p >= 1) {
      const i = tweens.indexOf(tw);
      if (i >= 0) tweens.splice(i, 1);
      if (tw.done) tw.done();
    }
  }
}

/* ---------- 畫面震動、停格 ---------- */
let shakeT = 0, shakeAmt = 0, stopT = 0;
function shake(amt, dur) { shakeAmt = Math.max(shakeAmt * (shakeT > 0 ? 1 : 0), amt); shakeT = Math.max(shakeT, dur || 0.3); }
function hitStop(t) { stopT = Math.max(stopT, t); }
function shakeOffset() {
  if (shakeT <= 0) return [0, 0];
  const k = shakeAmt * Math.min(1, shakeT * 4);
  return [(Math.random() * 2 - 1) * k, (Math.random() * 2 - 1) * k];
}

/* ---------- 繪圖小工具 ---------- */
/** 加一個完整圓到目前路徑（先 moveTo，避免多個圓之間連線） */
function circ(x, y, r) { ctx.moveTo(x + r, y); ctx.arc(x, y, r, 0, TAU); }
function rr(x, y, w, h, r) {
  r = Math.max(0, Math.min(r, w / 2, h / 2));
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}
function starPath(x, y, R, r, rot) {
  ctx.beginPath();
  for (let i = 0; i < 10; i++) {
    const a = (rot || 0) + i * Math.PI / 5 - Math.PI / 2, rad = i % 2 ? r : R;
    ctx.lineTo(x + Math.cos(a) * rad, y + Math.sin(a) * rad);
  }
  ctx.closePath();
}
function heartPath(x, y, s) {
  ctx.beginPath();
  ctx.moveTo(x, y + s * 0.35);
  ctx.bezierCurveTo(x - s * 1.1, y - s * 0.35, x - s * 0.55, y - s * 1.05, x, y - s * 0.45);
  ctx.bezierCurveTo(x + s * 0.55, y - s * 1.05, x + s * 1.1, y - s * 0.35, x, y + s * 0.35);
  ctx.closePath();
}
function shade(hex, amt) {
  const n = parseInt(hex.slice(1), 16);
  const f = v => clamp(v + amt, 0, 255);
  return 'rgb(' + f(n >> 16) + ',' + f((n >> 8) & 255) + ',' + f(n & 255) + ')';
}
function rgba(hex, a) {
  const n = parseInt(hex.slice(1), 16);
  return 'rgba(' + (n >> 16) + ',' + ((n >> 8) & 255) + ',' + (n & 255) + ',' + a + ')';
}
/** 亮晶晶的星星（on=false 時是灰色空星） */
function glossyStar(x, y, R, on, rot) {
  ctx.save();
  ctx.lineJoin = 'round';
  if (on) {
    ctx.fillStyle = 'rgba(160,90,0,0.25)'; starPath(x, y + R * 0.12, R, R * 0.5, rot); ctx.fill();
    const g = ctx.createRadialGradient(x - R * 0.3, y - R * 0.4, R * 0.1, x, y, R * 1.1);
    g.addColorStop(0, '#fffbd0'); g.addColorStop(0.45, '#ffd93d'); g.addColorStop(1, '#f39a0c');
    ctx.fillStyle = g; ctx.strokeStyle = '#c9700a'; ctx.lineWidth = Math.max(1.5, R * 0.12);
    starPath(x, y, R, R * 0.5, rot); ctx.fill(); ctx.stroke();
    ctx.fillStyle = 'rgba(255,255,255,0.75)';
    ctx.beginPath(); ctx.ellipse(x - R * 0.25, y - R * 0.3, R * 0.22, R * 0.12, -0.6, 0, TAU); ctx.fill();
  } else {
    ctx.fillStyle = 'rgba(90,70,110,0.22)'; ctx.strokeStyle = 'rgba(90,70,110,0.35)'; ctx.lineWidth = Math.max(1.5, R * 0.1);
    starPath(x, y, R, R * 0.5, rot); ctx.fill(); ctx.stroke();
  }
  ctx.restore();
}
function glossyHeart(x, y, s, on) {
  ctx.save();
  if (on) {
    const g = ctx.createRadialGradient(x - s * 0.3, y - s * 0.5, s * 0.1, x, y - s * 0.2, s * 1.1);
    g.addColorStop(0, '#ffd0dc'); g.addColorStop(0.5, '#ff5a86'); g.addColorStop(1, '#d6245a');
    ctx.fillStyle = g; ctx.strokeStyle = '#a3163f';
  } else { ctx.fillStyle = 'rgba(90,70,110,0.2)'; ctx.strokeStyle = 'rgba(90,70,110,0.35)'; }
  ctx.lineWidth = Math.max(1.5, s * 0.12); ctx.lineJoin = 'round';
  heartPath(x, y, s); ctx.fill(); ctx.stroke();
  if (on) { ctx.fillStyle = 'rgba(255,255,255,0.7)'; ctx.beginPath(); ctx.ellipse(x - s * 0.4, y - s * 0.45, s * 0.18, s * 0.1, -0.7, 0, TAU); ctx.fill(); }
  ctx.restore();
}
/** 有外框與陰影的字 */
function txt(s, x, y, size, fill, o) {
  o = o || {};
  ctx.save();
  ctx.font = (o.weight || '900') + ' ' + size + 'px ' + FONT;
  ctx.textAlign = o.align || 'center';
  ctx.textBaseline = o.base || 'middle';
  ctx.lineJoin = 'round';
  if (o.shadow !== false) {
    ctx.fillStyle = o.shadow || 'rgba(60,30,70,0.28)';
    if (o.stroke) { ctx.strokeStyle = ctx.fillStyle; ctx.lineWidth = o.sw || size * 0.22; ctx.strokeText(s, x, y + size * 0.09); }
    ctx.fillText(s, x, y + size * 0.09);
  }
  if (o.stroke) { ctx.strokeStyle = o.stroke; ctx.lineWidth = o.sw || size * 0.22; ctx.strokeText(s, x, y); }
  ctx.fillStyle = fill; ctx.fillText(s, x, y);
  ctx.restore();
}
/** 遊戲標題字：每個字會彈跳，漸層＋白框＋深色外框 */
function logo(s, cx, cy, size, colors, outline) {
  ctx.save();
  ctx.font = '900 ' + size + 'px ' + FONT;
  ctx.textBaseline = 'middle'; ctx.textAlign = 'center'; ctx.lineJoin = 'round';
  const chars = [...s];
  const widths = chars.map(c => ctx.measureText(c).width * 1.02);
  const total = widths.reduce((a, b) => a + b, 0);
  let x = cx - total / 2;
  chars.forEach((c, i) => {
    const w = widths[i];
    const bob = Math.sin(time * 3 + i * 0.7) * size * 0.06;
    const rot = Math.sin(time * 2.2 + i) * 0.06;
    ctx.save();
    ctx.translate(x + w / 2, cy + bob); ctx.rotate(rot);
    ctx.fillStyle = 'rgba(60,30,70,0.3)';
    ctx.strokeStyle = 'rgba(60,30,70,0.3)'; ctx.lineWidth = size * 0.36;
    ctx.strokeText(c, 0, size * 0.1);
    ctx.strokeStyle = outline || '#5a2d5c'; ctx.lineWidth = size * 0.34; ctx.strokeText(c, 0, 0);
    ctx.strokeStyle = '#fff'; ctx.lineWidth = size * 0.17; ctx.strokeText(c, 0, 0);
    const col = colors[i % colors.length];
    const g = ctx.createLinearGradient(0, -size / 2, 0, size / 2);
    g.addColorStop(0, shade(col, 70)); g.addColorStop(0.5, col); g.addColorStop(1, shade(col, -35));
    ctx.fillStyle = g; ctx.fillText(c, 0, 0);
    ctx.globalAlpha = 0.55; ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.ellipse(-w * 0.18, -size * 0.25, size * 0.1, size * 0.05, -0.5, 0, TAU); ctx.fill();
    ctx.restore();
    x += w;
  });
  ctx.restore();
}
/** 標題字的高度：矮螢幕（橫向手機）時往上移 */
function titleY(k) { return H < 560 ? 50 : Math.max(110, H * (k || 0.2)); }
/** 暗角 */
function vignette(a) {
  const g = ctx.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.35, W / 2, H / 2, Math.max(W, H) * 0.75);
  g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(1, 'rgba(40,20,60,' + (a == null ? 0.25 : a) + ')');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
}
/** 進度條 */
function progressBar(x, y, w, h, p, col) {
  rr(x, y + 3, w, h, h / 2); ctx.fillStyle = 'rgba(60,30,70,0.25)'; ctx.fill();
  rr(x, y, w, h, h / 2); ctx.fillStyle = '#fff'; ctx.fill();
  ctx.strokeStyle = shade(col, -60); ctx.lineWidth = 2.5; ctx.stroke();
  const pw = Math.max(h, (w - 6) * clamp(p, 0, 1));
  if (p > 0) {
    rr(x + 3, y + 3, pw, h - 6, (h - 6) / 2);
    const g = ctx.createLinearGradient(0, y, 0, y + h);
    g.addColorStop(0, shade(col, 60)); g.addColorStop(1, col);
    ctx.fillStyle = g; ctx.fill();
    rr(x + 3 + h * 0.3, y + 4.5, Math.max(0, pw - h * 0.6), (h - 6) * 0.3, 3); ctx.fillStyle = 'rgba(255,255,255,0.6)'; ctx.fill();
  }
}
/** 糖果風的小牌子（HUD 用） */
function hudPanel(x, y, w, h, col) {
  rr(x, y + 4, w, h, h / 2); ctx.fillStyle = 'rgba(60,30,70,0.22)'; ctx.fill();
  rr(x, y, w, h, h / 2);
  const g = ctx.createLinearGradient(0, y, 0, y + h);
  g.addColorStop(0, '#ffffff'); g.addColorStop(1, shade(col, 80));
  ctx.fillStyle = g; ctx.fill();
  ctx.strokeStyle = col; ctx.lineWidth = 3; ctx.stroke();
}

/* ---------- 粒子 ---------- */
class FX {
  constructor() { this.list = []; }
  burst(x, y, o) {
    o = o || {};
    const n = o.n || 14, cols = o.colors || ['#ffe066', '#ff8fb1', '#7bd88f', '#6cc4ff', '#ffffff'];
    for (let i = 0; i < n; i++) {
      const a = o.dir != null ? o.dir + (Math.random() - 0.5) * (o.spread || 1.2) : Math.random() * TAU;
      const sp = (o.speed || 220) * (0.4 + Math.random() * 0.8);
      this.list.push({
        x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - (o.up || 0),
        life: (o.life || 0.8) * (0.7 + Math.random() * 0.5), max: o.life || 0.8,
        size: (o.size || 7) * (0.6 + Math.random() * 0.7), color: cols[i % cols.length],
        shape: o.shape || 'star', rot: Math.random() * TAU, vr: (Math.random() - 0.5) * 8,
        g: o.g == null ? 500 : o.g, drag: o.drag == null ? 0.97 : o.drag
      });
    }
  }
  text(x, y, s, o) {
    o = o || {};
    this.list.push({ shape: 'text', x, y, vx: 0, vy: o.vy || -80, s, color: o.color || '#fff', size: o.size || 26,
      stroke: o.stroke || '#5a2d5c', life: o.life || 1, max: o.life || 1, g: 0, drag: 1, rot: 0, vr: 0, pop: 0 });
  }
  ring(x, y, color, r, life) {
    this.list.push({ shape: 'ring', x, y, vx: 0, vy: 0, color: color || '#fff', size: r || 40, life: life || 0.5, max: life || 0.5, g: 0, drag: 1, rot: 0, vr: 0 });
  }
  update(dt) {
    for (const p of this.list) {
      p.life -= dt;
      p.vy += p.g * dt;
      const d = Math.pow(p.drag, dt * 60);
      p.vx *= d; p.vy *= d;
      p.x += p.vx * dt; p.y += p.vy * dt;
      p.rot += p.vr * dt;
      if (p.pop != null) p.pop += dt;
    }
    this.list = this.list.filter(p => p.life > 0);
  }
  draw() {
    for (const p of this.list) {
      const a = clamp(p.life / p.max, 0, 1);
      ctx.save();
      ctx.globalAlpha = p.shape === 'text' ? Math.min(1, a * 2) : Math.min(1, a * 1.6);
      ctx.translate(p.x, p.y); ctx.rotate(p.rot);
      const s = p.size;
      if (p.shape === 'star') { ctx.fillStyle = p.color; starPath(0, 0, s, s * 0.45, 0); ctx.fill(); }
      else if (p.shape === 'sparkle') {
        ctx.fillStyle = p.color; ctx.beginPath();
        ctx.moveTo(0, -s); ctx.quadraticCurveTo(0, 0, s, 0); ctx.quadraticCurveTo(0, 0, 0, s); ctx.quadraticCurveTo(0, 0, -s, 0); ctx.quadraticCurveTo(0, 0, 0, -s); ctx.fill();
      }
      else if (p.shape === 'heart') { ctx.fillStyle = p.color; heartPath(0, 0, s); ctx.fill(); }
      else if (p.shape === 'circle') { ctx.fillStyle = p.color; ctx.beginPath(); circ(0, 0, s * a + 1); ctx.fill(); }
      else if (p.shape === 'bubble') { ctx.strokeStyle = p.color; ctx.lineWidth = 2; ctx.beginPath(); circ(0, 0, s); ctx.stroke(); ctx.fillStyle = 'rgba(255,255,255,0.7)'; ctx.beginPath(); circ(-s * 0.35, -s * 0.35, s * 0.25); ctx.fill(); }
      else if (p.shape === 'confetti') { ctx.fillStyle = p.color; ctx.fillRect(-s / 2, -s / 3, s, s * 0.66); }
      else if (p.shape === 'drop') { ctx.rotate(-p.rot + Math.atan2(p.vy, p.vx) - Math.PI / 2); ctx.fillStyle = p.color; ctx.beginPath(); ctx.arc(0, 0, s * 0.6, 0, Math.PI); ctx.lineTo(0, -s * 1.4); ctx.closePath(); ctx.fill(); }
      else if (p.shape === 'ring') { const k = 1 - a; ctx.strokeStyle = p.color; ctx.lineWidth = 6 * a + 1; ctx.beginPath(); circ(0, 0, s * (0.3 + k)); ctx.stroke(); }
      else if (p.shape === 'text') {
        const sc = p.pop < 0.25 ? Ease.outBack(p.pop / 0.25) : 1;
        ctx.scale(sc, sc);
        txt(p.s, 0, 0, p.size, p.color, { stroke: p.stroke, sw: p.size * 0.28 });
      }
      ctx.restore();
    }
  }
}

/* ---------- 按鈕（每一格畫面重新登記） ---------- */
let btnReg = [], pressed = null;
const BTN = {
  green: ['#a6f59c', '#3fbf5c', '#24873e'], pink: ['#ffb3cc', '#f45f93', '#b8366a'], blue: ['#a8e0ff', '#3c9ff0', '#22659e'],
  yellow: ['#fff09a', '#f8b921', '#b57c0b'], purple: ['#dcc6ff', '#9b6ff2', '#5f3fae'], orange: ['#ffd0a0', '#ff8a3d', '#c1561a'],
  white: ['#ffffff', '#f3e9f7', '#b9a2c8']
};
function drawIcon(name, x, y, s, col) {
  ctx.save(); ctx.translate(x, y);
  ctx.fillStyle = col || '#fff'; ctx.strokeStyle = col || '#fff';
  ctx.lineWidth = s * 0.22; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  if (name === 'play') { ctx.beginPath(); ctx.moveTo(-s * 0.35, -s * 0.5); ctx.lineTo(s * 0.5, 0); ctx.lineTo(-s * 0.35, s * 0.5); ctx.closePath(); ctx.fill(); ctx.stroke(); }
  else if (name === 'next') { for (const dx of [-0.3, 0.25]) { ctx.beginPath(); ctx.moveTo(s * (dx - 0.2), -s * 0.4); ctx.lineTo(s * (dx + 0.25), 0); ctx.lineTo(s * (dx - 0.2), s * 0.4); ctx.stroke(); } }
  else if (name === 'replay') {
    ctx.beginPath(); ctx.arc(0, 0, s * 0.42, -Math.PI * 0.3, Math.PI * 1.35); ctx.stroke();
    const a = -Math.PI * 0.3, ex = Math.cos(a) * s * 0.42, ey = Math.sin(a) * s * 0.42;
    ctx.beginPath(); ctx.moveTo(ex + s * 0.2, ey - s * 0.05); ctx.lineTo(ex - s * 0.02, ey + s * 0.25); ctx.lineTo(ex - s * 0.25, ey - s * 0.12); ctx.closePath(); ctx.fill();
  }
  else if (name === 'menu') { for (let i = -1; i <= 1; i += 2) for (let j = -1; j <= 1; j += 2) { rr(i * s * 0.25 - s * 0.17, j * s * 0.25 - s * 0.17, s * 0.34, s * 0.34, s * 0.08); ctx.fill(); } }
  else if (name === 'lock') {
    ctx.lineWidth = s * 0.16; ctx.beginPath(); ctx.arc(0, -s * 0.12, s * 0.26, Math.PI, 0); ctx.stroke();
    rr(-s * 0.38, -s * 0.12, s * 0.76, s * 0.6, s * 0.12); ctx.fill();
    ctx.fillStyle = 'rgba(0,0,0,0.25)'; ctx.beginPath(); circ(0, s * 0.15, s * 0.08); ctx.fill();
  }
  else if (name === 'music') { ctx.beginPath(); ctx.ellipse(-s * 0.18, s * 0.3, s * 0.18, s * 0.13, -0.4, 0, TAU); ctx.fill(); ctx.lineWidth = s * 0.12; ctx.beginPath(); ctx.moveTo(-s * 0.02, s * 0.3); ctx.lineTo(-s * 0.02, -s * 0.45); ctx.quadraticCurveTo(s * 0.25, -s * 0.3, s * 0.35, -s * 0.1); ctx.stroke(); }
  ctx.restore();
}
/** 立體糖果按鈕。opts: {label, icon, color, onClick, size, pulse, disabled} */
function button(id, x, y, w, h, opts) {
  btnReg.push({ id, x, y, w, h, onClick: opts.onClick, disabled: opts.disabled });
  const pal = BTN[opts.color || 'green'];
  const isDown = pressed && pressed.id === id;
  let s = isDown ? 0.92 : 1;
  if (opts.pulse && !isDown) s *= 1 + Math.sin(time * 5) * 0.035;
  const lip = Math.max(4, h * 0.1);
  ctx.save();
  ctx.translate(x + w / 2, y + h / 2); ctx.scale(s, s);
  if (opts.disabled) ctx.globalAlpha = 0.55;
  const r = opts.radius == null ? h / 2 : opts.radius;
  const yo = isDown ? lip * 0.6 : 0;
  rr(-w / 2, -h / 2 + lip + 3, w, h, r); ctx.fillStyle = 'rgba(60,30,70,0.22)'; ctx.fill();
  rr(-w / 2, -h / 2 + lip, w, h, r); ctx.fillStyle = pal[2]; ctx.fill();
  rr(-w / 2, -h / 2 + yo, w, h, r);
  const g = ctx.createLinearGradient(0, -h / 2, 0, h / 2);
  g.addColorStop(0, pal[0]); g.addColorStop(0.55, pal[1]); g.addColorStop(1, shade(pal[1], -15));
  ctx.fillStyle = g; ctx.fill();
  ctx.strokeStyle = pal[2]; ctx.lineWidth = Math.max(2, h * 0.05); ctx.stroke();
  rr(-w / 2 + h * 0.22, -h / 2 + yo + h * 0.09, w - h * 0.44, h * 0.3, h * 0.15);
  ctx.fillStyle = 'rgba(255,255,255,0.45)'; ctx.fill();
  const fs = opts.size || h * 0.42;
  const tc = opts.color === 'white' ? '#6a4a7a' : '#fff';
  if (opts.icon && opts.label) {
    const tw = (ctx.font = '900 ' + fs + 'px ' + FONT, ctx.measureText(opts.label).width);
    const tot = fs * 1.1 + tw;
    drawIcon(opts.icon, -tot / 2 + fs * 0.45, yo, fs * 0.9, tc);
    txt(opts.label, -tot / 2 + fs * 1.1 + tw / 2, yo + 1, fs, tc, { stroke: pal[2], sw: fs * 0.2, shadow: false });
  } else if (opts.icon) drawIcon(opts.icon, 0, yo, fs * 1.1, tc);
  else if (opts.label != null) txt(opts.label, 0, yo + 1, fs, tc, { stroke: pal[2], sw: fs * 0.2, shadow: false });
  ctx.restore();
}
function hitBtn(x, y) {

/* ---------- 背景音樂（用 KG.note 合成） ---------- */
// 瀏覽器規定：使用者互動後才能播放聲音
let userActed = false;
window.addEventListener('pointerdown', () => { userActed = true; }, { capture: true });
window.addEventListener('keydown', () => { userActed = true; }, { capture: true });
const NOTE_IDX = { C: 0, D: 2, E: 4, F: 5, G: 7, A: 9, B: 11 };
function nf(name) {
  const m = /^([A-G])(#|b)?(\d)$/.exec(name);
  if (!m) return 0;
  let n = NOTE_IDX[m[1]] + (m[2] === '#' ? 1 : m[2] === 'b' ? -1 : 0) + (parseInt(m[3], 10) + 1) * 12;
  return 440 * Math.pow(2, (n - 69) / 12);
}
const Music = {
  on: false, song: null, step: 0, next: 0,
  /** song: {bpm, mel:'C5 E5 - G5 ...'（八分音符，- 表示延長，. 表示休止）, bass:'C3 . G2 .'} */
  start(song) {
    this.song = { bpm: song.bpm, mel: song.mel.trim().split(/\s+/), bass: (song.bass || '').trim().split(/\s+/), vol: song.vol || 1, wave: song.wave || 'triangle' };
    this.on = true; this.step = 0; this.next = 0.15;
  },
  stop() { this.on = false; },
  update(dt) {
    if (!this.on || !this.song || !userActed) return;
    this.next -= dt;
    if (this.next < -0.3) this.next = 0;
    const s = this.song, beat = 60 / s.bpm / 2;
    while (this.next <= 0) {
      if (!KG.isMuted() && !document.hidden) {
        const i = this.step % s.mel.length, tok = s.mel[i];
        if (tok !== '-' && tok !== '.') {
          let len = 1;
          while (s.mel[(i + len) % s.mel.length] === '-' && len < 8) len++;
          const f = nf(tok);
          KG.note(f, beat * len * 0.95, s.wave, 0.05 * s.vol);
          KG.note(f * 2, beat * len * 0.5, 'sine', 0.015 * s.vol);
        }
        if (s.bass.length > 1) {
          const bi = this.step % s.bass.length, bt = s.bass[bi];
          if (bt !== '-' && bt !== '.') KG.note(nf(bt), beat * 1.8, 'sine', 0.07 * s.vol);
        }
      }
      this.step++;
      this.next += beat;
    }
  }
};
document.addEventListener('visibilitychange', () => { if (document.hidden) Music.next = 0.2; });

/**
 * opts: { levels:[{name}], title, color, onPick(i), skins:[{name, need, draw(x,y,s)}], skin, onSkin(i), top }
 */
function levelSelect(opts) {
  const stars = Save.stars(), total = Save.total();
  const top = Math.max(76, H * 0.08);
  txt(opts.title || '選擇關卡', W / 2, top, 30 * U, '#fff', { stroke: opts.color, sw: 9 * U });
  // 星星總數
  const tw = 120 * U, th = 40 * U;
  hudPanel(W / 2 - tw / 2, top + 26 * U, tw, th, opts.color);
  glossyStar(W / 2 - tw / 2 + 24 * U, top + 26 * U + th / 2, 14 * U, true);
  txt(total + ' / ' + opts.levels.length * 3, W / 2 + 12 * U, top + 26 * U + th / 2 + 1, 20 * U, '#5a2d5c', { shadow: false });

  const n = opts.levels.length;
  const hasSkins = opts.skins && opts.skins.length;
  const areaTop = top + 82 * U, areaBot = H - (hasSkins ? 170 * U : 30 * U);
  const cols = W > H * 1.1 ? Math.min(n, 5) : Math.min(n, 3);
  const rows = Math.ceil(n / cols);
  const gap = 14 * U;
  let cw = Math.min(150 * U, (W - 32 - gap * (cols - 1)) / cols);
  let ch = cw * 1.12;
  if (rows * ch + (rows - 1) * gap > areaBot - areaTop) { ch = (areaBot - areaTop - (rows - 1) * gap) / rows; cw = Math.min(cw, ch / 1.05); }
  const gx = (W - (cols * cw + (cols - 1) * gap)) / 2;
  const gy = areaTop + Math.max(0, (areaBot - areaTop - (rows * ch + (rows - 1) * gap)) / 2);
  for (let i = 0; i < n; i++) {
    const c = i % cols, r = Math.floor(i / cols);
    const x = gx + c * (cw + gap), y = gy + r * (ch + gap);
    const locked = i > 0 && !(stars[i - 1] > 0) && !opts.allOpen;
    const st = stars[i] || 0;
    const appear = clamp((time - (opts.enterT || 0)) * 4 - i * 0.25, 0, 1);
    const sc = Ease.outBack(appear);
    if (sc <= 0) continue;
    ctx.save();
    ctx.translate(x + cw / 2, y + ch / 2); ctx.scale(sc, sc); ctx.translate(-(x + cw / 2), -(y + ch / 2));
    button('lv' + i, x, y, cw, ch, {
      color: locked ? 'white' : (opts.cardColors ? opts.cardColors[i % opts.cardColors.length] : 'pink'),
      radius: 22 * U, label: '', disabled: locked,
      onClick: () => opts.onPick(i)
    });
    if (locked) drawIcon('lock', x + cw / 2, y + ch * 0.42, cw * 0.36, '#b9a2c8');
    else {
      txt(String(i + 1), x + cw / 2, y + ch * 0.36, ch * 0.34, '#fff', { stroke: 'rgba(80,40,90,0.55)', sw: ch * 0.07 });
      if (opts.levels[i].name) txt(opts.levels[i].name, x + cw / 2, y + ch * 0.62, Math.min(16 * U, cw * 0.14), '#fff', { stroke: 'rgba(80,40,90,0.5)', sw: 4 * U, shadow: false });
      for (let k = 0; k < 3; k++) glossyStar(x + cw / 2 + (k - 1) * cw * 0.26, y + ch * 0.83 - (k === 1 ? 4 * U : 0), cw * 0.1, k < st);
    }
    ctx.restore();
  }
  // 造型（用星星解鎖）
  if (hasSkins) {
    const k = opts.skins.length;
    const sz = Math.min(76 * U, (W - 40 - (k - 1) * 10 * U) / k);
    const y0 = H - 150 * U;
    txt('造型（集星星解鎖）', W / 2, y0, 17 * U, '#fff', { stroke: opts.color, sw: 6 * U });
    const sx0 = W / 2 - (k * sz + (k - 1) * 10 * U) / 2;
    opts.skins.forEach((sk, i) => {
      const x = sx0 + i * (sz + 10 * U), y = y0 + 20 * U;
      const locked = total < sk.need;
      const sel = opts.skin === i;
      button('sk' + i, x, y, sz, sz, { color: sel ? 'yellow' : 'white', radius: 18 * U, label: '', onClick: () => {
        if (locked) { KG.sound('wrong'); KG.toast('還需要 ' + (sk.need - total) + ' 顆星星喔！'); return; }
        opts.onSkin(i);
      } });
      ctx.save();
      if (locked) ctx.globalAlpha = 0.35;
      sk.draw(x + sz / 2, y + sz * 0.48, sz * 0.36);
      ctx.restore();
      if (locked) {
        drawIcon('lock', x + sz / 2, y + sz * 0.45, sz * 0.32, '#9d84ad');
        glossyStar(x + sz * 0.38, y + sz * 0.82, sz * 0.09, true);
        txt(String(sk.need), x + sz * 0.6, y + sz * 0.83, sz * 0.18, '#7a5a8a', { shadow: false });
      }
    });
  }
}

/* ---------- 共用畫面：結算 ---------- */
const Result = {
  on: false, t: 0, o: null, shown: 0, panel: { s: 0 },
  /** o: { stars, title, lines:[], unlock, onNext, onRetry, onMenu, color } */
  show(o) {
    this.on = true; this.t = 0; this.o = o; this.shown = 0; this.panel.s = 0;
    killTweens(this.panel);
    tween(this.panel, { s: 1 }, 0.5, 'outBack');
    if (o.stars > 0) { KG.sound('win'); KG.confetti(); } else KG.sound('lose');
  },
  hide() { this.on = false; },
  update(dt, fx) {
    if (!this.on) return;
    this.t += dt;
    const o = this.o;
    while (this.shown < 3 && this.t > 0.6 + this.shown * 0.38) {
      if (this.shown < o.stars) {
        KG.note(660 * Math.pow(1.26, this.shown), 0.25, 'triangle', 0.22);
        KG.note(1320 * Math.pow(1.26, this.shown), 0.3, 'sine', 0.08);
        const p = this.starPos(this.shown);
        fx.burst(p[0], p[1], { n: 16, colors: ['#ffe066', '#fff', '#ffb02e'], speed: 260, g: 300, size: 7 * U });
      }
      this.shown++;
    }
  },
  geom() {
    const pw = Math.min(W - 32, 420 * U), ph = Math.min(H - 120, 440 * U);
    return { x: (W - pw) / 2, y: (H - ph) / 2 + 20 * U, w: pw, h: ph };
  },
  starPos(i) {
    const g = this.geom();
    return [W / 2 + (i - 1) * g.w * 0.24, g.y + g.h * 0.27 - (i === 1 ? 14 * U : 0)];
  },
  draw() {
    if (!this.on) return;
    const o = this.o, g = this.geom(), col = o.color || '#f45f93';
    ctx.fillStyle = 'rgba(50,25,70,' + (0.45 * Math.min(1, this.t * 3)) + ')';
    ctx.fillRect(0, 0, W, H);
    const s = this.panel.s;
    ctx.save();
    ctx.translate(W / 2, g.y + g.h / 2); ctx.scale(s, s); ctx.translate(-W / 2, -(g.y + g.h / 2));
    // 背後旋轉光芒
    ctx.save(); ctx.translate(W / 2, g.y + g.h * 0.27); ctx.rotate(time * 0.4);
    ctx.fillStyle = 'rgba(255,240,170,0.18)';
    for (let i = 0; i < 12; i++) { ctx.rotate(TAU / 12); ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(-30 * U, g.w * 0.75); ctx.lineTo(30 * U, g.w * 0.75); ctx.fill(); }
    ctx.restore();
    // 面板
    rr(g.x, g.y + 10, g.w, g.h, 34 * U); ctx.fillStyle = 'rgba(60,30,70,0.3)'; ctx.fill();
    rr(g.x, g.y, g.w, g.h, 34 * U);
    const pg = ctx.createLinearGradient(0, g.y, 0, g.y + g.h);
    pg.addColorStop(0, '#fffdf6'); pg.addColorStop(1, '#ffeef5');
    ctx.fillStyle = pg; ctx.fill();
    ctx.lineWidth = 7 * U; ctx.strokeStyle = col; ctx.stroke();
    rr(g.x + 10 * U, g.y + 10 * U, g.w - 20 * U, g.h - 20 * U, 26 * U); ctx.lineWidth = 2.5 * U; ctx.setLineDash([8 * U, 8 * U]); ctx.strokeStyle = rgba('#ffffff', 0); ctx.strokeStyle = shade(col, 60); ctx.stroke(); ctx.setLineDash([]);
    // 緞帶標題
    const bw = g.w * 0.92, bh = 58 * U, by = g.y - bh * 0.45;
    ctx.fillStyle = shade(col, -50);
    ctx.beginPath(); ctx.moveTo(W / 2 - bw / 2 - 22 * U, by + 14 * U); ctx.lineTo(W / 2 - bw / 2 + 10 * U, by + 14 * U); ctx.lineTo(W / 2 - bw / 2 + 10 * U, by + bh + 12 * U); ctx.lineTo(W / 2 - bw / 2 - 22 * U, by + bh + 12 * U); ctx.lineTo(W / 2 - bw / 2 - 8 * U, by + bh / 2 + 13 * U); ctx.closePath(); ctx.fill();
    ctx.beginPath(); ctx.moveTo(W / 2 + bw / 2 + 22 * U, by + 14 * U); ctx.lineTo(W / 2 + bw / 2 - 10 * U, by + 14 * U); ctx.lineTo(W / 2 + bw / 2 - 10 * U, by + bh + 12 * U); ctx.lineTo(W / 2 + bw / 2 + 22 * U, by + bh + 12 * U); ctx.lineTo(W / 2 + bw / 2 + 8 * U, by + bh / 2 + 13 * U); ctx.closePath(); ctx.fill();
    rr(W / 2 - bw / 2, by, bw, bh, 14 * U);
    const rg = ctx.createLinearGradient(0, by, 0, by + bh);
    rg.addColorStop(0, shade(col, 50)); rg.addColorStop(1, col);
    ctx.fillStyle = rg; ctx.fill(); ctx.strokeStyle = shade(col, -50); ctx.lineWidth = 3 * U; ctx.stroke();
    const tsz = Math.min(28 * U, bw / Math.max(4, [...o.title].length) * 0.95);
    txt(o.title, W / 2, by + bh / 2 + 1, tsz, '#fff', { stroke: shade(col, -60), sw: 7 * U });
    // 星星
    for (let i = 0; i < 3; i++) {
      const p = this.starPos(i);
      const on = i < this.shown && i < o.stars;
      let k = 1;
      if (on) { const tt = this.t - (0.6 + i * 0.38); k = tt < 0.4 ? Ease.outElastic(clamp(tt / 0.4, 0, 1)) * 1.0 : 1 + Math.sin(time * 3 + i) * 0.03; }
      glossyStar(p[0], p[1], (i === 1 ? 46 : 38) * U * (on ? k : 1), on, on ? Math.sin(time * 2 + i) * 0.08 : 0);
    }
    // 文字
    let ty = g.y + g.h * 0.47;
    (o.lines || []).forEach(l => { txt(l, W / 2, ty, 20 * U, '#5a2d5c', { shadow: false }); ty += 30 * U; });
    if (o.unlock) {
      const pulse = 1 + Math.sin(time * 6) * 0.04;
      ctx.save(); ctx.translate(W / 2, ty + 6 * U); ctx.scale(pulse, pulse);
      txt(o.unlock, 0, 0, 19 * U, '#ff6b9a', { stroke: '#fff', sw: 5 * U, shadow: false });
      ctx.restore();
    }
    // 按鈕
    const bh2 = 58 * U, by2 = g.y + g.h - bh2 - 26 * U;
    const btns = [];
    if (o.onMenu) btns.push({ id: 'rmenu', icon: 'menu', color: 'blue', cb: o.onMenu });
    if (o.onRetry) btns.push({ id: 'rretry', icon: 'replay', color: 'yellow', cb: o.onRetry });
    if (o.onNext) btns.push({ id: 'rnext', icon: 'play', color: 'green', cb: o.onNext, wide: true });
    const unit = 72 * U, wideW = 120 * U, gapb = 12 * U;
    const totw = btns.reduce((s2, b) => s2 + (b.wide ? wideW : unit), 0) + gapb * (btns.length - 1);
    let bx = W / 2 - totw / 2;
    const ready = this.t > 0.5;
    btns.forEach(b => {
      const bw2 = b.wide ? wideW : unit;
      button(b.id, bx, by2, bw2, bh2, { icon: b.icon, color: b.color, pulse: b.wide, disabled: !ready, onClick: () => { this.hide(); b.cb(); } });
      bx += bw2 + gapb;
    });
    ctx.restore();
  }
};

function resizeCanvas() {

let lastFrame = performance.now();
function frame(now) {
  const rdt = Math.min(0.05, Math.max(0, (now - lastFrame) / 1000));
  lastFrame = now;
  time += rdt;
  if (shakeT > 0) shakeT -= rdt;
  let dt = rdt;
  if (stopT > 0) { stopT -= rdt; dt = 0; }
  updateTweens(rdt);
  Music.update(rdt);
  Game.update(dt, rdt);
  btnReg = [];
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  Game.draw();
  requestAnimationFrame(frame);
}
function bootGame() {
  resizeCanvas();
  requestAnimationFrame((t) => { lastFrame = t; frame(t); });
}

  for (let i = 0; i < 14; i++) flies.push({ x: Math.random() * LW, y: LH * 0.4 + Math.random() * LH * 0.4, ph: Math.random() * 6 });
}

/* ---------- 場景切換 ---------- */
function goTitle() { scene = 'title'; sceneT = 0; Result.hide(); TH = THEMES.meadow; Music.start(SONG); }
function goMap() { scene = 'map'; sceneT = 0; Result.hide(); TH = THEMES.meadow; if (!Music.on) Music.start(SONG); }
function startLevel(i) {
  lvIdx = i; LV = LEVELS[i]; TH = THEMES[LV.theme];
  scene = 'play'; sceneT = 0; sub = 'ready'; subT = 0;
  pipes = []; stars = []; fx.list = []; arch = null;
  worldX = 0; passed = 0; spawned = 0; starGot = 0; starSpawned = 0; hearts = 3; hits = 0; combo = 0;
  bird.y = (LH - GROUND) * 0.45; bird.vy = 0; bird.rot = 0; bird.hurtT = 0; bird.happy = 0;
  lastGapY = (LH - GROUND) / 2;
  Music.start(SONG);
}

/* ---------- 輸入 ---------- */
function flap() {
  if (scene !== 'play' || Result.on) return;
  if (sub === 'ready') { sub = 'fly'; subT = 0; spawnPipe(LW + 140); }
  if (sub !== 'fly') return;
  bird.vy = -330;
  bird.flapT = 0.25;
  killTweens(bird);
  bird.sx = 0.8; bird.sy = 1.25;
  tween(bird, { sx: 1, sy: 1 }, 0.35, 'outElastic');
  KG.note(520, 0.12, 'sine', 0.18, 0, 900);
  fx.burst(bird.x - 14, bird.y + 8, { n: 3, shape: 'circle', colors: [SKINS[skin].c[0], '#ffffff'], speed: 80, dir: Math.PI * 0.8, spread: 1, g: 100, size: 4, life: 0.5 });
}
Game.onDown = () => flap();
Game.onKey = (e, down) => {
  if (!down) return;
  if (['Space', 'ArrowUp', 'KeyW', 'Enter'].includes(e.code)) {
    e.preventDefault();
    if (e.repeat) return;
    if (scene === 'play') flap();
    else if (scene === 'title') goMap();
  }
};

/* ---------- 水管 ---------- */
function spawnPipe(x) {
  if (spawned >= LV.goal) {
    if (!arch) arch = { x: x + 40 };
    return;
  }
  const top = 120, bottom = LH - GROUND - 120;
  let gy = lastGapY + (Math.random() * 2 - 1) * 140;
  gy = clamp(gy, top + LV.move, bottom - LV.move);
  const prev = pipes[pipes.length - 1];
  pipes.push({ x, base: gy, gy, gap: LV.gap, passed: false, ph: Math.random() * TAU, fl: Math.floor(Math.random() * 3), wob: 0 });
  spawned++;
  if (prev && Math.random() < 0.85) {
    stars.push({ x: (prev.x + x) / 2 + PW / 2, y: (prev.base + gy) / 2, ph: Math.random() * 6 });
    starSpawned++;
  }
  lastGapY = gy;
}

function circleRect(cx, cy, r, rx, ry, rw, rh) {
  const nx = clamp(cx, rx, rx + rw), ny = clamp(cy, ry, ry + rh);
  return (cx - nx) * (cx - nx) + (cy - ny) * (cy - ny) < r * r;
}
function hitPipe(p) {
  const r = 14, topH = p.gy - p.gap / 2, botY = p.gy + p.gap / 2;
  return circleRect(bird.x, bird.y, r, p.x, -200, PW, topH + 200) ||
    circleRect(bird.x, bird.y, r, p.x - 7, topH - CAP_H, PW + 14, CAP_H) ||
    circleRect(bird.x, bird.y, r, p.x, botY, PW, LH) ||
    circleRect(bird.x, bird.y, r, p.x - 7, botY, PW + 14, CAP_H);
}

function ouch(p) {
  hearts--; hits++; combo = 0;
  bird.hurtT = 1.8;
  KG.sound('hit'); KG.vibrate(60);
  shake(9, 0.35); hitStop(0.12);
  if (p) p.wob = 1;
  fx.burst(bird.x, bird.y, { n: 8, shape: 'circle', colors: [SKINS[skin].c[1], '#fff'], speed: 160, g: 200, size: 5 });
  fx.burst(bird.x, bird.y - 10, { n: 6, shape: 'star', colors: ['#ffe066', '#fff'], speed: 120, g: 0, size: 6, life: 0.6 });
  fx.text(bird.x, bird.y - 40, '哎呀！', { color: '#ff7aa2', size: 26 });
  if (hearts <= 0) {
    sub = 'fail'; subT = 0;
    bird.vy = -200;
  } else {
    bird.vy = -260;
  }
}

function winLevel() {
  sub = 'win'; subT = 0;
  bird.happy = 1;
  KG.sound('sparkle');
  fx.burst(bird.x, bird.y, { n: 30, shape: 'confetti', speed: 320, g: 400, size: 9 });
  const st = 1 + (hits <= 1 ? 1 : 0) + (starGot >= Math.ceil(starSpawned / 2) ? 1 : 0);
  const before = Save.total();
  Save.setStars(lvIdx, st);
  const after = Save.total();
  const newSkin = SKINS.find(s => s.need > before && s.need <= after);
  setTimeout(() => {
    if (scene !== 'play') return;
    Music.stop();
    Result.show({
      stars: st, title: st === 3 ? '完美！太厲害了！' : '過關了！好棒！', color: '#3c9ff0',
      lines: ['穿過 ' + LV.goal + ' 根水管', '撿到 ' + starGot + ' 顆星星'],
      unlock: newSkin ? '解鎖新造型：' + newSkin.name + '！' : '',
      onNext: lvIdx < LEVELS.length - 1 ? () => startLevel(lvIdx + 1) : null,
      onRetry: () => startLevel(lvIdx), onMenu: goMap
    });
  }, 1200);
}
function failLevel() {
  Music.stop();
  Result.show({
    stars: 0, title: '再試一次！', color: '#f45f93',
    lines: ['已經飛過 ' + passed + ' 根水管了', '休息一下，再飛一次吧！'],
    onRetry: () => startLevel(lvIdx), onMenu: goMap
  });
}

/* ---------- 更新 ---------- */
const CHEERS = ['好棒！', '太厲害了！', '完美！', '飛得真好！'];
Game.update = (dt, rdt) => {
  sceneT += rdt;
  fx.update(dt); ui.update(rdt);
  Result.update(rdt, ui);
  bird.blinkT -= rdt;
  if (bird.blinkT <= 0) { bird.blink = 0.14; bird.blinkT = 2 + Math.random() * 3; }
  bird.blink -= rdt;
  bird.flapT = Math.max(0, bird.flapT - dt);
  bird.wing += dt * (bird.flapT > 0 ? 36 : 13);
  if (bird.hurtT > 0) bird.hurtT -= dt;

  const flying = scene !== 'play' || sub === 'ready' || sub === 'fly' || sub === 'win';
  const speed = scene === 'play' ? LV.speed : 90;
  if (flying) worldX += speed * dt;
  clouds.forEach(c => { c.x -= (flying ? speed * c.p : 0) * dt + 5 * dt; if (c.x < -200) { c.x = LW + 80 + Math.random() * 200; c.y = 40 + Math.random() * LH * 0.35; } });
  flakes.forEach(f => { f.y += f.v * dt; f.x += Math.sin(time + f.ph) * 15 * dt - (flying ? speed * 0.3 : 0) * dt; if (f.y > LH) { f.y = -5; f.x = Math.random() * LW; } if (f.x < -5) f.x += LW + 10; });

  if (scene !== 'play') {
    bird.y = LH * 0.5 + Math.sin(time * 2.4) * 18;
    bird.rot = Math.cos(time * 2.4) * -0.15;
    bird.wing += dt * 10;
    return;
  }
  subT += dt;
  pipes.forEach(p => {
    if (LV.move) p.gy = p.base + Math.sin(time * 1.1 + p.ph) * LV.move;
    if (p.wob > 0) p.wob = Math.max(0, p.wob - dt * 2);
  });

  if (sub === 'ready') {
    bird.y = (LH - GROUND) * 0.45 + Math.sin(time * 3) * 10;
    bird.rot = Math.sin(time * 3) * 0.08;
  } else if (sub === 'fly') {
    bird.vy = Math.min(bird.vy + 1000 * dt, 410);
    bird.y += bird.vy * dt;
    if (bird.y < 24) { bird.y = 24; bird.vy = Math.max(bird.vy, 0); }
    bird.rot = clamp(bird.vy / 520, -0.45, 1.0);

    pipes.forEach(p => {
      p.x -= LV.speed * dt;
      if (!p.passed && p.x + PW < bird.x - 10) {
        p.passed = true; passed++; combo++;
        KG.note(660 + Math.min(combo, 10) * 40, 0.14, 'triangle', 0.18);
        fx.text(bird.x + 10, bird.y - 34, '+1', { color: '#fff', size: 24 });
        if (combo % 3 === 0) {
          ui.text(W / 2, H * 0.32, CHEERS[(combo / 3 - 1) % CHEERS.length], { color: '#ffe066', size: 40 * U, vy: -40, life: 1.2, stroke: '#e0568a' });
          KG.sound('correct');
        }
      }
      if (bird.hurtT <= 0 && hitPipe(p)) ouch(p);
    });
    pipes = pipes.filter(p => p.x > -PW - 40);
    const last = pipes[pipes.length - 1];
    if (!arch && (!last || last.x < LW - SPACING + 40)) spawnPipe((last ? last.x : LW) + SPACING);
    if (arch) {
      arch.x -= LV.speed * dt;
      if (arch.x < bird.x) winLevel();
    }
    stars.forEach(s => {
      s.x -= LV.speed * dt;
      if (!s.got && Math.hypot(s.x - bird.x, s.y - bird.y) < 36) {
        s.got = true; starGot++;
        KG.sound('coin');
        fx.burst(s.x, s.y, { n: 14, colors: ['#ffe066', '#fff', '#ffb3c8'], speed: 200, g: 100, size: 6 });
        fx.ring(s.x, s.y, '#fff3a0', 40);
        fx.text(s.x, s.y - 26, '+1', { color: '#ffe066', size: 26 });
      }
    });
    stars = stars.filter(s => s.x > -40 && !s.got);
    // 碰到地面：彈起來
    if (bird.y > LH - GROUND - 18) {
      bird.y = LH - GROUND - 18;
      if (bird.hurtT <= 0) ouch(null);
      else bird.vy = -300;
      fx.burst(bird.x, LH - GROUND, { n: 8, shape: 'circle', colors: ['#fff6dc', TH.grass[0]], speed: 120, dir: -Math.PI / 2, spread: 2, g: 300, size: 5 });
    }
  } else if (sub === 'fail') {
    bird.vy = Math.min(bird.vy + 1200 * dt, 600);
    bird.y += bird.vy * dt;
    bird.rot = Math.min(1.4, bird.rot + dt * 4);
    if (bird.y > LH - GROUND - 18) { bird.y = LH - GROUND - 18; bird.vy = 0; }
    if (subT > 1.0 && !Result.on) failLevel();
  } else if (sub === 'win') {
    // 開心翻圈，往上飛
    bird.y += Math.sin(subT * 6) * 60 * dt - 20 * dt;
    bird.rot = subT < 0.8 ? -subT * TAU / 0.8 : Math.sin(time * 4) * 0.1;
    bird.wing += dt * 20;
    if (arch) arch.x -= LV.speed * dt;
    if (Math.random() < dt * 8) fx.burst(bird.x, bird.y, { n: 2, shape: 'sparkle', colors: ['#fff', '#ffe066'], speed: 60, g: 0, size: 8, life: 0.7 });
  }
};

/* ---------- 繪圖：背景 ---------- */
function hillY(x, off, base, amp, f) {
  const t = (x + off) * f;
  return base - amp * (0.55 + 0.3 * Math.sin(t) + 0.15 * Math.sin(t * 2.3 + 1.3));
}
function drawHills(off, base, amp, f, cols, snowCap) {
  const g = ctx.createLinearGradient(0, base - amp, 0, LH);
  g.addColorStop(0, cols[0]); g.addColorStop(1, cols[1]);
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.moveTo(-10, LH);
  for (let x = -10; x <= LW + 10; x += 10) ctx.lineTo(x, hillY(x, off, base, amp, f));
  ctx.lineTo(LW + 10, LH); ctx.closePath(); ctx.fill();
  // 山頂亮邊
  ctx.strokeStyle = 'rgba(255,255,255,0.35)'; ctx.lineWidth = 3;
  ctx.beginPath();
  for (let x = -10; x <= LW + 10; x += 10) ctx.lineTo(x, hillY(x, off, base, amp, f) + 2);
  ctx.stroke();
}
function drawCloud(x, y, s, night) {
  ctx.save(); ctx.translate(x, y); ctx.scale(s, s);
  ctx.fillStyle = night ? 'rgba(20,20,60,0.2)' : 'rgba(110,160,210,0.16)';
  ctx.beginPath(); ctx.ellipse(6, 32, 70, 12, 0, 0, TAU); ctx.fill();
  const g = ctx.createLinearGradient(0, -32, 0, 34);
  g.addColorStop(0, night ? '#bfc4ec' : '#ffffff'); g.addColorStop(1, night ? '#7f86c4' : '#e0f0ff');
  ctx.fillStyle = g;
  ctx.beginPath();
  circ(-38, 12, 22); circ(-12, -2, 30); circ(22, 4, 26); circ(48, 16, 18);
  ctx.rect(-38, 12, 86, 22); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,0.7)';
  ctx.beginPath(); ctx.ellipse(-16, -14, 14, 6, -0.3, 0, TAU); ctx.fill();
  ctx.restore();
}
function drawDeco(kind, x, y, s) {
  ctx.save(); ctx.translate(x, y); ctx.scale(s, s);
  ctx.fillStyle = 'rgba(0,0,0,0.12)'; ctx.beginPath(); ctx.ellipse(0, 2, 16, 4, 0, 0, TAU); ctx.fill();
  if (kind === 'tree' || kind === 'round') {
    ctx.fillStyle = '#8a5a3c'; rr(-4, -20, 8, 22, 3); ctx.fill();
    const g = ctx.createRadialGradient(-6, -40, 3, 0, -32, 24);
    g.addColorStop(0, kind === 'round' ? '#5fb98a' : '#a6ee8f'); g.addColorStop(1, kind === 'round' ? '#1f5a45' : '#3f9d4e');
    ctx.fillStyle = g;
    ctx.beginPath(); circ(0, -32, 18); circ(-12, -24, 12); circ(12, -24, 12); ctx.fill();
    if (kind === 'tree') { ctx.fillStyle = '#ff6b6b'; ctx.beginPath(); circ(-6, -30, 2.5); circ(7, -36, 2.5); circ(5, -22, 2.5); ctx.fill(); }
  } else if (kind === 'bush') {
    ctx.fillStyle = '#5cb860';
    ctx.beginPath(); circ(-10, -10, 12); circ(8, -12, 14); circ(0, -20, 12); ctx.fill();
    const cols = ['#ff8fb1', '#ffd65c', '#ffffff', '#b49cff'];
    for (let i = 0; i < 6; i++) { ctx.fillStyle = cols[i % 4]; ctx.beginPath(); circ(-14 + i * 6, -14 - (i % 2) * 9, 3.2); ctx.fill(); }
  } else if (kind === 'palm') {
    ctx.strokeStyle = '#a0703e'; ctx.lineWidth = 6; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(0, 0); ctx.quadraticCurveTo(-4, -26, 6, -50); ctx.stroke();
    ctx.fillStyle = '#3fae6a';
    for (let i = 0; i < 5; i++) {
      ctx.save(); ctx.translate(6, -50); ctx.rotate(-2.6 + i * 0.75);
      ctx.beginPath(); ctx.ellipse(16, 0, 18, 5, 0.25, 0, TAU); ctx.fill(); ctx.restore();
    }
  } else if (kind === 'pine') {

    for (let i = 0; i < 3; i++) {

      ctx.beginPath(); ctx.moveTo(-w, yy); ctx.lineTo(0, yy - 22); ctx.lineTo(w, yy); ctx.closePath(); ctx.fill();
      ctx.fillStyle = '#ffffff';
      ctx.beginPath(); ctx.moveTo(-w * 0.55, yy - 9); ctx.lineTo(0, yy - 22); ctx.lineTo(w * 0.55, yy - 9); ctx.quadraticCurveTo(0, yy - 5, -w * 0.55, yy - 9); ctx.fill();
    }
  }
  ctx.restore();
}
function drawSky(th) {
  const sky = ctx.createLinearGradient(0, 0, 0, LH);

    ctx.fillStyle = sg; ctx.beginPath(); circ(sx, sy, 120); ctx.fill();

}

    const fx2 = x + 30, fy = gy + 42 + (k % 3) * 8;
    ctx.fillStyle = th.grass[1];
    ctx.beginPath(); ctx.moveTo(fx2 - 22, fy + 6); ctx.quadraticCurveTo(fx2 - 20, fy - 8, fx2 - 16, fy + 6); ctx.quadraticCurveTo(fx2 - 13, fy - 10, fx2 - 10, fy + 6); ctx.fill();
    ctx.fillStyle = ['#ffffff', '#ffd1e0', '#fff1a8'][k % 3]; ctx.beginPath();
    for (let i = 0; i < 5; i++) { const a = i * 1.2566; circ(fx2 + Math.cos(a) * 4, fy + Math.sin(a) * 4, 3); }
    ctx.fill();
    ctx.fillStyle = '#ffc93c'; ctx.beginPath(); circ(fx2, fy, 2.5); ctx.fill();
  }
}

/* ---------- 繪圖：水管、星星、終點 ---------- */
function pipeBody(x, y, h, col) {
  const g = ctx.createLinearGradient(x, 0, x + PW, 0);
  g.addColorStop(0, shade(col, -30)); g.addColorStop(0.22, shade(col, 60)); g.addColorStop(0.45, col); g.addColorStop(1, shade(col, -55));
  ctx.fillStyle = g; ctx.strokeStyle = shade(col, -90); ctx.lineWidth = 3;
  rr(x, y, PW, h, 8); ctx.fill(); ctx.stroke();
  ctx.fillStyle = 'rgba(255,255,255,0.35)'; ctx.fillRect(x + 12, y + 6, 7, Math.max(0, h - 12));
  ctx.fillStyle = 'rgba(255,255,255,0.18)'; ctx.fillRect(x + 24, y + 6, 3, Math.max(0, h - 12));
}
function pipeCap(x, y, col) {
  const g = ctx.createLinearGradient(x - 7, 0, x + PW + 7, 0);
  g.addColorStop(0, shade(col, -25)); g.addColorStop(0.22, shade(col, 75)); g.addColorStop(0.5, shade(col, 15)); g.addColorStop(1, shade(col, -55));
  ctx.fillStyle = g; ctx.strokeStyle = shade(col, -90); ctx.lineWidth = 3;
  rr(x - 7, y, PW + 14, CAP_H, 12); ctx.fill(); ctx.stroke();
  ctx.fillStyle = 'rgba(255,255,255,0.45)'; rr(x + 2, y + 5, PW - 4, 6, 3); ctx.fill();
}
function leaf(x, y, a, s, col) {
  ctx.save(); ctx.translate(x, y); ctx.rotate(a); ctx.scale(s, s);
  ctx.fillStyle = col; ctx.beginPath(); ctx.moveTo(0, 0); ctx.quadraticCurveTo(8, -8, 16, 0); ctx.quadraticCurveTo(8, 8, 0, 0); ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,0.4)'; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(2, 0); ctx.lineTo(13, 0); ctx.stroke();
  ctx.restore();
}
function flower(x, y, k, s) {
  const petal = ['#ff8fb1', '#ffd65c', '#c4a6ff'][k % 3];
  ctx.save(); ctx.translate(x, y); ctx.scale(s, s); ctx.rotate(Math.sin(time * 2 + x) * 0.1);
  ctx.fillStyle = petal; ctx.strokeStyle = shade(petal, -50); ctx.lineWidth = 1;
  for (let i = 0; i < 5; i++) { const a = i * 1.2566; ctx.beginPath(); circ(Math.cos(a) * 5.5, Math.sin(a) * 5.5, 4.4); ctx.fill(); ctx.stroke(); }
  ctx.fillStyle = '#fff6b0'; ctx.beginPath(); circ(0, 0, 3.6); ctx.fill();
  ctx.restore();
}
function drawPipes() {
  const col = TH.pipe;
  pipes.forEach(p => {
    const wob = Math.sin(p.wob * 30) * p.wob * 4;
    const x = p.x + wob;
    const topH = p.gy - p.gap / 2, botY = p.gy + p.gap / 2;
    pipeBody(x, -10, topH - CAP_H + 12, col); pipeCap(x, topH - CAP_H, col);
    pipeBody(x, botY + CAP_H - 2, LH - GROUND - botY - CAP_H + 8, col); pipeCap(x, botY, col);
    // 藤蔓和葉子
    const lc = TH.snow ? '#8fc9a8' : '#4fb35a';
    for (let i = 0; i < 3; i++) {
      leaf(x + 4, botY + CAP_H + 18 + i * 34, 2.6, 1, lc);
      leaf(x + PW - 4, botY + CAP_H + 34 + i * 34, 0.4, 0.9, lc);
      leaf(x + 4, topH - CAP_H - 20 - i * 34, 2.8, 0.9, lc);
    }
    if (TH.snow) {
      ctx.fillStyle = '#ffffff';
      ctx.beginPath(); ctx.ellipse(x + PW / 2, botY + 2, PW * 0.58, 8, 0, Math.PI, TAU); ctx.fill();
      ctx.beginPath(); circ(x + 4, botY + 6, 6); circ(x + PW - 8, botY + 7, 7); ctx.fill();
      // 冰柱
      ctx.fillStyle = 'rgba(220,240,255,0.9)';
      for (let i = 0; i < 4; i++) { const ix = x + 6 + i * 20; ctx.beginPath(); ctx.moveTo(ix, topH); ctx.lineTo(ix + 8, topH); ctx.lineTo(ix + 4, topH + 12 + (i % 2) * 6); ctx.fill(); }
    } else {
      flower(x + PW * 0.25, botY - 4, p.fl, 1);
      flower(x + PW * 0.72, botY - 6, p.fl + 1, 0.85);
      flower(x + PW * 0.5, topH + 6, p.fl + 2, 0.75);
    }
    if (TH.moon) {
      // 小燈泡串
      for (let i = 0; i < 4; i++) {
        const lx = x + 8 + i * 20, ly = botY + CAP_H + 10 + Math.sin(i) * 3;
        ctx.fillStyle = ['#ffe066', '#ff8fb1', '#7fd8ff', '#a6f59c'][i];
        ctx.globalAlpha = 0.6 + 0.4 * Math.sin(time * 4 + i + p.ph);
        ctx.beginPath(); circ(lx, ly, 3.5); ctx.fill();
        ctx.globalAlpha = 1;
      }
    }
  });
}
function drawStarItem(x, y, R, ph) {
  const rot = Math.sin(time * 2 + ph) * 0.25;
  const gl = ctx.createRadialGradient(x, y, 2, x, y, R * 2);
  gl.addColorStop(0, 'rgba(255,240,150,0.65)'); gl.addColorStop(1, 'rgba(255,240,150,0)');
  ctx.fillStyle = gl; ctx.beginPath(); circ(x, y, R * 2); ctx.fill();
  glossyStar(x, y, R, true, rot);
  ctx.fillStyle = '#7a4a00';
  ctx.beginPath(); circ(x - R * 0.22, y - R * 0.02, R * 0.09); circ(x + R * 0.22, y - R * 0.02, R * 0.09); ctx.fill();
  ctx.strokeStyle = '#7a4a00'; ctx.lineWidth = 1.6; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.arc(x, y + R * 0.1, R * 0.14, 0.2, Math.PI - 0.2); ctx.stroke();
  ctx.fillStyle = 'rgba(255,120,140,0.5)';
  ctx.beginPath(); circ(x - R * 0.38, y + R * 0.15, R * 0.09); circ(x + R * 0.38, y + R * 0.15, R * 0.09); ctx.fill();
}
function drawArch() {
  if (!arch) return;
  const cx = arch.x + 60, base = LH - GROUND, R = Math.min(170, (LH - GROUND) * 0.45);
  const cols = ['#ff6b6b', '#ffa94d', '#ffd84a', '#7bd88f', '#5cc4ff', '#b48cff'];
  ctx.lineCap = 'butt';
  cols.forEach((c, i) => { ctx.strokeStyle = c; ctx.lineWidth = 12; ctx.beginPath(); ctx.arc(cx, base, R - i * 12, Math.PI, TAU); ctx.stroke(); });
  drawCloud(cx - R + 20, base - 20, 0.8, false); drawCloud(cx + R - 30, base - 20, 0.8, false);
  // 終點旗子
  ctx.fillStyle = '#8a5a3c'; ctx.fillRect(cx - 3, base - R - 60, 6, 70);
  ctx.fillStyle = '#ff6b9a';
  ctx.beginPath(); ctx.moveTo(cx + 3, base - R - 60); ctx.quadraticCurveTo(cx + 30, base - R - 54 + Math.sin(time * 6) * 4, cx + 50, base - R - 48); ctx.lineTo(cx + 3, base - R - 34); ctx.fill();
}

/* ---------- 繪圖：小鳥 ---------- */
function drawBird(x, y, o) {
  const sk = SKINS[o.skin == null ? skin : o.skin];
  const sc = o.scale || 1;
  ctx.save();
  ctx.translate(x, y); ctx.scale(sc, sc);
  ctx.rotate(o.rot || 0);
  ctx.scale(o.sx || 1, o.sy || 1);
  const r = 21, c = sk.c, ol = shade(c[2], -70);
  const mood = o.mood || 'idle';
  // 尾巴
  ctx.fillStyle = c[2]; ctx.strokeStyle = ol; ctx.lineWidth = 2.2; ctx.lineJoin = 'round';
  ctx.beginPath(); ctx.moveTo(-r + 3, -3); ctx.lineTo(-r - 13, -12); ctx.lineTo(-r - 8, -1); ctx.lineTo(-r - 14, 9); ctx.lineTo(-r + 3, 6); ctx.closePath(); ctx.fill(); ctx.stroke();
  // 身體
  const g = ctx.createRadialGradient(-7, -10, 3, 0, 0, r * 1.2);
  g.addColorStop(0, c[0]); g.addColorStop(0.5, c[1]); g.addColorStop(1, c[2]);
  ctx.fillStyle = g; ctx.strokeStyle = ol; ctx.lineWidth = 2.6;
  ctx.beginPath(); ctx.ellipse(0, 0, r * 1.08, r, 0, 0, TAU); ctx.fill(); ctx.stroke();
  // 邊光
  ctx.strokeStyle = 'rgba(255,255,255,0.55)'; ctx.lineWidth = 2.5;
  ctx.beginPath(); ctx.ellipse(0, 0, r * 0.92, r * 0.84, 0, Math.PI * 1.1, Math.PI * 1.55); ctx.stroke();
  // 肚子
  ctx.fillStyle = sk.belly; ctx.globalAlpha = 0.9;
  ctx.beginPath(); ctx.ellipse(3, 9, r * 0.62, r * 0.44, 0, 0, TAU); ctx.fill(); ctx.globalAlpha = 1;
  // 呆毛 / 冠羽
  if (sk.acc === 'crest') {
    ['#ff6b6b', '#ffa94d', '#ffd84a'].forEach((cc, i) => {
      ctx.fillStyle = cc; ctx.save(); ctx.translate(-2 + i * 4, -r + 2); ctx.rotate(-0.5 + i * 0.35);
      ctx.beginPath(); ctx.ellipse(0, -8, 3.5, 9, 0, 0, TAU); ctx.fill(); ctx.restore();
    });
  } else {
    ctx.strokeStyle = c[2]; ctx.lineWidth = 3; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(-2, -r + 1); ctx.quadraticCurveTo(-4, -r - 11, 4, -r - 10); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(3, -r + 2); ctx.quadraticCurveTo(7, -r - 7, 12, -r - 4); ctx.stroke();
  }
  // 眼睛
  ctx.lineCap = 'round';
  if (mood === 'hurt') {
    ctx.strokeStyle = '#3a2a1a'; ctx.lineWidth = 2.5;
    ctx.beginPath(); ctx.moveTo(4, -11); ctx.lineTo(11, -6); ctx.lineTo(4, -2); ctx.stroke();
  } else if (mood === 'happy') {
    ctx.strokeStyle = '#3a2a1a'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(8, -5, 5, Math.PI + 0.3, -0.3); ctx.stroke();
  } else if (o.blink) {
    ctx.strokeStyle = '#3a2a1a'; ctx.lineWidth = 2.5;
    ctx.beginPath(); ctx.arc(8, -7, 5, 0.2, Math.PI - 0.2); ctx.stroke();
  } else {
    ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.ellipse(8, -7, 7, 7.5, 0, 0, TAU); ctx.fill();
    ctx.strokeStyle = rgba('#3a2a1a', 0.3); ctx.lineWidth = 1; ctx.stroke();
    ctx.fillStyle = '#2b1d14'; ctx.beginPath(); ctx.ellipse(10, -6.5, 4.6, 5, 0, 0, TAU); ctx.fill();
    ctx.fillStyle = '#fff'; ctx.beginPath(); circ(11.6, -8.8, 1.9); circ(8.6, -4.4, 1); ctx.fill();
  }
  // 腮紅
  ctx.fillStyle = 'rgba(255,100,140,0.5)';
  ctx.beginPath(); ctx.ellipse(6, 5, 5.2, 3.3, 0, 0, TAU); ctx.fill();
  // 嘴巴
  ctx.fillStyle = '#ff8a1f'; ctx.strokeStyle = '#c45a08'; ctx.lineWidth = 1.6;
  const open = mood === 'happy' || mood === 'hurt' ? 4 : 0;
  ctx.beginPath(); ctx.moveTo(r - 3, -4); ctx.quadraticCurveTo(r + 11, -1 - open * 0.3, r + 9, 2 - open * 0.3); ctx.lineTo(r - 3, 3); ctx.closePath(); ctx.fill(); ctx.stroke();
  ctx.fillStyle = '#ffa64a';
  ctx.beginPath(); ctx.moveTo(r - 3, 3 + open * 0.3); ctx.lineTo(r + 7, 3 + open); ctx.quadraticCurveTo(r + 2, 8 + open, r - 3, 7 + open * 0.5); ctx.closePath(); ctx.fill(); ctx.stroke();
  // 配件
  if (sk.acc === 'bow') {
    ctx.save(); ctx.translate(-6, -r + 2); ctx.rotate(-0.3);
    ctx.fillStyle = '#ff4f8b'; ctx.strokeStyle = '#b8285e'; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(-11, -7); ctx.lineTo(-11, 7); ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(11, -7); ctx.lineTo(11, 7); ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.beginPath(); circ(0, 0, 3.5); ctx.fill(); ctx.stroke();
    ctx.restore();
  } else if (sk.acc === 'scarf') {
    ctx.fillStyle = '#ff6b6b'; ctx.strokeStyle = '#b83a3a'; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.ellipse(0, 12, 17, 5, 0, 0, TAU); ctx.fill(); ctx.stroke();
    ctx.save(); ctx.translate(-10, 14); ctx.rotate(0.6 + Math.sin(time * 10) * 0.2);
    rr(-4, 0, 8, 16, 3); ctx.fill(); ctx.stroke(); ctx.restore();
    ctx.fillStyle = '#fff'; ctx.fillRect(-6, 10, 3, 4); ctx.fillRect(2, 10, 3, 4);
  } else if (sk.acc === 'crown') {
    ctx.save(); ctx.translate(-2, -r - 2);
    const cg = ctx.createLinearGradient(0, -12, 0, 2);
    cg.addColorStop(0, '#fff2a0'); cg.addColorStop(1, '#f2a516');
    ctx.fillStyle = cg; ctx.strokeStyle = '#b06d00'; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.moveTo(-10, 2); ctx.lineTo(-11, -9); ctx.lineTo(-5, -3); ctx.lineTo(0, -12); ctx.lineTo(5, -3); ctx.lineTo(11, -9); ctx.lineTo(10, 2); ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#ff4f8b'; ctx.beginPath(); circ(0, -2, 2); ctx.fill();
    ctx.restore();
  }
  // 翅膀
  const wa = mood === 'hurt' ? 0.6 : Math.sin(o.wing || 0) * 0.75;
  ctx.save();
  ctx.translate(-6, 2); ctx.rotate(-wa);
  const wg = ctx.createLinearGradient(0, -9, 0, 10);
  wg.addColorStop(0, c[0]); wg.addColorStop(1, c[2]);
  ctx.fillStyle = wg; ctx.strokeStyle = ol; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.ellipse(-6, 0, 12.5, 7.8, 0.25, 0, TAU); ctx.fill(); ctx.stroke();
  ctx.strokeStyle = rgba('#ffffff', 0.5); ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.moveTo(-14, 1); ctx.lineTo(-4, 3); ctx.stroke();
  ctx.restore();
  ctx.restore();
}
function drawPlayBird() {
  const gy = LH - GROUND;
  const dist = Math.max(0, gy - bird.y);
  ctx.fillStyle = 'rgba(40,60,30,' + Math.max(0.06, 0.25 - dist / 2000) + ')';
  ctx.beginPath(); ctx.ellipse(bird.x, gy + 3, 18 - Math.min(10, dist / 40), 4, 0, 0, TAU); ctx.fill();
  if (bird.hurtT > 0 && sub === 'fly' && Math.floor(bird.hurtT * 12) % 2 === 0) ctx.globalAlpha = 0.45;
  const mood = sub === 'fail' || bird.hurtT > 1.4 ? 'hurt' : sub === 'win' ? 'happy' : 'idle';
  drawBird(bird.x, bird.y, { rot: bird.rot, wing: bird.wing, sx: bird.sx, sy: bird.sy, blink: bird.blink > 0, mood });
  ctx.globalAlpha = 1;
  if (mood === 'hurt') {
    for (let i = 0; i < 3; i++) {
      const a = time * 5 + i * 2.1;
      glossyStar(bird.x + Math.cos(a) * 22, bird.y - 30 + Math.sin(a) * 6, 6, true, a);
    }
  }
}

/* ---------- HUD（螢幕座標） ---------- */
function drawHud() {
  const pw = Math.min(W - 150, 250 * U), ph = 40 * U, px = (W - pw) / 2, py = 12;
  hudPanel(px, py, pw, ph, '#3c9ff0');
  // 小水管圖示
  ctx.save(); ctx.translate(px + 22 * U, py + ph / 2);
  ctx.fillStyle = TH.pipe; ctx.strokeStyle = shade(TH.pipe, -90); ctx.lineWidth = 2;
  rr(-7 * U, -6 * U, 14 * U, 16 * U, 3); ctx.fill(); ctx.stroke();
  rr(-10 * U, -11 * U, 20 * U, 7 * U, 3); ctx.fill(); ctx.stroke();
  ctx.restore();
  progressBar(px + 40 * U, py + ph / 2 - 9 * U, pw - 100 * U, 18 * U, passed / LV.goal, '#7bd88f');
  txt(Math.min(passed, LV.goal) + '/' + LV.goal, px + pw - 32 * U, py + ph / 2 + 1, 17 * U, '#2a6a9e', { shadow: false });
  // 愛心和星星
  const y2 = py + ph + 22 * U;
  for (let i = 0; i < 3; i++) glossyHeart(W / 2 - 64 * U + i * 26 * U, y2, 11 * U, i < hearts);
  hudPanel(W / 2 + 20 * U, y2 - 15 * U, 70 * U, 30 * U, '#f8b921');
  glossyStar(W / 2 + 36 * U, y2, 11 * U, true);
  txt(String(starGot), W / 2 + 64 * U, y2 + 1, 18 * U, '#8a5a00', { shadow: false });
  // 等待開始的提示
  if (sub === 'ready') {
    const s = 1 + Math.sin(time * 6) * 0.06;
    ctx.save(); ctx.translate(W / 2, H * 0.68); ctx.scale(s, s);
    rr(-130 * U, -30 * U, 260 * U, 60 * U, 30 * U); ctx.fillStyle = 'rgba(255,255,255,0.94)'; ctx.fill();
    ctx.strokeStyle = '#ffd65c'; ctx.lineWidth = 4; ctx.stroke();
    txt('點一下就會飛喔！', 0, 1, 24 * U, '#4a3b52', { shadow: false });
    ctx.restore();
    // 小手指
    const hy = H * 0.68 + 52 * U + Math.abs(Math.sin(time * 4)) * -10 * U;
    ctx.save(); ctx.translate(W / 2 + 80 * U, hy);
    ctx.fillStyle = '#ffe0c8'; ctx.strokeStyle = '#c98a6a'; ctx.lineWidth = 2.5;
    rr(-7 * U, -26 * U, 14 * U, 30 * U, 7 * U); ctx.fill(); ctx.stroke();
    rr(-13 * U, -4 * U, 30 * U, 26 * U, 10 * U); ctx.fill(); ctx.stroke();
    ctx.restore();
  }
}

/* ---------- 標題畫面 ---------- */
function drawTitle() {
  ctx.save(); ctx.scale(S, S);
  drawWorldBg(THEMES.meadow); drawGround(THEMES.meadow);
  ctx.restore();
  vignette(0.2);
  const ly = titleY(0.22);
  logo('小鳥飛飛', W / 2, ly, Math.min(78 * U, W * 0.17), ['#ffd83a', '#ff8fb1', '#6cc4ff', '#7bd88f'], '#3a5a9e');
  if (H >= 560) txt('穿過水管・撿星星・飛到彩虹', W / 2, ly + 62 * U, 18 * U, '#fff', { stroke: '#3c7fc0', sw: 6 * U });
  // 小鳥在中間飛
  const bx = W / 2 + Math.sin(time * 1.3) * 40 * U, by = H * 0.5 + Math.sin(time * 2.6) * 16 * U;
  drawBird(bx, by, { scale: 2.6 * U, rot: Math.cos(time * 2.6) * -0.15, wing: time * 14, blink: bird.blink > 0, mood: Math.sin(time * 0.8) > 0.7 ? 'happy' : 'idle' });
  for (let i = 0; i < 3; i++) {
    const a = time * 1.5 + i * TAU / 3;
    glossyStar(bx + Math.cos(a) * 90 * U, by + Math.sin(a) * 40 * U, 12 * U, true, a);
  }
  const bw = 210 * U, bh = 74 * U;
  button('start', W / 2 - bw / 2, H * 0.72, bw, bh, { label: '開始', icon: 'play', color: 'green', pulse: true, onClick: goMap });
}

function drawMap() {
  ctx.save(); ctx.scale(S, S);
  drawWorldBg(THEMES.meadow); drawGround(THEMES.meadow);
  ctx.restore();
  ctx.fillStyle = 'rgba(255,255,255,0.25)'; ctx.fillRect(0, 0, W, H);
  levelSelect({
    levels: LEVELS, title: '選擇關卡', color: '#3c9ff0', enterT: 0, cardColors: ['green', 'pink', 'orange', 'blue', 'purple'],
    onPick: (i) => startLevel(i),
    skins: SKINS.map((s, i) => ({ name: s.name, need: s.need, draw: (x, y, sz) => drawBird(x, y, { skin: i, scale: sz / 24, wing: time * 8 + i, blink: false }) })),
    skin, onSkin: (i) => { skin = i; Save.set('skin', i); KG.sound('sparkle'); ui.burst(W / 2, H - 100 * U, { n: 16, speed: 200, g: 200 }); }
  });
}

Game.draw = () => {
  if (scene === 'title') drawTitle();
  else if (scene === 'map') { drawMap(); }
  else {
    const [sx, sy] = shakeOffset();
    ctx.save();
    ctx.translate(sx, sy);
    ctx.scale(S, S);
    drawWorldBg(TH);
    drawArch();
    drawPipes();
    drawGround(TH);
    stars.forEach(s => drawStarItem(s.x, s.y + Math.sin(time * 4 + s.ph) * 5, 17, s.ph));
    drawPlayBird();
    if (TH.snow) { ctx.fillStyle = '#fff'; flakes.forEach(f => { ctx.globalAlpha = 0.85; ctx.beginPath(); circ(f.x, f.y, f.r); ctx.fill(); }); ctx.globalAlpha = 1; }
    fx.draw();
    ctx.restore();
    vignette(TH.moon ? 0.35 : 0.15);
    drawHud();
  }
  ui.draw();
  Result.draw();
};

bootGame();
goTitle();
</script>
