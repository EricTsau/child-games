<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>3D 桌上足球</title>
<link rel="stylesheet" href="../../assets/common.css">
<style>
  html, body { height: 100%; overflow: hidden; background: #120b07; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  #gl { pointer-events: none; }
  #ui { touch-action: none; z-index: 2; }
  #msg { position: fixed; inset: 0; display: grid; place-items: center; padding: 24px; text-align: center; color: #f3e2c0; font-size: 20px; font-weight: 800; z-index: 3; }
</style>
<script type="importmap">
{ "imports": { "three": "../../assets/vendor/three/three.module.min.js", "three/addons/": "../../assets/vendor/three/addons/" } }
</script>
</head>
<body>
<div id="msg">3D 桌上足球 載入中…</div>
<canvas id="gl"></canvas>
<canvas id="ui" aria-label="3D 桌上足球遊戲畫面"></canvas>
<script src="../../assets/common.js"></script>
<script type="module">
import * as THREE from 'three';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';

let renderer = null;
try {
  renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('gl'), antialias: true, powerPreference: 'high-performance' });
} catch (e) {
  renderer = null;
}
if (!renderer) document.getElementById('msg').textContent = '這個遊戲需要支援 3D（WebGL）的瀏覽器，請換一個瀏覽器或裝置再試試看。';
else main();

function main() {
  const glc = renderer.domElement;
  const cv = document.getElementById('ui');
  const ctx = cv.getContext('2d');
  const FONT = "'PingFang TC','Noto Sans TC','Microsoft JhengHei','Heiti TC',system-ui,sans-serif";
  const font = (w, s) => w + ' ' + s + 'px ' + FONT;
  const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
  const lerp = (a, b, t) => a + (b - a) * t;
  const rand = (a, b) => a + Math.random() * (b - a);
  const TAU = Math.PI * 2;
  function mulberry(seed) {
    return function () {
      seed |= 0; seed = seed + 0x6D2B79F5 | 0;
      let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }

  /* =========================================================
   * 尺寸（1 單位 = 10 公分）。x：橫向，z：縱向（+z 是紅隊球門），y：高度
   * ========================================================= */
  const HX = 3.4, HZ = 6, R = 0.19, GW = 1.1, GH = 0.72;
  const ROD_Y = 0.84, WALL_T = 0.45, WALL_H = 1.25, BASE_Y = -1.15, ET = 0.8, FLOOR = -7;
  const OUT_X = HX + WALL_T, OUT_Z = HZ + ET;
  const PL_HW = 0.15, CAP_R = 0.11, S0 = -0.34, S1 = 0.70;
  const SUB_H = 1 / 480, MAX_V = 70, KMH = 0.36;
  const TEAM_HEX = [0xd12a2a, 0x2361e0];
  const TEAM_CSS = ['#ff5a4e', '#5b9bff'];
  const TEAM_DARK = ['#9c1b16', '#1a3f9c'];
  const TEAM_NAME = ['紅隊', '藍隊'];
  const KIND_NAME = ['門將', '後衛', '中場', '前鋒'];
  const LV_NAME = ['新手', '高手', '大師'];
  // [隊伍, 位置, z]：從紅隊球門往藍隊球門排
  const ROD_DEF = [[0, 0, 5.25], [0, 1, 3.75], [1, 3, 2.25], [0, 2, 0.75], [1, 2, -0.75], [0, 3, -2.25], [1, 1, -3.75], [1, 0, -5.25]];
  const KIND_N = [1, 2, 5, 3], KIND_SP = [0, 2.4, 1.2, 2.1], KIND_T = [1.3, 2.0, 0.8, 1.1];
  const teamRods = [[0, 1, 3, 5], [7, 6, 4, 2]];   // 由自家球門往外
  const rods = ROD_DEF.map(([team, kind, z], i) => {
    const n = KIND_N[kind], offs = [];
    for (let k = 0; k < n; k++) offs.push((k - (n - 1) / 2) * KIND_SP[kind]);
    const T = KIND_T[kind], hs = team ? -1 : 1;
    const eh = hs * (OUT_X + 0.35 + T), eo = -hs * (OUT_X + 0.2 + T);
    return {
      i, team, kind, z, f: team ? 1 : -1, hs, offs, T, eh, cx: (eh + eo) / 2, len: Math.abs(eh - eo),
      s: 0, sv: 0, tgt: 0, a: 0, av: 0, mode: 'idle', kw: 0, liftT: 0, liftAge: 0, man: (n - 1) >> 1, vmax: 20,
      aiK: 0, noise: 0, noiseT: 0, noiseTgt: 0, sweepT: 0, sweepDir: 0, hitCool: 0
    };
  });
  const ball = { x: 0, z: 0, vx: 0, vz: 0, y: R, live: false, vis: false, inGoal: 0, goalT: 0, lastTeam: -1 };

  /* =========================================================
   * 設定與紀錄
   * ========================================================= */
  const OPT_KEY = 'foosball:opts', ST_KEY = 'foosball:stats';
  const opts = Object.assign({ mode: 'cpu', level: 0, target: 5, replay: true }, KG.store.get(OPT_KEY, {}));
  const stats = Object.assign({ w: [0, 0, 0], l: [0, 0, 0], streak: 0, bestStreak: 0, bestKmh: 0, p2: 0 }, KG.store.get(ST_KEY, {}));
  const saveOpts = () => KG.store.set(OPT_KEY, opts);
  const saveStats = () => KG.store.set(ST_KEY, stats);

  const AIP = [
    { react: 0.34, slide: 5.5, err: 0.7, kd: 0.2, pw: [0.35, 0.65], aim: 0, cool: 0.45 },
    { react: 0.18, slide: 9.5, err: 0.34, kd: 0.09, pw: [0.6, 0.9], aim: 0.35, cool: 0.22 },
    { react: 0.07, slide: 16, err: 0.06, kd: 0.025, pw: [0.88, 1.0], aim: 0.9, cool: 0.06 }
  ];

  /* =========================================================
   * 遊戲狀態
   * ========================================================= */
  let screen = 'title';        // title | game
  let phase = 'serve';         // serve | play | goal | replay | pause | over
  let prevPhase = 'play';
  let mode = 'cpu', level = 0, target = 5, replayOn = true;
  let human = [false, false], autoAll = false, frozen = false;
  let score = [0, 0], matchKmh = 0, newRecord = false, winner = -1;
  let gameT = 0, realT = 0, phaseT = 0, acc = 0, serveDelay = 1, serveTeam = 0, deadT = 0, shake = 0;
  let goalInfo = null, goalTime = 0, retShown = false, retAnim = 0, retEnd = 1;
  let rpT = 0, rpEnd = 0;
  const cursor = [0, 0], active = [3, 4], manual = [-1, -1], manualBase = [-1, -1], activeHold = [0, 0];
  const kickFlash = [0, 0], kickCount = [0, 0];
  let shotPop = null, hintT = 0, lastInput = 'touch', toastMsg = null;

  /* =========================================================
   * 音效（自備雜訊音源，KG.note 做音調）
   * ========================================================= */
  let AX = null, NB = null;
  function ax() {
    if (KG.isMuted()) return null;
    if (!AX) {
      const A = window.AudioContext || window.webkitAudioContext;
      if (!A) return null;
      try { AX = new A(); } catch (e) { return null; }
      const len = AX.sampleRate * 2;
      NB = AX.createBuffer(1, len, AX.sampleRate);
      const d = NB.getChannelData(0);
      for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    }
    if (AX.state === 'suspended') AX.resume();
    return AX;
  }
  window.addEventListener('pointerdown', () => { ax(); }, { capture: true });
  window.addEventListener('keydown', () => { ax(); }, { capture: true });
  function noise(dur, vol, freq, q, type, delay, attack) {
    const a = ax();
    if (!a) return;
    const t = a.currentTime + (delay || 0);
    const s = a.createBufferSource();
    s.buffer = NB;
    const f = a.createBiquadFilter();
    f.type = type || 'bandpass'; f.frequency.value = freq; f.Q.value = q || 1;
    const g = a.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(Math.max(0.0002, vol), t + (attack || 0.003));
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    s.connect(f); f.connect(g); g.connect(a.destination);
    s.start(t, Math.random() * 1.2);
    s.stop(t + dur + 0.05);
  }
  let sfxKickT = 0, sfxWallT = 0, sfxPostT = 0;
  function sfxKick(p) {
    if (realT - sfxKickT < 0.045) return;
    sfxKickT = realT;
    noise(0.05, 0.12 + 0.4 * p, 2600 + 900 * p, 1.4);
    KG.note(820 + 700 * p, 0.045, 'square', 0.03 + 0.06 * p);
    KG.note(240, 0.06, 'triangle', 0.06 + 0.08 * p, 0, 160);
  }
  function sfxSwing(p) {
    noise(0.12, 0.04 + 0.07 * p, 1300 + 1400 * p, 0.8);
    KG.note(150, 0.05, 'square', 0.025);
  }
  function sfxWall(v) {
    if (realT - sfxWallT < 0.05) return;
    sfxWallT = realT;
    const k = Math.min(1, v / 40);
    noise(0.09, 0.08 + 0.4 * k, 360, 1.6);
    KG.note(130, 0.1, 'sine', 0.06 + 0.25 * k, 0, 80);
  }
  function sfxPost() {
    if (realT - sfxPostT < 0.08) return;
    sfxPostT = realT;
    KG.note(1850, 0.4, 'sine', 0.07); KG.note(2770, 0.3, 'sine', 0.045); noise(0.04, 0.2, 3200, 2);
  }
  function sfxGoal(good) {
    noise(0.14, 0.45, 240, 1.2); KG.note(90, 0.25, 'sine', 0.3, 0, 50);
    if (good) {
      for (let i = 0; i < 3; i++) { KG.note(620, 0.32, 'sawtooth', 0.05, i * 0.62, 900); KG.note(900, 0.3, 'sawtooth', 0.05, i * 0.62 + 0.31, 620); }
      noise(2.8, 0.32, 950, 0.6, 'bandpass', 0.05, 0.25);
      noise(2.4, 0.18, 2300, 0.9, 'bandpass', 0.1, 0.3);
    } else {
      noise(1.5, 0.22, 520, 0.7, 'lowpass', 0.05, 0.2);
      KG.note(330, 0.7, 'triangle', 0.05, 0.1, 210);
    }
  }
  function sfxServe() { noise(0.7, 0.14, 260, 1, 'lowpass', 0, 0.05); KG.note(190, 0.18, 'sine', 0.06, 0.05, 150); }
  function sfxWhistle() { KG.note(2500, 0.12, 'square', 0.025); KG.note(2500, 0.28, 'square', 0.025, 0.16, 2400); }
  function sfxTick() { KG.note(1300, 0.03, 'square', 0.03); }
  function sfxThunk() { noise(0.08, 0.3, 420, 1.4); KG.note(170, 0.1, 'triangle', 0.12, 0, 110); KG.note(2100, 0.05, 'triangle', 0.05, 0.12); }

  // 背景音樂：輕鬆的酒吧放克
  const BASS = [73.4, 73.4, 65.4, 65.4, 58.3, 58.3, 65.4, 69.3];
  const CHORDS = [[293.7, 349.2, 440, 523.3], [261.6, 329.6, 392, 493.9], [233.1, 293.7, 349.2, 440], [220, 277.2, 329.6, 392]];
  let mTimer = 0, mStep = 0;
  function musicOn() {
    if (screen === 'title') return true;
    return phase === 'serve' || phase === 'play' || phase === 'goal' || phase === 'replay';
  }
  function startMusic() {
    if (mTimer) return;
    mTimer = setInterval(() => {
      if (KG.isMuted() || document.hidden || !musicOn() || !AX) return;
      const s = mStep % 16, bar = (mStep >> 3) % 8, ch = CHORDS[(mStep >> 4) % 4];
      const root = BASS[bar];
      if (s === 0 || s === 3 || s === 6 || s === 8 || s === 11 || s === 14) KG.note(root * (s === 6 || s === 14 ? 2 : 1), 0.16, 'triangle', 0.075);
      if (s === 2 || s === 7 || s === 10 || s === 15) ch.forEach((f, i) => KG.note(f, 0.11, 'triangle', 0.011, i * 0.004));
      if (s === 0 || s === 8) KG.note(105, 0.12, 'sine', 0.11, 0, 45);
      if (s === 4 || s === 12) noise(0.09, 0.05, 1800, 0.7);
      if (s % 2 === 1) noise(0.03, 0.018, 8000, 0.7, 'highpass');
      mStep++;
    }, 132);
  }

  /* =========================================================
   * 物理
   * ========================================================= */
  function aimRod(r, x) {
    const o = r.offs, T = r.T;
    let k = r.man;
    if (!(x >= o[k] - T - 0.04 && x <= o[k] + T + 0.04)) {
      let bd = Infinity;
      for (let j = 0; j < o.length; j++) {
        const want = x - o[j], got = clamp(want, -T, T);
        const d = Math.abs(want - got) * 10 + Math.abs(got - r.s);
        if (d < bd) { bd = d; k = j; }
      }
      r.man = k;
    }
    r.tgt = clamp(x - o[r.man], -T, T);
  }

  function updateRod(r, h) {
    let a0 = r.a;
    const s0 = r.s;
    let v = (r.tgt - r.s) * 28;
    if (v > r.vmax) v = r.vmax; else if (v < -r.vmax) v = -r.vmax;
    r.s += v * h;
    if (r.s > r.T) r.s = r.T; else if (r.s < -r.T) r.s = -r.T;
    r.sv = (r.s - s0) / h;
    switch (r.mode) {
      case 'wind':
        r.a -= 26 * h;
        if (r.a <= -0.5) { r.a = -0.5; r.mode = 'kick'; }
        break;
      case 'over':
        // 從上方翻轉過去，腳從球後方落下再踢
        r.a += 17 * h;
        if (r.a >= TAU - 1.0) { r.a -= TAU; a0 -= TAU; r.mode = 'kick'; }
        break;
      case 'kick':
        r.a += r.kw * h;
        if (r.a >= 1.85) { r.a = 1.85; r.mode = 'ret'; }
        break;
      case 'lift': {
        r.a = Math.max(-1.7, r.a - 22 * h);
        r.liftT -= h; r.liftAge += h;
        const fz = r.f * (ball.z - r.z);
        const passed = ball.live && fz > 0.55;
        const back = ball.live && r.liftAge > 0.12 && r.f * ball.vz < -2.5 && fz < 0;
        if (r.liftT <= 0 || passed || back) r.mode = 'ret';
        break;
      }
      case 'ret': {
        const sp = 9 * h;
        if (Math.abs(r.a) <= sp) { r.a = 0; r.mode = 'idle'; } else r.a -= Math.sign(r.a) * sp;
        break;
      }
      default:
        if (r.a !== 0) { const sp = 6 * h; r.a = Math.abs(r.a) <= sp ? 0 : r.a - Math.sign(r.a) * sp; }
    }
    r.av = (r.a - a0) / h;
    if (r.hitCool > 0) r.hitCool -= h;
  }

  function kick(r, p) {
    if (r.mode === 'wind' || r.mode === 'kick' || r.mode === 'over') return false;
    if (r.mode === 'ret' && r.a > 0.6) return false;
    p = clamp(p, 0, 1);
    r.kw = 14 + 44 * p;
    r.kp = p;
    const bd = r.f * (ball.z - r.z);
    if (ball.live && bd < -0.12 && bd > -0.85 && Math.abs(ball.vz) < 6) r.mode = 'over';
    else r.mode = r.a > -0.45 ? 'wind' : 'kick';
    // 自家前面的球桿自動抬起，讓球通過
    if (ball.live && Math.abs(ball.z - r.z) < 1.0) {
      for (const o of rods) {
        if (o.team !== r.team || o === r || o.f * (o.z - r.z) <= 0) continue;
        if (o.mode === 'idle' || o.mode === 'ret' || o.mode === 'lift') { o.mode = 'lift'; o.liftT = 0.45; o.liftAge = 0; }
      }
    }
    if (screen === 'game') sfxSwing(p);
    return true;
  }
  function lift(r, t) {
    if (r.mode === 'wind' || r.mode === 'kick' || r.mode === 'over') return;
    r.mode = 'lift'; r.liftT = t || 0.5; r.liftAge = 0;
  }

  function collideRod(r) {
    const dzr = ball.z - r.z;
    if (dzr > 1.2 || dzr < -1.2) return;
    const ca = Math.cos(r.a), sa = Math.sin(r.a), f = r.f;
    // 球心在 y-z 平面上離球員中軸最近的點
    let t = (R - ROD_Y) * (-ca) + dzr * (f * sa);
    if (t < S0) t = S0; else if (t > S1) t = S1;
    const cy = ROD_Y - ca * t, cz = r.z + f * sa * t;
    const dy = R - cy, dz = ball.z - cz;
    const yz2 = dy * dy + dz * dz, RR = R + CAP_R;
    if (yz2 >= RR * RR) return;
    for (let k = 0; k < r.offs.length; k++) {
      const px = r.s + r.offs[k];
      const ddx = ball.x - px;
      const ex = Math.abs(ddx) - PL_HW;
      const dx = ex > 0 ? (ddx > 0 ? ex : -ex) : 0;
      const d2 = dx * dx + yz2;
      if (d2 >= RR * RR) continue;
      const d = Math.sqrt(d2);
      let nx, ny, nz;
      if (d > 1e-6) { nx = dx / d; ny = dy / d; nz = dz / d; } else { nx = 0; ny = 0; nz = f; }
      const pen = RR - d;
      const hl = Math.hypot(nx, nz);
      const cvx = r.sv, cvz = f * ca * t * r.av;
      if (hl < 0.25) {
        // 腳踩在球上：球被壓住，跟著球桿走
        ball.vx = lerp(ball.vx, cvx, 0.5);
        ball.vz = lerp(ball.vz, cvz, 0.5) * 0.9;
        if (hl > 0.02) { ball.x += nx / hl * Math.min(pen, 0.03); ball.z += nz / hl * Math.min(pen, 0.03); }
        continue;
      }
      const hx = nx / hl, hz = nz / hl;
      const push = Math.min(pen / hl, 0.15);
      ball.x += hx * push; ball.z += hz * push;
      const rvx = ball.vx - cvx, rvz = ball.vz - cvz;
      const vn = rvx * hx + rvz * hz;
      if (vn < 0) {
        const e = 0.42 * hl;
        const j = -(1 + e) * vn;
        ball.vx += j * hx; ball.vz += j * hz;
        // 切向摩擦：橫向帶球
        const tx = -hz, tz = hx;
        const vt = rvx * tx + rvz * tz;
        ball.vx -= vt * tx * 0.25; ball.vz -= vt * tz * 0.25;
        const sp = Math.hypot(ball.vx, ball.vz);
        if (sp > MAX_V) { ball.vx *= MAX_V / sp; ball.vz *= MAX_V / sp; }
        ball.lastTeam = r.team;
        if (j > 1.2 && r.hitCool <= 0) {
          r.hitCool = 0.06;
          if (screen === 'game') sfxKick(Math.min(1, j / 45));
          if (j > 22) burst(ball.x, R, ball.z, Math.min(10, (j / 6) | 0), 0xfff2c0, 3 + j * 0.06);
          if (screen === 'game' && human[r.team] && (r.mode === 'kick') && sp > 16) {
            shotPop = { kmh: sp * KMH, t: 1.3, team: r.team };
            if (sp > 40) { shake = Math.max(shake, 0.12); KG.vibrate(15); }
          }
        }
      }
    }
  }

  const POSTS = [[-GW, -HZ], [GW, -HZ], [-GW, HZ], [GW, HZ]];
  function walls() {
    const lim = HX - R;
    if (ball.x > lim) { ball.x = lim; if (ball.vx > 0) { if (ball.vx > 1.5 && screen === 'game') sfxWall(ball.vx); ball.vx *= -0.6; ball.vz *= 0.95; } }
    else if (ball.x < -lim) { ball.x = -lim; if (ball.vx < 0) { if (ball.vx < -1.5 && screen === 'game') sfxWall(-ball.vx); ball.vx *= -0.6; ball.vz *= 0.95; } }
    const zl = HZ - R, ax_ = Math.abs(ball.x);
    if (ax_ >= GW) {
      if (ball.z > zl) { ball.z = zl; if (ball.vz > 0) { if (ball.vz > 1.5 && screen === 'game') sfxWall(ball.vz); ball.vz *= -0.6; } }
      else if (ball.z < -zl) { ball.z = -zl; if (ball.vz < 0) { if (ball.vz < -1.5 && screen === 'game') sfxWall(-ball.vz); ball.vz *= -0.6; } }
    }
    for (let i = 0; i < 4; i++) {
      const px = POSTS[i][0], pz = POSTS[i][1];
      const dx = ball.x - px, dz = ball.z - pz, d2 = dx * dx + dz * dz, rr = R + 0.035;
      if (d2 < rr * rr && d2 > 1e-10) {
        const d = Math.sqrt(d2), nx = dx / d, nz = dz / d;
        ball.x = px + nx * rr; ball.z = pz + nz * rr;
        const vn = ball.vx * nx + ball.vz * nz;
        if (vn < 0) { ball.vx -= 1.55 * vn * nx; ball.vz -= 1.55 * vn * nz; if (vn < -2 && screen === 'game') sfxPost(); }
      }
    }
    if (Math.abs(ball.z) > HZ) {
      const gl = GW - R;
      if (ball.x > gl) { ball.x = gl; ball.vx = -Math.abs(ball.vx) * 0.5; }
      else if (ball.x < -gl) { ball.x = -gl; ball.vx = Math.abs(ball.vx) * 0.5; }
    }
  }

  function physStep(h) {
    for (let i = 0; i < 8; i++) updateRod(rods[i], h);
    if (ball.inGoal) { goalBallStep(h); return; }
    if (!ball.live) return;
    const sp = Math.hypot(ball.vx, ball.vz);
    if (sp > 0) {
      const ns = Math.max(0, sp - (0.75 + 0.2 * sp) * h);
      ball.vx *= ns / sp; ball.vz *= ns / sp;
    }
    // 角落與邊緣的小斜坡，避免死球卡在腳踢不到的地方
    const ax_ = Math.abs(ball.x), az = Math.abs(ball.z);
    if (ax_ > HX - 0.32) ball.vx -= Math.sign(ball.x) * 2.6 * h;

        rectCheck = 0;
        const r = glc.getBoundingClientRect();
        if (Math.abs(r.width - lastRectW) > 0.5 || Math.abs(r.height - lastRectH) > 0.5) layout();
      }
      update(dt);
      updateCamera(dt);
      sync3D(dt);
      renderFrame();
      drawHUD();
      if (first) { first = false; const m = document.getElementById('msg'); if (m) m.remove(); }
    }
    requestAnimationFrame(frame);
  }
  layout();
  applyQuality();
  toTitle();
  startMusic();
  requestAnimationFrame(frame);

  /* ---------- 測試掛勾 ---------- */
  window.__fb = {
    state: () => ({
      screen, phase, mode, level, target, score: score.slice(), active: active.slice(), human: human.slice(), cursor: cursor.slice(),
      ball: { x: ball.x, z: ball.z, vx: ball.vx, vz: ball.vz, live: ball.live, inGoal: ball.inGoal, speed: Math.hypot(ball.vx, ball.vz) },
      rods: rods.map(r => ({ team: r.team, kind: r.kind, z: r.z, s: r.s, a: r.a, mode: r.mode, T: r.T, offs: r.offs })),
      kicks: kickCount.slice(), q: qLevel, stats: JSON.parse(JSON.stringify(stats)), winner, W, H, gameT
    }),
    start: o => { o = o || {}; autoAll = !!o.auto; startMatch(o); },
    title: () => toTitle(),
    step: n => { for (let i = 0; i < (n || 1); i++) update(1 / 60); },
    setRod: (i, pos, ang) => { const r = rods[i]; r.s = r.tgt = clamp(pos, -r.T, r.T); if (ang != null) { r.a = ang; r.mode = 'idle'; } },
    kick: (i, p) => kick(rods[i], p == null ? 1 : p),
    placeBall: (x, z, vx, vz) => {
      ball.x = x; ball.z = z; ball.vx = vx || 0; ball.vz = vz || 0; ball.y = R; ball.live = true; ball.vis = true; ball.inGoal = 0;
      if (phase === 'serve' || phase === 'goal') { phase = 'play'; phaseT = 0; }
      deadT = 0; resetTrail();
    },
    freeze: on => { frozen = !!on; },
    auto: on => { autoAll = !!on; if (screen === 'game') human = autoAll ? [false, false] : (mode === '2p' ? [true, true] : [true, false]); },
    hits: () => HITS.map(h => ({ id: h.id, x: Math.round(h.r != null ? h.cx : h.x + h.w / 2), y: Math.round(h.r != null ? h.cy : h.y + h.h / 2) })),
    ctrl: () => JSON.parse(JSON.stringify(CTRL)),
    proj: (x, z) => { camera.position.copy(view.pos); camera.lookAt(view.tgt); camera.updateMatrixWorld(); return proj(x, R, z); },
    replay: on => { opts.replay = !!on; replayOn = !!on; saveOpts(); },
    pause: () => togglePause()
  };
}
</script>
</body>
