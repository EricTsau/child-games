<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>機器人工廠</title>
<link rel="stylesheet" href="../../assets/common.css">
<style>
  html, body { height: 100%; overflow: hidden; background: #27314d; overscroll-behavior: none; }
  #game { position: fixed; inset: 0; display: block; width: 100vw; height: 100vh; height: 100dvh; touch-action: none; }
  #nameBox { position: fixed; inset: 0; z-index: 9000; display: none; align-items: center; justify-content: center; background: rgba(18, 22, 40, 0.6); padding: 16px; }
  #nameBox.on { display: flex; }
  #nameBox .card { background: #fff8ef; border-radius: 26px; padding: 18px 18px 20px; width: min(100%, 380px); text-align: center; border: 5px solid #ffc94a; box-shadow: 0 10px 0 rgba(0, 0, 0, 0.2); }
  #nameBox h3 { margin: 0 0 12px; font-size: 22px; color: #3b3f5c; }
  #nameBox input { font: 900 24px var(--kg-font); width: 100%; padding: 10px 12px; border-radius: 16px; border: 3px solid #8aa0c8; text-align: center; color: #2b2d42; background: #fff; outline: none; user-select: text; -webkit-user-select: text; }
  #nameBox input:focus { border-color: #4a90f0; }
  #nameBox .row { display: flex; gap: 10px; justify-content: center; margin-top: 14px; flex-wrap: wrap; }
  #nameBox .kg-btn { font-size: 18px; padding: 10px 18px; }
</style>
</head>
<body>
<canvas id="game" aria-label="機器人工廠"></canvas>
<div id="nameBox" role="dialog" aria-label="幫機器人取名字">
  <div class="card">
    <h3>幫機器人取名字</h3>
    <input id="nameInput" type="text" maxlength="10" autocomplete="off" enterkeyhint="done">
    <div class="row">
      <button class="kg-btn yellow" id="nameRand" type="button">隨機名字</button>
      <button class="kg-btn green" id="nameOk" type="button">好了</button>
    </div>
  </div>
</div>
<script src="../../assets/common.js"></script>
<script src="../../assets/kg-music.js"></script>
<script>
'use strict';
/* =====================================================================
 * 機器人工廠：在組裝線上用零件組出自己的機器人、上色、貼貼紙，
 * 啟動它！跳舞、打招呼、唱歌、跑測試場，存進展示櫃、拍照。
 * ===================================================================== */
(function () {
const SLUG = 'robot-factory';
const cv = document.getElementById('game');
const ctx = cv.getContext('2d');
const FONT = '"PingFang TC","Noto Sans TC","Microsoft JhengHei","Heiti TC",system-ui,sans-serif';
let W = 360, H = 640, dpr = 1, U = 1, time = 0;
const TAU = Math.PI * 2;
const INK = '#2b2d42';
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const lerp = (a, b, t) => a + (b - a) * t;
const rand = (a, b) => a + Math.random() * (b - a);
const Ease = {
  outCubic: t => 1 - Math.pow(1 - t, 3),
  inOutSine: t => -(Math.cos(Math.PI * t) - 1) / 2,
  outBack: t => { const c = 1.70158, c3 = c + 1; return 1 + c3 * Math.pow(t - 1, 3) + c * Math.pow(t - 1, 2); },
  outElastic: t => (t === 0 || t === 1) ? t : Math.pow(2, -10 * t) * Math.sin((t * 10 - 0.75) * (TAU / 3)) + 1,
  inQuad: t => t * t
};

/* ---------- 補間、延遲、震動 ---------- */
const tweens = [];
function tween(obj, to, dur, ease, delay, done) {
  const tw = { obj, to, from: null, dur: dur || 0.3, ease: typeof ease === 'function' ? ease : (Ease[ease] || Ease.outCubic), t: -(delay || 0), done };
  tweens.push(tw);
  return tw;
}
function killTweens(obj) { for (let i = tweens.length - 1; i >= 0; i--) if (tweens[i].obj === obj) tweens.splice(i, 1); }
function updateTweens(dt) {
  for (let i = tweens.length - 1; i >= 0; i--) {
    const tw = tweens[i];
    if (!tw) continue;
    tw.t += dt;
    if (tw.t < 0) continue;
    if (!tw.from) { tw.from = {}; for (const k in tw.to) tw.from[k] = tw.obj[k]; }
    const p = Math.min(1, tw.t / tw.dur), e = tw.ease(p);
    for (const k in tw.to) tw.obj[k] = tw.from[k] + (tw.to[k] - tw.from[k]) * e;
    if (p >= 1) { const j = tweens.indexOf(tw); if (j >= 0) tweens.splice(j, 1); if (tw.done) tw.done(); }
  }
}
let timers = [];
function after(sec, fn, tag) { timers.push({ t: sec, fn, tag: tag || '' }); }
function cancelTimers(tag) { timers = timers.filter(t => t.tag !== tag); }
function updateTimers(dt) {
  for (let i = timers.length - 1; i >= 0; i--) {
    const tm = timers[i];
    if (!tm) continue;
    tm.t -= dt;
    if (tm.t <= 0) { timers.splice(i, 1); tm.fn(); }
  }
}
let shakeT = 0, shakeAmt = 0, shx = 0, shy = 0;
function shake(a, d) { shakeAmt = Math.max(shakeT > 0 ? shakeAmt : 0, a); shakeT = Math.max(shakeT, d || 0.25); }

/* ---------- 繪圖小工具 ---------- */
function rr(x, y, w, h, r, g) {
  g = g || ctx;
  r = Math.max(0, Math.min(r, Math.abs(w) / 2, Math.abs(h) / 2));
  g.beginPath();
  g.moveTo(x + r, y);
  g.arcTo(x + w, y, x + w, y + h, r);
  g.arcTo(x + w, y + h, x, y + h, r);
  g.arcTo(x, y + h, x, y, r);
  g.arcTo(x, y, x + w, y, r);
  g.closePath();
}
function starPath(x, y, R, r, rot, g) {
  g = g || ctx;
  g.beginPath();
  for (let i = 0; i < 10; i++) {
    const a = (rot || 0) + i * Math.PI / 5 - Math.PI / 2, rad = i % 2 ? r : R;
    g.lineTo(x + Math.cos(a) * rad, y + Math.sin(a) * rad);
  }
  g.closePath();
}
function heartPath(x, y, s, g) {
  g = g || ctx;
  g.beginPath();
  g.moveTo(x, y + s * 0.35);
  g.bezierCurveTo(x - s * 1.1, y - s * 0.35, x - s * 0.55, y - s * 1.05, x, y - s * 0.45);
  g.bezierCurveTo(x + s * 0.55, y - s * 1.05, x + s * 1.1, y - s * 0.35, x, y + s * 0.35);
  g.closePath();
}
function hexToRgb(hex) { const n = parseInt(hex.slice(1), 16); return [n >> 16, (n >> 8) & 255, n & 255]; }
function shade(hex, amt) {
  const c = hexToRgb(hex);
  const f = v => clamp(Math.round(v + amt), 0, 255);
  return 'rgb(' + f(c[0]) + ',' + f(c[1]) + ',' + f(c[2]) + ')';
}
function mix(hex, hex2, k) {
  const a = hexToRgb(hex), b = hexToRgb(hex2);
  return 'rgb(' + Math.round(lerp(a[0], b[0], k)) + ',' + Math.round(lerp(a[1], b[1], k)) + ',' + Math.round(lerp(a[2], b[2], k)) + ')';
}
function lum(hex) { const c = hexToRgb(hex); return (0.299 * c[0] + 0.587 * c[1] + 0.114 * c[2]) / 255; }
function rgba(hex, a) { const c = hexToRgb(hex); return 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + a + ')'; }
function setFont(size, weight, g) { (g || ctx).font = (weight || '900') + ' ' + Math.round(size) + 'px ' + FONT; }
function txt(s, x, y, size, fill, o, g) {
  o = o || {}; g = g || ctx;
  g.save();
  setFont(size, o.weight, g);
  g.textAlign = o.align || 'center';
  g.textBaseline = 'middle';
  g.lineJoin = 'round';
  if (o.shadow !== false) {
    g.fillStyle = o.shadow || 'rgba(20,20,50,0.28)';
    if (o.stroke) { g.strokeStyle = g.fillStyle; g.lineWidth = o.sw || size * 0.22; g.strokeText(s, x, y + size * 0.09); }
    g.fillText(s, x, y + size * 0.09);
  }
  if (o.stroke) { g.strokeStyle = o.stroke; g.lineWidth = o.sw || size * 0.22; g.strokeText(s, x, y); }
  g.fillStyle = fill; g.fillText(s, x, y);
  g.restore();
}
function fitSize(s, maxW, size) { setFont(size); const w = ctx.measureText(s).width; return w > maxW ? size * maxW / w : size; }
/** 標題字：每個字會彈跳 */
function logo(s, cx, cy, size, colors) {
  ctx.save();
  setFont(size);
  ctx.textBaseline = 'middle'; ctx.textAlign = 'center'; ctx.lineJoin = 'round';
  const chars = [...s];
  let total = 0;
  const widths = chars.map(c => { const w = ctx.measureText(c).width * 1.04; total += w; return w; });
  let x = cx - total / 2;
  chars.forEach((c, i) => {
    const w = widths[i];
    const bob = Math.sin(time * 3 + i * 0.8) * size * 0.06;
    const rot = Math.sin(time * 2.2 + i) * 0.06;
    ctx.save();
    ctx.translate(x + w / 2, cy + bob); ctx.rotate(rot);
    ctx.strokeStyle = 'rgba(10,14,30,0.45)'; ctx.lineWidth = size * 0.36; ctx.strokeText(c, 0, size * 0.1);
    ctx.strokeStyle = '#1f2440'; ctx.lineWidth = size * 0.34; ctx.strokeText(c, 0, 0);
    ctx.strokeStyle = '#fff'; ctx.lineWidth = size * 0.17; ctx.strokeText(c, 0, 0);
    const col = colors[i % colors.length];
    const gr = ctx.createLinearGradient(0, -size / 2, 0, size / 2);
    gr.addColorStop(0, shade(col, 80)); gr.addColorStop(0.5, col); gr.addColorStop(1, shade(col, -40));
    ctx.fillStyle = gr; ctx.fillText(c, 0, 0);
    ctx.globalAlpha = 0.55; ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.ellipse(-w * 0.18, -size * 0.25, size * 0.1, size * 0.05, -0.5, 0, TAU); ctx.fill();
    ctx.restore();
    x += w;
  });
  ctx.restore();
}
function glossyStar(x, y, R, on, rot) {
  ctx.save();
  ctx.lineJoin = 'round';
  if (on) {
    ctx.fillStyle = 'rgba(160,90,0,0.25)'; starPath(x, y + R * 0.12, R, R * 0.5, rot); ctx.fill();
    const g = ctx.createRadialGradient(x - R * 0.3, y - R * 0.4, R * 0.1, x, y, R * 1.1);
    g.addColorStop(0, '#fffbd0'); g.addColorStop(0.45, '#ffd93d'); g.addColorStop(1, '#f39a0c');
    ctx.fillStyle = g; ctx.strokeStyle = '#c9700a'; ctx.lineWidth = Math.max(1.5, R * 0.12);
    starPath(x, y, R, R * 0.5, rot); ctx.fill(); ctx.stroke();
    ctx.fillStyle = 'rgba(255,255,255,0.75)';
    ctx.beginPath(); ctx.ellipse(x - R * 0.25, y - R * 0.3, R * 0.22, R * 0.12, -0.6, 0, TAU); ctx.fill();
  } else {
    ctx.fillStyle = 'rgba(70,80,110,0.2)'; ctx.strokeStyle = 'rgba(70,80,110,0.4)'; ctx.lineWidth = Math.max(1.5, R * 0.1);
    starPath(x, y, R, R * 0.5, rot); ctx.fill(); ctx.stroke();
  }
  ctx.restore();
}
/** 音符圖形（不用 emoji） */
function notePath(g, x, y, s, two) {
  g.beginPath();
  g.ellipse(x, y, s * 0.36, s * 0.27, -0.4, 0, TAU);
  if (two) g.ellipse(x + s * 0.7, y - s * 0.15, s * 0.36, s * 0.27, -0.4, 0, TAU);
  g.fill();
  g.lineWidth = s * 0.14; g.lineCap = 'round';
  g.beginPath(); g.moveTo(x + s * 0.3, y - s * 0.05); g.lineTo(x + s * 0.3, y - s * 1.05);
  if (two) { g.lineTo(x + s * 1.0, y - s * 1.2); g.lineTo(x + s * 1.0, y - s * 0.2); }
  else g.quadraticCurveTo(x + s * 0.75, y - s * 0.8, x + s * 0.7, y - s * 0.45);
  g.stroke();
}

/* ---------- 按鈕 ---------- */
let btnReg = [], pressed = null, kbMode = false, focusId = null;
const BTN = {
  green: ['#a6f59c', '#3fbf5c', '#24873e'], pink: ['#ffb3cc', '#f45f93', '#b8366a'], blue: ['#a8e0ff', '#3c9ff0', '#22659e'],
  yellow: ['#fff09a', '#f8b921', '#b57c0b'], purple: ['#dcc6ff', '#9b6ff2', '#5f3fae'], orange: ['#ffd0a0', '#ff8a3d', '#c1561a'],
  white: ['#ffffff', '#e8edf7', '#8f9bb8'], teal: ['#a6f0e6', '#2fb7a6', '#1c7d71'], red: ['#ffb0a8', '#f2564a', '#a8261c'],
  steel: ['#e6ebf5', '#9aa6c0', '#56607c']
};
function drawIcon(name, x, y, s, col) {
  ctx.save(); ctx.translate(x, y);
  ctx.fillStyle = col || '#fff'; ctx.strokeStyle = col || '#fff';
  ctx.lineWidth = s * 0.2; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  if (name === 'play') { ctx.beginPath(); ctx.moveTo(-s * 0.32, -s * 0.45); ctx.lineTo(s * 0.45, 0); ctx.lineTo(-s * 0.32, s * 0.45); ctx.closePath(); ctx.fill(); ctx.stroke(); }
  else if (name === 'pause') { rr(-s * 0.38, -s * 0.42, s * 0.26, s * 0.84, s * 0.08); ctx.fill(); rr(s * 0.12, -s * 0.42, s * 0.26, s * 0.84, s * 0.08); ctx.fill(); }
  else if (name === 'replay') {
    ctx.beginPath(); ctx.arc(0, 0, s * 0.42, -Math.PI * 0.3, Math.PI * 1.35); ctx.stroke();
    const a = -Math.PI * 0.3, ex = Math.cos(a) * s * 0.42, ey = Math.sin(a) * s * 0.42;
    ctx.beginPath(); ctx.moveTo(ex + s * 0.2, ey - s * 0.05); ctx.lineTo(ex - s * 0.02, ey + s * 0.25); ctx.lineTo(ex - s * 0.25, ey - s * 0.12); ctx.closePath(); ctx.fill();
  }
  else if (name === 'back') { ctx.beginPath(); ctx.moveTo(s * 0.4, 0); ctx.lineTo(-s * 0.35, 0); ctx.moveTo(-s * 0.05, -s * 0.32); ctx.lineTo(-s * 0.38, 0); ctx.lineTo(-s * 0.05, s * 0.32); ctx.stroke(); }
  else if (name === 'close') { ctx.beginPath(); ctx.moveTo(-s * 0.3, -s * 0.3); ctx.lineTo(s * 0.3, s * 0.3); ctx.moveTo(s * 0.3, -s * 0.3); ctx.lineTo(-s * 0.3, s * 0.3); ctx.stroke(); }
  else if (name === 'dice') {
    rr(-s * 0.42, -s * 0.42, s * 0.84, s * 0.84, s * 0.18); ctx.lineWidth = s * 0.12; ctx.stroke();
    [[-0.2, -0.2], [0.2, 0.2], [0, 0], [0.2, -0.2], [-0.2, 0.2]].forEach(p => { ctx.beginPath(); ctx.arc(p[0] * s, p[1] * s, s * 0.08, 0, TAU); ctx.fill(); });
  }
  else if (name === 'camera') {
    rr(-s * 0.48, -s * 0.28, s * 0.96, s * 0.66, s * 0.12); ctx.fill();
    rr(-s * 0.2, -s * 0.42, s * 0.4, s * 0.2, s * 0.06); ctx.fill();
    ctx.fillStyle = 'rgba(0,0,0,0.35)'; ctx.beginPath(); ctx.arc(0, s * 0.05, s * 0.2, 0, TAU); ctx.fill();
  }
  else if (name === 'save') {
    rr(-s * 0.44, -s * 0.44, s * 0.88, s * 0.88, s * 0.12); ctx.lineWidth = s * 0.12; ctx.stroke();
    ctx.fillRect(-s * 0.24, -s * 0.44, s * 0.48, s * 0.28);
    rr(-s * 0.26, s * 0.04, s * 0.52, s * 0.3, s * 0.05); ctx.fill();
  }
  else if (name === 'wrench') {
    ctx.lineWidth = s * 0.2; ctx.beginPath(); ctx.moveTo(-s * 0.3, s * 0.3); ctx.lineTo(s * 0.12, -s * 0.12); ctx.stroke();
    ctx.lineWidth = s * 0.14; ctx.beginPath(); ctx.arc(s * 0.22, -s * 0.22, s * 0.2, Math.PI * 0.9, Math.PI * 2.6); ctx.stroke();
  }
  else if (name === 'trash') {
    rr(-s * 0.32, -s * 0.22, s * 0.64, s * 0.66, s * 0.08); ctx.fill();
    ctx.fillRect(-s * 0.42, -s * 0.38, s * 0.84, s * 0.1); ctx.fillRect(-s * 0.12, -s * 0.48, s * 0.24, s * 0.12);
  }
  else if (name === 'power') {
    ctx.lineWidth = s * 0.16; ctx.beginPath(); ctx.arc(0, s * 0.05, s * 0.36, -Math.PI * 0.32, Math.PI * 1.32); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(0, -s * 0.45); ctx.lineTo(0, -s * 0.05); ctx.stroke();
  }
  else if (name === 'note') { ctx.lineWidth = s * 0.12; notePath(ctx, -s * 0.2, s * 0.3, s * 0.75, false); }
  else if (name === 'wave') {
    rr(-s * 0.26, -s * 0.1, s * 0.52, s * 0.52, s * 0.2); ctx.fill();
    for (let i = 0; i < 4; i++) { rr(-s * 0.26 + i * s * 0.14, -s * 0.48, s * 0.1, s * 0.42, s * 0.05); ctx.fill(); }
    ctx.save(); ctx.rotate(-0.7); rr(-s * 0.5, s * 0.08, s * 0.12, s * 0.3, s * 0.05); ctx.fill(); ctx.restore();
  }
  else if (name === 'dance') {
    ctx.beginPath(); ctx.arc(0, -s * 0.32, s * 0.13, 0, TAU); ctx.fill();
    ctx.lineWidth = s * 0.14; ctx.beginPath(); ctx.moveTo(-s * 0.38, -s * 0.38); ctx.lineTo(-s * 0.12, -s * 0.08); ctx.lineTo(s * 0.12, -s * 0.12); ctx.lineTo(s * 0.4, -s * 0.42);
    ctx.moveTo(0, -s * 0.12); ctx.lineTo(0, s * 0.14); ctx.lineTo(-s * 0.26, s * 0.45); ctx.moveTo(0, s * 0.14); ctx.lineTo(s * 0.3, s * 0.3); ctx.lineTo(s * 0.32, s * 0.48); ctx.stroke();
  }
  else if (name === 'flag') {
    ctx.lineWidth = s * 0.12; ctx.beginPath(); ctx.moveTo(-s * 0.32, s * 0.48); ctx.lineTo(-s * 0.32, -s * 0.46); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(-s * 0.3, -s * 0.46); ctx.lineTo(s * 0.44, -s * 0.28); ctx.lineTo(-s * 0.3, -s * 0.06); ctx.closePath(); ctx.fill();
  }
  else if (name === 'stop') { rr(-s * 0.34, -s * 0.34, s * 0.68, s * 0.68, s * 0.1); ctx.fill(); }
  else if (name === 'case') {
    ctx.lineWidth = s * 0.12; rr(-s * 0.42, -s * 0.46, s * 0.84, s * 0.92, s * 0.1); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(-s * 0.42, s * 0.02); ctx.lineTo(s * 0.42, s * 0.02); ctx.stroke();
    ctx.beginPath(); ctx.arc(0, -s * 0.2, s * 0.12, 0, TAU); ctx.fill(); ctx.beginPath(); ctx.arc(0, s * 0.25, s * 0.12, 0, TAU); ctx.fill();
  }
  ctx.restore();
}
/** 立體按鈕 o: {label, icon, color, onClick, size, pulse, disabled, def, radius, sub} */
function button(id, x, y, w, h, o) {
  btnReg.push({ id, x, y, w, h, onClick: o.onClick, disabled: o.disabled, def: o.def, quiet: o.quiet });
  const pal = BTN[o.color || 'green'];
  const isDown = pressed && pressed.id === id;
  let s = isDown ? 0.93 : 1;
  if (o.pulse && !isDown) s *= 1 + Math.sin(time * 5) * 0.03;
  const lip = Math.max(3, Math.min(6, h * 0.1));
  ctx.save();
  ctx.translate(x + w / 2, y + h / 2); ctx.scale(s, s);
  if (o.disabled) ctx.globalAlpha = 0.5;
  const r = o.radius == null ? Math.min(h / 2, 18) : o.radius;
  const yo = isDown ? lip * 0.6 : 0;
  rr(-w / 2, -h / 2 + lip + 3, w, h, r); ctx.fillStyle = 'rgba(10,15,35,0.25)'; ctx.fill();
  rr(-w / 2, -h / 2 + lip, w, h, r); ctx.fillStyle = pal[2]; ctx.fill();
  rr(-w / 2, -h / 2 + yo, w, h, r);
  const g = ctx.createLinearGradient(0, -h / 2, 0, h / 2);
  g.addColorStop(0, pal[0]); g.addColorStop(0.55, pal[1]); g.addColorStop(1, shade(pal[1], -15));
  ctx.fillStyle = g; ctx.fill();
  ctx.strokeStyle = pal[2]; ctx.lineWidth = Math.max(2, Math.min(3, h * 0.05)); ctx.stroke();
  rr(-w / 2 + Math.min(h, w) * 0.2, -h / 2 + yo + h * 0.08, w - Math.min(h, w) * 0.4, h * 0.26, h * 0.13);
  ctx.fillStyle = 'rgba(255,255,255,0.42)'; ctx.fill();
  const fs = o.size || Math.min(h * 0.42, 22);
  const tc = o.color === 'white' || o.color === 'steel' ? '#34395a' : '#fff';
  const sc = o.color === 'white' || o.color === 'steel' ? '#fff' : pal[2];
  if (o.icon && o.label) {
    if (o.stack) {
      drawIcon(o.icon, 0, yo - h * 0.14, Math.min(h * 0.36, w * 0.4), tc);
      const ls = fitSize(o.label, w - 8, fs * 0.82);
      txt(o.label, 0, yo + h * 0.27, ls, tc, { stroke: sc, sw: ls * 0.22, shadow: false });
    } else {
      setFont(fs);
      const tw = ctx.measureText(o.label).width;
      const tot = fs * 1.2 + tw;
      const k = tot > w - 12 ? (w - 12) / tot : 1;
      ctx.save(); ctx.scale(k, k);
      drawIcon(o.icon, -tot / 2 + fs * 0.45, yo / k, fs * 0.9, tc);
      txt(o.label, -tot / 2 + fs * 1.2 + tw / 2, yo / k + 1, fs, tc, { stroke: sc, sw: fs * 0.2, shadow: false });
      ctx.restore();
    }
  } else if (o.icon) drawIcon(o.icon, 0, yo, fs * 1.1, tc);
  else if (o.label != null) { const ls = fitSize(o.label, w - 12, fs); txt(o.label, 0, yo + 1, ls, tc, { stroke: sc, sw: ls * 0.2, shadow: false }); }
  ctx.restore();
  if (kbMode && focusId === id) {

const PMAX = KG.lowEnd ? 120 : 200;
const parts = [];
for (let i = 0; i < PMAX; i++) parts.push({ on: false, x: 0, y: 0, vx: 0, vy: 0, life: 0, max: 1, size: 1, color: '#fff', shape: 0, rot: 0, vr: 0, g: 0, drag: 1 });
let pIdx = 0;
const SH_STAR = 0, SH_SPARK = 1, SH_DOT = 2, SH_CONF = 3, SH_RING = 4, SH_NOTE = 5, SH_DROP = 6, SH_BOLT = 7;
function allocP() {
  for (let k = 0; k < PMAX; k++) {
    const p = parts[(pIdx + k) % PMAX];
    if (!p.on) { pIdx = (pIdx + k + 1) % PMAX; return p; }
  }
  const p = parts[pIdx]; pIdx = (pIdx + 1) % PMAX; return p;
}
function burst(x, y, o) {
  o = o || {};
  const n = o.n || 12, cols = o.colors || ['#fff'];
  for (let i = 0; i < n; i++) {
    const p = allocP(), a = o.angle != null ? o.angle + rand(-(o.spread || 0.6), o.spread || 0.6) : rand(0, TAU), sp = (o.speed || 200) * rand(0.4, 1);
    p.on = true; p.x = x; p.y = y; p.vx = Math.cos(a) * sp; p.vy = Math.sin(a) * sp - (o.up || 0);
    p.life = 0; p.max = (o.life || 0.7) * rand(0.6, 1.2); p.size = (o.size || 6) * rand(0.6, 1.3); p.color = cols[i % cols.length];
    p.shape = o.shape != null ? o.shape : SH_STAR; p.rot = rand(0, TAU); p.vr = rand(-6, 6); p.g = o.g == null ? 400 : o.g; p.drag = o.drag || 0.98;
  }
}
function ring(x, y, color, r, life) {
  const p = allocP();
  p.on = true; p.x = x; p.y = y; p.vx = 0; p.vy = 0; p.life = 0; p.max = life || 0.45; p.size = r || 40; p.color = color; p.shape = SH_RING; p.g = 0; p.drag = 1; p.rot = 0; p.vr = 0;
}
function updateParts(dt) {
  for (const p of parts) {
    if (!p.on) continue;
    p.life += dt;
    if (p.life >= p.max) { p.on = false; continue; }
    p.vy += p.g * dt; p.vx *= p.drag; p.vy *= p.drag;
    p.x += p.vx * dt; p.y += p.vy * dt; p.rot += p.vr * dt;
  }
}
function drawParts() {
  for (const p of parts) {
    if (!p.on) continue;
    const k = p.life / p.max, a = 1 - k;
    ctx.globalAlpha = clamp(a * 1.4, 0, 1);
    ctx.fillStyle = p.color; ctx.strokeStyle = p.color;
    if (p.shape === SH_STAR) { starPath(p.x, p.y, p.size, p.size * 0.45, p.rot); ctx.fill(); }
    else if (p.shape === SH_SPARK) { ctx.lineWidth = Math.max(1.5, p.size * 0.35); ctx.lineCap = 'round'; ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(p.x - p.vx * 0.04, p.y - p.vy * 0.04); ctx.stroke(); }
    else if (p.shape === SH_DOT) { ctx.beginPath(); ctx.arc(p.x, p.y, p.size * (0.5 + a * 0.5), 0, TAU); ctx.fill(); }
    else if (p.shape === SH_CONF) { ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot); ctx.fillRect(-p.size / 2, -p.size / 4, p.size, p.size / 2); ctx.restore(); }
    else if (p.shape === SH_RING) { ctx.lineWidth = 5 * a + 1; ctx.beginPath(); ctx.arc(p.x, p.y, p.size * (0.3 + Ease.outCubic(k) * 0.9), 0, TAU); ctx.stroke(); }
    else if (p.shape === SH_NOTE) { ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(Math.sin(p.rot) * 0.3); notePath(ctx, 0, 0, p.size, p.vr > 0); ctx.restore(); }
    else if (p.shape === SH_DROP) { ctx.beginPath(); ctx.ellipse(p.x, p.y, p.size * 0.6, p.size * (0.6 + Math.min(1, Math.abs(p.vy) / 500) * 0.5), Math.atan2(p.vy, p.vx) + Math.PI / 2, 0, TAU); ctx.fill(); }
    else if (p.shape === SH_BOLT) {
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot);
      ctx.beginPath(); for (let i = 0; i < 6; i++) { const an = i * TAU / 6; ctx.lineTo(Math.cos(an) * p.size, Math.sin(an) * p.size); } ctx.closePath(); ctx.fill();
      ctx.fillStyle = 'rgba(0,0,0,0.3)'; ctx.beginPath(); ctx.arc(0, 0, p.size * 0.4, 0, TAU); ctx.fill();
      ctx.restore();
    }
  }
  ctx.globalAlpha = 1;
}

function goTitle() {
  scene = 'title'; sceneT = 0; paused = false; focusId = null; Result.hide(); stopLoops(); cancelTimers('stage'); flushSave();
  Act.sleepy = false; Act.power = -1; Act.greet = -1; Act.sing = null; Bubble.s = '';
  LT = titleLayout();
  playSong('title');
}
function updateTitle(dt) {
  titleBelt += dt * 90;
  Bubble.t += dt;
  const b = titleBot();
  updateActor(dt, b, LT.rx);
  const P = Act.P, lk = legKind(b);
  if (lk === 'legs' || lk === 'spider') { P.walk += dt * 6.5; P.stride = 0.7; }
  if (lk === 'spring') { P.by = -Math.abs(Math.sin(P.t * 4)) * 16; P.spring = Math.max(0, 1 - Math.abs(Math.sin(P.t * 4)) * 4) * 0.6; }
  P.wheel += dt * 3;
  P.armL += Math.sin(P.walk) * 0.25; P.armR -= Math.sin(P.walk) * 0.25;
}
function drawTitle() {
  const L = LT;
  ctx.drawImage(makeBg('build'), 0, 0, W, H);
  drawGear(W * 0.1, H * 0.28, Math.min(W, H) * 0.13, time * 0.3, 'rgba(120,140,200,0.14)', 10);
  drawGear(W * 0.9, H * 0.5, Math.min(W, H) * 0.17, -time * 0.24, 'rgba(120,140,200,0.12)', 12);
  drawGear(W * 0.78, H * 0.16, Math.min(W, H) * 0.08, time * 0.5, 'rgba(255,210,63,0.16)', 8);
  const X = L.rx, gy = X.y + GROUND * X.s;
  drawBelt(L.robot.x + 6, gy - 2, L.robot.w - 12, Math.max(16, 22 * X.s), -titleBelt);
  ctx.save(); ctx.translate(shx, shy);
  drawRobotAt(X, titleBot(), Act.P, { noShadow: true });
  ctx.restore();
  drawBubble(X, titleBot());
  const lx = L.wide ? W / 2 : W / 2;
  logo('機器人工廠', lx, L.logoY, fitSize('機器人工廠', W - 130, L.logoS), ['#ff9a3c', '#ffd23f', '#5ccf6a', '#4a90f0', '#ff8fc8']);
  const sub = '組一台獨一無二的機器人！';
  txt(sub, lx, L.logoY + L.logoS * 0.85, fitSize(sub, W - 40, clamp(L.logoS * 0.34, 14, 22)), '#fff3c0', { stroke: '#1d2340', sw: 5 });
  let y = L.by;
  button('t_build', L.bx, y, L.bw, 62, { label: complete(R) ? '進工廠改造' : '開始組裝', icon: 'wrench', color: 'green', pulse: true, def: true, onClick: goBuild }); y += 62 + 12;
  const hw = (L.bw - 10) / 2;
  button('t_case', L.bx, y, complete(R) ? hw : L.bw, 54, { label: '展示櫃', icon: 'case', color: 'blue', onClick: () => goGallery('view') });
  if (complete(R)) button('t_play', L.bx + hw + 10, y, hw, 54, { label: '出來玩', icon: 'play', color: 'pink', onClick: () => goStage(true) });
  y += 54 + 12;
  toggleRow(L.bx, y, L.bw, 44, false);
  const bd = KG.best(SLUG + ':dance'), bc = KG.best(SLUG + ':course', null, true);
  const rec = [bd != null ? '跳舞最高 ' + bd + ' 分' : '', bc != null ? '測試場最快 ' + bc + ' 秒' : ''].filter(Boolean).join('　');
  if (rec) txt(rec, L.wide ? L.bx + L.bw / 2 : W / 2, Math.min(H - 10, y + 44 + 16), fitSize(rec, L.wide ? L.bw : W - 30, 14), 'rgba(230,236,255,0.85)', { shadow: false });
}

/* =====================================================================
 * 取名字（HTML 輸入框）
 * ===================================================================== */
const nameBox = document.getElementById('nameBox'), nameInput = document.getElementById('nameInput');
let nameOpen = false;
function openName() {
  nameOpen = true; nameInput.value = R.name; nameBox.classList.add('on');
  setTimeout(() => { try { nameInput.focus(); nameInput.select(); } catch (e) { /* 忽略 */ } }, 60);
}
function closeName(ok) {
  if (!nameOpen) return;
  if (ok) { const v = nameInput.value.trim().slice(0, 10); R.name = v || randomName(); saveSoon(); hint('你好，' + R.name + '！'); sfx('rf_blink'); robotBeep(R, 2); }
  nameBox.classList.remove('on'); nameOpen = false;
  try { nameInput.blur(); } catch (e) { /* 忽略 */ }
}
document.getElementById('nameRand').addEventListener('click', () => { nameInput.value = randomName(); sfx('dice'); });
document.getElementById('nameOk').addEventListener('click', () => { sfx('ui'); closeName(true); });
nameInput.addEventListener('keydown', (e) => { e.stopPropagation(); if (e.key === 'Enter') closeName(true); else if (e.key === 'Escape') closeName(false); });
nameBox.addEventListener('pointerdown', (e) => { if (e.target === nameBox) closeName(true); });

/* =====================================================================
 * 輸入
 * ===================================================================== */
function toLocal(e) {
  const r = cv.getBoundingClientRect();
  return [(e.clientX - r.left) * W / (r.width || W), (e.clientY - r.top) * H / (r.height || H)];
}
function sceneDown(x, y, e) {
  if (paused || Result.on) return;
  if (scene === 'build') buildDown(x, y, e);
  else if (scene === 'stage') {
    const [rx, ry] = toRobot(x, y, LS.rx);
    if (partAt(rx, ry, 10)) tapRobot(x, y);
  } else if (scene === 'title') {
    const [rx, ry] = toRobot(x, y, LT.rx);
    if (rx > -120 && rx < 120 && ry > -200 && ry < 140) { Act.react = 0; robotBeep(titleBot(), 3, { gap: 0.07 }); showBubble(KG.pick(['嗶嗶！', '來組機器人吧！', '你好！']), 1.4); }
  } else if (scene === 'dance') danceTap(x, y);
  else if (scene === 'course') { if (Co.state === 'run') doJump(); }
}
cv.addEventListener('pointerdown', (e) => {
  e.preventDefault();
  if (nameOpen) return;
  kbMode = false;
  const [x, y] = toLocal(e);
  ptr.x = x; ptr.y = y; ptr.t = performance.now(); ptr.has = true;
  const b = hitBtn(x, y);
  if (b) {
    pressed = { id: b.id, pid: e.pointerId };
    if (!b.quiet) sfx('click', { vol: 0.7 });
    try { cv.setPointerCapture(e.pointerId); } catch (er) { /* 忽略 */ }
    return;
  }
  try { cv.setPointerCapture(e.pointerId); } catch (er) { /* 忽略 */ }
  sceneDown(x, y, e);
});
cv.addEventListener('pointermove', (e) => {
  const [x, y] = toLocal(e);
  if (e.pointerType === 'mouse' || e.buttons) { ptr.x = x; ptr.y = y; ptr.t = performance.now(); ptr.has = true; }
  if (scene === 'build' && !paused) buildMove(x, y, e);
});
function endPointer(e, cancel) {
  const [x, y] = toLocal(e);
  if (pressed && pressed.pid === e.pointerId) {
    const b = hitBtn(x, y), id = pressed.id;
    pressed = null;
    if (!cancel && b && b.id === id && b.onClick) { if (!b.quiet) sfx('ui'); b.onClick(); }
    return;
  }
  if (scene === 'build' && !paused) buildUp(x, y, e, cancel);
}
cv.addEventListener('pointerup', (e) => endPointer(e, false));
cv.addEventListener('pointercancel', (e) => endPointer(e, true));
cv.addEventListener('contextmenu', (e) => e.preventDefault());
window.addEventListener('keydown', (e) => {
  if (nameOpen) return;
  const k = e.key;
  if (PAUSABLE[scene] && !Result.on && (k === 'Escape' || k === 'p' || k === 'P')) { e.preventDefault(); setPaused(!paused); kbMode = true; return; }
  if (!paused && !Result.on) {
    if (scene === 'course' && (k === ' ' || k === 'ArrowUp' || k === 'w' || k === 'W')) {
      e.preventDefault();
      if (Co.state === 'intro') startRun(); else doJump();
      return;
    }
    if (scene === 'dance' && k === ' ') { e.preventDefault(); danceTap(LS.rx.x, LS.rx.y); return; }
    if (scene === 'build') {
      if (/^[1-7]$/.test(k)) { setTab(TABS[+k - 1].id); kbMode = true; focusId = null; return; }
      const items = getTray();
      if (k === ']' || k === 'PageDown') { kbMode = true; focusId = null; Bld.focus = (Bld.focus + 1) % items.length; sfx('click', { vol: 0.5 }); e.preventDefault(); return; }
      if (k === '[' || k === 'PageUp') { kbMode = true; focusId = null; Bld.focus = (Bld.focus - 1 + items.length) % items.length; sfx('click', { vol: 0.5 }); e.preventDefault(); return; }
      if ((k === 'Enter' || k === ' ') && Bld.focus >= 0 && items[Bld.focus] && !focusId) { e.preventDefault(); const it = items[Bld.focus]; useItem(it, it.x, it.y + it.h / 2); return; }
    }
  }
  if (k === 'ArrowRight' || k === 'ArrowDown' || (k === 'Tab' && !e.shiftKey)) { kbMode = true; if (scene === 'build') Bld.focus = -1; focusMove(1); e.preventDefault(); }
  else if (k === 'ArrowLeft' || k === 'ArrowUp' || (k === 'Tab' && e.shiftKey)) { kbMode = true; if (scene === 'build') Bld.focus = -1; focusMove(-1); e.preventDefault(); }
  else if (k === 'Enter' || k === ' ') { e.preventDefault(); kbMode = true; focusPress(); }
  else if (k === 'Escape' && scene === 'gallery') goTitle();
});
document.addEventListener('visibilitychange', () => {
  if (document.hidden) {
    stopLoops();
    if (PAUSABLE[scene] && !paused && !Result.on && (scene === 'course' || scene === 'dance')) setPaused(true);
    flushSave();
  }
});
window.addEventListener('pagehide', flushSave);

/* =====================================================================
 * 主迴圈
 * ===================================================================== */
function resize() {
  const r = cv.getBoundingClientRect();
  W = Math.max(1, r.width || innerWidth); H = Math.max(1, r.height || innerHeight);
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
  U = clamp(Math.min(W / 400, H / 700), 0.75, 1.5);
  pvCache.clear(); thumbCache.clear(); trayCache = null; bgKey = '';
  LB = layoutBuild(); LS = layoutStage(); LT = titleLayout();
  if (scene === 'course') { const px = Co.x; layoutCourse(); Co.camX = px - Co.viewW * 0.3; }
}
window.addEventListener('resize', resize);
window.addEventListener('orientationchange', () => setTimeout(resize, 120));
if (window.visualViewport) window.visualViewport.addEventListener('resize', resize);

function step(dt) {
  time += dt; sceneT += dt;
  if (shakeT > 0) shakeT -= dt;
  updateDuck();
  if (saveTimer > 0) { saveTimer -= dt; if (saveTimer <= 0) { saveTimer = 0.0001; flushSave(); } }
  if (Photo.t >= 0) { Photo.t += dt; if (Photo.t > 2.8) { Photo.t = -1; Photo.c = null; } }
  Result.update(dt);
  if (paused) return;
  updateTweens(dt); updateTimers(dt); updateParts(dt); Callout.update(dt);
  if (scene === 'title') updateTitle(dt);
  else if (scene === 'build') { updateActor(dt, R, LB.rx); updateBuild(dt); }
  else if (scene === 'stage') updateStage(dt);
  else if (scene === 'dance') updateDance(dt);
  else if (scene === 'course') updateCourse(dt);
  if (scene !== 'build') stopHum();
}
function render() {
  btnReg = [];
  if (shakeT > 0 && !paused) { const k = shakeAmt * Math.min(1, shakeT * 4); shx = (Math.random() * 2 - 1) * k; shy = (Math.random() * 2 - 1) * k; } else { shx = 0; shy = 0; }
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
  if (scene === 'title') { drawTitle(); drawParts(); }
  else if (scene === 'build') { drawBuild(); drawParts(); }
  else if (scene === 'stage') drawStage();
  else if (scene === 'dance') drawDance();
  else if (scene === 'course') drawCourse();
  else if (scene === 'gallery') { drawGallery(); drawParts(); }
  if (Result.on) { btnReg = []; Result.draw(); drawParts(); }
  if (paused) { btnReg = []; drawPause(); }
}
let last = performance.now();
const perfStat = { n: 0, sum: 0, max: 0 };
function frame(now) {
  const dt = Math.min(0.05, Math.max(0, (now - last) / 1000));
  last = now;
  const t0 = performance.now();
  try { step(dt); render(); } catch (err) { console.error(err); }
  const ft = performance.now() - t0;
  perfStat.n++; perfStat.sum += ft; if (ft > perfStat.max) perfStat.max = ft;
  requestAnimationFrame(frame);
}
resize();
goTitle();
requestAnimationFrame((t) => { last = t; frame(t); });

/* ---------- 測試用 ---------- */
window.__rf = {
  state: () => ({ scene, paused, music: M ? M.isPlaying() : null, song: curSong, tab: Bld.tab, robot: cloneRobot(R), complete: complete(R), bots: bots.map(b => b ? b.name : null),
    power: Act.power, greet: Act.greet, sing: !!Act.sing, result: Result.on, dance: { beat: Dn.beat, score: Dn.score, hits: Dn.hits, audio: Dn.audio, arm: Dn.arm, done: Dn.done },
    course: { state: Co.state, x: Math.round(Co.x), y: Math.round(Co.y), end: Co.end, t: +Co.t.toFixed(2), got: Co.got, total: Co.total, done: Co.done, crane: !!Co.crane, onG: Co.onG, rescues: Co.rescues },
    photos: window.__rfPhotos || 0, hint: Bld.hint, name: R.name, gal: Gal.sel }),
  go: (s, a) => { if (s === 'title') goTitle(); else if (s === 'build') goBuild(); else if (s === 'stage') goStage(!!a); else if (s === 'dance') startDance(); else if (s === 'course') goCourse(); else if (s === 'gallery') goGallery(a); },
  random: () => { const n = randomRobot(true); n.name = R.name; R = n; saveSoon(); },
  set: (r) => { R = sanitize(r); saveSoon(); },
  install: (kind, id) => install(kind, id),
  tab: t => setTab(t),
  tick: (sec, fn) => { for (let i = 0; i < sec * 60; i++) { step(1 / 60); if (fn) fn(); } },
  btns: () => btnReg.map(b => ({ id: b.id, x: Math.round(b.x + b.w / 2), y: Math.round(b.y + b.h / 2), w: Math.round(b.w), h: Math.round(b.h) })),
  tray: () => getTray().map(it => ({ type: it.type, kind: it.kind, id: it.id, x: Math.round(it.x), y: Math.round(it.y + it.h / 2) })),
  socket: kind => socketScreen(kind).map(p => p.map(Math.round)),
  robotXf: () => (scene === 'build' ? LB.rx : scene === 'title' ? LT.rx : LS.rx),
  pause: p => setPaused(p),
  jump: () => doJump(),
  beats: n => { for (let i = 0; i < n && !Dn.done; i++) onBeat(null); },
  startRun: () => startRun(),
  perf: reset => { const r = { avg: perfStat.n ? +(perfStat.sum / perfStat.n).toFixed(2) : 0, max: +perfStat.max.toFixed(1), n: perfStat.n }; if (reset) { perfStat.n = 0; perfStat.sum = 0; perfStat.max = 0; } return r; },
  songs: () => ({ SONG_TITLE, SONG_BUILD, SONG_DANCE, SONG_COURSE }),
  lay: () => ({ LB, LS, LT }),
  pose: () => Act.P
};
})();
</script>
</body>
