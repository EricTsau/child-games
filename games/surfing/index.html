    ctx.clearRect(0, 0, W, H);
    BTN = [];
    if (CO.main) { CO.main.t += rdt; if (CO.main.t > CO.main.dur) CO.main = null; }
    if (CO.small) { CO.small.t += rdt; if (CO.small.t > CO.small.dur) CO.small = null; }
    switch (sceneName) {
      case 'title': drawTitle(); break;
      case 'chars': drawChars(); break;
      case 'beaches': drawBeaches(); break;
      case 'missions': drawMissions(); break;
      case 'brief': drawBrief(); break;
      case 'count': drawHUD(); drawCount(); drawMain(); break;
      case 'ride': drawHUD(); drawMain(); drawSmall(calloutY() + 58 * s); break;
      case 'judge': drawJudge(); break;
      case 'standings': drawStandings(); break;
      case 'final': drawFinal(); break;
      case 'result': drawResult(); break;
    }
    if (paused) { BTN = []; drawPause(); }
  }

  /* =========================================================
   * 輸入
   * ========================================================= */
  function local(e) { const r = cv.getBoundingClientRect(); return { x: e.clientX - r.left, y: e.clientY - r.top }; }
  function hitBtn(x, y, slack) {
    let best = null, bd = Infinity;
    for (const b of BTN) {
      const dx = Math.max(b.x - x, 0, x - (b.x + b.w)), dy = Math.max(b.y - y, 0, y - (b.y + b.h)), dd = Math.hypot(dx, dy);
      if (dd < bd) { bd = dd; best = b; }
    }
    return best && bd <= slack ? best : null;
  }
  const ptrs = new Map();
  cv.addEventListener('pointerdown', e => {
    e.preventDefault();
    if (e.pointerType === 'touch') isTouch = true;
    const p = local(e);
    try { cv.setPointerCapture(e.pointerId); } catch (err) { /* 忽略 */ }
    const riding = sceneName === 'ride' && !paused;
    const b = hitBtn(p.x, p.y, riding ? 6 : 22);
    if (b) { press = { id: b.id, pid: e.pointerId }; return; }
    if (!riding) return;
    for (const tb of touchLayout()) {
      if (Math.hypot(p.x - tb.x, p.y - tb.y) < tb.r + 10 * s) { touchBtnDown(tb.id); ptrs.set(e.pointerId, { role: 'tbtn', id: tb.id }); return; }
    }
    if (stick) return;
    const st = { role: 'steer', x0: p.x, y0: p.y, x: p.x, y: p.y, ax: p.x, ay: p.y, t0: performance.now(), swiped: false, moved: 0 };
    ptrs.set(e.pointerId, st);
    stick = st;
  });
  cv.addEventListener('pointermove', e => {
    const st = ptrs.get(e.pointerId);
    if (!st || st.role !== 'steer') return;
    const p = local(e);
    st.x = p.x; st.y = p.y;
    st.moved = Math.max(st.moved, Math.hypot(p.x - st.x0, p.y - st.y0));
    if (rider.air) {
      const dx = p.x - st.ax, dy = p.y - st.ay;
      if (Math.hypot(dx, dy) > 30 * s) {
        if (Math.abs(dx) > Math.abs(dy)) requestTrick('spin', dx > 0 ? 1 : -1);
        else requestTrick('flip', dy < 0 ? 1 : -1);
        st.ax = p.x; st.ay = p.y; st.swiped = true;
      }
      inp.steer = 0;
    } else {
      st.ax = p.x; st.ay = p.y;
      const dy = (p.y - st.y0) / (50 * s);
      inp.steer = Math.abs(dy) < 0.12 ? 0 : clamp(dy, -1, 1);
    }
  });
  function endPtr(e, cancel) {
    const p = local(e);
    if (press && press.pid === e.pointerId) {
      const b = hitBtn(p.x, p.y, sceneName === 'ride' ? 10 : 26);
      const id = press.id;
      press = null;
      if (!cancel && b && b.id === id && b.onClick && !b.disabled) b.onClick();
      return;
    }
    const st = ptrs.get(e.pointerId);
    ptrs.delete(e.pointerId);
    if (!st) return;
    if (st.role === 'tbtn') { touchBtnUp(st.id); return; }
    if (stick === st) stick = null;
    inp.steer = 0;
    if (cancel || sceneName !== 'ride' || paused) return;
    if (rider.air) { if (!st.swiped && st.moved < 14 * s) requestTrick('grab', 1); }
    else inp.pumpReq = true;
  }
  cv.addEventListener('pointerup', e => endPtr(e, false));
  cv.addEventListener('pointercancel', e => endPtr(e, true));
  cv.addEventListener('contextmenu', e => e.preventDefault());

  const keys = {};
  const KMAP = { ArrowUp: 'up', KeyW: 'up', ArrowDown: 'down', KeyS: 'down', ArrowLeft: 'left', KeyA: 'left', ArrowRight: 'right', KeyD: 'right', Space: 'space' };
  window.addEventListener('keydown', e => {
    const k = KMAP[e.code];
    if (k || e.code === 'Escape' || e.code === 'KeyP' || e.code === 'Enter') e.preventDefault();
    if (e.code === 'Escape' || e.code === 'KeyP') { if (inRideScene()) setPaused(!paused); else if (sceneName !== 'title' && e.code === 'Escape') { const b = BTN.find(x => x.id === 'back' || x.id === 'home' || x.id === 'list'); if (b) b.onClick(); } return; }
    if (e.code === 'Enter' && !e.repeat) {
      const pri = ['resume', 'go', 'next', 'again', 'ok', 'free'];
      for (const id of pri) { const b = BTN.find(x => x.id === id); if (b) { b.onClick(); return; } }
      return;
    }
    if (!k || paused) return;
    if (sceneName !== 'ride') return;
    const first = !keys[k];
    keys[k] = true;
    if (e.repeat || !first) return;
    if (rider.air) {
      if (k === 'left') requestTrick('spin', -1);
      else if (k === 'right') requestTrick('spin', 1);
      else if (k === 'up') requestTrick('flip', 1);
      else if (k === 'down') requestTrick('flip', -1);
      else if (k === 'space') requestTrick('grab', 1);
    } else if (k === 'space' || k === 'right') inp.pumpReq = true;
  });
  window.addEventListener('keyup', e => { const k = KMAP[e.code]; if (k) keys[k] = false; });
  window.addEventListener('blur', () => { for (const k in keys) keys[k] = false; });
  function keyInput() {
    if (stick) return;
    const v = (keys.down ? 1 : 0) - (keys.up ? 1 : 0);
    if (v || inp._kb) { inp.steer = v; inp._kb = !!v; }
    let stall = !!keys.left && !rider.air;
    if (tDown.stall) stall = true;
    inp.stall = stall;
  }
  document.addEventListener('visibilitychange', () => { if (document.hidden && inRideScene()) setPaused(true); });

  /* =========================================================
   * 主迴圈
   * ========================================================= */
  function simulate(dt) {
    gameT += dt;
    curlX += WV.peel * (1 + 0.1 * Math.sin(gameT * 0.31) + 0.05 * Math.sin(gameT * 0.83 + 1)) * dt;
    if (sceneName === 'ride') keyInput();
    riderUpdate(dt);
    spawnObjects();
    updateObjects(dt);
    lipSpray(dt);
    updateParts(dt);
    updateGulls(dt);
    combo.idle += dt;
    if (combo.idle > 2.5 && combo.meter > 0) {
      combo.meter = Math.max(0, combo.meter - 22 * dt);
      combo.mult = Math.max(1, Math.min(combo.mult, 1 + Math.floor(combo.meter / 100)));
    }
    if (sceneName === 'ride' && scoring) {
      rideT += dt;
      ST.maxMult = Math.max(ST.maxMult, combo.mult);
      checkMission();
      if (M) {
        M.setLayer('combo', combo.mult >= 3);
        const late = mode === 'comp' && HEAT_TIME - rideT < 10;
        M.setLayer('hype', combo.mult >= 5 || late);
        M.setTempo(late ? 1.07 : 1);
      }
      if (!endPending) {
        if (mode === 'comp' && rideT >= HEAT_TIME) { callout('時間到！', '', '#ffe066', 1.2); sfx('go', { exact: true, pitch: 0.8 }); endPending = 1.2; }
        if (mode === 'mission' && !missionState && rideT >= MISSION_TIME) { callout('時間到！', '', '#ffe066', 1.2); endPending = 1.2; }
      }
    }
    if (endPending > 0) {
      endPending -= dt;
      if (endPending <= 0) { endPending = 0; endRide(missionState === 'done' ? 'done' : 'time'); }
    }
  }
  function updateAudio(rdt) {
    loopTimer -= rdt;
    if (loopTimer > 0) return;
    loopTimer = 0.1;
    const want = sfxOn && !paused && !document.hidden;
    if (!want) { if (LOOP.water) stopLoops(); return; }
    ensureLoops();
    if (!LOOP.water) return;
    const r = rider, sp = clamp(r.v / 20, 0, 1);
    if (inRideScene() && r.state === 'ride') {
      if (r.tube) LOOP.water.set(0.1, 0.17);
      else if (r.air) LOOP.water.set(0.2, 0.07);
      else LOOP.water.set(0.2 + sp * 0.6, 0.08 + sp * 0.08);
      LOOP.wind.set(r.air ? 0.6 : 0.1, r.air ? 0.07 : 0.0001);
    } else if (inRideScene()) { LOOP.water.set(0.5, 0.12); LOOP.wind.set(0, 0.0001); }
    else { LOOP.water.set(0.15, 0.05); LOOP.wind.set(0, 0.0001); }
  }
  let last = performance.now(), first = true;
  function renderFrame() {
    renderer.render(scene, camera);
    const now = performance.now(), dt = perf.last ? Math.min(0.5, (now - perf.last) / 1000) : 0;
    perf.last = now;
    if (document.hidden || qLevel >= QL.length - 1) return;
    perf.cool -= dt;
    if (perf.cool > 0) return;
    perf.sum += dt; perf.n++;
    if (perf.n >= 60) {
      if (perf.sum / perf.n > 1 / 42) { qLevel++; KG.store.set(QKEY, qLevel); applyQuality(); perf.cool = 1.5; }
      perf.n = 0; perf.sum = 0;
    }
  }
  function draw3D(rdt) {
    WU.uTime.value = gameT;
    waveMesh.position.x = curlX; lipMesh.position.x = curlX;
    syncSurfer(rdt);
    updateCamera(rdt);
    PU.uScale.value = H * QL[qLevel].r / (2 * Math.tan(camera.fov * Math.PI / 360));
  }
  function frame(now) {
    const rdt = Math.min(0.05, Math.max(0, (now - last) / 1000));
    last = now;
    if (!paused) {
      if (slowT > 0) slowT -= rdt;
      timeScale = slowT > 0 ? 1 - 0.68 * clamp(slowT / 0.2, 0, 1) : 1;
      sceneT += rdt;
      shake = Math.max(0, shake - rdt * 2);
      if (sceneName === 'count') updateCount();
      simulate(rdt * timeScale);
      if (musicSwap > 0) { musicSwap -= rdt; if (musicSwap <= 0 && !inRideScene()) playSong(SONG_TITLE); }
    }
    updateAudio(rdt);
    draw3D(rdt);
    renderFrame();
    drawUI(paused ? 0 : rdt);
    if (first) { first = false; const m = document.getElementById('msg'); if (m) m.remove(); }
    requestAnimationFrame(frame);
  }

  resize();
  setBeach(0);
  resetRider(20);
  resetObjects();
  playSong(SONG_TITLE);
  requestAnimationFrame(frame);

  /* ---------- 測試用掛鉤 ---------- */
  window.__surf = {
    state: () => ({ scene: sceneName, mode, paused, beach: beachIdx, char: charIdx, score: Math.floor(score), lives, mult: combo.mult, meter: Math.round(combo.meter),
      d: +(rider.x - curlX).toFixed(2), t: +faceT(rider.x - curlX, rider.z).toFixed(3), y: +rider.y.toFixed(2), v: +rider.v.toFixed(2), phi: +rider.phi.toFixed(2),
      air: rider.air, tube: rider.tube, rstate: rider.state, rideT: +rideT.toFixed(2), q: qLevel, music: M ? M.isPlaying() : null,
      cur: rider.cur ? rider.cur.kind : null, tricks: rider.tricks.map(trickName), callout: CO.main ? CO.main.text + '|' + CO.main.sub : null, small: CO.small ? CO.small.text : null,
      stats: Object.assign({}, ST), missionState, comp: comp ? { heat: comp.heat, heats: comp.heats.length, you: comp.you.total, rank: comp.rank } : null, parts: parts.length }),
    start: (m, b, opt) => { opt = opt || {}; if (m === 'comp') { newComp(b || 0); startRide('comp', b || 0); } else { if (m === 'mission') missionIdx = opt.mission || 0; startRide(m || 'free', m === 'mission' ? MISSIONS[missionIdx].beach : (b || 0)); } if (!opt.count) { sceneT = 2.39; } },
    ff: (secs, auto) => { const was = autopilot; if (auto != null) autopilot = auto; const n = Math.round(secs * 60); for (let i = 0; i < n; i++) { if (sceneName === 'count') { sceneT += 1 / 60; updateCount(); } simulate(1 / 60); } autopilot = was; },
    launch: up => { const d = rider.x - curlX; if (!rider.air) launch(up || 8, d); },
    trick: (k, dir) => requestTrick(k, dir || 1),
    wipe: () => wipeout('測試'),
    endRide: () => { rideT = 99; endPending = 0.01; },
    place: (d, t) => { const p = wp(d); rider.x = curlX + d; rider.z = p.zc + p.wf * (t == null ? 0.35 : t); rider.y = waveY(d, rider.z); rider.air = false; },
    auto: on => { autopilot = !!on; },
    quality: q => { qLevel = clamp(q | 0, 0, QL.length - 1); perf.cool = 1e9; applyQuality(); },
    scene: n => { sceneName = n; sceneT = 5; },
    setStat: (k, v) => { ST[k] = v; },
    judgeT: t => { sceneT = t; },
    comp: () => comp,
    btns: () => BTN.map(b => ({ id: b.id, x: Math.round(b.x + b.w / 2), y: Math.round(b.y + b.h / 2), w: Math.round(b.w), h: Math.round(b.h) })),
    touch: () => touchLayout().map(b => ({ id: b.id, x: Math.round(b.x), y: Math.round(b.y), r: Math.round(b.r) })),
    setChar: i => setChar(i),
    setBeach: i => setBeach(i),
    cam: a => { camOverride = a; },
    lip: d => lipTheta(d), wave: (d, z) => waveY(d, z), wp: d => Object.assign({}, wp(d))
  };
}
</script>
</body>
</html>
