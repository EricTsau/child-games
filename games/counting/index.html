<!doctype html>
<html lang="zh-Hant-TW">
<head>

<title>數數看</title>
<link rel="stylesheet" href="../../assets/common.css">
<style>
  /* ===== 共用遊戲介面（標題、選關、結算） ===== */
  html, body { height: 100%; overflow: hidden; touch-action: none; }
  .gk-canvas { position: fixed; inset: 0; width: 100vw; height: 100vh; height: 100dvh; display: block; touch-action: none; }
  .scr {
    position: fixed; inset: 0; z-index: 8500; display: none;
    align-items: center; justify-content: center; flex-direction: column;

  }
  .scr.show { display: flex; animation: kg-fade .3s ease; }
  .title-scr { background: radial-gradient(ellipse at 50% 45%, rgba(255,255,255,.25) 0%, rgba(255,255,255,0) 55%, var(--vig, rgba(40,20,60,.35)) 100%); }
  .title-wrap { display: flex; flex-direction: column; align-items: center; gap: 6px; text-align: center; }
  .title-art { width: min(300px, 70vw, 34vh); height: min(240px, 56vw, 27vh); }
  .logo {

    --o: var(--outline, #c2416c); --o2: var(--outline2, rgba(120, 30, 70, .55));
    text-shadow: 0 -4px 0 var(--o), 0 4px 0 var(--o), -4px 0 0 var(--o), 4px 0 0 var(--o),
      -3px -3px 0 var(--o), 3px -3px 0 var(--o), -3px 3px 0 var(--o), 3px 3px 0 var(--o),
      0 10px 0 var(--o), 4px 9px 0 var(--o), -4px 9px 0 var(--o), 0 16px 18px var(--o2);
  }
  .logo span { display: inline-block; animation: gk-bob 1.8s ease-in-out infinite; }
  .subtitle {
    margin-top: 10px; font-size: clamp(16px, 4.4vw, 20px); font-weight: 800; color: var(--ink, #4a3b52);
    background: rgba(255,255,255,.88); border-radius: 999px; padding: 6px 18px; box-shadow: var(--kg-shadow);
  }
  .big-btn {
    margin-top: 16px; font-family: var(--kg-font); font-size: clamp(28px, 8vw, 38px); font-weight: 900; color: #fff;
    min-width: 200px; padding: 14px 40px 16px; border: 5px solid #fff; border-radius: 999px; cursor: pointer;
    background: linear-gradient(180deg, var(--b1, #9be8aa) 0%, var(--b2, #3fb35f) 100%);
    box-shadow: 0 7px 0 var(--b3, #2a8746), 0 14px 26px rgba(0,0,0,.25), inset 0 6px 0 rgba(255,255,255,.35);
    text-shadow: 0 3px 0 rgba(0,0,0,.2); animation: gk-breathe 1.6s ease-in-out infinite;
    transition: transform .1s ease;
  }
  .big-btn:active { transform: translateY(5px) scale(.97); animation: none; }
  .scr-btn {
    font-family: var(--kg-font); font-size: 20px; font-weight: 900; color: #fff; cursor: pointer;
    min-height: 56px; padding: 10px 22px; border: 4px solid #fff; border-radius: 999px;
    background: linear-gradient(180deg, var(--b1, #9be8aa), var(--b2, #3fb35f));
    box-shadow: 0 5px 0 var(--b3, #2a8746), 0 10px 18px rgba(0,0,0,.2), inset 0 4px 0 rgba(255,255,255,.35);
    text-shadow: 0 2px 0 rgba(0,0,0,.18); transition: transform .1s ease;
  }
  .scr-btn.alt { --b1: #9ad8ff; --b2: #3a9ee8; --b3: #2672ad; }
  .scr-btn.warm { --b1: #ffd27a; --b2: #f39a1e; --b3: #c0700c; }
  .scr-btn.go { --b1: #9be8aa; --b2: #3fb35f; --b3: #2a8746; }
  .scr-btn:active { transform: translateY(4px) scale(.96); }
  @keyframes gk-bob { 0%, 100% { transform: translateY(0) rotate(-2deg); } 50% { transform: translateY(-8px) rotate(2deg); } }
  @keyframes gk-breathe { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.06); } }
  @keyframes gk-in { from { transform: scale(.3) translateY(30px); opacity: 0; } to { transform: none; opacity: 1; } }
  /* 置中的橫幅要保留 translate(-50%, -50%)，否則動畫結束後會往右偏 */
  @keyframes gk-in-c { from { transform: translate(-50%, -50%) scale(.3); opacity: 0; } to { transform: translate(-50%, -50%); opacity: 1; } }
  @keyframes gk-star { 0% { transform: scale(0) rotate(-120deg); opacity: 0; } 70% { transform: scale(1.3) rotate(10deg); opacity: 1; } 100% { transform: scale(1) rotate(0); } }

  /* 選關 */
  .lv-scr { background: var(--lvbg, linear-gradient(180deg, rgba(255,240,248,.95), rgba(255,250,235,.97))); justify-content: flex-start; overflow-y: auto; touch-action: pan-y; }
  .lv-head { display: flex; align-items: center; justify-content: center; gap: 12px; flex-wrap: wrap; margin: 0 0 14px; }
  .lv-head h2 { margin: 0; font-size: clamp(26px, 7vw, 36px); color: var(--ink, #4a3b52); }
  .star-count { display: inline-flex; align-items: center; gap: 4px; font-size: 22px; font-weight: 900; background: #fff; border-radius: 999px; padding: 4px 14px 4px 8px; box-shadow: var(--kg-shadow); }
  .star-count svg { width: 30px; height: 30px; }
  .lv-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(92px, 1fr)); gap: 16px 14px; width: min(640px, 100%); padding: 8px; }
  .lv-card {
    position: relative; aspect-ratio: 1 / 1.08; border: 4px solid #fff; border-radius: 26px; cursor: pointer; padding: 6px 4px;
    background: linear-gradient(180deg, var(--c1, #ffb3cc), var(--c2, #ff7aa2));
    box-shadow: 0 6px 0 var(--c3, #d4517c), 0 12px 20px rgba(0,0,0,.18), inset 0 5px 0 rgba(255,255,255,.35);

  .lv-card:active { transform: translateY(4px) scale(.96); }
  .lv-card .n { font-size: 38px; font-weight: 900; line-height: 1; text-shadow: 0 3px 0 rgba(0,0,0,.2); }
  .lv-card .lb { font-size: 13px; font-weight: 800; opacity: .95; white-space: nowrap; text-shadow: 0 1px 0 rgba(0,0,0,.2); }

  .lv-card .st svg { width: 22px; height: 22px; }

  .col-head { margin: 22px 0 10px; font-size: 22px; font-weight: 900; color: var(--ink, #4a3b52); }
  .col-row { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; width: min(640px, 100%); padding-bottom: 10px; }

  .col-item.locked canvas { filter: brightness(0) opacity(.22); }

  .col-item .lock svg { width: 22px; height: 22px; }
  .lv-back { margin-top: 18px; }

  /* 結算 */
  .res-scr { background: rgba(50, 30, 70, .45); backdrop-filter: blur(3px); }
  .res-card {
    position: relative; width: min(400px, 100%); text-align: center; padding: 46px 20px 22px;
    background: linear-gradient(180deg, #fff 0%, var(--card2, #fff1f6) 100%); border: 6px solid #fff; border-radius: 34px;
    box-shadow: 0 18px 44px rgba(40,20,60,.4), inset 0 -8px 0 rgba(0,0,0,.04); animation: gk-in .5s cubic-bezier(.2,1.5,.4,1) both;
  }
  .res-ribbon {
    position: absolute; left: 50%; top: -28px; transform: translateX(-50%); white-space: nowrap;
    font-size: 30px; font-weight: 900; color: #fff; padding: 8px 34px 10px; border-radius: 18px;
    background: linear-gradient(180deg, var(--r1, #ff9fbe), var(--r2, #e8648d)); border: 4px solid #fff;
    box-shadow: 0 6px 0 var(--r3, #b9406a), 0 10px 20px rgba(0,0,0,.2); text-shadow: 0 3px 0 rgba(0,0,0,.18);
  }
  .res-stars { display: flex; justify-content: center; align-items: flex-end; gap: 4px; margin: 6px 0 8px; position: relative; }
  .res-stars svg { width: 78px; height: 78px; animation: gk-star .6s cubic-bezier(.2,1.5,.4,1) both; }
  .res-stars svg:nth-child(2) { width: 96px; height: 96px; margin-bottom: 14px; }
  .res-msg { font-size: 19px; font-weight: 800; line-height: 1.5; margin: 4px 0 10px; color: var(--ink, #4a3b52); }
  .res-unlock { display: none; margin: 0 auto 12px; padding: 8px 12px; border-radius: 18px; background: linear-gradient(180deg, #fff7c9, #ffe68a); border: 3px dashed #f5b82e; font-size: 17px; font-weight: 900; color: #8a5a00; align-items: center; justify-content: center; gap: 8px; }
  .res-unlock.show { display: flex; animation: gk-in .5s .9s cubic-bezier(.2,1.5,.4,1) both; }
  .res-unlock canvas { width: 60px; height: 48px; flex: none; }
  .res-btns { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }

  /* 遊戲中的小按鈕 */
  .gk-round {
    pointer-events: auto; width: 48px; height: 48px; border-radius: 50%; border: 3px solid #fff; cursor: pointer; font-size: 22px; line-height: 1;
    display: grid; place-items: center; background: linear-gradient(180deg, #fff, #ffe9f1); box-shadow: var(--kg-shadow); color: var(--ink, #4a3b52); font-family: var(--kg-font); font-weight: 900;
  }
  .gk-round:active { transform: scale(.9); }
  .gk-round svg { width: 26px; height: 26px; }
  .gk-banner { position: fixed; left: 50%; top: 40%; transform: translate(-50%, -50%); z-index: 8200; display: none; text-align: center; pointer-events: none; width: max-content; max-width: 96vw; }
  .gk-banner.show { display: block; animation: gk-in-c .5s cubic-bezier(.2,1.5,.4,1) both; }
  .gk-banner .t1 { font-size: clamp(32px, 9.5vw, 56px); font-weight: 900; color: #fff; --o: var(--outline, #c2416c);
    text-shadow: 0 -3px 0 var(--o), 0 3px 0 var(--o), -3px 0 0 var(--o), 3px 0 0 var(--o), -2px -2px 0 var(--o), 2px -2px 0 var(--o), -2px 2px 0 var(--o), 2px 2px 0 var(--o), 0 8px 0 var(--o), 0 12px 16px rgba(0,0,0,.3); white-space: nowrap; }
  .gk-banner .t2 { display: inline-block; margin-top: 10px; font-size: clamp(16px, 4.4vw, 22px); font-weight: 900; color: var(--ink, #4a3b52); background: #fffdf3; border: 3px solid var(--b1, #ffd27a); border-radius: 999px; padding: 6px 18px; box-shadow: var(--kg-shadow); }
  body { background: #bfe8ff; --outline: #e0762a; --outline2: rgba(140, 70, 10, .45); --b1: #9be8aa; --b2: #3fb35f; --b3: #2a8746;
    --r1: #ffcf6b; --r2: #f39a1e; --r3: #c0700c; --card2: #fff6e6; --vig: rgba(40, 70, 30, .3);
    --lvbg: linear-gradient(180deg, rgba(225,245,255,.96), rgba(255,246,225,.97)); }
  .chud { position: fixed; top: 12px; left: 50%; transform: translateX(-50%); width: max-content; max-width: calc(100vw - 128px); z-index: 8000; display: none; gap: 8px; pointer-events: none; }
  .chud.show { display: flex; }
  .pill2 {
    display: flex; align-items: center; gap: 5px; height: 44px; padding: 0 12px; border-radius: 999px; font-weight: 900; font-size: 19px; color: #6b3e18; white-space: nowrap;
    background: linear-gradient(180deg, #fffdf2, #ffeec4); border: 3px solid #fff; box-shadow: 0 5px 0 #e3a84a, 0 8px 16px rgba(120,70,10,.2);
  }
  .pdot { width: 18px; height: 18px; border-radius: 50%; background: #f0dfbf; box-shadow: inset 0 2px 3px rgba(0,0,0,.15); }
  .pdot.on { background: radial-gradient(circle at 35% 30%, #fff 0 15%, #ffc21a 16%); box-shadow: 0 2px 0 #c48a12; }
  .pdot.miss { background: radial-gradient(circle at 35% 30%, #fff 0 15%, #8fd3ff 16%); box-shadow: 0 2px 0 #3a8ec8; }
  .pdot.cur { outline: 3px solid #ff8fb1; outline-offset: 1px; }
  #question {
    position: fixed; top: 70px; left: 104px; z-index: 7000; display: none; align-items: center; gap: 8px;
    background: linear-gradient(180deg, #fff 0%, #fff6e8 100%); border: 4px solid #fff; border-radius: 26px; padding: 4px 6px 4px 16px;
    box-shadow: var(--kg-shadow); font-size: clamp(21px, 6vw, 32px); font-weight: 900; white-space: nowrap; max-width: calc(100vw - 114px);
  }
  #question::before { content: ''; position: absolute; left: -14px; top: 22px; border: 10px solid transparent; border-right: 14px solid #fff; border-left: 0; }
  @media (min-width: 600px) { #question { top: 96px; } }
  @media (max-width: 379px) { #hudLv { display: none; } #question { left: 96px; max-width: calc(100vw - 102px); font-size: 18px; padding-left: 12px; } #speak { width: 42px; height: 42px; } }
  #question.show { display: flex; animation: gk-in .4s cubic-bezier(.2, 1.5, .4, 1); }
  #question .q { color: #5a3a20; }
  #question .q b { color: #e8486f; }
  #speak { flex: none; width: 50px; height: 50px; border-radius: 50%; border: 3px solid #fff; cursor: pointer; padding: 0; display: grid; place-items: center;
    background: linear-gradient(180deg, #fff3c4, #ffc93c); box-shadow: 0 3px 0 #d9a520; }
  #speak svg { width: 28px; height: 28px; }
  #speak:active { transform: translateY(2px); box-shadow: 0 1px 0 #d9a520; }
  #answers { position: fixed; left: 0; right: 0; bottom: 0; z-index: 7000; padding: 10px 10px calc(16px + env(safe-area-inset-bottom));
    display: flex; justify-content: center; gap: clamp(10px, 3.2vw, 24px); pointer-events: none; }
  .num {
    pointer-events: auto; width: clamp(66px, 19vw, 96px); height: clamp(66px, 19vw, 96px); border-radius: 50%; border: 5px solid #fff; cursor: pointer;
    font-family: var(--kg-font); font-size: clamp(32px, 9vw, 48px); font-weight: 900; color: #fff; text-shadow: 0 3px 0 rgba(0, 0, 0, .2);
    box-shadow: 0 6px 0 rgba(74, 59, 82, .25), 0 12px 22px rgba(74, 59, 82, .2), inset 0 -6px 0 rgba(0,0,0,.12);
    transition: transform .12s ease, opacity .3s ease, filter .3s ease; animation: gk-in .45s cubic-bezier(.2, 1.5, .4, 1) both; position: relative;
  }
  .num::after { content: ''; position: absolute; left: 18%; top: 12%; width: 34%; height: 22%; border-radius: 50%; background: rgba(255, 255, 255, .6); transform: rotate(-20deg); }
  .num:active { transform: scale(.9); }
  body.side #answers { left: auto; right: 10px; top: 64px; bottom: 0; flex-direction: column; justify-content: center; padding: 6px; gap: 8px; }
  body.side .num { width: 64px; height: 64px; font-size: 30px; }
  .num.wrong { opacity: .35; filter: grayscale(.7); pointer-events: none; }
  .num.right { animation: gk-breathe .5s ease infinite; filter: drop-shadow(0 0 14px #fff6a0); }
</style>

<body>
<canvas id="cv" class="gk-canvas"></canvas>
<div class="chud" id="hud"><div class="pill2" id="hudLv">第 1 關</div><div class="pill2" id="hudDots"></div></div>
<div id="question"><span class="q" id="qText"></span><button id="speak" aria-label="再聽一次"><svg viewBox="0 0 40 40"><path d="M6 15h7l9-7v24l-9-7H6z" fill="#fff" stroke="#b5700a" stroke-width="3" stroke-linejoin="round"/><path d="M27 14a8 8 0 0 1 0 12M31 10a14 14 0 0 1 0 20" stroke="#b5700a" stroke-width="3" fill="none" stroke-linecap="round"/></svg></button></div>
<div id="answers"></div>
<script src="../../assets/common.js"></script>
<script>
'use strict';
(() => {
  /* ===================== 共用遊戲套件（每個遊戲內嵌一份） ===================== */
  const TAU = Math.PI * 2;
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const lerp = (a, b, t) => a + (b - a) * t;
  const Ease = {
    linear: t => t,
    outQuad: t => 1 - (1 - t) * (1 - t),
    outCubic: t => 1 - Math.pow(1 - t, 3),
    inCubic: t => t * t * t,
    inQuad: t => t * t,
    inOutSine: t => -(Math.cos(Math.PI * t) - 1) / 2,
    outBack: t => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); },
    outElastic: t => t === 0 ? 0 : t === 1 ? 1 : Math.pow(2, -10 * t) * Math.sin((t * 10 - 0.75) * TAU / 3) + 1,
    outBounce: t => {
      const n1 = 7.5625, d1 = 2.75;
      if (t < 1 / d1) return n1 * t * t;
      if (t < 2 / d1) return n1 * (t -= 1.5 / d1) * t + 0.75;
      if (t < 2.5 / d1) return n1 * (t -= 2.25 / d1) * t + 0.9375;
      return n1 * (t -= 2.625 / d1) * t + 0.984375;
    }
  };

  /** 補間動畫：Tween.to(物件, {屬性: 目標}, 秒, 緩動, 延遲, 完成時) */
  const Tween = {
    list: [],
    to(obj, props, dur, ease, delay, done) {
      const tw = { obj, props, dur: Math.max(0.001, dur), ease: typeof ease === 'function' ? ease : (Ease[ease] || Ease.outCubic), t: -(delay || 0), from: null, done };
      this.list.push(tw);
      return tw;
    },
    update(dt) {
      const list = this.list.slice();
      for (let i = 0; i < list.length; i++) {
        const tw = list[i];
        if (tw.dead) continue;
        tw.t += dt;
        if (tw.t < 0) continue;
        if (!tw.from) { tw.from = {}; for (const k in tw.props) tw.from[k] = tw.obj[k]; }
        const k = Math.min(1, tw.t / tw.dur), e = tw.ease(k);
        for (const p in tw.props) tw.obj[p] = tw.from[p] + (tw.props[p] - tw.from[p]) * e;
        if (k >= 1) { tw.dead = true; if (tw.done) tw.done(); }
      }
      this.list = this.list.filter(t => !t.dead);
    },
    kill(obj, prop) { this.list.forEach(t => { if (t.obj === obj && (!prop || prop in t.props)) t.dead = true; }); },
    clear() { this.list.forEach(t => { t.dead = true; }); this.list = []; },
    busy(obj) { return this.list.some(t => !t.dead && (!obj || t.obj === obj)); }
  };

  /** 畫圖小工具 */
  const Draw = {
    rr(c, x, y, w, h, r) { c.beginPath(); c.roundRect(x, y, w, h, r); },
    starPath(c, x, y, r, inner, rot) {
      c.beginPath();
      for (let i = 0; i < 10; i++) {
        const rr = i % 2 ? r * (inner || 0.5) : r, a = (rot || 0) - Math.PI / 2 + i * Math.PI / 5;
        c.lineTo(x + Math.cos(a) * rr, y + Math.sin(a) * rr);
      }
      c.closePath();
    },
    heartPath(c, x, y, s) {
      c.beginPath();
      c.moveTo(x, y + s * 0.35);
      c.bezierCurveTo(x - s * 0.1, y + s * 0.25, x - s * 0.55, y + s * 0.02, x - s * 0.5, y - s * 0.22);
      c.bezierCurveTo(x - s * 0.45, y - s * 0.5, x - s * 0.08, y - s * 0.5, x, y - s * 0.25);
      c.bezierCurveTo(x + s * 0.08, y - s * 0.5, x + s * 0.45, y - s * 0.5, x + s * 0.5, y - s * 0.22);
      c.bezierCurveTo(x + s * 0.55, y + s * 0.02, x + s * 0.1, y + s * 0.25, x, y + s * 0.35);
      c.closePath();
    },
    /** 有光澤的星星 */
    star(c, x, y, r, on) {
      Draw.starPath(c, x, y + r * 0.08, r, 0.52);
      c.fillStyle = 'rgba(120,70,0,.25)'; c.fill();
      Draw.starPath(c, x, y, r, 0.52);
      const g = c.createLinearGradient(0, y - r, 0, y + r);
      if (on !== false) { g.addColorStop(0, '#fff3a0'); g.addColorStop(0.5, '#ffd23f'); g.addColorStop(1, '#f59e0b'); }
      else { g.addColorStop(0, '#eee'); g.addColorStop(1, '#bbb'); }
      c.fillStyle = g; c.fill();
      c.lineWidth = Math.max(1.5, r * 0.12); c.strokeStyle = on !== false ? '#d9822b' : '#999'; c.lineJoin = 'round'; c.stroke();
      c.fillStyle = 'rgba(255,255,255,.6)';
      c.beginPath(); c.ellipse(x - r * 0.2, y - r * 0.28, r * 0.18, r * 0.1, -0.6, 0, TAU); c.fill();
    },
    /** 可愛大眼睛。mode: open / happy / closed / sad / dizzy */
    eye(c, x, y, r, mode, lookX, lookY, ink) {
      ink = ink || '#3a2440';
      if (mode === 'happy') {
        c.strokeStyle = ink; c.lineWidth = r * 0.45; c.lineCap = 'round';
        c.beginPath(); c.arc(x, y + r * 0.35, r * 0.75, Math.PI * 1.15, Math.PI * 1.85); c.stroke();
        return;
      }
      if (mode === 'closed') {
        c.strokeStyle = ink; c.lineWidth = r * 0.4; c.lineCap = 'round';
        c.beginPath(); c.arc(x, y - r * 0.2, r * 0.7, Math.PI * 0.15, Math.PI * 0.85); c.stroke();
        return;
      }
      if (mode === 'dizzy') {
        c.strokeStyle = ink; c.lineWidth = r * 0.3; c.lineCap = 'round';
        c.beginPath();
        for (let a = 0; a < TAU * 1.6; a += 0.3) { const rr = r * 0.9 * a / (TAU * 1.6); c.lineTo(x + Math.cos(a) * rr, y + Math.sin(a) * rr); }
        c.stroke();
        return;
      }
      c.fillStyle = ink;
      c.beginPath(); c.ellipse(x, y, r * 0.86, r, 0, 0, TAU); c.fill();
      const lx = (lookX || 0) * r * 0.2, ly = (lookY || 0) * r * 0.2;
      c.fillStyle = '#fff';
      c.beginPath(); c.arc(x - r * 0.3 + lx, y - r * 0.38 + ly, r * 0.36, 0, TAU); c.fill();
      c.beginPath(); c.arc(x + r * 0.3 + lx, y + r * 0.35 + ly, r * 0.16, 0, TAU); c.fill();
      if (mode === 'sad') {
        c.strokeStyle = ink; c.lineWidth = r * 0.25; c.lineCap = 'round';
        c.beginPath(); c.moveTo(x - r * 0.8, y - r * 1.5); c.lineTo(x + r * 0.6, y - r * 1.2); c.stroke();
      }
    },
    blush(c, x, y, r, a) {
      c.fillStyle = 'rgba(255,105,140,' + (a == null ? 0.45 : a) + ')';
      c.beginPath(); c.ellipse(x, y, r, r * 0.62, 0, 0, TAU); c.fill();
    },
    shadow(c, x, y, rx, ry, a) {
      c.save(); c.translate(x, y); c.scale(1, ry / rx);
      const g = c.createRadialGradient(0, 0, 0, 0, 0, rx);
      g.addColorStop(0, 'rgba(30,20,50,' + (a == null ? 0.3 : a) + ')'); g.addColorStop(1, 'rgba(30,20,50,0)');
      c.fillStyle = g; c.beginPath(); c.arc(0, 0, rx, 0, TAU); c.fill(); c.restore();
    },
    /** 雲朵 */
    cloud(c, x, y, s, a) {
      c.save(); c.translate(x, y); c.scale(s, s);
      c.globalAlpha *= (a == null ? 1 : a);
      c.fillStyle = 'rgba(150,180,220,.35)';
      c.beginPath(); c.ellipse(4, 26, 64, 10, 0, 0, TAU); c.fill();
      const g = c.createLinearGradient(0, -34, 0, 30);
      g.addColorStop(0, '#ffffff'); g.addColorStop(1, '#e3efff');
      c.fillStyle = g;
      c.beginPath();
      [[-38, 10, 22], [-14, -4, 30], [16, -8, 28], [42, 8, 20], [2, 12, 26]].forEach(([a1, b, r]) => { c.moveTo(a1 + r, b); c.arc(a1, b, r, 0, TAU); });
      c.fill();
      c.fillStyle = 'rgba(255,255,255,.9)';
      c.beginPath(); c.ellipse(-16, -16, 14, 6, -0.3, 0, TAU); c.fill();
      c.restore();
    }
  };

  /** 粒子特效、浮動文字、畫面震動 */
  const FX = {
    parts: [], texts: [], rings: [], shakeT: 0, shakeMag: 0, hitStop: 0,
    burst(x, y, o) {
      o = o || {};
      const n = o.n || 14;
      for (let i = 0; i < n; i++) {
        const a = o.angle != null ? o.angle + KG.rand(-(o.spread || 0.6), o.spread || 0.6) : Math.random() * TAU;
        const v = KG.rand(o.speedMin || 80, o.speed || 260);
        this.parts.push({
          x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - (o.up == null ? 60 : o.up), g: o.gravity == null ? 420 : o.gravity,
          life: 1, decay: 1 / (o.life || 0.9) * KG.rand(0.8, 1.2), r: KG.rand(o.size || 6, (o.size || 6) * 1.7),
          rot: Math.random() * TAU, vr: KG.rand(-6, 6), shape: o.shape || 'star', c: KG.pick(o.colors || ['#ffd23f', '#ff8fb1', '#7fd1ff', '#9be27f', '#fff'])
        });
      }
    },
    ring(x, y, color, size) { this.rings.push({ x, y, r: 4, max: size || 60, life: 1, color: color || '#fff' }); },
    text(str, x, y, o) {
      o = o || {};
      if (o.tag) this.texts = this.texts.filter(t => t.tag !== o.tag);
      this.texts.push({ tag: o.tag, str, x, y, vy: o.vy == null ? -70 : o.vy, life: 1, dur: o.dur || 1.1, size: o.size || 30, color: o.color || '#fff', stroke: o.stroke || '#c2416c', scale: 0 });
    },
    shake(mag, t) { this.shakeMag = Math.max(this.shakeMag, mag); this.shakeT = Math.max(this.shakeT, t || 0.3); },
    update(dt) {
      this.parts.forEach(p => { p.vy += p.g * dt; p.x += p.vx * dt; p.y += p.vy * dt; p.vx *= 0.99; p.rot += p.vr * dt; p.life -= p.decay * dt; });
      this.parts = this.parts.filter(p => p.life > 0);
      this.rings.forEach(r => { r.life -= dt * 2.2; r.r = lerp(r.max, 4, Math.max(0, r.life)); });
      this.rings = this.rings.filter(r => r.life > 0);
      this.texts.forEach(t => { t.life -= dt / t.dur; t.y += t.vy * dt; t.vy *= 0.97; t.scale = Math.min(1, t.scale + dt * 5); });
      this.texts = this.texts.filter(t => t.life > 0);
      this.shakeT = Math.max(0, this.shakeT - dt);
      if (this.shakeT <= 0) this.shakeMag = 0;
    },
    offset() {
      if (this.shakeT <= 0) return [0, 0];
      const m = this.shakeMag * Math.min(1, this.shakeT * 4);
      return [KG.rand(-m, m), KG.rand(-m, m)];
    },
    draw(c, font) {
      this.rings.forEach(r => {
        c.globalAlpha = Math.max(0, r.life); c.strokeStyle = r.color; c.lineWidth = 5 * r.life + 1;
        c.beginPath(); c.arc(r.x, r.y, r.r, 0, TAU); c.stroke();
      });
      this.parts.forEach(p => {
        c.globalAlpha = Math.min(1, p.life * 1.6);
        c.fillStyle = p.c;
        c.save(); c.translate(p.x, p.y); c.rotate(p.rot);
        if (p.shape === 'star') { Draw.starPath(c, 0, 0, p.r, 0.45); c.fill(); }
        else if (p.shape === 'heart') { Draw.heartPath(c, 0, 0, p.r * 2); c.fill(); }
        else if (p.shape === 'confetti') { c.fillRect(-p.r * 0.6, -p.r * 0.3, p.r * 1.2, p.r * 0.6); }
        else { c.beginPath(); c.arc(0, 0, p.r * 0.7, 0, TAU); c.fill(); }
        c.restore();
      });
      c.globalAlpha = 1;
      this.texts.forEach(t => {
        const s = Ease.outBack(Math.min(1, t.scale));
        c.save(); c.translate(t.x, t.y); c.scale(s, s);
        c.globalAlpha = Math.min(1, t.life * 3);
        c.font = '900 ' + t.size + 'px ' + (font || 'sans-serif');
        c.textAlign = 'center'; c.textBaseline = 'middle'; c.lineJoin = 'round';
        c.lineWidth = t.size * 0.28; c.strokeStyle = t.stroke; c.strokeText(t.str, 0, 0);
        c.fillStyle = t.color; c.fillText(t.str, 0, 0);
        c.restore();
      });
      c.globalAlpha = 1;
    },
    clear() { this.parts = []; this.texts = []; this.rings = []; this.shakeT = 0; this.hitStop = 0; }
  };

  /** 背景音樂：用 KG.note 合成的循環小旋律（靜音時不發聲） */
  const Music = {
    timer: null, song: null, step: 0, next: 0,
    midi(m) { return 440 * Math.pow(2, (m - 69) / 12); },
    start(song) {
      this.stop();
      this.song = song; this.step = 0; this.next = performance.now() + 120;
      this.timer = setInterval(() => this.tick(), 50);
    },
    stop() { if (this.timer) clearInterval(this.timer); this.timer = null; this.song = null; },
    tick() {
      const s = this.song; if (!s) return;
      const now = performance.now();
      if (document.hidden || KG.isMuted() || !Music.unlocked) { this.next = now + 100; return; }
      const beat = 60000 / s.bpm / 2; // 八分音符
      if (this.next < now - 500) this.next = now;
      while (this.next < now + 160) {
        const delay = Math.max(0, (this.next - now) / 1000);
        const m = s.mel[this.step % s.mel.length];
        if (m) KG.note(this.midi(m), beat / 1000 * (s.legato || 0.9), s.wave || 'triangle', s.vol || 0.05, delay);
        if (s.bass) {
          const b = s.bass[this.step % s.bass.length];
          if (b) KG.note(this.midi(b), beat / 1000 * 1.6, 'sine', (s.vol || 0.05) * 1.2, delay);
        }
        this.step++;
        this.next += beat;
      }
    }
  };

  // 使用者第一次互動後才開始發聲（瀏覽器自動播放規則）
  ['pointerdown', 'keydown'].forEach(ev => window.addEventListener(ev, () => { Music.unlocked = true; }, { once: true, capture: true }));

  /** 小段音效 */
  const Jingle = {
    win() { [72, 76, 79, 84, 79, 84, 88].forEach((m, i) => KG.note(Music.midi(m), 0.2, 'triangle', 0.18, i * 0.11)); },
    star(i) { KG.note(Music.midi(76 + i * 4), 0.25, 'triangle', 0.22); KG.note(Music.midi(88 + i * 4), 0.3, 'sine', 0.12, 0.08); },
    unlock() { [79, 83, 86, 91].forEach((m, i) => KG.note(Music.midi(m), 0.18, 'sine', 0.18, i * 0.08)); },
    combo(n) { KG.note(Music.midi(72 + Math.min(n, 10) * 2), 0.15, 'triangle', 0.2); KG.note(Music.midi(79 + Math.min(n, 10) * 2), 0.2, 'triangle', 0.16, 0.07); },
    step(i) { KG.note(Music.midi(67 + (i % 8) * 2), 0.1, 'triangle', 0.16); }
  };

  /** 星星 SVG（DOM 介面用） */
  function starSVG(on) {
    if (!document.getElementById('gkStarG')) {
      const d = document.createElement('div');
      d.style.cssText = 'position:absolute;width:0;height:0;overflow:hidden';
      d.innerHTML = '<svg width="0" height="0" aria-hidden="true"><defs><linearGradient id="gkStarG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff3a0"/><stop offset=".5" stop-color="#ffd23f"/><stop offset="1" stop-color="#f59e0b"/></linearGradient></defs></svg>';
      document.body.appendChild(d);
    }
    const f = on ? 'url(#gkStarG)' : '#d9d2dc', s = on ? '#d9822b' : '#b9afbf';
    return '<svg viewBox="0 0 100 100">' +
      '<path d="M50 9 61 36 90 38 67 57 75 86 50 70 25 86 33 57 10 38 39 36Z" fill="rgba(0,0,0,.12)" transform="translate(0 5)"/>' +
      '<path d="M50 9 61 36 90 38 67 57 75 86 50 70 25 86 33 57 10 38 39 36Z" fill="' + f + '" stroke="' + s + '" stroke-width="6" stroke-linejoin="round"/>' +
      (on ? '<ellipse cx="40" cy="34" rx="8" ry="4.5" fill="#fff" opacity=".7" transform="rotate(-35 40 34)"/>' : '') + '</svg>';
  }
  const LOCK_SVG = '<svg viewBox="0 0 100 100"><rect x="20" y="44" width="60" height="46" rx="12" fill="#8d7c96" stroke="#5f4f68" stroke-width="5"/><path d="M33 46V34a17 17 0 0 1 34 0v12" fill="none" stroke="#5f4f68" stroke-width="9" stroke-linecap="round"/><circle cx="50" cy="66" r="7" fill="#5f4f68"/></svg>';

  /** 高解析度畫布 */
  function hiDPI(cv) {
    const ctx = cv.getContext('2d');
    const o = { ctx, W: 0, H: 0, DPR: 1 };
    o.fit = (w, h) => {
      o.DPR = Math.min(window.devicePixelRatio || 1, 2.5);
      o.W = w; o.H = h;
      cv.width = Math.round(w * o.DPR); cv.height = Math.round(h * o.DPR);
      ctx.setTransform(o.DPR, 0, 0, o.DPR, 0, 0);
    };
    return o;
  }

  /** 防止頁面捲動（選關畫面可以捲） */
  document.addEventListener('touchmove', e => { if (!e.target.closest || !e.target.closest('.lv-scr')) e.preventDefault(); }, { passive: false });
  document.addEventListener('gesturestart', e => e.preventDefault());
  document.addEventListener('dblclick', e => e.preventDefault());

  /**
   * 標題、選關、結算畫面。
   * UI.init({ slug, title, subtitle, levels:[{label, colors}], items:[{name, need}], drawMascot(c,w,h,t), drawItem(c,i,w,h), onPlay(i), onItem(i), onMenu(), music })
   */
  const UI = {
    o: null, save: null, artT: 0, artRaf: 0, current: 0, bannerTimer: 0,
    init(o) {
      this.o = o;
      this.save = KG.store.get(o.slug + ':save', null) || { stars: [], item: 0 };
      if (!Array.isArray(this.save.stars)) this.save.stars = [];
      const mk = (cls, html) => { const d = document.createElement('div'); d.className = cls; d.innerHTML = html; document.body.appendChild(d); return d; };
      this.title = mk('scr title-scr',
        '<div class="title-wrap"><canvas class="title-art"></canvas><h1 class="logo">' + [...o.title].map((ch, i) => '<span style="animation-delay:' + (i * 0.12) + 's">' + ch + '</span>').join('') + '</h1>' +
        '<div class="subtitle">' + o.subtitle + '</div><button class="big-btn">開始</button></div>');
      this.lv = mk('scr lv-scr', '<div class="lv-head"><h2>選擇關卡</h2><div class="star-count"></div></div><div class="lv-grid"></div>' +
        (o.items && o.items.length ? '<div class="col-head">' + (o.itemsTitle || '收藏') + '</div><div class="col-row"></div>' : '') +
        '<button class="scr-btn alt lv-back">回標題</button>');
      this.res = mk('scr res-scr', '<div class="res-card"><div class="res-ribbon"></div><div class="res-stars"></div><div class="res-msg"></div><div class="res-unlock"></div><div class="res-btns"></div></div>');
      this.ban = mk('gk-banner', '<div class="t1"></div><div class="t2"></div>');
      this.title.querySelector('.big-btn').addEventListener('click', () => {
        KG.sound('pop');
        if (!this.save.started) { this.save.started = 1; this.persist(); this.play(0); }
        else this.showLevels();
      });
      this.lv.querySelector('.lv-back').addEventListener('click', () => { KG.sound('click'); this.showTitle(); });
      this.artCv = hiDPI(this.title.querySelector('.title-art'));
    },
    persist() { KG.store.set(this.o.slug + ':save', this.save); },
    total() { return this.save.stars.reduce((a, b) => a + (b || 0), 0); },
    stars(i) { return this.save.stars[i] || 0; },
    unlocked(i) { return i === 0 || this.stars(i - 1) > 0; },
    itemUnlocked(i) { return this.total() >= this.o.items[i].need; },
    item() { const i = this.save.item || 0; return this.o.items && this.o.items[i] && this.itemUnlocked(i) ? i : 0; },
    hideAll() { [this.title, this.lv, this.res].forEach(s => s.classList.remove('show')); cancelAnimationFrame(this.artRaf); this.artRaf = 0; },
    banner(t1, t2, dur) {
      const b = this.ban;
      b.querySelector('.t1').textContent = t1;
      const s2 = b.querySelector('.t2'); s2.textContent = t2 || ''; s2.style.display = t2 ? '' : 'none';
      b.classList.remove('show'); void b.offsetWidth; b.classList.add('show');
      clearTimeout(this.bannerTimer);
      this.bannerTimer = setTimeout(() => b.classList.remove('show'), (dur || 2) * 1000);
    },
    hideBanner() { clearTimeout(this.bannerTimer); this.ban.classList.remove('show'); },
    showTitle() {
      this.hideAll(); this.hideBanner();
      this.title.classList.add('show');
      if (this.o.music) Music.start(this.o.music);
      const r = this.title.querySelector('.title-art').getBoundingClientRect();
      this.artCv.fit(r.width || 260, r.height || 200);
      let last = performance.now();
      const loop = now => {
        this.artT += Math.max(0, Math.min(0.05, (now - last) / 1000)); last = now;
        const a = this.artCv;
        a.ctx.setTransform(a.DPR, 0, 0, a.DPR, 0, 0);
        a.ctx.clearRect(0, 0, a.W, a.H);
        this.o.drawMascot(a.ctx, a.W, a.H, this.artT);
        this.artRaf = requestAnimationFrame(loop);
      };
      this.artRaf = requestAnimationFrame(loop);
      if (this.o.onMenu) this.o.onMenu();
    },
    showLevels() {
      this.hideAll(); this.hideBanner();
      if (this.o.music && !Music.song) Music.start(this.o.music);
      const total = this.total(), max = this.o.levels.length * 3;
      this.lv.querySelector('.star-count').innerHTML = starSVG(true) + total + ' / ' + max;
      const grid = this.lv.querySelector('.lv-grid');
      grid.innerHTML = '';
      let nextShown = false;
      this.o.levels.forEach((L, i) => {
        const b = document.createElement('button');
        const open = this.unlocked(i), st = this.stars(i);
        b.className = 'lv-card' + (open ? '' : ' locked');
        if (open && !st && !nextShown) { b.classList.add('next'); nextShown = true; }
        b.style.animationDelay = (i * 0.04) + 's';
        if (L.colors) { b.style.setProperty('--c1', L.colors[0]); b.style.setProperty('--c2', L.colors[1]); b.style.setProperty('--c3', L.colors[2]); }
        b.innerHTML = open
          ? '<div class="n">' + (i + 1) + '</div><div class="lb">' + (L.label || '') + '</div><div class="st">' + [0, 1, 2].map(k => starSVG(k < st)).join('') + '</div>'
          : '<div class="n" style="width:44px;height:44px">' + LOCK_SVG + '</div><div class="lb">' + (L.label || '') + '</div>';
        b.addEventListener('click', () => {
          if (!open) { KG.sound('wrong'); b.classList.remove('kg-shake'); void b.offsetWidth; b.classList.add('kg-shake'); KG.toast('先過前一關喔！'); return; }
          KG.sound('pop'); this.play(i);
        });
        grid.appendChild(b);
      });
      const row = this.lv.querySelector('.col-row');
      if (row) {
        row.innerHTML = '';
        this.o.items.forEach((it, i) => {
          const d = document.createElement('button');
          const ok = this.itemUnlocked(i);
          d.className = 'col-item' + (ok ? '' : ' locked') + (this.item() === i ? ' sel' : '');
          d.innerHTML = '<canvas></canvas><div class="nm">' + (ok ? it.name : '？？？') + '</div>' + (ok ? '' : '<div class="lock">' + starSVG(true) + it.need + '</div>');
          row.appendChild(d);
          const h = hiDPI(d.querySelector('canvas'));
          h.fit(80, 64);
          this.o.drawItem(h.ctx, i, 80, 64);
          d.addEventListener('click', () => {
            if (!ok) { KG.sound('wrong'); KG.toast('還需要 ' + (it.need - total) + ' 顆星星'); return; }
            KG.sound('sparkle');
            this.save.item = i; this.persist();
            row.querySelectorAll('.col-item').forEach(x => x.classList.remove('sel'));
            d.classList.add('sel');
            if (this.o.onItem) this.o.onItem(i);
          });
        });
      }
      this.lv.classList.add('show');
      this.lv.scrollTop = 0;
      if (this.o.onMenu) this.o.onMenu();
    },
    play(i) {
      this.hideAll(); this.hideBanner();
      this.current = i;
      if (this.o.music) Music.start(this.o.music);
      this.o.onPlay(i);
    },
    /** 結算：o = { stars 1–3, title, msg } */
    result(o) {
      Music.stop();
      this.hideBanner();
      const i = this.current;
      const itemsBefore = (this.o.items || []).map((_, k) => this.itemUnlocked(k));
      if ((o.stars || 0) > this.stars(i)) { this.save.stars[i] = o.stars; this.persist(); }
      const newItem = (this.o.items || []).findIndex((_, k) => !itemsBefore[k] && this.itemUnlocked(k));
      this.hideAll();
      const r = this.res;
      r.querySelector('.res-ribbon').textContent = o.title || (o.stars >= 3 ? '太完美了！' : o.stars === 2 ? '好棒喔！' : '過關了！');
      r.querySelector('.res-stars').innerHTML = [0, 1, 2].map(k => starSVG(k < o.stars)).join('');
      [...r.querySelectorAll('.res-stars svg')].forEach((s, k) => { s.style.animationDelay = (0.35 + k * 0.28) + 's'; });
      for (let k = 0; k < o.stars; k++) setTimeout(() => Jingle.star(k), 380 + k * 280);
      r.querySelector('.res-msg').innerHTML = o.msg || '';
      const un = r.querySelector('.res-unlock');
      un.className = 'res-unlock';
      un.innerHTML = '';
      if (newItem >= 0) {
        un.innerHTML = '<canvas></canvas><span>解鎖了新' + (this.o.itemWord || '造型') + '：' + this.o.items[newItem].name + '！</span>';
        un.classList.add('show');
        const h = hiDPI(un.querySelector('canvas')); h.fit(60, 48);
        this.o.drawItem(h.ctx, newItem, 60, 48);
        setTimeout(() => Jingle.unlock(), 1000);
      }
      const btns = r.querySelector('.res-btns');
      btns.innerHTML = '';
      const add = (txt, cls, fn) => { const b = document.createElement('button'); b.className = 'scr-btn ' + cls; b.textContent = txt; b.addEventListener('click', () => { KG.sound('click'); fn(); }); btns.appendChild(b); };
      if (i + 1 < this.o.levels.length) add('下一關 ▶', 'go', () => this.play(i + 1));
      add('再玩一次', 'warm', () => this.play(i));
      add('選關卡', 'alt', () => this.showLevels());
      r.classList.add('show');
      Jingle.win();
      setTimeout(() => KG.confetti(innerWidth / 2, innerHeight * 0.3, 90), 300);
    }
  };
  /* ===================== 套件結束 ===================== */

  const cv = document.getElementById('cv');
  const view = hiDPI(cv);
  const ctx = view.ctx;
  const hud = document.getElementById('hud');
  const hudLv = document.getElementById('hudLv');
  const hudDots = document.getElementById('hudDots');

    c.fillStyle = g; c.beginPath(); c.ellipse(p.cx, p.cy, p.rx, p.ry, 0, 0, TAU); c.fill();
    c.fillStyle = 'rgba(255,255,255,.35)'; c.beginPath(); c.ellipse(p.cx - p.rx * 0.35, p.cy - p.ry * 0.55, p.rx * 0.3, p.ry * 0.1, -0.1, 0, TAU); c.fill();
    for (let i = 0; i < 5; i++) {
      const side = i % 2 ? 1 : -1, x = p.cx + side * (p.rx * (0.84 + i * 0.03)), y = p.cy - p.ry * 0.1 + i * 6;
      c.strokeStyle = '#4c9a3c'; c.lineWidth = 3; c.lineCap = 'round';
      c.beginPath(); c.moveTo(x, y + 20); c.quadraticCurveTo(x + side * 4, y - 10, x + side * 2, y - 34 - i * 4); c.stroke();
      c.fillStyle = '#8a5a35'; Draw.rr(c, x + side * 2 - 4, y - 40 - i * 4, 8, 18, 4); c.fill();
    }
  }
  function drawBackground() {
    bg.width = cv.width; bg.height = cv.height;
    const c = bg.getContext('2d');
    c.setTransform(view.DPR, 0, 0, view.DPR, 0, 0);
    let g = c.createLinearGradient(0, 0, 0, L.horizon);
    g.addColorStop(0, scene.sky[0]); g.addColorStop(1, scene.sky[1]);
    c.fillStyle = g; c.fillRect(0, 0, W, L.horizon + 40);
    if (scene.night) for (let i = 0; i < 60; i++) { c.fillStyle = 'rgba(255,255,255,' + KG.rand(0.3, 0.9) + ')'; c.beginPath(); c.arc(Math.random() * W, Math.random() * L.horizon, KG.rand(0.7, 2), 0, TAU); c.fill(); }
    if (scene.rainbow) ['#ff8fb1', '#ffb36b', '#ffe066', '#9be8aa', '#7fd1ff', '#c4a2ff'].forEach((col, i) => { c.strokeStyle = col; c.globalAlpha = 0.45; c.lineWidth = 12; c.beginPath(); c.arc(W / 2, L.horizon + 30, Math.min(W * 0.48, 420) - i * 12, Math.PI, 0); c.stroke(); c.globalAlpha = 1; });
    c.fillStyle = scene.hill[0];
    c.beginPath(); c.moveTo(0, L.horizon + 10); for (let x = 0; x <= W; x += 20) c.lineTo(x, L.horizon - 26 - Math.sin(x / 140) * 18 - Math.sin(x / 57) * 6); c.lineTo(W, L.horizon + 10); c.fill();
    c.fillStyle = scene.hill[1];
    c.beginPath(); c.moveTo(0, L.horizon + 10); for (let x = 0; x <= W; x += 20) c.lineTo(x, L.horizon - 8 - Math.sin(x / 90 + 2) * 12); c.lineTo(W, L.horizon + 10); c.fill();
    const ts = Math.min(1.2, H / 700);
    drawTree(c, W * 0.06, L.horizon + 6, ts); drawTree(c, W * 0.94, L.horizon + 6, 1.15 * ts); drawTree(c, W * 0.8, L.horizon + 6, 0.7 * ts);
    g = c.createLinearGradient(0, L.horizon, 0, H);
    g.addColorStop(0, scene.ground[0]); g.addColorStop(1, scene.ground[1]);
    c.fillStyle = g; c.fillRect(0, L.horizon, W, H - L.horizon);
    c.fillStyle = 'rgba(255,255,255,.12)'; c.beginPath(); c.ellipse(W * 0.3, L.horizon + 40, W * 0.35, 26, 0, 0, TAU); c.fill();
    if (kind && KINDS[kind].zone === 'pond') drawPond(c, L.pond);
    deco.pebbles.forEach(p => {
      c.fillStyle = '#c9c2b5'; c.beginPath(); c.ellipse(p.x, p.y, p.r * 1.3, p.r, 0, 0, TAU); c.fill();
      c.fillStyle = 'rgba(255,255,255,.5)'; c.beginPath(); c.ellipse(p.x - p.r * 0.3, p.y - p.r * 0.3, p.r * 0.5, p.r * 0.3, 0, 0, TAU); c.fill();
    });
    c.strokeStyle = scene.snow ? '#c8d8e8' : 'rgba(40,110,40,.6)'; c.lineWidth = 2; c.lineCap = 'round';
    deco.tufts.forEach(t => {
      if (kind && KINDS[kind].zone === 'pond') { const p = L.pond, dx = (t.x - p.cx) / (p.rx + 14), dy = (t.y - p.cy) / (p.ry + 14); if (dx * dx + dy * dy < 1) return; }
      c.beginPath(); c.moveTo(t.x - t.s * 0.5, t.y); c.lineTo(t.x - t.s * 0.7, t.y - t.s); c.moveTo(t.x, t.y); c.lineTo(t.x, t.y - t.s * 1.3); c.moveTo(t.x + t.s * 0.5, t.y); c.lineTo(t.x + t.s * 0.8, t.y - t.s); c.stroke();
    });
  }
  function resize() {
    W = innerWidth; H = innerHeight;
    view.fit(W, H);
    computeLayout(); makeDeco(); drawBackground();
    if (kind && objs.length) placeObjects(true);
  }

  /* ---------- 物件擺放 ---------- */
  function zoneOf(z) {
    if (z === 'pond') return { type: 'ellipse', ...L.pond, area: Math.PI * L.pond.rx * L.pond.ry };
    if (z === 'sky') return { type: 'rect', x0: 12, x1: L.right - 12, y0: L.top, y1: L.top + L.ph * 0.66, area: (L.right - 24) * L.ph * 0.66 };
    return { type: 'rect', x0: 12, x1: L.right - 12, y0: L.horizon + 4, y1: L.bottom, area: (L.right - 24) * (L.bottom - L.horizon - 4) };
  }
  function sampleIn(z, s) {
    if (z.type === 'ellipse') {
      const ax = Math.max(4, z.rx - s * 0.55), ay = Math.max(4, z.ry - s * 0.4);
      for (;;) { const u = KG.rand(-1, 1), v = KG.rand(-1, 1); if (u * u + v * v <= 1) return { x: z.cx + u * ax, y: z.cy + v * ay }; }
    }
    return { x: KG.rand(z.x0 + s * 0.55, z.x1 - s * 0.55), y: KG.rand(z.y0 + s * 0.6, z.y1 - s * 0.55) };
  }
  function placeObjects(keep) {
    const total = objs.length;
    const z = zoneOf(KINDS[kind].zone);
    let s = clamp(Math.sqrt(z.area / (total * 2.8)), 34, 118);
    let pts = null;
    for (let tries = 0; tries < 60 && !pts; tries++) {
      const cand = [];
      let ok = true;
      for (let i = 0; i < total && ok; i++) {
        ok = false;
        for (let k = 0; k < 250; k++) { const p = sampleIn(z, s); if (cand.every(q => Math.hypot(q.x - p.x, q.y - p.y) >= s * 1.1)) { cand.push(p); ok = true; break; } }
      }
      if (ok) pts = cand; else s *= 0.93;
    }
    objs.forEach((o, i) => { o.x = pts[i].x; o.y = pts[i].y; o.s = s; if (!keep) o.born = time + 0.15 + i * 0.07; });
    // 目標依左到右排好（數的順序）
    const targets = objs.filter(o => o.target).sort((a, b) => a.x - b.x);
    targets.forEach((o, i) => { o.order = i; });
  }

  /* ---------- 畫物件 ---------- */
  function drawObj(o) {
    const K = KINDS[o.kind], s = o.s, t = time + o.ph;
    let dx = 0, dy = 0, rot = 0, sy = 1;
    if (K.zone === 'pond') { dx = Math.sin(t * 0.7) * s * (level.mix ? 0.1 : 0.06); dy = Math.sin(t * 2.2) * s * 0.03; rot = Math.sin(t * 2.2) * 0.07; }
    else if (K.zone === 'sky') { dy = Math.sin(t * 1.2) * s * 0.07; rot = Math.sin(t * 0.9) * 0.08; }
    else { const hop = Math.max(0, Math.sin(t * 2)); dy = -Math.pow(hop, 4) * s * 0.12; sy = 1 - Math.pow(hop, 10) * 0.06; rot = Math.sin(t * 1.3) * 0.05; }
    const age = clamp((time - o.born) / 0.5, 0, 1);
    if (age <= 0) return;
    const pop = Ease.outBack(age);
    const bump = 1 + o.bump * 0.35;
    const x = o.x + dx, y = o.y + dy - o.jump * s * 0.4;
    if (K.zone === 'ground') Draw.shadow(ctx, o.x, o.y + s * 0.42, s * 0.36, s * 0.1, 0.3);
    else if (K.zone === 'pond') {
      const r = (time * 0.6 + o.ph) % 1;
      ctx.strokeStyle = 'rgba(255,255,255,' + (0.5 * (1 - r)) + ')'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.ellipse(x, o.y + s * 0.26, s * (0.4 + r * 0.25), s * (0.1 + r * 0.06), 0, 0, TAU); ctx.stroke();
    }
    if (o.lit > 0) {
      const gl = ctx.createRadialGradient(x, y, 0, x, y, s * 0.85);
      gl.addColorStop(0, 'rgba(255,250,170,' + 0.9 * o.lit + ')'); gl.addColorStop(1, 'rgba(255,240,120,0)');
      ctx.fillStyle = gl; ctx.beginPath(); ctx.arc(x, y, s * 0.85, 0, TAU); ctx.fill();
    }
    ctx.save();
    ctx.translate(x, y + s * 0.4); ctx.rotate(rot); ctx.scale(pop * bump, pop * bump * sy); ctx.translate(0, -s * 0.4);
    K.draw(ctx, s, t, o);
    ctx.restore();
    const num = o.lit > 0 ? o.order + 1 : o.mark;
    if (num) {
      const r = Math.max(15, s * 0.21), by = y - s * 0.55 - 8;
      ctx.save(); ctx.translate(x, by);
      const sc = 1 + o.bump * 0.4; ctx.scale(sc, sc);
      ctx.fillStyle = 'rgba(74,59,82,.25)'; ctx.beginPath(); ctx.arc(0, 3, r, 0, TAU); ctx.fill();
      ctx.fillStyle = o.lit > 0 ? '#ff7aa2' : '#56b4f0'; ctx.strokeStyle = '#fff'; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.arc(0, 0, r, 0, TAU); ctx.fill(); ctx.stroke();
      ctx.fillStyle = '#fff'; ctx.font = '900 ' + Math.round(r * 1.15) + 'px ' + FONT; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(String(num), 0, 1);
      ctx.restore();
    }
  }

  /* ---------- 兔兔老師 ---------- */
  function drawBunny(c, x, y, s, t, mood) {
    const hop = mood === 'happy' ? Math.abs(Math.sin(t * 9)) * 10 * s : 0;
    const shake = mood === 'sad' ? Math.sin(t * 14) * 0.12 : 0;
    c.save(); c.translate(x, y - hop); c.rotate(shake);
    c.lineJoin = 'round';
    // 耳朵
    [-1, 1].forEach(d => {
      c.save(); c.translate(d * 12 * s, -26 * s); c.rotate(d * (0.18 + Math.sin(t * 2 + d) * 0.06) + (mood === 'sad' ? d * 0.5 : 0));
      c.fillStyle = '#fff'; c.strokeStyle = '#c9b6c9'; c.lineWidth = 2.4 * s;
      c.beginPath(); c.ellipse(0, -20 * s, 9 * s, 24 * s, 0, 0, TAU); c.fill(); c.stroke();
      c.fillStyle = '#ffc2d6'; c.beginPath(); c.ellipse(0, -19 * s, 4.5 * s, 17 * s, 0, 0, TAU); c.fill();
      c.restore();
    });
    // 頭
    const g = c.createRadialGradient(-8 * s, -10 * s, 2, 0, 0, 34 * s);
    g.addColorStop(0, '#ffffff'); g.addColorStop(1, '#efe6f2');
    c.fillStyle = g; c.strokeStyle = '#c9b6c9'; c.lineWidth = 2.6 * s;
    c.beginPath(); c.ellipse(0, 0, 32 * s, 28 * s, 0, 0, TAU); c.fill(); c.stroke();
    // 蝴蝶結
    c.fillStyle = '#ff7aa2'; c.strokeStyle = '#c2416c'; c.lineWidth = 2 * s;
    [-1, 1].forEach(d => { c.beginPath(); c.moveTo(16 * s, -22 * s); c.lineTo(16 * s + d * 12 * s, -30 * s); c.lineTo(16 * s + d * 12 * s, -14 * s); c.closePath(); c.fill(); c.stroke(); });
    c.beginPath(); c.arc(16 * s, -22 * s, 4 * s, 0, TAU); c.fill(); c.stroke();
    const blink = (t % 3.4) > 3.25;
    const em = mood === 'happy' ? 'happy' : mood === 'sad' ? 'sad' : blink ? 'closed' : 'open';
    Draw.eye(c, -11 * s, -2 * s, 5.5 * s, em, 0.3, 0.2); Draw.eye(c, 11 * s, -2 * s, 5.5 * s, em, 0.3, 0.2);
    Draw.blush(c, -20 * s, 9 * s, 5.5 * s, 0.5); Draw.blush(c, 20 * s, 9 * s, 5.5 * s, 0.5);
    c.fillStyle = '#ff8fb1'; c.beginPath(); c.ellipse(0, 6 * s, 3.5 * s, 2.6 * s, 0, 0, TAU); c.fill();
    c.strokeStyle = '#7a4a5a'; c.lineWidth = 1.8 * s; c.lineCap = 'round';
    if (mood === 'happy') { c.fillStyle = '#e8486f'; c.beginPath(); c.arc(0, 11 * s, 5.5 * s, 0, Math.PI); c.fill(); }
    else if (mood === 'sad') { c.beginPath(); c.arc(0, 16 * s, 4 * s, Math.PI * 1.2, Math.PI * 1.8); c.stroke(); }
    else { c.beginPath(); c.arc(-3 * s, 9 * s, 3 * s, 0.2, Math.PI - 0.2); c.arc(3 * s, 9 * s, 3 * s, 0.2, Math.PI - 0.2); c.stroke(); }
    c.restore();
  }

  function drawMascot(c, w, h, t) {
    const s = Math.min(w / 220, h / 190);
    // 周圍的小東西
    const items = ['duck', 'apple', 'star', 'chick', 'balloon'];
    items.forEach((k, i) => {
      const a = -Math.PI * 0.9 + i * Math.PI * 0.45;
      const x = w / 2 + Math.cos(a) * w * 0.38, y = h * 0.55 + Math.sin(a) * h * 0.18 - Math.abs(Math.sin(t * 3 + i)) * 8 * s;
      c.save(); c.translate(x, y); KINDS[k].draw(c, 46 * s, t + i, { flip: 1, happy: (t % 3) < 1, col: COLS[i % COLS.length] }); c.restore();
      if ((t % 3) < 1) { c.fillStyle = '#ff7aa2'; c.beginPath(); c.arc(x, y - 34 * s, 11 * s, 0, TAU); c.fill(); c.fillStyle = '#fff'; c.font = '900 ' + Math.round(14 * s) + 'px ' + FONT; c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillText(String(i + 1), x, y - 33 * s); }
    });
    drawBunny(c, w / 2, h * 0.68, s * 1.25, t, (t % 3) < 1 ? 'happy' : 'idle');
  }
  function drawItem(c, i, w, h) {
    const S = SCENES[i];
    let g = c.createLinearGradient(0, 0, 0, h * 0.6);
    g.addColorStop(0, S.sky[0]); g.addColorStop(1, S.sky[1]);
    c.fillStyle = g; Draw.rr(c, 0, 0, w, h, 12); c.fill();
    c.save(); Draw.rr(c, 0, 0, w, h, 12); c.clip();
    if (S.rainbow) ['#ff8fb1', '#ffe066', '#7fd1ff'].forEach((col, k) => { c.strokeStyle = col; c.lineWidth = 4; c.beginPath(); c.arc(w / 2, h * 0.7, w * 0.4 - k * 4, Math.PI, 0); c.stroke(); });
    c.fillStyle = S.sun; c.beginPath(); c.arc(w * 0.78, h * 0.25, 7, 0, TAU); c.fill();
    c.fillStyle = S.hill[0]; c.beginPath(); c.ellipse(w * 0.3, h * 0.65, w * 0.5, h * 0.2, 0, 0, TAU); c.fill();
    g = c.createLinearGradient(0, h * 0.6, 0, h); g.addColorStop(0, S.ground[0]); g.addColorStop(1, S.ground[1]);
    c.fillStyle = g; c.fillRect(0, h * 0.62, w, h);
    if (S.snow) { c.fillStyle = '#fff'; for (let k = 0; k < 10; k++) { c.beginPath(); c.arc((k * 23) % w, (k * 17) % (h * 0.6), 1.6, 0, TAU); c.fill(); } }
    if (S.night) { c.fillStyle = '#fff'; for (let k = 0; k < 10; k++) { c.beginPath(); c.arc((k * 29) % w, (k * 13) % (h * 0.5), 1, 0, TAU); c.fill(); } }
    c.restore();
  }

  /* ---------- 主迴圈 ---------- */
  function spark(x, y, n) { FX.burst(x, y, { n, colors: ['#fff59a', '#ffd65c', '#ffffff', '#ffb3cf'], size: 4, speed: 200 }); }

  let last = performance.now();
  function frame(now) {
    const dt = Math.max(0, Math.min(0.05, (now - last) / 1000));
    last = now; time += dt;
    Tween.update(dt); FX.update(dt);
    bunny.moodT -= dt; if (bunny.moodT <= 0) bunny.mood = 'idle';
    const [sx, sy] = FX.offset();
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.drawImage(bg, 0, 0);
    ctx.setTransform(view.DPR, 0, 0, view.DPR, sx * view.DPR, sy * view.DPR);
    // 太陽
    const sunX = W - (W > 700 ? 130 : 48), sunY = W > 700 ? 125 : L.top + 34;
    if (!scene.night) {
      ctx.save(); ctx.translate(sunX, sunY); ctx.rotate(time * 0.2); ctx.fillStyle = scene.sun + '88';
      for (let i = 0; i < 10; i++) { ctx.rotate(Math.PI / 5); ctx.beginPath(); ctx.moveTo(-6, 30); ctx.lineTo(6, 30); ctx.lineTo(0, 44 + Math.sin(time * 3 + i) * 3); ctx.fill(); }
      ctx.restore();
    }
    const sg = ctx.createRadialGradient(sunX - 8, sunY - 8, 4, sunX, sunY, 28);
    sg.addColorStop(0, '#fffbe0'); sg.addColorStop(1, scene.sun);
    ctx.fillStyle = sg; ctx.beginPath(); ctx.arc(sunX, sunY, 26, 0, TAU); ctx.fill();
    if (scene.night) { ctx.fillStyle = scene.sky[0]; ctx.beginPath(); ctx.arc(sunX + 10, sunY - 8, 22, 0, TAU); ctx.fill(); }
    else {
      const bl = (time % 4) > 3.85 ? 'closed' : 'happy';
      Draw.eye(ctx, sunX - 8, sunY - 2, 3.5, bl === 'closed' ? 'closed' : 'open'); Draw.eye(ctx, sunX + 8, sunY - 2, 3.5, bl === 'closed' ? 'closed' : 'open');
      Draw.blush(ctx, sunX - 14, sunY + 6, 4); Draw.blush(ctx, sunX + 14, sunY + 6, 4);
      ctx.strokeStyle = '#8a5520'; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(sunX, sunY + 4, 5, 0.3, Math.PI - 0.3); ctx.stroke();
    }
    clouds.forEach(cl => { cl.x += cl.v * dt; if (cl.x > W + 90) cl.x = -90; Draw.cloud(ctx, cl.x, cl.y, cl.s, scene.night ? 0.25 : 1); });
    if (kind) {
      objs.forEach(o => { o.bump = Math.max(0, o.bump - dt * 2.5); });
      objs.slice().sort((a, b) => a.y - b.y).forEach(drawObj);
    }
    if (scene.snow) { ctx.fillStyle = '#fff'; snow.forEach(f => { f.y += f.v * dt; f.x += Math.sin(time + f.ph) * 0.3; if (f.y > H) { f.y = -5; f.x = Math.random() * W; } ctx.beginPath(); ctx.arc(f.x, f.y, f.r, 0, TAU); ctx.fill(); }); }
    if (playing || kind) { const bs = clamp(W / 600, 0.62, 0.9); drawBunny(ctx, 52, 74 + 64 * bs, bs, time, bunny.mood); }
    FX.draw(ctx, FONT);
    requestAnimationFrame(frame);
  }

  /* ---------- 遊戲流程 ---------- */
  function questionHTML() { const K = KINDS[kind]; return '有幾' + K.unit + '<b>' + K.name + '</b>？'; }
  function questionSay() { const K = KINDS[kind]; return '有幾' + K.unit + K.name + '？'; }

  function newQuestion() {
    clearTimers();
    busy = false; firstTry = true; marks = 0;
    N = KG.randInt(level.min, level.max);
    let k;
    do { k = KG.pick(Object.keys(KINDS)); } while (k === lastKind);
    lastKind = kind = k;
    objs = [];
    const mk = (kk, target, i) => ({ kind: kk, target, ph: Math.random() * 6, lit: 0, mark: 0, bump: 0, jump: 0, flip: Math.random() < 0.5 ? -1 : 1, col: COLS[i % COLS.length], happy: false, born: 0 });
    for (let i = 0; i < N; i++) objs.push(mk(kind, true, i));
    if (level.mix) { const m = KG.randInt(2, 4); for (let i = 0; i < m; i++) objs.push(mk(MIXES[kind], false, i + 3)); }
    objs = KG.shuffle(objs);
    drawBackground();
    placeObjects(false);
    updateDots();
    qText.innerHTML = questionHTML();
    qEl.classList.remove('show'); void qEl.offsetWidth; qEl.classList.add('show');
    const pool = [];
    for (let v = Math.max(1, N - 3); v <= N + 3; v++) if (v !== N) pool.push(v);
    const opts = KG.shuffle(pool).slice(0, level.opts - 1).concat(N).sort((a, b) => a - b);
    ansEl.innerHTML = '';
    const BTN = [['#ff9fbe', '#e8648d'], ['#9ad8ff', '#3a9ee8'], ['#9be8aa', '#46b864'], ['#ffd27a', '#f39a1e']];
    opts.forEach((v, i) => {
      const b = document.createElement('button');
      b.className = 'num'; b.textContent = v;
      b.style.background = 'linear-gradient(180deg,' + BTN[i][0] + ',' + BTN[i][1] + ')';
      b.style.animationDelay = (0.3 + i * 0.08) + 's';
      b.addEventListener('click', () => answer(v, b));
      ansEl.appendChild(b);
    });
    for (let i = 0; i < objs.length; i++) later(() => KG.note(600 + i * 30, 0.06, 'sine', 0.08), 150 + i * 70);
    later(() => KG.say(questionSay()), 300);
  }

  function answer(v, btn) {
    if (busy || !playing) return;
    if (v !== N) {
      if (firstTry) mistakes++;
      firstTry = false;
      KG.sound('wrong'); KG.vibrate(40);
      btn.classList.add('wrong', 'kg-shake');
      bunny.mood = 'sad'; bunny.moodT = 1;
      FX.text('再數數看！', W / 2, L.top + 20, { size: 30, stroke: '#3a8ec8', tag: 'q' });
      KG.say('再數數看喔');
      return;
    }
    busy = true;
    KG.sound('correct');
    results.push(firstTry);
    btn.classList.add('right');
    [...ansEl.children].forEach(b => { if (b !== btn) b.classList.add('wrong'); });
    objs.forEach(o => { o.mark = 0; });
    const targets = objs.filter(o => o.target).sort((a, b) => a.order - b.order);
    const step = N > 10 ? 520 : N > 7 ? 600 : 720;
    targets.forEach((o, i) => {
      later(() => {
        o.lit = 1; o.bump = 1; o.happy = true;
        o.jump = 0; Tween.to(o, { jump: 1 }, 0.15, 'outQuad', 0, () => Tween.to(o, { jump: 0 }, 0.35, 'outBounce'));
        spark(o.x, o.y, 8);
        KG.note(Music.midi(60 + [0, 2, 4, 5, 7, 9, 11, 12, 14, 16, 17, 19, 21, 23, 24][i % 15]), 0.18, 'triangle', 0.22);
        KG.say(NUMW[i + 1], 1.05);
      }, 400 + i * step);
    });
    later(() => {
      const K = KINDS[kind];
      KG.say(NUMW[N] + K.unit + K.name + '！' + (firstTry ? '好棒！' : '答對了！'));
      FX.text(firstTry ? KG.pick(['好棒！', '你好厲害！', '數得真好！', '完美！']) : '答對了！', W / 2, L.top + 40, { size: 40, stroke: '#e0762a', tag: 'q', dur: 1.4 });
      bunny.mood = 'happy'; bunny.moodT = 1.6;
      KG.confetti(innerWidth / 2, innerHeight / 2, 60);
      KG.sound('sparkle');
      updateDots();
    }, 400 + N * step + 150);
    later(() => {
      qIndex++;
      if (qIndex >= PER_LEVEL) finish(); else newQuestion();
    }, 400 + N * step + 2100);
  }

  function updateDots() {
    hudDots.innerHTML = '';
    for (let i = 0; i < PER_LEVEL; i++) {
      const d = document.createElement('div');
      d.className = 'pdot' + (i < results.length ? (results[i] ? ' on' : ' miss') : '') + (i === qIndex && i >= results.length ? ' cur' : '');
      hudDots.appendChild(d);
    }
  }

  function finish() {
    playing = false;
    clearTimers();
    ansEl.innerHTML = ''; qEl.classList.remove('show'); hud.classList.remove('show');
    const right = results.filter(Boolean).length;
    const stars = mistakes === 0 ? 3 : mistakes <= 2 ? 2 : 1;
    KG.say('數數小高手！');
    UI.result({ stars, title: stars === 3 ? '數數小高手！' : '數完了！', msg: '一次就答對 ' + right + ' / ' + PER_LEVEL + ' 題' });
  }

  function startLevel(i) {
    clearTimers();
    li = i; level = LEVELS[i];
    scene = SCENES[UI.item()];
    Tween.clear(); FX.clear();
    qIndex = 0; mistakes = 0; results = []; lastKind = null;
    hudLv.textContent = '第 ' + (i + 1) + ' 關';
    hud.classList.add('show');
    playing = true;
    resize();
    UI.banner('第 ' + (i + 1) + ' 關', level.mix ? '小心！只數題目說的東西喔' : '數到 ' + level.max + '！', 1.6);
    later(newQuestion, 900);
  }

  function toMenu() {
    clearTimers();
    playing = false; kind = null; objs = [];
    ansEl.innerHTML = ''; qEl.classList.remove('show'); hud.classList.remove('show');
    scene = SCENES[UI.item()];
    resize();
  }

  // 點物件可以自己做記號，幫忙數
  cv.addEventListener('pointerdown', e => {
    if (!kind || busy || !playing) return;
    let hit = null, bd = 1e9;
    objs.forEach(o => { const d = Math.hypot(e.clientX - o.x, e.clientY - o.y); if (d < o.s * 0.6 && d < bd) { bd = d; hit = o; } });
    if (!hit) return;
    hit.bump = 1;
    if (!hit.target) { KG.sound('boing'); FX.text('不是這個喔', hit.x, hit.y - hit.s * 0.6, { size: 20, stroke: '#3a8ec8', tag: 'nt' }); return; }
    if (!hit.mark) {
      hit.mark = ++marks;
      KG.note(Music.midi(60 + [0, 2, 4, 5, 7, 9, 11, 12, 14, 16, 17, 19, 21, 23, 24][(marks - 1) % 15]), 0.14, 'sine', 0.25);
      KG.say(NUMW[Math.min(marks, NUMW.length - 1)], 1.05);
      spark(hit.x, hit.y, 5);
    } else KG.sound('boing');
  });
  document.getElementById('speak').addEventListener('click', () => { if (kind) KG.say(questionSay()); });
  window.addEventListener('keydown', e => {
    if (!playing || busy) return;
    const n = parseInt(e.key, 10);
    if (!isNaN(n)) {
      const v = n === 0 ? 10 : n;
      const b = [...ansEl.children].find(x => +x.textContent === v && !x.classList.contains('wrong'));
      if (b) b.click();
    }
  });
  window.addEventListener('resize', resize);
  if (location.hash === '#debug') window.__dbg = { n: () => N };

  UI.init({
    slug: 'counting', title: '數數看', subtitle: '和兔兔老師一起數一數！',
    levels: LEVELS, items: SCENES, itemsTitle: '草原的風景', itemWord: '風景',
    drawMascot, drawItem, music: SONG,
    onPlay: startLevel, onMenu: toMenu, onItem: i => { scene = SCENES[i]; resize(); }
  });
  resize();
  requestAnimationFrame(t => { last = t; frame(t); });
  UI.showTitle();
})();
</script>
</body>
</html>
