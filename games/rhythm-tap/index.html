<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>節奏拍拍</title>
<link rel="stylesheet" href="../../assets/common.css">
<style>
  html, body { height: 100%; overflow: hidden; background: #0b0620; color: #fff; }
  #game { position: fixed; inset: 0; width: 100vw; height: 100vh; height: 100dvh; display: block; touch-action: none; }
  .scr { position: fixed; inset: 0; z-index: 300; display: none; touch-action: manipulation; }
  .scr.on { display: flex; }
  .center { align-items: center; justify-content: center; flex-direction: column; padding: 64px 16px 16px; overflow-y: auto; }
  .dim { background: rgba(6, 3, 20, .62); backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px); }
  .nb {
    font-family: var(--kg-font); font-weight: 800; font-size: 18px; color: #fff; cursor: pointer;
    padding: 11px 22px; min-height: 48px; border-radius: 999px; border: 2px solid rgba(160, 230, 255, .55);
    background: linear-gradient(180deg, rgba(60, 40, 120, .9), rgba(28, 16, 70, .95));
    box-shadow: 0 0 14px rgba(80, 200, 255, .25), inset 0 1px 0 rgba(255, 255, 255, .2);
    transition: transform .1s ease, box-shadow .2s ease; white-space: nowrap;
  }
  .nb:active { transform: scale(.94); }
  .nb:focus-visible { outline: 3px solid #ffe36a; outline-offset: 2px; }
  .nb.pink { border-color: #ffb3e6; background: linear-gradient(180deg, #ff6fcf, #c22d9a); box-shadow: 0 0 22px rgba(255, 80, 200, .55), inset 0 2px 0 rgba(255, 255, 255, .35); }
  .nb.cyan { border-color: #b8f6ff; background: linear-gradient(180deg, #3ee0ff, #1b7fd6); box-shadow: 0 0 22px rgba(60, 220, 255, .5), inset 0 2px 0 rgba(255, 255, 255, .35); }
  .nb.big { font-size: 24px; padding: 14px 40px; min-height: 60px; }
  .row { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
  /* 標題 */
  .logo { text-align: center; margin-bottom: 8px; }
  .logo-zh { font-size: clamp(40px, min(15vw, 17vh), 92px); font-weight: 900; letter-spacing: .06em; line-height: 1.05;
    background: linear-gradient(180deg, #fff 10%, #ffd0f4 40%, #ff5fd0 70%, #9b5cff 100%); -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 0 10px rgba(255, 80, 210, .75)) drop-shadow(0 0 26px rgba(120, 80, 255, .55)); animation: logoBeat .62s ease-out infinite; }
  .logo-en { font-size: clamp(14px, 4vw, 22px); font-weight: 900; letter-spacing: .5em; color: #7ff0ff; text-shadow: 0 0 10px #29d6ff; margin-top: 2px; padding-left: .5em; }
  @keyframes logoBeat { 0% { transform: scale(1.045); } 35% { transform: scale(1); } 100% { transform: scale(1); } }
  .eq { display: flex; gap: 6px; height: 46px; align-items: flex-end; margin: 6px 0 22px; }
  .eq i { width: 12px; border-radius: 6px; background: linear-gradient(180deg, #fff, var(--c)); box-shadow: 0 0 10px var(--c); animation: eqb 1s ease-in-out infinite; }
  @keyframes eqb { 0%, 100% { height: 18%; } 50% { height: 100%; } }
  .hint { font-size: 14px; color: #c8bff0; text-align: center; margin: 18px 0 0; line-height: 1.6; }
  .tcol { display: flex; flex-direction: column; align-items: center; gap: 14px; }
  /* 選歌 */
  #sSelect { display: none; background: linear-gradient(180deg, rgba(10, 5, 30, .55), rgba(10, 5, 30, .85)); padding: 10px 14px 12px;
    grid-template-columns: 1fr; grid-template-rows: auto auto 1fr auto auto; grid-template-areas: "hdr" "tabs" "list" "det" "foot"; gap: 8px; }
  #sSelect.on { display: grid; }
  #sSelect > * { min-width: 0; }
  .hdr { grid-area: hdr; display: flex; align-items: center; justify-content: center; gap: 14px; padding: 2px 58px 0; min-height: 48px; }
  .hdr h2 { margin: 0; font-size: 24px; font-weight: 900; color: #fff; text-shadow: 0 0 12px #ff5fd0; }
  .starTot { font-weight: 900; font-size: 18px; color: #ffe36a; text-shadow: 0 0 8px rgba(255, 210, 60, .7); white-space: nowrap; }
  .tabs { grid-area: tabs; display: flex; gap: 6px; justify-content: center; }
  .tabs button { flex: 1; max-width: 140px; font-family: var(--kg-font); font-size: 18px; font-weight: 900; min-height: 44px; border-radius: 14px; cursor: pointer;
    color: #cfc6ff; background: rgba(40, 24, 90, .7); border: 2px solid rgba(150, 130, 255, .35); }
  .tabs button.sel { color: #fff; border-color: var(--c); background: linear-gradient(180deg, var(--c), rgba(40, 20, 90, .9)); box-shadow: 0 0 16px var(--c); }
  .list { grid-area: list; overflow-y: auto; -webkit-overflow-scrolling: touch; touch-action: pan-y; display: flex; flex-direction: column; gap: 8px; padding: 4px 2px 10px; width: 100%; max-width: 640px; justify-self: center; }
  .song { position: relative; display: flex; align-items: center; gap: 12px; padding: 10px 12px; min-height: 66px; border-radius: 16px; cursor: pointer; text-align: left;
    font-family: var(--kg-font); color: #fff; background: rgba(30, 18, 72, .78); border: 2px solid rgba(140, 120, 255, .25); flex: none; }
  .song.sel { border-color: var(--c); background: linear-gradient(90deg, rgba(60, 30, 120, .95), rgba(30, 18, 72, .9)); box-shadow: 0 0 16px var(--c), inset 0 0 18px rgba(255, 255, 255, .06); }
  .disc { width: 44px; height: 44px; border-radius: 50%; flex: none; background: radial-gradient(circle, #fff 0 9%, #140a30 10% 17%, var(--c) 18% 46%, #2a1650 47% 52%, var(--c) 53% 100%); box-shadow: 0 0 12px var(--c); }
  .song.sel .disc { animation: spin 2.2s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .info { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .info b { font-size: 19px; font-weight: 900; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .info small { font-size: 13px; color: #b9b0e8; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .rec { display: flex; flex-direction: column; align-items: flex-end; gap: 2px; flex: none; }
  .lv { font-size: 12px; font-weight: 900; padding: 1px 8px; border-radius: 8px; background: var(--dc); color: #1a0d3a; }
  .gr { font-size: 15px; font-weight: 900; color: #fff; }
  .st { font-size: 15px; letter-spacing: 1px; color: #ffe36a; }
  .st .off { color: rgba(255, 255, 255, .22); }
  .song.locked { filter: saturate(.2) brightness(.7); }
  .song .lockTag { display: none; align-items: center; gap: 4px; font-size: 14px; font-weight: 900; color: #ffe36a; flex: none; }
  .song.locked .lockTag { display: flex; }
  .song.locked .rec { display: none; }
  .det { grid-area: det; text-align: center; font-size: 14px; color: #d9d2ff; min-height: 20px; }
  .det b { color: #fff; }
  .foot { grid-area: foot; display: flex; gap: 10px; justify-content: center; align-items: center; }
  .foot .nb { padding: 10px 16px; }
  @media (orientation: landscape) and (max-height: 560px) {
    #sSelect { grid-template-columns: minmax(0, 1fr) 270px; grid-template-rows: auto auto 1fr auto; grid-template-areas: "list hdr" "list tabs" "list det" "list foot"; padding: 8px 64px 8px 64px; }
    .hdr { padding: 0; flex-direction: column; gap: 0; }
    .list { max-width: none; padding-top: 6px; }
    .det { align-self: center; }
    .foot { flex-wrap: wrap; }
    .foot .nb.big { width: 100%; }
  }
  /* 卡片 */
  .card { width: min(420px, 100%); background: linear-gradient(180deg, rgba(44, 24, 100, .96), rgba(18, 10, 50, .97)); border: 2px solid rgba(160, 220, 255, .45);
    border-radius: 24px; padding: 20px 20px 22px; box-shadow: 0 0 30px rgba(120, 80, 255, .45); text-align: center; margin: auto; }
  .card h2 { margin: 0 0 12px; font-size: 26px; font-weight: 900; text-shadow: 0 0 12px #ff5fd0; }
  .card p { color: #d6cff7; font-size: 15px; margin: 6px 0 12px; line-height: 1.5; }
  .set-row { text-align: left; margin: 12px 0; }
  .set-row label { display: flex; justify-content: space-between; font-weight: 800; font-size: 17px; margin-bottom: 6px; }
  .set-row label b { color: #7ff0ff; }
  .set-row small { color: #a99fd9; font-size: 13px; }
  input[type=range] { width: 100%; height: 36px; accent-color: #ff5fd0; touch-action: pan-x; }
  .set-row label.tog { justify-content: flex-start; }
  .tog { display: flex; align-items: center; gap: 10px; font-weight: 800; font-size: 17px; cursor: pointer; }
  .tog input { width: 24px; height: 24px; accent-color: #ff5fd0; }
  .vcol { display: flex; flex-direction: column; gap: 12px; align-items: stretch; }
  /* 校正 */
  .calpad { position: relative; width: 170px; height: 170px; margin: 8px auto 10px; border-radius: 50%; display: grid; place-items: center; cursor: pointer; touch-action: none;
    background: radial-gradient(circle, rgba(255, 95, 208, .25), rgba(40, 20, 90, .6) 70%); border: 3px solid rgba(255, 160, 230, .6); }
  .calring { position: absolute; inset: 14px; border-radius: 50%; border: 6px solid #7ff0ff; box-shadow: 0 0 18px #29d6ff, inset 0 0 18px #29d6ff; }
  .calpad span { position: relative; font-size: 26px; font-weight: 900; }
  .calRes { font-size: 17px; font-weight: 800; color: #ffe36a; min-height: 26px; margin-bottom: 12px; }
  /* 結算 */
  .rcard { width: min(460px, 100%); }
  .r-song { font-size: 18px; font-weight: 900; color: #e7e0ff; }
  .r-diff { display: inline-block; font-size: 13px; padding: 1px 10px; border-radius: 9px; color: #1a0d3a; font-weight: 900; margin-left: 6px; vertical-align: 2px; }
  .r-main { display: flex; align-items: center; justify-content: center; gap: 18px; margin: 6px 0 4px; }
  .r-grade { font-size: 104px; font-weight: 900; line-height: 1; background: linear-gradient(180deg, #fff, var(--gc) 55%, #6a2cff); -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 0 16px var(--gc)); }
  .r-grade.pop { animation: gpop .7s cubic-bezier(.2, 1.6, .4, 1) both; }
  @keyframes gpop { 0% { transform: scale(2.6) rotate(-12deg); opacity: 0; } 100% { transform: none; opacity: 1; } }
  .r-side { display: flex; flex-direction: column; align-items: flex-start; gap: 4px; }
  .r-score { font-size: 34px; font-weight: 900; letter-spacing: .03em; text-shadow: 0 0 12px #29d6ff; }
  .r-badge { font-size: 14px; font-weight: 900; padding: 3px 12px; border-radius: 999px; color: #1a0d3a; background: linear-gradient(90deg, #ffe36a, #ff8fd8, #7ff0ff); box-shadow: 0 0 14px rgba(255, 200, 120, .8); }
  .r-badge.fail { background: #5b4a8a; color: #fff; box-shadow: none; }
  .r-new { color: #ffe36a; font-weight: 900; font-size: 15px; min-height: 20px; }
  .r-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin: 10px 0; }
  .r-grid div { background: rgba(255, 255, 255, .07); border-radius: 12px; padding: 6px 2px; }
  .r-grid b { display: block; font-size: 20px; }
  .r-grid small { font-size: 11px; font-weight: 900; }
  .r-meta { display: flex; justify-content: center; gap: 18px; font-weight: 800; color: #d9d2ff; margin-bottom: 8px; flex-wrap: wrap; }
  .r-meta b { color: #fff; }
  .r-stars { font-size: 30px; letter-spacing: 6px; color: #ffe36a; text-shadow: 0 0 12px rgba(255, 210, 60, .8); margin-bottom: 12px; }
  .r-stars .off { color: rgba(255, 255, 255, .18); text-shadow: none; }
  @media (orientation: landscape) and (max-height: 560px) {
    .center { padding: 10px 64px; }
    .card { padding: 12px 18px 14px; }
    .card h2 { margin-bottom: 6px; font-size: 22px; }
    .rcard { width: min(640px, 100%); display: grid; grid-template-columns: 1fr 1.25fr; column-gap: 16px; align-items: center; }
    .rcard .r-l { grid-column: 1; }
    .rcard .r-r { grid-column: 2; }
    .r-grade { font-size: 84px; }
    .r-score { font-size: 28px; }
    .r-stars { font-size: 24px; margin-bottom: 6px; }
    .r-grid { margin: 6px 0; }
    .calpad { width: 120px; height: 120px; margin: 4px auto 6px; }
    .set-row { margin: 6px 0; }
    .card p { margin: 4px 0 8px; }
    .tcol { gap: 8px; }
    .eq { height: 30px; margin: 2px 0 10px; }
    .hint { margin-top: 8px; }
  }
  @media (orientation: landscape) and (max-height: 440px) {
    .hint { display: none; }
  }
  .kg-toast { color: #4a3b52; }
  @media (max-height: 620px) and (orientation: portrait) { .hint { display: none; } }
  #pauseBtn { position: fixed; top: 70px; right: 10px; z-index: 400; width: 48px; height: 48px; border-radius: 50%; display: none; align-items: center; justify-content: center; gap: 6px; cursor: pointer;
    border: 2px solid rgba(160, 230, 255, .7); background: rgba(30, 16, 70, .75); box-shadow: 0 0 12px rgba(80, 200, 255, .45); touch-action: manipulation; }
  #pauseBtn.on { display: flex; }
  #pauseBtn i { width: 6px; height: 18px; border-radius: 2px; background: #fff; }
</style>
</head>
<body>
<canvas id="game" aria-label="節奏拍拍遊戲畫面"></canvas>
<button id="pauseBtn" aria-label="暫停"><i></i><i></i></button>

<div id="sTitle" class="scr center on">
  <div class="tcol">
    <div class="logo"><div class="logo-zh">節奏拍拍</div><div class="logo-en">RHYTHM TAP</div></div>
    <div class="eq"><i style="--c:#ff4fb8;animation-delay:0s"></i><i style="--c:#36d9ff;animation-delay:-.3s"></i><i style="--c:#7cf56a;animation-delay:-.6s"></i><i style="--c:#ffc93c;animation-delay:-.15s"></i><i style="--c:#b37bff;animation-delay:-.45s"></i></div>
    <button class="nb big pink" id="bPlay">開始遊戲</button>
    <div class="row"><button class="nb" id="bSet">設定</button><button class="nb" id="bCal">節拍校正</button></div>
    <p class="hint" id="tHint">音符碰到發光線時，點一下對應的軌道！<br>電腦用 D F J K 鍵（或方向鍵），長音符要按住。</p>
  </div>
</div>

<div id="sSelect" class="scr">
  <div class="hdr"><h2>選擇歌曲</h2><div class="starTot" id="starTot">★ 0</div></div>
  <div class="tabs" id="tabs"><button data-d="0" style="--c:#5fe08a">簡單</button><button data-d="1" style="--c:#36b9ff">普通</button><button data-d="2" style="--c:#ff4f8f">困難</button></div>
  <div class="list" id="songList"></div>
  <div class="det" id="det"></div>
  <div class="foot"><button class="nb" id="bBack">返回</button><button class="nb" id="bSet2">設定</button><button class="nb big pink" id="bGo">開始！</button></div>
</div>

<div id="sSettings" class="scr center dim">
  <div class="card">
    <h2>設定</h2>
    <div class="set-row"><label>音符速度 <b id="vSpeed"></b></label><input type="range" id="rSpeed" min="1" max="10" step="0.5" aria-label="音符速度"></div>
    <div class="set-row"><label>延遲補償 <b id="vOff"></b></label><input type="range" id="rOff" min="-150" max="300" step="5" aria-label="延遲補償"><small>覺得要「晚一點」按才準 → 調大；藍牙耳機通常要調大。</small></div>
    <div class="set-row"><label class="tog"><input type="checkbox" id="cHit"> 打擊音效</label></div>
    <div class="row"><button class="nb cyan" id="bCal2">自動校正</button><button class="nb pink" id="bSetOk">完成</button></div>
  </div>
</div>

<div id="sCalib" class="scr center dim">
  <div class="card">
    <h2>節拍校正</h2>
    <p>聽到「嗒」的聲音時，跟著節拍點圓圈<br>（或按空白鍵）。點 16 下就完成！</p>
    <div class="calpad" id="calPad"><div class="calring" id="calRing"></div><span id="calCount">0 / 16</span></div>
    <div class="calRes" id="calRes">準備好了就開始點吧</div>
    <div class="row"><button class="nb" id="bCalRe">重來</button><button class="nb pink" id="bCalOk">套用</button><button class="nb" id="bCalBack">返回</button></div>
  </div>
</div>

<div id="sPause" class="scr center dim">
  <div class="card">
    <h2>暫停</h2>
    <div class="vcol"><button class="nb pink big" id="bResume">繼續</button><button class="nb" id="bRestart">重新開始</button><button class="nb" id="bQuit">選擇歌曲</button></div>
  </div>
</div>

<div id="sResult" class="scr center dim">
  <div class="card rcard">
    <div class="r-l">
      <div class="r-song" id="rSong"></div>
      <div class="r-main"><div class="r-grade" id="rGrade">S</div></div>
      <div class="r-badge" id="rBadge" style="display:inline-block">FULL COMBO</div>
      <div class="r-stars" id="rStars" style="margin-top:8px"></div>
    </div>
    <div class="r-r">
      <div class="r-score" id="rScore">0</div>
      <div class="r-new" id="rNew"></div>
      <div class="r-grid" id="rGrid"></div>
      <div class="r-meta" id="rMeta"></div>
      <div class="row"><button class="nb pink" id="bAgain">再玩一次</button><button class="nb" id="bSongs">選擇歌曲</button></div>
    </div>
  </div>
</div>

<script src="../../assets/common.js"></script>
<script>
'use strict';
const SLUG = 'rhythm-tap';
const $ = (id) => document.getElementById(id);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const TAU = Math.PI * 2;
const FONT = '"Baloo 2","PingFang TC","Noto Sans TC","Microsoft JhengHei","Heiti TC",system-ui,sans-serif';
const LANE_COL = ['#ff4fb8', '#36d9ff', '#7cf56a', '#ffc93c'];
const LANE_RGB = [[255, 79, 184], [54, 217, 255], [124, 245, 106], [255, 201, 60]];
const DIFF_NAMES = ['簡單', '普通', '困難'];
const DIFF_COL = ['#5fe08a', '#36b9ff', '#ff4f8f'];
const KEY_LABEL = ['D', 'F', 'J', 'K'];

/* =====================================================================
 * 判定
 * ===================================================================== */
const WIN = { perfect: 0.050, great: 0.100, good: 0.150 }; // 秒（正負）
const HOLD_EARLY = 0.15; // 長音符提早放開的容許秒數
const JNAME = ['PERFECT', 'GREAT', 'GOOD', 'MISS'];
const JZH = ['完美', '很好', '不錯', '失誤'];
const JW = [1, 0.75, 0.4, 0];
const JCOL = ['#ffe36a', '#5ff0ff', '#8dff7a', '#ff6a8a'];
function judgeDt(dt) {
  const a = Math.abs(dt);
  return a <= WIN.perfect + 1e-9 ? 0 : a <= WIN.great + 1e-9 ? 1 : a <= WIN.good + 1e-9 ? 2 : 3;
}

/* =====================================================================
 * 存檔
 * ===================================================================== */
const Save = { get(k, d) { return KG.store.get(SLUG + ':' + k, d); }, set(k, v) { KG.store.set(SLUG + ':' + k, v); } };
const settings = Object.assign({ speed: 5, offset: 0, hitsound: true }, Save.get('settings', {}));
function saveSettings() { Save.set('settings', settings); }
let records = Save.get('records', {});
function rec(id, d) { return (records[id] && records[id][d]) || null; }
function totalStars() { let n = 0; for (const id in records) for (const d in records[id]) n += records[id][d].stars || 0; return n; }

/* =====================================================================
 * 歌曲（全部在程式裡作曲；旋律記法：音名八度:十六分音符數，r 為休止）
 * 和弦每小節一個，用 / 分成前後半小節
 * ===================================================================== */
const SONGS = [
  { id: 'twinkle', title: '小星星', sub: '經典童謠', bpm: 96, tr: 0, tonic: 'C', need: 0, color: '#ffd23a', lead: 'triangle', bass: 'root4', drum: 'soft',
    ph: {
      A: { m: 'C5:4 C5:4 G5:4 G5:4 A5:4 A5:4 G5:8 F5:4 F5:4 E5:4 E5:4 D5:4 D5:4 C5:8', c: 'C F/C F/C G/C' },
      B: { m: 'G5:4 G5:4 F5:4 F5:4 E5:4 E5:4 D5:8 G5:4 G5:4 F5:4 F5:4 E5:4 E5:4 D5:8', c: 'C/F C/G C/F C/G' }
    }, form: 'A B A B A' },
  { id: 'tigers', title: '兩隻老虎', sub: '經典童謠', bpm: 116, tr: 2, tonic: 'C', need: 0, color: '#ffa13a', lead: 'square', bass: 'walk', drum: 'pop',
    ph: {
      A: { m: 'C5:4 D5:4 E5:4 C5:4 C5:4 D5:4 E5:4 C5:4 E5:4 F5:4 G5:8 E5:4 F5:4 G5:8', c: 'C C C C' },
      B: { m: 'G5:2 A5:2 G5:2 F5:2 E5:4 C5:4 G5:2 A5:2 G5:2 F5:2 E5:4 C5:4 C5:4 G4:4 C5:8 C5:4 G4:4 C5:8', c: 'C C C/G C/G' }
    }, form: 'A B A B A B' },
  { id: 'neon', title: '霓虹起跑', sub: '原創 · 電子流行', bpm: 124, tr: 0, tonic: 'Am', need: 0, color: '#ff4fb8', lead: 'square', bass: 'oct8', drum: 'four',

  jl.addColorStop(0, '#ff6fd8'); jl.addColorStop(0.5, '#ffffff'); jl.addColorStop(1, '#5fe8ff');
  x.strokeStyle = jl; x.lineWidth = 4;
  x.beginPath(); x.moveTo(bl - 4, hitY); x.lineTo(br + 4, hitY); x.stroke();
  x.restore();
  // 接收框
  for (let l = 0; l < 4; l++) {
    const lx = cx + (l - 1.5) * laneW, w = laneW * 0.86;
    rrPath(x, lx - w / 2, hitY - noteH / 2, w, noteH, noteH / 2);
    x.lineWidth = 2; x.strokeStyle = LANE_COL[l]; x.globalAlpha = 0.75; x.stroke(); x.globalAlpha = 1;
  }
  // 下方按鍵區
  const padTop = hitY + noteH / 2 + 8, padH = Math.max(10, H - padTop - 10);
  if (padH > 24) {
    for (let l = 0; l < 4; l++) {
      const s0 = 1 + (padTop - hitY) / (hitY - vanY), lx = cx + (l - 1.5) * laneW * s0;
      const w = laneW * 0.84 * s0;
      rrPath(x, lx - w / 2, padTop, w, padH, 14);
      const pg = x.createLinearGradient(0, padTop, 0, padTop + padH);
      const [R, Gc, Bc] = LANE_RGB[l];
      pg.addColorStop(0, `rgba(${R},${Gc},${Bc},0.20)`); pg.addColorStop(1, `rgba(${R},${Gc},${Bc},0.05)`);
      x.fillStyle = pg; x.fill();
      x.strokeStyle = `rgba(${R},${Gc},${Bc},0.45)`; x.lineWidth = 1.5; x.stroke();
      x.fillStyle = `rgba(255,255,255,0.75)`;
      x.font = `900 ${clamp(padH * 0.34, 14, 30)}px ${FONT}`; x.textAlign = 'center'; x.textBaseline = 'middle';
      if (!isTouch) x.fillText(KEY_LABEL[l], lx, padTop + padH / 2);
      else { x.beginPath(); x.arc(lx, padTop + padH / 2, clamp(padH * 0.12, 4, 9), 0, TAU); x.fill(); }
    }
  }

  // 音符圖
  const nw = laneW * 0.86, P = 12;
  noteSpr = []; dotSpr = []; ringSpr = []; beamGrad = []; holdFill = []; holdFillOn = [];
  for (let l = 0; l < 4; l++) {
    const [c, nx] = mkCanvas(nw + P * 2, noteH + P * 2);
    const [R, Gc, Bc] = LANE_RGB[l];
    nx.shadowBlur = 12; nx.shadowColor = LANE_COL[l];
    rrPath(nx, P, P, nw, noteH, noteH / 2);
    const ng = nx.createLinearGradient(0, P, 0, P + noteH);
    ng.addColorStop(0, '#ffffff'); ng.addColorStop(0.35, LANE_COL[l]); ng.addColorStop(1, `rgb(${R * 0.55 | 0},${Gc * 0.55 | 0},${Bc * 0.55 | 0})`);
    nx.fillStyle = ng; nx.fill();
    nx.shadowBlur = 0;
    nx.lineWidth = 2; nx.strokeStyle = 'rgba(255,255,255,0.9)'; nx.stroke();
    nx.fillStyle = 'rgba(255,255,255,0.95)';
    rrPath(nx, P + nw * 0.38, P + noteH * 0.36, nw * 0.24, noteH * 0.28, noteH * 0.14); nx.fill();
    noteSpr.push(c);
    const [d, dx] = mkCanvas(24, 24);
    const dg = dx.createRadialGradient(12, 12, 0, 12, 12, 12);
    dg.addColorStop(0, '#ffffff'); dg.addColorStop(0.3, LANE_COL[l]); dg.addColorStop(1, `rgba(${R},${Gc},${Bc},0)`);
    dx.fillStyle = dg; dx.fillRect(0, 0, 24, 24);
    dotSpr.push(d);
    const [rc, rx] = mkCanvas(80, 80);
    rx.shadowBlur = 10; rx.shadowColor = LANE_COL[l]; rx.strokeStyle = '#fff'; rx.lineWidth = 4;
    rx.beginPath(); rx.ellipse(40, 40, 32, 32, 0, 0, TAU); rx.stroke();
    ringSpr.push(rc);
    const bg2 = ctx.createLinearGradient(0, hitY, 0, topY);
    bg2.addColorStop(0, `rgba(${R},${Gc},${Bc},0.55)`); bg2.addColorStop(0.6, `rgba(${R},${Gc},${Bc},0.08)`); bg2.addColorStop(1, `rgba(${R},${Gc},${Bc},0)`);
    beamGrad.push(bg2);
    holdFill.push(`rgba(${R},${Gc},${Bc},0.38)`); holdFillOn.push(`rgba(${R},${Gc},${Bc},0.7)`);
  }
  // 判定字
  judgeSpr = [];
  const jfs = clamp(Math.min(bw * 0.11, (hitY - topY) * 0.12), 24, 52);
  for (let j = 0; j < 4; j++) {
    const [c, jx] = mkCanvas(jfs * 6.4, jfs * 1.9);
    jx.textAlign = 'center'; jx.textBaseline = 'middle';
    jx.font = `900 italic ${jfs}px ${FONT}`;
    jx.shadowBlur = 14; jx.shadowColor = JCOL[j];
    jx.lineWidth = jfs * 0.14; jx.strokeStyle = 'rgba(20,6,50,0.9)'; jx.lineJoin = 'round';
    jx.strokeText(JNAME[j], jfs * 3.2, jfs * 0.68);
    const tg = jx.createLinearGradient(0, jfs * 0.2, 0, jfs * 1.1);
    tg.addColorStop(0, '#ffffff'); tg.addColorStop(1, JCOL[j]);
    jx.fillStyle = tg; jx.fillText(JNAME[j], jfs * 3.2, jfs * 0.68);
    jx.shadowBlur = 0;
    jx.font = `900 ${jfs * 0.42}px ${FONT}`; jx.fillStyle = JCOL[j];
    jx.fillText(JZH[j], jfs * 3.2, jfs * 1.5);
    judgeSpr.push(c);
  }
  // 節拍光
  const [gc, gx] = mkCanvas(256, 256);
  const gg = gx.createRadialGradient(128, 128, 0, 128, 128, 128);
  gg.addColorStop(0, 'rgba(255,120,230,0.9)'); gg.addColorStop(0.35, 'rgba(160,80,255,0.35)'); gg.addColorStop(1, 'rgba(60,20,160,0)');
  gx.fillStyle = gg; gx.fillRect(0, 0, 256, 256);
  glowSpr = gc;
  // 失誤紅框
  const [vc, vx] = mkCanvas(W, H);
  const vg = vx.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.35, W / 2, H / 2, Math.max(W, H) * 0.75);
  vg.addColorStop(0, 'rgba(255,30,80,0)'); vg.addColorStop(1, 'rgba(255,30,80,0.55)');
  vx.fillStyle = vg; vx.fillRect(0, 0, W, H);
  vignette = vc;
  progGrad = ctx.createLinearGradient(0, 0, W, 0); progGrad.addColorStop(0, '#ff4fd8'); progGrad.addColorStop(1, '#29d6ff');
}

/* ---------- 特效（物件池） ---------- */
const MAXP = 160;
const parts = [];
for (let i = 0; i < MAXP; i++) parts.push({ on: false, x: 0, y: 0, vx: 0, vy: 0, life: 0, max: 1, l: 0, s: 1 });
const rings = [];
for (let i = 0; i < 10; i++) rings.push({ on: false, x: 0, y: 0, t: 0, l: 0, big: false });
let shakeT = 0, missFlash = 0, mile = { n: 0, t: 0 };
const FX = {
  spawn(x, y, l, n, spd, up) {
    let c = 0;
    for (let i = 0; i < MAXP && c < n; i++) {
      const p = parts[i];
      if (p.on) continue;
      const a = up ? -Math.PI / 2 + (Math.random() - 0.5) * 2.2 : Math.random() * TAU, v = spd * (0.4 + Math.random() * 0.8);
      p.on = true; p.x = x; p.y = y; p.vx = Math.cos(a) * v; p.vy = Math.sin(a) * v; p.max = p.life = 0.35 + Math.random() * 0.35; p.l = l; p.s = 8 + Math.random() * 10;
      c++;
    }
  },
  hit(l, j, tail) {
    const x = cx + (l - 1.5) * laneW;
    laneGlow[l] = 1;
    this.spawn(x, hitY, l, j === 0 ? (KG.lowEnd ? 7 : 12) : 6, j === 0 ? 420 : 300, true);
    for (const r of rings) if (!r.on) { r.on = true; r.x = x; r.y = hitY; r.t = 0; r.l = l; r.big = !!tail; break; }
  },
  judge() {},
  miss() { missFlash = 1; shakeT = 0.18; },
  milestone(n) { mile.n = n; mile.t = 1; sfx('milestone'); this.spawn(cx, hitY - (hitY - topY) * 0.4, 0, 20, 500, false); this.spawn(cx, hitY - (hitY - topY) * 0.4, 1, 20, 500, false); }
};
function updateFx(dt) {
  for (const p of parts) {
    if (!p.on) continue;
    p.life -= dt; if (p.life <= 0) { p.on = false; continue; }
    p.vy += 600 * dt; p.x += p.vx * dt; p.y += p.vy * dt;
  }
  for (const r of rings) { if (r.on) { r.t += dt; if (r.t > 0.35) r.on = false; } }
  for (let l = 0; l < 4; l++) {
    if (autoUp[l] > 0) { autoUp[l] -= dt; }
    const held = laneDown[l] > 0 || (G.holding[l] && G.auto) || autoUp[l] > 0;
    laneGlow[l] = held ? Math.max(laneGlow[l], 0.75) : Math.max(0, laneGlow[l] - dt * 5);
  }
  if (shakeT > 0) shakeT -= dt;
  missFlash = Math.max(0, missFlash - dt * 3);
  if (mile.t > 0) mile.t -= dt * 0.8;
}

/* ---------- 繪圖 ---------- */
let visPos = -2, lastFrame = performance.now(), idlePos = 0;
function songPosNow() { return AC ? AC.currentTime - G.startAt - lat() : -2; }

function drawScene(pos, spb, playing) {
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  let sx = 0, sy = 0;
  if (shakeT > 0) { sx = (Math.random() - 0.5) * 6; sy = (Math.random() - 0.5) * 6; ctx.translate(sx, sy); }
  ctx.drawImage(bgLayer, 0, 0, W, H);
  // 節拍脈動
  const beatPh = ((pos / spb) % 1 + 1) % 1;
  const pulse = Math.exp(-beatPh * 5);
  const R = Math.max(W, H) * (0.55 + pulse * 0.08);
  ctx.globalCompositeOperation = 'lighter';
  ctx.globalAlpha = 0.18 + pulse * 0.3;
  ctx.drawImage(glowSpr, cx - R, topY - R * 0.55, R * 2, R * 1.4);
  ctx.globalAlpha = 1;
  ctx.globalCompositeOperation = 'source-over';
  ctx.drawImage(roadLayer, 0, 0, W, H);
  const T = travelT();
  // 拍線
  const k0 = Math.ceil(pos / spb), k1 = Math.floor((pos + T) / spb);
  ctx.lineWidth = 1.5;
  for (let pass = 0; pass < 2; pass++) {
    ctx.beginPath();
    for (let k = Math.max(k0, 0); k <= k1; k++) {
      if ((k % 4 === 0) !== (pass === 1)) continue;
      const s = sOf((k * spb - pos) / T * ZMAX), y = yOf(s), hw = bw / 2 * s;
      ctx.moveTo(cx - hw, y); ctx.lineTo(cx + hw, y);
    }
    ctx.strokeStyle = pass ? 'rgba(220,200,255,0.42)' : 'rgba(200,180,255,0.14)';
    ctx.stroke();
  }
  // 按下的光柱
  for (let l = 0; l < 4; l++) {
    if (laneGlow[l] <= 0.01) continue;
    const a = l * 0.25 - 0.5, b = a + 0.25;
    ctx.globalAlpha = laneGlow[l];
    ctx.fillStyle = beamGrad[l];
    ctx.beginPath();
    ctx.moveTo(cx + a * bw, hitY); ctx.lineTo(cx + b * bw, hitY);
    const s2 = sOf(ZMAX * 0.5), y2 = yOf(s2);
    ctx.lineTo(cx + b * bw * s2, y2); ctx.lineTo(cx + a * bw * s2, y2); ctx.closePath(); ctx.fill();
  }
  ctx.globalAlpha = 1;
  if (playing) drawNotes(pos, T);
  // 接收框亮起
  const nw = laneW * 0.86, P = 12;
  for (let l = 0; l < 4; l++) {
    if (laneGlow[l] <= 0.01) continue;
    ctx.globalAlpha = laneGlow[l] * 0.55;
    const x = cx + (l - 1.5) * laneW;
    ctx.drawImage(noteSpr[l], x - nw / 2 - P, hitY - noteH / 2 - P, nw + P * 2, noteH + P * 2);
  }
  ctx.globalAlpha = 1;
  // 光圈與粒子
  ctx.globalCompositeOperation = 'lighter';
  for (const r of rings) {
    if (!r.on) continue;
    const k = r.t / 0.35, sz = laneW * (r.big ? 1.3 : 0.9) * (0.5 + k);
    ctx.globalAlpha = 1 - k;
    ctx.drawImage(ringSpr[r.l], r.x - sz / 2, r.y - sz * 0.32, sz, sz * 0.64);
  }
  for (const p of parts) {
    if (!p.on) continue;
    const k = p.life / p.max;
    ctx.globalAlpha = k;
    const s = p.s * (0.5 + k * 0.5);
    ctx.drawImage(dotSpr[p.l], p.x - s / 2, p.y - s / 2, s, s);
  }
  ctx.globalAlpha = 1;
  ctx.globalCompositeOperation = 'source-over';
  if (playing) drawHud(pos);
  if (missFlash > 0) { ctx.globalAlpha = missFlash * 0.8; ctx.drawImage(vignette, 0, 0, W, H); ctx.globalAlpha = 1; }
}

function drawNotes(pos, T) {
  const nw = laneW * 0.86, P = 12, hwBody = laneW * 0.3;
  for (let l = 0; l < 4; l++) {
    const arr = G.byLane[l], lx = (l - 1.5) * laneW;
    // 找可見範圍
    let last = G.ptr[l];
    while (last < arr.length && arr[last].t - pos < T) last++;
    for (let i = last - 1; i >= G.ptr[l]; i--) {
      const n = arr[i];
      if (n.j === 2) continue;
      const missed = n.j === 3;
      if (n.end) {
        const holding = n.j === 1;
        const z1 = holding ? 0 : Math.max(-0.12, (n.t - pos) / T * ZMAX);
        const z2 = Math.min(ZMAX, (n.end - pos) / T * ZMAX);
        if (z2 > z1) {
          const s1 = sOf(z1), s2 = sOf(z2), y1 = yOf(s1), y2 = yOf(s2);
          ctx.globalAlpha = missed ? 0.25 : 1;
          ctx.fillStyle = holding ? holdFillOn[l] : holdFill[l];
          ctx.beginPath();
          ctx.moveTo(cx + (lx - hwBody) * s1, y1); ctx.lineTo(cx + (lx + hwBody) * s1, y1);
          ctx.lineTo(cx + (lx + hwBody) * s2, y2); ctx.lineTo(cx + (lx - hwBody) * s2, y2); ctx.closePath(); ctx.fill();
          ctx.fillStyle = holding ? '#ffffff' : 'rgba(255,255,255,0.55)';
          ctx.beginPath();
          ctx.moveTo(cx + (lx - 3) * s1, y1); ctx.lineTo(cx + (lx + 3) * s1, y1);
          ctx.lineTo(cx + (lx + 3) * s2, y2); ctx.lineTo(cx + (lx - 3) * s2, y2); ctx.closePath(); ctx.fill();
          // 尾端小蓋
          if (n.end - pos < T) {
            const w = nw * 0.7 * s2, h = noteH * 0.5 * s2;
            ctx.drawImage(noteSpr[l], cx + lx * s2 - w / 2 - P * s2, y2 - h / 2 - P * s2 * 0.5, w + P * 2 * s2, h + P * s2);
          }
          if (holding) {
            ctx.globalAlpha = 1;
            const w = nw, h = noteH;
            ctx.drawImage(noteSpr[l], cx + lx - w / 2 - P, hitY - h / 2 - P, w + P * 2, h + P * 2);
            if (!G.sim && Math.random() < 0.5) FX.spawn(cx + lx + (Math.random() - 0.5) * laneW * 0.5, hitY, l, 1, 260, true);
            continue;
          }
        }
      }
      const dt = n.t - pos;
      if (dt < -0.25) continue;
      const z = Math.max(-0.12, dt / T * ZMAX), s = sOf(z), y = yOf(s);
      const fade = clamp((ZMAX - z) / 0.35, 0, 1);
      ctx.globalAlpha = missed ? 0.3 * fade : fade;
      const w = nw * s, h = noteH * s;
      ctx.drawImage(noteSpr[l], cx + lx * s - w / 2 - P * s, y - h / 2 - P * s, w + P * 2 * s, h + P * 2 * s);
    }
  }
  ctx.globalAlpha = 1;
}

function drawHud(pos) {
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  const now = performance.now();
  // 進度條
  const prog = clamp(pos / G.endT, 0, 1);
  ctx.fillStyle = 'rgba(255,255,255,0.12)'; ctx.fillRect(0, 0, W, 4);
  ctx.fillStyle = progGrad; ctx.fillRect(0, 0, W * prog, 4);
  // 分數
  const sc = score();
  ctx.font = `900 ${clamp(W * 0.06, 20, 30)}px ${FONT}`;
  ctx.lineWidth = 4; ctx.strokeStyle = 'rgba(10,4,30,0.85)'; ctx.lineJoin = 'round';
  const str = String(sc).padStart(7, '0');
  ctx.strokeText(str, cx, 26); ctx.fillStyle = '#ffffff'; ctx.fillText(str, cx, 26);
  // 生命條
  const lw = Math.min(180, W - 150), lx = cx - lw / 2, ly = 46;
  ctx.fillStyle = 'rgba(255,255,255,0.15)'; rrPath(ctx, lx, ly, lw, 8, 4); ctx.fill();
  ctx.fillStyle = G.life > 30 ? '#7cf56a' : '#ff5f7a';
  rrPath(ctx, lx, ly, Math.max(8, lw * G.life / 100), 8, 4); ctx.fill();
  // 歌名
  ctx.textAlign = 'left';
  ctx.font = `800 13px ${FONT}`; ctx.fillStyle = 'rgba(230,220,255,0.85)';
  ctx.fillText(SONGS[G.si].title, 12, 72);
  ctx.fillStyle = DIFF_COL[G.d]; ctx.fillText(DIFF_NAMES[G.d] + (G.auto ? '・自動' : ''), 12, 90);
  ctx.textAlign = 'center';
  // 判定字
  const jy = hitY - (hitY - topY) * 0.3;
  const age = (now - G.lastJAt) / 1000;
  const resuming = state === 'resuming';
  if (G.lastJ >= 0 && age < 0.6 && !resuming) {
    const sp = judgeSpr[G.lastJ], k = age < 0.08 ? 1.35 - age / 0.08 * 0.35 : 1;
    const w = sp.width / dpr * k, h = sp.height / dpr * k;
    ctx.globalAlpha = age > 0.4 ? (0.6 - age) / 0.2 : 1;
    ctx.drawImage(sp, cx - w / 2, jy - h / 2 + (G.lastJ === 3 ? age * 30 : 0), w, h);
    ctx.globalAlpha = 1;
  }
  // 連擊
  if (G.combo >= 3 && !resuming) {
    const bump = age < 0.1 && G.lastJ < 3 ? 1 + (0.1 - age) * 2 : 1;
    const side = (W - bw) / 2 > 170 && H < W;
    const hs = hitY - topY;
    const ccx = side ? (cx - bw / 2) * 0.5 + 8 : cx;
    const cy = side ? topY + hs * 0.45 : jy - clamp(Math.min(bw * 0.26, hs * 0.28), 64, 140);
    const fs = clamp(Math.min(bw * 0.16, hs * (side ? 0.3 : 0.17)), 30, 76) * bump;
    ctx.font = `900 ${fs}px ${FONT}`;
    ctx.lineWidth = 6; ctx.strokeStyle = 'rgba(40,10,90,0.9)';
    ctx.strokeText(String(G.combo), ccx, cy);
    ctx.fillStyle = G.combo >= 100 ? '#ffe36a' : '#ffffff';
    ctx.fillText(String(G.combo), ccx, cy);
    ctx.font = `900 ${clamp(fs * 0.28, 12, 20)}px ${FONT}`;
    ctx.fillStyle = '#ff9fe8';
    ctx.fillText('COMBO 連擊', ccx, cy + fs * 0.62);
  }
  if (mile.t > 0) {
    const k = 1 - mile.t;
    ctx.globalAlpha = Math.min(1, mile.t * 2);
    ctx.font = `900 italic ${clamp(bw * 0.09, 24, 44) * (1 + k * 0.3)}px ${FONT}`;
    ctx.fillStyle = '#ffe36a';
    ctx.fillText(mile.n + ' 連擊！好厲害！', cx, topY + (hitY - topY) * 0.25);
    ctx.globalAlpha = 1;
  }
  // 開頭提示
  if (pos < 0.2 && G.notes.length && G.notes[0].t - pos > 0.3) {
    const tl = G.notes[0].t - pos;
    ctx.font = `900 ${clamp(bw * 0.12, 30, 56)}px ${FONT}`;
    ctx.lineWidth = 6; ctx.strokeStyle = 'rgba(40,10,90,0.9)';
    const txt = pos < -0.4 ? '準備…' : 'GO!';
    ctx.globalAlpha = clamp(tl, 0, 1);
    ctx.strokeText(txt, cx, hitY - (hitY - topY) * 0.55); ctx.fillStyle = '#7ff0ff'; ctx.fillText(txt, cx, hitY - (hitY - topY) * 0.55);
    ctx.globalAlpha = 1;
  }
  if (resuming) {
    ctx.fillStyle = 'rgba(8,3,24,0.55)'; ctx.fillRect(0, 0, W, H);
    ctx.font = `900 ${clamp(bw * 0.06, 18, 26)}px ${FONT}`; ctx.fillStyle = '#ffd0f4';
    ctx.fillText('準備繼續…', cx, H * 0.42 - clamp(bw * 0.2, 50, 100));
    const left = Math.ceil((resumeAt - now) / 600);
    ctx.font = `900 ${clamp(bw * 0.3, 60, 140)}px ${FONT}`;
    ctx.lineWidth = 8; ctx.strokeStyle = 'rgba(40,10,90,0.9)';
    ctx.strokeText(String(Math.max(1, left)), cx, H * 0.42); ctx.fillStyle = '#ffffff'; ctx.fillText(String(Math.max(1, left)), cx, H * 0.42);
  }
}

/* =====================================================================
 * 主迴圈
 * ===================================================================== */
let resumeAt = 0, endTimer = 0;
function frame(now) {
  requestAnimationFrame(frame);
  const dt = Math.min(0.05, (now - lastFrame) / 1000);
  lastFrame = now;
  if (AC) {
    const want = KG.isMuted() ? 0 : 1;
    if (master.gain.value !== want && !master._t) { master.gain.setTargetAtTime(want, AC.currentTime, 0.02); master._t = 1; setTimeout(() => { master._t = 0; }, 120); }
  }
  Player.pump();
  if (state === 'play' || state === 'pause' || state === 'resuming') {
    if (state === 'resuming' && now >= resumeAt) {
      state = 'play';
      if (AC) AC.resume();
    }
    const exact = songPosNow();
    if (state === 'play') {
      // 畫面時間平滑：用 rAF 推進，再慢慢對齊音訊時鐘
      visPos += dt;
      if (Math.abs(visPos - exact) > 0.035) visPos = exact; else visPos += (exact - visPos) * 0.15;
      const r = updateGame(exact);
      if (r) onRunEnd(r);
      updateFx(dt);
    } else visPos = exact;
    drawScene(visPos, getBuilt(G.si).spb, true);
  } else {
    updateFx(dt);
    let spb = 0.5, pos;
    if (Player.on && Player.preview && AC) { spb = Player.B.spb; pos = Player.heardPos(); }
    else { idlePos += dt; pos = idlePos; }
    drawScene(pos, spb, false);
    if (state === 'calib') Calib.draw();
  }
}

/* =====================================================================
 * 輸入
 * ===================================================================== */
function laneAtX(clientX) {
  const r = cv.getBoundingClientRect();
  const x = (clientX - r.left) * W / r.width;
  return clamp(Math.floor((x - (cx - bw / 2)) / laneW), 0, 3);
}
function laneFrac(clientX) {
  const r = cv.getBoundingClientRect();
  return ((clientX - r.left) * W / r.width - (cx - bw / 2)) / laneW;
}
function inputPos(e) {
  if (!AC) return -9;
  let ta = AC.currentTime;
  if (e && e.timeStamp) {
    const lag = (performance.now() - e.timeStamp) / 1000;
    if (lag > 0 && lag < 0.1) ta -= lag;
  }
  return ta - G.startAt - lat();
}
function lanePress(l, t) {
  laneDown[l]++;
  laneGlow[l] = 1;
  if ((state !== 'play' && !G.sim) || G.auto) return;
  pressJudge(l, t);
}
function laneRelease(l, t) {
  laneDown[l] = Math.max(0, laneDown[l] - 1);
  if (laneDown[l] > 0 || (state !== 'play' && !G.sim) || G.auto) return;
  releaseJudge(l, t);
}
const ptrLane = new Map();
cv.addEventListener('pointerdown', (e) => {
  e.preventDefault();
  if (state !== 'play') return;
  const r = cv.getBoundingClientRect();
  const y = (e.clientY - r.top) * H / r.height;
  if (y < H * 0.12) return;
  const l = laneAtX(e.clientX);
  ptrLane.set(e.pointerId, l);
  try { cv.setPointerCapture(e.pointerId); } catch (err) { /* 忽略 */ }
  lanePress(l, inputPos(e));
});
cv.addEventListener('pointermove', (e) => {
  if (!ptrLane.has(e.pointerId) || state !== 'play') return;
  const cur = ptrLane.get(e.pointerId), f = laneFrac(e.clientX);
  if (Math.abs(f - (cur + 0.5)) > 0.78) {
    const nl = clamp(Math.floor(f), 0, 3);
    if (nl !== cur) { const t = inputPos(e); laneRelease(cur, t); ptrLane.set(e.pointerId, nl); lanePress(nl, t); }
  }
});
function ptrEnd(e) {
  if (!ptrLane.has(e.pointerId)) return;
  const l = ptrLane.get(e.pointerId);
  ptrLane.delete(e.pointerId);
  laneRelease(l, inputPos(e));
}
cv.addEventListener('pointerup', ptrEnd);
cv.addEventListener('pointercancel', ptrEnd);
cv.addEventListener('lostpointercapture', ptrEnd);
cv.addEventListener('contextmenu', (e) => e.preventDefault());

const KEYMAP = { KeyD: 0, KeyF: 1, KeyJ: 2, KeyK: 3, ArrowLeft: 0, ArrowDown: 1, ArrowUp: 2, ArrowRight: 3, KeyS: 0, KeyL: 3 };
const keyHeld = new Set();
window.addEventListener('keydown', (e) => {
  if (state === 'calib' && (e.code === 'Space' || KEYMAP[e.code] != null)) { e.preventDefault(); if (!e.repeat) Calib.tap(e); return; }
  if (state === 'play' && KEYMAP[e.code] != null) {
    e.preventDefault();
    if (e.repeat || keyHeld.has(e.code)) return;
    keyHeld.add(e.code);
    lanePress(KEYMAP[e.code], inputPos(e));
    return;
  }
  if ((e.code === 'Escape' || e.code === 'KeyP') && (state === 'play' || state === 'resuming')) { e.preventDefault(); pauseGame(); return; }
  if (e.code === 'Escape' && state === 'pause') { e.preventDefault(); resumeGame(); return; }
  if (state === 'select') {
    if (e.code === 'ArrowUp' || e.code === 'ArrowDown') { e.preventDefault(); moveSel(e.code === 'ArrowUp' ? -1 : 1); }
    else if (e.code === 'ArrowLeft' || e.code === 'ArrowRight') { e.preventDefault(); setDiff(clamp(selD + (e.code === 'ArrowLeft' ? -1 : 1), 0, 2)); }
    else if (e.code === 'Enter' || e.code === 'Space') { e.preventDefault(); goPlay(); }
    else if (e.code === 'Escape') { e.preventDefault(); show('title'); }
  } else if (state === 'title' && (e.code === 'Enter' || e.code === 'Space')) { e.preventDefault(); $('bPlay').click(); }
  else if (state === 'result' && e.code === 'Enter') { e.preventDefault(); $('bAgain').click(); }
});
window.addEventListener('keyup', (e) => {
  if (!keyHeld.has(e.code)) return;
  keyHeld.delete(e.code);
  if (KEYMAP[e.code] != null) laneRelease(KEYMAP[e.code], inputPos(e));
});
window.addEventListener('blur', () => { releaseAllInput(); });
function releaseAllInput() {
  const t = state === 'play' ? songPosNow() : 0;
  for (const code of keyHeld) { if (KEYMAP[code] != null) laneRelease(KEYMAP[code], t); }
  keyHeld.clear();
  for (const [, l] of ptrLane) laneRelease(l, t);
  ptrLane.clear();
  for (let l = 0; l < 4; l++) laneDown[l] = 0;
}

/* =====================================================================
 * 流程
 * ===================================================================== */
const SCREENS = { title: 'sTitle', select: 'sSelect', settings: 'sSettings', calib: 'sCalib', pause: 'sPause', result: 'sResult' };
let prevMenu = 'title';
function show(name) {
  for (const k in SCREENS) $(SCREENS[k]).classList.toggle('on', k === name);
  $('pauseBtn').classList.toggle('on', name === 'play' || name === 'resuming');
  if (name !== 'calib' && state === 'calib') Calib.stop();
  state = name;
  if (name === 'select') { renderList(); startPreview(); }
  if (name === 'title' && Player.preview) startPreview();
}
function startPreview() {
  if (!AC || AC.state !== 'running') { if (AC && !document.hidden) AC.resume().then(() => { if (state === 'select' || state === 'title') startPreview(); }); return; }
  const B = getBuilt(selS);
  if (Player.on && Player.preview && Player.si === selS) return;
  const from = B.firstPhraseT, to = Math.min(B.dur - B.spb * 4, from + B.spb * 32);
  Player.start(selS, { preview: true, from, loop: to });
}
function startGame(si, d) {
  ensureAudio();
  if (AC.state !== 'running') AC.resume();
  clearTimeout(endTimer);
  Player.stop();
  setupRun(si, d, false);
  for (const p of parts) p.on = false;
  const first = G.notes.length ? G.notes[0].t : 2;
  const lead = Math.max(1.2, travelT() + 0.6 - first);
  G.startAt = AC.currentTime + 0.15 + lead;
  Player.start(si, { startAt: G.startAt, from: 0 });
  visPos = songPosNow();
  releaseAllInput();
  show('play');
  KG.sound('whoosh');
}
function pauseGame() {
  if (state !== 'play' && state !== 'resuming') return;
  releaseAllInput();
  show('pause');
  if (AC) AC.suspend();
}
function resumeGame() {
  if (state !== 'pause') return;
  show('resuming');
  resumeAt = performance.now() + 1800;
}
function onRunEnd(r) {
  releaseAllInput();
  const s = summary();
  if (r === 'fail') {
    Player.stop(1.2);
    KG.sound('lose');
  }
  state = 'ending';
  $('pauseBtn').classList.remove('on');
  endTimer = setTimeout(() => showResult(s), r === 'fail' ? 900 : 500);
}
function showResult(s) {
  Player.stop(0.5);
  const S = SONGS[G.si], id = S.id;
  const old = rec(id, G.d);
  let isNew = false;
  if (!G.auto) {
    records[id] = records[id] || {};
    const cur = records[id][G.d] || { score: 0, acc: 0, grade: '', stars: 0, fc: false, ap: false, combo: 0 };
    if (s.score > cur.score) { cur.score = s.score; cur.acc = s.acc; cur.grade = s.grade; isNew = !!old || s.score > 0; }
    cur.stars = Math.max(cur.stars, s.stars);
    cur.fc = cur.fc || s.fc; cur.ap = cur.ap || s.ap; cur.combo = Math.max(cur.combo, s.maxCombo);
    if (!cur.grade || 'FCBAS'.indexOf(s.grade) > 'FCBAS'.indexOf(cur.grade)) cur.grade = s.grade;
    records[id][G.d] = cur;
    Save.set('records', records);
    KG.best(SLUG + ':' + id + ':' + G.d, s.score);
  }
  $('rSong').innerHTML = esc(S.title) + `<span class="r-diff" style="background:${DIFF_COL[G.d]}">${DIFF_NAMES[G.d]}</span>`;
  const gEl = $('rGrade');
  gEl.textContent = s.grade === 'F' ? '加油' : s.grade;
  gEl.style.fontSize = s.grade === 'F' ? '64px' : '';
  gEl.style.setProperty('--gc', { S: '#ffe36a', A: '#ff7fe0', B: '#5fe8ff', C: '#9dff8a', F: '#a99fd9' }[s.grade]);
  gEl.classList.remove('pop'); void gEl.offsetWidth; gEl.classList.add('pop');
  const badge = $('rBadge');
  badge.className = 'r-badge' + (s.failed ? ' fail' : '');
  badge.textContent = s.failed ? '挑戰失敗，再試一次！' : s.ap ? 'ALL PERFECT 全部完美！' : s.fc ? 'FULL COMBO 全連擊！' : '過關！';
  let st = '';
  for (let i = 0; i < 3; i++) st += i < s.stars ? '★' : '<span class="off">★</span>';
  $('rStars').innerHTML = st;
  $('rNew').textContent = G.auto ? '自動演奏不會記錄成績' : isNew ? '新紀錄！' : (old ? '最佳：' + old.score : '');
  $('rGrid').innerHTML = [0, 1, 2, 3].map(j => `<div><b style="color:${JCOL[j]}">${s.counts[j]}</b><small style="color:${JCOL[j]}">${JNAME[j]}</small></div>`).join('');
  $('rMeta').innerHTML = `<span>準確率 <b>${(s.acc * 100).toFixed(1)}%</b></span><span>最大連擊 <b>${s.maxCombo}</b></span>` +
    (G.early + G.late > 0 ? `<span>偏${G.early > G.late ? '早' : '晚'} <b>${Math.max(G.early, G.late)}</b></span>` : '');
  show('result');
  // 分數跳動
  const t0 = performance.now(), sEl = $('rScore');
  (function up(n) { const k = Math.min(1, (n - t0) / 900); sEl.textContent = Math.round(s.score * (1 - Math.pow(1 - k, 3))).toLocaleString('en-US'); if (k < 1 && state === 'result') requestAnimationFrame(up); })(t0);
  if (!s.failed) { KG.sound('win'); if (s.grade === 'S' || s.grade === 'A' || s.fc) KG.confetti(); }
  else KG.sound('lose');
}
function esc(s) { return String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }

/* ---------- 選歌畫面 ---------- */
let selS = Save.get('selS', 0), selD = Save.get('selD', 0);
if (!(selS >= 0 && selS < SONGS.length)) selS = 0;
const LOCK_SVG = '<svg width="16" height="18" viewBox="0 0 16 18" aria-hidden="true"><rect x="1" y="8" width="14" height="10" rx="3" fill="#ffe36a"/><path d="M4 8V5a4 4 0 0 1 8 0v3" stroke="#ffe36a" stroke-width="2.4" fill="none"/></svg>';
function unlocked(i) { return totalStars() >= SONGS[i].need || unlockAll; }
let unlockAll = false;
function fmtDur(s) { s = Math.round(s); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); }
function renderList() {
  const list = $('songList');
  if (!list.children.length) {
    SONGS.forEach((S, i) => {
      const b = document.createElement('button');
      b.className = 'song'; b.dataset.i = i; b.style.setProperty('--c', S.color);
      b.innerHTML = `<span class="disc"></span><span class="info"><b>${esc(S.title)}</b><small>${esc(S.sub)} · BPM ${S.bpm} · ${fmtDur(getBuilt(i).dur)}</small></span>` +
        `<span class="rec"><span class="lv"></span><span class="gr"></span><span class="st"></span></span><span class="lockTag">${LOCK_SVG}<span></span></span>`;
      b.addEventListener('click', () => pickSong(i));
      list.appendChild(b);
    });
  }
  const stars = totalStars();
  $('starTot').textContent = '★ ' + stars;
  [...$('tabs').children].forEach((t, i) => t.classList.toggle('sel', i === selD));
  [...list.children].forEach((b, i) => {
    const S = SONGS[i], lock = !unlocked(i), r = rec(S.id, selD), C = makeChart(i, selD);
    b.classList.toggle('locked', lock);
    b.classList.toggle('sel', i === selS);
    b.querySelector('.lockTag span').textContent = '需要 ' + S.need + ' ★';
    const lv = b.querySelector('.lv'); lv.textContent = 'Lv.' + C.level; lv.style.setProperty('--dc', DIFF_COL[selD]);
    b.querySelector('.gr').textContent = r ? (r.ap ? 'AP ' : r.fc ? 'FC ' : '') + (r.grade === 'F' ? '' : r.grade) + ' ' + r.score : '尚未遊玩';
    b.querySelector('.st').innerHTML = [0, 1, 2].map(k => r && k < r.stars ? '★' : '<span class="off">★</span>').join('');
  });
  updateDetail();
}
function updateDetail() {
  const S = SONGS[selS], C = makeChart(selS, selD), r = rec(S.id, selD);
  $('det').innerHTML = unlocked(selS)
    ? `<b>${esc(S.title)}</b>・${DIFF_NAMES[selD]} Lv.${C.level}・${C.notes.length} 個音符${C.holds ? '（' + C.holds + ' 長按）' : ''}${r ? '<br>最佳 <b>' + r.score + '</b>・最大連擊 ' + r.combo : ''}`
    : `再收集 <b>${S.need - totalStars()}</b> 顆星星就能解鎖！`;
  $('bGo').style.opacity = unlocked(selS) ? 1 : 0.5;
}
function pickSong(i) {
  if (selS === i && unlocked(i)) { goPlay(); return; }
  selS = i; Save.set('selS', i);
  KG.sound(unlocked(i) ? 'click' : 'wrong');
  renderList();
  startPreview();
}
function moveSel(dir) {
  selS = (selS + dir + SONGS.length) % SONGS.length; Save.set('selS', selS);
  renderList(); startPreview();
  const b = $('songList').children[selS]; if (b) b.scrollIntoView({ block: 'nearest' });
}
function setDiff(d) { selD = d; Save.set('selD', d); KG.sound('tick'); renderList(); }
function goPlay() {
  if (!unlocked(selS)) { KG.sound('wrong'); KG.toast('還需要 ' + (SONGS[selS].need - totalStars()) + ' 顆星星喔！'); return; }
  startGame(selS, selD);
}

/* ---------- 校正 ---------- */
const Calib = {
  on: false, startAt: 0, period: 0.5, k: 0, taps: [], result: null,
  start() {
    ensureAudio(); if (AC.state !== 'running') AC.resume();
    Player.stop();
    this.on = true; this.startAt = AC.currentTime + 0.4; this.k = 0; this.taps = []; this.result = null;
    $('calCount').textContent = '0 / 16'; $('calRes').textContent = '跟著「嗒」聲點圓圈';
  },
  stop() { this.on = false; },
  pump() {
    if (!this.on || !AC || AC.state !== 'running') return;
    const ahead = AC.currentTime + LOOKAHEAD;
    while (this.startAt + this.k * this.period < ahead) {
      const at = this.startAt + this.k * this.period, acc = this.k % 4 === 0;
      const o = AC.createOscillator(), g = AC.createGain();
      o.type = 'triangle'; o.frequency.value = acc ? 1760 : 1175;
      g.gain.setValueAtTime(0.4, at); g.gain.exponentialRampToValueAtTime(0.001, at + 0.07);
      o.connect(g); g.connect(sfxBus); o.start(at); o.stop(at + 0.08);
      const k2 = AC.createOscillator(), g2 = AC.createGain();
      k2.frequency.setValueAtTime(140, at); k2.frequency.exponentialRampToValueAtTime(50, at + 0.1);
      g2.gain.setValueAtTime(0.6, at); g2.gain.exponentialRampToValueAtTime(0.001, at + 0.15);
      k2.connect(g2); g2.connect(sfxBus); k2.start(at); k2.stop(at + 0.16);
      this.k++;
    }
  },
  tap(e) {
    if (!this.on || !AC) return;
    let ta = AC.currentTime;
    if (e && e.timeStamp) { const lag = (performance.now() - e.timeStamp) / 1000; if (lag > 0 && lag < 0.1) ta -= lag; }
    const rel = ta - outLat() - this.startAt, k = Math.round(rel / this.period);
    const ring = $('calRing'); ring.style.borderColor = '#ffe36a'; setTimeout(() => { ring.style.borderColor = ''; }, 90);
    if (k < 2 || this.taps.length >= 16) return;
    this.taps.push((rel - k * this.period) * 1000);
    const n = this.taps.length;
    $('calCount').textContent = n + ' / 16';
    const sorted = this.taps.slice().sort((a, b) => a - b);
    const cut = Math.floor(n * 0.2), mid = sorted.slice(cut, n - cut || n);
    const avg = mid.reduce((a, b) => a + b, 0) / mid.length;
    this.result = Math.round(avg / 5) * 5;
    $('calRes').textContent = (n >= 16 ? '完成！建議偏移：' : '目前測到：') + (this.result > 0 ? '+' : '') + this.result + ' ms' + (n >= 16 ? '（按「套用」）' : '');
  },
  draw() {
    if (!this.on || !AC) return;
    const ph = (((AC.currentTime - outLat() - this.startAt) / this.period) % 1 + 1) % 1;
    const s = 1 + 0.22 * Math.exp(-ph * 7);
    $('calRing').style.transform = 'scale(' + s.toFixed(3) + ')';
  }
};
$('calPad').addEventListener('pointerdown', (e) => { e.preventDefault(); Calib.tap(e); });

/* ---------- 設定 ---------- */
function syncSettingsUI() {
  $('rSpeed').value = settings.speed; $('vSpeed').textContent = settings.speed.toFixed(1);
  $('rOff').value = settings.offset; $('vOff').textContent = (settings.offset > 0 ? '+' : '') + settings.offset + ' ms';
  $('cHit').checked = !!settings.hitsound;
}
$('rSpeed').addEventListener('input', () => { settings.speed = +$('rSpeed').value; saveSettings(); syncSettingsUI(); });
$('rOff').addEventListener('input', () => { settings.offset = +$('rOff').value; saveSettings(); syncSettingsUI(); });
$('cHit').addEventListener('change', () => { settings.hitsound = $('cHit').checked; saveSettings(); KG.sound('click'); });

/* ---------- 按鈕 ---------- */
function btn(id, fn) { $(id).addEventListener('click', () => { ensureAudio(); if (AC && AC.state !== 'running' && state !== 'pause') AC.resume(); KG.sound('click'); fn(); }); }
btn('bPlay', () => show('select'));
btn('bSet', () => { prevMenu = 'title'; syncSettingsUI(); show('settings'); });
btn('bCal', () => { prevMenu = 'title'; show('calib'); Calib.start(); });
btn('bSet2', () => { prevMenu = 'select'; syncSettingsUI(); show('settings'); });
btn('bSetOk', () => show(prevMenu));
btn('bCal2', () => { show('calib'); Calib.start(); });
btn('bCalRe', () => Calib.start());
btn('bCalOk', () => {
  if (Calib.result != null && Calib.taps.length >= 6) {
    settings.offset = clamp(Calib.result, -150, 300); saveSettings();
    KG.toast('已設定延遲補償 ' + settings.offset + ' ms');
  } else KG.toast('多點幾下再套用喔！');
  Calib.stop(); syncSettingsUI(); show('settings');
});
btn('bCalBack', () => { Calib.stop(); syncSettingsUI(); show('settings'); });
btn('bBack', () => show('title'));
btn('bGo', () => goPlay());
btn('bResume', () => resumeGame());
btn('bRestart', () => startGame(G.si, G.d));
btn('bQuit', () => { Player.stop(); show('select'); });
btn('bAgain', () => startGame(G.si, G.d));
btn('bSongs', () => show('select'));
$('pauseBtn').addEventListener('click', () => { KG.sound('click'); pauseGame(); });
[...$('tabs').children].forEach((t) => t.addEventListener('click', () => setDiff(+t.dataset.d)));
if (isTouch) $('tHint').innerHTML = '音符碰到發光線時，點一下那一條軌道！<br>長音符要一直按住喔。';

/* ---------- 分頁隱藏時暫停（音訊暫停，回來再同步繼續） ---------- */
document.addEventListener('visibilitychange', () => {
  if (document.hidden) {
    if (state === 'play' || state === 'resuming') pauseGame();
    else if (AC && AC.state === 'running') AC.suspend();
  } else if (AC && state !== 'pause' && state !== 'play' && state !== 'resuming' && state !== 'ending') {
    AC.resume();
  }
});

function onResize() { layout(); }
window.addEventListener('resize', onResize);
window.addEventListener('orientationchange', () => setTimeout(onResize, 120));
if (window.visualViewport) window.visualViewport.addEventListener('resize', onResize);
layout();
requestAnimationFrame(frame);

/* =====================================================================
 * 測試介面
 * ===================================================================== */
function songIdx(s) { return typeof s === 'number' ? s : SONGS.findIndex(x => x.id === s); }
window.__rt = {
  get state() { return state; },
  get G() { return G; },
  get songs() { return SONGS.map((s, i) => ({ i, id: s.id, title: s.title, bpm: s.bpm, need: s.need, dur: getBuilt(i).dur })); },
  start(s, d) { startGame(songIdx(s), d | 0); },
  autoplay(v) { autoFlag = !!v; G.auto = !!v; },
  pos() { return songPosNow(); },
  hit(l, t) { const tt = t == null ? songPosNow() : t; lanePress(l, tt); laneRelease(l, tt); return G.counts.slice(); },
  press(l, t) { lanePress(l, t == null ? songPosNow() : t); },
  release(l, t) { laneRelease(l, t == null ? songPosNow() : t); },
  chart(s, d) { return makeChart(songIdx(s), d).notes.map(n => ({ ...n })); },
  chartInfo(s, d) { const C = makeChart(songIdx(s), d); return { notes: C.notes.length, holds: C.holds, chords: C.chords, total: C.total, level: C.level }; },
  events(s) { return getBuilt(songIdx(s)).ev.map(e => ({ k: e.k, t: e.t, i: e.i })); },
  validate() { return SONGS.flatMap((s, i) => getBuilt(i).problems); },
  judge: judgeDt, WIN, HOLD_EARLY,
  get offset() { return settings.offset; }, set offset(v) { settings.offset = +v; saveSettings(); },
  get speed() { return settings.speed; }, set speed(v) { settings.speed = +v; saveSettings(); },
  get lat() { return lat(); },
  simulate(s, d, opt) { return simulate(songIdx(s), d, opt); },
  summary,
  get sched() { return { log: Player.log, late: Player.late, minAhead: Player.minAhead, startAt: Player.startAt, on: Player.on }; },
  get audio() { return AC ? { state: AC.state, t: AC.currentTime, outputLatency: AC.outputLatency, baseLatency: AC.baseLatency } : null; },
  pause: pauseGame, resume: resumeGame,
  finish() { onRunEnd('end'); },
  unlockAll(v) { unlockAll = v !== false; if (state === 'select') renderList(); },
  show,
  totalStars,
  get calib() { return { startAt: Calib.startAt, period: Calib.period, taps: Calib.taps.slice(), result: Calib.result, outLat: outLat() }; },
  geom() { return { W, H, cx, bw, laneW, hitY, topY, dpr }; },
  get records() { return records; },
  clearRecords() { records = {}; Save.set('records', records); }
};
</script>
