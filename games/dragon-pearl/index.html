<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>龍宮尋珠</title>
<link rel="stylesheet" href="../../assets/common.css">
<style>
  html, body { height: 100%; margin: 0; overflow: hidden; background: #04112a; overscroll-behavior: none; }
  #cv { position: fixed; inset: 0; display: block; width: 100vw; height: 100vh; height: 100dvh; touch-action: none; }
  .dp-font, .ov, .ttl, #pauseBtn { font-family: "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", "Heiti TC", system-ui, sans-serif; }
  #pauseBtn {
    position: fixed; right: 12px; top: 62px; width: 44px; height: 44px; z-index: 9050; display: none;
    border-radius: 50%; border: 3px solid #ffe08a; background: radial-gradient(circle at 35% 30%, #c7344f, #6d0a1f);
    color: #fff3c4; font-size: 18px; font-weight: 900; cursor: pointer; box-shadow: 0 3px 8px rgba(0,0,0,.45); padding: 0;
  }
  #pauseBtn:active { transform: scale(.92); }
  #pauseBtn i { display: inline-block; width: 5px; height: 16px; background: #fff3c4; margin: 0 2px; border-radius: 2px; vertical-align: middle; }

  /* 標題（攻擊模式在後面跑） */
  .ttl { position: fixed; inset: 0; z-index: 9000; pointer-events: none; display: none; flex-direction: column; align-items: center; justify-content: space-between; padding: 64px 12px 14px; box-sizing: border-box; }
  .ttl.on { display: flex; }
  .ttl > * { pointer-events: auto; }
  .logo { text-align: center; padding: 8px 22px 10px; border-radius: 22px; background: linear-gradient(180deg, rgba(120,10,32,.97), rgba(60,4,18,.97)); border: 3px solid #f5c542; box-shadow: 0 6px 20px rgba(0,0,0,.5), inset 0 0 18px rgba(255,200,80,.25); max-width: 92vw; box-sizing: border-box; }
  .logo h1 { margin: 0; font-size: clamp(34px, 9vw, 58px); font-weight: 900; letter-spacing: .08em; line-height: 1.1;
    color: #ffe27a; text-shadow: 0 -1px 0 #fff8d8, 0 2px 0 #c46a00, 0 4px 0 #6a1a00, 0 0 22px rgba(255,200,90,.55); animation: dpBob 2.4s ease-in-out infinite; }
  .logo .sub { color: #bff4ff; font-weight: 800; font-size: clamp(13px, 3.4vw, 17px); letter-spacing: .12em; margin-top: 2px; }
  .logo .wallet { color: #ffe9a8; font-weight: 800; font-size: 14px; margin-top: 4px; }
  .ttl.land { flex-direction: row; align-items: center; padding: 64px 8px 8px; }
  .ttl.land .logo, .ttl.land .tbtns { width: var(--sw, 260px); max-width: none; }
  .ttl.land .logo { padding: 8px 8px 10px; }
  .ttl.land .logo h1 { font-size: min(64px, calc(var(--sw, 260px) * 0.19)); }
  .ttl.land .logo .sub { font-size: min(16px, calc(var(--sw, 260px) * 0.062)); letter-spacing: .04em; }
  .ttl.land .btn.sm { flex: 1 1 40%; }
  .ttl.land .btn.big { font-size: 20px; padding: 10px 12px; }
  .ttl.land .tbtns { padding: 8px; gap: 6px; }
  .btn.sm { white-space: nowrap; }
  @keyframes dpBob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }
  .tbtns { display: flex; flex-direction: column; align-items: center; gap: 8px; width: min(460px, 100%); padding: 10px; border-radius: 22px; background: rgba(4,14,40,.72); border: 2px solid rgba(245,197,66,.6); box-sizing: border-box; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; width: 100%; }
  .btn { font: inherit; font-weight: 900; font-size: 16px; color: #fff; border: none; border-radius: 16px; padding: 10px 14px; min-height: 44px; cursor: pointer;
    background: linear-gradient(180deg, #4f8df5, #2457c9); box-shadow: 0 4px 0 #173a86, 0 6px 12px rgba(0,0,0,.3); text-shadow: 0 1px 0 rgba(0,0,0,.3); }
  .btn:active { transform: translateY(3px); box-shadow: 0 1px 0 #173a86; }
  .btn.big { font-size: 22px; padding: 12px 30px; width: 100%; background: linear-gradient(180deg, #ff6b6b, #d1263b); box-shadow: 0 5px 0 #7d0c1d, 0 8px 16px rgba(0,0,0,.35); animation: dpPulse 1.6s ease-in-out infinite; }
  @keyframes dpPulse { 0%,100% { filter: brightness(1); } 50% { filter: brightness(1.18); } }
  .btn.gold { background: linear-gradient(180deg, #ffd24a, #e39a12); color: #5a2c00; text-shadow: none; box-shadow: 0 4px 0 #9a5a00, 0 6px 12px rgba(0,0,0,.3); }
  .btn.green { background: linear-gradient(180deg, #4fd27a, #1f9a4c); box-shadow: 0 4px 0 #0f6330, 0 6px 12px rgba(0,0,0,.3); }
  .btn.gray { background: linear-gradient(180deg, #9aa7bd, #66738c); box-shadow: 0 4px 0 #3c475c, 0 6px 12px rgba(0,0,0,.3); }
  .btn.red { background: linear-gradient(180deg, #ff6b6b, #d1263b); box-shadow: 0 4px 0 #7d0c1d, 0 6px 12px rgba(0,0,0,.3); }
  .btn.sm { font-size: 15px; padding: 8px 10px; flex: 1 1 0; min-width: 0; }
  .btn.glow { animation: dpPulse 1s ease-in-out infinite; }
  .btn[disabled] { opacity: .45; cursor: default; }

  /* 面板 */
  .ov { position: fixed; inset: 0; z-index: 9100; display: none; align-items: center; justify-content: center; background: rgba(2,8,26,.66); padding: 64px 12px 12px; box-sizing: border-box; }
  .ov.on { display: flex; }
  .panel { width: min(460px, 100%); max-height: 100%; display: flex; flex-direction: column; border-radius: 22px; overflow: hidden;
    background: linear-gradient(180deg, #fff9e8, #ffe7b0); border: 4px solid #e0a72a; box-shadow: 0 10px 30px rgba(0,0,0,.5); color: #4a2410; }
  .panel.wide { width: min(640px, 100%); }
  .panel h2 { margin: 0; padding: 10px 14px; text-align: center; font-size: 22px; font-weight: 900; color: #fff6d6; background: linear-gradient(180deg, #b3193a, #7a0c22); border-bottom: 3px solid #e0a72a; letter-spacing: .06em; flex: none; }
  .panel .body { overflow-y: auto; flex: 1 1 auto; padding: 12px 14px; font-weight: 700; font-size: 16px; line-height: 1.55; -webkit-overflow-scrolling: touch; overscroll-behavior: contain; touch-action: pan-y; }
  .panel .foot { flex: none; display: flex; gap: 8px; padding: 10px 12px 12px; flex-wrap: wrap; justify-content: center; background: rgba(224,167,42,.18); }
  .panel .foot .btn { flex: 1 1 120px; }
  .center { text-align: center; }
  .bigNum { font-size: 34px; font-weight: 900; color: #b3193a; text-align: center; }
  .stats { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; }
  .stats b { color: #b3193a; }
  .tabs { display: flex; gap: 6px; padding: 8px 12px 0; flex: none; }
  .tab { flex: 1; font: inherit; font-weight: 900; font-size: 15px; border: 2px solid #e0a72a; background: #fff3d0; color: #7a3b00; border-radius: 12px 12px 0 0; padding: 7px 4px; cursor: pointer; min-height: 40px; }
  .tab.on { background: #b3193a; color: #fff6d6; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(124px, 1fr)); gap: 10px; }
  .item { background: #fffdf5; border: 2px solid #ecc46a; border-radius: 14px; padding: 6px; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 4px; }
  .item canvas { width: 96px; height: 72px; }
  .item .nm { font-weight: 900; font-size: 15px; }
  .item .btn { font-size: 14px; padding: 6px 8px; min-height: 36px; width: 100%; }
  .tix { display: inline-flex; align-items: center; gap: 6px; font-weight: 900; color: #7a3b00; background: #fff3c4; border: 2px solid #e0a72a; border-radius: 999px; padding: 2px 12px; }
  .note { font-size: 14px; color: #7a5a3a; }
  .hb { display: block; margin: 6px 0; }
  .hb b { color: #b3193a; }
  #aqua { width: 100%; height: auto; display: block; border-radius: 12px; }
</style>
</head>
<body>
<canvas id="cv" aria-label="龍宮尋珠"></canvas>
<button id="pauseBtn" aria-label="暫停"><i></i><i></i></button>

<div class="ttl" id="title">
  <div class="logo">
    <h1>龍宮尋珠</h1>
    <div class="sub">深海龍宮．珍珠彈珠台</div>
    <div class="wallet" id="tWallet"></div>
  </div>
  <div class="tbtns">
    <button class="btn big" id="bStart">投幣開始</button>
    <div class="row">
      <button class="btn sm gold" id="bShop">兌換櫃台</button>
      <button class="btn sm" id="bAqua">水族櫃</button>
      <button class="btn sm" id="bStats">紀錄</button>
      <button class="btn sm" id="bHelp">玩法</button>
    </div>
    <div class="row">
      <button class="btn sm green" id="bMusic">音樂 開</button>
      <button class="btn sm green" id="bSfx">音效 開</button>
      <button class="btn sm red" id="bRed">每日紅包</button>
    </div>
  </div>
</div>

<div class="ov" id="ovPause"><div class="panel">
  <h2>暫停</h2>
  <div class="body center">
    <div class="row"><button class="btn sm green" id="pMusic">音樂 開</button><button class="btn sm green" id="pSfx">音效 開</button></div>
    <p class="note" id="pInfo"></p>
    <div class="row"><button class="btn sm gold" id="pShop">兌換櫃台</button><button class="btn sm" id="pHelp">玩法</button></div>
  </div>
  <div class="foot"><button class="btn gray" id="pQuit">收工結算</button><button class="btn green" id="pResume">繼續玩</button></div>
</div></div>

<div class="ov" id="ovShop"><div class="panel wide">
  <h2>兌換櫃台</h2>
  <div class="tabs"><button class="tab on" data-t="fig">海洋公仔</button><button class="tab" data-t="theme">機台外觀</button><button class="tab" data-t="skin">珍珠造型</button></div>
  <div class="body"><div class="center" style="margin-bottom:8px"><span class="tix" id="shopTix"></span></div><div class="grid" id="shopGrid"></div>
  <p class="note center">彩票只能在遊戲裡換獎品，都是收藏用的小東西喔。</p></div>
  <div class="foot"><button class="btn" id="shopAqua">看水族櫃</button><button class="btn green" id="shopClose">完成</button></div>
</div></div>

<div class="ov" id="ovAqua"><div class="panel wide">
  <h2>我的水族櫃</h2>
  <div class="body"><canvas id="aqua" width="600" height="420"></canvas><p class="center note" id="aquaNote"></p></div>
  <div class="foot"><button class="btn gold" id="aquaShop">去兌換</button><button class="btn green" id="aquaClose">關閉</button></div>
</div></div>

<div class="ov" id="ovInfo"><div class="panel">
  <h2 id="infoTitle">紀錄</h2>
  <div class="body" id="infoBody"></div>
  <div class="foot" id="infoFoot"><button class="btn green" id="infoClose">好</button></div>
</div></div>

<script src="../../assets/common.js"></script>
<script src="../../assets/kg-music.js"></script>
<script>
'use strict';
/* =====================================================================
 * 龍宮尋珠：原創的深海龍宮珍珠彈珠台（代幣機台）
 * 珍珠打進海螺口、龍王嘴巴、五色龍珠門，湊齊龍珠進入「龍宮寶藏」
 * 只用遊戲裡的代幣和彩票，沒有真錢、沒有購買
 * ===================================================================== */
(function () {
const SLUG = 'dragon-pearl';
const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
const FONT = '"PingFang TC","Noto Sans TC","Microsoft JhengHei","Heiti TC",system-ui,sans-serif';
const TAU = Math.PI * 2;
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const lerp = (a, b, t) => a + (b - a) * t;
const rand = (a, b) => a + Math.random() * (b - a);
const $ = id => document.getElementById(id);
const outCubic = t => 1 - Math.pow(1 - t, 3);
const outBack = t => { const c = 1.70158, c3 = c + 1; return 1 + c3 * Math.pow(t - 1, 3) + c * Math.pow(t - 1, 2); };
let W = 360, H = 640, dpr = 1, time = 0;

/* ---------- 存檔 ---------- */
const Save = {
  get: (k, d) => KG.store.get(SLUG + ':' + k, d),
  set: (k, v) => KG.store.set(SLUG + ':' + k, v)
};
const START_COINS = 100, REFILL_CAP = 50, REFILL_SEC = 30, JP_SEED = 100, JP_RATE = 0.05, GATE_NEED = 2;
let coins = Save.get('coins', START_COINS);
let tickets = Save.get('tickets', 0);
let freePearls = Save.get('free', 0);
let lit = Save.get('lit', [0, 0, 0, 0, 0]);
let litProg = Save.get('litProg', [0, 0, 0, 0, 0]);
let owned = Save.get('owned', {});
let theme = Save.get('theme', 'red');
let skin = Save.get('skin', 'white');
let power = Save.get('power', 0.55);
let stats = Object.assign({ shots: 0, won: 0, bigWin: 0, bonuses: 0, jackpots: 0, spins: 0, gates: 0, pockets: 0, playSec: 0 }, Save.get('stats', {}));
let refillAt = Save.get('refillAt', 0);
let jackpot = KG.store.get('dragon-pearl:jackpot', JP_SEED);
if (!isFinite(coins) || coins < 0) coins = START_COINS;
if (!Array.isArray(lit) || lit.length !== 5) lit = [0, 0, 0, 0, 0];
if (!Array.isArray(litProg) || litProg.length !== 5) litProg = [0, 0, 0, 0, 0];
let saveDirty = false, saveT = 0;
function saveAll() {
  Save.set('coins', coins); Save.set('tickets', tickets); Save.set('free', freePearls); Save.set('lit', lit); Save.set('litProg', litProg);
  Save.set('stats', stats); Save.set('refillAt', refillAt); Save.set('power', +power.toFixed(3));
  KG.store.set('dragon-pearl:jackpot', +jackpot.toFixed(2));
  saveDirty = false;
}
function dirty() { saveDirty = true; }
function todayStr() { const d = new Date(); return d.getFullYear() + '-' + (d.getMonth() + 1) + '-' + d.getDate(); }
function dailyReady() { return Save.get('daily', '') !== todayStr(); }

/* 免費補給：代幣少於 50 時，每 30 秒送 1 枚（離開時也會累積） */
function refillTick() {
  const now = Date.now();
  if (coins >= REFILL_CAP) { refillAt = 0; return; }
  if (!refillAt) { refillAt = now + REFILL_SEC * 1000; dirty(); return; }
  if (now >= refillAt) {
    const n = Math.min(REFILL_CAP - coins, 1 + Math.floor((now - refillAt) / (REFILL_SEC * 1000)));
    coins += n; shownCoins += n; refillAt = coins < REFILL_CAP ? now + REFILL_SEC * 1000 : 0;
    if (scene === 'play') { trayCoin(1); sfx('dp_coin', { vol: 0.8 }); }
    dirty();
  }
}
function refillLeft() { return refillAt ? Math.max(0, Math.ceil((refillAt - Date.now()) / 1000)) : 0; }
let shownCoins = coins;

/* =====================================================================
 * 聲音：原創配樂（D 宮調五聲音階節慶流行、B 羽調夢幻標題曲）與音效
 * ===================================================================== */
const S = KG.sfx, M = KG.music;
let sfxOn = Save.get('sfx', true) !== false;
const sfxLast = Object.create(null);
function sfx(name, o) {
  if (!sfxOn || !S) return;
  o = o || {};
  const now = performance.now();
  if (now - (sfxLast[name] || 0) < (o.gap || 40)) return;
  sfxLast[name] = now;
  const p = (o.pitch || 1) * (o.exact ? 1 : 0.95 + Math.random() * 0.1);
  S.play(name, { vol: o.vol, pitch: p, pan: o.pan });
}
function jingle(def) { if (sfxOn && M) M.jingle(def); }

if (M) {
  // 古箏般的撥弦：亮亮的起音、尾巴輕輕往上推
  M.INST.zheng = function (f, t, d, v, out) {
    const A = out.context, g = A.createGain();
    const p = A.createStereoPanner ? A.createStereoPanner() : null;
    if (p) { p.pan.value = -0.2; g.connect(p); p.connect(out); } else g.connect(out);
    const peak = v * 0.19, end = t + Math.min(1.3, d + 0.55);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(peak, t + 0.003);
    g.gain.exponentialRampToValueAtTime(peak * 0.3, t + 0.2);
    g.gain.exponentialRampToValueAtTime(0.0001, end);
    const fl = A.createBiquadFilter(); fl.type = 'lowpass'; fl.Q.value = 2.5; fl.connect(g);
    fl.frequency.setValueAtTime(Math.min(7500, f * 8), t); fl.frequency.exponentialRampToValueAtTime(Math.max(320, f * 1.6), t + 0.45);
    const o = A.createOscillator(); o.type = 'sawtooth';
    o.frequency.setValueAtTime(f, t); o.frequency.setValueAtTime(f, t + 0.14); o.frequency.linearRampToValueAtTime(f * 1.01, t + 0.32); o.frequency.linearRampToValueAtTime(f, t + 0.6);
    const o2 = A.createOscillator(); o2.type = 'triangle'; o2.frequency.value = f * 2;
    const g2 = A.createGain(); g2.gain.value = 0.35; o2.connect(g2); g2.connect(fl);
    o.connect(fl); o.start(t); o2.start(t); o.stop(end + 0.02); o2.stop(end + 0.02);
  };
  // 鑼：不和諧泛音、長尾巴
  M.INST.gong = function (f, t, d, v, out) {
    const A = out.context, g = A.createGain(); g.connect(out);
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(v * 0.16, t + 0.01); g.gain.exponentialRampToValueAtTime(0.0001, t + 2.4);
    [[1, 1], [1.52, 0.5], [2.13, 0.36], [2.61, 0.24], [3.3, 0.14]].forEach(([m, a], i) => {
      const o = A.createOscillator(), og = A.createGain(); o.type = 'sine';
      o.frequency.setValueAtTime(f * m * 1.02, t); o.frequency.exponentialRampToValueAtTime(f * m, t + 0.4);
      og.gain.setValueAtTime(a, t); og.gain.exponentialRampToValueAtTime(0.001, t + 2.4 - i * 0.3);
      o.connect(og); og.connect(g); o.start(t); o.stop(t + 2.45);
    });
  };
}

/* 節慶東方奇幻流行：D 宮調五聲音階、120 bpm、古箏＋笛子＋鑼鼓＋閃亮鈴聲 */
const GAME_MEL = [
  'D5 - E5 F#5 A5 - F#5 E5', 'D5 - B4 - A4 - B4 D5', 'E5 - D5 B4 D5 - E5 -', 'A4 - - - . . E5 F#5',
  'A5 - F#5 A5 B5 - A5 F#5', 'E5 - F#5 E5 D5 - B4 -', 'B4 - D5 E5 D5 B4 A4 B4', 'E5 - - - - . . .',
  'D5 E5 F#5 A5 B5 - A5 F#5', 'A5 - - E5 F#5 - E5 -', 'F#5 - E5 F#5 A5 - F#5 E5', 'D5 - B4 D5 F#5 - - .',
  'E5 - D5 E5 B5 - A5 -', 'A5 - B5 A5 F#5 - E5 -', 'D5 - E5 F#5 E5 - D5 B4', 'D5 - - - . . A4 B4'
];
const GAME_BELL = [
  'A5 . D6 . F#5 . A5 .', 'B5 . F#5 . D6 . B5 .', 'D6 . B5 . G5 . B5 .', 'E6 . C#6 . A5 . E5 .',
  'F#6 . D6 . A5 . D6 .', 'D6 . B5 . F#5 . B5 .', 'E6 . B5 . G5 . B5 .', 'C#6 . A5 . E5 . A5 .'
];
const GONG16 = ['D3', '', '', '', '', '', '', '', 'D3', '', '', '', '', '', '', ''];
const SONG_GAME = {
  bpm: 120, swing: 0.06,
  chords: ['D', 'Bm7', 'G', 'A', 'D', 'Bm7', 'Em7', 'A', 'G', 'A', 'F#m', 'Bm7', 'G', 'A', 'D', 'D'],
  layers: { treasure: false, spin: false },
  tracks: [
    { inst: 'kick', pat: ['X...x...X...x...', 'X...x...X..x.x..'], vol: 0.75 },
    { inst: 'clap', pat: '....x.......x...', vol: 0.4 },
    { inst: 'hat', pat: '..x...x...x...x.', vol: 0.55 },
    { inst: 'tom', pitch: 150, pat: ['................', '................', '................', '..........x.x.xx'], vol: 0.4 },
    { inst: 'gong', seq: GONG16, vol: 0.55 },
    { inst: 'bass', chord: 'R..R..5.R.R.5.8.', vol: 0.75 },
    { inst: 'pad', chord: 'hold', vol: 0.22 },
    { inst: 'zheng', arp: 'updown', rate: 2, oct: 4, vol: 0.32 },
    { inst: 'flute', seq: GAME_MEL, vol: 1.05 },
    { inst: 'zheng', seq: GAME_MEL, transpose: -12, vol: 0.38 },
    { inst: 'bell', seq: GAME_BELL, transpose: -12, layer: 'treasure', vol: 0.6 },
    { inst: 'strings', chord: 'hold', oct: 4, layer: 'treasure', vol: 0.26 },
    { inst: 'shaker', pat: 'xxxxxxxxxxxxxxxx', layer: 'treasure', vol: 0.35 },
    { inst: 'crash', pat: ['X...............', '................'], layer: 'treasure', vol: 0.22 },
    { inst: 'rim', pat: 'x.xxx.xxx.xxx.xx', layer: 'spin', vol: 0.3 },
    { inst: 'tom', pitch: 200, pat: '............x.xx', layer: 'spin', vol: 0.3 }
  ]
};
/* 標題（展示模式）：B 羽調五聲音階、92 bpm，古箏旋律＋鈴聲分解和弦，像在海底慢慢游 */
const TITLE_MEL = [
  'F#5 - - E5 D5 - B4 -', 'D5 - - - E5 - B4 -', 'A4 - D5 - F#5 - A5 -', 'E5 - - - - - . .',
  'B5 - A5 - F#5 - E5 -', 'D5 - E5 - B4 - - -', 'E5 - D5 - B4 - A4 -', 'F#5 - - - E5 - - -'

/* 釘子：交錯格子，避開機關與裝飾，再加上幾根引導釘 */
const PEGS = [];
function buildPegs() {
  PEGS.length = 0;
  const dx = 26, dy = 22;
  let row = 0;
  for (let y = 44; y <= 430; y += dy, row++) {
    for (let x = 22 + (row % 2 ? dx / 2 : 0); x <= 356; x += dx) {
      if (y < ARC.y) {
        const dd = Math.hypot(x - ARC.x, y - ARC.y), aa = Math.atan2(y - ARC.y, x - ARC.x);
        if (dd > ARC.r - 26 || (aa > RAIL_END - 0.12 && dd > RAIL_R - 30)) continue;
      }
      if (x < 30 || x > 348) continue;
      if (Math.hypot(x - HEAD.x, y - HEAD.y) < 50) continue;
      if (GATES.some(g => Math.hypot(x - g.x, y - g.y) < 34)) continue;
      if (POCKETS.some(p => Math.abs(x - p.x) < 24 && y > p.y - 20 && y < p.y + 22)) continue;
      if (Math.abs(y - 318) < 17 && x > 66 && x < 312) continue;
      if (Math.abs(y - 412) < 20 && x > 112 && x < 266) continue;
      if (x > CURRENT.x1 - 6 && x < CURRENT.x2 + 8 && y > CURRENT.y1 - 10 && y < CURRENT.y2 + 10) continue;
      if (DECOR.some(d => Math.hypot(x - d.x, y - d.y) < d.r + 8)) continue;
      if (y > 412) continue;
      PEGS.push({ x, y, kind: 0, hit: 0 });
    }
  }
  // 龍王頭上方的兩根「命釘」、海螺口兩旁的引導釘
  const extra = [];
  extra.push({ x: 175, y: 200, kind: 0, hit: 0 }, { x: 203, y: 200, kind: 0, hit: 0 });
  POCKETS.forEach(p => extra.push({ x: p.x, y: p.y - 24, kind: 0, hit: 0 }));
  GATES.forEach(g => extra.push({ x: g.x, y: g.y - 22, kind: 1, hit: 0, gate: g }));
  GATES.forEach(g => { extra.push({ x: g.x - g.hw - 3, y: g.y, kind: 1, hit: 0, gate: g }, { x: g.x + g.hw + 3, y: g.y, kind: 1, hit: 0, gate: g }); });
  for (let i = PEGS.length - 1; i >= 0; i--) if (extra.some(e => Math.hypot(e.x - PEGS[i].x, e.y - PEGS[i].y) < 23)) PEGS.splice(i, 1);
  PEGS.push(...extra);
}

function collideSeg(p, s, e) {
  const ax = s[0], ay = s[1], bx = s[2], by = s[3], rr = PR + s[4];
  const abx = bx - ax, aby = by - ay, l2 = abx * abx + aby * aby;
  let t = ((p.x - ax) * abx + (p.y - ay) * aby) / l2; t = t < 0 ? 0 : t > 1 ? 1 : t;
  const cx = ax + abx * t, cy = ay + aby * t, dx = p.x - cx, dy = p.y - cy, d2 = dx * dx + dy * dy;
  if (d2 >= rr * rr) return false;
  const d = Math.sqrt(d2) || 0.001, nx = dx / d, ny = dy / d;
  p.x = cx + nx * rr; p.y = cy + ny * rr;
  const vn = p.vx * nx + p.vy * ny;
  if (vn < 0) {
    p.vx -= (1 + e) * vn * nx; p.vy -= (1 + e) * vn * ny;
    // 只有沿著牆的方向有一點點摩擦
    const vt = -p.vx * ny + p.vy * nx; p.vx -= -ny * vt * 0.004; p.vy -= nx * vt * 0.004;
  }
  return true;
}
function collideCircle(p, cx, cy, r, e, mvx, mvy) {
  const dx = p.x - cx, dy = p.y - cy, rr = PR + r, d2 = dx * dx + dy * dy;
  if (d2 >= rr * rr) return 0;
  const d = Math.sqrt(d2) || 0.001, nx = dx / d, ny = dy / d;
  p.x = cx + nx * rr; p.y = cy + ny * rr;
  const rvx = p.vx - (mvx || 0), rvy = p.vy - (mvy || 0), vn = rvx * nx + rvy * ny;
  if (vn < 0) {
    p.vx -= (1 + e) * vn * nx; p.vy -= (1 + e) * vn * ny;
    // 一點點隨機，不會卡在同一條路線
    const j = (Math.random() - 0.5) * 16; p.vx += -ny * j; p.vy += nx * j;
    return -vn;
  }
  return 0.001;
}

function headUpdate(h) {
  HEAD.ang = Math.sin(simTime * 0.55) * 0.62;
  // 嘴巴一開一合：張開 1.3 秒、閉上 2.1 秒；寶藏時間一直張開
  const ph = (simTime % 3.4);
  const want = ph < 1.3 ? 1 : 0;
  HEAD.open += (want - HEAD.open) * Math.min(1, h * 9);
  HEAD.mx = HEAD.x + Math.sin(HEAD.ang) * HEAD.mouthD;
  HEAD.my = HEAD.y - Math.cos(HEAD.ang) * HEAD.mouthD;
}

function physStep(h) {
  simTime += h;
  headUpdate(h);
  const fishOn = effects.fish > 0 || bonus.phase === 'run';
  for (const f of FISH) {
    f.on = !f.extra || fishOn;
    f.x += f.vx * h;
    if (f.x < f.x1) { f.x = f.x1; f.vx = Math.abs(f.vx); }
    if (f.x > f.x2) { f.x = f.x2; f.vx = -Math.abs(f.vx); }
  }
  const open = HEAD.open > 0.55;
  for (let i = 0; i < PEARLS.length; i++) {
    const p = PEARLS[i];
    if (!p.on) continue;
    p.age += h;
    p.vy += GRAV * h;
    if (!p.inRail && p.y > CURRENT.y1 && p.y < CURRENT.y2 && p.x > CURRENT.x1 && p.x < CURRENT.x2) {
      p.vx += CURRENT.ax * h;
      if (!p.inCur) { p.inCur = true; if (!simMode) onCurrent(p); }
    } else p.inCur = false;
    p.py = p.y;
    p.x += p.vx * h; p.y += p.vy * h;
    // 上方弧形軌道
    if (p.y < ARC.y) {
      const dx = p.x - ARC.x, dy = p.y - ARC.y, d2 = dx * dx + dy * dy;
      if (d2 > ARC_LIM * ARC_LIM) {

$('bStats').addEventListener('click', openStats);
$('bHelp').addEventListener('click', openHelp);
$('bMusic').addEventListener('click', toggleMusic);
$('bSfx').addEventListener('click', toggleSfx);
$('bRed').addEventListener('click', () => { ui(); claimDaily(); });
$('pMusic').addEventListener('click', toggleMusic);
$('pSfx').addEventListener('click', toggleSfx);
$('pShop').addEventListener('click', openShop);
$('pHelp').addEventListener('click', openHelp);
$('pQuit').addEventListener('click', () => { ui(); endSession(); });
$('pResume').addEventListener('click', () => { ui(); setPaused(false); });
pauseBtn.addEventListener('click', () => { ui(); setPaused(true); });
$('shopClose').addEventListener('click', () => { ui(); $('ovShop').classList.remove('on'); refreshLabels(); });
$('shopAqua').addEventListener('click', () => { $('ovShop').classList.remove('on'); openAqua(); });
$('aquaClose').addEventListener('click', () => { ui(); $('ovAqua').classList.remove('on'); aquaOpen = false; });
$('aquaShop').addEventListener('click', () => { $('ovAqua').classList.remove('on'); aquaOpen = false; openShop(); });
document.querySelectorAll('#ovShop .tab').forEach(t => t.addEventListener('click', () => { sfx('click'); shopTab = t.dataset.t; renderShop(); }));

/* =====================================================================
 * 輸入
 * ===================================================================== */
function local(c, x, y) { return [(x - c.x) / c.s, (y - c.y) / c.s]; }
function inComp(c, w, h, x, y, m) { const [lx, ly] = local(c, x, y); return lx > -m && lx < w + m && ly > -m && ly < h + m; }
function setPower(v, sound) {
  const nv = clamp(v, 0, 1);
  if (sound && Math.floor(nv * 20) !== Math.floor(power * 20)) sfx('dp_lever', { gap: 30, pitch: 0.8 + nv * 0.5 });
  power = nv; dirty();
}
function fireDown(pid) {
  if (fire.down) return;
  fire.down = true; fire.pid = pid; fire.t0 = time; fire.charging = false; fire.cp = 0.05; fire.dir = 1;
  sfx('click', { vol: 0.5 });
}
function fireUp(cancel) {
  if (!fire.down) return;
  const wasCharging = fire.charging;
  fire.down = false; fire.charging = false;
  if (cancel) return;
  if (wasCharging) setPower(fire.cp);
  if (bonus.phase === 'run' || bonus.phase === 'intro') return;
  launch(power, false);
  autoT = 1;
}
function toggleAuto() {
  auto = !auto; autoT = 0.3;
  sfx(auto ? 'select' : 'back');
  lcdMsg(auto ? '自動發射 開' : '自動發射 關', auto ? '每秒 1 顆，用力道桿調位置' : '', auto ? '#45d483' : '#cfe8ff', 1.2);
}
cv.addEventListener('pointerdown', e => {
  e.preventDefault();
  if (scene !== 'play' || paused) return;
  const r = cv.getBoundingClientRect(), x = e.clientX - r.left, y = e.clientY - r.top;
  const C = L.ctrl;
  if (inComp(C, 400, CTRL_H, x, y, 10)) {
    const [lx, ly] = local(C, x, y);
    if (lx < 112) { toggleAuto(); return; }
    if (lx < 298) { lever.drag = true; lever.pid = e.pointerId; setPower((lx - 126) / 150, true); try { cv.setPointerCapture(e.pointerId); } catch (er) { /* 忽略 */ } return; }
    fireDown(e.pointerId); try { cv.setPointerCapture(e.pointerId); } catch (er) { /* 忽略 */ } return;
  }
  if (inComp(L.field, FW, FH, x, y, 0) || inComp(L.tray, 400, TRAY_H, x, y, 0)) { fireDown(e.pointerId); try { cv.setPointerCapture(e.pointerId); } catch (er) { /* 忽略 */ } }
});
cv.addEventListener('pointermove', e => {
  if (!lever.drag || e.pointerId !== lever.pid) return;
  const r = cv.getBoundingClientRect();
  const [lx] = local(L.ctrl, e.clientX - r.left, e.clientY - r.top);
  setPower((lx - 126) / 150, true);
});
function endPtr(e, cancel) {
  if (lever.drag && e.pointerId === lever.pid) { lever.drag = false; return; }
  if (fire.down && fire.pid === e.pointerId) fireUp(cancel);
}
cv.addEventListener('pointerup', e => endPtr(e, false));
cv.addEventListener('pointercancel', e => endPtr(e, true));
cv.addEventListener('contextmenu', e => e.preventDefault());
window.addEventListener('keydown', e => {
  const k = e.key;
  if ($('ovInfo').classList.contains('on') || $('ovShop').classList.contains('on') || $('ovAqua').classList.contains('on')) {
    if (k === 'Escape') { $('ovShop').classList.remove('on'); $('ovAqua').classList.remove('on'); }
    return;
  }
  if (scene === 'title') { if (k === 'Enter') { e.preventDefault(); startGame(); } return; }
  if (k === 'Escape' || k === 'p' || k === 'P') { e.preventDefault(); setPaused(!paused); return; }
  if (paused) return;
  if (k === ' ' || k === 'Enter') { e.preventDefault(); if (!e.repeat) { fire.key = true; fireDown('key'); } }
  else if (k === 'ArrowLeft' || k === 'ArrowDown') { e.preventDefault(); setPower(power - 0.02, true); }
  else if (k === 'ArrowRight' || k === 'ArrowUp') { e.preventDefault(); setPower(power + 0.02, true); }
  else if (k === 'a' || k === 'A') toggleAuto();
});
window.addEventListener('keyup', e => {
  if ((e.key === ' ' || e.key === 'Enter') && fire.key) { fire.key = false; if (fire.pid === 'key') fireUp(false); }
});
document.addEventListener('visibilitychange', () => {
  if (document.hidden) { saveAll(); if (scene === 'play' && !paused) setPaused(true); }
  ambUpdate();
});
window.addEventListener('pagehide', saveAll);
window.addEventListener('resize', layout);
window.addEventListener('orientationchange', () => setTimeout(layout, 150));
if (window.visualViewport) window.visualViewport.addEventListener('resize', layout);

/* =====================================================================
 * 主迴圈
 * ===================================================================== */
const STEP = 1 / 240;
let acc = 0, secT = 0, lowQ = false;
const perf = { n: 0, sum: 0, max: 0, dtSum: 0, dtN: 0 };
function step(dt) {
  time += dt;
  if (shakeT > 0) shakeT -= dt;
  secT += dt;
  if (secT >= 1) {
    secT = 0; refillTick(); ambUpdate();
    if (infoTick) infoTick();
    if (scene === 'title') refreshLabels();
    if (paused && $('ovPause').classList.contains('on')) updatePauseInfo();
  }
  if (!paused) {
    updateTimers(dt); updateParts(dt); updateBubs(dt); updatePops(dt); updateLcd(dt); updateTray(dt);
    if (ban.t < 9) ban.t += dt;
    launcherKick = Math.max(0, launcherKick - dt * 5);
    for (const f of FISH) if (f.flash > 0) f.flash = Math.max(0, f.flash - dt * 3);
    if (fire.down) {
      if (!fire.charging && time - fire.t0 > 0.2) { fire.charging = true; fire.cp = 0.05; }
      if (fire.charging) {
        fire.cp += fire.dir * dt * 0.7;
        if (fire.cp >= 1) { fire.cp = 1; fire.dir = -1; } else if (fire.cp <= 0) { fire.cp = 0; fire.dir = 1; }
        if (Math.floor(fire.cp * 10) !== fire.lastTick) { fire.lastTick = Math.floor(fire.cp * 10); sfx('dp_charge', { gap: 30, pitch: 0.7 + fire.cp * 0.9, exact: true }); }
      }
    }
    if (scene === 'title') updateDemo(dt);
    updateGame(dt);
    acc += dt;
    let n = 0;
    while (acc >= STEP && n < 14) { physStep(STEP); acc -= STEP; n++; }
    if (n >= 14) acc = 0;
    for (const p of PEARLS) if (p.cap > 0) p.cap -= dt;
  }
  saveT += dt;
  if (saveDirty && saveT > 2) { saveAll(); saveT = 0; }
  if (aquaOpen && Math.floor(time * 20) !== Math.floor((time - dt) * 20)) drawAquarium();
}
function render() {
  if (shakeT > 0 && !paused) { const k = shakeAmt * Math.min(1, shakeT * 3); shx = (Math.random() * 2 - 1) * k; shy = (Math.random() * 2 - 1) * k; } else { shx = 0; shy = 0; }
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.drawImage(bgCv, 0, 0, W, H);
  drawSide();
  drawLcd();
  drawField();
  drawTray();
  drawCtrl();
}
let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, Math.max(0, (now - last) / 1000));
  last = now;
  const t0 = performance.now();
  try { step(dt); render(); } catch (err) { console.error(err); }
  const ft = performance.now() - t0;
  perf.n++; perf.sum += ft; if (ft > perf.max) perf.max = ft;
  // 自動降畫質：連續慢就少一點粒子和泡泡
  perf.dtSum += dt; perf.dtN++;
  if (perf.dtN >= 120) {
    const avg = perf.dtSum / perf.dtN;
    if (!lowQ && avg > 1 / 40 && !document.hidden) { lowQ = true; partCap = 60; BUBS.length = 8; }
    perf.dtSum = 0; perf.dtN = 0;
  }
  requestAnimationFrame(frame);
}
layout();
refreshLabels();
goTitle();
requestAnimationFrame(t => { last = t; frame(t); });

/* ---------- 測試用 ---------- */
window.__dp = {
  state: () => ({ scene, paused, coins, shownCoins, tickets, freePearls, lit: lit.slice(), power: +power.toFixed(2), auto, active: activeCount(), bonus: bonus.phase, bonusT: +bonus.t.toFixed(1), chest: bonus.chest,
    wheel: { spinning: wheel.spinning, reserve: wheel.reserve, res: wheel.res ? wheel.res.id : null }, effects: { shell: +effects.shell.toFixed(1), fish: +effects.fish.toFixed(1) }, jackpot: +jackpot.toFixed(1),
    music: M ? M.isPlaying() : null, musicEnabled: M ? M.isEnabled() : null, sfxOn, mode: L.mode, sess: Object.assign({}, sess), lowQ, theme, skin }),
  start: () => startGame(),
  title: () => goTitle(),
  tick: (sec) => { for (let i = 0; i < sec * 60; i++) step(1 / 60); },
  fire: (pw) => { if (pw != null) setPower(pw); return launch(power, false); },
  spin: (id) => startSpin(id),
  bonus: () => startBonus('gate'),
  light: (c) => lightPearl(c, 'test'),
  jackpot: () => winJackpot(),
  setCoins: (n) => { coins = n; shownCoins = n; dirty(); },
  setTickets: (n) => { tickets = n; dirty(); },
  setRest: (sec) => { restT = sec; },
  auto: (on) => { auto = !!on; autoT = 0; },
  econ: (pw, sec, wander) => { for (const k in WHY) delete WHY[k]; const t0 = { shots: sess.shots, won: sess.won, b: sess.bonuses, sp: stats.spins, jp: sess.jackpots, tix: sess.tix }; auto = true; for (let i = 0; i < sec * 60; i++) { if (wander && i % 1800 === 0) power = Math.random() * 0.9; else if (!wander) power = pw; restT = 0; step(1 / 60); } const why = Object.assign({}, WHY); return { why, shots: sess.shots - t0.shots, won: sess.won - t0.won, bonuses: sess.bonuses - t0.b, spins: stats.spins - t0.sp, jps: sess.jackpots - t0.jp, tix: sess.tix - t0.tix, rtp: +((sess.won - t0.won) / Math.max(1, sess.shots - t0.shots)).toFixed(3), jackpot: +jackpot.toFixed(1) }; },
  pause: (p) => setPaused(p),
  layout: () => JSON.parse(JSON.stringify(L)),
  ctrlPt: (lx, ly) => [L.ctrl.x + lx * L.ctrl.s, L.ctrl.y + ly * L.ctrl.s],
  fieldPt: (lx, ly) => [L.field.x + lx * L.field.s, L.field.y + ly * L.field.s],
  perf: (reset) => { const r = { avg: perf.n ? +(perf.sum / perf.n).toFixed(2) : 0, max: +perf.max.toFixed(1), n: perf.n }; if (reset) { perf.n = 0; perf.sum = 0; perf.max = 0; } return r; },
  sim: (pw, n, opts) => {
    opts = opts || {};
    const saved = simMode; simMode = true; clearPearls();
    for (const k in SIMSTAT) SIMSTAT[k] = Array.isArray(SIMSTAT[k]) ? [0, 0, 0, 0, 0] : 0;
    if (opts.wide) setPocketWide(true);
    const ef = effects.fish; effects.fish = opts.fish ? 99 : 0;
    let t = 0, fired = 0;
    while ((fired < n || PEARLS.some(p => p.on)) && t < n + 60) {
      if (fired < n && t >= fired) { if (spawnPearl(typeof pw === 'number' ? pw : Math.random())) { fired++; SIMSTAT.launched++; } }
      physStep(STEP); t += STEP;
    }
    effects.fish = ef; if (opts.wide) setPocketWide(false);
    simMode = saved; clearPearls();
    return JSON.parse(JSON.stringify(SIMSTAT));
  }
};
})();
</script>
