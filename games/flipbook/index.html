<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>翻頁動畫工作室</title>
<link rel="stylesheet" href="../../assets/common.css">
<style>
  html, body { height: 100%; overflow: hidden; background: #ffb86b; overscroll-behavior: none; }
  [hidden] { display: none !important; }
  #app {
    position: fixed; left: 0; top: 0; width: 100vw; height: 100vh; overflow: hidden; color: #3b2a4a;
    background:
      radial-gradient(circle at 12% 8%, rgba(255, 255, 255, .38), transparent 38%),
      radial-gradient(circle at 92% 96%, rgba(255, 120, 160, .25), transparent 40%),
      linear-gradient(165deg, #ffd877 0%, #ffae6b 55%, #ff8f7a 100%);
  }
  button { font-family: var(--kg-font); -webkit-user-select: none; user-select: none; cursor: pointer; -webkit-tap-highlight-color: transparent; }
  svg { display: block; }
  #safeProbe { position: absolute; visibility: hidden; padding-bottom: env(safe-area-inset-bottom); }

  /* ---------- 工作室 ---------- */
  #studio { position: absolute; inset: 0; }
  #topbar, #infobar, #actions { position: absolute; display: flex; gap: 8px; align-items: center; justify-content: center; }
  #tools, #palette, #actions.grid { position: absolute; display: grid; gap: 6px; justify-content: center; align-content: center; }
  .tb {
    border: 0; border-radius: 14px; background: #fff; color: #3b2a4a; display: flex; flex-direction: column; align-items: center;
    justify-content: center; gap: 1px; padding: 2px; font-weight: 900; font-size: 11px; line-height: 1.05;
    box-shadow: 0 3px 0 rgba(120, 50, 30, .28); position: relative; white-space: nowrap; overflow: hidden; transition: transform .1s;
  }
  .tb svg { width: 24px; height: 24px; flex: 0 0 auto; }
  .tb.on { background: linear-gradient(180deg, #45d8c8, #14a392); color: #fff; }
  .tb.hot { background: linear-gradient(180deg, #ff9ab8, #ff5f8f); color: #fff; }
  .tb.blue { background: linear-gradient(180deg, #8fc9ff, #4f7dff); color: #fff; }
  .tb:disabled { opacity: .4; }
  .tb:active:not(:disabled) { transform: scale(.9); }
  .tb.nolab span { display: none; }
  .tb .szdot { border-radius: 50%; background: currentColor; }
  .tb .mini { position: absolute; right: 4px; top: 4px; width: 12px; height: 12px; border-radius: 50%; border: 2px solid #fff; box-shadow: 0 0 0 1px rgba(0,0,0,.2); }
  .chip2 {
    border: 0; border-radius: 999px; background: rgba(255, 255, 255, .94); color: #3b2a4a; height: 42px; padding: 0 12px 0 8px;
    display: flex; gap: 5px; align-items: center; font-weight: 900; font-size: 14px; box-shadow: 0 3px 0 rgba(120, 50, 30, .25); white-space: nowrap;
    flex: 0 1 auto; min-width: 0; overflow: hidden;
  }
  .chip2 svg { width: 22px; height: 22px; flex: 0 0 auto; }
  .chip2.on { background: linear-gradient(180deg, #45d8c8, #14a392); color: #fff; }
  .chip2:active { transform: scale(.94); }
  .sw { border-radius: 50%; border: 3px solid #fff; padding: 0; margin: auto; box-shadow: 0 3px 0 rgba(120, 50, 30, .3); transition: transform .12s; }
  .sw.on { transform: scale(1.16); box-shadow: 0 0 0 3px #3b2a4a, 0 3px 8px rgba(0, 0, 0, .3); }
  .sw:active { transform: scale(.9); }
  #board {
    position: absolute; border-radius: 12px; overflow: hidden; touch-action: none; background: #fff;
    box-shadow: 0 0 0 4px #fff, 0 0 0 7px rgba(59, 42, 74, .18), 0 12px 26px rgba(120, 50, 20, .35);
  }
  #view { position: absolute; left: 0; top: 0; width: 100%; height: 100%; display: block; }
  #fbadge {
    position: absolute; left: 8px; bottom: 8px; pointer-events: none; background: rgba(59, 42, 74, .72); color: #fff;
    border-radius: 999px; padding: 2px 10px; font-weight: 900; font-size: 13px; white-space: nowrap;
  }
  #fbadge.play { background: rgba(255, 95, 143, .9); }
  #tutBar {
    position: absolute; left: 6px; right: 6px; top: 6px; display: flex; gap: 8px; align-items: center; pointer-events: none;
    background: rgba(255, 255, 255, .93); border-radius: 14px; padding: 5px 5px 5px 12px; box-shadow: 0 3px 10px rgba(0, 0, 0, .2);
  }
  #tutText { flex: 1; font-weight: 900; font-size: 15px; color: #5b3aa0; line-height: 1.25; min-width: 0; }
  #tutNext {
    pointer-events: auto; border: 0; border-radius: 999px; min-height: 40px; padding: 0 14px; font-weight: 900; font-size: 15px; color: #fff;
    background: linear-gradient(180deg, #8ff0b4, #2fb57a); box-shadow: 0 3px 0 #1e7d52; white-space: nowrap; display: flex; align-items: center; gap: 4px;
  }
  #tutNext svg { width: 18px; height: 18px; }
  #tutNext.pulse { animation: bPulse 1.2s ease-in-out infinite; }
  #timeline { position: absolute; background: #3a2c3f; border-radius: 10px; box-shadow: 0 6px 14px rgba(80, 30, 20, .3); overflow: hidden; }
  #timeline::before, #timeline::after {
    content: ''; position: absolute; left: 0; right: 0; height: 5px; pointer-events: none;
    background: repeating-linear-gradient(90deg, transparent 0 7px, rgba(255, 255, 255, .5) 7px 14px);
  }
  #timeline::before { top: 3px; }
  #timeline::after { bottom: 3px; }
  #tlScroll { position: absolute; left: 0; right: 0; top: 11px; bottom: 11px; overflow-x: auto; overflow-y: hidden; touch-action: none; scrollbar-width: none; }
  #tlScroll::-webkit-scrollbar { display: none; }
  #tlList { display: flex; gap: 6px; height: 100%; padding: 0 8px; width: max-content; align-items: stretch; position: relative; }
  .fr {
    position: relative; flex: 0 0 auto; height: 100%; aspect-ratio: 4 / 3; border-radius: 6px; background: #fff; border: 3px solid #fff;
    overflow: hidden; box-sizing: border-box; transition: transform .15s;
  }
  .fr canvas { width: 100%; height: 100%; display: block; pointer-events: none; }
  .fr.cur { border-color: #ffd23f; box-shadow: 0 0 0 2px #ff8a3c; }
  .fr .num {
    position: absolute; left: 1px; bottom: 1px; background: rgba(59, 42, 74, .78); color: #fff; font-size: 11px; font-weight: 900;
    border-radius: 6px; padding: 0 4px; line-height: 15px; pointer-events: none;
  }
  .fr .snd { position: absolute; right: 1px; top: 1px; width: 17px; height: 17px; border-radius: 50%; background: #ff5f8f; color: #fff; display: grid; place-items: center; pointer-events: none; }
  .fr .snd svg { width: 12px; height: 12px; }
  .fr.add { display: grid; place-items: center; background: rgba(255, 255, 255, .12); border: 3px dashed rgba(255, 255, 255, .75); color: #fff; }
  .fr.add svg { width: 26px; height: 26px; }
  .fr.add.full { opacity: .35; }
  .fr.ghosted { opacity: .3; }
  .fr.pop { animation: frPop .35s cubic-bezier(.2, 1.6, .4, 1); }
  @keyframes frPop { from { transform: scale(.4); } to { transform: none; } }
  .fr.playing { border-color: #ff5f8f; }
  #dropMark { position: absolute; top: 0; bottom: 0; width: 5px; margin-left: -5px; background: #ffd23f; border-radius: 3px; pointer-events: none; box-shadow: 0 0 6px #ffd23f; }
  #dragGhost { position: fixed; z-index: 8650; pointer-events: none; border: 3px solid #ffd23f; border-radius: 8px; transform: rotate(-5deg) scale(1.12); box-shadow: 0 10px 24px rgba(0, 0, 0, .4); background: #fff; }
  .ab {
    border: 0; border-radius: 14px; background: #fff; color: #3b2a4a; height: 100%; flex: 1 1 0; min-width: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 1px; font-weight: 900; font-size: 12px; box-shadow: 0 3px 0 rgba(120, 50, 30, .28); white-space: nowrap; padding: 2px;
  }
  .ab svg { width: 24px; height: 24px; }
  .ab.green { background: linear-gradient(180deg, #8ff0b4, #2fb57a); color: #fff; box-shadow: 0 3px 0 #1e7d52; }
  .ab.pink { background: linear-gradient(180deg, #ff9ab8, #ff5f8f); color: #fff; box-shadow: 0 3px 0 #c23a66; }
  .ab.on { background: linear-gradient(180deg, #45d8c8, #14a392); color: #fff; }
  .ab:active { transform: scale(.92); }
  .ab:disabled { opacity: .4; }
  #actions.grid .ab { height: auto; }
  .fab2 {
    position: absolute; width: 48px; height: 48px; border-radius: 50%; border: 3px solid #fff; color: #3b2a4a; padding: 0;
    background: linear-gradient(180deg, #fff, #ffe9f1); box-shadow: var(--kg-shadow); display: grid; place-items: center; z-index: 50;
  }
  .fab2 svg { width: 22px; height: 22px; }
  .fab2:active { transform: scale(.9); }

  /* ---------- 彈出選單 ---------- */
  #pop {
    position: absolute; z-index: 8600; background: #fff; border-radius: 20px; padding: 10px 12px 12px; color: #3b2a4a;
    box-shadow: 0 0 0 3px rgba(59, 42, 74, .12), 0 14px 40px rgba(80, 30, 20, .45); overflow-y: auto; touch-action: pan-y;
    animation: popIn .18s cubic-bezier(.2, 1.4, .4, 1);
  }
  @keyframes popIn { from { transform: translateY(14px) scale(.96); opacity: 0; } to { transform: none; opacity: 1; } }
  #pop h3 { margin: 2px 0 8px; font-size: 16px; font-weight: 900; display: flex; align-items: center; gap: 8px; }
  #pop h3 svg { width: 20px; height: 20px; }
  .opts { display: grid; grid-template-columns: repeat(auto-fill, minmax(70px, 1fr)); gap: 8px; }
  .opts.wide { grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); }
  .opt {
    background: #f6eefc; border: 3px solid transparent; border-radius: 14px; color: #3b2a4a; padding: 5px 3px 4px; display: flex; flex-direction: column;
    align-items: center; gap: 3px; font-weight: 900; font-size: 13px; min-height: 48px; justify-content: center;
  }
  .opt canvas { width: 52px; height: 52px; }
  .opt.bgo canvas { width: 80px; height: 60px; border-radius: 8px; }
  .opt svg { width: 26px; height: 26px; }
  .opt.on { border-color: #14a392; background: #dbfaf5; }
  .opt:active { transform: scale(.93); }
  .opt small { font-size: 11px; font-weight: 800; opacity: .75; }
  .rowc { display: flex; align-items: center; gap: 10px; margin: 6px 0; }
  .rowc b { font-size: 15px; white-space: nowrap; }
  input[type=range] { -webkit-appearance: none; appearance: none; flex: 1; height: 34px; background: transparent; min-width: 80px; touch-action: none; }
  input[type=range]::-webkit-slider-runnable-track { height: 12px; border-radius: 6px; background: linear-gradient(90deg, #ffd23f, #ff5f8f); }
  input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 30px; height: 30px; border-radius: 50%; background: #fff; border: 4px solid #3b2a4a; margin-top: -9px; }
  input[type=range]::-moz-range-track { height: 12px; border-radius: 6px; background: linear-gradient(90deg, #ffd23f, #ff5f8f); }
  input[type=range]::-moz-range-thumb { width: 24px; height: 24px; border-radius: 50%; background: #fff; border: 4px solid #3b2a4a; }
  .seg { display: flex; background: rgba(59, 42, 74, .12); border-radius: 999px; padding: 4px; gap: 4px; }
  .seg button { flex: 1; border: 0; border-radius: 999px; min-height: 40px; font-size: 15px; font-weight: 900; color: inherit; background: transparent; white-space: nowrap; padding: 0 12px; display: flex; align-items: center; justify-content: center; gap: 4px; }
  .seg button svg { width: 20px; height: 20px; }
  .seg button.on { background: linear-gradient(180deg, #ffd86b, #ff8a5c); color: #4a2400; }

  /* ---------- 各種畫面 ---------- */
  .screen { position: fixed; inset: 0; }
  #title {
    z-index: 8800; display: flex; align-items: center; justify-content: center; gap: clamp(8px, 2.5vmin, 34px); flex-direction: column; overflow: hidden;
    padding: 62px 16px max(14px, env(safe-area-inset-bottom));
    background:
      radial-gradient(circle at 50% 30%, rgba(255, 255, 255, .45), transparent 55%),
      linear-gradient(165deg, #ffe07a 0%, #ffae6b 55%, #ff8a8a 100%);
  }
  #title::before, #title::after {
    content: ''; position: absolute; left: -20px; right: -20px; height: 34px; background: #3a2c3f; opacity: .85; transform: rotate(-3deg);
    -webkit-mask: repeating-linear-gradient(90deg, #000 0 10px, transparent 10px 12px);
  }
  #title::before { top: auto; bottom: 4px; height: 26px; }
  #title::after { display: none; }
  #titleC { width: min(82vw, 40vh, 470px); aspect-ratio: 4 / 3.25; flex: 0 0 auto; position: relative; z-index: 1; animation: tIn 1s cubic-bezier(.2, 1.4, .4, 1) both; }
  .tside { display: flex; flex-direction: column; align-items: center; gap: clamp(6px, 1.4vh, 14px); min-width: 0; position: relative; z-index: 1; }
  .logo { width: min(92vw, 540px); height: auto; overflow: visible; animation: tIn .9s .1s cubic-bezier(.2, 1.4, .4, 1) both; }
  .logo text { font-family: var(--kg-font); }
  .tsub { font-size: clamp(14px, 3.8vw, 18px); font-weight: 900; text-align: center; margin-top: -4px; color: #6a3a2a; }
  .tbtns { display: flex; flex-direction: column; gap: 10px; align-items: stretch; width: min(330px, 86vw); animation: tIn 1s .2s cubic-bezier(.2, 1.4, .4, 1) both; }
  .tstat { font-size: 13px; font-weight: 900; text-align: center; color: #6a3a2a; background: rgba(255, 255, 255, .55); border-radius: 999px; padding: 3px 12px; }
  @keyframes tIn { from { transform: translateY(30px) scale(.8); opacity: 0; } to { transform: none; opacity: 1; } }
  @media (min-aspect-ratio: 9/8) {
    #title { flex-direction: row; padding: 12px 70px max(12px, env(safe-area-inset-bottom)); }
    #titleC { width: min(46vw, 70vh, 600px); }
    .logo { width: min(42vw, 480px); }
    .tbtns { width: min(330px, 40vw); }
  }
  @media (min-aspect-ratio: 9/8) and (max-height: 500px) {
    .tbtns { gap: 7px; }
    .tbtns .big { min-height: 44px; font-size: 18px; }
    .tbtns .tog { min-height: 38px; }
    .tsub { display: none; }
  }
  .big {
    border: 4px solid #fff; border-radius: 999px; min-height: 52px; padding: 6px 20px; font-size: clamp(18px, 4.8vw, 22px); font-weight: 900; color: #fff;
    background: linear-gradient(180deg, #ffb36b 0%, #ff6f61 100%); box-shadow: 0 6px 0 #c4443c, 0 12px 22px rgba(120, 40, 20, .3);
    text-shadow: 0 2px 0 rgba(0, 0, 0, .18); display: flex; align-items: center; justify-content: center; gap: 8px; transition: transform .1s; white-space: nowrap;
  }
  .big svg { width: 26px; height: 26px; flex: 0 0 auto; }
  .big:active { transform: translateY(4px); box-shadow: 0 2px 0 #c4443c; }
  .big.green { background: linear-gradient(180deg, #8ff0b4 0%, #2fb57a 100%); box-shadow: 0 6px 0 #1e7d52, 0 12px 22px rgba(10, 60, 40, .3); }
  .big.green:active { box-shadow: 0 2px 0 #1e7d52; }
  .big.blue { background: linear-gradient(180deg, #9fd8ff 0%, #4f7dff 100%); box-shadow: 0 6px 0 #2f4fb0, 0 12px 22px rgba(20, 30, 90, .3); }
  .big.blue:active { box-shadow: 0 2px 0 #2f4fb0; }
  .big.purple { background: linear-gradient(180deg, #d2a8ff 0%, #8a5cff 100%); box-shadow: 0 6px 0 #5a33b5, 0 12px 22px rgba(60, 20, 110, .3); }
  .big.purple:active { box-shadow: 0 2px 0 #5a33b5; }
  .big.gray { background: linear-gradient(180deg, #c9bfd3 0%, #8f819c 100%); box-shadow: 0 6px 0 #5d5068; }
  .big.pulse { animation: bPulse 1.8s ease-in-out infinite; }
  @keyframes bPulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.05); } }
  .trow { display: flex; gap: 10px; }
  .tog {
    flex: 1; border: 3px solid #fff; border-radius: 999px; min-height: 42px; font-size: 15px; font-weight: 900; color: #6a3a2a;
    background: rgba(255, 255, 255, .5); display: flex; align-items: center; justify-content: center; gap: 6px;
  }
  .tog svg { width: 20px; height: 20px; }
  .tog.on { background: linear-gradient(180deg, #45d8c8, #14a392); color: #fff; }

  #player { z-index: 8700; background: #2d2140; }
  #pc { position: absolute; left: 0; top: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  #pTitle {
    position: absolute; left: 70px; right: 70px; top: 14px; text-align: center; color: #fff; font-weight: 900; font-size: 20px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-shadow: 0 2px 0 rgba(0, 0, 0, .3); pointer-events: none;
  }
  #pctl { position: absolute; display: flex; flex-wrap: wrap; gap: 8px 10px; align-items: center; justify-content: center; color: #fff; }
  #pctl .seg { background: rgba(255, 255, 255, .14); }
  #pctl .seg button { color: #fff; }
  #pctl .seg button.on { color: #4a2400; }
  .round {
    width: 56px; height: 56px; border-radius: 50%; border: 4px solid #fff; display: grid; place-items: center; padding: 0; color: #fff; flex: 0 0 auto;
    background: linear-gradient(180deg, #ff9ab8, #ff5f8f); box-shadow: 0 4px 0 #c23a66;
  }
  .round svg { width: 26px; height: 26px; }
  .round:active { transform: scale(.92); }
  .pspeed { display: flex; align-items: center; gap: 8px; min-width: 210px; flex: 1 1 210px; max-width: 360px; }
  .pspeed b { font-size: 15px; white-space: nowrap; min-width: 74px; }
  .chip {
    border: 3px solid rgba(255, 255, 255, .75); border-radius: 999px; min-height: 44px; font-size: 15px; font-weight: 900; color: #fff;
    background: rgba(255, 255, 255, .1); white-space: nowrap; padding: 0 12px; display: flex; align-items: center; gap: 6px;
  }
  .chip svg { width: 20px; height: 20px; }
  .chip.on { background: linear-gradient(180deg, #45d8c8, #14a392); border-color: #fff; }
  #pctl .big { min-height: 46px; font-size: 18px; padding: 4px 16px; border-width: 3px; }

  #gallery, #tutpick { z-index: 8750; display: flex; flex-direction: column; background: linear-gradient(170deg, #ffe07a, #ffae6b 60%, #ff9a7a); }
  .ghead { padding: 12px 70px 6px; text-align: center; flex: 0 0 auto; }
  .ghead h2 { margin: 4px 0 0; font-size: 26px; font-weight: 900; color: #4a2a3a; }
  .ghead span { font-size: 14px; font-weight: 800; color: #6a3a2a; }
  .meter { width: min(280px, 70vw); height: 10px; border-radius: 5px; background: rgba(255, 255, 255, .6); margin: 6px auto 0; overflow: hidden; }
  .meter i { display: block; height: 100%; background: linear-gradient(90deg, #2fb57a, #ffd23f, #ff5f8f); border-radius: 5px; }
  .ggrid {
    flex: 1 1 auto; overflow-y: auto; display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 14px;
    padding: 10px 16px 16px; align-content: start; touch-action: pan-y; max-width: 960px; width: 100%; margin: 0 auto; box-sizing: border-box;
  }
  .gi { border: 4px solid #fff; border-radius: 18px; padding: 0; overflow: hidden; background: #fff; position: relative; box-shadow: 0 6px 0 rgba(120, 50, 30, .25); animation: tIn .4s both; text-align: left; color: #3b2a4a; }
  .gi canvas { width: 100%; aspect-ratio: 4 / 3; display: block; }
  .gi b { display: block; font-size: 14px; font-weight: 900; padding: 4px 8px 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .gi small { display: block; font-size: 12px; font-weight: 800; padding: 0 8px 6px; opacity: .7; }
  .gi:active { transform: scale(.95); }
  .gempty { text-align: center; font-weight: 900; padding: 30px 20px; font-size: 17px; color: #6a3a2a; grid-column: 1 / -1; }
  .gfoot { flex: 0 0 auto; display: flex; justify-content: center; gap: 10px; padding: 8px 16px max(12px, env(safe-area-inset-bottom)); }
  .gfoot .big { min-width: 180px; }
  .tcards { flex: 1 1 auto; overflow-y: auto; display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 14px; padding: 8px 16px 14px; max-width: 980px; width: 100%; margin: 0 auto; align-content: safe center; box-sizing: border-box; touch-action: pan-y; }
  @media (max-aspect-ratio: 9/8) {
    .tcards { grid-template-columns: 1fr; align-content: start; }
    .tcard { display: grid; grid-template-columns: 46% 1fr; grid-template-rows: auto auto 1fr; column-gap: 10px; text-align: left; align-items: start; }
    .tcard canvas { grid-row: 1 / 4; }
    .tcard b { font-size: 18px; margin-top: 4px; }
  }
  .tcard { border: 4px solid #fff; border-radius: 22px; background: #fff; padding: 8px 8px 10px; display: flex; flex-direction: column; gap: 6px; align-items: stretch; box-shadow: 0 6px 0 rgba(120, 50, 30, .25); color: #3b2a4a; animation: tIn .45s both; }
  .tcard canvas { width: 100%; aspect-ratio: 4 / 3; border-radius: 14px; display: block; }
  .tcard b { font-size: 20px; font-weight: 900; }
  .tcard small { font-size: 13px; font-weight: 800; opacity: .8; line-height: 1.3; }
  .tcard .stars { color: #ffb400; font-size: 16px; letter-spacing: 2px; font-weight: 900; }
  .tcard:active { transform: scale(.96); }
  @media (max-height: 520px) and (min-aspect-ratio: 9/8) {
    .tcards { grid-template-columns: repeat(3, 1fr); }
    .tcard small { display: none; }
    .tcard canvas { width: auto; height: min(36vh, 150px); margin: 0 auto; }
    .tcard b { font-size: 16px; }
    .ghead { padding-top: 8px; }
    .ghead h2 { font-size: 22px; }
  }

  .modal { position: fixed; inset: 0; z-index: 9000; display: flex; align-items: center; justify-content: center; background: rgba(50, 20, 40, .55); padding: 66px 14px 14px; }
  .card {
    background: linear-gradient(180deg, #fff, #fff3e6); color: #3b2a4a; border-radius: 26px; padding: 16px 18px 18px; width: min(430px, 100%);

    desc: '一顆球掉下來、壓扁、再彈起來',
    intro: '動畫的秘密是：每一張圖只改一點點，再快快翻過去，圖就會動起來！我們來畫一顆會跳的球。',
    steps: ['球在最高的地方。沿著虛線畫一顆圓圓的球！', '球往下掉一點點。淡淡的紅色是上一格的球喔！', '球掉得更快了，離地面很近！', '碰到地面，球被壓得扁扁的！', '彈起來囉！球又變回圓圓的。', '快回到最高點了！畫完按「播放看看」！'] },
  { id: 'walk', name: '會走路的火柴人', frames: 4, fps: 6, bg: 'stage', mode: 'loop',
    desc: '四張圖讓火柴人走起來',
    intro: '走路的時候，兩隻腳會一前一後交換。只要四張圖，火柴人就會在舞台上走路！',
    steps: ['兩隻腳張開，一隻在前、一隻在後。', '身體往下蹲一點，膝蓋彎彎的。', '一隻腳站直，另一隻腳抬起來往前。', '身體往上，準備跨出下一步！畫完按「播放看看」！'] },
  { id: 'flower', name: '長大的花', frames: 6, fps: 3, bg: 'grass', mode: 'pingpong',
    desc: '從小芽長成大花朵',
    intro: '花不是一下子就長大的。每一張都比上一張大一點點，連起來就是花在長大！',
    steps: ['土裡冒出一個小小的芽。', '莖長高了，長出兩片小葉子。', '再長高一點，葉子也變大了！', '最上面長出一個花苞。', '花苞慢慢打開了！', '花開好了！塗上漂亮的顏色，畫完按「播放看看」！'] }
];
function openTutPick() {
  if (PB.on) { if (PB.where === 'board') stopPreview(); else pbStop(); }
  show('tutpick'); playSong(TITLE_SONG, BASE_VOL.title); sfx('swoosh');
  const box = $('tCards'); box.textContent = '';
  tutCards = [];
  TUTS.forEach((d, i) => {
    const b = document.createElement('button'); b.className = 'tcard'; b.style.animationDelay = (i * 0.08) + 's';
    const c = mk(320, 240); b.appendChild(c);
    const stars = KG.best('flipbook-tut-' + d.id) || 0;
    b.insertAdjacentHTML('beforeend', `<b>${i + 1}. ${d.name}</b><small>${d.desc}・${d.frames} 格</small><span class="stars">${'★'.repeat(stars)}${'☆'.repeat(3 - stars)}</span>`);
    b.addEventListener('click', () => tutIntro(d));
    box.appendChild(b);
    tutCards.push({ c, d, t: Math.random(), i: 0, drawn: false });
  });
}
let tutCards = [];
function drawTutCards(dt) {
  for (const tc of tutCards) {
    tc.t += dt;
    if (tc.drawn && tc.t < 1 / tc.d.fps) continue;
    tc.t = 0; if (tc.drawn) tc.i = (tc.i + 1) % tc.d.frames; tc.drawn = true;
    const g = g2(tc.c); g.drawImage(bgCanvas(tc.d.bg), 0, 0, 320, 240);
    g.save(); g.scale(320 / AW, 240 / AH); drawGuide(g, tc.d, tc.i, true); g.restore();
  }
}
function tutIntro(d) {
  sfx('card');
  showModal(`<canvas class="demo" width="320" height="240"></canvas><div><h2>${d.name}</h2><p>${d.intro}</p>
    <div class="cbtns"><button class="big green wide" data-a="go">${ico('pen')}開始畫！</button><button class="big blue wide" data-a="no">${ico('back')}選別的</button></div></div>`,
  { go: () => confirmReplace(() => startTut(d)), no: () => sfx('back') }, 'img2', (card) => startDemo(card.querySelector('canvas'), null, d));
  say(d.intro);
}
function startTut(d) {
  const a = newAnim(d.name); a.bg = d.bg; a.fps = d.fps; a.mode = d.mode;
  tut = { def: d, done: false, wantPlay: false };
  onion = 1; tool = 'pen'; color = d.id === 'flower' ? 6 : d.id === 'ball' ? 2 : 1; sizeI = 1;
  loadAnim(a, true);
  J.fresh();
  setTimeout(() => say(d.steps[0]), 300);
}
function refreshTut(speak) {
  const bar = $('tutBar');
  if (!tut || tut.done) { bar.hidden = true; return; }
  bar.hidden = false;
  const d = tut.def, i = cur;
  const txt = i < d.frames ? ('第 ' + (i + 1) + ' 格：' + d.steps[i]) : '小教室的格子畫完了！按「播放看看」。';
  $('tutText').textContent = txt;
  const last = i >= d.frames - 1;
  $('tutNext').innerHTML = last ? ico('play') + '播放看看' : '下一格' + ico('next');
  $('tutNext').classList.toggle('pulse', curFr().ops.length > 0);
  ghostKey = ''; dirtyView = true;
  if (speak && i < d.frames) say(d.steps[i]);
}
function tutNext() {
  if (!tut || tut.done) return;
  const d = tut.def;
  if (!curFr().ops.length) { sfx('error'); toast('先沿著虛線畫一畫喔！'); KG.vibrate(30); return; }
  if (cur >= d.frames - 1) {
    const empty = anim.frames.slice(0, d.frames).findIndex((f) => !f.ops.length);
    if (anim.frames.length < d.frames || empty >= 0) { sfx('error'); toast('還有格子沒畫完喔！'); return; }
    tut.wantPlay = true; togglePreview(); return;
  }
  J.step();
  if (cur + 1 < anim.frames.length) setCur(cur + 1, true); else addFrame();
  refreshTut(true);
}
function tutFinish() {
  if (!tut || tut.done) return;
  stopPreview();
  tut.done = true;
  const d = tut.def;
  KG.best('flipbook-tut-' + d.id, 3);
  J.tut(); KG.confetti(W / 2, HH * 0.3, 120); KG.vibrate([30, 40, 30]);
  refreshTut(false);
  anim.dirty = true; saveDraft();
  showModal(`<canvas class="demo" width="320" height="240"></canvas><div><div class="stars">★★★</div><h2>你做出動畫了！</h2><p>「${d.name}」完成！你畫的 ${anim.frames.length} 張圖，翻起來就會動。</p>
    <div class="cbtns"><button class="big green wide" data-a="save">${ico('save')}存起來</button><button class="big blue" data-a="more">${ico('book')}下一課</button><button class="big" data-a="keep">${ico('pen')}繼續畫</button></div></div>`,
  { save: () => saveAnim(), more: () => openTutPick(), keep: () => sfx('select') }, 'img2', (card) => startDemo(card.querySelector('canvas'), anim));
  say('太厲害了！你做出了自己的動畫！');
}

/* =====================================================================
 * 畫面切換、暫停、對話框、提示
 * ===================================================================== */
let screen = 'title', paused = false;
function show(name) {
  screen = name;
  ['title', 'gallery', 'tutpick', 'player'].forEach((id) => { $(id).hidden = id !== name; });
  if (name !== 'tutpick') tutCards = [];
  closePop();
  if (name === 'title') refreshTitle();
  if (name === 'player') layoutPlayer();
}
const modal = $('modal'), mCard = $('mCard');
let modalOnClose = null;
function showModal(html, handlers, cls, after) {
  mCard.className = 'card' + (cls ? ' ' + cls : '');
  mCard.innerHTML = html;
  modal.hidden = false;
  mCard.style.animation = 'none'; void mCard.offsetWidth; mCard.style.animation = '';
  mCard.querySelectorAll('[data-a]').forEach((b) => {
    b.addEventListener('click', () => {
      const fn = handlers && handlers[b.dataset.a];
      if (!b.dataset.keep) closeModal();
      if (fn) fn(b);
    });
  });
  if (after) after(mCard);
}
function closeModal() {
  modal.hidden = true; demoAnim = null;
  if (modalOnClose) { const f = modalOnClose; modalOnClose = null; f(); }
}
let toastT = 0;
function toast(t) {
  const el = $('toast2'); el.textContent = t;
  el.style.top = (screen === 'studio' && modal.hidden ? Math.round(BR.y + 12) : 66) + 'px';
  el.classList.remove('go'); void el.offsetWidth; el.classList.add('go');
  clearTimeout(toastT); toastT = setTimeout(() => el.classList.remove('go'), 2100);
}
function openPause() {
  if (screen !== 'studio' || paused) return;
  if (PB.on) stopPreview();
  closePop();
  paused = true; if (KG.music) KG.music.pause(); penQuiet(); sfx('ui');
  saveDraft();
  showModal(`<h2>休息一下</h2><p>「${esc(anim.name)}」・${anim.frames.length} 格${anim.dirty && hasContent(anim) ? '・還沒存' : ''}</p>
    <div class="cbtns"><button class="big green wide" data-a="go">${ico('play')}繼續畫</button>
    <button class="big" data-a="mus" data-keep="1"></button><button class="big" data-a="sfx" data-keep="1"></button>
    <button class="big purple" data-a="save">${ico('save')}存檔</button><button class="big blue" data-a="dl">${ico('download')}下載</button>
    <button class="big gray wide" data-a="title">${ico('back')}回標題</button></div>`,
  {
    go: () => {},
    mus: (b) => { toggleMusic(); paintToggles(b, null); },
    sfx: (b) => { toggleSfx(); paintToggles(null, b); },
    save: () => saveAnim(),
    dl: () => { if (!hasContent(anim) || anim.frames.length < 1) { toast('先畫一點東西喔！'); return; } openDownload(anim); },
    title: () => { saveDraft(); goTitle(); }
  });
  paintToggles(mCard.querySelector('[data-a=mus]'), mCard.querySelector('[data-a=sfx]'));
  modalOnClose = () => { paused = false; if (KG.music) KG.music.resume(); };
}
function paintToggles(mb, sb) {
  if (mb) { const on = KG.music && KG.music.isEnabled(); mb.innerHTML = ico('music') + '音樂 ' + (on ? '開' : '關'); mb.className = 'big ' + (on ? 'green' : 'gray'); }
  if (sb) { sb.innerHTML = ico('sound') + '音效 ' + (sfxOn ? '開' : '關'); sb.className = 'big ' + (sfxOn ? 'green' : 'gray'); }
}
function toggleMusic() { if (!KG.music) return; KG.music.setEnabled(!KG.music.isEnabled()); sfx('select'); refreshTitle(); }
function toggleSfx() { sfxOn = !sfxOn; KG.store.set('flipbook:sfx', sfxOn); if (!sfxOn) penQuiet(); else sfx('select'); refreshTitle(); }
function goTitle() {
  if (PB.on) pbStop();
  paused = false;
  show('title'); playSong(TITLE_SONG, BASE_VOL.title);
  if (KG.music) { KG.music.resume(); KG.music.setTempo(1); }
}
document.addEventListener('visibilitychange', () => {
  if (!document.hidden) return;
  saveDraft(); penQuiet();
  if (screen === 'studio' && !paused && modal.hidden) openPause();
  if (screen === 'player' && PB.on && !PB.held) playerToggle();
});
window.addEventListener('pagehide', saveDraft);

/* ---------- 標題 ---------- */
function refreshTitle() {
  const has = hasContent(anim);
  $('tCont').hidden = !has;
  $('tCont').innerHTML = ico('pen') + '繼續做「' + esc(anim.name.length > 7 ? anim.name.slice(0, 7) + '…' : anim.name) + '」';
  $('tNew').innerHTML = ico('newp') + '做新的動畫';
  $('tNew').classList.toggle('pulse', !has);
  $('tTut').innerHTML = ico('book') + '動畫小教室';
  $('tGal').innerHTML = ico('gallery') + '我的作品';
  const tm = $('tMusic'), ts = $('tSfx'), mOn = KG.music && KG.music.isEnabled();
  tm.innerHTML = ico('music') + '音樂 ' + (mOn ? '開' : '關'); tm.className = 'tog' + (mOn ? ' on' : '');
  ts.innerHTML = ico('sound') + '音效 ' + (sfxOn ? '開' : '關'); ts.className = 'tog' + (sfxOn ? ' on' : '');
  const best = KG.best('flipbook-frames') || 0, list = listSaved();
  const stars = TUTS.reduce((s, d) => s + (KG.best('flipbook-tut-' + d.id) || 0), 0);
  $('tStat').textContent = `作品櫃 ${list.length}/${MAXSAVE}・最長 ${best} 格・小教室 ★${stars}/9`;
}
$('tCont').addEventListener('click', () => { sfx('select'); loadAnim(anim, true); if (!hasContent(anim)) J.fresh(); });
$('tNew').addEventListener('click', () => {
  confirmReplace(() => {
    const made = KG.store.get('flipbook:made', 0);
    const a = newAnim('我的動畫 ' + (made + 1));
    tool = 'pen'; onion = 1;
    loadAnim(a); J.fresh();
    setTimeout(() => { toast('畫第一張圖，再按 ＋ 加下一張！'); say('先畫第一張圖，再按加號，畫下一張。每一張只改一點點，翻起來就會動喔！'); }, 400);
  });
});
$('tTut').addEventListener('click', () => openTutPick());
$('tGal').addEventListener('click', () => openGallery());
$('tMusic').addEventListener('click', () => toggleMusic());
$('tSfx').addEventListener('click', () => toggleSfx());
$('gBack').innerHTML = ico('back') + '回去'; $('gBack').addEventListener('click', () => { sfx('back'); goTitle(); });
$('tpBack').innerHTML = ico('back') + '回去'; $('tpBack').addEventListener('click', () => { sfx('back'); goTitle(); });
$('pPlay').addEventListener('click', () => playerToggle());
$('pSpeed').addEventListener('input', () => { const a = pbAnim || anim; a.fps = clamp(+$('pSpeed').value, 2, 12); if (a === anim) markDirty(); sfx('tick', { pitch: 0.7 + a.fps * 0.06, exact: true }); syncPlayerCtl(); styleUI(); });
$('pMode').querySelectorAll('button').forEach((b) => {
  b.innerHTML = ico(b.dataset.m) + (b.dataset.m === 'loop' ? '循環' : '來回');
  b.addEventListener('click', () => { const a = pbAnim || anim; a.mode = b.dataset.m; if (a === anim) markDirty(); sfx('select'); syncPlayerCtl(); });
});
$('pFlip').innerHTML = ico('flip') + '翻書效果';
$('pFlip').addEventListener('click', () => { flipOn = !flipOn; KG.store.set('flipbook:flip', flipOn); sfx(flipOn ? 'card' : 'back'); syncPlayerCtl(); });
$('pClose').innerHTML = ico('back') + '回去';
$('pClose').addEventListener('click', () => closePlayer());
pc.addEventListener('pointerdown', (e) => { if (e.clientY < PBook.y + PBook.h + 10) playerToggle(); });

/* 標題的示範翻頁書：小豆跳起來 */
const DEMO = [];
(function makeDemo() {
  const H = [0, 26, 70, 100, 110, 92, 52, 6];
  const SQ = [1.25, 0.92, 0.9, 1, 1, 1, 0.92, 1.15];
  for (let i = 0; i < 8; i++) {
    const c = mk(AW, AH), g = g2(c);
    g.fillStyle = 'rgba(40,80,30,.22)'; g.beginPath(); g.ellipse(256, 304, 52 - H[i] * 0.2, 9, 0, 0, TAU); g.fill();
    g.save(); g.translate(256, 300 - H[i]); g.scale(1 / Math.sqrt(SQ[i]), SQ[i]); g.translate(0, -54);
    drawStamp(g, 'bean', 0, 0, 68, '#ff9a3c'); g.restore();
    if (i >= 3 && i <= 5) { g.save(); drawStamp(g, 'star', 180 + i * 6, 120 - i * 4, 16, '#ffd93d'); drawStamp(g, 'star', 330 - i * 4, 96 + i * 3, 12, '#ff7fc8'); g.restore(); }
    DEMO.push(c);
  }
})();
const titleDemo = { i: 0, prev: -1, t: 0, flipT: 1 };
function drawTitle(dt) {
  const tc = $('titleC'); if (!tc.width) return;
  titleDemo.t += dt;
  if (titleDemo.t > 1 / 6) { titleDemo.t = 0; titleDemo.prev = titleDemo.i; titleDemo.i = (titleDemo.i + 1) % DEMO.length; titleDemo.flipT = 0; }
  titleDemo.flipT = Math.min(1, titleDemo.flipT + dt / 0.12);
  const g = g2(tc), w = tc.width, h = tc.height;
  g.setTransform(1, 0, 0, 1, 0, 0); g.clearRect(0, 0, w, h);
  const bw = w * 0.9, bh = bw * 0.75;
  drawBook(g, (w - bw) / 2 - w * 0.02, h * 0.07, bw, bh, bgCanvas('grass'), DEMO[titleDemo.i], titleDemo.prev >= 0 ? DEMO[titleDemo.prev] : null, titleDemo.flipT, true);
}

/* =====================================================================
 * 鍵盤
 * ===================================================================== */
window.addEventListener('keydown', (e) => {
  if (screen === 'player') {
    if (e.key === ' ') { e.preventDefault(); playerToggle(); }
    else if (e.key === 'Escape') closePlayer();
    return;
  }
  if (screen !== 'studio') return;
  if (!modal.hidden) { if (e.key === 'Escape' && paused) closeModal(); return; }
  const k = e.key.toLowerCase();
  if ((e.ctrlKey || e.metaKey) && k === 'z') { e.preventDefault(); if (e.shiftKey) redo(); else undo(); }
  else if ((e.ctrlKey || e.metaKey) && k === 'y') { e.preventDefault(); redo(); }
  else if ((e.ctrlKey || e.metaKey) && k === 's') { e.preventDefault(); saveAnim(); }
  else if (e.ctrlKey || e.metaKey || e.altKey) return;
  else if (k === ' ') { e.preventDefault(); togglePreview(); }
  else if (k === 'arrowleft') { if (PB.on) stopPreview(); setCur(cur - 1); }
  else if (k === 'arrowright') { if (PB.on) stopPreview(); setCur(cur + 1); }
  else if (k === 'n' || k === '+') addFrame();
  else if (k === 'd') dupFrame();
  else if (k === 'o') cycleOnion();
  else if (k === 'b') toolClick('pen', toolEl.pen);
  else if (k === 'e') toolClick('eraser', toolEl.eraser);
  else if (k === 'f') toolClick('fill', toolEl.fill);
  else if (k === 'escape') { if (!pop.hidden) closePop(); else openPause(); }
});

/* =====================================================================
 * 主迴圈
 * ===================================================================== */
let lastT = performance.now();
function loop(now) {
  const dt = Math.min(0.05, (now - lastT) / 1000); lastT = now;
  if (screen === 'studio') {
    pbUpdate(dt);
    if (fxActive()) { updateFx(dt); dirtyView = true; }
    if (stroke && now - lastMoveT > 90) penSound(0, stroke.op.t === 'e');
    if (brushLayer && !stroke && now - lastDrawT > 3500 && !PB.on && KG.music) { brushLayer = false; KG.music.setLayer('brush', false); }
    if (dirtyView) { dirtyView = false; drawView(); }
    thumbsTick();
    if (Math.abs(tlMom) > 0.3 && !tlp) { tlScroll.scrollLeft += tlMom; tlMom *= 0.92; }
    if (tlp && tlp.mode === 'drag' && tlp.auto) { tlScroll.scrollLeft += tlp.auto * 8; moveGhost(tlp.lx, tlp.y0); }
  } else if (screen === 'player') {
    pbUpdate(dt); drawPlayer();
  } else if (screen === 'title') drawTitle(dt);
  else if (screen === 'tutpick') drawTutCards(dt);
  if (demoAnim && !modal.hidden) drawDemo(dt);
  requestAnimationFrame(loop);
}

/* =====================================================================
 * 開始
 * ===================================================================== */
buildUI();
const dr = loadDraft();
if (dr) anim = dr;
rebuildTimeline();
layout();
show('title');
playSong(TITLE_SONG, BASE_VOL.title);
requestAnimationFrame(loop);
setTimeout(layout, 300);

/* 測試掛鉤 */
window.__fb = {
  get anim() { return anim; }, get cur() { return cur; }, get screen() { return screen; },
  state: () => ({ screen, frames: anim.frames.length, cur, tool, color, sizeI, onion, paused, pb: PB.on ? PB.where : '', pbIdx: PB.idx, held: PB.held,
    music: KG.music ? KG.music.isPlaying() : false, sfxOn, tut: tut ? { id: tut.def.id, done: tut.done } : null, ops: curFr().ops.length, dirty: anim.dirty, land: LAND, board: BR }),
  storeUsed, listSaved,
  ops: (i) => anim.frames[i == null ? cur : i].ops.map(opToArr),
  scribble(nFrames, strokes) {
    for (let f = 0; f < nFrames; f++) {
      if (f > 0 && !addFrame()) break;
      const fr = curFr(); ensureRaster(fr);
      for (let s = 0; s < (strokes || 12); s++) {
        const op = { t: 'p', c: (s * 3 + f) % 14, w: SIZES[s % 4], pts: [] };
        let x = rand(40, 470), y = rand(40, 340);
        for (let k = 0; k < 40; k++) { x += rand(-14, 14); y += rand(-14, 14); pushPoint(op.pts, x, y); }
        op.d = encPts(op.pts); applyOp(fr.g, op); fr.ops.push(op);
      }
      if (f % 3 === 0) { const op = { t: 'f', x: 20, y: 20, c: f % 14, b: bgIndex(anim.bg) }; if (doFill(fr.g, op)) fr.ops.push(op); }
      frameChanged(fr);
    }
  },
  verifyReplay() {
    // 存檔→讀回→重畫，跟現在的畫面逐像素比對
    const a2 = animDe(JSON.parse(JSON.stringify(animSer(anim))));
    let maxDiff = 0;
    const s1 = mk(AW, AH, true), s2 = mk(AW, AH, true);
    a2.frames.forEach((fr, i) => {
      ensureRaster(fr); ensureRaster(anim.frames[i]);
      g2(s1).clearRect(0, 0, AW, AH); g2(s1).drawImage(anim.frames[i].cv, 0, 0);
      g2(s2).clearRect(0, 0, AW, AH); g2(s2).drawImage(fr.cv, 0, 0);
      const d1 = g2(s1).getImageData(0, 0, AW, AH).data, d2 = g2(s2).getImageData(0, 0, AW, AH).data;
      let diff = 0; for (let k = 0; k < d1.length; k++) if (Math.abs(d1[k] - d2[k]) > 2) diff++;
      maxDiff = Math.max(maxDiff, diff);
    });
    return maxDiff;
  },
  gif: () => makeGif(anim, 320, 240).then((d) => d),
  get lastGif() { return lastGif; },
  songs: { TITLE_SONG, STUDIO_SONG, LOOP_HAPPY, LOOP_ADV, LOOP_SLEEP, LOOP_SILLY },
  tutFinish, setCur, addFrame, saveAnim, openGallery, openPlayer: () => openPlayer(anim, 'studio')
};
})();
