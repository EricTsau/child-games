<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>英文單字樂園</title>
<link rel="stylesheet" href="../../assets/common.css">
<style>
  :root { --vh: 100vh; --ink: #3a2e44; --card: #fffdf8; --line: rgba(58, 46, 68, 0.14); }
  html, body { height: 100%; overflow: hidden; background: #fff1d6; overscroll-behavior: none; }
  body { -webkit-text-size-adjust: 100%; }
  #app { position: fixed; left: 0; top: 0; width: 100%; height: var(--vh); overflow: hidden;
    background: radial-gradient(circle at 18% 12%, #fff9ec 0 18%, transparent 19%), radial-gradient(circle at 86% 80%, #ffe9f1 0 14%, transparent 15%),
      linear-gradient(180deg, #e3f4ff 0%, #fff6e3 46%, #ffefd2 100%); }
  button { font-family: var(--kg-font); color: var(--ink); -webkit-tap-highlight-color: transparent; }
  .pic { display: block; width: 100%; height: 100%; object-fit: contain; pointer-events: none; }
  .ico { width: 1.1em; height: 1.1em; display: inline-block; vertical-align: -0.18em; flex: 0 0 auto; }

  /* ---------- 畫面 ---------- */
  .scr { position: absolute; inset: 0; display: flex; flex-direction: column; animation: scrIn 0.28s ease-out; }
  @keyframes scrIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
  .hd { flex: 0 0 auto; min-height: 64px; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 6px 66px 2px; text-align: center; }
  .hd h1 { margin: 0; font-size: clamp(20px, 5.4vw, 28px); line-height: 1.15; font-weight: 900; letter-spacing: 1px; }
  .hd small { font-size: 13px; opacity: 0.7; font-weight: 700; }
  .bd { flex: 1 1 auto; min-height: 0; overflow-y: auto; overflow-x: hidden; padding: 8px 14px 14px; -webkit-overflow-scrolling: touch; touch-action: pan-y; }
  .ft { flex: 0 0 auto; display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; padding: 8px 12px calc(10px + env(safe-area-inset-bottom)); }
  .wrap { max-width: 980px; margin: 0 auto; }

  /* ---------- 按鈕 ---------- */
  .btn { border: 0; border-radius: 999px; padding: 11px 20px; min-height: 48px; font-size: 18px; font-weight: 900; cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center; gap: 8px; background: #fff; color: var(--ink);
    box-shadow: 0 5px 0 rgba(58, 46, 68, 0.22), 0 8px 16px rgba(58, 46, 68, 0.12); transition: transform 0.1s, box-shadow 0.1s; white-space: nowrap; }
  .btn:active { transform: translateY(4px); box-shadow: 0 1px 0 rgba(58, 46, 68, 0.22), 0 3px 6px rgba(58, 46, 68, 0.12); }
  .btn.green { background: linear-gradient(180deg, #8fe3a0, #3fb860); color: #fff; box-shadow: 0 5px 0 #2a8a45, 0 8px 16px rgba(42, 138, 69, 0.3); text-shadow: 0 2px 0 rgba(0,0,0,.15); }
  .btn.blue { background: linear-gradient(180deg, #8fd0ff, #3a96ea); color: #fff; box-shadow: 0 5px 0 #2a6fb0, 0 8px 16px rgba(42, 111, 176, 0.3); text-shadow: 0 2px 0 rgba(0,0,0,.15); }
  .btn.yellow { background: linear-gradient(180deg, #ffe78a, #f7bd2b); color: #6a4700; box-shadow: 0 5px 0 #c48a12, 0 8px 16px rgba(196, 138, 18, 0.3); }
  .btn.pink { background: linear-gradient(180deg, #ffadc8, #f0628f); color: #fff; box-shadow: 0 5px 0 #c2406c, 0 8px 16px rgba(194, 64, 108, 0.3); text-shadow: 0 2px 0 rgba(0,0,0,.15); }
  .btn.purple { background: linear-gradient(180deg, #cbb2ff, #8e62e8); color: #fff; box-shadow: 0 5px 0 #6a42b8, 0 8px 16px rgba(106, 66, 184, 0.3); text-shadow: 0 2px 0 rgba(0,0,0,.15); }
  .btn.big { font-size: 22px; min-height: 58px; padding: 12px 30px; }
  .btn.sm { font-size: 16px; min-height: 42px; padding: 8px 16px; }
  .btn .badge { background: #ff4d6d; color: #fff; border-radius: 999px; font-size: 14px; min-width: 24px; height: 24px; padding: 0 7px; display: inline-grid; place-items: center; text-shadow: none; }
  .btn .badge.zero { background: rgba(255,255,255,0.55); color: #2a6fb0; }
  .btn.on { outline: 3px solid #fff; }
  .rbtn { border: 0; background: #fff; border-radius: 50%; width: 52px; height: 52px; display: grid; place-items: center; cursor: pointer;
    box-shadow: 0 4px 0 rgba(58, 46, 68, 0.2), 0 6px 12px rgba(58, 46, 68, 0.12); color: var(--ink); padding: 0; flex: 0 0 auto; }
  .rbtn svg { width: 56%; height: 56%; }
  .rbtn:active { transform: translateY(3px); box-shadow: 0 1px 0 rgba(58, 46, 68, 0.2); }

  /* ---------- 標題 ---------- */
  .title .tbg { position: absolute; inset: 0; width: 100%; height: 100%; }
  .tmain { position: relative; flex: 1; min-height: 0; display: flex; flex-direction: column; align-items: center; justify-content: space-evenly; padding: 62px 16px calc(14px + env(safe-area-inset-bottom)); gap: 10px; }
  .logo { text-align: center; }
  .logo .l1 { font-size: clamp(38px, 11vw, 70px); font-weight: 900; line-height: 1.05; white-space: nowrap; }
  .logo .l1 span { display: inline-block; color: var(--c); animation: hop 2.4s ease-in-out infinite; animation-delay: var(--d);
    text-shadow: 3px 0 0 #fff, -3px 0 0 #fff, 0 3px 0 #fff, 0 -3px 0 #fff, 2px 2px 0 #fff, -2px 2px 0 #fff, 2px -2px 0 #fff, -2px -2px 0 #fff, 0 7px 0 rgba(58,46,68,.18); }
  @keyframes hop { 0%, 70%, 100% { transform: translateY(0); } 80% { transform: translateY(-8px) rotate(-3deg); } 90% { transform: translateY(0); } }
  .logo .l2 { margin-top: 8px; display: flex; gap: 4px; justify-content: center; flex-wrap: nowrap; }
  .logo .l2 i { font-style: normal; font-weight: 900; font-size: clamp(14px, 3.6vw, 22px); width: 1.55em; height: 1.55em; display: grid; place-items: center; border-radius: 7px;
    background: var(--c); color: #fff; box-shadow: 0 3px 0 rgba(58,46,68,.25); transform: rotate(var(--r)); font-family: "Baloo 2", "Inter", Arial, sans-serif; }
  .logo .l2 i.sp { background: none; box-shadow: none; width: 0.6em; }
  .tcard { width: min(62vw, 260px, calc(var(--vh) * 0.36)); aspect-ratio: 1; background: #fff; border-radius: 28px; position: relative; cursor: pointer;
    box-shadow: 0 8px 0 rgba(58,46,68,.14), 0 14px 30px rgba(58,46,68,.14); display: flex; flex-direction: column; align-items: center; padding: 6% 6% 3%; border: 4px solid #fff; outline: 3px dashed #ffc2d4; outline-offset: -12px; }
  .tcard .tpic { flex: 1; min-height: 0; width: 100%; }
  .tcard .tword { font-size: clamp(20px, 5vw, 30px); font-weight: 900; line-height: 1.1; font-family: "Baloo 2", "Inter", Arial, sans-serif; }
  .tcard .tzh { font-size: 14px; font-weight: 800; opacity: 0.6; }
  .tcard.swap { animation: tswap 0.5s ease; }
  @keyframes tswap { 0% { transform: rotateY(0); } 50% { transform: rotateY(90deg) scale(0.95); } 100% { transform: rotateY(0); } }
  .tbtns { display: grid; grid-template-columns: 1fr 1fr; gap: 12px 12px; width: min(100%, 420px); }
  .tbtns .btn.big { grid-column: 1 / -1; }
  .tbtns .btn.set { grid-column: 1 / -1; justify-self: center; min-width: 50%; }
  #app.land .tmain { flex-direction: row; flex-wrap: wrap; align-content: center; justify-content: center; column-gap: 28px; row-gap: 8px; padding-top: 58px; }
  #app.land .logo { width: 100%; }
  #app.land .logo .l1 { font-size: clamp(30px, 7vh, 48px); }
  #app.land .logo .l2 i { font-size: 14px; }
  #app.land .tcard { width: min(52vh, 210px); }
  #app.land .tbtns { width: 340px; }

  /* ---------- 主題地圖 ---------- */
  .tgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; }
  .tc { position: relative; border: 0; border-radius: 22px; background: #fff; cursor: pointer; padding: 10px 10px 12px; text-align: center; overflow: hidden;
    box-shadow: 0 5px 0 rgba(58,46,68,.13), 0 8px 18px rgba(58,46,68,.08); display: flex; flex-direction: column; align-items: center; gap: 2px; }
  .tc::before { content: ''; position: absolute; left: 0; right: 0; top: 0; height: 58%; background: var(--c); opacity: 0.22; border-radius: 0 0 50% 50% / 0 0 24px 24px; }
  .tc:active { transform: translateY(3px); }
  .tc .tp { width: 78px; height: 78px; position: relative; }
  .tc b { font-size: 20px; position: relative; }
  .tc small { font-size: 13px; font-weight: 800; opacity: 0.55; font-family: "Baloo 2", "Inter", Arial, sans-serif; position: relative; }
  .tc .meta { display: flex; align-items: center; gap: 6px; width: 100%; margin-top: 4px; font-size: 13px; font-weight: 800; }
  .bar { flex: 1; height: 10px; border-radius: 99px; background: #eee6ef; overflow: hidden; }
  .bar i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, #ffc93b, #ff8a3d); border-radius: 99px; transition: width 0.5s; }
  .tc .done { position: absolute; right: 8px; top: 8px; width: 30px; height: 30px; }
  .stars { display: inline-flex; gap: 1px; align-items: center; }
  .stars svg { width: 18px; height: 18px; }
  .st-off { fill: #e4dbe6; } .st-on { fill: #ffc21a; stroke: #e09a00; stroke-width: 1.5; }
  .tc .sc { display: inline-flex; align-items: center; gap: 2px; font-size: 13px; font-weight: 900; white-space: nowrap; }
  .tc .sc svg { width: 16px; height: 16px; }

  /* ---------- 主題頁 ---------- */
  .tinfo { display: flex; align-items: center; gap: 12px; background: #fff; border-radius: 20px; padding: 10px 14px; box-shadow: 0 4px 0 rgba(58,46,68,.1); margin-bottom: 12px; }
  .tinfo .tp { width: 62px; height: 62px; flex: 0 0 auto; }
  .tinfo .ti { flex: 1; min-width: 0; font-weight: 800; font-size: 14px; }
  .tinfo .ti .row { display: flex; align-items: center; gap: 8px; margin: 3px 0; }
  .tinfo .ti .row span { white-space: nowrap; }
  .strip { display: flex; gap: 6px; overflow-x: auto; padding: 4px 2px 8px; margin-bottom: 4px; touch-action: pan-x; scrollbar-width: none; }
  .strip::-webkit-scrollbar { display: none; }
  .strip .sw { flex: 0 0 auto; width: 54px; height: 54px; background: #fff; border-radius: 14px; padding: 4px; box-shadow: 0 3px 0 rgba(58,46,68,.1); border: 0; cursor: pointer; }
  .strip .sw.locked .pic { filter: grayscale(1) opacity(0.35); }
  .agrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px; }
  .ac { border: 0; display: flex; align-items: center; gap: 12px; background: #fff; border-radius: 20px; padding: 10px 14px 10px 10px; cursor: pointer; text-align: left;
    box-shadow: 0 5px 0 rgba(58,46,68,.12), 0 8px 16px rgba(58,46,68,.07); border-left: 8px solid var(--c); }
  .ac:active { transform: translateY(3px); }
  .ac .ai { width: 60px; height: 60px; flex: 0 0 auto; border-radius: 16px; background: color-mix(in srgb, var(--c) 18%, #fff); padding: 5px; }
  .ac .at { flex: 1; min-width: 0; }
  .ac .at b { font-size: 20px; display: block; }
  .ac .at small { font-size: 13px; opacity: 0.65; font-weight: 700; display: block; line-height: 1.3; }
  .ac .stars svg { width: 22px; height: 22px; }

  /* ---------- 活動共用 ---------- */
  .act .ahd { flex: 0 0 auto; display: flex; flex-direction: column; align-items: center; padding: 6px 66px 0; min-height: 62px; justify-content: center; }
  .atitle { text-align: center; line-height: 1.1; }
  .atitle b { font-size: clamp(19px, 5vw, 25px); display: block; }
  .atitle small { font-size: 12px; font-weight: 800; opacity: 0.6; }
  .astat { flex: 0 0 auto; height: 40px; display: flex; align-items: center; gap: 10px; padding: 0 70px 0 16px; }
  .act .astat { width: 100%; max-width: 560px; }
  .astat .bar { height: 14px; }
  .astat .num { font-weight: 900; font-size: 15px; min-width: 44px; text-align: right; white-space: nowrap; }
  .astat .pill { background: #fff; border-radius: 99px; padding: 3px 10px; font-weight: 900; font-size: 14px; white-space: nowrap; box-shadow: 0 2px 0 rgba(58,46,68,.12); }
  .stage { position: relative; flex: 1 1 auto; min-height: 0; margin: 4px 12px calc(10px + env(safe-area-inset-bottom)); }
  #app.land .act .ahd { flex-direction: row; gap: 16px; min-height: 56px; padding: 4px 70px 0; }
  #app.land .act .astat { flex: 1; padding: 0; max-width: 360px; }
  #app.land .act .stage { margin: 2px 68px calc(6px + env(safe-area-inset-bottom)) 14px; }
  #app.wide .act .stage { width: min(100% - 24px, 980px); align-self: center; }
  .fb { position: absolute; left: 50%; top: 22%; transform: translate(-50%, -50%) scale(0.6); z-index: 50; pointer-events: none; opacity: 0;
    font-size: clamp(28px, 8vw, 46px); font-weight: 900; color: #fff; white-space: nowrap; padding: 4px 22px; border-radius: 99px;
    font-family: "Baloo 2", "Inter", "PingFang TC", "Noto Sans TC", sans-serif; }
  .fb.good { background: rgba(63, 184, 96, 0.92); }
  .fb.oops { background: rgba(255, 138, 61, 0.92); }
  .fb.info { background: rgba(58, 150, 234, 0.92); }
  .fb.show { animation: fbPop 1s ease-out forwards; }
  @keyframes fbPop { 0% { opacity: 0; transform: translate(-50%, -50%) scale(0.5); } 18% { opacity: 1; transform: translate(-50%, -50%) scale(1.08); } 30% { transform: translate(-50%, -50%) scale(1); } 75% { opacity: 1; } 100% { opacity: 0; transform: translate(-50%, -80%) scale(1); } }

  /* 暫停鍵：右上 🔊 下面 */
  #pauseBtn { position: fixed; right: 12px; top: 64px; width: 44px; height: 44px; z-index: 8800; display: none; }
  #pauseBtn.show { display: grid; }

  /* ---------- 看圖聽音 ---------- */
  .fc { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; gap: 10px; }
  .fc .cardwrap { flex: 1 1 auto; min-height: 0; width: 100%; display: flex; justify-content: center; align-items: center; perspective: 1200px; touch-action: none; }
  .fcard { position: relative; width: 300px; height: 360px; transform-style: preserve-3d; transition: transform 0.5s cubic-bezier(.3,1.3,.5,1); cursor: pointer; }
  .fcard.flip { transform: rotateY(180deg); }
  .fcard.slideL { animation: slideL 0.32s ease-out; } .fcard.slideR { animation: slideR 0.32s ease-out; }
  @keyframes slideL { from { opacity: 0; transform: translateX(40px) rotate(3deg); } to { opacity: 1; transform: none; } }
  @keyframes slideR { from { opacity: 0; transform: translateX(-40px) rotate(-3deg); } to { opacity: 1; transform: none; } }
  .face { position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden; background: #fff; border-radius: 26px; display: flex; flex-direction: column; align-items: center;
    padding: 5% 6% 4%; box-shadow: 0 8px 0 rgba(58,46,68,.13), 0 14px 28px rgba(58,46,68,.12); border: 5px solid var(--c); }
  .face.back { transform: rotateY(180deg); background: linear-gradient(180deg, #fffdf6, #fff3e2); justify-content: center; gap: 4%; }
  .face .fp { flex: 1 1 auto; min-height: 0; width: 100%; }
  .face .fw { font-size: clamp(30px, 9vw, 56px); font-weight: 900; line-height: 1.05; font-family: "Baloo 2", "Inter", Arial, sans-serif; display: flex; align-items: center; gap: 10px; }
  .face .fw .ico { width: 0.62em; height: 0.62em; color: #3a96ea; }
  .face .fz { font-size: clamp(40px, 12vw, 72px); font-weight: 900; color: #e8564a; line-height: 1.1; }
  .face .fe { font-size: clamp(22px, 6vw, 34px); font-weight: 900; font-family: "Baloo 2", "Inter", Arial, sans-serif; opacity: 0.8; }
  .face .fsp { width: 38%; flex: 0 1 auto; aspect-ratio: 1; min-height: 0; }
  .face.bounce { animation: bounce 0.4s; }
  @keyframes bounce { 30% { transform: scale(1.04); } 60% { transform: scale(0.98); } }
  .face .heard { position: absolute; top: 10px; right: 12px; width: 26px; height: 26px; color: #3fb860; opacity: 0; transition: opacity 0.3s; }
  .face .heard.on { opacity: 1; }
  .fnav { flex: 0 0 auto; display: flex; gap: 12px; align-items: center; justify-content: center; }
  .fnav .rbtn { width: 56px; height: 56px; }
  #app.land .fc { flex-direction: row; }
  #app.land .fcard { aspect-ratio: 4 / 3; }
  #app.land .face { flex-direction: row; gap: 4%; padding: 4% 5%; }
  #app.land .face .fp { height: 100%; width: auto; flex: 1 1 55%; }
  #app.land .face.back { flex-direction: column; }
  #app.land .fnav { flex-direction: column; }

  /* ---------- 選圖 ---------- */
  .lq { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; gap: 12px; }
  .lq .ask { flex: 0 0 auto; display: flex; align-items: center; gap: 12px; }
  .spkbtn { border: 0; border-radius: 999px; background: linear-gradient(180deg, #8fd0ff, #3a96ea); color: #fff; font-weight: 900; font-size: 19px; padding: 8px 20px 8px 10px; min-height: 58px;
    display: inline-flex; align-items: center; gap: 10px; cursor: pointer; box-shadow: 0 5px 0 #2a6fb0; text-shadow: 0 2px 0 rgba(0,0,0,.15); }
  .spkbtn .ico { width: 40px; height: 40px; background: #fff; color: #3a96ea; border-radius: 50%; padding: 8px; }
  .spkbtn:active { transform: translateY(4px); box-shadow: 0 1px 0 #2a6fb0; }
  .spkbtn.talk .ico { animation: talk 0.5s ease-in-out 3; }
  @keyframes talk { 50% { transform: scale(1.18); } }
  .lq .qword { font-size: 26px; font-weight: 900; font-family: "Baloo 2", "Inter", Arial, sans-serif; min-height: 1.2em; }
  .opts { flex: 1 1 0; min-height: 0; min-width: 0; align-self: stretch; width: 100%; display: grid; grid-template-columns: repeat(var(--cols, 2), var(--cell, 120px)); gap: 14px; place-content: center; }
  .opt { width: var(--cell); height: var(--cell); border: 0; padding: 7%; border-radius: 24px; background: #fff; cursor: pointer; position: relative;
    box-shadow: 0 6px 0 rgba(58,46,68,.13), 0 10px 20px rgba(58,46,68,.08); display: flex; flex-direction: column; align-items: center; transition: transform 0.15s, opacity 0.3s, box-shadow 0.2s; }
  .opt:active { transform: translateY(3px) scale(0.98); }
  .opt .lbl { position: absolute; left: 0; right: 0; bottom: 6px; font-weight: 900; font-size: clamp(14px, calc(var(--cell) * 0.13), 22px); opacity: 0; transition: opacity 0.2s; font-family: "Baloo 2", "Inter", Arial, sans-serif; }
  .opt.ok { box-shadow: 0 0 0 6px #3fb860, 0 6px 0 rgba(58,46,68,.13); animation: okPop 0.45s; }
  .opt.ok .lbl { opacity: 1; }
  .opt.ok .pic { transform: scale(0.86) translateY(-8%); transition: transform 0.25s; }
  .opt.no { animation: shake 0.42s; opacity: 0.42; }
  .opt.dim { opacity: 0.35; }
  @keyframes okPop { 40% { transform: scale(1.08); } }
  @keyframes shake { 20% { transform: translateX(-8px) rotate(-3deg); } 40% { transform: translateX(8px) rotate(3deg); } 60% { transform: translateX(-5px); } 80% { transform: translateX(4px); } }
  #app.land .lq { flex-direction: row; }
  #app.land .lq .ask { flex-direction: column; width: 170px; }

  /* ---------- 拼字 ---------- */
  .sp { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; touch-action: none; }
  .sp .top { flex: 0 1 auto; height: min(240px, 36%); min-height: 0; display: flex; align-items: center; gap: 14px; justify-content: center; width: 100%; }
  .sp .spic { height: 100%; max-height: 220px; aspect-ratio: 1; background: #fff; border-radius: 26px; padding: 4%; box-shadow: 0 6px 0 rgba(58,46,68,.12); }
  .sp .zh { font-weight: 900; font-size: 18px; opacity: 0.7; text-align: center; }
  .slots, .tiles { flex: 0 0 auto; display: flex; gap: var(--gap, 8px); justify-content: center; flex-wrap: nowrap; }
  .tiles { flex-wrap: wrap; max-width: 100%; min-height: var(--t, 56px); }
  .slot, .tile { width: var(--t, 56px); height: var(--t, 56px); border-radius: 14px; display: grid; place-items: center; font-weight: 900; font-size: calc(var(--t, 56px) * 0.56);
    font-family: "Baloo 2", "Inter", Arial, sans-serif; line-height: 1; }
  .slot { background: rgba(255,255,255,0.6); border: 3px dashed #c9b9d3; color: var(--ink); }
  .slot.fill { background: #fff; border: 3px solid #3fb860; animation: okPop 0.3s; }
  .slot.hint { background: #fff8d6; border: 3px solid #ffc21a; }
  .slot.bad { animation: shake 0.4s; border-color: #ff8a3d; }
  .slot.next { border-color: #3a96ea; background: rgba(255,255,255,0.9); }
  .tile { border: 0; background: linear-gradient(180deg, #fff 0%, #fff4d6 100%); box-shadow: 0 5px 0 #e0b44a, 0 8px 12px rgba(58,46,68,.12); cursor: grab; position: relative; touch-action: none; color: #6a3fb0; }
  .tile.drag { z-index: 60; cursor: grabbing; box-shadow: 0 10px 0 #e0b44a, 0 18px 24px rgba(58,46,68,.25); transition: none; }
  .tile.back { transition: transform 0.25s cubic-bezier(.3,1.4,.5,1); }
  .tile.used { visibility: hidden; }
  .tile.glow { animation: glow 0.9s ease-in-out infinite; }
  @keyframes glow { 50% { box-shadow: 0 5px 0 #e0b44a, 0 0 0 6px rgba(58,150,234,.5); } }
  #app.land .sp { flex-direction: row; }
  #app.land .sp .top { flex: 0 0 auto; width: auto; height: 100%; flex-direction: column; justify-content: center; }
  #app.land .sp .top .spic { height: auto; width: min(36vh, 170px); }
  #app.land .sp .right { flex: 1; min-width: 0; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; }
  .sp .right { display: contents; }

  /* ---------- 配對 ---------- */
  .mt { position: absolute; inset: 0; touch-action: none; }
  .mt svg.lines { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 5; overflow: visible; }

const PIC_CACHE = new Map();
/** 取得某個字的圖（離屏 canvas，px 為邊長像素） */
function picCanvas(id, px) {
  px = Math.max(16, Math.round(px));
  const k = id + '@' + px;
  let cv = PIC_CACHE.get(k);
  if (cv) return cv;
  cv = document.createElement('canvas'); cv.width = cv.height = px;
  const c = cv.getContext('2d');
  const prev = X; X = c;
  c.save(); c.scale(px / 100, px / 100);
  try { (PIC[id] || (() => T('?', 50, 52, 50, '#ccc')))(); } catch (e) { /* 單張圖出錯不影響其他 */ }
  c.restore(); X = prev;
  if (PIC_CACHE.size > 900) PIC_CACHE.delete(PIC_CACHE.keys().next().value);
  PIC_CACHE.set(k, cv);
  return cv;
}
/** 做一個顯示用的 <canvas>（CSS 尺寸 css，依 dpr 取解析度） */
function picEl(id, css, cls) {
  const dpr = Math.min(2, window.devicePixelRatio || 1), px = Math.ceil(css * dpr / 32) * 32;
  const src = picCanvas(id, px);
  const cv = document.createElement('canvas'); cv.width = cv.height = px;
  cv.getContext('2d').drawImage(src, 0, 0);
  cv.className = 'pic' + (cls ? ' ' + cls : '');
  cv.setAttribute('aria-hidden', 'true');
  return cv;
}

/* ---------- 樂曲 ---------- */
const NN = ['C', 'C#', 'D', 'D#', 'E', 'F', 'F#', 'G', 'G#', 'A', 'A#', 'B'];
const PC = { C: 0, D: 2, E: 4, F: 5, G: 7, A: 9, B: 11 };
const QUAL = { '': [0, 4, 7], m: [0, 3, 7], '7': [0, 4, 7, 10], maj7: [0, 4, 7, 11], m7: [0, 3, 7, 10], sus4: [0, 5, 7], sus2: [0, 2, 7], add9: [0, 4, 7, 14] };
function chordPcs(ch) {
  const m = /^([A-G])([#b]?)(.*)$/.exec(ch);
  const r = PC[m[1]] + (m[2] === '#' ? 1 : m[2] === 'b' ? -1 : 0);
  return (QUAL[m[3]] || QUAL['']).map(i => (r + i) % 12);
}
const nm = midi => NN[midi % 12] + (Math.floor(midi / 12) - 1);
/** 烏克麗麗式的和弦按法：每個和弦音放在 D4～C#5 之間（很亮、很近） */
function ukeVoicing(ch) {
  const pcs = chordPcs(ch).slice(0, 4);
  const ms = pcs.map(pc => { let m = 60 + pc; if (m < 62) m += 12; return m; }).sort((a, b) => a - b);
  return ms.map(nm);
}
/** 刷法：D 下刷（整個和弦）、U 上刷（上面兩個音）、. 休息；8 格 = 一小節八分音符 */
function strum(chords, pat, which) {
  return chords.map((ch, bi) => {
    const v = ukeVoicing(ch), p = Array.isArray(pat) ? pat[bi % pat.length] : pat;
    return p.split('').map(c => c === which ? (c === 'D' ? v.join('+') : v.slice(-2).join('+')) : '.').join(' ');
  });
}

/* ---------- 英文語音 ---------- */
const Voice = (function () {
  const ss = window.speechSynthesis || null;
  let en = null, count = 0, duckT = 0;
  function pick() {
    if (!ss) return;
    try {
      const v = ss.getVoices() || [];
      count = v.length;
      const ev = v.filter(x => /^en[-_]/i.test(x.lang));
      const pref = [/samantha/i, /google us english/i, /aria|jenny|zira/i, /ava|allison|susan/i, /google uk english female/i, /karen|serena|daniel/i];
      en = null;
      for (const re of pref) { en = ev.find(x => re.test(x.name)); if (en) break; }
      if (!en) en = ev.find(x => /^en[-_]US/i.test(x.lang)) || ev.find(x => /^en[-_]GB/i.test(x.lang)) || ev[0] || null;
    } catch (e) { en = null; }
  }
  pick();
  try { if (ss) ss.addEventListener('voiceschanged', pick); } catch (e) { /* 忽略 */ }
  function release(ms) { clearTimeout(duckT); duckT = setTimeout(() => duck(false), ms); }
  return {
    /** 念英文；沒有英文語音時改用文字泡泡 */
    speak(text) {
      if (KG.isMuted() || !text) return;
      pick();
      if (!ss || (count > 0 && !en)) { wordPop(text); return; }
      try {
        ss.cancel();
        const u = new SpeechSynthesisUtterance(text);
        u.lang = en ? en.lang : 'en-US';
        if (en) u.voice = en;
        u.rate = slowVoice ? 0.7 : 0.85;
        u.pitch = 1.08;
        duck(true);
        release(1400 + text.length * 120);
        u.onend = u.onerror = () => release(160);
        ss.speak(u);
      } catch (e) { duck(false); }
    },
    stop() { try { if (ss) ss.cancel(); } catch (e) { /* 忽略 */ } release(50); },
    has() { pick(); return !!ss && (count === 0 || !!en); }
  };
})();

/** 從清單挑 n 個字，還沒學會的優先 */

}

/** 依格子大小算出最好的欄數（點擊目標盡量大） */
function fitGrid(box, n, aspect, gap, maxCell) {
  const r = box.getBoundingClientRect();
  let best = 0, bc = 1;
  for (let cols = 1; cols <= n; cols++) {
    const rows = Math.ceil(n / cols);
    const w = (r.width - gap * (cols - 1)) / cols, hh = (r.height - gap * (rows - 1)) / rows;
    const s = Math.min(w, hh * aspect);
    if (s > best + 0.5) { best = s; bc = cols; }
  }
  best = Math.max(60, Math.min(best, maxCell || 999));
  box.style.setProperty('--cols', bc); box.style.setProperty('--cell', Math.floor(best) + 'px');
  return best;
}

/* ---------- 結算 ---------- */
function finishAct(fr, theme, actId, stars, msg, extra) {
  resultOpen = true;
  pauseBtn.classList.remove('show');
  const key = theme + '.' + actId, prev = prog.stars[key] || 0;
  if (stars > prev) prog.stars[key] = stars;
  const th = THEME[theme];
  let themeDone = false;
  if (!prog.done[theme] && ACTS.every(a => (prog.stars[theme + '.' + a.id] || 0) > 0)) { prog.done[theme] = 1; themeDone = true; }
  saveProg();
  const body = ce('div');
  body.innerHTML = `<div class="rstars">${[0, 1, 2].map(i => `<span style="display:inline-block">${starSvg(i < stars).replace('<svg', `<svg style="animation-delay:${0.15 + i * 0.18}s"`)}</span>`).join('')}</div>` +
    `<div class="rmsg">${msg}</div>` + (extra || '');
  if (fr.newStk && fr.newStk.length) {
    const nw = ce('div', '', `<div style="font-size:14px;opacity:.7">新貼紙 ${fr.newStk.length} 張</div>`), row = ce('div', 'rnew');

  }

  const idx = ACTS.findIndex(a => a.id === actId), next = ACTS[(idx + 1) % ACTS.length];
  const title = stars >= 3 ? '太棒了！' : stars === 2 ? '很好喔！' : stars === 1 ? '完成了！' : '再試一次！';
  openOverlay(title, body, [
    { text: '再玩一次', cls: 'yellow', fn: () => show(actId, { theme }) },
    { text: '下一個：' + next.zh, cls: 'green', fn: () => show(next.id, { theme }) },
    { text: '回主題', cls: 'blue', fn: () => show('theme', { theme }) }

  KG.vibrate(stars >= 3 ? [30, 40, 30] : 25);
}

    const n = KG.lowEnd ? 8 : 12, ids = KG.shuffle(WORDS.map(w => w.id)).slice(0, n);

SCREENS.cards = ({ theme }) => {
  const th = THEME[theme], fr = actFrame(ACT.cards, th);
  const deck = th.list.slice();
  let i = 0, flipped = false, heard = new Set(), finished = false;
  fr.stage.innerHTML = `<div class="fc"><div class="cardwrap"><div class="fcard"></div></div><div class="fnav"></div></div>`;
  const wrap = fr.stage.querySelector('.cardwrap'), card = fr.stage.querySelector('.fcard'), nav = fr.stage.querySelector('.fnav');
  card.style.setProperty('--c', th.col);
  const bPrev = ce('button', 'rbtn', ICON.left), bFlip = ce('button', 'rbtn', ICON.flip), bNext = ce('button', 'rbtn', ICON.right);
  bPrev.setAttribute('aria-label', '上一張'); bFlip.setAttribute('aria-label', '翻面'); bNext.setAttribute('aria-label', '下一張');
  bFlip.style.cssText = 'width:64px;height:64px;color:#e8564a';
  nav.append(bPrev, bFlip, bNext);
  function render(dir) {
    const w = deck[i];
    flipped = false; card.classList.remove('flip');
    card.innerHTML = '';
    const front = ce('div', 'face front'), back = ce('div', 'face back');
    const fp = ce('div', 'fp'); fp.appendChild(picEl(w.id, 300));
    front.append(fp, ce('div', 'fw', w.en + ICON.spk), ce('div', 'heard' + (heard.has(w.id) ? ' on' : ''), ICON.check));
    const bsp = ce('div', 'fsp'); bsp.appendChild(picEl(w.id, 140));
    back.append(bsp, ce('div', 'fz', w.zh), ce('div', 'fe', w.en));
    card.append(front, back);
    if (dir) { card.classList.remove('slideL', 'slideR'); void card.offsetWidth; card.classList.add(dir > 0 ? 'slideL' : 'slideR'); }
    fr.progress(i, deck.length);
    bPrev.style.visibility = i > 0 ? 'visible' : 'hidden';
    bNext.innerHTML = i === deck.length - 1 ? ICON.check.replace('<svg', '<svg style="width:70%;height:70%"') : ICON.right;
    prog.seen[w.id] = 1; saveProg();
    clearTimeout(render._t);
    render._t = setTimeout(() => hear(), dir ? 380 : 500);
  }
  function hear() {
    if (paused || finished) return;
    const w = deck[i]; say(w); heard.add(w.id);
    const f = card.querySelector('.front'); if (f) { f.classList.remove('bounce'); void f.offsetWidth; f.classList.add('bounce'); const h = f.querySelector('.heard'); if (h) h.classList.add('on'); }
  }
  function flip() {
    flipped = !flipped; card.classList.toggle('flip', flipped);
    sfx('ew_flip', { pan: panOf(card) });
    if (!flipped) setTimeout(hear, 300);
  }
  function go(d) {
    if (finished) return;
    if (i + d >= deck.length) { finish(); return; }
    if (i + d < 0) { sfx('error'); return; }
    i += d; sfx('ew_page', { pan: d > 0 ? 0.3 : -0.3 }); sfx('card'); render(d);
  }
  function finish() {
    finished = true;
    const n = heard.size;
    const stars = n >= deck.length ? 3 : n >= deck.length * 0.66 ? 2 : 1;
    finishAct(fr, theme, 'cards', stars, `看完 ${deck.length} 張單字卡，聽了 ${n} 個發音！`, '<div class="rbest">接下來玩「聽音選圖」收集貼紙吧</div>');
  }
  bindBtn(bPrev, () => go(-1), false); bindBtn(bNext, () => go(1), false); bindBtn(bFlip, flip, false);
  // 點卡片：正面念單字、背面翻回來；左右滑換卡
  let sx = 0, sy = 0, down = false;
  wrap.addEventListener('pointerdown', e => { down = true; sx = e.clientX; sy = e.clientY; });
  wrap.addEventListener('pointerup', e => {
    if (!down) return; down = false;
    const dx = e.clientX - sx, dy = e.clientY - sy;
    if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy)) { go(dx < 0 ? 1 : -1); return; }
    if (Math.abs(dx) < 12 && Math.abs(dy) < 12) {
      const r = card.getBoundingClientRect();
      if (e.clientX < r.left - 20 || e.clientX > r.right + 20) return;
      if (flipped) flip(); else { sfx('ew_spk', { pan: panOf(card) }); hear(); }
    }
  });
  wrap.addEventListener('pointercancel', () => { down = false; });
  function key(e) {
    if (paused || resultOpen) return;
    if (e.key === 'ArrowRight') go(1); else if (e.key === 'ArrowLeft') go(-1);
    else if (e.key === ' ' || e.key === 'Enter' || e.key === 'ArrowUp' || e.key === 'ArrowDown') { flip(); e.preventDefault(); }
  }
  addEventListener('keydown', key);
  render(0);
  function layout() {
    const r = wrap.getBoundingClientRect(); if (!r.width) return;
    const asp = app.classList.contains('land') ? 4 / 3 : 3 / 3.6;
    let hh = Math.min(r.height - 24, 520), ww = hh * asp;
    if (ww > r.width) { ww = r.width; hh = ww / asp; }
    card.style.width = Math.floor(ww) + 'px'; card.style.height = Math.floor(hh) + 'px';
  }
  return {
    el: fr.el, pausable: true, layout,
    start() { playSong(SONG_STUDY); },
    leave() { removeEventListener('keydown', key); clearTimeout(render._t); },
    back() { show('theme', { theme }); },
    test: { next: () => go(1), flip, finish, get i() { return i; } }
  };
};

/* =====================================================================
 * 聽音選圖（也用在「複習」）
 * ===================================================================== */
function quizScreen({ theme, review }) {
  const th = theme ? THEME[theme] : null;
  const fr = actFrame(review ? { zh: '複習' } : ACT.listen, th, review ? '錯字複習' : null);
  const nOpt = little() ? 3 : 4;
  const qs = review ? dueList().slice(0, 10) : pickWords(th.list, 8);
  let qi = 0, mistakes = 0, streak = 0, best = 0, lock = false, missed = false, right = 0, nextT = 0;
  fr.stage.innerHTML = `<div class="lq"><div class="ask"></div><div class="opts"></div></div>`;
  const ask = fr.stage.querySelector('.ask'), opts = fr.stage.querySelector('.opts');
  const spk = speakBtn(() => qs[qi]);
  const qword = ce('div', 'qword');
  ask.append(spk, qword);
  function layout() { if (opts.children.length) fitGrid(opts, opts.children.length, 1, 14, 230); }
  function nextQ() {
    if (qi >= qs.length) return finish();
    const w = qs[qi], pool = THEME[w.theme].list.filter(x => x !== w);
    const all = KG.shuffle([w].concat(KG.shuffle(pool).slice(0, nOpt - 1)));
    lock = false; missed = false; qword.textContent = little() ? '' : '';
    opts.innerHTML = '';
    fitGrid(opts, all.length, 1, 14, 230);
    const cell = parseFloat(getComputedStyle(opts).getPropertyValue('--cell')) || 140;
    all.forEach(o => {
      const b = ce('button', 'opt'); b.appendChild(picEl(o.id, cell * 0.86)); b.appendChild(ce('div', 'lbl', o.en));
      b.setAttribute('aria-label', o.en);
      b.addEventListener('click', () => choose(o, b));
      opts.appendChild(b);
    });
    fr.progress(qi, qs.length);
    nextT = setTimeout(() => { if (!paused && cur && cur.el === fr.el) say(w, spk); }, 420);
  }
  function choose(o, b) {
    if (lock || paused) return;
    const w = qs[qi];
    if (o === w) {
      lock = true; streak++; best = Math.max(best, streak); if (!missed) right++;
      b.classList.add('ok'); opts.querySelectorAll('.opt').forEach(x => { if (x !== b) x.classList.add('dim'); });
      chime(streak, b); feedback(fr, praise(streak), 'good'); KG.vibrate(15);
      qword.textContent = w.en + '  ' + w.zh;
      if (review && !missed) reviewRight(w);
      learn(w, fr);
      if (M) M.setLayer('drive', streak >= 3);
      setTimeout(() => say(w), 250);
      qi++; nextT = setTimeout(nextQ, 1300);
    } else {
      if (b.classList.contains('no')) return;
      streak = 0; mistakes++;
      if (M) M.setLayer('drive', false);

  let bubbles = [], parts = [], pops = [], spawnT = 0.3, noTgtT = 0, raf = 0, last = 0, running = false, ended = false, tgtWait = 0, t0 = 0, readyT = 1.3;
  const sw = ce('span', 'pill'); fr.stat.insertBefore(sw, fr.num);
  function hud() { fr.fill.style.width = Math.round(100 * done / TOTAL) + '%'; fr.num.textContent = Math.min(done + 1, TOTAL) + ' / ' + TOTAL; sw.textContent = score + ' 分' + (combo >= 2 ? '  連擊 ×' + combo : ''); }
  function layout() {
    const r = bb.getBoundingClientRect(); if (!r.width) return;
    dpr = Math.min(2, devicePixelRatio || 1) * (KG.lowEnd ? 0.8 : 1);
    W = r.width; H = r.height;
    cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
    const nr = Math.round(clamp(Math.min(W, H) * (lit ? 0.13 : 0.115), 38, 70));
    if (nr !== R || !shell) { R = nr; makeShell(); }
  }
  /** 泡泡外殼先畫在離屏 canvas（不用 shadowBlur） */
  function makeShell() {
    const s = Math.ceil(R * 2.2 * dpr); shell = document.createElement('canvas'); shell.width = shell.height = s;
    const c = shell.getContext('2d'), m = s / 2, rr2 = R * dpr;
    let g = c.createRadialGradient(m, m, rr2 * 0.55, m, m, rr2);
    g.addColorStop(0, 'rgba(255,255,255,0.08)'); g.addColorStop(0.8, 'rgba(160,215,255,0.32)'); g.addColorStop(1, 'rgba(110,180,255,0.75)');
    c.fillStyle = g; c.beginPath(); c.arc(m, m, rr2, 0, TAU); c.fill();
    c.strokeStyle = 'rgba(255,255,255,0.95)'; c.lineWidth = 2.5 * dpr; c.stroke();
    c.fillStyle = 'rgba(255,255,255,0.85)'; c.beginPath(); c.ellipse(m - rr2 * 0.42, m - rr2 * 0.45, rr2 * 0.22, rr2 * 0.12, -0.7, 0, TAU); c.fill();
    c.beginPath(); c.arc(m + rr2 * 0.5, m + rr2 * 0.42, rr2 * 0.07, 0, TAU); c.fill();
    g = c.createLinearGradient(0, m - rr2, 0, m + rr2); g.addColorStop(0, 'rgba(255,190,230,0.25)'); g.addColorStop(1, 'rgba(190,255,230,0.2)');
    c.strokeStyle = g; c.lineWidth = 5 * dpr; c.beginPath(); c.arc(m, m, rr2 - 4 * dpr, 0, TAU); c.stroke();
  }
  function setTarget() {
    const pool = th.list.filter(w => w !== target);
    const fresh = pool.filter(w => !prog.learned[w.id]);
    target = KG.pick(fresh.length && Math.random() < 0.6 ? fresh : pool);
    wrongOnT = false; noTgtT = 0;
    tgt.innerHTML = ICON.spk + `<span>${target.en}</span>` + (lit ? `<small>${target.zh}</small>` : '');
    tgt.classList.remove('pulse'); void tgt.offsetWidth; tgt.classList.add('pulse');
    sfx('select', { vol: 0.8 });
    setTimeout(() => { if (running && !paused) say(target); }, 150);
    hud();
  }
  function spawn(isT) {
    const w = isT ? target : KG.pick(th.list.filter(x => x !== target && !bubbles.some(b => b.w === x && !b.pop)));
    if (!w) return;
    const lanes = Math.max(2, Math.floor(W / (R * 2.3)));
    let lane = 0, bestScore = -1;
    for (let k = 0; k < lanes; k++) {
      const x = (k + 0.5) * W / lanes;
      const near = bubbles.reduce((m, b) => Math.min(m, Math.hypot(b.x0 - x, (b.y - H) * 0.8)), 1e9);
      const sc = near + Math.random() * 20;
      if (sc > bestScore) { bestScore = sc; lane = k; }
    }
    const speed = (H + 2 * R) / ((lit ? 8.2 : 6.2) * (1 - Math.min(0.3, done * 0.025)));
    bubbles.push({ w, x0: (lane + 0.5) * W / lanes, x: 0, y: H + R, v: speed * (0.9 + Math.random() * 0.2), ph: Math.random() * 6, amp: 6 + Math.random() * 10, shake: 0, pop: 0, sc: 0 });
  }
  function nextTarget() {
    done++; hud();
    if (M) M.setTempo(TOTAL - done <= 3 ? 1.08 : 1);
    if (done >= TOTAL) { endGame(); return; }
    tgtWait = 0.55;
  }
  function hit(b) {
    b.pop = 1; hits++; combo++; bestCombo = Math.max(bestCombo, combo);
    const pts = 10 + 5 * Math.min(combo - 1, 6); score += pts;
    burst(b.x, b.y, true); pops.push({ x: b.x, y: b.y - R * 0.2, t: 0, s: '+' + pts });
    sfx('ew_pop', { pitch: 1 + Math.min(combo, 8) * 0.06, pan: panX(b.x + bb.getBoundingClientRect().left) });
    chime(combo, null); feedback(fr, praise(combo), 'good'); KG.vibrate(15);
    learn(target, fr);
    if (M) M.setLayer('drive', combo >= 3);
    nextTarget();
  }
  function wrong(b) {
    b.shake = 0.45; combo = 0; miss++;
    if (M) M.setLayer('drive', false);
    sfx('ew_wobble', { pan: panX(b.x + bb.getBoundingClientRect().left) }); setTimeout(() => sfx('ew_boop', { vol: 0.8 }), 60);
    feedback(fr, '不是這個，是 ' + target.en, 'oops'); KG.vibrate(35);
    if (!wrongOnT) { wrongOnT = true; markWrong(target); }
    setTimeout(() => { if (running && !paused) say(target); }, 500);
    hud();
  }
  function burst(x, y, big) {
    const n = KG.lowEnd ? 10 : big ? 18 : 8;
    for (let k = 0; k < n && parts.length < 90; k++) { const a = Math.random() * TAU, sp = 60 + Math.random() * 180; parts.push({ x: x + Math.cos(a) * R * 0.8, y: y + Math.sin(a) * R * 0.8, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 40, t: 0, life: 0.5 + Math.random() * 0.3, r: 2 + Math.random() * 3.5 }); }
    pops.push({ ring: true, x, y, t: 0 });
  }
  function tap(e) {
    if (!running || paused || ended) return;
    const r = cv.getBoundingClientRect(), x = e.clientX - r.left, y = e.clientY - r.top;
    let best = null, bd = 1e9;
    bubbles.forEach(b => { if (b.pop) return; const d = Math.hypot(b.x - x, b.y - y); if (d < bd) { bd = d; best = b; } });
    if (!best || bd > R * 1.35) { sfx('tap', { vol: 0.5 }); return; }
    if (best.w === target && tgtWait <= 0) hit(best); else if (best.w !== target) wrong(best);
  }
  cv.addEventListener('pointerdown', e => { e.preventDefault(); tap(e); });
  bindBtn(tgt, () => { if (target) say(target); }, 'ew_spk');
  function update(dt, t) {
    if (readyT > 0) {
      readyT -= dt;
      if (readyT <= 0) { setTarget(); spawn(true); }
      return;
    }
    if (tgtWait > 0) { tgtWait -= dt; if (tgtWait <= 0 && !ended) setTarget(); }
    spawnT -= dt;
    const maxB = lit ? 4 : 5;
    const alive = bubbles.filter(b => !b.pop);
    const hasT = alive.some(b => b.w === target);
    if (!hasT && tgtWait <= 0) noTgtT += dt; else noTgtT = 0;
    if (spawnT <= 0 && alive.length < maxB) { spawn(!hasT && tgtWait <= 0 && (noTgtT > 0.8 || Math.random() < 0.45)); spawnT = (lit ? 1.05 : 0.8) + Math.random() * 0.5; }
    if (noTgtT > 1.6 && alive.length < maxB + 1) { spawn(true); noTgtT = 0; }
    for (const b of bubbles) {
      if (b.pop) { b.pop += dt * 6; continue; }
      b.sc = Math.min(1, b.sc + dt * 4);
      b.y -= b.v * dt; b.x = b.x0 + Math.sin(t * 1.3 + b.ph) * b.amp;
      if (b.shake > 0) { b.shake -= dt; b.x += Math.sin(b.shake * 60) * 8 * b.shake; }
      b.x = clamp(b.x, R, W - R);
      if (b.y < -R) {
        b.gone = true;
        if (b.w === target && tgtWait <= 0 && !ended) {
          miss++; combo = 0;
          if (M) M.setLayer('drive', false);
          sfx('ew_away'); feedback(fr, '飛走了！', 'oops');
          if (!wrongOnT) markWrong(target);
          nextTarget();
        }
      }
    }
    bubbles = bubbles.filter(b => !b.gone && b.pop < 1);
    for (const p of parts) { p.t += dt; p.vy += 300 * dt; p.x += p.vx * dt; p.y += p.vy * dt; }
    parts = parts.filter(p => p.t < p.life);
    for (const p of pops) p.t += dt;
    pops = pops.filter(p => p.t < (p.ring ? 0.35 : 0.8));
  }
  function draw(t) {
    cx.setTransform(dpr, 0, 0, dpr, 0, 0);
    cx.clearRect(0, 0, W, H);
    // 水底的光
    cx.globalAlpha = 0.25; cx.fillStyle = '#fff';
    for (let k = 0; k < 4; k++) { const x = ((k * 0.27 + t * 0.012) % 1.2 - 0.1) * W; cx.beginPath(); cx.moveTo(x, 0); cx.lineTo(x + 40, 0); cx.lineTo(x - 30, H); cx.lineTo(x - 60, H); cx.fill(); }
    cx.globalAlpha = 1;
    const px = Math.round(R * 1.4 * dpr / 16) * 16;
    for (const b of bubbles) {
      const s = b.pop ? 1 + b.pop * 0.4 : b.sc * (1 + Math.sin(t * 3 + b.ph) * 0.025);
      cx.save(); cx.translate(b.x, b.y); cx.scale(s, s);
      if (b.pop) cx.globalAlpha = Math.max(0, 1 - b.pop);
      cx.fillStyle = 'rgba(255,255,255,0.55)'; cx.beginPath(); cx.arc(0, 0, R * 0.92, 0, TAU); cx.fill();
      cx.drawImage(picCanvas(b.w.id, px), -R * 0.7, -R * 0.7, R * 1.4, R * 1.4);
      cx.drawImage(shell, -R * 1.1, -R * 1.1, R * 2.2, R * 2.2);
      cx.restore();
    }
    cx.fillStyle = '#ffffff';
    for (const p of parts) { cx.globalAlpha = 1 - p.t / p.life; cx.beginPath(); cx.arc(p.x, p.y, p.r, 0, TAU); cx.fill(); }
    cx.globalAlpha = 1;
    for (const p of pops) {
      if (p.ring) { cx.strokeStyle = `rgba(255,255,255,${1 - p.t / 0.35})`; cx.lineWidth = 4; cx.beginPath(); cx.arc(p.x, p.y, R * (1 + p.t * 2.5), 0, TAU); cx.stroke(); }
      else { cx.globalAlpha = 1 - p.t / 0.8; cx.font = `900 ${Math.round(R * 0.5)}px "Baloo 2", Inter, Arial, sans-serif`; cx.textAlign = 'center'; cx.lineWidth = 5; cx.strokeStyle = '#fff'; cx.strokeText(p.s, p.x, p.y - p.t * 50); cx.fillStyle = '#ff6f91'; cx.fillText(p.s, p.x, p.y - p.t * 50); cx.globalAlpha = 1; }
    }
    if (readyT > 0) {
      cx.font = `900 ${Math.round(Math.min(W, H) * 0.12)}px "Baloo 2", Inter, "Noto Sans TC", sans-serif`; cx.textAlign = 'center'; cx.textBaseline = 'middle';
      const txt = readyT > 0.55 ? 'Ready?' : 'Go!';
      cx.lineWidth = 8; cx.strokeStyle = '#fff'; cx.strokeText(txt, W / 2, H / 2); cx.fillStyle = '#3a96ea'; cx.fillText(txt, W / 2, H / 2);
    }
  }
  let lastCount = 2;
  function frame(now) {
    raf = requestAnimationFrame(frame);
    const dt = Math.min(0.05, (now - (last || now)) / 1000); last = now;
    if (paused || !running) return;
    t0 += dt;
    const c = readyT > 0.55 ? 2 : readyT > 0 ? 1 : 0;
    if (c !== lastCount) { lastCount = c; sfx(c ? 'countdown' : 'go', { vol: 0.7 }); }
    update(dt, t0); draw(t0);
  }
  function endGame() {
    ended = true; running = false;
    if (M) { M.setLayer('drive', false); M.setTempo(1); }
    const best = KG.best(bestKey, score);
    const stars = hits >= 11 ? 3 : hits >= 8 ? 2 : hits >= 4 ? 1 : 0;
    setTimeout(() => finishAct(fr, theme, 'bubble', stars, `戳中 ${hits} / ${TOTAL} 個，得到 ${score} 分`,
      `<div class="rbest">最高紀錄 ${best} 分</div><div class="rbest">最多連擊 ×${bestCombo}</div>`), 600);
  }
  return {
    el: fr.el, pausable: true, layout,
    start() { playSong(SONG_PLAY); hud(); sw.textContent = '0 分'; running = true; last = 0; raf = requestAnimationFrame(frame); sfx('countdown', { vol: 0.7 }); },
    leave() { cancelAnimationFrame(raf); running = false; if (M) { M.setLayer('drive', false); M.setTempo(1); } },
    onPause() { last = 0; },
    onResume() { last = 0; if (target) setTimeout(() => say(target), 300); },
    back() { show('theme', { theme }); },
    test: {
      get target() { return target; }, get done() { return done; }, get score() { return score; },
      bubbles: () => bubbles.filter(b => !b.pop).map(b => ({ id: b.w.id, x: b.x, y: b.y, t: b.w === target })),
      hitTarget() { const b = bubbles.find(x => !x.pop && x.w === target); if (b && tgtWait <= 0) { hit(b); return true; } return false; },
      skipReady() { readyT = 0.001; }
    }
  };
};

/* =====================================================================
 * 貼紙本
 * ===================================================================== */
SCREENS.stickers = ({ from, theme }) => {
  const root = ce('div', 'scr');
  root.innerHTML = `<div class="hd"><h1>我的貼紙本</h1><small>已收集 <b class="cnt"></b> / ${WORDS.length} 張</small></div><div class="chips"></div><div class="bd"><div class="wrap"><div class="sgrid"></div></div></div><div class="ft"></div>`;
  const chips = root.querySelector('.chips'), grid = root.querySelector('.sgrid');
  let sel = theme || 'all';
  function refresh() {
    root.querySelector('.cnt').textContent = totalLearned();
    chips.innerHTML = '';
    [{ id: 'all', zh: '全部', col: '#3a96ea', list: WORDS }].concat(THEMES).forEach(t => {
      const n = t.list.filter(w => prog.learned[w.id]).length;
      const c = ce('button', 'chip' + (sel === t.id ? ' on' : ''), `${t.zh}<small>${n}/${t.list.length}</small>`);
      c.style.setProperty('--c', t.col);
      bindBtn(c, () => { sel = t.id; refresh(); }, 'card');
      chips.appendChild(c);
    });
    grid.innerHTML = '';
    const list = sel === 'all' ? WORDS : THEME[sel].list;
    const cell = Math.min(130, Math.max(96, (app.clientWidth - 28) / Math.max(3, Math.floor((app.clientWidth - 28) / 106))));
    list.forEach((w, k) => {
      const got = !!prog.learned[w.id];
      const b = ce('button', 'stk' + (got ? '' : ' locked'));
      const sp2 = ce('div', 'sp2'); sp2.style.setProperty('--r', ((k * 37) % 9 - 4) + 'deg');
      sp2.appendChild(picEl(w.id, cell * 0.8)); b.appendChild(sp2);
      b.appendChild(ce('b', '', got ? w.en : '???'));
      b.appendChild(ce('small', '', got ? w.zh : THEME[w.theme].zh));
      bindBtn(b, () => {
        if (got) { say(w); sfx('ew_sticker', { pan: panOf(b), vol: 0.6 }); b.classList.remove('pop'); void b.offsetWidth; b.classList.add('pop'); }
        else { sfx('error', { pan: panOf(b) }); feedbackToast('在遊戲裡答對就能得到這張貼紙'); }
      }, false);
      grid.appendChild(b);
    });
  }
  const tip = ce('div', 'fb info'); tip.style.cssText = 'font-size:18px;top:auto;bottom:90px;white-space:normal;text-align:center;max-width:90vw'; root.appendChild(tip);
  function feedbackToast(t) { feedback({ fb: tip }, t, 'info'); }
  refresh();
  const back = () => { if (from === 'map') show('map'); else if (from === 'theme') show('theme', { theme }); else show('title'); };
  root.querySelector('.ft').append(bindBtn(ce('button', 'btn sm', ICON.back + '返回'), back, 'back'));
  return { el: root, refresh, start() { playSong(SONG_STUDY); }, back };
};

/* =====================================================================
 * 開始
 * ===================================================================== */
show('title');

/* 測試掛鉤 */
window.__ew = {
  show, get cur() { return cur; }, get prog() { return prog; }, WORDS, THEMES,
  setMode(m) { kidMode = m; }, isPaused: () => paused, openPause, resume,
  music: () => M && M.isPlaying(), Voice
};
})();
</script>
