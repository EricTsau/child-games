<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>3D 滑雪</title>
<link rel="stylesheet" href="../../assets/common.css">
<style>
  html, body { height: 100%; overflow: hidden; background: #cfe3f3; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  #gl { pointer-events: none; }
  #ui { touch-action: none; z-index: 10; }
  #msg { position: fixed; inset: 0; display: grid; place-items: center; padding: 24px; text-align: center; color: #1d3d63; font-size: 20px; font-weight: 800; }
</style>
<script type="importmap">
{ "imports": { "three": "../../assets/vendor/three/three.module.min.js" } }
</script>
</head>
<body>
<div id="msg">3D 滑雪 載入中…</div>
<canvas id="gl"></canvas>
<canvas id="ui" aria-label="3D 滑雪遊戲畫面"></canvas>
<script src="../../assets/common.js"></script>
<script type="module">
import * as THREE from 'three';

let renderer = null;
try {
  renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('gl'), antialias: true, powerPreference: 'high-performance' });
} catch (e) { renderer = null; }
if (!renderer) document.getElementById('msg').textContent = '這個遊戲需要支援 3D（WebGL）的瀏覽器，請換一個瀏覽器或裝置再試試看。';
else main();

function main() {
  const cv = document.getElementById('ui');
  const ctx = cv.getContext('2d');
  const FONT = "'PingFang TC','Noto Sans TC','Microsoft JhengHei','Heiti TC',system-ui,sans-serif";
  const font = (w, s) => w + ' ' + Math.round(s) + 'px ' + FONT;
  const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
  const lerp = (a, b, t) => a + (b - a) * t;
  const smooth = t => t <= 0 ? 0 : t >= 1 ? 1 : t * t * (3 - 2 * t);
  const TAU = Math.PI * 2;
  function mulberry(seed) {
    return function () {
      seed |= 0; seed = seed + 0x6D2B79F5 | 0;
      let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }

  /* =========================================================
   * 賽道資料
   * ========================================================= */
  const G = 9.8, CH = 60, NCH = 6, SUB = 1 / 120, MAXH = 1.25;
  const COURSES = [
    { name: '初雪練習道', gates: 8, spacing: 30, amp: 4, width: 7, S: 0.21, trees: 0, rocks: 0, jumps: 0, moguls: 0, ice: 0 },
    { name: '松林小徑', gates: 10, spacing: 28, amp: 5.5, width: 6.6, S: 0.23, trees: 5, rocks: 0, jumps: 0, moguls: 0, ice: 0 },
    { name: '跳跳雪丘', gates: 10, spacing: 28, amp: 6, width: 6.4, S: 0.24, trees: 5, rocks: 2, jumps: 2, moguls: 0, ice: 0 },
    { name: '起伏雪包道', gates: 12, spacing: 26, amp: 6.5, width: 6.2, S: 0.25, trees: 6, rocks: 3, jumps: 1, moguls: 2, ice: 0 },
    { name: '冰河急彎', gates: 12, spacing: 25, amp: 7, width: 6, S: 0.26, trees: 7, rocks: 3, jumps: 1, moguls: 1, ice: 3 },
    { name: '黑森林', gates: 14, spacing: 24, amp: 7.5, width: 5.8, S: 0.27, trees: 16, rocks: 5, jumps: 2, moguls: 1, ice: 1 },
    { name: '陡坡大迴轉', gates: 15, spacing: 26, amp: 8.5, width: 5.6, S: 0.31, trees: 9, rocks: 5, jumps: 2, moguls: 2, ice: 2 },
    { name: '冠軍盃賽道', gates: 18, spacing: 25, amp: 9, width: 5.4, S: 0.33, trees: 12, rocks: 7, jumps: 3, moguls: 2, ice: 3 }
  ];
  const TRICKS = {
    spin: { name: '360 轉體', dur: 0.7, pts: 300 },
    flip: { name: '後空翻', dur: 0.85, pts: 500 },
    grab: { name: '抓板', dur: 0.5, pts: 200 }
  };

  // 世界狀態：目前的坡面輪廓、圍欄寬度與地形特徵
  let F = 20;
  let profile = z => -0.25 * z;
  let feats = { moguls: [], jumps: [], ice: [], obst: [], coins: [] };
  let gates = [], finishZ = 1e9, linePts = [], worldSeed = 1, worldKind = 'slalom';
  const genDone = new Set();

  function makeProfile(keys) {
    const z0 = keys[0][0], z1 = keys[keys.length - 1][0], dz = 0.5, n = Math.ceil((z1 - z0) / dz) + 1;
    const ys = new Float64Array(n);
    const slopeAt = z => {
      if (z <= keys[0][0]) return keys[0][1];
      for (let i = 1; i < keys.length; i++) {
        if (z <= keys[i][0]) { const a = keys[i - 1], b = keys[i]; return lerp(a[1], b[1], smooth((z - a[0]) / (b[0] - a[0]))); }
      }
      return keys[keys.length - 1][1];
    };
    let prev = slopeAt(z0);
    for (let i = 1; i < n; i++) { const s = slopeAt(z0 + i * dz); ys[i] = ys[i - 1] - (prev + s) * 0.5 * dz; prev = s; }
    const s0 = keys[0][1], s1 = keys[keys.length - 1][1], zEnd = z0 + (n - 1) * dz;
    return z => {
      if (z <= z0) return ys[0] - (z - z0) * s0;
      const f = (z - z0) / dz, i = f | 0;
      if (i >= n - 1) return ys[n - 1] - (z - zEnd) * s1;
      return ys[i] + (ys[i + 1] - ys[i]) * (f - i);
    };
  }
  const FREE_S = 0.27;
  const freeSlope = z => FREE_S * (1 + 0.22 * Math.sin(z / 80) + 0.12 * Math.sin(z / 37 + 1));
  const freeAn = z => -FREE_S * (z - 0.22 * 80 * Math.cos(z / 80) - 0.12 * 37 * Math.cos(z / 37 + 1));
  const freeStart = makeProfile([[-60, 0.06], [-8, 0.06], [30, freeSlope(30)]]);
  const freeOff = freeStart(30) - freeAn(30);
  const freeProfile = z => z < 30 ? freeStart(z) : freeAn(z) + freeOff;

  // 地形高度（不含跳台）
  function terrainY(x, z) {
    let y = profile(z);
    const ax = x < 0 ? -x : x;
    const e = ax - (F + 1);
    if (e > 0) {
      y += e < 30 ? e * e * 0.014 : 12.6 + (e - 30) * 0.84;
      y += Math.sin(x * 0.13 + z * 0.05) * Math.sin(z * 0.031 + x * 0.07) * Math.min(1, e / 10) * 2.2;
    }
    y += Math.sin(x * 0.19 + z * 0.043) * Math.sin(z * 0.027) * 0.35;
    const M = feats.moguls;
    for (let i = 0; i < M.length; i++) {
      const m = M[i];
      if (z > m.z0 && z < m.z1) {
        const f = smooth((z - m.z0) / 8) * smooth((m.z1 - z) / 8) * smooth((F - 1 - ax) / 4);
        if (f > 0) y += m.a * f * Math.cos(x * 0.8 + z * 0.25) * Math.cos(z * 0.8 - x * 0.3);
      }
    }
    return y;
  }
  function jumpY(x, z) {
    const J = feats.jumps;
    for (let i = 0; i < J.length; i++) {
      const j = J[i];
      const t = (z - (j.z - j.L)) / j.L;
      if (t <= 0 || t > 1) continue;
      const dx = Math.abs(x - j.x) - j.w / 2;
      if (dx >= 0) continue;
      return j.h * Math.pow(t, j.p) * Math.min(1, -dx / 1.2);
    }
    return 0;
  }
  function groundY(x, z) { return terrainY(x, z) + jumpY(x, z); }
  function groundGrad(x, z, out) {
    const e = 0.3;
    out.x = (terrainY(x + e, z) - terrainY(x - e, z)) / (2 * e);
    out.z = (terrainY(x, z + e) - terrainY(x, z - e)) / (2 * e);
    const J = feats.jumps;
    for (let i = 0; i < J.length; i++) {
      const j = J[i];
      const t = (z - (j.z - j.L)) / j.L;
      if (t <= 0 || t > 1) continue;
      const dx = Math.abs(x - j.x) - j.w / 2;
      if (dx >= 0) continue;
      const side = Math.min(1, -dx / 1.2);
      out.z += j.p * j.h * Math.pow(t, j.p - 1) / j.L * side;
      if (side < 1) out.x += j.h * Math.pow(t, j.p) / 1.2 * (x > j.x ? -1 : 1);
      break;
    }
    return out;
  }
  function onIce(x, z) {
    for (const p of feats.ice) { const dx = x - p.x, dz = z - p.z; if (dx * dx + dz * dz < p.r * p.r * 0.8) return true; }
    return false;
  }
  function inMoguls(z) { for (const m of feats.moguls) if (z > m.z0 + 4 && z < m.z1 - 4) return true; return false; }
  function lineX(z) {
    if (!linePts.length) return 0;
    if (z <= linePts[0].z) return linePts[0].x;
    for (let i = 1; i < linePts.length; i++) {
      const b = linePts[i];
      if (z <= b.z) { const a = linePts[i - 1]; return lerp(a.x, b.x, (z - a.z) / (b.z - a.z)); }
    }
    return linePts[linePts.length - 1].x;
  }

  /* ---------- 建立大曲道賽道 ---------- */
  function buildCourse(i) {
    const C = COURSES[i], rnd = mulberry(1000 + i * 977);
    F = 20;
    worldSeed = 300 + i * 31;
    feats = { moguls: [], jumps: [], ice: [], obst: [], coins: [] };
    gates = [];
    let z = 45, prevX = 0, side = rnd() < 0.5 ? -1 : 1;
    for (let g = 0; g < C.gates; g++) {
      const dz = C.spacing * (0.88 + rnd() * 0.24);
      if (g > 0) z += dz;
      const drift = Math.sin(g * 0.7 + i) * 3;
      let x = side * C.amp * (0.55 + 0.45 * rnd()) + drift;
      const lim = F - C.width / 2 - 3;
      x = clamp(x, -lim, lim);
      const maxDx = (g === 0 ? 45 : dz) * 0.7;
      x = clamp(x, prevX - maxDx, prevX + maxDx);
      gates.push({ z, x, w: C.width, red: g % 2 === 0, state: 0 });
      prevX = x; side = -side;
    }
    finishZ = z + 45;
    linePts = [{ x: 0, z: -20 }].concat(gates.map(g => ({ x: g.x, z: g.z })), [{ x: gates[gates.length - 1].x * 0.4, z: finishZ }, { x: 0, z: finishZ + 200 }]);
    // 坡度變化
    const keys = [[-80, 0.05], [-12, 0.05], [14, C.S]];
    for (let zz = 70; zz < finishZ; zz += 60) keys.push([zz, C.S * (0.82 + rnd() * 0.36)]);
    keys.push([finishZ + 10, C.S * 0.9], [finishZ + 60, 0.07], [finishZ + 900, 0.05]);
    profile = makeProfile(keys);
    // 跳台：放在旗門之間的路線上
    const jumpGates = [];
    for (let k = 0; k < C.jumps; k++) jumpGates.push(Math.round((k + 1) * (C.gates - 1) / (C.jumps + 1)) - 1);
    jumpGates.forEach(g => {
      if (g < 0 || g >= C.gates - 1) return;
      const a = gates[g], b = gates[g + 1];
      const lip = a.z + 10.5;
      if (lip > b.z - 6) return;
      feats.jumps.push({ x: lineX(lip - 3.5), z: lip, w: 10, L: 7, h: 1.25, p: 1.6 });
    });
    // 雪包區
    let mg = 1;
    for (let k = 0; k < C.moguls; k++) {
      for (let tries = 0; tries < C.gates; tries++, mg++) {
        const g = 1 + (mg * 3 + k * 5) % Math.max(1, C.gates - 3);
        const z0 = gates[g].z + 5, z1 = gates[Math.min(g + 2, C.gates - 1)].z - 5;
        if (z1 - z0 < 25) continue;
        if (feats.jumps.some(j => j.z + 25 > z0 && j.z - j.L - 10 < z1)) continue;
        if (feats.moguls.some(m => m.z1 + 10 > z0 && m.z0 - 10 < z1)) continue;
        feats.moguls.push({ z0, z1, a: 0.3 });
        break;
      }
    }
    // 冰面
    for (let k = 0; k < C.ice; k++) {
      const g = 1 + Math.floor((k + 0.5) * (C.gates - 2) / C.ice);
      const zc = (gates[g].z + gates[g + 1].z) / 2;
      if (feats.jumps.some(j => Math.abs(j.z - zc) < 18)) continue;
      feats.ice.push({ x: lineX(zc), z: zc, r: 5 + rnd() * 2 });
    }
    // 障礙物（離開比賽路線）
    const want = [['tree', C.trees], ['rock', C.rocks]];
    want.forEach(([type, n]) => {
      let placed = 0;
      for (let t = 0; t < 400 && placed < n; t++) {
        const oz = 40 + rnd() * (finishZ - 50), ox = (rnd() * 2 - 1) * (F - 2);
        if (Math.abs(ox - lineX(oz)) < 7.5) continue;
        if (gates.some(g => Math.hypot(ox - g.x, oz - g.z) < g.w / 2 + 4)) continue;
        if (feats.jumps.some(j => Math.abs(ox - j.x) < j.w / 2 + 3 && oz > j.z - j.L - 14 && oz < j.z + 22)) continue;
        if (feats.obst.some(o => Math.hypot(ox - o.x, oz - o.z) < 5.5)) continue;
        feats.obst.push(makeObst(type, ox, oz, rnd));
        placed++;
      }
    });
  }
  function makeObst(type, x, z, rnd) {
    if (type === 'tree') { const s = 0.85 + rnd() * 0.6; return { type, x, z, s, r: 0.55, ht: 5.5 * s, rot: rnd() * TAU, tint: 0.85 + rnd() * 0.3 }; }
    const s = 0.6 + rnd() * 0.55;
    return { type, x, z, s, r: 0.95 * s, ht: 1.1 * s, rot: rnd() * TAU, tint: 1 };
  }

  /* ---------- 自由滑：無盡賽道，每一段即時產生 ---------- */
  function buildFree() {
    F = 22; worldSeed = 77;
    feats = { moguls: [], jumps: [], ice: [], obst: [], coins: [] };
    gates = []; finishZ = 1e9; linePts = [];
    profile = freeProfile;
    genDone.clear();
  }
  function genFree(k) {
    if (genDone.has(k)) return;
    genDone.add(k);
    if (k < 0) return;
    const rnd = mulberry(k * 7919 + 4242), z0 = k * CH, d = Math.min(1, k / 30);
    let jump = null;
    if (k >= 1 && rnd() < 0.5) {
      jump = { x: (rnd() - 0.5) * 20, z: z0 + 20 + rnd() * 30, w: 8, L: 8, h: 1.3 + rnd() * 0.9 + d * 0.6, p: 1.6 };
      feats.jumps.push(jump);
    }
    if (!jump && k >= 2 && rnd() < 0.35) feats.moguls.push({ z0: z0 + 6, z1: z0 + CH - 6, a: 0.26 + d * 0.08 });
    if (k >= 1 && rnd() < 0.3) feats.ice.push({ x: (rnd() - 0.5) * 26, z: z0 + 12 + rnd() * 36, r: 4.5 + rnd() * 3 });
    const coinsHere = [];
    const lines = 1 + (rnd() < 0.55 ? 1 : 0);
    for (let l = 0; l < lines; l++) {
      if (jump && l === 0) {
        const zs = jump.z - jump.L - 18;
        for (let i = 0; i < 6; i++) coinsHere.push({ x: jump.x, z: zs + i * 3 });
      } else {
        const cx = (rnd() - 0.5) * 28, zs = z0 + 4 + rnd() * 30, A = 2 + rnd() * 4;
        for (let i = 0; i < 7; i++) coinsHere.push({ x: clamp(cx + A * Math.sin(i * 0.6), -F + 2, F - 2), z: zs + i * 3.2 });
      }
    }
    coinsHere.forEach(c => { c.y = groundY(c.x, c.z) + 1.0; c.got = false; feats.coins.push(c); });
    const n = k === 0 ? 0 : Math.round(3 + d * 11 + rnd() * 2);
    let placed = 0;
    for (let t = 0; t < 120 && placed < n; t++) {
      const ox = (rnd() * 2 - 1) * (F - 2), oz = z0 + rnd() * CH;
      if (oz < 40) continue;
      if (jump && Math.abs(ox - jump.x) < jump.w / 2 + 3 && oz > jump.z - jump.L - 22 && oz < jump.z + 22) continue;
      if (coinsHere.some(c => Math.hypot(c.x - ox, c.z - oz) < 3)) continue;
      if (feats.obst.some(o => Math.abs(o.z - oz) < 6 && Math.hypot(ox - o.x, oz - o.z) < 5.5)) continue;
      feats.obst.push(makeObst(rnd() < 0.72 ? 'tree' : 'rock', ox, oz, rnd));
      placed++;
    }
  }
  function pruneFree(zMin) {
    const keep = o => o.z > zMin;
    feats.obst = feats.obst.filter(keep);
    feats.coins = feats.coins.filter(keep);
    feats.ice = feats.ice.filter(keep);
    feats.jumps = feats.jumps.filter(j => j.z > zMin);
    feats.moguls = feats.moguls.filter(m => m.z1 > zMin);
  }

  /* ---------- 跳台模式：大跳台 ---------- */
  const AIR_LIP = 92;
  function buildAir() {
    F = 14; worldSeed = 55;
    feats = { moguls: [], jumps: [{ x: 0, z: AIR_LIP, w: 10, L: 13, h: 3.4, p: 1.7 }], ice: [], obst: [], coins: [] };
    gates = []; finishZ = 1e9; linePts = [];
    profile = makeProfile([[-60, 0.04], [-6, 0.04], [8, 0.5], [50, 0.5], [64, 0.03], [AIR_LIP + 1, 0.03], [AIR_LIP + 9, 0.25], [AIR_LIP + 18, 0.62], [AIR_LIP + 78, 0.62], [AIR_LIP + 100, 0.05], [AIR_LIP + 800, 0.03]]);
  }

  /* =========================================================
   * 3D 場景
   * ========================================================= */
  let VW = 1, VH = 1;
  const small = Math.min(innerWidth, innerHeight) < 600;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.0;
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  const scene = new THREE.Scene();
  const FOG_C = new THREE.Color(0xcfe2f2);
  scene.background = FOG_C.clone();
  scene.fog = new THREE.Fog(FOG_C, 70, 300);
  const camera = new THREE.PerspectiveCamera(70, 1, 0.3, 2400);
  const SUN = new THREE.Vector3(-0.55, 0.62, 0.56).normalize();

  scene.add(new THREE.HemisphereLight(0xe4f0ff, 0x8796b0, 1.05));
  const sun = new THREE.DirectionalLight(0xfff1de, 2.3);
  sun.castShadow = true;
  sun.shadow.mapSize.set(small ? 1024 : 2048, small ? 1024 : 2048);
  Object.assign(sun.shadow.camera, { left: -32, right: 32, top: 32, bottom: -32, near: 1, far: 220 });
  sun.shadow.bias = -0.0006; sun.shadow.normalBias = 0.03;
  scene.add(sun, sun.target);

  const maxAniso = Math.min(8, renderer.capabilities.getMaxAnisotropy());
  function makeTex(w, h, draw, srgb) {
    const c = document.createElement('canvas');
    c.width = w; c.height = h;
    draw(c.getContext('2d'), w, h);
    const t = new THREE.CanvasTexture(c);
    if (srgb !== false) t.colorSpace = THREE.SRGBColorSpace;
    t.anisotropy = maxAniso;
    return t;
  }

  // 天空
  const skyMat = new THREE.ShaderMaterial({
    uniforms: { sunDir: { value: SUN } },
    vertexShader: 'varying vec3 vD; void main(){ vD = position; gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }',
    fragmentShader: [
      'uniform vec3 sunDir; varying vec3 vD;',
      'void main(){',
      ' vec3 d = normalize(vD); float h = d.y;',
      ' vec3 zen = vec3(0.17,0.42,0.80); vec3 hor = vec3(0.81,0.89,0.95);',
      ' vec3 col = mix(hor, zen, pow(clamp(h,0.0,1.0),0.5));',
      ' col = mix(col, vec3(0.81,0.886,0.95), smoothstep(0.02,-0.15,h));',
      ' float s = max(dot(d, sunDir), 0.0);',
      ' col += vec3(1.0,0.86,0.62)*(pow(s,6.0)*0.18 + pow(s,60.0)*0.45);',
      ' col = mix(col, vec3(1.0,0.99,0.95), smoothstep(0.9990,0.9996,s));',
      ' gl_FragColor = vec4(col,1.0);',
      '}'
    ].join('\n'),
    side: THREE.BackSide, depthWrite: false, fog: false
  });
  const sky = new THREE.Mesh(new THREE.SphereGeometry(2000, 32, 16), skyMat);
  sky.renderOrder = -3;
  scene.add(sky);

  // 遠山
  const mountTex = makeTex(2048, 256, (c, w, h) => {
    const rnd = mulberry(8);
    const layers = [[0.30, '#a9bdd6', '#eef4fb', 0.9], [0.45, '#8ea7c6', '#f4f8fc', 1], [0.6, '#7891b3', '#ffffff', 1]];
    layers.forEach(([base, col, snow, a], li) => {
      const pts = [];
      const k1 = 5 + li * 3, k2 = 13 + li * 4, k3 = 31 + li * 6, p1 = rnd() * 6, p2 = rnd() * 6, p3 = rnd() * 6;
      for (let x = 0; x <= w; x += 8) {
        const u = x / w * Math.PI;
        const y = base + 0.08 - 0.17 * Math.pow(Math.abs(Math.sin(u * k1 + p1)), 1.6) - 0.06 * Math.abs(Math.sin(u * k2 + p2)) - 0.02 * Math.sin(u * k3 * 2 + p3) + (rnd() - 0.5) * 0.008;
        pts.push([x, h * y]);
      }
      c.globalAlpha = a;
      c.beginPath(); c.moveTo(0, h);
      pts.forEach(p => c.lineTo(p[0], p[1]));
      c.lineTo(w, h); c.closePath();
      const g = c.createLinearGradient(0, h * (base - 0.25), 0, h);
      g.addColorStop(0, snow); g.addColorStop(0.28, snow); g.addColorStop(0.45, col); g.addColorStop(1, col);
      c.fillStyle = g; c.fill();
      // 稜線陰影
      c.globalAlpha = 0.18;
      c.strokeStyle = '#5d7799'; c.lineWidth = 2;
      for (let i = 1; i < pts.length - 1; i += 3) { c.beginPath(); c.moveTo(pts[i][0], pts[i][1]); c.lineTo(pts[i][0] + 18 + li * 6, h * (base + 0.18)); c.stroke(); }
    });
    c.globalAlpha = 1;

  function endPtr(e) {
    if (activeHit) {
      const [x, y] = pt(e);
      const h = findHit(x, y, true);
      const a = activeHit;
      activeHit = null; pressId = null;
      if (h && h.id === a.id && h.up) h.up();
      return;
    }
    const p = touchPtrs.get(e.pointerId);
    touchPtrs.delete(e.pointerId);
    if (p && p.kind === 'steer') {
      // 還有其他手指時改由它接手轉彎
      const other = [...touchPtrs.entries()].find(([, q]) => q.kind === 'extra');
      if (other) { other[1].kind = 'steer'; other[1].x0 = null; touchSteerOn = false; touchSteer = 0; }
      else { touchSteerOn = false; touchSteer = 0; }
    }
  }
  cv.addEventListener('pointerup', endPtr);
  cv.addEventListener('pointercancel', e => { touchPtrs.delete(e.pointerId); activeHit = null; pressId = null; if (![...touchPtrs.values()].some(p => p.kind === 'steer')) { touchSteerOn = false; touchSteer = 0; } });
  cv.addEventListener('pointermove', e => {
    const p = touchPtrs.get(e.pointerId);
    if (p && p.kind === 'steer' && p.x0 == null) { const [x] = pt(e); p.x0 = x; touchSteerOn = true; }
  });
  cv.addEventListener('contextmenu', e => e.preventDefault());
  const KEYMAP = { ArrowLeft: 'left', a: 'left', A: 'left', ArrowRight: 'right', d: 'right', D: 'right', ArrowDown: 'tuck', s: 'tuck', S: 'tuck' };
  window.addEventListener('keydown', e => {
    audioInit(); startMusic();
    if (KEYMAP[e.key]) { keys[KEYMAP[e.key]] = true; e.preventDefault(); return; }
    if (e.key === ' ' || e.key === 'Enter') {
      e.preventDefault();
      if (e.repeat) return;
      if (phase === 'run') requestTrick();
      else if (phase === 'title') { KG.sound('click'); phase = 'select'; }
      else if (phase === 'select') { let i = 0; while (i < 7 && unlocked(i + 1)) i++; startRun('slalom', i); }
      else if (phase === 'pause') togglePause();
      else if (phase === 'done' && stateT > 1.4) startRun(mode, ci);
    } else if (e.key === 'p' || e.key === 'P' || e.key === 'Escape') {
      if (phase === 'select' && e.key === 'Escape') phase = 'title';
      else togglePause();
    }
  });
  window.addEventListener('keyup', e => { if (KEYMAP[e.key]) keys[KEYMAP[e.key]] = false; });
  window.addEventListener('blur', () => { keys.left = keys.right = keys.tuck = false; });
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) {
      if (phase === 'run' || phase === 'count') togglePause();
      if (AE.ctx) AE.ctx.suspend();
    } else if (AE.ctx) AE.ctx.resume();
  });

  /* =========================================================
   * 畫面大小、自動畫質、主迴圈
   * ========================================================= */
  const baseRatio = Math.min(window.devicePixelRatio || 1, small ? 1.75 : 2);
  const QLEVELS = [
    { ratio: baseRatio, shadow: true, snow: true, pl: 1 },
    { ratio: Math.min(baseRatio, 1.35), shadow: true, snow: true, pl: 1 },
    { ratio: 1, shadow: true, snow: true, pl: 0.75 },
    { ratio: 1, shadow: false, snow: true, pl: 0.6 },
    { ratio: 0.8, shadow: false, snow: false, pl: 0.4 }
  ];
  const QKEY = 'quality:' + location.pathname.split('/').filter(Boolean).slice(-1)[0];
  let qLevel = clamp(KG.store.get(QKEY, KG.lowEnd ? 2 : 0) | 0, 0, QLEVELS.length - 1);
  const perf = { last: 0, n: 0, sum: 0, cool: 2.5 };
  function applyQuality() {
    const q = QLEVELS[qLevel];
    renderer.setPixelRatio(q.ratio);
    renderer.setSize(VW, VH, false);
    if (renderer.shadowMap.enabled !== q.shadow) {
      renderer.shadowMap.enabled = q.shadow;
      sun.castShadow = q.shadow;
      scene.traverse(o => { if (o.material) [].concat(o.material).forEach(m => { m.needsUpdate = true; }); });
    }
    flakes.visible = q.snow;
    pLimit = Math.round(PMAX * q.pl);
    updatePointScale();
  }
  function renderFrame() {
    renderer.render(scene, camera);
    const now = performance.now(), dt = perf.last ? Math.min(0.5, (now - perf.last) / 1000) : 0;
    perf.last = now;
    if (document.hidden || qLevel >= QLEVELS.length - 1 || phase === 'pause') return;
    perf.cool -= dt;
    if (perf.cool > 0) return;
    perf.sum += dt; perf.n++;
    if (perf.n >= 60) {
      if (perf.sum / perf.n > 1 / 45) {
        qLevel++;
        KG.store.set(QKEY, qLevel);
        applyQuality();
        perf.cool = 1.5;
      }
      perf.n = 0; perf.sum = 0;
    }
  }
  function resize() {
    const r = cv.getBoundingClientRect();
    VW = Math.max(1, r.width || innerWidth); VH = Math.max(1, r.height || innerHeight);
    renderer.setSize(VW, VH, false);
    const dpr = Math.min(2, window.devicePixelRatio || 1);
    cv.width = Math.round(VW * dpr); cv.height = Math.round(VH * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    camera.aspect = VW / VH;
    camera.updateProjectionMatrix();
    updatePointScale();
  }
  window.addEventListener('resize', resize);
  window.addEventListener('orientationchange', () => setTimeout(resize, 120));
  if (window.visualViewport) window.visualViewport.addEventListener('resize', resize);

  let last = performance.now(), first = true;
  const DBG = {};
  function frame(now) {
    const dt = Math.max(0, Math.min(0.05, (now - last) / 1000));
    last = now;
    const t0 = performance.now();
    update(dt);
    updateCamera(dt);
    const t1 = performance.now();
    syncScene(dt * (phase === 'pause' ? 0 : 1));
    const t2 = performance.now();
    renderFrame();
    const t3 = performance.now();
    if (!DBG.noHud) drawHUD();
    DBG.u = t1 - t0; DBG.s = t2 - t1; DBG.r = t3 - t2; DBG.h = performance.now() - t3;
    audioUpdate(dt);
    if (first) { first = false; const m = document.getElementById('msg'); if (m) m.remove(); }
    requestAnimationFrame(frame);
  }
  resize();
  applyQuality();
  startDemo();
  requestAnimationFrame(frame);

  /* ---------- 測試用介面 ---------- */
  window.__sk = {
    state: () => ({
      phase, mode, course: ci, x: +sk.x.toFixed(2), y: +sk.y.toFixed(2), z: +sk.z.toFixed(2), v: +sk.v.toFixed(2), kmh: Math.round(sk.v * 3.6), h: +sk.h.toFixed(3),
      air: sk.air, airT: +sk.airT.toFixed(2), crashed: sk.crashT > 0, ground: +groundY(sk.x, sk.z).toFixed(2), t: +raceT.toFixed(2), gate: nextGate, gates: gates.length,
      missed, finished, finishZ, crashes, coins, lives, score: mode === 'free' ? freeScore() : trickPts, round, roundScores: roundScores.slice(), result: resultInfo,
      quality: qLevel, timeScale: +timeScale.toFixed(2), tricks: sk.airTricks.length, trick: sk.trick ? sk.trick.type : null, steer: +lastInp.steer.toFixed(2), tuck: !!lastInp.tuck
    }),
    start: o => { o = o || {}; startRun(o.mode || 'slalom', o.course || 0, o); },
    step: n => { for (let i = 0; i < (n || 1); i++) update(1 / 60); },
    setInput: (steer, tuck) => { forced = steer == null ? null : { steer, tuck: !!tuck }; },
    trick: () => requestTrick(),
    bot: (on, tricks) => { botOn = !!on; botTricks = tricks || 1; },
    courses: () => COURSES.map((c, i) => ({ i, name: c.name, gates: c.gates })),
    gateList: () => gates.map(g => ({ x: +g.x.toFixed(2), z: +g.z.toFixed(2), w: g.w, state: g.state })),
    jumps: () => feats.jumps.map(j => ({ x: j.x, z: j.z, w: j.w, L: j.L, h: j.h })),
    obstacles: () => feats.obst.length,
    groundY: (x, z) => groundY(x, z),
    hits: () => HITS.map(h => ({ id: h.id, x: Math.round(h.x + h.w / 2), y: Math.round(h.y + h.h / 2) })),
    phase: p => { phase = p; stateT = 0; },
    pose: (o) => { Object.assign(sk, o); },
    quality: q => { if (q != null) { qLevel = q; applyQuality(); } return qLevel; },
    tuckBtn: () => tuckBtn(),
    menu: () => toMenu(),
    vis: (n, v) => { const M = { sky, mountains, pts, flakes, tracks, treeMesh, rockMesh, blob, skier: skier.root, ghost: ghostSk.root, coinMesh, poleMesh, flagMesh, postMesh }; if (n === 'clouds') clouds.forEach(c => { c.visible = v; }); else if (n === 'terrain') chunks.forEach(c => { c.mesh.visible = v; c.fence.visible = v; }); else M[n].visible = v; },
    noHud: v => { DBG.noHud = v; },
    dbg: () => Object.assign({ calls: renderer.info.render.calls, tris: renderer.info.render.triangles }, DBG)
  };
}
</script>
</body>
</html>
