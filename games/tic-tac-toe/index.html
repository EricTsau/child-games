<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>貓狗圈圈叉</title>
<link rel="stylesheet" href="../../assets/common.css">
<style>
  html, body { height: 100%; overflow: hidden; }
  body {
    height: 100vh; height: 100dvh;
    background:
      radial-gradient(ellipse 140% 60% at 50% 115%, #8fd47a 0%, #6cc25e 45%, transparent 46%),
      linear-gradient(180deg, #9ad8ff 0%, #c9ecff 38%, #e7f7d6 62%, #9fdc84 63%, #7cca6a 100%);
    touch-action: none;
    position: relative;
  }
  /* 雲朵 */
  .cloud { position: absolute; background: #fff; border-radius: 999px; opacity: .9; filter: drop-shadow(0 6px 6px rgba(80,140,200,.15)); animation: drift 40s linear infinite; }
  .cloud::before, .cloud::after { content: ""; position: absolute; background: #fff; border-radius: 50%; }
  .cloud::before { width: 55%; height: 160%; left: 15%; top: -70%; }
  .cloud::after { width: 40%; height: 130%; left: 50%; top: -45%; }
  @keyframes drift { from { transform: translateX(-30vw); } to { transform: translateX(130vw); } }
  .flower { position: absolute; font-size: 26px; filter: drop-shadow(0 3px 2px rgba(0,0,0,.15)); animation: kg-bounce 3s ease-in-out infinite; }

  #app {
    position: absolute; inset: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 12px; padding: 72px 12px 14px;
  }
  /* 分數 */
  .score { display: flex; align-items: center; gap: 6px; }
  .score svg { width: 30px; height: 30px; }
  .kg-pill.turn { outline: 4px solid var(--kg-yellow); transform: scale(1.08); transition: transform .2s; }
  .kg-pill { transition: transform .2s; }
  @media (max-width: 440px) {
    .kg-hud { gap: 6px; top: 14px; }
    .kg-pill { padding: 4px 10px; font-size: 16px; }
    .score svg { width: 24px; height: 24px; }
  }

  /* 野餐布＋木板 */
  .cloth {
    --bs: min(88vw, calc(100dvh - 270px), 470px);
    width: calc(var(--bs) + 34px); height: calc(var(--bs) + 34px);
    padding: 17px; border-radius: 26px;
    background:
      repeating-linear-gradient(0deg, rgba(255,255,255,.55) 0 18px, transparent 18px 36px),
      repeating-linear-gradient(90deg, rgba(255,255,255,.55) 0 18px, transparent 18px 36px),
      #f0627b;
    box-shadow: 0 14px 30px rgba(40,80,30,.35), inset 0 0 0 4px rgba(255,255,255,.4);
    transform: rotate(-1.5deg);
    flex: none;
  }
  @supports not (height: 100dvh) { .cloth { --bs: min(88vw, calc(100vh - 270px), 470px); } }
  .board {
    position: relative; width: 100%; height: 100%; transform: rotate(1.5deg);
    border-radius: 22px; padding: 4%;
    background:
      repeating-linear-gradient(92deg, rgba(120,60,20,.07) 0 3px, transparent 3px 14px),
      linear-gradient(160deg, #e5b27a 0%, #c98b4e 55%, #b3763d 100%);
    box-shadow: 0 8px 0 #8a5527, 0 14px 22px rgba(0,0,0,.25), inset 0 3px 0 rgba(255,255,255,.35);
    display: grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(3, 1fr); gap: 4%;
  }
  .cell {
    position: relative; border: none; padding: 0; cursor: pointer;
    border-radius: 18%;
    background: radial-gradient(circle at 35% 30%, #fff6e6 0%, #f6dcb4 60%, #edc995 100%);
    box-shadow: inset 0 -5px 0 rgba(150,90,40,.25), inset 0 3px 0 rgba(255,255,255,.7), 0 3px 4px rgba(90,50,20,.25);
    transition: transform .12s;
  }
  .cell:active:not(.filled) { transform: scale(.94); }
  .cell.filled { cursor: default; }
  .cell.hint:not(.filled):hover { background: radial-gradient(circle at 35% 30%, #fffdf6 0%, #fbe6c5 60%, #f2d3a5 100%); }
  .cell svg.piece { position: absolute; inset: 8%; width: 84%; height: 84%; animation: pop .45s cubic-bezier(.2,1.7,.4,1) both; filter: drop-shadow(0 5px 3px rgba(90,50,20,.3)); }
  .cell.win svg.piece { animation: pop .45s cubic-bezier(.2,1.7,.4,1) both, happy .6s ease-in-out .5s infinite alternate; }
  @keyframes pop { 0% { transform: scale(0) rotate(-30deg); } 100% { transform: scale(1) rotate(0); } }
  @keyframes happy { from { transform: translateY(0) rotate(-5deg); } to { transform: translateY(-8%) rotate(5deg); } }
  .eye { animation: blink 4s infinite; transform-box: fill-box; transform-origin: center; }
  @keyframes blink { 0%, 92%, 100% { transform: scaleY(1); } 95% { transform: scaleY(.1); } }

  svg.line { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; overflow: visible; }
  svg.line line { stroke-linecap: round; stroke-dasharray: 520; stroke-dashoffset: 520; animation: draw .6s ease-out forwards; }
  @keyframes draw { to { stroke-dashoffset: 0; } }

  .status { font-size: 22px; font-weight: 800; color: #fff; text-shadow: 0 2px 0 rgba(40,90,30,.5), 0 0 8px rgba(40,90,30,.4); min-height: 30px; display: flex; align-items: center; gap: 8px; }
  .status svg { width: 34px; height: 34px; animation: kg-bounce 1s ease-in-out infinite; }
  .modes { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
  .modes .kg-btn { font-size: 17px; padding: 0 16px; min-height: 56px; min-width: 96px; opacity: .75; }
  .modes .kg-btn.on { opacity: 1; outline: 4px solid #fff; }

  /* 橫向：左右排列 */
  @media (orientation: landscape) and (max-height: 560px) {
    #app { flex-direction: row; padding: 66px 20px 10px; gap: 22px; }
    .cloth { --bs: min(calc(100dvh - 110px), 60vw, 470px); }
    .side { display: flex; flex-direction: column; align-items: center; gap: 12px; }
    .modes { flex-direction: column; }
  }
  .side { display: contents; }
  @media (orientation: landscape) and (max-height: 560px) { .side { display: flex; } }
</style>
</head>
<body>
<!-- 共用漸層 -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <radialGradient id="gCat" cx="40%" cy="35%" r="70%"><stop offset="0" stop-color="#ffd59a"/><stop offset=".6" stop-color="#ffab4d"/><stop offset="1" stop-color="#f08a24"/></radialGradient>
    <radialGradient id="gDog" cx="40%" cy="35%" r="70%"><stop offset="0" stop-color="#f6e2c6"/><stop offset=".65" stop-color="#d9b08a"/><stop offset="1" stop-color="#bf8c62"/></radialGradient>
    <linearGradient id="gEar" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8a5a3c"/><stop offset="1" stop-color="#6b4129"/></linearGradient>
    <radialGradient id="gMuzzle" cx="50%" cy="40%" r="60%"><stop offset="0" stop-color="#fffaf3"/><stop offset="1" stop-color="#f3e2cd"/></radialGradient>
  </defs>
</svg>
<div class="cloud" style="width:120px;height:36px;top:9%;animation-duration:55s;animation-delay:-10s"></div>
<div class="cloud" style="width:90px;height:28px;top:19%;animation-duration:45s;animation-delay:-30s"></div>
<div class="cloud" style="width:150px;height:44px;top:4%;animation-duration:70s;animation-delay:-50s"></div>
<div class="flower" style="left:4%;bottom:6%">🌼</div>
<div class="flower" style="right:6%;bottom:10%;animation-delay:-1s">🌷</div>
<div class="flower" style="left:12%;bottom:22%;animation-delay:-2s;font-size:20px">🌸</div>
<div class="flower" style="right:14%;bottom:3%;animation-delay:-.5s;font-size:22px">🍄</div>

<div class="kg-hud">
  <div class="kg-pill score" id="pCat"></div>
  <div class="kg-pill score" id="pDraw">🤝 0</div>
  <div class="kg-pill score" id="pDog"></div>
</div>

<div id="app">
  <div class="cloth"><div class="board" id="board"></div></div>
  <div class="side">
    <div class="status" id="status"></div>
    <div class="modes" id="modes">
      <button class="kg-btn yellow" data-mode="easy">🤖 簡單</button>
      <button class="kg-btn blue" data-mode="normal">🤖 普通</button>
      <button class="kg-btn" data-mode="two">👫 兩人</button>
    </div>
  </div>
</div>

<script src="../../assets/common.js"></script>
<script>
'use strict';
(function () {
  // ---------- 角色 SVG ----------
  const CAT = `<svg class="piece" viewBox="0 0 100 100">
    <path d="M18 40 L22 8 L44 26 Z" fill="url(#gCat)" stroke="#d9741a" stroke-width="2" stroke-linejoin="round"/>
    <path d="M82 40 L78 8 L56 26 Z" fill="url(#gCat)" stroke="#d9741a" stroke-width="2" stroke-linejoin="round"/>
    <path d="M24 32 L25 16 L37 26 Z" fill="#ffb3c4"/><path d="M76 32 L75 16 L63 26 Z" fill="#ffb3c4"/>
    <ellipse cx="50" cy="56" rx="38" ry="34" fill="url(#gCat)" stroke="#d9741a" stroke-width="2"/>
    <path d="M42 24 Q50 30 58 24 M38 30 Q50 38 62 30" stroke="#e07d22" stroke-width="3" fill="none" stroke-linecap="round" opacity=".6"/>
    <ellipse cx="50" cy="68" rx="17" ry="12" fill="url(#gMuzzle)"/>
    <g class="eye"><ellipse cx="36" cy="54" rx="6" ry="7.5" fill="#3b2a35"/><circle cx="38" cy="51" r="2.4" fill="#fff"/></g>
    <g class="eye"><ellipse cx="64" cy="54" rx="6" ry="7.5" fill="#3b2a35"/><circle cx="66" cy="51" r="2.4" fill="#fff"/></g>
    <ellipse cx="25" cy="66" rx="6" ry="3.6" fill="#ff7f9c" opacity=".55"/><ellipse cx="75" cy="66" rx="6" ry="3.6" fill="#ff7f9c" opacity=".55"/>
    <path d="M46 62 L54 62 L50 67 Z" fill="#ff6f8f" stroke="#e25476" stroke-width="1" stroke-linejoin="round"/>
    <path d="M50 67 Q50 73 44 73 M50 67 Q50 73 56 73" stroke="#7a4a3a" stroke-width="2" fill="none" stroke-linecap="round"/>
    <path d="M30 68 L14 66 M30 72 L15 75 M70 68 L86 66 M70 72 L85 75" stroke="#7a4a3a" stroke-width="1.6" stroke-linecap="round" opacity=".7"/>
  </svg>`;
  const DOG = `<svg class="piece" viewBox="0 0 100 100">
    <path d="M22 26 Q4 30 8 60 Q12 72 22 62 Q26 44 30 34 Z" fill="url(#gEar)"/>
    <path d="M78 26 Q96 30 92 60 Q88 72 78 62 Q74 44 70 34 Z" fill="url(#gEar)"/>
    <ellipse cx="50" cy="54" rx="34" ry="36" fill="url(#gDog)" stroke="#a87650" stroke-width="2"/>
    <ellipse cx="64" cy="48" rx="11" ry="13" fill="#a8774f" opacity=".45"/>
    <ellipse cx="50" cy="70" rx="19" ry="14" fill="url(#gMuzzle)"/>
    <g class="eye"><ellipse cx="37" cy="50" rx="6" ry="7" fill="#3b2a35"/><circle cx="39" cy="47.5" r="2.3" fill="#fff"/></g>
    <g class="eye"><ellipse cx="63" cy="50" rx="6" ry="7" fill="#3b2a35"/><circle cx="65" cy="47.5" r="2.3" fill="#fff"/></g>
    <ellipse cx="26" cy="64" rx="6" ry="3.6" fill="#ff7f9c" opacity=".5"/><ellipse cx="74" cy="64" rx="6" ry="3.6" fill="#ff7f9c" opacity=".5"/>
    <ellipse cx="50" cy="62" rx="7" ry="5" fill="#3b2a35"/><ellipse cx="48" cy="60.5" rx="2.4" ry="1.4" fill="#fff" opacity=".7"/>
    <path d="M50 67 L50 71 M42 71 Q50 77 58 71" stroke="#6b4129" stroke-width="2" fill="none" stroke-linecap="round"/>
    <path d="M46 74 Q50 84 54 74 Z" fill="#ff7f9c" stroke="#e25476" stroke-width="1"/>
  </svg>`;
  const ICON = { X: CAT.replace('class="piece"', 'class="mini"'), O: DOG.replace('class="piece"', 'class="mini"') };
  const NAME = { X: '小貓', O: '小狗' };
  const LINES = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];

  const boardEl = document.getElementById('board');
  const statusEl = document.getElementById('status');
  const pCat = document.getElementById('pCat'), pDog = document.getElementById('pDog'), pDraw = document.getElementById('pDraw');

  let cells = [], grid, turn, over, mode = 'normal', starter = 'X', busy = false, timers = [];
  const score = { X: 0, O: 0, D: 0 };

  // 建立 9 個格子（只建一次）
  for (let i = 0; i < 9; i++) {
    const b = document.createElement('button');
    b.className = 'cell hint';
    b.setAttribute('aria-label', '格子 ' + (i + 1));
    b.addEventListener('pointerdown', (e) => { e.preventDefault(); onTap(i); });
    boardEl.appendChild(b);
    cells.push(b);
  }

  function later(fn, ms) { const t = setTimeout(fn, ms); timers.push(t); }
  function clearTimers() { timers.forEach(clearTimeout); timers = []; }

  function renderScore() {
    const catLabel = mode === 'two' ? '' : '';
    pCat.innerHTML = ICON.X + ' ' + score.X + catLabel;
    pDog.innerHTML = ICON.O + ' ' + score.O;
    pDraw.textContent = '🤝 ' + score.D;
    pCat.classList.toggle('turn', !over && turn === 'X');
    pDog.classList.toggle('turn', !over && turn === 'O');
  }
  function setStatus(html) { statusEl.innerHTML = html; }

  function winnerOf(g) {
    for (const l of LINES) if (g[l[0]] && g[l[0]] === g[l[1]] && g[l[0]] === g[l[2]]) return { p: g[l[0]], line: l };
    if (g.every(Boolean)) return { p: 'D' };
    return null;
  }

  function newRound() {
    clearTimers();
    grid = Array(9).fill(null);
    over = false; busy = false;
    cells.forEach(c => { c.innerHTML = ''; c.classList.remove('filled', 'win'); c.classList.add('hint'); });
    const old = boardEl.querySelector('svg.line'); if (old) old.remove();
    // 對電腦時小朋友永遠先下；兩人模式輪流先手
    turn = mode === 'two' ? starter : 'X';
    if (mode === 'two') starter = starter === 'X' ? 'O' : 'X';
    showTurn();
  }

  function showTurn() {
    renderScore();
    if (mode !== 'two' && turn === 'O') setStatus(ICON.O + ' 小狗想一想…');
    else setStatus(ICON[turn] + ' 輪到' + NAME[turn] + '囉！');
  }

  function place(i, p) {
    grid[i] = p;
    const c = cells[i];
    c.innerHTML = p === 'X' ? CAT : DOG;
    c.classList.add('filled'); c.classList.remove('hint');
    if (p === 'X') { KG.note(784, .1, 'triangle', .22); KG.note(1046, .14, 'triangle', .18, .07); }
    else { KG.note(392, .1, 'sine', .3); KG.note(523, .14, 'sine', .25, .07); }
  }

  function onTap(i) {
    if (over || busy || grid[i]) return;
    if (mode !== 'two' && turn !== 'X') return;
    place(i, turn);
    afterMove();
  }

  function afterMove() {
    const w = winnerOf(grid);
    if (w) return endRound(w);
    turn = turn === 'X' ? 'O' : 'X';
    showTurn();
    if (mode !== 'two' && turn === 'O') {
      busy = true;
      later(() => { busy = false; place(aiMove(), 'O'); afterMove(); }, 650);
    }
  }

  // ---------- 電腦 ----------
  function minimax(g, p, depth) {
    const w = winnerOf(g);
    if (w) return w.p === 'O' ? 10 - depth : w.p === 'X' ? depth - 10 : 0;
    let best = p === 'O' ? -99 : 99;
    for (let i = 0; i < 9; i++) if (!g[i]) {
      g[i] = p;
      const s = minimax(g, p === 'O' ? 'X' : 'O', depth + 1);
      g[i] = null;
      best = p === 'O' ? Math.max(best, s) : Math.min(best, s);
    }
    return best;
  }
  function aiMove() {
    const free = grid.map((v, i) => v ? -1 : i).filter(i => i >= 0);
    // 簡單：大多隨便下；普通：偶爾失誤，讓小朋友有機會贏
    const mistake = mode === 'easy' ? 0.75 : 0.28;
    if (Math.random() < mistake) return KG.pick(free);
    let best = -99, picks = [];
    for (const i of free) {
      grid[i] = 'O';
      const s = minimax(grid, 'X', 1);
      grid[i] = null;
      if (s > best) { best = s; picks = [i]; } else if (s === best) picks.push(i);
    }
    return KG.pick(picks);
  }

  // ---------- 結束 ----------
  function drawLine(l) {
    const pos = i => { const r = cells[i].getBoundingClientRect(), b = boardEl.getBoundingClientRect(); return [r.left - b.left + r.width / 2, r.top - b.top + r.height / 2]; };
    const a = pos(l[0]), z = pos(l[2]);
    const dx = z[0] - a[0], dy = z[1] - a[1], len = Math.hypot(dx, dy), ex = dx / len * 22, ey = dy / len * 22;
    const s = boardEl.clientWidth / 300;
    const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
    svg.setAttribute('class', 'line');
    const color = grid[l[0]] === 'X' ? '#ff8a3d' : '#8a5a3c';
    svg.innerHTML = `<line x1="${a[0]-ex}" y1="${a[1]-ey}" x2="${z[0]+ex}" y2="${z[1]+ey}" stroke="rgba(255,255,255,.9)" stroke-width="${22*s}"/>
      <line x1="${a[0]-ex}" y1="${a[1]-ey}" x2="${z[0]+ex}" y2="${z[1]+ey}" stroke="${color}" stroke-width="${11*s}"/>`;
    boardEl.appendChild(svg);
  }

  function endRound(w) {
    over = true;
    renderScore();
    score[w.p]++;
    renderScore();
    let title, msg, stars, icon;
    if (w.p === 'D') {
      KG.sound('boing');
      setStatus('🤝 平手！');
      title = '平手！'; msg = '兩個都好厲害！'; stars = 2; icon = '🤝';
    } else {
      w.line.forEach(i => cells[i].classList.add('win'));
      drawLine(w.line);
      KG.sound('sparkle');
      const r = cells[w.line[1]].getBoundingClientRect();
      KG.confetti(r.left + r.width / 2, r.top + r.height / 2, 60);
      if (mode === 'two') { title = NAME[w.p] + '贏了！'; msg = '好棒！再來一局吧！'; stars = 3; icon = w.p === 'X' ? '🐱' : '🐶'; }
      else if (w.p === 'X') { title = '你贏了！'; msg = '好棒！小貓連成一條線！'; stars = 3; icon = '🐱'; KG.say('好棒！你贏了！'); }
      else { title = '小狗贏了'; msg = '差一點點！再試一次吧！'; stars = 1; icon = '🐶'; }
      setStatus(ICON[w.p] + ' ' + title);
    }
    later(() => KG.showWin({ icon, title, message: msg, stars, replayText: '再來一局', onReplay: newRound }), 1500);
  }

  // ---------- 模式 ----------
  const modeBtns = document.querySelectorAll('#modes .kg-btn');
  function setMode(m) {
    mode = m; starter = 'X';
    score.X = score.O = score.D = 0;
    modeBtns.forEach(b => b.classList.toggle('on', b.dataset.mode === m));
    newRound();
  }
  modeBtns.forEach(b => b.addEventListener('click', () => {
    KG.sound('click');
    if (document.querySelector('.kg-overlay')) return;
    setMode(b.dataset.mode);
    KG.toast(b.dataset.mode === 'two' ? '兩人對戰！' : b.dataset.mode === 'easy' ? '簡單模式' : '普通模式');
  }));

  // 防止雙指縮放／捲動
  document.addEventListener('touchmove', e => e.preventDefault(), { passive: false });
  document.addEventListener('gesturestart', e => e.preventDefault());

  setMode('normal');
  KG.showStart({
    icon: '🐱', title: '貓狗圈圈叉',
    message: '點格子放小貓，先連成一條線就贏囉！',
    onStart: () => { KG.sound('pop'); newRound(); }
  });
})();
</script>
</body>
</html>
