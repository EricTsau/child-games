<style>
  body {
    min-height: 100vh;
    background: linear-gradient(180deg, #8fd6ff 0%, #c6ecff 280px, #fff1f6 900px, #fff7e3 100%);
    overflow-x: hidden;
  }

  /* ---------- 頁首：天空、彩虹、雲 ---------- */
  .sky {
    position: relative;
    height: clamp(270px, 36vw, 350px);
    overflow: hidden;
  }
  .sky svg.scene { position: absolute; inset: 0; width: 100%; height: 100%; }
  .cloud { animation: drift 26s linear infinite; }
  .cloud.c2 { animation-duration: 34s; animation-delay: -12s; }
  .cloud.c3 { animation-duration: 40s; animation-delay: -25s; }
  @keyframes drift { from { transform: translateX(-260px); } to { transform: translateX(1460px); } }
  .sun { transform-origin: 1080px 70px; animation: spin 30s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .logo-wrap {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 30px 16px 40px;
    text-align: center;
  }
  .logo {
    margin: 0;
    font-size: clamp(34px, 8.6vw, 76px);
    font-weight: 900;
    line-height: 1.1;
    white-space: nowrap;
    letter-spacing: 0.02em;
  }
  .logo span {
    display: inline-block;
    color: var(--c);
    -webkit-text-stroke: 0.16em #fff;
    paint-order: stroke fill;
    filter: drop-shadow(0 0.07em 0 var(--d)) drop-shadow(0 0.12em 0.12em rgba(60, 30, 80, 0.25));
    animation: hop 2.4s ease-in-out infinite;
    animation-delay: calc(var(--i) * 0.12s);
  }
  @keyframes hop { 0%, 70%, 100% { transform: translateY(0) rotate(0); } 80% { transform: translateY(-0.14em) rotate(-4deg); } 90% { transform: translateY(0) rotate(2deg); } }
  .sub {
    margin-top: 14px;
    display: inline-block;
    background: rgba(255, 255, 255, 0.92);
    border-radius: 999px;
    padding: 7px 18px;
    font-size: clamp(14px, 3.6vw, 18px);
    font-weight: 800;
    box-shadow: 0 4px 0 rgba(74, 59, 82, 0.12);
  }

  /* ---------- 分類 ---------- */
  .filters {
    position: relative;
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    justify-content: center;
    padding: 4px 16px 6px;
    margin-top: -26px;
  }
  .chip {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    font-family: var(--kg-font);
    font-size: 17px;
    font-weight: 800;
    border: 3px solid #fff;
    border-radius: 999px;
    padding: 8px 18px 8px 10px;
    background: #fff;
    color: var(--kg-ink);
    cursor: pointer;
    box-shadow: 0 4px 0 rgba(74, 59, 82, 0.14), 0 8px 16px rgba(74, 59, 82, 0.1);
    transition: transform 0.15s cubic-bezier(0.2, 1.6, 0.4, 1);
  }
  .chip:active { transform: scale(0.94); }
  .chip i {
    width: 26px;
    height: 26px;
    border-radius: 50%;
    display: grid;
    place-items: center;
    background: var(--c);
    box-shadow: inset 0 -3px 0 rgba(0, 0, 0, 0.15);
  }
  .chip i svg { width: 16px; height: 16px; }
  .chip[aria-pressed="true"] { background: var(--c); color: #fff; text-shadow: 0 2px 0 rgba(0, 0, 0, 0.18); transform: translateY(-2px); }
  .chip[aria-pressed="true"] i { background: #fff; }
  .chip[aria-pressed="true"] i svg { filter: none; }

  /* ---------- 遊戲卡片 ---------- */
  main {
    max-width: 1200px;
    margin: 0 auto;
    padding: 20px 16px 40px;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 20px;
  }
  .game {
    position: relative;
    display: flex;
    flex-direction: column;
    text-decoration: none;
    color: inherit;
    background: #fff;
    border-radius: 26px;
    padding: 8px 8px 14px;
    box-shadow: 0 6px 0 var(--d), 0 14px 26px rgba(74, 59, 82, 0.16);
    transition: transform 0.2s cubic-bezier(0.2, 1.6, 0.4, 1), box-shadow 0.2s;
    animation: card-in 0.5s cubic-bezier(0.2, 1.4, 0.4, 1) both;
    animation-delay: calc(var(--n) * 0.025s);
  }
  @keyframes card-in { from { opacity: 0; transform: translateY(24px) scale(0.9); } to { opacity: 1; transform: none; } }
  .game:hover, .game:focus-visible { transform: translateY(-6px) rotate(-1deg); outline: none; box-shadow: 0 10px 0 var(--d), 0 20px 30px rgba(74, 59, 82, 0.2); }
  .game:active { transform: scale(0.96); }
  .thumb {
    position: relative;
    aspect-ratio: 4 / 3;
    border-radius: 20px;
    overflow: hidden;
    background: var(--c);
  }
  .thumb img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    transition: transform 0.35s ease;
  }
  .game:hover .thumb img { transform: scale(1.06); }
  .thumb::after {
    content: "";
    position: absolute;
    inset: 0;
    border-radius: 20px;
    box-shadow: inset 0 0 0 3px rgba(255, 255, 255, 0.6);
    pointer-events: none;
  }
  .play {
    position: absolute;
    right: 10px;
    bottom: 10px;
    width: 46px;
    height: 46px;
    border-radius: 50%;
    background: linear-gradient(180deg, #9be8aa, #3fb25d);
    border: 3px solid #fff;
    box-shadow: 0 4px 0 #2f8a48, 0 6px 12px rgba(0, 0, 0, 0.2);
    display: grid;
    place-items: center;
    transform: scale(0.9);
    transition: transform 0.2s cubic-bezier(0.2, 1.6, 0.4, 1);
  }
  .game:hover .play { transform: scale(1.08); }
  .play svg { width: 18px; height: 18px; margin-left: 3px; }
  .num {
    position: absolute;
    top: 10px;
    left: 10px;
    min-width: 30px;
    height: 30px;
    padding: 0 6px;
    border-radius: 999px;
    background: rgba(255, 255, 255, 0.95);
    font-size: 14px;
    font-weight: 900;
    display: grid;
    place-items: center;
    box-shadow: 0 2px 0 rgba(0, 0, 0, 0.12);
  }
  .info { padding: 10px 8px 0; display: flex; flex-direction: column; gap: 4px; }
  .info h3 { margin: 0; font-size: 21px; display: flex; align-items: center; gap: 8px; }
  .info p { margin: 0; font-size: 14.5px; line-height: 1.45; opacity: 0.75; }
  .tag {
    font-size: 12px;
    font-weight: 800;
    padding: 3px 10px;
    border-radius: 999px;
    color: #fff;
    background: var(--c);
    white-space: nowrap;
  }

  /* ---------- 頁尾草地 ---------- */
  .ground { height: 90px; margin-top: 10px; position: relative; }
  .ground svg { position: absolute; bottom: 0; width: 100%; height: 100%; }
  footer {
    background: #7ccf6a;
    color: #fff;
    text-align: center;
    padding: 4px 16px 30px;
    font-size: 15px;
    font-weight: 700;
    text-shadow: 0 2px 0 rgba(0, 0, 0, 0.12);
  }

  @media (max-width: 520px) {
    main { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; padding-top: 16px; }
    .game { border-radius: 22px; padding: 6px 6px 12px; }
    .thumb, .thumb::after { border-radius: 17px; }
    .info { padding: 8px 4px 0; }
    .info h3 { font-size: 17px; flex-wrap: wrap; gap: 4px 6px; }
    .info p { font-size: 12.5px; }
    .play { width: 36px; height: 36px; right: 6px; bottom: 6px; }
    .play svg { width: 14px; height: 14px; }
    .num { top: 6px; left: 6px; min-width: 26px; height: 26px; font-size: 12px; }
    .chip { font-size: 15px; padding: 6px 14px 6px 8px; }
  }
  /* ---------- 安裝成 App ---------- */
  .install {
    margin-top: 12px;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    font-family: var(--kg-font);
    font-size: 17px;
    font-weight: 900;
    color: #fff;
    border: 3px solid #fff;
    border-radius: 999px;
    padding: 9px 20px 9px 12px;
    background: linear-gradient(180deg, #5fd38a, #2b9a57);
    box-shadow: 0 5px 0 #23744a, 0 10px 20px rgba(35, 116, 74, 0.35);
    text-shadow: 0 2px 0 rgba(0, 0, 0, 0.15);
    cursor: pointer;
    animation: install-pulse 2.4s ease-in-out infinite;
  }
  .install[hidden] { display: none; }
  .install:active { transform: translateY(3px); box-shadow: 0 2px 0 #23744a; }
  .install svg { width: 26px; height: 26px; flex: none; }
  @keyframes install-pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.05); } }
  .guide {
    position: fixed;
    inset: 0;
    z-index: 9500;
    display: grid;
    place-items: center;
    padding: 16px;
    background: rgba(40, 30, 60, 0.55);
    backdrop-filter: blur(3px);
  }
  .guide[hidden] { display: none; }
  .guide-card {
    width: min(420px, 100%);
    background: #fff;
    border: 5px solid #fff;
    border-radius: 28px;
    padding: 22px 20px 20px;
    box-shadow: 0 18px 40px rgba(40, 30, 60, 0.35);
    animation: kg-pop 0.3s cubic-bezier(0.2, 1.6, 0.4, 1);
  }
  .guide-card h2 { margin: 0 0 6px; font-size: 24px; text-align: center; }
  .guide-card .lead { margin: 0 0 14px; text-align: center; font-size: 15px; opacity: 0.75; }
  .guide-card ol { margin: 0 0 16px; padding: 0; list-style: none; counter-reset: step; }
  .guide-card li {
    counter-increment: step;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 12px;
    margin-bottom: 8px;
    border-radius: 16px;
    background: #f4f0fa;
    font-size: 16px;
    font-weight: 700;
    line-height: 1.4;
  }
  .guide-card li::before {
    content: counter(step);
    flex: none;
    width: 28px;
    height: 28px;
    border-radius: 50%;
    background: #ff8fb1;
    color: #fff;
    font-weight: 900;
    display: grid;
    place-items: center;
  }
  .guide-card li svg { width: 24px; height: 24px; flex: none; vertical-align: middle; }
  .guide-card .row { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
  .guide-card .kg-btn { font-size: 17px; padding: 10px 22px; text-decoration: none; }
  @media (prefers-reduced-motion: reduce) {
    .cloud, .sun, .logo span, .game, .install { animation: none; }
  }
</style>
</head>

  var CATS = [
    { id: '全部', icon: 'all', c: '#ffcf3f', d: '#e2a90f' },
    { id: '反應', icon: '反應', c: '#ffa05c', d: '#e0782f' },
    { id: '益智', icon: '益智', c: '#a58cff', d: '#7c5fe0' },
    { id: '學習', icon: '學習', c: '#5bbcf5', d: '#2f93cf' },
    { id: '創作', icon: '創作', c: '#ff7fb0', d: '#e0548a' }
  ];
  var CAT = {};
  CATS.forEach(function (c) { CAT[c.id] = c; });
  var PLAY = '<svg viewBox="0 0 24 24"><path d="M6 3.5v17a1 1 0 0 0 1.5.9l13-8.5a1 1 0 0 0 0-1.7l-13-8.5A1 1 0 0 0 6 3.5z" fill="#fff"/></svg>';

  // 標題字：每個字不同顏色、輪流跳一下
  var LOGO_COLORS = [['#ff7a9c', '#d94a72'], ['#ffad42', '#d9811a'], ['#ffd23f', '#d2a20d'], ['#6fd472', '#3ea548'], ['#4fc0f5', '#2290c9'], ['#9c84ff', '#6c52d6'], ['#ff7fd0', '#d14ea4']];
  var logo = document.getElementById('logo');
  '小朋友遊戲樂園'.split('').forEach(function (ch, i) {
    var s = document.createElement('span');
    s.textContent = ch;
    s.style.setProperty('--c', LOGO_COLORS[i][0]);
    s.style.setProperty('--d', LOGO_COLORS[i][1]);
    s.style.setProperty('--i', i);
    s.setAttribute('aria-hidden', 'true');
    logo.appendChild(s);
  });

  var current = KG.store.get('home:cat', '全部');
  if (!CAT[current]) current = '全部';
  var filters = document.getElementById('filters');
  var list = document.getElementById('list');

  CATS.forEach(function (c) {
    var b = document.createElement('button');
    b.className = 'chip';
    b.style.setProperty('--c', c.c);
    b.innerHTML = '<i>' + ICON[c.icon] + '</i>' + c.id;
    b.dataset.cat = c.id;
    b.addEventListener('click', function () {
      current = c.id;
      KG.store.set('home:cat', c.id);
      KG.sound('pop');
      render();
    });
    filters.appendChild(b);
  });

  function render() {
    Array.prototype.forEach.call(filters.children, function (b) {
      b.setAttribute('aria-pressed', b.dataset.cat === current ? 'true' : 'false');
    });
    list.innerHTML = '';
    var n = 0;
    GAMES.forEach(function (g, i) {
      if (current !== '全部' && g[3] !== current) return;
      var cat = CAT[g[3]];
      var a = document.createElement('a');
      a.className = 'game';
      a.href = 'games/' + g[0] + '/';
      a.style.setProperty('--c', cat.c);
      a.style.setProperty('--d', cat.d);
      a.style.setProperty('--n', n++);
      a.innerHTML =
        '<div class="thumb"><img src="assets/thumbs/' + g[0] + '.jpg" alt="" loading="lazy" width="480" height="360">' +
        '<span class="num">' + (i + 1) + '</span><span class="play">' + PLAY + '</span></div>' +
        '<div class="info"><h3>' + g[1] + '<span class="tag">' + g[3] + '</span></h3><p>' + g[2] + '</p></div>';
      a.addEventListener('pointerdown', function () { KG.sound('pop'); });
      list.appendChild(a);
    });
  }
  render();

  /* ---------- 安裝成 App（PWA） ---------- */
  (function () {
    var btn = document.getElementById('installBtn');
    var guide = document.getElementById('guide');
    var ua = navigator.userAgent;
    var isStandalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
    var isIOS = /iPad|iPhone|iPod/.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
    var isAndroid = /Android/i.test(ua);
    var isLine = /Line\//i.test(ua);
    var inApp = isLine || /FBAN|FBAV|Instagram|MicroMessenger|WebView|; wv\)/i.test(ua);
    var deferred = null;

    var ICON_SHARE = '<svg viewBox="0 0 24 24"><path d="M12 3v12M8 7l4-4 4 4" stroke="#3a7bd5" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M6 11H5a1 1 0 0 0-1 1v8a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-8a1 1 0 0 0-1-1h-1" stroke="#3a7bd5" stroke-width="2" fill="none" stroke-linecap="round"/></svg>';
    var ICON_PLUS = '<svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="4" stroke="#4a3b52" stroke-width="2" fill="none"/><path d="M12 8v8M8 12h8" stroke="#4a3b52" stroke-width="2" stroke-linecap="round"/></svg>';
    var ICON_DOTS = '<svg viewBox="0 0 24 24"><circle cx="12" cy="5" r="2" fill="#4a3b52"/><circle cx="12" cy="12" r="2" fill="#4a3b52"/><circle cx="12" cy="19" r="2" fill="#4a3b52"/></svg>';

    function show() { if (!isStandalone) btn.hidden = false; }
    function hide() { btn.hidden = true; }

    function openGuide(lead, steps, actions) {
      document.getElementById('guideLead').textContent = lead;
      document.getElementById('guideSteps').innerHTML = steps.map(function (s) { return '<li><span>' + s + '</span></li>'; }).join('');
      var box = document.getElementById('guideActions');
      box.innerHTML = '';
      (actions || []).concat([{ text: '知道了', cls: 'blue' }]).forEach(function (a) {
        var el = document.createElement(a.href ? 'a' : 'button');
        el.className = 'kg-btn ' + (a.cls || '');
        el.textContent = a.text;
        if (a.href) el.href = a.href;
        el.addEventListener('click', function () { KG.sound('click'); if (!a.href) guide.hidden = true; });
        box.appendChild(el);
      });
      guide.hidden = false;
    }
    guide.addEventListener('click', function (e) { if (e.target === guide) guide.hidden = true; });

    function showHelp() {
      if (inApp) {
        var url = location.href.split('#')[0];
        url += (url.indexOf('?') >= 0 ? '&' : '?') + 'openExternalBrowser=1';
        openGuide('LINE、Facebook 裡面的瀏覽器不能安裝，要先換成手機的瀏覽器。', [
          isLine ? '按下面的「用瀏覽器開啟」' : '點右上角的 ' + ICON_DOTS + ' 選單',
          isIOS ? '選「在 Safari 中開啟」' : '選「用 Chrome 開啟」或「用預設瀏覽器開啟」',
          '打開後再按一次「安裝成 App」'
        ], isLine ? [{ text: '用瀏覽器開啟', cls: 'green', href: url }] : []);
      } else if (isIOS) {
        openGuide('iPhone、iPad 要用 Safari 手動加入主畫面：', [
          '點下面工具列的分享按鈕 ' + ICON_SHARE,
          '往下滑，選「加入主畫面」' + ICON_PLUS,
          '按右上角的「新增」，主畫面就會出現「遊戲樂園」'
        ]);
      } else if (isAndroid) {
        openGuide('如果沒有跳出安裝視窗，可以這樣做：', [
          '用 Chrome 打開這個網頁，點右上角的 ' + ICON_DOTS,
          '選「安裝應用程式」或「加到主畫面」',
          '按「安裝」，App 抽屜和主畫面就會出現「遊戲樂園」'
        ]);
      } else {
        openGuide('在電腦上可以用 Chrome 或 Edge 安裝：', [
          '點網址列右邊的安裝圖示，或右上角的 ' + ICON_DOTS + ' 選單',
          '選「安裝小朋友遊戲樂園」',
          '之後可以從開始選單或桌面直接打開'
        ]);
      }
    }

    window.addEventListener('beforeinstallprompt', function (e) {
      e.preventDefault();
      deferred = e;
      show();
    });
    window.addEventListener('appinstalled', function () {
      deferred = null;
      hide();
      KG.sound('win');
      KG.toast('安裝好了！');
    });
    btn.addEventListener('click', function () {
      KG.sound('click');
      if (deferred) {
        var d = deferred;
        deferred = null;
        d.prompt();
        d.userChoice.then(function (r) { if (r.outcome !== 'accepted') deferred = d; }).catch(function () {});
      } else showHelp();
    });
    // 手機上一律顯示按鈕；不能一鍵安裝時會改成顯示教學
    if (!isStandalone && (isAndroid || isIOS || inApp)) show();

    // 離線功能：註冊 Service Worker，並預先下載所有遊戲
    if ('serviceWorker' in navigator && location.protocol !== 'file:') {
      navigator.serviceWorker.register('sw.js').then(function () {
        return navigator.serviceWorker.ready;
      }).then(function (reg) {
        var key = 'home:warm:' + GAMES.length;
        if (KG.store.get(key, false) || !reg.active) return;
        var three = ['three.module.min.js', 'addons/environments/RoomEnvironment.js', 'addons/geometries/RoundedBoxGeometry.js',
          'addons/postprocessing/EffectComposer.js', 'addons/postprocessing/RenderPass.js', 'addons/postprocessing/UnrealBloomPass.js',
          'addons/postprocessing/OutputPass.js', 'addons/postprocessing/ShaderPass.js', 'addons/postprocessing/MaskPass.js',
          'addons/postprocessing/Pass.js', 'addons/shaders/CopyShader.js', 'addons/shaders/LuminosityHighPassShader.js',
          'addons/shaders/OutputShader.js'].map(function (f) { return 'assets/vendor/three/' + f; });
        var urls = [];
        GAMES.forEach(function (g) { urls.push('games/' + g[0] + '/', 'assets/thumbs/' + g[0] + '.jpg'); });
        urls.push('games/night-pinball/classic.html', 'assets/icons/maskable-192.png', 'assets/icons/maskable-512.png', 'assets/icons/apple-touch-icon.png');
        // 等首頁顯示完、空閒時再在背景下載，避免一打開就卡
        var go = function () { reg.active.postMessage({ type: 'warm', urls: urls.concat(three) }); };
        setTimeout(function () { if ('requestIdleCallback' in window) requestIdleCallback(go, { timeout: 5000 }); else go(); }, 4000);
        navigator.serviceWorker.addEventListener('message', function (e) {
          if (e.data && e.data.type === 'warmed') KG.store.set(key, true);
        });
      }).catch(function () {});
    }
  })();
</script>
</body>
</html>
