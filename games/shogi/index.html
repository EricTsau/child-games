<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>將棋 Shogi</title>
<link rel="stylesheet" href="../../assets/common.css">
<style>
  :root { --gold: #d8b56c; --ink: #f1ead9; --mut: #aeb0b5; --panel: rgba(16, 19, 28, .86); --line: rgba(216, 181, 108, .42); --red: #b8322a;
    --pf: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", "Heiti TC", "WenQuanYi Zen Hei", system-ui, sans-serif;
    --sf: "Yu Mincho", "YuMincho", "Hiragino Mincho ProN", "Noto Serif JP", "Noto Serif TC", "Source Han Serif TC", "BiauKai", "DFKai-SB", "標楷體", "Songti TC", "PMingLiU", "WenQuanYi Zen Hei", serif; }
  html, body { height: 100%; overflow: hidden; background: #10131b; color: var(--ink); font-family: var(--pf); touch-action: none; }
  #cv { position: fixed; inset: 0; width: 100vw; height: 100vh; height: 100dvh; display: block; touch-action: none; }
  .hide { display: none !important; }
  button { font-family: var(--pf); -webkit-user-select: none; user-select: none; }
  .kg-fab { background: rgba(18, 21, 30, .86); border: 1.5px solid var(--line); box-shadow: 0 4px 14px rgba(0, 0, 0, .5); font-size: 20px; }
  .kg-fab:hover { border-color: var(--gold); }
  .glass { background: var(--panel); border: 1px solid var(--line); box-shadow: 0 6px 22px rgba(0, 0, 0, .45); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); }

  .ui { position: fixed; z-index: 50; }
  #bPause { right: 10px; top: 66px; width: 48px; height: 48px; padding: 0; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; }
  #bPause svg { width: 20px; height: 20px; }
  #bPause:active { transform: translateY(1px); border-color: var(--gold); }
  #info { padding: 0 12px; border-radius: 8px; font-size: 12.5px; letter-spacing: 1px; white-space: nowrap; color: var(--mut); display: flex; align-items: center; justify-content: center; gap: 8px; overflow: hidden; }
  #info b { color: var(--gold); font-weight: 700; }
  #info .sep { width: 1px; height: 12px; background: rgba(216, 181, 108, .35); flex: none; }
  #note { border-radius: 10px; padding: 6px 12px; font-size: 13px; line-height: 1.5; color: var(--ink); display: flex; flex-direction: column; justify-content: center; overflow: hidden; }
  #note .k { font-family: var(--sf); font-size: 16px; font-weight: 700; color: var(--gold); letter-spacing: 1px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #note .k .mk { color: #f3e7c9; }
  #note .k .mk.w { color: #9fb6d9; }
  #note .c { color: var(--mut); font-size: 12.5px; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
  #note.lesson { justify-content: flex-start; overflow-y: auto; touch-action: pan-y; }
  #note.lesson .lt { font-family: var(--sf); font-size: 16px; font-weight: 800; color: var(--gold); letter-spacing: 2px; }
  #note.lesson .lx { color: var(--ink); font-size: 13.5px; line-height: 1.6; }
  #note.lesson .lg { color: #f0cf86; font-size: 13px; margin-top: 2px; }
  #note.lesson .lx b { color: #f0cf86; }
  body.short #note.lesson .lx { font-size: 12.5px; line-height: 1.5; }
  body.short #note.lesson .lt { font-size: 14.5px; }

  #ctrl { display: grid; grid-template-columns: repeat(3, 1fr); gap: 7px; }
  .cbtn { min-height: 46px; border-radius: 10px; border: 1px solid var(--line); background: linear-gradient(180deg, rgba(38, 42, 56, .95), rgba(18, 20, 28, .95)); color: var(--ink); font-size: 15px; font-weight: 700; letter-spacing: 2px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px; box-shadow: 0 4px 12px rgba(0, 0, 0, .4), inset 0 1px 0 rgba(255, 255, 255, .06); touch-action: manipulation; transition: transform .08s, border-color .2s, opacity .2s; padding: 0 4px; white-space: nowrap; }
  .cbtn svg { width: 17px; height: 17px; flex: none; }
  .cbtn:active { transform: translateY(1px); border-color: var(--gold); }
  .cbtn:disabled { opacity: .35; cursor: default; }
  .cbtn.warn { border-color: rgba(184, 50, 42, .6); }
  .cbtn.on { border-color: var(--gold); background: linear-gradient(180deg, rgba(84, 70, 40, .95), rgba(34, 28, 18, .95)); }
  #moveBox { border-radius: 10px; padding: 6px 4px 6px 10px; display: flex; flex-direction: column; min-height: 0; }
  #moveBox h3 { margin: 0 0 4px; font-family: var(--sf); font-size: 13px; font-weight: 700; letter-spacing: 4px; color: var(--gold); display: flex; justify-content: space-between; padding-right: 8px; }
  #moveBox h3 small { font-family: var(--pf); letter-spacing: 1px; font-weight: 400; color: var(--mut); font-size: 11.5px; }
  .mlist { flex: 1; min-height: 0; overflow-y: auto; font-size: 14px; line-height: 1.35; color: var(--ink); padding-right: 6px; touch-action: pan-y; }
  .mlist .mr { display: grid; grid-template-columns: 30px 1fr; padding: 3px 0; border-bottom: 1px solid rgba(216, 181, 108, .08); }
  .mlist .no { color: #7f8592; font-size: 11.5px; padding-top: 3px; }
  .mlist .kf { font-family: var(--sf); font-size: 15.5px; font-weight: 700; letter-spacing: 1px; }
  .mlist .kf.w { color: #b7c8e4; }
  .mlist .cx { display: block; color: var(--mut); font-size: 11.5px; letter-spacing: .5px; }
  .mlist .cur .kf { color: var(--gold); }
  .mlist .empty { color: #7f8592; font-size: 13px; }

  /* 遮罩與卡片 */
  .ov { position: fixed; inset: 0; z-index: 9200; display: flex; align-items: center; justify-content: center; padding: 16px; background: rgba(5, 6, 10, .64); animation: kg-fade .25s ease; }
  .card { background: rgba(16, 19, 27, .97) !important; width: min(460px, 100%); max-height: calc(100% - 8px); overflow: auto; border-radius: 14px; padding: 20px 18px 16px; text-align: center; color: var(--ink); touch-action: pan-y; }
  .card h2 { margin: 0 0 6px; font-family: var(--sf); font-size: 25px; letter-spacing: 6px; padding-left: 6px; color: var(--gold); font-weight: 800; }
  .card p { margin: 0 0 12px; font-size: 14px; line-height: 1.6; color: var(--mut); }
  .gbtn { font-family: var(--pf); font-size: 15.5px; font-weight: 800; letter-spacing: 3px; min-height: 46px; padding: 10px 16px; border-radius: 9px; cursor: pointer; border: 1px solid var(--line); background: rgba(255, 255, 255, .04); color: var(--ink); transition: transform .1s, background .2s, border-color .2s; touch-action: manipulation; }
  .gbtn:hover { border-color: var(--gold); }
  .gbtn:active { transform: translateY(1px); }
  .gbtn.pri { background: linear-gradient(180deg, #e3c37d, #b48a43); color: #1b1408; border-color: #f0d79c; box-shadow: 0 6px 16px rgba(180, 140, 70, .3); }
  .gbtn.dng { background: linear-gradient(180deg, #a3302a, #5e1612); border-color: #e2756c; }
  .acts { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
  .acts .gbtn { flex: 1; min-width: 120px; }

  #title { background: linear-gradient(180deg, rgba(8, 9, 14, .82) 0%, rgba(8, 9, 14, .35) 30%, rgba(8, 9, 14, .4) 50%, rgba(8, 9, 14, .93) 100%); flex-direction: column; justify-content: space-between; padding: 66px 16px calc(14px + env(safe-area-inset-bottom)); }
  .logo { text-align: center; pointer-events: none; }
  .logo .sub { font-size: 11px; letter-spacing: 6px; color: var(--gold); opacity: .9; }
  .logo .tl { display: flex; align-items: center; justify-content: center; gap: 14px; margin-top: 6px; white-space: nowrap; }
  .logo h1 { margin: 0; font-family: var(--sf); font-size: clamp(46px, 14vw, 82px); font-weight: 900; letter-spacing: .2em; padding-left: .2em; color: #f6efe0; text-shadow: 0 2px 0 rgba(0, 0, 0, .5), 0 0 30px rgba(216, 181, 108, .25); line-height: 1.12; }
  .seal { flex: none; width: 1.05em; height: 1.05em; font-size: clamp(30px, 8vw, 48px); border-radius: 6px; background: #a8231c; color: #f7e6d0; font-family: var(--sf); font-weight: 900; display: grid; place-items: center; box-shadow: inset 0 0 0 3px #a8231c, inset 0 0 0 5px rgba(247, 230, 208, .75); transform: rotate(-4deg); line-height: 1; }
  .seal span { font-size: .62em; }
  .logo .motto { margin-top: 10px; font-family: var(--sf); font-size: 15px; letter-spacing: 8px; padding-left: 8px; color: #d9cfb8; }
  .tcard { width: min(460px, 100%); border-radius: 14px; padding: 14px 14px 12px; }
  .seg { display: flex; border: 1px solid var(--line); border-radius: 9px; overflow: hidden; margin-bottom: 8px; }
  .seg button { flex: 1; min-height: 44px; padding: 6px 2px; background: transparent; color: var(--mut); border: 0; border-left: 1px solid rgba(216, 181, 108, .25); font-size: 14px; font-weight: 700; letter-spacing: 1px; cursor: pointer; touch-action: manipulation; }
  .seg button:first-child { border-left: 0; }
  .seg button.on { background: rgba(216, 181, 108, .18); color: var(--ink); box-shadow: inset 0 -2px 0 var(--gold); }
  .seg.big button { font-size: 15px; font-family: var(--sf); letter-spacing: 2px; }
  .frow { display: flex; align-items: center; gap: 10px; }
  .frow label { flex: none; width: 40px; font-size: 13px; color: var(--mut); letter-spacing: 1px; text-align: left; }
  .frow .seg { flex: 1; }
  .tbtns { display: flex; gap: 8px; margin-top: 2px; }
  .tbtns .gbtn { flex: 1; font-size: 17px; }
  .tbtns .gbtn:not(.pri) { font-size: 14px; letter-spacing: 1px; flex: .8; }
  .trow2 { display: flex; gap: 8px; margin-top: 8px; }
  .tog { flex: 1; min-height: 38px; border-radius: 8px; border: 1px solid rgba(216, 181, 108, .3); background: rgba(255, 255, 255, .03); color: var(--mut); font-size: 13px; font-weight: 700; letter-spacing: 1px; cursor: pointer; touch-action: manipulation; }
  .tog.on { color: var(--ink); border-color: var(--gold); background: rgba(216, 181, 108, .14); }
  .rec { margin-top: 8px; font-size: 12px; color: var(--mut); letter-spacing: 1px; line-height: 1.7; text-align: center; }
  .rec b { color: var(--gold); font-weight: 700; }
  .tips { margin-top: 2px; font-size: 11.5px; color: #868b96; line-height: 1.6; text-align: center; }
  body.land #title { flex-direction: row; align-items: center; justify-content: space-between; gap: 18px; padding: 16px calc(70px + env(safe-area-inset-right)) 16px calc(70px + env(safe-area-inset-left)); background: linear-gradient(90deg, rgba(8, 9, 14, .65) 15%, rgba(8, 9, 14, .93) 100%); }
  body.land #title .logo { flex: 1; min-width: 0; }
  body.land #title .logo .sub { letter-spacing: 3px; white-space: nowrap; font-size: 10.5px; }
  body.land #title .logo h1 { font-size: clamp(28px, min(6vw, 12vh), 82px); }
  body.land .seal { font-size: clamp(24px, min(4.5vw, 7vh), 48px); }
  body.land #title .tcard { width: min(440px, 52vw); flex: none; max-height: calc(100vh - 24px); overflow: auto; }
  body.short .tips { display: none; }
  .logo .motto { white-space: nowrap; }
  .logo .sub { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  body.land #title .logo .motto { letter-spacing: 4px; padding-left: 4px; font-size: clamp(11px, 1.6vw, 15px); }
  body.short #note .c { -webkit-line-clamp: 1; }
  body.short #note .k { font-size: 14.5px; }
  body.short .logo .motto { font-size: 13px; letter-spacing: 5px; margin-top: 6px; }
  body.short .tcard { padding: 9px 11px; }
  body.short .seg { margin-bottom: 5px; }
  body.short .seg button { min-height: 38px; font-size: 13px; }
  body.short .tbtns .gbtn { min-height: 42px; padding: 6px 10px; }
  body.short .trow2 { margin-top: 5px; }
  body.short .tog { min-height: 34px; }
  body.short .rec { margin-top: 4px; line-height: 1.5; font-size: 11.5px; }

  .stat { display: grid; grid-template-columns: 1fr auto; gap: 5px 14px; margin: 6px auto 14px; font-size: 14px; max-width: 300px; text-align: left; }
  .stat span:nth-child(2n) { text-align: right; font-variant-numeric: tabular-nums; color: var(--gold); font-weight: 700; }
  .pcard .frow { margin-bottom: 2px; }
  .pcard .frow label { width: 64px; }
  .pcard .acts { flex-direction: column; margin-top: 10px; }
  body.short .card { padding: 10px 14px; width: min(600px, 100%); }
  body.short .card h2 { font-size: 20px; margin: 0 0 4px; }
  body.short .pcard .stat { grid-template-columns: 1fr auto 1fr auto; max-width: none; font-size: 12.5px; margin: 4px 0 8px; gap: 3px 12px; }
  body.short .pcard .acts { flex-direction: row; margin-top: 4px; }
  body.short .pcard .acts .gbtn { min-width: 0; padding: 8px 6px; font-size: 14px; letter-spacing: 1px; }

  .res { font-size: 13px; letter-spacing: 4px; color: var(--mut); }
  .big { font-family: var(--sf); font-size: 44px; font-weight: 900; color: var(--gold); letter-spacing: 8px; padding-left: 8px; margin: 2px 0; }
  .big.lose { color: #c3c0b8; }
  .big.win { color: #f0cf86; text-shadow: 0 0 24px rgba(216, 181, 108, .35); }
  .reason { display: inline-block; font-family: var(--sf); font-size: 17px; letter-spacing: 4px; padding: 3px 14px 3px 18px; border-radius: 4px; margin: 2px 0 10px; color: #f7e6d0; background: #8e2019; box-shadow: inset 0 0 0 2px #8e2019, inset 0 0 0 3px rgba(247, 230, 208, .5); }
  .reason.draw { background: #34405a; box-shadow: inset 0 0 0 2px #34405a, inset 0 0 0 3px rgba(247, 230, 208, .4); }
  .stars { font-size: 30px; letter-spacing: 6px; color: #f0cf86; margin: 0 0 6px; }
  .stars .off { color: #3b3f4a; }
  .mlist.full { max-height: 54vh; text-align: left; border-radius: 8px; padding: 8px 12px; background: rgba(255, 255, 255, .03); border: 1px solid rgba(216, 181, 108, .2); margin: 6px 0 14px; }

  #pzOv .card, #lsOv .card { width: min(680px, 100%); }
  .pzh { text-align: left; font-family: var(--sf); color: var(--gold); font-size: 14px; letter-spacing: 3px; margin: 10px 2px 4px; }
  .pzgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 8px; margin: 4px 0 10px; text-align: left; }
  .lv { position: relative; border: 1px solid rgba(216, 181, 108, .3); border-radius: 10px; background: linear-gradient(180deg, rgba(44, 48, 62, .6), rgba(18, 20, 28, .75)); padding: 8px 10px; min-height: 62px; cursor: pointer; color: var(--ink); font-family: var(--pf); text-align: left; transition: border-color .15s, transform .1s; touch-action: manipulation; }
  .lv:hover { border-color: var(--gold); }
  .lv:active { transform: translateY(1px); }
  .lv .no { font-size: 11px; color: var(--mut); letter-spacing: 1px; }
  .lv .nm { font-family: var(--sf); font-size: 16.5px; font-weight: 800; letter-spacing: 2px; color: #f6efe0; }
  .lv .ds { font-size: 12px; color: var(--gold); letter-spacing: 1px; }
  .lv .st { position: absolute; right: 8px; top: 7px; font-size: 13px; letter-spacing: 1px; color: #f0cf86; }
  .lv .st .off { color: #3b3f4a; }
  .lv.done { border-color: rgba(216, 181, 108, .65); }
  body.portrait .ov:not(#title) { padding: 64px 12px 12px; }
  body.short #lsOv p, body.short #pzOv p { display: none; }
  body.short #lsOv .lv, body.short #pzOv .lv { min-height: 54px; padding: 6px 10px; }
  .kg-toast { top: 44%; padding: 9px 20px; border-radius: 8px; background: rgba(16, 19, 27, .95); border: 1px solid var(--gold); color: #f0dcae; font-family: var(--pf); font-size: 15.5px; font-weight: 700; letter-spacing: 1px; max-width: 88vw; white-space: normal; text-align: center; box-shadow: 0 8px 26px rgba(0, 0, 0, .55); }
</style>
</head>
<body>
<canvas id="cv" aria-label="將棋棋盤"></canvas>
<button id="bPause" class="ui glass hide" aria-label="選單"><svg viewBox="0 0 24 24"><rect x="6" y="5" width="4" height="14" rx="1" fill="#f1ead9"/><rect x="14" y="5" width="4" height="14" rx="1" fill="#f1ead9"/></svg></button>
<div id="info" class="ui glass hide"></div>
<div id="note" class="ui glass hide"></div>
<div id="moveBox" class="ui glass hide"><h3>棋譜<small id="mbCount"></small></h3><div class="mlist" id="mlistSide"></div></div>
<div id="ctrl" class="ui hide">
  <button class="cbtn" id="cHint"><svg viewBox="0 0 24 24" fill="none" stroke="#d8b56c" stroke-width="2" stroke-linecap="round"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.2 1 2V16h5v-.1c0-.8.4-1.5 1-2A6 6 0 0 0 12 3Z"/></svg>提示</button>
  <button class="cbtn" id="cUndo"><svg viewBox="0 0 24 24" fill="none" stroke="#d8b56c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14 4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-3"/></svg>悔棋</button>
  <button class="cbtn" id="cFlip"><svg viewBox="0 0 24 24" fill="none" stroke="#d8b56c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 4v16M7 4 3 8M7 4l4 4M17 20V4M17 20l-4-4M17 20l4-4"/></svg>翻轉</button>
  <button class="cbtn" id="cList"><svg viewBox="0 0 24 24" fill="none" stroke="#d8b56c" stroke-width="2" stroke-linecap="round"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M9 8h6M9 12h6M9 16h3"/></svg>棋譜</button>
  <button class="cbtn" id="cCn"><svg viewBox="0 0 24 24" fill="none" stroke="#d8b56c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5h9M8.5 3v2M6 5c0 4 3 7 6 8M11 5c-1 4-3.5 7-7 9"/><path d="m13 21 4-9 4 9M14.5 18h5"/></svg>中文</button>
  <button class="cbtn warn" id="cResign"><svg viewBox="0 0 24 24" fill="none" stroke="#e2756c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 21V4M5 4h12l-2 4 2 4H5"/></svg><span>投了</span></button>
</div>

<div id="title" class="ov hide">
  <div class="logo">
    <div class="sub">SHOGI · JAPANESE CHESS</div>
    <div class="tl"><h1>將棋</h1><div class="seal"><span>王</span></div></div>
    <div class="motto">持駒再生 · 一局千變</div>
  </div>
  <div class="tcard glass">
    <div class="seg big" id="segMode"><button data-v="ai">對弈電腦</button><button data-v="pvp">雙人對弈</button><button data-v="puzzle">詰將棋</button><button data-v="lesson">規則教學</button></div>
    <div class="frow" id="rowSide"><label>執子</label><div class="seg" id="segSide"><button data-v="0">先手 ▲</button><button data-v="1">後手 △</button></div></div>
    <div class="frow" id="rowDiff"><label>難度</label><div class="seg" id="segDiff"><button data-v="0">入門</button><button data-v="1">初級</button><button data-v="2">中級</button><button data-v="3">上級</button></div></div>
    <div class="tbtns"><button class="gbtn pri" id="tStart">開始對局</button><button class="gbtn hide" id="tResume">繼續上局</button></div>
    <div class="trow2"><button class="tog" id="tMusic">音樂 開</button><button class="tog" id="tSfx">音效 開</button><button class="tog" id="tCn">中文說明 開</button></div>
    <div class="rec" id="tRec"></div>
    <div class="tips">點棋子再點落點，或直接拖曳；點駒台上的持駒可以打入。鍵盤：方向鍵＋Enter・U 悔棋・H 提示・F 翻轉・C 中文・P 選單</div>
  </div>
</div>
<div id="pzOv" class="ov hide">
  <div class="card glass">
    <h2>詰將棋</h2>
    <p>先手（你）每一步都必須「王手」（將軍），在限定步數內把對方的王將死。對方持有全部剩下的棋子，會盡力抵抗。</p>
    <div id="pzGrid"></div>
    <div class="acts"><button class="gbtn" id="pzBack">返回</button></div>
  </div>
</div>
<div id="lsOv" class="ov hide">
  <div class="card glass">
    <h2>規則教學</h2>
    <p>一課一個重點：每種棋子怎麼走、升變、持駒打入的規則，以及怎麼將死對方。每課都要親手操作完成。</p>
    <div class="pzgrid" id="lsGrid"></div>
    <div class="acts"><button class="gbtn" id="lsBack">返回</button></div>
  </div>
</div>
<div id="pauseOv" class="ov hide">
  <div class="card glass pcard">
    <h2>暫停</h2>
    <div class="frow"><label>背景音樂</label><div class="seg" id="pMusic"><button data-v="on">開</button><button data-v="off">關</button></div></div>
    <div class="frow"><label>音效</label><div class="seg" id="pSfx"><button data-v="on">開</button><button data-v="off">關</button></div></div>
    <div class="frow"><label>落點提示</label><div class="seg" id="pDots"><button data-v="on">顯示</button><button data-v="off">隱藏</button></div></div>
    <div class="frow"><label>中文說明</label><div class="seg" id="pCn"><button data-v="on">顯示</button><button data-v="off">隱藏</button></div></div>

<script>
/*ENGINE-START*/
function ShogiEngine() {
  'use strict';
  // ---- 座標：sq = y*9 + x；x=0 是第 9 筋（左），y=0 是一段（上，後手陣）----
  // 棋子類型：1歩 2香 3桂 4銀 5角 6飛 7金 8王；升變 = 類型 | 8（9と 10成香 11成桂 12成銀 13馬 14竜）
  // 棋子代碼 = 類型 | 方 << 4（0 先手、1 後手）
  const DX = [0, 1, 1, 1, 0, -1, -1, -1], DY = [-1, -1, 0, 1, 1, 1, 0, -1];
  const NB = new Int16Array(81 * 8).fill(-1);
  const RAY = new Array(81 * 8);
  const FILE = new Uint8Array(81), RANK = new Uint8Array(81);
  for (let sq = 0; sq < 81; sq++) {
    const x = sq % 9, y = (sq / 9) | 0; FILE[sq] = x; RANK[sq] = y;
    for (let k = 0; k < 8; k++) {
      const r = []; let xx = x + DX[k], yy = y + DY[k];
      while (xx >= 0 && xx < 9 && yy >= 0 && yy < 9) { r.push(yy * 9 + xx); xx += DX[k]; yy += DY[k]; }
      RAY[sq * 8 + k] = Int16Array.from(r);
      if (r.length) NB[sq * 8 + k] = r[0];
    }
  }
  const bits = function () { let m = 0; for (let i = 0; i < arguments.length; i++) m |= 1 << arguments[i]; return m; };
  const GOLD = bits(0, 1, 7, 2, 6, 4);
  const OWN_STEP = [0, bits(0), 0, 0, bits(0, 1, 7, 3, 5), 0, 0, GOLD, 255, GOLD, GOLD, GOLD, GOLD, bits(0, 2, 4, 6), bits(1, 3, 5, 7)];
  const OWN_SLIDE = [0, 0, bits(0), 0, 0, bits(1, 3, 5, 7), bits(0, 2, 4, 6), 0, 0, 0, 0, 0, 0, bits(1, 3, 5, 7), bits(0, 2, 4, 6)];
  const rot4 = m => ((m << 4) | (m >> 4)) & 255;
  const STEP = new Uint8Array(32), SLIDE = new Uint8Array(32);
  for (let t = 1; t <= 14; t++) { STEP[t] = OWN_STEP[t]; SLIDE[t] = OWN_SLIDE[t]; STEP[16 + t] = rot4(OWN_STEP[t]); SLIDE[16 + t] = rot4(OWN_SLIDE[t]); }
  const KN = [[], []], KNSRC = [[], []];
  for (let s = 0; s < 2; s++) for (let sq = 0; sq < 81; sq++) { KN[s][sq] = []; KNSRC[s][sq] = []; }
  for (let s = 0; s < 2; s++) for (let sq = 0; sq < 81; sq++) {
    const x = FILE[sq], y = RANK[sq], dy = s ? 2 : -2;
    for (let dx = -1; dx <= 1; dx += 2) {
      const xx = x + dx, yy = y + dy;
      if (xx >= 0 && xx < 9 && yy >= 0 && yy < 9) { const q = yy * 9 + xx; KN[s][sq].push(q); KNSRC[s][q].push(sq); }
    }
  }
  // 敵陣（升變區）與「打下去／走過去就動不了」的格子
  const ZONE = [new Uint8Array(81), new Uint8Array(81)];
  const DEAD = [];
  for (let i = 0; i < 16; i++) DEAD.push(new Uint8Array(81));
  for (let sq = 0; sq < 81; sq++) {
    const y = RANK[sq];
    ZONE[0][sq] = y <= 2 ? 1 : 0; ZONE[1][sq] = y >= 6 ? 1 : 0;
    if (y === 0) { DEAD[1][sq] = DEAD[2][sq] = 1; }
    if (y <= 1) DEAD[3][sq] = 1;
    if (y === 8) { DEAD[9][sq] = DEAD[10][sq] = 1; }
    if (y >= 7) DEAD[11][sq] = 1;
  }

  // ---- Zobrist（固定種子，主執行緒與 Worker 一致）----
  let seed = 0x2545f491 | 0;
  function rnd() { seed ^= seed << 13; seed ^= seed >>> 17; seed ^= seed << 5; return seed | 0; }
  const ZK = new Int32Array(32 * 81), ZL = new Int32Array(32 * 81);
  for (let i = 0; i < ZK.length; i++) { ZK[i] = rnd(); ZL[i] = rnd(); }
  const HK = new Int32Array(16 * 20), HL = new Int32Array(16 * 20);
  for (let i = 0; i < HK.length; i++) { if (i % 20) { HK[i] = rnd(); HL[i] = rnd(); } }
  const ZSK = rnd(), ZSL = rnd();

  // ---- 狀態 ----
  const Bd = new Uint8Array(81);
  const hand = new Uint8Array(16);
  const kingSq = [-1, -1];
  let sd = 0, key = 0, lock = 0, n = 0, dist = 0;
  const MAXH = 4096;
  const hMv = new Int32Array(MAXH), hCap = new Uint8Array(MAXH), hKey = new Int32Array(MAXH), hLock = new Int32Array(MAXH);
  const chkAt = new Uint8Array(MAXH + 1);

  function put(sq, p) { Bd[sq] = p; const i = p * 81 + sq; key ^= ZK[i]; lock ^= ZL[i]; if ((p & 15) === 8) kingSq[p >> 4] = sq; }
  function remove(sq, p) { Bd[sq] = 0; const i = p * 81 + sq; key ^= ZK[i]; lock ^= ZL[i]; }
  function handAdd(s, t, d) {
    const i = s * 8 + t, c = hand[i], j = i * 20;
    key ^= HK[j + c] ^ HK[j + c + d]; lock ^= HL[j + c] ^ HL[j + c + d]; hand[i] = c + d;
  }
  const baseOf = t => t > 8 ? t - 8 : t;

  // sq 是否被 a 方攻擊
  function isAttacked(sq, a) {
    for (let k = 0; k < 8; k++) {
      const kk = (k + 4) & 7, r = RAY[sq * 8 + k];
      if (!r.length) continue;
      let p = Bd[r[0]];
      if (p) { if ((p >> 4) === a && (((STEP[p] | SLIDE[p]) >> kk) & 1)) return true; continue; }
      for (let i = 1; i < r.length; i++) {
        p = Bd[r[i]];
        if (p) { if ((p >> 4) === a && ((SLIDE[p] >> kk) & 1)) return true; break; }
      }
    }
    const ks = KNSRC[a][sq], kn = 3 | (a << 4);
    for (let i = 0; i < ks.length; i++) if (Bd[ks[i]] === kn) return true;
    return false;
  }
  function inCheckSide(s) { return kingSq[s] >= 0 && Bd[kingSq[s]] === (8 | (s << 4)) && isAttacked(kingSq[s], s ^ 1); }

  // ---- 走法產生 ----
  // mv = to | from << 7 | promo << 14；打入時 from = 81 + 類型
  function add(buf, c, from, to, t, caps, all) {
    const x = Bd[to];
    if (x) { if ((x >> 4) === sd) return c; } else if (caps) return c;
    const mv = to | (from << 7);
    if (t <= 6 && (ZONE[sd][to] || ZONE[sd][from])) {
      buf[c++] = mv | 16384;
      if (!DEAD[t + sd * 8][to] && (all || t === 2 || t === 3 || t === 4)) buf[c++] = mv;
    } else buf[c++] = mv;
    return c;
  }
  function gen(buf, off, caps, all) {
    let c = off;
    const me = sd, op = sd ^ 1;
    for (let from = 0; from < 81; from++) {
      const p = Bd[from];
      if (!p || (p >> 4) !== me) continue;
      const t = p & 15;
      if (t === 3) { const ks = KN[me][from]; for (let i = 0; i < ks.length; i++) c = add(buf, c, from, ks[i], 3, caps, all); continue; }
      let m = STEP[p];
      for (let k = 0; m; k++, m >>= 1) if (m & 1) { const q = NB[from * 8 + k]; if (q >= 0) c = add(buf, c, from, q, t, caps, all); }
      m = SLIDE[p];
      for (let k = 0; m; k++, m >>= 1) {
        if (!(m & 1)) continue;
        const r = RAY[from * 8 + k];
        for (let i = 0; i < r.length; i++) {
          const q = r[i], x = Bd[q];
          if (!x) { if (!caps) c = add(buf, c, from, q, t, false, all); }
          else { if ((x >> 4) === op) c = add(buf, c, from, q, t, caps, all); break; }
        }
      }
    }
    if (!caps) {
      const hb = me * 8;
      let pawnFiles = 0;
      if (hand[hb + 1]) { const pw = 1 | (me << 4); for (let sq = 0; sq < 81; sq++) if (Bd[sq] === pw) pawnFiles |= 1 << FILE[sq]; }
      for (let i = 0; i < 7; i++) { const t = DROP_ORDER[i]; if (hand[hb + t]) c = dropGen(buf, c, t, hb, pawnFiles); }
    }
    return c - off;
  }
  const DROP_ORDER = [6, 5, 7, 4, 3, 2, 1];
  function dropGen(buf, c, t, hb, pawnFiles) {
    const dead = DEAD[hb + t], fr = (81 + t) << 7;
    for (let sq = 0; sq < 81; sq++) {
      if (Bd[sq] || dead[sq]) continue;
      if (t === 1 && ((pawnFiles >> FILE[sq]) & 1)) continue;
      buf[c++] = sq | fr;
    }
    return c;
  }

  // ---- 走子 ----
  function takeBack(mv, cap) {
    const to = mv & 127, from = (mv >> 7) & 127;
    if (from >= 81) { remove(to, Bd[to]); handAdd(sd, from - 81, 1); }
    else {
      const p = Bd[to]; remove(to, p); put(from, (mv & 16384) ? (p & ~8) : p);
      if (cap) { const ct = cap & 15; handAdd(sd, baseOf(ct), -1); put(to, cap); }
    }
  }
  let inUchi = false;
  const uchiBuf = new Int32Array(700);
  function makeMove(mv) {
    const to = mv & 127, from = (mv >> 7) & 127;
    hKey[n] = key; hLock[n] = lock;
    let cap = 0;
    if (from >= 81) { const t = from - 81; handAdd(sd, t, -1); put(to, t | (sd << 4)); }
    else {
      const p = Bd[from]; cap = Bd[to];
      if (cap) { remove(to, cap); handAdd(sd, baseOf(cap & 15), 1); }
      remove(from, p); put(to, (mv & 16384) ? (p | 8) : p);
    }
    if (inCheckSide(sd)) { takeBack(mv, cap); key = hKey[n]; lock = hLock[n]; return false; }
    hMv[n] = mv; hCap[n] = cap;
    sd ^= 1; key ^= ZSK; lock ^= ZSL; n++; dist++;
    const chk = inCheckSide(sd) ? 1 : 0;
    chkAt[n] = chk;
    if (chk && from === 82 && !inUchi) {
      // 打ち歩詰め：用步打入將死對方是犯規
      inUchi = true; const has = hasLegal(); inUchi = false;
      if (!has) { undoMove(); return false; }
    }
    return true;
  }
  function undoMove() {
    n--; dist--; sd ^= 1;
    takeBack(hMv[n], hCap[n]);
    key = hKey[n]; lock = hLock[n];
  }
  function nullMove() { hKey[n] = key; hLock[n] = lock; sd ^= 1; key ^= ZSK; lock ^= ZSL; hMv[n] = 0; hCap[n] = 0; n++; dist++; chkAt[n] = 0; }
  function undoNull() { n--; dist--; sd ^= 1; key = hKey[n]; lock = hLock[n]; }
  function hasLegal() {
    const cnt = gen(uchiBuf, 0, false, true);
    for (let i = 0; i < cnt; i++) { if (makeMove(uchiBuf[i])) { undoMove(); return true; } }
    return false;
  }
  function legalMoves() {
    const buf = new Int32Array(700), cnt = gen(buf, 0, false, true), out = [];
    for (let i = 0; i < cnt; i++) if (makeMove(buf[i])) { undoMove(); out.push(buf[i]); }
    return out;
  }
  function perft(d) {
    if (d === 0) return 1;
    const buf = new Int32Array(700), cnt = gen(buf, 0, false, true);
    let total = 0;
    for (let i = 0; i < cnt; i++) {
      if (!makeMove(buf[i])) continue;
      total += d === 1 ? 1 : perft(d - 1);
      undoMove();
    }
    return total;
  }

  // ---- SFEN / USI ----
  const SF = 'PLNSBRGK';
  const START = 'lnsgkgsnl/1r5b1/ppppppppp/9/9/9/PPPPPPPPP/1B5R1/LNSGKGSNL b - 1';
  function clear() { Bd.fill(0); hand.fill(0); sd = 0; key = 0; lock = 0; n = 0; dist = 0; kingSq[0] = kingSq[1] = -1; }
  function fromSfen(str) {
    clear();
    let s = String(str || '').trim();
    if (s === 'startpos' || !s) s = START;
    const parts = s.split(/\s+/);
    const rows = parts[0].split('/');
    if (rows.length !== 9) throw new Error('bad sfen');
    for (let y = 0; y < 9; y++) {
      let x = 0, prom = false;
      for (const ch of rows[y]) {
        if (ch >= '1' && ch <= '9') { x += +ch; continue; }
        if (ch === '+') { prom = true; continue; }
        const t = SF.indexOf(ch.toUpperCase()) + 1;
        if (t <= 0 || x > 8) throw new Error('bad sfen');
        put(y * 9 + x, (prom ? t | 8 : t) | (ch === ch.toUpperCase() ? 0 : 16));
        prom = false; x++;
      }
    }
    if (parts[1] === 'w') { sd = 1; key ^= ZSK; lock ^= ZSL; }
    const h = parts[2] || '-';
    if (h !== '-') {
      let num = 0;
      for (const ch of h) {
        if (ch >= '0' && ch <= '9') { num = num * 10 + (+ch); continue; }
        const t = SF.indexOf(ch.toUpperCase()) + 1;
        if (t <= 0 || t > 7) throw new Error('bad sfen');
        const s2 = ch === ch.toUpperCase() ? 0 : 1;
        for (let k = 0; k < (num || 1); k++) handAdd(s2, t, 1);
        num = 0;
      }
    }
    chkAt[0] = inCheckSide(sd) ? 1 : 0;
  }
  function boardSfen() {
    let s = '';
    for (let y = 0; y < 9; y++) {
      let e = 0;
      for (let x = 0; x < 9; x++) {
        const p = Bd[y * 9 + x];
        if (!p) { e++; continue; }
        if (e) { s += e; e = 0; }
        const t = p & 15, c = SF[baseOf(t) - 1] || 'K';
        s += (t > 8 ? '+' : '') + (p & 16 ? c.toLowerCase() : c);
      }
      if (e) s += e;
      if (y < 8) s += '/';
    }
    return s;
  }
  function handSfen() {
    let h = '';
    for (let s2 = 0; s2 < 2; s2++) for (const t of [6, 5, 7, 4, 3, 2, 1]) {
      const c = hand[s2 * 8 + t]; if (!c) continue;
      const ch = SF[t - 1];
      h += (c > 1 ? c : '') + (s2 ? ch.toLowerCase() : ch);
    }
    return h || '-';
  }
  function toSfen() { return boardSfen() + ' ' + (sd ? 'w' : 'b') + ' ' + handSfen() + ' 1'; }
  const sqName = sq => (9 - FILE[sq]) + 'abcdefghi'[RANK[sq]];
  function mvToUsi(mv) {
    const to = mv & 127, from = (mv >> 7) & 127;
    if (from >= 81) return SF[from - 82] + '*' + sqName(to);
    return sqName(from) + sqName(to) + (mv & 16384 ? '+' : '');
  }
  function parseSq(s) { const f = +s[0], r = 'abcdefghi'.indexOf(s[1]); if (!(f >= 1 && f <= 9) || r < 0) return -1; return r * 9 + (9 - f); }
  function usiToMv(s) {
    s = String(s).trim();
    if (s[1] === '*') { const t = SF.indexOf(s[0].toUpperCase()) + 1, to = parseSq(s.slice(2, 4)); if (t <= 0 || to < 0) return 0; return to | ((81 + t) << 7); }
    const a = parseSq(s.slice(0, 2)), b = parseSq(s.slice(2, 4));
    if (a < 0 || b < 0) return 0;
    return b | (a << 7) | (s[4] === '+' ? 16384 : 0);
  }

  // ---- 重複局面（千日手）----
  // 搜尋內：0 無；1 和；2 對方連續王手（我方勝）；3 我方連續王手（我方負）
  function repStatus() {
    let self = false, selfChk = true, oppChk = true;
    const lim = Math.max(0, n - 40);
    for (let i = n - 1; i >= lim; i--) {
      if (!hMv[i]) break;
      if (self) selfChk = selfChk && chkAt[i + 1] === 1; else oppChk = oppChk && chkAt[i + 1] === 1;
      if (self && hKey[i] === key && hLock[i] === lock) {
        if (oppChk && !selfChk) return 2;
        if (selfChk && !oppChk) return 3;
        return 1;
      }
      self = !self;
    }
    return 0;
  }
  // 對局用：目前局面出現幾次，以及上一次出現到現在雙方是否一直王手
  function gameRep() {
    let count = 1, self = false, selfChk = true, oppChk = true, first = null;
    for (let i = n - 1; i >= 0; i--) {
      if (!hMv[i]) break;
      if (self) selfChk = selfChk && chkAt[i + 1] === 1; else oppChk = oppChk && chkAt[i + 1] === 1;
      if (self && hKey[i] === key && hLock[i] === lock) { count++; if (!first) first = { selfChk, oppChk }; }
      self = !self;
    }
    return { count, selfChk: first ? first.selfChk : false, oppChk: first ? first.oppChk : false };
  }

  // ---- 評估 ----
  const VAL = [0, 100, 260, 290, 400, 600, 700, 470, 0, 450, 430, 430, 460, 830, 950];
  const HVAL = [0, 112, 285, 320, 445, 680, 790, 525];
  const DEFW = [0, 0, 0, 0, 16, 0, 0, 20, 0, 16, 14, 14, 16, 22, 10];
  const ATKW = [0, 4, 10, 14, 18, 26, 30, 20, 0, 18, 16, 16, 18, 40, 46];
  const CHEB = [];
  for (let a = 0; a < 81; a++) { const row = new Uint8Array(81); for (let b2 = 0; b2 < 81; b2++) row[b2] = Math.max(Math.abs(FILE[a] - FILE[b2]), Math.abs(RANK[a] - RANK[b2])); CHEB.push(row); }
  function evaluate() {
    const sc = [0, 0], def = [0, 0], atk = [0, 0], atkN = [0, 0];
    const k0 = kingSq[0], k1 = kingSq[1];
    const kr0 = k0 >= 0 ? CHEB[k0] : null, kr1 = k1 >= 0 ? CHEB[k1] : null;
    for (let sq = 0; sq < 81; sq++) {
      const p = Bd[sq]; if (!p) continue;
      const s = p >> 4, t = p & 15;
      const adv = s ? RANK[sq] : 8 - RANK[sq];
      let v = VAL[t];
      const ownK = s ? kr1 : kr0, oppK = s ? kr0 : kr1;
      switch (t) {
        case 1: v += adv * 3; break;
        case 4: v += adv >= 2 && adv <= 4 ? 12 : 0; break;
        case 3: v += adv >= 2 ? 8 : 0; break;
        case 8: {
          v += adv <= 1 ? 28 : -22 * (adv - 1);
          const x = FILE[sq]; if (x <= 2 || x >= 6) v += 16;
          break;
        }
        case 5: case 6: case 13: case 14: {
          let mob = 0;
          let m = SLIDE[p];
          for (let k = 0; m; k++, m >>= 1) { if (!(m & 1)) continue; const r = RAY[sq * 8 + k]; for (let i = 0; i < r.length; i++) { mob++; if (Bd[r[i]]) break; } }
          v += mob * 2;
          break;
        }
      }
      if (t >= 9 && oppK) v += (8 - oppK[sq]) * 5;
      if (ownK && t !== 8 && ownK[sq] <= 2 && DEFW[t]) def[s] += DEFW[t];
      if (oppK && t !== 8 && oppK[sq] <= 2) { atk[s] += ATKW[t]; if (t !== 1) atkN[s]++; }
      sc[s] += v;
    }
    for (let s = 0; s < 2; s++) {
      const hb = s * 8;
      for (let t = 1; t <= 7; t++) { const c = hand[hb + t]; if (c) sc[s] += c * HVAL[t] - (t === 1 && c > 2 ? (c - 2) * 20 : 0); }
    }
    for (let s = 0; s < 2; s++) {
      const o = s ^ 1, ob = o * 8;
      const handThreat = hand[ob + 6] * 22 + hand[ob + 5] * 16 + hand[ob + 7] * 12 + hand[ob + 4] * 10 + hand[ob + 3] * 7 + hand[ob + 2] * 5 + Math.min(hand[ob + 1], 3) * 2;
      let danger = atk[o] + (atkN[o] ? handThreat : handThreat * 0.35);
      if (atkN[o] >= 2) danger *= 1.4;
      sc[s] += Math.min(def[s], 70) - danger;
    }
    return (sd === 0 ? sc[0] - sc[1] : sc[1] - sc[0]) + 12;
  }

  // ---- 搜尋 ----
  const MATE = 30000, WIN = 29000, BAN = 28000, INF = 32000, MAXD = 40, MB = 640;
  const TT_SIZE = 1 << 19, TT_MASK = TT_SIZE - 1;
  let ttLock = null, ttMove, ttScore, ttDepth, ttFlag, ttAge, age = 0;
  function ttInit() {
    age = (age + 1) & 255;
    if (ttLock) return;
    ttLock = new Int32Array(TT_SIZE); ttMove = new Int32Array(TT_SIZE); ttScore = new Int32Array(TT_SIZE);
    ttDepth = new Int8Array(TT_SIZE); ttFlag = new Uint8Array(TT_SIZE); ttAge = new Uint8Array(TT_SIZE);
  }
  const moveBuf = new Int32Array((MAXD + 2) * MB), scoreBuf = new Int32Array((MAXD + 2) * MB);
  const killers = new Int32Array((MAXD + 2) * 2);

    } else if (S.mode === 'pvp' && !silent) { stats.pvp++; saveStats(); }
    let stars = 0;
    if (S.mode === 'puzzle' && res.winner === 0 && !silent) {
      stars = S.hints === 0 && S.undos === 0 ? 3 : S.hints + S.undos <= 1 ? 2 : 1;
      const pz = PUZZLES[S.pz];
      stats.pz[pz.id] = Math.max(stats.pz[pz.id] || 0, stars); saveStats();
    }
    S.lastStars = stars;
    updateUI(); updateTension();
    if (silent) return;
    const humanSide = S.mode === 'puzzle' ? 0 : S.human;
    const humanLost = (S.mode === 'ai' || S.mode === 'puzzle') && res.winner !== -1 && res.winner !== humanSide;
    const delay = anim ? anim.dur + 120 : 150;
    setTimeout(() => {
      if (KG.music) KG.music.stop(0.6);
      if (res.reason === '詰み') sfx('gong', { pitch: vary(0.01) });
      setTimeout(() => {
        if (S.mode === 'puzzle' && res.winner === 0) jingle(J.solved);
        else if (res.winner === -1) jingle(J.draw);
        else if (humanLost) jingle(J.lose);
        else jingle(J.win);
      }, res.reason === '詰み' ? 450 : 0);
      const txt = res.reason === '詰み' ? '詰み' : res.reason === '投了' ? '投了' : res.reason === '挑戰失敗' ? '失敗' : res.reason === '持將棋' ? '持將棋' : '千日手';
      const sub = res.reason === '詰み' ? '＝將死' : res.reason === '投了' ? '＝認輸' : res.reason === '千日手' ? '＝重複局面' : res.reason === '連續王手千日手' ? '連續王手者負' : '';
      showBanner(txt, sub, res.winner === -1 ? '#34405a' : '#a8231c', 1500);

      }
    }, delay);
    S.overTimer = setTimeout(() => showOver(), delay + 1700);
  }

  function maybeAI() {
    if (S.over || S.screen !== 'play' || S.mode !== 'ai') return;
    const side = aiSide();
    if (E.sd !== side) return;
    S.thinking = true; updateUI(); animating = true; dirty = true;
    const myId = ++S.searchId;
    const t0 = now();
    const play = (u, r) => {
      if (myId !== S.searchId || S.over || S.screen !== 'play') return;
      const wait = Math.max(0, (anim ? 480 : 420) - (now() - t0));
      S.aiTimer = setTimeout(() => {
        if (myId !== S.searchId || S.over) return;
        if (S.paused) { S.resumeAI = () => play(u, r); return; }
        S.thinking = false;
        if (r) S.nearMate = Math.abs(r.score) > E.WIN;
        const mv = E.usiToMv(u);
        if (!doMove(mv)) updateUI();
      }, wait);
    };
    const book = S.diff >= 1 && S.startSfen === E.START && S.moves.length < 6 ? BOOK.get(E.key) : null;
    if (book && book.length && Math.random() < 0.85) { play(book[Math.floor(Math.random() * book.length)]); return; }
    askEngine({ kind: 'think', opts: DIFF[S.diff].opts }, r => {
      if (myId !== S.searchId) return;
      if (!r.usi) { S.thinking = false; updateUI(); return; }
      S.lastSearch = r;
      play(r.usi, r);
    });
  }
  function puzzleDefend() {
    if (S.over) return;
    S.thinking = true; updateUI(); animating = true;
    const myId = ++S.searchId, t0 = now();
    askEngine({ kind: 'defend', n: Math.max(1, puzzleLeft()) }, r => {
      if (myId !== S.searchId || S.over) return;
      const wait = Math.max(0, 520 - (now() - t0));
      S.aiTimer = setTimeout(() => {
        if (myId !== S.searchId || S.over) return;
        const go = () => { S.thinking = false; if (!r.usi || !doMove(E.usiToMv(r.usi))) updateUI(); };
        if (S.paused) { S.resumeAI = go; return; }
        go();
      }, wait);
    });
  }

  function undo() {
    if (S.screen !== 'play' || !S.moves.length) { sfx('bump'); return; }
    if (S.over && S.over.reason === '投了') { sfx('bump'); return; }
    if (S.over) { S.over = null; clearTimeout(S.overTimer); hideOv('overOv'); musicGame(); }
    cancelSearch(); clearTimeout(S.aiTimer); S.searchId++; S.thinking = false; S.resumeAI = null;
    const human = S.mode === 'pvp' ? -1 : S.mode === 'ai' ? S.human : 0;
    let popped = 0, humanPopped = false;
    while (S.moves.length) {
      const m = S.moves.pop();
      if (m.pass) E.unpass(); else E.undoMove();
      popped++;
      if (!m.pass && (human < 0 || m.side === human)) humanPopped = true;
      if (humanPopped && (human < 0 || E.sd === human)) break;
    }
    refreshLegal();
    if (!popped) { sfx('bump'); return; }
    S.undos++;
    S.sel = null; S.selMoves = []; S.hint = null; S.promo = null; anim = null; banner = null; flyers.length = 0; flips.length = 0; handHidden.fill(0);
    S.nearMate = false;
    sfx('undoSw', { pitch: vary(0.04) });
    save(); updateUI(); updateTension(); dirty = true; animating = true;
    maybeAI();
  }

  function hint() {
    if (!humanTurn()) { sfx('bump'); return; }
    const show = (mv) => {
      S.hint = { mv, t0: now() };
      const from = (mv >> 7) & 127;
      if (from >= 81) setSel({ kind: 'hand', side: E.sd, t: from - 81 }, true);
      else setSel({ kind: 'board', sq: from }, true);
      const d = describe(mv);
      KG.toast('提示：' + d.kif.slice(1));
      sfx('hintC', { pitch: vary(0.02) });
      animating = true; dirty = true;
    };
    if (S.mode === 'lesson') {
      const ls = LESSONS[S.ls], step = S.moves.filter(m => !m.pass).length;
      const u = ls.sol[Math.min(step, ls.sol.length - 1)], mv = E.usiToMv(u);
      if (S.legal.indexOf(mv) >= 0) { S.hints++; show(mv); } else { KG.toast('按「悔棋」或重新開始這一課再試試'); sfx('bump'); }
      return;
    }
    S.thinking = true; updateUI();
    const myId = ++S.searchId;
    const req = S.mode === 'puzzle' ? { kind: 'mate', n: puzzleLeft() } : { kind: 'think', opts: { timeMs: 900, maxDepth: 30, minDepth: 3 } };
    askEngine(req, r => {
      if (myId !== S.searchId) return;
      S.thinking = false;
      if (r.usi) { S.hints++; show(E.usiToMv(r.usi)); save(); }
      else if (S.mode === 'puzzle') { KG.toast('這個局面已經詰不到了，悔棋重來吧'); sfx('bump'); }
      updateUI(); animating = true; dirty = true;
    });
  }
  function resign() {

    confirmBox('投了（認輸）', S.mode === 'pvp' ? SIDE_NAME[who] + '確定要投了嗎？' : S.mode === 'puzzle' ? '放棄這一題？' : '確定要投了（認輸）嗎？', '投了', () => {
      cancelSearch(); S.searchId++;

      btn('題目列表', '', () => { S.screen = 'title'; showScreen(); showPuzzles(); });
    } else {
      btn('再來一局', 'pri', () => startGame({ mode: S.mode, side: S.human, diff: S.diff }));
      btn('檢視棋譜', '', () => { openList(); });
      btn('回到標題', '', () => { S.screen = 'title'; showScreen(); });
    }
    showOv('overOv');
  }

  function togglePause(v) {
    if (S.screen !== 'play') return;
    S.paused = v == null ? !S.paused : v;
    if (S.paused) {
      syncToggles();
      const s = stats;
      $('pStats').innerHTML = DIFF.map((d, k) => `<span>${d.name}</span><span>${s.d[k].w}勝 ${s.d[k].l}負 ${s.d[k].d}和</span>`).join('') +
        `<span>詰將棋</span><span>${Object.keys(s.pz).length} / ${PUZZLES.length}</span><span>規則教學</span><span>${Object.keys(s.ls).length} / ${LESSONS.length}</span>`;
      showOv('pauseOv');
      if (KG.music) KG.music.pause();
    } else {
      hideOv('pauseOv');
      if (KG.music) KG.music.resume();
      if (S.resumeAI) { const f = S.resumeAI; S.resumeAI = null; f(); }
    }
    updateUI();
  }

  /* =====================================================================
   * 輸入
   * ===================================================================== */
  function selMovesFor(sel) {
    if (sel.kind === 'board') return S.legal.filter(m => ((m >> 7) & 127) === sel.sq);
    return S.legal.filter(m => ((m >> 7) & 127) === 81 + sel.t);
  }
  function setSel(sel, quiet) {
    S.sel = sel; S.selMoves = sel ? selMovesFor(sel) : []; S.promo = null;
    if (sel && !quiet) sfx('lift', { pitch: vary(0.05) });
    updateNote(); dirty = true; animating = true;
  }
  function whyIllegal(sel, sq) {
    const side = E.sd;
    if (sel.kind === 'hand') {
      const t = sel.t;
      if (E.B[sq]) return '持駒只能打在空格上';
      if (t <= 3 && E.DEAD[side * 8 + t][sq]) return t === 3 ? '桂馬不能打在最後兩段（打下去就動不了）' : CN_NAME[t] + '不能打在最後一段（打下去就動不了）';
      if (t === 1) {
        const x = sq % 9;
        for (let y = 0; y < 9; y++) if (E.B[y * 9 + x] === (1 | (side << 4))) return '二步：同一直行不能有兩個自己沒升變的步兵';
        const k = E.kingSq[1 - side];
        if (k >= 0 && sq + (side ? 9 : -9) === k && !E.inCheck()) return '打步詰：不能用打入的步兵直接將死對方';
      }
    }
    const buf = new Int32Array(700), n = E.gen(buf, 0, false, true);
    const from = sel.kind === 'board' ? sel.sq : 81 + sel.t;
    for (let i = 0; i < n; i++) {
      if ((buf[i] & 127) === sq && ((buf[i] >> 7) & 127) === from) return E.inCheck() ? '現在被王手，必須先解除王手' : '這樣走自己的王會被吃掉';
    }
    return null;
  }
  function tryMoveTo(sq, viaDrag) {
    const cands = S.selMoves.filter(m => (m & 127) === sq);
    if (!cands.length) {
      const own = E.B[sq] && (E.B[sq] >> 4) === E.sd;
      if (own && !viaDrag) { setSel({ kind: 'board', sq }); return; }
      const why = whyIllegal(S.sel, sq);
      sfx('bump', { pitch: vary(0.04) });
      if (why) KG.toast(why);
      if (!viaDrag) setSel(null, true);
      return;
    }
    if (cands.length === 2) {
      const yes = cands.find(m => m & 16384), no = cands.find(m => !(m & 16384));
      const p = E.B[(yes >> 7) & 127];
      S.promo = { sq, yes, no, p };
      sfx('tock', { pitch: 1.2 });
      dirty = true; animating = true;
      return;
    }
    doMove(cands[0], { instant: viaDrag });
  }
  function ownHandAt(px, py) {
    for (let side = 0; side < 2; side++) {
      const tr = trayOf(side);
      if (px < tr.x - 6 || px > tr.x + tr.w + 6 || py < tr.y - 6 || py > tr.y + tr.h + 6) continue;
      let best = null, bd = 1e9;
      for (const sl of trayHit[side]) { const d = Math.hypot(px - sl.cx, py - sl.cy); if (d < bd) { bd = d; best = sl; } }
      if (best && bd < Math.max(L.cw * 1.1, 34)) return { side, t: best.t };
      return { side, t: 0 };
    }
    return null;
  }
  function inRect(px, py, r) { return px >= r.x && px <= r.x + r.w && py >= r.y && py <= r.y + r.h; }
  cv.addEventListener('pointerdown', e => {
    if (S.screen !== 'play') return;
    const px = e.clientX, py = e.clientY;
    S.cursor = null;
    if (S.promo) {
      const r = promoRects();
      if (inRect(px, py, r.a)) { doMove(r.a.mv); return; }
      if (inRect(px, py, r.b)) { doMove(r.b.mv); return; }
      S.promo = null; sfx('back', { pitch: vary(0.03) }); dirty = true;
      if (inRect(px, py, r)) return;
    }
    if (!humanTurn()) { if (S.thinking) sfx('bump', { vol: 0.6 }); return; }
    const h = ownHandAt(px, py);
    if (h) {
      if (h.side !== E.sd || !h.t) { if (h.t) { sfx('bump', { pitch: vary(0.04) }); KG.toast('現在輪到' + SIDE_NAME[E.sd]); } return; }
      if (S.sel && S.sel.kind === 'hand' && S.sel.t === h.t) { setSel(null, true); sfx('tock', { pitch: 0.9 }); return; }
      setSel({ kind: 'hand', side: h.side, t: h.t });
      drag = { src: { kind: 'hand', side: h.side, t: h.t }, x0: px, y0: py, x: px, y: py, active: false, id: e.pointerId };
      try { cv.setPointerCapture(e.pointerId); } catch (er) { /* 忽略 */ }
      return;
    }
    const sq = hitSq(px, py);
    if (sq < 0) { if (S.sel) { setSel(null, true); sfx('tock', { pitch: 0.9 }); } return; }
    const p = E.B[sq];
    if (p && (p >> 4) === E.sd) {
      if (!(S.sel && S.sel.kind === 'board' && S.sel.sq === sq)) setSel({ kind: 'board', sq });
      drag = { src: { kind: 'board', sq }, x0: px, y0: py, x: px, y: py, active: false, id: e.pointerId, wasSel: true };
      try { cv.setPointerCapture(e.pointerId); } catch (er) { /* 忽略 */ }
      return;
    }
    if (S.sel) tryMoveTo(sq, false);
    else if (p) { sfx('tock', { pitch: 0.8 }); KG.toast('這是' + SIDE_NAME[p >> 4] + '的' + CN_NAME[(p & 15) === 8 ? 15 : p & 15] + '：' + CN_HELP[p & 15].replace(/^[^：]+：/, '').slice(0, 22) + '…'); }
  });
  cv.addEventListener('pointermove', e => {
    if (!drag || e.pointerId !== drag.id) return;
    drag.x = e.clientX; drag.y = e.clientY;
    if (!drag.active && Math.hypot(drag.x - drag.x0, drag.y - drag.y0) > 9) drag.active = true;
    if (drag.active) { dirty = true; animating = true; }
  });
  const endDrag = e => {
    if (!drag || (e && e.pointerId !== drag.id)) return;
    const d = drag; drag = null;
    if (d.active && e && e.type === 'pointerup') {
      const sq = hitSq(e.clientX, e.clientY - L.cw * 0.3);
      if (sq >= 0 && !(d.src.kind === 'board' && sq === d.src.sq) && humanTurn()) tryMoveTo(sq, true);
    }
    dirty = true; animating = true;
  };
  cv.addEventListener('pointerup', endDrag);
  cv.addEventListener('pointercancel', endDrag);

  addEventListener('keydown', e => {
    if (S.screen !== 'play') return;
    const k = e.key;
    if (k === 'Escape' || k === 'p' || k === 'P') {
      if (S.promo) { S.promo = null; dirty = true; return; }
      if (!$('cfOv').classList.contains('hide')) { hideOv('cfOv'); return; }
      if (!$('listOv').classList.contains('hide')) { hideOv('listOv'); return; }
      if (!$('overOv').classList.contains('hide')) return;
      togglePause(); return;
    }
    if (S.paused || !$('overOv').classList.contains('hide') || !$('cfOv').classList.contains('hide')) return;
    if (S.promo) {
      if (k === 'Enter' || k === 'y' || k === 'Y') { doMove(S.promo.yes); e.preventDefault(); }
      else if (k === 'n' || k === 'N') { doMove(S.promo.no); e.preventDefault(); }
      return;
    }
    if (k === 'u' || k === 'U' || k === 'Backspace') { undo(); e.preventDefault(); return; }
    if (k === 'h' || k === 'H') { hint(); return; }
    if (k === 'f' || k === 'F') { flip(); return; }
    if (k === 'c' || k === 'C') { toggleCn(); return; }
    if (k === 'm' || k === 'M') { openList(); return; }
    if (/^[1-7]$/.test(k) && humanTurn()) {
      const list = HAND_ORDER.filter(t => E.hand[E.sd * 8 + t] > 0);
      const t = list[+k - 1];
      if (t) setSel({ kind: 'hand', side: E.sd, t }); else sfx('bump');
      return;
    }
    const dirs = { ArrowLeft: [-1, 0], ArrowRight: [1, 0], ArrowUp: [0, -1], ArrowDown: [0, 1] };
    if (dirs[k]) {
      e.preventDefault();
      if (!S.cursor) { const ks = S.sel && S.sel.kind === 'board' ? S.sel.sq : (E.kingSq[E.sd] >= 0 ? E.kingSq[E.sd] : 40); S.cursor = { x: ks % 9, y: (ks / 9) | 0 }; }
      else { const f = flipped() ? -1 : 1; S.cursor.x = clamp(S.cursor.x + dirs[k][0] * f, 0, 8); S.cursor.y = clamp(S.cursor.y + dirs[k][1] * f, 0, 8); }
      sfx('tick', { vol: 0.5 });
      dirty = true; return;
    }
    if ((k === 'Enter' || k === ' ') && S.cursor && humanTurn()) {
      e.preventDefault();
      const sq = S.cursor.y * 9 + S.cursor.x, p = E.B[sq];
      if (p && (p >> 4) === E.sd && !(S.sel && S.sel.kind === 'hand')) setSel({ kind: 'board', sq });
      else if (S.sel) tryMoveTo(sq, false);
      dirty = true;
    }
  });

  // 按鈕
  $('cHint').addEventListener('click', () => { sfx('ui'); hint(); });
  $('cUndo').addEventListener('click', () => undo());
  $('cFlip').addEventListener('click', () => flip());
  $('cList').addEventListener('click', () => openList());
  $('cCn').addEventListener('click', () => toggleCn());
  $('cResign').addEventListener('click', () => { sfx('ui'); resign(); });
  function openList() { sfx('page', { pitch: vary(0.04) }); renderList($('mlistOv')); showOv('listOv'); const el = $('mlistOv'); el.scrollTop = el.scrollHeight; }
  $('lClose').addEventListener('click', () => { sfx('back'); hideOv('listOv'); if (S.over && $('overOv').classList.contains('hide') && !S.over.lesson) showOver(); });
  $('cfNo').addEventListener('click', () => { sfx('back'); hideOv('cfOv'); cfYes = null; });
  $('cfYes').addEventListener('click', () => { sfx('ui'); hideOv('cfOv'); const f = cfYes; cfYes = null; if (f) f(); });
  $('bPause').addEventListener('click', () => { sfx('ui'); togglePause(); });
  $('pResume').addEventListener('click', () => { sfx('ui'); togglePause(false); });
  $('pRestart').addEventListener('click', () => { sfx('ui'); hideOv('pauseOv'); S.paused = false; startGame({ mode: S.mode, side: S.human, diff: S.diff, puzzle: S.pz, lesson: S.ls }); });
  $('pQuit').addEventListener('click', () => { sfx('back'); hideOv('pauseOv'); S.paused = false; cancelSearch(); S.searchId++; clearTimeout(S.aiTimer); save(); S.screen = 'title'; showScreen(); });
  function setMusic(on) { if (KG.music) KG.music.setEnabled(on); syncToggles(); }
  function setSfx(on) { sfxOn = on; store.set('shogi:sfx', sfxOn); syncToggles(); if (on) sfx('ui'); }
  bindSeg('pMusic', v => setMusic(v === 'on'));
  bindSeg('pSfx', v => setSfx(v === 'on'));
  bindSeg('pDots', v => { prefs.dots = v === 'on'; savePrefs(); dirty = true; });
  bindSeg('pCn', v => { prefs.cn = v === 'on'; savePrefs(); syncToggles(); updateUI(); dirty = true; });
  bindSeg('segMode', v => { prefs.mode = v; savePrefs(); showTitle(); });
  bindSeg('segSide', v => { prefs.side = +v; savePrefs(); });
  bindSeg('segDiff', v => { prefs.diff = +v; savePrefs(); showTitle(); });
  $('tMusic').addEventListener('click', () => { setMusic(!(KG.music && KG.music.isEnabled())); sfx('ui'); });
  $('tSfx').addEventListener('click', () => setSfx(!sfxOn));
  $('tCn').addEventListener('click', () => { prefs.cn = !prefs.cn; savePrefs(); syncToggles(); sfx('tock', { pitch: prefs.cn ? 1.1 : 0.9 }); dirty = true; });
  $('tStart').addEventListener('click', () => {
    sfx('ui');
    if (prefs.mode === 'puzzle') { showPuzzles(); return; }
    if (prefs.mode === 'lesson') { showLessons(); return; }
    startGame({ mode: prefs.mode, side: prefs.side, diff: prefs.diff });
  });
  $('tResume').addEventListener('click', () => { sfx('ui'); resumeSaved(); });
  $('pzBack').addEventListener('click', () => { sfx('back'); hideOv('pzOv'); showTitle(); });
  $('lsBack').addEventListener('click', () => { sfx('back'); hideOv('lsOv'); showTitle(); });
  function resumeSaved() {
    const sv = store.get('shogi:save', null);
    if (!sv) return false;
    startGame({ mode: sv.mode, side: sv.human, diff: sv.diff, puzzle: sv.pz, sfen: sv.startSfen, moves: sv.moves, hints: sv.hints, flip: sv.flip });
    return true;
  }

  function onResize() { if (!L) return; layout(); updateUI(); }
  addEventListener('resize', onResize);
  addEventListener('orientationchange', () => setTimeout(onResize, 120));
  if (window.visualViewport) visualViewport.addEventListener('resize', onResize);
  document.addEventListener('visibilitychange', () => {
    if (document.hidden && S.screen === 'play' && !S.over && !S.paused && $('overOv').classList.contains('hide')) togglePause(true);
  });

  /* =====================================================================
   * 測試介面
   * ===================================================================== */
  window.__shogi = {
    get state() {
      return {
        screen: S.screen, mode: S.mode, human: S.human, diff: S.diff, puzzle: S.pz, lesson: S.ls, sd: E.sd, sfen: E.toSfen(),
        moves: S.moves.map(m => m.pass ? 'pass' : m.usi), kifu: S.moves.filter(m => !m.pass).map(m => m.kif), cn: S.moves.filter(m => !m.pass).map(m => m.cn),
        over: S.over, thinking: S.thinking, inCheck: E.inCheck(), flipped: flipped(), sel: S.sel, promo: !!S.promo, paused: S.paused, hints: S.hints,
        lastSearch: S.lastSearch || null, music: KG.music ? KG.music.isPlaying() : null, legal: S.legal.length,
        layout: L && { cw: L.cw, ch: L.ch, gx: L.gx, gy: L.gy, portrait: L.portrait, bx: L.bx, by: L.by, bw: L.bw, bh: L.bh, trays: L.trays }
      };
    },
    start: opts => startGame(opts),
    move(u) { const mv = E.usiToMv(u); return doMove(mv, { instant: true }); },
    legal: () => S.legal.map(E.mvToUsi),
    sfen: () => E.toSfen(),
    setSfen(f, opts) { startGame(Object.assign({ mode: 'pvp' }, opts || {}, { sfen: f })); return E.toSfen(); },
    think: opts => new Promise(res => askEngine({ kind: 'think', opts: opts || { timeMs: 1000 } }, res)),
    sqXY(s) { const [x, y] = sqPos(sqOf(s)); return { x, y }; },
    handXY(side, t) { const [x, y] = slotPos(side, t); return { x, y }; },
    promoXY() { if (!S.promo) return null; const r = promoRects(); return { yes: { x: r.a.x + r.a.w / 2, y: r.a.y + r.a.h / 2 }, no: { x: r.b.x + r.b.w / 2, y: r.b.y + r.b.h / 2 } }; },
    puzzles: PUZZLES, lessons: LESSONS, undo, hint, flip, resign, pause: v => togglePause(v), showTitle: () => { S.screen = 'title'; showScreen(); },
    resume: resumeSaved, stats: () => stats, engine: E, ShogiEngine, book: () => BOOK.size, fillDefender
  };

  // ---------------- 啟動 ----------------
  layout();
  showTitle();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
