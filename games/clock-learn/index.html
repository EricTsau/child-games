    document.querySelectorAll('.kit-screen, .kit-ov, .kit-title').forEach(el => { el.classList.add('out'); setTimeout(() => el.remove(), 300); });
    screenEl = null;
  }
  const ACT_ICON = [
    `<svg viewBox="0 0 100 100"><use href="#ic-clock" x="0" y="0" width="100" height="100"/><circle cx="80" cy="22" r="16" fill="#ff7eb0" stroke="#fff" stroke-width="4"/><text x="80" y="30" text-anchor="middle" font-size="24" font-weight="900" fill="#fff">?</text></svg>`,
    `<svg viewBox="0 0 100 100"><use href="#ic-clock" width="100" height="100"/><path d="M68 66 l0 -16 q0 -6 6 -6 q6 0 6 6 v10 l8 2 q6 2 5 8 l-3 16 h-20 l-10 -14 q-3 -5 2 -7 q4 -1 6 2 Z" fill="#ffdcc0" stroke="#8a5a3a" stroke-width="3.5" stroke-linejoin="round"/></svg>`,
    `<svg viewBox="0 0 100 100"><path d="M50 10 A40 40 0 0 0 50 90 Z" fill="#ffe680" stroke="#e0a21a" stroke-width="5"/><path d="M50 10 A40 40 0 0 1 50 90 Z" fill="#3b3f8f" stroke="#23265e" stroke-width="5"/><circle cx="32" cy="50" r="10" fill="#ffb21f"/><path d="M70 36 a12 12 0 1 0 8 22 a10 10 0 1 1 -8 -22 Z" fill="#fff3a6"/><circle cx="62" cy="70" r="2" fill="#fff"/></svg>`,
    `<svg viewBox="0 0 100 100"><use href="#ic-clock" width="100" height="100"/><path d="M84 30 A40 40 0 0 1 84 76" fill="none" stroke="#8f5bf0" stroke-width="7" stroke-linecap="round"/><path d="M76 72 l9 8 l5 -11" fill="none" stroke="#8f5bf0" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/></svg>`
  ];
  const BG_MENU = 'linear-gradient(180deg, rgba(255,214,160,.95), rgba(255,240,214,.96))';

  function showActs() {
    closeScreens();
    game.mode = 'menu'; game.busy = true;
    showGame(false);
    if (!Kit.Music.playing) Kit.Music.start(Kit.SONGS.gentle);
    Kit.ensureDefs();
    const ov = document.createElement('div');
    ov.className = 'kit-screen'; ov.id = 'actScreen';
    ov.style.background = BG_MENU;
    const tot = totalStars();
    let html = `<div class="kit-banner">選一個遊戲</div><div class="kit-total">${Kit.ICON.star(true)}<span>${tot} / ${MAXSTARS}</span></div><div class="act-grid">`;
    ACTS.forEach((a, i) => {
      html += `<button class="act" data-i="${i}" style="--c2:${a.c2};--c3:${a.c3};animation-delay:${(i * 0.06).toFixed(2)}s">` +
        (a.badge ? `<span class="badge">${a.badge}</span>` : '') +
        `<div class="ic">${ACT_ICON[i]}</div><div class="nm">${a.name}</div><div class="ds">${a.desc}</div>` +
        `<div class="st">${Kit.ICON.star(true)}${PROG[i].total} / 15</div></button>`;
    });
    html += `</div><div class="row-btns"><button class="kit-bigbtn small alt" id="freeBtn">${'<svg viewBox="0 0 100 100"><use href="#ic-clock"/></svg>'}<span>時鐘遊樂場</span></button></div>`;
    html += `<div class="kit-extra"><div class="kit-shelf-title">我的貼紙簿（集星星換貼紙）</div><div class="kit-shelf" id="shelf"></div></div>`;
    ov.innerHTML = html;
    const shelf = ov.querySelector('#shelf');
    STICKERS.forEach((s, k) => {
      const un = tot >= s.need;
      const b = document.createElement('button');
      b.className = 'stk' + (un ? '' : ' locked');
      b.innerHTML = stickerSVG(s, k) + (un ? `<span>${s.name}</span>` : `<span class="need">${Kit.ICON.star(true)}${s.need}</span>`);
      b.addEventListener('click', () => {
        if (!un) { KG.sound('wrong'); Kit.shake(b, 5); KG.say('再集' + cnNum(Math.min(99, s.need - tot)) + '顆星星，就可以得到喔！'); return; }
        KG.sound('sparkle'); KG.say(s.name);
        const r = b.getBoundingClientRect();
        Kit.FX.burst(r.left + r.width / 2, r.top + r.height / 2, { n: 12, types: ['star', 'spark'] });
        b.animate([{ transform: 'scale(1)' }, { transform: 'scale(1.2) rotate(-6deg)' }, { transform: 'scale(1)' }], { duration: 400, easing: 'cubic-bezier(.2,1.6,.4,1)' });
      });
      shelf.appendChild(b);
    });
    ov.querySelectorAll('.act').forEach(b => b.addEventListener('click', () => {
      const i = +b.dataset.i;
      KG.sound('pop'); KG.say(ACTS[i].name);
      showLevels(i);
    }));
    ov.querySelector('#freeBtn').addEventListener('click', () => { KG.sound('pop'); startFree(); });
    document.body.appendChild(ov);
    screenEl = ov;
  }

  function showLevels(a) {
    closeScreens();
    game.mode = 'levels'; game.act = a; game.busy = true;
    showGame(false);
    if (!Kit.Music.playing) Kit.Music.start(Kit.SONGS.gentle);
    const ov = Kit.levelSelect({
      title: ACTS[a].name, count: 5, progress: PROG[a], names: ACTS[a].levels, bg: BG_MENU,
      onPick: i => startLevel(a, i),
      extra: box2 => {
        box2.innerHTML = `<div class="row-btns"><button class="kit-bigbtn small alt" id="backActs">${Kit.ICON.back()}<span>換遊戲</span></button></div>`;
        box2.querySelector('#backActs').addEventListener('click', () => { KG.sound('pop'); showActs(); });
      }
    });
    screenEl = ov;
  }

  /* ---------- 暫停 ---------- */
  function pause() {
    if (game.mode !== 'play' && game.mode !== 'free') return;
    if (document.querySelector('#pauseOv')) return;
    const prevBusy = game.busy;
    game.busy = true;
    KG.sound('click');
    if (window.speechSynthesis) try { speechSynthesis.cancel(); } catch (e) { /* 忽略 */ }
    const ov = document.createElement('div');
    ov.className = 'kit-ov'; ov.id = 'pauseOv';
    ov.innerHTML = `<div class="pz-card"><div class="ow">${owlSVG('pz')}</div><h2>休息一下</h2><div class="kit-rbtns"></div></div>`;
    const bx = ov.querySelector('.kit-rbtns');
    const add = (cls, icon, text, fn) => { const el = document.createElement('button'); el.className = 'kit-rbtn ' + cls; el.innerHTML = `<div class="b">${icon}</div><span>${text}</span>`; el.addEventListener('click', () => { KG.sound('pop'); ov.remove(); fn(); }); bx.appendChild(el); };
    add('b2', Kit.ICON.menu(), '選單', () => (game.mode === 'free' ? showActs() : showLevels(game.act)));
    add('g big', Kit.ICON.play(), '繼續', () => { game.busy = prevBusy; });
    document.body.appendChild(ov);
  }
  $('pauseBtn').addEventListener('click', pause);

  /* ---------- 鍵盤 ---------- */
  window.addEventListener('keydown', e => {
    if (e.key === 'Escape' || e.key === 'p') { const po = $('pauseOv'); if (po) { po.querySelector('.kit-rbtn.g').click(); } else pause(); return; }
    if (game.mode !== 'play' && game.mode !== 'free') return;
    if (document.querySelector('#pauseOv')) return;
    if (/^[1-4]$/.test(e.key) && game.q && game.q.kind !== 'drag') { answer(+e.key - 1); return; }
    if (e.key === ' ') { e.preventDefault(); if (game.mode === 'free') speakTime(); else sayQ(); return; }
    if (canDrag) {
      let nt = null;
      if (e.key === 'ArrowRight') nt = mod(C.target + game.snap, 720);
      else if (e.key === 'ArrowLeft') nt = mod(C.target - game.snap, 720);
      else if (e.key === 'ArrowUp') nt = mod(C.target + 60, 720);
      else if (e.key === 'ArrowDown') nt = mod(C.target - 60, 720);
      if (nt != null) { e.preventDefault(); setClock(nt, false); KG.note(1150, 0.03, 'square', 0.05); onHandsMoved(); return; }
      if (e.key === 'Enter' && game.mode === 'play') checkDrag();
    }
  });

  /* ---------- 版面 ---------- */
  let laying = false;
  function layout() {
    if (laying) return;
    laying = true;
    const ar = app.getBoundingClientRect();
    const land = ar.width > ar.height * 1.15;
    app.classList.toggle('land', land);
    if (game.mode === 'play' && opts.querySelector('.opt')) opts.className = optCls();
    app.style.gridTemplateRows = '';
    app.style.alignContent = '';
    if (!land) {
      // 先量 1fr 的空間，再把多出來的空白平均分到上下
      const r = box.getBoundingClientRect();
      const S = Math.floor(Math.min(r.width, r.height - 50));
      if (r.height - (S + 50) > 8) { app.style.gridTemplateRows = `auto ${S + 50}px auto`; app.style.alignContent = 'space-evenly'; }
      box.classList.add('stack');
    } else box.classList.remove('stack');
    layoutClock();
    laying = false;
  }
  window.addEventListener('resize', layout);
  if (window.visualViewport) visualViewport.addEventListener('resize', layout);
  window.addEventListener('orientationchange', () => setTimeout(layout, 120));
  if (window.ResizeObserver) { const ro = new ResizeObserver(() => { if (!laying) layout(); }); ro.observe(app); ro.observe(opts); ro.observe($('prompt')); }
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) { if (window.speechSynthesis) try { speechSynthesis.cancel(); } catch (e) { /* 忽略 */ } }
    else { lastT = performance.now(); C.dirty = true; }
  });

  /* ---------- 開始 ---------- */
  $('starIc').innerHTML = Kit.ICON.star(true);
  Kit.ensureDefs();
  layout();
  setClock(10 * 60 + 10, false);
  requestAnimationFrame(frame);
  // 字型載入後重畫表盤
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { drawFace(); C.dirty = true; });

  function showTitle() {
    game.mode = 'title';
    showGame(false);
    Kit.title({
      logo: '認識時鐘', colors: ['#ff9a3c', '#ff6fa5', '#2f8fe8', '#46b864'], stroke: '#8a3f0f',
      bg: 'radial-gradient(circle at 50% 40%, rgba(255,255,255,.6), rgba(255,255,255,0) 60%), linear-gradient(180deg, #ffd7a3 0%, #ffeccf 55%, #d9f2c4 100%)',
      hero: `<div style="position:relative;width:100%;height:100%">${titleClockSVG()}<div style="position:absolute;right:-8%;bottom:-6%;width:52%;height:52%">${owlSVG('t')}</div></div>`,
      sub: '跟貓頭鷹老師一起學看時鐘！',
      buttons: [{ text: '開始', onClick: () => { KG.say('認識時鐘！我們一起來學看時鐘吧！'); showActs(); } }]
    });
  }
  function titleClockSVG() {
    let nums = '';
    for (let n = 1; n <= 12; n++) { const a = n * 30 * Math.PI / 180; nums += `<text x="${(100 + Math.sin(a) * 58).toFixed(1)}" y="${(108 - Math.cos(a) * 58).toFixed(1)}" text-anchor="middle" font-size="22" font-weight="900" fill="${HCOL[n % HCOL.length]}" stroke="#fff" stroke-width="5" paint-order="stroke">${n}</text>`; }
    return `<svg viewBox="0 0 200 200" style="width:88%;height:88%;overflow:visible">
      <circle cx="40" cy="30" r="22" fill="#ff7b6b" stroke="#a8301c" stroke-width="5"/><circle cx="160" cy="30" r="22" fill="#ff7b6b" stroke="#a8301c" stroke-width="5"/>
      <path d="M50 178 l-14 16 M150 178 l14 16" stroke="#a8301c" stroke-width="9" stroke-linecap="round"/>
      <circle cx="100" cy="102" r="92" fill="#ffbf3c" stroke="#c4700c" stroke-width="6"/><circle cx="100" cy="102" r="78" fill="#fffaf0" stroke="#e09a3a" stroke-width="4"/>
      ${nums}
      <g class="tc-m"><path d="M100 102 V40" stroke="#2f8fe8" stroke-width="8" stroke-linecap="round"/></g>
      <g class="tc-h"><path d="M100 102 L134 120" stroke="#ff5f45" stroke-width="11" stroke-linecap="round"/></g>
      <circle cx="100" cy="102" r="8" fill="#ffd65c" stroke="#b9790c" stroke-width="3"/>
      <style>.tc-m{transform-origin:100px 102px;animation:tcs 6s linear infinite}.tc-h{transform-origin:100px 102px;animation:tcs 72s linear infinite}@keyframes tcs{to{transform:rotate(360deg)}}</style>
    </svg>`;
  }
  showTitle();

  /* ---------- 測試掛鉤 ---------- */
  window.__cl = {
    T, C, ACTS, SCENES, STICKERS, GEN,
    get state() { return { mode: game.mode, act: game.act, lv: game.lv, qi: game.qi, first: game.first, busy: game.busy, answered: game.answered, q: game.q, time: C.target, hint: C.hint, snap: game.snap, labels: showLabels, stars: totalStars() }; },
    start(a, lv) { if (typeof a === 'string') a = ACTS.findIndex(x => x.id === a); return startLevel(a, lv || 0); },
    free: startFree, menu: showActs, levels: showLevels, pause,
    setHands(h, m) { setClock(mod(h, 12) * 60 + m, false); onHandsMoved(); return C.target; },
    answer, check: checkDrag,
    correct() { const q = game.q; if (!q) return false; if (q.kind === 'drag') { setClock(q.total, false); return checkDrag(); } return answer(q.ans); },
    skipAnim() { if (C.anim) { C.disp = C.anim.fin != null ? C.anim.fin : C.anim.to; C.anim = null; C.dirty = true; } },
    // 指針尖端的畫面座標（給自動測試拖曳用）
    handTip(which, frac) {
      const r = cv.getBoundingClientRect(), k = r.width / C.S;
      const an = T.anglesOf(C.target)[which] * Math.PI / 180, len = C.Rf * (which === 'hour' ? 0.52 : 0.8) * (frac || 0.85);
      return { x: r.left + (C.cx + Math.sin(an) * len) * k, y: r.top + (C.cy - Math.cos(an) * len) * k };
    },
    // 時鐘上某個角度、某個半徑比例（相對表盤）的畫面座標
    clockPoint(deg, frac) {
      const r = cv.getBoundingClientRect(), k = r.width / C.S, a = deg * Math.PI / 180, len = C.Rf * frac;
      return { x: r.left + (C.cx + Math.sin(a) * len) * k, y: r.top + (C.cy - Math.cos(a) * len) * k };
    },
    pickHand: (x, y) => { const r = cv.getBoundingClientRect(); return pickHand((x - r.left) * C.S / r.width, (y - r.top) * C.S / r.height); },
    setStars(act, arr) { arr.forEach((s, i) => PROG[act].set(i, s)); }
  };
})();
</script>
</body>
</html>
