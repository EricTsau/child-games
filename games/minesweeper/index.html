<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>踩地雷</title>
<link rel="stylesheet" href="../../assets/common.css">
<style>
  :root { --ink: #eef3ff; --mut: #9fb0d0; --line: rgba(160, 190, 245, .28); --panel: rgba(16, 25, 46, .88); --acc: #ffb648; --acc2: #ff7a59;
    --pf: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", "Heiti TC", system-ui, sans-serif;
    --nf: "Avenir Next", "Segoe UI", "Helvetica Neue", Arial, sans-serif;
    --st: env(safe-area-inset-top, 0px); --sb: env(safe-area-inset-bottom, 0px); --sl: env(safe-area-inset-left, 0px); --sr: env(safe-area-inset-right, 0px); }
  html, body { height: 100%; overflow: hidden; color: var(--ink); font-family: var(--pf); touch-action: none; }
  body { background: radial-gradient(ellipse at 50% 28%, #25385f 0%, #142039 55%, #0a1122 100%); }
  body::before { content: ''; position: fixed; inset: 0; pointer-events: none; opacity: .55;
    background-image: linear-gradient(rgba(150, 180, 240, .045) 1px, transparent 1px), linear-gradient(90deg, rgba(150, 180, 240, .045) 1px, transparent 1px); background-size: 32px 32px; }
  #root { position: fixed; inset: 0; pointer-events: none; }
  .hide { display: none !important; }
  button { font-family: var(--pf); color: inherit; -webkit-user-select: none; user-select: none; }
  .kg-fab { background: rgba(18, 28, 52, .88); border: 1.5px solid var(--line); box-shadow: 0 4px 14px rgba(0, 0, 0, .45); font-size: 20px; }
  .kg-fab:hover { border-color: var(--acc); }
  .glass { background: var(--panel); border: 1px solid var(--line); box-shadow: 0 6px 22px rgba(0, 0, 0, .4); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); }

  #stage { position: fixed; z-index: 10; left: calc(8px + var(--sl)); right: calc(8px + var(--sr)); top: calc(64px + var(--st)); bottom: calc(74px + var(--sb)); }
  #cv { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; transition: filter .25s; }
  #cv.blur { filter: blur(14px) saturate(.6) brightness(.8); }
  #cv.dim { filter: blur(2.5px) saturate(.7) brightness(.5); }
  #gen { position: absolute; left: 50%; top: 42%; transform: translate(-50%, -50%); display: flex; align-items: center; gap: 10px; padding: 10px 18px; border-radius: 999px; background: rgba(12, 19, 36, .92); border: 1px solid var(--line); font-size: 14px; letter-spacing: 1px; white-space: nowrap; pointer-events: none; box-shadow: 0 8px 24px rgba(0, 0, 0, .5); }
  #gen i { width: 18px; height: 18px; border-radius: 50%; border: 3px solid rgba(255, 182, 72, .25); border-top-color: var(--acc); animation: spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  #hud { position: fixed; z-index: 50; top: calc(10px + var(--st)); left: 0; right: 0; margin: 0 auto; width: min(300px, calc(100vw - 132px)); height: 48px; display: flex; align-items: center; justify-content: space-between; padding: 0 6px; border-radius: 14px; }
  .ctr { display: flex; align-items: center; gap: 5px; background: #0a1020; border-radius: 9px; padding: 4px 8px 4px 6px; box-shadow: inset 0 2px 5px rgba(0, 0, 0, .7), 0 1px 0 rgba(255, 255, 255, .07); }
  .ctr svg { width: 16px; height: 16px; flex: none; }
  .ctr b { font-family: "Menlo", "Consolas", "DejaVu Sans Mono", "Courier New", monospace; font-size: 22px; line-height: 1.1; font-weight: 700; color: #ff6b5a; letter-spacing: 1px; font-variant-numeric: tabular-nums; text-shadow: 0 0 8px rgba(255, 90, 70, .45); min-width: 3ch; text-align: right; }
  #hTime b { color: #ffc35a; text-shadow: 0 0 8px rgba(255, 190, 80, .4); }
  #face { width: 44px; height: 44px; border-radius: 50%; padding: 0; border: 2px solid rgba(255, 255, 255, .16); background: radial-gradient(circle at 50% 35%, #33477a, #18243f); cursor: pointer; display: grid; place-items: center; touch-action: manipulation; box-shadow: 0 3px 8px rgba(0, 0, 0, .45); transition: transform .1s; flex: none; }
  #face canvas { width: 40px; height: 40px; pointer-events: none; }
  #face:active { transform: scale(.9); }

  #bar { position: fixed; z-index: 50; left: 0; right: 0; margin: 0 auto; bottom: calc(10px + var(--sb)); width: min(520px, calc(100vw - 16px)); height: 56px; display: flex; gap: 6px; }
  .tb { flex: 1; min-width: 0; border-radius: 12px; border: 1px solid var(--line); background: linear-gradient(180deg, rgba(46, 64, 108, .97), rgba(22, 33, 60, .97)); color: var(--ink); font-size: 12px; font-weight: 700; letter-spacing: 1px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; cursor: pointer; box-shadow: 0 4px 12px rgba(0, 0, 0, .35), inset 0 1px 0 rgba(255, 255, 255, .08); touch-action: manipulation; padding: 0; transition: transform .08s, opacity .2s, border-color .2s; }
  .tb svg { width: 22px; height: 22px; flex: none; }
  .tb small { font-size: 11.5px; line-height: 1; white-space: nowrap; }
  .tb:active { transform: translateY(1px); border-color: var(--acc); }
  .tb:disabled { opacity: .35; cursor: default; }
  .tb.mode { flex: 2.3; flex-direction: row; gap: 3px; padding: 3px; }
  .tb.mode span { flex: 1; align-self: stretch; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; border-radius: 9px; color: var(--mut); transition: background .2s, color .2s, box-shadow .2s; }
  .tb.mode span.on { background: linear-gradient(180deg, #ffd47e, #f0a23a); color: #3a2300; box-shadow: 0 2px 6px rgba(0, 0, 0, .35); }
  .tb.mode span.fl.on { background: linear-gradient(180deg, #ff8f80, #e04848); color: #fff; }
  .tb.flash { animation: tbF .4s ease; }
  @keyframes tbF { 40% { filter: brightness(1.35); transform: scale(1.04); } }

  body.land #hud { left: auto; right: calc(6px + var(--sr)); top: calc(122px); margin: 0; width: 60px; height: auto; flex-direction: column; padding: 6px 0; gap: 6px; }
  body.land .ctr { flex-direction: column; gap: 1px; padding: 4px 2px; width: 52px; }
  body.land .ctr b { font-size: 17px; min-width: 0; text-align: center; letter-spacing: 0; }
  body.land #bar { left: calc(8px + var(--sl)); right: auto; top: 70px; bottom: auto; margin: 0; width: 56px; height: auto; flex-direction: column; }
  body.land .tb { flex: none; height: var(--bh, 50px); gap: 2px; }
  body.land .tb small { font-size: 10px; letter-spacing: 0; }
  body.land .tb.mode { flex-direction: column; height: calc(var(--bh, 50px) * 2); }
  body.land #tPause { position: fixed; right: calc(10px + var(--sr)); top: 66px; width: 48px; height: 48px; border-radius: 50%; }
  body.land #tPause small { display: none; }
  body.land #stage { left: calc(72px + var(--sl)); right: calc(74px + var(--sr)); top: 6px; bottom: 6px; }

  /* 遮罩 */
  .ov { position: fixed; inset: 0; z-index: 9200; display: flex; align-items: center; justify-content: center; padding: 16px; background: rgba(5, 9, 20, .6); animation: kg-fade .25s ease; touch-action: pan-y; }
  .card { background: rgba(14, 22, 42, .96) !important; width: min(420px, 100%); max-height: calc(100% - 8px); overflow: auto; border-radius: 16px; padding: 20px 18px 16px; text-align: center; color: var(--ink); animation: cardIn .35s cubic-bezier(.2, .9, .3, 1); touch-action: pan-y; }
  @keyframes cardIn { from { transform: translateY(14px) scale(.97); opacity: 0; } }
  .card h2 { margin: 0 0 10px; font-size: 24px; letter-spacing: 6px; padding-left: 6px; color: var(--acc); font-weight: 900; }
  .card p { margin: 0 0 12px; font-size: 14px; line-height: 1.6; color: var(--mut); }
  .gbtn { font-family: var(--pf); font-size: 15.5px; font-weight: 800; letter-spacing: 2px; min-height: 46px; padding: 8px 14px; border-radius: 11px; cursor: pointer; border: 1px solid var(--line); background: rgba(255, 255, 255, .05); color: var(--ink); transition: transform .1s, background .2s, border-color .2s; touch-action: manipulation; }
  .gbtn:hover { border-color: var(--acc); }
  .gbtn:active { transform: translateY(1px); }
  .gbtn.pri { background: linear-gradient(180deg, #ffd27a, #f09a33); color: #3a2300; border-color: #ffe0a0; box-shadow: 0 6px 16px rgba(240, 150, 50, .3); }
  .gbtn small { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 11px; letter-spacing: 1px; font-weight: 500; opacity: .8; margin-top: 1px; }
  .acts { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
  .acts .gbtn { flex: 1; min-width: 110px; }

  #title { background: linear-gradient(180deg, rgba(5, 9, 20, .55) 0%, rgba(5, 9, 20, .25) 35%, rgba(5, 9, 20, .55) 60%, rgba(5, 9, 20, .92) 100%); flex-direction: column; justify-content: space-between; padding: 66px 16px calc(14px + var(--sb)); }
  .logo { text-align: center; pointer-events: none; }
  .logo .sub { font-size: 11px; letter-spacing: 7px; color: var(--acc); opacity: .9; font-family: var(--nf); font-weight: 700; }
  .logo .tl { display: flex; align-items: center; justify-content: center; gap: 10px; margin-top: 6px; }
  .logo h1 { margin: 0; font-size: clamp(46px, 14vw, 86px); font-weight: 900; letter-spacing: .14em; padding-left: .14em; color: #f4f7ff; text-shadow: 0 3px 0 rgba(0, 0, 0, .45), 0 0 28px rgba(120, 160, 255, .3); line-height: 1.1; white-space: nowrap; }
  .logo .lm { width: clamp(46px, 13vw, 78px); height: clamp(46px, 13vw, 78px); flex: none; filter: drop-shadow(0 4px 6px rgba(0, 0, 0, .5)); animation: bob 3s ease-in-out infinite; }
  @keyframes bob { 50% { transform: translateY(-5px) rotate(-6deg); } }
  .logo .motto { margin-top: 8px; font-size: 14px; letter-spacing: 6px; padding-left: 6px; color: #c6d3ee; }
  .tcard { width: min(430px, 100%); border-radius: 16px; padding: 14px 14px 12px; align-self: center; touch-action: pan-y; max-height: 100%; overflow: auto; }
  .seg { display: flex; border: 1px solid var(--line); border-radius: 11px; overflow: hidden; }
  .seg button { flex: 1; min-height: 44px; padding: 6px 2px; background: transparent; color: var(--mut); border: 0; border-left: 1px solid rgba(160, 190, 245, .18); font-size: 15.5px; font-weight: 800; letter-spacing: 2px; cursor: pointer; touch-action: manipulation; }
  .seg button:first-child { border-left: 0; }
  .seg button.on { background: rgba(255, 182, 72, .16); color: var(--ink); box-shadow: inset 0 -3px 0 var(--acc); }
  .ddesc { font-size: 12.5px; color: var(--mut); letter-spacing: 1px; margin: 8px 0 8px; min-height: 18px; }
  .ddesc b { color: var(--acc); font-weight: 800; }
  #cust { display: grid; grid-template-columns: auto 1fr 3.2em; gap: 4px 10px; align-items: center; margin: 0 4px 8px; font-size: 13px; }
  #cust label { color: var(--mut); letter-spacing: 1px; text-align: left; }
  #cust b { color: var(--ink); font-variant-numeric: tabular-nums; text-align: right; }
  #cust input { width: 100%; accent-color: var(--acc); height: 28px; touch-action: pan-x; }
  .chips { display: flex; gap: 6px; margin-bottom: 10px; }
  .chip { flex: 1; min-height: 40px; border-radius: 10px; border: 1px solid var(--line); background: rgba(255, 255, 255, .03); color: var(--mut); font-size: 13px; font-weight: 700; letter-spacing: 1px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px; touch-action: manipulation; padding: 0 4px; white-space: nowrap; }
  .chip i { width: 26px; height: 15px; border-radius: 8px; background: rgba(255, 255, 255, .15); position: relative; flex: none; transition: background .2s; }
  .chip i::after { content: ''; position: absolute; left: 2px; top: 2px; width: 11px; height: 11px; border-radius: 50%; background: #c8d2e8; transition: transform .2s, background .2s; }
  .chip.on { color: var(--ink); border-color: rgba(255, 182, 72, .55); }
  .chip.on i { background: var(--acc); }
  .chip.on i::after { transform: translateX(11px); background: #fff; }
  .tbtns { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .tbtns .wide { grid-column: 1 / -1; font-size: 18px; letter-spacing: 6px; }
  .tips { margin-top: 9px; font-size: 11.5px; color: #8492b0; line-height: 1.6; }
  body.short #title { flex-direction: row; align-items: center; gap: 18px; padding: 12px calc(66px + var(--sr)) 12px calc(66px + var(--sl)); background: linear-gradient(90deg, rgba(5, 9, 20, .3) 10%, rgba(5, 9, 20, .9) 100%); }
  body.short #title .logo { flex: 1; min-width: 0; }
  body.short .logo h1 { font-size: clamp(34px, min(7vw, 14vh), 80px); }
  body.short .logo .lm { width: clamp(34px, 10vh, 64px); height: clamp(34px, 10vh, 64px); }
  body.short #title .tcard { width: min(430px, 54vw); flex: none; padding: 10px 12px; max-height: calc(100vh - 16px); }
  body.short .tips { display: none; }
  body.short .seg button { min-height: 40px; }
  body.short .ddesc { margin: 5px 0; }
  body.short .chips { margin-bottom: 7px; }
  body.short .chip { min-height: 38px; }
  body.short .gbtn { min-height: 42px; padding: 5px 10px; }
  body.short .card { padding: 12px 16px; width: min(560px, 100%); }
  body.short .card h2 { font-size: 20px; margin-bottom: 6px; }

  .stat { display: grid; grid-template-columns: 1fr auto; gap: 6px 14px; margin: 6px auto 14px; font-size: 14px; max-width: 290px; text-align: left; }
  .stat span:nth-child(2n) { text-align: right; font-variant-numeric: tabular-nums; color: var(--acc); font-weight: 800; }
  body.short .stat { grid-template-columns: 1fr auto 1fr auto; max-width: none; margin: 4px 0 10px; gap: 4px 14px; }
  .stbl { width: 100%; border-collapse: collapse; font-size: 13px; margin: 4px 0 12px; font-variant-numeric: tabular-nums; }
  .stbl th { font-weight: 500; color: var(--mut); font-size: 11.5px; letter-spacing: 1px; padding: 4px 2px; border-bottom: 1px solid rgba(160, 190, 245, .25); }
  .stbl td { padding: 7px 2px; border-bottom: 1px solid rgba(160, 190, 245, .1); }
  .stbl td:first-child { color: var(--acc); font-weight: 800; letter-spacing: 2px; text-align: left; padding-left: 6px; }
  body.short .stbl td { padding: 4px 2px; }
  .res { font-size: 12px; letter-spacing: 6px; color: var(--mut); }
  .big { font-size: 44px; font-weight: 900; color: #ffd27a; letter-spacing: 4px; margin: 2px 0 6px; font-family: var(--nf); text-shadow: 0 0 24px rgba(255, 190, 90, .35); }
  .big.lose { color: #ff8a7a; font-family: var(--pf); letter-spacing: 8px; padding-left: 8px; text-shadow: none; }
  body.short .big { font-size: 32px; margin: 0 0 4px; }
  .badge { display: inline-block; font-size: 14px; font-weight: 900; letter-spacing: 4px; padding: 3px 12px 3px 16px; border-radius: 999px; margin: 0 0 8px; color: #3a2300; background: linear-gradient(180deg, #ffe08a, #f5a83a); animation: kg-pop .5s cubic-bezier(.2, 1.6, .4, 1); }
  .dline { font-size: 13px; color: var(--mut); letter-spacing: 1px; margin-bottom: 12px; line-height: 1.7; }
  .dline b { color: var(--acc); }
  #pauseOv .card { width: min(360px, 100%); }
  #pauseOv .chips { margin: 2px 0 14px; }
  .kg-toast { top: 30%; padding: 9px 20px; border-radius: 12px; background: rgba(14, 22, 42, .95); border: 1px solid var(--acc); color: #ffe2ad; font-size: 16px; font-weight: 800; letter-spacing: 2px; white-space: nowrap; box-shadow: 0 8px 26px rgba(0, 0, 0, .55); }
  @media (max-width: 380px) {
    .ctr { padding: 4px 5px; gap: 3px; }
    .ctr svg { width: 13px; height: 13px; }
    .ctr b { font-size: 18px; letter-spacing: 0; }
    #hud { padding: 0 4px; }
    .chips { gap: 4px; }
    .chip { font-size: 12px; letter-spacing: 0; gap: 4px; }
    .chip i { width: 22px; }
    .chip.on i::after { transform: translateX(9px); }
    .tb small { font-size: 11px; letter-spacing: 0; }
  }
  @media (max-width: 340px) { .ctr svg { display: none; } }
  @media (prefers-reduced-motion: reduce) { .logo .lm { animation: none; } }
</style>
</head>
<body>
<div id="root"></div>
<div id="stage"><canvas id="cv" aria-label="踩地雷盤面"></canvas><div id="gen" class="hide"><i></i>正在產生無猜盤面…</div></div>

<div id="hud" class="glass hide">
  <div class="ctr" id="hMines" title="剩餘地雷"><svg viewBox="0 0 24 24"><path d="M7 3v18" stroke="#c9d6f2" stroke-width="2.2" stroke-linecap="round"/><path d="M8 3.5c3-1.5 5 1.5 10 0v8c-5 1.5-7-1.5-10 0z" fill="#ff5d5d"/></svg><b id="vMines">010</b></div>
  <button id="face" aria-label="重新開始"><canvas id="faceCv" width="80" height="80"></canvas></button>
  <div class="ctr" id="hTime" title="時間"><svg viewBox="0 0 24 24" fill="none" stroke="#c9d6f2" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l3 2M10 2h4"/></svg><b id="vTime">000</b></div>
</div>

<div id="bar" class="hide">
  <button class="tb mode" id="tMode" aria-label="切換挖開或插旗">
    <span class="dg on"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.5 3.5l-8 8"/><path d="M18.5 2.5l3 3"/><path d="M12.5 11.5l-1.2-1.2-5.6 4.2c-1.6 1.6-1.4 4.4-1.4 5.6 1.2 0 4 .2 5.6-1.4l4.2-5.6z" fill="currentColor" fill-opacity=".25"/></svg><small>挖開</small></span>
    <span class="fl"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3v18"/><path d="M7 4c3-1.5 5 1.5 11 0v8c-6 1.5-8-1.5-11 0" fill="currentColor" fill-opacity=".3"/><path d="M3.5 21h6"/></svg><small>插旗</small></span>
  </button>
  <button class="tb" id="tHint" aria-label="提示"><svg viewBox="0 0 24 24" fill="none" stroke="#ffd27a" stroke-width="2" stroke-linecap="round"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.2 1 2V16h5v-.1c0-.8.4-1.5 1-2A6 6 0 0 0 12 3Z"/></svg><small>提示</small></button>
  <button class="tb" id="tZo" aria-label="縮小"><svg viewBox="0 0 24 24" fill="none" stroke="#c9d6f2" stroke-width="2.2" stroke-linecap="round"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5 21 21M7.5 10.5h6"/></svg><small>縮小</small></button>
  <button class="tb" id="tZi" aria-label="放大"><svg viewBox="0 0 24 24" fill="none" stroke="#c9d6f2" stroke-width="2.2" stroke-linecap="round"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5 21 21M7.5 10.5h6M10.5 7.5v6"/></svg><small>放大</small></button>
  <button class="tb" id="tPause" aria-label="暫停"><svg viewBox="0 0 24 24"><rect x="6" y="5" width="4" height="14" rx="1.2" fill="#eef3ff"/><rect x="14" y="5" width="4" height="14" rx="1.2" fill="#eef3ff"/></svg><small>暫停</small></button>
</div>

<div id="title" class="ov">
  <div class="logo">
    <div class="sub">MINESWEEPER</div>
    <div class="tl">
      <svg class="lm" viewBox="0 0 64 64"><defs><radialGradient id="lmg" cx=".38" cy=".36" r=".7"><stop offset="0" stop-color="#7484a6"/><stop offset=".55" stop-color="#2a3246"/><stop offset="1" stop-color="#11151f"/></radialGradient></defs><g stroke="#1b2130" stroke-width="5" stroke-linecap="round"><path d="M32 6v52M6 32h52M13.6 13.6l36.8 36.8M50.4 13.6 13.6 50.4"/></g><circle cx="32" cy="32" r="17" fill="url(#lmg)"/><circle cx="25.5" cy="25.5" r="4.5" fill="#fff" fill-opacity=".85"/><path d="M45 6c2-2 6-1 6 2" stroke="#ffb648" stroke-width="2.5" fill="none" stroke-linecap="round"/><circle cx="52" cy="9" r="3" fill="#ffd27a"/></svg>
      <h1>踩地雷</h1>
    </div>
    <div class="motto">看懂數字・推理每一步</div>
  </div>
  <div class="tcard glass">
    <div class="seg" id="segDiff"><button data-v="beginner">初級</button><button data-v="intermediate">中級</button><button data-v="expert">高級</button><button data-v="custom">自訂</button></div>
    <div class="ddesc" id="dDesc"></div>
    <div id="cust" class="hide">
      <label for="cW">寬</label><input type="range" id="cW" min="5" max="40"><b id="cWv"></b>
      <label for="cH">高</label><input type="range" id="cH" min="5" max="30"><b id="cHv"></b>
      <label for="cM">地雷</label><input type="range" id="cM" min="1" max="99"><b id="cMv"></b>
    </div>
    <div class="chips"><button class="chip" id="oNg"><i></i>無猜模式</button><button class="chip" id="oQ"><i></i>「?」標記</button><button class="chip" id="oMu"><i></i>音樂</button></div>
    <div class="tbtns">
      <button class="gbtn pri wide" id="tStart">開始遊戲</button>
      <button class="gbtn" id="tDaily">每日挑戰<small id="tDailyS"></small></button>
      <button class="gbtn" id="tStats">統計<small id="tStatsS"></small></button>
    </div>
    <div class="tips" id="tips"></div>
  </div>
</div>

<div id="pauseOv" class="ov hide">
  <div class="card glass">
    <h2>暫停</h2>
    <div class="stat" id="pStats"></div>

  if (k === 'm' || k === 'M') { toggleMode(); return; }

  const mv = { ArrowLeft: [-1, 0], ArrowRight: [1, 0], ArrowUp: [0, -1], ArrowDown: [0, 1] }[k];
  if (mv) {
    e.preventDefault();
    let [c, r] = idxToDisp(K.i);
    if (K.on) { c = clamp(c + mv[0], 0, V.dcn - 1); r = clamp(r + mv[1], 0, V.drn - 1); }
    K.on = true; K.i = dispToIdx(c, r); ensureVisible(K.i); dirty(); return;
  }
  if (!K.on) return;
  if (k === ' ' || k === 'Enter') { e.preventDefault(); tapAction(K.i); }
  else if (k === 'f' || k === 'F') userFlag(K.i);
  else if (k === 'd' || k === 'D' || k === 'c' || k === 'C') userChord(K.i);
});

/* =====================================================================
 * 主迴圈
 * ===================================================================== */
let last = now();
function frame(t) {
  requestAnimationFrame(frame);
  let dt = (t - last) / 1000; last = t;
  if (dt > 1) dt = 1; if (dt < 0) dt = 0;
  if (G.phase === 'play' && !G.paused && !document.hidden && !G.busy) G.ms += dt * 1000;
  if (G.phase !== 'title') updHud();
  if (Math.abs(V.tz - V.z) > 0.0005) { zoomAround(Math.abs(V.tz - V.z) < 0.002 ? V.tz : V.z + (V.tz - V.z) * (1 - Math.exp(-dt * 16)), V.fx, V.fy); }
  if (FX.shake > 0) { FX.shake = Math.max(0, FX.shake - dt * 32); dirtyF = true; }
  if (FX.flash > 0) { FX.flash = Math.max(0, FX.flash - dt * 2.6); dirtyF = true; }
  if (ptAlive) { updParticles(dt); dirtyF = true; }
  if (t < animUntil || (P.lp && !P.lpFired)) dirtyF = true;
  if (SP.S && SP.S !== Math.max(6, Math.round(cs() * V.dpr)) && t - V.gestureT > 160) dirtyF = true;
  if (dirtyF) { dirtyF = false; draw(t); }
}

/* =====================================================================
 * 介面：標題、暫停、結算、統計
 * ===================================================================== */
function toggleMode() {
  G.mode = G.mode === 'dig' ? 'flag' : 'dig';
  $('tMode').querySelector('.dg').classList.toggle('on', G.mode === 'dig');
  $('tMode').querySelector('.fl').classList.toggle('on', G.mode === 'flag');
  $('tMode').classList.remove('flash'); void $('tMode').offsetWidth; $('tMode').classList.add('flash');
  KG.note(G.mode === 'flag' ? 990 : 660, 0.06, 'triangle', 0.06);
}
function setPause(p) {
  if (G.phase !== 'play' && G.phase !== 'ready') return;
  if (p === G.paused) return;
  G.paused = p;
  cv.classList.toggle('blur', p);
  $('pauseOv').classList.toggle('hide', !p);
  if (p) {
    cancelLP(); setPress([]); setFace('pause');
    $('pStats').innerHTML = `<span>難度</span><span>${diffName()}</span><span>時間</span><span>${Math.floor(G.ms / 1000 + G.penalty)} 秒</span><span>剩餘地雷</span><span>${G.M - G.flags}</span><span>已開格數</span><span>${G.opened} / ${G.N - G.M}</span>`;
    syncChips();
  } else setFace('idle');
  sfx.ui();
}
function diffName() { if (G.daily) return '每日挑戰'; const d = DIFFS[G.diff]; return d && G.diff !== 'custom' ? d.n : `自訂 ${G.W}×${G.H}`; }
function restart() {
  const o = Object.assign({}, G.last || {});
  delete o.seed;
  if (G.daily) o.daily = true;
  newGame(o);
  sfx.ui();
}
function showOver(won, rec, time) {
  if (G.phase !== (won ? 'won' : 'lost')) return;
  $('oSub').textContent = (won ? '排雷成功・' : '踩到地雷・') + diffName() + (G.ng ? '・無猜' : '');
  const big = $('oBig');
  big.textContent = won ? time.toFixed(1) + ' 秒' : '再接再厲';
  big.classList.toggle('lose', !won);
  $('oBadge').innerHTML = won && rec.isNew ? '<span class="badge">新紀錄！</span>' : '';
  const s = rec.s, rate = s.p ? Math.round(s.w / s.p * 100) : 0;
  const best = G.diff === 'custom' ? null : KG.best('minesweeper:' + G.diff, null, true);
  let h = `<span>最佳時間</span><span>${G.diff === 'custom' ? '—' : fmt(best)}</span><span>勝率</span><span>${rate}%（${s.w}/${s.p}）</span><span>連勝</span><span>${s.s}（最高 ${s.bs}）</span>`;
  if (!won) h = `<span>進度</span><span>${Math.round(G.opened / (G.N - G.M) * 100)}%</span>` + h;
  if (G.hints) h += `<span>使用提示</span><span>${G.hints} 次${G.penalty ? `（+${G.penalty} 秒）` : ''}</span>`;
  $('oStats').innerHTML = h;
  $('overOv').classList.remove('hide');
}
function syncChips() {
  for (const [id, key] of [['oNg', 'ng'], ['oQ', 'qm'], ['oMu', 'music'], ['pQ', 'qm'], ['pMu', 'music']]) $(id).classList.toggle('on', !!cfg[key]);
}
function custClamp() {
  cfg.cw = clamp(cfg.cw | 0, 5, 40); cfg.ch = clamp(cfg.ch | 0, 5, 30);
  const mx = Math.min(999, cfg.cw * cfg.ch - 9);
  cfg.cm = clamp(cfg.cm | 0, 1, mx);
  $('cW').value = cfg.cw; $('cH').value = cfg.ch; $('cM').max = mx; $('cM').value = cfg.cm;
  $('cWv').textContent = cfg.cw; $('cHv').textContent = cfg.ch; $('cMv').textContent = cfg.cm;
}
function refreshTitle() {
  for (const b of $('segDiff').children) b.classList.toggle('on', b.dataset.v === cfg.diff);
  const d = DIFFS[cfg.diff];
  $('cust').classList.toggle('hide', cfg.diff !== 'custom');
  if (cfg.diff === 'custom') { custClamp(); $('dDesc').innerHTML = `${cfg.cw} × ${cfg.ch}・<b>${cfg.cm}</b> 顆地雷・密度 ${Math.round(cfg.cm / (cfg.cw * cfg.ch) * 100)}%`; }
  else {
    const b = KG.best('minesweeper:' + cfg.diff, null, true);
    $('dDesc').innerHTML = `${d.w} × ${d.h}・<b>${d.m}</b> 顆地雷・最佳 <b>${b == null ? '—' : b.toFixed(1) + ' 秒'}</b>`;
  }
  const dl = store.get('ms:daily', { d: '' });
  $('tDailyS').textContent = dl.d === today() ? `今日完成 ${dl.t.toFixed(1)} 秒` : '16×16・無猜';
  const S = store.get('ms:stats', {}); let p = 0, w = 0;
  for (const k in S) { p += S[k].p; w += S[k].w; }
  $('tStatsS').textContent = p ? `勝率 ${Math.round(w / p * 100)}%・${p} 局` : '尚未遊玩';
  $('tips').textContent = coarse
    ? '點一下挖開・長按插旗・點滿足的數字快速翻開周圍・雙指縮放與拖曳・「挖開／插旗」可單手切換'
    : '左鍵挖開・右鍵插旗・中鍵或左右鍵同按快速翻開・滾輪縮放、拖曳平移・鍵盤：方向鍵、空白鍵、F 插旗、H 提示、P 暫停';
  syncChips();
}
function toTitle() {
  clearTimeout(G.endT); G.id++;
  G.paused = false; cv.classList.remove('blur');
  for (const id of ['pauseOv', 'overOv', 'statOv']) $(id).classList.add('hide');
  $('hud').classList.add('hide'); $('bar').classList.add('hide'); $('gen').classList.add('hide');
  demo();
  refreshTitle();
  $('title').classList.remove('hide');
  cv.classList.add('dim');
}
function demo() {
  // 標題背景：一張漂亮的展開盤面
  setupBoard(12, 12, 22);
  G.ng = false; G.phase = 'title'; G.diff = 'beginner';
  const B = Eng.make(12, 12, 22), s = 6 * 12 + 5;
  Eng.place(B, s, Eng.rng(20241107));
  G.B = B;
  const st = new Uint8Array(G.N); Eng.flood(B, st, s);
  const t = now();
  for (let i = 0; i < G.N; i++) if (st[i]) { G.st[i] = 1; const x = i % 12 - 5, y = ((i / 12) | 0) - 6; G.revAt[i] = t + 300 + Math.hypot(x, y) * 60; }
  let f = 0;
  for (let i = 0; i < G.N && f < 6; i++) if (B.mines[i] && G.st[i] === 0) { const b = i * 8; for (let k = 0; k < B.nbn[i]; k++) if (st[B.nbo[b + k]]) { G.st[i] = 2; G.flagAt[i] = t + 900 + f * 120; f++; break; } }
  animUntil = t + 2000;
  layout(); fit(true); dirty();
}
function showStats() {
  const S = store.get('ms:stats', {});
  let h = '<tr><th></th><th>最佳</th><th>勝率</th><th>連勝</th><th>局數</th></tr>';
  for (const [k, n] of [['beginner', '初級'], ['intermediate', '中級'], ['expert', '高級'], ['custom', '自訂'], ['daily', '每日']]) {
    const s = S[k] || { p: 0, w: 0, s: 0, bs: 0 };
    const b = k === 'custom' ? null : KG.best('minesweeper:' + k, null, true);
    h += `<tr><td>${n}</td><td>${b == null ? '—' : b.toFixed(1)}</td><td>${s.p ? Math.round(s.w / s.p * 100) + '%' : '—'}</td><td>${s.s}／${s.bs}</td><td>${s.p}</td></tr>`;
  }
  $('statTbl').innerHTML = h;
  const d = store.get('ms:daily', { d: '', streak: 0 });
  const live = d.d === today() || d.d === today(-1);
  $('statDaily').innerHTML = `每日挑戰：連續完成 <b>${live ? d.streak : 0}</b> 天${d.d === today() ? `・今日 <b>${d.t.toFixed(1)}</b> 秒` : '・今日尚未完成'}`;
  $('statOv').classList.remove('hide');
}

const click = (id, fn) => $(id).addEventListener('click', (e) => { fn(e); try { e.currentTarget.blur(); } catch (er) { /* 忽略 */ } });
for (const b of $('segDiff').children) b.addEventListener('click', () => { cfg.diff = b.dataset.v; saveCfg(); refreshTitle(); sfx.ui(); });
for (const [id, key] of [['cW', 'cw'], ['cH', 'ch'], ['cM', 'cm']]) $(id).addEventListener('input', () => { cfg[key] = +$(id).value; custClamp(); saveCfg(); refreshTitle(); });
for (const [id, key] of [['oNg', 'ng'], ['oQ', 'qm'], ['oMu', 'music'], ['pQ', 'qm'], ['pMu', 'music']]) click(id, () => {
  cfg[key] = !cfg[key]; saveCfg(); syncChips(); sfx.ui();
  if (key === 'qm' && !cfg.qm) for (let i = 0; i < G.N; i++) if (G.st[i] === 3) G.st[i] = 0;
  dirty();
});
click('tStart', () => { sfx.ui(); newGame({ diff: cfg.diff }); });
click('tDaily', () => { sfx.ui(); newGame({ daily: true }); });
click('tStats', () => { sfx.ui(); showStats(); });
click('statClose', () => { sfx.ui(); $('statOv').classList.add('hide'); });
click('face', () => restart());
click('tMode', () => toggleMode());
click('tHint', () => hint());
click('tZi', () => { zoomTo(V.tz * 1.35, V.cw / 2, V.ch / 2); sfx.zoom(1); });
click('tZo', () => { zoomTo(V.tz / 1.35, V.cw / 2, V.ch / 2); sfx.zoom(-1); });
click('tPause', () => setPause(!G.paused));
click('pResume', () => setPause(false));
click('pRestart', () => { G.paused = false; restart(); });
click('pQuit', () => { sfx.ui(); toTitle(); });
click('oAgain', () => restart());
click('oLook', () => { sfx.ui(); $('overOv').classList.add('hide'); });
click('oMenu', () => { sfx.ui(); toTitle(); });

document.addEventListener('visibilitychange', () => { if (document.hidden && (G.phase === 'play') && !G.paused) setPause(true); });
let rT = 0;
const onResize = () => { clearTimeout(rT); rT = setTimeout(layout, 60); };
window.addEventListener('resize', onResize);
window.addEventListener('orientationchange', () => setTimeout(layout, 250));
if (window.visualViewport) visualViewport.addEventListener('resize', onResize);

/* =====================================================================
 * 測試介面
 * ===================================================================== */
window.__ms = {
  Eng,
  state() {
    return { phase: G.phase, W: G.W, H: G.H, M: G.M, diff: G.diff, ng: G.ng, daily: G.daily, seed: G.seed, hasBoard: !!G.B, opened: G.opened, flags: G.flags, left: G.M - G.flags,
      time: G.ms / 1000 + G.penalty, penalty: G.penalty, hints: G.hints, mode: G.mode, paused: G.paused, busy: G.busy, zoom: V.z, zmax: V.zmax, tr: V.tr, cs: cs(), ox: V.ox, oy: V.oy,
      over: !$('overOv').classList.contains('hide'), title: !$('title').classList.contains('hide') };
  },
  start(o) { newGame(Object.assign({ sync: true }, o || {})); return this.state(); },
  /** 第一次 reveal 若尚未產生盤面，會同步產生（無猜模式也一樣） */
  reveal(x, y) { const i = y * G.W + x; if (!G.B && active()) { makeBoard(i, () => { startTimer(); openCell(i); }, true); return this.state(); } userReveal(i); return this.state(); },
  flag(x, y) { userFlag(y * G.W + x); return this.state(); },
  chord(x, y) { userChord(y * G.W + x); return this.state(); },
  cell(x, y) { const i = y * G.W + x; return { st: G.st[i], mine: G.B ? G.B.mines[i] : null, n: G.B ? G.B.cnt[i] : null }; },
  mines() { return G.B ? Array.from(G.B.mines) : null; },
  counts() { return G.B ? Array.from(G.B.cnt) : null; },
  st() { return Array.from(G.st); },
  grid() { const out = []; for (let y = 0; y < G.H; y++) { let s = ''; for (let x = 0; x < G.W; x++) { const i = y * G.W + x, v = G.st[i]; s += v === 1 ? (G.B.mines[i] ? '*' : (G.B.cnt[i] || '.')) : v === 2 ? 'F' : v === 3 ? '?' : (G.B && G.B.mines[i] ? 'm' : '#'); } out.push(s); } return out; },
  /** 目前盤面從已開區域能否靠邏輯解完 */
  solveCheck() { if (!G.B) return null; const s = new Uint8Array(G.N); for (let i = 0; i < G.N; i++) s[i] = G.st[i] === 1 ? 1 : 0; return Eng.solve(G.B, s, false).done; },
  /** 產生 n 張無猜盤面並驗證，回傳耗時與是否可解 */
  genTest(W, H, M, n, budget) {
    const out = [];
    for (let k = 0; k < n; k++) {
      const B = Eng.make(W, H, M), rand = Eng.rng(1000 + k * 7919), s = Math.floor(H / 2) * W + Math.floor(W / 2) - k % 3;
      const t0 = now(), job = Eng.ngJob(B, s, rand), r = job.run(budget || NG_BUDGET), ms = now() - t0;
      const res = r || job.fallback();
      B.mines.set(res.mines); Eng.counts(B);
      let mc = 0, safeZone = true; for (let i = 0; i < B.N; i++) mc += B.mines[i];
      if (B.mines[s] || B.cnt[s] !== 0) safeZone = false;
      out.push({ ok: res.ok, ms: Math.round(ms), solvable: Eng.solvable(B, s), mines: mc, safeZone, tries: job.stats().tries, solves: job.stats().solves });
    }
    return out;
  },
  cellToClient(x, y) { const i = y * G.W + x, [px, py] = cellCenter(i), r = cv.getBoundingClientRect(); return { x: r.left + px * r.width / V.cw, y: r.top + py * r.height / V.ch }; },
  hint() { hint(); return this.state(); },
  pause(p) { setPause(p !== false); return this.state(); },
  setZoom(z) { zoomTo(z, V.cw / 2, V.ch / 2); V.z = V.tz; zoomAround(V.tz, V.cw / 2, V.ch / 2); return this.state(); },
  setMode(m) { if (m !== G.mode) toggleMode(); return G.mode; },
  autoWin() { if (!G.B) return; for (let i = 0; i < G.N; i++) if (!G.B.mines[i] && G.st[i] !== 1 && G.phase !== 'won') { if (G.st[i] === 2) userFlag(i); openCell(i, true); } return this.state(); },
  title() { toTitle(); }
};

/* 啟動 */
syncChips();
setFace('idle');
toTitle();
requestAnimationFrame((t) => { last = t; frame(t); });
})();
</script>
</body>
