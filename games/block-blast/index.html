<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2b2a7a">
<title>方塊消消樂</title>
<link rel="stylesheet" href="../../assets/common.css">
<style>
  html, body { height: 100%; overflow: hidden; background: #2b2a7a; overscroll-behavior: none; }
  #game { position: fixed; inset: 0; display: block; width: 100vw; height: 100vh; height: 100dvh; touch-action: none; }
  .bb-pause {
    position: fixed; top: 66px; right: 10px; z-index: 8500;
    width: 48px; height: 48px; border-radius: 50%; border: 3px solid #fff;
    background: linear-gradient(180deg, #fff 0%, #e6e9ff 100%);
    box-shadow: 0 5px 0 rgba(20,20,80,.3), 0 10px 20px rgba(10,10,60,.25);
    display: none; cursor: pointer; padding: 0; transition: transform .12s ease;
  }
  .bb-pause:active { transform: scale(.9); }
  .bb-pause i { display: block; width: 6px; height: 20px; border-radius: 3px; background: #4a3fb0; margin: 0 3px; }
  .bb-pause.show { display: flex; align-items: center; justify-content: center; }

  .bb-screen {
    position: fixed; inset: 0; z-index: 9000; display: none;
    align-items: center; justify-content: center; flex-direction: column;
    padding: 64px 16px 16px; text-align: center;
  }
  .bb-screen.show { display: flex; animation: bbFade .25s ease; }
  .bb-screen.dim { background: rgba(14,10,60,.55); backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px); }
  #titleScr { background: radial-gradient(ellipse at 50% 45%, rgba(40,30,120,.35), rgba(20,14,70,.15) 70%); }

  .bb-logo { display: flex; gap: clamp(4px, 1.4vw, 10px); justify-content: center; margin: 0 0 6px; }
  .bb-logo span {
    --c: #ff4d6d; display: grid; place-items: center;
    width: clamp(50px, 15vw, 92px); height: clamp(50px, 15vw, 92px);
    border-radius: 22%; font-weight: 900; font-size: clamp(30px, 9.4vw, 58px); color: #fff;
    background: linear-gradient(145deg, color-mix(in srgb, var(--c) 55%, #fff) 0%, var(--c) 48%, color-mix(in srgb, var(--c) 70%, #000) 100%);
    box-shadow: inset 0 0 0 4px rgba(255,255,255,.28), inset 0 -6px 0 rgba(0,0,0,.18), 0 6px 0 color-mix(in srgb, var(--c) 55%, #000), 0 12px 22px rgba(0,0,30,.35);
    -webkit-text-stroke: .09em color-mix(in srgb, var(--c) 45%, #000); paint-order: stroke fill;
    animation: bbBob 2.2s ease-in-out infinite; animation-delay: calc(var(--i) * -.18s);
  }
  .bb-sub { color: #fff; font-weight: 800; font-size: clamp(15px, 3.9vw, 19px); margin: 8px 0 16px; line-height: 1.45; text-shadow: 0 2px 0 rgba(0,0,40,.45); }
  .bb-actions { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
  .bb-actions .kg-btn { min-width: 140px; }
  .bb-big { font-size: 23px !important; padding: 13px 30px !important; }
  .bb-col { display: flex; flex-direction: column; align-items: center; gap: 12px; }
  .bb-bestline { margin-top: 14px; font-weight: 900; font-size: 16px; color: #4a3fb0; background: rgba(255,255,255,.88); border-radius: 999px; padding: 5px 16px; border: 3px solid #fff; }
  .bb-resume { font-weight: 800; font-size: 14px; color: #ffe58a; min-height: 1em; margin: -6px 0 2px; text-shadow: 0 2px 0 rgba(0,0,40,.4); }
  .bb-tip { margin-top: 10px; color: #dfe3ff; font-weight: 700; font-size: 13px; line-height: 1.45; opacity: .9; }
  .kg-btn:focus { outline: none; }
  .kg-btn:focus-visible { outline: 4px solid #ffd23f; outline-offset: 3px; }

  .bb-card {
    width: min(410px, 100%);
    background: linear-gradient(180deg, #ffffff 0%, #e9ecff 100%);
    border: 5px solid #fff; border-radius: 30px; padding: 20px 20px 22px; color: #2e2a6e;
    box-shadow: 0 8px 0 #8b86d8, 0 18px 40px rgba(10,6,50,.5);
    animation: kg-pop .38s cubic-bezier(.2,1.6,.4,1); position: relative;
  }
  .bb-card h2 { margin: 2px 0 6px; font-size: 30px; font-weight: 900; }
  .bb-score { font-size: 60px; font-weight: 900; line-height: 1.05; color: #ffcc2e; -webkit-text-stroke: 2px #6b3f00; paint-order: stroke fill; text-shadow: 0 4px 0 #6b3f00; margin: 4px 0; }
  .bb-best { font-size: 18px; font-weight: 800; margin-bottom: 10px; }
  .bb-new { display: none; position: absolute; top: -18px; left: 50%; transform: translateX(-50%) rotate(-4deg);
    background: linear-gradient(180deg, #ffe066, #ffb020); color: #6b3a00; font-weight: 900; font-size: 18px;
    padding: 6px 18px; border-radius: 999px; border: 3px solid #fff; box-shadow: 0 4px 0 #c47c00; white-space: nowrap;
    animation: bbWiggle 1s ease-in-out infinite; }
  .bb-new.show { display: block; }
  .bb-new.show + h2 { margin-top: 22px; }
  .bb-stars { display: none; justify-content: center; gap: 6px; margin: 2px 0 6px; }
  .bb-stars.show { display: flex; }
  .bb-stars b { font-size: 46px; line-height: 1; color: #d6d8ee; -webkit-text-stroke: 2px #9fa3c8; paint-order: stroke fill; }
  .bb-stars b.on { color: #ffcc2e; -webkit-text-stroke: 2px #b06d00; animation: kg-pop .45s cubic-bezier(.2,1.6,.4,1) both; }
  .bb-stars b:nth-child(2) { transform: translateY(-8px); }
  .bb-hint { margin-top: 12px; font-size: 13px; font-weight: 700; opacity: .55; }
  .bb-goalline { font-weight: 800; font-size: 16px; margin: 0 0 10px; color: #4a3fb0; }

  #levelScr h2 { color: #fff; font-size: 30px; margin: 0 0 4px; text-shadow: 0 3px 0 rgba(0,0,40,.5); }
  .bb-lvsub { color: #dfe3ff; font-weight: 800; margin-bottom: 12px; }
  .bb-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; width: min(440px, 100%); margin-bottom: 16px; }
  .bb-lv {
    position: relative; aspect-ratio: 1 / 1; border-radius: 18px; border: 3px solid #fff; cursor: pointer; padding: 0;
    background: linear-gradient(160deg, #8fd0ff 0%, #4b7cff 100%); color: #fff; font: inherit; font-weight: 900; font-size: 22px;
    box-shadow: 0 5px 0 #2a3fa8, 0 8px 14px rgba(0,0,40,.35); display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-shadow: 0 2px 0 rgba(0,0,60,.4); transition: transform .1s ease;
  }
  .bb-lv:active { transform: translateY(3px); }
  .bb-lv .st { font-size: 12px; letter-spacing: 1px; color: #ffe066; -webkit-text-stroke: 0; line-height: 1; margin-top: 2px; }
  .bb-lv .st i { font-style: normal; color: rgba(255,255,255,.35); }
  .bb-lv.done { background: linear-gradient(160deg, #a6f0b6 0%, #3cb96a 100%); box-shadow: 0 5px 0 #23804a, 0 8px 14px rgba(0,0,40,.35); }
  .bb-lv.lock { background: linear-gradient(160deg, #a7a9c9 0%, #6c6f99 100%); box-shadow: 0 5px 0 #4a4d78, 0 8px 14px rgba(0,0,40,.3); cursor: not-allowed; color: rgba(255,255,255,.55); }
  .bb-lv.lock::after { content: ''; position: absolute; width: 14px; height: 11px; border-radius: 3px; background: rgba(255,255,255,.75); bottom: 9px; }
  .bb-lv.lock::before { content: ''; position: absolute; width: 8px; height: 8px; border: 3px solid rgba(255,255,255,.75); border-bottom: none; border-radius: 7px 7px 0 0; bottom: 18px; }

  @media (orientation: landscape) and (max-height: 560px) {
    .bb-screen { padding: 8px 70px; }
    .bb-logo span { width: clamp(44px, 13vh, 70px); height: clamp(44px, 13vh, 70px); font-size: clamp(26px, 8vh, 44px); }
    .bb-sub { margin: 4px 0 10px; font-size: 15px; }
    .bb-tip { display: none; }
    .bb-bestline { margin-top: 8px; }
    .bb-card { padding: 12px 18px 14px; }
    .bb-card h2 { font-size: 24px; margin: 0; }
    .bb-new.show + h2 { margin-top: 16px; }
    .bb-score { font-size: 42px; }
    .bb-stars b { font-size: 34px; }
    .bb-hint { display: none; }
    #levelScr h2 { font-size: 22px; }
    .bb-lvsub { margin-bottom: 6px; }
    .bb-grid { grid-template-columns: repeat(8, 1fr); width: min(620px, 100%); gap: 8px; margin-bottom: 10px; }
    .bb-lv { font-size: 18px; border-radius: 14px; }
  }
  @media (max-height: 640px) and (orientation: portrait) { .bb-tip { display: none; } }
  @keyframes bbBob { 0%,100% { transform: translateY(0) rotate(-4deg); } 50% { transform: translateY(-8px) rotate(4deg); } }
  @keyframes bbFade { from { opacity: 0; } to { opacity: 1; } }
  @keyframes bbWiggle { 0%,100% { transform: translateX(-50%) rotate(-4deg) scale(1); } 50% { transform: translateX(-50%) rotate(3deg) scale(1.06); } }
</style>
</head>
<body>
<canvas id="game" aria-label="方塊消消樂遊戲畫面"></canvas>
<button class="bb-pause" id="pauseBtn" aria-label="暫停" title="暫停 (P)"><i></i><i></i></button>

<div class="bb-screen show" id="titleScr">
  <div class="bb-col">
    <div class="bb-logo" id="logo" aria-label="方塊消消樂"></div>
    <div class="bb-sub">把方塊拖進盤面，排滿一整行或一整列就會消除！</div>
    <div class="bb-resume" id="resumeInfo"></div>
    <div class="bb-actions">
      <button class="kg-btn green bb-big" id="btnContinue">繼續</button>
      <button class="kg-btn yellow bb-big" id="btnClassic">經典模式</button>
      <button class="kg-btn blue bb-big" id="btnAdv">冒險模式</button>
    </div>
    <div class="bb-bestline" id="titleBest">最高分 0</div>
    <div class="bb-tip">鍵盤：1 2 3 選方塊・方向鍵移動・Enter 放下・P 暫停</div>
  </div>
</div>

<div class="bb-screen dim" id="levelScr">
  <h2>冒險模式</h2>
  <div class="bb-lvsub" id="lvSub">收集寶石、消除線條，拿到三顆星！</div>
  <div class="bb-grid" id="lvGrid"></div>
  <div class="bb-actions"><button class="kg-btn blue" id="btnLvBack">回標題</button></div>
</div>

<div class="bb-screen dim" id="pauseScr">
  <div class="bb-card">
    <h2>暫停中</h2>
    <div class="bb-best" id="pauseInfo">分數 0</div>
    <div class="bb-actions">
      <button class="kg-btn green" id="btnResume">繼續</button>
      <button class="kg-btn yellow" id="btnRestart">重新開始</button>
      <button class="kg-btn blue" id="btnMenu1">回標題</button>
    </div>
    <div class="bb-hint">按 P 或 Esc 繼續</div>
  </div>
</div>

<div class="bb-screen dim" id="overScr">
  <div class="bb-card">
    <div class="bb-new" id="newRec">新紀錄！</div>
    <h2 id="overTitle">沒有空間了！</h2>
    <div class="bb-stars" id="overStars"><b>★</b><b>★</b><b>★</b></div>
    <div class="bb-score" id="overScore">0</div>
    <div class="bb-best" id="overBest">最高分 0</div>
    <div class="bb-goalline" id="overGoal"></div>
    <div class="bb-actions">
      <button class="kg-btn green" id="btnNext">下一關</button>
      <button class="kg-btn yellow" id="btnAgain">再玩一次</button>
      <button class="kg-btn blue" id="btnMenu2">回標題</button>
    </div>
    <div class="bb-hint">Enter 再玩一次</div>
  </div>
</div>

<script src="../../assets/common.js"></script>
<script>
'use strict';
(function () {
const SLUG = 'block-blast';
const SAVE_KEY = SLUG + ':save', ADV_KEY = SLUG + ':adv';
let userActed = false, silent = false;
window.addEventListener('pointerdown', () => { userActed = true; }, { capture: true });
window.addEventListener('keydown', () => { userActed = true; }, { capture: true });
const N = (f, d, t, v, dl, sl) => { if (userActed && !silent) KG.note(f, d, t, v, dl, sl); };
const SFX = n => { if (userActed && !silent) KG.sound(n); };
const $ = id => document.getElementById(id);
const cv = $('game'), ctx = cv.getContext('2d');
const FONT = '"Baloo 2","PingFang TC","Noto Sans TC","Microsoft JhengHei","Heiti TC",system-ui,sans-serif';
const TAU = Math.PI * 2;
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const rnd = (a, b) => a + Math.random() * (b - a);
const outBack = t => { const c = 1.7, c3 = c + 1; return 1 + c3 * Math.pow(t - 1, 3) + c * Math.pow(t - 1, 2); };
const outCubic = t => 1 - Math.pow(1 - t, 3);
function mkCanvas(w, h) { const c = document.createElement('canvas'); c.width = Math.max(1, Math.ceil(w)); c.height = Math.max(1, Math.ceil(h)); return c; }
function lg(c, x0, y0, x1, y1, st) { const g = c.createLinearGradient(x0, y0, x1, y1); for (let i = 0; i < st.length; i += 2) g.addColorStop(st[i], st[i + 1]); return g; }
function rg(c, x0, y0, r0, x1, y1, r1, st) { const g = c.createRadialGradient(x0, y0, r0, x1, y1, r1); for (let i = 0; i < st.length; i += 2) g.addColorStop(st[i], st[i + 1]); return g; }
function rrect(c, x, y, w, h, r) { r = Math.min(r, w / 2, h / 2); c.beginPath(); c.moveTo(x + r, y); c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r); c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath(); }
function hex2rgb(h) { const n = parseInt(h.slice(1), 16); return [n >> 16 & 255, n >> 8 & 255, n & 255]; }
function mix(h, t) { const c = hex2rgb(h), o = t > 0 ? 255 : 0, k = Math.abs(t); return 'rgb(' + c.map(v => Math.round(v + (o - v) * k)).join(',') + ')'; }

/* =========================================================
 * 顏色與方塊形狀
 * ========================================================= */
// 0-7 一般顏色、8 寶石石塊、9 灰色（放不下／結束）
const PAL = ['#ff4d6d', '#ff9a1f', '#ffd23f', '#3fcf6e', '#26c6e8', '#4f7bff', '#9b5cff', '#ff63c8', '#8d93c9', '#9a9cb0'];
const FX_COL = ['#ff7a90', '#ffb44d', '#ffe066', '#6ee69a', '#6fe0f5', '#86a5ff', '#c19bff', '#ff94dc', '#cfe8ff', '#cfd2e4'];
const NCOL = 8, STONE = 8, GREY = 9;

function parseShape(s) { const rows = s.split('/'), cells = []; rows.forEach((row, r) => { for (let c = 0; c < row.length; c++) if (row[c] === 'X') cells.push([r, c]); }); return cells; }
function norm(cells) {
  let mr = 99, mc = 99; for (const [r, c] of cells) { mr = Math.min(mr, r); mc = Math.min(mc, c); }
  const out = cells.map(([r, c]) => [r - mr, c - mc]).sort((a, b) => a[0] - b[0] || a[1] - b[1]);
  return out;
}
const rot = cells => norm(cells.map(([r, c]) => [c, -r]));
const flip = cells => norm(cells.map(([r, c]) => [r, -c]));
const keyOf = cells => cells.map(p => p.join(',')).join(';');
// 名稱、圖樣、權重、顏色、旋轉、鏡射
const BASE = [
  ['dot', 'X', 0.55, 7, 0, 0],
  ['I2', 'XX', 1.0, 2, 1, 0],
  ['I3', 'XXX', 1.1, 4, 1, 0],
  ['I4', 'XXXX', 0.9, 5, 1, 0],
  ['I5', 'XXXXX', 0.6, 0, 1, 0],
  ['O2', 'XX/XX', 1.1, 3, 0, 0],
  ['O3', 'XXX/XXX/XXX', 0.45, 6, 0, 0],
  ['R23', 'XXX/XXX', 0.6, 1, 1, 0],
  ['V3', 'X./XX', 1.0, 5, 1, 0],
  ['V5', 'X../X../XXX', 0.55, 0, 1, 0],
  ['L4', 'X./X./XX', 0.8, 1, 1, 1],
  ['T4', 'XXX/.X.', 0.75, 6, 1, 0],
  ['S4', '.XX/XX.', 0.6, 3, 1, 1],
  ['D2', 'X./.X', 0.25, 7, 1, 0]
];
const SHAPES = [];
for (const [name, pat, w, col, canRot, canFlip] of BASE) {
  const seen = new Set(), list = [];
  let cur = norm(parseShape(pat));
  const variants = [];
  for (let f = 0; f < (canFlip ? 2 : 1); f++) {
    let v = f ? flip(cur) : cur;
    for (let k = 0; k < (canRot ? 4 : 1); k++) { variants.push(v); v = rot(v); }
  }
  for (const v of variants) { const k = keyOf(v); if (!seen.has(k)) { seen.add(k); list.push(v); } }
  list.forEach((cells, i) => {
    let h = 0, w2 = 0; for (const [r, c] of cells) { h = Math.max(h, r + 1); w2 = Math.max(w2, c + 1); }
    SHAPES.push({ id: SHAPES.length, name: name + '_' + i, base: name, cells, h, w: w2, n: cells.length, col, wt: w / list.length });
  });
}
const SHAPE_BY_NAME = new Map(SHAPES.map(s => [s.name, s]));

/* ---------- 位元盤面（快速判斷放得下與預測） ---------- */
const RL = new Int32Array(8), RH = new Int32Array(8), CL = new Int32Array(8), CH = new Int32Array(8);
for (let r = 0; r < 8; r++) { if (r < 4) { RL[r] = (0xFF << (r * 8)) | 0; RH[r] = 0; } else { RL[r] = 0; RH[r] = (0xFF << ((r - 4) * 8)) | 0; } }
for (let c = 0; c < 8; c++) { CL[c] = (0x01010101 << c) | 0; CH[c] = (0x01010101 << c) | 0; }
for (const s of SHAPES) {
  const lo = [], hi = [], pr = [], pc = [];
  for (let r = 0; r + s.h <= 8; r++) for (let c = 0; c + s.w <= 8; c++) {
    let a = 0, b = 0;
    for (const [dr, dc] of s.cells) { const i = (r + dr) * 8 + c + dc; if (i < 32) a |= 1 << i; else b |= 1 << (i - 32); }
    lo.push(a | 0); hi.push(b | 0); pr.push(r); pc.push(c);
  }
  s.mlo = Int32Array.from(lo); s.mhi = Int32Array.from(hi); s.pr = Uint8Array.from(pr); s.pc = Uint8Array.from(pc); s.np = lo.length;
}
let OUT_LO = 0, OUT_HI = 0;
function clearBits(lo, hi) {
  let cl = 0, ch = 0;
  for (let k = 0; k < 8; k++) {
    if ((lo & RL[k]) === RL[k] && (hi & RH[k]) === RH[k]) { cl |= RL[k]; ch |= RH[k]; }
    if ((lo & CL[k]) === CL[k] && (hi & CH[k]) === CH[k]) { cl |= CL[k]; ch |= CH[k]; }
  }
  OUT_LO = lo & ~cl; OUT_HI = hi & ~ch;
}
function fitsAnywhere(s, lo, hi) {
  const a = s.mlo, b = s.mhi;
  for (let p = 0; p < s.np; p++) if ((a[p] & lo) === 0 && (b[p] & hi) === 0) return true;
  return false;
}
let budget = 0;
function solvable(ids, lo, hi) {
  if (ids.length === 0) return true;
  for (let j = 0; j < ids.length; j++) {
    if (j > 0 && ids[j] === ids[j - 1]) continue;
    const s = SHAPES[ids[j]], rest = ids.slice(0, j).concat(ids.slice(j + 1));
    for (let p = 0; p < s.np; p++) {
      if ((s.mlo[p] & lo) !== 0 || (s.mhi[p] & hi) !== 0) continue;
      if (--budget < 0) return false;
      clearBits(lo | s.mlo[p], hi | s.mhi[p]);
      if (rest.length === 0) return true;
      if (solvable(rest, OUT_LO, OUT_HI)) return true;
    }
  }
  return false;
}

/* =========================================================
 * 冒險關卡
 * ========================================================= */
// . 空格  # 方塊  G 寶石（藏在石塊裡，消除該行／列就能收集）
const LEVELS = [
  { goal: 'lines', n: 4, stars: [11, 15], map: [] },
  { goal: 'gems', stars: [5, 9], map: ['........', '........', '........', '........', '........', '........', '........', 'GG.GG.GG'] },
  { goal: 'lines', n: 8, stars: [18, 25], map: ['#......#', '........', '..#..#..', '........', '........', '..#..#..', '........', '#......#'] },
  { goal: 'gems', stars: [5, 9], map: ['........', '........', '..####..', '..#GG#..', '..#GG#..', '..####..', '........', '........'] },
  { goal: 'score', n: 800, stars: [13, 19], map: ['........', '........', '........', '...##...', '...##...', '........', '........', '........'] },
  { goal: 'gems', stars: [11, 17], map: ['G#....#G', '#......#', '........', '...GG...', '...GG...', '........', '#......#', 'G#....#G'] },
  { goal: 'lines', n: 10, stars: [22, 30], map: ['#.#.....', '........', '.....#.#', '........', '#.#.....', '........', '.....#.#', '........'] },
  { goal: 'gems', stars: [24, 32], map: ['G.......', '.G......', '..G.....', '...G....', '....G...', '.....G..', '......G.', '.......G'] },
  { goal: 'score', n: 1500, stars: [15, 22], map: ['...##...', '...##...', '........', '##....##', '##....##', '........', '...##...', '...##...'] },
  { goal: 'gems', stars: [15, 24], map: ['##G..G##', '#......#', 'G..##..G', '...GG...', '...GG...', 'G..##..G', '#......#', '##....##'] },
  { goal: 'lines', n: 18, stars: [36, 46], map: ['###..###', '##....##', '#......#', '........', '........', '#......#', '##....##', '###..###'] },

 * 按鈕、尺寸、主迴圈
 * ========================================================= */
$('pauseBtn').addEventListener('click', () => { SFX('click'); pause(); });
$('btnContinue').addEventListener('click', () => { SFX('click'); startGame('classic', 0, true); });
$('btnClassic').addEventListener('click', () => { SFX('click'); startGame('classic', 0, false); });
$('btnAdv').addEventListener('click', () => { SFX('click'); state = 'levels'; buildLevels(); showScreen('levelScr'); });
$('btnLvBack').addEventListener('click', () => { SFX('click'); toTitle(); });
$('btnResume').addEventListener('click', resume);
$('btnRestart').addEventListener('click', () => { SFX('click'); if (mode === 'classic') KG.store.set(SAVE_KEY, null); startGame(mode, level, false); });
$('btnMenu1').addEventListener('click', () => { SFX('click'); toTitle(); });
$('btnAgain').addEventListener('click', () => { startGame(mode, level, false); });
$('btnNext').addEventListener('click', () => { startGame('adv', Math.min(LEVELS.length - 1, level + 1)); });
$('btnMenu2').addEventListener('click', () => { if (mode === 'adv') { state = 'levels'; buildLevels(); showScreen('levelScr'); $('pauseBtn').classList.remove('show'); } else toTitle(); });
document.addEventListener('visibilitychange', () => { if (document.hidden) { if (state === 'play' && !ending && !winning) pause(); else save(); } });
window.addEventListener('pagehide', save);

function resize() {
  layout();
  const dpr = window.devicePixelRatio || 1;
  RS = Math.max(1, dpr * QMUL[quality]); if (dpr < 1) RS = dpr;
  cv.width = Math.round(W * RS); cv.height = Math.round(H * RS);
  tileCache.clear();
  partCap = quality === 2 ? MAXP : quality === 1 ? 220 : 130;
  buildIcons();
  buildBackground();
  if (drag) updDrag();
}
let resizeT = 0;
window.addEventListener('resize', () => { clearTimeout(resizeT); resizeT = setTimeout(resize, 80); });
const perf = { last: 0, n: 0, sum: 0, cool: 3 };
function governor() {
  const now = performance.now(), dt = perf.last ? Math.min(0.5, (now - perf.last) / 1000) : 0;
  perf.last = now;
  if (document.hidden || quality === 0 || state !== 'play') return;
  perf.cool -= dt; if (perf.cool > 0 || dt > 0.2) return;
  perf.sum += dt; perf.n++;
  if (perf.n >= 90) { if (perf.sum / perf.n > 1 / 45) { quality--; resize(); perf.cool = 3; } perf.n = 0; perf.sum = 0; }
}
let last = performance.now();
function frame(now) {
  const dt = Math.max(0, Math.min(0.05, (now - last) / 1000)); last = now;
  if (!document.hidden) {
    try { update(dt); draw(); } catch (e) { errors++; if (errors < 5) console.error(e); }
    governor();
  }
  requestAnimationFrame(frame);
}

(function () {
  const logo = $('logo'), cols = ['#ff4d6d', '#ff9a1f', '#3fcf6e', '#26c6e8', '#9b5cff'];
  [...'方塊消消樂'].forEach((ch, i) => { const s = document.createElement('span'); s.textContent = ch; s.style.setProperty('--c', cols[i]); s.style.setProperty('--i', i); logo.appendChild(s); });
})();

resize();
FALL.forEach(f => resetFall(f, true));
refreshTitle();
requestAnimationFrame(frame);

/* =========================================================
 * 測試掛勾
 * ========================================================= */
function gridStr() { let s = ''; for (let r = 0; r < 8; r++) { for (let c = 0; c < 8; c++) s += gems[r * 8 + c] ? 'G' : grid[r * 8 + c] ? '#' : '.'; s += r < 7 ? '/' : ''; } return s; }
function allMoves() {
  const out = [];
  for (let i = 0; i < 3; i++) { if (tray[i] == null) continue; const s = SHAPES[tray[i]]; for (let r = 0; r <= 8 - s.h; r++) for (let c = 0; c <= 8 - s.w; c++) if (canPlace(s, r, c)) out.push([i, r, c]); }
  return out;
}
function aiMove() {
  const mv = allMoves(); if (!mv.length) return null;
  let bestM = mv[0], bestV = -1e9;
  for (const [i, r, c] of mv) {
    const s = SHAPES[tray[i]], pl = predictLines(s, r, c);
    const tmp = grid.slice(), tg = gems.slice();
    for (const [dr, dc] of s.cells) tmp[(r + dr) * 8 + c + dc] = 1;
    let gemHit = 0;
    for (const k of pl.rows) for (let j = 0; j < 8; j++) { if (tg[k * 8 + j]) { gemHit++; tg[k * 8 + j] = 0; } tmp[k * 8 + j] = 0; }
    for (const k of pl.cols) for (let j = 0; j < 8; j++) { if (tg[j * 8 + k]) { gemHit++; tg[j * 8 + k] = 0; } tmp[j * 8 + k] = 0; }
    let holes = 0, filled = 0, nearGem = 0, trans = 0, lo = 0, hi = 0, mob = 0;
    for (let q = 0; q < 64; q++) {
      const rr = q >> 3, cc = q & 7;
      if (cc < 7 && !tmp[q] !== !tmp[q + 1]) trans++;
      if (rr < 7 && !tmp[q] !== !tmp[q + 8]) trans++;
      if (tmp[q]) { filled++; if (q < 32) lo |= 1 << q; else hi |= 1 << (q - 32); continue; }
      const nb = (rr === 0 || tmp[q - 8]) + (rr === 7 || tmp[q + 8]) + (cc === 0 || tmp[q - 1]) + (cc === 7 || tmp[q + 1]);
      if (nb >= 3) holes++;
    }
    for (const sh of SHAPES) if (fitsAnywhere(sh, lo, hi)) mob += sh.n >= 5 ? 2 : 1;
    // 靠近寶石的行列：填越滿越好
    for (let q = 0; q < 64; q++) if (tg[q]) { const rr = q >> 3, cc = q & 7; let a = 0, b = 0; for (let j = 0; j < 8; j++) { a += tmp[rr * 8 + j] ? 1 : 0; b += tmp[j * 8 + cc] ? 1 : 0; } nearGem += Math.max(a, b) * Math.max(a, b); }
    const v = (pl.rows.length + pl.cols.length) * 40 + gemHit * 120 - holes * 8 - trans * 1.6 - filled * 0.5 + mob * 2.5 + nearGem * 0.4 + Math.random() * 2;
    if (v > bestV) { bestV = v; bestM = [i, r, c]; }
  }
  return bestM;
}
function countNaN() { let n = 0; for (const v of [score, shownScore, streak, CS, BX, BY, TS, TX, TY]) if (!isFinite(v)) n++; for (let i = 0; i < pn; i++) if (!isFinite(P.x[i]) || !isFinite(P.y[i])) n++; return n; }
window.__bb = {
  state: () => ({ state, mode, level, score, shown: Math.round(shownScore), best, streak, miss, placed, lines: linesTotal, gems: gemsGot, gemsTotal, ending, winning, overShown, deals, allClears,
    tray: tray.map(t => t == null ? null : SHAPES[t].name), fits: trayFit.slice(), grid: gridStr(), fill: fillCount(), quality, land, CS: +CS.toFixed(2), TS: +TS.toFixed(2), BX: +BX.toFixed(1), BY: +BY.toFixed(1), parts: pn, nan: countNaN(), errors, W, H }),
  start: (m, lv, resume) => startGame(m || 'classic', lv | 0, !!resume),
  place: (i, r, c) => place(i, r, c),
  setPieces: names => { tray = names.slice(0, 3).map(n => n == null ? null : typeof n === 'number' ? n : (SHAPE_BY_NAME.get(n) || SHAPES[0]).id); while (tray.length < 3) tray.push(null); for (let i = 0; i < 3; i++) slotIn[i] = 1; refreshFits(); ending = false; if (!anyFit()) beginEnd(); return tray.slice(); },
  forceNext: names => { forced = names; },
  setGrid: rows => { resetBoard(); rows.forEach((row, r) => { for (let c = 0; c < 8; c++) { const ch = row[c]; if (ch === '#') grid[r * 8 + c] = 1 + ((r + c) % NCOL); else if (ch === 'G') { grid[r * 8 + c] = 1 + STONE; gems[r * 8 + c] = 1; } } }); refreshFits(); ending = false; endT = 0; if (state === 'play' && !anyFit()) beginEnd(); return gridStr(); },
  step: n => { silent = true; try { for (let i = 0; i < (n || 1); i++) update(1 / 60); } finally { silent = false; } draw(); return countNaN(); },
  fillTest: kind => {
    // noFit：棋盤格，只剩單格空位但手上都是大塊
    if (kind === 'noFit') { __bb.setGrid(['#.#.#.#.', '.#.#.#.#', '#.#.#.#.', '.#.#.#.#', '#.#.#.#.', '.#.#.#.#', '#.#.#.#.', '.#.#.#.#']); return __bb.setPieces(['I2_0', 'O2_0', 'I3_1']); }
    // cross：放一塊 3x3 同時消 3 行 + 3 列
    if (kind === 'cross') { const g = []; for (let r = 0; r < 8; r++) { let s = ''; for (let c = 0; c < 8; c++) s += (r >= 2 && r <= 4) || (c >= 2 && c <= 4) ? ((r >= 2 && r <= 4 && c >= 2 && c <= 4) ? '.' : '#') : '.'; g.push(s); } __bb.setGrid(g); return __bb.setPieces(['O3_0', 'dot_0', 'dot_0']); }
    if (kind === 'rowcol') { __bb.setGrid(['#######.', '.......#', '.......#', '.......#', '.......#', '.......#', '.......#', '.......#']); return __bb.setPieces(['dot_0', 'I2_0', 'I3_0']); }
    if (kind === 'allClear') { __bb.setGrid(['#######.', '........', '........', '........', '........', '........', '........', '........']); return __bb.setPieces(['dot_0', 'I2_0', 'I3_0']); }
    return null;
  },
  canFit: i => trayFit[i], moves: () => allMoves(), ai: () => aiMove(),
  aiStep: () => { const m = aiMove(); if (!m) return null; silent = true; try { return place(m[0], m[1], m[2]); } finally { silent = false; } },
  randomStep: () => { const mv = allMoves(); if (!mv.length) return null; const m = mv[Math.floor(Math.random() * mv.length)]; silent = true; try { return place(m[0], m[1], m[2]); } finally { silent = false; } },
  cellCenter: (r, c) => [BX + (c + 0.5) * CS, BY + (r + 0.5) * CS],
  slotCenter: i => slotCenter(i),
  // 拖曳到格子 (r,c) 時手指要在哪（觸控會往上提）
  dragPoint: (i, r, c, type) => {
    const s = SHAPES[tray[i]]; const cx = BX + (c + s.w / 2) * CS, cy = BY + (r + s.h / 2) * CS;
    if (type === 'mouse') return [cx, cy];
    for (let py = cy; py < H + 400; py += 0.5) if (Math.abs(py - liftOffset(tray[i], py, 'touch') - cy) < 0.6) return [cx, py];
    return [cx, cy];
  },
  shapes: () => SHAPES.map(s => s.name), levels: LEVELS.length,
  adv: () => JSON.parse(JSON.stringify(advData)), resetAdv: () => { advData = { stars: [] }; KG.store.set(ADV_KEY, advData); },
  pause, resume, title: () => toTitle(), save: () => save(),
  dealStats: n => { // 檢查出題公平性：回傳 n 次出題中「沒有任何一塊放得下」但其實有形狀放得下的次數
    let bad = 0, full = 0; const [lo, hi] = bits(); const fitAny = SHAPES.some(s => fitsAnywhere(s, lo, hi));
    const keep = tray.slice(), d0 = deals;
    silent = true; for (let k = 0; k < n; k++) { dealTrio(); if (fitAny && !anyFit()) bad++; budget = 30000; if (solvable(tray.slice().sort((a, b) => a - b), lo, hi)) full++; } silent = false;
    tray = keep; deals = d0; refreshFits(); return { bad, full, n, fitAny };
  }
};
})();
