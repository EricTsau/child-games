<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>3D 全壘打大賽</title>
<link rel="stylesheet" href="../../assets/common.css">
<style>
  html, body { height: 100%; overflow: hidden; background: #060b1c; }
  #gl { position: fixed; inset: 0; width: 100vw; height: 100vh; height: 100dvh; display: block; touch-action: none; cursor: crosshair; }
  #msg { position: fixed; inset: 0; display: grid; place-items: center; padding: 24px; text-align: center; color: #fff; font-size: 20px; font-weight: 800; z-index: 1; }
  .ol { text-shadow: 2px 2px 0 #0b1430, -2px 2px 0 #0b1430, 2px -2px 0 #0b1430, -2px -2px 0 #0b1430, 0 3px 0 #0b1430, 0 5px 10px rgba(0,0,0,.45); }

  /* ---------- 比賽中介面 ---------- */
  #hud { position: fixed; top: 10px; left: 64px; right: 64px; z-index: 40; display: none; flex-direction: column; align-items: center; gap: 6px; pointer-events: none; }
  #hud.on { display: flex; }
  #hudBox { background: rgba(8, 16, 44, .8); border: 3px solid #ffd34d; border-radius: 16px; padding: 2px 14px 4px; color: #fff; text-align: center; font-weight: 900; max-width: 100%; box-shadow: 0 4px 0 rgba(0,0,0,.3); }
  #hud1 { font-size: 17px; white-space: nowrap; line-height: 1.35; }
  #hud1 b { color: #ffd34d; font-size: 22px; font-variant-numeric: tabular-nums; }
  #hud2 { font-size: 13px; color: #cfe0ff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; line-height: 1.3; }
  #hud2 b { color: #ffb36b; }
  #pitchTag { position: fixed; left: 10px; top: 66px; background: rgba(255,255,255,.93); color: #14224a; border-radius: 999px; padding: 3px 12px; font-weight: 900; font-size: 14px; opacity: 0; transition: opacity .2s; display: flex; align-items: center; gap: 6px; white-space: nowrap; }
  #pitchTag.on { opacity: 1; }
  #pitchTag i { width: 12px; height: 12px; border-radius: 50%; display: inline-block; border: 2px solid #14224a; }

  #call { position: fixed; left: 0; right: 0; top: max(20%, 112px); z-index: 45; text-align: center; pointer-events: none; opacity: 0; color: #fff; padding: 0 12px; }
  #call b { display: block; font-size: clamp(36px, 10vw, 66px); font-style: italic; font-weight: 900; line-height: 1.05; color: #ffd84a; letter-spacing: 1px; }
  #call small { display: block; font-size: 16px; font-weight: 900; margin-top: 6px; }
  #call.on { animation: callIn .34s cubic-bezier(.2,1.6,.4,1) forwards; }
  #call.fade { opacity: 0; transition: opacity .35s; }
  #call.c-hit b { color: #7dffb0; } #call.c-out b { color: #ff9a9a; } #call.c-foul b { color: #d6defc; } #call.c-strike b { color: #ff9b5c; }
  #call.c-ball b { color: #9fd8ff; } #call.c-info b { color: #fff; font-size: clamp(28px, 7.5vw, 46px); } #call.c-hr b { background: linear-gradient(180deg, #fff6a8, #ffc21a 55%, #ff8a1a); -webkit-background-clip: text; background-clip: text; color: transparent; filter: drop-shadow(0 3px 0 #7a2a00) drop-shadow(0 0 10px rgba(255,180,40,.6)); text-shadow: none; }
  @keyframes callIn { 0% { opacity: 0; transform: scale(1.8); } 60% { opacity: 1; transform: scale(.94); } 100% { opacity: 1; transform: scale(1); } }

  #hint { position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom)); transform: translateX(-50%); z-index: 44; pointer-events: none; background: rgba(8,16,44,.72); color: #fff; border: 2px solid rgba(255,255,255,.75); border-radius: 999px; padding: 6px 14px; font-size: 14px; font-weight: 800; white-space: nowrap; opacity: 0; transition: opacity .3s; max-width: calc(100% - 24px); overflow: hidden; text-overflow: ellipsis; }
  #hint.on { opacity: 1; }
  body.practice #hint { bottom: calc(112px + env(safe-area-inset-bottom)); }
  @media (max-height: 520px) and (min-aspect-ratio: 1/1) { body.practice #hint { bottom: calc(62px + env(safe-area-inset-bottom)); } #hint { font-size: 13px; padding: 4px 12px; } }

  #pauseBtn { position: fixed; right: 12px; top: 62px; width: 44px; height: 44px; border-radius: 50%; border: 3px solid #fff; background: rgba(8,16,44,.65); z-index: 60; display: none; place-items: center; cursor: pointer; padding: 0; }
  #pauseBtn.on { display: grid; }
  #pauseBtn i { display: block; width: 14px; height: 16px; border-left: 5px solid #fff; border-right: 5px solid #fff; }

  #pbar { position: fixed; left: 8px; right: 8px; bottom: calc(10px + env(safe-area-inset-bottom)); z-index: 46; display: none; flex-wrap: wrap; justify-content: center; gap: 6px; pointer-events: none; }
  body.practice #pbar { display: flex; }
  .pchip { pointer-events: auto; font-family: var(--kg-font); font-weight: 900; font-size: 14px; border: 3px solid #fff; border-radius: 999px; padding: 6px 11px; background: rgba(8,16,44,.72); color: #fff; cursor: pointer; display: flex; align-items: center; gap: 5px; }
  .pchip i { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
  .pchip.sel { background: #ffd34d; color: #4a3000; border-color: #fff; box-shadow: 0 3px 0 #b8860b; }
  #replayBtn { background: linear-gradient(180deg, #ff9a5c, #ff5a2a); }
  #replayBtn:disabled { opacity: .4; cursor: default; }
  #replayBtn.on { animation: pulse 1s ease-in-out infinite; }
  @keyframes pulse { 50% { transform: scale(1.06); } }

  #slowTag { position: fixed; left: 50%; top: max(30%, 150px); transform: translateX(-50%); z-index: 44; color: #fff; font-weight: 900; font-size: 18px; background: rgba(255,90,42,.85); border-radius: 999px; padding: 4px 14px; display: none; pointer-events: none; letter-spacing: 2px; }
  #slowTag.on { display: block; }

  /* ---------- 選單 ---------- */
  #menu { position: fixed; inset: 0; z-index: 9000; display: none; overflow-y: auto; overflow-x: hidden; -webkit-overflow-scrolling: touch; background: linear-gradient(180deg, rgba(4,8,24,.2), rgba(4,8,24,.55)); }
  #menu.on { display: block; }
  #menu.dark { background: rgba(4,8,24,.6); }
  .scr { display: none; min-height: 100%; padding: 64px 14px 18px; flex-direction: column; align-items: center; justify-content: center; gap: 12px; }
  .scr.on { display: flex; }
  .panel { background: linear-gradient(180deg, rgba(255,255,255,.97), rgba(255,246,230,.97)); border: 4px solid #fff; border-radius: 26px; box-shadow: 0 14px 40px rgba(4,8,24,.55); padding: 14px 16px 16px; width: min(520px, 100%); color: #24304f; }
  .ptitle { font-size: 26px; font-weight: 900; text-align: center; margin: 0 0 8px; }
  .psub { text-align: center; font-size: 15px; margin: -4px 0 10px; color: #6a7590; font-weight: 700; }
  .prow { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-top: 12px; }
  .kg-btn.sm { font-size: 17px; padding: 10px 20px; }

  .logo { text-align: center; color: #fff; line-height: 1; display: flex; align-items: center; gap: 10px; justify-content: center; }
  .logo svg { width: clamp(64px, 18vw, 92px); height: auto; filter: drop-shadow(0 5px 0 rgba(0,0,0,.35)); flex: none; }
  .logo0 { font-size: clamp(14px, 4vw, 18px); font-weight: 900; letter-spacing: 3px; display: inline-block; background: #ff7a1a; padding: 4px 12px; border-radius: 999px; border: 3px solid #fff; margin-bottom: 8px; }
  .logo1 { font-size: clamp(36px, 10.5vw, 66px); font-weight: 900; font-style: italic; letter-spacing: 1px; color: #ffd84a; text-shadow: 3px 3px 0 #d23a1a, -3px 3px 0 #d23a1a, 3px -3px 0 #d23a1a, -3px -3px 0 #d23a1a, 0 7px 0 #7a1a08, 0 10px 18px rgba(0,0,0,.5); }
  .chips { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
  .chip { background: rgba(8,16,44,.72); color: #fff; border: 2px solid rgba(255,255,255,.7); border-radius: 999px; padding: 4px 12px; font-weight: 800; font-size: 14px; white-space: nowrap; }
  .chip b { color: #ffd34d; }
  .tbtns { display: flex; flex-direction: column; gap: 10px; width: min(360px, 100%); }
  .mbtn { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 9px 16px 11px; }
  .mbtn b { font-size: 23px; }
  .mbtn small { font-size: 13px; font-weight: 700; opacity: .95; }
  .orow { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; justify-content: center; }
  .tog { font-family: var(--kg-font); font-weight: 800; font-size: 15px; border: 3px solid #fff; border-radius: 999px; padding: 6px 13px; background: rgba(8,16,44,.7); color: #fff; cursor: pointer; }
  .tog i { font-style: normal; color: #7dff8a; margin-left: 4px; }
  .tog.off i { color: #ff8a8a; }
  .panel .tog { background: #24304f; }
  .seg { display: flex; background: rgba(8,16,44,.7); border: 3px solid #fff; border-radius: 999px; padding: 3px; gap: 3px; }
  .seg button { font-family: var(--kg-font); border: 0; border-radius: 999px; padding: 5px 12px; font-size: 15px; font-weight: 900; background: transparent; color: #fff; cursor: pointer; }
  .seg button.sel { background: linear-gradient(180deg, #ffe58a, #f5b82e); color: #6b4a00; box-shadow: 0 3px 0 #c48a12; }
  .lbl { color: #fff; font-weight: 900; font-size: 15px; }
  .dnote { color: #fff; font-size: 12px; font-weight: 700; text-align: center; opacity: .9; text-shadow: 0 1px 3px rgba(0,0,0,.7); }

  .stages { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .stg { font-family: var(--kg-font); border: 3px solid #e3e8f5; background: #fff; border-radius: 16px; padding: 5px 4px 6px; display: flex; flex-direction: column; align-items: center; cursor: pointer; color: #24304f; min-height: 64px; justify-content: center; }
  .stg b { font-size: 13px; line-height: 1.2; }
  .stg .n { font-size: 18px; font-weight: 900; color: #ff7a1a; line-height: 1.1; }
  .stg.lock { opacity: .45; cursor: default; }
  .stg.lock .n { color: #8a93ad; }
  .stg:not(.lock):active { transform: scale(.95); }
  .st3 { display: flex; gap: 1px; margin-top: 2px; }
  .st3 svg { width: 14px; height: 14px; }
  .bigstars { display: flex; gap: 8px; justify-content: center; margin: 2px 0 8px; }
  .bigstars svg { width: 46px; height: 46px; animation: kg-pop .5s cubic-bezier(.2,1.6,.4,1) both; }
  .bigstars svg:nth-child(2) { animation-delay: .15s; } .bigstars svg:nth-child(3) { animation-delay: .3s; }
  .res { width: 100%; border-collapse: collapse; font-weight: 800; font-size: 16px; }
  .res td { padding: 4px 6px; border-bottom: 2px solid #f0e6d6; }
  .res td:last-child { text-align: right; color: #d2541a; font-variant-numeric: tabular-nums; }
  .newrec { display: inline-block; background: #ff5a2a; color: #fff; border-radius: 999px; padding: 1px 8px; font-size: 12px; margin-left: 4px; vertical-align: middle; }
  .help p { margin: 6px 0; font-size: 15px; line-height: 1.5; font-weight: 700; }
  .help b { color: #d2541a; }
  .ptlist { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 4px 10px; font-size: 14px; font-weight: 800; margin: 6px 0; }
  .ptlist span { display: flex; align-items: center; gap: 6px; }
  .ptlist i { width: 12px; height: 12px; border-radius: 50%; border: 2px solid #24304f; display: inline-block; }
  .goalbox { background: #fff3dc; border: 2px dashed #ffb36b; border-radius: 14px; padding: 6px 10px; text-align: center; font-weight: 900; margin-bottom: 6px; }

  @media (max-height: 520px) and (min-aspect-ratio: 1/1) {
    .scr { padding-top: 12px; padding-bottom: 10px; gap: 8px; padding-left: 70px; padding-right: 70px; }
    .logo1 { font-size: 40px; }
    .logo0 { margin-bottom: 4px; font-size: 13px; }
    .logo svg { width: 58px; }
    .tbtns { flex-direction: row; width: min(640px, 100%); }
    .tbtns .mbtn { flex: 1; padding: 7px 8px 9px; }
    .mbtn b { font-size: 19px; }
    .stages { grid-template-columns: repeat(5, 1fr); gap: 6px; }
    .stg { min-height: 54px; padding: 3px; }
    .panel { padding: 10px 14px 12px; }
    .ptitle { font-size: 21px; margin-bottom: 4px; }
    .prow { margin-top: 8px; }
    #sStages .panel, #sResult .panel, #sHelp .panel { width: min(700px, 100%); }
  }
</style>

{ "imports": { "three": "../../assets/vendor/three/three.module.min.js", "three/addons/": "../../assets/vendor/three/addons/" } }

<body>
<div id="msg">全壘打大賽 載入中…</div>
<canvas id="gl" aria-label="3D 全壘打大賽遊戲畫面"></canvas>
<div id="hud"><div id="hudBox"><div id="hud1"></div><div id="hud2"></div></div><div id="pitchTag"><i></i><span></span></div></div>
<div id="call"><b></b><small class="ol"></small></div>
<div id="slowTag">慢動作重播</div>
<div id="hint"></div>
<button id="pauseBtn" aria-label="暫停"><i></i></button>
<div id="pbar"></div>

<div id="menu" class="on">
  <div class="scr on" id="sTitle">
    <div class="logo">
      <svg viewBox="0 0 100 100" aria-hidden="true">
        <path d="M14 40 L20 8 L44 26 Z" fill="#c9762e" stroke="#3a2210" stroke-width="3" stroke-linejoin="round"/>
        <path d="M86 40 L80 8 L56 26 Z" fill="#c9762e" stroke="#3a2210" stroke-width="3" stroke-linejoin="round"/>
        <path d="M21 33 L23 17 L35 26 Z" fill="#fff"/><path d="M79 33 L77 17 L65 26 Z" fill="#fff"/>
        <ellipse cx="50" cy="58" rx="40" ry="35" fill="#d98a3a" stroke="#3a2210" stroke-width="3"/>
        <path d="M41 27 Q42 37 40 44 M50 25 L50 42 M59 27 Q58 37 60 44" stroke="#3a2210" stroke-width="3.5" fill="none" stroke-linecap="round"/>
        <path d="M30 46 Q36 42 41 46 M59 46 Q64 42 70 46" stroke="#fff" stroke-width="3" fill="none" stroke-linecap="round"/>
        <ellipse cx="50" cy="73" rx="20" ry="14" fill="#fff4e4"/>
        <circle cx="36" cy="55" r="6" fill="#2a1a0c"/><circle cx="64" cy="55" r="6" fill="#2a1a0c"/>
        <circle cx="38" cy="53" r="2" fill="#fff"/><circle cx="66" cy="53" r="2" fill="#fff"/>
        <path d="M45 65 L55 65 L50 70 Z" fill="#ff8aa0" stroke="#3a2210" stroke-width="1.5"/>
        <path d="M50 70 Q46 77 41 74 M50 70 Q54 77 59 74" stroke="#3a2210" stroke-width="2.2" fill="none" stroke-linecap="round"/>
        <circle cx="22" cy="66" r="3" fill="#7a4a1c"/><circle cx="78" cy="66" r="3" fill="#7a4a1c"/><circle cx="27" cy="77" r="2.4" fill="#7a4a1c"/><circle cx="73" cy="77" r="2.4" fill="#7a4a1c"/>
      </svg>
      <div><div class="logo0">石虎旋風 主場之夜</div><div class="logo1">3D 全壘打大賽</div></div>
    </div>
    <div class="chips" id="tStats"></div>
    <div class="tbtns">
      <button class="kg-btn yellow mbtn" data-act="derby"><b>全壘打大賽</b><small>10 個出局前，看你打幾支！</small></button>
      <button class="kg-btn mbtn" data-act="stages"><b>挑戰關卡</b><small>15 關任務，收集星星</small></button>
      <button class="kg-btn blue mbtn" data-act="practice"><b>打擊練習</b><small>選球種、慢動作重播</small></button>
    </div>
    <div class="orow"><span class="lbl ol">難度</span><div class="seg" id="diffSeg"></div></div>
    <div class="dnote" id="diffNote"></div>
    <div class="orow">
      <button class="tog" data-act="music" id="tMusic">音樂<i>開</i></button>
      <button class="tog" data-act="sfx" id="tSfx">音效<i>開</i></button>
      <button class="tog" data-act="help">怎麼玩</button>
    </div>
  </div>

  <div class="scr" id="sStages">
    <div class="panel">
      <div class="ptitle">挑戰關卡</div>
      <div class="psub" id="stSub"></div>
      <div class="stages" id="stGrid"></div>
      <div class="prow"><button class="kg-btn blue sm" data-act="title">返回</button></div>
    </div>
  </div>

  <div class="scr" id="sHelp">
    <div class="panel help">
      <div class="ptitle">怎麼玩</div>
      <p>投手投出球以後，在球飛到本壘板時<b>點一下畫面</b>（或按<b>空白鍵</b>）揮棒。</p>
      <p><b>時機</b>：早一點揮球會往左外野飛，晚一點往右外野，剛剛好往中間。</p>
      <p><b>準心</b>：普通、困難難度要把黃色準心移到球的位置（手機用手指拖曳、電腦移動滑鼠或方向鍵）。準心在球下面一點點，球會飛得又高又遠！簡單難度會自動瞄準。</p>
      <p>球投出來後會有一個<b>縮小的圓圈</b>，圈圈縮到最小的時候就是揮棒的好時機。</p>
      <div class="ptlist" id="ptList"></div>
      <div class="prow"><button class="kg-btn blue sm" data-act="title">知道了</button></div>
    </div>
  </div>

  <div class="scr" id="sPause">
    <div class="panel">
      <div class="ptitle">暫停</div>
      <div class="psub" id="pauseSub"></div>
      <div class="prow">
        <button class="tog" data-act="music" id="pMusic">音樂<i>開</i></button>
        <button class="tog" data-act="sfx" id="pSfx">音效<i>開</i></button>
      </div>
      <div class="prow">
        <button class="kg-btn green sm" data-act="resume">繼續</button>
        <button class="kg-btn yellow sm" data-act="restart">重新開始</button>
        <button class="kg-btn blue sm" data-act="quit">回選單</button>
      </div>
    </div>
  </div>

  <div class="scr" id="sResult">
    <div class="panel">
      <div class="ptitle" id="rTitle"></div>
      <div class="bigstars" id="rStars"></div>
      <div id="rBody"></div>
      <div class="prow" id="rBtns"></div>
    </div>
  </div>
</div>

<script type="module">
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

const KG = window.KG;
const $ = id => document.getElementById(id);
let renderer = null;
try {
  renderer = new THREE.WebGLRenderer({ canvas: $('gl'), antialias: true, powerPreference: 'high-performance' });
} catch (e) { renderer = null; }
if (!renderer) $('msg').textContent = '這個遊戲需要支援 3D（WebGL）的瀏覽器，請換一個瀏覽器或裝置再試試看。';
else main();

function main() {
  /* =====================================================================
   * 小工具與存檔
   * ===================================================================== */
  const SLUG = 'baseball-hr';
  const V3 = THREE.Vector3;
  const D2R = Math.PI / 180;
  const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
  const lerp = (a, b, t) => a + (b - a) * t;
  const smooth = t => t * t * (3 - 2 * t);
  const rand = (a, b) => a + Math.random() * (b - a);
  const phiOf = (x, z) => Math.atan2(x, -z) / D2R;
  const polar = (phi, r, y) => new V3(r * Math.sin(phi * D2R), y || 0, -r * Math.cos(phi * D2R));
  const Save = { get(k, d) { return KG.store.get(SLUG + ':' + k, d); }, set(k, v) { KG.store.set(SLUG + ':' + k, v); } };
  function rng(seed) { let s = (seed >>> 0) || 1; return () => { s ^= s << 13; s >>>= 0; s ^= s >>> 17; s ^= s << 5; s >>>= 0; return s / 4294967296; }; }
  const FONT = '"PingFang TC","Noto Sans TC","Microsoft JhengHei","WenQuanYi Zen Hei",sans-serif';
  const isTouch = matchMedia('(pointer: coarse)').matches || ('ontouchstart' in window && navigator.maxTouchPoints > 0);

  /* =====================================================================
   * 球場尺寸
   * ===================================================================== */
  const BR = 0.037;                  // 物理用球半徑
  const WALL_H = 3.0;                // 全壘打牆高度
  const ROWS = 16, TREAD = 2.0, RISE = 1.0;
  const CENTER_GAP = 11;             // 中外野沒有看台（背景牆＋計分板）
  const DRAG = 0.0052, GRAV = 9.8;
  const REL = new V3(-0.42, 1.86, -16.9);   // 投手出手點
  const LAG = 0.11;                  // 按下揮棒到球棒到達擊球點的時間
  const fenceDist = phi => 96 + 22 * Math.pow(Math.cos(clamp(phi, -45, 45) * 2 * D2R), 1.4);
  const FC = fenceDist(0);
  const SB_R = FC + 8, SB_Y0 = 4.5, SB_Y1 = 19.5, SB_HALF = 15;
  const SB_PHI = Math.atan(SB_HALF / SB_R) / D2R;
  function R0(phi) {
    const a = Math.abs(phi);
    if (a <= 45) return fenceDist(phi) + 0.6;
    return Math.min(fenceDist(45) + 0.6, 17 / Math.sin(Math.max(1, Math.min(90, a - 45)) * D2R));
  }
  const baseH = phi => Math.abs(phi) <= 45 ? WALL_H : 1.3;
  function standsTop(r, phi) {

  const tmp = new V3(), tmp2 = new V3();
  function makePitch(key) {

  /* =====================================================================
   * 擊球與飛行模擬

  function computeContact(P, sw) {
    const D = DF(), R = rng(P.seed);
    const cross = pitchPos(P, P.T, new V3());
    const dtn = sw.dt / D.win;
    let dx = cross.x - sw.rx, dy = cross.y - sw.ry;
    if (D.assist) { dx *= 1 - D.assist; dy *= 1 - D.assist; }
    const off = Math.hypot(dx, dy * 1.1);
    const res = { dtn, dx, dy, off, early: dtn < 0 };
    if (Math.abs(dtn) > 1.35) { res.miss = Math.abs(dtn) > 1.35 ? (dtn < 0 ? 'early' : 'late') : 'aim'; return res; }
    if (off > D.cr) { res.miss = 'aim'; return res; }
    const q = 1 - Math.pow(clamp(off / D.cr, 0, 1), 1.25);
    const tq = 1 - 0.17 * Math.min(1, dtn * dtn);
    const perfect = Math.abs(sw.dt) < D.perfect && off < 0.04;
    let launch = 26 + (dy - 0.012) * 520 + (R() - 0.5) * 6;
    let v = D.vmax * (0.52 + 0.48 * q) * tq + 0.15 * (P.spd - 26);
    if (perfect) v *= 1.04;
    let spray = 40 * clamp(dtn, -1, 1) + dx * 30 + (R() - 0.5) * 6;
    let tip = false;
    if (Math.abs(dtn) > 1) { spray = Math.sign(dtn) * (50 + R() * 28); v *= 0.75; launch = clamp(launch, 5, 45); }
    if (launch > 66) { tip = true; spray = 180 + (R() - 0.5) * 50; v = 16 + R() * 8; launch = 35 + R() * 25; }
    launch = clamp(launch, -28, 66);
    const L = launch * D2R, S = spray * D2R;
    res.v0 = new V3(v * Math.cos(L) * Math.sin(S), v * Math.sin(L), -v * Math.cos(L) * Math.cos(S));
    res.spin = tip ? 0 : launch > 8 ? 0.2 + 0.08 * q : -0.08;
    Object.assign(res, { launch, spray, exit: v, q: q * tq, perfect, tip });
    return res;
  }

  function simulate(p0, v0, spin, clean) {
    const p = p0.clone(), v = v0.clone();
    const S = [p.x, p.y, p.z], ev = [];
    const dt = 1 / 240;
    let t = 0, n = 0, air = true, bounced = false, hr = false, landed = null, end = 'max';
    let pr = Math.hypot(p.x, p.z);
    while (t < 9) {
      const sp = v.length();
      if (air) {
        let ax = -DRAG * sp * v.x, ay = -GRAV - DRAG * sp * v.y, az = -DRAG * sp * v.z;
        if (!bounced && spin) { const h = Math.hypot(v.x, v.z) || 1e-6, m = spin * DRAG * sp; ax += m * (-v.y * v.x / h); ay += m * h; az += m * (-v.y * v.z / h); }

      if (ap <= 45) {

        if (pr < F && r >= F && !hr) {
          if (p.y < WALL_H) {
            const ux = p.x / r, uz = p.z / r, vr = v.x * ux + v.z * uz;
            v.x -= 1.4 * vr * ux; v.z -= 1.4 * vr * uz; v.multiplyScalar(0.8);
            p.x = ux * (F - 0.06); p.z = uz * (F - 0.06);

          } else { hr = true; ev.push({ t, type: 'hr', p: p.clone() }); }
        }
      } else {
        const F = R0(phi);
        if (pr < F && r >= F) {

            const ux = p.x / r, uz = p.z / r, vr = v.x * ux + v.z * uz;
            v.x -= 1.5 * vr * ux; v.z -= 1.5 * vr * uz; v.multiplyScalar(0.7);

  function judge(sim, c) {
    const S = sim.S, n = S.length / 3, ev = sim.ev, D = DF();
    const out = { kind: null, dist: 0, catchI: -1, fielder: null, sign: null, board: false, hr: false, decideT: 0, endT: 0, phi: c.spray, dir: '', retrieveT: 0 };

    else if (land) {

  function doSwing(s, rx, ry) {

  }

  menu.addEventListener('click', e => {
    const b = e.target.closest('[data-act]'); if (!b) return;
    const a = b.dataset.act;
    switch (a) {
      case 'derby': sfx('select'); startGame('derby'); break;
      case 'practice': sfx('select'); startGame('practice'); break;
      case 'stages': sfx('ui'); showStages(); break;
      case 'stage': if (b.classList.contains('lock')) { sfx('error'); return; } sfx('select'); startGame('challenge', +b.dataset.i); break;
      case 'help': sfx('ui'); showHelp(); break;
      case 'title': sfx('back'); goTitle(); break;
      case 'diff': diffKey = b.dataset.d; Save.set('diff', diffKey); sfx('chip', { pitch: 1 + Object.keys(DIFFS).indexOf(diffKey) * 0.12 }); document.querySelectorAll('#diffSeg button').forEach(x => x.classList.toggle('sel', x.dataset.d === diffKey)); $('diffNote').textContent = DF().note; break;
      case 'music': if (M) { M.setEnabled(!M.isEnabled()); if (paused && M.isEnabled()) M.pause(); } sfx('ui'); refreshToggles(); break;
      case 'sfx': sfxOn = !sfxOn; Save.set('sfx', sfxOn); if (sfxOn) sfx('ui'); refreshToggles(); break;
      case 'resume': resumeGame(); break;
      case 'restart': sfx('select'); paused = false; if (M) M.resume(); startGame(G.mode, G.stage); break;
      case 'quit': sfx('back'); paused = false; goTitle(); break;
      case 'again': sfx('select'); startGame(G.mode, G.stage); break;
      case 'next': sfx('select'); startGame('challenge', Math.min(STAGES.length - 1, G.stage + 1)); break;
    }
  });
  $('pauseBtn').addEventListener('click', () => { pauseGame(); });

  /* =====================================================================
   * 輸入
   * ===================================================================== */
  const cv = $('gl');
  const ray = new THREE.Raycaster(), ndc = new THREE.Vector2(), plane = new THREE.Plane(new V3(0, 0, 1), 0), hitP = new V3();
  const ptrs = new Map();
  function inGame() { return G.mode !== 'title' && !paused && phase !== 'result' && phase !== 'over' && screen == null; }
  function aimFromPointer(e) {
    const r = cv.getBoundingClientRect();
    ndc.set(((e.clientX - r.left) / r.width) * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1);
    ray.setFromCamera(ndc, camera);
    if (ray.ray.intersectPlane(plane, hitP)) { aim.x = clamp(hitP.x, -AIM_X, AIM_X); aim.y = clamp(hitP.y, AIM_Y0, AIM_Y1); }
  }
  function metersPerPx() { const r = cv.getBoundingClientRect(); const d = Math.max(1, camera.position.z); return 2 * d * Math.tan(camera.fov / 2 * D2R) / r.height; }
  cv.addEventListener('pointerdown', e => {
    if (!inGame()) return;
    if (e.pointerType === 'mouse' && e.button !== 0) return;
    e.preventDefault();
    if (phase === 'flight') { skipFlight(); return; }
    if (replaying) return;
    if (e.pointerType === 'mouse') { if (!DF().auto) aimFromPointer(e); trySwing('mouse'); return; }
    // 觸控：球在飛的時候按下就揮棒；其他時候是拖曳準心
    if (phase === 'pitch' && P && !P.swing) { trySwing('touch'); ptrs.set(e.pointerId, { swung: true }); return; }
    ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY, ax: aim.x, ay: aim.y, moved: false, swung: false });
    try { cv.setPointerCapture(e.pointerId); } catch (er) { /* 忽略 */ }
    if (DF().auto) trySwing('touch');
  });
  cv.addEventListener('pointermove', e => {
    if (!inGame()) return;
    if (e.pointerType === 'mouse') { if (!DF().auto && !replaying) aimFromPointer(e); return; }
    const p = ptrs.get(e.pointerId); if (!p || p.swung || DF().auto || replaying) return;
    const dx = e.clientX - p.x, dy = e.clientY - p.y;
    if (Math.hypot(dx, dy) > 6) p.moved = true;
    const m = metersPerPx() * 1.25;
    aim.x = clamp(p.ax + dx * m, -AIM_X, AIM_X); aim.y = clamp(p.ay - dy * m, AIM_Y0, AIM_Y1);
  });
  function ptrEnd(e) {
    const p = ptrs.get(e.pointerId); ptrs.delete(e.pointerId);
    if (!p || !inGame() || e.pointerType === 'mouse') return;
    // 按住瞄準、放開揮棒
    if (!p.swung && !DF().auto && phase === 'pitch' && P && !P.swing) trySwing('release');
  }
  cv.addEventListener('pointerup', ptrEnd);
  cv.addEventListener('pointercancel', e => ptrs.delete(e.pointerId));
  window.addEventListener('keydown', e => {
    if (e.code === 'Space' || e.code === 'Enter') {
      if (inGame()) { e.preventDefault(); if (phase === 'flight') skipFlight(); else trySwing('key'); }
      return;
    }
    if (e.code === 'Escape' || e.code === 'KeyP') { if (paused) resumeGame(); else if (inGame()) pauseGame(); return; }
    if (e.code === 'KeyR' && inGame() && G.mode === 'practice') { startReplay(); return; }
    if (e.code.startsWith('Arrow')) { keys[e.code] = true; if (inGame()) e.preventDefault(); }
  });
  window.addEventListener('keyup', e => { keys[e.code] = false; });
  document.addEventListener('visibilitychange', () => { if (document.hidden && inGame()) pauseGame(); });

  function updateCrowdSound(dt) {
    crowdT -= dt;
    if (!crowdLoop || crowdT > 0) return;
    crowdT = 0.2;
    const on = sfxOn && !document.hidden && !paused && !KG.isMuted();
    crowdLoop.set(0.12 + cheer * 0.45, on ? 0.022 + cheer * 0.05 : 0);
  }

  /* =====================================================================
   * 畫面大小與自動畫質
   * ===================================================================== */
  function resize() {
    const vv = window.visualViewport;
    W = Math.round(vv ? vv.width : innerWidth) || innerWidth; H = Math.round(vv ? vv.height : innerHeight) || innerHeight;
    const r = cv.getBoundingClientRect(); if (r.width > 10) { W = Math.round(r.width); H = Math.round(r.height); }
    renderer.setSize(W, H, false);
    composer.setSize(W, H);
    bloom.resolution.set(W / 4, H / 4);
    camera.aspect = W / H;
    layoutBatCam();
    if (camMode === 'bat') { camPos.copy(batCam.pos); camLook.copy(batCam.look); camera.fov = batCam.fov; }
    camera.updateProjectionMatrix();
  }
  window.addEventListener('resize', resize);
  window.addEventListener('orientationchange', () => setTimeout(resize, 200));
  if (window.visualViewport) window.visualViewport.addEventListener('resize', resize);

  const QKEY = 'quality:' + SLUG;
  const baseRatio = Math.min(window.devicePixelRatio || 1, small ? 1.75 : 2);
  const QLEVELS = [
    { ratio: baseRatio, bloom: true, crowd: 1 },
    { ratio: Math.min(baseRatio, 1.35), bloom: true, crowd: 1 },
    { ratio: 1, bloom: true, crowd: 1 },
    { ratio: 1, bloom: false, crowd: 0.75 },
    { ratio: 0.8, bloom: false, crowd: 0.5 }
  ];
  let qLevel = clamp(KG.store.get(QKEY, KG.lowEnd ? 2 : 0) | 0, 0, QLEVELS.length - 1);
  const perf = { last: 0, n: 0, sum: 0, cool: 3 };
  function applyQuality() {
    const q = QLEVELS[qLevel];
    renderer.setPixelRatio(q.ratio); renderer.setSize(W, H, false);
    composer.setPixelRatio(q.ratio); composer.setSize(W, H);
    crowdMesh.count = Math.floor(crowdN * q.crowd);
  }
  function renderFrame() {
    if (QLEVELS[qLevel].bloom) composer.render(); else renderer.render(scene, camera);
    const now = performance.now(), dt = perf.last ? Math.min(0.5, (now - perf.last) / 1000) : 0;
    perf.last = now;
    if (document.hidden || qLevel >= QLEVELS.length - 1 || noGovernor) return;
    perf.cool -= dt;
    if (perf.cool > 0) return;
    perf.sum += dt; perf.n++;
    if (perf.n >= 60) {
      if (perf.sum / perf.n > 1 / 45) { qLevel++; KG.store.set(QKEY, qLevel); applyQuality(); perf.cool = 1.5; }
      perf.n = 0; perf.sum = 0;
    }
  }
  let noGovernor = false, frozen = false;

  let last = performance.now(), first = true;
  function frame(now) {
    const dt = Math.max(0, Math.min(0.05, (now - last) / 1000));
    last = now; frameStamp = now;
    if (!frozen) update(dt); else updateCamera(0);
    renderFrame();
    if (first) { first = false; const m = $('msg'); if (m) m.remove(); }
    requestAnimationFrame(frame);
  }
  resize();
  applyQuality();
  drawBoard();
  goTitle();
  camPos.set(0, 30, 0);
  requestAnimationFrame(frame);

  /* =====================================================================
   * 測試掛鉤
   * ===================================================================== */
  window.__bb = {
    state: () => ({ phase, mode: G.mode, diff: diffKey, hr: G.hr, outs: G.outs, score: G.score, combo: G.combo, left: G.left, prog: G.prog, pitches: G.pitches, over: G.over,
      paused, replaying, call: callText, screen, q: qLevel, music: M ? M.isPlaying() : null, aim: [+aim.x.toFixed(3), +aim.y.toFixed(3)],
      pitch: P ? { key: P.key, t: +P.t.toFixed(3), T: +P.T.toFixed(3), swing: !!P.swing } : null, flight: F && phase === 'flight' ? { kind: F.out.kind, dist: F.out.dist, t: +F.t.toFixed(2) } : null, cam: camMode }),
    start: (mode, stage) => startGame(mode, stage),
    title: () => goTitle(),
    diff: d => { if (DIFFS[d]) { diffKey = d; Save.set('diff', d); } },
    bot: o => { bot = o || null; },
    tick: (sec, step) => { const s = step || 1 / 60; for (let i = 0; i < sec / s; i++) update(s); },
    quality: l => { qLevel = clamp(l, 0, 4); noGovernor = true; applyQuality(); },
    sim: (v, launch, spray) => { const L = launch * D2R, S = spray * D2R; const v0 = new V3(v * Math.cos(L) * Math.sin(S), v * Math.sin(L), -v * Math.cos(L) * Math.cos(S)); const p0 = new V3(0, 0.9, -0.3); const res = { launch, spray, exit: v, spin: launch > 8 ? 0.24 : -0.08, seed: 5 }; res.proj = simulate(p0, v0, res.spin, true).dist; const sim = simulate(p0, v0, res.spin, false); const o = judge(sim, res); return { kind: o.kind, dist: o.dist, proj: Math.round(res.proj), sign: o.sign, board: o.board, end: sim.end }; },
    contact: (dtn, dy, key) => { const P2 = makePitch(key || 'fast'); const D = DF(); const c = pitchPos(P2, P2.T, new V3()); const r = computeContact(P2, { dt: dtn * D.win, rx: c.x, ry: c.y - dy }); return r.v0 ? { launch: Math.round(r.launch), spray: Math.round(r.spray), exit: +r.exit.toFixed(1), perfect: r.perfect } : { miss: r.miss }; },
    replay: () => startReplay(),
    freeze: on => { frozen = !!on; },
    _scene: scene,
    forceResult: (hr, cleared) => { G.hr = hr || 0; G.longest = hr ? 118 + hr : 0; G.score = (hr || 0) * 130; G.maxCombo = Math.min(hr || 0, 3); if (G.mode === 'challenge') { G.cleared = !!cleared; G.prog = cleared ? 9 : 0; } G.over = true; showResult(); },
    pause: () => pauseGame(), resume: () => resumeGame(),
    fireworks: (n) => launchFireworks(0, n || 4, true),
    setAim: (x, y) => { aim.x = x; aim.y = y; },
    cam: () => ({ pos: camera.position.toArray().map(v => +v.toFixed(2)), fov: +camera.fov.toFixed(1) }),
    project: (x, y, z) => { const v = new V3(x, y, z).project(camera); const r = cv.getBoundingClientRect(); return [Math.round((v.x + 1) / 2 * r.width + r.left), Math.round((1 - v.y) / 2 * r.height + r.top)]; }
  };
}
</script>
</body>
