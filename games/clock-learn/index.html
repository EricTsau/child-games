<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>認識時鐘</title>
<link rel="stylesheet" href="../../assets/common.css">
<style>
  /* ===== 遊戲共用 UI 套件（標題、關卡、結算、特效） ===== */
  :root { --k-main: #ff7eb0; --k-dark: #7a2f57; --k-light: #fff0f6; --k-accent: #ffd34d; }
  .kit-hidden-defs { position: absolute; width: 0; height: 0; overflow: hidden; }
  .kit-title {
    position: fixed; inset: 0; z-index: 8900; display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: clamp(4px, 1.6vh, 16px); padding: 64px 16px max(18px, env(safe-area-inset-bottom)); overflow: hidden;
    transition: opacity .35s ease, transform .35s ease;
  }
  .kit-title.out, .kit-screen.out { opacity: 0; transform: scale(1.06); pointer-events: none; }
  .kit-tdeco { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
  .kit-logo { position: relative; animation: kit-drop .9s cubic-bezier(.2,1.6,.4,1) both; }
  .kit-logo-svg { display: block; width: min(92vw, 600px, 75vh); height: auto; overflow: visible; filter: drop-shadow(0 8px 10px rgba(0,0,0,.18)); }
  .kit-logo-svg text { font-family: var(--kg-font); }
  .kit-lc { animation: kit-lc 2.4s ease-in-out infinite; }
  @keyframes kit-lc { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-7px); } }
  @keyframes kit-drop { from { transform: translateY(-50px) scale(.6); opacity: 0; } to { transform: none; opacity: 1; } }
  .kit-hero { position: relative; width: min(72vw, 40vh, 330px); aspect-ratio: 1; display: grid; place-items: center; animation: kit-drop 1s .15s cubic-bezier(.2,1.6,.4,1) both; }
  .kit-hero > svg, .kit-hero > canvas { width: 100%; height: 100%; overflow: visible; display: block; }
  .kit-tbtns { display: flex; gap: 14px; flex-wrap: wrap; justify-content: center; animation: kit-drop 1s .3s cubic-bezier(.2,1.6,.4,1) both; }
  .kit-tsub { font-size: 17px; font-weight: 800; color: var(--k-dark); background: rgba(255,255,255,.8); border-radius: 999px; padding: 6px 16px; text-align: center; max-width: 92vw; animation: kit-drop 1s .4s both; }
  .kit-bigbtn {
    font-family: var(--kg-font); font-weight: 900; font-size: clamp(24px, 6.5vw, 32px); color: #fff; letter-spacing: 2px;
    border: 5px solid #fff; border-radius: 999px; padding: 10px 32px 10px 18px; min-height: 72px;
    display: inline-flex; align-items: center; gap: 8px; cursor: pointer; position: relative;
    background: linear-gradient(180deg, #8ff0a4 0%, #3fbf63 55%, #2fa552 100%);
    box-shadow: 0 8px 0 #22803f, 0 14px 24px rgba(20,90,40,.35), inset 0 4px 0 rgba(255,255,255,.55);
    text-shadow: 0 3px 0 rgba(0,0,0,.22); animation: kit-pulse 1.6s ease-in-out infinite;
  }
  .kit-bigbtn svg { width: 40px; height: 40px; flex: 0 0 auto; filter: drop-shadow(0 3px 0 rgba(0,0,0,.18)); }
  .kit-bigbtn:active { transform: translateY(6px) scale(.97); box-shadow: 0 2px 0 #22803f, 0 4px 8px rgba(20,90,40,.35); animation: none; }
  .kit-bigbtn.alt { background: linear-gradient(180deg, #a6dcff 0%, #3a9ee8 60%, #2f86cc 100%); box-shadow: 0 8px 0 #2268a3, 0 14px 24px rgba(30,80,140,.35), inset 0 4px 0 rgba(255,255,255,.55); animation-delay: .4s; }
  .kit-bigbtn.alt:active { box-shadow: 0 2px 0 #2268a3; }
  .kit-bigbtn.pink { background: linear-gradient(180deg, #ffb3d1 0%, #ff6fa5 60%, #e8558d 100%); box-shadow: 0 8px 0 #b83a6c, 0 14px 24px rgba(160,40,90,.35), inset 0 4px 0 rgba(255,255,255,.55); }
  .kit-bigbtn.pink:active { box-shadow: 0 2px 0 #b83a6c; }
  .kit-bigbtn.small { font-size: 22px; min-height: 60px; padding: 8px 24px 8px 14px; }
  .kit-bigbtn.small svg { width: 30px; height: 30px; }
  @keyframes kit-pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.05); } }

  /* 關卡選擇 */
  .kit-screen {
    position: fixed; inset: 0; z-index: 8900; overflow-y: auto; overflow-x: hidden; -webkit-overflow-scrolling: touch;
    padding: 70px 14px max(20px, env(safe-area-inset-bottom)); display: flex; flex-direction: column; align-items: center;
    transition: opacity .3s ease, transform .3s ease; touch-action: pan-y;
  }
  .kit-banner {
    position: relative; display: inline-block; color: #fff; font-size: clamp(24px, 6.5vw, 32px); font-weight: 900; letter-spacing: 2px;
    padding: 8px 34px; border-radius: 16px; border: 4px solid #fff; background: linear-gradient(180deg, var(--k-main), var(--k-dark));
    box-shadow: 0 6px 0 rgba(0,0,0,.18), 0 10px 18px rgba(0,0,0,.18); text-shadow: 0 3px 0 rgba(0,0,0,.25); animation: kit-drop .6s both cubic-bezier(.2,1.6,.4,1);
  }
  .kit-banner::before, .kit-banner::after { content: ''; position: absolute; top: 14px; width: 26px; height: 100%; background: var(--k-dark); z-index: -1; border-radius: 4px; }
  .kit-banner::before { left: -18px; clip-path: polygon(0 0, 100% 0, 100% 100%, 0 100%, 40% 50%); }
  .kit-banner::after { right: -18px; clip-path: polygon(0 0, 100% 0, 60% 50%, 100% 100%, 0 100%); }
  .kit-total { margin-top: 10px; display: inline-flex; align-items: center; gap: 6px; font-size: 20px; font-weight: 900; color: var(--k-dark);
    background: rgba(255,255,255,.9); border: 3px solid #fff; border-radius: 999px; padding: 3px 14px 3px 6px; box-shadow: 0 4px 0 rgba(0,0,0,.12); }
  .kit-total svg { width: 30px; height: 30px; }
  .kit-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 14px; width: min(640px, 100%); margin: 16px auto 8px; }
  .kit-lv {
    position: relative; aspect-ratio: 1 / 1.08; border-radius: 26px; border: 5px solid #fff; cursor: pointer; font-family: var(--kg-font);
    background: linear-gradient(180deg, #fff 0%, var(--k-light) 100%); color: var(--k-dark);
    box-shadow: 0 7px 0 rgba(0,0,0,.13), 0 12px 20px rgba(0,0,0,.12);
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; padding: 4px;
    animation: kit-drop .5s both cubic-bezier(.2,1.6,.4,1); transition: transform .12s;
  }
  .kit-lv:active { transform: scale(.93); }
  .kit-lv .num {
    width: 58%; aspect-ratio: 1; border-radius: 50%; display: grid; place-items: center; font-size: clamp(26px, 7vw, 36px); font-weight: 900; color: #fff;
    background: radial-gradient(circle at 35% 28%, rgba(255,255,255,.7) 0 12%, transparent 13%), linear-gradient(180deg, var(--k-main), var(--k-dark));
    box-shadow: inset 0 -5px 0 rgba(0,0,0,.15), 0 4px 0 rgba(0,0,0,.12); text-shadow: 0 3px 0 rgba(0,0,0,.25);
  }
  .kit-lv .lname { font-size: 13px; font-weight: 800; line-height: 1.1; text-align: center; max-width: 100%; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  .kit-lv .stars { display: flex; gap: 1px; }
  .kit-lv .stars svg { width: 22px; height: 22px; }
  .kit-lv.locked { background: linear-gradient(180deg, #f2eef6, #ddd6e6); cursor: default; }
  .kit-lv.locked .num { background: linear-gradient(180deg, #cfc6da, #a99dba); }
  .kit-lv .lock { position: absolute; width: 46%; top: 16%; left: 27%; }
  .kit-lv.locked .num span { opacity: 0; }
  .kit-lv.next::after { content: ''; position: absolute; inset: -9px; border-radius: 30px; border: 4px solid var(--k-accent); animation: kit-ring 1.2s ease-in-out infinite; pointer-events: none; }
  @keyframes kit-ring { 0%, 100% { transform: scale(1); opacity: 1; } 50% { transform: scale(1.06); opacity: .5; } }
  .kit-extra { width: min(640px, 100%); }
  .kit-shelf-title { font-size: 18px; font-weight: 900; color: var(--k-dark); margin: 10px 0 6px; text-align: center; }
  .kit-shelf { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }
  .kit-item { width: 84px; border-radius: 20px; border: 4px solid #fff; background: rgba(255,255,255,.85); box-shadow: 0 5px 0 rgba(0,0,0,.12);
    display: flex; flex-direction: column; align-items: center; padding: 4px 2px; font-size: 12px; font-weight: 800; color: var(--k-dark); cursor: pointer; font-family: var(--kg-font); position: relative; }
  .kit-item svg.pv { width: 62px; height: 62px; }
  .kit-item.sel { border-color: var(--k-accent); box-shadow: 0 0 0 3px var(--k-main), 0 5px 0 rgba(0,0,0,.12); }
  .kit-item.locked { filter: grayscale(1); opacity: .6; cursor: default; }
  .kit-item .need { display: flex; align-items: center; gap: 2px; }
  .kit-item .need svg { width: 14px; height: 14px; }

  /* 結算卡 */
  .kit-ov { position: fixed; inset: 0; z-index: 9200; display: grid; place-items: center; padding: 16px; background: rgba(60,40,80,.5); backdrop-filter: blur(3px); animation: kg-fade .25s ease; overflow-y: auto; }
  .kit-rcard {
    position: relative; width: min(420px, 100%); margin-top: 30px; text-align: center; color: var(--k-dark);
    background: linear-gradient(180deg, #fff 0%, var(--k-light) 100%); border: 6px solid #fff; border-radius: 34px; padding: 50px 18px 20px;
    box-shadow: 0 10px 0 rgba(0,0,0,.12), 0 24px 44px rgba(40,20,60,.35); animation: kit-cardin .6s cubic-bezier(.2,1.5,.4,1) both;
  }
  @keyframes kit-cardin { from { transform: translateY(60px) scale(.6); opacity: 0; } to { transform: none; opacity: 1; } }
  .kit-ribbon { position: absolute; left: 50%; top: -34px; transform: translateX(-50%); width: 112%; max-width: 440px; }
  .kit-ribbon svg { width: 100%; height: auto; display: block; overflow: visible; }
  .kit-ribbon svg text { font-family: var(--kg-font); }
  .kit-rstars { display: flex; justify-content: center; align-items: flex-end; gap: 4px; margin: 0 0 6px; }
  .kit-rstar { position: relative; width: 74px; height: 74px; }
  .kit-rstar.mid { width: 96px; height: 96px; margin-bottom: 14px; }
  .kit-rstar svg { position: absolute; inset: 0; width: 100%; height: 100%; }
  .kit-rstar .on { transform: scale(0); }
  .kit-rstar.lit .on { animation: kit-starin .55s cubic-bezier(.2,1.8,.4,1) forwards; }
  @keyframes kit-starin { 0% { transform: scale(0) rotate(-90deg); } 100% { transform: scale(1) rotate(0); } }
  .kit-rhero { width: 120px; height: 120px; margin: -6px auto 2px; }
  .kit-rhero svg { width: 100%; height: 100%; overflow: visible; }
  .kit-rmsg { font-size: 19px; font-weight: 800; line-height: 1.45; margin: 4px 0 12px; }
  .kit-unlock { display: flex; align-items: center; gap: 10px; text-align: left; margin: 0 auto 14px; padding: 8px 12px; border-radius: 20px; border: 3px dashed var(--k-main);
    background: #fff; font-weight: 900; font-size: 17px; animation: kit-drop .6s 1.2s both cubic-bezier(.2,1.6,.4,1); max-width: 340px; }
  .kit-unlock .ic { width: 58px; height: 58px; flex: 0 0 auto; }
  .kit-unlock .ic svg { width: 100%; height: 100%; }
  .kit-rbtns { display: flex; justify-content: center; gap: 14px; flex-wrap: wrap; }
  .kit-rbtn { font-family: var(--kg-font); display: flex; flex-direction: column; align-items: center; gap: 4px; background: none; border: none; cursor: pointer; font-size: 15px; font-weight: 900; color: var(--k-dark); padding: 0; }
  .kit-rbtn .b { width: 70px; height: 70px; border-radius: 50%; border: 4px solid #fff; display: grid; place-items: center; transition: transform .1s; }
  .kit-rbtn .b svg { width: 38px; height: 38px; }
  .kit-rbtn:active .b { transform: translateY(4px) scale(.95); }
  .kit-rbtn.g .b { background: linear-gradient(180deg, #8ff0a4, #34b45a); box-shadow: 0 6px 0 #22803f, 0 10px 16px rgba(0,0,0,.2); }
  .kit-rbtn.y .b { background: linear-gradient(180deg, #ffe58a, #f2a91f); box-shadow: 0 6px 0 #b9790c, 0 10px 16px rgba(0,0,0,.2); }
  .kit-rbtn.b2 .b { background: linear-gradient(180deg, #a6dcff, #3a9ee8); box-shadow: 0 6px 0 #2268a3, 0 10px 16px rgba(0,0,0,.2); }
  .kit-rbtn.big .b { width: 84px; height: 84px; animation: kit-pulse 1.4s ease-in-out infinite; }

  /* HUD */
  .kit-hud { position: fixed; top: 10px; left: 50%; transform: translateX(-50%); z-index: 8000; display: flex; gap: 8px; pointer-events: none; max-width: calc(100vw - 136px); }
  .kit-chip {
    height: 48px; display: inline-flex; align-items: center; gap: 4px; padding: 0 14px 0 6px; border-radius: 999px; white-space: nowrap;
    background: var(--chip-bg, linear-gradient(180deg, #fff, #ffeef6)); border: 4px solid var(--chip-border, #fff); color: var(--k-dark);
    box-shadow: 0 5px 0 rgba(0,0,0,.15), 0 8px 14px rgba(0,0,0,.12); font-size: 20px; font-weight: 900;
  }
  .kit-chip svg { width: 32px; height: 32px; flex: 0 0 auto; }
  .kit-chip.bump { animation: kit-bump .4s cubic-bezier(.2,1.8,.4,1); }
  @keyframes kit-bump { 0% { transform: scale(1); } 40% { transform: scale(1.25); } 100% { transform: scale(1); } }
  .kit-prog { width: 74px; height: 16px; border-radius: 99px; background: rgba(0,0,0,.12); overflow: hidden; box-shadow: inset 0 2px 3px rgba(0,0,0,.15); }
  .kit-prog i { display: block; height: 100%; width: 0; border-radius: 99px; background: linear-gradient(180deg, #ffe680, #ffb21f); box-shadow: inset 0 3px 0 rgba(255,255,255,.5); transition: width .4s cubic-bezier(.2,1.4,.4,1); }

  /* 特效 */
  .kit-fx { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 9250; }
  .kit-float {
    position: fixed; z-index: 9260; pointer-events: none; font-weight: 900; font-size: 30px; color: var(--c, #fff); white-space: nowrap;
    text-shadow: 3px 0 0 var(--o, #6b3a8a), -3px 0 0 var(--o, #6b3a8a), 0 3px 0 var(--o, #6b3a8a), 0 -3px 0 var(--o, #6b3a8a), 2px 2px 0 var(--o, #6b3a8a), -2px 2px 0 var(--o, #6b3a8a), 2px -2px 0 var(--o, #6b3a8a), -2px -2px 0 var(--o, #6b3a8a), 0 6px 0 rgba(0,0,0,.2);
    animation: kit-float 1s ease-out forwards;
  }
  @keyframes kit-float { 0% { transform: translate(-50%, -50%) scale(.4); opacity: 0; } 20% { transform: translate(-50%, -80%) scale(1.25); opacity: 1; } 100% { transform: translate(-50%, -200%) scale(1); opacity: 0; } }
  .kit-callout {
    position: fixed; left: 50%; top: 38%; z-index: 9260; pointer-events: none; white-space: nowrap; letter-spacing: 3px;
    font-size: clamp(40px, 11vw, 74px); font-weight: 900; color: var(--c, #ffd23f);
    text-shadow: 4px 0 0 #fff, -4px 0 0 #fff, 0 4px 0 #fff, 0 -4px 0 #fff, 3px 3px 0 #fff, -3px 3px 0 #fff, 3px -3px 0 #fff, -3px -3px 0 #fff, 0 9px 0 var(--o, #7a2f57), 0 14px 18px rgba(0,0,0,.25);
    animation: kit-callout 1.3s forwards;
  }
  @keyframes kit-callout {
    0% { transform: translate(-50%, -50%) scale(.2) rotate(-12deg); opacity: 0; }
    22% { transform: translate(-50%, -50%) scale(1.18) rotate(3deg); opacity: 1; }
    38% { transform: translate(-50%, -50%) scale(1) rotate(-2deg); }
    80% { opacity: 1; transform: translate(-50%, -55%) scale(1) rotate(0); }
    100% { transform: translate(-50%, -90%) scale(.9); opacity: 0; }
  }
  @media (prefers-reduced-motion: reduce) { .kit-lc, .kit-bigbtn, .kit-rbtn.big .b { animation: none; } }

  :root { --k-main: #ff9a3c; --k-dark: #b4531a; --k-light: #fff3e3; --k-accent: #6cc4ff; --hr: #ff5f45; --mn: #2f8fe8; }
  html, body { height: 100%; overflow: hidden; }
  body { background: #ffe9c7; }
  #bg { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; }
  #bg .cl { animation: cl 60s linear infinite; }
  #bg .cl.b { animation-duration: 80s; animation-delay: -35s; }
  @keyframes cl { from { transform: translateX(-350px); } to { transform: translateX(1150px); } }

  #app {
    position: fixed; inset: 0; height: 100vh; height: 100dvh; display: grid; gap: 8px;
    padding: 66px max(10px, env(safe-area-inset-right)) max(10px, env(safe-area-inset-bottom)) max(10px, env(safe-area-inset-left));
    grid-template-columns: minmax(0, 1fr);
    grid-template-rows: auto minmax(0, 1fr) auto;
    grid-template-areas: "prompt" "clock" "opts";
    touch-action: none;
  }
  #app.land {
    padding-right: max(66px, env(safe-area-inset-right)); padding-top: 62px;
    grid-template-columns: minmax(0, 1fr) minmax(280px, 46%);
    grid-template-rows: minmax(0, 1fr) auto auto minmax(0, 1fr);
    grid-template-areas: "clock ." "clock prompt" "clock opts" "clock .";
    column-gap: 14px;
  }
  /* 題目板：貓頭鷹老師 + 對話框 */
  #prompt { grid-area: prompt; display: flex; align-items: center; gap: 4px; margin-right: 54px; min-height: 64px; }
  #app.land #prompt { margin-right: 0; align-self: end; }
  #owl { width: 72px; height: 72px; flex: 0 0 auto; position: relative; cursor: pointer; }
  #owl svg { width: 100%; height: 100%; overflow: visible; display: block; }
  #bubble {
    position: relative; flex: 1 1 auto; min-width: 0; background: #fff; border: 4px solid #fff; border-radius: 22px; padding: 7px 12px;
    box-shadow: 0 5px 0 rgba(150,90,30,.18), 0 8px 16px rgba(150,90,30,.15); color: #5b3413; font-weight: 900; font-size: clamp(17px, 4.6vw, 22px); line-height: 1.3;
    display: flex; align-items: center; gap: 8px; animation: bubIn .45s cubic-bezier(.2,1.6,.4,1);
  }
  #bubble::before { content: ''; position: absolute; left: -14px; top: 50%; margin-top: -10px; border: 10px solid transparent; border-right: 12px solid #fff; border-left: 0; }
  #bubble .txt { flex: 1 1 auto; min-width: 0; }
  #bubble .tg { display: inline-block; padding: 0 8px; border-radius: 10px; background: #fff1d6; color: #c25a12; white-space: nowrap; }
  #bubble .tg.big { font-size: 1.15em; background: linear-gradient(180deg, #fff6c9, #ffe08a); }
  #bubble .pic { width: 70px; height: 58px; flex: 0 0 auto; }
  #bubble .pic svg { width: 100%; height: 100%; display: block; }
  @keyframes bubIn { from { transform: scale(.7); opacity: 0; } to { transform: none; opacity: 1; } }
  #sayBtn { width: 40px; height: 40px; flex: 0 0 auto; border-radius: 50%; border: 3px solid #fff; cursor: pointer; padding: 6px;
    background: linear-gradient(180deg, #a6dcff, #3a9ee8); box-shadow: 0 4px 0 #2268a3; }
  #sayBtn:active { transform: translateY(3px); box-shadow: 0 1px 0 #2268a3; }
  #sayBtn svg { width: 100%; height: 100%; display: block; }

  #clockBox { grid-area: clock; position: relative; min-height: 0; display: grid; place-items: center; touch-action: none; cursor: grab; }
  #clockBox.dragging { cursor: grabbing; }
  #clock { display: block; width: 100%; height: 100%; touch-action: none; }
  #clockBox.stack { place-items: start center; }
  #clockBox.pop #clock { animation: clockPop .55s cubic-bezier(.2,1.6,.4,1); }
  #clockBox.no #clock { animation: clockNo .45s ease; }
  @keyframes clockPop { 0% { transform: scale(1); } 35% { transform: scale(1.07) rotate(-2deg); } 70% { transform: scale(.98) rotate(1deg); } 100% { transform: none; } }
  @keyframes clockNo { 0%, 100% { transform: none; } 20% { transform: translateX(-10px) rotate(-2deg); } 40% { transform: translateX(9px) rotate(2deg); } 60% { transform: translateX(-6px); } 80% { transform: translateX(4px); } }
  #lblBtn { position: absolute; left: 2px; bottom: 2px; font-family: var(--kg-font); font-weight: 900; font-size: 14px; color: #8a4a12; cursor: pointer;
    border: 3px solid #fff; border-radius: 999px; padding: 5px 10px 5px 6px; background: rgba(255,255,255,.88); box-shadow: 0 3px 0 rgba(150,90,30,.2);
    display: inline-flex; align-items: center; gap: 4px; min-height: 40px; }
  #lblBtn i { width: 26px; height: 16px; border-radius: 99px; background: #d9cbbb; position: relative; transition: background .2s; }
  #lblBtn i::after { content: ''; position: absolute; top: 2px; left: 2px; width: 12px; height: 12px; border-radius: 50%; background: #fff; transition: transform .2s; }
  #lblBtn.on i { background: #46b864; } #lblBtn.on i::after { transform: translateX(10px); }
  #readout { position: absolute; right: 2px; bottom: 2px; font-weight: 900; font-size: 22px; color: #5b3413; background: rgba(255,255,255,.9); border: 3px solid #fff;
    border-radius: 16px; padding: 2px 12px; box-shadow: 0 3px 0 rgba(150,90,30,.2); display: none; text-align: center; line-height: 1.1; }
  #readout small { display: block; font-size: 14px; color: #a0622a; }

  #opts { grid-area: opts; display: grid; gap: 10px; grid-template-columns: repeat(var(--n, 3), minmax(0, 1fr)); width: min(560px, 100%); justify-self: center; align-self: center; }
  #opts.c2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  #opts.c2 .opt:last-child:nth-child(odd) { grid-column: 1 / -1; }
  .opt .cn { white-space: nowrap; }
  #app.land #opts { align-self: start; width: 100%; }
  .opt {
    font-family: var(--kg-font); position: relative; cursor: pointer; border: 5px solid #fff; border-radius: 22px; padding: 6px 4px; min-height: 64px;
    background: linear-gradient(180deg, #fff 0%, #fff4e4 100%); color: #5b3413; box-shadow: 0 6px 0 rgba(150,90,30,.22), 0 10px 16px rgba(150,90,30,.15);
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 0; animation: optIn .45s cubic-bezier(.2,1.6,.4,1) both;
    transition: transform .1s;
  }

<script>
/* ===== 遊戲共用 UI 套件 Kit：標題畫面、關卡選擇、結算、圖示、特效、背景音樂 ===== */
const Kit = (function () {
  'use strict';
  /* ---------- 緩動函式 ---------- */
  const E = {
    linear: t => t,
    outQuad: t => 1 - (1 - t) * (1 - t),
    outCubic: t => 1 - Math.pow(1 - t, 3),
    inOut: t => (t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2),
    outBack: t => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); },
    outElastic: t => (t === 0 ? 0 : t === 1 ? 1 : Math.pow(2, -10 * t) * Math.sin((t * 10 - 0.75) * (2 * Math.PI / 3)) + 1),
    outBounce: t => {
      const n1 = 7.5625, d1 = 2.75;
      if (t < 1 / d1) return n1 * t * t;
      if (t < 2 / d1) return n1 * (t -= 1.5 / d1) * t + 0.75;
      if (t < 2.5 / d1) return n1 * (t -= 2.25 / d1) * t + 0.9375;
      return n1 * (t -= 2.625 / d1) * t + 0.984375;
    }
  };
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const lerp = (a, b, t) => a + (b - a) * t;

  /* ---------- 顏色小工具 ---------- */
  function hex2rgb(h) { h = h.replace('#', ''); if (h.length === 3) h = h.split('').map(c => c + c).join(''); const n = parseInt(h, 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; }
  function rgb2hex(r) { return '#' + r.map(v => clamp(Math.round(v), 0, 255).toString(16).padStart(2, '0')).join(''); }
  function mix(a, b, t) { const A = hex2rgb(a), B = hex2rgb(b); return rgb2hex(A.map((v, i) => lerp(v, B[i], t))); }
  const lighten = (c, t) => mix(c, '#ffffff', t);
  const darken = (c, t) => mix(c, '#000000', t);

  /* ---------- 共用 SVG 漸層 ---------- */
  function ensureDefs() {
    if (document.getElementById('kitDefs')) return;
    const d = document.createElement('div');
    d.className = 'kit-hidden-defs';
    d.innerHTML = `<svg id="kitDefs" width="0" height="0" aria-hidden="true"><defs>
      <linearGradient id="kitStarG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff38a"/><stop offset=".55" stop-color="#ffd02e"/><stop offset="1" stop-color="#ff9f1a"/></linearGradient>
      <linearGradient id="kitLockG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffe27a"/><stop offset="1" stop-color="#e9a628"/></linearGradient>
      <linearGradient id="kitGiftG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ff9ccc"/><stop offset="1" stop-color="#e8558d"/></linearGradient>
      <linearGradient id="kitRibbonG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--k-main)"/><stop offset="1" stop-color="var(--k-dark)"/></linearGradient>
    </defs></svg>`;
    document.body.appendChild(d);
  }

  /* ---------- 圖示（全部手繪向量） ---------- */
  const STAR_D = 'M50 7 C53 7 55 9 56 12 L64 31 L85 33 C91 34 93 41 89 45 L73 59 L78 80 C79 86 73 90 68 87 L50 76 L32 87 C27 90 21 86 22 80 L27 59 L11 45 C7 41 9 34 15 33 L36 31 L44 12 C45 9 47 7 50 7 Z';
  const ICON = {
    star: (on = true) => `<svg viewBox="0 0 100 100"><path d="${STAR_D}" transform="translate(0 4)" fill="${on ? '#d9800b' : '#b9afc6'}" opacity=".55"/><path d="${STAR_D}" fill="${on ? 'url(#kitStarG)' : '#e3dcea'}" stroke="${on ? '#c46f00' : '#b4aac2'}" stroke-width="5" stroke-linejoin="round"/>${on ? '<path d="M36 34 Q44 22 54 26" stroke="#fff" stroke-width="7" fill="none" stroke-linecap="round" opacity=".85"/><circle cx="66" cy="44" r="4" fill="#fff" opacity=".7"/>' : ''}</svg>`,
    lock: () => '<svg viewBox="0 0 100 100" class="lock"><path d="M31 46 V33 a19 19 0 0 1 38 0 V46" fill="none" stroke="#8a7a99" stroke-width="11" stroke-linecap="round"/><rect x="18" y="42" width="64" height="48" rx="14" fill="url(#kitLockG)" stroke="#a46f12" stroke-width="5"/><rect x="26" y="48" width="48" height="8" rx="4" fill="#fff" opacity=".45"/><circle cx="50" cy="64" r="7" fill="#8a5a0a"/><rect x="47" y="66" width="6" height="13" rx="3" fill="#8a5a0a"/></svg>',
    play: () => '<svg viewBox="0 0 100 100"><path d="M34 20 Q30 18 30 24 V76 Q30 82 35 79 L80 54 Q85 50 80 46 Z" fill="#fff" stroke="#fff" stroke-width="6" stroke-linejoin="round"/></svg>',
    replay: () => '<svg viewBox="0 0 100 100"><path d="M74 58 A26 26 0 1 1 66 31" fill="none" stroke="#fff" stroke-width="12" stroke-linecap="round"/><path d="M56 16 L80 26 L62 44 Z" fill="#fff" stroke="#fff" stroke-width="6" stroke-linejoin="round"/></svg>',
    next: () => '<svg viewBox="0 0 100 100"><path d="M22 50 H70 M50 28 L74 50 L50 72" stroke="#fff" stroke-width="13" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>',
    back: () => '<svg viewBox="0 0 100 100"><path d="M78 50 H30 M50 28 L26 50 L50 72" stroke="#fff" stroke-width="13" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>',
    menu: () => '<svg viewBox="0 0 100 100"><g fill="#fff"><rect x="18" y="18" width="27" height="27" rx="8"/><rect x="55" y="18" width="27" height="27" rx="8"/><rect x="18" y="55" width="27" height="27" rx="8"/><rect x="55" y="55" width="27" height="27" rx="8"/></g></svg>',
    gift: () => '<svg viewBox="0 0 100 100"><path d="M50 30 C40 10 20 16 28 28 C32 33 44 32 50 30 C56 32 68 33 72 28 C80 16 60 10 50 30 Z" fill="#ffd34d" stroke="#c48a12" stroke-width="4" stroke-linejoin="round"/><rect x="14" y="30" width="72" height="20" rx="6" fill="url(#kitGiftG)" stroke="#a83a6a" stroke-width="4"/><rect x="20" y="48" width="60" height="40" rx="6" fill="url(#kitGiftG)" stroke="#a83a6a" stroke-width="4"/><rect x="44" y="30" width="12" height="58" fill="#ffd34d" stroke="#c48a12" stroke-width="3"/><rect x="24" y="52" width="10" height="20" rx="4" fill="#fff" opacity=".4"/></svg>',
    note: () => '<svg viewBox="0 0 100 100"><path d="M40 70 V24 L78 16 V60" fill="none" stroke="#fff" stroke-width="9" stroke-linejoin="round"/><ellipse cx="32" cy="72" rx="12" ry="9" fill="#fff"/><ellipse cx="70" cy="62" rx="12" ry="9" fill="#fff"/></svg>'
  };
  const starRow = (n, total = 3) => { let s = ''; for (let i = 0; i < total; i++) s += ICON.star(i < n); return s; };

  /* ---------- 標誌文字（每個字分開彈跳） ---------- */
  function logoSVG(text, colors, stroke) {
    const ch = Array.from(text);
    const step = 92, W = ch.length * step + 40;
    let s = `<svg class="kit-logo-svg" viewBox="0 0 ${W} 150" aria-label="${text}"><defs>`;
    colors.forEach((c, i) => {
      s += `<linearGradient id="kitLg${i}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${lighten(c, 0.55)}"/><stop offset=".5" stop-color="${lighten(c, 0.15)}"/><stop offset="1" stop-color="${c}"/></linearGradient>`;
    });
    s += '</defs>';
    ch.forEach((c, i) => {
      const x = 20 + i * step + step / 2, rot = (i % 2 ? 5 : -5);
      s += `<g class="kit-lc" style="animation-delay:${(i * 0.13).toFixed(2)}s"><g transform="rotate(${rot} ${x} 95)">` +
        `<text x="${x}" y="124" text-anchor="middle" font-size="90" font-weight="900" fill="${stroke}" stroke="${stroke}" stroke-width="24" stroke-linejoin="round">${c}</text>` +
        `<text x="${x}" y="114" text-anchor="middle" font-size="90" font-weight="900" fill="#fff" stroke="#fff" stroke-width="22" stroke-linejoin="round">${c}</text>` +
        `<text x="${x}" y="114" text-anchor="middle" font-size="90" font-weight="900" fill="url(#kitLg${i % colors.length})" stroke="${stroke}" stroke-width="7" stroke-linejoin="round" paint-order="stroke">${c}</text>` +
        `</g></g>`;
    });
    return s + '</svg>';
  }

  /* ---------- 背景音樂（用 KG.note 合成） ---------- */
  const Music = (function () {
    let timer = null, step = 0, song = null;
    const mf = m => 440 * Math.pow(2, (m - 69) / 12);
    function tick() {
      if (!song) return;
      const dur = 60 / song.bpm / 2;
      if (!KG.isMuted() && !document.hidden) {
        const m = song.mel[step % song.mel.length];
        if (m) KG.note(mf(m), dur * 1.5, song.wave || 'triangle', song.vol || 0.045);
        if (song.bass && step % 2 === 0) {
          const b = song.bass[(step / 2 | 0) % song.bass.length];
          if (b) KG.note(mf(b), dur * 1.9, 'sine', (song.vol || 0.045) * 1.4);
        }
        if (song.tick && step % 4 === 2) KG.note(2200, 0.03, 'square', 0.012);
      }
      step++;
      timer = setTimeout(tick, dur * 1000);
    }
    return {
      start(s) { this.stop(); song = s; step = 0; timer = setTimeout(tick, 80); },
      stop() { clearTimeout(timer); timer = null; song = null; },
      get playing() { return !!song; }
    };
  })();
  // 幾首可愛的旋律（MIDI 音高，0 = 休止，每格 = 八分音符）
  const SONGS = {
    happy: { bpm: 112, mel: [72, 0, 76, 79, 81, 79, 76, 0, 74, 0, 77, 81, 79, 0, 0, 0, 72, 74, 76, 79, 77, 76, 74, 0, 72, 0, 67, 0, 72, 0, 0, 0], bass: [48, 55, 53, 55, 48, 55, 43, 48], tick: true },
    bouncy: { bpm: 120, mel: [67, 72, 76, 72, 79, 0, 76, 0, 74, 77, 81, 77, 79, 0, 0, 0, 76, 79, 84, 79, 81, 79, 76, 0, 74, 76, 72, 0, 72, 0, 0, 0], bass: [48, 52, 53, 55, 48, 52, 50, 48], tick: true },
    gentle: { bpm: 92, mel: [76, 0, 79, 0, 84, 0, 83, 81, 79, 0, 76, 0, 77, 0, 0, 0, 74, 0, 77, 0, 81, 0, 79, 77, 76, 0, 72, 0, 74, 0, 0, 0], bass: [48, 55, 53, 50, 48, 52, 53, 55], wave: 'sine', vol: 0.05 },
    march: { bpm: 126, mel: [72, 72, 79, 79, 81, 81, 79, 0, 77, 77, 76, 76, 74, 74, 72, 0, 79, 79, 77, 77, 76, 76, 74, 0, 79, 79, 77, 77, 76, 76, 74, 0], bass: [48, 53, 48, 43, 48, 53, 55, 48], tick: true }
  };
  document.addEventListener('visibilitychange', () => { /* tick 內會檢查 document.hidden */ });

  /* ---------- 粒子特效（全螢幕畫布） ---------- */
  const FX = (function () {
    let cv = null, c = null, parts = [], running = false, last = 0;
    const DEF = ['#ff7eb0', '#ffd34d', '#7bd88f', '#6cc4ff', '#b49cff', '#ffa94d'];
    function ensure() {
      if (cv) return;
      cv = document.createElement('canvas');
      cv.className = 'kit-fx';
      document.body.appendChild(cv);
      resize();
      window.addEventListener('resize', resize);
    }
    function resize() {
      const d = window.devicePixelRatio || 1;
      cv.width = innerWidth * d; cv.height = innerHeight * d;
      c = cv.getContext('2d');
      c.setTransform(d, 0, 0, d, 0, 0);
    }
    function starPath(ctx, r) {
      ctx.beginPath();
      for (let i = 0; i < 10; i++) {
        const a = -Math.PI / 2 + i * Math.PI / 5, rr = i % 2 ? r * 0.45 : r;
        ctx.lineTo(Math.cos(a) * rr, Math.sin(a) * rr);
      }
      ctx.closePath();
    }
    function heartPath(ctx, r) {
      ctx.beginPath();
      ctx.moveTo(0, r * 0.9);
      ctx.bezierCurveTo(-r * 1.4, -r * 0.1, -r * 0.7, -r * 1.2, 0, -r * 0.45);
      ctx.bezierCurveTo(r * 0.7, -r * 1.2, r * 1.4, -r * 0.1, 0, r * 0.9);
      ctx.closePath();
    }
    function sparkPath(ctx, r) {
      ctx.beginPath();
      ctx.moveTo(0, -r); ctx.quadraticCurveTo(0, 0, r, 0); ctx.quadraticCurveTo(0, 0, 0, r);
      ctx.quadraticCurveTo(0, 0, -r, 0); ctx.quadraticCurveTo(0, 0, 0, -r); ctx.closePath();
    }
    function draw(ctx, p) {
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(p.rot);
      const s = p.size * (p.grow ? (1 + (1 - p.life) * 1.5) : (0.4 + p.life * 0.6));
      ctx.globalAlpha = Math.min(1, p.life * 1.6);
      ctx.fillStyle = p.color;
      if (p.type === 'star') { starPath(ctx, s); ctx.fill(); ctx.lineWidth = 2; ctx.strokeStyle = 'rgba(255,255,255,.8)'; ctx.stroke(); }
      else if (p.type === 'heart') { heartPath(ctx, s); ctx.fill(); }
      else if (p.type === 'spark') { sparkPath(ctx, s * 1.3); ctx.fill(); }
      else if (p.type === 'ring') { ctx.beginPath(); ctx.arc(0, 0, s, 0, Math.PI * 2); ctx.lineWidth = 4 * p.life; ctx.strokeStyle = p.color; ctx.stroke(); }
      else if (p.type === 'confetti') { ctx.fillRect(-s, -s * 0.5, s * 2, s); }
      else {
        ctx.beginPath(); ctx.arc(0, 0, s, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = 'rgba(255,255,255,.6)'; ctx.beginPath(); ctx.arc(-s * 0.3, -s * 0.3, s * 0.35, 0, Math.PI * 2); ctx.fill();
      }
      ctx.restore();
    }
    function loop(now) {
      const dt = Math.max(0, Math.min(0.05, (now - last) / 1000));
      last = now;
      c.clearRect(0, 0, innerWidth, innerHeight);
      for (let i = parts.length - 1; i >= 0; i--) {
        const p = parts[i];
        p.vy += p.g * dt; p.vx *= Math.pow(p.drag, dt); p.vy *= Math.pow(p.drag, dt);
        p.x += p.vx * dt; p.y += p.vy * dt; p.rot += p.vr * dt;
        p.life -= p.decay * dt;
        if (p.life <= 0) { parts.splice(i, 1); continue; }
        draw(c, p);
      }
      if (parts.length) requestAnimationFrame(loop);
      else { running = false; c.clearRect(0, 0, innerWidth, innerHeight); }
    }
    function burst(x, y, o) {
      o = o || {};
      ensure();
      const n = o.n || 14;
      for (let i = 0; i < n; i++) {
        const a = o.angle != null ? o.angle + KG.rand(-o.spread, o.spread) : Math.random() * Math.PI * 2;
        const sp = KG.rand(o.speed ? o.speed * 0.5 : 120, o.speed || 360);
        const types = o.types || ['star', 'circle', 'heart', 'spark'];
        parts.push({
          x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - (o.up || 80),
          g: o.gravity != null ? o.gravity : 500, drag: o.drag || 0.4,
          size: KG.rand(o.size ? o.size * 0.6 : 5, o.size || 11), rot: Math.random() * 6, vr: KG.rand(-6, 6),
          color: KG.pick(o.colors || DEF), type: KG.pick(types), life: 1, decay: o.decay || KG.rand(0.9, 1.4), grow: o.grow
        });
      }
      if (parts.length > 500) parts.splice(0, parts.length - 500);
      if (!running) { running = true; last = performance.now(); requestAnimationFrame(loop); }
    }
    function ring(x, y, color) { burst(x, y, { n: 1, types: ['ring'], speed: 1, up: 0, gravity: 0, size: 30, grow: true, colors: [color || '#fff'], decay: 2 }); }
    return { burst, ring, starPath, heartPath, sparkPath };
  })();

  function floatText(x, y, text, color, outline) {

    el.style.left = x + 'px'; el.style.top = y + 'px';

  }
  let lastCallout = null;
  function callout(text, color, outline) {

    el.className = 'kit-callout';
    el.textContent = text;
    if (color) el.style.setProperty('--c', color);
    if (outline) el.style.setProperty('--o', outline);

    setTimeout(() => { el.remove(); if (lastCallout === el) lastCallout = null; }, 1350);
  }
  const PRAISE = ['好棒！', '太厲害了！', '完美！', '超讚的！', '你好聰明！', '好厲害！'];
  function shake(el, mag, dur) {
    if (!el || !el.animate) return;

  function progress(key, count) {

    };
  }

  function title(o) {

      `<div class="kit-hero">${o.hero || ''}</div>${o.sub ? `<div class="kit-tsub">${o.sub}</div>` : ''}<div class="kit-tbtns"></div>`;
    const box = ov.querySelector('.kit-tbtns');

      btn.addEventListener('click', () => {
        KG.sound('pop');
        ov.classList.add('out');
        setTimeout(() => ov.remove(), 350);
        if (b.onClick) b.onClick();

  }

  /* ---------- 關卡選擇 ---------- */
  function levelSelect(o) {
    ensureDefs();
    const ov = document.createElement('div');

    for (let i = 0; i < o.count; i++) if (prog.unlocked(i) && !prog.stars[i]) { nextIdx = i; break; }
    let html = `<div class="kit-banner">${o.title || '選擇關卡'}</div><div class="kit-total">${ICON.star(true)}<span>${prog.total} / ${o.count * 3}</span></div><div class="kit-grid">`;
    for (let i = 0; i < o.count; i++) {
      const un = prog.unlocked(i);
      html += `<button class="kit-lv${un ? '' : ' locked'}${i === nextIdx ? ' next' : ''}" data-i="${i}" style="animation-delay:${(i * 0.04).toFixed(2)}s" aria-label="第 ${i + 1} 關">` +
        `<div class="num"><span>${i + 1}</span></div>${un ? '' : ICON.lock()}` +
        (o.names && o.names[i] ? `<div class="lname">${o.names[i]}</div>` : '') +
        `<div class="stars">${starRow(prog.stars[i] || 0)}</div></button>`;
    }
    html += '</div><div class="kit-extra"></div>';
    ov.innerHTML = html;
    if (o.extra) o.extra(ov.querySelector('.kit-extra'), close);
    ov.querySelectorAll('.kit-lv').forEach(b => b.addEventListener('click', () => {
      const i = +b.dataset.i;
      if (!prog.unlocked(i)) { KG.sound('wrong'); shake(b, 6); return; }
      KG.sound('pop');
      close();
      o.onPick(i);
    }));
    function close() { ov.classList.add('out'); setTimeout(() => ov.remove(), 300); }
    document.body.appendChild(ov);

  }

  /* ---------- 結算畫面 ---------- */
  function result(o) {
    ensureDefs();
    const ov = document.createElement('div');
    ov.className = 'kit-ov';
    const s = o.stars || 0;
    const title = o.title || (s >= 3 ? '太完美了！' : s === 2 ? '好棒喔！' : '過關了！');
    const ribbon = `<svg viewBox="0 0 440 96"><path d="M14 30 L70 30 L70 82 L14 82 L34 56 Z" fill="var(--k-dark)"/><path d="M426 30 L370 30 L370 82 L426 82 L406 56 Z" fill="var(--k-dark)"/>` +
      `<path d="M50 14 Q220 -4 390 14 L390 70 Q220 52 50 70 Z" fill="url(#kitRibbonG)" stroke="#fff" stroke-width="5" stroke-linejoin="round"/>` +
      `<text x="220" y="54" text-anchor="middle" font-size="36" font-weight="900" fill="#fff" stroke="rgba(0,0,0,.25)" stroke-width="6" paint-order="stroke">${title}</text></svg>`;
    ov.innerHTML = `<div class="kit-rcard"><div class="kit-ribbon">${ribbon}</div>` +
      `<div class="kit-rstars">${[0, 1, 2].map(i => `<div class="kit-rstar${i === 1 ? ' mid' : ''}"><div class="off">${ICON.star(false)}</div><div class="on" style="position:absolute;inset:0">${ICON.star(true)}</div></div>`).join('')}</div>` +

      `<div class="kit-rmsg">${o.message || ''}</div>` +
      (o.unlock ? `<div class="kit-unlock"><div class="ic">${o.unlockIcon || ICON.gift()}</div><div>${o.unlock}</div></div>` : '') +
      `<div class="kit-rbtns"></div></div>`;
    const box = ov.querySelector('.kit-rbtns');
    const btns = [];
    if (o.onMenu) btns.push({ cls: 'b2', icon: ICON.menu(), text: '關卡', fn: o.onMenu });
    if (o.onReplay) btns.push({ cls: 'y', icon: ICON.replay(), text: o.replayText || '再玩一次', fn: o.onReplay });
    if (o.onNext) btns.push({ cls: 'g big', icon: ICON.next(), text: o.nextText || '下一關', fn: o.onNext });
    btns.forEach(b => {
      const el = document.createElement('button');
      el.className = 'kit-rbtn ' + b.cls;
      el.innerHTML = `<div class="b">${b.icon}</div><span>${b.text}</span>`;
      el.addEventListener('click', () => { KG.sound('pop'); ov.remove(); b.fn(); });
      box.appendChild(el);
    });
    document.body.appendChild(ov);
    // 星星一顆一顆亮起來
    const stars = ov.querySelectorAll('.kit-rstar');
    for (let i = 0; i < s; i++) {
      setTimeout(() => {
        stars[i].classList.add('lit');
        KG.note([784, 988, 1319][i], 0.25, 'triangle', 0.22);
        KG.note([1568, 1976, 2637][i], 0.2, 'sine', 0.08, 0.05);
        setTimeout(() => {
          const r = stars[i].getBoundingClientRect();
          FX.burst(r.left + r.width / 2, r.top + r.height / 2, { n: 12, types: ['star', 'spark'], colors: ['#ffd34d', '#fff1a8', '#ffb21f', '#ffffff'], speed: 300 });
        }, 120);
      }, 450 + i * 380);
    }
    setTimeout(() => {
      if (s > 0) { KG.sound('win'); KG.confetti(); } else KG.sound('lose');
    }, 450 + s * 380);
    return ov;
  }

  /* ---------- 小幫手：高解析畫布 ---------- */
  function fitCanvas(cv, w, h) {
    const d = Math.min(3, window.devicePixelRatio || 1);
    cv.width = Math.round(w * d); cv.height = Math.round(h * d);
    cv.style.width = w + 'px'; cv.style.height = h + 'px';
    const ctx = cv.getContext('2d');
    ctx.setTransform(d, 0, 0, d, 0, 0);
    return ctx;
  }
  function roundRect(ctx, x, y, w, h, r) {
    r = Math.min(r, w / 2, h / 2);
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  // 防止頁面捲動 / 縮放
  document.addEventListener('gesturestart', e => e.preventDefault());
  document.addEventListener('dblclick', e => e.preventDefault());

  return { E, clamp, lerp, mix, lighten, darken, hex2rgb, rgb2hex, ICON, starRow, logoSVG, Music, SONGS, FX, floatText, callout, PRAISE, shake, bump, progress, title, levelSelect, result, fitCanvas, roundRect, ensureDefs };
})();

<script>
'use strict';
(function () {
  const $ = id => document.getElementById(id);
  const TAU = Math.PI * 2;
  const QN = 8; // 每關題數

  /* =====================================================================
   * 時間 ↔ 指針角度（角度：從 12 點方向順時針，單位「度」）
   * 時間一律用「分鐘總數」total 表示（0–719 為 12 小時制；一天的生活用 0–1439）
   * ===================================================================== */
  const mod = (a, n) => ((a % n) + n) % n;
  const T = {
    angles(h, m) { return { hour: mod((mod(h, 12) + m / 60) * 30, 360), minute: mod(m * 6, 360) }; },
    anglesOf(total) { return T.angles(Math.floor(total / 60), mod(total, 60)); },
    // 由指針角度推回時間（只用來驗證）
    fromAngles(hourDeg, minDeg) {
      const m = Math.round(mod(minDeg, 360) / 6) % 60;
      const h = mod(Math.round((mod(hourDeg, 360) - m * 0.5) / 30), 12);
      return h * 60 + m;
    },
    // 由畫面座標算角度
    pointerAngle(x, y, cx, cy) { return mod(Math.atan2(x - cx, -(y - cy)) * 180 / Math.PI, 360); },
    snapMinute(deg, step) { return mod(Math.round(mod(deg, 360) / 6 / step) * step, 60); },
    // 拖長針：分鐘跟著角度跑，經過 12 時會帶動時針前進或後退
    dragMinute(total, deg, step) {
      const cur = mod(total, 60);
      const nm = T.snapMinute(deg, step);
      let d = nm - cur;
      if (d > 30) d -= 60; else if (d < -30) d += 60;
      return mod(total + d, 720);
    },
    // 拖短針：換「幾點」，分鐘保持不變（短針會停在兩個數字之間的正確位置）
    dragHour(total, deg) {
      const m = mod(total, 60);
      const h = mod(Math.round(mod(deg, 360) / 30 - m / 60), 12);
      return h * 60 + m;
    },
    h12(total) { return (Math.floor(mod(total, 720) / 60) % 12) || 12; },
    mm(total) { return mod(total, 60); },
    digital(total) { return T.h12(total) + ':' + String(T.mm(total)).padStart(2, '0'); },
    period(t24) { t24 = mod(t24, 1440); const h = Math.floor(t24 / 60); return h < 5 ? '半夜' : h < 12 ? '上午' : h < 13 ? '中午' : h < 18 ? '下午' : '晚上'; },
    cn(total, per) {
      const h = T.h12(total), m = T.mm(total);
      return (per ? per + ' ' : '') + h + ' 點' + (m === 0 ? '' : m === 30 ? '半' : ' ' + m + ' 分');
    },
    say(total, per) {
      const h = T.h12(total), m = T.mm(total);
      return (per || '') + (h === 2 ? '兩' : cnNum(h)) + '點' + (m === 0 ? '' : m === 30 ? '半' : (m < 10 ? '零' + cnNum(m) : cnNum(m)) + '分');
    },
    dur(min) { const h = Math.floor(min / 60), m = min % 60; return (h ? h + ' 小時' : '') + (h && m ? ' ' : '') + (m ? m + (h ? ' 分' : ' 分鐘') : ''); },
    durSay(min) { const h = Math.floor(min / 60), m = min % 60; return (h ? (h === 2 ? '兩' : cnNum(h)) + '個小時' : '') + (m ? cnNum(m) + '分鐘' : ''); }
  };
  function cnNum(n) {
    const d = ['零', '一', '二', '三', '四', '五', '六', '七', '八', '九'];
    if (n < 10) return d[n];
    if (n < 20) return '十' + (n % 10 ? d[n % 10] : '');
    return d[Math.floor(n / 10)] + '十' + (n % 10 ? d[n % 10] : '');
  }

  /* =====================================================================
   * 活動與關卡
   * ===================================================================== */
  const ACTS = [
    { id: 'read', name: '看鐘選時間', desc: '看時鐘，選出正確的時間', c2: '#ffeede', c3: '#c25a12', song: 'bouncy',
      levels: ['整點', '半點', '15 分', '5 分', '任意分鐘'] },
    { id: 'drag', name: '撥一撥', desc: '拖動指針，撥出時間', c2: '#e3f3ff', c3: '#2268a3', song: 'happy',
      levels: ['整點', '半點', '15 分', '5 分', '任意分鐘'] },
    { id: 'life', name: '一天的生活', desc: '上午、下午做什麼？', c2: '#fff6d0', c3: '#a8740a', song: 'gentle',
      levels: ['整點', '半點', '上午下午', '5 分', '任意分鐘'] },
    { id: 'pass', name: '時間過了多久', desc: '過一會兒是幾點？', c2: '#f1ebff', c3: '#5a35b8', song: 'march', badge: '挑戰',
      levels: ['過 1 小時', '過半小時', '過幾小時', '過 15 分', '過了多久'] }
  ];
  const SNAP = [5, 5, 5, 5, 1];
  const PROG = ACTS.map(a => Kit.progress('clock-learn:' + a.id, 5));
  const totalStars = () => PROG.reduce((s, p) => s + p.total, 0);
  const MAXSTARS = ACTS.length * 15;

  let showLabels = KG.store.get('clock-learn:labels', true);

  /* =====================================================================
   * 時鐘繪製（表盤預先畫在離屏畫布；每格只畫指針與提示）
   * ===================================================================== */
  const cv = $('clock'), box = $('clockBox');
  const ctx = cv.getContext('2d');
  const face = document.createElement('canvas');
  const C = {
    S: 300, cx: 150, cy: 150, R: 140, Rf: 118, dpr: 1,
    disp: 0,            // 目前畫面上的分鐘總數（可以是小數，做動畫用）
    target: 0,          // 目前的時間
    anim: null,         // { from, to, t, dur }
    badge: null,        // '上午' 等
    hint: null,         // { hour: true, minute: true, ghost: total, sweep: {from,to} }
    grab: null,         // 'hour' | 'minute'
    dirty: true, pulse: 0
  };
  const HCOL = ['#ff5f45', '#ff9a1f', '#2fa552', '#2f8fe8', '#8f5bf0', '#ff5fa2'];

  function layoutClock() {
    const r = box.getBoundingClientRect();
    const stack = box.classList.contains('stack');
    const S = Math.max(80, Math.floor(Math.min(r.width, r.height - (stack ? 50 : 0))));
    const dpr = window.devicePixelRatio || 1;
    cv.style.width = S + 'px'; cv.style.height = S + 'px';
    if (C.S === S && C.dpr === dpr && cv.width === Math.round(S * dpr)) { C.dirty = true; return; }
    C.S = S; C.dpr = dpr;
    cv.width = Math.round(S * dpr); cv.height = Math.round(S * dpr);
    C.cx = S / 2; C.cy = S / 2; C.R = S / 2 * 0.97; C.Rf = C.R * 0.83;
    drawFace();
    C.dirty = true;
  }

  function drawFace() {
    const { S, dpr, R, Rf } = C;
    face.width = Math.round(S * dpr); face.height = Math.round(S * dpr);
    const g = face.getContext('2d');
    g.setTransform(dpr, 0, 0, dpr, 0, 0);
    g.translate(S / 2, S / 2);
    // 影子
    g.fillStyle = 'rgba(150,80,20,.22)';
    g.beginPath(); g.arc(0, R * 0.035, R * 0.985, 0, TAU); g.fill();
    // 外框
    let gr = g.createLinearGradient(0, -R, 0, R);
    gr.addColorStop(0, '#ffe680'); gr.addColorStop(0.5, '#ffbf3c'); gr.addColorStop(1, '#f29a1a');
    g.fillStyle = gr; g.beginPath(); g.arc(0, 0, R * 0.97, 0, TAU); g.fill();
    g.lineWidth = R * 0.03; g.strokeStyle = '#c4700c'; g.stroke();
    g.lineWidth = R * 0.02; g.strokeStyle = 'rgba(255,255,255,.55)';
    g.beginPath(); g.arc(0, 0, R * 0.9, Math.PI * 1.1, Math.PI * 1.45); g.stroke();
    // 5 分鐘刻度提示
    if (showLabels) {
      const fs = Math.max(9, R * 0.072);
      g.font = '900 ' + fs + 'px ' + getComputedStyle(document.body).fontFamily;
      g.textAlign = 'center'; g.textBaseline = 'middle';
      for (let i = 0; i < 12; i++) {
        const a = i * 30 * Math.PI / 180, x = Math.sin(a) * R * 0.905, y = -Math.cos(a) * R * 0.905;
        g.fillStyle = '#fff';
        g.beginPath(); g.arc(x, y, fs * 0.95, 0, TAU); g.fill();
        g.lineWidth = 2; g.strokeStyle = '#7fbff0'; g.stroke();
        g.fillStyle = '#1f6fc0';
        g.fillText(String(i * 5).padStart(2, '0'), x, y + fs * 0.05);
      }
    }
    // 表盤
    gr = g.createRadialGradient(-Rf * 0.3, -Rf * 0.35, Rf * 0.1, 0, 0, Rf);
    gr.addColorStop(0, '#ffffff'); gr.addColorStop(0.75, '#fffaf0'); gr.addColorStop(1, '#ffeccc');
    g.fillStyle = gr; g.beginPath(); g.arc(0, 0, Rf, 0, TAU); g.fill();
    g.lineWidth = R * 0.025; g.strokeStyle = '#e09a3a'; g.stroke();
    // 刻度
    g.lineCap = 'round';
    for (let i = 0; i < 60; i++) {
      const a = i * 6 * Math.PI / 180, big = i % 5 === 0;
      const r1 = Rf * (big ? 0.86 : 0.91), r2 = Rf * 0.96;
      g.strokeStyle = big ? '#8a4a12' : '#c99a6a';
      g.lineWidth = big ? Rf * 0.03 : Rf * 0.012;
      g.beginPath(); g.moveTo(Math.sin(a) * r1, -Math.cos(a) * r1); g.lineTo(Math.sin(a) * r2, -Math.cos(a) * r2); g.stroke();
    }
    // 數字
    const nf = Rf * 0.2;
    g.font = '900 ' + nf + 'px ' + getComputedStyle(document.body).fontFamily;
    g.textAlign = 'center'; g.textBaseline = 'middle'; g.lineJoin = 'round';
    for (let n = 1; n <= 12; n++) {
      const a = n * 30 * Math.PI / 180, x = Math.sin(a) * Rf * 0.69, y = -Math.cos(a) * Rf * 0.69 + nf * 0.06;
      g.lineWidth = nf * 0.22; g.strokeStyle = '#fff'; g.strokeText(String(n), x, y);
      g.fillStyle = HCOL[n % HCOL.length]; g.fillText(String(n), x, y);
    }
  }

  function handPath(g, len, w, tail) {
    g.beginPath();
    g.moveTo(-w * 0.5, tail);
    g.lineTo(-w * 0.5, -len * 0.62);
    g.quadraticCurveTo(-w * 0.95, -len * 0.75, 0, -len);
    g.quadraticCurveTo(w * 0.95, -len * 0.75, w * 0.5, -len * 0.62);
    g.lineTo(w * 0.5, tail);
    g.arc(0, tail, w * 0.5, 0, Math.PI);
    g.closePath();
  }
  function drawHand(g, deg, len, w, col, dark, glow, alpha) {
    g.save();
    g.rotate(deg * Math.PI / 180);
    const ba = g.globalAlpha * (alpha == null ? 1 : alpha);
    g.globalAlpha = ba;
    if (glow > 0) {
      g.fillStyle = col; g.globalAlpha = ba * 0.25 * Math.min(1.4, glow);
      handPath(g, len + w * 0.9, w * 2.6, w * 0.9); g.fill();
      g.globalAlpha = ba;
    }
    g.fillStyle = col; g.strokeStyle = dark; g.lineWidth = Math.max(1.5, w * 0.16); g.lineJoin = 'round';
    handPath(g, len, w, w * 0.9); g.fill(); g.stroke();
    g.fillStyle = 'rgba(255,255,255,.45)';
    g.fillRect(-w * 0.18, -len * 0.6, w * 0.16, len * 0.5);
    g.restore();
  }

  function drawClock(now) {
    const { S, dpr, Rf } = C;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, S, S);
    ctx.drawImage(face, 0, 0, S, S);
    ctx.translate(C.cx, C.cy);
    const pulse = 0.6 + 0.4 * Math.sin(now / 180);
    const hint = C.hint;
    // 經過的時間（彩色扇形）
    if (hint && hint.sweep) {
      const { from, to } = hint.sweep;
      const cur = Math.min(to, Math.max(from, C.disp));
      const span = cur - from;
      if (span > 0) {
        const laps = Math.floor(span / 60);
        ctx.fillStyle = 'rgba(143,91,240,.16)';
        for (let i = 0; i < laps && i < 3; i++) { ctx.beginPath(); ctx.arc(0, 0, Rf * 0.98, 0, TAU); ctx.fill(); }
        const a0 = (from % 60) * 6 * Math.PI / 180 - Math.PI / 2, a1 = a0 + (span % 60) * 6 * Math.PI / 180;
        if (span % 60) { ctx.beginPath(); ctx.moveTo(0, 0); ctx.arc(0, 0, Rf * 0.98, a0, a1); ctx.closePath(); ctx.fill(); }
        ctx.lineWidth = Rf * 0.05; ctx.lineCap = 'round'; ctx.strokeStyle = 'rgba(143,91,240,.7)';
        ctx.beginPath(); ctx.arc(0, 0, Rf * 0.98, a0, a0 + Math.min(span, 60 * 3) * 6 * Math.PI / 180 - 0.0001); ctx.stroke();
      }
    }
    // 提示：分鐘扇形 + 短針經過的數字
    if (hint && hint.minute) {
      const m = mod(C.disp, 60);
      ctx.fillStyle = 'rgba(47,143,232,.14)';
      ctx.beginPath(); ctx.moveTo(0, 0); ctx.arc(0, 0, Rf * 0.97, -Math.PI / 2, -Math.PI / 2 + m * 6 * Math.PI / 180); ctx.closePath(); ctx.fill();
    }
    if (hint && hint.hour) {
      const hp = mod(C.disp / 60, 12), n = Math.floor(hp) || 12;
      const a = n * 30 * Math.PI / 180;
      ctx.lineWidth = Rf * 0.035; ctx.strokeStyle = 'rgba(255,95,69,' + (0.5 + 0.5 * pulse).toFixed(2) + ')';
      ctx.beginPath(); ctx.arc(Math.sin(a) * Rf * 0.69, -Math.cos(a) * Rf * 0.69, Rf * 0.15, 0, TAU); ctx.stroke();
    }
    // 目標指針影子（拖曳第二次錯時）
    if (hint && hint.ghost != null) {
      const ga = T.anglesOf(hint.ghost);
      ctx.setLineDash([6, 6]);
      drawHand(ctx, ga.minute, Rf * 0.8, Rf * 0.06, '#9cd0ff', '#2f8fe8', 0, 0.55);
      drawHand(ctx, ga.hour, Rf * 0.52, Rf * 0.09, '#ffb3a6', '#ff5f45', 0, 0.55);
      ctx.setLineDash([]);
    }
    // 上午/下午 標籤（畫在指針下面）
    if (C.badge) drawBadge(ctx, C.badge, 0, -Rf * 0.33, Rf);
    // 指針
    const hA = mod(C.disp / 60, 12) * 30, mA = mod(C.disp, 60) * 6;
    const hg = (hint && hint.hour ? pulse : 0) + (C.grab === 'hour' ? 1 : 0);
    const mg = (hint && hint.minute ? pulse : 0) + (C.grab === 'minute' ? 1 : 0);
    ctx.save(); ctx.translate(Rf * 0.025, Rf * 0.04); ctx.globalAlpha = 0.18;
    drawHand(ctx, hA, Rf * 0.52, Rf * 0.1, '#000', 'rgba(0,0,0,0)', 0);
    drawHand(ctx, mA, Rf * 0.8, Rf * 0.066, '#000', 'rgba(0,0,0,0)', 0);
    ctx.restore();
    drawHand(ctx, hA, Rf * 0.52, Rf * 0.1, '#ff5f45', '#a8301c', hg);
    drawHand(ctx, mA, Rf * 0.8, Rf * 0.066, '#2f8fe8', '#17558f', mg);
    // 中心
    ctx.fillStyle = '#ffd65c'; ctx.strokeStyle = '#b9790c'; ctx.lineWidth = Rf * 0.025;
    ctx.beginPath(); ctx.arc(0, 0, Rf * 0.07, 0, TAU); ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(-Rf * 0.02, -Rf * 0.02, Rf * 0.022, 0, TAU); ctx.fill();
    // 提示文字標籤
    if (hint && hint.labels) {
      const fs = Math.max(12, Rf * 0.1);
      ctx.font = '900 ' + fs + 'px ' + getComputedStyle(document.body).fontFamily;
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      // 標籤放在離另一根針比較遠的那一側，避免蓋住指針
      const best = (deg, r, text, otherDeg, otherLen) => {
        const a = tagPos(ctx, deg, r, text, fs, 1), b2 = tagPos(ctx, deg, r, text, fs, -1);
        return segDist(a.x, a.y, otherDeg, otherLen) >= segDist(b2.x, b2.y, otherDeg, otherLen) ? a : b2;
      };
      let th = hint.hour && hint.hourText ? best(hA, Rf * 0.26, hint.hourText, mA, Rf * 0.8) : null;
      const tm = hint.minute && hint.minText ? best(mA, Rf * 0.5, hint.minText, hA, Rf * 0.52) : null;
      const hit = () => th && tm && Math.abs(th.x - tm.x) < (th.w + tm.w) / 2 + 4 && Math.abs(th.y - tm.y) < th.h + 4;
      if (hit()) th = tagPos(ctx, hA, Rf * 0.26, hint.hourText, fs, -Math.sign(th.side));
      if (hit()) th.y = tm.y + (th.y >= tm.y ? 1 : -1) * (th.h + 6);
      if (th) tag(ctx, th, hint.hourText, '#ff5f45', fs);
      if (tm) tag(ctx, tm, hint.minText, '#2f8fe8', fs);
    }
  }
  function tagPos(g, deg, r, text, fs, side) {
    const a = deg * Math.PI / 180;
    // 標籤放在指針旁邊一點，避免擋住指針
    const off = fs * 1.25 * side;
    let x = Math.sin(a) * r + Math.cos(a) * off, y = -Math.cos(a) * r + Math.sin(a) * off;
    const w = g.measureText(text).width + fs, h = fs * 1.5;
    const lim = C.Rf * 0.98 - w / 2;
    x = Math.max(-lim, Math.min(lim, x)); y = Math.max(-C.Rf * 0.9, Math.min(C.Rf * 0.9, y));
    return { x, y, w, h, side };
  }
  function tag(g, t, text, col, fs) {
    const { x, y, w, h } = t;
    g.fillStyle = '#fff'; g.strokeStyle = col; g.lineWidth = 3;
    Kit.roundRect(g, x - w / 2, y - h / 2, w, h, h / 2); g.fill(); g.stroke();
    g.fillStyle = col; g.fillText(text, x, y + fs * 0.05);
  }
  function drawBadge(g, per, x, y, Rf) {
    const night = per === '晚上' || per === '半夜';
    const fs = Math.max(12, Rf * 0.12);
    g.font = '900 ' + fs + 'px ' + getComputedStyle(document.body).fontFamily;
    g.textAlign = 'center'; g.textBaseline = 'middle';
    const w = g.measureText(per).width + fs * 2.4, h = fs * 1.6;
    g.fillStyle = night ? '#3b3f8f' : '#fff3b0'; g.strokeStyle = night ? '#23265e' : '#e0a21a'; g.lineWidth = 3;
    Kit.roundRect(g, x - w / 2, y - h / 2, w, h, h / 2); g.fill(); g.stroke();
    const ix = x - w / 2 + fs * 0.95;
    if (night) {
      g.fillStyle = '#ffe680'; g.beginPath(); g.arc(ix, y, fs * 0.48, 0, TAU); g.fill();
      g.fillStyle = '#3b3f8f'; g.beginPath(); g.arc(ix + fs * 0.22, y - fs * 0.14, fs * 0.42, 0, TAU); g.fill();
    } else {
      g.strokeStyle = '#ff9a1f'; g.lineWidth = 2;
      for (let i = 0; i < 8; i++) { const a = i * Math.PI / 4; g.beginPath(); g.moveTo(ix + Math.cos(a) * fs * 0.38, y + Math.sin(a) * fs * 0.38); g.lineTo(ix + Math.cos(a) * fs * 0.58, y + Math.sin(a) * fs * 0.58); g.stroke(); }
      g.fillStyle = '#ffb21f'; g.beginPath(); g.arc(ix, y, fs * 0.3, 0, TAU); g.fill();
    }
    g.fillStyle = night ? '#fff' : '#8a4a12';
    g.fillText(per, x + fs * 0.45, y + fs * 0.05);
  }

  function setClock(total, animate, dur) {
    C.target = total;
    if (animate) {
      C.anim = { from: C.disp, to: total, t: 0, dur: dur || 0.7 };
    } else { C.anim = null; C.disp = total; }
    C.dirty = true;
    updateReadout();
  }
  // 最短路徑轉到下一題的時間（看起來像撥時鐘）
  function spinTo(total) {
    let from = C.disp, d = mod(total - from, 720);
    if (d > 360) d -= 720;
    C.disp = from;
    C.target = total;
    C.anim = { from, to: from + d, t: 0, dur: 0.6, fin: total };
    C.dirty = true;
  }

  let lastT = performance.now();
  function frame(now) {
    const dt = Math.min(0.05, (now - lastT) / 1000); lastT = now;
    if (C.anim) {
      const a = C.anim;
      a.t += dt / a.dur;
      if (a.t >= 1) { C.disp = a.fin != null ? a.fin : a.to; C.anim = null; if (a.done) a.done(); }
      else C.disp = a.from + (a.to - a.from) * Kit.E.inOut(a.t);
      C.dirty = true;
    }
    if (C.hint && (C.hint.hour || C.hint.minute)) C.dirty = true;
    if (C.dirty && !document.hidden) { C.dirty = false; drawClock(now); }
    requestAnimationFrame(frame);
  }

  /* ---------- 拖曳指針 ---------- */
  let canDrag = false, ptr = null;
  function localPt(e) {
    const r = cv.getBoundingClientRect();
    return { x: (e.clientX - r.left) * C.S / r.width, y: (e.clientY - r.top) * C.S / r.height };
  }
  function segDist(px, py, deg, len) {
    const a = deg * Math.PI / 180, tx = Math.sin(a) * len, ty = -Math.cos(a) * len;
    const L2 = tx * tx + ty * ty;
    let t = (px * tx + py * ty) / L2; t = Math.max(0, Math.min(1, t));
    return Math.hypot(px - tx * t, py - ty * t);
  }
  // 選最近的指針：不論點在哪裡都會抓到其中一根
  function pickHand(x, y) {
    const px = x - C.cx, py = y - C.cy;
    const an = T.anglesOf(C.target);
    const dh = segDist(px, py, an.hour, C.Rf * 0.52);
    const dm = segDist(px, py, an.minute, C.Rf * 0.8);
    // 兩根針重疊時：靠近中心抓短針，外圈抓長針（長針外面那段一定抓得到）
    if (Math.abs(dh - dm) < C.Rf * 0.12) return Math.hypot(px, py) < C.Rf * 0.56 ? 'hour' : 'minute';
    return dh < dm ? 'hour' : 'minute';
  }
  box.addEventListener('pointerdown', e => {
    if (e.target.closest('#lblBtn')) return;
    e.preventDefault();
    const p = localPt(e);
    ptr = { id: e.pointerId, sx: e.clientX, sy: e.clientY, moved: false, t: performance.now(), hand: canDrag ? pickHand(p.x, p.y) : null };
    try { box.setPointerCapture(e.pointerId); } catch (er) { /* 忽略 */ }
    if (ptr.hand) { C.grab = ptr.hand; C.dirty = true; box.classList.add('dragging'); KG.note(ptr.hand === 'hour' ? 520 : 780, 0.06, 'triangle', 0.12); }
  });
  box.addEventListener('pointermove', e => {
    if (!ptr || e.pointerId !== ptr.id) return;
    if (!ptr.moved && Math.hypot(e.clientX - ptr.sx, e.clientY - ptr.sy) < 7) return;
    ptr.moved = true;
    if (!ptr.hand) return;
    const p = localPt(e);
    if (Math.hypot(p.x - C.cx, p.y - C.cy) < C.Rf * 0.08) return; // 太靠中心角度不穩
    const deg = T.pointerAngle(p.x, p.y, C.cx, C.cy);
    const nt = ptr.hand === 'minute' ? T.dragMinute(C.target, deg, game.snap) : T.dragHour(C.target, deg);
    if (nt !== C.target) {
      const crossed = ptr.hand === 'minute' && Math.floor(nt / 60) !== Math.floor(C.target / 60);
      setClock(nt, false);
      KG.note(crossed ? 1500 : 1150, 0.03, 'square', crossed ? 0.08 : 0.05);
      onHandsMoved();
    }
  });
  function endPtr(e) {
    if (!ptr || e.pointerId !== ptr.id) return;
    const tap = !ptr.moved && performance.now() - ptr.t < 600;
    const was = ptr.hand;
    ptr = null; C.grab = null; C.dirty = true; box.classList.remove('dragging');
    if (tap) onClockTap();
    else if (was) onHandsReleased();
  }
  box.addEventListener('pointerup', endPtr);
  box.addEventListener('pointercancel', endPtr);

  $('lblBtn').addEventListener('click', e => {
    e.stopPropagation();
    showLabels = !showLabels;
    KG.store.set('clock-learn:labels', showLabels);
    $('lblBtn').classList.toggle('on', showLabels);
    KG.sound('click');
    drawFace(); C.dirty = true;
  });
  $('lblBtn').classList.toggle('on', showLabels);

  /* =====================================================================
   * 貓頭鷹老師（SVG）
   * ===================================================================== */

  function genLife(lv, prev, qi) {
    const ok = SCENE_IDS.filter(id => { const s = SCENES[id]; const step = [60, 30, 15, 5, 1][lv]; return Math.floor(s.to / step) * step >= s.from || lv >= 2; });
    let id, guard = 0;
    do { id = KG.pick(ok); } while (prev && prev.scene === id && guard++ < 20);
    const sc = SCENES[id];
    const t24 = lifeTime(sc, lv);
    const total = mod(t24, 720);
    const per = T.period(t24);
    const pickPic = qi % 2 === 0;
    if (pickPic) {
      // 選圖：干擾圖的時間要離答案夠遠
      const far = SCENE_IDS.filter(o => o !== id && (SCENES[o].from - t24 > 100 || t24 - SCENES[o].to > 100));
      const ds = KG.shuffle(far).slice(0, 2);
      const opts = KG.shuffle([id, ...ds]);
      return { kind: 'lifePic', scene: id, total, t24, per, opts, ans: opts.indexOf(id) };
    }
    // 選時間（含上午／下午）
    const h = Math.floor(t24 / 60), m = t24 % 60;
    const key = v => T.cn(v, T.period(v));
    let cands;
    if (lv < 2) cands = [mod(t24 + 60, 1440), mod(t24 - 60, 1440), mod(t24 + 120, 1440)].filter(v => T.period(v) === per || lv > 0);
    else cands = KG.shuffle([mod(t24 + 720, 1440), mod(t24 + 60, 1440), mod(t24 + 780, 1440), mod(t24 - 60, 1440)]);
    const n = lv < 2 ? 3 : 4;
    const opts = uniqueOpts(t24, cands, n, key, () => mod(R(5, 22) * 60 + m, 1440));
    return { kind: 'lifeTime', scene: id, total, t24, per, opts, ans: opts.indexOf(t24), h, m };
  }
  function genPass(lv, prev) {
    let s, d, guard = 0;
    do {
      if (lv === 0) { s = R(0, 11) * 60; d = 60; }
      else if (lv === 1) { s = R(0, 11) * 60 + KG.pick([0, 30]); d = 30; }
      else if (lv === 2) { s = R(0, 11) * 60 + KG.pick([0, 30]); d = KG.pick([60, 120, 180, 30]); }
      else if (lv === 3) { s = R(0, 11) * 60 + KG.pick([0, 15, 30, 45]); d = KG.pick([15, 45, 15, 30]); }
      else { s = R(0, 11) * 60 + KG.pick([0, 15, 30, 45, 0, 30]); d = KG.pick([15, 30, 45, 60, 90, 120]); }
    } while (prev && prev.s === s && prev.d === d && guard++ < 20);
    const e = mod(s + d, 720);
    if (lv === 4) {
      const cands = KG.shuffle([d + 15, d - 15, d + 30, d - 30, d + 60, d * 2, d - 60].filter(v => v > 0 && v <= 240));
      const opts = uniqueOpts(d, cands, 4, v => v, () => KG.pick([15, 30, 45, 60, 75, 90, 105, 120, 150, 180]));
      return { kind: 'passDur', s, d, e, total: s, opts, ans: opts.indexOf(d) };
    }
    const cands = KG.shuffle([s, mod(s + d + 60, 720), mod(s + d - 60, 720), mod(s - d, 720), mod(s + d + 30, 720), mod(s + d - 30, 720), mod(s + 2 * d, 720)]);
    const n = lv < 2 ? 3 : 4;
    const opts = uniqueOpts(e, cands, n, v => v, () => mod(s + R(1, 8) * 15, 720));
    return { kind: 'pass', s, d, e, total: s, opts, ans: opts.indexOf(e) };
  }
  const GEN = { read: genRead, drag: genDrag, life: genLife, pass: genPass };

  /* =====================================================================
   * 遊戲流程
   * ===================================================================== */
  const game = { timer: 0, mode: 'title', act: 0, lv: 0, qi: 0, first: 0, wrong: 0, busy: true, q: null, snap: 5, answered: false, stars: 0 };
  const app = $('app'), opts = $('opts'), btxt = $('btxt');

  function setBubble(html, pic) {
    const b = $('bubble');
    btxt.innerHTML = html;
    const old = b.querySelector('.pic'); if (old) old.remove();
    if (pic) { const d = document.createElement('div'); d.className = 'pic'; d.innerHTML = pic; b.insertBefore(d, $('sayBtn')); }
    b.style.animation = 'none'; void b.offsetWidth; b.style.animation = '';
  }
  const tg = (s, big) => `<span class="tg${big ? ' big' : ''}">${s}</span>`;

  function digitalHTML(total) { const h = T.h12(total), m = T.mm(total); return `<b>${h}</b>:<u>${String(m).padStart(2, '0')}</u>`; }

  function renderQ() {
    const q = game.q, A = ACTS[game.act].id;
    game.answered = false; game.wrong = 0;
    C.hint = null; C.badge = null;
    opts.innerHTML = ''; opts.className = ''; opts.style.removeProperty('--n'); delete opts.dataset.wide;
    $('progBar').style.width = (game.qi / QN * 100) + '%';
    canDrag = false;
    $('readout').style.display = 'none';
    if (A === 'read') {
      setBubble('時鐘上是幾點呢？');
      spinTo(q.total);
      buildTimeOpts(q.opts.map(v => ({ total: v })), game.lv < 2);
    } else if (A === 'drag') {
      setBubble(`請撥到 ${tg(T.cn(q.total), true)}`);
      spinTo(q.start);
      canDrag = true; game.snap = SNAP[game.lv];
      $('readout').style.display = 'block'; updateReadout();
      opts.style.setProperty('--n', 1);
      const ok = document.createElement('button');
      ok.className = 'bigok'; ok.id = 'okBtn';
      ok.innerHTML = '<svg viewBox="0 0 100 100"><use href="#ic-check"/></svg>好了！';
      // 拖完指針後，手機有時第一下點按鈕不會產生 click；改在放開手指時就送出，並忽略隨後重複的 click
      let upAt = 0, downOn = false;
      ok.addEventListener('pointerdown', () => { downOn = true; });
      ok.addEventListener('pointerleave', () => { downOn = false; });
      ok.addEventListener('pointerup', () => { if (!downOn) return; downOn = false; upAt = performance.now(); checkDrag(); });
      ok.addEventListener('click', () => { if (performance.now() - upAt < 700) return; checkDrag(); });
      opts.appendChild(ok);
    } else if (A === 'life') {
      spinTo(q.total);
      if (q.kind === 'lifePic') {
        C.badge = q.per;
        setBubble(`${tg(q.per)}的這個時間，在做什麼？`);
        opts.style.setProperty('--n', 3);
        q.opts.forEach((id, i) => addOpt(`<div class="pic">${sceneSVG(id)}</div><div class="cn">${SCENES[id].name}</div>`, i, 'picopt'));
      } else {
        setBubble(`${tg(SCENES[q.scene].name)}是幾點？`, sceneSVG(q.scene));
        buildTimeOpts(q.opts.map(v => ({ total: mod(v, 720), per: T.period(v) })), false);
      }
    } else {
      spinTo(q.s);
      if (q.kind === 'passDur') {
        setBubble(`從 ${tg(T.cn(q.s))} 到 ${tg(T.cn(q.e))}，過了多久？`);
        opts.className = 'c2';
        q.opts.forEach((d, i) => addOpt(`<div class="cn" style="font-size:clamp(20px,5.6vw,26px);color:#5b3413">${T.dur(d)}</div>`, i, 'only'));
      } else {
        setBubble(`現在是 ${tg(T.cn(q.s))}，過了 ${tg(T.dur(q.d), true)}，是幾點？`);
        buildTimeOpts(q.opts.map(v => ({ total: v })), game.lv < 2);
      }
    }
    layout();
    setTimeout(sayQ, 350);
    game.busy = false;
  }
  function optCls() {
    const n = opts.querySelectorAll('.opt').length;
    if (opts.dataset.wide) return 'c2';
    if (n === 4) return isLand() || app.clientWidth < 520 ? 'c2' : '';
    return opts.className;
  }
  function buildTimeOpts(list, textOnly) {
    opts.style.setProperty('--n', list.length);
    if (list.some(o => o.per)) opts.dataset.wide = '1';
    list.forEach((o, i) => {
      const cn = T.cn(o.total, o.per);
      if (textOnly || o.per) addOpt(`<div class="cn">${cn}</div>`, i, 'only');
      else addOpt(`<div class="dg">${digitalHTML(o.total)}</div><div class="cn">${cn}</div>`, i);
    });
    opts.className = optCls();
  }
  function addOpt(html, i, cls) {
    const b = document.createElement('button');
    b.className = 'opt ' + (cls || '');
    b.style.animationDelay = (0.05 + i * 0.08) + 's';
    b.innerHTML = `<span class="key">${i + 1}</span>` + html;
    b.addEventListener('click', () => answer(i));
    opts.appendChild(b);
    setTimeout(() => KG.note(520 + i * 140, 0.07, 'sine', 0.1), 80 + i * 80);
  }
  const isLand = () => app.classList.contains('land');

  function sayQ() {
    const q = game.q; if (!q || game.mode !== 'play') return;
    const A = ACTS[game.act].id;
    owlMood('talk', 1100);
    if (A === 'read') KG.say('時鐘上是幾點呢？');
    else if (A === 'drag') KG.say('請撥到' + T.say(q.total));
    else if (q.kind === 'lifePic') KG.say(q.per + '的這個時間，在做什麼呢？');
    else if (q.kind === 'lifeTime') KG.say(SCENES[q.scene].name + '是幾點呢？');
    else if (q.kind === 'passDur') KG.say('從' + T.say(q.s) + '到' + T.say(q.e) + '，過了多久？');
    else KG.say('現在是' + T.say(q.s) + '，過了' + T.durSay(q.d) + '，是幾點？');
  }
  $('sayBtn').addEventListener('click', () => { KG.sound('click'); sayQ(); });

  function onClockTap() {
    if (game.mode === 'free' || (game.mode === 'play' && (canDrag || game.answered))) {
      speakTime();
    } else if (game.mode === 'play') { KG.sound('boing'); box.classList.remove('pop'); void box.offsetWidth; box.classList.add('pop'); sayQ(); }
  }
  function speakTime() {
    KG.say(T.say(C.target, C.badge || ''));
    box.classList.remove('pop'); void box.offsetWidth; box.classList.add('pop');
    KG.sound('tick');
  }
  function onHandsMoved() { updateReadout(); if (game.mode === 'play' && C.hint && C.hint.ghost == null) C.hint = null; }
  function onHandsReleased() { if (game.mode === 'free') KG.say(T.say(C.target)); }
  function updateReadout() {
    const ro = $('readout');
    if (ro.style.display === 'none') return;
    ro.innerHTML = `${digitalHTML(C.target).replace(/<b>/, '<b style="color:#ff5f45">').replace(/<u>/, '<u style="text-decoration:none;color:#2f8fe8">')}<small>${T.cn(C.target)}</small>`;
  }

  /* ---------- 作答 ---------- */
  function answer(i) {
    if (game.busy || game.mode !== 'play' || game.answered) return false;
    const q = game.q;
    if (q.kind === 'drag') return false;
    const btn = opts.children[i];
    if (!btn || btn.classList.contains('bad')) return false;
    if (i === q.ans) { btn.classList.add('ok'); right(btn); return true; }
    btn.classList.add('bad'); wrongAns(); return false;
  }
  function checkDrag() {
    if (game.busy || game.mode !== 'play' || game.answered) return false;
    const q = game.q;
    if (mod(C.target, 720) === mod(q.total, 720)) { right($('okBtn')); return true; }
    const mOk = T.mm(C.target) === T.mm(q.total), hOk = T.h12(C.target) === T.h12(q.total);
    game.wrong++;
    let msg, say;
    if (mOk && !hOk) { msg = `長針對了！短針要靠近 ${tg(T.h12(q.total))}`; say = '長針對了！短針再看看喔，' + hourHintSay(q.total); }
    else if (hOk && !mOk) { msg = `短針對了！長針要指到 ${tg(minuteWhere(q.total))}`; say = '短針對了！長針要指到' + minuteWhereSay(q.total); }
    else { msg = `短針管「幾點」，長針管「幾分」`; say = '短針是幾點，長針是幾分，再試試看！'; }
    if (game.wrong >= 2) { C.hint = { ghost: q.total }; msg += '<br>照著虛線撥撥看！'; }
    setBubble(msg);
    wrongFx();
    KG.say(say);
    return false;
  }
  function minuteWhere(total) { const m = T.mm(total); return m === 0 ? '12' : m % 5 === 0 ? String(m / 5) : `${m} 分的位置`; }
  function minuteWhereSay(total) { const m = T.mm(total); return m === 0 ? '十二' : m % 5 === 0 ? cnNum(m / 5) : cnNum(m) + '分的位置'; }
  function hourHintSay(total) {
    const h = T.h12(total), m = T.mm(total);
    return m === 0 ? '短針指著' + cnNum(h) : '短針在' + cnNum(h) + '和' + cnNum(h % 12 + 1) + '的中間';
  }
  function wrongFx() {
    owlMood('oops', 1000);
    KG.note(392, 0.2, 'sine', 0.16); KG.note(311, 0.3, 'sine', 0.16, 0.16);
    box.classList.remove('no'); void box.offsetWidth; box.classList.add('no');
    KG.vibrate(30);
  }
  function wrongAns() {
    game.wrong++;
    const q = game.q;
    wrongFx();
    const h = T.h12(q.total), m = T.mm(q.total);
    if (q.kind === 'pass' || q.kind === 'passDur') {
      C.hint = { minute: true, hour: true };
      setBubble('長針走一圈是 1 小時，走半圈是 30 分鐘喔！');
      KG.say('長針走一圈是一小時，走半圈是三十分鐘喔！');
      return;
    }
    if (q.kind === 'lifePic') {
      setBubble(`看看時鐘：${tg(q.per)} ${tg(T.cn(q.total))}，通常在做什麼？`);
      KG.say('看看時鐘，' + T.say(q.total, q.per) + '，通常在做什麼呢？');
      C.hint = { hour: true, minute: m !== 0, labels: true, hourText: '短針', minText: '長針' };
      return;
    }
    const hourText = m === 0 ? `${h} 點` : `${h} 點多`;
    const minText = m === 0 ? '整點' : m === 30 ? '30 分（半）' : `${m} 分`;
    C.hint = { hour: true, minute: true, labels: true, hourText, minText };
    let msg = m === 0 ? `紅色短針指著 ${tg(h)}，長針指著 ${tg(12)}，是「整點」！`
      : `紅色短針過了 ${tg(h)}，是 ${tg(h + ' 點多')}；藍色長針是 ${tg(m === 30 ? '半' : m + ' 分')}`;
    if (q.kind === 'lifeTime') msg += `<br>${tg(SCENES[q.scene].name)}是${tg(q.per)}喔！`;
    setBubble(msg);
    KG.say(m === 0 ? `短針指著${cnNum(h)}，長針指著十二，是${T.say(q.total)}。` : `${hourHintSay(q.total)}，是${h === 2 ? '兩' : cnNum(h)}點多。長針是${m === 30 ? '半' : cnNum(m) + '分'}。` + (q.kind === 'lifeTime' ? SCENES[q.scene].name + '是' + q.per + '喔！' : ''));
  }

  function right(btn) {
    game.answered = true; game.busy = true;
    const q = game.q;
    if (game.wrong === 0) game.first++;
    $('hudS').textContent = game.first;
    Kit.bump($('chipS'));
    canDrag = false;
    owlMood('happy', 1400);
    KG.sound('correct'); setTimeout(() => KG.sound('sparkle'), 140);
    KG.vibrate(15);
    const r = (btn || cv).getBoundingClientRect();
    Kit.FX.burst(r.left + r.width / 2, r.top + r.height / 2, { n: 18, types: ['star', 'spark', 'heart'], colors: ['#ffd34d', '#ff9a3c', '#6cc4ff', '#ff7eb0'], speed: 380 });
    const cr = cv.getBoundingClientRect();
    if (game.wrong === 0) Kit.floatText(cr.left + cr.width / 2, cr.top + cr.height * 0.3, '+1', '#ffd34d', '#b4531a');
    Kit.callout(game.wrong ? '答對了！' : KG.pick(Kit.PRAISE), '#ffd34d', '#b4531a');

      C.anim = { from: q.s, to: q.s + q.d, t: 0, dur: Math.min(2.2, 0.8 + q.d / 60 * 0.6), fin: q.s + q.d };
      C.target = mod(q.e, 720);
      wait = 1000 + C.anim.dur * 1000;
      setBubble(`${tg(T.cn(q.s))} 過了 ${tg(T.dur(q.d))} → ${tg(T.cn(q.e), true)}`);

      const per = q.kind === 'lifeTime' || q.kind === 'lifePic' ? q.per : '';
      setBubble(`答對了！是 ${tg(T.cn(q.total, per), true)}` + (q.scene ? ` ${tg(SCENES[q.scene].name)}` : ''));
      KG.say('答對了！' + T.say(q.total, per) + (q.scene ? '，' + SCENES[q.scene].name : ''));

  }
  function next() {
    if (game.mode !== 'play') return;
    game.qi++;
    if (game.qi >= QN) return finish();
    game.q = GEN[ACTS[game.act].id](game.lv, game.q, game.qi);
    renderQ();
  }
  function finish() {
    game.busy = true; game.mode = 'result';
    $('progBar').style.width = '100%';
    const s = game.first >= QN - 1 ? 3 : game.first >= QN - 3 ? 2 : 1;
    game.stars = s;

    PROG[game.act].set(game.lv, s);
    const after = totalStars();
    const newSt = STICKERS.filter(st => st.need > before && st.need <= after);
    KG.best('clock-learn:stars', after);
    owlMood('happy', 2500);
    KG.say(s === 3 ? '太完美了！你是時鐘小達人！' : s === 2 ? '好棒喔！' : '過關了！再練習會更厲害喔！');
    const act = game.act, lv = game.lv;

      if (game.mode !== 'result') return;

        stars: s,
        message: `${ACTS[act].name}・${ACTS[act].levels[lv]}<br>一次就答對 ${game.first} / ${QN} 題！`,
        hero: owlSVG('r'),
        unlock: newSt.length ? `得到新貼紙：${newSt.map(x => x.name).join('、')}！` : null,
        unlockIcon: newSt.length ? stickerSVG(newSt[newSt.length - 1], 'u') : null,
        onNext: lv < 4 ? () => startLevel(act, lv + 1) : null,
        onReplay: () => startLevel(act, lv),
        onMenu: () => showLevels(act)
      });
      if (newSt.length) setTimeout(() => KG.say('得到新貼紙，' + newSt.map(x => x.name).join('、')), 1800);
    }, 900);
  }

  function showGame(on) {
    app.style.visibility = on ? '' : 'hidden';
    $('hud').style.display = on && game.mode === 'play' ? '' : 'none';
    $('pauseBtn').style.display = on ? 'block' : 'none';
  }
  function startLevel(a, lv) {
    closeScreens();
    game.mode = 'play'; game.act = a; game.lv = lv; game.qi = 0; game.first = 0;
    $('hudS').textContent = '0';

    $('lblBtn').style.display = '';

    Kit.Music.start(Kit.SONGS[ACTS[a].song]);
    game.q = GEN[ACTS[a].id](lv, null, 0);

    Kit.callout(ACTS[a].levels[lv], '#8ee6ff', '#2268a3');

  }

  /* ---------- 時鐘遊樂場（自由撥） ---------- */
  function startFree() {
    closeScreens();
    game.mode = 'free'; game.busy = false; game.snap = 1;
    showGame(true);
    C.hint = null; C.badge = null;
    canDrag = true;
    setBubble('拖拖看指針，點時鐘我會念給你聽！');
    $('readout').style.display = 'block';
    opts.innerHTML = ''; opts.className = 'c2'; opts.style.removeProperty('--n'); delete opts.dataset.wide;
    const mk = (txt, cls, fn) => { const b = document.createElement('button'); b.className = 'bigok half ' + cls; b.innerHTML = txt; b.addEventListener('click', fn); opts.appendChild(b); };
    mk('<svg viewBox="0 0 100 100"><use href="#ic-speaker"/></svg>念時間', 'blue', () => { KG.sound('click'); speakTime(); });
    mk('現在幾點', '', () => { const d = new Date(); KG.sound('pop'); spinTo((d.getHours() % 12) * 60 + d.getMinutes()); C.badge = T.period(d.getHours() * 60 + d.getMinutes()); setTimeout(() => { updateReadout(); speakTime(); }, 650); });
    const mkStep = document.createElement('button');

  /* ---------- 選單畫面 ---------- */
  let screenEl = null;
  function closeScreens() {
