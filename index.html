<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>小朋友遊戲樂園</title>
<meta name="description" content="90 個免費、免安裝、可愛的小朋友網頁遊戲，手機、平板、電腦都能玩。">
<meta name="theme-color" content="#8fd6ff">
<link rel="icon" href="assets/icons/icon.svg" type="image/svg+xml">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="遊戲樂園">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="stylesheet" href="assets/common.css">
<style>
  body {
    min-height: 100vh;
    background: linear-gradient(180deg, #8fd6ff 0%, #c6ecff 280px, #fff1f6 900px, #fff7e3 100%);
    overflow-x: hidden;
  }

  /* ---------- 頁首：天空、彩虹、雲 ---------- */
  .sky {
    position: relative;
    height: clamp(270px, 36vw, 350px);
    overflow: hidden;
  }
  .sky svg.scene { position: absolute; inset: 0; width: 100%; height: 100%; }
  .cloud { animation: drift 26s linear infinite; }
  .cloud.c2 { animation-duration: 34s; animation-delay: -12s; }
  .cloud.c3 { animation-duration: 40s; animation-delay: -25s; }
  @keyframes drift { from { transform: translateX(-260px); } to { transform: translateX(1460px); } }
  .sun { transform-origin: 1080px 70px; animation: spin 30s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .logo-wrap {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 30px 16px 40px;
    text-align: center;
  }
  .logo {
    margin: 0;
    font-size: clamp(34px, 8.6vw, 76px);
    font-weight: 900;
    line-height: 1.1;
    white-space: nowrap;
    letter-spacing: 0.02em;
  }
  .logo span {
    display: inline-block;
    color: var(--c);
    -webkit-text-stroke: 0.16em #fff;
    paint-order: stroke fill;
    filter: drop-shadow(0 0.07em 0 var(--d)) drop-shadow(0 0.12em 0.12em rgba(60, 30, 80, 0.25));
    animation: hop 2.4s ease-in-out infinite;
    animation-delay: calc(var(--i) * 0.12s);
  }
  @keyframes hop { 0%, 70%, 100% { transform: translateY(0) rotate(0); } 80% { transform: translateY(-0.14em) rotate(-4deg); } 90% { transform: translateY(0) rotate(2deg); } }
  .sub {
    margin-top: 14px;
    display: inline-block;
    background: rgba(255, 255, 255, 0.92);
    border-radius: 999px;
    padding: 7px 18px;
    font-size: clamp(14px, 3.6vw, 18px);
    font-weight: 800;
    box-shadow: 0 4px 0 rgba(74, 59, 82, 0.12);
  }

  /* ---------- 分類、搜尋 ---------- */
  .filters {
    position: relative;
    max-width: 1200px;
    margin: -26px auto 0;
    padding: 4px 16px 6px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
  }
  .tools { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; width: 100%; }
  .search {
    position: relative;
    flex: 1 1 260px;
    max-width: 420px;
  }
  .search svg { position: absolute; left: 14px; top: 50%; width: 20px; height: 20px; transform: translateY(-50%); pointer-events: none; }
  .search input {
    width: 100%;
    box-sizing: border-box;
    font-family: var(--kg-font);
    font-size: 16px;
    font-weight: 700;
    color: var(--kg-ink);
    border: 3px solid #fff;
    border-radius: 999px;
    padding: 10px 40px 10px 42px;
    background: #fff;
    box-shadow: 0 4px 0 rgba(74, 59, 82, 0.14), 0 8px 16px rgba(74, 59, 82, 0.1);
    outline: none;
    -webkit-appearance: none;
    appearance: none;
  }
  .search input:focus { border-color: #8fd6ff; }
  .search input::-webkit-search-cancel-button { display: none; }
  .search .clear {
    position: absolute; right: 8px; top: 50%; transform: translateY(-50%);
    width: 28px; height: 28px; border: none; border-radius: 50%;
    background: #eee6f5; color: #7b6d88; font-size: 15px; font-weight: 900; cursor: pointer;
  }
  .search .clear[hidden] { display: none; }
  .ages {
    display: inline-flex;
    padding: 4px;
    gap: 4px;
    border-radius: 999px;
    background: rgba(255, 255, 255, 0.9);
    border: 3px solid #fff;
    box-shadow: 0 4px 0 rgba(74, 59, 82, 0.14), 0 8px 16px rgba(74, 59, 82, 0.1);
  }
  .ages button {
    font-family: var(--kg-font);
    font-size: 15px;
    font-weight: 800;
    border: none;
    border-radius: 999px;
    padding: 7px 14px;
    background: transparent;
    color: var(--kg-ink);
    cursor: pointer;
    white-space: nowrap;
  }
  .ages button[aria-pressed="true"] { background: #4a3b52; color: #fff; }
  .chips {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    justify-content: center;
    width: 100%;
  }
  .chip {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    flex: none;
    font-family: var(--kg-font);
    font-size: 17px;
    font-weight: 800;
    border: 3px solid #fff;
    border-radius: 999px;
    padding: 8px 12px 8px 10px;
    background: #fff;
    color: var(--kg-ink);
    cursor: pointer;
    white-space: nowrap;
    box-shadow: 0 4px 0 rgba(74, 59, 82, 0.14), 0 8px 16px rgba(74, 59, 82, 0.1);
    transition: transform 0.15s cubic-bezier(0.2, 1.6, 0.4, 1);
  }
  .chip:active { transform: scale(0.94); }
  .chip i {
    width: 26px;
    height: 26px;
    border-radius: 50%;
    display: grid;
    place-items: center;
    background: var(--c);
    box-shadow: inset 0 -3px 0 rgba(0, 0, 0, 0.15);
  }
  .chip i svg { width: 16px; height: 16px; }
  .chip b {
    min-width: 22px;
    padding: 1px 6px;
    border-radius: 999px;
    background: #f1ebf6;
    font-size: 13px;
    font-weight: 900;
    text-align: center;
  }
  .chip[aria-pressed="true"] { background: var(--c); color: #fff; text-shadow: 0 2px 0 rgba(0, 0, 0, 0.18); transform: translateY(-2px); }
  .chip[aria-pressed="true"] i { background: #fff; }
  .chip[aria-pressed="true"] b { background: rgba(255, 255, 255, 0.3); text-shadow: none; }
  .chip.empty { opacity: 0.45; }

  /* ---------- 分區標題 ---------- */
  #list { max-width: 1200px; margin: 0 auto; padding: 8px 16px 40px; }
  .sec { margin-top: 18px; }
  .sec-h {
    display: flex;
    align-items: center;
    gap: 10px;
    margin: 0 4px 12px;
  }
  .sec-h i {
    width: 36px; height: 36px; border-radius: 50%;
    display: grid; place-items: center;
    background: var(--c);
    border: 3px solid #fff;
    box-shadow: 0 3px 0 var(--d);
    flex: none;
  }
  .sec-h i svg { width: 20px; height: 20px; }
  .sec-h h2 { margin: 0; font-size: 22px; font-weight: 900; white-space: nowrap; }
  .sec-h small { font-size: 14px; font-weight: 700; opacity: 0.6; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .sec-h .more {
    margin-left: auto;
    font-family: var(--kg-font);
    font-size: 14px;
    font-weight: 800;
    color: var(--d);
    background: #fff;
    border: none;
    border-radius: 999px;
    padding: 6px 12px;
    cursor: pointer;
    box-shadow: 0 3px 0 rgba(74, 59, 82, 0.12);
    white-space: nowrap;
  }
  .empty-msg {
    text-align: center;
    padding: 40px 16px;
    font-size: 18px;
    font-weight: 800;
    opacity: 0.7;
  }
  .empty-msg .kg-btn { margin-top: 14px; font-size: 16px; padding: 9px 20px; }

  /* ---------- 遊戲卡片 ---------- */
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 20px;
  }
  .game {
    position: relative;
    display: flex;
    flex-direction: column;
    text-decoration: none;
    color: inherit;
    background: #fff;
    border-radius: 26px;
    padding: 8px 8px 14px;
    box-shadow: 0 6px 0 var(--d), 0 14px 26px rgba(74, 59, 82, 0.16);
    transition: transform 0.2s cubic-bezier(0.2, 1.6, 0.4, 1), box-shadow 0.2s;
    animation: card-in 0.5s cubic-bezier(0.2, 1.4, 0.4, 1) both;
    animation-delay: calc(var(--n) * 0.025s);
  }
  @keyframes card-in { from { opacity: 0; transform: translateY(24px) scale(0.9); } to { opacity: 1; transform: none; } }
  .game:hover, .game:focus-visible { transform: translateY(-6px) rotate(-1deg); outline: none; box-shadow: 0 10px 0 var(--d), 0 20px 30px rgba(74, 59, 82, 0.2); }
  .game:active { transform: scale(0.96); }
  .thumb {
    position: relative;
    aspect-ratio: 4 / 3;
    border-radius: 20px;
    overflow: hidden;
    background: var(--c);
  }
  .thumb img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    transition: transform 0.35s ease;
  }
  .game:hover .thumb img { transform: scale(1.06); }
  .thumb::after {
    content: "";
    position: absolute;
    inset: 0;
    border-radius: 20px;
    box-shadow: inset 0 0 0 3px rgba(255, 255, 255, 0.6);
    pointer-events: none;
  }
  .play {
    position: absolute;
    right: 10px;
    bottom: 10px;
    width: 46px;
    height: 46px;
    border-radius: 50%;
    background: linear-gradient(180deg, #9be8aa, #3fb25d);
    border: 3px solid #fff;
    box-shadow: 0 4px 0 #2f8a48, 0 6px 12px rgba(0, 0, 0, 0.2);
    display: grid;
    place-items: center;
    transform: scale(0.9);
    transition: transform 0.2s cubic-bezier(0.2, 1.6, 0.4, 1);
  }
  .game:hover .play { transform: scale(1.08); }
  .play svg { width: 18px; height: 18px; margin-left: 3px; }
  .num {
    position: absolute;
    top: 10px;
    left: 10px;
    min-width: 30px;
    height: 30px;
    padding: 0 6px;
    border-radius: 999px;
    background: rgba(255, 255, 255, 0.95);
    font-size: 14px;
    font-weight: 900;
    display: grid;
    place-items: center;
    box-shadow: 0 2px 0 rgba(0, 0, 0, 0.12);
  }
  .info { padding: 10px 8px 0; display: flex; flex-direction: column; gap: 4px; }
  .info h3 { margin: 0; font-size: 21px; display: flex; align-items: center; flex-wrap: wrap; gap: 4px 8px; }
  .badges { position: absolute; top: 10px; right: 10px; display: flex; gap: 4px; }
  .badges span {
    font-size: 11.5px;
    font-weight: 900;
    line-height: 1;
    padding: 5px 7px;
    border-radius: 999px;
    color: #fff;
    background: rgba(40, 30, 60, 0.72);
    border: 2px solid rgba(255, 255, 255, 0.85);
    white-space: nowrap;
  }
  .badges .new { background: #ff4f7b; }
  .badges .b3d { background: #2f8fd8; }
  .info p { margin: 0; font-size: 14.5px; line-height: 1.45; opacity: 0.75; }
  .tag {
    font-size: 12px;
    font-weight: 800;
    padding: 3px 10px;
    border-radius: 999px;
    color: #fff;
    background: var(--c);
    white-space: nowrap;
  }

  /* ---------- 頁尾草地 ---------- */
  .ground { height: 90px; margin-top: 10px; position: relative; }
  .ground svg { position: absolute; bottom: 0; width: 100%; height: 100%; }
  footer {
    background: #7ccf6a;
    color: #fff;
    text-align: center;
    padding: 4px 16px 30px;
    font-size: 15px;
    font-weight: 700;
    text-shadow: 0 2px 0 rgba(0, 0, 0, 0.12);
  }

  @media (max-width: 520px) {
    .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
    #list { padding-top: 4px; }
    .sec-h h2 { font-size: 19px; }
    .sec-h i { width: 32px; height: 32px; }
    .sec-h .sub { display: none; }
    /* 手機：分類一排左右滑 */
    .filters { margin-top: -22px; gap: 10px; }
    .chips { flex-wrap: nowrap; justify-content: flex-start; overflow-x: auto; padding: 4px 16px 10px; margin: 0 -16px; width: calc(100% + 32px); scrollbar-width: none; -webkit-overflow-scrolling: touch; }
    .chips::-webkit-scrollbar { display: none; }
    .badges { top: 6px; right: 6px; }
    .badges span { font-size: 10.5px; padding: 4px 6px; }
    .game { border-radius: 22px; padding: 6px 6px 12px; }
    .thumb, .thumb::after { border-radius: 17px; }
    .info { padding: 8px 4px 0; }
    .info h3 { font-size: 17px; flex-wrap: wrap; gap: 4px 6px; }
    .info p { font-size: 12.5px; }
    .play { width: 36px; height: 36px; right: 6px; bottom: 6px; }
    .play svg { width: 14px; height: 14px; }
    .num { top: 6px; left: 6px; min-width: 26px; height: 26px; font-size: 12px; }
    .chip { font-size: 15px; padding: 6px 10px 6px 8px; }
    .ages button { font-size: 14px; padding: 6px 11px; }
  }
  /* ---------- 安裝成 App ---------- */
  .install {
    margin-top: 12px;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    font-family: var(--kg-font);
    font-size: 17px;
    font-weight: 900;
    color: #fff;
    border: 3px solid #fff;
    border-radius: 999px;
    padding: 9px 20px 9px 12px;
    background: linear-gradient(180deg, #5fd38a, #2b9a57);
    box-shadow: 0 5px 0 #23744a, 0 10px 20px rgba(35, 116, 74, 0.35);
    text-shadow: 0 2px 0 rgba(0, 0, 0, 0.15);
    cursor: pointer;
    animation: install-pulse 2.4s ease-in-out infinite;
  }
  .install[hidden] { display: none; }
  .install:active { transform: translateY(3px); box-shadow: 0 2px 0 #23744a; }
  .install svg { width: 26px; height: 26px; flex: none; }
  @keyframes install-pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.05); } }
  .guide {
    position: fixed;
    inset: 0;
    z-index: 9500;
    display: grid;
    place-items: center;
    padding: 16px;
    background: rgba(40, 30, 60, 0.55);
    backdrop-filter: blur(3px);
  }
  .guide[hidden] { display: none; }
  .guide-card {
    width: min(420px, 100%);
    background: #fff;
    border: 5px solid #fff;
    border-radius: 28px;
    padding: 22px 20px 20px;
    box-shadow: 0 18px 40px rgba(40, 30, 60, 0.35);
    animation: kg-pop 0.3s cubic-bezier(0.2, 1.6, 0.4, 1);
  }
  .guide-card h2 { margin: 0 0 6px; font-size: 24px; text-align: center; }
  .guide-card .lead { margin: 0 0 14px; text-align: center; font-size: 15px; opacity: 0.75; }
  .guide-card ol { margin: 0 0 16px; padding: 0; list-style: none; counter-reset: step; }
  .guide-card li {
    counter-increment: step;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 12px;
    margin-bottom: 8px;
    border-radius: 16px;
    background: #f4f0fa;
    font-size: 16px;
    font-weight: 700;
    line-height: 1.4;
  }
  .guide-card li::before {
    content: counter(step);
    flex: none;
    width: 28px;
    height: 28px;
    border-radius: 50%;
    background: #ff8fb1;
    color: #fff;
    font-weight: 900;
    display: grid;
    place-items: center;
  }
  .guide-card li svg { width: 24px; height: 24px; flex: none; vertical-align: middle; }
  .guide-card .row { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
  .guide-card .kg-btn { font-size: 17px; padding: 10px 22px; text-decoration: none; }
  .guide-card .note { margin: -6px 0 14px; font-size: 13px; text-align: center; opacity: 0.7; }
  /* iPhone：指向瀏覽器按鈕的箭頭 */
  .pointer {
    position: fixed;
    z-index: 9600;
    pointer-events: none;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    font-weight: 900;
    font-size: 15px;
    color: #fff;
    text-shadow: 0 2px 4px rgba(0, 0, 0, 0.45);
  }
  .pointer[hidden] { display: none; }
  .pointer svg { width: 58px; height: 58px; filter: drop-shadow(0 3px 4px rgba(0, 0, 0, 0.35)); }
  .pointer span { background: #ff5f8f; border: 3px solid #fff; border-radius: 999px; padding: 6px 14px; text-shadow: none; box-shadow: 0 6px 16px rgba(0, 0, 0, 0.3); }
  .pointer.down { left: 50%; bottom: calc(6px + env(safe-area-inset-bottom)); transform: translateX(-50%); animation: ptr-down 1s ease-in-out infinite; }
  .pointer.up { right: 14px; top: calc(4px + env(safe-area-inset-top)); flex-direction: column-reverse; animation: ptr-up 1s ease-in-out infinite; }
  .pointer.up svg { transform: rotate(180deg); }
  @keyframes ptr-down { 0%, 100% { transform: translate(-50%, 0); } 50% { transform: translate(-50%, 10px); } }
  @keyframes ptr-up { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
  .ios-tip {
    position: fixed;
    left: 12px;
    right: 12px;
    bottom: calc(12px + env(safe-area-inset-bottom));
    z-index: 9400;
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 14px;
    border-radius: 20px;
    background: #fff;
    box-shadow: 0 10px 30px rgba(40, 30, 60, 0.3);
    animation: kg-pop 0.35s cubic-bezier(0.2, 1.6, 0.4, 1);
  }
  .ios-tip[hidden] { display: none; }
  .ios-tip img { width: 48px; height: 48px; border-radius: 12px; flex: none; }
  .ios-tip .t { flex: 1; font-size: 14px; font-weight: 700; line-height: 1.4; }
  .ios-tip .t b { font-size: 16px; display: block; }
  .ios-tip button { font-family: var(--kg-font); border: none; cursor: pointer; }
  .ios-tip .go { background: #3fb25d; color: #fff; font-weight: 900; font-size: 15px; padding: 9px 14px; border-radius: 999px; }
  .ios-tip .x { background: none; font-size: 22px; color: #9a8fa5; padding: 4px; }
  /* ---------- 檢查更新 ---------- */
  .hbtns { display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 8px 10px; margin-top: 12px; }
  .hbtns .install { margin-top: 0; }
  .update {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-family: var(--kg-font);
    font-size: 15px;
    font-weight: 800;
    color: #2f6f9a;
    background: rgba(255, 255, 255, 0.92);
    border: 2px solid #fff;
    border-radius: 999px;
    padding: 6px 14px 6px 10px;
    box-shadow: 0 3px 0 rgba(74, 59, 82, 0.12);
    cursor: pointer;
  }
  .update[hidden] { display: none; }
  .update svg { width: 20px; height: 20px; flex: none; }
  .update.spin svg { animation: spin 0.9s linear infinite; }
  .update:active { transform: translateY(2px); box-shadow: none; }
  .upd-bar {
    position: fixed;
    left: 50%;
    bottom: calc(14px + env(safe-area-inset-bottom));
    transform: translateX(-50%);
    z-index: 9450;
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 10px 10px 18px;
    border-radius: 999px;
    background: #4a3b52;
    color: #fff;
    font-weight: 800;
    font-size: 16px;
    white-space: nowrap;
    box-shadow: 0 10px 30px rgba(40, 30, 60, 0.35);
    animation: kg-pop 0.35s cubic-bezier(0.2, 1.6, 0.4, 1);
  }
  .upd-bar[hidden] { display: none; }
  .upd-bar button { font-family: var(--kg-font); font-size: 15px; font-weight: 900; border: none; border-radius: 999px; padding: 8px 16px; background: #3fb25d; color: #fff; cursor: pointer; }
  @media (prefers-reduced-motion: reduce) {
    .cloud, .sun, .logo span, .game, .install { animation: none; }
  }
</style>
</head>
<body data-kg-no-buttons>
<header class="sky">
  <svg class="scene" viewBox="0 0 1200 320" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
    <defs>
      <radialGradient id="sunG" cx="40%" cy="35%">
        <stop offset="0" stop-color="#fff6b0"/><stop offset="0.6" stop-color="#ffd84a"/><stop offset="1" stop-color="#ffb52e"/>
      </radialGradient>
      <linearGradient id="hillA" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#a6e57f"/><stop offset="1" stop-color="#6fc75a"/></linearGradient>
      <linearGradient id="hillB" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#c3f0a0"/><stop offset="1" stop-color="#8ad673"/></linearGradient>
      <g id="cl">
        <ellipse cx="0" cy="18" rx="78" ry="26" fill="#fff"/>
        <circle cx="-34" cy="6" r="30" fill="#fff"/><circle cx="12" cy="-6" r="40" fill="#fff"/><circle cx="48" cy="10" r="26" fill="#fff"/>
        <ellipse cx="0" cy="34" rx="70" ry="8" fill="#d9eefc" opacity=".8"/>
      </g>
    </defs>
    <!-- 彩虹 -->
    <g fill="none" stroke-width="16" opacity=".55">
      <path d="M150 330 A450 300 0 0 1 1050 330" stroke="#ff8a8a"/>

      }
      if (navigator.onLine === false) { done('沒有網路，連上網路後再試一次'); return; }
      navigator.serviceWorker.ready.then(function (reg) {
        if (!reg.active) { done('更新功能還沒準備好，請稍後再試'); return; }
        var ch = new MessageChannel();
        timer = setTimeout(function () { done('網路有點慢，請稍後再試一次'); }, 90000);
        ch.port1.onmessage = function (e) {
          var r = e.data || {};
          if (!r.checked && r.failed) done('沒有網路，連上網路後再試一次');
          else if (r.changed) done('找到新版本，正在更新…', true);
          else done('已經是最新版本了！');
        };
        reg.active.postMessage({ type: 'refresh' }, [ch.port2]);
      }).catch(function () { done('更新失敗，請稍後再試'); });
    });
  })();
</script>
</body>
