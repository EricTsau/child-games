<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>戳泡泡</title>
<link rel="stylesheet" href="../../assets/common.css">
<style>
/* ===== 遊戲外框共用樣式（標題畫面、選關、結算、HUD） ===== */
html, body { height: 100%; overflow: hidden; }
body { height: 100vh; height: 100dvh; touch-action: none; }
#game {
  position: fixed; inset: 0; width: 100vw; height: 100vh; height: 100dvh;
  display: block; touch-action: none;
}
.gk-screen {
  position: fixed; inset: 0; z-index: 8500;
  display: flex; flex-direction: column; align-items: center;
  padding: max(70px, env(safe-area-inset-top)) 16px max(18px, env(safe-area-inset-bottom));
  overflow: hidden; touch-action: none;
  animation: kg-fade .3s ease;
}
.gk-screen.out { animation: gk-out .25s ease forwards; pointer-events: none; }
@keyframes gk-out { to { opacity: 0; transform: scale(1.05); } }

/* ---- 標題 ---- */
.gk-logo {
  margin-top: min(4vh, 30px);
  font-size: clamp(44px, 13vw, 92px); font-weight: 900; line-height: 1.05;
  text-align: center; letter-spacing: 2px; white-space: nowrap;
}
.gk-logo span {
  display: inline-block; color: var(--c, #fff);
  -webkit-text-stroke: 0.09em var(--gk-dark);
  paint-order: stroke fill;
  text-shadow: 0 0.08em 0 var(--gk-dark), 0 0.16em 0.12em rgba(0,0,0,.25);
  animation: gk-letter 2.4s ease-in-out infinite;
}
@keyframes gk-letter {
  0%, 100% { transform: translateY(0) rotate(-3deg); }
  50% { transform: translateY(-0.12em) rotate(3deg); }
}
.gk-sub {
  margin-top: 10px; padding: 6px 18px; border-radius: 999px;
  background: rgba(255,255,255,.88); color: var(--gk-dark);
  font-weight: 800; font-size: clamp(15px, 4.2vw, 20px); text-align: center;
  box-shadow: 0 4px 0 rgba(0,0,0,.12);
}
.gk-spacer { flex: 1; }
.gk-play {
  position: relative;
  width: clamp(160px, 48vw, 230px); height: clamp(72px, 20vw, 92px);
  border: 5px solid #fff; border-radius: 999px; cursor: pointer;
  font: 900 clamp(28px, 8vw, 40px) var(--kg-font); color: #fff; letter-spacing: 4px;
  background: linear-gradient(180deg, var(--gk-play1, #8ff07a) 0%, var(--gk-play2, #3dbb4f) 100%);
  box-shadow: 0 8px 0 var(--gk-play3, #2a8a3a), 0 14px 26px rgba(0,0,0,.3), inset 0 4px 0 rgba(255,255,255,.45);
  text-shadow: 0 3px 0 rgba(0,0,0,.2);
  animation: gk-pulse 1.3s ease-in-out infinite;
  display: flex; align-items: center; justify-content: center; gap: 10px;
}
.gk-play svg { width: .8em; height: .8em; filter: drop-shadow(0 3px 0 rgba(0,0,0,.2)); }
.gk-play:active { transform: translateY(6px) scale(.97); box-shadow: 0 2px 0 var(--gk-play3, #2a8a3a), 0 6px 12px rgba(0,0,0,.3); animation: none; }
@keyframes gk-pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.07); } }
.gk-total {
  margin: 16px 0 6px; padding: 6px 18px; border-radius: 999px;
  background: rgba(0,0,0,.2); color: #fff; font-weight: 900; font-size: 20px;
  display: flex; align-items: center; gap: 6px;
}
.gk-total svg { width: 26px; height: 26px; }

/* ---- 選關 ---- */
.gk-levelsel { background: var(--gk-selbg, rgba(255,255,255,.25)); }
.gk-head {
  font-size: clamp(26px, 7vw, 38px); font-weight: 900; color: #fff;
  -webkit-text-stroke: 6px var(--gk-dark); paint-order: stroke fill;
  text-shadow: 0 4px 0 var(--gk-dark);
  margin: 0 0 12px; flex: none;
}
.gk-levels {
  display: grid; gap: 14px; width: min(560px, 100%);
  grid-template-columns: repeat(3, 1fr);
  overflow-y: auto; padding: 6px 4px 12px; touch-action: pan-y; flex: 0 1 auto; min-height: 0;
}
.gk-lvl {
  position: relative; aspect-ratio: 1 / 1.08;
  border: 4px solid #fff; border-radius: 24px; cursor: pointer;
  background: linear-gradient(180deg, var(--gk-card1, #fff) 0%, var(--gk-card2, #ffe6f0) 100%);
  box-shadow: 0 6px 0 var(--gk-card3, rgba(0,0,0,.18)), 0 10px 18px rgba(0,0,0,.18);
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
  font-family: var(--kg-font); color: var(--gk-dark);
  animation: kg-pop .4s cubic-bezier(.2,1.5,.4,1) both;
  padding: 4px;
}
.gk-lvl:active { transform: translateY(4px); box-shadow: 0 2px 0 var(--gk-card3, rgba(0,0,0,.18)); }
.gk-lvl .n {
  width: 2.1em; height: 2.1em; border-radius: 50%; display: grid; place-items: center;
  font-size: clamp(20px, 6vw, 30px); font-weight: 900; color: #fff;
  background: radial-gradient(circle at 35% 30%, var(--gk-a2, #ffb3cc), var(--gk-a, #ff6f9a));
  border: 3px solid #fff; box-shadow: 0 3px 0 rgba(0,0,0,.15);
  text-shadow: 0 2px 0 rgba(0,0,0,.2);
}
.gk-lvl .nm { font-size: clamp(12px, 3.4vw, 15px); font-weight: 800; text-align: center; line-height: 1.15; min-height: 1.15em; }
.gk-lvl .st { display: flex; gap: 2px; }
.gk-lvl .st svg { width: clamp(16px, 5vw, 24px); height: clamp(16px, 5vw, 24px); }
.gk-lvl.locked { filter: saturate(.25) brightness(.95); cursor: default; }
.gk-lvl.locked .n { background: radial-gradient(circle at 35% 30%, #d8d8e0, #a0a0b2); }
.gk-lvl .lock { position: absolute; right: 6px; top: 6px; width: 28px; height: 28px; }
.gk-skins {
  margin-top: 6px; width: min(560px, 100%); flex: none;
  background: rgba(255,255,255,.8); border: 4px solid #fff; border-radius: 22px;
  padding: 8px 10px 12px; box-shadow: 0 6px 16px rgba(0,0,0,.15);
}
.gk-skins h3 { margin: 0 0 6px; font-size: 16px; text-align: center; color: var(--gk-dark); }
.gk-skin-row { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
.gk-skin {
  position: relative; width: 60px; height: 60px; border-radius: 18px; cursor: pointer;
  border: 3px solid #fff; background: #fff; padding: 0;
  box-shadow: 0 4px 0 rgba(0,0,0,.15);
}
.gk-skin canvas { width: 100%; height: 100%; border-radius: 14px; display: block; }
.gk-skin.sel { border-color: var(--gk-a, #ff6f9a); box-shadow: 0 0 0 3px var(--gk-a, #ff6f9a), 0 4px 0 rgba(0,0,0,.15); }
.gk-skin.locked canvas { filter: grayscale(1) brightness(.8); opacity: .55; }
.gk-skin .req {
  position: absolute; left: 50%; bottom: -6px; transform: translateX(-50%); white-space: nowrap;
  background: var(--gk-dark); color: #fff; font-size: 12px; font-weight: 800;
  border-radius: 999px; padding: 1px 7px; display: flex; align-items: center; gap: 2px;
}
.gk-skin .req svg { width: 12px; height: 12px; }
.gk-back { margin-top: 12px; font-size: 18px; flex: none; display: inline-flex; align-items: center; gap: 6px; }
.gk-back svg { width: 22px; height: 22px; }

@media (min-aspect-ratio: 1/1) and (min-width: 640px) {
  .gk-levels { grid-template-columns: repeat(5, 1fr); width: min(860px, 100%); }
  .gk-lvl { aspect-ratio: 1 / 1; }
  .gk-skins { width: min(860px, 100%); }
}

/* ---- 結算 ---- */
.gk-result { justify-content: center; background: rgba(40, 30, 60, .45); backdrop-filter: blur(3px); }
.gk-rcard {
  position: relative; width: min(400px, 100%);
  background: linear-gradient(180deg, #fff 0%, var(--gk-card2, #fff0f6) 100%);
  border: 6px solid #fff; border-radius: 34px; padding: 46px 18px 22px; text-align: center;
  box-shadow: 0 10px 0 var(--gk-card3, rgba(0,0,0,.15)), 0 24px 50px rgba(0,0,0,.35);
  animation: kg-pop .45s cubic-bezier(.2,1.5,.4,1) both;
}
.gk-ribbon {
  position: absolute; left: 50%; top: -26px; transform: translateX(-50%);
  min-width: 78%; padding: 10px 26px; white-space: nowrap;
  font-size: clamp(22px, 6.5vw, 30px); font-weight: 900; color: #fff;
  background: linear-gradient(180deg, var(--gk-a2, #ffb3cc), var(--gk-a, #ff6f9a));
  border: 4px solid #fff; border-radius: 18px;
  box-shadow: 0 6px 0 var(--gk-dark), 0 10px 18px rgba(0,0,0,.25);
  text-shadow: 0 3px 0 rgba(0,0,0,.2);
}
.gk-bigstars { display: flex; justify-content: center; align-items: flex-end; gap: 6px; margin: 6px 0 8px; }
.gk-bigstars svg { width: 76px; height: 76px; opacity: 0; transform: scale(0); }
.gk-bigstars svg:nth-child(2) { width: 96px; height: 96px; margin-bottom: 14px; }
.gk-bigstars svg.on { animation: gk-starpop .5s cubic-bezier(.2,1.8,.4,1) forwards; }
@keyframes gk-starpop { 0% { opacity: 0; transform: scale(0) rotate(-90deg); } 100% { opacity: 1; transform: scale(1) rotate(0); } }
.gk-rcard p { margin: 4px 0; font-size: 19px; font-weight: 800; color: var(--gk-dark); }
.gk-unlock {
  margin: 12px auto 4px; padding: 8px 12px; border-radius: 18px; width: fit-content;
  background: linear-gradient(90deg, #fff4b8, #ffe0f0); border: 3px dashed var(--gk-a, #ff6f9a);
  display: flex; align-items: center; gap: 10px; font-weight: 900; color: var(--gk-dark);
  animation: kg-pop .5s .9s cubic-bezier(.2,1.6,.4,1) both;
}
.gk-unlock canvas { width: 54px; height: 54px; border-radius: 12px; background: #fff; }
.gk-actions { display: flex; gap: 10px; justify-content: center; margin-top: 16px; flex-wrap: wrap; }
.gk-actions .kg-btn { padding: 12px 18px; display: inline-flex; align-items: center; gap: 6px; }
.gk-actions .kg-btn svg { width: 22px; height: 22px; }

/* ---- HUD ---- */
.gk-hud {
  position: fixed; top: max(12px, env(safe-area-inset-top)); left: 50%; transform: translateX(-50%);
  z-index: 8000; display: flex; gap: 8px; pointer-events: none;
  max-width: calc(100vw - 140px);
}
.gk-pill {
  display: flex; align-items: center; gap: 6px;
  height: 44px; padding: 0 14px 0 6px; border-radius: 999px;
  background: linear-gradient(180deg, var(--gk-hud1, #fff) 0%, var(--gk-hud2, #ffe9f2) 100%);
  border: 3px solid var(--gk-hudb, #fff); color: var(--gk-hudt, var(--gk-dark));
  box-shadow: 0 4px 0 var(--gk-hud3, rgba(0,0,0,.18)), 0 8px 14px rgba(0,0,0,.15);
  font-weight: 900; font-size: 20px; white-space: nowrap;
  transition: transform .15s cubic-bezier(.2,1.8,.4,1);
}
.gk-pill svg { width: 32px; height: 32px; flex: none; }
.gk-pill.bump { transform: scale(1.18); }
.gk-bar { width: clamp(44px, 15vw, 110px); height: 14px; border-radius: 999px; background: rgba(0,0,0,.15); overflow: hidden; box-shadow: inset 0 2px 3px rgba(0,0,0,.15); }
.gk-bar i {
  display: block; height: 100%; width: 0%; border-radius: 999px;
  background: linear-gradient(180deg, var(--gk-bar1, #ffe27a), var(--gk-bar2, #ffb02e));
  box-shadow: inset 0 3px 0 rgba(255,255,255,.5);
  transition: width .3s ease;
}
@media (max-width: 440px) {
  .gk-hud { gap: 5px; max-width: calc(100vw - 126px); }
  .gk-pill { height: 38px; font-size: 16px; padding: 0 9px 0 4px; gap: 3px; }
  .gk-pill svg { width: 26px; height: 26px; }
  .gk-bar { width: 34px; height: 12px; }
}

/* ---- 大字提示 ---- */
.gk-callout {
  position: fixed; left: 50%; top: 30%; z-index: 8800; pointer-events: none;
  font-size: clamp(36px, 11vw, 64px); font-weight: 900; white-space: nowrap;
  color: var(--cc, #ffe066);
  -webkit-text-stroke: 0.12em var(--gk-dark); paint-order: stroke fill;
  text-shadow: 0 0.08em 0 var(--gk-dark), 0 0.18em 0.2em rgba(0,0,0,.3);
  animation: gk-call 1.2s cubic-bezier(.2,1.4,.4,1) forwards;
}
@keyframes gk-call {
  0% { transform: translate(-50%, -50%) scale(.2) rotate(-12deg); opacity: 0; }
  18% { transform: translate(-50%, -50%) scale(1.15) rotate(3deg); opacity: 1; }
  30% { transform: translate(-50%, -50%) scale(1) rotate(-2deg); }
  75% { transform: translate(-50%, -50%) scale(1) rotate(0); opacity: 1; }
  100% { transform: translate(-50%, -90%) scale(.9); opacity: 0; }
}
.gk-goal {
  position: fixed; left: 50%; top: 45%; z-index: 8700; transform: translate(-50%, -50%);
  background: #fff; border: 5px solid var(--gk-a, #ff6f9a); border-radius: 28px;
  padding: 16px 26px; text-align: center; pointer-events: none; white-space: nowrap;
  box-shadow: 0 8px 0 var(--gk-dark), 0 18px 30px rgba(0,0,0,.25);
  animation: gk-goal 2.2s ease forwards;
  color: var(--gk-dark); font-weight: 900;
}
.gk-goal b { display: block; font-size: 30px; color: var(--gk-a, #ff6f9a); }
.gk-goal span { font-size: 19px; }
@keyframes gk-goal {
  0% { transform: translate(-50%, -50%) scale(.3); opacity: 0; }
  15% { transform: translate(-50%, -50%) scale(1.08); opacity: 1; }
  25%, 80% { transform: translate(-50%, -50%) scale(1); opacity: 1; }
  100% { transform: translate(-50%, -50%) scale(.8); opacity: 0; }
}
@media (prefers-reduced-motion: reduce) {
  .gk-logo span, .gk-play { animation: none; }
}
:root {
  --gk-dark: #1d4f7a;
  --gk-a: #3fb6e8; --gk-a2: #9fe3ff;
  --gk-card1: #f4fdff; --gk-card2: #d4f3ff; --gk-card3: #7fbfe0;
  --gk-hud1: #f4fdff; --gk-hud2: #c9efff; --gk-hud3: #5aa4cf;
  --gk-play1: #ffa3c4; --gk-play2: #ff5f9a; --gk-play3: #c2386c;
  --gk-bar1: #9fe3ff; --gk-bar2: #2fa8e0;
  --gk-selbg: rgba(10, 60, 110, .25);
}
body { background: #2f8fd0; }
#game { cursor: pointer; }
</style>
</head>
<body>
<canvas id="game"></canvas>

<script src="../../assets/common.js"></script>
<script>
/* ===== 遊戲外框小工具（每個遊戲內嵌一份）：畫面、進度、音樂、特效、可愛臉部繪圖 ===== */
const GK = (function () {
  'use strict';
  const GK = {};

  /* ---------- 緩動 ---------- */
  GK.E = {
    outBack: (t) => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); },
    outElastic: (t) => t <= 0 ? 0 : t >= 1 ? 1 : Math.pow(2, -10 * t) * Math.sin((t * 10 - 0.75) * (2 * Math.PI) / 3) + 1,
    outCubic: (t) => 1 - Math.pow(1 - t, 3),
    inOutSine: (t) => -(Math.cos(Math.PI * t) - 1) / 2,
    outQuad: (t) => 1 - (1 - t) * (1 - t)
  };
  GK.clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  GK.lerp = (a, b, t) => a + (b - a) * t;

  /* ---------- SVG 圖示 ---------- */
  const STAR_PATH = 'M50 6 L62 36 L94 38 L69 59 L77 91 L50 73 L23 91 L31 59 L6 38 L38 36 Z';
  GK.svgStar = function (on) {
    return on
      ? '<svg viewBox="0 0 100 100"><path d="' + STAR_PATH + '" fill="#ffd23f" stroke="#c77d12" stroke-width="7" stroke-linejoin="round"/>' +
        '<path d="M50 20 L58 40 L44 40 Z" fill="#fff6c4" opacity=".9"/><ellipse cx="36" cy="44" rx="7" ry="4" fill="#fff" opacity=".7" transform="rotate(-30 36 44)"/></svg>'
      : '<svg viewBox="0 0 100 100"><path d="' + STAR_PATH + '" fill="#e4dcea" stroke="#b3a6bf" stroke-width="7" stroke-linejoin="round"/></svg>';
  };
  GK.icon = {
    star: GK.svgStar(true),
    lock: '<svg viewBox="0 0 40 40"><rect x="8" y="17" width="24" height="19" rx="5" fill="#ffc94a" stroke="#8a5a12" stroke-width="3"/><path d="M13 17 v-5 a7 7 0 0 1 14 0 v5" fill="none" stroke="#8a5a12" stroke-width="4"/><circle cx="20" cy="26" r="3" fill="#8a5a12"/></svg>',
    heart: '<svg viewBox="0 0 40 40"><path d="M20 35 C6 25 3 17 6 11 C9 5 17 5 20 12 C23 5 31 5 34 11 C37 17 34 25 20 35 Z" fill="#ff5a7e" stroke="#b5244a" stroke-width="3" stroke-linejoin="round"/><ellipse cx="12" cy="13" rx="3.5" ry="2.2" fill="#fff" opacity=".8" transform="rotate(-30 12 13)"/></svg>',
    heartOff: '<svg viewBox="0 0 40 40"><path d="M20 35 C6 25 3 17 6 11 C9 5 17 5 20 12 C23 5 31 5 34 11 C37 17 34 25 20 35 Z" fill="#eadfe8" stroke="#b8a8b8" stroke-width="3" stroke-linejoin="round"/></svg>',
    clock: '<svg viewBox="0 0 40 40"><circle cx="20" cy="21" r="15" fill="#fff" stroke="#4f8fe0" stroke-width="4"/><rect x="16" y="2" width="8" height="5" rx="2" fill="#4f8fe0"/><path d="M20 21 V12 M20 21 L26 25" stroke="#2c3e66" stroke-width="3.5" stroke-linecap="round"/><circle cx="20" cy="21" r="2.5" fill="#ff6f9a"/></svg>',
    play: '<svg viewBox="0 0 40 40"><path d="M10 5 L35 20 L10 35 Z" fill="#fff" stroke="#fff" stroke-width="5" stroke-linejoin="round"/></svg>',
    retry: '<svg viewBox="0 0 40 40"><path d="M31 20 A11 11 0 1 1 26 10.5" fill="none" stroke="#fff" stroke-width="5.5" stroke-linecap="round"/><path d="M22 4 L32 9 L24 17 Z" fill="#fff"/></svg>',
    grid: '<svg viewBox="0 0 40 40"><g fill="#fff"><rect x="5" y="5" width="13" height="13" rx="3"/><rect x="22" y="5" width="13" height="13" rx="3"/><rect x="5" y="22" width="13" height="13" rx="3"/><rect x="22" y="22" width="13" height="13" rx="3"/></g></svg>',
    next: '<svg viewBox="0 0 40 40"><path d="M8 20 H30 M20 9 L31 20 L20 31" fill="none" stroke="#6b4a00" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/></svg>',
    back: '<svg viewBox="0 0 40 40"><path d="M32 20 H10 M20 9 L9 20 L20 31" fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/></svg>'
  };

  /* ---------- 進度存檔（KG.store） ---------- */
  GK.Progress = function (key) {
    const k = 'gk:' + key;
    const data = KG.store.get(k, null) || {};
    data.stars = data.stars || [];
    const save = () => KG.store.set(k, data);
    return {
      stars: (i) => data.stars[i] || 0,
      setStars: (i, s) => { if (s > (data.stars[i] || 0)) { data.stars[i] = s; save(); return true; } return false; },
      total: () => data.stars.reduce((a, b) => a + (b || 0), 0),
      unlocked: (i) => i === 0 || (data.stars[i - 1] || 0) > 0,
      get: (name, d) => (data[name] == null ? d : data[name]),
      put: (name, v) => { data[name] = v; save(); }
    };
  };

  /* ---------- 背景音樂（用 KG.note 合成） ---------- */
  const NOTE_IDX = { C: 0, D: 2, E: 4, F: 5, G: 7, A: 9, B: 11 };
  function noteFreq(n) {
    const m = /^([A-G])([#b]?)(\d)$/.exec(n);
    if (!m) return 0;
    let semi = NOTE_IDX[m[1]] + (m[2] === '#' ? 1 : m[2] === 'b' ? -1 : 0) + (+m[3] + 1) * 12;
    return 440 * Math.pow(2, (semi - 69) / 12);
  }
  /**
   * song = { bpm, tracks: [{ wave, vol, notes: 'C5 E5 G5 - . A4 ...' }] }
   * 每個記號是一個八分音符；'-' 延長前一個音；'.' 休止。
   */
  GK.Music = function (song) {
    const step = 60 / song.bpm / 2;
    let len = 0;
    const events = [];
    song.tracks.forEach((tr) => {
      const toks = tr.notes.replace(/\|/g, ' ').trim().split(/\s+/);
      let cur = null;
      toks.forEach((tok, i) => {
        if (tok === '-') { if (cur) cur.d += step; return; }
        cur = null;
        if (tok === '.') return;
        cur = { t: i * step, f: noteFreq(tok), d: step, wave: tr.wave || 'triangle', vol: tr.vol || 0.05 };
        events.push(cur);
      });
      len = Math.max(len, toks.length * step);
    });
    events.sort((a, b) => a.t - b.t);
    let timer = null, t0 = 0, idx = 0, loop = 0;
    function tick() {
      const now = performance.now() / 1000;
      const horizon = now + 0.6;
      // 分頁切回來時若落後太多，直接重新對齊
      if (t0 + loop * len + (events[idx] ? events[idx].t : 0) < now - 0.5) { t0 = now; loop = 0; idx = 0; }
      for (;;) {
        const ev = events[idx];
        const at = t0 + loop * len + ev.t;
        if (at > horizon) break;
        if (at >= now - 0.05 && !KG.isMuted()) KG.note(ev.f, Math.max(0.08, ev.d * 0.95), ev.wave, ev.vol, Math.max(0, at - now));
        idx++;
        if (idx >= events.length) { idx = 0; loop++; }
      }
      timer = setTimeout(tick, 250);
    }
    return {
      start() { if (timer) return; t0 = performance.now() / 1000 + 0.15; idx = 0; loop = 0; tick(); },

  /**

    const grid = el('div', 'gk-levels');

      const open = o.prog.unlocked(i);
      const c = el('button', 'gk-lvl' + (open ? '' : ' locked'));
      c.style.animationDelay = (i * 0.05) + 's';
      let st = '';
      for (let k = 0; k < 3; k++) st += GK.svgStar(k < o.prog.stars(i));
      c.innerHTML = '<div class="n">' + (i + 1) + '</div><div class="nm">' + lv.name + '</div><div class="st">' + st + '</div>' + (open ? '' : '<div class="lock">' + GK.icon.lock + '</div>');
      c.addEventListener('click', () => {
        if (!open) { KG.sound('boing'); c.classList.remove('kg-shake'); void c.offsetWidth; c.classList.add('kg-shake'); return; }

  /* ---------- Canvas 小工具 ---------- */
  GK.fit = function (cv, ctx) {

  GK.rr = function (c, x, y, w, h, r) {

  GK.starPath = function (c, x, y, r, inner, rot) {

    c.fillStyle = fill || '#ffd23f'; c.fill();
    c.lineWidth = Math.max(1.5, r * 0.14); c.strokeStyle = 'rgba(180,100,10,.9)'; c.lineJoin = 'round'; c.stroke();
    c.fillStyle = 'rgba(255,255,255,.6)';

  GK.drawHeart = function (c, x, y, s, fill) {
    GK.heartPath(c, x, y, s);
    c.fillStyle = fill || '#ff5a7e'; c.fill();
    c.lineWidth = Math.max(1.5, s * 0.14); c.strokeStyle = 'rgba(150,30,70,.85)'; c.stroke();
    c.fillStyle = 'rgba(255,255,255,.7)';

  };
  /** 柔和的地面陰影 */

  };
  /** 光澤亮點 */

    c.fillStyle = 'rgba(255,255,255,' + (a == null ? 0.7 : a) + ')';

  };
  /** 先填色再描邊（描邊用深色而非純黑） */

    if (fill) { c.fillStyle = fill; c.fill(); }
    if (stroke) { c.lineWidth = lw; c.strokeStyle = stroke; c.lineJoin = 'round'; c.lineCap = 'round'; c.stroke(); }
  };
  GK.radial = function (c, x, y, r, c1, c2, fx, fy) {
    const g = c.createRadialGradient(x + (fx || -0.3) * r, y + (fy || -0.35) * r, r * 0.05, x, y, r);
    g.addColorStop(0, c1); g.addColorStop(1, c2);

  };
  /**
   * 可愛眼睛。mode: open | blink | happy | dizzy | sad | star | closed
   */
  GK.eye = function (c, x, y, r, mode, lookX, lookY, ink) {
    ink = ink || '#2d1f33';
    c.save();
    c.lineCap = 'round'; c.lineJoin = 'round';
    if (mode === 'blink' || mode === 'closed') {
      c.strokeStyle = ink; c.lineWidth = Math.max(1.5, r * 0.32);
      c.beginPath(); c.arc(x, y - r * 0.2, r * 0.75, 0.25, Math.PI - 0.25); c.stroke();
    } else if (mode === 'happy') {
      c.strokeStyle = ink; c.lineWidth = Math.max(1.5, r * 0.34);
      c.beginPath(); c.arc(x, y + r * 0.35, r * 0.75, Math.PI + 0.35, -0.35); c.stroke();
    } else if (mode === 'dizzy') {
      c.strokeStyle = ink; c.lineWidth = Math.max(1.2, r * 0.22);
      c.beginPath();
      for (let a = 0; a < Math.PI * 4; a += 0.3) { const rr = r * 0.9 * a / (Math.PI * 4); c.lineTo(x + Math.cos(a) * rr, y + Math.sin(a) * rr); }
      c.stroke();
    } else if (mode === 'star') {
      GK.drawStar(c, x, y, r * 1.05, 0, '#ffe14d');
    } else {
      const lx = (lookX || 0) * r * 0.18, ly = (lookY || 0) * r * 0.18;
      const g = c.createRadialGradient(x + lx, y + ly + r * 0.3, r * 0.1, x + lx, y + ly, r);
      g.addColorStop(0, '#6b4a7a'); g.addColorStop(1, ink);
      c.fillStyle = g;
      c.beginPath(); c.ellipse(x + lx, y + ly, r * 0.82, r, 0, 0, 7); c.fill();
      c.fillStyle = '#fff';
      c.beginPath(); c.arc(x + lx - r * 0.28, y + ly - r * 0.38, r * 0.34, 0, 7); c.fill();
      c.beginPath(); c.arc(x + lx + r * 0.3, y + ly + r * 0.32, r * 0.15, 0, 7); c.fill();
      if (mode === 'sad') {
        c.fillStyle = '#7fd0ff';
        c.beginPath(); c.moveTo(x + r * 0.5, y + r * 0.7); c.quadraticCurveTo(x + r * 0.95, y + r * 1.4, x + r * 0.5, y + r * 1.5);
        c.quadraticCurveTo(x + r * 0.1, y + r * 1.4, x + r * 0.5, y + r * 0.7); c.fill();
      }
    }
    c.restore();
  };
  GK.blush = function (c, x, y, r, a) {
    const g = c.createRadialGradient(x, y, 0, x, y, r);
    g.addColorStop(0, 'rgba(255,110,150,' + (a || 0.55) + ')'); g.addColorStop(1, 'rgba(255,110,150,0)');

  /** 嘴巴。mode: smile | open | o | flat | sad */
  GK.mouth = function (c, x, y, w, mode, ink) {

      c.quadraticCurveTo(x + w * 0.4, y + w * 0.8, x, y + w * 0.8); c.quadraticCurveTo(x - w * 0.4, y + w * 0.8, x - w * 0.5, y);

  /* ---------- 粒子與飄字 ---------- */
  GK.Particles = function () {
    let list = [];
    const COLORS = ['#ff6f9a', '#ffd23f', '#6cc4ff', '#7bd88f', '#b49cff', '#ffa94d'];
    return {
      get count() { return list.length; },
      clear() { list = []; },
      add(p) { list.push(Object.assign({ vx: 0, vy: 0, g: 0, drag: 1, life: 1, max: 1, size: 6, rot: 0, vr: 0, type: 'circle', color: '#fff' }, p)); },
      /** 爆開一圈：type = star | heart | circle | confetti | spark */
      burst(x, y, n, o) {
        o = o || {};
        for (let i = 0; i < n; i++) {
          const a = (o.angle != null ? o.angle : 0) + (o.spread != null ? (Math.random() - 0.5) * o.spread : Math.random() * Math.PI * 2);
          const sp = (o.speed || 220) * (0.4 + Math.random() * 0.8);
          const life = (o.life || 0.9) * (0.7 + Math.random() * 0.5);
          this.add({
            x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp + (o.up || 0), g: o.g != null ? o.g : 500, drag: o.drag || 0.985,
            life, max: life, size: (o.size || 8) * (0.6 + Math.random() * 0.7), type: o.type || 'circle',
            color: o.colors ? o.colors[i % o.colors.length] : (o.color || COLORS[i % COLORS.length]),
            rot: Math.random() * 6, vr: (Math.random() - 0.5) * 10
          });
        }
      },
      ring(x, y, r, color, life) { this.add({ x, y, size: r, type: 'ring', color: color || '#fff', life: life || 0.45, max: life || 0.45 }); },
      update(dt) {
        list.forEach((p) => {
          p.vy += p.g * dt; p.vx *= Math.pow(p.drag, dt * 60); p.vy *= Math.pow(p.drag, dt * 60);
          p.x += p.vx * dt; p.y += p.vy * dt; p.rot += p.vr * dt; p.life -= dt;
        });
        list = list.filter((p) => p.life > 0);
      },
      draw(c) {
        list.forEach((p) => {
          const k = Math.max(0, p.life / p.max);
          c.save();
          c.globalAlpha = Math.min(1, k * 1.6);
          c.translate(p.x, p.y); c.rotate(p.rot);
          const s = p.size * (p.type === 'ring' ? 1 : 0.5 + k * 0.5);
          if (p.fn) p.fn(c, s, k);
          else if (p.type === 'star') GK.drawStar(c, 0, 0, s, 0, p.color);
          else if (p.type === 'heart') GK.drawHeart(c, 0, 0, s * 0.8, p.color);
          else if (p.type === 'confetti') { c.fillStyle = p.color; c.fillRect(-s * 0.6, -s * 0.3, s * 1.2, s * 0.6); }
          else if (p.type === 'spark') {
            c.fillStyle = p.color;
            c.beginPath(); c.moveTo(0, -s); c.quadraticCurveTo(0, 0, s, 0); c.quadraticCurveTo(0, 0, 0, s); c.quadraticCurveTo(0, 0, -s, 0); c.quadraticCurveTo(0, 0, 0, -s); c.fill();
          } else if (p.type === 'ring') {
            c.strokeStyle = p.color; c.lineWidth = 5 * k;
            c.beginPath(); c.arc(0, 0, s * (1 + (1 - k) * 0.9), 0, 7); c.stroke();
          } else {
            c.fillStyle = p.color; c.beginPath(); c.arc(0, 0, s, 0, 7); c.fill();
            c.fillStyle = 'rgba(255,255,255,.55)'; c.beginPath(); c.arc(-s * 0.3, -s * 0.3, s * 0.3, 0, 7); c.fill();
          }
          c.restore();
        });
      }
    };
  };
  GK.Floaters = function (font) {
    let list = [];
    return {
      clear() { list = []; },
      add(x, y, text, color, size) { list.push({ x, y, text, color: color || '#ff5d8f', size: size || 30, life: 1 }); },
      update(dt) { list.forEach((t) => { t.y -= 55 * dt; t.life -= dt * 1.1; }); list = list.filter((t) => t.life > 0); },
      draw(c) {
        c.save();
        c.textAlign = 'center'; c.textBaseline = 'middle'; c.lineJoin = 'round';
        list.forEach((t) => {
          const k = 1 - t.life;
          const sc = k < 0.15 ? GK.E.outBack(k / 0.15) : 1;

    const nw = Math.max(5, Math.round(W / 90));
    for (let i = 0; i < nw; i++) {
      const x = (i + rnd(i + 50) * 0.8) * W / nw, h = (0.12 + rnd(i + 51) * 0.14) * H;
      c.strokeStyle = S.weed[i % 2]; c.lineWidth = 12; c.lineCap = 'round';
      c.beginPath(); c.moveTo(x, sandY + 10);
      const sw = Math.sin(clock * 1.2 + i) * 18;
      c.bezierCurveTo(x + sw, sandY - h * 0.35, x - sw, sandY - h * 0.7, x + sw * 1.4, sandY - h);
      c.stroke();
      c.strokeStyle = 'rgba(255,255,255,.18)'; c.lineWidth = 3; c.stroke();
    }
    // 沙地
    g = c.createLinearGradient(0, sandY - 20, 0, H);
    g.addColorStop(0, S.sand[0]); g.addColorStop(1, S.sand[1]);
    c.fillStyle = g;
    c.beginPath(); c.moveTo(0, H);
    for (let x = 0; x <= W + 20; x += 20) c.lineTo(x, sandY + Math.sin(x / 70) * 8);
    c.lineTo(W, H); c.fill();
    c.fillStyle = 'rgba(255,255,255,.25)';
    for (let i = 0; i < 30; i++) { c.beginPath(); c.arc(rnd(i + 70) * W, sandY + 14 + rnd(i + 71) * (H - sandY), 1.5, 0, TAU); c.fill(); }
    const nc = Math.max(3, Math.round(W / 220));
    for (let i = 0; i < nc; i++) drawCoral(c, (i + 0.3 + rnd(i + 80) * 0.4) * W / nc, sandY + 6, (0.7 + rnd(i + 81) * 0.5) * Math.min(1.2, H / 700), S.coral[i % 3]);
    // 沙上的貝殼和海星
    c.save(); c.translate(W * 0.82, sandY + 24); TREASURE.shell(c, 16); c.restore();
    c.save(); c.translate(W * 0.9, sandY + 34); c.rotate(0.3); TREASURE.star(c, 16); c.restore();
    // 暗角
    g = c.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.35, W / 2, H / 2, Math.max(W, H) * 0.75);
    g.addColorStop(0, 'rgba(0,20,60,0)'); g.addColorStop(1, 'rgba(0,20,60,' + (S.deep ? 0.45 : 0.22) + ')');
    c.fillStyle = g; c.fillRect(0, 0, W, H);
  }

  /* =====================================================================
   * 泡泡
   * ===================================================================== */
  let bubbles = [], jellies = [], flyers = [];
  function makeBubble(kind, x, y, r) {
    return {
      kind, x, y, r, t: 0,
      v: KG.rand(70, 105) * (H / 800 * 0.6 + 0.4),
      ph: Math.random() * 6, amp: KG.rand(10, 24), f: KG.rand(1.2, 2.2), hue: Math.random() * 360,
      treasure: kind === 'treasure' ? KG.pick(TREASURE_KEYS) : null,
      vx: 0, vy: 0
    };
  }
  function spawnBubble() {
    const L = LEVELS[level];
    const r0 = Math.random();
    let kind = 'plain';
    let acc = L.rainbow; if (r0 < acc) kind = 'rainbow';
    else if (r0 < (acc += L.gold)) kind = 'gold';
    else if (r0 < (acc += L.big)) kind = 'big';
    else if (r0 < (acc += L.treasure)) kind = 'treasure';
    const r = kind === 'big' ? R * 1.5 : kind === 'gold' || kind === 'rainbow' ? R * 1.0 : R * KG.rand(0.8, 1.15);
    const b = makeBubble(kind, KG.rand(r + 8, W - r - 8), H + r + 10, r);
    b.v *= L.speed * (1 + Math.min(1, elapsed / ROUND) * 0.3) * (kind === 'big' ? 0.75 : 1);
    bubbles.push(b);
    if (L.jelly && Math.random() < L.jelly && jellies.length < 2) jellies.push({ x: KG.rand(60, W - 60), y: H + 60, v: KG.rand(30, 45), t: 0, ph: Math.random() * 6, giggle: 0, s: R * 0.9 });
  }

  function drawBubble(c, b) {
    const x = b.x + Math.sin(b.t * b.f + b.ph) * b.amp;
    const wob = Math.sin(b.t * 5 + b.ph) * 0.045;
    const r = b.r * Math.min(1, GK.E.outBack(Math.min(1, b.t * 3)) * 0.7 + 0.3);
    b.cx = x;
    c.save();
    c.translate(x, b.y);
    c.scale(1 + wob, 1 - wob);
    let g = c.createRadialGradient(-r * 0.2, -r * 0.25, r * 0.1, 0, 0, r);
    if (b.kind === 'gold') { g.addColorStop(0, 'rgba(255,250,200,.55)'); g.addColorStop(0.7, 'rgba(255,215,90,.5)'); g.addColorStop(1, 'rgba(255,190,40,.9)'); }
    else if (b.kind === 'rainbow') { g.addColorStop(0, 'rgba(255,255,255,.2)'); g.addColorStop(1, 'rgba(255,200,240,.55)'); }
    else { g.addColorStop(0, 'rgba(255,255,255,.04)'); g.addColorStop(0.75, 'rgba(220,245,255,.16)'); g.addColorStop(1, 'rgba(255,255,255,.6)'); }
    c.fillStyle = g;
    c.beginPath(); c.arc(0, 0, r, 0, TAU); c.fill();
    if (b.treasure) {
      c.save(); c.rotate(Math.sin(b.t * 2 + b.ph) * 0.2); c.globalAlpha = 0.95;
      TREASURE[b.treasure](c, r * 0.72);
      c.restore();
    }
    if (b.kind === 'gold') { c.save(); c.rotate(b.t); GK.drawStar(c, 0, 0, r * 0.45, 0, '#ffe14d'); c.restore(); }
    if (b.kind === 'rainbow') {
      const cols = ['#ff6b6b', '#ffa94d', '#ffe066', '#69db7c', '#4dabf7', '#9775fa'];
      cols.forEach((col, i) => { c.strokeStyle = col; c.lineWidth = r * 0.08; c.beginPath(); c.arc(0, r * 0.3, r * (0.62 - i * 0.08), Math.PI + 0.15, -0.15); c.stroke(); });
    }
    // 彩虹邊
    let rim;
    if (hasConic) {
      rim = c.createConicGradient(b.t * 0.8 + b.hue, 0, 0);
      const cols = b.kind === 'gold'
        ? ['rgba(255,240,150,.95)', 'rgba(255,190,60,.95)', 'rgba(255,255,220,.95)', 'rgba(255,200,80,.95)', 'rgba(255,240,150,.95)']
        : ['rgba(255,150,200,.8)', 'rgba(255,230,140,.8)', 'rgba(150,255,200,.8)', 'rgba(140,200,255,.8)', 'rgba(200,150,255,.8)', 'rgba(255,150,200,.8)'];
      cols.forEach((col, i) => rim.addColorStop(i / (cols.length - 1), col));
    } else {
      rim = c.createLinearGradient(-r, -r, r, r);
      rim.addColorStop(0, 'rgba(255,150,200,.75)'); rim.addColorStop(0.5, 'rgba(150,255,220,.75)'); rim.addColorStop(1, 'rgba(160,170,255,.75)');
    }
    c.strokeStyle = rim; c.lineWidth = Math.max(2.5, r * (b.kind === 'rainbow' ? 0.12 : 0.075));
    c.beginPath(); c.arc(0, 0, r - c.lineWidth / 2, 0, TAU); c.stroke();
    c.fillStyle = 'rgba(255,255,255,.9)';
    c.beginPath(); c.ellipse(-r * 0.42, -r * 0.45, r * 0.22, r * 0.12, -0.7, 0, TAU); c.fill();
    c.beginPath(); c.arc(-r * 0.15, -r * 0.68, r * 0.06, 0, TAU); c.fill();
    c.strokeStyle = 'rgba(255,255,255,.5)'; c.lineWidth = r * 0.05; c.lineCap = 'round';
    c.beginPath(); c.arc(0, 0, r * 0.78, 0.3, 1.0); c.stroke();
    if (b.kind === 'gold' || b.kind === 'rainbow') {
      const s = (Math.sin(clock * 6 + b.ph) + 1) / 2;
      c.globalAlpha = s; spark(c, r * 0.6, -r * 0.55, r * 0.22);
      c.globalAlpha = 1 - s; spark(c, -r * 0.62, r * 0.45, r * 0.16);
    }
    c.restore();
  }
  function spark(c, x, y, s) {
    c.fillStyle = '#fff';
    c.beginPath(); c.moveTo(x, y - s); c.quadraticCurveTo(x, y, x + s, y); c.quadraticCurveTo(x, y, x, y + s); c.quadraticCurveTo(x, y, x - s, y); c.quadraticCurveTo(x, y, x, y - s); c.fill();
  }
  function drawJelly(c, j) {
    const s = j.s;
    const pulse = Math.sin(j.t * 3 + j.ph);
    const x = j.x + Math.sin(j.t * 0.8 + j.ph) * 20 + (j.giggle > 0 ? Math.sin(j.giggle * 40) * 5 : 0);
    j.cx = x;
    c.save(); c.translate(x, j.y);
    c.globalAlpha = 0.92;
    c.strokeStyle = 'rgba(255,170,220,.85)'; c.lineWidth = s * 0.08; c.lineCap = 'round';
    for (let i = 0; i < 5; i++) {
      const tx = (i - 2) * s * 0.22;
      c.beginPath(); c.moveTo(tx, s * 0.1);
      c.bezierCurveTo(tx + Math.sin(j.t * 4 + i) * s * 0.2, s * 0.5, tx - Math.sin(j.t * 4 + i) * s * 0.2, s * 0.8, tx + Math.sin(j.t * 3 + i) * s * 0.15, s * 1.15);
      c.stroke();
    }
    c.beginPath(); c.ellipse(0, 0, s * (0.75 - pulse * 0.05), s * (0.6 + pulse * 0.05), 0, Math.PI, 0);
    c.quadraticCurveTo(s * 0.4, s * 0.25, 0, s * 0.15); c.quadraticCurveTo(-s * 0.4, s * 0.25, -s * 0.75, 0); c.closePath();
    c.fillStyle = GK.radial(c, 0, -s * 0.2, s * 0.8, 'rgba(255,220,240,.95)', 'rgba(255,130,200,.8)'); c.fill();
    c.lineWidth = s * 0.06; c.strokeStyle = '#d0569a'; c.stroke();
    GK.gloss(c, -s * 0.32, -s * 0.38, s * 0.18, s * 0.07, -0.5, 0.8);
    c.globalAlpha = 1;
    face(c, s * 0.7, j.giggle > 0 ? 'happy' : 'idle', -0.15);
    c.restore();
  }

  /* =====================================================================
   * 遊戲狀態
   * ===================================================================== */
  const prog = GK.Progress('bubble-pop');
  const parts = GK.Particles();
  const floaters = GK.Floaters(FONT);
  const shake = GK.Shake();
  const music = GK.Music({
    bpm: 116,
    tracks: [
      { wave: 'sine', vol: 0.06, notes: 'E5 . G5 A5 . G5 E5 . | D5 . E5 G5 - - . . | C5 . E5 G5 . A5 C6 . | B5 A5 G5 E5 - - . . ' },
      { wave: 'triangle', vol: 0.06, notes: 'C3 - G3 - C3 - G3 - | G2 - D3 - G2 - D3 - | A2 - E3 - A2 - E3 - | F2 - C3 - G2 - D3 - ' }
    ]
  });
  let hud = null;
  let state = 'title', level = 0, score = 0, elapsed = 0, timeLeft = ROUND, spawnT = 0, combo = 0, comboT = 0, bestCombo = 0, lastSec = ROUND;
  let sceneIdx = 0, mascotMood = 'idle', mascotMoodT = 0, mascotJump = 0;
  let timers = [];
  function later(fn, ms) { const t = setTimeout(fn, ms); timers.push(t); return t; }

  function resize() {
    const f = GK.fit(cv, ctx);
    W = f.W; H = f.H; dpr = f.dpr;
    R = Math.max(34, Math.min(64, Math.min(W, H) * 0.09));
    sandY = H - Math.max(50, H * 0.09);
    if (!tiny.length) for (let i = 0; i < 40; i++) tiny.push({ x: Math.random() * W, y: Math.random() * H, r: KG.rand(1.5, 4), v: KG.rand(15, 40) });
    if (!fishes.length) for (let i = 0; i < 4; i++) fishes.push(newFish(true));
  }

  function mascotPos() {
    if (state === 'title' || state === 'levels') return { x: W / 2, y: H * 0.6, s: Math.min(W * 0.24, H * 0.14) };
    const s = Math.max(30, Math.min(52, Math.min(W, H) * 0.075));
    return { x: Math.max(s * 1.4, W * 0.12), y: sandY - s * 0.5, s };
  }
  function setMood(m, t) { mascotMood = m; mascotMoodT = t; if (m === 'happy' || m === 'wow') mascotJump = 1; }

  function pop(b, chain) {
    const L = LEVELS[level];
    const x = b.cx != null ? b.cx : b.x, y = b.y;
    let pts = 1;
    if (b.kind === 'treasure') pts = 2;
    if (b.kind === 'gold') pts = 5;
    if (!chain) {
      combo = comboT > 0 ? combo + 1 : 1; comboT = 1.3;
      bestCombo = Math.max(bestCombo, combo);
      if (combo >= 3) pts += 1;
    }
    score += pts;
    const f = 420 + Math.min(combo, 10) * 55 + (chain ? Math.random() * 300 : 0);
    KG.note(f, 0.1, 'sine', 0.28, 0, f * 2.4);
    KG.note(f * 1.5, 0.06, 'triangle', 0.08, 0.03);
    const n = b.kind === 'gold' ? 22 : 14;
    for (let i = 0; i < n; i++) {
      const a = (i / n) * TAU + Math.random() * 0.3, sp = KG.rand(130, 300);
      parts.add({ x: x + Math.cos(a) * b.r * 0.8, y: y + Math.sin(a) * b.r * 0.8, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, g: -40, drag: 0.94,
        size: KG.rand(3, 6), life: 0.55, max: 0.55, color: b.kind === 'gold' ? '#ffe27a' : 'hsl(' + ((b.hue + i * 25) % 360) + ',90%,85%)' });
    }
    parts.ring(x, y, b.r, b.kind === 'gold' ? '#ffe27a' : '#ffffff', 0.4);
    if (b.kind === 'gold') { KG.sound('coin'); parts.burst(x, y, 10, { type: 'star', size: 12, speed: 260, g: 200 }); shake.hit(6, 0.2); GK.callout('金色泡泡！', '#ffe27a'); }
    if (b.treasure) flyers.push({ kind: b.treasure, x, y, t: 0, sx: x, sy: y });
    if (b.kind === 'big') {
      KG.sound('boing');
      for (let i = 0; i < 3; i++) {
        const nb = makeBubble(Math.random() < 0.5 ? 'treasure' : 'plain', x, y, R * 0.75);
        nb.v *= L.speed; nb.vx = Math.cos(-Math.PI / 2 + (i - 1) * 0.9) * 260; nb.vy = Math.sin(-Math.PI / 2 + (i - 1) * 0.9) * 160; nb.t = 0.2;
        bubbles.push(nb);
      }
    }
    if (b.kind === 'rainbow') {
      KG.sound('sparkle'); KG.sound('win');
      GK.callout('彩虹爆爆！', '#ffb3e6');
      shake.hit(8, 0.3);
      parts.burst(x, y, 30, { type: 'confetti', size: 12, speed: 420, g: 300 });
      const others = bubbles.slice();
      others.forEach((o, i) => later(() => { const k = bubbles.indexOf(o); if (k >= 0 && state === 'play') { bubbles.splice(k, 1); pop(o, true); } }, 80 + i * 70));
    }
    floaters.add(x, y - b.r * 0.6, '+' + pts, b.kind === 'gold' ? '#ffb300' : '#ff5d8f', b.kind === 'gold' ? 36 : 28);
    if (!chain && combo >= 3 && combo % 5 === 0) { GK.callout(KG.pick(GK.praise)); KG.sound('sparkle'); setMood('wow', 1.2); }
    else if (mascotMood !== 'wow') setMood('happy', 0.5);
    if (score >= L.goal && score - pts < L.goal) { GK.callout('達成目標！', '#b6f07a'); KG.sound('win'); }
    updateHud(true);
  }

  function updateHud(bump) {
    const L = LEVELS[level];
    hud.set('sc', score + '/' + L.goal);
    hud.bar('sc', score / L.goal);
    hud.set('tm', Math.ceil(timeLeft));
    if (bump) hud.bump('sc');
  }

  function startLevel(n) {
    timers.forEach(clearTimeout); timers = [];
    level = n; state = 'play'; sceneIdx = LEVELS[n].scene;
    bubbles = []; jellies = []; flyers = []; parts.clear(); floaters.clear();
    score = 0; elapsed = 0; timeLeft = ROUND; spawnT = 1.5; combo = 0; comboT = 0; bestCombo = 0; lastSec = ROUND;
    hud.show(true); updateHud(); music.start();
    // 一開始就先有幾顆泡泡在畫面中
    for (let i = 0; i < 4; i++) { spawnBubble(); const b = bubbles[bubbles.length - 1]; b.y = H * (0.45 + i * 0.12); b.t = 0.5; }
    jellies = [];
    GK.goal('第 ' + (n + 1) + ' 關', TIPS[n]);
  }
  function endLevel() {
    state = 'result';
    music.stop();
    const L = LEVELS[level];
    const stars = score >= Math.ceil(L.goal * 1.35) ? 3 : score >= L.goal ? 2 : score >= Math.ceil(L.goal * 0.5) ? 1 : 0;
    const before = prog.total();
    prog.setStars(level, stars);
    const after = prog.total();
    const best = KG.best('bubble-pop-L' + (level + 1), score);
    const un = MASCOTS.find((m) => m.need > before && m.need <= after);
    KG.say(stars ? '時間到！好棒喔！' : '時間到！再試一次吧！');
    setMood(stars ? 'wow' : 'idle', 3);
    later(() => {
      hud.show(false);
      GK.result({
        title: stars === 3 ? '泡泡大師！' : stars ? '好棒喔！' : '再試一次！',
        stars,
        lines: ['得到 ' + score + ' 分（目標 ' + L.goal + '）', '最多連擊 ' + bestCombo + '　最高 ' + best + ' 分'],
        unlock: un ? { name: un.name, draw: (c, s) => mascotIcon(c, s, un) } : null,
        onRetry: () => startLevel(level),
        onNext: level < LEVELS.length - 1 && prog.unlocked(level + 1) ? () => startLevel(level + 1) : null,
        onLevels: showLevels
      });
    }, 800);
  }
  function mascotIcon(c, s, m) {
    const g = c.createLinearGradient(0, 0, 0, s); g.addColorStop(0, '#9fe3ff'); g.addColorStop(1, '#3fb6e6');
    c.fillStyle = g; c.fillRect(0, 0, s, s);
    c.save(); c.translate(s / 2, s * 0.48); m.draw(c, s * 0.36, 'idle', 0); c.restore();
  }

  function showTitle() {
    state = 'title'; sceneIdx = 0;
    hud.show(false); music.stop();
    bubbles = []; jellies = [];
    GK.title({
      logo: '戳泡泡', colors: ['#ff8fb1', '#9fe3ff', '#ffe066'],
      sub: '戳破海底飄上來的泡泡！', total: prog.total(), onPlay: showLevels
    });
  }
  function showLevels() {
    timers.forEach(clearTimeout); timers = [];
    state = 'levels'; hud.show(false); music.stop();
    GK.levels({
      title: '選擇關卡', levels: LEVELS, prog, onPick: startLevel, onBack: showTitle,
      skins: { title: '海底好朋友', list: MASCOTS.map((m) => ({ name: m.name, need: m.need, draw: (c, s) => mascotIcon(c, s, m) })) }
    });
  }

  /* =====================================================================
   * 主迴圈
   * ===================================================================== */
  let last = performance.now();
  function frame(now) {
    const dt = Math.min(0.05, (now - last) / 1000);
    last = now;
    clock += dt;
    if (state === 'play') {
      const L = LEVELS[level];
      elapsed += dt;
      timeLeft = Math.max(0, ROUND - elapsed);
      spawnT -= dt;
      if (spawnT <= 0) { spawnBubble(); spawnT = KG.rand(L.rate[0], L.rate[1]) * (1 - Math.min(1, elapsed / ROUND) * 0.2); }
      comboT = Math.max(0, comboT - dt);
      const sec = Math.ceil(timeLeft);
      if (sec !== lastSec) { lastSec = sec; updateHud(); if (sec <= 5 && sec > 0) KG.sound('tick'); }
      if (timeLeft <= 0) endLevel();
    } else if ((state === 'title' || state === 'levels') && Math.random() < dt * 1.5) {
      const b = makeBubble(Math.random() < 0.5 ? 'treasure' : 'plain', KG.rand(40, W - 40), H + 50, R * KG.rand(0.7, 1.1));
      bubbles.push(b);
    }
    bubbles.forEach((b) => {
      b.t += dt; b.y -= b.v * dt; b.x += b.vx * dt; b.y += b.vy * dt;
      b.vx *= Math.pow(0.05, dt); b.vy *= Math.pow(0.05, dt);
      b.x = GK.clamp(b.x, b.r, W - b.r);
    });
    bubbles = bubbles.filter((b) => b.y > -b.r * 2);
    jellies.forEach((j) => { j.t += dt; j.y -= j.v * dt * (0.6 + 0.4 * Math.max(0, Math.sin(j.t * 3 + j.ph))); j.giggle = Math.max(0, j.giggle - dt); });
    jellies = jellies.filter((j) => j.y > -j.s * 2);
    tiny.forEach((b) => { b.y -= b.v * dt; if (b.y < -10) { b.y = H + 10; b.x = Math.random() * W; } });
    fishes.forEach((f, i) => { f.x += f.dir * f.v * dt; if (f.x < -80 || f.x > W + 80) fishes[i] = newFish(false); });
    flyers.forEach((f) => { f.t += dt * 1.6; });
    flyers = flyers.filter((f) => f.t < 1);
    mascotMoodT -= dt; if (mascotMoodT <= 0) mascotMood = 'idle';
    mascotJump = Math.max(0, mascotJump - dt * 2.5);
    parts.update(dt); floaters.update(dt); shake.update(dt);

    ctx.save();
    shake.apply(ctx);
    drawScene(ctx, sceneIdx);
    // 主角
    const mp = mascotPos();
    const sk = MASCOTS[prog.get('skin', 0)] || MASCOTS[0];
    const jump = Math.sin(mascotJump * Math.PI) * mp.s * 0.5;
    const bob = Math.sin(clock * 2) * mp.s * 0.06;
    GK.shadow(ctx, mp.x, mp.y + mp.s * 0.95, mp.s * 0.8 * (1 - jump / mp.s * 0.4), mp.s * 0.15, 0.3);
    ctx.save();
    ctx.translate(mp.x, mp.y - jump + bob);
    const sq = 1 + Math.sin(clock * 2) * 0.03 + (mascotJump > 0.7 ? 0.1 : 0);
    ctx.scale(1 / sq, sq);
    const blink = (clock % 3.3) < 0.12;
    sk.draw(ctx, mp.s, mascotMood === 'idle' && blink ? 'blink' : mascotMood, clock);
    ctx.restore();
    jellies.forEach((j) => drawJelly(ctx, j));
    bubbles.forEach((b) => drawBubble(ctx, b));
    parts.draw(ctx);
    ctx.restore();
    // 寶物飛向分數
    flyers.forEach((f) => {
      const k = GK.E.inOutSine(f.t);
      const tx = W / 2 - 40, ty = 30;
      const x = GK.lerp(f.sx, tx, k), y = GK.lerp(f.sy, ty, k) - Math.sin(k * Math.PI) * 80;
      ctx.save(); ctx.translate(x, y); ctx.scale(1.2 - k * 0.6, 1.2 - k * 0.6); ctx.rotate(k * 6);
      TREASURE[f.kind](ctx, R * 0.6);
      ctx.restore();
    });
    floaters.draw(ctx);
    if (state === 'levels') { ctx.fillStyle = 'rgba(10,50,100,.25)'; ctx.fillRect(0, 0, W, H); }
    requestAnimationFrame(frame);
  }

  /* ---------- 輸入 ---------- */
  cv.addEventListener('pointerdown', (e) => {
    e.preventDefault();
    const x = e.clientX, y = e.clientY;
    if (state === 'title') {
      // 標題畫面也可以戳著玩
      const b = bubbles.find((o) => Math.hypot((o.cx || o.x) - x, o.y - y) < o.r * 1.2);
      if (b) { bubbles.splice(bubbles.indexOf(b), 1); KG.sound('pop'); parts.ring(b.cx || b.x, b.y, b.r, '#fff', 0.4); parts.burst(b.cx || b.x, b.y, 10, { size: 5, speed: 200, g: -40, colors: ['#fff', '#cff4ff'] }); }
      return;
    }
    if (state !== 'play') return;
    let hit = null, bestD = Infinity;
    bubbles.forEach((b) => {
      const d = Math.hypot((b.cx != null ? b.cx : b.x) - x, b.y - y);
      if (d < b.r * 1.2 + 6 && d < bestD) { bestD = d; hit = b; }
    });
    if (hit) { bubbles.splice(bubbles.indexOf(hit), 1); pop(hit, false); return; }
    const j = jellies.find((o) => Math.hypot(o.cx - x, o.y - y) < o.s);
    if (j) { j.giggle = 0.8; KG.note(700, 0.1, 'sine', 0.15, 0, 1000); KG.note(900, 0.1, 'sine', 0.15, 0.1, 1200); floaters.add(x, y - 30, '嘻嘻～', '#d0569a', 24); return; }
    for (let i = 0; i < 4; i++) parts.add({ x, y, vx: KG.rand(-60, 60), vy: KG.rand(-120, -40), size: KG.rand(2, 4), life: 0.6, max: 0.6, color: 'rgba(255,255,255,.8)' });
  });
  window.addEventListener('resize', resize);

  hud = GK.hud([
    { id: 'sc', icon: '<svg viewBox="0 0 40 40"><circle cx="20" cy="20" r="15" fill="#d8f4ff" stroke="#3fa8e0" stroke-width="3"/><ellipse cx="14" cy="13" rx="5" ry="3" fill="#fff" transform="rotate(-35 14 13)"/><path d="M30 18 A11 11 0 0 1 22 30" fill="none" stroke="#ff9fd0" stroke-width="2.5" stroke-linecap="round"/></svg>', text: '0', bar: true },
    { id: 'tm', icon: GK.icon.clock, text: '45' }
  ]);
  hud.show(false);
  resize();
  requestAnimationFrame(frame);
  showTitle();
})();
</script>
