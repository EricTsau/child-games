<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>分數披薩店</title>
<link rel="stylesheet" href="../../assets/common.css">
<style>
  html, body { height: 100%; overflow: hidden; background: #f3dcb8; overscroll-behavior: none; }
  #game { position: fixed; inset: 0; display: block; width: 100vw; height: 100vh; height: 100dvh; touch-action: none; outline: none; }
  .ov { position: fixed; inset: 0; z-index: 9000; display: flex; align-items: center; justify-content: center; padding: 64px 12px 12px; background: rgba(60, 28, 12, 0.42); touch-action: none; }
  .ov.hidden { display: none; }
  .ov.clear { background: transparent; pointer-events: none; }
  .ov.clear > * { pointer-events: auto; }
  .card { position: relative; background: #fff8ef; border: 4px solid #fff; border-radius: 26px; box-shadow: 0 8px 0 rgba(110, 50, 20, .25), 0 18px 40px rgba(60, 20, 0, .35);
    width: 100%; max-width: 560px; max-height: 100%; display: flex; flex-direction: column; overflow: hidden; animation: pop .28s cubic-bezier(.2, 1.4, .4, 1); }
  @keyframes pop { from { transform: scale(.85); opacity: 0; } to { transform: none; opacity: 1; } }
  .card .hd { background: repeating-linear-gradient(90deg, #d8402f 0 22px, #fff 22px 44px); padding: 0; height: 12px; flex: none; }
  .card h2 { margin: 10px 16px 4px; font-size: 24px; text-align: center; color: #9b2c1c; }
  .card .scroll { overflow-y: auto; overflow-x: hidden; flex: 1 1 auto; padding: 6px 16px 8px; -webkit-overflow-scrolling: touch; touch-action: pan-y; }
  .card .ft { flex: none; display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; padding: 8px 12px 14px; }
  .card p { margin: 6px 0; font-size: 18px; line-height: 1.55; text-align: center; }
  .kg-btn { font-size: 19px; padding: 11px 22px; min-height: 50px; }
  .kg-btn.small { font-size: 16px; padding: 8px 14px; min-height: 42px; }
  .kg-btn.red { background: linear-gradient(180deg, #ff8a6e 0%, #d8402f 100%); box-shadow: 0 5px 0 #9b2c1c, 0 10px 18px rgba(155, 44, 28, .35); }
  .kg-btn.white { background: linear-gradient(180deg, #fff 0%, #f2e6d8 100%); color: #6b3b20; text-shadow: none; box-shadow: 0 5px 0 #c9b49c, 0 10px 18px rgba(110, 60, 20, .2); }
  .kg-btn:disabled { filter: grayscale(1); opacity: .55; }
  .frac { display: inline-flex; flex-direction: column; align-items: center; vertical-align: middle; line-height: 1; margin: 0 .12em; font-weight: 800; font-size: .92em; }
  .frac > span:first-child { border-bottom: .1em solid currentColor; padding: 0 .18em .07em; }
  .frac > span:last-child { padding: .07em .18em 0; }
  .mixed { display: inline-flex; align-items: center; font-weight: 800; }
  .mixed > b { font-size: 1.3em; margin-right: .02em; }
  .toggles { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
  .tg { font-family: var(--kg-font); font-weight: 800; font-size: 15px; border: 3px solid #fff; border-radius: 999px; padding: 6px 14px; min-height: 40px; cursor: pointer;
    background: #8fd19e; color: #fff; box-shadow: 0 3px 0 rgba(0, 0, 0, .15); text-shadow: 0 1px 0 rgba(0, 0, 0, .2); }
  .tg.off { background: #cbbfb3; }
  /* 標題 */
  #title { flex-direction: column; justify-content: space-between; align-items: stretch; background: transparent; padding: 62px 14px 14px; }
  #title .logo { text-align: center; pointer-events: none; }
  #title .logo .t1 { font-size: clamp(40px, 12vw, 72px); font-weight: 900; color: #e8452f; letter-spacing: 2px; line-height: 1.05;
    -webkit-text-stroke: 7px #fff; paint-order: stroke fill; text-shadow: 0 6px 0 rgba(120, 40, 10, .35); }
  #title .logo .t2 { display: inline-block; margin-top: 6px; font-size: clamp(15px, 4vw, 20px); font-weight: 800; color: #fff; background: #2f8f4e; border-radius: 999px; padding: 4px 16px; box-shadow: 0 3px 0 #1d6a37; }
  #title .stage { flex: 1 1 auto; min-height: 60px; pointer-events: none; }
  #title .menu { display: flex; flex-direction: column; gap: 10px; align-items: center; }
  #title .menu .row { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
  #title .menu .main { font-size: 24px; padding: 14px 40px; }
  #title .best { font-size: 15px; font-weight: 800; color: #7a3a14; background: rgba(255, 248, 239, .85); border-radius: 999px; padding: 3px 14px; }
  @media (orientation: landscape) and (max-height: 560px) {
    .ov { padding: 10px 70px 10px; }
    #title { flex-direction: row; padding: 12px 70px 12px 70px; align-items: center; }
    #title .left { display: flex; flex-direction: column; gap: 12px; width: 48%; justify-content: center; }
    #title .stage { align-self: stretch; }
    #title .logo .t1 { font-size: clamp(34px, 7vw, 60px); }
    .card h2 { font-size: 21px; margin-top: 6px; }
    .card p { font-size: 16px; margin: 3px 0; }
  }
  #title .left { display: contents; }
  #title .logo { order: 1; } #title .stage { order: 2; } #title .menu { order: 3; }
  @media (orientation: landscape) and (max-height: 560px) { #title .left { display: flex; } }
  /* 選關 */
  .chap { border-radius: 18px; background: #fff; margin: 8px 0 12px; padding: 10px 10px 12px; box-shadow: 0 3px 0 rgba(120, 60, 20, .14); border: 3px solid var(--cc, #e8452f); }
  .chap .top { display: flex; align-items: center; gap: 8px; }
  .chap .num { flex: none; width: 34px; height: 34px; border-radius: 50%; background: var(--cc); color: #fff; font-weight: 900; display: grid; place-items: center; font-size: 18px; }
  .chap .nm { font-weight: 900; font-size: 19px; color: #5a2a10; flex: 1; text-align: left; line-height: 1.2; }
  .chap .nm small { display: block; font-size: 13px; color: #9a6a4a; font-weight: 700; }
  .chap .st { font-weight: 800; font-size: 14px; color: #b07a10; white-space: nowrap; }
  .chap .lv { display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; margin-top: 8px; }
  .lvb { font-family: var(--kg-font); border: none; border-radius: 14px; background: linear-gradient(180deg, #ffe7a8, #f7b955); box-shadow: 0 3px 0 #c98a1e; color: #6b3b0a; font-weight: 900; font-size: 18px; padding: 4px 0 2px; min-height: 52px; cursor: pointer; line-height: 1.1; }
  .lvb .s { display: block; font-size: 11px; letter-spacing: -1px; color: #d88a00; }
  .lvb .s i { font-style: normal; color: #e4d5c0; }
  .lvb.done { background: linear-gradient(180deg, #c8f0cf, #7fcf8e); box-shadow: 0 3px 0 #3f9a55; color: #1f5a2c; }
  .lvb:disabled { background: #e9e0d6; box-shadow: 0 3px 0 #cfc3b6; color: #b3a493; cursor: default; }
  .chap.locked { opacity: .6; }
  .chap .lockmsg { font-size: 13px; color: #9a6a4a; font-weight: 700; margin-top: 6px; }
  .chap .how { font-family: var(--kg-font); font-size: 13px; font-weight: 800; border: 2px solid var(--cc); color: var(--cc); background: #fff; border-radius: 999px; padding: 3px 10px; cursor: pointer; }
  /* 說明卡 */
  .ex { display: flex; flex-direction: column; align-items: center; gap: 4px; }
  .ex canvas { width: 100%; max-width: 440px; height: 170px; display: block; border-radius: 16px; background: #fdf0dc; }
  .ex .txt { font-size: 18px; line-height: 1.7; text-align: center; color: #4a2a14; }
  .ex .txt b { color: #c0392b; }
  @media (orientation: landscape) and (max-height: 560px) {
    .card.wide { max-width: 760px; }
    .ex { flex-direction: row; gap: 12px; align-items: center; }
    .ex canvas { width: 52%; height: 180px; flex: none; }
    .ex .txt { font-size: 16px; text-align: left; }
  }
  .stars { display: flex; justify-content: center; gap: 8px; margin: 4px 0; }
  .stars span { font-size: 44px; filter: drop-shadow(0 3px 0 rgba(0, 0, 0, .15)); opacity: 0; transform: scale(.2); }
  .stars span.on { animation: starIn .45s cubic-bezier(.2, 1.6, .4, 1) forwards; }
  .stars span.off { animation: starIn .45s ease forwards; filter: grayscale(1) opacity(.35); }
  @keyframes starIn { to { opacity: 1; transform: none; } }
  .pill { display: inline-block; background: #ffe7a8; color: #7a4a00; font-weight: 900; border-radius: 999px; padding: 3px 14px; margin: 2px; }
</style>
</head>
<body>
<canvas id="game" tabindex="0" aria-label="分數披薩店：切披薩學分數"></canvas>

<div id="title" class="ov clear hidden">
  <div class="left">
    <div class="logo"><div class="t1">分數披薩店</div><div class="t2">切一切、算一算，學會分數！</div></div>
    <div class="menu">
      <button class="kg-btn red main" id="btnPlay">開始營業</button>
      <div class="row">
        <button class="kg-btn yellow small" id="btnPractice">練習室</button>
        <button class="kg-btn green small" id="btnDecor">裝飾披薩</button>
      </div>
      <div class="toggles" id="titleToggles"></div>
      <div class="best" id="titleBest"></div>
    </div>
  </div>
  <div class="stage" id="titleStage"></div>
</div>

<div id="map" class="ov hidden">
  <div class="card" style="max-width:640px">
    <div class="hd"></div>
    <h2>今天要學什麼？</h2>
    <div class="scroll" id="mapList"></div>
    <div class="ft"><button class="kg-btn white small" id="mapBack">回到店門口</button></div>
  </div>
</div>

<div id="pause" class="ov hidden">
  <div class="card" style="max-width:380px">
    <div class="hd"></div>
    <h2>休息一下</h2>
    <div class="scroll"><div class="toggles" id="pauseToggles"></div></div>
    <div class="ft" id="pauseBtns"></div>
  </div>
</div>

<div id="explain" class="ov hidden">
  <div class="card wide">
    <div class="hd"></div>
    <h2 id="exTitle">我們一起看看</h2>
    <div class="scroll"><div class="ex"><canvas id="exCanvas"></canvas><div class="txt" id="exText"></div></div></div>
    <div class="ft"><button class="kg-btn white small" id="exAgain">再聽一次</button><button class="kg-btn green" id="exOk">我懂了！</button></div>
  </div>
</div>

<div id="result" class="ov hidden">
  <div class="card" style="max-width:440px">
    <div class="hd"></div>
    <h2 id="resTitle">打烊囉！</h2>
    <div class="scroll" id="resBody"></div>
    <div class="ft" id="resBtns"></div>
  </div>
</div>

<script src="../../assets/common.js"></script>
<script src="../../assets/kg-music.js"></script>
<script>
(function () {
'use strict';
const SLUG = 'fraction-pizza';
/* =====================================================================
 * 小工具
 * ===================================================================== */
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const easeOut = t => 1 - Math.pow(1 - t, 3);
const easeInOut = t => t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
const backOut = t => { const c = 1.70158, c3 = c + 1; return 1 + c3 * Math.pow(t - 1, 3) + c * Math.pow(t - 1, 2); };
const gcd = (a, b) => { a = Math.abs(a); b = Math.abs(b); while (b) { const t = a % b; a = b; b = t; } return a || 1; };
const lcm = (a, b) => a / gcd(a, b) * b;
const ri = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
const pick = arr => arr[Math.floor(Math.random() * arr.length)];
const shuffle = arr => { const a = arr.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const TAU = Math.PI * 2;
const F = (a, b) => ({ a, b });
const red = f => { const g = gcd(f.a, f.b); return F(f.a / g, f.b / g); };
const fval = f => f.a / f.b;
const feq = (x, y) => x.a * y.b === y.a * x.b;
const Save = {
  get: (k, d) => KG.store.get(SLUG + ':' + k, d),
  set: (k, v) => KG.store.set(SLUG + ':' + k, v)
};

/* 中文數字（念給小朋友聽） */
const ZH = ['零', '一', '二', '三', '四', '五', '六', '七', '八', '九', '十'];
function zh(n) {
  n = Math.round(n);
  if (n <= 10) return ZH[n];
  if (n < 20) return '十' + (n % 10 ? ZH[n % 10] : '');
  if (n < 100) return ZH[Math.floor(n / 10)] + '十' + (n % 10 ? ZH[n % 10] : '');
  return String(n);
}
function zhCount(n) { return n === 2 ? '兩' : zh(n); }
function fracSay(f) { return zh(f.b) + '分之' + zh(f.a); }
function mixedSay(f) {
  const w = Math.floor(f.a / f.b), r = f.a % f.b;
  if (!w) return fracSay(f);
  if (!r) return zhCount(w);
  return zh(w) + '又' + zh(f.b) + '分之' + zh(r);
}
/* HTML 直式分數 */
function fh(a, b) { return '<span class="frac"><span>' + a + '</span><span>' + b + '</span></span>'; }
function fH(f) { return fh(f.a, f.b); }
function mH(f) {
  const w = Math.floor(f.a / f.b), r = f.a % f.b;
  if (!w) return fH(f);
  if (!r) return '<b>' + w + '</b>';
  return '<span class="mixed"><b>' + w + '</b>' + fh(r, f.b) + '</span>';
}

/* =====================================================================
 * 畫布與版面
 * ===================================================================== */
const cv = document.getElementById('game');
let ctx = cv.getContext('2d');
const mainCtx = ctx;
function withCtx(c, fn) { const o = ctx; ctx = c; try { fn(); } finally { ctx = o; } }
let W = 390, H = 844, DPR = 1, L = null;
const FONT = '"PingFang TC","Noto Sans TC","Microsoft JhengHei","Heiti TC",system-ui,sans-serif';
const font = (s, w) => (w || 800) + ' ' + Math.round(s) + 'px ' + FONT;

function computeLayout() {
  const portrait = W / H < 1.0;
  const U = clamp(Math.min(W, H) / 400, 0.8, 1.5);
  const o = { W, H, portrait, U };
  if (portrait) {
    const top = 62;
    const custH = clamp(H * 0.25, 150, 250);
    o.cust = { x: 0, y: top, w: W, h: custH };
    o.counterY = top + custH;
    const ctrlH = clamp(H * 0.19, 128, 176);
    o.ctrl = { x: 12, y: H - ctrlH - 10, w: W - 24, h: ctrlH };
    const midY = o.counterY + 26, midH = o.ctrl.y - 6 - midY;
    o.board = { x: 8, y: midY, w: W - 16, h: midH * 0.64 };
    o.plate = { x: 8, y: midY + midH * 0.64, w: W - 16, h: midH * 0.36 };
  } else {
    const top = 58;
    const cw = clamp(W * 0.28, 200, 380);
    o.cust = { x: 0, y: top, w: cw, h: H - top };
    o.counterY = H - clamp(H * 0.2, 60, 130);
    const rx = cw + (W - cw) * 0.6;
    o.board = { x: cw + 6, y: top + 4, w: rx - cw - 12, h: H - top - 14 };
    const ry = 112;
    const rest = H - ry - 10;
    const ch = clamp(rest * 0.44, 108, 150);
    o.plate = { x: rx, y: ry, w: W - rx - 10, h: rest - ch - 6 };
    o.ctrl = { x: rx, y: H - 10 - ch, w: W - rx - 12, h: ch };
  }
  o.pauseBtn = { x: W - 34, y: 84, r: 22 };
  return o;
}

/* =====================================================================
 * 文字與直式分數（畫在 canvas 上）
 * 一段算式 items：數字/文字字串、{f:{a,b}} 分數、{m:{a,b}} 帶分數、{icon:'pep'} 小披薩
 * ===================================================================== */
function txt(s, x, y, size, color, o) {
  o = o || {};
  ctx.font = font(size, o.w);
  ctx.textAlign = o.align || 'center';
  ctx.textBaseline = o.base || 'middle';
  if (o.stroke) { ctx.lineJoin = 'round'; ctx.lineWidth = o.sw || size * 0.22; ctx.strokeStyle = o.stroke; ctx.strokeText(s, x, y); }
  ctx.fillStyle = color || '#4a2a14';
  ctx.fillText(s, x, y);
}
function itemW(it, s) {
  if (typeof it === 'string') { ctx.font = font(s * 0.46); return ctx.measureText(it).width + s * 0.06; }
  if (it.f) { ctx.font = font(s * 0.44); return Math.max(ctx.measureText(String(it.f.a)).width, ctx.measureText(String(it.f.b)).width) + s * 0.26; }
  if (it.m) {
    const w = Math.floor(it.m.a / it.m.b), r = it.m.a % it.m.b;
    if (!w) return itemW({ f: it.m }, s);
    ctx.font = font(s * 0.62); const ww = ctx.measureText(String(w)).width + s * 0.04;
    if (!r) return ww;
    return ww + itemW({ f: F(r, it.m.b) }, s);
  }
  if (it.icon) return s * 0.72;
  if (it.gap) return s * it.gap;
  return 0;
}
function exprW(items, s) { let w = 0; for (const it of items) w += itemW(it, s); return w; }
/** 畫一段算式，中心在 (x, y)，s = 分數方塊的高度 */
function drawExpr(items, x, y, s, color, align) {
  const total = exprW(items, s);
  let cx = align === 'left' ? x : align === 'right' ? x - total : x - total / 2;
  color = color || '#4a2a14';
  for (const it of items) {
    const w = itemW(it, s);
    if (typeof it === 'string') {
      ctx.font = font(s * 0.46); ctx.textAlign = 'left'; ctx.textBaseline = 'middle'; ctx.fillStyle = color;
      ctx.fillText(it, cx + s * 0.03, y + s * 0.02);
    } else if (it.f) drawFracAt(it.f, cx + w / 2, y, s, it.c || color);
    else if (it.m) {
      const wh = Math.floor(it.m.a / it.m.b), r = it.m.a % it.m.b;
      if (!wh) drawFracAt(it.m, cx + w / 2, y, s, it.c || color);
      else {
        ctx.font = font(s * 0.62); const ww = ctx.measureText(String(wh)).width + s * 0.04;
        ctx.textAlign = 'left'; ctx.textBaseline = 'middle'; ctx.fillStyle = it.c || color;
        ctx.fillText(String(wh), cx, y + s * 0.03);
        if (r) drawFracAt(F(r, it.m.b), cx + ww + (w - ww) / 2, y, s, it.c || color);
      }
    } else if (it.icon) drawMiniPizza(cx + w / 2, y, s * 0.32, it.icon);
    cx += w;
  }
  return total;
}
function drawFracAt(f, x, y, s, color) {
  ctx.font = font(s * 0.44);
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillStyle = color;
  const w = Math.max(ctx.measureText(String(f.a)).width, ctx.measureText(String(f.b)).width) + s * 0.12;
  ctx.fillText(String(f.a), x, y - s * 0.24);
  ctx.fillText(String(f.b), x, y + s * 0.27);
  ctx.fillRect(x - w / 2, y - s * 0.035, w, Math.max(2, s * 0.06));
}
function rr(x, y, w, h, r) {
  r = Math.min(r, w / 2, h / 2);
  ctx.beginPath();
  ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
}

/* =====================================================================
 * 聲音：音效＋原創配樂（塔朗泰拉風）
 * ===================================================================== */
const S = KG.sfx, M = KG.music;
let sfxOn = Save.get('sfx', true) !== false;
let voiceOn = Save.get('voice', true) !== false;
const sfxLast = Object.create(null);
function sfx(name, o) {
  if (!sfxOn || !S) return;
  const now = performance.now();
  if (now - (sfxLast[name] || 0) < 40) return;
  sfxLast[name] = now;
  const pitch = ((o && o.pitch) || 1) * (o && o.exact ? 1 : 0.96 + Math.random() * 0.08);
  S.play(name, { vol: o ? o.vol : undefined, pitch, pan: o ? o.pan : undefined });
}
const panX = x => clamp((x / Math.max(1, W)) * 2 - 1, -1, 1) * 0.55;
const MUSIC_VOL = 0.34;
if (M) M.setVolume(MUSIC_VOL);
let duckTimer = 0;
function say(t) {
  if (!voiceOn || !t || KG.isMuted()) return;
  KG.say(t, 0.95);
  if (M) M.setVolume(MUSIC_VOL * 0.35);
  clearInterval(duckTimer);
  let n = 0;
  duckTimer = setInterval(() => {
    n++;
    const sp = window.speechSynthesis && (window.speechSynthesis.speaking || window.speechSynthesis.pending);
    if ((!sp && n > 3) || n > 80) { clearInterval(duckTimer); if (M) M.setVolume(MUSIC_VOL); }
  }, 250);
}
function hush() { try { if (window.speechSynthesis) window.speechSynthesis.cancel(); } catch (e) { /* 忽略 */ } clearInterval(duckTimer); if (M) M.setVolume(MUSIC_VOL); }

if (S) {
  // 刀子切下去：高頻掃過＋砧板輕敲
  S.define('fp_swish', (p, s) => {
    s.noise(0.15, { vol: 0.2, freq: 2200 * p, sweep: 7200 * p, q: 1.4 });
    s.tone(3400 * p, 0.05, { vol: 0.025, delay: 0.03 });
    s.noise(0.05, { vol: 0.13, freq: 700, type: 'lowpass', delay: 0.12 });
    s.tone(190 * p, 0.06, { type: 'triangle', vol: 0.1, slide: 140, delay: 0.12 });
  });
  // 一片披薩滑到盤子上
  S.define('fp_slide', (p, s) => {
    s.noise(0.2, { vol: 0.13, freq: 1400 * p, sweep: 380, type: 'lowpass', q: 1.2 });
    s.tone(300 * p, 0.12, { type: 'triangle', vol: 0.12, slide: 190 * p, delay: 0.13 });

function rngOf(seed) { let a = (seed >>> 0) || 1; return () => { a = (a + 0x6D2B79F5) >>> 0; let t = a; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }

/** 在 c 上畫一個配料：r = 配料大小（像素） */
function drawTopping(c, k, x, y, r, rot) {
  c.save(); c.translate(x, y); c.rotate(rot || 0);
  switch (k) {
    case 'pep':
      c.fillStyle = '#9e2a22'; c.beginPath(); c.arc(0, 0, r, 0, TAU); c.fill();
      c.fillStyle = '#c23b2e'; c.beginPath(); c.arc(-r * 0.08, -r * 0.08, r * 0.82, 0, TAU); c.fill();
      c.fillStyle = '#e8836f'; for (let i = 0; i < 4; i++) { c.beginPath(); c.arc(Math.cos(i * 1.7) * r * 0.45, Math.sin(i * 1.7) * r * 0.45, r * 0.11, 0, TAU); c.fill(); }
      break;
    case 'basil':
      c.fillStyle = '#2e8b3a'; c.beginPath(); c.ellipse(0, 0, r * 1.05, r * 0.52, 0, 0, TAU); c.fill();
      c.strokeStyle = '#5fbf5a'; c.lineWidth = Math.max(1, r * 0.1); c.beginPath(); c.moveTo(-r * 0.9, 0); c.lineTo(r * 0.85, 0); c.stroke();
      break;
    case 'mush':
      c.fillStyle = '#efe3cf'; c.beginPath(); c.ellipse(0, -r * 0.15, r * 0.95, r * 0.62, 0, Math.PI, TAU); c.closePath(); c.fill();
      c.fillStyle = '#d9c6a6'; c.fillRect(-r * 0.32, -r * 0.18, r * 0.64, r * 0.75);
      c.strokeStyle = '#a88a62'; c.lineWidth = Math.max(1, r * 0.09); c.beginPath(); c.ellipse(0, -r * 0.15, r * 0.95, r * 0.62, 0, Math.PI, TAU); c.closePath(); c.stroke();
      break;
    case 'olive':
      c.fillStyle = '#2b2b33'; c.beginPath(); c.arc(0, 0, r, 0, TAU); c.fill();
      c.fillStyle = '#e9b44c'; c.beginPath(); c.arc(0, 0, r * 0.42, 0, TAU); c.fill();
      c.fillStyle = 'rgba(255,255,255,.35)'; c.beginPath(); c.arc(-r * 0.45, -r * 0.45, r * 0.22, 0, TAU); c.fill();
      break;
    case 'tomato':
      c.fillStyle = '#d9302a'; c.beginPath(); c.arc(0, 0, r, 0, TAU); c.fill();
      c.fillStyle = '#f26a52'; c.beginPath(); c.arc(0, 0, r * 0.78, 0, TAU); c.fill();
      c.fillStyle = '#ffd3a8'; for (let i = 0; i < 5; i++) { c.beginPath(); c.ellipse(Math.cos(i * TAU / 5) * r * 0.45, Math.sin(i * TAU / 5) * r * 0.45, r * 0.13, r * 0.08, i * TAU / 5, 0, TAU); c.fill(); }
      break;
    case 'pine':
      c.fillStyle = '#f6c937'; c.beginPath(); c.moveTo(-r, -r * 0.55); c.lineTo(r, -r * 0.55); c.lineTo(r * 0.55, r * 0.7); c.lineTo(-r * 0.55, r * 0.7); c.closePath(); c.fill();
      c.fillStyle = '#ffe58a'; c.fillRect(-r * 0.6, -r * 0.4, r * 1.2, r * 0.25);
      break;
    case 'corn':
      for (let i = 0; i < 3; i++) { c.fillStyle = i % 2 ? '#ffd23f' : '#f7c21c'; c.beginPath(); c.ellipse((i - 1) * r * 0.62, (i % 2) * r * 0.3, r * 0.38, r * 0.3, 0.4, 0, TAU); c.fill(); }
      break;
    case 'pepper':
      c.strokeStyle = '#3f9b3a'; c.lineWidth = r * 0.34; c.beginPath(); c.arc(0, 0, r * 0.78, 0.2, TAU - 0.5); c.stroke();
      c.strokeStyle = '#7fd06a'; c.lineWidth = r * 0.1; c.beginPath(); c.arc(0, 0, r * 0.66, 0.3, TAU - 0.6); c.stroke();
      break;
    case 'shrimp':
      c.strokeStyle = '#f08a6a'; c.lineCap = 'round'; c.lineWidth = r * 0.55; c.beginPath(); c.arc(0, 0, r * 0.65, 0.3, Math.PI + 0.7); c.stroke();
      c.strokeStyle = '#ffc2a6'; c.lineWidth = r * 0.14;
      for (let i = 0; i < 3; i++) { const a = 0.9 + i * 0.75; c.beginPath(); c.moveTo(Math.cos(a) * r * 0.4, Math.sin(a) * r * 0.4); c.lineTo(Math.cos(a) * r * 0.92, Math.sin(a) * r * 0.92); c.stroke(); }
      c.fillStyle = '#e0563c'; c.beginPath(); c.moveTo(Math.cos(0.3) * r * 0.65, Math.sin(0.3) * r * 0.65); c.lineTo(r * 1.0, r * 0.55); c.lineTo(r * 0.45, r * 0.6); c.fill();
      break;
    case 'ham':
      c.fillStyle = '#f39aa4'; rrC(c, -r * 0.8, -r * 0.8, r * 1.6, r * 1.6, r * 0.3); c.fill();
      c.fillStyle = '#ffc6cc'; rrC(c, -r * 0.5, -r * 0.5, r * 0.7, r * 0.45, r * 0.15); c.fill();
      break;
    case 'onion':
      c.strokeStyle = '#d9b3e6'; c.lineWidth = r * 0.22; c.beginPath(); c.ellipse(0, 0, r * 0.9, r * 0.7, 0, 0, TAU); c.stroke();
      c.strokeStyle = '#f3e6f7'; c.lineWidth = r * 0.12; c.beginPath(); c.ellipse(0, 0, r * 0.55, r * 0.4, 0, 0, TAU); c.stroke();
      break;
    case 'heart':
      c.fillStyle = '#e8364a'; c.beginPath(); c.moveTo(0, r * 0.85);
      c.bezierCurveTo(-r * 1.4, -r * 0.1, -r * 0.6, -r * 1.2, 0, -r * 0.4); c.bezierCurveTo(r * 0.6, -r * 1.2, r * 1.4, -r * 0.1, 0, r * 0.85); c.fill();
      c.fillStyle = 'rgba(255,255,255,.5)'; c.beginPath(); c.arc(-r * 0.42, -r * 0.35, r * 0.17, 0, TAU); c.fill();
      break;
    case 'minipz':
      c.fillStyle = '#d9913c'; c.beginPath(); c.arc(0, 0, r, 0, TAU); c.fill();
      c.fillStyle = '#f7d36e'; c.beginPath(); c.arc(0, 0, r * 0.76, 0, TAU); c.fill();
      c.fillStyle = '#c23b2e'; for (let i = 0; i < 3; i++) { c.beginPath(); c.arc(Math.cos(i * 2.1) * r * 0.4, Math.sin(i * 2.1) * r * 0.4, r * 0.17, 0, TAU); c.fill(); }
      break;
    case 'person':
      c.rotate(-(rot || 0));
      c.fillStyle = '#4f9de0'; c.beginPath(); c.arc(0, r * 1.0, r * 0.75, Math.PI, TAU); c.fill();
      c.fillStyle = '#f6c9a0'; c.beginPath(); c.arc(0, -r * 0.1, r * 0.55, 0, TAU); c.fill();
      c.fillStyle = '#5a3a20'; c.beginPath(); c.arc(0, -r * 0.25, r * 0.56, Math.PI * 1.05, TAU - 0.05); c.fill();
      break;
    case 'bread':

function updatePlay(dt) {
  if (!G) return;
  for (const c of G.custs) {
    if (c.enter < 1) c.enter = Math.min(1, c.enter + dt / 0.7);
    if (c.enter > 0.85 && G.phase !== 'leave' && c.leave <= 0) c.bubble = Math.min(1, c.bubble + dt / 0.25);
    if (G.phase === 'leave') { c.leave = Math.min(1, c.leave + dt / 0.6); c.bubble = Math.max(0, c.bubble - dt / 0.15); }
    c.moodT += dt;
  }
  if (G.cutJob) updateCut(dt);
  if (G.plate) for (const it of G.plate.items) { it.t = Math.min(1, it.t + dt / 0.32); it.da += (it.a0 - it.da) * Math.min(1, dt * 14); }

  if (G.cmpShow) G.cmpShow.t += dt;
  if (G.lcdShow) G.lcdShow = Math.min(1, G.lcdShow + dt / 0.8);
  if (G.extraNote) G.extraNote.t += dt;
  if (G.wait > 0) {
    G.wait -= dt;
    if (G.wait <= 0) {
      if (G.phase === 'next') nextOrder();
      else if (G.phase === 'enter') orderReady();
      else if (G.phase === 'paid') { G.phase = 'leave'; G.wait = 0.65; }
      else if (G.phase === 'leave') { G.phase = 'next'; G.wait = 0.15; }
    }
  }
}

  reset: () => { Save.set('prog', null); location.reload(); },
  tap: wrong => nextTap(wrong),
  btns: () => UI.btns.map(b => ({ id: b.id, x: Math.round(b.x + b.w / 2), y: Math.round(b.y + b.h / 2), w: Math.round(b.w), h: Math.round(b.h), en: b.en !== false })),
  pizzas: () => (scene === 'practice' ? PR.pz : G ? G.pizzas : []).map(p => ({ x: Math.round(p.x), y: Math.round(p.y), R: Math.round(p.R), n: p.n })),
  decorPos: () => ({ x: DC.x, y: DC.y, R: DC.R }),
  layout: () => JSON.parse(JSON.stringify(L)),
  orders: () => G ? G.orders.map(o => o.type + (o.kind ? ':' + o.kind : '')) : [],
  skip: sec => { for (let i = 0; i < sec * 60; i++) { T += 1 / 60; step(1 / 60); } },
  perf: reset => { const r = { avg: perf.n ? +(perf.sum / perf.n).toFixed(2) : 0, max: +perf.max.toFixed(1), n: perf.n }; if (reset) { perf.n = 0; perf.sum = 0; perf.max = 0; } return r; },
  explainOk: () => $('exOk').click(),
  gen: (c, l) => genLevel(c, l)
};
})();
</script>
</body>
</html>
