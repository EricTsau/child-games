<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffd9e8">
<title>守護糖果屋</title>
<link rel="stylesheet" href="../../assets/common.css">
<style>
  html, body { height: 100%; overflow: hidden; background: #ffdfec; overscroll-behavior: none; }
  #game { position: fixed; inset: 0; display: block; width: 100vw; height: 100vh; height: 100dvh; touch-action: none; }
  .kg-btn:focus { outline: none; }
  .kg-btn:focus-visible, .td-sq:focus-visible, .card:focus-visible, .lv:focus-visible { outline: 4px solid #ffb020; outline-offset: 3px; }
  button { font-family: var(--kg-font); -webkit-tap-highlight-color: transparent; }
  svg.ic { width: 22px; height: 22px; flex: none; display: block; }

  /* ---------- HUD ---------- */
  #hud { display: none; }
  body.playing #hud { display: block; }
  body:not(.playing) #hud { display: none !important; }
  .pill { display: flex; align-items: center; gap: 5px; height: 40px; padding: 0 12px 0 8px; border-radius: 999px;
    background: linear-gradient(180deg, #fff 0%, #ffeef5 100%); border: 3px solid #fff; color: #6a2c4a; font-weight: 900; font-size: 19px;
    box-shadow: 0 4px 0 rgba(150,60,100,.22), 0 8px 16px rgba(150,60,100,.14); white-space: nowrap; transition: transform .12s; }
  .pill b { font-variant-numeric: tabular-nums; min-width: 1.2em; text-align: center; }
  .pill.bump { animation: tdBump .25s ease; }
  .pill.hurt { animation: tdHurt .4s ease; background: linear-gradient(180deg, #fff 0%, #ffd0d8 100%); }
  .td-sq { width: 48px; height: 48px; flex: none; border-radius: 16px; border: 3px solid #fff; cursor: pointer; padding: 0;
    background: linear-gradient(180deg, #fff 0%, #ffe6f0 100%); color: #8a3260; font-weight: 900; font-size: 19px;
    box-shadow: 0 4px 0 rgba(150,60,100,.25); display: flex; align-items: center; justify-content: center; transition: transform .1s; }
  .td-sq:active { transform: translateY(3px); box-shadow: 0 1px 0 rgba(150,60,100,.25); }
  .td-sq.on { background: linear-gradient(180deg, #ffe58a 0%, #f5b82e 100%); color: #6b4a00; }
  .td-sq i { display: block; width: 5px; height: 18px; border-radius: 3px; background: #8a3260; margin: 0 2.5px; }
  #btnSend { position: relative; overflow: hidden; height: 48px; padding: 0 12px; font-size: 17px; line-height: 1.05; min-width: 104px;
    display: flex; flex-direction: column; align-items: center; justify-content: center; flex: 1 1 auto; max-width: 190px;
    background: linear-gradient(180deg, #ffb36b 0%, #ff7a3d 100%); box-shadow: 0 4px 0 #c4501c, 0 8px 14px rgba(196,80,28,.3); }
  #btnSend::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: calc(var(--p, 0) * 100%); background: rgba(255,255,255,.28); pointer-events: none; }
  #btnSend small { font-size: 12.5px; opacity: .95; font-weight: 800; }
  #btnSend:disabled { filter: grayscale(.7); opacity: .7; }
  #btnSend.boss { background: linear-gradient(180deg, #ff8fb1 0%, #e0306a 100%); box-shadow: 0 4px 0 #a01848; }
  .preview { display: flex; align-items: center; gap: 2px; min-width: 0; overflow: hidden; }
  .preview .pv { position: relative; width: 34px; height: 34px; flex: none; }
  .preview .pv canvas { width: 34px; height: 34px; display: block; }
  .preview .pv span { position: absolute; right: -2px; bottom: -3px; font-size: 12px; font-weight: 900; color: #fff; background: #8a3260; border-radius: 8px; padding: 0 4px; line-height: 15px; }
  .preview .lbl { font-size: 12px; font-weight: 900; color: #8a3260; writing-mode: horizontal-tb; margin-right: 2px; white-space: nowrap; }

  #ctx { background: linear-gradient(180deg, #fffafc 0%, #ffe9f2 100%); border: 4px solid #fff; border-radius: 22px; color: #6a2c4a;
    box-shadow: 0 6px 0 rgba(200,90,140,.35), 0 14px 30px rgba(120,40,80,.25); padding: 8px; }
  .ctx-head { display: flex; align-items: center; justify-content: space-between; gap: 6px; font-weight: 900; font-size: 16px; padding: 0 2px 6px 6px; }
  .ctx-head .x { width: 40px; height: 40px; border-radius: 50%; border: 3px solid #fff; background: #ffd0e2; color: #8a3260; font-size: 22px; font-weight: 900; cursor: pointer; padding: 0; line-height: 1; flex: none; }
  .cards { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; }
  .card { position: relative; border: 3px solid #fff; border-radius: 16px; background: linear-gradient(180deg, #ffffff 0%, #fdeff6 100%); cursor: pointer;
    box-shadow: 0 4px 0 rgba(200,90,140,.3); padding: 3px 2px 5px; display: flex; flex-direction: column; align-items: center; color: #6a2c4a; min-height: 96px; transition: transform .1s; }
  .card:active { transform: translateY(3px); box-shadow: 0 1px 0 rgba(200,90,140,.3); }
  .card canvas { width: 48px; height: 50px; display: block; }
  .card .meta { display: flex; flex-direction: column; align-items: center; min-width: 0; }
  .card .nm { font-size: 14px; font-weight: 900; white-space: nowrap; }
  .card .rl { font-size: 11px; font-weight: 800; opacity: .7; white-space: nowrap; }
  .card .cost { display: flex; align-items: center; gap: 2px; font-weight: 900; font-size: 15px; color: #b36a00; }
  .card .cost svg { width: 15px; height: 15px; }
  .card.poor { filter: grayscale(.85); opacity: .6; }
  .card.shake { animation: kg-shake .35s ease; }
  .tinfo { display: flex; gap: 10px; align-items: center; }
  .tinfo canvas { width: 64px; height: 66px; flex: none; }
  .tinfo .tl { font-size: 13px; font-weight: 800; line-height: 1.35; opacity: .85; }
  .tinfo .tn { font-size: 18px; font-weight: 900; display: flex; align-items: center; gap: 6px; }
  .lvstars { display: inline-flex; gap: 1px; }
  .lvstars svg { width: 16px; height: 16px; }
  .tbtns { display: flex; gap: 8px; margin-top: 8px; }
  .tbtns .kg-btn { flex: 1; font-size: 17px; padding: 6px 8px; min-height: 52px; display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1.1; }
  .tbtns .kg-btn small { font-size: 13px; display: flex; align-items: center; gap: 2px; }
  .tbtns .kg-btn small svg { width: 14px; height: 14px; }
  .tbtns .kg-btn:disabled { filter: grayscale(.8); opacity: .6; }
  #vInfo { font-weight: 800; font-size: 14px; line-height: 1.45; }
  #legend { margin-top: 8px; display: flex; flex-direction: column; gap: 4px; }
  #legend .lg { display: flex; align-items: center; gap: 6px; font-size: 12.5px; line-height: 1.3; background: rgba(255,255,255,.7); border-radius: 12px; padding: 2px 6px 2px 2px; }
  #legend canvas { width: 34px; height: 34px; flex: none; }
  #legend b { color: #b0285e; }
  #vInfo .big { font-size: 16px; font-weight: 900; margin-bottom: 4px; }
  #ctx .v { display: none; }
  #ctx.build #vBuild, #ctx.tower #vTower, #ctx.info #vInfo { display: block; }
  #ctx.build #vBuild.cards { display: grid; }

  /* 直式：地圖在上、按鈕在下 */
  body.port #stats { position: fixed; top: 9px; left: 64px; right: 64px; z-index: 8000; display: flex; justify-content: center; gap: 6px; pointer-events: none; }
  body.port #stats .pill { padding: 0 9px 0 6px; font-size: 17px; height: 40px; }
  body.port #ctrl { position: fixed; left: 0; right: 0; bottom: 0; z-index: 8000; display: flex; align-items: center; gap: 8px;
    padding: 6px 10px calc(6px + env(safe-area-inset-bottom)); height: calc(64px + env(safe-area-inset-bottom));
    background: linear-gradient(180deg, rgba(255,240,247,.95), #ffe1ee); border-top: 3px solid #fff; box-shadow: 0 -6px 18px rgba(150,60,100,.15); }
  body.port .preview { flex: 1 1 0; }
  body.port .preview .lbl { display: none; }
  body.port .preview .lbl.fin { display: inline; font-size: 13px; }
  body.port .preview .pv, body.port .preview .pv canvas { width: 32px; height: 32px; }
  body.port #btnSend { flex: 0 1 150px; min-width: 0; }
  body.port #ctx { position: fixed; left: 8px; right: 8px; bottom: calc(72px + env(safe-area-inset-bottom)); z-index: 8100; max-width: 460px; margin: 0 auto; animation: tdUp .2s ease; }
  body.port #ctx.top { bottom: auto; top: 62px; animation: tdDown .2s ease; }
  body.port #ctx.info { display: none; }
  @media (max-width: 380px) { body.port #stats { left: 60px; right: 60px; gap: 4px; } body.port #stats .pill { font-size: 15px; padding: 0 6px 0 4px; gap: 3px; } body.port #stats svg.ic { width: 18px; height: 18px; } }
  /* 橫式：右側面板 */
  body.land #hud { position: fixed; top: 0; right: 0; bottom: 0; width: var(--panW, 210px); z-index: 8000; display: flex; flex-direction: column; gap: 8px;
    padding: 8px 8px calc(8px + env(safe-area-inset-bottom)); background: linear-gradient(180deg, #fff3f8 0%, #ffe0ed 100%); border-left: 4px solid #fff; box-shadow: -6px 0 20px rgba(150,60,100,.15); }
  #ctlRow { display: none; }
  body.land #stats { flex: none; display: flex; flex-wrap: wrap; gap: 6px; padding-right: 58px; min-height: 44px; align-content: center; }
  body.land #stats .pill, body.land #ctlRow .pill { height: 40px; font-size: 16px; padding: 0 8px 0 5px; gap: 4px; }
  body.land #ctlRow { display: flex; flex: none; gap: 6px; align-items: center; }
  body.land #ctlRow .pill { flex: 1 1 auto; justify-content: center; min-width: 0; }
  body.land #ctx { flex: 1 1 auto; min-height: 0; overflow: hidden; padding: 6px; }
  body.land #ctx.info .ctx-head .x { display: none; }
  body.land .cards { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
  body.land .card { min-height: 0; padding: 4px 3px; flex-direction: row; gap: 2px; justify-content: center; }
  body.land .card canvas { width: 36px; height: 38px; flex: none; }
  body.land .card .meta { align-items: flex-start; }
  body.land .card .nm { font-size: 13px; letter-spacing: -0.5px; }
  body.land #ctx.info { overflow-y: auto; touch-action: pan-y; }
  body.land .card .rl, body.land .tinfo .dsc { display: none; }
  body.land #ctrl { flex: none; display: flex; flex-wrap: wrap; gap: 7px; align-items: center; }
  body.land #btnSend { max-width: none; width: 100%; }
  body.land .preview { width: 100%; flex-wrap: wrap; row-gap: 4px; }
  body.land .tbtns .kg-btn { min-height: 48px; font-size: 16px; padding: 4px 6px; }
  body.land .ctx-head { padding-bottom: 3px; font-size: 14px; }
  body.land .ctx-head .x { width: 34px; height: 34px; font-size: 19px; }
  body.land .tbtns { margin-top: 6px; }
  body.land #ctx { position: relative; }
  body.land #ctx.build .ctx-head { display: none; }
  body.land #ctx.tower .ctx-head { position: absolute; top: 4px; right: 4px; padding: 0; z-index: 1; }
  body.land #ctx.tower #ctxTitle { display: none; }
  body.land #ctx.tower .ctx-head .x { width: 32px; height: 32px; font-size: 17px; }
  body.land #ctx.tower .tinfo { padding-right: 30px; }
  body.land .tinfo canvas { width: 44px; height: 46px; }
  body.land .tinfo .tn { font-size: 16px; flex-wrap: wrap; gap: 2px 6px; }
  @media (max-height: 700px) {
    body.port .ctx-head { font-size: 14px; padding-bottom: 3px; }
    body.port .ctx-head .x { width: 36px; height: 36px; font-size: 19px; }
    body.port .tinfo .dsc { display: none; }
    body.port .tinfo canvas { width: 50px; height: 52px; }
    body.port .tbtns .kg-btn { min-height: 48px; }
    body.port .card { min-height: 0; }
    body.port .card canvas { width: 42px; height: 44px; }
    body.port .card .rl { display: none; }
  }
  @media (max-height: 420px) { body.land #stats .pill { height: 34px; font-size: 16px; } body.land #ctx { padding: 5px; } body.land .ctx-head { padding-bottom: 3px; font-size: 14px; } body.land .ctx-head .x { width: 36px; height: 36px; } body.land .card .rl { display: none; } body.land .tinfo .tl { font-size: 12px; } }

  #tip { position: fixed; z-index: 8200; left: 50%; top: 66px; transform: translate(-50%, -8px); opacity: 0; pointer-events: none;
    display: flex; align-items: center; gap: 8px; width: max-content; max-width: min(92vw, 460px); padding: 8px 14px 8px 8px; border-radius: 20px;
    background: rgba(255,255,255,.96); border: 3px solid #ffd65c; color: #6a2c4a; font-weight: 800; font-size: 14.5px; line-height: 1.35;
    box-shadow: 0 6px 18px rgba(120,40,80,.25); transition: opacity .25s, transform .25s; }
  #tip.show { opacity: 1; transform: translate(-50%, 0); }
  #tip canvas { width: 46px; height: 46px; flex: none; }
  #tip b { color: #d0346a; }

  /* ---------- 畫面 ---------- */
  .scr { position: fixed; inset: 0; z-index: 9000; display: none; flex-direction: column; align-items: center; justify-content: center; padding: 64px 16px 16px; text-align: center; }
  .scr.show { display: flex; animation: tdFade .25s ease; }
  .scr.dim { background: rgba(110,40,80,.42); backdrop-filter: blur(2px); -webkit-backdrop-filter: blur(2px); }
  #titleScr { background: radial-gradient(ellipse at 50% 45%, rgba(255,246,250,.82) 0%, rgba(255,230,242,.55) 70%, rgba(255,220,236,.35) 100%); }
  .logo { font-weight: 900; font-size: clamp(44px, 12.5vw, 88px); line-height: 1.05; letter-spacing: 3px; white-space: nowrap; margin: 0 0 6px; }
  .logo span { display: inline-block; color: var(--c); paint-order: stroke fill; -webkit-text-stroke: .15em #7a2350;
    text-shadow: 0 .07em 0 #7a2350, 0 .15em 16px rgba(120,30,70,.3); animation: tdBob 2.4s ease-in-out infinite; animation-delay: calc(var(--i) * -.22s); }
  .sub { color: #8a2f5c; font-weight: 800; font-size: clamp(15px, 4vw, 20px); margin: 4px 0 16px; line-height: 1.45; text-shadow: 0 2px 0 #fff; }
  .acts { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
  .bigbtn { font-size: 26px !important; padding: 14px 40px !important; }
  .chip { margin-top: 14px; font-weight: 900; font-size: 16px; color: #8a2f5c; background: rgba(255,255,255,.85); border-radius: 999px; padding: 5px 16px; border: 3px solid #fff; display: inline-flex; align-items: center; gap: 6px; }
  .chip svg { width: 20px; height: 20px; }
  .tipline { margin-top: 12px; color: #9a3a68; font-weight: 700; font-size: 13.5px; line-height: 1.5; text-shadow: 0 1px 0 #fff; }

  #selectScr { background: rgba(255,228,240,.78); backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px); justify-content: flex-start; padding: 10px 12px 12px; overflow-y: auto; touch-action: pan-y; }
  .sel-head { margin-top: auto; flex: none; display: flex; align-items: center; justify-content: center; gap: 10px; min-height: 52px; width: 100%; padding: 0 58px; flex-wrap: wrap; }
  .sel-head h2 { margin: 0; font-size: 28px; font-weight: 900; color: #7a2350; text-shadow: 0 3px 0 #fff; }
  .sel-head .chip { margin: 0; }
  .grid { margin-bottom: auto; flex: none; display: grid; grid-template-columns: repeat(var(--cols, 3), minmax(0, 1fr)); gap: 12px; width: 100%; max-width: 980px; margin: 10px auto 0; padding-bottom: 8px; }
  .lv { position: relative; border: 4px solid #fff; border-radius: 22px; background: linear-gradient(180deg, #fff 0%, #ffeef6 100%); padding: 6px 6px 8px; cursor: pointer;
    box-shadow: 0 5px 0 rgba(200,90,140,.35), 0 10px 22px rgba(120,40,80,.15); color: #6a2c4a; display: flex; flex-direction: column; align-items: center; gap: 3px; transition: transform .12s; min-height: 48px; }
  .lv:active { transform: translateY(3px); }
  .lv canvas { width: 100%; aspect-ratio: 13 / 8; border-radius: 14px; display: block; }
  .lv .ln { font-size: 16px; font-weight: 900; white-space: nowrap; }
  .lv .ln em { font-style: normal; color: #d0346a; margin-right: 4px; }
  .lv .st { display: flex; gap: 2px; }
  .lv .st svg { width: 22px; height: 22px; }
  .lv .lock { position: absolute; inset: 0; border-radius: 18px; background: rgba(150,110,135,.4); display: none; align-items: flex-start; justify-content: center; pointer-events: none; }
  .lv .lock svg { width: 38px; height: 38px; margin-top: 16%; filter: drop-shadow(0 3px 0 rgba(90,40,70,.3)); }
  .lv .lk { font-size: 12.5px; font-weight: 900; color: #8a5a72; white-space: nowrap; line-height: 22px; }
  .lv.locked { cursor: not-allowed; }
  .lv.locked .lock { display: flex; }
  .lv.endless { background: linear-gradient(180deg, #fff9dd 0%, #ffe7a6 100%); }
  .lv .best { font-size: 13px; font-weight: 900; color: #a0582a; }

  .card2 { width: min(420px, 100%); background: linear-gradient(180deg, #fffafc 0%, #ffe3ef 100%); border: 5px solid #fff; border-radius: 30px; padding: 18px 18px 20px; color: #6a2c4a;
    box-shadow: 0 8px 0 #e08ab0, 0 18px 40px rgba(90,20,50,.4); animation: kg-pop .38s cubic-bezier(.2,1.6,.4,1); position: relative; }
  .card2 h2 { margin: 0 0 4px; font-size: 32px; font-weight: 900; }
  .card2 p { margin: 4px 0 12px; font-size: 17px; font-weight: 800; line-height: 1.45; }
  .stars3 { display: flex; justify-content: center; gap: 8px; margin: 4px 0 6px; }
  .stars3 svg { width: 60px; height: 60px; animation: tdStar .5s cubic-bezier(.2,1.6,.4,1) both; }
  .stars3 svg:nth-child(2) { width: 72px; height: 72px; margin-top: -10px; }
  .newrec { display: none; position: absolute; top: -18px; left: 50%; transform: translateX(-50%) rotate(-4deg); background: linear-gradient(180deg, #ffe066, #ffb020); color: #6b3a00; font-weight: 900; font-size: 18px; padding: 6px 18px; border-radius: 999px; border: 3px solid #fff; box-shadow: 0 4px 0 #c47c00; white-space: nowrap; }
  .newrec.show { display: block; }
  .hint { margin-top: 12px; font-size: 13px; font-weight: 700; opacity: .55; }
  @media (max-width: 480px) { .lv .ln { font-size: 13.5px; } .lv .st svg { width: 18px; height: 18px; } .lv { padding: 4px 4px 6px; border-radius: 18px; } .grid { gap: 8px; } }
  @media (orientation: landscape) and (max-height: 520px) {
    .scr { padding: 8px 70px; }
    .logo { font-size: clamp(38px, 13vh, 70px); }
    .sub { margin: 2px 0 10px; font-size: 16px; }
    .tipline, .hint { display: none; }
    .card2 { padding: 10px 16px 14px; }
    .card2 h2 { font-size: 26px; }
    .card2 p { margin: 2px 0 8px; font-size: 15px; }
    .stars3 svg { width: 46px; height: 46px; } .stars3 svg:nth-child(2) { width: 54px; height: 54px; }
    #selectScr { padding: 6px 66px 8px; }
    .sel-head { min-height: 44px; padding: 0; }
    .sel-head h2 { font-size: 22px; }
    .grid { gap: 8px; margin-top: 4px; }
    .lv { padding: 4px 4px 5px; border-radius: 18px; }
    .lv .ln { font-size: 13.5px; } .lv .st svg { width: 17px; height: 17px; }
  }
  @keyframes tdBob { 0%,100% { transform: translateY(0) rotate(-3deg); } 50% { transform: translateY(-7px) rotate(3deg); } }
  @keyframes tdFade { from { opacity: 0; } to { opacity: 1; } }
  @keyframes tdBump { 0% { transform: scale(1); } 40% { transform: scale(1.15); } 100% { transform: scale(1); } }
  @keyframes tdHurt { 0%,100% { transform: translateX(0); } 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }
  @keyframes tdUp { from { transform: translateY(30px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
  @keyframes tdDown { from { transform: translateY(-30px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
  @keyframes tdStar { from { transform: scale(.2) rotate(-40deg); opacity: 0; } to { transform: scale(1) rotate(0); opacity: 1; } }
</style>
</head>
<body>
<canvas id="game" aria-label="守護糖果屋遊戲畫面"></canvas>

<div id="hud">
  <div id="stats">
    <div class="pill" id="pLives" title="糖果（生命）"><svg class="ic"><use href="#i-candy"/></svg><b id="vLives">20</b></div>
    <div class="pill" id="pGold" title="金幣"><svg class="ic"><use href="#i-coin"/></svg><b id="vGold">0</b></div>
    <div class="pill" id="pWave" title="波數"><svg class="ic"><use href="#i-flag"/></svg><b id="vWave">0/8</b></div>
  </div>
  <div id="ctlRow"></div>
  <div id="ctx" class="info">
    <div class="ctx-head"><span id="ctxTitle">蓋一座塔</span><button class="x" id="ctxClose" aria-label="關閉">×</button></div>
    <div class="v cards" id="vBuild"></div>
    <div class="v" id="vTower">
      <div class="tinfo"><canvas id="tIcon" width="128" height="132"></canvas>
        <div><div class="tn"><span id="tName">泡泡塔</span><span class="lvstars" id="tLv"></span></div><div class="tl" id="tDesc"></div></div></div>
      <div class="tbtns">
        <button class="kg-btn green" id="btnUp">升級<small id="upCost"></small></button>
        <button class="kg-btn yellow" id="btnSell">賣掉<small id="sellVal"></small></button>
      </div>
    </div>
    <div class="v" id="vInfo"><div class="big">點地上的餅乾盤蓋塔！</div><div id="infoTxt">守住糖果屋，別讓小怪獸把糖果吃光。</div><div id="legend"></div></div>
  </div>
  <div id="ctrl">
    <div class="preview" id="preview"></div>
    <button class="kg-btn" id="btnSend">出兵！<small>+0 金</small></button>
    <button class="td-sq" id="btnSpeed" aria-label="加速" title="加速 (F)">×1</button>
    <button class="td-sq" id="btnPause" aria-label="暫停" title="暫停 (P)"><i></i><i></i></button>
  </div>

function genWave(L, w, endless) {

cv.addEventListener('pointerdown', ev => {
  if (G.screen !== 'play' || G.ended) return;
  ev.preventDefault();
  const m = G.map, px = ev.clientX, py = ev.clientY;
  let best = -1, bd = Math.pow(Math.max(CS * 0.72, 30), 2);
  for (let i = 0; i < m.spots.length; i++) {
    const s = m.spots[i], sx = SX(s.x, s.y), sy = SY(s.x, s.y);
    let d = (px - sx) * (px - sx) + (py - sy) * (py - sy);
    if (G.towers[i]) { const d2 = (px - sx) * (px - sx) + (py - sy + CS * 0.45) * (py - sy + CS * 0.45); if (d2 < d) d = d2; }

});
function moveSel(dx, dy) {
  const m = G.map; if (!m.spots.length) return;
  let cx, cy;
  if (G.sel >= 0) { const s = m.spots[G.sel]; cx = SX(s.x, s.y); cy = SY(s.x, s.y); }
  else { cx = OX + (land ? MC : MR) * CS / 2 - dx * 9999; cy = OY + (land ? MR : MC) * CS / 2 - dy * 9999; }
  let best = -1, bs = Infinity;
  m.spots.forEach((s, i) => {
    if (i === G.sel) return;
    const vx = SX(s.x, s.y) - cx, vy = SY(s.x, s.y) - cy, along = vx * dx + vy * dy;
    if (along <= 1) return;
    const side = Math.abs(vx * dy - vy * dx), score = along + side * 2.2;

  });

}
window.addEventListener('keydown', ev => {
  const k = ev.key;
  if (G.screen === 'title') { if (k === 'Enter' || k === ' ') { ev.preventDefault(); SFX('click'); toSelect(); } return; }
  if (G.screen === 'select') { if (k === 'Escape') toTitle(); return; }
  if (G.screen === 'paused') { if (k === 'p' || k === 'P' || k === 'Escape') { ev.preventDefault(); resume(); } return; }
  if (G.screen === 'end') { if (k === 'Escape') toSelect(); return; }
  if (G.screen !== 'play') return;
  if (k === 'p' || k === 'P') { ev.preventDefault(); pause(); }
  else if (k === 'Escape') { ev.preventDefault(); if (G.sel >= 0) select(-1); else pause(); }
  else if (k === ' ' || k === 'n' || k === 'N') { ev.preventDefault(); if (sendEarly()) SFX('click'); }

  else if (k === 'u' || k === 'U') { if (G.sel >= 0) upgrade(G.sel); }
  else if (k === 'x' || k === 'X' || k === 'Delete' || k === 'Backspace') { if (G.sel >= 0) sell(G.sel); }
  else if (k === 'ArrowLeft') { ev.preventDefault(); moveSel(-1, 0); }
  else if (k === 'ArrowRight') { ev.preventDefault(); moveSel(1, 0); }
