<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>3D 卡丁車</title>
<link rel="stylesheet" href="../../assets/common.css">
<style>
  html, body { height: 100%; overflow: hidden; background: #1b1534; }
  #gl { position: fixed; inset: 0; width: 100vw; height: 100vh; height: 100dvh; display: block; touch-action: none; }
  #msg { position: fixed; inset: 0; display: grid; place-items: center; padding: 24px; text-align: center; color: #fff; font-size: 20px; font-weight: 800; z-index: 1; }
  .ol { text-shadow: 2px 2px 0 #2b1d3a, -2px 2px 0 #2b1d3a, 2px -2px 0 #2b1d3a, -2px -2px 0 #2b1d3a, 0 3px 0 #2b1d3a, 0 5px 8px rgba(0,0,0,.35); }

  /* ---------- 比賽介面 ---------- */
  #hud { position: fixed; inset: 0; pointer-events: none; z-index: 40; color: #fff; font-weight: 900; display: none; }
  #hud.on { display: block; }
  #hPos { position: absolute; left: 12px; top: 66px; line-height: 1; display: flex; align-items: flex-end; gap: 2px; }
  #hPos b { font-size: 54px; font-style: italic; }
  #hPos span { font-size: 20px; padding-bottom: 6px; }
  #hPos.p1 b { color: #ffd84a; } #hPos.p2 b { color: #e8eefc; } #hPos.p3 b { color: #ffb070; }
  #hInfo { position: absolute; left: 14px; top: 124px; font-size: 16px; line-height: 1.35; }
  #hInfo .t { font-variant-numeric: tabular-nums; font-size: 18px; }
  #hCoin { display: flex; align-items: center; gap: 5px; }
  .coin { display: inline-block; width: 16px; height: 16px; border-radius: 50%; background: radial-gradient(circle at 35% 35%, #fff6b0, #ffc21a 55%, #d88a00); border: 2px solid #8a5200; }
  #hCoin.max span { color: #ffd84a; }
  #itemSlot { position: absolute; left: 50%; top: 8px; width: 70px; height: 70px; margin-left: -35px; border-radius: 20px; background: rgba(40, 24, 80, .55); border: 3px solid #fff; box-shadow: 0 4px 0 rgba(0,0,0,.25), inset 0 0 12px rgba(255,255,255,.25); }
  #itemSlot canvas { width: 100%; height: 100%; display: block; }
  #itemSlot.pop { animation: pop .35s cubic-bezier(.2,1.6,.4,1); }
  #itemSlot.roll { border-color: #ffd84a; }
  #itemCount { position: absolute; right: -6px; bottom: -6px; font-size: 16px; background: #ff5c93; border-radius: 10px; padding: 0 6px; border: 2px solid #fff; display: none; }
  #itemName { position: absolute; left: 50%; top: 82px; transform: translateX(-50%); font-size: 14px; white-space: nowrap; opacity: 0; transition: opacity .3s; }
  #itemName.on { opacity: 1; }
  #mini { position: absolute; right: 10px; top: 112px; width: 116px; height: 116px; }
  #count { position: absolute; left: 0; right: 0; top: 30%; text-align: center; font-size: 120px; font-style: italic; opacity: 0; }
  #count.go { color: #7dff8a; }
  #count.on { animation: cnt .9s ease-out forwards; }
  #banner { position: absolute; left: 0; right: 0; top: 24%; text-align: center; font-size: 38px; opacity: 0; transform: scale(.6); transition: opacity .25s, transform .3s cubic-bezier(.2,1.6,.4,1); padding: 0 12px; }
  #banner.on { opacity: 1; transform: scale(1); }
  #banner small { display: block; font-size: 18px; margin-top: 6px; }
  #banner.warn { color: #ff6a6a; }
  #lapPop { position: absolute; left: 0; right: 0; top: 34%; text-align: center; font-size: 22px; opacity: 0; transition: opacity .3s; }
  #lapPop.on { opacity: 1; }
  #speedo { position: absolute; left: 50%; bottom: 14px; transform: translateX(-50%); font-style: italic; display: flex; align-items: baseline; gap: 4px; }
  #speedo b { font-size: 34px; font-variant-numeric: tabular-nums; min-width: 2.2em; text-align: right; }
  #speedo small { font-size: 14px; }
  #speedo.hide { display: none; }
  #lines { position: absolute; inset: -10%; opacity: 0; background: repeating-conic-gradient(from 0deg at 50% 55%, rgba(255,255,255,0) 0deg 5deg, rgba(255,255,255,.55) 5deg 5.5deg, rgba(255,255,255,0) 5.5deg 11deg);
    -webkit-mask-image: radial-gradient(ellipse at 50% 55%, transparent 38%, #000 80%); mask-image: radial-gradient(ellipse at 50% 55%, transparent 38%, #000 80%); animation: spin 0.25s steps(3) infinite; display: none; }
  #lines.on { display: block; }
  @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(3deg); } }
  @keyframes cnt { 0% { opacity: 0; transform: scale(2.2); } 18% { opacity: 1; transform: scale(.9); } 30% { transform: scale(1.05); } 70% { opacity: 1; transform: scale(1); } 100% { opacity: 0; transform: scale(.8); } }
  @keyframes pop { 0% { transform: scale(.6); } 100% { transform: scale(1); } }

  #pauseBtn { position: fixed; right: 12px; top: 62px; width: 44px; height: 44px; border-radius: 50%; border: 3px solid #fff; background: rgba(40,24,80,.6); z-index: 60; display: none; place-items: center; cursor: pointer; box-shadow: 0 4px 0 rgba(0,0,0,.25); padding: 0; }
  #pauseBtn.on { display: grid; }
  #pauseBtn i { display: block; width: 14px; height: 16px; border-left: 5px solid #fff; border-right: 5px solid #fff; }

  /* ---------- 觸控按鈕 ---------- */
  #touch { display: none; }
  #touch.on { display: block; }
  #steer { position: fixed; z-index: 45; left: calc(10px + env(safe-area-inset-left)); bottom: calc(14px + env(safe-area-inset-bottom)); width: min(46vw, 230px); height: 104px; border-radius: 52px; background: rgba(30, 20, 60, .35); border: 3px solid rgba(255,255,255,.7); display: flex; touch-action: none; overflow: hidden; box-shadow: 0 4px 0 rgba(0,0,0,.2); }
  #steer .half { flex: 1; display: grid; place-items: center; transition: background .08s; }
  #steer .half.on { background: rgba(255,255,255,.35); }
  #steer .tri { width: 0; height: 0; border-top: 18px solid transparent; border-bottom: 18px solid transparent; }
  #steer .l .tri { border-right: 26px solid #fff; }
  #steer .r .tri { border-left: 26px solid #fff; }
  #steer .sep { width: 2px; background: rgba(255,255,255,.4); margin: 18px 0; }
  .tbtn { position: fixed; z-index: 45; border-radius: 50%; display: grid; place-items: center; color: #fff; font-weight: 900; touch-action: none; border: 3px solid rgba(255,255,255,.85); box-shadow: 0 5px 0 rgba(0,0,0,.25); user-select: none; -webkit-user-select: none; text-shadow: 0 2px 0 rgba(0,0,0,.3); transition: transform .06s; }
  .tbtn.on { transform: scale(.9) translateY(3px); box-shadow: 0 2px 0 rgba(0,0,0,.25); filter: brightness(1.15); }
  #bDrift { right: calc(14px + env(safe-area-inset-right)); bottom: calc(16px + env(safe-area-inset-bottom)); width: 98px; height: 98px; background: radial-gradient(circle at 35% 30%, #ffc07a, #ff6a2a 70%); font-size: 21px; }
  #bItem { right: calc(124px + env(safe-area-inset-right)); bottom: calc(46px + env(safe-area-inset-bottom)); width: 74px; height: 74px; background: rgba(60, 30, 110, .6); }
  #bItem canvas { width: 58px; height: 58px; }
  #bItem.empty canvas { opacity: .35; }
  #bBrake { right: calc(30px + env(safe-area-inset-right)); bottom: calc(126px + env(safe-area-inset-bottom)); width: 64px; height: 64px; background: rgba(70, 80, 110, .65); font-size: 16px; }

  /* ---------- 選單 ---------- */
  #menu { position: fixed; inset: 0; z-index: 9000; display: none; overflow-y: auto; overflow-x: hidden; -webkit-overflow-scrolling: touch; }
  #menu.on { display: block; }
  #menu.dim { background: linear-gradient(180deg, rgba(20,10,50,.25), rgba(20,10,50,.55)); }
  .scr { display: none; min-height: 100%; padding: 66px 14px 18px; flex-direction: column; align-items: center; justify-content: center; gap: 14px; }
  .scr.on { display: flex; }
  .panel { background: linear-gradient(180deg, rgba(255,255,255,.97), rgba(255,240,248,.97)); border: 4px solid #fff; border-radius: 26px; box-shadow: 0 14px 40px rgba(20,10,50,.45); padding: 16px 16px 18px; width: min(560px, 100%); color: #3a2a4a; }
  .ptitle { font-size: 26px; font-weight: 900; text-align: center; margin: 0 0 10px; }
  .psub { text-align: center; font-size: 15px; margin: -6px 0 10px; color: #7a6a8a; font-weight: 700; }
  .prow { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-top: 12px; }
  .kg-btn.sm { font-size: 17px; padding: 10px 20px; }

  .logo { text-align: center; color: #fff; line-height: 1; filter: drop-shadow(0 6px 0 rgba(43,29,58,.55)); }
  .logo1 { font-size: clamp(46px, 13vw, 82px); font-weight: 900; font-style: italic; letter-spacing: 2px; color: #ffd84a; text-shadow: 3px 3px 0 #ff5c93, -3px 3px 0 #ff5c93, 3px -3px 0 #ff5c93, -3px -3px 0 #ff5c93, 0 7px 0 #7a2a8a; }
  .logo2 { margin-top: 10px; font-size: clamp(18px, 5vw, 26px); font-weight: 900; letter-spacing: 6px; display: inline-block; background: #2b1d3a; padding: 6px 16px 6px 22px; border-radius: 999px; border: 3px solid #fff; }
  .tbtns { display: flex; flex-direction: column; gap: 12px; width: min(340px, 100%); }
  .mbtn { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 10px 18px 12px; }
  .mbtn b { font-size: 24px; }
  .mbtn small { font-size: 13px; font-weight: 700; opacity: .92; }
  .chip { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; justify-content: center; }
  .cupbox { display: flex; gap: 6px; align-items: center; background: rgba(43,29,58,.6); color: #fff; border-radius: 999px; padding: 4px 12px 4px 6px; font-weight: 800; font-size: 14px; border: 2px solid rgba(255,255,255,.6); }
  .cupbox canvas { width: 26px; height: 26px; }
  .tog { font-family: var(--kg-font); font-weight: 800; font-size: 15px; border: 3px solid #fff; border-radius: 999px; padding: 7px 14px; background: rgba(43,29,58,.65); color: #fff; cursor: pointer; }
  .tog i { font-style: normal; color: #7dff8a; margin-left: 4px; }
  .tog.off i { color: #ff8a8a; }
  .hint { color: #fff; font-size: 13px; font-weight: 700; text-align: center; text-shadow: 0 1px 3px rgba(0,0,0,.6); }

  .chars { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .char { font-family: var(--kg-font); border: 3px solid #eadff2; background: #fff; border-radius: 18px; padding: 6px 4px 6px; display: flex; flex-direction: column; align-items: center; cursor: pointer; color: #3a2a4a; transition: transform .12s; }
  .char img { width: 58px; height: 58px; }
  .char b { font-size: 16px; } .char small { font-size: 12px; color: #8a7a9a; font-weight: 700; }
  .char.sel { border-color: #ff5c93; background: #fff0f6; transform: translateY(-2px); box-shadow: 0 5px 0 #ff5c93; }
  .diffRow { display: flex; align-items: center; gap: 10px; justify-content: center; margin-top: 12px; font-weight: 900; }
  .seg { display: flex; background: #efe6f6; border-radius: 999px; padding: 4px; gap: 4px; }
  .seg button { font-family: var(--kg-font); border: 0; border-radius: 999px; padding: 7px 14px; font-size: 16px; font-weight: 900; background: transparent; color: #7a6a8a; cursor: pointer; }
  .seg button.sel { background: linear-gradient(180deg, #ffe58a, #f5b82e); color: #6b4a00; box-shadow: 0 3px 0 #c48a12; }

  .tracks { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
  .trk { font-family: var(--kg-font); border: 3px solid #eadff2; background: #fff; border-radius: 18px; padding: 6px; cursor: pointer; display: flex; flex-direction: column; align-items: center; color: #3a2a4a; }
  .trk canvas { width: 100%; max-width: 180px; aspect-ratio: 16/10; border-radius: 12px; }
  .trk b { font-size: 17px; margin-top: 4px; } .trk small { font-size: 12px; color: #8a7a9a; font-weight: 700; }
  .trk:active, .char:active { transform: scale(.96); }

  .res { width: 100%; border-collapse: collapse; font-weight: 800; font-size: 15px; }
  .res td { padding: 3px 4px; border-bottom: 2px solid #f1e6f6; vertical-align: middle; }
  .res tr.me td { background: #fff3c4; }
  .res td.pl { width: 30px; font-size: 18px; text-align: center; font-style: italic; }
  .res td.fc { width: 36px; } .res td.fc img { width: 32px; height: 32px; display: block; }
  .res td.tm { text-align: right; font-variant-numeric: tabular-nums; color: #6a5a7a; }
  .res td.pt { text-align: right; width: 72px; color: #e8457a; white-space: nowrap; }
  .res td.pt small { color: #9a8aaa; }
  .rbig { font-size: 30px; font-weight: 900; text-align: center; }
  .rbig.gold { color: #e8a200; } .rbig.lose { color: #7a6a8a; }
  .rec { text-align: center; color: #e8457a; font-weight: 900; }
  .laps { display: flex; gap: 6px; justify-content: center; flex-wrap: wrap; margin: 6px 0; font-weight: 800; font-size: 14px; }
  .laps span { background: #f3ecf8; border-radius: 10px; padding: 4px 8px; }
  .laps span.best { background: #fff3c4; color: #b07800; }

  #sChar, #sResult.podium { justify-content: flex-end; }
  #sChar .panel, #sResult.podium .panel { width: min(520px, 100%); }
  @media (min-aspect-ratio: 5/4) {
    #sChar, #sResult.podium { align-items: flex-end; justify-content: center; padding-right: max(16px, env(safe-area-inset-right)); }
    #sChar .panel, #sResult.podium .panel { width: min(470px, 56vw); }
  }
  @media (max-height: 560px) {
    .scr { padding-top: 12px; padding-bottom: 12px; gap: 10px; }
    .panel { padding: 10px 12px 12px; border-radius: 20px; }
    .ptitle { font-size: 21px; margin-bottom: 6px; }
    .char img { width: 42px; height: 42px; }
    .char { padding: 3px; }
    .chars { grid-template-columns: repeat(6, 1fr); gap: 5px; }
    .char small { display: none; }
    .tracks { grid-template-columns: repeat(4, 1fr); }
    .trk b { font-size: 15px; }
    .res td { padding: 1px 4px; } .res td.fc img { width: 24px; height: 24px; }
    .rbig { font-size: 24px; }
    .logo1 { font-size: 50px; } .logo2 { font-size: 17px; margin-top: 6px; }
    .mbtn b { font-size: 19px; } .mbtn small { font-size: 11px; } .mbtn { padding: 6px 14px 8px; }
    .tbtns { gap: 8px; }
    #mini { width: 96px; height: 96px; right: 66px; top: 8px; }
    #hPos b { font-size: 42px; }
    #hInfo { top: 108px; font-size: 14px; }
    #steer { height: 88px; width: 200px; }
    #bDrift { width: 84px; height: 84px; font-size: 18px; }
    #bItem { width: 64px; height: 64px; right: calc(108px + env(safe-area-inset-right)); bottom: calc(30px + env(safe-area-inset-bottom)); }
    #bItem canvas { width: 50px; height: 50px; }
    #bBrake { width: 56px; height: 56px; right: calc(26px + env(safe-area-inset-right)); bottom: calc(108px + env(safe-area-inset-bottom)); font-size: 14px; }
    #count { font-size: 90px; top: 22%; }
  }
  @media (min-aspect-ratio: 5/4) and (max-height: 560px) {
    #sChar, #sResult.podium { padding-right: calc(66px + env(safe-area-inset-right)); }
  }
  @media (min-aspect-ratio: 4/3) and (max-height: 560px) {
    #sTitle { flex-direction: row; flex-wrap: wrap; gap: 8px 40px; padding-top: 56px; }
    #sTitle .chip, #sTitle .hint { width: 100%; }
  }
  @media (max-width: 360px) {
    .mbtn b { font-size: 21px; }
    #steer { width: 150px; }
    #bItem { right: 112px; }
  }
</style>

<body>
<div id="msg">3D 卡丁車 載入中…</div>
<canvas id="gl" aria-label="3D 卡丁車遊戲畫面"></canvas>

<div id="hud">
  <div id="lines"></div>
  <div id="hPos" class="ol"><b>6</b><span>/6</span></div>
  <div id="hInfo" class="ol"><div id="hLap">第 1/3 圈</div><div id="hTime" class="t">0:00.00</div><div id="hCoin"><i class="coin"></i><span>0</span></div></div>
  <div id="itemSlot"><canvas id="itemCv" width="140" height="140"></canvas><span id="itemCount" class="ol"></span></div>
  <div id="itemName" class="ol"></div>
  <canvas id="mini"></canvas>
  <div id="count" class="ol"></div>
  <div id="banner" class="ol"></div>
  <div id="lapPop" class="ol"></div>
  <div id="speedo" class="ol"><b id="spd">0</b><small>km/h</small></div>
</div>
<button id="pauseBtn" aria-label="暫停"><i></i></button>
<div id="touch">
  <div id="steer"><div class="half l"><i class="tri"></i></div><div class="sep"></div><div class="half r"><i class="tri"></i></div></div>
  <div id="bBrake" class="tbtn">煞車</div>
  <div id="bItem" class="tbtn empty"><canvas id="bItemCv" width="116" height="116"></canvas></div>
  <div id="bDrift" class="tbtn">漂移</div>
</div>

<div id="menu">
  <section class="scr" id="sTitle">
    <div class="logo"><div class="logo1">3D 卡丁車</div><div class="logo2">動物大獎賽</div></div>
    <div class="tbtns">
      <button class="kg-btn yellow mbtn" data-go="gp"><b>大獎賽</b><small>連續 4 場比賽，搶總冠軍獎盃</small></button>
      <button class="kg-btn mbtn" data-go="single"><b>單場比賽</b><small>挑一條賽道和大家比一場</small></button>
      <button class="kg-btn blue mbtn" data-go="tt"><b>計時賽</b><small>挑戰最快紀錄和幽靈車</small></button>
    </div>
    <div class="chip" id="cups"></div>
    <div class="chip">
      <button class="tog" data-tog="music">音樂<i>開</i></button>
      <button class="tog" data-tog="sfx">音效<i>開</i></button>
      <button class="tog" data-tog="auto">自動加速<i>開</i></button>
    </div>
    <div class="hint" id="kbHint">方向鍵／WASD 駕駛 · 空白鍵 漂移 · Shift 或 X 道具 · P 暫停</div>
  </section>

  <section class="scr" id="sChar">
    <div class="panel">
      <div class="ptitle">選擇車手</div>
      <div class="chars" id="charGrid"></div>
      <div class="diffRow" id="diffRow"><span>難度</span><div class="seg" id="diffSeg"></div></div>
      <div class="prow"><button class="kg-btn blue sm" data-go="back">返回</button><button class="kg-btn green" data-go="charOk">下一步</button></div>
    </div>
  </section>

  <section class="scr" id="sTrack">
    <div class="panel">
      <div class="ptitle" id="trackTitle">選擇賽道</div>
      <div class="tracks" id="trackGrid"></div>
      <div class="prow"><button class="kg-btn blue sm" data-go="backChar">返回</button></div>
    </div>
  </section>

  <section class="scr" id="sPause">
    <div class="panel" style="width:min(340px,100%)">
      <div class="ptitle">暫停</div>
      <div class="psub" id="pauseInfo"></div>
      <div class="tbtns" style="width:100%">
        <button class="kg-btn green" data-go="resume">繼續比賽</button>
        <button class="kg-btn yellow" data-go="restart">重新開始</button>
        <button class="kg-btn blue" data-go="menu">回主選單</button>
      </div>
      <div class="chip" style="margin-top:12px">
        <button class="tog" data-tog="music" style="color:#fff">音樂<i>開</i></button>
        <button class="tog" data-tog="sfx">音效<i>開</i></button>
        <button class="tog" data-tog="auto">自動加速<i>開</i></button>
      </div>
    </div>
  </section>

  <section class="scr" id="sResult"><div class="panel" id="resPanel"></div></section>
</div>

<script src="../../assets/common.js"></script>
<script src="../../assets/kg-music.js"></script>
<script type="module">
import * as THREE from 'three';

let renderer = null;
try {
  renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('gl'), antialias: (window.devicePixelRatio || 1) < 1.5 && !KG.lowEnd, powerPreference: 'high-performance' });
} catch (e) { renderer = null; }
if (!renderer) document.getElementById('msg').textContent = '這個遊戲需要支援 3D（WebGL）的瀏覽器，請換一個瀏覽器或裝置再試試看。';
else main();

function main() {
  const $ = id => document.getElementById(id);
  const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
  const lerp = (a, b, t) => a + (b - a) * t;
  const damp = (a, b, k, dt) => a + (b - a) * (1 - Math.exp(-k * dt));
  const TAU = Math.PI * 2;
  const wrapA = a => { while (a > Math.PI) a -= TAU; while (a < -Math.PI) a += TAU; return a; };
  const hexCss = h => '#' + h.toString(16).padStart(6, '0');
  function mulberry(seed) {
    return function () {
      seed |= 0; seed = seed + 0x6D2B79F5 | 0;
      let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }
  const fmtT = t => { if (t == null || !isFinite(t)) return '--:--.--'; const m = Math.floor(t / 60), s = t - m * 60; return m + ':' + (s < 10 ? '0' : '') + s.toFixed(2); };

  /* =========================================================
   * 資料：車手、道具、賽道、難度
   * ========================================================= */
  const CHARS = [

    const lost = Math.min(k.coins, 2);
    k.coins -= lost;
    if (kind === 'bubble') { k.bubbleT = 1.6; k.speed *= 0.3; } else { k.spinT = 1.15; k.speed *= 0.45; }
    burst(k.x, k.y + 1.2, k.z, 14, 7, 1, 1, 0.6, 0.55, 0.7, 5);
    if (lost) burst(k.x, k.y + 1.2, k.z, lost * 3, 6, 1, 0.8, 0.2, 0.5, 0.8, 12, 1.2);
    if (k.isPlayer) {
      sfx(kind === 'bubble' ? 'k_trap' : 'k_spin'); if (lost) sfx('k_coinlose');
      shake = Math.max(shake, 0.5); KG.vibrate(80);
    } else {
      sfxAt(kind === 'bubble' ? 'k_trap' : 'k_spin', k, 0.6);
      if (by && by.isPlayer) showLapPop('命中 ' + k.ch.name + '！', 1.0);
    }
    return true;
  }

  function useItem(k) {
    if (k.item < 0 || k.rollT > 0) return;
    const it = k.item;
    const fx = Math.sin(k.h), fz = Math.cos(k.h);
    if (it === ROCKET) {
      boost(k, 1.6, 1.55); k.rocketT = 1.6;
      if (k.isPlayer) { sfx('k_rocket'); shake = Math.max(shake, 0.2); } else sfxAt('k_rocket', k, 0.6);
    } else if (it === JELLY) {
      if (jellies.length >= 10) jellies.shift();
      jellies.push({ x: k.x - fx * 2.6, z: k.z - fz * 2.6, y: k.ground, t: 0, owner: k });
      if (k.isPlayer) sfx('k_jelly'); else sfxAt('k_jelly', k, 0.6);
    } else if (it === BUBBLE) {
      let target = null;
      const pl = k.place;
      if (pl > 1) target = order[pl - 2];
      if (bubbles.length >= 8) bubbles.shift();
      const b = { x: k.x + fx * 2.4, z: k.z + fz * 2.4, y: k.y + 0.9, h: k.h, sp: Math.max(46, k.speed + 18), life: 7, owner: k, target, idx: k.idx, lat: 0, along: 0, t: 0 };
      bubbles.push(b);
      if (k.isPlayer) sfx('k_bubble'); else sfxAt('k_bubble', k, 0.6);
    } else if (it === SHIELD) {
      k.shieldT = 9;
      if (k.isPlayer) sfx('k_shield'); else sfxAt('k_shield', k, 0.5);
    } else if (it === MAGNET) {
      k.magnetT = 6; k.coins = Math.min(10, k.coins + 2);
      if (k.isPlayer) sfx('k_magnet'); else sfxAt('k_magnet', k, 0.5);
    }
    if (k.itemN > 1) k.itemN--; else { k.item = -1; k.itemN = 0; }
  }

  /* ---------- 卡丁車物理 ---------- */
  function stepKart(k, dt) {
    const c = k.ctl, t = TR, D = DIFFS[race.diff];
    if (k.boostT > 0) { k.boostT -= dt; if (k.boostT <= 0) { k.boostT = 0; k.boostPow = 1; } }
    if (k.shieldT > 0) k.shieldT = Math.max(0, k.shieldT - dt);
    if (k.magnetT > 0) k.magnetT = Math.max(0, k.magnetT - dt);
    if (k.rocketT > 0) k.rocketT = Math.max(0, k.rocketT - dt);
    if (k.rollT > 0) { k.rollT -= dt; if (k.rollT <= 0) { k.rollT = 0; k.item = k.rollItem; k.itemN = 1; if (k.isPlayer) { sfx('k_get'); itemPop(); } else k.ai.itemT = D.itemDelay * (0.5 + k.ai.rng()); } }
    const base = D.speed * k.skill * (1 + 0.012 * k.coins);
    let maxS = base;
    if (k.boostT > 0) maxS = base * k.boostPow;
    else if (k.offroad) maxS = base * 0.55;
    const sp = Math.abs(k.speed);
    if (k.hy > 0 || k.vy > 0) { k.vy -= 24 * dt; k.hy += k.vy * dt; if (k.hy <= 0) { k.hy = 0; k.vy = 0; } }
    let steer = c.steer;
    if (k.spinT > 0) {
      k.spinT -= dt; k.spinA += dt * 13; k.speed = damp(k.speed, 0, 2.2, dt); steer = 0;
      if (k.spinT <= 0) { k.spinT = 0; k.spinA = 0; }
    } else if (k.bubbleT > 0) {
      k.bubbleT -= dt; k.speed = damp(k.speed, 0, 3.5, dt); steer = 0;
      if (k.bubbleT <= 0) { k.bubbleT = 0; burst(k.x, k.y + 1.5, k.z, 14, 6, 0.6, 0.9, 1, 0.6, 0.5, 2); if (k.isPlayer) sfx('k_pop'); else sfxAt('k_pop', k, 0.6); }
    } else {
      const thr = c.throttle;
      if (thr > 0) {
        if (k.speed < maxS) k.speed = Math.min(maxS, k.speed + ((maxS - k.speed) * (k.boostT > 0 ? 3.2 : 1.05) + 1.6) * dt * thr);
        else k.speed = damp(k.speed, maxS, 1.6, dt);
      } else if (thr < 0) {
        if (k.speed > 0.5) k.speed -= 30 * dt; else k.speed = Math.max(-8, k.speed - 12 * dt);
      } else k.speed = damp(k.speed, k.speed > maxS ? maxS : 0, 0.8, dt);
      // 漂移
      if (c.driftPressed) {
        c.driftPressed = false;
        if (k.hy === 0 && sp > 6) { k.vy = 4.4; k.hy = 0.001; if (k.isPlayer) sfx('k_hop'); }
        k.wantDrift = true;
      }
      if (!c.drift) { k.wantDrift = false; if (k.drift) endDrift(k, true); }
      else if (k.wantDrift && !k.drift && Math.abs(steer) > 0.25 && sp > 10) { k.drift = steer > 0 ? 1 : -1; k.charge = 0; k.spark = 0; k.wantDrift = false; }
      if (k.drift && sp < 7) endDrift(k, false);
      if (k.drift) {
        const sd = clamp(steer * k.drift, -1, 1);
        k.h -= k.drift * (0.55 + 0.8 * (sd + 1)) * Math.min(1, sp / 12) * dt;
        k.charge += dt * (0.55 + 0.75 * Math.max(0, sd)) * (k.offroad ? 0.4 : 1);
        const lvl = k.charge > 2.7 ? 3 : k.charge > 1.7 ? 2 : k.charge > 0.85 ? 1 : 0;
        if (lvl > k.spark) { k.spark = lvl; if (k.isPlayer) sfx('k_spark', { pitch: [1, 1, 1.26, 1.5][lvl] }); }
      } else {
        const g = Math.min(1, sp / 5) * (1 - 0.3 * Math.min(1, sp / (D.speed * 1.2)));
        k.h -= steer * 2.15 * g * dt * (k.speed < 0 ? -1 : 1);
      }
    }
    k.steerVis = damp(k.steerVis, steer, 10, dt);
    k.h = wrapA(k.h);
    k.x += Math.sin(k.h) * k.speed * dt;
    k.z += Math.cos(k.h) * k.speed * dt;
    locate(k);
    // 護欄
    const lim = t.wallOff - 0.8;
    if (Math.abs(k.lat) > lim) {
      const s = k.lat > 0 ? 1 : -1, over = Math.abs(k.lat) - lim, i = k.idx;
      k.x -= t.rx[i] * s * over; k.z -= t.rz[i] * s * over; k.lat = s * lim;
      const d = wrapA(k.h - t.ang[i]);
      const into = -Math.sin(d) * s * (k.speed >= 0 ? 1 : -1);
      if (into > 0.03) {
        const hard = into * Math.abs(k.speed);
        k.h = wrapA(t.ang[i] + (Math.abs(d) < Math.PI / 2 ? d * 0.3 : d));
        k.speed *= into > 0.35 ? 0.6 : 0.9;
        if (hard > 4) {
          const px = k.x + t.rx[i] * s * 0.9, pz = k.z + t.rz[i] * s * 0.9;
          burst(px, k.y + 0.5, pz, 8, 8, 1, 0.85, 0.3, 0.35, 0.4, 14);
          if (k.isPlayer) { sfx('k_wall', vary()); shake = Math.max(shake, Math.min(0.5, hard / 40)); KG.vibrate(30); } else sfxAt('k_wall', k, 0.5);
        }
        if (k.drift && into > 0.3) endDrift(k, false);
      }
    }
    k.offroad = Math.abs(k.lat) > t.curbOut + 0.3 && k.hy < 0.3;
    k.curb = !k.offroad && Math.abs(k.lat) > t.half - 0.3;
    k.ground = t.cy[k.idx] + t.slope[k.idx] * k.along;
    k.y = k.ground + k.hy;
    const s = trackS(k);
    let ds = s - k.sPrev;
    if (ds > t.N / 2) ds -= t.N; else if (ds < -t.N / 2) ds += t.N;
    k.total += ds; k.sPrev = s;
    k.wheelRot += k.speed * dt / 0.34;
    // 加速板
    for (let p = 0; p < pads.length; p++) {
      const pd = pads[p];
      let di = k.idx - pd.i; if (di > t.N / 2) di -= t.N; if (di < -t.N / 2) di += t.N;
      if (Math.abs(di) < 2.5 && Math.abs(k.lat - pd.lat) < 2.4 && k.hy < 0.5 && k.boostT < 0.9) {
        boost(k, 1.0, 1.36);
        if (k.isPlayer) { sfx('k_pad'); shake = Math.max(shake, 0.12); } else sfxAt('k_pad', k, 0.4);
      }
    }
  }

  function kartCollisions() {
    for (let a = 0; a < 6; a++) {
      const A = karts[a];
      if (!A.active || A.bubbleT > 0) continue;
      for (let b = a + 1; b < 6; b++) {
        const B = karts[b];
        if (!B.active || B.bubbleT > 0) continue;
        const dx = B.x - A.x, dz = B.z - A.z, d2 = dx * dx + dz * dz;
        if (d2 > 3.1 || Math.abs(A.y - B.y) > 1.5) continue;
        const d = Math.sqrt(d2) || 0.01, nx = dx / d, nz = dz / d, push = (1.76 - d) / 2;
        A.x -= nx * push; A.z -= nz * push; B.x += nx * push; B.z += nz * push;
        const va = A.speed, vb = B.speed;
        const rel = Math.abs(va - vb);
        if (va > vb) { A.speed = va - rel * 0.35; B.speed = vb + rel * 0.3; } else { B.speed = vb - rel * 0.35; A.speed = va + rel * 0.3; }
        if (A.rocketT > 0 && B.rocketT <= 0) hitKart(B, 'spin', A);
        else if (B.rocketT > 0 && A.rocketT <= 0) hitKart(A, 'spin', B);
        if ((A.isPlayer || B.isPlayer) && (rel > 3 || d < 1.4)) { sfx('k_bump', vary()); shake = Math.max(shake, 0.15); KG.vibrate(15); }
        burst((A.x + B.x) / 2, A.y + 0.6, (A.z + B.z) / 2, 3, 5, 1, 0.9, 0.5, 0.3, 0.3, 10);
      }
    }
  }

  /* ---------- 電腦對手 ---------- */
  function aiControl(k, dt) {
    const c = k.ctl, ai = k.ai, t = TR, N = t.N, D = DIFFS[race.diff];
    ai.laneT -= dt;
    if (ai.laneT <= 0) { ai.lane = (ai.rng() - 0.5) * (t.half * 2 - 5); ai.laneT = 2 + ai.rng() * 3; }
    let lane = ai.lane;
    // 去吃道具箱
    if (k.item < 0 && k.rollT <= 0 && boxes.length) {
      for (let b = 0; b < boxes.length; b += 4) {
        let di = boxes[b].i - k.idx; if (di < 0) di += N;
        if (di > 4 && di < 45) {
          let bl = 1e9;
          for (let q = 0; q < 4; q++) { const bx = boxes[b + q]; if (bx.alive && Math.abs(bx.lat - lane) < Math.abs(bl - lane)) bl = bx.lat; }
          if (bl < 1e8) lane = bl;
          break;
        }
      }
    }
    // 閃開果凍與前車
    for (let j = 0; j < jellies.length; j++) {
      const J = jellies[j], dx = J.x - k.x, dz = J.z - k.z;
      const fwd = dx * Math.sin(k.h) + dz * Math.cos(k.h);
      if (fwd > 2 && fwd < 22) { const latJ = -dx * Math.cos(k.h) + dz * Math.sin(k.h); if (Math.abs(latJ - (lane - k.lat)) < 2.6) lane += latJ > 0 ? -3.2 : 3.2; }
    }
    lane = clamp(lane, -t.half + 1.6, t.half - 1.6);
    const la = 5 + Math.abs(k.speed) * 0.42;
    const ti = (k.idx + Math.round(la / t.sp)) % N;
    const px = t.cx[ti] + t.rx[ti] * lane, pz = t.cz[ti] + t.rz[ti] * lane;
    const desired = Math.atan2(px - k.x, pz - k.z);
    const diff = wrapA(desired - k.h);
    c.steer = clamp(-diff * 2.6, -1, 1);
    c.throttle = 1;
    if (Math.abs(diff) > 1.7) { ai.wrongT += dt; } else ai.wrongT = 0;
    // 彎道漂移
    let ca = 0;
    for (let o = 6; o <= 30; o += 4) ca += t.curv[(k.idx + o) % N];
    ca /= 7;
    ai.driftCool -= dt;
    if (!ai.drifting && !k.drift && Math.abs(ca) > 0.02 && k.speed > 14 && ai.driftCool <= 0 && k.hy === 0) {
      if (ai.rng() < D.driftSkill) { ai.drifting = true; c.driftPressed = true; c.drift = true; c.steer = ca > 0 ? 1 : -1; ai.maxLvl = 1 + Math.floor(ai.rng() * 2.5 * D.driftSkill); }
      else ai.driftCool = 1.5;
    } else if (ai.drifting) {
      c.drift = true;
      if (!k.drift && k.wantDrift && Math.abs(c.steer) < 0.3) c.steer = ca > 0 ? 0.6 : -0.6;
      if (!k.drift && !k.wantDrift && k.hy === 0) { ai.drifting = false; c.drift = false; ai.driftCool = 1; }
      if (k.drift && (Math.abs(ca) < 0.007 || k.spark >= ai.maxLvl && Math.abs(ca) < 0.014 || (c.steer * k.drift < -0.95 && Math.abs(ca) < 0.02))) { ai.drifting = false; c.drift = false; ai.driftCool = 1.2; }
    } else c.drift = false;
    // 用道具
    if (k.item >= 0 && k.rollT <= 0) {
      ai.itemT -= dt;
      if (ai.itemT <= 0) {
        let use = false;
        if (k.item === ROCKET) use = Math.abs(ca) < 0.02 || ai.itemT < -3;
        else if (k.item === JELLY) { const bk = order[k.place]; use = (bk && bk.total < k.total && k.total - bk.total < 25) || ai.itemT < -7; }
        else if (k.item === BUBBLE) use = k.place > 1 || ai.itemT < -6;
        else use = true;
        if (use) useItem(k);
      }
    }
  }

  /* ---------- 道具物件 ---------- */
  function updateObjects(dt, clock) {
    const t = TR, N = t.N;
    // 道具箱
    for (let b = 0; b < boxes.length; b++) {
      const B = boxes[b];
      if (!B.alive) { B.t -= dt; if (B.t <= 0) { B.alive = true; B.t = -0.5; } continue; }
      if (B.t < 0) B.t = Math.min(0, B.t + dt);
      if (race.mode === 'tt') continue;
      for (let q = 0; q < 6; q++) {
        const k = karts[q]; if (!k.active) continue;
        let di = k.idx - B.i; if (di > N / 2) di -= N; if (di < -N / 2) di += N;
        if (Math.abs(di) > 3) continue;
        const dx = k.x - B.x, dz = k.z - B.z;
        if (dx * dx + dz * dz < 3.6) {
          B.alive = false; B.t = 2.5;
          burst(B.x, B.y, B.z, 14, 9, Math.random(), 0.6 + Math.random() * 0.4, 1, 0.6, 0.6, 6, 1);
          if (k.item < 0 && k.rollT <= 0) { k.rollT = k.isPlayer ? 1.3 : 1.1; k.rollItem = pickItem(k.place); }
          if (k.isPlayer) sfx('k_box', vary()); else sfxAt('k_box', k, 0.4);
          break;
        }
      }
    }
    // 金幣
    for (let n = 0; n < coins.length; n++) {
      const C = coins[n];
      if (!C.alive) { C.t -= dt; if (C.t <= 0) { C.alive = true; C.x = C.hx; C.z = C.hz; } continue; }
      for (let q = 0; q < 6; q++) {
        const k = karts[q]; if (!k.active) continue;
        const dx = k.x - C.x, dz = k.z - C.z, d2 = dx * dx + dz * dz;
        if (k.magnetT > 0 && d2 < 200 && d2 > 2) { const d = Math.sqrt(d2); C.x += dx / d * 40 * dt; C.z += dz / d * 40 * dt; }
        if (d2 < 2.6 && Math.abs(k.y - C.y) < 2) {
          C.alive = false; C.t = 8;
          if (k.coins < 10) k.coins++;
          burst(C.x, C.y, C.z, 6, 4, 1, 0.85, 0.3, 0.4, 0.4, 2, 1);
          if (k.isPlayer) sfx('k_coin', { pitch: 1 + k.coins * 0.025 });
          break;
        }
      }
    }
    // 果凍
    for (let j = jellies.length - 1; j >= 0; j--) {
      const J = jellies[j];
      J.t += dt;
      for (let q = 0; q < 6; q++) {
        const k = karts[q]; if (!k.active || (k === J.owner && J.t < 0.6) || k.hy > 0.8) continue;
        const dx = k.x - J.x, dz = k.z - J.z;
        if (dx * dx + dz * dz < 2.3) {
          hitKart(k, 'spin', J.owner);
          burst(J.x, J.y + 0.5, J.z, 12, 6, 0.35, 0.9, 0.4, 0.6, 0.6, 12, 1);
          jellies.splice(j, 1);
          break;
        }
      }
    }
    // 追蹤泡泡
    for (let n = bubbles.length - 1; n >= 0; n--) {
      const B = bubbles[n];
      B.life -= dt; B.t += dt;
      let tx, tz;
      const T = B.target;
      let near = false;
      if (T && T.active) {
        let gap = T.total - (B.idx + 0); // 估算
        const dx = T.x - B.x, dz = T.z - B.z;
        near = dx * dx + dz * dz < 900;
        if (near) { tx = T.x; tz = T.z; }
      }
      if (!near) { const ti = (B.idx + 12) % N; const lat = T ? clamp(T.lat, -t.half, t.half) * 0.6 : 0; tx = t.cx[ti] + t.rx[ti] * lat; tz = t.cz[ti] + t.rz[ti] * lat; }
      const dh = wrapA(Math.atan2(tx - B.x, tz - B.z) - B.h);
      B.h += clamp(dh, -5 * dt, 5 * dt);
      B.x += Math.sin(B.h) * B.sp * dt; B.z += Math.cos(B.h) * B.sp * dt;
      locate(B);
      if (Math.abs(B.lat) > t.wallOff - 1) { const s = B.lat > 0 ? 1 : -1, o = Math.abs(B.lat) - (t.wallOff - 1); B.x -= t.rx[B.idx] * s * o; B.z -= t.rz[B.idx] * s * o; }
      B.y = t.cy[B.idx] + t.slope[B.idx] * B.along + 1.0 + Math.sin(B.t * 8) * 0.15;
      if (Math.random() < 0.5 * pScale) spawnP(B.x, B.y, B.z, (Math.random() - 0.5) * 2, Math.random(), (Math.random() - 0.5) * 2, 0.7, 0.92, 1, 0.35, 0.1, 0.5, -1, 1);
      let hit = false;
      for (let q = 0; q < 6; q++) {
        const k = karts[q]; if (!k.active || (k === B.owner && B.t < 0.6)) continue;
        const dx = k.x - B.x, dz = k.z - B.z;
        if (dx * dx + dz * dz < 3.2) { hitKart(k, 'bubble', B.owner); hit = true; break; }
      }
      if (hit || B.life <= 0) { burst(B.x, B.y, B.z, 10, 5, 0.6, 0.9, 1, 0.5, 0.5, 3); if (!hit) sfxAt('k_pop', B.owner, 0.3); bubbles.splice(n, 1); }
    }
  }

  /* ---------- 比賽流程 ---------- */
  function setPlayer(ci) {
    karts.forEach(k => { k.isPlayer = false; });
    player = karts[ci];
    player.isPlayer = true;
  }
  function setupRace(ti) {
    race.track = ti;
    buildTrack(ti);
    race.time = 0; race.finishOrder = 0; race.finalLap = false; race.results = null; race.podium = false;
    const D = DIFFS[race.diff];
    // 起跑位置：大獎賽依積分倒序（領先的在後面），單場玩家最後
    let grid;
    if (race.mode === 'gp' && race.gp && race.gp.race > 0) grid = karts.slice().sort((a, b) => race.gp.pts[a.i] - race.gp.pts[b.i]);
    else { grid = karts.filter(k => k !== player); grid.push(player); }
    grid.forEach((k, slot) => {
      placeOnGrid(k, slot);
      k.active = race.mode !== 'tt' || k === player;
      k.g.visible = k.active;
      k.skill = k.isPlayer ? 1 : D.ai * (0.97 + 0.03 * ((k.i * 7) % 5) / 4);
      k.baseSkill = k.skill;
      k.podium = false;
    });
    podium.visible = false;
    if (race.mode === 'tt') { player.item = ROCKET; player.itemN = 3; }
    order.sort((a, b) => b.total - a.total);
    order.forEach((k, i) => { k.place = i + 1; });
    // 幽靈車
    ghostData = null;
    if (race.mode === 'tt') {
      const rec = KG.store.get('kart-racing:ghost:' + ti, null);
      if (rec && rec.d && rec.d.length > 8) {
        ghostData = rec;
        if (!ghostK || ghostChar !== rec.c) { if (ghostK) scene.remove(ghostK.g); ghostK = makeKart(clamp(rec.c | 0, 0, 5), true); ghostChar = rec.c; }
        ghostK.g.visible = true;
      } else if (ghostK) ghostK.g.visible = false;
    } else if (ghostK) ghostK.g.visible = false;
    ttRec.n = 0; ttRec.t = 0;
    boxMesh.visible = race.mode !== 'tt';
    camSnap = true;
  }
  function startRace(ti) {
    setPlayer(opts.char);
    setupRace(ti);
    phase = 'intro'; race.phaseT = 0;
    showMenu(null);
    KG.music.stop(0.6);
    ensureLoops();
    const sub = race.mode === 'gp' ? '大獎賽 第 ' + (race.gp.race + 1) + ' / 4 場' : race.mode === 'tt' ? '計時賽 · 3 圈' : '單場比賽 · ' + DIFFS[race.diff].name;
    showBanner(TRACKS[ti].name, sub, 2.4);
    updateTouchUI();
    sfx('swoosh');
  }
  function startGP() {

  function update(dt) {

      if (race.phaseT >= 3) {

      }

    }
    const sim = phase === 'title' || phase === 'race' || phase === 'finish' || phase === 'results';

        k.skill = k.baseSkill * (1 + clamp(gap, -1, 1) * D.rb) * (k.finished ? 0.8 : 1);
      }
      if (k.isPlayer && phase !== 'race') k.skill = 0.9;
    }
    for (let i = 0; i < 6; i++) { const k = karts[i]; if (k.active) stepKart(k, dt); }
    kartCollisions();
    updateObjects(dt, clock);
    for (let i = 0; i < 6; i++) {
      const k = karts[i];
      if (!k.active) continue;
      if (phase !== 'title') lapEvent(k);
      // 卡住的電腦車放回路中間
      if (!k.isPlayer || phase === 'finish') {
        if (Math.abs(k.speed) < 2.5 && k.spinT <= 0 && k.bubbleT <= 0) k.stuckT += dt; else k.stuckT = Math.max(0, k.stuckT - dt);
        if (k.stuckT > 2.2 || k.ai.wrongT > 2.5) {
          const t = TR, i2 = (k.idx + 3) % t.N;
          k.x = t.cx[i2]; k.z = t.cz[i2]; k.h = t.ang[i2]; k.speed = 6; k.stuckT = 0; k.ai.wrongT = 0; locate(k);
          k.sPrev = trackS(k);
        }
      }
    }
    sortOrder();
    // 計時賽記錄幽靈
    if (race.mode === 'tt' && phase === 'race') {
      ttRec.t += dt;
      while (ttRec.t >= 0.1 * ttRec.n && ttRec.n < 4000) {
        const o = ttRec.n * 4;
        ttRec.buf[o] = player.x; ttRec.buf[o + 1] = player.z; ttRec.buf[o + 2] = player.h; ttRec.buf[o + 3] = player.y;
        ttRec.n++;
      }
    }
    // 逆向提示
    if (phase === 'race') {
      const t = TR, d = Math.sin(player.h) * t.tx[player.idx] + Math.cos(player.h) * t.tz[player.idx];
      if (d < -0.3 && Math.abs(player.speed) > 3) wrongT += dt; else wrongT = Math.max(0, wrongT - dt * 2);
      if (wrongT > 1.2 && bannerT <= 0.1) showBanner('方向錯了！', '請回頭', 0.6, true);
    }
    if (phase === 'finish' && race.phaseT > 3.4) endRace();
    // 環境粒子
    const th = TR.D.theme;
    if ((th === 'snow' || th === 'maple') && Math.random() < (th === 'snow' ? 0.8 : 0.35) * pScale) {
      const a = Math.random() * TAU, r = 4 + Math.random() * 22;
      const x = camera.position.x + Math.sin(cam.yaw) * 14 + Math.cos(a) * r, z = camera.position.z + Math.cos(cam.yaw) * 14 + Math.sin(a) * r;
      if (th === 'snow') spawnP(x, camera.position.y + 8, z, (Math.random() - 0.5) * 1.5, -2.5, (Math.random() - 0.5) * 1.5, 1, 1, 1, 0.3, 0.3, 4, 0, 0.1, 0.9);
      else { const c = LEAF[(Math.random() * 3) | 0]; spawnP(x, camera.position.y + 7, z, (Math.random() - 0.5) * 3, -1.8, (Math.random() - 0.5) * 3, c[0], c[1], c[2], 0.45, 0.4, 4.5, 0, 0.2, 0.95); }
    }
    for (let i = 0; i < 6; i++) if (karts[i].active) kartParticles(karts[i], dt);
    updateParticles(dt);
  }

  /* =========================================================
   * 畫面大小與自動畫質
   * ========================================================= */
  function resize() {
    const r = glc.getBoundingClientRect();
    W = Math.max(1, Math.round(r.width)); H = Math.max(1, Math.round(r.height));
    renderer.setSize(W, H, false);
    camera.aspect = W / H;
    if (cam.offX || cam.offY) camera.setViewOffset(W, H, cam.offX, cam.offY, W, H);
    camera.updateProjectionMatrix();
    camSnap = true;
    freeDirty = true;
    drawMiniBase();
    updateTouchUI();
  }
  window.addEventListener('resize', resize);
  if (window.visualViewport) window.visualViewport.addEventListener('resize', resize);
  window.addEventListener('orientationchange', () => setTimeout(resize, 150));

  const QKEY = 'quality:kart-racing';
  const baseRatio = Math.min(window.devicePixelRatio || 1, 2);
  const QLEVELS = [
    { ratio: baseRatio, lite: false, p: 1 },
    { ratio: Math.min(baseRatio, 1.5), lite: false, p: 1 },
    { ratio: Math.min(baseRatio, 1.15), lite: false, p: 0.8 },
    { ratio: 1, lite: true, p: 0.6 },
    { ratio: 0.8, lite: true, p: 0.45 }
  ];
  let qLevel = clamp(KG.store.get(QKEY, KG.lowEnd ? 2 : 0) | 0, 0, QLEVELS.length - 1);
  const perf = { last: 0, n: 0, sum: 0, cool: 3 };
  function applyLite() {
    const lite = QLEVELS[qLevel].lite;
    for (const m of props) m.count = lite ? Math.ceil(m.userData.full * m.userData.lite) : m.userData.full;
  }
  function applyQuality() {
    const q = QLEVELS[qLevel];
    renderer.setPixelRatio(q.ratio);
    renderer.setSize(W, H, false);
    pScale = q.p;
    applyLite();
  }
  function renderFrame() {
    renderer.render(scene, camera);
    const now = performance.now(), dt = perf.last ? Math.min(0.5, (now - perf.last) / 1000) : 0;
    perf.last = now;
    if (document.hidden || qLevel >= QLEVELS.length - 1 || phase === 'pause') return;
    perf.cool -= dt;
    if (perf.cool > 0) return;
    perf.sum += dt; perf.n++;
    if (perf.n >= 60) {
      if (perf.sum / perf.n > 1 / 45) { qLevel++; KG.store.set(QKEY, qLevel); applyQuality(); perf.cool = 2; }
      perf.n = 0; perf.sum = 0;
    }
  }

  /* =========================================================
   * 主迴圈
   * ========================================================= */
  let last = performance.now(), first = true;
  function frame(now) {
    requestAnimationFrame(frame);
    const dt = Math.max(0, Math.min(0.05, (now - last) / 1000));
    last = now;
    pollPad();
    const steps = Math.max(1, Math.ceil(dt / (1 / 60)));
    for (let s = 0; s < steps; s++) update(dt / steps);
    for (let i = 0; i < 6; i++) if (karts[i].g.visible) syncKart(karts[i], dt, clock);
    syncObjects(clock);
    if (race.mode === 'tt' && (phase === 'race' || phase === 'finish')) syncGhost();
    updateCamera(dt);
    updateLoops(dt);
    renderFrame();
    updateHUD(dt);
    if (first) { first = false; const m = $('msg'); if (m) m.remove(); }
  }
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) {
      if (phase === 'race' || phase === 'countdown' || phase === 'intro' || phase === 'finish') pauseGame();
      if (loops) { loops.eng.set(0, 0); loops.sq.set(0, 0); loops.rb.set(0, 0); loopsOn = false; }
    }
    last = performance.now();
  });

  resize();
  applyQuality();
  toTitle();
  requestAnimationFrame(frame);

  /* ---------- 測試用 ---------- */
  window.__kart = {
    state: () => ({ phase, mode: race.mode, track: race.track, diff: race.diff, place: player.place, lap: clamp(Math.floor(player.total / TR.N) + 1, 1, LAPS), total: +player.total.toFixed(1), N: TR.N, speed: +player.speed.toFixed(1), item: player.item, itemN: player.itemN, roll: +player.rollT.toFixed(2), coins: player.coins, time: +race.time.toFixed(2), q: qLevel, drift: player.drift, spark: player.spark, boost: +player.boostT.toFixed(2), lat: +player.lat.toFixed(2), offroad: player.offroad, music: KG.music.isPlaying(), finished: player.finished, char: player.i, jellies: jellies.length, bubbles: bubbles.length, shield: player.shieldT, order: order.map(k => k.i), screen: curScreen }),
    start: (mode, ti, ch, diff) => { race.mode = mode || 'single'; opts.char = ch == null ? opts.char : ch; race.diff = diff == null ? 1 : diff; if (race.mode === 'gp') startGP(); else startRace(ti || 0); },
    skip: () => { if (phase === 'intro') { phase = 'countdown'; race.phaseT = 2.99; race.countN = 1; } else if (phase === 'countdown') race.phaseT = 2.99; },
    tick: sec => { const n = Math.round(sec * 60); for (let i = 0; i < n; i++) update(1 / 60); },
    auto: on => { autoPlayer = !!on; },
    give: i => { player.item = i; player.itemN = 1; },
    use: () => useItem(player),
    nearFinish: () => { player.total = LAPS * TR.N - 30; player.lapsDone = LAPS - 1; },
    setTotal: v => { player.total = v; },
    quality: n => { qLevel = clamp(n, 0, QLEVELS.length - 1); applyQuality(); perf.cool = 1e9; },
    hold: on => { perf.cool = on ? 1e9 : 2; },
    trackInfo: () => {
      const t = TR; let maxC = 0, minClr = 1e9;
      for (let i = 0; i < t.N; i++) maxC = Math.max(maxC, Math.abs(t.curv[i]));
      for (let i = 0; i < t.N; i += 2) for (let j = i + 60; j < t.N; j += 2) { if (t.N - (j - i) < 60) continue; const d = Math.hypot(t.cx[i] - t.cx[j], t.cz[i] - t.cz[j]); if (d < minClr) minClr = d; }
      return { N: t.N, len: Math.round(t.len), minR: +(1 / maxC).toFixed(1), minClear: +minClr.toFixed(1), wallOff: t.wallOff, props: props.reduce((a, m) => a + m.count, 0), calls: renderer.info.render.calls, tris: renderer.info.render.triangles };
    },
    align: () => { const t = TR, i = player.idx; player.x = t.cx[i]; player.z = t.cz[i]; player.h = t.ang[i]; locate(player); player.sPrev = trackS(player); },
    hitPlayer: kind => hitKart(player, kind || 'spin', karts[(player.i + 1) % 6]),
    _dbg: { scene, trackGroup, points, sky, renderer, camera },
    karts: () => karts.map(k => ({ i: k.i, total: +k.total.toFixed(1), speed: +k.speed.toFixed(1), place: k.place, fin: k.finished, item: k.item, d: k.drift, sp: k.spark, b: +k.boostT.toFixed(2) }))
  };
}
</script>
