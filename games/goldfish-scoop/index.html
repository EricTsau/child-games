let seedV = (Math.random() * 4294967296) >>> 0;
function rng() {
  seedV = (seedV + 0x6D2B79F5) >>> 0;
  let t = seedV;
  t = Math.imul(t ^ (t >>> 15), t | 1);
  t ^= t + Math.imul(t ^ (t >>> 7), t | 61);

}

function seeded(s) { let v = s >>> 0; return () => { v = (v + 0x6D2B79F5) >>> 0; let t = v; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
function mk(w, h) { const c = document.createElement('canvas'); c.width = Math.max(1, Math.ceil(w)); c.height = Math.max(1, Math.ceil(h)); return c; }
function rrPath(c, x, y, w, h, r) {

}

  /** 紙網泡在水裡的磨損：dt 秒、speed 網半徑/秒、q 紙網品質 */
  soak(dt, speed, q) { return dt * (0.03 + Math.max(0, speed - 2.5) * 0.035) / q; },
  /** 撈起時魚的重量造成的傷害；dN = 魚離網中心距離 / 網半徑 */
  liftDamage(k, dN, q) { return KINDS[k].weight * 0.15 * (0.7 + 0.6 * clamp(dN, 0, 1)) / q; },
  /** 撈起成功率 */
  catchChance(k, dN, hp, q, fast) {
    let p = (1 - 0.7 * dN * dN) * (0.75 + 0.25 * clamp(hp, 0, 1)) * (1 - KINDS[k].slip) + (q - 1) * 0.08;
    if (fast) p *= 0.65;
    return clamp(p, 0.03, 0.98);
  },
  /** 拿著魚時每秒掙脫機率 */
  thrashHazard(k, hp) { return KINDS[k].thrash * (1.15 - clamp(hp, 0, 1)) * 0.6; },
  carryWear(dt, k, q) { return dt * KINDS[k].weight * 0.03 / q; }
};

let userActed = false;

const Snd = {
  ac: null, nb: null, amb: null, ambG: null, chimeT: 3,
  ctx() {
    if (!userActed) return null;
    if (!this.ac) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return null;
      try { this.ac = new AC(); } catch (e) { return null; }
      const len = this.ac.sampleRate * 2, b = this.ac.createBuffer(1, len, this.ac.sampleRate), d = b.getChannelData(0);
      for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
      this.nb = b;
    }
    if (this.ac.state === 'suspended') this.ac.resume();
    return this.ac;
  },
  noise(dur, vol, freq, type, delay) {
    if (KG.isMuted()) return;
    const a = this.ctx(); if (!a) return;
    const t = a.currentTime + (delay || 0);
    const s = a.createBufferSource(); s.buffer = this.nb;
    const f = a.createBiquadFilter(); f.type = type || 'bandpass'; f.frequency.value = freq || 1000;
    const g = a.createGain();
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    s.connect(f); f.connect(g); g.connect(a.destination);
    s.start(t, Math.random(), dur + 0.05);
  },
  ambience(on) {
    const a = on ? this.ctx() : this.ac;
    if (!a) return;
    if (!this.amb && on) {
      const s = a.createBufferSource(); s.buffer = this.nb; s.loop = true;
      const f = a.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = 520;
      const f2 = a.createBiquadFilter(); f2.type = 'bandpass'; f2.frequency.value = 1100; f2.Q.value = 2.5;
      const g = a.createGain(); g.gain.value = 0;
      const g2 = a.createGain(); g2.gain.value = 0.25;
      s.connect(f); f.connect(g); s.connect(f2); f2.connect(g2); g2.connect(g); g.connect(a.destination);
      s.start();
      this.amb = s; this.ambG = g;
    }
    if (this.ambG) {
      const target = on && !KG.isMuted() ? 0.03 : 0;
      this.ambG.gain.setTargetAtTime(target, a.currentTime, 0.3);
    }
  },
  dip() { this.noise(0.2, 0.28, 900, 'bandpass'); KG.note(260, 0.14, 'sine', 0.18, 0, 120); },
  lift() { this.noise(0.28, 0.16, 1800, 'bandpass'); KG.note(700, 0.1, 'sine', 0.1, 0, 1300); KG.note(1050, 0.08, 'sine', 0.07, 0.09, 1500); },
  tear() {
    for (let i = 0; i < 6; i++) this.noise(0.05, 0.32, 2800 + Math.random() * 2500, 'highpass', i * 0.04 + Math.random() * 0.02);
    this.noise(0.3, 0.22, 1400, 'bandpass', 0.2);
    KG.note(240, 0.3, 'sawtooth', 0.05, 0.02, 110);
  },
  creak() { this.noise(0.035, 0.12, 4200, 'highpass'); this.noise(0.03, 0.09, 3600, 'highpass', 0.06); },
  caught() { KG.note(660, 0.1, 'triangle', 0.2); KG.note(880, 0.12, 'triangle', 0.2, 0.08); KG.note(1320, 0.16, 'sine', 0.12, 0.16); },

  heavy() { KG.note(130, 0.3, 'sine', 0.3, 0, 70); this.noise(0.2, 0.2, 400, 'lowpass'); },
  rare() { KG.sound('sparkle'); [784, 988, 1175, 1568].forEach((f, i) => KG.note(f, 0.18, 'triangle', 0.16, 0.15 + i * 0.08)); },

/* ---------- 背景音樂（KG.note 合成的輕快夜市小調） ---------- */
const NOTE_IDX = { C: 0, D: 2, E: 4, F: 5, G: 7, A: 9, B: 11 };
function nf(name) {
  const m = /^([A-G])(#|b)?(\d)$/.exec(name); if (!m) return 0;
  const n = NOTE_IDX[m[1]] + (m[2] === '#' ? 1 : m[2] === 'b' ? -1 : 0) + (parseInt(m[3], 10) + 1) * 12;
  return 440 * Math.pow(2, (n - 69) / 12);
}

const Music = {
  on: false, song: null, step: 0, next: 0, cur: null,
  start(song) {
    if (this.on && this.cur === song) return;
    this.cur = song;
    this.song = { bpm: song.bpm, mel: song.mel.trim().split(/\s+/), bass: song.bass.trim().split(/\s+/), vol: song.vol || 1, wave: song.wave };
    this.on = true; this.step = 0; this.next = 0.2;
  },
  stop() { this.on = false; this.cur = null; },
  update(dt) {
    if (!this.on || !userActed) return;
    this.next -= dt;
    if (this.next < -0.3) this.next = 0;
    const s = this.song, beat = 60 / s.bpm / 2;
    while (this.next <= 0) {
      if (!KG.isMuted() && !document.hidden && overlay !== 'pause') {
        const i = this.step % s.mel.length, tok = s.mel[i];
        if (tok !== '-' && tok !== '.') {
          let len = 1;
          while (s.mel[(i + len) % s.mel.length] === '-' && len < 8) len++;
          const f = nf(tok);
          KG.note(f, beat * len * 0.95, s.wave, 0.045 * s.vol);
          KG.note(f * 2, beat * len * 0.4, 'sine', 0.012 * s.vol);
        }
        const bt = s.bass[this.step % s.bass.length];
        if (bt !== '-' && bt !== '.') KG.note(nf(bt), beat * 1.8, 'sine', 0.065 * s.vol);
        if (s === this.song && this.cur === SONG_NIGHT && this.step % 4 === 2) KG.note(1900, 0.03, 'square', 0.012);
      }
      this.step++;
      this.next += beat;
    }
  }
};

/* ---------- 特效：粒子、波紋、文字（全部用物件池） ---------- */
const PARTS = []; for (let i = 0; i < 180; i++) PARTS.push({ on: false });

}

}

}

  for (const r of RIPS) { if (!r.on) continue; r.life -= dt * 1.1; r.r += dt * r.max * 1.3; if (r.life <= 0) r.on = false; }

/* ---------- 魚與水中生物 ---------- */
let fishes = [], critters = [], fishId = 1;
function makeFish(k, x, y, aq) {
  const a = rng() * TAU;
  return { id: fishId++, k, x, y, vx: Math.cos(a) * 10, vy: Math.sin(a) * 10, a, wa: a, ph: rng() * TAU, v: Math.floor(rng() * 3), state: 'swim', flee: 0, dart: 0, spawn: aq ? 1 : 0, curious: 0.5 + rng() * 0.8, happy: 0, ox: 0, oy: 0 };
}
function pickKind(pool) {
  let sum = 0; for (const k in pool) sum += pool[k];
  let r = rng() * sum;
  for (const k in pool) { r -= pool[k]; if (r <= 0) return k; }
  return 'red';
}
function spawnFish(k, edge) {
  const w = LY.water, m = LY.R * 0.8;
  const f = makeFish(k, w.x + m + rng() * (w.w - m * 2), w.y + m + rng() * (w.h - m * 2));
  if (!edge) f.spawn = 1;
  fishes.push(f);
  return f;
}
function populate(def) {
  fishes = []; critters = [];
  const n = def.n;
  const ens = Object.assign({}, def.ensure || {});
  for (const k in ens) for (let i = 0; i < ens[k]; i++) spawnFish(k);
  while (fishes.length < n) spawnFish(pickKind(def.pool));
  const w = LY.water;
  for (let i = 0; i < (def.turtle || 0); i++) { const a = rng() * TAU; critters.push({ type: 'turtle', x: w.x + w.w * rr(0.2, 0.8), y: w.y + w.h * rr(0.2, 0.8), a, wa: a, vx: 0, vy: 0, ph: 0, push: 0 }); }
  for (let i = 0; i < (def.duck || 0); i++) { const a = rng() * TAU; critters.push({ type: 'duck', x: w.x + w.w * rr(0.15, 0.85), y: w.y + w.h * rr(0.15, 0.85), a, wa: a, vx: Math.cos(a) * 8, vy: Math.sin(a) * 8, ph: rng() * TAU, push: 0 }); }
}
function refill() {
  const def = G.def; if (!def) return;
  const cnt = {}; for (const f of fishes) cnt[f.k] = (cnt[f.k] || 0) + 1;
  const ens = def.ensure || {};
  while (fishes.length < def.n) {
    let k = null;
    for (const kk in ens) if ((cnt[kk] || 0) < ens[kk]) { k = kk; break; }
    if (!k) k = pickKind(def.pool);
    cnt[k] = (cnt[k] || 0) + 1;
    spawnFish(k, true);
  }
}
/** 類 boids 的游泳：漫遊 + 分離 + 對齊 + 避牆 + 對紙網的反應（快就逃、靜就靠近） + 找飼料 */
function updateFish(arr, dt, b, opt) {
  const R = opt.R, base = R * 0.85, L = opt.L;
  const nIn = opt.net && opt.net.state === 'down' && opt.net.dipT >= 1;
  const sep = L * 0.75, sep2 = sep * sep, ali2 = (L * 1.6) * (L * 1.6);
  const cx = b.x + b.w / 2, cy = b.y + b.h / 2;
  for (let i = 0; i < arr.length; i++) {
    const f = arr[i];
    if (f.state !== 'swim') continue;
    const kd = KINDS[f.k];
    f.spawn = Math.min(1, f.spawn + dt * 1.2);
    f.flee = Math.max(0, f.flee - dt); f.dart = Math.max(0, f.dart - dt); f.happy = Math.max(0, f.happy - dt);
    if (rng() < dt * 0.06) f.dart = 0.5;
    const maxS = base * kd.spd * (f.flee > 0 ? 2.5 : 1) * (f.dart > 0 ? 1.7 : 1);
    const cruise = maxS * 0.62;
    f.wa += (rng() - 0.5) * dt * 4;
    let dvx = Math.cos(f.wa) * cruise, dvy = Math.sin(f.wa) * cruise;
    let fx = 0, fy = 0, ax = 0, ay = 0, an = 0;
    for (let j = 0; j < arr.length; j++) {
      if (j === i) continue;
      const g = arr[j]; if (g.state !== 'swim') continue;
      const dx = f.x - g.x, dy = f.y - g.y, d2 = dx * dx + dy * dy;
      if (d2 < sep2 && d2 > 0.01) { const d = Math.sqrt(d2), k = (sep - d) / sep; fx += dx / d * k * maxS * 5; fy += dy / d * k * maxS * 5; }
      else if (d2 < ali2) { ax += g.vx; ay += g.vy; an++; }
    }
    if (an) { dvx += (ax / an - dvx) * 0.15; dvy += (ay / an - dvy) * 0.15; }
    for (const c of critters) {
      if (c.type !== 'turtle' || opt.aq) continue;

      if (d2 < rr2 && d2 > 0.01) { const d = Math.sqrt(d2); fx += dx / d * maxS * 3; fy += dy / d * maxS * 3; }
    }
    // 牆壁
    const m = L * 0.8;
    if (f.x < b.x + m) { fx += (b.x + m - f.x) / m * maxS * 7; }
    if (f.x > b.x + b.w - m) { fx -= (f.x - (b.x + b.w - m)) / m * maxS * 7; }
    if (f.y < b.y + m) { fy += (b.y + m - f.y) / m * maxS * 7; }
    if (f.y > b.y + b.h - m) { fy -= (f.y - (b.y + b.h - m)) / m * maxS * 7; }
    if (f.x < b.x + m * 1.5 || f.x > b.x + b.w - m * 1.5 || f.y < b.y + m * 1.5 || f.y > b.y + b.h - m * 1.5) f.wa += angDiff(f.wa, Math.atan2(cy - f.y, cx - f.x)) * dt * 1.5;

      if (n.speed > FLEE_SPEED && d < R * 3.2) { f.flee = 0.9; fx += dx / d * maxS * 9; fy += dy / d * maxS * 9; f.wa = Math.atan2(dy, dx); }

      if (best) {

function genPaper() {

}
function goalText(short) {

  if (g.t === 'kind') return (short ? '' : '撈到 ') + g.n + ' 隻' + KINDS[g.k].name;

function startGame(mode, level, intro) {

    G.scoops = 3 + (owned.extra || 0); G.tier = owned.paper || 0; G.q = PAPERS[G.tier].q; G.timeMax = 120;
  } else {

    if (L.g.t === 'kind') ens[L.g.k] = Math.max(2, Math.min(3, L.g.n));
    if (L.g.t === 'each') for (const k of KIND_ORDER) ens[k] = 1;

/* ---------- 紙網操作 ---------- */

}

function updatePlay(dt) {
  const R = LY.R;
  if (G.over) {
    updateFish(fishes, dt, LY.water, { R, L: LY.fishL, net: null });
    updateCritters(dt);
    G.endT -= dt; if (G.endT <= 0 && overlay !== 'result') showResult();
    return;
  }
  G.time += dt;
  if (G.timeMax) {
    const before = Math.ceil(G.timeLeft);
    G.timeLeft = Math.max(0, G.timeLeft - dt);
    if (G.timeLeft <= 10 && Math.ceil(G.timeLeft) !== before && G.timeLeft > 0) KG.sound('tick');
    if (G.timeLeft <= 0) { endRound('time'); return; }
  }
  // 鍵盤
  if (net.kbd) {
    let kx = 0, ky = 0;
    if (keys.ArrowLeft || keys.KeyA) kx--; if (keys.ArrowRight || keys.KeyD) kx++;
    if (keys.ArrowUp || keys.KeyW) ky--; if (keys.ArrowDown || keys.KeyS) ky++;
    if (kx || ky) {

      net.speed = lerp(net.speed, sp, Math.min(1, dt * 10));
      net.still = net.speed < 0.5 ? net.still + dt : 0;
      net.hp -= MECH.soak(dt, net.speed, G.q);
      net.trailT -= dt;
      if (net.speed > 1 && net.trailT <= 0) { net.trailT = 0.12; ripple(net.x, net.y, R * 1.2, 1.5); if (net.speed > FLEE_SPEED) splash(net.x, net.y, 2, R); }
      if (net.hp < 0.3) { net.creakT -= dt; if (net.creakT <= 0) { net.creakT = 0.5 + net.hp * 3; Snd.creak(); } }
      if (net.hp <= 0) { floatText('泡太久了！', net.x, net.y - R, '#ffb0b0', 22); tear(); }
      break;
    }
    case 'lifting':
      net.liftT += dt / 0.22;
      if (net.liftT >= 1) net.state = net.carry.length ? 'carry' : 'up';
      break;
    case 'carry': {
      net.x += (net.tx - net.x) * Math.min(1, dt * 16); net.y += (net.ty - net.y) * Math.min(1, dt * 16);
      for (let i = net.carry.length - 1; i >= 0; i--) {
        const f = net.carry[i];
        net.hp -= MECH.carryWear(dt, f.k, G.q);
        f.ph += dt * 14;
        if (rng() < MECH.thrashHazard(f.k, net.hp) * dt) {
          net.carry.splice(i, 1); f.state = 'swim'; f.flee = 1.2;
          const p = clampWater(net.x, net.y); f.x = p[0]; f.y = p[1];
          floatText('跳走了！', net.x, net.y - R, '#ffd0a0', 22); Snd.escape(); splash(p[0], p[1], 12, R * 1.5); ripple(p[0], p[1], R * 1.4, 3);
          net.hp -= 0.05;
        }
      }
      net.dripT -= dt; if (net.dripT <= 0) { net.dripT = 0.18; part('drop', net.x + (Math.random() - 0.5) * R, net.y + (Math.random() - 0.5) * R, 0, 20, 0.35, 2, '#cfefff'); }
      if (net.hp <= 0) tear();
      else if (!net.carry.length) net.state = 'up';
      break;
    }
    case 'deposit': {
      const d = net.dep; d.t += dt / 0.32;
      const e = Ease.inOut(Math.min(1, d.t));
      net.x = lerp(d.x0, LY.bowl.x, e); net.y = lerp(d.y0, LY.bowl.y, e) - Math.sin(e * Math.PI) * LY.R * 0.8;
      if (d.t >= 1) deposited();
      break;
    }
    case 'torn':
      net.tornT -= dt; if (net.tornT <= 0) nextPaper();
      break;
  }
  updateFish(fishes, dt, LY.water, { R, L: LY.fishL, net });
  updateCritters(dt);
  if (rng() < dt * 1.5) { const f = fishes[Math.floor(rng() * fishes.length)]; if (f && f.k === 'lucky') part('spark', f.x, f.y, 0, -10, 0.6, 7, ''); }
  if (rng() < dt * 0.5) { const f = fishes[Math.floor(rng() * fishes.length)]; if (f && f.state === 'swim') ripple(f.x, f.y, LY.R * 0.5, 1); }
  for (const bf of bowlFish) { bf.a += bf.sp * dt; bf.ph += dt * 6; }
}

/* ---------- 紙網繪製 ---------- */
function drawPaper(x, y, R, wet) {
  const hp = Math.max(0, net.hp);
  const holeS = net.state === 'torn' ? 0.9 : Math.max(0, 0.4 - hp) * 1.7;
  ctx.beginPath(); ctx.arc(x, y, R * 0.93, 0, TAU);
  const hc = net.holeC, n = net.hole.length;
  const hp0 = [];
  if (holeS > 0.02) {
    for (let i = 0; i < n; i++) {
      const a = -i / n * TAU, rad = net.hole[i] * holeS;
      let hx = hc[0] + Math.cos(a) * rad, hy = hc[1] + Math.sin(a) * rad;
      const d = Math.hypot(hx, hy); if (d > 0.88) { hx *= 0.88 / d; hy *= 0.88 / d; }
      hp0.push(hx, hy);
      if (i === 0) ctx.moveTo(x + hx * R, y + hy * R); else ctx.lineTo(x + hx * R, y + hy * R);
    }
    ctx.closePath();
  }
  ctx.fillStyle = wet ? 'rgba(236,246,255,0.42)' : (hp < 0.6 ? 'rgba(240,244,248,0.88)' : 'rgba(255,253,244,0.92)');
  ctx.fill('evenodd');

  if (nc > 0) {
    ctx.strokeStyle = wet ? 'rgba(60,90,130,0.55)' : 'rgba(110,120,140,0.6)'; ctx.lineWidth = Math.max(1, R * 0.03);

    ctx.stroke();
  }
  if (hp0.length) {
    ctx.strokeStyle = 'rgba(255,255,255,0.85)'; ctx.lineWidth = Math.max(1.5, R * 0.04);
    ctx.beginPath(); for (let i = 0; i < hp0.length; i += 2) { const jx = (i % 4 ? 1 : -1) * 0.02; if (i === 0) ctx.moveTo(x + (hp0[i] + jx) * R, y + hp0[i + 1] * R); else ctx.lineTo(x + (hp0[i] + jx) * R, y + hp0[i + 1] * R); }
    ctx.closePath(); ctx.stroke();
  }
}
function drawRing(x, y, R, under) {

function drawNetAbove() {
  const R = LY.R;

  if (net.state === 'up' && net.hp >= 0.999) { /* 乾的紙 */ }
  drawCarried(x, y, r, lift);
  drawRing(x, y, r, false);
  drawHandle(x, y, r);
}
function drawBowlDyn() {

  if (b) { pressId = b.id; activePtr = e.pointerId; KG.note(880, 0.05, 'sine', 0.12); try { cv.setPointerCapture(e.pointerId); } catch (er) { /* 忽略 */ } return; }

    if (nearBowl(x, y)) { toBowl(); return; }

  const [x, y] = ptrPos(e);

  if (pressId) return;
  if (!playable()) return;
  if (net.state === 'down') moveNet(x, y);

    return;
  }
  if (!playable()) return;
  if (net.state === 'down') lift();
  else if (net.state === 'carry' && net.drag) { net.drag = false; if (nearBowl(x, y) || nearBowl(net.x, net.y)) toBowl(); }
}
cv.addEventListener('pointerup', (e) => endPtr(e, false));
cv.addEventListener('pointercancel', (e) => endPtr(e, true));
cv.addEventListener('contextmenu', (e) => e.preventDefault());
window.addEventListener('keydown', (e) => {
  keys[e.code] = true;
  if (e.repeat) return;
  if (e.code === 'Escape' || e.code === 'KeyP') {
    if (scene === 'play' && !G.over) { overlay = overlay === 'pause' ? null : overlay === null ? 'pause' : overlay; return; }
    const b = btns.find(b => b.back); if (b && e.code === 'Escape') { KG.sound('click'); b.on(); }
    return;
  }
  if (e.code === 'Enter' && !(scene === 'play' && !overlay)) { const b = btns.find(b => b.primary); if (b) { KG.sound('click'); b.on(); } return; }
  if (playable()) {
    if (/^Arrow|^Key[WASD]$/.test(e.code)) { net.kbd = true; e.preventDefault(); }
    if (e.code === 'Space' || e.code === 'Enter') {
      e.preventDefault(); net.kbd = true;
      if (net.state === 'up') dip(net.tx, net.ty);
      else if (net.state === 'carry') toBowl();
    }
    if (e.code === 'KeyB') toBowl();
  }
});
window.addEventListener('keyup', (e) => {
  keys[e.code] = false;
  if (playable() && (e.code === 'Space' || e.code === 'Enter') && net.state === 'down') lift();
});
document.addEventListener('visibilitychange', () => {
  if (document.hidden) { if (scene === 'play' && !overlay && !G.over) overlay = 'pause'; Music.next = 0.2; }
});

/* ---------- 主迴圈 ---------- */
function update(dt) {
  time += dt; sceneT += dt;
  if (scene === 'play') { if (!overlay || (overlay === 'result')) updatePlay(dt); }
  else if (scene === 'aquarium') updateAq(dt);
  else {
    if (!fishes.length) { G.def = { pool: NIGHT_POOL, n: 14, duck: 1, turtle: 1 }; populate(G.def); }
    updateFish(fishes, dt, LY.water, { R: LY.R, L: LY.fishL, net: null }); updateCritters(dt);
  }
  updateFX(dt);
}
function draw() {
  btns = [];
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  if (scene === 'aquarium') { drawAquarium(); }
  else {
    let sx = 0, sy = 0;
    if (shakeT > 0) { sx = (Math.random() * 2 - 1) * shakeA; sy = (Math.random() * 2 - 1) * shakeA; }
    if (sx || sy) { ctx.fillStyle = '#5a2e1a'; ctx.fillRect(0, 0, W, H); }
    ctx.translate(sx, sy);
    ctx.drawImage(bg, 0, 0, W, H);
    drawLights();
    if (scene === 'play') {
      drawWater(true);
      drawBowlDyn();
      drawNetAbove();
      drawParts();
      drawTexts();
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      drawHUD();
      if (!overlay && !G.over) pauseBtn();
    } else {
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      if (scene === 'title') drawTitle();
      else if (scene === 'levels') { drawWater(false); drawLevels(); }
      else if (scene === 'shop') { drawWater(false); drawShop(); }
    }
  }
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  if (overlay) {
    btns = [];
    if (overlay === 'intro') drawIntro();
    else if (overlay === 'pause') drawPause();
    else if (overlay === 'result') drawResult();
  }
  if (scene !== 'play') drawTexts();
}
let last = performance.now(), prevScene = '', prevOverlay = null;
function frame(now) {
  const dt = Math.min(0.05, Math.max(0, (now - last) / 1000));
  last = now;
  if (prevOverlay !== overlay) { if (overlay) sceneT = 0; prevOverlay = overlay; }
  if (prevScene !== scene) { prevScene = scene; }
  if (!frozen && !document.hidden) update(dt);
  Music.update(dt);
  Snd.update(dt);
  draw();
  requestAnimationFrame(frame);
}
let relayoutQ = 0;
function queueRelayout() { clearTimeout(relayoutQ); relayoutQ = setTimeout(relayout, 60); }
window.addEventListener('resize', queueRelayout);
if (window.visualViewport) window.visualViewport.addEventListener('resize', queueRelayout);
window.addEventListener('orientationchange', () => setTimeout(relayout, 200));

/* ---------- 測試掛勾 ---------- */
window.__gf = {
  state() {
    const p = G.def && G.mode === 'challenge' && G.def.g ? goalProgress() : null;
    return {
      scene, overlay, mode: G.mode, level: G.level, over: G.over, won: G.won, stars: G.stars, score: G.score, caught: G.caught.length, counts: Object.assign({}, G.counts),
      goal: p, time: G.time, timeLeft: G.timeLeft, scoops: G.scoops, used: G.used, coins, aq: aqList.length,
      net: { state: net.state, x: net.x, y: net.y, hp: net.hp, speed: net.speed, carry: net.carry.length },
      R: LY.R, water: Object.assign({}, LY.water), bowl: Object.assign({}, LY.bowl), W, H
    };
  },
  start(mode, level, intro) {
    if (mode === 'aquarium') { enterAquarium(); return; }
    if (mode === 'title') { scene = 'title'; overlay = null; return; }
    if (mode === 'levels' || mode === 'shop') { scene = mode; overlay = null; sceneT = 0; return; }
    startGame(mode === 'challenge' ? 'challenge' : 'night', level || 0, !!intro);
  },
  begin() { if (overlay === 'intro') overlay = null; },
  dip(x, y) { return dip(x, y); },
  move(x, y) { moveNet(x, y); },
  lift() { return lift(); },
  toBowl() { return toBowl(); },
  step(n) { for (let i = 0; i < (n || 1); i++) update(1 / 60); draw(); },
  fish() { return fishes.filter(f => f.state === 'swim').map(f => ({ id: f.id, k: f.k, x: f.x, y: f.y, vx: f.vx, vy: f.vy, spawn: f.spawn })); },
  critters() { return critters.map(c => ({ type: c.type, x: c.x, y: c.y })); },
  aqFish() { return AQ.fish.map(f => ({ k: f.k, name: f.name, x: f.x, y: f.y })); },
  seed(n) { seedV = n >>> 0; },
  freeze(b) { frozen = !!b; },
  setHp(v) { net.hp = v; },
  pause() { if (scene === 'play') overlay = 'pause'; },
  mech: MECH, kinds: KINDS, levels: LEVELS.length,
  _def(i) { return Object.assign({}, LEVELS[i].g); },
  levelGoal(i) { return Object.assign({}, LEVELS[i].g); },
  addCoins(n) { coins += n; saveAll(); },
  reset() { coins = 0; owned = { papers: [0], paper: 0, extra: 0, deco: [] }; stars = []; aqList = []; saveAll(); },
  unlockAll() { for (let i = 0; i < LEVELS.length; i++) if (!stars[i]) stars[i] = 1; saveAll(); },
  layout() { return JSON.parse(JSON.stringify({ tub: LY.tub, water: LY.water, bowl: LY.bowl, R: LY.R, aq: LY.aq, land: LY.land })); }
};

relayout();
Music.start(SONG_NIGHT);
requestAnimationFrame((t) => { last = t; frame(t); });
</script>
