<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>推箱子</title>
<link rel="stylesheet" href="../../assets/common.css">
<style>
  html, body { height: 100%; overflow: hidden; background: #3b2a22; overscroll-behavior: none; }
  #cv { position: fixed; inset: 0; display: block; width: 100vw; height: 100vh; height: 100dvh; touch-action: none; }
  .ui { position: fixed; z-index: 50; font-family: var(--kg-font); }
  .hidden { display: none !important; }

  /* HUD */
  #hud { top: 10px; left: 50%; transform: translateX(-50%); display: flex; gap: 6px; align-items: stretch; pointer-events: none; max-width: calc(100vw - 128px); }
  .chip { background: rgba(255,255,255,0.92); border-radius: 16px; padding: 3px 10px 4px; box-shadow: 0 3px 0 rgba(0,0,0,0.18); text-align: center; min-width: 52px; color: #4a3b52; }
  .chip b { display: block; font-size: 19px; line-height: 1.05; font-weight: 900; font-variant-numeric: tabular-nums; }
  .chip small { display: block; font-size: 11px; font-weight: 800; opacity: 0.7; white-space: nowrap; }
  .chip.lv { min-width: 64px; }
  .chip.lv b { color: var(--accent, #e07a3a); }
  #pauseBtn { top: 66px; right: 10px; width: 48px; height: 48px; border-radius: 50%; border: 3px solid #fff; background: linear-gradient(180deg,#fff 0%,#ffe9f1 100%); box-shadow: var(--kg-shadow); display: flex; align-items: center; justify-content: center; cursor: pointer; padding: 0; }
  #pauseBtn i { display: inline-block; width: 6px; height: 18px; background: #6a4a7a; border-radius: 3px; margin: 0 2.5px; }

  /* toolbar */
  #tools { display: flex; gap: 8px; }
  body.port #tools { left: 50%; transform: translateX(-50%); bottom: calc(10px + env(safe-area-inset-bottom)); flex-direction: row; }
  body.land #tools { left: calc(10px + env(safe-area-inset-left)); top: 70px; flex-direction: column; gap: 6px; }
  .tb { width: 64px; height: 58px; border: none; border-radius: 18px; cursor: pointer; font-family: var(--kg-font); font-weight: 900; font-size: 12px; color: #fff;
        display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; padding: 0;
        background: linear-gradient(180deg, #ffbf7a, #f08a3c); box-shadow: 0 4px 0 #b65a1c, 0 6px 12px rgba(0,0,0,0.25); text-shadow: 0 1px 0 rgba(0,0,0,0.2); transition: transform .08s; }
  .tb:active, .tb.on { transform: translateY(3px); box-shadow: 0 1px 0 #b65a1c, 0 3px 6px rgba(0,0,0,0.25); }
  .tb svg { width: 26px; height: 26px; }
  .tb.blue { background: linear-gradient(180deg,#8fd4ff,#3b98e6); box-shadow: 0 4px 0 #23659f, 0 6px 12px rgba(0,0,0,0.25); }
  .tb.green { background: linear-gradient(180deg,#9be8aa,#3fb55f); box-shadow: 0 4px 0 #2a7f40, 0 6px 12px rgba(0,0,0,0.25); }
  .tb.purple { background: linear-gradient(180deg,#d4bfff,#8e66ea); box-shadow: 0 4px 0 #5e3fae, 0 6px 12px rgba(0,0,0,0.25); }
  body.land .tb { width: 58px; height: 50px; font-size: 11px; }
  body.land .tb svg { width: 22px; height: 22px; }

  /* d-pad */
  #dpad { width: 168px; height: 168px; }
  body.port #dpad { right: 50%; transform: translateX(50%); bottom: calc(80px + env(safe-area-inset-bottom)); }
  body.land #dpad { right: calc(12px + env(safe-area-inset-right)); bottom: 12px; width: 150px; height: 150px; }
  #dpad button { position: absolute; width: 33.3%; height: 33.3%; border: none; border-radius: 14px; background: rgba(255,255,255,0.88); box-shadow: 0 4px 0 rgba(0,0,0,0.25); cursor: pointer; display: grid; place-items: center; padding: 0; touch-action: none; }
  #dpad button:active, #dpad button.on { transform: translateY(3px); box-shadow: 0 1px 0 rgba(0,0,0,0.25); background: #fff3c4; }
  #dpad button svg { width: 55%; height: 55%; }
  #dpad .u { left: 33.3%; top: 0; } #dpad .d { left: 33.3%; bottom: 0; } #dpad .l { left: 0; top: 33.3%; } #dpad .r { right: 0; top: 33.3%; }
  #dpad .c { left: 33.3%; top: 33.3%; width: 33.3%; height: 33.3%; position: absolute; border-radius: 50%; background: rgba(255,255,255,0.35); pointer-events: none; }

  /* overlays */
  .ov { position: fixed; inset: 0; z-index: 8000; display: flex; align-items: center; justify-content: center; padding: 16px; font-family: var(--kg-font); }
  .ov.dim { background: rgba(30,20,30,0.55); }
  .card { background: linear-gradient(180deg,#fffaf2,#ffeedd); border-radius: 28px; padding: 22px 22px 20px; text-align: center; box-shadow: 0 10px 0 rgba(0,0,0,0.2), 0 20px 40px rgba(0,0,0,0.35); border: 4px solid #fff; max-width: 360px; width: 100%; animation: pop .35s cubic-bezier(.2,1.6,.4,1); max-height: calc(100% - 16px); overflow: auto; }
  .card h2 { margin: 2px 0 6px; font-size: 28px; color: #5a3a2a; }
  .card p { margin: 6px 0; font-size: 16px; font-weight: 700; color: #6b5444; }
  .acts { display: flex; flex-direction: column; gap: 10px; margin-top: 14px; align-items: stretch; }
  .acts .kg-btn { font-size: 19px; padding: 11px 18px; }
  .row2 { display: flex; gap: 10px; } .row2 .kg-btn { flex: 1; padding-left: 8px; padding-right: 8px; }
  @keyframes pop { from { transform: scale(.6); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  .stars { display: flex; justify-content: center; gap: 6px; margin: 4px 0 6px; }
  .stars svg { width: 54px; height: 54px; animation: starIn .5s cubic-bezier(.2,1.8,.4,1) both; }
  .stars svg:nth-child(2) { width: 66px; height: 66px; margin-top: -8px; }
  @keyframes starIn { from { transform: scale(0) rotate(-90deg); } to { transform: scale(1) rotate(0); } }
  .stat { display: flex; justify-content: center; gap: 10px; margin: 6px 0; }
  .stat div { background: #fff; border-radius: 14px; padding: 4px 12px; box-shadow: 0 2px 0 rgba(0,0,0,0.1); font-weight: 800; color: #6b5444; font-size: 13px; }
  .stat b { display: block; font-size: 22px; color: #e07a3a; }
  .newbest { display: inline-block; background: #ff6f91; color: #fff; border-radius: 10px; padding: 2px 10px; font-weight: 900; font-size: 13px; margin-top: 4px; }

  /* title */
  #title { flex-direction: column; gap: 0; }
  #title .logo { font-size: clamp(54px, 17vw, 96px); font-weight: 900; letter-spacing: 6px; color: #ffcf5a; line-height: 1;
    -webkit-text-stroke: 3px #5a2f17; paint-order: stroke fill; text-shadow: 0 6px 0 #5a2f17, 0 12px 24px rgba(0,0,0,0.35); margin-bottom: 6px; }
  #title .logo span { display: inline-block; animation: bob 2.4s ease-in-out infinite; }
  #title .logo span:nth-child(2) { animation-delay: .2s; color: #ff9d5c; } #title .logo span:nth-child(3) { animation-delay: .4s; color: #8fd96f; }
  @keyframes bob { 0%,100% { transform: translateY(0) rotate(-2deg); } 50% { transform: translateY(-8px) rotate(2deg); } }
  #title .sub { color: #fff; font-weight: 800; font-size: 16px; text-shadow: 0 2px 0 rgba(0,0,0,0.3); margin-bottom: 18px; }
  #title .acts { width: 240px; margin-top: auto; }
  #title .tstars { color: #fff; font-weight: 900; margin-top: 10px; text-shadow: 0 2px 0 rgba(0,0,0,0.3); font-size: 15px; }
  #titleInner { display: flex; flex-direction: column; align-items: center; height: 100%; justify-content: space-between; padding: 64px 0 calc(20px + env(safe-area-inset-bottom)); }
  body.land #titleInner { padding-top: 14px; }
  body.land #title .logo { font-size: 64px; }
  body.land #title .sub { margin-bottom: 0; }
  body.land #title .acts { flex-direction: row; width: auto; }

  /* level map */
  #map { align-items: stretch; justify-content: flex-start; flex-direction: column; padding: 66px 12px calc(12px + env(safe-area-inset-bottom)); background: rgba(25,18,24,0.55); }
  #map h2 { margin: 0 0 8px; text-align: center; color: #fff; font-size: 24px; text-shadow: 0 3px 0 rgba(0,0,0,0.3); }
  #tabs { display: flex; gap: 6px; justify-content: center; margin-bottom: 10px; flex-wrap: nowrap; }
  #tabs button { flex: 1 1 0; max-width: 130px; border: 3px solid rgba(255,255,255,0.6); border-radius: 16px; padding: 6px 4px; font-family: var(--kg-font); font-weight: 900; font-size: 15px; color: #fff; cursor: pointer; text-shadow: 0 2px 0 rgba(0,0,0,0.25); box-shadow: 0 4px 0 rgba(0,0,0,0.25); opacity: 0.75; }
  #tabs button small { display: block; font-size: 11px; opacity: 0.9; }
  #tabs button.sel { opacity: 1; border-color: #fff; transform: translateY(-2px); }
  #grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; max-width: 520px; width: 100%; margin: 0 auto; overflow: auto; padding: 4px; }
  body.land #grid { grid-template-columns: repeat(8, 1fr); max-width: 680px; gap: 8px; }
  body.land .lvb { aspect-ratio: auto; height: 62px; min-height: 0; font-size: 20px; }
  body.land #map { padding-top: 10px; }
  body.land #map h2 { font-size: 20px; margin-bottom: 6px; }
  body.land #tabs { max-width: 560px; margin: 0 auto 8px; width: 100%; }
  body.land #tabs button { padding: 3px 4px; font-size: 14px; }
  body.land #mapBack { margin-top: 8px; padding: 8px 22px; font-size: 17px; }
  .lvb { aspect-ratio: 1; border: none; border-radius: 18px; background: linear-gradient(180deg,#fff,#f3e3cf); box-shadow: 0 4px 0 rgba(0,0,0,0.25); cursor: pointer; font-family: var(--kg-font); font-weight: 900; font-size: 22px; color: #5a3a2a; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 2px; position: relative; min-height: 54px; }
  .lvb .st { display: flex; gap: 1px; margin-top: 1px; } .lvb .st svg { width: 14px; height: 14px; }
  .lvb.lock { background: linear-gradient(180deg,#9a8f94,#7a6f74); color: rgba(255,255,255,0.7); cursor: default; }
  .lvb.cur { outline: 4px solid #ffd65c; animation: glow 1.2s ease-in-out infinite; }
  @keyframes glow { 50% { outline-color: #fff3b0; transform: translateY(-2px); } }
  #mapBack { align-self: center; margin-top: 12px; }

  #thinking { left: 50%; top: 50%; transform: translate(-50%,-50%); background: rgba(0,0,0,0.6); color: #fff; padding: 10px 18px; border-radius: 16px; font-weight: 900; z-index: 7000; }
  #helpTip { left: 50%; transform: translateX(-50%); bottom: 150px; background: rgba(255,255,255,0.92); color: #5a3a2a; padding: 6px 14px; border-radius: 14px; font-weight: 800; font-size: 14px; pointer-events: none; box-shadow: 0 3px 0 rgba(0,0,0,0.15); white-space: nowrap; transition: opacity .5s; }
  body.land #helpTip { bottom: 12px; }
</style>
</head>
<body class="port">
<canvas id="cv" aria-label="推箱子遊戲畫面"></canvas>

<div id="hud" class="ui hidden">
  <div class="chip lv"><small id="hChap">倉庫</small><b id="hLv">1-1</b></div>
  <div class="chip"><small>步數</small><b id="hMoves">0</b></div>
  <div class="chip"><small>推動</small><b id="hPush">0</b></div>
  <div class="chip"><small id="hParL">三星</small><b id="hPar">0</b></div>
</div>
<button id="pauseBtn" class="ui hidden" aria-label="暫停"><i></i><i></i></button>

<div id="tools" class="ui hidden">
  <button class="tb" id="bUndo" aria-label="復原"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14L4 9l5-5"/><path d="M4 9h10a6 6 0 010 12h-3"/></svg>復原</button>
  <button class="tb blue" id="bRestart" aria-label="重來"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12a8 8 0 11-2.3-5.6"/><path d="M20 4v5h-5"/></svg>重來</button>
  <button class="tb green" id="bHint" aria-label="提示"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18h6M10 21h4"/><path d="M12 3a6 6 0 00-3.5 10.9c.6.5 1 1.2 1 2.1h5c0-.9.4-1.6 1-2.1A6 6 0 0012 3z"/></svg>提示</button>
  <button class="tb purple" id="bPad" aria-label="方向鍵"><svg viewBox="0 0 24 24" fill="#fff"><path d="M9 2h6v7h7v6h-7v7H9v-7H2V9h7z" opacity=".95"/></svg>方向鍵</button>
</div>

<div id="dpad" class="ui hidden">
  <div class="c"></div>
  <button class="u" data-d="u" aria-label="上"><svg viewBox="0 0 24 24"><path d="M12 5l8 11H4z" fill="#8a5a3a"/></svg></button>
  <button class="l" data-d="l" aria-label="左"><svg viewBox="0 0 24 24"><path d="M5 12l11-8v16z" fill="#8a5a3a"/></svg></button>
  <button class="r" data-d="r" aria-label="右"><svg viewBox="0 0 24 24"><path d="M19 12L8 4v16z" fill="#8a5a3a"/></svg></button>
  <button class="d" data-d="d" aria-label="下"><svg viewBox="0 0 24 24"><path d="M12 19l8-11H4z" fill="#8a5a3a"/></svg></button>
</div>
<div id="helpTip" class="ui hidden"></div>
<div id="thinking" class="ui hidden">想一想…</div>

<div id="title" class="ov">
  <div id="titleInner">
    <div style="text-align:center">
      <div class="logo"><span>推</span><span>箱</span><span>子</span></div>
      <div class="sub">把每個木箱推到發光的地點吧！</div>
    </div>
    <div style="display:flex;flex-direction:column;align-items:center">
      <div class="acts">
        <button class="kg-btn green" id="tPlay">開始</button>
        <button class="kg-btn yellow" id="tMap">選擇關卡</button>
      </div>
      <div class="tstars" id="tStars"></div>
    </div>
  </div>
</div>

<div id="map" class="ov hidden">
  <h2>選擇關卡</h2>
  <div id="tabs"></div>
  <div id="grid"></div>
  <button class="kg-btn blue" id="mapBack">回標題</button>
</div>

<div id="pause" class="ov dim hidden"><div class="card">
  <h2>休息一下</h2>
  <p id="pLv"></p>
  <div class="acts">
    <button class="kg-btn green" id="pResume">繼續</button>
    <div class="row2"><button class="kg-btn blue" id="pRestart">重新開始</button><button class="kg-btn yellow" id="pMap">選關</button></div>
    <button class="kg-btn" id="pPad">方向鍵：關</button>
    <button class="kg-btn blue" id="pTitle">回標題</button>
  </div>
</div></div>

<div id="win" class="ov dim hidden"><div class="card">
  <h2 id="wTitle">過關了！</h2>
  <div class="stars" id="wStars"></div>
  <div class="stat"><div>步數<b id="wMoves">0</b></div><div>推動<b id="wPush">0</b></div><div>最佳<b id="wBest">0</b></div></div>
  <p id="wMsg"></p>
  <div class="acts">
    <button class="kg-btn green" id="wNext">下一關</button>
    <div class="row2"><button class="kg-btn blue" id="wReplay">再玩一次</button><button class="kg-btn yellow" id="wMap">選關</button></div>
  </div>
</div></div>

<div id="dead" class="ov dim hidden"><div class="card">
  <h2>箱子卡住了！</h2>
  <p>現在這樣已經沒辦法完成了，退回到還能解開的地方吧。</p>
  <div class="acts">
    <button class="kg-btn green" id="dBack">退回可解的地方</button>
    <div class="row2"><button class="kg-btn blue" id="dRestart">重新開始</button><button class="kg-btn yellow" id="dClose">我再看看</button></div>
  </div>
</div></div>

<script src="../../assets/common.js"></script>
<script>

{m:"####--|#  ###|#@  .#|# $  #|#    #|######",p:6,s:"drrdru"},

{m:"#####--|#   #--|##  #--|#   ###|#   $ #|##$  .#|-#@# .#|-######",p:39,s:"urrruldluuluurdddulldrdrrurdllluurdldrr"},
{m:"#######|# .$@ #|#  $  #|### #.#|-#    #|-######",p:42,s:"ldllurrdrrddlludrruullulldrrddrruuulldrurd"},

{m:"#######|#     #|#@   .#|#   # #|# $ # #|###$ .#|--#   #|--#####",p:53,s:"rrrrddddlluuulldruururrddddlluluurrurddduulllddrulurr"},
{m:"---######|-### . .#|##      #|#@$   # #|## $ ####|#    #---|######---",p:31,s:"rdrulurrdlddruurudllururrllddru"},
{m:"#######|#.    #|#   $ #|# ##@##|#   $##|#.    #|#######",p:58,s:"urulldlldddrrruudllluurrurrdllrddllluuurrdluldrrrrullldldd"},
{m:"---####--|---#  #--|-###$.##-|-#   $ #-|##    .##|#@$ .   #|#########",p:39,s:"rrrurrullruulddrdldlluurrdrrdluullldrrr"},
{m:"------###-|----### ##|###-#.$  #|# ###.   #|# # $$@  #|#    . ###|########--",p:41,s:"ulurdddludllurrruulddurrrulldrrdlldlulldr"},
{m:"#######|#     #|### $ #|# #+$##|# .  #-|# # $##|#.    #|#######",p:59,s:"uurrdluldddrudlllddrrudruuluuurrdlulddddrdllruuruluurrdluld"},
{m:"######-|#    ##|### $ #|## $$ #|# .   #|###   #|-#.  ##|-#.@ #-|-#####-",p:48,s:"uuurruulddrdlullurddduurruulduulddddrrulldrdlrdl"},
{m:"####-###|#. ### #|#      #|# .##  #|#    $ #|#  ## .#|#### $$#|---#@  #|---#####",p:41,s:"rruuuluurdlddrddluuullrrurduulllldludddru"},
{m:"########|#.     #|###  # #|-# $$@ #|-# .$  #|-### . #|---#   #|---#####",p:43,s:"ruulldldrdrddluuulldrrdrruuldululdrrruullll"},

{m:"-#######--|##.   @###|# #.  $  #|#    #$  #|#    $   #|# ### ####|#.    #---|#######---",p:63,s:"ldrllddrrurrdlllluuurrdllddrrrurulllldludrdrrurulllulrdddlluldd"},

const chOf = i => Math.floor(i / PER_CH);

/* ---------- 遊戲狀態 ---------- */
let screen = 'title'; // title | map | play | pause | win
let lvl = null, curIdx = 0;
let boxes = [], player = 0, boxSet = null, hist = [], moves = 0, pushes = 0, solved = false;
let facing = 'd';
// 視覺
let pv = { x: 0, y: 0, fx: 0, fy: 0, t: 1, dur: 0.12, walk: 0, push: 0, bump: 0, bdx: 0, bdy: 0 };
let bv = []; // per box visual: {x,y,fx,fy,t,dur,lit,flash,id}
let queue = [];          // 等待執行的方向
let autoQueue = false;   // 自動走路中
let selBox = -1, selTargets = null;
let hintInfo = null;     // {box, dir, path, t}
let fast = false;

let deadWarned = false;

function loadLevel(idx, histStr) {
  curIdx = idx; lvl = parseLevel(idx);

  boxSet = new Uint8Array(lvl.n); for (const b of boxes) boxSet[b] = 1;
  hist = []; moves = 0; pushes = 0; solved = false; facing = 'd'; queue = []; autoQueue = false;
  selBox = -1; selTargets = null; hintInfo = null; deadWarned = false; winT = -1; parts.length = 0;
  if (histStr) { for (const ch of histStr) if (!applyMove(ch, true)) break; }

}
function syncVisual() {
  const w = lvl.w;

  bv = boxes.map(b => ({ x: b % w, y: Math.floor(b / w), fx: b % w, fy: Math.floor(b / w), t: 1, dur: 0.12, lit: lvl.goal[b] ? 1 : 0, flash: 0, cell: b, dead: 0 }));
}

/** 真正的移動函式：鍵盤、滑動、點擊、方向鍵、測試都走這裡 */
function applyMove(dir, silent) {
  if (!lvl || solved) return false;
  dir = String(dir).toLowerCase();
  const dv = DIRS[dir]; if (!dv) return false;
  const w = lvl.w, d = dv[0] + dv[1] * w;
  const n = player + d;
  facing = dir;
  if (!lvl.floor[n]) { if (!silent) bumpWall(dir); return false; }
  let pushed = false, bi = -1;
  if (boxSet[n]) {
    const nn = n + d;
    if (!lvl.floor[nn] || boxSet[nn]) { if (!silent) bumpWall(dir); return false; }
    bi = boxes.indexOf(n);
    boxes[bi] = nn; boxSet[n] = 0; boxSet[nn] = 1; pushed = true; pushes++;
  }
  const from = player; player = n; moves++;
  hist.push(pushed ? dir.toUpperCase() : dir);
  if (!silent) {
    const dur = fast ? 0.001 : (autoQueue ? 0.085 : 0.13);
    animStep(from, n, dur);
    if (pushed) {
      const b = bv[bi]; startTween(b, n % w, Math.floor(n / w), (n + d) % w, Math.floor((n + d) / w), dur);
      b.cell = n + d;
      const onG = lvl.goal[n + d], wasG = lvl.goal[n];
      if (onG) { b.flash = 1; sfx.land(); landBurst(n + d); }
      else { sfx.scrape(); if (wasG) sfx.off(); }
      b.lit = onG ? 1 : 0;
      checkDeadBox(bi);
    } else sfx.step();
    pv.push = pushed ? 1 : 0;
    hintInfo = null;
    if (selBox >= 0 && !autoQueue) { selBox = -1; selTargets = null; }
    updateHud();
    autosave();
  } else if (pushed) {
    bv.length = 0;
  }
  if (boxes.every(b => lvl.goal[b])) { solved = true; if (!silent) onSolved(); }
  return true;
}
function startTween(o, fx, fy, tx, ty, dur) { o.fx = fx; o.fy = fy; o.x = tx; o.y = ty; o.t = 0; o.dur = dur; }
function animStep(from, to, dur) {
  const w = lvl.w;
  startTween(pv, from % w, Math.floor(from / w), to % w, Math.floor(to / w), dur);
}
function bumpWall(dir) {
  const dv = DIRS[dir]; pv.bump = 1; pv.bdx = dv[0]; pv.bdy = dv[1];
  sfx.bump(); KG.vibrate(15);
}
function undo() {
  if (!lvl || !hist.length || (solved && winT >= 0 && screen !== 'play')) return false;
  if (solved) { solved = false; winT = -1; }
  const m = hist.pop(); const dir = m.toLowerCase(), pushed = m !== dir;
  const dv = DIRS[dir], w = lvl.w, d = dv[0] + dv[1] * w;
  const prev = player - d;
  if (pushed) {
    const b = player + d, bi = boxes.indexOf(b);
    boxes[bi] = player; boxSet[b] = 0; boxSet[player] = 1; pushes--;
    const v = bv[bi]; startTween(v, b % w, Math.floor(b / w), player % w, Math.floor(player / w), fast ? 0.001 : 0.1);
    v.cell = player; v.lit = lvl.goal[player] ? 1 : 0; v.dead = 0;
  }
  const from = player; player = prev; moves--;
  animStep(from, prev, fast ? 0.001 : 0.1);
  facing = dir;
  queue = []; autoQueue = false; hintInfo = null; selBox = -1; selTargets = null;
  sfx.undo();

}
function restartLevel() {
  if (!lvl) return;
  loadLevel(curIdx);
  sfx.restart();
  autosave();
}
function checkDeadBox(bi) {
  const b = boxes[bi];
  const tmp = new Uint8Array(lvl.n);
  if (!lvl.goal[b] && pushDead(lvl, boxSet, b, tmp)) {
    bv[bi].dead = 1;
    if (!deadWarned) { deadWarned = true; setTimeout(() => { if (screen === 'play') KG.toast('這個箱子卡住了，可以按「復原」'); }, 250); }
  }
}

/* ---------- 自動走 / 推 ---------- */
function cellAt(clientX, clientY) {
  const r = cv.getBoundingClientRect();
  const x = (clientX - r.left) * W / r.width, y = (clientY - r.top) * H / r.height;
  return { gx: (x - layout.ox) / layout.cs, gy: (y - layout.oy) / layout.cs };
}
function snapCell(gx, gy, pred) {

  for (let y = cy - 1; y <= cy + 1; y++) for (let x = cx - 1; x <= cx + 1; x++) {
    if (x < 0 || y < 0 || x >= lvl.w || y >= lvl.h) continue;
    const i = y * lvl.w + x; if (!pred(i)) continue;
    const dd = Math.hypot(x + 0.5 - gx, y + 0.5 - gy);

}

  if (selBox >= 0) {
    if (tappedBox === selBox) { selBox = -1; selTargets = null; sfx.tick(); return; }
    const target = snapCell(gx, gy, i => selTargets && selTargets.has(i));
    if (target >= 0) {
      const path = selTargets.get(target);
      selBox = -1; selTargets = null;
      runPath(path); sfx.select();
      return;
    }
    if (tappedBox >= 0) { selectBox(tappedBox); return; }
    selBox = -1; selTargets = null;
  }
  if (tappedBox >= 0) { selectBox(tappedBox); return; }

    const p = walkPath(lvl, boxSet, player, fc);

}
function distTo(i, gx, gy) { return Math.hypot(i % lvl.w + 0.5 - gx, Math.floor(i / lvl.w) + 0.5 - gy); }
let tapMark = null;

  bs[b] = 1; const seen = new Uint8Array(n); const pn = reachable(lvl, bs, player, seen); bs[b] = 0;
  const startK = key(b, pn); prev.set(startK, null); q.push([b, pn, player]);
  const res = new Map();
  for (let qi = 0; qi < q.length; qi++) {
    const [cb, cpn] = q[qi];
    bs[cb] = 1; reachable(lvl, bs, cpn, seen); const reach = seen.slice(); bs[cb] = 0;
    for (let k = 0; k < 4; k++) {

      bs[nb] = 1; const npn = reachable(lvl, bs, cb, seen); bs[nb] = 0;
      const kk = key(nb, npn);
      if (prev.has(kk)) continue;
      prev.set(kk, { pk: key(cb, cpn), pp, dir: DC[k], cb, nb });
      q.push([nb, npn]);
      if (!res.has(nb) && nb !== b) res.set(nb, kk);
    }

  const out = new Map();
  for (const [nb, kk] of res) {

}

}

/* ---------- 提示 / 卡死 ---------- */
let thinking = false;
function hint() {

  thinking = true; $('thinking').classList.remove('hidden');
  setTimeout(() => {

    thinking = false; $('thinking').classList.add('hidden');
    if (r && !r.timeout) {
      const ps = r.pushes[0];
      const d = lvl.D['udlr'.indexOf(ps.dir)];
      const path = walkPath(lvl, boxSet, player, ps.from - d) || '';
      hintInfo = { box: ps.from, dir: ps.dir, path, start: player, t: 0, left: r.pushes.length };
      sfx.hint();
      KG.toast('把發亮的箱子往' + DNAME[ps.dir] + '推（還要推 ' + r.pushes.length + ' 次）');
    } else if (r && r.timeout) {

}
function deadlockOf(bxs, pl) { const r = solvePushes(lvl, bxs, pl, 3000); return r === null; }
function backToSolvable() {
  // 一步步復原，直到回到有解的狀態（只在推箱子的地方檢查）
  hideOverlay('dead');
  let guard = 0;
  while (hist.length && guard++ < 2000) {
    const last = hist[hist.length - 1];
    undoSilent();

/* ---------- 過關 ---------- */
function onSolved() {

function finishWin() {
  const st = starsFor(curIdx, moves);
  const prevSt = save.prog.stars[curIdx] || 0;
  const prevBest = save.prog.best[curIdx];
  if (st > prevSt) save.prog.stars[curIdx] = st;
  const isBest = prevBest == null || moves < prevBest;
  if (isBest) save.prog.best[curIdx] = moves;
  save.write();

  $('wTitle').textContent = ['', '過關了！', '好厲害！', '完美！'][st];

/* ---------- 背景音樂 ---------- */
let userActed = false;
window.addEventListener('pointerdown', () => { userActed = true; }, { capture: true });
window.addEventListener('keydown', () => { userActed = true; }, { capture: true });
// 八分音符，數字為音階度數（0 = 主音），'.' 休止
const MEL = [0, 2, 4, 2, 0, 4, 7, '.', 5, 4, 2, 4, 2, 0, -1, '.', 0, 2, 4, 5, 7, 5, 4, 2, 4, 2, 0, -3, -1, 0, '.', '.'];
const BASS = [0, 0, -3, -3, -5, -5, -1, -1];
const SCALE = [0, 2, 4, 5, 7, 9, 11];
function degToSemi(d) { const o = Math.floor(d / 7), m = ((d % 7) + 7) % 7; return o * 12 + SCALE[m]; }
const music = { next: 0, step: 0 };
function updateMusic(dt) {
  if (!userActed || KG.isMuted() || document.hidden) return;
  const th = THEMES[lvl && screen !== 'title' && screen !== 'map' ? chOf(curIdx) : 0].music;
  const beat = 60 / th.bpm / 2;
  music.next -= dt;
  if (music.next < -0.5) music.next = 0;
  while (music.next <= 0) {
    const i = music.step % MEL.length;
    const m = MEL[i];
    const quiet = screen === 'pause' ? 0.4 : 1;
    if (m !== '.') KG.note(523.25 * Math.pow(2, (degToSemi(m) + th.root) / 12), beat * 1.6, th.wave, (th.wave === 'square' ? 0.025 : 0.05) * quiet);
    if (i % 4 === 0) { const b = BASS[(i / 4) % BASS.length]; KG.note(130.81 * Math.pow(2, (degToSemi(b) + th.root) / 12), beat * 3.6, 'triangle', 0.07 * quiet); }
    if (i % 2 === 1) KG.note(2600, 0.02, 'square', 0.008 * quiet);
    music.step++; music.next += beat;
  }
}

/* ---------- 版面 ---------- */
let bgCache = null, floorCache = null, wallCache = null, crateImg = null, crateLit = null, glowImg = null, goalImg = null;
function resize() {
  const r = cv.getBoundingClientRect();
  dpr = window.devicePixelRatio || 1;
  W = Math.max(1, r.width); H = Math.max(1, r.height);
  cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
  const land = W > H * 1.15;

  document.body.classList.toggle('port', !land);

}
function computeLayout() {

  const hud = $('hud').getBoundingClientRect();
  const land = document.body.classList.contains('land');
  if (!$('hud').classList.contains('hidden')) top = (hud.bottom - r.top) * sy + 8;
  const tools = $('tools').getBoundingClientRect(), pad = $('dpad').getBoundingClientRect();
  const padOn = !$('dpad').classList.contains('hidden');
  if (land) {

    right = W - 66; // 暫停鈕
    if (padOn) right = Math.min(right, (pad.left - r.left) * sx - 8);
    top = Math.max(top, 60);
  } else {

/* ---------- 畫面切換 ---------- */
function showOverlay(id) { $(id).classList.remove('hidden'); }
function hideOverlay(id) { $(id).classList.add('hidden'); }
function setPlayUI(on) {
  for (const id of ['hud', 'pauseBtn', 'tools']) $(id).classList.toggle('hidden', !on);
  $('dpad').classList.toggle('hidden', !(on && save.settings.dpad));
  $('bPad').classList.toggle('on', !!save.settings.dpad);
  $('pPad').textContent = '方向鍵：' + (save.settings.dpad ? '開' : '關');
}
function startLevel(idx, histStr) {
  for (const id of ['title', 'map', 'pause', 'win', 'dead']) hideOverlay(id);
  screen = 'play';
  setPlayUI(true);
  loadLevel(idx, histStr);
  buildBg();
  buildBoardCache();
  showTip();
}
let tipTimer = 0;
function showTip() {
  const el = $('helpTip');
  let t = '';
  if (curIdx === 0) t = coarse ? '滑動移動・點地板自動走・點箱子再點目的地' : '方向鍵 / WASD 移動・Z 復原・R 重來';
  else if (curIdx === 1) t = coarse ? '按住滑動可以一直走，點「提示」看下一步' : '也可以用滑鼠點地板自動走過去';
  if (!t) { el.classList.add('hidden'); return; }
  el.textContent = t; el.classList.remove('hidden'); el.style.opacity = 1;
  clearTimeout(tipTimer); tipTimer = setTimeout(() => { el.style.opacity = 0; setTimeout(() => el.classList.add('hidden'), 600); }, 5200);
}
function goTitle() {
  for (const id of ['map', 'pause', 'win', 'dead']) hideOverlay(id);
  setPlayUI(false); $('helpTip').classList.add('hidden');
  screen = 'title'; showOverlay('title');
  refreshTitle(); buildBg();
}
function refreshTitle() {
  const cur = KG.store.get(SLUG + ':cur', null);
  $('tPlay').textContent = cur ? '繼續第 ' + (chOf(cur.i) + 1) + '-' + (cur.i % PER_CH + 1) + ' 關' : (totalStars() ? '繼續冒險' : '開始');
  $('tStars').textContent = '★ ' + totalStars() + ' / ' + LEVELS.length * 3;
}
let mapCh = 0;
function openMap(ch) {
  for (const id of ['title', 'pause', 'win', 'dead']) hideOverlay(id);
  setPlayUI(false); $('helpTip').classList.add('hidden');
  screen = 'map';
  if (ch == null) ch = chOf(firstOpen());
  mapCh = ch; renderMap(); showOverlay('map');
}
function firstOpen() { for (let i = 0; i < LEVELS.length; i++) if (!save.prog.stars[i]) return unlocked(i) ? i : Math.max(0, i - 1); return LEVELS.length - 1; }
function renderMap() {
  const tabs = $('tabs'); tabs.innerHTML = '';
  const tabCol = ['linear-gradient(180deg,#f2a36b,#c8642e)', 'linear-gradient(180deg,#6cbcf0,#2a74b8)', 'linear-gradient(180deg,#a8e6f7,#4aa6d0)', 'linear-gradient(180deg,#a68cff,#5a3fc0)'];
  CHAPTERS.forEach((c, i) => {
    const b = document.createElement('button');
    let st = 0; for (let k = i * PER_CH; k < (i + 1) * PER_CH; k++) st += save.prog.stars[k] || 0;
    b.innerHTML = c.name + '<small>★ ' + st + '/' + PER_CH * 3 + '</small>';
    b.style.background = tabCol[i];
    if (i === mapCh) b.classList.add('sel');
    b.addEventListener('click', () => { mapCh = i; KG.sound('click'); renderMap(); });
    tabs.appendChild(b);
  });
  const grid = $('grid'); grid.innerHTML = '';
  const fo = firstOpen();
  for (let i = mapCh * PER_CH; i < (mapCh + 1) * PER_CH && i < LEVELS.length; i++) {
    const b = document.createElement('button');
    const un = unlocked(i);
    b.className = 'lvb' + (un ? '' : ' lock') + (i === fo ? ' cur' : '');
    b.innerHTML = un ? (i % PER_CH + 1) + '<span class="st">' + miniStars(save.prog.stars[i] || 0) + '</span>' : '<svg viewBox="0 0 24 24" width="22" height="22"><path d="M7 10V7a5 5 0 0110 0v3" stroke="#fff" stroke-width="2.6" fill="none"/><rect x="5" y="10" width="14" height="11" rx="3" fill="#fff"/></svg>';
    b.setAttribute('aria-label', '第 ' + (i % PER_CH + 1) + ' 關');
    b.addEventListener('click', () => {
      if (!un) { KG.sound('wrong'); KG.toast('先完成前一關喔'); return; }
      KG.sound('click');
      const cur = KG.store.get(SLUG + ':cur', null);
      startLevel(i, cur && cur.i === i ? cur.h : '');
    });
    grid.appendChild(b);
  }
}
function pauseGame() {
  if (screen !== 'play') return;
  screen = 'pause'; holdDir = null; keysHeld.clear();
  $('pLv').textContent = CHAPTERS[chOf(curIdx)].name + ' 第 ' + (curIdx % PER_CH + 1) + ' 關';
  showOverlay('pause');
}
function resumeGame() { hideOverlay('pause'); screen = 'play'; last = performance.now(); }

$('tPlay').addEventListener('click', () => {
  KG.sound('click');
  const cur = KG.store.get(SLUG + ':cur', null);
  if (cur && cur.i >= 0 && cur.i < LEVELS.length) startLevel(cur.i, cur.h);
  else startLevel(firstOpen());
});
$('tMap').addEventListener('click', () => { KG.sound('click'); openMap(); });
$('mapBack').addEventListener('click', () => { KG.sound('click'); goTitle(); });
$('pauseBtn').addEventListener('click', () => { KG.sound('click'); pauseGame(); });
$('pResume').addEventListener('click', () => { KG.sound('click'); resumeGame(); });
$('pRestart').addEventListener('click', () => { hideOverlay('pause'); screen = 'play'; restartLevel(); });
$('pMap').addEventListener('click', () => { KG.sound('click'); openMap(chOf(curIdx)); });
$('pTitle').addEventListener('click', () => { KG.sound('click'); goTitle(); });
function togglePad() {
  save.settings.dpad = !save.settings.dpad; save.writeSettings();
  setPlayUI(screen === 'play' || screen === 'pause');
  computeLayout(); buildBoardCache();
}
$('pPad').addEventListener('click', () => { KG.sound('click'); togglePad(); });
$('bPad').addEventListener('click', () => { KG.sound('click'); togglePad(); });
$('bUndo').addEventListener('click', () => { if (screen === 'play') undo(); });
$('bRestart').addEventListener('click', () => { if (screen === 'play') restartLevel(); });
$('bHint').addEventListener('click', () => { if (screen === 'play') hint(); });
$('wNext').addEventListener('click', () => { KG.sound('click'); if (curIdx + 1 < LEVELS.length) startLevel(curIdx + 1); else openMap(3); });
$('wReplay').addEventListener('click', () => { KG.sound('click'); startLevel(curIdx); });
$('wMap').addEventListener('click', () => { KG.sound('click'); openMap(chOf(curIdx)); });
$('dBack').addEventListener('click', () => { KG.sound('click'); backToSolvable(); });
$('dRestart').addEventListener('click', () => { hideOverlay('dead'); screen = 'play'; restartLevel(); });
$('dClose').addEventListener('click', () => { KG.sound('click'); hideOverlay('dead'); screen = 'play'; });
// 工具列按鈕不要觸發畫布手勢
for (const id of ['tools', 'dpad', 'pauseBtn']) $(id).addEventListener('pointerdown', e => e.stopPropagation());

document.addEventListener('visibilitychange', () => { if (document.hidden) pauseGame(); else last = performance.now(); });
let rzT = 0;
function onResize() { clearTimeout(rzT); rzT = setTimeout(resize, 60); }
window.addEventListener('resize', onResize);
window.addEventListener('orientationchange', onResize);
if (window.visualViewport) visualViewport.addEventListener('resize', onResize);

/* ---------- 測試掛勾 ---------- */
window.__bp = {
  get levels() { return LEVELS.length; },
  level(i) { return { rows: LEVELS[i].m.split('|'), par: LEVELS[i].p, sol: LEVELS[i].s }; },
  state() {
    if (!lvl) return { screen };
    const w = lvl.w, xy = c => [c % w, Math.floor(c / w)];
    return { screen, level: curIdx, w, h: lvl.h, player: xy(player), boxes: boxes.map(xy), goals: lvl.goals.map(xy), moves, pushes, solved, history: hist.join(''), animating: pv.t < 1 || queue.length > 0, facing, cs: layout.cs, stars: save.prog.stars[curIdx] || 0, queue: queue.length, selected: selBox >= 0 ? xy(selBox) : null, hint: hintInfo ? { box: xy(hintInfo.box), dir: hintInfo.dir } : null };
  },
  start(i, h) { startLevel(i, h || ''); return this.state(); },
  move(dir) { const d = { up: 'u', down: 'd', left: 'l', right: 'r' }[dir] || dir; return applyMove(d); },
  undo() { return undo(); },
  restart() { restartLevel(); },
  fast(v) { fast = v !== false; },
  finish() { pv.t = 1; for (const b of bv) b.t = 1; while (queue.length) { const d = queue.shift(); if (!applyMove(d)) { queue = []; } pv.t = 1; for (const b of bv) b.t = 1; } autoQueue = false; },
  solve(i, budget) {
    const L = i == null ? lvl : parseLevel(i);
    const isCur = i == null;
    const r = solveMoves(L, isCur ? boxes : L.boxes, isCur ? player : L.player, budget || 8000);
    if (!r) return null;
    if (r.timeout) return { timeout: true };
    return r.moves;
  },
  solveInfo(i, budget) { const L = parseLevel(i); const t0 = performance.now(); const r = solveMoves(L, L.boxes, L.player, budget || 8000); return r && !r.timeout ? { moves: r.moves.length, pushes: r.pushes.length, nodes: r.nodes, ms: performance.now() - t0 } : { fail: r ? 'timeout' : 'unsolvable', ms: performance.now() - t0 }; },
  deadlock(st) {
    if (!st) return deadlockOf(boxes, player);
    const w = lvl.w; return deadlockOf(st.boxes.map(([x, y]) => y * w + x), st.player[1] * w + st.player[0]);
  },
  replay(i, mv) {
    startLevel(i); const was = fast; fast = true;
    for (const ch of mv) { if (!applyMove(ch)) break; if (solved) break; }
    fast = was; const ok = solved; return ok;
  },
  hint() { hint(); },
  cellToClient(x, y) { const r = cv.getBoundingClientRect(); return { x: r.left + (layout.ox + (x + 0.5) * layout.cs) * r.width / W, y: r.top + (layout.oy + (y + 0.5) * layout.cs) * r.height / H }; },
  screen() { return screen; },
  winNow() { if (winT >= 0) winT = 2; },
  progress() { return save.prog; }
};

/* ---------- 開始 ---------- */
resize();
refreshTitle();
requestAnimationFrame(frame);
</script>
