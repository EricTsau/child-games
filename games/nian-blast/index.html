<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#b8231f">
<title>鞭炮趕年獸</title>
<link rel="stylesheet" href="../../assets/common.css">
<style>
  html, body { height: 100%; overflow: hidden; background: #6e1414; overscroll-behavior: none; }
  #cv { position: fixed; inset: 0; display: block; width: 100vw; height: 100vh; height: 100dvh; touch-action: none; }
  button { font-family: var(--kg-font); -webkit-tap-highlight-color: transparent; }
  .kg-btn:focus { outline: none; }
  .kg-btn:focus-visible, .chr:focus-visible, .node:focus-visible, .seg button:focus-visible { outline: 4px solid #ffd34d; outline-offset: 3px; }
  .kg-btn.red { background: linear-gradient(180deg, #ff7b6b 0%, #d8322a 100%); box-shadow: 0 5px 0 #8e1a14, 0 10px 18px rgba(142,26,20,.35); }
  .kg-btn.gold { background: linear-gradient(180deg, #ffe58a 0%, #f2a71b 100%); box-shadow: 0 5px 0 #b06d00, 0 10px 18px rgba(176,109,0,.35); color: #6b3a00; text-shadow: none; }
  .kg-btn.off { background: linear-gradient(180deg, #d9d2cc 0%, #a99f97 100%); box-shadow: 0 5px 0 #7c726a; }
  .kg-btn:disabled { filter: grayscale(.8); opacity: .55; cursor: default; }
  svg.st { width: 1em; height: 1em; vertical-align: -0.12em; }

  .scr { position: fixed; inset: 0; z-index: 9000; display: none; flex-direction: column; align-items: center; justify-content: center;
    padding: 64px 14px 14px; gap: 10px; color: #fff; text-align: center; overflow: hidden; }
  .scr.show { display: flex; animation: kg-fade .25s ease; }
  .scr.dim { background: rgba(60, 8, 8, .55); backdrop-filter: blur(2px); }
  .card2 { width: min(440px, 100%); max-height: 100%; overflow-y: auto; touch-action: pan-y; background: linear-gradient(180deg, #fffaf0 0%, #ffe9cf 100%);
    border: 5px solid #ffd34d; border-radius: 28px; padding: 16px 16px 18px; color: #6b1c12; box-shadow: 0 8px 0 #9b2b16, 0 18px 40px rgba(40,0,0,.45);
    animation: kg-pop .32s cubic-bezier(.2,1.6,.4,1); }
  .card2 h2 { margin: 2px 0 6px; font-size: 28px; }
  .card2 p { margin: 4px 0 10px; font-size: 17px; line-height: 1.45; font-weight: 700; }
  .acts { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }
  .acts .kg-btn { padding: 10px 20px; font-size: 19px; }
  .aud .kg-btn { font-size: 16px; padding: 7px 14px; }
  .hint { font-size: 13px; opacity: .7; margin-top: 8px; font-weight: 700; }

  /* 標題 */
  #title { justify-content: space-between; padding: 60px 12px 12px; }
  .logo { position: relative; margin-top: 2px; line-height: 1; }
  .logo h1 { margin: 0; font-size: clamp(40px, 11vw, 74px); font-weight: 900; letter-spacing: 4px; color: #ffe27a;
    -webkit-text-stroke: 3px #7a1208; paint-order: stroke fill; text-shadow: 0 5px 0 #7a1208, 0 10px 18px rgba(0,0,0,.35); }
  .logo .tag { display: inline-block; margin-top: 8px; padding: 3px 14px; border-radius: 999px; background: #ffd34d; color: #8a1d0c; font-weight: 900; font-size: 15px; box-shadow: 0 3px 0 #a3510a; }
  .tmid { display: flex; flex-direction: column; align-items: center; gap: 8px; }
  .tmid .lbl { font-weight: 900; font-size: 15px; background: rgba(90,10,6,.55); padding: 2px 12px; border-radius: 999px; }
  .chars { display: flex; gap: 8px; justify-content: center; }
  .chr { width: 82px; border-radius: 18px; border: 3px solid #fff3d0; background: linear-gradient(180deg, #fff9ec, #ffe0b8); color: #7a2412; cursor: pointer; padding: 2px 2px 4px;
    box-shadow: 0 4px 0 #a2401c; transition: transform .12s; display: flex; flex-direction: column; align-items: center; }
  .chr canvas { width: 70px; height: 70px; display: block; }
  .chr span { font-size: 14px; font-weight: 900; white-space: nowrap; }
  .chr.on { border-color: #ffd34d; background: linear-gradient(180deg, #fff4b0, #ffc94a); transform: translateY(-4px) scale(1.06); box-shadow: 0 6px 0 #b0600a, 0 0 0 4px rgba(255,211,77,.45); }
  .tbtm { display: flex; flex-direction: column; gap: 8px; align-items: center; }
  .modes .kg-btn { font-size: 22px; padding: 12px 22px; min-width: 150px; }
  .tinfo { font-size: 13px; font-weight: 800; opacity: .9; background: rgba(90,10,6,.5); padding: 3px 12px; border-radius: 12px; }
  @media (max-height: 520px) {
    #title { padding: 8px 70px 8px; flex-direction: row; flex-wrap: wrap; justify-content: center; align-content: center; gap: 8px 22px; }
    .logo h1 { font-size: 46px; } .logo .tag { font-size: 13px; margin-top: 4px; }
    .logo { width: 100%; }
    .chr { width: 68px; } .chr canvas { width: 56px; height: 56px; } .chr span { font-size: 12.5px; }
    .modes .kg-btn { font-size: 19px; padding: 9px 16px; min-width: 120px; }
    .aud .kg-btn { font-size: 14px; padding: 5px 11px; }
    .tinfo { display: none; }
  }
  @media (max-height: 400px) { .logo h1 { font-size: 38px; } .tmid .lbl { display: none; } }

  /* 關卡地圖 */
  #map { justify-content: flex-start; padding-top: 62px; }
  .mhead { display: flex; align-items: center; gap: 8px; width: min(560px, 100%); justify-content: center; }
  .mhead h2 { margin: 0; font-size: 26px; text-shadow: 0 3px 0 rgba(0,0,0,.3); min-width: 0; flex: 1; white-space: nowrap; }
  .mhead h2 small { display: block; font-size: 14px; opacity: .9; }
  .arrow { width: 52px; height: 52px; border-radius: 50%; border: 3px solid #fff; background: #ffd34d; color: #7a2412; font-size: 26px; font-weight: 900; cursor: pointer; box-shadow: 0 4px 0 #a3510a; flex: none; padding: 0; }
  .arrow:disabled { opacity: .35; }
  .mboard { position: relative; width: min(560px, 100%); flex: 1 1 auto; min-height: 0; max-height: 380px; border-radius: 26px; border: 4px solid rgba(255,255,255,.85);
    box-shadow: 0 6px 0 rgba(0,0,0,.25); overflow: hidden; }
  .mboard canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
  .node { position: absolute; width: 66px; height: 66px; margin: -33px 0 0 -33px; border-radius: 50%; border: 4px solid #fff; cursor: pointer; padding: 0;
    background: radial-gradient(circle at 40% 35%, #fff4c2, #ffc23a 70%); color: #7a2412; font-weight: 900; font-size: 24px; box-shadow: 0 5px 0 #a3510a;
    display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1; transition: transform .12s; }
  .node.boss { width: 78px; height: 78px; margin: -39px 0 0 -39px; background: radial-gradient(circle at 40% 35%, #ffb3a0, #e0402a 70%); color: #fff; font-size: 17px; }
  .node.lock { background: radial-gradient(circle at 40% 35%, #eee, #a9a29c 70%); color: #6f6a66; box-shadow: 0 5px 0 #6f6a66; cursor: default; }
  .node.cur { animation: nodeBob 1s ease-in-out infinite; }
  .node .ns { font-size: 13px; letter-spacing: -1px; margin-top: 3px; display: flex; }
  .node .ns svg { width: 13px; height: 13px; }
  .node small { font-size: 11px; display: block; margin-top: 2px; }
  @keyframes nodeBob { 0%,100% { transform: translateY(0) } 50% { transform: translateY(-6px) } }
  .mfoot { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; justify-content: center; }
  .chip { background: rgba(90,10,6,.55); border-radius: 999px; padding: 5px 14px; font-weight: 900; font-size: 17px; display: inline-flex; align-items: center; gap: 6px; }
  @media (max-height: 520px) {
    #map { padding: 6px 70px 8px; gap: 6px; }
    .mhead h2 { font-size: 21px; } .mhead h2 small { font-size: 12px; }
    .arrow { width: 44px; height: 44px; font-size: 22px; }
    .node { width: 56px; height: 56px; margin: -28px 0 0 -28px; font-size: 20px; }
    .node.boss { width: 64px; height: 64px; margin: -32px 0 0 -32px; font-size: 15px; }
    .mfoot .kg-btn { padding: 7px 16px; font-size: 17px; }
  }

  /* 對戰設定 */
  .seg { display: flex; gap: 6px; justify-content: center; flex-wrap: wrap; margin: 4px 0 10px; }
  .seg button { border: 3px solid #f3c784; background: #fff; color: #7a2412; border-radius: 14px; font-weight: 900; font-size: 17px; padding: 6px 12px; cursor: pointer; min-width: 62px; }
  .seg button.on { background: #ffcf45; border-color: #d88a0c; box-shadow: 0 3px 0 #b06d00; }
  .seg button:disabled { opacity: .4; }
  .slbl { font-weight: 900; font-size: 15px; margin-top: 2px; }
  .note { font-size: 13px; font-weight: 700; opacity: .75; margin: -4px 0 8px; }
  #battle .card2 { width: min(480px, 100%); }
  @media (max-height: 520px) {
    #battle { padding: 8px 64px; }
    #battle .card2 { padding: 8px 14px 12px; display: grid; grid-template-columns: 1fr 1fr; gap: 0 14px; width: min(640px, 100%); }
    #battle .card2 h2 { grid-column: 1 / -1; font-size: 22px; margin: 0 0 2px; }
    #bWins { grid-column: 1 / -1; margin: 0 0 2px; }
    #battle .card2 .acts { grid-column: 1 / -1; }
    .seg { margin: 2px 0 6px; } .seg button { font-size: 15px; padding: 4px 9px; min-width: 52px; }
    .card2 { padding: 10px 14px 12px; } .card2 h2 { font-size: 22px; margin: 0 0 2px; } .card2 p { font-size: 15px; margin: 2px 0 6px; }
    .acts .kg-btn { padding: 8px 16px; font-size: 17px; }
  }

  /* 結算 */
  .stars3 { display: flex; justify-content: center; gap: 6px; margin: 2px 0 4px; }
  .stars3 .sb { display: flex; flex-direction: column; align-items: center; width: 92px; font-size: 12.5px; font-weight: 800; line-height: 1.2; }
  .stars3 svg { width: 50px; height: 50px; }
  .stars3 .sb.off svg { filter: grayscale(1); opacity: .35; }
  .stars3 .sb.on svg { animation: starPop .5s cubic-bezier(.2,1.8,.4,1) both; }
  @keyframes starPop { 0% { transform: scale(0) rotate(-40deg) } 100% { transform: scale(1) rotate(0) } }
  .newrec { display: none; color: #fff; background: #e0402a; border-radius: 999px; padding: 2px 12px; font-weight: 900; font-size: 15px; width: max-content; margin: 0 auto; animation: kg-bounce 1s infinite; }
  .newrec.show { display: block; }
  .rbig { width: 120px; height: 110px; display: block; margin: 0 auto; }
  @media (max-height: 520px) {
    .scr.dim { padding: 8px 64px; }
    .stars3 svg { width: 36px; height: 36px; } .stars3 .sb { font-size: 11.5px; }
    .rbig { width: 84px; height: 76px; }
    .hint { display: none; }
  }
  .score { display: flex; justify-content: center; gap: 8px; margin: 6px 0 10px; flex-wrap: wrap; }
  .score .pl { display: flex; flex-direction: column; align-items: center; background: #fff; border-radius: 16px; border: 3px solid #f3c784; padding: 2px 6px 4px; min-width: 74px; font-weight: 900; font-size: 13px; }
  .score .pl.win { border-color: #ffb81c; background: #fff4bf; }
  .score .pl canvas { width: 54px; height: 54px; }
  .score .pl b { font-size: 18px; color: #c0301c; }

  #pauseBtn { position: fixed; right: 10px; top: 66px; z-index: 8500; width: 48px; height: 48px; border-radius: 50%; border: 3px solid #fff; padding: 0; cursor: pointer;
    background: linear-gradient(180deg, #fff, #ffe3c4); box-shadow: 0 4px 0 rgba(90,20,10,.35); display: none; align-items: center; justify-content: center; gap: 5px; }
  #pauseBtn i { display: block; width: 6px; height: 18px; border-radius: 3px; background: #a3301c; }
  body.playing #pauseBtn { display: flex; }
</style>
</head>
<body>
<canvas id="cv" aria-label="鞭炮趕年獸遊戲畫面"></canvas>
<button id="pauseBtn" aria-label="暫停" title="暫停 (P)"><i></i><i></i></button>

<div class="scr show" id="title">
  <div class="logo"><h1>鞭炮趕年獸</h1><div class="tag">過年囉！放鞭炮把調皮的年獸趕走</div></div>
  <div class="tmid">
    <div class="lbl">選一位小英雄</div>
    <div class="chars" id="chars"></div>
  </div>
  <div class="tbtm">
    <div class="acts modes"><button class="kg-btn red" id="btnStory">故事模式</button><button class="kg-btn gold" id="btnBattle">對戰模式</button></div>
    <div class="acts aud"><button class="kg-btn blue" data-aud="music">音樂 開</button><button class="kg-btn blue" data-aud="sfx">音效 開</button></div>
    <div class="tinfo" id="tinfo">搖桿走路・按「放鞭炮」・鍵盤：方向鍵／WASD + 空白鍵</div>
  </div>
</div>

<div class="scr" id="map">
  <div class="mhead"><button class="arrow" id="mPrev" aria-label="上一區">‹</button><h2 id="mName">廟口</h2><button class="arrow" id="mNext" aria-label="下一區">›</button></div>
  <div class="mboard" id="mBoard"><canvas id="mCv"></canvas></div>
  <div class="mfoot"><span class="chip" id="mStars"></span><button class="kg-btn blue" id="mBack">回標題</button></div>
</div>

<div class="scr dim" id="battle">
  <div class="card2">
    <h2>對戰模式</h2>
    <div class="note" id="bWins"></div>
    <div><div class="slbl">對手人數</div><div class="seg" id="bNum"><button data-v="1">1 位</button><button data-v="2">2 位</button><button data-v="3">3 位</button></div></div>
    <div><div class="slbl">電腦難度</div><div class="seg" id="bDiff"><button data-v="0">簡單</button><button data-v="1">普通</button><button data-v="2">厲害</button></div></div>
    <div><div class="slbl">玩家 2</div><div class="seg" id="b2p"><button data-v="0">電腦</button><button data-v="1">真人</button></div><div class="note" id="b2note">雙人：P1 WASD + 空白鍵，P2 方向鍵 + Enter</div></div>
    <div><div class="slbl">場地</div><div class="seg" id="bArena"></div></div>
    <div class="acts"><button class="kg-btn red" id="bGo">開打！</button><button class="kg-btn blue" id="bBack">回標題</button></div>
  </div>
</div>

<div class="scr dim" id="pause">
  <div class="card2">
    <h2>休息一下</h2>
    <p id="pInfo"></p>
    <div class="acts">
      <button class="kg-btn green" id="pResume">繼續</button>
      <button class="kg-btn gold" id="pRestart">重新開始</button>
      <button class="kg-btn blue" id="pQuit">離開</button>
    </div>
    <div class="acts aud" style="margin-top:10px"><button class="kg-btn blue" data-aud="music">音樂 開</button><button class="kg-btn blue" data-aud="sfx">音效 開</button></div>
    <div class="hint">按 P 或 Esc 繼續</div>
  </div>
</div>

<div class="scr dim" id="result">
  <div class="card2">
    <div class="newrec" id="rRec">新紀錄！</div>
    <canvas class="rbig" id="rCv" width="240" height="220"></canvas>
    <h2 id="rTitle">過關！</h2>
    <div class="stars3" id="rStars"></div>
    <div class="score" id="rScore"></div>
    <p id="rMsg"></p>
    <div class="acts" id="rActs"></div>
    <div class="hint" id="rHint">按 Enter 繼續</div>
  </div>
</div>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <linearGradient id="gStar" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff07a"/><stop offset="1" stop-color="#ffb21e"/></linearGradient>
    <symbol id="i-star" viewBox="0 0 24 24"><path d="M12 1.8l3.1 6.4 7 .9-5.1 4.9 1.3 7-6.3-3.4-6.3 3.4 1.3-7L1.9 9.1l7-.9z" fill="url(#gStar)" stroke="#c46a00" stroke-width="1.6" stroke-linejoin="round"/></symbol>
  </defs>
</svg>

<script src="../../assets/common.js"></script>
<script src="../../assets/kg-music.js"></script>
<script>
'use strict';
/* ================= 音樂（全部原創） ================= */
const E8 = '', R16 = '................';
function layersOf(steps) {
  const s12 = steps === 12;
  return [
    { inst: 'shaker', pat: s12 ? 'xoxoxoxoxoxo' : 'xoxoxoxoxoxoxoxo', layer: 'danger', vol: 0.75 },
    { inst: 'strings', chord: 'hold', oct: 3, layer: 'danger', vol: 0.5 },
    { inst: 'brass', chord: s12 ? 'R...R...5...' : 'R..R..R...R.R...', oct: 4, layer: 'hype', vol: 0.45 },
    { inst: 'clap', pat: s12 ? '....x...x...' : '....x.......x...', layer: 'hype', vol: 0.7 },
    { inst: 'ohat', pat: s12 ? '..x...x...x.' : '..x...x...x...x.', layer: 'hype', vol: 0.55 }
  ];
}
const SONGS = {
  /* 標題／地圖：迎春廟會進行曲（A 大調 118） */
  title: {
    bpm: 118, swing: 0.04,
    chords: ['A', 'D', 'E', 'A', 'F#m', 'D', 'E7', 'A'],
    tracks: [
      { inst: 'crash', pat: ['X...............', R16, R16, R16, R16, R16, R16, R16], vol: 0.7 },
      { inst: 'kick', pat: 'x.......x.......', vol: 0.8 },
      { inst: 'snare', pat: ['..o.x..o..o.x.oo', '..o.x..o..o.x.oo', '..o.x..o..o.x.oo', '..o.x..o.oo.xxxx'], vol: 0.55 },
      { inst: 'tom', pitch: 110, pat: [R16, R16, R16, 'x...x...X.......', R16, R16, R16, 'X...X...x.x.X...'], vol: 0.7 },
      { inst: 'shaker', pat: '..x...x...x...x.', vol: 0.6 },
      { inst: 'sub', chord: 'R.......5.......', vol: 0.9 },
      { inst: 'pluck', chord: '..3...3...3...3.', oct: 4, vol: 0.4 },
      { inst: 'pluck', chord: '..5...5...5...5.', oct: 4, vol: 0.4 },
      { inst: 'brass', vol: 0.85, seq: [
        'A4 . C#5 E5 A5 - E5 .', 'F#5 - E5 D5 E5 - F#5 .', 'E5 - D5 C#5 B4 - G#4 .', 'A4 - - - C#5 . E5 .',
        'F#5 - E5 C#5 E5 - A5 .', 'F#5 - - E5 D5 - C#5 .', 'B4 - C#5 D5 E5 - G#4 B4', 'A4 - - - E4 . A4 .'] },
      { inst: 'bell', vol: 0.55, seq: [E8, E8, E8, '. . . . . . A5 .', 'C#5 . . . A4 . . .', 'D5 . . . A4 . . .', 'E5 . . . D5 . . .', 'C#5 . E5 . A5 . . .'] }
    ]
  },
  /* 廟口：宋江陣鼓陣放克（G Dorian 108） */
  temple: {
    bpm: 108, swing: 0.1,
    chords: ['Gm7', 'C7', 'Gm7', 'C7', 'Bbmaj7', 'F', 'Am7', 'Dm7'],
    tracks: [
      { inst: 'crash', pat: ['X...............', R16, R16, R16, R16, R16, R16, R16], vol: 0.6 },
      { inst: 'kick', pat: ['x..x..x...x..x..', 'x..x..x...x.x...'], vol: 0.85 },
      { inst: 'snare', pat: '....x.......x..o', vol: 0.6 },
      { inst: 'hat', pat: 'x.o.x.o.x.o.x.oo', vol: 0.55 },
      { inst: 'tom', pitch: 150, pat: ['..x...x.....x.x.', '..x...x...x.x.x.'], vol: 0.5 },
      { inst: 'tom', pitch: 90, pat: [R16, R16, R16, 'x...x.......X...', R16, R16, R16, 'X.x.X.x.x.x.XXXX'], vol: 0.65 },
      { inst: 'sub', chord: ['R..R..5.R..8.R..', 'R..R..5.R.7.8...'], vol: 0.9 },
      { inst: 'pluck', chord: '.R.5..R..3.R.5.7', oct: 4, vol: 0.45 },
      { inst: 'brass', vol: 0.8, seq: [
        'G4 . Bb4 C5 D5 . F5 D5', 'E5 . D5 C5 Bb4 . G4 .', 'G4 . Bb4 C5 D5 . G5 F5', 'E5 - - . C5 . D5 .',
        'F5 . D5 F5 A5 - F5 .', 'C5 . A4 C5 F5 . E5 D5', 'E5 . C5 E5 G5 - E5 .', 'F5 - E5 D5 C5 . A4 .'] },
      ...layersOf(16)
    ]
  },
  /* 夜市：霓虹夜市 boogie（B 小調 116） */
  market: {
    bpm: 116, swing: 0.06,
    chords: ['Bm7', 'Em7', 'A', 'Dmaj7', 'Gmaj7', 'F#m7', 'Em7', 'F#7'],
    tracks: [
      { inst: 'kick', pat: 'x...x...x...x...', vol: 0.8 },
      { inst: 'clap', pat: '....x.......x...', vol: 0.7 },
      { inst: 'ohat', pat: '..x...x...x...x.', vol: 0.55 },
      { inst: 'bass', chord: ['R.8.R.8..R.8R.8.', 'R.8.R.8.R.8.5.7.'], vol: 0.75 },
      { inst: 'organ', chord: 'hold', rate: 8, oct: 4, vol: 0.4 },
      { inst: 'pluck', arp: 'up', rate: 2, oct: 4, vol: 0.3 },
      { inst: 'chip', vol: 0.95, seq: [
        'F#5 . . D5 E5 F#5 . A5', 'G5 - F#5 E5 D5 . B4 .', 'C#5 . E5 . A5 - G5 F#5', 'F#5 - - - E5 . D5 .',
        'B4 . D5 . F#5 - G5 .', 'A5 - F#5 . E5 . C#5 .', 'D5 . E5 . G5 . B5 .', 'A5 - - - F#5 E5 C#5 .'] },
      { inst: 'bell', vol: 0.5, seq: [E8, E8, E8, '. . . . . . A5 F#5', E8, E8, E8, '. . . . . . . A4'] },
      ...layersOf(16)
    ]
  },
  /* 老街：人力車民謠 shuffle（C 五聲 100） */

function SFX(name, o, gap) {

  S.play(name, { vol: op.vol == null ? 1 : op.vol, pitch, pan: op.pan || 0 });

    x.fillStyle = '#e8322a'; x.font = '900 18px ' + FONT; x.textAlign = 'center'; x.textBaseline = 'middle'; x.fillText('福', 0, -16);
    x.restore();
    x.save(); x.translate(95, 70); drawHero(x, hero, 0, 1, 34); x.restore();
  } else if (kind === 'scared') {
    x.save(); x.translate(38, 58); drawNian(x, 1, 2, 0, 46, 1); x.restore();
    x.save(); x.translate(86, 64); drawHero(x, hero, 1, 0, 44); x.restore();
    x.fillStyle = '#8fd8ff'; x.beginPath(); x.moveTo(104, 26); x.quadraticCurveTo(110, 36, 104, 40); x.quadraticCurveTo(98, 36, 104, 26); x.fill();
  } else if (kind === 'cheer') {
    for (let k = 0; k < 3; k++) { x.save(); x.translate(24 + k * 36, 64 - (k % 2) * 6); drawHero(x, (hero + k + 1) % 4, 0, k % 2 + 1, 34); x.restore(); }
  } else {
    x.save(); x.translate(44, 58); drawHero(x, hero, 0, 1, 50); x.restore();
    x.save(); x.translate(96, 66); drawNian(x, 0, 2, 0, 34, 2); x.restore();
    starPath(x, 92, 20, 9, 4, 5); x.fillStyle = '#ffcf3a'; x.fill();
  }
}

/* ---------- 暫停 ---------- */
function pauseGame() {
  if (G.screen !== 'play') return;
  G.screen = 'pause'; fuseSound(0);
  if (M) M.pause();
  $('pInfo').textContent = G.mode === 'story' ? WORLDS[G.world].name + '・' + (G.stage === 4 ? '魔王關' : '第 ' + (G.stage + 1) + ' 關') : '對戰・第 ' + G.round + ' 回合';
  showScr('pause');
  SFX('back');
}
function resumeGame() {
  if (G.screen !== 'pause') return;
  G.screen = 'play'; showScr(null);
  for (const s of L.stick) { s.id = -1; s.dir = -1; }
  for (const b of L.ctrl) { b.id = -1; b.down = false; }
  for (const k in keys) keys[k] = false; keyOrder.length = 0;
  if (M) M.resume();
  last = performance.now();
  SFX('select');
}
$('pauseBtn').addEventListener('click', () => pauseGame());
$('pResume').addEventListener('click', () => resumeGame());
$('pRestart').addEventListener('click', () => { if (M) M.resume(); SFX('select'); if (G.mode === 'story') startStage(G.world, G.stage); else startBattle(); });
$('pQuit').addEventListener('click', () => { if (M) M.resume(); SFX('back'); if (G.mode === 'story') showMap(G.world); else showTitle(); });
document.addEventListener('visibilitychange', () => { if (document.hidden && G.screen === 'play') pauseGame(); });

/* ---------- 標題 ---------- */
function showTitle() {
  G.screen = 'title'; fuseSound(0);
  showScr('title');
  playSong('title');
  buildChars();
  $('tinfo').textContent = TOUCH ? '左邊搖桿走路・右邊按「放鞭炮」' : '方向鍵／WASD 走路・空白鍵 放鞭炮・P 暫停';
}
function buildChars() {
  const box = $('chars'); box.innerHTML = '';
  HEROES.forEach((h, k) => {
    const b = document.createElement('button'); b.className = 'chr' + (k === save.hero ? ' on' : ''); b.setAttribute('aria-label', h.name);
    const c = document.createElement('canvas'); c.width = 140; c.height = 140; b.appendChild(c);
    const x = c.getContext('2d'); x.setTransform(2, 0, 0, 2, 0, 0); x.translate(35, 37); drawHero(x, k, 0, 0, 54);
    const s = document.createElement('span'); s.textContent = h.name; b.appendChild(s);
    b.addEventListener('click', () => { save.hero = k; saveGame(); SFX('select', { pitch: 1 + k * 0.08, exact: true }); buildChars(); });
    box.appendChild(b);
  });
}
$('btnStory').addEventListener('click', () => { SFX('select'); showMap(Math.min(4, Math.floor(save.unlocked / 5))); });
$('btnBattle').addEventListener('click', () => { SFX('select'); showBattleSetup(); });

/* ---------- 關卡地圖 ---------- */
let mapWorld = 0;
function showMap(w) {
  G.screen = 'map'; mapWorld = Math.max(0, Math.min(unlockedWorlds() - 1, w));
  showScr('map'); playSong('title'); renderMap();
}
function renderMap() {
  const w = mapWorld, Wd = WORLDS[w];
  $('mName').innerHTML = '第 ' + (w + 1) + ' 區・' + Wd.name + '<small>' + Wd.sub + '</small>';
  $('mPrev').disabled = w <= 0; $('mNext').disabled = w >= unlockedWorlds() - 1;
  const board = $('mBoard');
  board.querySelectorAll('.node').forEach(n => n.remove());
  requestAnimationFrame(() => drawMapCanvas(w));
  let cur = -1;
  for (let s = 0; s < 5; s++) {
    const id = w * 5 + s, open = id <= save.unlocked, st = save.stars[id] || 0;
    if (open && cur < 0 && !(id in save.stars)) cur = s;
    const b = document.createElement('button');
    b.className = 'node' + (s === 4 ? ' boss' : '') + (open ? '' : ' lock');
    b.style.left = NODE_POS[s][0] + '%'; b.style.top = NODE_POS[s][1] + '%';
    b.innerHTML = (s === 4 ? '魔王' : (s + 1)) + (open ? '<span class="ns">' + [0, 1, 2].map(k => '<svg style="opacity:' + (k < st ? 1 : 0.25) + '"><use href="#i-star"/></svg>').join('') + '</span>' : '<small>還沒開</small>');
    b.setAttribute('aria-label', (s === 4 ? '魔王關' : '第 ' + (s + 1) + ' 關') + (open ? '' : '（還沒開放）'));
    if (s === 3) b.title = '守歲夜（撐到時間結束）';
    b.addEventListener('click', () => { if (!open) { SFX('error'); return; } SFX('select'); startStage(w, s); });
    board.appendChild(b);
    if (s === cur) b.classList.add('cur');
  }
  $('mStars').innerHTML = '<svg class="st"><use href="#i-star"/></svg> ' + totalStars() + ' / 75';
}
$('mPrev').addEventListener('click', () => { if (mapWorld > 0) { mapWorld--; SFX('ui'); renderMap(); } });
$('mNext').addEventListener('click', () => { if (mapWorld < unlockedWorlds() - 1) { mapWorld++; SFX('ui'); renderMap(); } });
$('mBack').addEventListener('click', () => { SFX('back'); showTitle(); });

/* ---------- 對戰設定 ---------- */
function showBattleSetup() {
  G.screen = 'battleSetup'; showScr('battle'); playSong('title');
  const ar = $('bArena'); ar.innerHTML = '';
  for (let w = 0; w < unlockedWorlds(); w++) { const b = document.createElement('button'); b.dataset.v = w; b.textContent = WORLDS[w].name; ar.appendChild(b); }
  if (save.bArena >= unlockedWorlds()) save.bArena = 0;
  paintSetup();
}
function paintSetup() {
  const seg = (id, v) => $(id).querySelectorAll('button').forEach(b => b.classList.toggle('on', +b.dataset.v === v));
  const ok2 = twoPAllowed();
  if (!ok2) save.b2p = 0;
  seg('bNum', save.bNum); seg('bDiff', save.bDiff); seg('b2p', save.b2p); seg('bArena', save.bArena);
  $('b2p').querySelector('[data-v="1"]').disabled = !ok2;
  $('bWins').textContent = save.bWins ? '你已經拿過 ' + save.bWins + ' 次冠軍！' : '先贏 2 回合就是冠軍';
  $('b2note').textContent = !ok2 ? '雙人要用鍵盤，或把手機轉成橫的（左右各一組按鈕）' : TOUCH ? '雙人：左邊是 P1、右邊是 P2（也可以用鍵盤）' : '雙人：P1 WASD + 空白鍵，P2 方向鍵 + Enter';
}
['bNum', 'bDiff', 'b2p', 'bArena'].forEach(id => $(id).addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b || b.disabled) return;
  const key = { bNum: 'bNum', bDiff: 'bDiff', b2p: 'b2p', bArena: 'bArena' }[id];
  save[key] = +b.dataset.v; saveGame(); SFX('ui'); paintSetup();
}));
$('bGo').addEventListener('click', () => { SFX('select'); startBattle(); });
$('bBack').addEventListener('click', () => { SFX('back'); showTitle(); });

/* ================= 更新 ================= */
function updatePlayer(p, dt) {
  if (!p.alive) { p.outT += dt; return; }
  if (p.inv > 0) p.inv -= dt; if (p.sq > 0) p.sq -= dt; if (p.hic > 0) p.hic -= dt; if (p.dragonCd > 0) p.dragonCd -= dt;
  if (p.cpu && G.countdown <= 0 && !G.ended) updateAI(p, dt);
  const I = p.inp;
  let moved = 0;
  if (I.dir >= 0 && !G.ended && G.countdown <= 0) {
    const dist = pSpeed(p) * dt;
    const ox = p.x, oy = p.y;
    moved = stepMove(p, I.dir, dist);
    p.dir = I.dir;
    if (!moved && I.alt >= 0) { moved = stepMove(p, I.alt, dist); if (moved) p.dir = I.alt; }
    if (moved) { p.moved += Math.abs(p.x - ox) + Math.abs(p.y - oy); }
  }
  p.moving = !!moved;
  if (moved) {
    p.walkT += dt; p.stepT -= dt;
    if (p.stepT <= 0) { p.stepT = 0.25; if (!p.cpu) SFXat('nb_step', p.x, { vol: 0.9 }, 0); if (G.goo[idx(p.x | 0, p.y | 0)] > 0) dust(p.x, p.y + 0.35); }
  }
  pickup(p);
  const ti = idx(p.x | 0, p.y | 0);
  if (G.fireT[ti] > 0.05) hurt(p, 'fire');
  if (G.tut === 0 && p.moved > 1.6) tutStep(1);
  if (G.mode === 'story' && G.gateOpen && ti === G.gate && !G.ended) { G.ended = true; G.endT = 0.7; G.endWin = true; SFX('nb_gate', { pitch: 1.3 }); burst(p.x, p.y, 20, 4, 1.2); p.alive = false; p.outT = 0; }
}
let dTimer = 0;
function update(dt) {
  G.frame++;
  for (const f of FLOATS) if (f.on) { f.t += dt; if (f.t >= f.life) f.on = false; }
  for (const q of RINGS) if (q.on) { q.t += dt; if (q.t > 0.5) q.on = false; }
  updateParticles(dt);
  if (G.hintT > 0 && G.hintT < 90) G.hintT -= dt;
  if (G.bannerT > 0) G.bannerT -= dt;
  if (G.shake > 0) G.shake = Math.max(0, G.shake - dt * 1.6);
  if (G.countdown > 0) { const was = G.countdown; G.countdown -= dt; if (was > 0.6 && G.countdown <= 0.6) SFX('go'); for (const p of G.players) p.inp.dir = -1; }
  if (!G.ended && G.countdown <= 0) G.time += dt;
  popsThisFrame = 0;
  gatherInput();
  for (const p of G.players) updatePlayer(p, dt);
  updateBombs(dt);
  updateTiles(dt);
  dTimer -= dt;
  if (dTimer <= 0) { dTimer = 0.12; if (G.mode === 'battle' && G.dangerFrame !== G.frame) { computeDanger(G.danger, null); G.dangerFrame = G.frame; } if (G.mode === 'story') { computeDanger(G.danger, null); G.dangerFrame = G.frame; const P = G.players[0]; if (P && P.alive) distField(P.x | 0, P.y | 0, (x, y) => openTile(x, y) && G.bombAt[idx(x, y)] < 0); } }
  if (G.countdown <= 0) { updateEnemies(dt); updateBoss(dt); }
  updateDragon(dt);
  if (popsThisFrame) {
    const p = 1 + Math.min(8, G.chain - 1) * 0.045;
    if (popsThisFrame >= 2 || G.chain >= 4) SFXat('nb_bigpop', popX, { pitch: p, exact: true }, 70); else SFXat('nb_pop', popX, { pitch: p }, 45);
    if (G.chain >= 2) SFXat('nb_chain', popX, { pitch: 1 + Math.min(10, G.chain) * 0.07, exact: true }, 60);
    if (G.chain === 3) addFloat(popX + 0.5, 1.5, '連環炮！', '#ffcf3a', 1);
  }
  if (G.chainT > 0) { G.chainT -= dt; if (G.chainT <= 0) G.chain = 0; }
  if (G.chain >= 3) G.hypeT = Math.max(G.hypeT, 4);
  if (G.hypeT > 0) G.hypeT -= dt;
  setLayer('hype', G.hypeT > 0 || !!G.dragon);
  // 緊張層：鞭炮快炸到自己、只剩一顆心
  const P = G.players[0];
  if (P && P.alive) {
    const dz = G.danger[idx(P.x | 0, P.y | 0)];
    setLayer('danger', dz < 1.4 || (G.mode === 'story' && P.hearts === 1) || (G.boss && G.boss.st === 'aim'));
  } else setLayer('danger', false);
  if (G.mode === 'story') {
    if (G.guard && !G.ended && G.countdown <= 0) {
      if (G.guardT > 0) {
        G.guardT -= dt; G.spawnT -= dt;
        let alive = 0; for (const e of G.enemies) if (e.on && e.st < 2) alive++;
        if (G.spawnT <= 0 && alive < G.guardMax) {
          G.spawnT = Math.max(1.8, 3.6 - G.world * 0.3);
          const hs = G.holes.filter(h => !(Math.abs(P.x - h[0] - 0.5) < 2.5 && Math.abs(P.y - h[1] - 0.5) < 2.5) && G.bombAt[idx(h[0], h[1])] < 0 && G.fireT[idx(h[0], h[1])] <= 0);
          if (hs.length) { const h = KG.pick(hs); const e = spawnEnemy(KG.pick(G.spawnPool), h[0], h[1], 0); if (e) { e.inv = 0.8; SFXat('nb_spawn', h[0]); burst(h[0] + 0.5, h[1] + 0.5, 6, 2, 0.6); } }
        }
        if (G.guardT <= 0) { G.guardT = 0; for (const e of G.enemies) if (e.on && e.st < 2) { e.st = 2; e.tm = 0; } G.enemiesLeft = 0; openGate(); }
      }
      setTempo(G.guardT < 15 && G.guardT > 0 ? 1.08 : 1);
    }
    if (G.ended) { G.endT -= dt; if (G.endT <= 0 && G.screen === 'play') finishStage(G.endWin); }
  } else {
    if (!G.sudden && G.time >= G.roundTime && G.countdown <= 0) { G.sudden = true; showHint('紅布掉下來了！快往中間跑！', 3); SFX('nb_warn'); setTempo(1.1); }
    if (G.time >= G.roundTime - 20 && !G.sudden) setTempo(1.05);
    updateSudden(dt);
    battleCheck(dt);
  }
}

/* ================= 主迴圈 ================= */
let last = performance.now();
const T0 = last;
const perf = { n: 0, sum: 0, max: 0, on: false };
function frame(now) {
  requestAnimationFrame(frame);
  let dt = (now - last) / 1000; last = now;
  if (dt > 0.05) dt = 0.05; if (dt < 0) dt = 0;
  const t0 = performance.now();
  if (G.screen === 'play') { if (dt > 0.034) { update(dt / 2); update(dt / 2); } else update(dt); }
  else if (G.screen === 'title' || G.screen === 'map' || G.screen === 'battleSetup') updateParticles(dt);
  const t1 = performance.now();
  if (!document.hidden) draw((now - T0) / 1000);
  if (perf.on) { const t2 = performance.now(), d = t2 - t0; perf.n++; perf.sum += d; if (d > perf.max) { perf.max = d; perf.maxU = t1 - t0; perf.maxD = t2 - t1; } }
}
let rzPend = false;
function onResize() { if (rzPend) return; rzPend = true; requestAnimationFrame(() => { rzPend = false; resize(); if (G.screen === 'map') drawMapCanvas(mapWorld); if (G.screen === 'battleSetup') paintSetup(); }); }
addEventListener('resize', onResize);
addEventListener('orientationchange', onResize);
if (window.visualViewport) visualViewport.addEventListener('resize', onResize);
resize();
showTitle();
requestAnimationFrame(frame);
const READY_MS = performance.now();

/* ================= 測試掛鉤 ================= */
window.__nb = {
  G, L, save, perf, SONGS, ready: () => READY_MS,
  state: () => ({ screen: G.screen, mode: G.mode, world: G.world, stage: G.stage, left: G.enemiesLeft, time: +G.time.toFixed(2), gate: G.gateOpen,
    p: G.players.map(p => ({ x: +p.x.toFixed(2), y: +p.y.toFixed(2), alive: p.alive, hearts: p.hearts, wins: p.wins, bombs: p.bombsMax, fire: p.fire, kick: p.kick, hb: p.hb, cpu: !!p.cpu })),
    bombs: G.bombs.filter(b => b.on).length, boss: G.boss ? { st: G.boss.st, hp: G.boss.hp } : null, music: M ? M.isPlaying() : null, W: G.W, H: G.H, T: L.T, touch: TOUCH, particles: pN }),
  go: (w, s) => startStage(w, s),
  battle: (o) => { Object.assign(save, o || {}); startBattle(); },
  unlockAll: () => { save.unlocked = 24; saveGame(); },
  ff: (sec) => { const n = Math.round(sec * 60); for (let k = 0; k < n; k++) update(1 / 60); },
  give: (id, pi) => { const p = G.players[pi || 0]; G.item[idx(p.x | 0, p.y | 0)] = id; G.itemT[idx(p.x | 0, p.y | 0)] = 1; G.grid[idx(p.x | 0, p.y | 0)] = 0; pickup(p); },
  tp: (x, y, pi) => { const p = G.players[pi || 0]; p.x = x + 0.5; p.y = y + 0.5; },
  scareAll: () => { for (const e of G.enemies) if (e.on && e.st < 2) scareEnemy(e, 0); },
  toGate: () => { const p = G.players[0]; p.x = G.gate % G.W + 0.5; p.y = ((G.gate / G.W) | 0) + 0.5; },
  dizzy: () => { if (G.boss) { G.boss.cx = Math.round(G.boss.x - 0.5); G.boss.cy = Math.round(G.boss.y - 0.5); G.boss.tx = G.boss.cx; G.boss.ty = G.boss.cy; G.boss.prog = 0; bossStun(G.boss); } },
  bossHit: () => { if (G.boss) bossHit(G.boss); },
  hurt: () => { const p = G.players[0]; p.inv = 0; hurt(p, 'test'); },
  noCountdown: () => { G.countdown = 0; },
  /* 大連鎖：清掉一塊區域、放滿鞭炮 */
  chain: (fire) => {
    let n = 0; const p = G.players[0], cx = p.x | 0, cy = p.y | 0;
    for (let y = 1; y < G.H - 1; y++) for (let x = 1; x < G.W - 1; x++) {
      const i = idx(x, y); if (G.grid[i] === 1) continue; if (Math.abs(x - cx) + Math.abs(y - cy) < 3) continue;
      if ((x + y) % 2) continue;
      G.grid[i] = 0; G.item[i] = -1;
      for (const B of G.bombs) if (!B.on) { Object.assign(B, { on: true, x, y, t: 0.5 + n * 0.002, fire: fire || 3, owner: null, kind: 0, remote: false, sticky: false, pass: 0, vx: 0, vy: 0, prog: 0, age: 0 }); G.bombAt[i] = B.i; n++; break; }
    }
    return n;
  },
  setDiff: (d) => { G.battleCfg.diff = d; },
  killOthers: () => { for (const q of G.players) if (q !== G.players[0]) { q.inv = 0; q.shield = 0; hurt(q, 'test'); } },
  endTime: () => { G.time = G.roundTime - 1; }
};
</script>
